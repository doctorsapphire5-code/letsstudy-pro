<body>

<div class="container">

  <div class="logo">
    <h1>Vorix Course</h1>
    <p>Learn. Build. Grow.</p>
  </div>

  <h2>Welcome Back</h2>
  <p class="subtitle">Sign in to continue your learning journey.</p>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required="">

    <label for="password">Password</label>
    <div class="password-box">
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required="">
      <button type="button" class="toggle" id="togglePassword">
        Show
      </button>
    </div>

    <a href="course-forgot-password.html" class="forgot">
      Forgot password?
    </a>

    <button type="submit" id="loginBtn">
      Sign In
    </button>

  </form>

  <div class="links">
    Don't have an account?
    <a href="course-register.html">Create Account</a>
    <br>
    <a href="index.html">Back to Home</a>
  </div>

  <div class="footer">
    Secure authentication powered by Vorix Course
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// FIREBASE CONFIGURATION
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

function showMessage(text, type="error"){
  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";
}

function hideMessage(){
  message.style.display = "none";
}

function friendlyError(error){
  switch(error.code){
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found":
      return "Incorrect email or password.";
    case "auth/invalid-email":
      return "Please enter a valid email address.";
    case "auth/user-disabled":
      return "This account has been disabled.";
    case "auth/too-many-requests":
      return "Too many attempts. Please try again later.";
    case "auth/network-request-failed":
      return "Network error. Check your internet connection.";
    default:
      return "Login failed. Please try again.";
  }
}

// SHOW / HIDE PASSWORD
document.getElementById("togglePassword").addEventListener("click",()=>{
  const password = document.getElementById("password");
  const btn = document.getElementById("togglePassword");

  if(password.type === "password"){
    password.type = "text";
    btn.textContent = "Hide";
  }else{
    password.type = "password";
    btn.textContent = "Show";
  }
});

// LOGIN
form.addEventListener("submit",async(e)=>{
  e.preventDefault();
  hideMessage();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  loginBtn.disabled = true;
  loginBtn.textContent = "Signing In...";

  try{
    const credential = await signInWithEmailAndPassword(
      auth,email,password
    );

    const user = credential.user;
    const userRef = doc(db,"users",user.uid);
    const userSnap = await getDoc(userRef);

    if(!userSnap.exists()){
      await auth.signOut();
      showMessage("User profile was not found. Please register again.");
      return;
    }

    const userData = userSnap.data();

    if(userData.status === "suspended" ||
       userData.status === "banned" ||
       userData.status === "disabled"){
      await auth.signOut();
      showMessage("Your account is restricted. Contact support.");
      return;
    }

    await updateDoc(userRef,{
      lastLoginAt: serverTimestamp(),
      loginCount: increment(1),
      updatedAt: serverTimestamp(),
      emailVerified: user.emailVerified
    });

    showMessage("Login successful. Redirecting...","success");

    const redirect = new URLSearchParams(location.search)
      .get("redirect");

    setTimeout(()=>{
      location.href = redirect || "course-dashboard.html";
    },700);

  }catch(error){
    console.error(error);
    showMessage(friendlyError(error));
  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";
  }
});

// FORGOT PASSWORD
document.querySelector(".forgot").addEventListener("click",async(e)=>{
  e.preventDefault();

  const email = document.getElementById("email").value.trim();

  if(!email){
    showMessage("Enter your email address first.");
    document.getElementById("email").focus();
    return;
  }

  try{
    await sendPasswordResetEmail(auth,email);
    showMessage(
      "If an account exists for this email, a password reset link has been sent.",
      "success"
    );
  }catch(error){
    console.error(error);
    showMessage("Unable to send reset email. Please try again.");
  }
});

// REDIRECT IF ALREADY LOGGED IN
onAuthStateChanged(auth,(user)=>{
  if(user){
    location.href = "course-dashboard.html";
  }
});

</script>
