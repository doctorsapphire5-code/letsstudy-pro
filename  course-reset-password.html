<body>

  <main class="container">

    <div class="logo">🔐</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
      Create a new password and securely access your Vorix Course account.
    </p>

    <div id="loadingMessage" class="message success">
      Verifying password reset link...
    </div>

    <div id="resetSection" class="hidden">

      <div class="email-box">
        Account email: <strong id="accountEmail">Verifying...</strong>
      </div>

      <form id="resetForm">

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" minlength="8" autocomplete="new-password" required="">

        <p class="hint">Use at least 8 characters.</p>

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="8" autocomplete="new-password" required="">

        <button type="submit" id="resetButton">
          Update Password
        </button>

      </form>
    </div>

    <div id="message" class="message"></div>

    <a href="course-login.html" class="link">
      Back to Login
    </a>

    <div class="footer">
      Vorix Course · Secure Authentication
    </div>

  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    // Vorix Course Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDaJ0LKede-fzMTZl-V1SxZ4Ps0IETepE",
      authDomain: "vorix-course.firebaseapp.com",
      projectId: "vorix-course",
      storageBucket: "vorix-course.firebasestorage.app",
      messagingSenderId: "277814413742",
      appId: "1:277814413742:web:fb4515f03591ea07c7603f",
      measurementId: "G-SQ6PN704M7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);

    const mode = params.get("mode");
    const oobCode = params.get("oobCode");

    const loadingMessage =
      document.getElementById("loadingMessage");

    const resetSection =
      document.getElementById("resetSection");

    const accountEmail =
      document.getElementById("accountEmail");

    const resetForm =
      document.getElementById("resetForm");

    const resetButton =
      document.getElementById("resetButton");

    const messageBox =
      document.getElementById("message");

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    function firebaseError(error) {
      const messages = {
        "auth/expired-action-code":
          "This reset link has expired. Request a new password reset email.",
        "auth/invalid-action-code":
          "This reset link is invalid or has already been used.",
        "auth/user-disabled":
          "This account has been disabled.",
        "auth/user-not-found":
          "No account was found for this reset link.",
        "auth/weak-password":
          "Your password is too weak. Choose a stronger password.",
        "auth/too-many-requests":
          "Too many attempts. Please try again later."
      };

      return messages[error.code] ||
        "Something went wrong. Please request a new reset link.";
    }

    // Verify reset link
    async function verifyResetLink() {
      if (mode !== "resetPassword" || !oobCode) {
        loadingMessage.classList.add("hidden");

        showMessage(
          "Invalid reset link. Request a new password reset email.",
          "error"
        );

        return;
      }

      try {
        const email =
          await verifyPasswordResetCode(auth, oobCode);

        accountEmail.textContent = email;

        loadingMessage.classList.add("hidden");
        resetSection.classList.remove("hidden");

      } catch (error) {
        loadingMessage.classList.add("hidden");

        showMessage(firebaseError(error), "error");
      }
    }

    // Update password
    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const newPassword =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (newPassword.length < 8) {
        showMessage(
          "Password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage(
          "The passwords do not match.",
          "error"
        );
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Updating Password...";

      try {
        await confirmPasswordReset(
          auth,
          oobCode,
          newPassword
        );

        resetForm.classList.add("hidden");

        showMessage(
          "Password updated successfully. You can now log in using your new password.",
          "success"
        );

        resetButton.textContent = "Password Updated";

      } catch (error) {
        showMessage(firebaseError(error), "error");

        resetButton.disabled = false;
        resetButton.textContent = "Update Password";
      }
    });

    verifyResetLink();
  </script>
