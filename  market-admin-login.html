<body>

  <main class="login-card">

    <div class="brand">
      <div class="brand-icon">V</div>
      <h1>Vorix Market</h1>
      <p>Administrator Portal</p>
    </div>

    <h2>Admin Login</h2>

    <p class="description">
      Sign in to access your Vorix Market administration dashboard.
    </p>

    <div id="message" class="message" role="alert"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="adminId">Admin ID</label>
        <input type="text" id="adminId" placeholder="Enter your Admin ID" autocomplete="username" required="">
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrap">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required="">

          <button type="button" class="toggle" id="togglePassword">Show</button>
        </div>
      </div>

      <a class="forgot" href="market-admin-forgot-password.html">
        Forgot Password?
      </a>

      <button type="submit" class="submit-btn" id="loginButton">
        Sign In
      </button>

    </form>

    <div class="register-link">
      Don't have an admin account?
      <a href="market-admin-register.html">Create Account</a>
    </div>

    <div class="footer">
      © <span id="year"></span> Vorix Market. All rights reserved.
    </div>

  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBTMnT-PhJ44Hamu2EHyqnbP5EBoiFwGqY",
      authDomain: "vorix-market.firebaseapp.com",
      databaseURL: "https://vorix-market-default-rtdb.firebaseio.com",
      projectId: "vorix-market",
      storageBucket: "vorix-market.firebasestorage.app",
      messagingSenderId: "686555609094",
      appId: "1:686555609094:web:61f3e1853c0fca143a2b87",
      measurementId: "G-2KNWRG4X08"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    const $ = id => document.getElementById(id);

    $("year").textContent = new Date().getFullYear();

    function showMessage(text, type) {
      const box = $("message");
      box.textContent = text;
      box.className = "message " + type;
    }

    function clearMessage() {
      $("message").textContent = "";
      $("message").className = "message";
    }

    // Show / Hide password
    $("togglePassword").addEventListener("click", function() {
      const password = $("password");

      if (password.type === "password") {
        password.type = "text";
        this.textContent = "Hide";
      } else {
        password.type = "password";
        this.textContent = "Show";
      }
    });

    // Prevent old admin session from being reused
    sessionStorage.removeItem("adminId");

    // Login
    $("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      clearMessage();

      const adminId = $("adminId").value.trim();
      const password = $("password").value;
      const button = $("loginButton");

      if (!adminId || !password) {
        showMessage(
          "Please enter your Admin ID and password.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Signing In...";

      let authenticatedUser = null;

      try {
        /*
          Admin ID identifies the admin document.
          Firebase Authentication signs in using the email stored
          in the matching admins/{adminId} document.
        */

        const adminRef = db.collection("admins").doc(adminId);
        const adminSnap = await adminRef.get();

        if (!adminSnap.exists) {
          throw new Error("ADMIN_NOT_FOUND");
        }

        const admin = adminSnap.data();

        if (admin.adminId !== adminId) {
          throw new Error("INVALID_ADMIN_ID");
        }

        if (!admin.email || !admin.emailVerified) {
          throw new Error("ADMIN_EMAIL_NOT_READY");
        }

        if (admin.status !== "active") {
          throw new Error("ADMIN_NOT_ACTIVE");
        }

        if (admin.role !== "admin") {
          throw new Error("INVALID_ADMIN_ROLE");
        }

        // Firebase Authentication login
        const credential = await auth.signInWithEmailAndPassword(
          admin.email,
          password
        );

        authenticatedUser = credential.user;

        // Validate authenticated account against admin record
        if (admin.uid && admin.uid !== authenticatedUser.uid) {
          await auth.signOut();
          throw new Error("ADMIN_UID_MISMATCH");
        }

        if (
          authenticatedUser.email &&
          authenticatedUser.email.toLowerCase() !== admin.email.toLowerCase()
        ) {
          await auth.signOut();
          throw new Error("ADMIN_EMAIL_MISMATCH");
        }

        // Save admin session
        sessionStorage.setItem("adminId", adminId);

        // Update admin login activity
        await adminRef.update({
          uid: authenticatedUser.uid,
          lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastLoginDevice: navigator.userAgent,
          loginCount: firebase.firestore.FieldValue.increment(1),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showMessage("Login successful. Redirecting...", "success");

        window.location.replace("market-admin-dashboard.html");

      } catch (error) {
        console.error("Admin login error:", error);

        if (authenticatedUser && auth.currentUser) {
          try {
            await auth.signOut();
          } catch (signOutError) {
            console.error(signOutError);
          }
        }

        sessionStorage.removeItem("adminId");

        let message = "Unable to sign in. Please check your details.";

        switch (error.message || error.code) {
          case "ADMIN_NOT_FOUND":
            message = "Invalid Admin ID or password.";
            break;

          case "INVALID_ADMIN_ID":
            message = "Invalid administrator identification.";
            break;

          case "ADMIN_EMAIL_NOT_READY":
            message = "Administrator email is not configured or verified.";
            break;

          case "ADMIN_NOT_ACTIVE":
            message = "Your administrator account is not active. Contact support.";
            break;

          case "INVALID_ADMIN_ROLE":
            message = "This account does not have administrator access.";
            break;

          case "ADMIN_UID_MISMATCH":
            message = "This administrator account is linked to a different login.";
            break;

          case "ADMIN_EMAIL_MISMATCH":
            message = "Your administrator account email does not match.";
            break;

          case "auth/invalid-credential":
          case "auth/wrong-password":
          case "auth/user-not-found":
          case "auth/invalid-email":
            message = "Invalid Admin ID or password.";
            break;

          case "auth/too-many-requests":
            message = "Too many login attempts. Please try again later.";
            break;

          case "auth/network-request-failed":
            message = "Network error. Check your internet connection.";
            break;

          case "permission-denied":
          case "firestore/permission-denied":
            message = "Access denied. Check your Firestore security rules.";
            break;
        }

        showMessage(message, "error");

      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });

  </script>
