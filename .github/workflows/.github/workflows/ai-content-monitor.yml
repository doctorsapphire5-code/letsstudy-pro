name: LetsStudy Pro - AI Content Monitor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-content-monitor:
    name: AI Content Monitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Monitor AI Content
        shell: bash
        run: |
          set +e

          python3 <<'PY'
          import os
          import re
          import json
          import hashlib
          from html.parser import HTMLParser

          ROOT = os.getcwd()

          class ContentParser(HTMLParser):
              def __init__(self):
                  super().__init__()

                  self.title = ""
                  self.description = ""
                  self.body = []

                  self.in_title = False
                  self.in_script = False
                  self.in_style = False

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  attrs = dict(attrs)

                  if tag == "title":
                      self.in_title = True

                  elif tag == "script":
                      self.in_script = True

                  elif tag == "style":
                      self.in_style = True

                  elif tag == "meta":
                      name = (
                          attrs.get("name", "")
                          .strip()
                          .lower()
                      )

                      if name == "description":
                          self.description = (
                              attrs.get(
                                  "content",
                                  ""
                              ).strip()
                          )

              def handle_endtag(self, tag):
                  tag = tag.lower()

                  if tag == "title":
                      self.in_title = False

                  elif tag == "script":
                      self.in_script = False

                  elif tag == "style":
                      self.in_style = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title += " " + data

                  if (
                      not self.in_script
                      and not self.in_style
                  ):
                      self.body.append(data)

          def clean_text(text):
              return re.sub(
                  r"\s+",
                  " ",
                  text or ""
              ).strip()

          def words(text):
              return re.findall(
                  r"\b[\wÀ-ÿ'-]+\b",
                  text,
                  flags=re.UNICODE
              )

          def sentence_list(text):
              return [
                  s.strip()
                  for s in re.split(
                      r"[.!?]+",
                      text
                  )
                  if s.strip()
              ]

          def normalize(text):
              text = text.lower()
              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )
              return text.strip()

          html_files = []

          for filename in os.listdir(ROOT):
              if (
                  filename.endswith(".html")
                  and os.path.isfile(
                      os.path.join(
                          ROOT,
                          filename
                      )
                  )
              ):
                  html_files.append(filename)

          html_files.sort()

          # These are monitoring indicators,
          # NOT proof that AI generated the content.
          ai_markers = [
              "generated by ai",
              "written by ai",
              "ai generated",
              "ai-generated",
              "ai assisted",
              "ai-assisted",
              "created with ai",
              "powered by ai",
              "generated using ai",
              "written using artificial intelligence",
              "artificial intelligence generated",
              "chatgpt",
              "openai",
              "gemini",
              "claude",
              "copilot",
              "deepseek",
              "llm generated",
              "large language model"
          ]

          generic_ai_phrases = [
              "in today's rapidly changing world",
              "in the ever-evolving world",
              "it is important to note",
              "in conclusion",
              "let us delve into",
              "delve deeper",
              "unlock your potential",
              "seamless experience",
              "comprehensive solution",
              "whether you are a beginner",
              "in this article, we will explore",
              "in this guide, we will explore",
              "this comprehensive guide"
          ]

          pages = []

          for filename in html_files:
              path = os.path.join(
                  ROOT,
                  filename
              )

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:
                      source = f.read()

                  parser = ContentParser()
                  parser.feed(source)

                  title = clean_text(
                      parser.title
                  )

                  description = clean_text(
                      parser.description
                  )

                  body = clean_text(
                      " ".join(parser.body)
                  )

                  normalized_body = normalize(
                      body
                  )

                  word_list = words(body)
                  sentences = sentence_list(body)

                  found_markers = []

                  for marker in ai_markers:
                      if marker in normalized_body:
                          found_markers.append(marker)

                  found_phrases = []

                  for phrase in generic_ai_phrases:
                      if phrase in normalized_body:
                          found_phrases.append(phrase)

                  # Detect repeated sentence openings.
                  openings = {}

                  for sentence in sentences:
                      sentence_words = words(
                          sentence
                      )

                      if len(sentence_words) >= 4:
                          opening = " ".join(
                              sentence_words[:4]
                          ).lower()

                          openings[opening] = (
                              openings.get(
                                  opening,
                                  0
                              ) + 1
                          )

                  repeated_openings = {
                      opening: count
                      for opening, count
                      in openings.items()
                      if count >= 3
                  }

                  # Detect unusually repetitive text.
                  text_hash = ""

                  if len(normalized_body) >= 100:
                      text_hash = hashlib.sha256(
                          normalized_body.encode(
                              "utf-8"
                          )
                      ).hexdigest()

                  signals = []

                  if found_markers:
                      signals.append(
                          "Explicit AI-related marker"
                      )

                  if found_phrases:
                      signals.append(
                          "Generic AI-style phrase"
                      )

                  if repeated_openings:
                      signals.append(
                          "Repeated sentence openings"
                      )

                  # This score is a monitoring score,
                  # not an AI probability.
                  score = 0

                  if found_markers:
                      score += 60

                  if found_phrases:
                      score += min(
                          25,
                          len(found_phrases) * 5
                      )

                  if repeated_openings:
                      score += min(
                          15,
                          len(repeated_openings) * 5
                      )

                  score = min(
                      100,
                      score
                  )

                  if score >= 60:
                      status = "REVIEW"
                  elif score >= 25:
                      status = "CHECK"
                  else:
                      status = "NORMAL"

                  pages.append({
                      "page": filename,
                      "title": title,
                      "word_count": len(
                          word_list
                      ),
                      "sentence_count": len(
                          sentences
                      ),
                      "monitor_score": score,
                      "status": status,
                      "ai_markers": found_markers,
                      "generic_phrases": found_phrases,
                      "repeated_sentence_openings":
                          repeated_openings,
                      "content_hash": text_hash
                  })

              except Exception as e:
                  pages.append({
                      "page": filename,
                      "status": "ERROR",
                      "error": str(e)
                  })

          review_pages = [
              page for page in pages
              if page.get("status") == "REVIEW"
          ]

          check_pages = [
              page for page in pages
              if page.get("status") == "CHECK"
          ]

          normal_pages = [
              page for page in pages
              if page.get("status") == "NORMAL"
          ]

          report = {
              "website": "https://letsstudy.pro",
              "pages_checked": len(pages),
              "review_pages": len(
                  review_pages
              ),
              "check_pages": len(
                  check_pages
              ),
              "normal_pages": len(
                  normal_pages
              ),
              "important_note": (
                  "This report does not prove whether "
                  "content was generated by AI. "
                  "Signals are provided for human review."
              ),
              "pages": pages
          }

          with open(
              "ai-content-monitor-report.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              "ai-content-monitor-report.md",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "# LetsStudy Pro - AI Content Monitor\n\n"
              )

              f.write(
                  "> This report is a monitoring tool, "
                  "not an AI detector. Signals do not "
                  "prove that content was generated by AI.\n\n"
              )

              f.write("## Summary\n\n")

              f.write(
                  f"- Pages checked: {len(pages)}\n"
              )

              f.write(
                  f"- Review: {len(review_pages)}\n"
              )

              f.write(
                  f"- Check: {len(check_pages)}\n"
              )

              f.write(
                  f"- Normal: {len(normal_pages)}\n\n"
              )

              f.write("## Pages Requiring Review\n\n")

              if review_pages:
                  for page in review_pages:
                      f.write(
                          f"### `{page['page']}`\n\n"
                      )

                      f.write(
                          f"- Monitor score: "
                          f"{page.get('monitor_score', 0)}/100\n"
                      )

                      f.write(
                          f"- Words: "
                          f"{page.get('word_count', 0)}\n"
                      )

                      if page.get("ai_markers"):
                          f.write(
                              "- AI-related markers: "
                              + ", ".join(
                                  page["ai_markers"]
                              )
                              + "\n"
                          )

                      if page.get(
                          "generic_phrases"
                      ):
                          f.write(
                              "- Generic phrases: "
                              + ", ".join(
                                  page[
                                      "generic_phrases"
                                  ]
                              )
                              + "\n"
                          )

                      if page.get(
                          "repeated_sentence_openings"
                      ):
                          f.write(
                              "- Repeated openings detected.\n"
                          )

                      f.write(
                          "\n"
                      )
              else:
                  f.write(
                      "No pages require immediate review. ✅\n\n"
                  )

              f.write(
                  "## Pages To Check\n\n"
              )

              if check_pages:
                  for page in check_pages:
                      f.write(
                          f"- `{page['page']}` "
                          f"— score "
                          f"{page.get('monitor_score', 0)}/100\n"
                      )
              else:
                  f.write(
                      "No additional pages flagged. ✅\n"
                  )

              f.write("\n## Monitoring Rules\n\n")
              f.write(
                  "- Explicit AI-related wording is flagged.\n"
              )
              f.write(
                  "- Common generic phrases are flagged.\n"
              )
              f.write(
                  "- Repetitive sentence openings are flagged.\n"
              )
              f.write(
                  "- The monitor does not claim AI authorship.\n"
              )
              f.write(
                  "- Human review is recommended before "
                  "taking action.\n"
              )

          print("")
          print("======================================")
          print(" AI Content Monitor Completed")
          print("======================================")
          print(f"Pages checked: {len(pages)}")
          print(f"Review: {len(review_pages)}")
          print(f"Check: {len(check_pages)}")
          print(f"Normal: {len(normal_pages)}")
          print("")
          print(
              "This monitor does not prove AI authorship."
          )
          print(
              "Human review is recommended."
          )
          print(
              "This check is informational and will not fail."
          )
          PY

          exit 0

      - name: Upload AI Content Monitor Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-content-monitor-report
          path: |
            ai-content-monitor-report.json
            ai-content-monitor-report.md
          if-no-files-found: warn