name: Add LetsStudy Pro Favicon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  favicon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add favicon to HTML files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          favicon = '''<link rel="icon"
                type="image/png"
                sizes="16x16"
                href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEifaiw3YEiKbzM-I2pgAlSqAfMP2P82H3N8SeMnk96rL-v8NykWl4R9oT6nl4SUpRMXdsDt-lrxfhcuAgFPtWqs78xhU-sJoovCAR-iH8xVYm-ojofYwt2M-PTFV9pJqC1xv0yhwaTIo6f563koSkcFhPsNj0aGZnEJU9EgdWxVMIAUHbLNCd5OQxUZrYIN/s1600/apple-touch-icon.png">

          <link rel="icon"
                type="image/png"
                sizes="32x32"
                href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEifaiw3YEiKbzM-I2pgAlSqAfMP2P82H3N8SeMnk96rL-v8NykWl4R9oT6nl4SUpRMXdsDt-lrxfhcuAgFPtWqs78xhU-sJoovCAR-iH8xVYm-ojofYwt2M-PTFV9pJqC1xv0yhwaTIo6f563koSkcFhPsNj0aGZnEJU9EgdWxVMIAUHbLNCd5OQxUZrYIN/s1600/apple-touch-icon.png">

          <link rel="icon"
                type="image/png"
                sizes="48x48"
                href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEifaiw3YEiKbzM-I2pgAlSqAfMP2P82H3N8SeMnk96rL-v8NykWl4R9oT6nl4SUpRMXdsDt-lrxfhcuAgFPtWqs78xhU-sJoovCAR-iH8xVYm-ojofYwt2M-PTFV9pJqC1xv0yhwaTIo6f563koSkcFhPsNj0aGZnEJU9EgdWxVMIAUHbLNCd5OQxUZrYIN/s1600/apple-touch-icon.png">

          <link rel="apple-touch-icon"
                sizes="180x180"
                href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEifaiw3YEiKbzM-I2pgAlSqAfMP2P82H3N8SeMnk96rL-v8NykWl4R9oT6nl4SUpRMXdsDt-lrxfhcuAgFPtWqs78xhU-sJoovCAR-iH8xVYm-ojofYwt2M-PTFV9pJqC1xv0yhwaTIo6f563koSkcFhPsNj0aGZnEJU9EgdWxVMIAUHbLNCd5OQxUZrYIN/s1600/apple-touch-icon.png">'''

          for path in Path(".").rglob("*.html"):
              if any(part in {".git", "node_modules"} for part in path.parts):
                  continue

              text = path.read_text(encoding="utf-8")

              # Remove previous favicon block generated by this action
              start = text.find('<link rel="icon"')
              apple = text.find('<link rel="apple-touch-icon"')

              if start != -1 and apple != -1:
                  end = text.find(">", apple)
                  if end != -1:
                      text = text[:start] + text[end + 1:]

              # Insert after <head>
              if "<head>" in text:
                  text = text.replace(
                      "<head>",
                      "<head>\n" + favicon,
                      1
                  )
                  path.write_text(text, encoding="utf-8")

          PY

      - name: Commit favicon changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No favicon changes needed."
          else
            git commit -m "Add LetsStudy Pro favicon"
            git push
          fi