name: LetsStudy Pro - Google URL Crawler

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-url-crawler:
    name: Google URL Crawler
    runs-on: ubuntu-latest

    steps:
      - name: Crawl Sitemap URLs
        shell: bash
        run: |
          set +e

          python3 <<'PY'
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          import json
          import time
          import re

          SITEMAP_URL = "https://letsstudy.pro/sitemap.xml"
          ROBOTS_URL = "https://letsstudy.pro/robots.txt"

          USER_AGENT = (
              "LetsStudyPro-URL-Health-Monitor/1.0"
          )

          def fetch(url, timeout=30):
              started = time.time()

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "text/html,application/xml,text/plain,*/*"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=timeout
                  ) as response:

                      data = response.read()

                      return {
                          "status": response.status,
                          "final_url": response.geturl(),
                          "content_type":
                              response.headers.get(
                                  "Content-Type",
                                  ""
                              ),
                          "response_time_ms":
                              round(
                                  (time.time() - started)
                                  * 1000,
                                  2
                              ),
                          "data": data,
                          "error": ""
                      }

              except urllib.error.HTTPError as e:
                  return {
                      "status": e.code,
                      "final_url": (
                          e.geturl()
                          if hasattr(e, "geturl")
                          else url
                      ),
                      "content_type": "",
                      "response_time_ms":
                          round(
                              (time.time() - started)
                              * 1000,
                              2
                          ),
                      "data": b"",
                      "error": str(e)
                  }

              except Exception as e:
                  return {
                      "status": 0,
                      "final_url": url,
                      "content_type": "",
                      "response_time_ms":
                          round(
                              (time.time() - started)
                              * 1000,
                              2
                          ),
                      "data": b"",
                      "error": str(e)
                  }

          def classify(status):
              if status == 200:
                  return "HEALTHY"

              if 300 <= status < 400:
                  return "REDIRECT"

              if status in (401, 403):
                  return "BLOCKED"

              if status == 404:
                  return "NOT_FOUND"

              if 500 <= status <= 599:
                  return "SERVER_ERROR"

              if status == 0:
                  return "CONNECTION_ERROR"

              return "HTTP_ERROR"

          # --------------------------------
          # 1. Check sitemap
          # --------------------------------

          sitemap_response = fetch(
              SITEMAP_URL
          )

          sitemap_urls = []
          sitemap_error = ""

          if sitemap_response["status"] == 200:
              try:
                  root = ET.fromstring(
                      sitemap_response["data"]
                  )

                  for element in root.iter():
                      if element.tag.endswith("loc"):
                          if element.text:
                              url = element.text.strip()

                              if url:
                                  sitemap_urls.append(url)

              except Exception as e:
                  sitemap_error = str(e)

          else:
              sitemap_error = (
                  sitemap_response.get(
                      "error",
                      "Unable to fetch sitemap"
                  )
              )

          # Remove duplicates
          sitemap_urls = list(
              dict.fromkeys(sitemap_urls)
          )

          # Safety limit per run
          MAX_URLS = 250

          urls_checked = sitemap_urls[:MAX_URLS]

          # --------------------------------
          # 2. Check robots.txt
          # --------------------------------

          robots_response = fetch(
              ROBOTS_URL
          )

          robots_text = (
              robots_response["data"]
              .decode(
                  "utf-8",
                  errors="ignore"
              )
          )

          googlebot_match = re.search(
              r"User-agent:\s*Googlebot(.*?)(?=User-agent:|$)",
              robots_text,
              flags=re.I | re.S
          )

          robots_info = {
              "status":
                  robots_response["status"],
              "googlebot_section":
                  bool(googlebot_match),
              "sitemap_declared":
                  "sitemap:" in robots_text.lower(),
              "disallow_rules":
                  re.findall(
                      r"^\s*Disallow:\s*(.*)$",
                      robots_text,
                      flags=re.I | re.M
                  ),
              "allow_rules":
                  re.findall(
                      r"^\s*Allow:\s*(.*)$",
                      robots_text,
                      flags=re.I | re.M
                  )
          }

          # --------------------------------
          # 3. Crawl URLs
          # --------------------------------

          results = []

          for number, url in enumerate(
              urls_checked,
              start=1
          ):

              print(
                  f"[{number}/{len(urls_checked)}] {url}"
              )

              response = fetch(
                  url,
                  timeout=30
              )

              status = response["status"]

              health = classify(status)

              final_url = response.get(
                  "final_url",
                  url
              )

              content_type = (
                  response.get(
                      "content_type",
                      ""
                  ) or ""
              ).lower()

              is_https = (
                  url.lower().startswith(
                      "https://"
                  )
              )

              final_https = (
                  final_url.lower().startswith(
                      "https://"
                  )
              )

              slow = (
                  response.get(
                      "response_time_ms",
                      0
                  ) > 3000
              )

              html_expected = (
                  status == 200
                  and "text/html"
                  not in content_type
                  and content_type != ""
              )

              results.append({
                  "url": url,
                  "status": status,
                  "health": health,
                  "final_url": final_url,
                  "content_type": content_type,
                  "https": is_https,
                  "final_https": final_https,
                  "slow_over_3_seconds": slow,
                  "unexpected_content_type":
                      html_expected,
                  "response_time_ms":
                      response.get(
                          "response_time_ms",
                          0
                      ),
                  "error":
                      response.get(
                          "error",
                          ""
                      )
              })

          # --------------------------------
          # 4. Statistics
          # --------------------------------

          healthy = [
              x for x in results
              if x["health"] == "HEALTHY"
          ]

          redirects = [
              x for x in results
              if x["health"] == "REDIRECT"
          ]

          not_found = [
              x for x in results
              if x["health"] == "NOT_FOUND"
          ]

          blocked = [
              x for x in results
              if x["health"] == "BLOCKED"
          ]

          server_errors = [
              x for x in results
              if x["health"] == "SERVER_ERROR"
          ]

          connection_errors = [
              x for x in results
              if x["health"] == "CONNECTION_ERROR"
          ]

          http_errors = [
              x for x in results
              if x["health"] == "HTTP_ERROR"
          ]

          slow_urls = [
              x for x in results
              if x["slow_over_3_seconds"]
          ]

          non_https = [
              x for x in results
              if not x["https"]
          ]

          content_type_issues = [
              x for x in results
              if x["unexpected_content_type"]
          ]

          health_percentage = (
              round(
                  (
                      len(healthy)
                      / len(results)
                  ) * 100,
                  1
              )
              if results
              else 0
          )

          # --------------------------------
          # 5. JSON report
          # --------------------------------

          report = {
              "website":
                  "https://letsstudy.pro",

              "sitemap":
                  SITEMAP_URL,

              "robots":
                  ROBOTS_URL,

              "sitemap_status":
                  sitemap_response["status"],

              "sitemap_url_count":
                  len(sitemap_urls),

              "urls_checked":
                  len(results),

              "max_urls_per_run":
                  MAX_URLS,

              "health_percentage":
                  health_percentage,

              "robots":
                  robots_info,

              "summary": {
                  "healthy":
                      len(healthy),

                  "redirects":
                      len(redirects),

                  "not_found":
                      len(not_found),

                  "blocked":
                      len(blocked),

                  "server_errors":
                      len(server_errors),

                  "connection_errors":
                      len(connection_errors),

                  "http_errors":
                      len(http_errors),

                  "slow_urls":
                      len(slow_urls),

                  "non_https":
                      len(non_https),

                  "content_type_issues":
                      len(content_type_issues)
              },

              "sitemap_error":
                  sitemap_error,

              "urls":
                  results,

              "note":
                  (
                      "This workflow monitors URL health. "
                      "It does not prove that Googlebot "
                      "has crawled or indexed a URL."
                  )
          }

          with open(
              "google-url-crawler-report.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  report,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

          # --------------------------------
          # 6. Markdown report
          # --------------------------------

          with open(
              "google-url-crawler-report.md",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "# LetsStudy Pro - Google URL Crawler\n\n"
              )

              file.write(
                  "> URL health and crawl monitoring. "
                  "This does not prove Google crawling "
                  "or indexing.\n\n"
              )

              file.write(
                  "## Summary\n\n"
              )

              file.write(
                  f"- Sitemap URLs: "
                  f"{len(sitemap_urls)}\n"
              )

              file.write(
                  f"- URLs checked: "
                  f"{len(results)}\n"
              )

              file.write(
                  f"- Healthy: "
                  f"{len(healthy)}\n"
              )

              file.write(
                  f"- Health rate: "
                  f"{health_percentage}%\n"
              )

              file.write(
                  f"- Redirects: "
                  f"{len(redirects)}\n"
              )

              file.write(
                  f"- 404 Not Found: "
                  f"{len(not_found)}\n"
              )

              file.write(
                  f"- Blocked: "
                  f"{len(blocked)}\n"
              )

              file.write(
                  f"- Server errors: "
                  f"{len(server_errors)}\n"
              )

              file.write(
                  f"- Connection errors: "
                  f"{len(connection_errors)}\n"
              )

              file.write(
                  f"- Slow URLs (>3s): "
                  f"{len(slow_urls)}\n"
              )

              file.write(
                  f"- Non-HTTPS URLs: "
                  f"{len(non_https)}\n\n"
              )

              file.write(
                  "## Robots.txt\n\n"
              )

              file.write(
                  f"- HTTP status: "
                  f"{robots_info['status']}\n"
              )

              file.write(
                  f"- Googlebot section: "
                  f"{robots_info['googlebot_section']}\n"
              )

              file.write(
                  f"- Sitemap declared: "
                  f"{robots_info['sitemap_declared']}\n\n"
              )

              file.write(
                  "## Problems\n\n"
              )

              problems = (
                  not_found
                  + blocked
                  + server_errors
                  + connection_errors
                  + http_errors
                  + slow_urls
                  + non_https
                  + content_type_issues
              )

              unique = set()

              if problems:
                  for item in problems:
                      url = item["url"]

                      if url in unique:
                          continue

                      unique.add(url)

                      file.write(
                          f"- **{item['health']}** "
                          f"`{url}`"
                      )

                      file.write(
                          f" — HTTP "
                          f"{item['status']}"
                      )

                      file.write(
                          f" — "
                          f"{item['response_time_ms']} ms"
                      )

                      file.write("\n")
              else:
                  file.write(
                      "No major URL health problems detected. ✅\n"
                  )

              file.write(
                  "\n## URL Results\n\n"
              )

              file.write(
                  "| URL | HTTP | Health | "
                  "Response | Final URL |\n"
              )

              file.write(
                  "|---|---:|---|---:|---|\n"
              )

              for item in results:
                  file.write(
                      f"| `{item['url']}` | "
                      f"{item['status']} | "
                      f"{item['health']} | "
                      f"{item['response_time_ms']} ms | "
                      f"`{item['final_url']}` |\n"
                  )

          print("")
          print("======================================")
          print(" Google URL Crawler Completed")
          print("======================================")
          print(
              f"Sitemap URLs: {len(sitemap_urls)}"
          )
          print(
              f"URLs checked: {len(results)}"
          )
          print(
              f"Healthy: {len(healthy)}"
          )
          print(
              f"Health rate: {health_percentage}%"
          )
          print(
              f"404: {len(not_found)}"
          )
          print(
              f"Server errors: {len(server_errors)}"
          )
          print(
              f"Slow >3s: {len(slow_urls)}"
          )
          print("")
          print(
              "Informational check only."
          )

          PY

          exit 0

      - name: Upload URL Crawler Report
        uses: actions/upload-artifact@v4
        with:
          name: google-url-crawler-report
          path: |
            google-url-crawler-report.json
            google-url-crawler-report.md
          if-no-files-found: warn