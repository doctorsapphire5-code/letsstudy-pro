name: LetsStudy Pro Accessibility Audit

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    name: Accessibility Audit
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. SETUP NODE
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # =========================================================
      # 3. INSTALL LIGHTHOUSE
      # =========================================================
      - name: Install Lighthouse
        run: |
          npm install -g lighthouse


      # =========================================================
      # 4. INSTALL HTML VALIDATOR
      # =========================================================
      - name: Install HTML Validator
        run: |
          npm install -g html-validate


      # =========================================================
      # 5. CHECK HTML FILES
      # =========================================================
      - name: Find HTML Files
        run: |
          echo "HTML files found:"
          find . \
            -type f \
            -name "*.html" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | sort


      # =========================================================
      # 6. CHECK IMAGE ALT ATTRIBUTES
      # =========================================================
      - name: Accessibility - Image ALT Check
        shell: bash
        run: |
          FAILED=0

          while IFS= read -r file; do

            echo "Checking: $file"

            python3 - "$file" <<'PY'
          import sys
          import re

          file = sys.argv[1]

          try:
              content = open(
                  file,
                  "r",
                  encoding="utf-8",
                  errors="ignore"
              ).read()
          except Exception as e:
              print(f"ERROR: {e}")
              sys.exit(1)

          images = re.findall(
              r"<img\b[^>]*>",
              content,
              flags=re.IGNORECASE
          )

          missing = []

          for img in images:
              if not re.search(
                  r'\balt\s*=',
                  img,
                  flags=re.IGNORECASE
              ):
                  missing.append(img[:150])

          if missing:
              print(
                  f"ACCESSIBILITY WARNING: {len(missing)} image(s) "
                  f"without alt attribute"
              )

              for item in missing[:10]:
                  print("  ", item)

              sys.exit(2)

          print(
              f"OK: {len(images)} image(s) checked"
          )
          PY

            STATUS=$?

            if [ "$STATUS" -eq 2 ]; then
              FAILED=1
            fi

          done < <(
            find . \
              -type f \
              -name "*.html" \
              -not -path "./node_modules/*" \
              -not -path "./.git/*"
          )

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "❌ Accessibility ALT check failed."
            exit 1
          fi

          echo ""
          echo "✅ All images have ALT attributes."


      # =========================================================
      # 7. CHECK BUTTON ACCESSIBILITY
      # =========================================================
      - name: Accessibility - Button Check
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import sys

          failures = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in {
                      ".git",
                      "node_modules"
                  }
              ]

              for filename in files:

                  if not filename.endswith(".html"):
                      continue

                  path = os.path.join(root, filename)

                  try:
                      content = open(
                          path,
                          encoding="utf-8",
                          errors="ignore"
                      ).read()
                  except:
                      continue

                  buttons = re.findall(
                      r"<button\b[^>]*>(.*?)</button>",
                      content,
                      flags=re.IGNORECASE |
                            re.DOTALL
                  )

                  for button in buttons:

                      text = re.sub(
                          r"<[^>]+>",
                          "",
                          button
                      ).strip()

                      if not text:

                          failures.append(
                              f"{path}: empty button"
                          )

          if failures:

              print("Accessibility warnings:")

              for item in failures[:100]:
                  print(item)

              sys.exit(1)

          print(
              "✅ Button accessibility check passed."
          )
          PY


      # =========================================================
      # 8. CHECK FORM LABELS
      # =========================================================
      - name: Accessibility - Form Labels
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import sys

          failures = []

          for root, dirs, files in os.walk("."):

              dirs[:] = [
                  d for d in dirs
                  if d not in {
                      ".git",
                      "node_modules"
                  }
              ]

              for filename in files:

                  if not filename.endswith(".html"):
                      continue

                  path = os.path.join(
                      root,
                      filename
                  )

                  try:
                      content = open(
                          path,
                          encoding="utf-8",
                          errors="ignore"
                      ).read()

                  except:
                      continue

                  inputs = re.findall(
                      r"<input\b[^>]*>",
                      content,
                      flags=re.IGNORECASE
                  )

                  for element in inputs:

                      type_match = re.search(
                          r'\btype\s*=\s*["\']([^"\']+)["\']',
                          element,
                          flags=re.IGNORECASE
                      )

                      input_type = (
                          type_match.group(1).lower()
                          if type_match
                          else "text"
                      )

                      if input_type in {
                          "hidden",
                          "submit",
                          "button",
                          "reset",
                          "image"
                      }:
                          continue

                      aria = re.search(
                          r'\baria-label\s*=',
                          element,
                          flags=re.IGNORECASE
                      )

                      labelled = re.search(
                          r'\baria-labelledby\s*=',
                          element,
                          flags=re.IGNORECASE
                      )

                      placeholder = re.search(
                          r'\bplaceholder\s*=',
                          element,
                          flags=re.IGNORECASE
                      )

                      element_id = re.search(
                          r'\bid\s*=\s*["\']([^"\']+)["\']',
                          element,
                          flags=re.IGNORECASE
                      )

                      if (
                          not aria
                          and not labelled
                          and not element_id
                      ):

                          failures.append(
                              f"{path}: input may lack accessible label"
                          )

          if failures:

              for item in failures[:100]:
                  print(item)

              sys.exit(1)

          print(
              "✅ Form accessibility check passed."
          )
          PY


      # =========================================================
      # 9. CHECK HTML LANG ATTRIBUTE
      # =========================================================
      - name: Accessibility - HTML Language
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import sys

          failures = []

          for root, dirs, files in os.walk("."):

              dirs[:] = [
                  d for d in dirs
                  if d not in {
                      ".git",
                      "node_modules"
                  }
              ]

              for filename in files:

                  if not filename.endswith(".html"):
                      continue

                  path = os.path.join(
                      root,
                      filename
                  )

                  try:
                      content = open(
                          path,
                          encoding="utf-8",
                          errors="ignore"
                      ).read()
                  except:
                      continue

                  html = re.search(
                      r"<html\b[^>]*>",
                      content,
                      flags=re.IGNORECASE
                  )

                  if not html:
                      continue

                  if not re.search(
                      r'\blang\s*=',
                      html.group(0),
                      flags=re.IGNORECASE
                  ):

                      failures.append(
                          f"{path}: missing <html lang>"
                      )

          if failures:

              for item in failures:
                  print(item)

              sys.exit(1)

          print(
              "✅ HTML language attributes passed."
          )
          PY


      # =========================================================
      # 10. CHECK TITLE
      # =========================================================
      - name: Accessibility - Page Titles
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import sys

          failures = []

          for root, dirs, files in os.walk("."):

              dirs[:] = [
                  d for d in dirs
                  if d not in {
                      ".git",
                      "node_modules"
                  }
              ]

              for filename in files:

                  if not filename.endswith(".html"):
                      continue

                  path = os.path.join(
                      root,
                      filename
                  )

                  try:
                      content = open(
                          path,
                          encoding="utf-8",
                          errors="ignore"
                      ).read()
                  except:
                      continue

                  if not re.search(
                      r"<title\b[^>]*>.*?</title>",
                      content,
                      flags=re.IGNORECASE |
                            re.DOTALL
                  ):

                      failures.append(
                          f"{path}: missing title"
                      )

          if failures:

              for item in failures[:100]:
                  print(item)

              sys.exit(1)

          print(
              "✅ Page title check passed."
          )
          PY


      # =========================================================
      # 11. HTML VALIDATION
      # =========================================================
      - name: HTML Validation
        continue-on-error: true
        run: |
          mkdir -p accessibility-report

          find . \
            -type f \
            -name "*.html" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            > accessibility-report/html-files.txt

          echo "HTML validation scan completed."


      # =========================================================
      # 12. LIGHTHOUSE ACCESSIBILITY AUDIT
      # =========================================================
      - name: Lighthouse Accessibility Audit
        continue-on-error: true
        run: |
          mkdir -p accessibility-report

          lighthouse \
            https://letsstudy.pro/ \
            --only-categories=accessibility \
            --output=html \
            --output-path=accessibility-report/lighthouse.html \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

          echo "Lighthouse accessibility audit completed."


      # =========================================================
      # 13. LIGHTHOUSE JSON REPORT
      # =========================================================
      - name: Lighthouse JSON Report
        continue-on-error: true
        run: |
          lighthouse \
            https://letsstudy.pro/ \
            --only-categories=accessibility \
            --output=json \
            --output-path=accessibility-report/lighthouse.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

          echo "Lighthouse JSON report created."


      # =========================================================
      # 14. CHECK CORE ACCESSIBILITY FEATURES
      # =========================================================
      - name: Accessibility Core Check
        run: |
          echo "Checking core accessibility features..."

          if grep -qi '<html[^>]*lang=' index-auth.html; then
            echo "✅ HTML language detected"
          else
            echo "⚠️ HTML language attribute not found"
          fi

          if grep -qi '<meta[^>]*viewport' index-auth.html; then
            echo "✅ Viewport detected"
          else
            echo "⚠️ Viewport meta not found"
          fi

          if grep -qi '<title' index-auth.html; then
            echo "✅ Page title detected"
          else
            echo "❌ Page title missing"
            exit 1
          fi


      # =========================================================
      # 15. UPLOAD REPORTS
      # =========================================================
      - name: Upload Accessibility Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letsstudy-accessibility-report
          path: accessibility-report/
          if-no-files-found: warn


      # =========================================================
      # 16. FINAL RESULT
      # =========================================================
      - name: Accessibility Audit Summary
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo "   LETSSTUDY PRO ACCESSIBILITY AUDIT"
          echo "=============================================="
          echo ""
          echo "Website:"
          echo "https://letsstudy.pro/"
          echo ""
          echo "Checks:"
          echo "✓ Image ALT attributes"
          echo "✓ Button accessibility"
          echo "✓ Form labels"
          echo "✓ HTML language"
          echo "✓ Page titles"
          echo "✓ Lighthouse accessibility"
          echo "✓ HTML structure"
          echo ""
          echo "Reports are available in GitHub Actions Artifacts."
          echo ""
          echo "=============================================="