name: LetsStudy Pro - Broken Links Check

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  broken-links:
    name: Check Website Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install link checker
        run: |
          npm install -g broken-link-checker

      - name: Check production website
        shell: bash
        run: |
          echo "Checking LetsStudy Pro..."
          echo "https://letsstudy.pro"

          set +e

          blc \
            https://letsstudy.pro \
            --recursive \
            --ordered \
            --filter-level 3 \
            --exclude "mailto:" \
            --exclude "tel:" \
            --exclude "javascript:" \
            --exclude "whatsapp:" \
            --exclude "facebook.com" \
            --exclude "instagram.com" \
            --exclude "youtube.com" \
            --exclude "tiktok.com" \
            --exclude "linkedin.com" \
            --exclude "x.com" \
            --exclude "twitter.com" \
            --exclude "pinterest.com" \
            --exclude "telegram.me" \
            --exclude "t.me" \
            --exclude "localhost" \
            --exclude "127.0.0.1"

          BLC_STATUS=$?

          echo ""
          echo "Broken-link checker exit code: $BLC_STATUS"

          if [ "$BLC_STATUS" -ne 0 ]; then
            echo "WARNING: Broken or unreachable links were detected."
            echo "The workflow will continue."
          else
            echo "No broken links detected."
          fi

          exit 0

      - name: Download production sitemap
        shell: bash
        run: |
          set -e

          SITEMAP="https://letsstudy.pro/sitemap.xml"

          echo "Downloading sitemap..."

          curl \
            -L \
            --fail \
            --silent \
            --show-error \
            --max-time 60 \
            "$SITEMAP" \
            -o sitemap-live.xml

          echo "Sitemap downloaded successfully."

      - name: Extract sitemap URLs
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import re

          with open("sitemap-live.xml", "r", encoding="utf-8") as f:
              data = f.read()

          urls = re.findall(r"<loc>\s*(.*?)\s*</loc>", data, re.I | re.S)

          with open("sitemap-urls.txt", "w", encoding="utf-8") as f:
              for url in urls:
                  f.write(url.strip() + "\n")

          print(f"URLs found in sitemap: {len(urls)}")

          if not urls:
              print("WARNING: No URLs found in sitemap.")
          PY

      - name: Check sitemap URLs
        shell: bash
        run: |
          set +e

          FAILED=0
          COUNT=0

          while IFS= read -r URL; do

            [ -z "$URL" ] && continue

            COUNT=$((COUNT + 1))

            echo "[$COUNT] Checking: $URL"

            STATUS=$(curl \
              -L \
              -o /dev/null \
              -s \
              -w "%{http_code}" \
              --max-time 20 \
              "$URL")

            echo "Status: $STATUS"

            case "$STATUS" in
              200|204|301|302|307|308)
                echo "OK"
                ;;
              *)
                echo "WARNING: Broken/unavailable URL"
                echo "URL: $URL"
                echo "STATUS: $STATUS"
                FAILED=$((FAILED + 1))
                ;;
            esac

            echo ""

          done < sitemap-urls.txt

          echo "======================================"
          echo "Sitemap URL Check Complete"
          echo "======================================"
          echo "URLs checked: $COUNT"
          echo "Failed URLs: $FAILED"
          echo ""

          if [ "$FAILED" -gt 0 ]; then
            echo "WARNING: $FAILED sitemap URL(s) failed."
            echo "Deployment/indexing will NOT be blocked."
          else
            echo "All sitemap URLs responded successfully."
          fi

          exit 0

      - name: Check robots.txt
        shell: bash
        run: |
          STATUS=$(curl \
            -L \
            -o /dev/null \
            -s \
            -w "%{http_code}" \
            --max-time 30 \
            "https://letsstudy.pro/robots.txt")

          echo "robots.txt status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "robots.txt: OK"
          else
            echo "WARNING: robots.txt returned HTTP $STATUS"
          fi

          exit 0

      - name: Check sitemap availability
        shell: bash
        run: |
          STATUS=$(curl \
            -L \
            -o /dev/null \
            -s \
            -w "%{http_code}" \
            --max-time 30 \
            "https://letsstudy.pro/sitemap.xml")

          echo "sitemap.xml status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "sitemap.xml: OK"
          else
            echo "WARNING: sitemap.xml returned HTTP $STATUS"
          fi

          exit 0

      - name: Final report
        run: |
          echo ""
          echo "======================================"
          echo " LetsStudy Pro Broken Link Check"
          echo "======================================"
          echo ""
          echo "Website: https://letsstudy.pro"
          echo "Broken-link check: COMPLETED"
          echo "Sitemap check: COMPLETED"
          echo "robots.txt check: COMPLETED"
          echo ""
          echo "Warnings do not block the workflow."
          echo "======================================"