name: Deploy Vorix Career

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g firebase-tools

      - name: Deploy Vorix Career
        run: firebase deploy --only hosting --project vorix-career
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}