name: LetsStudy Pro - Deployment Failure Notification

on:
  workflow_run:
    workflows:
      - "LetsStudy Pro - Firebase Deploy"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  deployment-status:
    name: Deployment Status
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment result
        run: |
          echo "======================================"
          echo " LETSSTUDY PRO DEPLOYMENT STATUS"
          echo "======================================"

          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Status: ${{ github.event.workflow_run.status }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"

      - name: Deployment successful
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          echo "======================================"
          echo " DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          echo "LetsStudy Pro was deployed successfully."
          echo "Production:"
          echo "https://letsstudy.pro"

      - name: Deployment failed
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        run: |
          echo "======================================"
          echo " DEPLOYMENT FAILED"
          echo "======================================"

          echo "ERROR: LetsStudy Pro deployment failed."
          echo ""
          echo "Check the failed workflow:"
          echo "${{ github.event.workflow_run.html_url }}"

          exit 1

      - name: Deployment cancelled
        if: ${{ github.event.workflow_run.conclusion == 'cancelled' }}
        run: |
          echo "======================================"
          echo " DEPLOYMENT CANCELLED"
          echo "======================================"

          echo "The LetsStudy Pro deployment was cancelled."

      - name: Deployment skipped
        if: ${{ github.event.workflow_run.conclusion == 'skipped' }}
        run: |
          echo "======================================"
          echo " DEPLOYMENT SKIPPED"
          echo "======================================"

          echo "The LetsStudy Pro deployment was skipped."

      - name: Write GitHub Step Summary
        if: always()
        run: |
          echo "# LetsStudy Pro Deployment Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Workflow:** ${{ github.event.workflow_run.name }}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "**Branch:** ${{ github.event.workflow_run.head_branch }}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "**Commit:** \`${{ github.event.workflow_run.head_sha }}\`" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "**Status:** ${{ github.event.workflow_run.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "**Conclusion:** ${{ github.event.workflow_run.conclusion }}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "[Open deployment workflow](${{ github.event.workflow_run.html_url }})" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Production: https://letsstudy.pro" \
            >> "$GITHUB_STEP_SUMMARY"