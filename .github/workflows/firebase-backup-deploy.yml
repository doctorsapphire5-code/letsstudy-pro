
name: Firebase Multi-Project Backup and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firebase-multi-deploy
  cancel-in-progress: false

jobs:
  backup-and-deploy:
    name: Backup and Deploy All Firebase Projects
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - vorix-business
          - vorix-career
          - vorix-sponsor
          - teacher-and-organization-29efd
          - vorix-market

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Backup
        if: matrix.project == 'vorix-business'
        run: |
          TAG="firebase-backup-$(date -u +'%Y%m%d-%H%M%S')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

          echo "Backup created: $TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only hosting \
            --project "${{ matrix.project }}"
