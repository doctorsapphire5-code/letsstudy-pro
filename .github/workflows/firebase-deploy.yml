name: LetsStudy Pro - Firebase Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools

      - name: Check Firebase Configuration
        run: |
          echo "Checking Firebase configuration..."

          test -f firebase.json
          test -f .firebaserc

          echo "Firebase configuration found."

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "======================================"
          echo " LETSSTUDY PRO FIREBASE DEPLOY"
          echo "======================================"
          echo ""

          firebase deploy \
            --only hosting \
            --project let-s-study-pro-course \
            --token "$FIREBASE_TOKEN"

      - name: Verify Deployment
        shell: bash
        run: |
          echo ""
          echo "Checking deployed website..."

          STATUS=$(curl -L -s -o /dev/null \
            -w "%{http_code}" \
            --max-time 60 \
            "https://letsstudy.pro/" || true)

          echo "Website: https://letsstudy.pro/"
          echo "HTTP Status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo ""
            echo "DEPLOYMENT VERIFIED"
          else
            echo ""
            echo "WARNING: Website returned HTTP $STATUS"
          fi

      - name: Final Report
        run: |
          echo ""
          echo "======================================"
          echo " FIREBASE DEPLOY COMPLETED"
          echo "======================================"
          echo ""
          echo "Project: let-s-study-pro-course"
          echo "Hosting: Firebase"
          echo "Domain: https://letsstudy.pro"
          echo "Branch: main"
          echo ""
          echo "LetsStudy Pro is deployed."
          echo "======================================"