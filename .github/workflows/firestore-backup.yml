name: LetsStudy Pro - Firebase Daily Backup

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-backup:
    name: Daily Firestore Backup
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Backup Configuration
        shell: bash
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_BACKUP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ secrets.GCS_BACKUP_BUCKET }}
        run: |
          set +e

          echo "======================================"
          echo " LETSSTUDY PRO"
          echo " FIREBASE DAILY BACKUP"
          echo "======================================"
          echo ""

          MISSING=0

          if [ -z "$GCP_CREDENTIALS" ]; then
            echo "MISSING: GCP_BACKUP_SERVICE_ACCOUNT"
            MISSING=1
          else
            echo "FOUND: GCP_BACKUP_SERVICE_ACCOUNT"
          fi

          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "MISSING: GCP_PROJECT_ID"
            MISSING=1
          else
            echo "FOUND: GCP_PROJECT_ID"
          fi

          if [ -z "$GCS_BUCKET" ]; then
            echo "MISSING: GCS_BACKUP_BUCKET"
            MISSING=1
          else
            echo "FOUND: GCS_BACKUP_BUCKET"
          fi

          echo ""

          if [ "$MISSING" -ne 0 ]; then
            echo "Backup configuration is incomplete."
            echo "Backup will be skipped."
            echo "Workflow will NOT fail."
            exit 0
          fi

          echo "Backup configuration is ready."

      - name: Authenticate Google Cloud
        if: ${{ secrets.GCP_BACKUP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BACKUP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        if: ${{ secrets.GCP_BACKUP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firestore Backup
        if: ${{ secrets.GCP_BACKUP_SERVICE_ACCOUNT != '' }}
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ secrets.GCS_BACKUP_BUCKET }}
        run: |
          set +e

          echo "======================================"
          echo " FIRESTORE EXPORT"
          echo "======================================"
          echo ""

          DATE=$(date -u +"%Y-%m-%d")
          TIMESTAMP=$(date -u +"%Y-%m-%d-%H-%M-%S")

          BACKUP_PATH="gs://${GCS_BUCKET}/firestore-backups/${DATE}/${TIMESTAMP}"

          echo "Project: ${GCP_PROJECT_ID}"
          echo "Backup path: ${BACKUP_PATH}"
          echo ""

          gcloud firestore export "$BACKUP_PATH" \
            --project="$GCP_PROJECT_ID"

          STATUS=$?

          echo ""
          echo "Firestore export exit code: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "WARNING: Firestore backup failed."
            echo "The workflow will remain informational."
            exit 0
          fi

          echo ""
          echo "======================================"
          echo " FIRESTORE BACKUP SUCCESS"
          echo "======================================"
          echo ""
          echo "Backup:"
          echo "$BACKUP_PATH"

      - name: Generate Backup Report
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ secrets.GCS_BACKUP_BUCKET }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          TIMESTAMP=$(date -u +"%Y-%m-%d-%H-%M-%S")

          cat > firebase-backup-report.md <<EOF
          # LetsStudy Pro - Firebase Daily Backup

          - Date: **${DATE}**
          - Timestamp: **${TIMESTAMP}**
          - Firebase project: **${GCP_PROJECT_ID:-Not configured}**
          - Backup bucket: **${GCS_BUCKET:-Not configured}**
          - Backup type: **Firestore export**
          - Schedule: **Daily**
          - Deployment blocking: **No**

          The workflow is informational and does not modify
          website hosting files.
          EOF

          cat > firebase-backup-report.json <<EOF
          {
            "project": "${GCP_PROJECT_ID:-}",
            "date": "${DATE}",
            "timestamp": "${TIMESTAMP}",
            "backup_type": "firestore_export",
            "bucket": "${GCS_BUCKET:-}",
            "deployment_blocked": false
          }
          EOF

      - name: Upload Backup Report
        uses: actions/upload-artifact@v4
        with:
          name: letsstudy-pro-firebase-backup-report
          path: |
            firebase-backup-report.md
            firebase-backup-report.json
          if-no-files-found: warn