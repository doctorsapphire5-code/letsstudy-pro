name: LetsStudy Pro - Firestore Backup

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-backup:
    name: Firestore Daily Backup
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure project
        run: |
          gcloud config set project let-s-study-pro-course

      - name: Check backup bucket
        shell: bash
        run: |
          if [ -z "${{ secrets.FIRESTORE_BACKUP_BUCKET }}" ]; then
            echo "ERROR: FIRESTORE_BACKUP_BUCKET secret is missing."
            exit 1
          fi

          echo "Backup bucket configured."

      - name: Create Firestore backup
        shell: bash
        run: |
          PROJECT_ID="let-s-study-pro-course"
          BUCKET="${{ secrets.FIRESTORE_BACKUP_BUCKET }}"

          BACKUP_DATE=$(date -u +"%Y-%m-%d-%H-%M-%S")

          BACKUP_PATH="gs://${BUCKET}/firestore-backups/${BACKUP_DATE}"

          echo "======================================"
          echo " LetsStudy Pro Firestore Backup"
          echo "======================================"
          echo ""
          echo "Project: $PROJECT_ID"
          echo "Backup: $BACKUP_PATH"
          echo ""

          gcloud firestore export "$BACKUP_PATH" \
            --project="$PROJECT_ID"

          echo ""
          echo "Firestore backup completed."

      - name: Verify backup
        shell: bash
        run: |
          BUCKET="${{ secrets.FIRESTORE_BACKUP_BUCKET }}"

          echo ""
          echo "Checking backup..."

          gcloud storage ls \
            "gs://${BUCKET}/firestore-backups/" \
            --project="let-s-study-pro-course"

          echo ""
          echo "Backup verification completed."

      - name: Final report
        run: |
          echo ""
          echo "======================================"
          echo " FIRESTORE BACKUP SUCCESS"
          echo "======================================"
          echo ""
          echo "Project: let-s-study-pro-course"
          echo "Schedule: Daily"
          echo "Backup: Firestore export"
          echo "Verification: Completed"
          echo ""
          echo "======================================"