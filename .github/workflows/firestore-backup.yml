name: LetsStudy Pro - Firestore Backup

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-backup:
    name: Firestore Backup
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create backup directory
        run: |
          mkdir -p firestore-backup

      - name: Export Firestore data
        shell: bash
        run: |
          PROJECT_ID="let-s-study-pro-course"
          DATABASE="(default)"

          echo "======================================"
          echo " LetsStudy Pro Firestore Backup"
          echo "======================================"
          echo ""

          ACCESS_TOKEN=$(gcloud auth print-access-token)

          curl \
            -sS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/${DATABASE}/documents?pageSize=300" \
            > firestore-backup/firestore-documents.json

          echo "Firestore data retrieved."

      - name: Validate backup
        shell: bash
        run: |
          FILE="firestore-backup/firestore-documents.json"

          if [ ! -s "$FILE" ]; then
            echo "ERROR: Backup file is empty."
            exit 1
          fi

          if jq empty "$FILE" 2>/dev/null; then
            echo "Backup JSON is valid."
          else
            echo "ERROR: Backup JSON is invalid."
            exit 1
          fi

          echo ""
          echo "Backup size:"
          du -h "$FILE"

      - name: Add backup information
        shell: bash
        run: |
          cat > firestore-backup/README.txt <<EOF
          LetsStudy Pro Firestore Backup

          Firebase Project:
          let-s-study-pro-course

          Database:
          (default)

          Backup date:
          $(date -u)

          Storage:
          GitHub Actions Artifact

          Firebase Storage:
          NOT USED

          Firebase Functions:
          NOT USED
          EOF

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: letsstudy-pro-firestore-backup-${{ github.run_number }}
          path: firestore-backup/
          retention-days: 30

      - name: Final report
        run: |
          echo ""
          echo "======================================"
          echo " FIRESTORE BACKUP COMPLETED"
          echo "======================================"
          echo ""
          echo "Project: let-s-study-pro-course"
          echo "Storage: GitHub Actions Artifact"
          echo "Firebase Storage: NOT USED"
          echo "Firebase Functions: NOT USED"
          echo "Retention: 30 days"
          echo ""
          echo "Backup successfully uploaded."
          echo "======================================"