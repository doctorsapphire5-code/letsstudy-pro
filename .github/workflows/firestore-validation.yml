name: LetsStudy Pro - Firestore Validation

on:
  push:
    branches:
      - main

  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  firestore-validation:
    name: Firestore Data Validation
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set Google Cloud project
        run: |
          gcloud config set project let-s-study-pro-course

      - name: Check Firestore database
        shell: bash
        run: |
          echo "======================================"
          echo " LetsStudy Pro Firestore Validation"
          echo "======================================"
          echo ""

          gcloud firestore databases describe \
            --database="(default)" \
            --project="let-s-study-pro-course"

          echo ""
          echo "Firestore database is accessible."

      - name: Check Firestore API
        shell: bash
        run: |
          echo ""
          echo "Checking Firestore API..."

          gcloud services list \
            --enabled \
            --project="let-s-study-pro-course" \
            --filter="config.name:firestore.googleapis.com" \
            --format="value(config.name)"

          echo ""
          echo "Firestore API check completed."

      - name: Review expected collections
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " EXPECTED LETSSTUDY PRO COLLECTIONS"
          echo "======================================"
          echo ""

          cat <<'EOF'
          admins
          users
          profiles
          courses
          modules
          lessons
          announcements
          assignments
          courseFAQs
          certificates
          freelancers
          services
          businesses
          sponsors
          subscriptions
          premiumMembers
          ads
          marketplace
          wallets
          careers
          scholarships
          resources
          EOF

          echo ""
          echo "Collection structure review completed."

      - name: Final report
        run: |
          echo ""
          echo "======================================"
          echo " FIRESTORE VALIDATION COMPLETED"
          echo "======================================"
          echo ""
          echo "Project: let-s-study-pro-course"
          echo "Database: (default)"
          echo "Firestore API: Available"
          echo "Database access: Verified"
          echo "Data modification: NONE"
          echo ""
          echo "======================================"