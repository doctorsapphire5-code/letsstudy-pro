name: LetsStudy Pro - Global Search Engine Indexing Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  global-indexing:
    name: Global Indexing Monitor
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Create required folders
      - name: Create Required Folders
        run: |
          mkdir -p scripts
          mkdir -p reports

      # Check website
      - name: Check LetsStudy Pro Website
        run: |
          echo "======================================"
          echo "LetsStudy Pro Website Check"
          echo "======================================"

          curl -I -L --max-time 30 \
            -A "LetsStudy-Pro-Indexing-Monitor/1.0" \
            https://letsstudy.pro/ || true

      # Check robots.txt
      - name: Check Robots.txt
        run: |
          echo "======================================"
          echo "Robots.txt Check"
          echo "======================================"

          curl -I -L --max-time 30 \
            -A "LetsStudy-Pro-Indexing-Monitor/1.0" \
            https://letsstudy.pro/robots.txt || true

      # Check main sitemap
      - name: Check Main Sitemap
        run: |
          echo "======================================"
          echo "Main Sitemap Check"
          echo "======================================"

          curl -I -L --max-time 30 \
            -A "LetsStudy-Pro-Indexing-Monitor/1.0" \
            https://letsstudy.pro/sitemap.xml || true

      # Check pages sitemap
      - name: Check Pages Sitemap
        run: |
          echo "======================================"
          echo "Pages Sitemap Check"
          echo "======================================"

          curl -I -L --max-time 30 \
            -A "LetsStudy-Pro-Indexing-Monitor/1.0" \
            https://letsstudy.pro/sitemap-pages-1.xml || true

      # Check Firestore sitemap
      - name: Check Firestore Sitemap
        run: |
          echo "======================================"
          echo "Firestore Sitemap Check"
          echo "======================================"

          curl -I -L --max-time 30 \
            -A "LetsStudy-Pro-Indexing-Monitor/1.0" \
            https://letsstudy.pro/sitemap-firestore-1.xml || true

      # Run main indexing script
      - name: Run Global Indexing Monitor
        env:
          SITE_URL: https://letsstudy.pro

          GOOGLE_SITE_URL: ${{ secrets.GOOGLE_SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

          BING_SITE_URL: ${{ secrets.BING_SITE_URL }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}

          YANDEX_USER_ID: ${{ secrets.YANDEX_USER_ID }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}

          NAVER_SITE_URL: ${{ secrets.NAVER_SITE_URL }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}

          BAIDU_SITE_URL: ${{ secrets.BAIDU_SITE_URL }}
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}

        run: |
          node scripts/global-indexing-check.js

      # Display generated report
      - name: Display Global Indexing Report
        if: always()
        run: |
          echo "======================================"
          echo "GLOBAL INDEXING REPORT"
          echo "======================================"

          if [ -f reports/global-indexing-report.json ]; then
            cat reports/global-indexing-report.json
          else
            echo "Report was not generated."
          fi

      # Upload report as GitHub Artifact
      - name: Upload Global Indexing Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letsstudy-pro-global-indexing-report
          path: reports/
          if-no-files-found: warn
          retention-days: 90

      # Commit report to repository
      - name: Commit Indexing Report
        if: always()
        run: |
          git config user.name "LetsStudy Pro Indexing Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update global search engine indexing report"
            git push
          fi