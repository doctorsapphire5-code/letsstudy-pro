name: LetsStudy Pro - Global Indexing

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  indexing:
    name: Generate and Validate Sitemap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check project
        run: |
          echo "LetsStudy Pro indexing workflow started."

          if [ -f package.json ]; then
            echo "package.json found."
          else
            echo "No package.json found."
          fi

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm install

      - name: Generate static sitemap
        if: hashFiles('package.json') != ''
        run: |
          npm run sitemap:static || true

      - name: Generate Firestore sitemap
        if: hashFiles('package.json') != ''
        run: |
          npm run sitemap:index || true

      - name: Run Firestore indexing
        if: hashFiles('package.json') != ''
        run: |
          npm run firestore:index || true

      - name: Run IndexNow
        if: hashFiles('package.json') != ''
        run: |
          npm run indexnow || true

      - name: Check sitemap
        run: |
          echo "Checking sitemap..."

          if [ -f sitemap.xml ]; then
            echo "sitemap.xml exists."
            echo "URL count:"
            grep -o "<loc>" sitemap.xml | wc -l
          else
            echo "sitemap.xml not found."
            echo "Sitemap may be generated by another process."
          fi

      - name: Verify live sitemap
        run: |
          echo "Checking live sitemap..."

          STATUS=$(curl \
            -L \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            --max-time 30 \
            "https://letsstudy.pro/sitemap.xml")

          echo "Live sitemap HTTP status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "Live sitemap is available."
          else
            echo "WARNING: Live sitemap returned HTTP $STATUS"
          fi

      - name: Commit sitemap changes
        run: |
          git config user.name "LetsStudy Pro"
          git config user.email "support@letsstudy.pro"

          git add sitemap.xml sitemap*.xml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No sitemap changes."
          else
            git commit -m "chore: update sitemap"
            git push origin main
          fi

      - name: Indexing summary
        run: |
          echo ""
          echo "======================================"
          echo " LetsStudy Pro Global Indexing"
          echo "======================================"
          echo ""
          echo "Sitemap:"
          echo "https://letsstudy.pro/sitemap.xml"
          echo ""
          echo "Workflow completed."