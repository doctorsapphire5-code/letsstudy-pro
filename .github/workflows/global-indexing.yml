name: LetsStudy Pro - Global Indexing

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-indexing:
    name: Global Indexing
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Sitemap
        shell: bash
        run: |
          echo "======================================"
          echo " LetsStudy Pro - Sitemap Check"
          echo "======================================"

          SITEMAP="https://letsstudy.pro/sitemap.xml"

          STATUS=$(curl -L -s -o /tmp/sitemap.xml \
            -w "%{http_code}" \
            --max-time 60 \
            "$SITEMAP" || true)

          echo "Sitemap: $SITEMAP"
          echo "HTTP Status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "Sitemap is ONLINE."

            if grep -qi "<urlset\|<sitemapindex" /tmp/sitemap.xml; then
              echo "Valid sitemap structure detected."
            else
              echo "WARNING: Sitemap structure was not detected."
            fi
          else
            echo "WARNING: Sitemap returned HTTP $STATUS"
          fi

      - name: Count Sitemap URLs
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " Sitemap URL Count"
          echo "======================================"

          if [ -f /tmp/sitemap.xml ]; then
            COUNT=$(grep -o "<loc>" /tmp/sitemap.xml | wc -l || true)
            echo "URLs discovered in sitemap: $COUNT"
          else
            echo "Sitemap could not be downloaded."
          fi

      - name: Notify Google Sitemap
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " Google Sitemap Notification"
          echo "======================================"

          RESPONSE=$(curl -L -s -o /dev/null \
            -w "%{http_code}" \
            --max-time 30 \
            "https://www.google.com/ping?sitemap=https://letsstudy.pro/sitemap.xml" || true)

          echo "Google sitemap endpoint response: $RESPONSE"

          echo ""
          echo "Note:"
          echo "Google controls crawling and indexing."
          echo "This notification does NOT guarantee indexing."

      - name: Notify Bing
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " Bing Sitemap Notification"
          echo "======================================"

          RESPONSE=$(curl -L -s -o /dev/null \
            -w "%{http_code}" \
            --max-time 30 \
            "https://www.bing.com/ping?sitemap=https://letsstudy.pro/sitemap.xml" || true)

          echo "Bing response: $RESPONSE"

      - name: IndexNow
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " IndexNow"
          echo "======================================"

          if [ -z "${{ secrets.INDEXNOW_KEY }}" ]; then
            echo "INDEXNOW_KEY is not configured."
            echo "Skipping IndexNow."
            exit 0
          fi

          if [ ! -f /tmp/sitemap.xml ]; then
            echo "Sitemap unavailable."
            exit 0
          fi

          python3 - <<'PY'
          import re
          import json
          import os

          sitemap = open("/tmp/sitemap.xml", "r", encoding="utf-8").read()

          urls = re.findall(r"<loc>\s*(.*?)\s*</loc>", sitemap)

          urls = [
              u.strip()
              for u in urls
              if u.startswith("https://letsstudy.pro/")
          ]

          urls = urls[:10000]

          payload = {
              "host": "letsstudy.pro",
              "key": os.environ["INDEXNOW_KEY"],
              "urlList": urls
          }

          with open("/tmp/indexnow.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)

          print(f"Prepared {len(urls)} URLs for IndexNow.")
          PY

          RESPONSE=$(curl -L -s \
            -o /tmp/indexnow-response.txt \
            -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/indexnow.json \
            "https://api.indexnow.org/indexnow" || true)

          echo "IndexNow response: $RESPONSE"

          if [ -s /tmp/indexnow-response.txt ]; then
            echo "IndexNow response:"
            cat /tmp/indexnow-response.txt
          fi
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Check Robots.txt
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " Robots.txt"
          echo "======================================"

          STATUS=$(curl -L -s -o /tmp/robots.txt \
            -w "%{http_code}" \
            --max-time 30 \
            "https://letsstudy.pro/robots.txt" || true)

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "robots.txt is ONLINE."
            grep -i "sitemap:" /tmp/robots.txt || \
              echo "WARNING: Sitemap directive not found."
          else
            echo "WARNING: robots.txt returned HTTP $STATUS"
          fi

      - name: Global Indexing Report
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " GLOBAL INDEXING COMPLETED"
          echo "======================================"
          echo ""
          echo "Website: https://letsstudy.pro"
          echo "Sitemap: https://letsstudy.pro/sitemap.xml"
          echo "Robots:  https://letsstudy.pro/robots.txt"
          echo ""
          echo "Sitemap discovery: ACTIVE"
          echo "Google discovery: ACTIVE"
          echo "Bing discovery: ACTIVE"
          echo "IndexNow: CONFIGURED WHEN KEY EXISTS"
          echo ""
          echo "IMPORTANT:"
          echo "Search engines decide when URLs are crawled"
          echo "and whether they are indexed."
          echo ""
          echo "Global Indexing workflow completed."
          echo "======================================"