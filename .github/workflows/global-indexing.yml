name: LetsStudy Pro - Global Indexing

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  indexing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate static sitemap
        run: |
          if npm run | grep -q "sitemap:static"; then
            npm run sitemap:static
          else
            echo "sitemap:static script not found - skipping"
          fi

      - name: Generate Firestore sitemap
        run: |
          if npm run | grep -q "sitemap:index"; then
            npm run sitemap:index
          else
            echo "sitemap:index script not found - skipping"
          fi

      - name: Run indexing preparation
        run: |
          if npm run | grep -q "firestore:index"; then
            npm run firestore:index
          else
            echo "firestore:index script not found - skipping"
          fi

      - name: Run IndexNow
        run: |
          if npm run | grep -q "indexnow"; then
            npm run indexnow
          else
            echo "indexnow script not found - skipping"
          fi

      - name: Verify sitemap
        run: |
          if [ -f sitemap.xml ]; then
            echo "Sitemap found:"
            wc -l sitemap.xml
            head -20 sitemap.xml
          else
            echo "ERROR: sitemap.xml was not generated."
            exit 1
          fi

      - name: Submit sitemap to Google
        run: |
          curl -L -s \
            "https://www.google.com/ping?sitemap=https://letsstudy.pro/sitemap.xml" \
            -o /tmp/google-response.txt

          echo "Google sitemap notification sent."

      - name: Submit sitemap to Bing
        run: |
          curl -L -s \
            "https://www.bing.com/ping?sitemap=https://letsstudy.pro/sitemap.xml" \
            -o /tmp/bing-response.txt

          echo "Bing sitemap notification sent."

      - name: Check sitemap URL
        run: |
          curl -I -L --fail \
            "https://letsstudy.pro/sitemap.xml"

      - name: Commit updated sitemap
        run: |
          git config user.name "LetsStudy Pro"
          git config user.email "support@letsstudy.pro"

          git add sitemap.xml sitemap*.xml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No sitemap changes."
          else
            git commit -m "chore: update sitemap"
            git push origin main
          fi