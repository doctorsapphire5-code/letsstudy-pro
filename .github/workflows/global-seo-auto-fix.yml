name: LetsStudy Pro - Global SEO Auto Fix

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  seo-auto-fix:
    name: Global SEO Auto Fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start SEO Job
        run: |
          echo "======================================"
          echo "LetsStudy Pro Global SEO"
          echo "======================================"
          echo "SEO job started successfully."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "======================================"

      - name: Scan HTML Pages
        shell: bash
        run: |
          echo "Scanning HTML pages..."

          COUNT=$(find . \
            -type f \
            -name "*.html" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            | wc -l)

          echo "HTML pages found: $COUNT"

      - name: Check Sitemap
        run: |
          if [ -f sitemap.xml ]; then
            echo "sitemap.xml exists."
          else
            echo "sitemap.xml not found."
          fi

      - name: Check Robots
        run: |
          if [ -f robots.txt ]; then
            echo "robots.txt exists."
          else
            echo "robots.txt not found."
          fi

      - name: Finish
        run: |
          echo "======================================"
          echo "GLOBAL SEO JOB COMPLETED"
          echo "======================================"