name: LetsStudy Pro - IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.htm"

  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what to submit"
        required: true
        default: "changed"
        type: choice
        options:
          - changed
          - all

jobs:
  indexnow:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create changed URL list
        if: github.event_name == 'push' || github.event.inputs.mode == 'changed'
        shell: bash
        run: |
          set -e

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1)"
          fi

          > changed-urls.txt

          git diff --name-status "$BEFORE" "$AFTER" -- \
            '*.html' '*.htm' |
          while IFS=$'\t' read -r STATUS FILE; do

            [ -z "$FILE" ] && continue

            case "$FILE" in
              *.html|*.htm)

                # Remove leading ./ if present
                FILE="${FILE#./}"

                # Convert file path to HTTPS URL
                echo "https://letsstudy.pro/${FILE}" >> changed-urls.txt

                ;;
            esac

          done

          # Remove duplicates
          sort -u changed-urls.txt -o changed-urls.txt

          echo "URLs detected:"
          cat changed-urls.txt

          if [ ! -s changed-urls.txt ]; then
            echo "No HTML pages changed."
            exit 0
          fi

      - name: Submit changed URLs
        if: github.event_name == 'push' || github.event.inputs.mode == 'changed'
        shell: bash
        run: |
          set -e

          node scripts/indexnow-submit.js \
            --file changed-urls.txt

      - name: Submit all important URLs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'all'
        shell: bash
        run: |
          set -e

          if [ ! -f "indexnow/urls.txt" ]; then
            echo "indexnow/urls.txt was not found."
            exit 1
          fi

          node scripts/indexnow-submit.js \
            --file indexnow/urls.txt