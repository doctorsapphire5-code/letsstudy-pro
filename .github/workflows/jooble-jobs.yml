name: Jooble Jobs Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  fetch-jooble-jobs:
    name: Fetch Jooble Jobs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Jooble API Key
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          echo "Checking Jooble API key..."

          if [ -z "$JOOBLE_API_KEY" ]; then
            echo "::error::JOOBLE_API_KEY secret is missing."
            echo "Go to:"
            echo "Settings -> Secrets and variables -> Actions"
            echo "and create JOOBLE_API_KEY."
            exit 1
          fi

          echo "Jooble API key detected."
          echo "Key length: ${#JOOBLE_API_KEY}"

      - name: Create directories
        run: |
          mkdir -p scripts
          mkdir -p data

      - name: Create Jooble fetch script
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          cat > scripts/jooble-fetch.js <<'EOF'
          const fs = require("fs");

          const API_KEY = process.env.JOOBLE_API_KEY;

          if (!API_KEY) {
            console.error("ERROR: JOOBLE_API_KEY is missing.");
            process.exit(1);
          }

          const API_URL = `https://jooble.org/api/${API_KEY}`;

          const searches = [
            {
              keywords: "jobs",
              location: "Tanzania"
            },
            {
              keywords: "jobs",
              location: "Dar es Salaam"
            },
            {
              keywords: "remote jobs",
              location: "Tanzania"
            },
            {
              keywords: "freelance jobs",
              location: "Tanzania"
            },
            {
              keywords: "internships",
              location: "Tanzania"
            }
          ];

          async function fetchJobs(search) {
            console.log(
              `Request: ${search.keywords} | ${search.location}`
            );

            const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
              },
              body: JSON.stringify({
                keywords: search.keywords,
                location: search.location,
                page: 1,
                ResultOnPage: 50
              })
            });

            const text = await response.text();

            console.log(
              `HTTP ${response.status} ${response.statusText}`
            );

            if (!response.ok) {
              throw new Error(
                `Jooble API returned HTTP ${response.status}: ${text.slice(0, 500)}`
              );
            }

            let data;

            try {
              data = JSON.parse(text);
            } catch {
              throw new Error(
                `Jooble returned invalid JSON: ${text.slice(0, 500)}`
              );
            }

            return data;
          }

          async function main() {
            const jobs = [];
            const seen = new Set();
            let successfulRequests = 0;
            let failedRequests = 0;

            for (const search of searches) {
              try {
                const result = await fetchJobs(search);

                successfulRequests++;

                if (!Array.isArray(result.jobs)) {
                  console.log(
                    "No jobs array returned for this search."
                  );
                  continue;
                }

                console.log(
                  `Jobs returned: ${result.jobs.length}`
                );

                for (const job of result.jobs) {
                  const id =
                    job.id ||
                    job.link ||
                    `${job.title || ""}-${job.company || ""}-${job.location || ""}`;

                  if (seen.has(id)) {
                    continue;
                  }

                  seen.add(id);

                  jobs.push({
                    id,
                    title: job.title || "",
                    company: job.company || "",
                    location: job.location || "",
                    salary: job.salary || "",
                    snippet: job.snippet || "",
                    link: job.link || "",
                    type: job.type || "",
                    source: "Jooble"
                  });
                }

              } catch (error) {
                failedRequests++;

                console.error(
                  `FAILED: ${search.keywords} - ${search.location}`
                );

                console.error(error.message);
              }
            }

            /*
             * If every API request failed,
             * fail the workflow instead of creating fake/empty data.
             */
            if (
              successfulRequests === 0 &&
              failedRequests > 0
            ) {
              throw new Error(
                "All Jooble API requests failed. Check JOOBLE_API_KEY and Jooble API access."
              );
            }

            const output = {
              source: "Jooble",
              updatedAt: new Date().toISOString(),
              total: jobs.length,
              successfulRequests,
              failedRequests,
              jobs
            };

            fs.writeFileSync(
              "data/jooble-jobs.json",
              JSON.stringify(output, null, 2),
              "utf8"
            );

            console.log("");
            console.log("================================");
            console.log("JOOBLE SYNC COMPLETE");
            console.log("================================");
            console.log(`Successful requests: ${successfulRequests}`);
            console.log(`Failed requests: ${failedRequests}`);
            console.log(`Total unique jobs: ${jobs.length}`);
          }

          main().catch(error => {
            console.error("");
            console.error("================================");
            console.error("JOOBLE SYNC FAILED");
            console.error("================================");
            console.error(error.message);
            process.exit(1);
          });
          EOF

          echo "Jooble script created."

      - name: Verify script
        run: |
          test -f scripts/jooble-fetch.js

          echo "Script exists:"
          ls -lh scripts/jooble-fetch.js

      - name: Test Node.js
        run: |
          node --version
          node --check scripts/jooble-fetch.js

      - name: Fetch jobs from Jooble
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          node scripts/jooble-fetch.js

      - name: Validate generated JSON
        run: |
          if [ ! -f data/jooble-jobs.json ]; then
            echo "::error::data/jooble-jobs.json was not created."
            exit 1
          fi

          node - <<'NODE'
          const fs = require("fs");

          const file = "data/jooble-jobs.json";

          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          if (!Array.isArray(data.jobs)) {
            throw new Error("jobs is not an array");
          }

          console.log("================================");
          console.log("JOOBLE DATA VALID");
          console.log("================================");
          console.log("Jobs:", data.jobs.length);
          console.log("Updated:", data.updatedAt);
          console.log("Successful requests:", data.successfulRequests);
          console.log("Failed requests:", data.failedRequests);
          NODE

      - name: Show job count
        run: |
          node - <<'NODE'
          const data = require("./data/jooble-jobs.json");

          console.log("");
          console.log("================================");
          console.log("JOBS READY FOR LETSSTUDY PRO");
          console.log("================================");
          console.log(`Total jobs: ${data.jobs.length}`);
          NODE

      - name: Commit updated jobs
        run: |
          git config user.name "LetsStudy Pro Bot"
          git config user.email "actions@github.com"

          git add data/jooble-jobs.json

          if git diff --cached --quiet; then
            echo "No job data changes."
            exit 0
          fi

          git commit -m "chore(jobs): update Jooble jobs [skip ci]"

      - name: Push updated jobs
        run: |
          git push origin HEAD:main