name: Jooble Jobs Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  fetch-jooble-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Jooble API Key
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          if [ -z "$JOOBLE_API_KEY" ]; then
            echo "ERROR: JOOBLE_API_KEY secret is missing."
            exit 1
          fi

          echo "Jooble API key detected."
          echo "Key length: ${#JOOBLE_API_KEY}"

      - name: Create directories
        run: |
          mkdir -p scripts
          mkdir -p data

      - name: Create Jooble fetch script
        run: |
          cat > scripts/jooble-fetch.js <<'EOF'
          const fs = require("fs");

          const API_KEY = process.env.JOOBLE_API_KEY;

          if (!API_KEY) {
            console.error("ERROR: JOOBLE_API_KEY is missing.");
            process.exit(1);
          }

          const API_URL = `https://jooble.org/api/${API_KEY}`;

          const searches = [
            {
              keywords: "jobs",
              location: "Tanzania"
            },
            {
              keywords: "jobs",
              location: "Dar es Salaam"
            },
            {
              keywords: "remote jobs",
              location: "Tanzania"
            },
            {
              keywords: "freelance jobs",
              location: "Tanzania"
            },
            {
              keywords: "internships",
              location: "Tanzania"
            }
          ];

          async function fetchJobs(search) {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                keywords: search.keywords,
                location: search.location
              })
            });

            if (!response.ok) {
              throw new Error(
                `Jooble API error ${response.status}: ${response.statusText}`
              );
            }

            return response.json();
          }

          async function main() {
            const jobs = [];
            const seen = new Set();

            for (const search of searches) {
              console.log(
                `Fetching ${search.keywords} - ${search.location}`
              );

              try {
                const result = await fetchJobs(search);

                if (!Array.isArray(result.jobs)) {
                  console.log("No jobs returned.");
                  continue;
                }

                for (const job of result.jobs) {
                  const id =
                    job.id ||
                    job.link ||
                    `${job.title || ""}-${job.company || ""}-${job.location || ""}`;

                  if (seen.has(id)) {
                    continue;
                  }

                  seen.add(id);

                  jobs.push({
                    id,
                    title: job.title || "",
                    company: job.company || "",
                    location: job.location || "",
                    salary: job.salary || "",
                    snippet: job.snippet || "",
                    link: job.link || "",
                    type: job.type || "",
                    source: "Jooble"
                  });
                }
              } catch (error) {
                console.error(
                  `Search failed: ${error.message}`
                );
              }
            }

            const output = {
              source: "Jooble",
              updatedAt: new Date().toISOString(),
              total: jobs.length,
              jobs
            };

            fs.writeFileSync(
              "data/jooble-jobs.json",
              JSON.stringify(output, null, 2),
              "utf8"
            );

            console.log(
              `Saved ${jobs.length} Jooble jobs.`
            );
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

          echo "Jooble fetch script created successfully."

      - name: Verify fetch script
        run: |
          if [ ! -f scripts/jooble-fetch.js ]; then
            echo "ERROR: Failed to create scripts/jooble-fetch.js"
            exit 1
          fi

          echo "Fetch script found."
          ls -lh scripts/jooble-fetch.js

      - name: Fetch jobs from Jooble
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          node scripts/jooble-fetch.js

      - name: Validate jobs file
        run: |
          if [ ! -f data/jooble-jobs.json ]; then
            echo "ERROR: data/jooble-jobs.json was not created."
            exit 1
          fi

          node - <<'NODE'
          const fs = require("fs");

          const file = "data/jooble-jobs.json";

          let data;

          try {
            data = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          } catch (error) {
            console.error(
              "ERROR: Invalid JSON:",
              error.message
            );
            process.exit(1);
          }

          if (!Array.isArray(data.jobs)) {
            console.error("ERROR: jobs must be an array.");
            process.exit(1);
          }

          console.log("Jooble jobs:", data.jobs.length);
          console.log(
            "Updated:",
            data.updatedAt || "N/A"
          );
          NODE

      - name: Show generated jobs
        run: |
          echo "Jooble jobs file:"
          wc -c data/jooble-jobs.json
          head -c 1000 data/jooble-jobs.json
          echo

      - name: Commit updated jobs
        run: |
          git config user.name "LetsStudy Pro Bot"
          git config user.email "actions@github.com"

          git add data/jooble-jobs.json

          if git diff --cached --quiet; then
            echo "No job changes to commit."
          else
            git commit -m "Update Jooble jobs"
            git push
          fi