name: LetsStudy Pro - New Update Notifications

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  notifications:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT:
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            > firebase-service-account.json

      - name: Send new update notifications
        run: |
          npm run notifications

      - name: Remove Firebase credentials
        run: |
          rm -f firebase-service-account.json

      - name: Save notification state
        run: |
          git config user.name "LetsStudy Pro Bot"
          git config user.email "actions@github.com"

          git add notification-state.json

          git diff --cached --quiet || \
            git commit -m "Update notification state"

          git push