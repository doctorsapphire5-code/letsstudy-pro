name: LetsStudy Pro - Performance Check

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    name: Performance Check
    runs-on: ubuntu-latest

    steps:
      - name: Check LetsStudy Pro
        shell: bash
        run: |
          echo "======================================"
          echo " LetsStudy Pro Performance Check"
          echo "======================================"
          echo ""

          URL="https://letsstudy.pro/"

          START=$(date +%s%N)

          STATUS=$(curl \
            -L \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            --max-time 60 \
            "$URL" || true)

          END=$(date +%s%N)

          TIME_MS=$(( (END - START) / 1000000 ))

          echo "Website: $URL"
          echo "HTTP Status: $STATUS"
          echo "Response Time: ${TIME_MS} ms"
          echo ""

          if [ "$STATUS" = "200" ]; then
            echo "Website: ONLINE"
          else
            echo "WARNING: Website returned HTTP $STATUS"
          fi

          echo ""
          echo "Performance check completed."
          echo "This check is informational."
          echo "It will not block deployment."

          exit 0

      - name: Check important pages
        shell: bash
        run: |
          echo "Checking important pages..."
          echo ""

          for URL in \
            "https://letsstudy.pro/" \
            "https://letsstudy.pro/index-auth.html" \
            "https://letsstudy.pro/search.html" \
            "https://letsstudy.pro/robots.txt" \
            "https://letsstudy.pro/sitemap.xml"
          do

            STATUS=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 30 \
              "$URL" || true)

            echo "$STATUS  $URL"

          done

          echo ""
          echo "Page monitoring completed."
          exit 0

      - name: Final report
        run: |
          echo ""
          echo "======================================"
          echo " PERFORMANCE CHECK COMPLETED"
          echo "======================================"
          echo ""
          echo "LetsStudy Pro performance monitoring is active."
          echo "======================================"

          exit 0