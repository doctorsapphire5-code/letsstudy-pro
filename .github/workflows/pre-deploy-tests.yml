name: LetsStudy Pro - Pre-Deploy Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-deploy-tests:
    name: Pre-Deploy Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Repository
        shell: bash
        run: |
          echo "======================================"
          echo " LETSSTUDY PRO PRE-DEPLOY TESTS"
          echo "======================================"
          echo ""

          echo "Repository checked successfully."
          echo "Branch: $GITHUB_REF_NAME"
          echo ""

      - name: Check Firebase Configuration
        shell: bash
        run: |
          echo "Checking Firebase configuration..."

          if [ -f "firebase.json" ]; then
            echo "PASS: firebase.json exists"
          else
            echo "WARNING: firebase.json not found"
          fi

          if [ -f ".firebaserc" ]; then
            echo "PASS: .firebaserc exists"
          else
            echo "WARNING: .firebaserc not found"
          fi

          echo ""

      - name: Check Website Files
        shell: bash
        run: |
          echo "Checking important website files..."

          for FILE in \
            "index-auth.html" \
            "search.html" \
            "robots.txt" \
            "sitemap.xml"
          do
            if [ -f "$FILE" ]; then
              SIZE=$(wc -c < "$FILE")

              if [ "$SIZE" -gt 0 ]; then
                echo "PASS: $FILE"
              else
                echo "WARNING: $FILE is empty"
              fi
            else
              echo "WARNING: $FILE not found"
            fi
          done

          echo ""

      - name: Check HTML
        shell: bash
        run: |
          echo "Checking HTML pages..."

          for FILE in index-auth.html search.html; do

            if [ ! -f "$FILE" ]; then
              echo "SKIP: $FILE not found"
              continue
            fi

            echo ""
            echo "Checking: $FILE"

            if grep -qi "<html" "$FILE"; then
              echo "PASS: <html>"
            else
              echo "WARNING: <html> not found"
            fi

            if grep -qi "<head" "$FILE"; then
              echo "PASS: <head>"
            else
              echo "WARNING: <head> not found"
            fi

            if grep -qi "<title" "$FILE"; then
              echo "PASS: <title>"
            else
              echo "WARNING: <title> not found"
            fi

            if grep -qi "</html>" "$FILE"; then
              echo "PASS: </html>"
            else
              echo "WARNING: </html> not found"
            fi

          done

          echo ""

      - name: Check SEO Files
        shell: bash
        run: |
          echo "Checking SEO configuration..."

          if [ -f "robots.txt" ]; then
            if grep -qi "sitemap" robots.txt; then
              echo "PASS: robots.txt contains sitemap"
            else
              echo "WARNING: robots.txt has no sitemap reference"
            fi
          else
            echo "WARNING: robots.txt not found"
          fi

          if [ -f "sitemap.xml" ]; then
            if grep -qi "<urlset" sitemap.xml; then
              echo "PASS: sitemap.xml contains urlset"
            else
              echo "WARNING: sitemap.xml has no urlset"
            fi
          else
            echo "WARNING: sitemap.xml not found"
          fi

          echo ""

      - name: Check Production URLs
        shell: bash
        run: |
          echo "Checking production website..."

          URL="https://letsstudy.pro/"

          STATUS=$(curl -L -s -o /dev/null \
            -w "%{http_code}" \
            --max-time 60 \
            "$URL" || true)

          echo "Website: $URL"
          echo "HTTP Status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "PASS: Website is online"
          else
            echo "WARNING: Website returned HTTP $STATUS"
          fi

          echo ""

      - name: Check Local Development URLs
        shell: bash
        run: |
          echo "Scanning for localhost references..."

          FOUND=0

          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            "localhost|127\.0\.0\.1" \
            . 2>/dev/null; then

            FOUND=1
          fi

          if [ "$FOUND" = "1" ]; then
            echo ""
            echo "WARNING: Local development URLs detected."
            echo "Review them before production deployment."
          else
            echo "PASS: No localhost references detected."
          fi

          echo ""

      - name: Check Package
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            echo "package.json found."

            node -e "
              const fs=require('fs');
              const p=JSON.parse(fs.readFileSync('package.json','utf8'));
              console.log('Package:', p.name || 'Unnamed');
              console.log('Version:', p.version || 'Unknown');
            "

            echo "PASS: package.json is valid"
          else
            echo "No package.json found."
            echo "Static website configuration detected."
          fi

          echo ""

      - name: Final Report
        shell: bash
        run: |
          echo "======================================"
          echo " PRE-DEPLOY TESTS COMPLETED"
          echo "======================================"
          echo ""
          echo "LetsStudy Pro checks completed."
          echo ""
          echo "Firebase configuration: CHECKED"
          echo "Website files: CHECKED"
          echo "HTML: CHECKED"
          echo "SEO files: CHECKED"
          echo "Production website: CHECKED"
          echo "Package configuration: CHECKED"
          echo ""
          echo "STATUS: PASS"
          echo "======================================"