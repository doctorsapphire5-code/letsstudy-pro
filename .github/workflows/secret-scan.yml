name: LetsStudy Pro - Secret Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan Repository for Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for dangerous files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " DANGEROUS FILE CHECK"
          echo "======================================"

          FAILED=0

          DANGEROUS_PATTERNS=(
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
            "service-account.json"
            "serviceAccount.json"
            "firebase-adminsdk-*.json"
          )

          for PATTERN in "${DANGEROUS_PATTERNS[@]}"; do
            if find . \
              -type f \
              -name "$PATTERN" \
              -not -path "./.git/*" \
              | grep -q .; then

              echo "ERROR: Dangerous file detected: $PATTERN"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "======================================"
            echo " SECRET FILE CHECK FAILED"
            echo "======================================"
            exit 1
          fi

          echo "No dangerous secret files detected."

      - name: Check common secret patterns
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " COMMON SECRET PATTERN CHECK"
          echo "======================================"

          FAILED=0

          PATTERNS=(
            "BEGIN PRIVATE KEY"
            "BEGIN RSA PRIVATE KEY"
            "BEGIN OPENSSH PRIVATE KEY"
            "firebase_admin_sdk"
            "serviceAccount"
            "client_secret"
            "api_key"
            "access_token"
            "refresh_token"
            "password="
            "secret_key"
          )

          for PATTERN in "${PATTERNS[@]}"; do

            if grep -RniE \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude="*.min.js" \
              "$PATTERN" . >/dev/null 2>&1; then

              echo "WARNING: Possible secret pattern detected: $PATTERN"
              FAILED=1
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Possible secrets were detected."
            echo "Review the affected files before deployment."
            exit 1
          fi

          echo "No common secret patterns detected."

      - name: Check Firebase token references
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " FIREBASE TOKEN CHECK"
          echo "======================================"

          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            "FIREBASE_TOKEN\s*=" . >/dev/null 2>&1; then

            echo "ERROR: FIREBASE_TOKEN appears to be hardcoded."
            echo "Use GitHub Actions Secrets instead."
            exit 1
          fi

          echo "Firebase token is not hardcoded."

      - name: Check GitHub Actions secrets usage
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " GITHUB SECRETS USAGE CHECK"
          echo "======================================"

          if grep -RniE \
            --include="*.yml" \
            --include="*.yaml" \
            "FIREBASE_TOKEN" \
            .github/workflows/ >/dev/null 2>&1; then

            echo "FIREBASE_TOKEN reference detected in GitHub Actions."
            echo "Make sure the actual value is stored in:"
            echo "GitHub → Settings → Secrets and variables → Actions"

          else

            echo "No FIREBASE_TOKEN reference found."

          fi

      - name: Secret scan complete
        run: |
          echo ""
          echo "======================================"
          echo " SECRET SCAN PASSED"
          echo "======================================"
          echo ""
          echo "No exposed secrets were detected."