name: LetsStudy Pro - Secrets Scanner

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 7 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Secrets
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo " LETSSTUDY PRO - SECRETS SCANNER"
          echo "======================================"
          echo ""

          REPORT="secrets-scan-report.md"
          JSON_REPORT="secrets-scan-report.json"

          touch "$REPORT"

          cat > "$REPORT" <<'EOF'
          # LetsStudy Pro - Secrets Scan Report

          This scan checks repository files for common credential and secret patterns.

          **Policy:** Informational only. This workflow does not block deployment.

          EOF

          echo "[" > "$JSON_REPORT"

          FIRST="true"
          FINDINGS=0

          scan_pattern() {
            NAME="$1"
            PATTERN="$2"

            RESULTS=$(grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=.github \
              --exclude="package-lock.json" \
              --exclude="yarn.lock" \
              --exclude="pnpm-lock.yaml" \
              "$PATTERN" . 2>/dev/null || true)

            if [ -n "$RESULTS" ]; then

              echo "Potential $NAME detected:"
              echo "$RESULTS"
              echo ""

              {
                echo "## $NAME"
                echo ""
                echo '```text'
                echo "$RESULTS" | sed -E \
                  's/(AIza[0-9A-Za-z_-]{20,})/[REDACTED]/g'
                echo '```'
                echo ""
              } >> "$REPORT"

              COUNT=$(printf "%s\n" "$RESULTS" | wc -l)
              FINDINGS=$((FINDINGS + COUNT))

              if [ "$FIRST" != "true" ]; then
                echo "," >> "$JSON_REPORT"
              fi

              FIRST="false"

              python3 - "$NAME" "$RESULTS" >> "$JSON_REPORT" <<'PY'
          import sys
          import json
          import re

          name = sys.argv[1]
          results = sys.argv[2]

          redacted = re.sub(
              r'AIza[0-9A-Za-z_-]{20,}',
              '[REDACTED]',
              results
          )

          redacted = re.sub(
              r'(?i)(api[_-]?key|token|secret|password|authorization)'
              r'(\s*[:=]\s*)["\']?'
              r'[^"\'\s]+',
              r'\1\2[REDACTED]',
              redacted
          )

          print(json.dumps({
              "type": name,
              "matches": redacted.splitlines()
          }))
          PY

            else
              echo "No $NAME pattern detected."
            fi
          }

          echo "Scanning..."

          scan_pattern \
            "Google API Key" \
            'AIza[0-9A-Za-z_-]{20,}'

          scan_pattern \
            "Generic API Key" \
            '(api[_-]?key|apikey)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{12,}'

          scan_pattern \
            "Access Token" \
            '(access[_-]?token|auth[_-]?token)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{12,}'

          scan_pattern \
            "Secret Key" \
            '(secret[_-]?key|secretkey)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{12,}'

          scan_pattern \
            "Password" \
            '(password|passwd|pwd)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{6,}'

          scan_pattern \
            "Firebase Private Key" \
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'

          scan_pattern \
            "AWS Access Key" \
            'AKIA[0-9A-Z]{16}'

          scan_pattern \
            "GitHub Token" \
            'gh[pousr]_[A-Za-z0-9_]{20,}'

          scan_pattern \
            "GitHub Classic Token" \
            'ghp_[A-Za-z0-9]{20,}'

          scan_pattern \
            "Slack Token" \
            'xox[baprs]-[A-Za-z0-9-]{10,}'

          scan_pattern \
            "Bearer Token" \
            'Bearer[[:space:]]+[A-Za-z0-9._-]{20,}'

          scan_pattern \
            "Private Credential File" \
            'service[_-]?account.*\.json|credentials.*\.json'

          scan_pattern \
            "Environment Secret Assignment" \
            '(GEMINI_API_KEY|OPENAI_API_KEY|FIREBASE_TOKEN|WHATSAPP_ACCESS_TOKEN)[[:space:]]*='

          echo "]" >> "$JSON_REPORT"

          python3 - "$JSON_REPORT" "$FINDINGS" >> /tmp/summary.tmp <<'PY'
          import json
          import sys

          filename = sys.argv[1]
          findings = int(sys.argv[2])

          try:
              with open(
                  filename,
                  "r",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)
          except Exception:
              data = []

          report = {
              "website": "https://letsstudy.pro",
              "project": "LetsStudy Pro",
              "findings": findings,
              "status": (
                  "REVIEW REQUIRED"
                  if findings > 0
                  else "NO POTENTIAL SECRETS DETECTED"
              ),
              "deployment_blocked": False,
              "scan_results": data
          }

          with open(
              "secrets-scan-report.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
          PY

          cat /tmp/summary.tmp

          echo "" >> "$REPORT"
          echo "## Result" >> "$REPORT"
          echo "" >> "$REPORT"

          if [ "$FINDINGS" -gt 0 ]; then
            echo "**Potential secret findings:** $FINDINGS" >> "$REPORT"
            echo "" >> "$REPORT"
            echo "Review the listed files and remove real credentials from the repository." >> "$REPORT"
            echo "" >> "$REPORT"
            echo "If a real credential was exposed, rotate/revoke it immediately." >> "$REPORT"
          else
            echo "**Potential secret findings:** 0" >> "$REPORT"
            echo "" >> "$REPORT"
            echo "No matching secret patterns were detected." >> "$REPORT"
          fi

          echo "" >> "$REPORT"
          echo "## Important" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "This scanner uses pattern matching and may produce false positives." >> "$REPORT"
          echo "It does not prove that a detected value is an active secret." >> "$REPORT"
          echo "This workflow is informational and does not block deployment." >> "$REPORT"

          echo ""
          echo "======================================"
          echo " SECRETS SCAN SUMMARY"
          echo "======================================"
          echo "Potential findings: $FINDINGS"
          echo ""

          if [ "$FINDINGS" -gt 0 ]; then
            echo "STATUS: REVIEW REQUIRED"
          else
            echo "STATUS: CLEAN"
          fi

          echo ""
          echo "Deployment blocking: NO"
          echo "======================================"

          exit 0

      - name: Upload Secrets Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: letsstudy-pro-secrets-scan
          path: |
            secrets-scan-report.md
            secrets-scan-report.json
          if-no-files-found: warn