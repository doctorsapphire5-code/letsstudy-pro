name: LetsStudy Pro - SEO Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-validation:
    name: Validate SEO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -e

          echo "======================================"
          echo " LetsStudy Pro SEO Validation"
          echo "======================================"

          echo ""
          echo "Checking required files..."

          test -f robots.txt || {
            echo "ERROR: robots.txt is missing."
            exit 1
          }

          echo "OK: robots.txt"

          if [ -f sitemap.xml ]; then
            echo "OK: sitemap.xml"
          else
            echo "INFO: sitemap.xml is not in repository."
            echo "It may be generated automatically by the indexing workflow."
          fi

          if [ -f index-auth.html ]; then
            echo "OK: index-auth.html"
          else
            echo "WARNING: index-auth.html not found."
          fi

      - name: Validate robots.txt
        run: |
          set -e

          echo ""
          echo "Checking robots.txt..."

          grep -qi "User-agent:" robots.txt || {
            echo "ERROR: robots.txt has no User-agent directive."
            exit 1
          }

          grep -qi "Sitemap:" robots.txt || {
            echo "ERROR: robots.txt has no Sitemap directive."
            exit 1
          }

          echo "OK: User-agent directive"
          echo "OK: Sitemap directive"

          if grep -qi "https://letsstudy.pro/sitemap.xml" robots.txt; then
            echo "OK: LetsStudy Pro sitemap URL"
          else
            echo "WARNING: Expected sitemap URL not found:"
            echo "https://letsstudy.pro/sitemap.xml"
          fi

      - name: Check HTML titles
        shell: bash
        run: |
          set -e

          echo ""
          echo "Checking HTML page titles..."

          TOTAL=0
          MISSING=0

          while IFS= read -r -d '' file; do
            TOTAL=$((TOTAL + 1))

            if grep -qi "<title" "$file"; then
              echo "OK: $file"
            else
              echo "WARNING: Missing <title>: $file"
              MISSING=$((MISSING + 1))
            fi

          done < <(
            find . \
              -type f \
              -name "*.html" \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -print0
          )

          echo ""
          echo "HTML files checked: $TOTAL"
          echo "Pages missing title: $MISSING"

          echo ""
          echo "Title validation completed."

      - name: Check meta descriptions
        shell: bash
        run: |
          set -e

          echo ""
          echo "Checking meta descriptions..."

          TOTAL=0
          MISSING=0

          while IFS= read -r -d '' file; do
            TOTAL=$((TOTAL + 1))

            if grep -qiE \
              '<meta[^>]+name=["'\'']description["'\'']' \
              "$file"; then

              echo "OK: $file"

            else
              echo "WARNING: Missing meta description: $file"
              MISSING=$((MISSING + 1))
            fi

          done < <(
            find . \
              -type f \
              -name "*.html" \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -print0
          )

          echo ""
          echo "HTML files checked: $TOTAL"
          echo "Pages missing description: $MISSING"

          echo ""
          echo "Meta description validation completed."

      - name: Check canonical URLs
        shell: bash
        run: |
          set -e

          echo ""
          echo "Checking canonical tags..."

          TOTAL=0
          MISSING=0

          while IFS= read -r -d '' file; do
            TOTAL=$((TOTAL + 1))

            if grep -qiE \
              'rel=["'\'']canonical["'\'']' \
              "$file"; then

              echo "OK: $file"

            else
              echo "WARNING: Missing canonical: $file"
              MISSING=$((MISSING + 1))
            fi

          done < <(
            find . \
              -type f \
              -name "*.html" \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -print0
          )

          echo ""
          echo "HTML files checked: $TOTAL"
          echo "Pages missing canonical: $MISSING"

          echo ""
          echo "Canonical validation completed."

      - name: Validate main canonical
        run: |
          set -e

          echo ""
          echo "Checking main LetsStudy Pro canonical..."

          if [ -f index-auth.html ]; then

            if grep -qi \
              'https://letsstudy.pro/index-auth.html' \
              index-auth.html; then

              echo "OK: index-auth.html canonical"

            else

              echo "WARNING: index-auth.html does not contain:"
              echo "https://letsstudy.pro/index-auth.html"

            fi

          else

            echo "INFO: index-auth.html not found."
          fi

      - name: Check sitemap
        shell: bash
        run: |
          set -e

          echo ""
          echo "Checking sitemap..."

          if [ ! -f sitemap.xml ]; then
            echo "INFO: sitemap.xml is not currently in repository."
            echo "Skipping local sitemap validation."
            exit 0
          fi

          if ! grep -q \
            "http://www.sitemaps.org/schemas/sitemap/0.9" \
            sitemap.xml; then

            echo "WARNING: Sitemap namespace not detected."
          else
            echo "OK: Sitemap namespace"
          fi

          if grep -q \
            "localhost\|127.0.0.1" \
            sitemap.xml; then

            echo "WARNING: Development URL detected in sitemap."
          else
            echo "OK: No localhost URLs in sitemap."
          fi

          if grep -q \
            "http://letsstudy.pro" \
            sitemap.xml; then

            echo "WARNING: HTTP LetsStudy Pro URL detected."
          else
            echo "OK: No HTTP LetsStudy Pro URLs."
          fi

          echo ""
          echo "Sitemap validation completed."

      - name: SEO validation completed
        run: |
          echo ""
          echo "======================================"
          echo " LetsStudy Pro SEO Validation PASSED"
          echo "======================================"
          echo ""
          echo "Checked:"
          echo "✓ Required files"
          echo "✓ robots.txt"
          echo "✓ HTML titles"
          echo "✓ Meta descriptions"
          echo "✓ Canonical tags"
          echo "✓ Main canonical"
          echo "✓ Sitemap"
          echo ""
          echo "Warnings do not block deployment."