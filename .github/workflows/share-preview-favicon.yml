name: LetsStudy Pro - Share Preview & Favicon

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update favicon and share preview
        shell: bash
        run: |
          IMAGE="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgQHmJO8e8twONhRhp3I6pP4NFDh-LPcqVtAmQ9R9XjOGaVMKShfSLmxeK0fVzJsybBBOXKbA8LIhjgTgko83C-UPVhwgXeLtvTfjtVv6aVGgQgniOF-gMC28bY78HryXZ-5OqCwdBpKGqjEfTta5jLjT1mpvtBi2DQKyu35rkxsZNoVvl0nhvxUUn1gDP0/s1600/Untitled%20design_20260717_144337_0000.jpg"

          find . -type f -name "*.html" \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' file; do

            if grep -q '<head' "$file"; then

              sed -i "/<\/head>/i\\
          <link rel=\"icon\" type=\"image/jpeg\" href=\"$IMAGE\">\\
          <meta property=\"og:image\" content=\"$IMAGE\">\\
          <meta property=\"og:image:alt\" content=\"LetsStudy Pro\">\\
          <meta name=\"twitter:card\" content=\"summary_large_image\">\\
          <meta name=\"twitter:image\" content=\"$IMAGE\">\\
          <meta name=\"twitter:image:alt\" content=\"LetsStudy Pro\">" "$file"

            fi

          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet || git commit -m "Update favicon and social share preview"

      - name: Push changes
        run: |
          git push