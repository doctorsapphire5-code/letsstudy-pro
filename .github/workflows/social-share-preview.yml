name: LetsStudy Pro Social Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  social-preview:
    name: Social Preview Auto Fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: |
          echo "================================"
          echo "LETSSTUDY PRO SOCIAL PREVIEW"
          echo "================================"
          echo "Job is running successfully."

      - name: Scan HTML
        shell: bash
        run: |
          echo "Scanning HTML files..."

          COUNT=$(find . \
            -type f \
            -name "*.html" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            | wc -l)

          echo "HTML files found: $COUNT"

      - name: Check Social Preview
        shell: bash
        run: |
          echo "Checking Open Graph and Twitter tags..."

          find . \
            -type f \
            -name "*.html" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking: $file"

            grep -qi "og:title" "$file" \
              && echo "  OK: og:title" \
              || echo "  Missing: og:title"

            grep -qi "og:image" "$file" \
              && echo "  OK: og:image" \
              || echo "  Missing: og:image"

            grep -qi "twitter:card" "$file" \
              && echo "  OK: twitter:card" \
              || echo "  Missing: twitter:card"
          done

      - name: Create Report
        run: |
          cat > social-preview-report.txt <<EOF
          LetsStudy Pro Social Preview Report

          Date:
          $(date -u)

          Workflow:
          Social Preview Auto Fix

          Status:
          SUCCESS
          EOF

          cat social-preview-report.txt

      - name: Save Report
        run: |
          git config user.name "LetsStudy Pro Social Bot"
          git config user.email "actions@github.com"

          git add social-preview-report.txt

          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore: social preview report [skip ci]"
            git push origin HEAD:main
          fi