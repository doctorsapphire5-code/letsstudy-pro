name: LetsStudy Pro - Social Preview Auto Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: write

concurrency:
  group: social-preview-auto-fix
  cancel-in-progress: false

jobs:
  social-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Social Preview Engine
        shell: bash
        run: |
          mkdir -p .github/scripts

          cat > .github/scripts/social-preview-auto-fix.mjs <<'EOF'
          import fs from "fs";
          import path from "path";

          const ROOT = process.cwd();

          const ignored = [
            ".git",
            ".github",
            "node_modules",
            "functions",
            "admin",
            "private",
            "test",
            "tests"
          ];

          const changed = [];
          const issues = [];

          function ignoredPath(file) {
            return ignored.some(dir =>
              file.split(path.sep).includes(dir)
            );
          }

          function scan(dir, results = []) {
            for (const item of fs.readdirSync(dir)) {
              const full = path.join(dir, item);

              if (ignoredPath(full)) continue;

              const stat = fs.statSync(full);

              if (stat.isDirectory()) {
                scan(full, results);
              } else if (
                stat.isFile() &&
                item.endsWith(".html")
              ) {
                results.push(full);
              }
            }

            return results;
          }

          function getMeta(html, property) {
            const regex = new RegExp(
              `<meta[^>]+property=["']${property}["'][^>]*>`,
              "i"
            );

            return regex.test(html);
          }

          function getNameMeta(html, name) {
            const regex = new RegExp(
              `<meta[^>]+name=["']${name}["'][^>]*>`,
              "i"
            );

            return regex.test(html);
          }

          function getTitle(html) {
            const match = html.match(
              /<title[^>]*>([\s\S]*?)<\/title>/i
            );

            return match
              ? match[1].replace(/\s+/g, " ").trim()
              : "LetsStudy Pro - Global Digital Learning & Growth Ecosystem";
          }

          function getDescription(html) {
            const match = html.match(
              /<meta[^>]+name=["']description["'][^>]+content=["']([^"']*)["'][^>]*>/i
            );

            return match
              ? match[1].trim()
              : "Learn, Build, Work and Grow with LetsStudy Pro — a global digital learning and growth ecosystem.";
          }

          function escapeAttr(value) {
            return value
              .replace(/&/g, "&amp;")
              .replace(/"/g, "&quot;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
          }

          function replaceOrAddProperty(html, property, content) {
            const escaped = escapeAttr(content);

            const regex = new RegExp(
              `<meta[^>]+property=["']${property}["'][^>]*>`,
              "i"
            );

            const tag =
              `<meta property="${property}" content="${escaped}">`;

            if (regex.test(html)) {
              return html.replace(regex, tag);
            }

            return html.replace(
              /<\/head>/i,
              `  ${tag}\n</head>`
            );
          }

          function replaceOrAddName(html, name, content) {
            const escaped = escapeAttr(content);

            const regex = new RegExp(
              `<meta[^>]+name=["']${name}["'][^>]*>`,
              "i"
            );

            const tag =
              `<meta name="${name}" content="${escaped}">`;

            if (regex.test(html)) {
              return html.replace(regex, tag);
            }

            return html.replace(
              /<\/head>/i,
              `  ${tag}\n</head>`
            );
          }

          const files = scan(ROOT);

          for (const file of files) {
            const relative = path.relative(ROOT, file);

            let html = fs.readFileSync(file, "utf8");
            const original = html;

            if (!/<head\b/i.test(html)) {
              issues.push(`${relative}: missing <head>`);
              continue;
            }

            const title = getTitle(html);
            const description = getDescription(html);

            const absoluteUrl =
              relative === "index.html"
                ? "https://letsstudy.pro/"
                : `https://letsstudy.pro/${relative.replace(/\\/g, "/")}`;

            const image =
              "https://letsstudy.pro/assets/images/social-preview.jpg";

            const type =
              relative.includes("blog") ||
              relative.includes("article") ||
              relative.includes("announcement")
                ? "article"
                : "website";

            /*
             * Open Graph
             */
            html = replaceOrAddProperty(
              html,
              "og:type",
              type
            );

            html = replaceOrAddProperty(
              html,
              "og:site_name",
              "LetsStudy Pro"
            );

            html = replaceOrAddProperty(
              html,
              "og:title",
              title
            );

            html = replaceOrAddProperty(
              html,
              "og:description",
              description
            );

            html = replaceOrAddProperty(
              html,
              "og:url",
              absoluteUrl
            );

            html = replaceOrAddProperty(
              html,
              "og:image",
              image
            );

            html = replaceOrAddProperty(
              html,
              "og:image:alt",
              title
            );

            html = replaceOrAddProperty(
              html,
              "og:image:type",
              "image/jpeg"
            );

            html = replaceOrAddProperty(
              html,
              "og:image:width",
              "1200"
            );

            html = replaceOrAddProperty(
              html,
              "og:image:height",
              "630"
            );

            /*
             * X / Twitter
             */
            html = replaceOrAddName(
              html,
              "twitter:card",
              "summary_large_image"
            );

            html = replaceOrAddName(
              html,
              "twitter:title",
              title
            );

            html = replaceOrAddName(
              html,
              "twitter:description",
              description
            );

            html = replaceOrAddName(
              html,
              "twitter:image",
              image
            );

            html = replaceOrAddName(
              html,
              "twitter:image:alt",
              title
            );

            if (html !== original) {
              fs.writeFileSync(file, html, "utf8");
              changed.push(relative);
            }
          }

          const report = `
          LETSSTUDY PRO SOCIAL PREVIEW REPORT
          ===================================

          Generated:
          ${new Date().toISOString()}

          HTML PAGES SCANNED:
          ${files.length}

          PAGES UPDATED:
          ${changed.length}

          ISSUES:
          ${issues.length}

          CHANGED PAGES
          -------------
          ${changed.length ? changed.join("\n") : "None"}

          ISSUES
          ------
          ${issues.length ? issues.join("\n") : "None"}
          `;

          fs.writeFileSync(
            "social-preview-report.txt",
            report.trim() + "\n"
          );

          fs.writeFileSync(
            ".social-preview-changed.txt",
            changed.join("\n") +
            (changed.length ? "\n" : "")
          );

          console.log(report);
          EOF

      - name: Run Social Preview Auto Fix
        run: |
          node .github/scripts/social-preview-auto-fix.mjs

      - name: Validate Social Preview Tags
        shell: bash
        run: |
          echo "Checking social preview implementation..."

          FAILED=0

          while IFS= read -r file; do
            if grep -qi "<head" "$file"; then

              if ! grep -qi 'og:title' "$file"; then
                echo "Missing og:title: $file"
                FAILED=1
              fi

              if ! grep -qi 'og:description' "$file"; then
                echo "Missing og:description: $file"
                FAILED=1
              fi

              if ! grep -qi 'og:image' "$file"; then
                echo "Missing og:image: $file"
                FAILED=1
              fi

              if ! grep -qi 'twitter:card' "$file"; then
                echo "Missing twitter:card: $file"
                FAILED=1
              fi

            fi
          done < <(
            find . \
              -type f \
              -name "*.html" \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -not -path "./.github/*"
          )

          if [ "$FAILED" -eq 1 ]; then
            echo "Social preview validation found issues."
          else
            echo "Social preview validation passed."
          fi

      - name: Display Social Preview Report
        run: |
          echo "=========================================="
          echo "LETSTUDY PRO SOCIAL PREVIEW"
          echo "=========================================="

          cat social-preview-report.txt

      - name: Check Git Changes
        run: |
          echo "=========================================="
          echo "GIT STATUS"
          echo "=========================================="

          git status --short

      - name: Commit Social Preview