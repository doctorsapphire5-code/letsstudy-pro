<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Instructors | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:#111827;
 color:#fff;
 padding:16px 5%;
 font-size:18px;
 font-weight:700
}
main{
 max-width:1100px;
 margin:auto;
 padding:20px
}
.card,.item{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:16px;
 margin-bottom:15px
}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px
}
.stat{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:10px;
 padding:15px
}
.num{
 font-size:25px;
 font-weight:700;
 margin-top:5px
}
.form{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.full{grid-column:1/-1}
label{
 display:block;
 font-size:13px;
 font-weight:700;
 margin-bottom:4px
}
input,select,textarea{
 width:100%;
 padding:10px;
 border:1px solid #d1d5db;
 border-radius:7px;
 font-size:14px
}
textarea{min-height:80px}
button{
 border:0;
 border-radius:7px;
 padding:9px 12px;
 cursor:pointer
}
.blue{background:#2563eb;color:#fff}
.green{background:#16a34a;color:#fff}
.red{background:#dc2626;color:#fff}
.orange{background:#f59e0b;color:#fff}
.gray{background:#e5e7eb;color:#111827}
.toolbar{
 display:grid;
 grid-template-columns:2fr 1fr 1fr;
 gap:8px
}
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px
}
.item{
 margin:0
}
.avatar{
 width:65px;
 height:65px;
 border-radius:50%;
 object-fit:cover;
 background:#e5e7eb
}
.row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px
}
.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 margin:3px 2px
}
.active{
 background:#dcfce7;
 color:#166534
}
.inactive{
 background:#fee2e2;
 color:#991b1b
}
.actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin-top:12px
}
.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:10
}
.modalBox{
 background:#fff;
 width:min(700px,100%);
 max-height:90vh;
 overflow:auto;
 border-radius:12px;
 padding:20px
}
.course{
 border:1px solid #ddd;
 padding:10px;
 border-radius:8px;
 margin:8px 0
}
@media(max-width:750px){
 .stats,.grid{grid-template-columns:1fr 1fr}
 .form,.toolbar{grid-template-columns:1fr}
 .full{grid-column:auto}
}
@media(max-width:450px){
 .stats,.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
🎓 LetsStudy Pro — Admin Instructors
</header>

<main>

<h1>Instructor Management</h1>

<div class="stats">

<div class="stat">
Total Instructors
<div class="num" id="total">0</div>
</div>

<div class="stat">
Active
<div class="num" id="active">0</div>
</div>

<div class="stat">
Inactive
<div class="num" id="inactive">0</div>
</div>

<div class="stat">
Courses
<div class="num" id="courses">0</div>
</div>

</div>


<!-- ADD / EDIT -->

<div class="card">

<h2>➕ Add / Edit Instructor</h2>

<form id="form">

<input type="hidden" id="uid">

<div class="form">

<div>
<label>Full Name *</label>
<input id="displayName" required>
</div>

<div>
<label>Email *</label>
<input id="email" type="email" required>
</div>

<div>
<label>Phone</label>
<input id="phone">
</div>

<div>
<label>Country</label>
<input id="country" value="Tanzania">
</div>

<div>
<label>Language</label>
<input id="language" value="English">
</div>

<div>
<label>Status</label>
<select id="status">
<option value="active">Active</option>
<option value="inactive">Inactive</option>
<option value="suspended">Suspended</option>
</select>
</div>

<div>
<label>Education Level</label>
<input id="educationLevel">
</div>

<div>
<label>Specialization</label>
<input id="specialization"
placeholder="Programming, Biology, Business...">
</div>

<div>
<label>Instructor Level</label>
<select id="level">
<option>Instructor</option>
<option>Senior Instructor</option>
<option>Expert Instructor</option>
</select>
</div>

<div>
<label>Photo URL</label>
<input id="photoURL" type="url">
</div>

<div class="full">
<label>Bio</label>
<textarea id="bio"
placeholder="Instructor biography"></textarea>
</div>

<div class="full">
<label>Skills</label>
<input id="skills"
placeholder="JavaScript, Firebase, AI">
</div>

</div>

<br>

<button class="blue">
Save Instructor
</button>

<button
type="button"
class="gray"
onclick="clearForm()">
Clear
</button>

</form>

</div>


<!-- SEARCH -->

<div class="card">

<h2>🔎 Instructors</h2>

<div class="toolbar">

<input
id="search"
placeholder="Search instructor...">

<select id="filterStatus">
<option value="">All Status</option>
<option value="active">Active</option>
<option value="inactive">Inactive</option>
<option value="suspended">Suspended</option>
</select>

<select id="filterCountry">
<option value="">All Countries</option>
<option>Tanzania</option>
<option>Kenya</option>
<option>Uganda</option>
<option>Rwanda</option>
<option>Nigeria</option>
<option>Other</option>
</select>

</div>

</div>


<div id="list" class="grid">
Loading...
</div>

</main>


<!-- COURSES MODAL -->

<div class="modal" id="modal">

<div class="modalBox">

<div class="row">

<h2 id="modalTitle">
Instructor Courses
</h2>

<button
class="gray"
onclick="closeCourses()">
✕
</button>

</div>

<div id="courseList">
Loading...
</div>

</div>

</div>


<script type="module">

import {
 initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 query,
 where,
 serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

let instructors=[];

const $=id=>
document.getElementById(id);


function clean(x){

return String(x??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* LOAD INSTRUCTORS */

async function load(){

const snap=await getDocs(
collection(db,"users")
);

instructors=snap.docs
.map(d=>({
 uid:d.id,
 ...d.data()
}))
.filter(u=>
u.role==="instructor"
);

stats();

render();

}


/* STATS */

async function stats(){

$("total").textContent=
instructors.length;

$("active").textContent=
instructors.filter(
x=>x.status==="active"
).length;

$("inactive").textContent=
instructors.filter(
x=>x.status!=="active"
).length;


/* Count instructor courses */

const snap=await getDocs(
collection(db,"courses")
);

$("courses").textContent=
snap.size;

}


/* RENDER */

function render(){

const q=
$("search").value
.toLowerCase()
.trim();

const status=
$("filterStatus").value;

const country=
$("filterCountry").value;

const data=instructors.filter(i=>{

const text=[

i.displayName,
i.email,
i.specialization,
i.country,
i.bio,
(i.skills||[]).join(" ")

].join(" ").toLowerCase();

return(

(!q||text.includes(q))&&

(!status||i.status===status)&&

(!country||i.country===country)

);

});


if(!data.length){

$("list").innerHTML=
"<div class='card'>No instructors found.</div>";

return;

}


$("list").innerHTML=data.map(i=>`

<div class="item">

<div class="row">

<div>

${
i.photoURL
?
`<img class="avatar"
src="${clean(i.photoURL)}"
onerror="this.src='';">`
:
`<div class="avatar"></div>`
}

</div>

<div style="flex:1">

<h3>
${clean(i.displayName||"Unnamed Instructor")}
</h3>

<div>
${clean(i.email||"")}
</div>

<span class="badge ${
i.status==="active"
?"active":"inactive"
}">
${clean(i.status||"inactive")}
</span>

<span class="badge">
${clean(i.country||"")}
</span>

</div>

</div>


<p>
${clean(i.specialization||"Instructor")}
</p>

<p>
${clean(i.bio||"")}
</p>


<div class="actions">

<button
class="blue"
onclick="viewCourses('${i.uid}')">
📚 Courses
</button>

<button
class="gray"
onclick="edit('${i.uid}')">
✏ Edit
</button>

<button
class="orange"
onclick="toggleStatus('${i.uid}')">
${i.status==="active"
?"Deactivate"
:"Activate"}
</button>

<button
class="red"
onclick="removeInstructor('${i.uid}')">
🗑 Delete
</button>

</div>

</div>

`).join("");

}


/* SAVE */

$("form").onsubmit=async e=>{

e.preventDefault();

const uid=$("uid").value;

const data={

displayName:
$("displayName").value.trim(),

email:
$("email").value.trim(),

phone:
$("phone").value.trim(),

country:
$("country").value.trim(),

language:
$("language").value.trim(),

status:
$("status").value,

educationLevel:
$("educationLevel").value.trim(),

specialization:
$("specialization").value.trim(),

instructorLevel:
$("level").value,

photoURL:
$("photoURL").value.trim(),

bio:
$("bio").value.trim(),

skills:
$("skills").value
.split(",")
.map(x=>x.trim())
.filter(Boolean),

role:"instructor",

updatedAt:
serverTimestamp()

};


try{

if(uid){

await updateDoc(
doc(db,"users",uid),
data
);

alert("Instructor updated.");

}else{

await addDoc(
collection(db,"users"),
{

...data,

points:0,
level:1,
xp:0,
premium:false,

createdAt:
serverTimestamp(),

lastLoginAt:null

}
);

alert("Instructor created.");

}

clearForm();

await load();

}catch(error){

alert(error.message);

}

};


/* EDIT */

window.edit=uid=>{

const i=
instructors.find(x=>x.uid===uid);

if(!i)return;

$("uid").value=uid;

$("displayName").value=
i.displayName||"";

$("email").value=
i.email||"";

$("phone").value=
i.phone||"";

$("country").value=
i.country||"";

$("language").value=
i.language||"English";

$("status").value=
i.status||"active";

$("educationLevel").value=
i.educationLevel||"";

$("specialization").value=
i.specialization||"";

$("level").value=
i.instructorLevel||"Instructor";

$("photoURL").value=
i.photoURL||"";

$("bio").value=
i.bio||"";

$("skills").value=
(i.skills||[]).join(", ");

window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* CLEAR */

window.clearForm=()=>{

$("form").reset();

$("uid").value="";

$("country").value="Tanzania";

$("language").value="English";

};


/* STATUS */

window.toggleStatus=async uid=>{

const i=
instructors.find(x=>x.uid===uid);

if(!i)return;

const newStatus=
i.status==="active"
?"inactive"
:"active";

await updateDoc(
doc(db,"users",uid),
{
status:newStatus,
updatedAt:serverTimestamp()
}
);

load();

};


/* DELETE */

window.removeInstructor=async uid=>{

const i=
instructors.find(x=>x.uid===uid);

if(!confirm(
`Delete instructor "${i?.displayName||""}"?`
))return;

await deleteDoc(
doc(db,"users",uid)
);

load();

};


/* VIEW COURSES */

window.viewCourses=async uid=>{

const i=
instructors.find(x=>x.uid===uid);

$("modalTitle").textContent=
(i?.displayName||"Instructor")
+" — Courses";

$("modal").style.display="flex";

const snap=await getDocs(
query(
collection(db,"courses"),
where("instructorId","==",uid)
)
);

if(snap.empty){

$("courseList").innerHTML=
"<p>No courses assigned.</p>";

return;

}

$("courseList").innerHTML=
snap.docs.map(d=>{

const c=d.data();

return `

<div class="course">

<h3>${clean(c.title)}</h3>

<p>
${clean(c.categoryName||"")}
 ·
${clean(c.level||"")}
</p>

<p>
${clean(c.status||"draft")}
 ·
${c.enrollmentCount||0} enrollments
</p>

</div>

`;

}).join("");

};


/* CLOSE */

window.closeCourses=()=>{
$("modal").style.display="none";
};


/* FILTERS */

$("search").oninput=render;

$("filterStatus").onchange=render;

$("filterCountry").onchange=render;


/* START */

load();

</script>

</body>
</html>
