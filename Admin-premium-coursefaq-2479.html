<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Premium Course FAQ | LetsStudy Pro Admin</title>

<meta name="robots" content="noindex,nofollow">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  background:#111827;
  color:#fff;
  padding:15px 20px;
}

.nav{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#60a5fa;
}

.nav-links{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.nav-links a,
.logout{
  text-decoration:none;
  color:#fff;
  background:#1f2937;
  border:1px solid #374151;
  padding:9px 12px;
  border-radius:8px;
}

.logout{
  color:#fecaca;
}

.container{
  max-width:1250px;
  margin:30px auto;
  padding:0 18px;
}

.hero{
  background:linear-gradient(135deg,#1d4ed8,#7c3aed);
  color:#fff;
  border-radius:18px;
  padding:30px;
  margin-bottom:25px;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  color:#dbeafe;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:20px;
}

.stat-label{
  color:#64748b;
  font-size:13px;
  margin-bottom:7px;
}

.stat-value{
  font-size:28px;
  font-weight:800;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

.toolbar{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr auto;
  gap:10px;
  margin-bottom:20px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:130px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:700;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-primary:hover{
  background:#1d4ed8;
}

.btn-success{
  background:#16a34a;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}

.btn-light{
  background:#eef2ff;
  color:#1d4ed8;
}

.btn-gray{
  background:#e5e7eb;
  color:#374151;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  padding:13px 12px;
  text-align:left;
  border-bottom:1px solid #e5e7eb;
}

th{
  background:#f8fafc;
  font-size:13px;
  color:#475569;
}

.question{
  font-weight:700;
  color:#111827;
}

.answer{
  color:#64748b;
  max-width:430px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.published{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#fef3c7;
  color:#92400e;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:#64748b;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal-box{
  background:#fff;
  width:min(650px,100%);
  max-height:90vh;
  overflow-y:auto;
  border-radius:16px;
  padding:25px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#f1f5f9;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
  font-size:14px;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.94);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.spinner{
  width:45px;
  height:45px;
  border:4px solid #dbeafe;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:#fff;
  padding:13px 17px;
  border-radius:10px;
  display:none;
  z-index:3000;
}

.footer{
  text-align:center;
  color:#64748b;
  padding:30px 20px;
}

@media(max-width:900px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:25px;
  }

  .nav{
    align-items:flex-start;
    flex-direction:column;
  }

  .container{
    padding:0 12px;
  }
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
</div>

<header class="header">

  <nav class="nav">

    <div class="logo">
      LetsStudy Pro Admin
    </div>

    <div class="nav-links">

      <a href="admin-dashboard.html">

      </a>

      <a href="admin-premium-course.html">

      <a href="admin-premium-lessons.html">

      </a>

      <button
        class="logout"

        Logout
      </button>

    </div>

  </nav>

</header>


<main class="container">

  <section class="hero">

    <h1>
      ❓ Premium Course FAQ
    </h1>

    <p>
      Create and manage frequently asked questions
      for your LetsStudy Pro Premium Courses.
    </p>

  </section>


  <section class="stats">

    <div class="stat">
      <div class="stat-label">
        Total FAQs
      </div>

      <div
        class="stat-value"
        id="totalFaqs">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        Published
      </div>

      <div
        class="stat-value"
        id="publishedFaqs">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        Drafts
      </div>

      <div
        class="stat-value"
        id="draftFaqs">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        Courses
      </div>

      <div
        class="stat-value"

  <section class="card">

    <div class="toolbar">

      <input

      <select id="courseFilter">

        <option value="">

      <select id="statusFilter">

      <button

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>

            </th>

            <th>
              Question
            </th>

            <th>
              Answer
            </th>

            <th>

            <th>

          </tr>

        </thead>

        <tbody id="faqTable">

        </tbody>

      </table>

    </div>

  </section>

</main>


<footer class="footer">

  © <span id="year"></span>
  LetsStudy Pro. Admin Panel.

</footer>


<!-- FAQ MODAL -->

<div
  class="modal"
  id="faqModal">

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="modalTitle">
        Add FAQ
      </h2>

      <button
        class="close"
        id="closeModal">
        ×
      </button>

    </div>


    <form id="faqForm">

      <input
        type="hidden"
        id="faqId">


      <div class="form-group">

        <label>
          Premium Course
        </label>

        <select
          id="faqCourse"
          required>

          <option value="">
            Select Course
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          Question
        </label>

        <input
          type="text"
          id="faqQuestion"
          placeholder="e.g. What will I learn in this course?"
          required>

      </div>


      <div class="form-group">

        <label>

        </label>

        <textarea
          id="faqAnswer"
          placeholder="Write the answer..."
          required></textarea>

      </div>


      <div class="form-group">

        <label>
          Status
        </label>

        <select id="faqStatus">

          <option value="published">

          <option value="draft">

      <div class="form-group">

        <input
          type="number"

        <button
          type="button"
          class="btn btn-gray"

          Save FAQ
        </button>

      </div>

    </form>

  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   STATE
========================= */

let faqs = [];
let courses = [];


/* =========================
   HELPERS
========================= */

const $ =
  id => document.getElementById(id);


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showLoading(){

  $("loading").style.display =
    "flex";

}


function hideLoading(){

  $("loading").style.display =
    "none";

}


function showToast(message){

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  setTimeout(() => {

    toast.style.display =
      "none";

  },3000);

}


/* =========================
   COURSE NAME
========================= */

function getCourseName(courseId){

  const course =
    courses.find(
      c => c.id === courseId
    );

  return course
    ? course.title || "Untitled Course"
    : "Unknown Course";

}


/* =========================
   LOAD COURSES
========================= */

async function loadCourses(){

  const snapshot =
    await getDocs(
      collection(
        db,
        "premiumCourses"
      )
    );


  courses =
    snapshot.docs.map(
      item => ({

        id:item.id,

        ...item.data()

      })
    );


  courses.sort(
    (a,b) =>
      String(a.title || "")
        .localeCompare(
          String(b.title || "")
        )
  );


  renderCourseOptions();

}


/* =========================
   COURSE OPTIONS
========================= */

function renderCourseOptions(){

  const filter =
    $("courseFilter");

  const select =
    $("faqCourse");


  filter.innerHTML =
    `
      <option value="">
        All Courses
      </option>
    `;


  select.innerHTML =
    `
      <option value="">
        Select Course
      </option>
    `;


  courses.forEach(course => {

    const title =
      course.title ||
      "Untitled Course";


    filter.innerHTML += `
      <option value="${escapeHTML(course.id)}">
        ${escapeHTML(title)}
      </option>
    `;


    select.innerHTML += `
      <option value="${escapeHTML(course.id)}">
        ${escapeHTML(title)}
      </option>
    `;

  });


  $("courseCount").textContent =
    courses.length;

}


/* =========================
   LOAD FAQS
========================= */

async function loadFaqs(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "premiumCourseFAQs"
        )
      );


    faqs =
      snapshot.docs.map(
        item => ({

          id:item.id,

          ...item.data()

        })
      );


    faqs.sort(
      (a,b) =>
        Number(a.order || 999)
        -
        Number(b.order || 999)
    );


    renderFaqs();
    updateStats();

  }catch(error){

    console.error(
      "FAQ load error:",
      error
    );

    $("faqTable").innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            Unable to load FAQs.
          </div>
        </td>
      </tr>
    `;

    showToast(
      "Failed to load FAQs"
    );

  }

}


/* =========================
   UPDATE STATS
========================= */

function updateStats(){

  $("totalFaqs").textContent =
    faqs.length;


  $("publishedFaqs").textContent =
    faqs.filter(
      faq =>
        String(
          faq.status || "published"
        ).toLowerCase()
        === "published"
    ).length;


  $("draftFaqs").textContent =
    faqs.filter(
      faq =>
        String(
          faq.status || ""
        ).toLowerCase()
        === "draft"
    ).length;

}


/* =========================
   RENDER FAQS
========================= */

function renderFaqs(){

  const search =
    $("searchFaq")
      .value
      .trim()
      .toLowerCase();


  const courseId =
    $("courseFilter")
      .value;


  const status =
    $("statusFilter")
      .value
      .toLowerCase();


  const filtered =
    faqs.filter(faq => {

      const question =
        String(
          faq.question || ""
        ).toLowerCase();

      const answer =
        String(
          faq.answer || ""
        ).toLowerCase();

      const faqStatus =
        String(
          faq.status || "published"
        ).toLowerCase();


      const matchesSearch =
        !search ||
        question.includes(search) ||
        answer.includes(search);


      const matchesCourse =
        !courseId ||
        faq.courseId === courseId;


      const matchesStatus =
        !status ||
        faqStatus === status;


      return (
        matchesSearch &&
        matchesCourse &&
        matchesStatus
      );

    });


  if(!filtered.length){

    $("faqTable").innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            No FAQs found.
          </div>
        </td>
      </tr>
    `;

    return;

  }


  $("faqTable").innerHTML =
    filtered.map(faq => {

      const faqStatus =
        String(
          faq.status || "published"
        ).toLowerCase();


      return `

        <tr>

          <td>
            ${escapeHTML(
              getCourseName(
                faq.courseId
              )
            )}
          </td>

          <td>
            <div class="question">
              ${escapeHTML(
                faq.question
              )}
            </div>
          </td>

          <td>
            <div class="answer">
              ${escapeHTML(
                faq.answer
              )}
            </div>
          </td>

          <td>

            <span
              class="badge ${
                faqStatus === "published"
                  ? "published"
                  : "draft"
              }">

              ${
                faqStatus === "published"
                  ? "Published"
                  : "Draft"
              }

            </span>

          </td>

          <td>

            <div class="actions">

              <button
                class="btn btn-light"
                onclick="editFaq('${escapeHTML(faq.id)}')">
                Edit
              </button>

              <button
                class="btn btn-danger"
                onclick="deleteFaq('${escapeHTML(faq.id)}')">
                Delete
              </button>

            </div>

          </td>

        </tr>

      `;

    }).join("");

}


/* =========================
   OPEN ADD MODAL
========================= */

function openAddModal(){

  $("modalTitle").textContent =
    "Add FAQ";

  $("faqId").value =
    "";

  $("faqCourse").value =
    "";

  $("faqQuestion").value =
    "";

  $("faqAnswer").value =
    "";

  $("faqStatus").value =
    "published";

  $("faqOrder").value =
    "1";

  $("faqModal").style.display =
    "flex";

}


/* =========================
   EDIT FAQ
========================= */

window.editFaq =
  function(id){

    const faq =
      faqs.find(
        item => item.id === id
      );


    if(!faq){

      showToast(
        "FAQ not found"
      );

      return;

    }


    $("modalTitle").textContent =
      "Edit FAQ";


    $("faqId").value =
      faq.id;


    $("faqCourse").value =
      faq.courseId || "";


    $("faqQuestion").value =
      faq.question || "";


    $("faqAnswer").value =
      faq.answer || "";


    $("faqStatus").value =
      faq.status || "published";


    $("faqOrder").value =
      faq.order || 1;


    $("faqModal").style.display =
      "flex";

  };


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  $("faqModal").style.display =
    "none";

}


/* =========================
   SAVE FAQ
========================= */

$("faqForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      showLoading();


      try{

        const id =
          $("faqId").value.trim();


        const courseId =
          $("faqCourse").value.trim();


        const question =
          $("faqQuestion")
            .value
            .trim();


        const answer =
          $("faqAnswer")
            .value
            .trim();


        const status =
          $("faqStatus").value;


        const order =
          Number(
            $("faqOrder").value
          ) || 1;


        if(!courseId){

          hideLoading();

          showToast(
            "Please select a course"
          );

          return;

        }


        const data = {

          courseId,

          question,

          answer,

          status,

          order,

          updatedAt:
            serverTimestamp()

        };


        if(id){

          await updateDoc(

            doc(
              db,
              "premiumCourseFAQs",
              id
            ),

            data

          );


          showToast(
            "FAQ updated successfully"
          );

        }else{

          data.createdAt =
            serverTimestamp();


          await addDoc(

  collection(
    db,
    "premiumCourseFAQs"
  ),

  data

);

showToast(
  "FAQ added successfully"
);

}

closeModal();

await loadFaqs();

}catch(error){

console.error(
  "Save FAQ error:",
  error
);

showToast(
  "Failed to save FAQ"
);

}finally{

hideLoading();

}

}
);


/* =========================
   DELETE FAQ
========================= */

window.deleteFaq =
  async function(id){

    const faq =
      faqs.find(
        item => item.id === id
      );

    if(!faq){
      showToast("FAQ not found");
      return;
    }

    const confirmed =
      confirm(
        "Delete this FAQ permanently?"
      );

    if(!confirmed){
      return;
    }

    showLoading();

    try{

      await deleteDoc(

        doc(
          db,
          "premiumCourseFAQs",
          id
        )

      );

      showToast(
        "FAQ deleted successfully"
      );

      await loadFaqs();

    }catch(error){

      console.error(
        "Delete FAQ error:",
        error
      );

      showToast(
        "Failed to delete FAQ"
      );

    }finally{

      hideLoading();

    }

  };


/* =========================
   OPEN ADD FAQ
========================= */

$("addFaqBtn")
  .addEventListener(
    "click",
    openAddModal
  );


/* =========================
   CLOSE MODAL
========================= */

$("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


$("cancelBtn")
  .addEventListener(
    "click",
    closeModal
  );


/* =========================
   SEARCH
========================= */

$("searchFaq")
  .addEventListener(
    "input",
    renderFaqs
  );


/* =========================
   COURSE FILTER
========================= */

$("courseFilter")
  .addEventListener(
    "change",
    renderFaqs
  );


/* =========================
   STATUS FILTER
========================= */

$("statusFilter")
  .addEventListener(
    "change",
    renderFaqs
  );


/* =========================
   MODAL OUTSIDE CLICK
========================= */

$("faqModal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target ===
        $("faqModal")
      ){

        closeModal();

      }

    }
  );


/* =========================
   CURRENT YEAR
========================= */

$("year").textContent =
  new Date().getFullYear();

</script>
