<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Planner – LetsStudy Pro</title>
<meta name="description" content="Plan study sessions, run focus timers and track your weekly progress with the LetsStudy Pro Study Planner.">

<meta property="og:site_name" content="LetsStudy Pro">
<meta property="og:title" content="Study Planner – LetsStudy Pro">
<meta property="og:description" content="Plan study sessions, run focus timers and track your weekly progress.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6b5d'/%3E%3Cpath d='M18 34l10 10 18-22' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --card:#fff; --ink:#10222b; --muted:#587068; --line:#d8e1de;
  --brand:#0b6b5d; --brand-d:#084f45; --soft:#e1f1ee; --gold:#f2a900; --warn:#b4400b; --warn-soft:#fdeee6;
  --hero:#10222b; --hero-ink:#fff; --r:14px; --shadow:0 1px 2px rgba(16,34,43,.06),0 8px 24px rgba(16,34,43,.06);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b1418; --card:#121e24; --ink:#e8f0ee; --muted:#93a9a3; --line:#233640;
  --brand:#2fb9a3; --brand-d:#52d0bb; --soft:#143a35; --warn:#ff9a6a; --warn-soft:#3a2418;
  --hero:#143a35; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;padding-bottom:96px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
.nav{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:20px;height:60px}
.logo{font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-size:.95rem}
.links{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.links a{padding:8px 12px;border-radius:9px;font-size:.88rem;font-weight:600;color:var(--muted);white-space:nowrap}
.links a:hover{background:var(--bg);color:var(--ink)}
.links a[aria-current="page"]{background:var(--soft);color:var(--brand-d)}
.tools{display:flex;gap:8px;align-items:center}
.ibtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:.82rem;font-weight:600;cursor:pointer}
.ibtn:hover{background:var(--bg)}
#who{font-size:.82rem;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;margin:24px 0;padding:28px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.16)}
.ring .pg{stroke:var(--gold);transition:stroke-dashoffset .6s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.75rem;letter-spacing:-.03em}
.hero h1{font-size:clamp(1.6rem,3.6vw,2.3rem);letter-spacing:-.03em;line-height:1.15}
.hero p{opacity:.8;margin-top:6px;max-width:52ch}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.stat b{display:block;font-size:1.4rem;line-height:1.2;letter-spacing:-.02em}
.stat span{font-size:.78rem;opacity:.75}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:24px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 4px;text-align:center;cursor:pointer;transition:border-color .15s}
.day:hover{border-color:var(--brand)}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.day .dn{font-size:.74rem;color:var(--muted)}
.day .dd{font-size:1.3rem;font-weight:800;line-height:1.25}
.day .dm{font-size:.7rem;color:var(--muted);min-height:1.1em}
.day[aria-pressed="true"] .dn,.day[aria-pressed="true"] .dm{color:rgba(255,255,255,.85)}
.day.today .dd::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin:1px auto 0}
.layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.form{position:sticky;top:76px}
.panel h2{font-size:1.05rem;margin-bottom:6px}
label{display:block;font-size:.84rem;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--soft)}
textarea{resize:vertical;min-height:76px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{flex:1;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 0;font-size:.78rem;font-weight:600;cursor:pointer}
.chips button:hover{border-color:var(--brand);color:var(--brand-d)}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn-main{background:var(--brand);color:#fff;flex:1}
:root[data-theme="dark"] .btn-main{color:#06201c}
.btn-main:hover{background:var(--brand-d)}
.btn-main:disabled{opacity:.6;cursor:wait}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.msg{margin-top:12px;font-size:.86rem;min-height:1.2em}
.msg.err{color:var(--warn)}.msg.ok{color:var(--brand)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:160px}.bar select{width:auto;min-width:140px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.84rem;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.clear{font-size:.82rem;color:var(--brand-d);background:none;border:0;cursor:pointer;text-decoration:underline;padding:6px 4px}
.group h3{font-size:.88rem;margin:20px 0 8px;color:var(--muted);font-weight:700}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.task.done{background:var(--bg)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.task.live{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,169,0,.25)}
.check{width:22px;height:22px;margin-top:2px;accent-color:var(--brand);cursor:pointer;flex:none;padding:0}
.t-body{flex:1;min-width:0}
.t-title{font-weight:700;overflow-wrap:anywhere}
.t-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:.77rem}
.chip{background:var(--soft);color:var(--brand-d);border-radius:999px;padding:2px 10px;font-weight:600}
.chip.late{background:var(--warn-soft);color:var(--warn)}
.chip.plain{background:var(--bg);color:var(--muted)}
.t-notes{font-size:.87rem;color:var(--muted);margin-top:6px;overflow-wrap:anywhere;white-space:pre-wrap}
.t-btns{display:flex;gap:2px;flex:none}
.t-btns button{background:none;border:0;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted);padding:6px 8px;border-radius:8px}
.t-btns button:hover{background:var(--bg);color:var(--ink)}
.t-btns .focus{color:var(--brand-d)}
.t-btns .del:hover{color:var(--warn)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.sk{height:62px;border-radius:12px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:var(--hero);color:#fff;border-radius:16px;padding:14px 16px;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dock[hidden]{display:none}
.d-top{display:flex;align-items:center;gap:14px}
.d-time{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.d-title{flex:1;min-width:0;font-size:.88rem;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-btns{display:flex;gap:6px}
.d-btns button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer}
.d-btns button.hl{background:var(--gold);border-color:var(--gold);color:#10222b}
.d-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:10px;overflow:hidden}
.d-bar i{display:block;height:100%;width:0;background:var(--gold)}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:40px}
footer a{text-decoration:underline}
@media (max-width:900px){.layout{grid-template-columns:1fr}.form{position:static}}
@media (max-width:640px){
  .nav-in{flex-wrap:wrap;height:auto;padding:10px 20px;gap:8px}
  .links{order:3;flex-basis:100%}
  #who{display:none}
  .hero{grid-template-columns:1fr;padding:22px;justify-items:start}
  .week{gap:4px}.day .dm{display:none}
  .task{flex-wrap:wrap}.t-btns{width:100%;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <div class="wrap nav-in">
    <a class="logo" href="index.html"><i>✓</i>LetsStudy Pro</a>
    <div class="links">
      <a href="dashboard.html">Dashboard</a>
      <a href="study-planner.html" aria-current="page">Planner</a>
      <a href="study-timetable.html">Timetable</a>
      <a href="calendar.html">Calendar</a>
      <a href="courses.html">Courses</a>
      <a href="support.html">Support</a>
    </div>
    <div class="tools">
      <span id="who" hidden></span>
      <button class="ibtn" id="theme" type="button" aria-label="Switch colour theme">Dark</button>
      <button class="ibtn" id="logout" type="button" hidden>Sign out</button>
    </div>
  </div>
</nav>

<main class="wrap">
  <section class="hero" aria-label="This week">
    <div class="ring" role="img" aria-label="Weekly progress">
      <svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="50"/><circle class="pg" id="pg" cx="60" cy="60" r="50" stroke-dasharray="314.16" stroke-dashoffset="314.16"/></svg>
      <b id="pct">0%</b>
    </div>
    <div>
      <h1>Your study week</h1>
      <p id="heroTxt">Plan your sessions, focus, and tick them off.</p>
      <div class="stats">
        <div class="stat"><b id="sOpen">0</b><span>Open sessions</span></div>
        <div class="stat"><b id="sToday">0 min</b><span>Left today</span></div>
        <div class="stat"><b id="sDone">0</b><span>Completed</span></div>
        <div class="stat"><b id="sWeek">0 min</b><span>Studied this week</span></div>
      </div>
    </div>
  </section>

  <div class="week" id="week" role="group" aria-label="Next seven days"></div>

  <div class="layout">
    <section class="panel form" aria-labelledby="formTitle">
      <h2 id="formTitle">Add a study session</h2>
      <form id="form" novalidate>
        <label for="title">What will you study?</label>
        <input id="title" maxlength="120" placeholder="e.g. Chapter 4 revision" required>
        <label for="subject">Subject</label>
        <input id="subject" list="subjects" maxlength="60" placeholder="e.g. Biology" required>
        <datalist id="subjects"></datalist>
        <div class="row">
          <div><label for="date">Date</label><input id="date" type="date" required></div>
          <div><label for="minutes">Minutes</label><input id="minutes" type="number" min="5" max="720" step="5" value="30" required></div>
        </div>
        <div class="chips" aria-label="Quick durations">
          <button type="button" data-m="25">25</button><button type="button" data-m="45">45</button><button type="button" data-m="60">60</button><button type="button" data-m="90">90</button>
        </div>
        <label for="note">Notes (optional)</label>
        <textarea id="note" maxlength="500" placeholder="Pages, topics, past papers to practise…"></textarea>
        <div class="actions">
          <button class="btn btn-main" id="save" type="submit">Add session</button>
          <button class="btn btn-ghost" id="cancel" type="button" hidden>Cancel</button>
        </div>
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel" aria-label="Your sessions">
      <div class="bar">
        <input id="q" type="search" placeholder="Search sessions" aria-label="Search sessions">
        <select id="sf" aria-label="Filter by subject"><option value="">All subjects</option></select>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab" type="button" data-f="open" aria-pressed="true">Open</button>
        <button class="tab" type="button" data-f="today" aria-pressed="false">Today</button>
        <button class="tab" type="button" data-f="done" aria-pressed="false">Completed</button>
        <button class="tab" type="button" data-f="all" aria-pressed="false">All</button>
        <button class="clear" id="clearDay" type="button" hidden></button>
      </div>
      <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    </section>
  </div>
  <footer>© LetsStudy Pro · <a href="support.html">Need help?</a></footer>
</main>

<div class="dock" id="dock" hidden role="timer" aria-label="Focus timer">
  <div class="d-top">
    <div class="d-time" id="dTime">00:00</div>
    <div class="d-title" id="dTitle"></div>
    <div class="d-btns">
      <button id="dPause" type="button">Pause</button>
      <button id="dDone" class="hl" type="button">Mark done</button>
      <button id="dStop" type="button">Stop</button>
    </div>
  </div>
  <div class="d-bar"><i id="dBar"></i></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// LETSSTUDY PRO FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbKXjsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromStr = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => toStr(new Date());
const num = n => Number(n) || 0;
const mins = n => { n = num(n); return n >= 60 ? `${Math.floor(n / 60)} h${n % 60 ? " " + n % 60 + " min" : ""}` : `${n} min`; };
const col = () => collection(db, "users", currentUser.uid, "studyPlanner");
const ref = id => doc(db, "users", currentUser.uid, "studyPlanner", id);

let currentUser = null, tasks = [], filter = "open", dayFilter = null, editingId = null, unsub = null, timer = null, tick = null;
const baseTitle = document.title;

/* theme */
const root = document.documentElement;
function setTheme(t) {
  root.dataset.theme = t; $("theme").textContent = t === "dark" ? "Light" : "Dark";
  try { localStorage.setItem("lsp-theme", t); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("lsp-theme"); } catch (e) {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

function say(text, type = "") { const m = $("msg"); m.textContent = text; m.className = "msg " + type; }
function dayLabel(s) {
  if (s === today()) return "Today";
  if (s === toStr(new Date(Date.now() + 864e5))) return "Tomorrow";
  return fromStr(s).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
}
function weekRange() {
  const d = new Date(); const off = (d.getDay() + 6) % 7;
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate() - off), b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 6);
  return [toStr(a), toStr(b)];
}

function renderWeek() {
  const wrap = $("week"); wrap.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const s = toStr(d);
    const total = tasks.filter(t => t.date === s && !t.completed).reduce((a, t) => a + num(t.minutes), 0);
    const b = document.createElement("button");
    b.type = "button"; b.className = "day" + (i === 0 ? " today" : "");
    b.setAttribute("aria-pressed", dayFilter === s);
    b.innerHTML = `<div class="dn">${d.toLocaleDateString(undefined, { weekday: "short" })}</div><div class="dd">${d.getDate()}</div><div class="dm">${total ? mins(total) : ""}</div>`;
    b.onclick = () => { dayFilter = dayFilter === s ? null : s; render(); };
    wrap.appendChild(b);
  }
}

function render() {
  const t0 = today(), [w0, w1] = weekRange();
  const open = tasks.filter(t => !t.completed);
  const wk = tasks.filter(t => t.date >= w0 && t.date <= w1);
  const planned = wk.reduce((a, t) => a + num(t.minutes), 0);
  const doneMin = wk.filter(t => t.completed).reduce((a, t) => a + num(t.minutes), 0);
  const pct = planned ? Math.round(doneMin / planned * 100) : 0;
  $("sOpen").textContent = open.length;
  $("sDone").textContent = tasks.length - open.length;
  $("sToday").textContent = mins(open.filter(t => t.date === t0).reduce((a, t) => a + num(t.minutes), 0));
  $("sWeek").textContent = mins(doneMin);
  $("pct").textContent = pct + "%";
  $("pg").style.strokeDashoffset = 314.16 * (1 - pct / 100);
  $("heroTxt").textContent = !tasks.length ? "Plan your sessions, focus, and tick them off."
    : planned ? `${mins(doneMin)} done of ${mins(planned)} planned this week.` : "Nothing planned this week yet. Add a session to get started.";

  const subs = [...new Set(tasks.map(t => t.subject).filter(Boolean))].sort();
  $("subjects").innerHTML = subs.map(s => `<option value="${esc(s)}">`).join("");
  const sf = $("sf"), cur = sf.value;
  sf.innerHTML = `<option value="">All subjects</option>` + subs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  sf.value = subs.includes(cur) ? cur : "";
document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === filter));
  const cd = $("clearDay"); cd.hidden = !dayFilter;
  if (dayFilter) cd.textContent = `Showing ${dayLabel(dayFilter)} · show all days`;
  renderWeek();

  const term = $("q").value.trim().toLowerCase();
  const shown = tasks.filter(t => {
    if (dayFilter && t.date !== dayFilter) return false;
    if (sf.value && t.subject !== sf.value) return false;
    if (term && !`${t.title} ${t.subject} ${t.notes}`.toLowerCase().includes(term)) return false;
    if (filter === "open") return !t.completed;
    if (filter === "today") return t.date === t0 && !t.completed;
    if (filter === "done") return t.completed;
    return true;
  });

  const list = $("list");
  if (!shown.length) {
    const m = term || sf.value ? ["No matching sessions", "Try a different search or subject."] : {
      open: ["Nothing planned yet", "Add your first session using the form."],
      today: ["Nothing left for today", "Add a session or enjoy the break."],
      done: ["No completed sessions yet", "Tick a session when you finish it."],
      all: ["No sessions yet", "Add your first session using the form."]
    }[filter];
    list.innerHTML = `<div class="empty"><b>${m[0]}</b>${m[1]}</div>`;
    return;
  }
  const groups = {};
  shown.forEach(t => (groups[t.date || ""] ||= []).push(t));
  list.innerHTML = Object.keys(groups).sort().map(d => `
    <div class="group"><h3>${d ? esc(dayLabel(d)) : "No date"}</h3>
    ${groups[d].map(t => `
      <div class="task${t.completed ? " done" : ""}${timer && timer.id === t.id ? " live" : ""}" data-id="${esc(t.id)}">
        <input class="check" type="checkbox" ${t.completed ? "checked" : ""} aria-label="Mark ${esc(t.title)} as ${t.completed ? "not done" : "done"}">
        <div class="t-body">
          <div class="t-title">${esc(t.title)}</div>
          <div class="t-meta">
            ${t.subject ? `<span class="chip">${esc(t.subject)}</span>` : ""}
            <span class="chip plain">${mins(t.minutes)}</span>
            ${!t.completed && t.date && t.date < t0 ? `<span class="chip late">Overdue</span>` : ""}
          </div>
          ${t.notes ? `<div class="t-notes">${esc(t.notes)}</div>` : ""}
        </div>
        <div class="t-btns">
          ${t.completed ? "" : `<button type="button" class="focus">Focus</button>`}
          <button type="button" class="edit">Edit</button>
          <button type="button" class="del">Delete</button>
        </div>
      </div>`).join("")}
    </div>`).join("");
}

/* focus timer */
const clock = s => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
function drawDock() {
  const d = $("dock");
  if (!timer) { d.hidden = true; document.title = baseTitle; return; }
  d.hidden = false;
  $("dTitle").textContent = timer.title;
  $("dTime").textContent = timer.left ? clock(timer.left) : "Time’s up";
  $("dPause").hidden = timer.left === 0;
  $("dPause").textContent = timer.running ? "Pause" : "Resume";
  $("dBar").style.width = (100 - timer.left / timer.total * 100) + "%";
  document.title = timer.left ? `${clock(timer.left)} · ${timer.title}` : "Time’s up · " + baseTitle;
}
function startFocus(t) {
  if (timer && !confirm("Replace the focus session that is running?")) return;
  clearInterval(tick);
  const total = Math.max(1, num(t.minutes) || 25) * 60;
  timer = { id: t.id, title: t.title, total, left: total, end: Date.now() + total * 1000, running: true };
  tick = setInterval(() => {
    if (!timer.running) return;
    timer.left = Math.max(0, Math.round((timer.end - Date.now()) / 1000));
    if (!timer.left) { timer.running = false; clearInterval(tick); }
    drawDock();
  }, 500);
  drawDock(); render();
}
function stopFocus() { clearInterval(tick); timer = null; drawDock(); render(); }
$("dPause").onclick = () => {
  if (timer.running) timer.running = false;
  else { timer.end = Date.now() + timer.left * 1000; timer.running = true; }
  drawDock();
};
$("dStop").onclick = stopFocus;
$("dDone").onclick = async () => {
  const id = timer.id; stopFocus();
  try { await updateDoc(ref(id), { completed: true, updatedAt: serverTimestamp() }); } catch (e) { console.error(e); say("Couldn’t mark it done. Try again.", "err"); }
};

/* form */
function resetForm() {
  editingId = null; $("form").reset();
  $("date").value = dayFilter || today(); $("minutes").value = 30;
  $("formTitle").textContent = "Add a study session"; $("save").textContent = "Add session"; $("cancel").hidden = true;
}
$("form").querySelector(".chips").addEventListener("click", e => { const m = e.target.dataset.m; if (m) $("minutes").value = m; });
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!currentUser) return;
  const title = $("title").value.trim(), subjectValue = $("subject").value.trim(), date = $("date").value, minutes = Number($("minutes").value), note = $("note").value.trim();
  if (!title || !subjectValue || !date) return say("Add a title, subject and date.", "err");
  if (!(minutes >= 5 && minutes <= 720)) return say("Minutes must be between 5 and 720.", "err");
  $("save").disabled = true; say("");
  try {
    if (editingId) {
      await updateDoc(ref(editingId), { title, subject: subjectValue, date, minutes, notes: note, updatedAt: serverTimestamp() });
      say("Session updated.", "ok");
    } else {
      await addDoc(col(), {
        title,
        subject: subjectValue,
        date,
        minutes,
        notes: note,
        completed: false,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      say("Session added.", "ok");
    }
    resetForm();
  } catch (err) {
    console.error(err);
    say(err.code === "permission-denied" ? "You don’t have permission to save here. Sign in again." : "Couldn’t save. Check your connection and try again.", "err");
  } finally { $("save").disabled = false; }
});
$("cancel").onclick = () => { resetForm(); say(""); };
$("clearDay").onclick = () => { dayFilter = null; render(); };
$("q").oninput = render; $("sf").onchange = render;
$("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) { filter = b.dataset.f; render(); } });

$("list").addEventListener("click", async e => {
  const row = e.target.closest(".task"); if (!row) return;
  const id = row.dataset.id, t = tasks.find(x => x.id === id); if (!t) return;
  const c = e.target.classList;
  try {
    if (c.contains("check")) {
      if (e.target.checked && timer && timer.id === id) stopFocus();
      await updateDoc(ref(id), { completed: e.target.checked, updatedAt: serverTimestamp() });
    } else if (c.contains("focus")) startFocus(t);
    else if (c.contains("del")) {
      if (confirm(`Delete “${t.title}”?`)) { if (timer && timer.id === id) stopFocus(); await deleteDoc(ref(id)); }
    } else if (c.contains("edit")) {
      editingId = id;
      $("title").value = t.title || ""; $("subject").value = t.subject || ""; $("date").value = t.date || today();
      $("minutes").value = t.minutes || 30; $("note").value = t.notes || "";
      $("formTitle").textContent = "Edit session"; $("save").textContent = "Save changes"; $("cancel").hidden = false;
      say(""); $("title").focus(); window.scrollTo({ top: 0, behavior: "smooth" });
    }
  } catch (err) { console.error(err); say("Couldn’t update that session. Try again.", "err"); render(); }
});

/* data + auth */
function listen() {
  if (unsub) unsub();
  unsub = onSnapshot(query(col(), orderBy("date")), snap => {
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() })); render();
  }, err => {
    console.error(err);
    $("list").innerHTML = `<div class="empty"><b>Couldn’t load your sessions</b>Check your connection and refresh the page.</div>`;
  });
}
$("logout").onclick = async () => { await signOut(auth); location.href = "login.html"; };
onAuthStateChanged(auth, user => {
  if (!user) { location.replace("login.html?next=study-planner.html"); return; }
  currentUser = user;
  $("who").textContent = user.displayName || user.email || ""; $("who").hidden = !$("who").textContent;
  $("logout").hidden = false;
  resetForm(); listen();
});
</script>
</body>
