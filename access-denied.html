<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
background:
radial-gradient(circle at 10% 10%,#dbeafe,transparent 30%),
radial-gradient(circle at 90% 90%,#e0e7ff,transparent 30%),
#f8fafc;
color:#0f172a;
}

a{
text-decoration:none;
}

.page{
min-height:100vh;
display:flex;
flex-direction:column;
}


/* HEADER */

header{
height:70px;
background:rgba(255,255,255,.95);
border-bottom:1px solid #e2e8f0;
display:flex;
align-items:center;
}

.nav{
width:100%;
max-width:1200px;
margin:auto;
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:900;
color:#2563eb;
}

.logo-icon{
width:42px;
height:42px;
display:grid;
place-items:center;
background:#2563eb;
color:white;
border-radius:12px;
}

.home{
padding:10px 15px;
border:1px solid #cbd5e1;
border-radius:10px;
color:#334155;
font-weight:800;
font-size:14px;
}


/* MAIN */

main{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:40px 18px;
}

.card{
width:100%;
max-width:560px;
background:white;
border:1px solid #e2e8f0;
border-radius:24px;
padding:40px 32px;
text-align:center;
box-shadow:0 25px 60px rgba(15,23,42,.10);
}

.icon{
width:78px;
height:78px;
margin:0 auto 20px;
display:grid;
place-items:center;
background:#fef2f2;
border:1px solid #fecaca;
border-radius:22px;
font-size:36px;
}

h1{
font-size:30px;
margin-bottom:10px;
}

.description{
color:#64748b;
font-size:14px;
line-height:1.7;
max-width:430px;
margin:0 auto 22px;
}


/* STATUS */

.status{
padding:13px 15px;
border-radius:11px;
background:#f8fafc;
border:1px solid #e2e8f0;
color:#475569;
font-size:13px;
font-weight:700;
margin-bottom:20px;
}


/* REASON */

.reason{
display:none;
text-align:left;
background:#fff7ed;
border:1px solid #fed7aa;
color:#9a3412;
padding:14px;
border-radius:11px;
font-size:13px;
line-height:1.6;
margin-bottom:20px;
}


/* ACTIONS */

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px;
}

.btn{
height:48px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
font-size:14px;
font-weight:900;
border:0;
cursor:pointer;
}

.primary{
background:#2563eb;
color:white;
}

.primary:hover{
background:#1d4ed8;
}

.secondary{
background:#f1f5f9;
color:#334155;
}

.secondary:hover{
background:#e2e8f0;
}

.logout{
width:100%;
margin-top:11px;
background:#fff;
border:1px solid #fecaca;
color:#b91c1c;
}


/* FOOTER */

footer{
background:#020617;
color:#94a3b8;
}

.footer{
max-width:1200px;
margin:auto;
padding:23px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
font-size:13px;
}

.footer a{
color:#94a3b8;
}

.footer a:hover{
color:white;
}


/* MOBILE */

@media(max-width:600px){

.card{
padding:32px 20px;
}

h1{
font-size:26px;
}

.actions{
grid-template-columns:1fr;
}

.footer{
flex-direction:column;
text-align:center;
}

}

</style>

</head>

<body>

<div class="page">


<!-- HEADER -->

<header>

<nav class="nav">

<a href="index.html" class="logo">

<span class="logo-icon">
L
</span>

LetsStudy Pro

</a>

<a href="index.html" class="home">
Home
</a>

</nav>

</header>


<!-- MAIN -->

<main>

<section class="card">

<div class="icon">
🔒
</div>

<h1>
Access Denied
</h1>

<p class="description">

You don't have permission to access this page.
Your account may not have the required role,
permission, or subscription.

</p>


<div
id="status"
class="status">

Checking account...

</div>


<div
id="reason"
class="reason">
</div>


<div class="actions">

<a
href="dashboard.html"
class="btn primary">

← Dashboard

</a>

<a
href="index.html"
class="btn secondary">

Home

Login

id="logoutBtn"

</section>

</main>

<footer>

<div class="footer">

<div>

<a href="privacy.html">
Privacy

<a href="terms.html">
Terms
</a>

<a href="help-center.html">

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getDatabase,
ref,
get
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =====================================================
FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAXKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* =====================================================
ELEMENTS
===================================================== */

const statusBox =
document.getElementById("status");

const reasonBox =
document.getElementById("reason");

const logoutBtn =
document.getElementById("logoutBtn");


/* =====================================================
URL INFORMATION
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

const requestedPage =
params.get("page");

const requestedRole =
params.get("role");


/* =====================================================
AUTH CHECK
===================================================== */

onAuthStateChanged(
auth,
async user=>{

if(!user){

statusBox.textContent =
"You are not logged in.";

reasonBox.style.display =
"block";

reasonBox.textContent =
"Please login to continue. If you were redirected here from another page, login and try again.";

return;

}


/* EMAIL STATUS */

if(!user.emailVerified){

statusBox.textContent =
"Your email address is not verified.";

reasonBox.style.display =
"block";

reasonBox.textContent =
"Please verify your email before accessing protected LetsStudy Pro services.";

return;

}


/* LOAD USER DATA */

try{

const snapshot =
await get(
ref(
db,
"users/" + user.uid
)
);


if(!snapshot.exists()){

statusBox.textContent =
"Account profile not found.";

reasonBox.style.display =
"block";

reasonBox.textContent =
"Your authentication account exists, but your LetsStudy Pro profile has not been created yet.";

return;

}


const data =
snapshot.val();


const role =
data.role ||
"student";

const status =
data.status ||
"active";


/* ACCOUNT DISABLED */

if(
status === "suspended" ||
status === "disabled" ||
status === "banned"
){

statusBox.textContent =
"Your account is currently restricted.";

reasonBox.style.display =
"block";

reasonBox.textContent =
"Your account status is: " +
status +
". Please contact LetsStudy Pro Support if you believe this is an error.";

return;

}


/* DISPLAY ROLE */

statusBox.textContent =
"Logged in as: " +
role;


/* SPECIFIC ROLE REQUEST */

if(requestedRole){

reasonBox.style.display =
"block";

reasonBox.textContent =
"This page requires the " +
requestedRole +
" role. Your current role is " +
role +
".";

}else if(requestedPage){

reasonBox.style.display =
"block";

reasonBox.textContent =
"You do not currently have permission to access " +
requestedPage +
".";

}else{

reasonBox.style.display =
"block";

reasonBox.textContent =
"Your account is active, but you do not have the required permission for this page.";

}

}catch(error){

console.error(
"Access check error:",
error
);

statusBox.textContent =
"Unable to verify account permissions.";

reasonBox.style.display =
"block";

reasonBox.textContent =
"Please return to your dashboard or contact support if the problem continues.";

}

});


/* =====================================================
LOGOUT
===================================================== */

logoutBtn.addEventListener(
"click",
async ()=>{

logoutBtn.disabled =
true;

logoutBtn.textContent =
"Logging out...";

try{

await signOut(auth);

window.location.href =
"login.html";

}catch(error){

console.error(error);

logoutBtn.disabled =
false;

logoutBtn.textContent =
"Logout";

}

});


/* =====================================================
YEAR
===================================================== */

document.getElementById("year")
.textContent =
new Date().getFullYear();

</script>

</div>

</body>
</html>
