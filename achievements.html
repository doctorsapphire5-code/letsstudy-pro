<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Achievements | LetsStudy Pro</title>

<meta name="description"
content="View your LetsStudy Pro learning achievements, badges and milestones.">

<meta name="theme-color" content="#2563eb">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

a{
  text-decoration:none;
}

.navbar{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
}

.nav-container{
  max-width:1100px;
  min-height:68px;
  margin:auto;
  padding:0 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;

  color:#2563eb;
  font-size:18px;
  font-weight:800;
}

.logo-icon{
  width:38px;
  height:38px;

  border-radius:10px;

  background:#2563eb;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:11px;
  font-weight:900;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  color:#475569;
  font-size:12px;
  font-weight:600;
}

.menu-btn{
  display:none;

  border:0;
  background:none;

  font-size:25px;
}

main{
  max-width:1000px;
  margin:auto;

  padding:35px 20px 60px;
}

.hero{
  text-align:center;
  margin-bottom:28px;
}

.hero-icon{
  width:65px;
  height:65px;

  margin:0 auto 13px;

  border-radius:18px;

  background:#eff6ff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;
}

.hero h1{
  font-size:27px;
  margin-bottom:7px;
}

.hero p{
  color:#64748b;
  font-size:11px;
}

.stats{
  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:12px;

  margin-bottom:22px;
}

.stat{
  background:#fff;

  border:1px solid #e2e8f0;

  border-radius:13px;

  padding:17px;

  text-align:center;
}

.stat strong{
  display:block;

  font-size:20px;

  color:#2563eb;

  margin-bottom:4px;
}

.stat span{
  color:#94a3b8;

  font-size:8px;
  font-weight:700;
}

.section-title{
  font-size:15px;

  margin-bottom:13px;
}

.grid{
  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:14px;
}

.achievement{
  background:#fff;

  border:1px solid #e2e8f0;

  border-radius:15px;

  padding:18px;

  position:relative;
}

.achievement.unlocked{
  border-color:#bfdbfe;
}

.achievement.locked{
  opacity:.62;
}

.badge-icon{
  width:58px;
  height:58px;

  border-radius:16px;

  background:#eff6ff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27px;

  margin-bottom:13px;
}

.locked .badge-icon{
  background:#f1f5f9;
  filter:grayscale(1);
}

.achievement h3{
  font-size:12px;

  margin-bottom:6px;
}

.achievement p{
  color:#64748b;

  font-size:9px;

  line-height:1.6;

  min-height:29px;

  margin-bottom:12px;
}

.status{
  font-size:8px;

  font-weight:800;

  margin-bottom:7px;
}

.unlocked .status{
  color:#16a34a;
}

.locked .status{
  color:#94a3b8;
}

.progress{
  width:100%;
  height:6px;

  background:#e2e8f0;

  border-radius:20px;

  overflow:hidden;
}

.progress-bar{
  height:100%;

  background:#2563eb;

  border-radius:20px;

  transition:.3s;
}

.progress-text{
  margin-top:6px;

  color:#94a3b8;

  font-size:7px;

  text-align:right;
}

.empty{
  grid-column:1/-1;

  text-align:center;

  padding:50px 20px;

  background:#fff;

  border:1px solid #e2e8f0;

  border-radius:15px;

  color:#94a3b8;

  font-size:10px;
}

.loading{
  grid-column:1/-1;

  text-align:center;

  padding:55px;

  color:#64748b;

  font-size:10px;
}

.message{
  display:none;

  margin-bottom:18px;

  padding:11px;

  border-radius:8px;

  font-size:9px;
}

.message.show{
  display:block;
}

.message.error{
  background:#fee2e2;
  color:#991b1b;
}

footer{
  text-align:center;

  padding:30px;

  color:#94a3b8;

  font-size:9px;
}

@media(max-width:800px){

  .grid{
    grid-template-columns:
    repeat(2,1fr);
  }

}

@media(max-width:650px){

  .nav-links{
    display:none;
  }

  .menu-btn{
    display:block;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header class="navbar">

<div class="nav-container">

<a href="/" class="logo">

<div class="logo-icon">
LS
</div>

LetsStudy Pro

</a>


<nav class="nav-links">

<a href="/">Home</a>
<a href="/courses.html">Courses</a>
<a href="/leaderboard.html">Leaderboard</a>
<a href="/profile.html">Profile</a>

</nav>


<button
id="menuBtn"
class="menu-btn">

☰

</button>

</div>

</header>



<main>


<section class="hero">

<div class="hero-icon">
🏅
</div>

<h1>
Achievements
</h1>

<p>
Track your learning milestones and unlock new badges.
</p>

</section>


<div
id="message"
class="message">
</div>


<section class="stats">

<div class="stat">

<strong id="unlockedCount">
0
</strong>

<span>
Unlocked
</span>

</div>


<div class="stat">

<strong id="totalCount">
0
</strong>

<span>
Total Achievements
</span>

</div>


<div class="stat">

<strong id="points">
0
</strong>

<span>
Learning XP
</span>

</div>

</section>



<h2 class="section-title">

</h2>


<section

class="grid">

Loading achievements...

</div>

</section>


</main>



<footer>

© 2026 LetsStudy Pro. All rights reserved.

</footer>



<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  update
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const container =
document.getElementById(
  "achievements"
);

const unlockedCount =
document.getElementById(
  "unlockedCount"
);

const totalCount =
document.getElementById(
  "totalCount"
);

const pointsElement =
document.getElementById(
  "points"
);

const message =
document.getElementById(
  "message"
);


/* =========================
   DEFAULT ACHIEVEMENTS
========================= */

const defaultAchievements = [

  {
    id:"first_course",
    icon:"🎓",
    title:"First Course",
    description:"Enroll in your first course.",
    field:"coursesEnrolled",
    target:1
  },

  {
    id:"course_master",
    icon:"🏆",
    title:"Course Master",
    description:"Complete 5 courses.",
    field:"coursesCompleted",
    target:5
  },

  {
    id:"quiz_starter",
    icon:"📝",
    title:"Quiz Starter",
    description:"Complete your first quiz.",
    field:"quizzesCompleted",
    target:1
  },

  {
    id:"quiz_master",
    icon:"🧠",
    title:"Quiz Master",
    description:"Complete 20 quizzes.",
    field:"quizzesCompleted",
    target:20
  },

  {
    id:"bookworm",
    icon:"📚",
    title:"Bookworm",
    description:"Download 10 study resources.",
    field:"resourcesDownloaded",
    target:10
  },

  {
    id:"knowledge_seeker",
    icon:"🔎",
    title:"Knowledge Seeker",
    description:"Download 50 study resources.",
    field:"resourcesDownloaded",
    target:50
  },

  {
    id:"streak",
    icon:"🔥",
    title:"Learning Streak",
    description:"Reach a 7-day learning streak.",
    field:"streak",
    target:7
  },

  {
    id:"perfect_score",
    icon:"💯",
    title:"Perfect Score",
    description:"Get a perfect quiz score.",
    field:"perfectQuizzes",
    target:1
  },

  {
    id:"certificate",
    icon:"📜",
    title:"Certified Learner",
    description:"Earn your first certificate.",
    field:"certificates",
    target:1
  },

  {
    id:"top_ten",
    icon:"⭐",
    title:"Top 10",
    description:"Reach the top 10 on the leaderboard.",
    field:"leaderboardRank",
    target:10
  }

];


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      showLogin();

      return;

    }


    loadAchievements(
      user.uid
    );

  }
);


/* =========================
   LOAD
========================= */

async function loadAchievements(
uid
){

  try{

    const snapshot =
    await get(
      ref(
        db,
        "users/" +
        uid
      )
    );


    const userData =
    snapshot.exists()
    ? snapshot.val()
    : {};


    const points =
    Number(
      userData.points ??
      userData.xp ??
      0
    );


    pointsElement.textContent =
    points.toLocaleString();


    const achievements =
    await loadCustomAchievements();


    const results =
    achievements.map(
      achievement =>
      calculateAchievement(
        achievement,
        userData
      )
    );


    const unlocked =
    results.filter(
      item =>
      item.unlocked
    );


    unlockedCount.textContent =
    unlocked.length;


    totalCount.textContent =
    results.length;


    renderAchievements(
      results
    );


    /*
     * Save unlocked achievements
     * into the user's account.
     */

    if(
      unlocked.length
    ){

      const unlockedData = {};

      unlocked.forEach(
        item => {

          unlockedData[
            item.id
          ] = {

            unlocked:true,

            unlockedAt:
            Date.now()

          };

        }
      );


      await update(
        ref(
          db,
          "users/" +
          uid +
          "/achievements"
        ),
        unlockedData
      );

    }


  }catch(error){

    console.error(
      "Achievements error:",
      error
    );


    showError();

  }

}


/* =========================
   CUSTOM ACHIEVEMENTS
========================= */

async function loadCustomAchievements(){

  try{

    const snapshot =
    await get(
      ref(
        db,
        "achievements"
      )
    );


    if(
      !snapshot.exists()
    ){

      return defaultAchievements;

    }


    const data =
    snapshot.val();


    const custom =
    Object.entries(
      data
    ).map(
      ([id,item]) => ({

        id,

        ...item

      })
    );


    return custom.length
    ? custom
    : defaultAchievements;


  }catch(error){

    console.error(
      error
    );

    return defaultAchievements;

  }

}


/* =========================
   CALCULATE
========================= */

function calculateAchievement(
achievement,
user
){

  const current =
  Number(
    user[
      achievement.field
    ] || 0
  );


  const target =
  Number(
    achievement.target ||
    1
  );


  const progress =
  Math.min(
    100,
    Math.round(
      (
        current /
        target
      ) * 100
    )
  );


  return {

    ...achievement,

    current,

    progress,

    unlocked:
    current >= target

  };

}


/* =========================
   RENDER
========================= */

function renderAchievements(
items
){

  container.innerHTML =
  "";


  if(
    !items.length
  ){

    container.innerHTML = `

      <div class="empty">

        No achievements available yet.

      </div>

    `;

    return;

  }


  items.forEach(
    item => {

      const card =
      document.createElement(
        "article"
      );


      card.className =
      "achievement " +
      (
        item.unlocked
        ? "unlocked"
        : "locked"
      );


      card.innerHTML = `

        <div class="badge-icon">

          ${escapeHTML(
            item.icon || "🏅"
          )}

        </div>


        <h3>

          ${escapeHTML(
            item.title ||
            "Achievement"
          )}

        </h3>


        <p>

          ${escapeHTML(
            item.description ||
            ""
          )}

        </p>


        <div class="status">

          ${
            item.unlocked
            ? "✓ UNLOCKED"
            : "🔒 LOCKED"
          }

        </div>


        <div class="progress">

          <div
            class="progress-bar"
            style="width:${item.progress}%">
          </div>

        </div>


        <div class="progress-text">

          ${item.current}
          /
          ${item.target}

          ${
            item.unlocked
            ? " — Complete"
            : ""
          }

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* =========================
   LOGIN
========================= */

function showLogin(){

  container.innerHTML = `

    <div class="empty">

      <div style="font-size:30px;margin-bottom:10px;">
        🔐
      </div>

      <p style="margin-bottom:15px;">
        Please login to view your achievements.
      </p>

      <a
        href="/login.html"
        style="
          display:inline-block;
          background:#2563eb;
          color:#fff;
          padding:10px 18px;
          border-radius:8px;
          font-size:9px;
          font-weight:800;
        ">

        Login

      </a>

    </div>

  `;

}


/* =========================
   ERROR
========================= */

function showError(){

  message.textContent =
  "Unable to load achievements. Please try again.";

  message.className =
  "message show error";


  container.innerHTML = `

    <div class="empty">

      Unable to load achievements.

    </div>

  `;

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(
value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   MOBILE MENU
========================= */

document
.getElementById(
"menuBtn"
)
.addEventListener(
"click",
function(){

  document
  .querySelector(
    ".nav-links"
  )
  .classList.toggle(
    "active"
  );

});

</script>

</body>

</html>
