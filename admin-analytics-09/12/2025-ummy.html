<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Analytics | LetsStudy Pro</title>
<meta name="description" content="LetsStudy Pro analytics dashboard.">
<meta name="robots" content="noindex,nofollow">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:16px 5%;font-weight:700}
main{max-width:1150px;margin:auto;padding:20px}
.card,.stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
.num{font-size:25px;font-weight:700;margin-top:5px}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px}
input,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:7px;background:#fff}
button{border:0;border-radius:7px;padding:9px 12px;cursor:pointer;font-weight:600}
button:disabled{opacity:.6}
.blue{background:#2563eb;color:#fff}
.gray{background:#e5e7eb;color:#111827}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}
.bar{background:#e5e7eb;height:9px;border-radius:20px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:#2563eb}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#dbeafe;color:#1e40af;font-size:11px}
.empty,.small{color:#6b7280}
.small{font-size:13px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
th{white-space:nowrap}
@media(max-width:800px){
.stats{grid-template-columns:1fr 1fr}
.toolbar{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr}
}
@media(max-width:450px){
.stats,.toolbar{grid-template-columns:1fr}
main{padding:12px}
}
</style>
</head>

<body>

<header>📊 LetsStudy Pro — Admin Analytics</header>

<main>

<div class="card" style="margin-bottom:15px">
<h2 style="margin:0 0 6px">Analytics Dashboard</h2>
<div class="small">
Live analytics data from the LetsStudy Pro Firestore database.
</div>
</div>

<div class="stats">

<div class="stat">
Total Events
<div class="num" id="total">0</div>
</div>

<div class="stat">
Page Views
<div class="num" id="views">0</div>
</div>

<div class="stat">
Enrollments
<div class="num" id="enrollments">0</div>
</div>

<div class="stat">
Payments
<div class="num" id="payments">0</div>
</div>

</div>

<div class="card">

<div class="toolbar">

<input id="search"
type="search"
placeholder="Search analytics..."
autocomplete="off">

<select id="eventFilter">
<option value="">All Events</option>
<option value="page_view">page_view</option>
<option value="course_view">course_view</option>
<option value="course_enroll">course_enroll</option>
<option value="lesson_start">lesson_start</option>
<option value="lesson_complete">lesson_complete</option>
<option value="quiz_complete">quiz_complete</option>
<option value="certificate_download">certificate_download</option>
<option value="payment_start">payment_start</option>
<option value="payment_complete">payment_complete</option>
</select>

<select id="deviceFilter">
<option value="">All Devices</option>
<option value="mobile">mobile</option>
<option value="desktop">desktop</option>
<option value="tablet">tablet</option>
</select>

<select id="countryFilter">
<option value="">All Countries</option>
<option>Tanzania</option>
<option>Kenya</option>
<option>Uganda</option>
<option>Nigeria</option>
<option>Ghana</option>
<option>United States</option>
<option>United Kingdom</option>
</select>

<button id="refreshButton" class="blue">
↻ Refresh
</button>

</div>

</div>

<div class="grid">

<div class="card">
<h2>📈 Event Breakdown</h2>
<div id="events">Loading...</div>
</div>

<div class="card">
<h2>🌍 Countries</h2>
<div id="countries">Loading...</div>
</div>

</div>

<div class="card" style="margin-top:15px">

<h2>🕒 Recent Activity</h2>

<div class="scroll">

<table>
<thead>
<tr>
<th>Event</th>
<th>User</th>
<th>Page</th>
<th>Device</th>
<th>Country</th>
<th>Date</th>
</tr>
</thead>

<tbody id="recent">
<tr>
<td colspan="6">Loading...</td>
</tr>
</tbody>

</table>

</div>

</div>

</main>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getFirestore,
collection,
getDocs
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rj0rodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

let data=[];


function clean(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}


function dateValue(v){

try{

const d=typeof v?.toDate==="function"
?v.toDate()
:new Date(v||0);

const t=d.getTime();

return Number.isNaN(t)?0:t;

}catch{
return 0;
}

}


function formatDate(v){

const t=dateValue(v);

return t?new Date(t).toLocaleString():"Unknown";

}


function filtered(){

const q=$("search").value.toLowerCase().trim();
const event=$("eventFilter").value;
const device=$("deviceFilter").value;
const country=$("countryFilter").value;

return data.filter(x=>{

const text=[
x.userId,x.page,x.courseId,x.event,
x.device,x.country,x.type
].join(" ").toLowerCase();

return(
(!q||text.includes(q))&&
(!event||String(x.event||"")===event)&&
(!device||String(x.device||"")===device)&&
(!country||String(x.country||"")===country)
);

});

}


function bars(map,target){

const entries=Object.entries(map)
.sort((a,b)=>b[1]-a[1]);

if(!entries.length){
$(target).innerHTML='<div class="empty">No data.</div>';
return;
}

const max=entries[0][1]||1;

$(target).innerHTML=entries.map(([name,count])=>`

<div style="margin-bottom:12px">

<div>
<b>${clean(name)}</b>
<span style="float:right">${count}</span>
</div>

<div class="bar">
<span style="width:${Math.min(100,count/max*100)}%"></span>
</div>

</div>

`).join("");

}


function render(){

const rows=filtered();

$("total").textContent=rows.length;

$("views").textContent=
rows.filter(x=>x.event==="page_view").length;

$("enrollments").textContent=
rows.filter(x=>x.event==="course_enroll").length;

$("payments").textContent=
rows.filter(x=>x.event==="payment_complete").length;


const events={};
const countries={};

rows.forEach(x=>{

const e=String(x.event||"unknown");
const c=String(x.country||"Unknown");

events[e]=(events[e]||0)+1;
countries[c]=(countries[c]||0)+1;

});

bars(events,"events");
bars(countries,"countries");


const recent=[...rows]
.sort((a,b)=>dateValue(b.createdAt)-dateValue(a.createdAt))
.slice(0,100);

if(!recent.length){

$("recent").innerHTML=`
<tr>
<td colspan="6">No analytics data.</td>
</tr>`;

return;

}

$("recent").innerHTML=recent.map(x=>`

<tr>

<td>
<span class="badge">
${clean(x.event||"unknown")}
</span>
</td>

<td>${clean(x.userId||"Guest")}</td>

<td>${clean(x.page||"-")}</td>

<td>${clean(x.device||"-")}</td>

<td>${clean(x.country||"-")}</td>

<td>${clean(formatDate(x.createdAt))}</td>

</tr>

`).join("");

}


async function loadAnalytics(){

const btn=$("refreshButton");

btn.disabled=true;
btn.textContent="Loading...";

$("recent").innerHTML=`
<tr>
<td colspan="6">Loading analytics...</td>
</tr>`;

try{

const snap=await getDocs(
collection(db,"analytics")
);

data=snap.docs.map(d=>({
id:d.id,
...d.data()
}));

render();

}catch(error){

console.error(error);

$("recent").innerHTML=`
<tr>
<td colspan="6">
Unable to load analytics.
<br>
<small>${clean(error.message)}</small>
</td>
</tr>`;

$("events").innerHTML=
'<div class="empty">Unable to load data.</div>';

$("countries").innerHTML=
'<div class="empty">Unable to load data.</div>';

}finally{

btn.disabled=false;
btn.textContent="↻ Refresh";

}

}


$("search").addEventListener("input",render);
$("eventFilter").addEventListener("change",render);
$("deviceFilter").addEventListener("change",render);
$("countryFilter").addEventListener("change",render);
$("refreshButton").addEventListener("click",loadAnalytics);


loadAnalytics();

</script>

</body>
</html>
