<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Analytics | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
header{
  background:#111827;
  color:white;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px
}
header h1{margin:0;font-size:21px}
header span{opacity:.7;font-size:13px}

.container{
  max-width:1250px;
  margin:auto;
  padding:22px
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px
}

button,select,input{
  border:1px solid #d8deea;
  border-radius:9px;
  padding:11px 13px;
  background:white;
  font-size:14px
}

button{
  cursor:pointer;
  background:#2563eb;
  color:white;
  border:0
}

button.secondary{
  background:#374151
}

button.danger{
  background:#dc2626
}

input{
  min-width:230px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 4px 18px #0000000a
}

.stat-title{
  color:#6b7280;
  font-size:13px
}

.stat-value{
  font-size:27px;
  font-weight:800;
  margin-top:8px
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:18px
}

h2{
  margin-top:0;
  font-size:17px
}

.bar{
  margin:15px 0
}

.bar-top{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:6px
}

.track{
  height:10px;
  background:#edf0f5;
  border-radius:20px;
  overflow:hidden
}

.fill{
  height:100%;
  background:#2563eb;
  border-radius:20px
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  padding:12px 9px;
  border-bottom:1px solid #edf0f5;
  text-align:left;
  font-size:13px
}

th{
  color:#6b7280
}

.table-wrap{
  overflow:auto
}

.loading{
  text-align:center;
  padding:40px
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:white;
  padding:13px 18px;
  border-radius:10px;
  display:none;
  z-index:20
}

.empty{
  padding:30px;
  text-align:center;
  color:#6b7280
}

@media(max-width:850px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
}

@media(max-width:500px){
  .stats{grid-template-columns:1fr}
  .container{padding:14px}
  input{width:100%}
}
</style>
</head>

<body>

<header>
  <div>
    <h1>📊 Admin Analytics</h1>
    <span>LetsStudy Pro Management Dashboard</span>
  </div>

  <button onclick="refreshAnalytics()">
    🔄 Refresh
  </button>
</header>

<div class="container">

  <div class="actions">

    <input
      id="searchInput"
      placeholder="Search users, courses..."
    >

    <select id="periodFilter">
      <option value="all">All Time</option>
      <option value="today">Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
      <option value="year">This Year</option>
    </select>

    <button onclick="exportAnalytics()">
      📥 Export CSV
    </button>

  </div>


  <div class="stats">

    <div class="card">
      <div class="stat-title">Total Users</div>
      <div class="stat-value" id="totalUsers">0</div>
    </div>

    <div class="card">
      <div class="stat-title">Courses</div>
      <div class="stat-value" id="totalCourses">0</div>
    </div>

    <div class="card">
      <div class="stat-title">Orders</div>
      <div class="stat-value" id="totalOrders">0</div>
    </div>

    <div class="card">
      <div class="stat-title">Revenue</div>
      <div class="stat-value" id="totalRevenue">
        TZS 0
      </div>
    </div>

  </div>


  <div class="grid">

    <div class="card">

      <h2>👥 Users Overview</h2>

      <div class="bar">
        <div class="bar-top">
          <span>Students</span>
          <strong id="studentsCount">0</strong>
        </div>

        <div class="track">
          <div
            class="fill"
            id="studentsBar"
            style="width:0%"
          ></div>
        </div>
      </div>

      <div class="bar">
        <div class="bar-top">
          <span>Instructors</span>
          <strong id="instructorsCount">0</strong>
        </div>

        <div class="track">
          <div
            class="fill"
            id="instructorsBar"
            style="width:0%"
          ></div>
        </div>
      </div>

      <div class="bar">
        <div class="bar-top">
          <span>Admins</span>
          <strong id="adminsCount">0</strong>
        </div>

        <div class="track">
          <div
            class="fill"
            id="adminsBar"
            style="width:0%"
          ></div>
        </div>
      </div>

    </div>


    <div class="card">

      <h2>💰 Revenue Analytics</h2>

      <div class="bar">
        <div class="bar-top">
          <span>Paid Orders</span>
          <strong id="paidOrders">0</strong>
        </div>

        <div class="track">
          <div
            class="fill"
            id="paidBar"
            style="width:0%"
          ></div>
        </div>
      </div>

      <div class="bar">
        <div class="bar-top">
          <span>Pending Orders</span>
          <strong id="pendingOrders">0</strong>
        </div>

        <div class="track">
          <div
            class="fill"
            id="pendingBar"
            style="width:0%"
          ></div>
        </div>
      </div>

      <div class="bar">
        <div class="bar-top">
          <span>Failed Orders</span>
          <strong id="failedOrders">0</strong>
        </div>

        <div class="track">
          <div
            class="fill"
            id="failedBar"
            style="width:0%"
          ></div>
        </div>
      </div>

    </div>

  </div>


  <div class="card" style="margin-top:18px">

    <h2>🎓 Courses Analytics</h2>

    <div
      id="coursesContainer"
      class="table-wrap"
    >
      <div class="loading">
        Loading courses...
      </div>
    </div>

  </div>


  <div class="card" style="margin-top:18px">

    <h2>🛒 Recent Orders</h2>

    <div
      id="ordersContainer"
      class="table-wrap"
    >
      <div class="loading">
        Loading orders...
      </div>
    </div>

  </div>

</div>

<div id="toast" class="toast"></div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey:
    "AIzaSyBcOYDfAVKXbKxbjsyRgI_0rjodBn678tCc",
  authDomain:
    "let-s-study-pro-course.firebaseapp.com",
  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId:
    "let-s-study-pro-course",
  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:
    "474928293390",
  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId:
    "G-85B7V5H5J0"
};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


let users = [];
let courses = [];
let orders = [];


/* =====================================
   HELPERS
===================================== */

function money(value){

  return "TZS " +
    Number(
      value || 0
    ).toLocaleString();

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function toast(message){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    message;

  el.style.display =
    "block";

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      () => {
        el.style.display =
          "none";
      },
      3000
    );

}


/* =====================================
   LOAD DATA
===================================== */

async function loadAnalytics(){

  try{

    const [
      userSnap,
      courseSnap,
      orderSnap
    ] = await Promise.all([

      getDocs(
        collection(
          db,
          "users"
        )
      ),

      getDocs(
        collection(
          db,
          "courses"
        )
      ),

      getDocs(
        collection(
          db,
          "orders"
        )
      )

    ]);


    users =
      userSnap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    courses =
      courseSnap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    orders =
      orderSnap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    renderAnalytics();


  }
  catch(error){

    console.error(
      "Analytics error:",
      error
    );

    toast(
      "Failed to load analytics."
    );

  }

}


/* =====================================
   RENDER
===================================== */

function renderAnalytics(){

  const students =
    users.filter(
      u =>
        String(
          u.role || "student"
        ).toLowerCase() ===
        "student"
    ).length;


  const instructors =
    users.filter(
      u =>
        String(
          u.role || ""
        ).toLowerCase() ===
        "instructor"
    ).length;


  const admins =
    users.filter(
      u =>
        [
          "admin",
          "superadmin",
          "super_admin",
          "administrator"
        ].includes(
          String(
            u.role || ""
          ).toLowerCase()
        )
    ).length;


  const paid =
    orders.filter(
      o =>
        [
          "paid",
          "completed",
          "success",
          "successful"
        ].includes(
          String(
            o.status || ""
          ).toLowerCase()
        )
    );


  const pending =
    orders.filter(
      o =>
        String(
          o.status || ""
        ).toLowerCase() ===
        "pending"
    );


  const failed =
    orders.filter(
      o =>
        [
          "failed",
          "cancelled",
          "canceled"
        ].includes(
          String(
            o.status || ""
          ).toLowerCase()
        )
    );


  const revenue =
    paid.reduce(
      (
        total,
        order
      ) =>
        total +
        Number(
          order.amount ||
          order.total ||
          order.price ||
          0
        ),
      0
    );


  document.getElementById(
    "totalUsers"
  ).textContent =
    users.length.toLocaleString();


  document.getElementById(
    "totalCourses"
  ).textContent =
    courses.length.toLocaleString();


  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length.toLocaleString();


  document.getElementById(
    "totalRevenue"
  ).textContent =
    money(revenue);


  document.getElementById(
    "studentsCount"
  ).textContent =
    students;


  document.getElementById(
    "instructorsCount"
  ).textContent =
    instructors;


  document.getElementById(
    "adminsCount"
  ).textContent =
    admins;


  const maxUsers =
    Math.max(
      users.length,
      1
    );


  document.getElementById(
    "studentsBar"
  ).style.width =
    (
      students /
      maxUsers *
      100
    ) + "%";


  document.getElementById(
    "instructorsBar"
  ).style.width =
    (
      instructors /
      maxUsers *
      100
    ) + "%";


  document.getElementById(
    "adminsBar"
  ).style.width =
    (
      admins /
      maxUsers *
      100
    ) + "%";


  document.getElementById(
    "paidOrders"
  ).textContent =
    paid.length;


  document.getElementById(
    "pendingOrders"
  ).textContent =
    pending.length;


  document.getElementById(
    "failedOrders"
  ).textContent =
    failed.length;


  const maxOrders =
    Math.max(
      orders.length,
      1
    );


  document.getElementById(
    "paidBar"
  ).style.width =
    (
      paid.length /
      maxOrders *
      100
    ) + "%";


  document.getElementById(
    "pendingBar"
  ).style.width =
    (
      pending.length /
      maxOrders *
      100
    ) + "%";


  document.getElementById(
    "failedBar"
  ).style.width =
    (
      failed.length /
      maxOrders *
      100
    ) + "%";


  renderCourses();

  renderOrders();

}


/* =====================================
   COURSES
===================================== */

function renderCourses(){

  const container =
    document.getElementById(
      "coursesContainer"
    );


  if(!courses.length){

    container.innerHTML =
      `<div class="empty">
        No courses found.
      </div>`;

    return;

  }


  container.innerHTML = `

    <table>

      <thead>

        <tr>
          <th>Course</th>
          <th>Category</th>
          <th>Price</th>
          <th>Students</th>
        </tr>

      </thead>

      <tbody>

        ${
          courses
          .slice(0,20)
          .map(
            course => `

              <tr>

                <td>
                  ${escapeHTML(
                    course.title ||
                    course.name ||
                    "Untitled"
                  )}
                </td>

                <td>
                  ${escapeHTML(
                    course.category ||
                    "General"
                  )}
                </td>

                <td>
                  ${money(
                    course.price
                  )}
                </td>

                <td>
                  ${Number(
                    course.students ||
                    course.enrollments ||
                    0
                  ).toLocaleString()}
                </td>

              </tr>

            `
          )
          .join("")
        }

      </tbody>

    </table>

  `;

}


/* =====================================
   ORDERS
===================================== */

function renderOrders(){

  const container =
    document.getElementById(
      "ordersContainer"
    );


  if(!orders.length){

    container.innerHTML =
      `<div class="empty">
        No orders found.
      </div>`;

    return;

  }


  container.innerHTML = `

    <table>

      <thead>

        <tr>
          <th>Order</th>
          <th>User</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>

      </thead>

      <tbody>

        ${
          orders
          .slice(0,30)
          .map(
            order => `

              <tr>

                <td>
                  ${escapeHTML(
                    order.id
                  )}
                </td>

                <td>
                  ${escapeHTML(
                    order.email ||
                    order.userEmail ||
                    order.uid ||
                    "Unknown"
                  )}
                </td>

                <td>
                  ${money(
                    order.amount ||
                    order.total ||
                    order.price
                  )}
                </td>

                <td>
                  ${escapeHTML(
                    order.status ||
                    "pending"
                  )}
                </td>

              </tr>

            `
          )
          .join("")
        }

      </tbody>

    </table>

  `;

}


/* =====================================
   SEARCH
===================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function(){

      const q =
        this.value
          .toLowerCase()
          .trim();


      const filteredCourses =
        courses.filter(
          course =>
            JSON.stringify(
              course
            )
            .toLowerCase()
            .includes(q)
        );


      const old =
        courses;


      courses =
        filteredCourses;

      renderCourses();

      courses =
        old;


      const filteredOrders =
        orders.filter(
          order =>
            JSON.stringify(
              order
            )
            .toLowerCase()
            .includes(q)
        );


      const oldOrders =
        orders;

      orders =
        filteredOrders;

      renderOrders();

      orders =
        oldOrders;

    }
  );


/* =====================================
   REFRESH
===================================== */

window.refreshAnalytics =
  async function(){

    toast(
      "Refreshing analytics..."
    );

    await loadAnalytics();

    toast(
      "Analytics updated."
    );

  };


/* =====================================
   EXPORT
===================================== */

window.exportAnalytics =
  function(){

    const rows = [

      [
        "Metric",
        "Value"
      ],

      [
        "Users",
        users.length
      ],

      [
        "Courses",
        courses.length
      ],

      [
        "Orders",
        orders.length
      ],

      [
        "Revenue",
        orders
          .filter(
            o =>
              [
                "paid",
                "completed",
                "success"
              ].includes(
                String(
                  o.status || ""
                ).toLowerCase()
              )
          )
          .reduce(
            (
              total,
              o
            ) =>
              total +
              Number(
                o.amount ||
                o.total ||
                o.price ||
                0
              ),
            0
          )
      ]

    ];


    const csv =
      rows
      .map(
        row =>
          row
          .map(
            value =>
              `"${String(
                value ?? ""
              ).replace(
                /"/g,
                '""'
              )}"`
          )
          .join(",")
      )
      .join("\n");


    const blob =
      new Blob(
        [csv],
        {
          type:
            "text/csv;charset=utf-8"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href =
      url;

    a.download =
      "letsstudy-analytics.csv";

    a.click();

    URL.revokeObjectURL(
      url
    );

  };


loadAnalytics();

</script>

</body>
</html>
