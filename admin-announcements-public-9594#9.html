<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    addDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* FIREBASE CONFIG */

  const firebaseConfig = {
    apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
    authDomain: "let-s-study-pro-course.firebaseapp.com",
    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId: "let-s-study-pro-course",
    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",
    messagingSenderId: "474928293390",
    appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId: "G-85B7V5H5J0"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const announcementsRef =
    collection(db, "announcements");


  /* ELEMENTS */

  const announcementsList =
    document.getElementById("announcementsList");

  const searchInput =
    document.getElementById("searchInput");

  const modal =
    document.getElementById("announcementModal");

  const form =
    document.getElementById("announcementForm");

  const modalTitle =
    document.getElementById("modalTitle");

  const announcementId =
    document.getElementById("announcementId");

  const recordIdBox =
    document.getElementById("recordIdBox");

  const title =
    document.getElementById("title");

  const category =
    document.getElementById("category");

  const status =
    document.getElementById("status");

  const description =
    document.getElementById("description");

  const details =
    document.getElementById("details");

  const image =
    document.getElementById("image");

  const link =
    document.getElementById("link");

  const date =
    document.getElementById("date");

  const saveBtn =
    document.getElementById("saveBtn");


  let announcements = [];


  /* LOAD */

  async function loadAnnouncements() {

    announcementsList.innerHTML = `
      <div class="loading">
        Loading announcements...
      </div>
    `;

    try {

      const snapshot =
        await getDocs(announcementsRef);

      announcements = [];

      snapshot.forEach(item => {

        announcements.push({
          id: item.id,
          ...item.data()
        });

      });

      announcements.sort((a, b) => {

        const dateA =
          getDateValue(a.createdAt || a.date);

        const dateB =
          getDateValue(b.createdAt || b.date);

        return dateB - dateA;

      });

      updateStats();

      renderAnnouncements();

    } catch (error) {

      console.error(error);

      announcementsList.innerHTML = `
        <div class="empty">
          <h3>Unable to load announcements</h3>
          <p>${escapeHtml(error.message)}</p>
        </div>
      `;

    }

  }


  /* STATS */

  function updateStats() {

    const total =
      announcements.length;

    const published =
      announcements.filter(
        item =>
          item.status === "published"
      ).length;

    const draft =
      announcements.filter(
        item =>
          item.status !== "published"
      ).length;

    document.getElementById(
      "totalCount"
    ).textContent = total;

    document.getElementById(
      "publishedCount"
    ).textContent = published;

    document.getElementById(
      "draftCount"
    ).textContent = draft;

  }


  /* RENDER */

  function renderAnnouncements() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    const filtered =
      announcements.filter(item => {

        const text = [
          item.title,
          item.category,
          item.description,
          item.details,
          item.status,
          item.id
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return text.includes(search);

      });


    if (!filtered.length) {

      announcementsList.innerHTML = `
        <div class="empty">

          <h3>
            No announcements found
          </h3>

          <p>
            Create your first announcement
            using the button above.
          </p>

        </div>
      `;

      return;
    }


    announcementsList.innerHTML =
      filtered.map(item => {

        const itemTitle =
          item.title ||
          "Untitled Announcement";

        const itemDescription =
          item.description ||
          item.content ||
          item.message ||
          "No description available.";

        const itemCategory =
          item.category ||
          item.type ||
          "General";

        const itemStatus =
          item.status === "published"
            ? "published"
            : "draft";

        const imageUrl =
          item.image ||
          item.thumbnail ||
          item.imageUrl ||
          "";


        const imageHtml =
          imageUrl
            ? `
              <img
                class="card-image"
                src="${escapeAttribute(imageUrl)}"
                alt="${escapeAttribute(itemTitle)}"
                onerror="this.style.display='none'"
              >
            `
            : `
              <div
                class="card-image"
                style="
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  color:#98a2b3;
                "
              >
                No Image
              </div>
            `;


        return `

                data-action="delete"

/* SAVE */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const currentId =
      announcementId.value.trim();

    const data = {

      title:
        title.value.trim(),

      category:
        category.value.trim(),

      status:
        status.value,

      description:
        description.value.trim(),

      details:
        details.value.trim(),

      image:
        image.value.trim(),

      link:
        link.value.trim(),

      date:
        date.value || "",

      updatedAt:
        serverTimestamp()

    };

    if (!data.title) {

      showToast(
        "Please enter an announcement title."
      );

      title.focus();

      return;
    }

    saveBtn.disabled = true;

    saveBtn.textContent =
      currentId
        ? "Updating..."
        : "Saving...";

    try {

      if (currentId) {

        await updateDoc(
          doc(
            db,
            "announcements",
            currentId
          ),
          data
        );

        showToast(
          "Announcement updated successfully."
        );

      } else {

        data.createdAt =
          serverTimestamp();

        data.createdBy =
          "LetsStudy Pro Admin";

        const newDoc =
          await addDoc(
            announcementsRef,
            data
          );

        console.log(
          "New announcement ID:",
          newDoc.id
        );

        showToast(
          "Announcement created successfully."
        );

      }

      closeModal();

      await loadAnnouncements();

    } catch (error) {

      console.error(error);

      showToast(
        "Save failed: " +
        error.message
      );

    } finally {

      saveBtn.disabled = false;

      saveBtn.textContent =
        currentId
          ? "Update Announcement"
          : "Save Announcement";

    }

  }
);


/* DELETE */

async function deleteAnnouncement(id) {

  const item =
    announcements.find(
      announcement =>
        announcement.id === id
    );

  if (!item) return;

  const confirmed =
    confirm(
      `Delete "${item.title || "this announcement"}"?`
    );

  if (!confirmed) return;

  try {

    await deleteDoc(
      doc(
        db,
        "announcements",
        id
      )
    );

    showToast(
      "Announcement deleted successfully."
    );

    await loadAnnouncements();

  } catch (error) {

    console.error(error);

    showToast(
      "Delete failed: " +
      error.message
    );

  }

}

/* HELPERS */

function normalizeDate(value) {

  if (!value) return "";

  if (
    typeof value === "object" &&
    value !== null &&
    typeof value.seconds === "number"
  ) {

    return new Date(
      value.seconds * 1000
    )
      .toISOString()
      .split("T")[0];

  }

  const parsed =
    new Date(value);

  if (
    Number.isNaN(
      parsed.getTime()
    )
  ) {

    return "";

  }

  return parsed
    .toISOString()
    .split("T")[0];

}


function getDateValue(value) {

  if (!value) return 0;

  if (
    typeof value === "object" &&
    value !== null &&
    typeof value.seconds === "number"
  ) {

    return value.seconds * 1000;

  }

  const parsed =
    new Date(value).getTime();

  return Number.isNaN(parsed)
    ? 0
    : parsed;

}


function truncate(text, length) {

  const value =
    String(text || "");

  if (
    value.length <= length
  ) {

    return value;

  }

  return (
    value.substring(0, length) +
    "..."
  );

}


function capitalize(value) {

  const text =
    String(value || "");

  return (
    text.charAt(0).toUpperCase() +
    text.slice(1)
  );

}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


/* TOAST */

function showToast(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      () => {

        toast.style.display =
          "none";

      },
      3500
    );

}
