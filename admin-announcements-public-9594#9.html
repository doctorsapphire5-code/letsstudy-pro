<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Announcements | LetsStudy Pro Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background:#f6f8fc;
  color:#111827;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:20;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  color:#2563eb;
  font-size:21px;
  font-weight:900;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:10px;
}

button,
.btn{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2ff;
  color:#1d4ed8;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.success{
  background:#dcfce7;
  color:#15803d;
}

main{
  max-width:1200px;
  margin:auto;
  padding:30px 16px;
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.page-title h1{
  margin:0;
  font-size:30px;
}

.page-title p{
  margin:6px 0 0;
  color:#6b7280;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:5px;
}

.toolbar{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:15px;
  margin-bottom:20px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font:inherit;
  background:#fff;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.search{
  max-width:500px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:18px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#e5e7eb;
}

.card-body{
  padding:18px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#eff6ff;
  color:#1d4ed8;
  font-size:11px;
  font-weight:800;
}

.status{
  float:right;
  font-size:11px;
  font-weight:800;
}

.status.published{
  color:#15803d;
}

.status.draft{
  color:#b45309;
}

.card h3{
  margin:12px 0 8px;
  font-size:20px;
}

.card p{
  color:#6b7280;
  line-height:1.6;
  font-size:14px;
}

.card-id{
  color:#9ca3af;
  font-size:11px;
  word-break:break-all;
  margin-top:10px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.actions button{
  flex:1;
}

.empty{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:50px 20px;
  text-align:center;
  color:#6b7280;
}

.loading{
  text-align:center;
  padding:50px;
  color:#6b7280;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}

.modal{
  width:100%;
  max-width:700px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:25px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-header h2{
  margin:0;
}

.close{
  background:#f3f4f6;
  color:#374151;
  border-radius:50%;
  width:38px;
  height:38px;
  padding:0;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.form-actions button{
  flex:1;
}

#adminArea{
  display:none;
}

#loginMessage{
  max-width:600px;
  margin:80px auto;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:35px;
  text-align:center;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr;
  }

  .page-title{
    align-items:flex-start;
    flex-direction:column;
  }

  .page-title button{
    width:100%;
  }

  .actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">LetsStudy Pro</div>

    <div class="nav-right">
      <a href="index.html" class="btn secondary">Website</a>
      <button id="logoutBtn" class="btn danger">Logout</button>
    </div>
  </div>
</header>

<div id="loginMessage">
  <h2>Checking administrator access...</h2>
  <p>Please wait.</p>
</div>

<div id="adminArea">

<main>

  <div class="page-title">
    <div>
      <h1>Announcements</h1>
      <p>Create and manage LetsStudy Pro announcements.</p>
    </div>

    <button id="addBtn" class="primary">
      + Add Announcement
    </button>
  </div>

  <section class="stats">

    <div class="stat">
      Total
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat">
      Published
      <strong id="publishedCount">0</strong>
    </div>

    <div class="stat">
      Draft
      <strong id="draftCount">0</strong>
    </div>

  </section>

  <div class="toolbar">

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search announcements..."
    >

  </div>

  <div id="announcementList">
    <div class="loading">
      Loading announcements...
    </div>
  </div>

</main>

</div>

<!-- MODAL -->

<div id="modalOverlay" class="overlay">

  <div class="modal">

    <div class="modal-header">

      <h2 id="modalTitle">
        Add Announcement
      </h2>

      <button
        id="closeModal"
        class="close"
        type="button"
      >
        ×
      </button>

    </div>

    <form id="announcementForm">

      <input
        type="hidden"
        id="announcementDocId"
      >

      <div class="form-group">
        <label>Title *</label>

        <input
          id="title"
          required
          placeholder="Announcement title"
        >
      </div>

      <div class="form-group">
        <label>Category</label>

        <input
          id="category"
          placeholder="News, Update, Education..."
        >
      </div>

      <div class="form-group">
        <label>Description *</label>

        <textarea
          id="description"
          required
          placeholder="Write announcement..."
        ></textarea>
      </div>

      <div class="form-group">
        <label>Details</label>

        <textarea
          id="details"
          placeholder="Additional details..."
        ></textarea>
      </div>

      <div class="form-group">
        <label>Image URL</label>

        <input
          id="image"
          type="url"
          placeholder="https://..."
        >
      </div>

      <div class="form-group">
        <label>Learn More Link</label>

        <input
          id="link"
          type="url"
          placeholder="https://letsstudy.pro/..."
        >
      </div>

      <div class="form-group">
        <label>Status</label>

        <select id="status">

          <option value="published">
            Published
          </option>

          <option value="draft">
            Draft
          </option>

        </select>
      </div>

      <div class="form-group">
        <label>Date</label>

        <input
          id="date"
          type="date"
        >
      </div>

      <div class="form-actions">

        <button
          type="button"
          id="cancelBtn"
          class="secondary"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="primary"
          id="saveBtn"
        >
          Save Announcement
        </button>

      </div>

    </form>

  </div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXKbljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const loginMessage =
  document.getElementById("loginMessage");

const adminArea =
  document.getElementById("adminArea");

const list =
  document.getElementById("announcementList");

const modal =
  document.getElementById("modalOverlay");

const form =
  document.getElementById("announcementForm");

let announcements = [];


/* =========================
   ADMIN AUTHENTICATION
========================= */

onAuthStateChanged(auth, async user => {

  if(!user){

    loginMessage.innerHTML = `
      <h2>Admin Login Required</h2>

      <p>
        Please sign in with an administrator account.
      </p>

      <a
        href="auth-admin.html"
        class="btn primary"
      >
        Admin Login
      </a>
    `;

    return;
  }


  try{

    const adminRef =
      doc(
        db,
        "admins",
        user.uid
      );

    const adminSnap =
      await getDoc(adminRef);


    if(
      !adminSnap.exists()
    ){

      await signOut(auth);

      loginMessage.innerHTML = `
        <h2>Access Denied</h2>
        <p>
          Your account is not registered
          as an administrator.
        </p>
      `;

      return;
    }


    const adminData =
      adminSnap.data();


    if(
      adminData.status === "suspended" ||
      adminData.status === "banned"
    ){

      await signOut(auth);

      loginMessage.innerHTML = `
        <h2>Access Denied</h2>
        <p>
          Your administrator account
          is not active.
        </p>
      `;

      return;
    }


    loginMessage.style.display =
      "none";

    adminArea.style.display =
      "block";

    loadAnnouncements();

  }catch(error){

    console.error(error);

    loginMessage.innerHTML = `
      <h2>Access Error</h2>
      <p>
        Unable to verify administrator access.
      </p>
    `;

  }

});


/* =========================
   LOAD ANNOUNCEMENTS
========================= */

async function loadAnnouncements(){

  try{

    const q =
      query(
        collection(
          db,
          "announcements"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const snapshot =
      await getDocs(q);


    announcements =
      snapshot.docs.map(doc => ({

        id: doc.id,

        ...doc.data()

      }));


    renderAnnouncements();

  }catch(error){

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        <h3>Unable to load announcements</h3>
        <p>
          ${escapeHtml(error.message)}
        </p>
      </div>
    `;

  }

}


/* =========================
   RENDER
========================= */

function renderAnnouncements(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    announcements.filter(item => {

      const text = [

        item.title,
        item.description,
        item.category,
        item.status

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      return text.includes(search);

    });


  const published =
    announcements.filter(
      x => x.status === "published"
    ).length;


  const draft =
    announcements.filter(
      x => x.status === "draft"
    ).length;


  document.getElementById(
    "totalCount"
  ).textContent =
    announcements.length;


  document.getElementById(
    "publishedCount"
  ).textContent =
    published;


  document.getElementById(
    "draftCount"
  ).textContent =
    draft;


  if(!filtered.length){

    list.innerHTML = `
      <div class="empty">

        <h3>No announcements found</h3>

        <p>
          Create your first announcement.
        </p>

      </div>
    `;

    return;
  }


  list.innerHTML = `

    <div class="grid">

      ${filtered.map(item => {

        const image =
          item.image ||
          item.thumbnail ||
          "https://images.unsplash.com/photo-1495020689067-958852a7765e?auto=format&fit=crop&w=900&q=80";


        const title =
          item.title ||
          "Untitled Announcement";


        const description =
          item.description ||
          item.content ||
          "";


        const category =
          item.category ||
          "Announcement";


        const status =
          item.status ||
          "published";


        return `

          <article class="card">

            <img
              src="${escapeAttribute(image)}"
              alt="${escapeAttribute(title)}"
              onerror="this.style.display='none'"
            >

            <div class="card-body">

              <span class="badge">
                ${escapeHtml(category)}
              </span>

              <span
                class="status ${status}"
              >
                ${status.toUpperCase()}
              </span>

              <h3>
                ${escapeHtml(title)}
              </h3>

              <p>
                ${escapeHtml(
                  description.substring(0,180)
                )}
                ${description.length > 180 ? "..." : ""}
              </p>

              <div class="card-id">
                ID: ${escapeHtml(item.id)}
              </div>

              <div class="actions">

                <button
                  class="secondary"
                  onclick="editAnnouncement('${item.id}')"
                >
                  Edit
                </button>

                <button
                  class="danger"
                  onclick="deleteAnnouncement('${item.id}')"
                >
                  Delete
                </button>

              </div>

            </div>

          </article>

        `;

      }).join("")}

    </div>

  `;

}


/* =========================
   OPEN ADD
========================= */

document
  .getElementById("addBtn")
  .addEventListener(
    "click",
    () => {

      form.reset();

      document.getElementById(
        "announcementDocId"
      ).value = "";

      document.getElementById(
        "modalTitle"
      ).textContent =
        "Add Announcement";

      document.getElementById(
        "status"
      ).value =
        "published";

      document.getElementById(
        "date"
      ).value =
        new Date()
          .toISOString()
          .split("T")[0];

      openModal();

    }
  );


/* =========================
   EDIT
========================= */

window.editAnnouncement =
  function(id){

    const item =
      announcements.find(
        x => x.id === id
      );

    if(!item) return;


    document.getElementById(
      "announcementDocId"
    ).value =
      id;


    document.getElementById(
      "title"
    ).value =
      item.title || "";


    document.getElementById(
      "category"
    ).value =
      item.category || "";


    document.getElementById(
      "description"
    ).value =
      item.description ||
      item.content ||
      "";


    document.getElementById(
      "details"
    ).value =
      item.details || "";


    document.getElementById(
      "image"
    ).value =
      item.image ||
      item.imageUrl ||
      "";


    document.getElementById(
      "link"
    ).value =
      item.link ||
      item.url ||
      "";


    document.getElementById(
      "status"
    ).value =
      item.status ||
      "published";


    document.getElementById(
      "date"
    ).value =
      normalizeDate(item.date);


    document.getElementById(
      "modalTitle"
    ).textContent =
      "Edit Announcement";


    openModal();

  };


/* =========================
   SAVE
========================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const saveBtn =
      document.getElementById(
        "saveBtn"
      );


    const id =
      document.getElementById(
        "announcementDocId"
      ).value;


    const data = {

      title:
        document
          .getElementById("title")
          .value
          .trim(),

      category:
        document
          .getElementById("category")
          .value
          .trim(),

      description:
        document
          .getElementById("description")
          .value
          .trim(),

      details:
        document
          .getElementById("details")
          .value
          .trim(),

      image:
        document
          .getElementById("image")
          .value
          .trim(),

      link:
        document
          .getElementById("link")
          .value
          .trim(),

      status:
        document
          .getElementById("status")
          .value,

      date:
        document
          .getElementById("date")
          .value,

      updatedAt:
        serverTimestamp()

    };


    if(!data.title){

      alert(
        "Please enter an announcement title."
      );

      return;
    }


    try{

      saveBtn.disabled = true;

      saveBtn.textContent =
        "Saving...";


      if(id){

        await updateDoc(

          doc(
            db,
            "announcements",
            id
          ),

          data

        );

      }else{

        await addDoc(

          collection(
            db,
            "announcements"
          ),

          {

            ...data,

            createdAt:
              serverTimestamp(),

            createdBy:
              auth.currentUser?.uid || ""

          }

        );

      }


      closeModal();

      await loadAnnouncements();


    }catch(error){

      console.error(error);

      alert(
        "Unable to save announcement: " +
        error.message
      );

    }finally{

      saveBtn.disabled = false;

      saveBtn.textContent =
        "Save Announcement";

    }

  }
);


/* =========================
   DELETE
========================= */

window.deleteAnnouncement =
  async function(id){

    const item =
      announcements.find(
        x => x.id === id
      );


    if(!item) return;


    const confirmed =
      confirm(
        `Delete "${item.title || "this announcement"}"?`
      );


    if(!confirmed) return;


    try{

      await deleteDoc(

        doc(
          db,
          "announcements",
          id
        )

      );

      await loadAnnouncements();

    }catch(error){

      console.error(error);

      alert(
        "Unable to delete announcement: " +
        error.message
      );

    }

  };


/* =========================
   MODAL
========================= */

function openModal(){

  modal.style.display =
    "flex";

}


function closeModal(){

  modal.style.display =
    "none";

}


document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("cancelBtn")
  .addEventListener(
    "click",
    closeModal
  );


modal.addEventListener(
  "click",
  event => {

    if(
      event.target === modal
    ){

      closeModal();

    }

  }
);


/* =========================
   SEARCH
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderAnnouncements
  );


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

        window.location.href =
          "auth-admin.html";

      } catch (error) {

        console.error(error);

        alert(
          "Unable to sign out. Please try again."
        );

      }

    }
  );


/* =========================
   MODAL CLOSE
========================= */

window.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape" &&
      modal.style.display === "flex"
    ){

      closeModal();

    }

  }
);


/* =========================
   HELPERS
========================= */

function normalizeDate(value){

  if(!value){
    return "";
  }

  /*
    Firestore Timestamp
  */

  if(
    typeof value === "object" &&
    value !== null &&
    typeof value.seconds === "number"
  ){

    return new Date(
      value.seconds * 1000
    )
    .toISOString()
    .split("T")[0];

  }


  /*
    JavaScript Date / String
  */

  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return date
    .toISOString()
    .split("T")[0];

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   ESCAPE ATTRIBUTE
========================= */

function escapeAttribute(value){

  return escapeHtml(value);

}


/* =========================
   INITIAL DATE
========================= */

if(
  !document.getElementById("date").value
){

  document.getElementById(
    "date"
  ).value =
    new Date()
      .toISOString()
      .split("T")[0];

}


/* =========================
   CLOSE MODAL WHEN CLICKING
   OUTSIDE
========================= */

modal.addEventListener(
  "click",
  event => {

    if(
      event.target === modal
    ){

      closeModal();

    }

  }
);


/* =========================
   START
========================= */

console.log(
  "LetsStudy Pro Admin Announcements loaded."
);

</script>

</body>
</html>
