<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Announcements | LetsStudy Pro Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Inter,Arial,sans-serif;
background:#f5f7fb;
color:#101828
}

button,input,textarea,select{font:inherit}

button{
border:0;
cursor:pointer;
border-radius:10px;
padding:11px 16px;
font-weight:800
}

.primary{background:#155eef;color:#fff}
.secondary{background:#eef4ff;color:#155eef}
.danger{background:#fee4e2;color:#b42318}

.header{
height:68px;
background:#fff;
border-bottom:1px solid #eaecf0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
position:sticky;
top:0;
z-index:20
}

.logo{
font-size:21px;
font-weight:900;
color:#155eef
}

.admin-label{
font-size:13px;
color:#667085
}

.container{
width:min(1200px,100%);
margin:auto;
padding:25px 18px 60px
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
flex-wrap:wrap;
margin-bottom:22px
}

h1{font-size:28px}

.subtitle{
color:#667085;
margin-top:4px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px
}

.stat{
background:#fff;
border:1px solid #eaecf0;
border-radius:15px;
padding:18px
}

.stat span{
font-size:13px;
color:#667085
}

.stat strong{
display:block;
font-size:28px;
margin-top:5px
}

.card{
background:#fff;
border:1px solid #eaecf0;
border-radius:16px;
padding:18px;
margin-bottom:15px
}

.filters{
display:flex;
gap:10px;
flex-wrap:wrap
}

.search{
flex:1;
min-width:220px;
padding:12px 14px;
border:1px solid #d0d5dd;
border-radius:10px;
outline:none
}

.search:focus,
input:focus,
textarea:focus,
select:focus{
border-color:#155eef;
box-shadow:0 0 0 3px #155eef12
}

.announcement{
display:flex;
justify-content:space-between;
gap:20px;
align-items:flex-start
}

.content{
flex:1
}

.title{
font-size:19px;
font-weight:850
}

.message{
color:#667085;
font-size:14px;
margin-top:7px;
white-space:pre-wrap
}

.meta{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:14px
}

.badge{
font-size:11px;
font-weight:800;
padding:6px 10px;
border-radius:20px;
background:#f2f4f7;
color:#475467
}

.high{
background:#fee4e2;
color:#b42318
}

.medium{
background:#fff4e5;
color:#b54708
}

.low{
background:#ecfdf3;
color:#027a48
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}

.empty,.loading{
text-align:center;
padding:45px 20px;
color:#667085
}

.error{
display:none;
background:#fef3f2;
border:1px solid #fecdca;
color:#b42318;
padding:13px;
border-radius:10px;
margin-bottom:15px
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
align-items:center;
justify-content:center;
padding:15px
}

.modal.show{display:flex}

.modal-box{
background:#fff;
width:min(680px,100%);
max-height:94vh;
overflow:auto;
border-radius:18px;
padding:22px
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px
}

.close{
background:#f2f4f7;
font-size:18px;
padding:8px 13px
}

.form-group{margin-bottom:15px}

label{
display:block;
font-size:13px;
font-weight:800;
margin-bottom:6px
}

input,textarea,select{
width:100%;
padding:12px;
border:1px solid #d0d5dd;
border-radius:10px;
outline:none;
background:#fff
}

textarea{resize:vertical}

.footer-actions{
display:flex;
justify-content:flex-end;
gap:9px;
margin-top:20px
}

@media(max-width:700px){

.container{padding:18px 12px}

.stats{grid-template-columns:1fr}

.announcement{flex-direction:column}

.actions{width:100%}

.actions button{flex:1}

}
</style>
</head>

<body>

<header class="header">

<div class="logo">
LetsStudy Pro
</div>

<div class="admin-label">
Admin • Announcements
</div>

</header>


<main class="container">

<div class="top">

<div>
<h1>Announcements</h1>
<p class="subtitle">
Manage course announcements and updates.
</p>
</div>

<button
class="primary"
onclick="openCreate()">

+ Add Announcement

</button>

</div>


<div id="error" class="error"></div>


<div class="stats">

<div class="stat">
<span>Total Announcements</span>
<strong id="total">0</strong>
</div>

<div class="stat">
<span>Courses</span>
<strong id="courseCount">0</strong>
</div>

<div class="stat">
<span>High Priority</span>
<strong id="highCount">0</strong>
</div>

</div>


<div class="card">

<div class="filters">

<input
id="search"
class="search"
placeholder="Search announcements..."
oninput="render()"
>

<input
id="courseFilter"
class="search"
placeholder="Filter by courseId..."
oninput="render()"
>

<select
id="priorityFilter"
class="search"
onchange="render()">

<option value="">All priorities</option>
<option value="high">High</option>
<option value="medium">Medium</option>
<option value="low">Low</option>

</select>

</div>

</div>


<div id="announcementList">

<div class="loading">
Loading announcements...
</div>

</div>

</main>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
Add Announcement
</h2>

<button
class="close"
onclick="closeModal()">

×

</button>

</div>


<form id="announcementForm">


<div class="form-group">

<label>Course ID *</label>

<input
id="courseId"
required
placeholder="e.g. course123"
>

</div>


<div class="form-group">

<label>Title *</label>

<input
id="title"
required
placeholder="Announcement title"
>

</div>


<div class="form-group">

<label>Message *</label>

<textarea
id="message"
rows="6"
required
placeholder="Write announcement..."
></textarea>

</div>


<div class="form-group">

<label>Priority</label>

<select id="priority">

<option value="low">Low</option>
<option value="medium" selected>Medium</option>
<option value="high">High</option>

</select>

</div>


<div class="form-group">

<label>Publish Date</label>

<input
id="publishDate"
type="datetime-local"
>

</div>


<div class="footer-actions">

<button
type="button"
class="secondary"
onclick="closeModal()">

Cancel

</button>

<button
type="submit"
class="primary">

Save Announcement

</button>

</div>


</form>

</div>
</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================
FIREBASE CONFIG
===================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcXKAVXKbXkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let announcements=[];
let editingId=null;


/* =====================================
URL COURSE ID
===================================== */

const params=
new URLSearchParams(location.search);

const urlCourseId=
params.get("courseId");

if(urlCourseId){

document.getElementById("courseFilter").value=
urlCourseId;

}


/* =====================================
LOAD
===================================== */

async function loadAnnouncements(){

try{

const snap=
await getDocs(
collection(db,"announcements")
);

announcements=
snap.docs.map(d=>({
id:d.id,
...d.data()
}));

render();

}catch(error){

showError(error.message);

}

}


/* =====================================
RENDER
===================================== */

window.render=function(){

const search=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const course=
document.getElementById("courseFilter")
.value
.toLowerCase()
.trim();

const priority=
document.getElementById("priorityFilter")
.value
.toLowerCase();


const filtered=
announcements.filter(a=>{

const text=`

${a.title||""}
${a.message||""}
${a.courseId||""}
${a.priority||""}

`.toLowerCase();

return(
text.includes(search)&&
String(a.courseId||"")
.toLowerCase()
.includes(course)&&
(!priority||
String(a.priority||"")
.toLowerCase()===priority)
);

});


document.getElementById("total")
.textContent=announcements.length;


document.getElementById("courseCount")
.textContent=
new Set(
announcements
.map(a=>a.courseId)
.filter(Boolean)
).size;


document.getElementById("highCount")
.textContent=
announcements.filter(
a=>String(a.priority).toLowerCase()==="high"
).length;


if(!filtered.length){

document.getElementById("announcementList")
.innerHTML=`

<div class="card empty">
No announcements found.
</div>

`;

return;

}


document.getElementById("announcementList")
.innerHTML=
filtered
.map(a=>{

const p=
String(a.priority||"medium")
.toLowerCase();

return`

<div class="card announcement">

<div class="content">

<div class="title">

${escapeHTML(
a.title||"Untitled Announcement"
)}

</div>

<div class="message">

${escapeHTML(
a.message||""
)}

</div>


<div class="meta">

<span class="badge">
Course:
${escapeHTML(a.courseId||"-")}
</span>


<span class="badge ${p}">
${escapeHTML(p)}
</span>


<span class="badge">
Publish:
${formatDate(a.publishDate)}
</span>


<span class="badge">
ID:
${escapeHTML(a.id)}
</span>

</div>

</div>


<div class="actions">

<button
class="secondary"
onclick="editAnnouncement('${a.id}')">

Edit

</button>

<button
class="danger"
onclick="removeAnnouncement('${a.id}')">

Delete

</button>

</div>

</div>

`;

})
.join("");

};


/* =====================================
CREATE
===================================== */

window.openCreate=function(){

editingId=null;

document.getElementById("modalTitle")
.textContent="Add Announcement";

document.getElementById("announcementForm")
.reset();

if(urlCourseId){

document.getElementById("courseId")
.value=urlCourseId;

}

document.getElementById("priority")
.value="medium";

document.getElementById("modal")
.classList.add("show");

};


/* =====================================
EDIT
===================================== */

window.editAnnouncement=function(id){

const a=
announcements.find(
x=>x.id===id
);

if(!a)return;

editingId=id;

document.getElementById("modalTitle")
.textContent="Edit Announcement";

document.getElementById("courseId")
.value=a.courseId||"";

document.getElementById("title")
.value=a.title||"";

document.getElementById("message")
.value=a.message||"";

document.getElementById("priority")
.value=a.priority||"medium";

document.getElementById("publishDate")
.value=
toDateTimeLocal(a.publishDate);

document.getElementById("modal")
.classList.add("show");

};


/* =====================================
SAVE
===================================== */

document.getElementById("announcementForm")
.addEventListener("submit",async e=>{

e.preventDefault();

const courseId=
document.getElementById("courseId")
.value.trim();

const title=
document.getElementById("title")
.value.trim();

const message=
document.getElementById("message")
.value.trim();

const priority=
document.getElementById("priority")
.value;

const publishDate=
document.getElementById("publishDate")
.value;


if(!courseId||!title||!message){

showError(
"Course ID, title and message are required."
);

return;

}


const data={

courseId,
title,
message,
priority,
publishDate:
publishDate||"",
};


try{

if(editingId){

await updateDoc(
doc(db,"announcements",editingId),
{
...data,
updatedAt:serverTimestamp()
}
);

}else{

await addDoc(
collection(db,"announcements"),
{
...data,
createdBy:"admin",
createdAt:serverTimestamp()
}
);

}

closeModal();

await loadAnnouncements();

}catch(error){

showError(error.message);

}

});


/* =====================================
DELETE
===================================== */

window.removeAnnouncement=
async function(id){

const a=
announcements.find(
x=>x.id===id
);

if(!confirm(
`Delete "${a?.title||"this announcement"}"?`
))return;


try{

await deleteDoc(
doc(db,"announcements",id)
);

await loadAnnouncements();

}catch(error){

showError(error.message);

}

};


/* =====================================
CLOSE
===================================== */

window.closeModal=function(){

document.getElementById("modal")
.classList.remove("show");

};


/* =====================================
ERROR
===================================== */

function showError(message){

const el=
document.getElementById("error");

el.textContent=message;
el.style.display="block";

setTimeout(()=>{
el.style.display="none";
},6000);

}


/* =====================================
DATE
===================================== */

function formatDate(value){

if(!value)return"Not set";

const d=toDate(value);

if(!d)return"Invalid date";

return d.toLocaleString();

}


function toDate(value){

if(!value)return null;

if(typeof value.toDate==="function")
return value.toDate();

if(value.seconds)
return new Date(value.seconds*1000);

const d=new Date(value);

return isNaN(d.getTime())?null:d;

}


function toDateTimeLocal(value){

const d=toDate(value);

if(!d)return"";

const pad=n=>String(n).padStart(2,"0");

return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

}


/* =====================================
ESCAPE
===================================== */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================
START
===================================== */

loadAnnouncements();

</script>

</body>
</html>
