<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Assignments | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

.container{
max-width:1200px;
margin:auto;
padding:18px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:18px;
}

.header h1{
margin:0;
font-size:25px;
}

.header p{
margin:6px 0 0;
color:#64748b;
font-size:13px;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:18px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.field{
display:flex;
flex-direction:column;
gap:7px;
}

.field.full{
grid-column:1/-1;
}

label{
font-size:13px;
font-weight:bold;
color:#334155;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #dbe2ea;
border-radius:9px;
font-family:inherit;
outline:none;
background:#fff;
}

textarea{
min-height:130px;
resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
border-color:#2563eb;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
}

.btn{
border:0;
border-radius:9px;
padding:11px 16px;
font-weight:bold;
cursor:pointer;
}

.primary{
background:#2563eb;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#334155;
}

.danger{
background:#fee2e2;
color:#991b1b;
}

.btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.search{
margin-bottom:15px;
}

.search input{
max-width:450px;
}

.assignment-list{
display:grid;
gap:12px;
}

.assignment-item{
border:1px solid #e5e7eb;
border-radius:13px;
padding:16px;
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px;
}

.assignment-info{
flex:1;
}

.assignment-info h3{
margin:0 0 8px;
font-size:17px;
}

.assignment-info p{
margin:0 0 10px;
color:#64748b;
font-size:13px;
line-height:1.6;
}

.meta{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.badge{
display:inline-flex;
align-items:center;
gap:5px;
padding:6px 9px;
border-radius:20px;
font-size:11px;
background:#f1f5f9;
color:#475569;
}

.points{
background:#eff6ff;
color:#2563eb;
}

.deadline{
background:#fff7ed;
color:#c2410c;
}

.item-actions{
display:flex;
gap:7px;
}

.icon-btn{
width:38px;
height:38px;
border:0;
border-radius:8px;
cursor:pointer;
background:#f1f5f9;
color:#334155;
}

.icon-btn.edit{
color:#2563eb;
}

.icon-btn.delete{
color:#dc2626;
}

.message{
padding:12px;
border-radius:9px;
margin-bottom:15px;
font-size:13px;
display:none;
}

.success{
display:block;
background:#dcfce7;
color:#166534;
}

.error{
display:block;
background:#fee2e2;
color:#991b1b;
}

.loading,
.empty{
text-align:center;
padding:40px 20px;
color:#64748b;
}

@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

.field.full{
grid-column:auto;
}

.header{
flex-direction:column;
align-items:flex-start;
}

.assignment-item{
flex-direction:column;
}

.item-actions{
width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<div>

<h1>
<i class="fa-solid fa-list-check"></i>
Admin Assignments
</h1>

<p>
Create and manage course assignments
</p>

</div>

</div>


<!-- MESSAGE -->

<div
id="message"
class="message">
</div>


<!-- FORM -->

<div class="card">

<h2 id="formTitle">
Add Assignment
</h2>

<form id="assignmentForm">

<div class="grid">

<div class="field">

<label>
Course ID
</label>

<input
id="courseId"
type="text"
placeholder="Enter course ID"
required>

</div>


<div class="field">

<label>
Title
</label>

<input
id="title"
type="text"
placeholder="Assignment title"
required>

</div>


<div class="field full">

<label>
Instructions
</label>

<textarea
id="instructions"
placeholder="Write assignment instructions..."
required></textarea>

</div>


<div class="field">

<label>
Points
</label>

<input
id="points"
type="number"
min="0"
value="10"
required>

</div>


<div class="field">

<label>
Submission Type
</label>

<select id="submissionType">

<option value="text">
Text
</option>

<option value="file">
File
</option>

<option value="pdf">
PDF
</option>

<option value="document">
Document
</option>

<option value="both">
Text + File
</option>

</select>

</div>


<div class="field">

<label>
Deadline
</label>

<input
id="deadline"
type="datetime-local">

</div>

</div>


<div class="actions">

<button
id="saveBtn"
type="submit"
class="btn primary">

<i class="fa-solid fa-plus"></i>

Add Assignment

</button>


<button
id="cancelBtn"
type="button"
class="btn secondary"
style="display:none">

<i class="fa-solid fa-xmark"></i>

Cancel

</button>

</div>

</form>

</div>


<!-- LIST -->

<div class="card">

<h2>
Assignments
</h2>

<div class="search">

<input
id="searchInput"
type="search"
placeholder="Search assignments...">

</div>


<div
id="assignmentList"
class="assignment-list">

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Loading assignments...

</div>

</div>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
addDoc,
updateDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const form =
document.getElementById(
"assignmentForm"
);

const formTitle =
document.getElementById(
"formTitle"
);

const courseIdInput =
document.getElementById(
"courseId"
);

const titleInput =
document.getElementById(
"title"
);

const instructionsInput =
document.getElementById(
"instructions"
);

const pointsInput =
document.getElementById(
"points"
);

const submissionTypeInput =
document.getElementById(
"submissionType"
);

const deadlineInput =
document.getElementById(
"deadline"
);

const saveBtn =
document.getElementById(
"saveBtn"
);

const cancelBtn =
document.getElementById(
"cancelBtn"
);

const searchInput =
document.getElementById(
"searchInput"
);

const assignmentList =
document.getElementById(
"assignmentList"
);

const message =
document.getElementById(
"message"
);


/* =====================================================
   STATE
===================================================== */

let assignments = [];

let editingAssignmentId = null;

let currentUser = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type="success"
){

message.textContent =
text;

message.className =
"message " + type;

setTimeout(
()=>{

message.className =
"message";

},
4000
);

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

if(!value)
return "No deadline";


let date;


if(
typeof value.toDate ===
"function"
){

date =
value.toDate();

}
else{

date =
new Date(value);

}


if(
isNaN(
date.getTime()
)
){

return String(value);

}


return date.toLocaleString(
"en-US",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}


/* =====================================================
   LOAD ASSIGNMENTS
===================================================== */

async function loadAssignments(){

assignmentList.innerHTML = `

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Loading assignments...

</div>

`;


try{

const snapshot =
await getDocs(
collection(
db,
"assignments"
)
);


assignments =
snapshot.docs.map(
item => ({

id:item.id,

...item.data()

})
);


renderAssignments();

}
catch(error){

console.error(
error
);

assignmentList.innerHTML = `

<div class="empty">

<i class="fa-solid fa-triangle-exclamation"></i>

<br><br>

${escapeHTML(
error.message ||
"Failed to load assignments."
)}

</div>

`;

}

}


/* =====================================================
   RENDER
===================================================== */

function renderAssignments(){

const search =
searchInput.value
.trim()
.toLowerCase();


const filtered =
assignments.filter(
assignment => {

return (

String(
assignment.title || ""
)
.toLowerCase()
.includes(search)

||

String(
assignment.courseId || ""
)
.toLowerCase()
.includes(search)

||

String(
assignment.submissionType || ""
)
.toLowerCase()
.includes(search)

);

}
);


if(!filtered.length){

assignmentList.innerHTML = `

<div class="empty">

<i class="fa-solid fa-folder-open"></i>

<br><br>

No assignments found.

</div>

`;

return;

}


assignmentList.innerHTML =
filtered.map(
assignment => `

<div
class="assignment-item">

<div
class="assignment-info">

<h3>

${escapeHTML(
assignment.title ||
"Untitled Assignment"
)}

</h3>


<p>

${escapeHTML(
assignment.instructions ||
"No instructions."
)}

</p>


<div class="meta">

<span class="badge">

<i class="fa-solid fa-book"></i>

Course:
${escapeHTML(
assignment.courseId ||
"-"
)}

</span>


<span class="badge points">

<i class="fa-solid fa-star"></i>

${Number(
assignment.points || 0
)}
Points

</span>


<span class="badge">

<i class="fa-solid fa-file-arrow-up"></i>

${escapeHTML(
assignment.submissionType ||
"text"
)}

</span>


${
assignment.deadline
?
`
<span class="badge deadline">

<i class="fa-regular fa-clock"></i>

${formatDate(
assignment.deadline
)}

</span>
`
:
""
}

</div>

</div>


<div class="item-actions">

<button
class="icon-btn edit"
title="Edit"
onclick="editAssignment('${assignment.id}')">

<i class="fa-solid fa-pen"></i>

</button>


<button
class="icon-btn delete"
title="Delete"
onclick="deleteAssignment('${assignment.id}')">

<i class="fa-solid fa-trash"></i>

</button>

</div>

</div>

`
).join("");

}


/* =====================================================
   SAVE
===================================================== */

form.addEventListener(
"submit",
async event => {

event.preventDefault();


if(!currentUser){

showMessage(
"Please login first.",
"error"
);

return;

}


const courseId =
courseIdInput.value.trim();

const title =
titleInput.value.trim();

const instructions =
instructionsInput.value.trim();

const points =
Number(
pointsInput.value || 0
);

const submissionType =
submissionTypeInput.value;

const deadline =
deadlineInput.value;


if(!courseId){

showMessage(
"Course ID is required.",
"error"
);

return;

}


if(!title){

showMessage(
"Assignment title is required.",
"error"
);

return;

}


if(!instructions){

showMessage(
"Instructions are required.",
"error"
);

return;

}


saveBtn.disabled =
true;


try{

/* =========================================
   UPDATE
========================================= */

if(editingAssignmentId){

await updateDoc(

doc(
db,
"assignments",
editingAssignmentId
),

{

courseId,

title,

instructions,

points,

submissionType,

deadline,

updatedAt:
serverTimestamp()

}

);


showMessage(
"Assignment updated successfully."
);

}


/* =========================================
   CREATE
   FIREBASE AUTOMATIC ID
========================================= */

else{

const assignmentRef =
await addDoc(

collection(
db,
"assignments"
),

{

courseId,

title,

instructions,

points,

submissionType,

deadline,

createdBy:
currentUser.uid,

createdAt:
serverTimestamp()

}

);


console.log(
"Automatic Assignment ID:",
assignmentRef.id
);


showMessage(
"Assignment created successfully."
);

}


resetForm();

await loadAssignments();

}
catch(error){

console.error(
error
);

showMessage(
error.message ||
"Failed to save assignment.",
"error"
);

}


saveBtn.disabled =
false;

}
);


/* =====================================================
   EDIT
===================================================== */

window.editAssignment =
function(id){

const assignment =
assignments.find(
item =>
item.id === id
);


if(!assignment)
return;


editingAssignmentId =
id;


courseIdInput.value =
assignment.courseId || "";

titleInput.value =
assignment.title || "";

instructionsInput.value =
assignment.instructions || "";

pointsInput.value =
assignment.points || 0;

submissionTypeInput.value =
assignment.submissionType ||
"text";


if(
assignment.deadline
){

let date;


if(
typeof assignment.deadline.toDate ===
"function"
){

date =
assignment.deadline.toDate();

}
else{

date =
new Date(
assignment.deadline
);

}


if(
!isNaN(
date.getTime()
)
){

const local =
new Date(
date.getTime()
-
date.getTimezoneOffset()
*
60000
);

deadlineInput.value =
local.toISOString()
.slice(
0,
16
);

}

}
else{

deadlineInput.value =
"";

}


formTitle.textContent =
"Edit Assignment";


saveBtn.innerHTML = `

<i class="fa-solid fa-save"></i>

Update Assignment

`;


cancelBtn.style.display =
"inline-block";


window.scrollTo({

top:0,

behavior:"smooth"

});

};


/* =====================================================
   DELETE
===================================================== */

window.deleteAssignment =
async function(id){

const assignment =
assignments.find(
item =>
item.id === id
);


if(!assignment)
return;


const confirmed =
confirm(
`Delete "${assignment.title || "this assignment"}"?`
);


if(!confirmed)
return;


try{

await deleteDoc(

doc(
db,
"assignments",
id
)

);


showMessage(
"Assignment deleted successfully."
);


await loadAssignments();

}
catch(error){

console.error(
error
);

showMessage(
error.message ||
"Failed to delete assignment.",
"error"
);

}

};


/* =====================================================
   RESET
===================================================== */

function resetForm(){

editingAssignmentId =
null;

form.reset();

pointsInput.value =
10;

submissionTypeInput.value =
"text";

formTitle.textContent =
"Add Assignment";

saveBtn.innerHTML = `

<i class="fa-solid fa-plus"></i>

Add Assignment

`;

cancelBtn.style.display =
"none";

}


/* =====================================================
   CANCEL
===================================================== */

cancelBtn.addEventListener(
"click",
resetForm
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
"input",
renderAssignments
);


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
auth,
async user => {

if(!user){

currentUser =
null;

assignmentList.innerHTML = `

<div class="empty">

<i class="fa-solid fa-lock"></i>

<br><br>

Please login as administrator.

</div>

`;

return;

}


currentUser =
user;


await loadAssignments();

}
);

</script>

</body>
</html>
