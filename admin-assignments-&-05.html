<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assignments | LetsStudy Pro Admin</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:#f5f7fb;
color:#101828
}

button,input,textarea,select{
font:inherit
}

button{
border:0;
border-radius:10px;
padding:11px 16px;
font-weight:800;
cursor:pointer
}

.primary{background:#155eef;color:#fff}
.secondary{background:#eef4ff;color:#155eef}
.danger{background:#fee4e2;color:#b42318}

header{
height:68px;
background:#fff;
border-bottom:1px solid #eaecf0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
position:sticky;
top:0;
z-index:20
}

.logo{
font-size:21px;
font-weight:900;
color:#155eef
}

.admin{
font-size:13px;
color:#667085
}

.container{
max-width:1200px;
margin:auto;
padding:25px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:22px
}

h1{
margin:0;
font-size:28px
}

.muted{
color:#667085
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px
}

.stat{
background:#fff;
border:1px solid #eaecf0;
border-radius:15px;
padding:18px
}

.stat span{
font-size:13px;
color:#667085
}

.stat strong{
display:block;
font-size:28px;
margin-top:7px
}

.card{
background:#fff;
border:1px solid #eaecf0;
border-radius:15px;
padding:20px;
margin-bottom:15px
}

.filters{
display:flex;
gap:10px;
flex-wrap:wrap
}

input,textarea,select{
width:100%;
padding:12px;
border:1px solid #d0d5dd;
border-radius:9px;
outline:none;
background:#fff
}

input:focus,
textarea:focus,
select:focus{
border-color:#155eef
}

.search{
max-width:380px
}

.assignment{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:20px
}

.assignment h3{
margin:0 0 7px;
font-size:18px
}

.assignment p{
margin:5px 0;
line-height:1.6
}

.meta{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:12px
}

.badge{
font-size:11px;
padding:6px 10px;
border-radius:20px;
background:#f2f4f7;
color:#475467
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}

.empty,
.loading{
text-align:center;
padding:45px;
color:#667085
}

.error{
display:none;
background:#fef3f2;
border:1px solid #fecdca;
color:#b42318;
padding:13px;
border-radius:10px;
margin-bottom:15px
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
align-items:center;
justify-content:center;
padding:15px
}

.modal.show{
display:flex
}

.modal-box{
width:min(700px,100%);
max-height:94vh;
overflow:auto;
background:#fff;
border-radius:18px;
padding:23px
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px
}

.close{
background:#f2f4f7;
font-size:18px
}

.form-group{
margin-bottom:15px
}

label{
display:block;
font-size:13px;
font-weight:800;
margin-bottom:6px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:13px
}

.footer-actions{
display:flex;
justify-content:flex-end;
gap:9px;
margin-top:20px
}

@media(max-width:700px){

.container{
padding:15px
}

.stats{
grid-template-columns:1fr
}

.assignment{
flex-direction:column
}

.actions{
width:100%
}

.grid{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<div class="admin">
Admin • Assignments
</div>

</header>


<main class="container">

<div class="top">

<div>

<h1>
Assignments
</h1>

<p class="muted">
Create and manage course assignments.
</p>

</div>

<button
class="primary"
onclick="openCreate()">

+ Add Assignment

</button>

</div>


<div id="error" class="error"></div>


<div class="stats">

<div class="stat">

<span>
Total Assignments
</span>

<strong id="total">
0
</strong>

</div>


<div class="stat">

<span>
Upcoming
</span>

<strong id="upcoming">
0
</strong>

</div>


<div class="stat">

<span>
Courses
</span>

<strong id="courses">
0
</strong>

</div>

</div>


<div class="card">

<div class="filters">

<input
id="search"
class="search"
placeholder="Search assignments..."
oninput="render()"
>

<input
id="courseFilter"
class="search"
placeholder="Filter by courseId..."
oninput="render()"
>

</div>

</div>


<div id="assignmentList">

<div class="loading">
Loading assignments...
</div>

</div>

</main>


<!-- MODAL -->

<div
id="modal"
class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
Add Assignment
</h2>

<button
class="close"
onclick="closeModal()">

×

</button>

</div>


<form id="assignmentForm">


<div class="form-group">

<label>
Course ID *
</label>

<input
id="courseId"
required
>

</div>


<div class="form-group">

<label>
Assignment Title *
</label>

<input
id="title"
required
>

</div>


<div class="form-group">

<label>
Instructions
</label>

<textarea
id="instructions"
rows="6"
placeholder="Write assignment instructions..."
></textarea>

</div>


<div class="grid">

<div class="form-group">

<label>
Points
</label>

<input
id="points"
type="number"
min="0"
value="100"
>

</div>


<div class="form-group">

<label>
Submission Type
</label>

<select id="submissionType">

<option value="file">
File Upload
</option>

<option value="text">
Text
</option>

<option value="link">
Link
</option>

<option value="file_text">
File + Text
</option>

</select>

</div>

</div>


<div class="form-group">

<label>
Deadline
</label>

<input
id="deadline"
type="datetime-local"
>

</div>


<div class="footer-actions">

<button
type="button"
class="secondary"
onclick="closeModal()">

Cancel

</button>

<button
type="submit"
class="primary">

Save Assignment

</button>

</div>


</form>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/*
========================================
FIREBASE
========================================
*/

const firebaseConfig={

apiKey:
"AIzaSyBcKXbAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


let assignments=[];

let editingId=null;


/*
========================================
LOAD
========================================
*/

async function loadAssignments(){

try{

const snap=
await getDocs(
collection(
db,
"assignments"
)
);


assignments=
snap.docs.map(d=>({

id:d.id,
...d.data()

}));


render();


}catch(error){

showError(
error.message
);

}

}


/*
========================================
RENDER
========================================
*/

window.render=function(){

const search=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const courseFilter=
document
.getElementById("courseFilter")
.value
.toLowerCase()
.trim();


const filtered=
assignments.filter(a=>{

const text=
`${a.title||""}
${a.instructions||""}
${a.courseId||""}
${a.submissionType||""}`
.toLowerCase();


return(
text.includes(search)&&
String(a.courseId||"")
.toLowerCase()
.includes(courseFilter)
);

});


/*
STATS
*/

document
.getElementById("total")
.textContent=
assignments.length;


const now=
new Date();


const upcoming=
assignments.filter(a=>{

if(!a.deadline)return false;

const date=
toDate(a.deadline);

return date && date>now;

}).length;


document
.getElementById("upcoming")
.textContent=
upcoming;


const courseSet=
new Set(
assignments
.map(a=>a.courseId)
.filter(Boolean)
);


document
.getElementById("courses")
.textContent=
courseSet.size;


if(!filtered.length){

document
.getElementById("assignmentList")
.innerHTML=`

<div class="card empty">

No assignments found.

</div>

`;

return;

}


/*
CARDS
*/

document
.getElementById("assignmentList")
.innerHTML=

filtered.map(a=>{

const deadline=
formatDate(
a.deadline
);


return`

<div class="card assignment">

<div>

<h3>
${escapeHTML(
a.title||"Untitled Assignment"
)}
</h3>


<p class="muted">

${escapeHTML(
a.instructions||
"No instructions provided."
)}

</p>


<div class="meta">

<span class="badge">
Course:
${escapeHTML(
a.courseId||"-"
)}
</span>


<span class="badge">
Points:
${a.points??0}
</span>


<span class="badge">
Submission:
${escapeHTML(
a.submissionType||
"file"
)}
</span>


<span class="badge">

Deadline:
${deadline}

</span>

</div>

</div>


<div class="actions">

<button
class="secondary"
onclick="editAssignment('${a.id}')">

Edit

</button>


<button
class="danger"
onclick="removeAssignment('${a.id}')">

Delete

</button>

</div>

</div>

`;

}).join("");

}


/*
========================================
CREATE
========================================
*/

window.openCreate=function(){

editingId=null;

document
.getElementById("modalTitle")
.textContent=
"Add Assignment";


document
.getElementById("assignmentForm")
.reset();


document
.getElementById("points")
.value=100;


document
.getElementById("modal")
.classList
.add("show");

};


/*
========================================
EDIT
========================================
*/

window.editAssignment=function(id){

const a=
assignments.find(
x=>x.id===id
);


if(!a)return;


editingId=id;


document
.getElementById("modalTitle")
.textContent=
"Edit Assignment";


document
.getElementById("courseId")
.value=
a.courseId||"";


document
.getElementById("title")
.value=
a.title||"";


document
.getElementById("instructions")
.value=
a.instructions||"";


document
.getElementById("points")
.value=
a.points??100;


document
.getElementById("submissionType")
.value=
a.submissionType||"file";


document
.getElementById("deadline")
.value=
toDateInput(a.deadline);


document
.getElementById("modal")
.classList
.add("show");

};


/*
========================================
SAVE
========================================
*/

document
.getElementById("assignmentForm")
.addEventListener(
"submit",
async e=>{

e.preventDefault();


const deadlineValue=
document
.getElementById("deadline")
.value;


const data={

courseId:
document
.getElementById("courseId")
.value
.trim(),

title:
document
.getElementById("title")
.value
.trim(),

instructions:
document
.getElementById("instructions")
.value
.trim(),

points:
Number(
document
.getElementById("points")
.value
),

submissionType:
document
.getElementById("submissionType")
.value,

deadline:
deadlineValue?
new Date(
deadlineValue
):
null

};


if(
!data.courseId||
!data.title
){

showError(
"Course ID and Assignment Title are required."
);

return;

}


try{

if(editingId){

await updateDoc(

doc(
db,
"assignments",
editingId
),

{

...data,

updatedAt:
serverTimestamp()

}

);

}else{

await addDoc(

collection(
db,
"assignments"
),

{

...data,

createdAt:
serverTimestamp()

}

);

}


closeModal();

await loadAssignments();


}catch(error){

showError(
error.message
);

}

});


/*
========================================
DELETE
========================================
*/

window.removeAssignment=
async function(id){

if(
!confirm(
"Delete this assignment permanently?"
)
)return;


try{

await deleteDoc(

doc(
db,
"assignments",
id
)

);


await loadAssignments();


}catch(error){

showError(
error.message
);

}

};


/*
========================================
CLOSE
========================================
*/

window.closeModal=function(){

document
.getElementById("modal")
.classList
.remove("show");

};


/*
========================================
DATE
========================================
*/

function toDate(value){

if(!value)return null;

if(
typeof value.toDate==="function"
){

return value.toDate();

}

if(
value instanceof Date
){

return value;

}

const date=
new Date(value);

return isNaN(
date.getTime()
)?
null:
date;

}


function formatDate(value){

const date=
toDate(value);

if(!date)return "No deadline";

return date.toLocaleString(
"en-US",
{
year:"numeric",
month:"short",
day:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);

}


function toDateInput(value){

const date=
toDate(value);

if(!date)return "";

const pad=n=>
String(n).padStart(2,"0");


return`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;

}


/*
========================================
ERROR
========================================
*/

function showError(message){

const el=
document.getElementById("error");


el.textContent=
message;

el.style.display=
"block";


setTimeout(()=>{

el.style.display=
"none";

},6000);

}


/*
========================================
ESCAPE
========================================
*/

function escapeHTML(value){

return String(
value??""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
========================================
URL COURSE ID
========================================
*/

const params=
new URLSearchParams(
location.search
);


const courseFromURL=
params.get(
"courseId"
);


if(courseFromURL){

document
.getElementById("courseFilter")
.value=
courseFromURL;

}


/*
========================================
CLOSE OUTSIDE
========================================
*/

document
.getElementById("modal")
.addEventListener(
"click",
e=>{

if(
e.target.id==="modal"
){

closeModal();

}

});


/*
========================================
START
========================================
*/

loadAssignments();

</script>

</body>
</html>
