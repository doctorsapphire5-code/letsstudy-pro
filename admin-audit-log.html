<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Adult Log</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
header{
  background:#111827;
  color:white;
  padding:18px
}
main{max-width:1200px;margin:auto;padding:20px}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px
}
.card{
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 2px 10px #0001
}
.card b{font-size:24px}
.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px
}
input,select,button{
  padding:11px;
  border:1px solid #ddd;
  border-radius:8px
}
input{flex:1;min-width:200px}
button{cursor:pointer;background:#111827;color:white}
.danger{background:#dc2626}
table{
  width:100%;
  border-collapse:collapse;
  background:white
}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left
}
th{background:#f1f5f9}
.wrap{overflow:auto}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:20px
}
.modal-box{
  background:white;
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  padding:20px;
  border-radius:14px
}
pre{
  background:#111827;
  color:#fff;
  padding:15px;
  overflow:auto;
  border-radius:8px
}
@media(max-width:700px){
 .stats{grid-template-columns:repeat(2,1fr)}
 th,td{white-space:nowrap}
}
</style>
</head>

<body>

<header>
  <h2>🔐 Admin Adult Activity Log</h2>
  <small>System activity monitoring</small>
</header>

<main>

<section class="stats">
  <div class="card">
    <small>Total Logs</small><br>
    <b id="total">0</b>
  </div>

  <div class="card">
    <small>Blocked</small><br>
    <b id="blocked">0</b>
  </div>

  <div class="card">
    <small>Allowed</small><br>
    <b id="allowed">0</b>
  </div>

  <div class="card">
    <small>Today</small><br>
    <b id="today">0</b>
  </div>
</section>

<div class="toolbar">

  <input
    id="search"
    placeholder="Search user, email, action..."
  >

  <select id="filter">
    <option value="all">All Status</option>
    <option value="allowed">Allowed</option>
    <option value="blocked">Blocked</option>
  </select>

  <button onclick="loadLogs()">🔄 Refresh</button>

  <button onclick="exportCSV()">
    📥 CSV
  </button>

  <button
    class="danger"
    onclick="deleteAllLogs()"
  >
    🗑 Delete All
  </button>

</div>

<div class="wrap">

<table>
<thead>
<tr>
<th>User</th>
<th>Email</th>
<th>Action</th>
<th>Status</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>

<tbody id="logs">
<tr>
<td colspan="6">Loading...</td>
</tr>
</tbody>

</table>

</div>

</main>

<div class="modal" id="modal">

<div class="modal-box">

<button
  style="float:right"
  onclick="closeModal()"
>
✕
</button>

<h3>Log Details</h3>

<pre id="details"></pre>

</div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc,
  writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbjsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );

const db =
  getFirestore(app);


/* COLLECTION */

const LOG_COLLECTION =
  "adultLogs";


let allLogs = [];


/* ESCAPE */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* DATE */

function formatDate(value){

  if(!value)
    return "—";

  try{

    if(
      value.seconds
    ){

      return new Date(
        value.seconds * 1000
      ).toLocaleString();

    }

    return new Date(
      value
    ).toLocaleString();

  }
  catch{

    return "—";

  }

}


/* LOAD */

async function loadLogs(){

  const body =
    document.getElementById(
      "logs"
    );

  body.innerHTML =
    `<tr>
      <td colspan="6">Loading...</td>
    </tr>`;

  try{

    const snap =
      await getDocs(
        collection(
          db,
          LOG_COLLECTION
        )
      );

    allLogs =
      snap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );

    updateStats();
    render();

  }
  catch(error){

    console.error(error);

    body.innerHTML =
      `<tr>
        <td colspan="6">
          Failed to load logs.
        </td>
      </tr>`;

  }

}


/* STATS */

function updateStats(){

  const today =
    new Date()
      .toDateString();

  document.getElementById(
    "total"
  ).textContent =
    allLogs.length;

  document.getElementById(
    "blocked"
  ).textContent =
    allLogs.filter(
      x =>
        String(
          x.status || ""
        ).toLowerCase()
        === "blocked"
    ).length;

  document.getElementById(
    "allowed"
  ).textContent =
    allLogs.filter(
      x =>
        String(
          x.status || ""
        ).toLowerCase()
        === "allowed"
    ).length;

  document.getElementById(
    "today"
  ).textContent =
    allLogs.filter(
      x =>
        formatDate(
          x.createdAt ||
          x.timestamp
        ) !== "—" &&
        new Date(
          x.createdAt ||
          x.timestamp
        ).toDateString() ===
        today
    ).length;

}


/* RENDER */

function render(){

  const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase();

  const filter =
    document.getElementById(
      "filter"
    ).value;

  const logs =
    allLogs.filter(
      x => {

        const text =
          [
            x.uid,
            x.userId,
            x.email,
            x.userEmail,
            x.action,
            x.reason,
            x.status
          ]
          .join(" ")
          .toLowerCase();

        const matchesSearch =
          text.includes(
            search
          );

        const matchesFilter =
          filter === "all" ||
          String(
            x.status || ""
          ).toLowerCase()
          === filter;

        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );

  const body =
    document.getElementById(
      "logs"
    );

  if(!logs.length){

    body.innerHTML =
      `<tr>
        <td colspan="6">
          No logs found.
        </td>
      </tr>`;

    return;

  }

  body.innerHTML =
    logs.map(
      log => `

      <tr>

        <td>
          ${escapeHTML(
            log.uid ||
            log.userId ||
            "—"
          )}
        </td>

        <td>
          ${escapeHTML(
            log.email ||
            log.userEmail ||
            "—"
          )}
        </td>

        <td>
          ${escapeHTML(
            log.action ||
            log.event ||
            "—"
          )}
        </td>

        <td>
          ${escapeHTML(
            log.status ||
            "—"
          )}
        </td>

        <td>
          ${escapeHTML(
            formatDate(
              log.createdAt ||
              log.timestamp
            )
          )}
        </td>

        <td>

          <button
            onclick="viewLog('${log.id}')"
          >
            👁
          </button>

          <button
            class="danger"
            onclick="deleteLog('${log.id}')"
          >
            🗑
          </button>

        </td>

      </tr>

    `
    ).join("");

}


/* VIEW */

window.viewLog =
function(id){

  const log =
    allLogs.find(
      x => x.id === id
    );

  if(!log)
    return;

  document.getElementById(
    "details"
  ).textContent =
    JSON.stringify(
      log,
      null,
      2
    );

  document.getElementById(
    "modal"
  ).style.display =
    "flex";

};


/* CLOSE */

window.closeModal =
function(){

  document.getElementById(
    "modal"
  ).style.display =
    "none";

};


/* DELETE */

window.deleteLog =
async function(id){

  if(
    !confirm(
      "Delete this log?"
    )
  )
    return;

  try{

    await deleteDoc(
      doc(
        db,
        LOG_COLLECTION,
        id
      )
    );

    await loadLogs();

  }
  catch(error){

    alert(
      "Delete failed"
    );

    console.error(error);

  }

};


/* DELETE ALL */

window.deleteAllLogs =
async function(){

  if(!allLogs.length)
    return;

  if(
    !confirm(
      "Delete ALL adult logs?"
    )
  )
    return;

  try{

    const batch =
      writeBatch(db);

    allLogs.forEach(
      log => {

        batch.delete(
          doc(
            db,
            LOG_COLLECTION,
            log.id
          )
        );

      }
    );

    await batch.commit();

    await loadLogs();

  }
  catch(error){

    alert(
      "Delete all failed"
    );

    console.error(error);

  }

};


/* CSV */

window.exportCSV =
function(){

  if(!allLogs.length)
    return;

  const rows = [
    [
      "ID",
      "User ID",
      "Email",
      "Action",
      "Status",
      "Date"
    ]
  ];

  allLogs.forEach(
    x => {

      rows.push([
        x.id || "",
        x.uid || x.userId || "",
        x.email || x.userEmail || "",
        x.action || x.event || "",
        x.status || "",
        formatDate(
          x.createdAt ||
          x.timestamp
        )
      ]);

    }
  );

  const csv =
    rows.map(
      row =>
        row.map(
          x =>
            `"${String(x)
              .replaceAll('"','""')}"`
        ).join(",")
    ).join("\n");

  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href = url;

  a.download =
    "adult-logs.csv";

  a.click();

  URL.revokeObjectURL(
    url
  );

};


/* EVENTS */

document.getElementById(
  "search"
).addEventListener(
  "input",
  render
);

document.getElementById(
  "filter"
).addEventListener(
  "change",
  render
);


/* START */

loadLogs();

</script>

</body>
</html>
