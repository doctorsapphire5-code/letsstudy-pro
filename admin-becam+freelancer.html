<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">

<title>Become a Freelancer | Admin | LetsStudy Pro</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{

 padding:16px 5%;
 position:sticky;
 top:0;

}
.nav{

 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:20px
}
.logo{

 text-decoration:none;
 font-size:22px;
 font-weight:900
}
.logo span{color:#22d3ee}
.nav a{
 color:#fff;

}
.wrap{
 max-width:1200px;
 margin:auto;
 padding:30px 5%

.hero{
 background:linear-gradient(135deg,#07111f,#164e63);
 color:#fff;
 padding:45px 5%
}
.hero h1{
 margin:0 0 10px;
 font-size:38px
}
.hero p{
 color:#cbd5e1
}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin-top:-25px
}
.stat{
 background:#fff;
 padding:20px;
 border-radius:15px;
 box-shadow:0 10px 30px #0001
}
.stat i{
 font-size:25px;
 color:#2563eb
}
.stat b{
 display:block;
 font-size:25px;
 margin-top:10px
}
.toolbar{
 margin:25px 0;
 display:flex;
 gap:12px
}
.toolbar input,
.toolbar select{
 flex:1;
 padding:13px;
 border:1px solid #ddd;
 border-radius:9px;
 outline:none
}
.table{
 background:#fff;
 border-radius:15px;
 overflow:auto;
 box-shadow:0 10px 30px #0001
}
table{
 width:100%;
 border-collapse:collapse;
 min-width:800px
}
th,td{
 padding:15px;
 border-bottom:1px solid #eee;
 text-align:left
}
th{
 background:#f8fafc;
 color:#475569
}
.avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 object-fit:cover;
 vertical-align:middle;
 margin-right:8px
}
.badge{
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold
}
.pending{
 background:#fef3c7;
 color:#92400e
}
.approved{
 background:#dcfce7;
 color:#166534
}
.rejected{
 background:#fee2e2;
 color:#991b1b
}
.verified{
 color:#16a34a
}
.actions{
 display:flex;
 gap:6px
}
button{
 border:0;
 padding:9px 12px;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold
}
.view{background:#e0f2fe;color:#0369a1}
.approve{background:#dcfce7;color:#166534}
.reject{background:#fee2e2;color:#991b1b}
.empty,
.loading{
 text-align:center;
 padding:60px
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:50;
 padding:20px;
 overflow:auto
}
.modal-box{
 max-width:700px;
 margin:40px auto;
 background:#fff;
 border-radius:18px;
 padding:25px
}
.close{
 float:right;
 background:#eee
}
.detail{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin-top:20px
}
.detail div{
 background:#f8fafc;
 padding:13px;
 border-radius:10px
}
.detail strong{
 display:block;
 color:#64748b;
 font-size:12px;
 margin-bottom:5px
}
footer{
 background:#07111f;
 color:#94a3b8;
 padding:35px 5%;
 margin-top:40px
}
@media(max-width:800px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .detail{grid-template-columns:1fr}
}
@media(max-width:550px){
 .stats{grid-template-columns:1fr}
 .toolbar{flex-direction:column}
 .hero h1{font-size:30px}
}
</style></head><body><header>
<div class="nav"><a class="logo" href="admin.html">
LetsStudy <span>Pro</span>
</a><a href="admin.html">
<i class="fa fa-arrow-left"></i>
 Admin
</a></div>
</header><section class="hero">
<div class="wrap"><h1>
<i class="fa fa-user-tie"></i>
 Freelancer Applications
</h1><p>
Review and manage users who want to become freelancers on LetsStudy Pro.
</p></div>
</section><main class="wrap"><div class="stats"><div class="stat">
<i class="fa fa-users"></i>
<b id="total">0</b>
<span>Total Freelancers</span>
</div><div class="stat">
<i class="fa fa-clock"></i>
<b id="pending">0</b>
<span>Pending</span>
</div><div class="stat">
<i class="fa fa-circle-check"></i>
<b id="approved">0</b>
<span>Approved</span>
</div><div class="stat">
<i class="fa fa-star"></i>
<b id="featured">0</b>
<span>Featured</span>
</div></div><div class="toolbar"><input
id="search"
placeholder="Search freelancer, username, skill...">

<select id="status">
<option value="">All Status</option>
<option value="pending">Pending</option>
<option value="approved">Approved</option>
<option value="rejected">Rejected</option>
</select></div><div id="loading" class="loading">
<i class="fa fa-spinner fa-spin fa-2x"></i>
<p>Loading freelancers...</p>
</div><div id="tableBox" class="table" style="display:none"></div></main><div id="modal" class="modal">
<div class="modal-box"><button class="close" onclick="closeModal()">
<i class="fa fa-xmark"></i>
</button><div id="details"></div></div>
</div><footer>
<div class="wrap">
<h2 style="color:#fff">LetsStudy Pro</h2>
<p>Learn. Build. Grow.</p>
</div>
</footer><script type="module">

import {
initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let freelancers=[];


async function loadFreelancers(){

try{

const snap=await getDocs(
collection(db,"freelancers")
);

freelancers=snap.docs.map(d=>({
freelancerId:d.id,
...d.data()
}));

updateStats();
render();

document.getElementById("loading").style.display="none";
document.getElementById("tableBox").style.display="block";

}catch(error){

document.getElementById("loading").innerHTML=`
<h3>Unable to load freelancers</h3>
<p>${esc(error.message)}</p>
`;

}

}


function updateStats(){

document.getElementById("total").textContent=
freelancers.length;

document.getElementById("pending").textContent=
freelancers.filter(x=>
(x.status||"pending").toLowerCase()==="pending"
).length;

document.getElementById("approved").textContent=
freelancers.filter(x=>
(x.status||"").toLowerCase()==="approved"
).length;

document.getElementById("featured").textContent=
freelancers.filter(x=>x.featured===true).length;

}


function render(){

const q=document.getElementById("search")
.value.toLowerCase().trim();

const status=document.getElementById("status").value;

const list=freelancers.filter(f=>{

const searchable=`
${f.name||""}
${f.username||""}
${f.headline||""}
${f.bio||""}
${f.country||""}
${f.city||""}
${(f.skills||[]).join(" ")}
${(f.categories||[]).join(" ")}
`.toLowerCase();

const s=(f.status||"pending").toLowerCase();

return(
(!q||searchable.includes(q)) &&
(!status||s===status)
);

});


if(!list.length){

document.getElementById("tableBox").innerHTML=`
<div class="empty">
<i class="fa fa-user-slash fa-3x"></i>
<h2>No freelancers found</h2>
<p>No matching freelancer applications.</p>
</div>
`;

return;

}


document.getElementById("tableBox").innerHTML=`

<table>

<thead>
<tr>
<th>Freelancer</th>
<th>Skills</th>
<th>Rate</th>
<th>Jobs</th>
<th>Rating</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody>

${list.map(f=>{

const status=
(f.status||"pending").toLowerCase();

return`

<tr>

<td>

<img
class="avatar"
src="${
f.profileImage ||
"https://via.placeholder.com/100"
}">

<strong>
${esc(f.name||"Unnamed")}
</strong>

<br>

<small>
@${esc(f.username||"")}
</small>

</td>

<td>
${esc((f.skills||[]).slice(0,3).join(", "))}
</td>

<td>
${esc(f.currency||"TZS")}
 ${Number(f.hourlyRate||0).toLocaleString()}/hr
</td>

<td>
${Number(f.completedJobs||0)}/
${Number(f.totalJobs||0)}
</td>

<td>
<i class="fa fa-star" style="color:#f59e0b"></i>
${Number(f.rating||0).toFixed(1)}
</td>

<td>
<span class="badge ${status}">
${esc(status)}
</span>
</td>

<td>

<div class="actions">

<button class="view"
onclick="viewFreelancer('${f.freelancerId}')">
<i class="fa fa-eye"></i>
</button>

${
status!=="approved"
?
`
<button class="approve"
onclick="changeStatus('${f.freelancerId}','approved')">
<i class="fa fa-check"></i>
</button>
`
:""
}

${
status!=="rejected"
?
`
<button class="reject"
onclick="changeStatus('${f.freelancerId}','rejected')">
<i class="fa fa-xmark"></i>
</button>
`
:""
}

</div>

</td>

</tr>

`;

}).join("")}

</tbody>

</table>
`;

}


window.viewFreelancer=function(id){

const f=freelancers.find(x=>x.freelancerId===id);

if(!f)return;

document.getElementById("details").innerHTML=`

<h2>
${esc(f.name||"Freelancer")}
</h2>

<p>
${esc(f.headline||"")}
</p>

<div class="detail">

<div>
<strong>Username</strong>
@${esc(f.username||"-")}
</div>

<div>
<strong>Country</strong>
${esc(f.country||"-")}
</div>

<div>
<strong>Region</strong>
${esc(f.region||"-")}
</div>

<div>
<strong>City</strong>
${esc(f.city||"-")}
</div>

<div>
<strong>Experience</strong>
${esc(f.experienceLevel||"-")}
</div>

<div>
<strong>Availability</strong>
${esc(f.availability||"-")}
</div>

<div>
<strong>Hourly Rate</strong>
${esc(f.currency||"TZS")}
 ${Number(f.hourlyRate||0).toLocaleString()}
</div>

<div>
<strong>Response Time</strong>
${esc(f.responseTime||"-")}
</div>

<div>
<strong>Total Jobs</strong>
${Number(f.totalJobs||0)}
</div>

<div>
<strong>Completed Jobs</strong>
${Number(f.completedJobs||0)}
</div>

<div>
<strong>Active Jobs</strong>
${Number(f.activeJobs||0)}
</div>

<div>
<strong>Rating</strong>
${Number(f.rating||0).toFixed(1)}
 (${Number(f.ratingCount||0)})
</div>

<div style="grid-column:1/-1">
<strong>Skills</strong>
${esc((f.skills||[]).join(", ")||"-")}
</div>

<div style="grid-column:1/-1">
<strong>Categories</strong>
${esc((f.categories||[]).join(", ")||"-")}
</div>

<div style="grid-column:1/-1">
<strong>Bio</strong>
${esc(f.bio||"-")}
</div>

<div style="grid-column:1/-1">
<strong>Status</strong>
${esc(f.status||"pending")}
</div>

</div>

<div style="margin-top:20px;display:flex;gap:10px">

<button class="approve"
onclick="changeStatus('${id}','approved');closeModal()">
<i class="fa fa-check"></i>
Approve
</button>

<button class="reject"
onclick="changeStatus('${id}','rejected');closeModal()">
<i class="fa fa-xmark"></i>
Reject
</button>

</div>
`;

document.getElementById("modal").style.display="block";

};


window.closeModal=function(){
document.getElementById("modal").style.display="none";
};


window.changeStatus=async function(id,status){

try{

await updateDoc(
doc(db,"freelancers",id),
{
status:status,
updatedAt:new Date()
}
);

const f=freelancers.find(x=>x.freelancerId===id);

if(f)f.status=status;

updateStats();
render();

}catch(error){

alert(error.message);

}

};


document.getElementById("search")
.addEventListener("input",render);

document.getElementById("status")
.addEventListener("change",render);


function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

loadFreelancers();

</script></body>
</html>
