<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Blog Pages</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:18px;font-size:20px;font-weight:bold}
main{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}
.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 12px #0001}
.num{font-size:28px;font-weight:bold;margin-top:7px}
.box{background:#fff;padding:18px;border-radius:14px;margin-top:20px}
input,select{padding:12px;border:1px solid #ddd;border-radius:8px;margin:5px}
button{border:0;padding:9px 13px;border-radius:7px;cursor:pointer}
.add{background:#2563eb;color:#fff}
.publish{background:#16a34a;color:#fff}
.draft{background:#f59e0b;color:#fff}
.edit{background:#6366f1;color:#fff}
.del{background:#dc2626;color:#fff}
.refresh{background:#2563eb;color:#fff}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.error{color:#dc2626}
table{width:100%;border-collapse:collapse}
th,td{padding:13px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>

<body>

<header>📄 LetsStudy Pro — Blog Pages Administration</header>

<main>

<button class="add"
onclick="location.href='new-page.html'">
＋ New Page
</button>

<button class="refresh"
onclick="loadPages()">
↻ Refresh
</button>

<div id="msg"></div>

<div class="grid">

<div class="card">
Total Pages
<div class="num" id="total">0</div>
</div>

<div class="card">
Published
<div class="num" id="published">0</div>
</div>

<div class="card">
Drafts
<div class="num" id="draft">0</div>
</div>

<div class="card">
Views
<div class="num" id="views">0</div>
</div>

</div>

<div class="box">

<input id="search"
placeholder="🔎 Search pages..."
oninput="render()">

<select id="filter" onchange="render()">
<option value="all">All</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>

<table>

<thead>
<tr>
<th>Title</th>
<th>Blog</th>
<th>Status</th>
<th>Views</th>
<th>Updated</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="list">
<tr>
<td colspan="6">Loading...</td>
</tr>
</tbody>

</table>

</div>

</main>


<script type="module">

import{initializeApp}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{getAuth,onAuthStateChanged}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,collection,getDocs,
doc,updateDoc,deleteDoc
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let pages=[];

const $=id=>document.getElementById(id);

onAuthStateChanged(auth,user=>{

 if(!user){

  $("msg").innerHTML=
  "<span class='error'>Admin login required.</span>";

  return;
 }

 loadPages();

});


async function loadPages(){

 try{

  const snap=await getDocs(
   collection(db,"pages")
  );

  pages=snap.docs.map(d=>({
   id:d.id,
   ...d.data()
  }));

  stats();
  render();

 }catch(e){

  $("msg").innerHTML=
  "<span class='error'>"+
  safe(e.message)+
  "</span>";

 }

}


function getStatus(p){

 return p.status||
 (p.published===true?"published":"draft");

}


function stats(){

 $("total").textContent=pages.length;

 $("published").textContent=
 pages.filter(p=>getStatus(p)==="published").length;

 $("draft").textContent=
 pages.filter(p=>getStatus(p)==="draft").length;

 $("views").textContent=
 pages.reduce((s,p)=>
 s+Number(p.views||0),0
 ).toLocaleString();

}


async function changeStatus(id,status){

 try{

  await updateDoc(
   doc(db,"pages",id),
   {
    status,
    published:status==="published",
    updatedAt:new Date()
   }
  );

  await loadPages();

 }catch(e){

  alert(e.message);

 }

}


function editPage(id){

 location.href=
 "edit-page.html?pageId="+
 encodeURIComponent(id);

}


async function deletePage(id){

 if(!confirm(
  "Delete this page permanently?"
 ))return;

 try{

  await deleteDoc(
   doc(db,"pages",id)
  );

  await loadPages();

 }catch(e){

  alert(e.message);

 }

}


function render(){

 const q=$("search").value.toLowerCase();
 const f=$("filter").value;

 const data=pages.filter(p=>{

  const s=getStatus(p);

  const text=(
   (p.title||"")+" "+
   (p.slug||"")+" "+
   (p.blogName||"")
  ).toLowerCase();

  return text.includes(q)&&
  (f==="all"||s===f);

 });


 $("list").innerHTML=data.map(p=>{

  const s=getStatus(p);

  return`

  <tr>

   <td>
    <b>${safe(p.title||"Untitled")}</b><br>
    <small>${safe(p.slug||"")}</small>
   </td>

   <td>
    ${safe(p.blogName||p.blogId||"—")}
   </td>

   <td>
    ${s==="published"
     ?"🟢 Published"
     :"🟡 Draft"}
   </td>

   <td>
    ${Number(p.views||0).toLocaleString()}
   </td>

   <td>
    ${date(p.updatedAt||p.createdAt)}
   </td>

   <td class="actions">

    <button class="edit"
    onclick="editPage('${p.id}')">
    Edit
    </button>

    ${
     s==="published"
     ?
     `<button class="draft"
      onclick="changeStatus('${p.id}','draft')">
      Draft
      </button>`
     :
     `<button class="publish"
      onclick="changeStatus('${p.id}','published')">
      Publish
      </button>`
    }

    <button class="del"
    onclick="deletePage('${p.id}')">
    Delete
    </button>

   </td>

  </tr>`;

 }).join("")||`

 <tr>
 <td colspan="6">
 No pages found.
 </td>
 </tr>`;

}


function date(t){

 if(!t)return"—";

 try{

  return new Date(
   t.seconds?t.seconds*1000:t
  ).toLocaleDateString();

 }catch{

  return"—";

 }

}


function safe(v){

 return String(v).replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m])
 );

}


window.loadPages=loadPages;
window.render=render;
window.changeStatus=changeStatus;
window.editPage=editPage;
window.deletePage=deletePage;

</script>

</body>
</html>
