<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Blog Posts - LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:18px;font-size:20px;font-weight:bold}
main{max-width:1250px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}
.card,.box{background:#fff;padding:18px;border-radius:14px;
box-shadow:0 3px 12px #0001;margin-bottom:18px}
.num{font-size:28px;font-weight:bold;margin-top:7px}
input,select{padding:12px;border:1px solid #ddd;border-radius:8px;margin:5px}
input{min-width:220px}
button{border:0;padding:10px 13px;border-radius:8px;cursor:pointer}
.add,.refresh{background:#2563eb;color:#fff}
.publish{background:#16a34a;color:#fff}
.draft{background:#f59e0b;color:#fff}
.edit{background:#6366f1;color:#fff}
.del{background:#dc2626;color:#fff}
table{width:100%;border-collapse:collapse}
th,td{padding:13px;border-bottom:1px solid #eee;text-align:left}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.error{color:#dc2626}
@media(max-width:700px){
 table{font-size:13px}
 th,td{padding:8px}
}
</style>
</head>

<body>

<header>📝 LetsStudy Pro — Blog Posts Administration</header>

<main>

<button class="add" onclick="location.href='new-post.html'">
＋ New Post
</button>

<button class="refresh" onclick="loadPosts()">
↻ Refresh
</button>

<div id="msg"></div>

<div class="grid">

<div class="card">
Total Posts
<div class="num" id="total">0</div>
</div>

<div class="card">
Published
<div class="num" id="published">0</div>
</div>

<div class="card">
Drafts
<div class="num" id="draft">0</div>
</div>

<div class="card">
Views
<div class="num" id="views">0</div>
</div>

<div class="card">
Comments
<div class="num" id="comments">0</div>
</div>

</div>

<div class="box">

<input id="search"
placeholder="🔎 Search posts..."
oninput="render()">

<select id="filter" onchange="render()">
<option value="all">All Posts</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>

<select id="sort" onchange="render()">
<option value="new">Newest</option>
<option value="views">Most Views</option>
<option value="title">Title A-Z</option>
</select>

<br><br>

<table>

<thead>
<tr>
<th>Post</th>
<th>Blog</th>
<th>Category</th>
<th>Status</th>
<th>Views</th>
<th>Comments</th>
<th>Updated</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="list">
<tr>
<td colspan="8">Loading...</td>
</tr>
</tbody>

</table>

</div>

</main>

<script type="module">

import{initializeApp}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{getAuth,onAuthStateChanged}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,collection,getDocs,
doc,updateDoc,deleteDoc
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let posts=[];
let comments=[];

const $=id=>document.getElementById(id);


onAuthStateChanged(auth,user=>{

 if(!user){

  $("msg").innerHTML=
  "<span class='error'>Admin login required.</span>";

  return;
 }

 loadPosts();

});


async function loadPosts(){

 try{

  const [postSnap,commentSnap]=await Promise.all([

   getDocs(collection(db,"posts")),

   getDocs(collection(db,"comments"))

  ]);

  posts=postSnap.docs.map(d=>({
   id:d.id,
   ...d.data()
  }));

  comments=commentSnap.docs.map(d=>({
   id:d.id,
   ...d.data()
  }));

  updateStats();
  render();

 }catch(e){

  $("msg").innerHTML=
  "<span class='error'>"+
  safe(e.message)+
  "</span>";

 }

}


function status(p){

 return p.status||
 (p.published===true?"published":"draft");

}


function commentCount(p){

 return comments.filter(c=>
  c.postId===p.id
 ).length;

}


function updateStats(){

 $("total").textContent=posts.length;

 $("published").textContent=
 posts.filter(p=>status(p)==="published").length;

 $("draft").textContent=
 posts.filter(p=>status(p)==="draft").length;

 $("views").textContent=
 posts.reduce((s,p)=>
  s+Number(p.views||p.viewCount||0),0
 ).toLocaleString();

 $("comments").textContent=
 comments.length;

}


async function changeStatus(id,newStatus){

 try{

  await updateDoc(
   doc(db,"posts",id),
   {
    status:newStatus,
    published:newStatus==="published",
    updatedAt:new Date()
   }
  );

  await loadPosts();

 }catch(e){

  alert(e.message);

 }

}


function editPost(id){

 location.href=
 "edit-post.html?postId="+
 encodeURIComponent(id);

}


async function deletePost(id){

 if(!confirm(
  "Delete this post permanently?"
 ))return;

 try{

  await deleteDoc(
   doc(db,"posts",id)
  );

  await loadPosts();

 }catch(e){

  alert(e.message);

 }

}


function render(){

 const q=$("search").value.toLowerCase();
 const filter=$("filter").value;
 const sort=$("sort").value;

 let data=posts.filter(p=>{

  const text=(
   (p.title||"")+" "+
   (p.slug||"")+" "+
   (p.blogName||"")+" "+
   (p.category||"")
  ).toLowerCase();

  return text.includes(q)&&
  (filter==="all"||status(p)===filter);

 });


 if(sort==="views"){

  data.sort((a,b)=>
   Number(b.views||b.viewCount||0)-
   Number(a.views||a.viewCount||0)
  );

 }

 if(sort==="title"){

  data.sort((a,b)=>
   String(a.title||"").localeCompare(
    String(b.title||"")
   )
  );

 }

 if(sort==="new"){

  data.sort((a,b)=>
   time(b.updatedAt||b.createdAt)-
   time(a.updatedAt||a.createdAt)
  );

 }


 $("list").innerHTML=data.map(p=>{

  const s=status(p);
  const views=Number(
   p.views||p.viewCount||0
  );

  return`

  <tr>

   <td>
    <b>${safe(p.title||"Untitled")}</b>
    <br>
    <small>${safe(p.slug||"")}</small>
   </td>

   <td>
    ${safe(p.blogName||p.blogId||"—")}
   </td>

   <td>
    ${safe(p.category||p.categoryName||"—")}
   </td>

   <td>
    ${s==="published"
     ?"🟢 Published"
     :"🟡 Draft"}
   </td>

   <td>
    ${views.toLocaleString()}
   </td>

   <td>
    ${commentCount(p)}
   </td>

   <td>
    ${date(p.updatedAt||p.createdAt)}
   </td>

   <td class="actions">

    <button class="edit"
    onclick="editPost('${p.id}')">
    Edit
    </button>

    ${
     s==="published"

     ?

     `<button class="draft"
      onclick="changeStatus('${p.id}','draft')">
      Draft
      </button>`

     :

     `<button class="publish"
      onclick="changeStatus('${p.id}','published')">
      Publish
      </button>`
    }

    <button class="del"
    onclick="deletePost('${p.id}')">
    Delete
    </button>

   </td>

  </tr>`;

 }).join("")||`

 <tr>
 <td colspan="8">
 No posts found.
 </td>
 </tr>`;

}


function time(t){

 if(!t)return 0;

 if(t.seconds)return t.seconds*1000;

 return new Date(t).getTime()||0;

}


function date(t){

 const x=time(t);

 return x?
 new Date(x).toLocaleDateString():
 "—";

}


function safe(v){

 return String(v).replace(
  /[&<>"']/g,
  m=>({

   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"

  }[m])
 );

}


window.loadPosts=loadPosts;
window.render=render;
window.changeStatus=changeStatus;
window.editPost=editPost;
window.deletePost=deletePost;

</script>

</body>
</html>
