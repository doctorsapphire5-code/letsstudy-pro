<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Management | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,Arial,sans-serif}
button,input,textarea,select{font:inherit}
.container{max-width:1200px;margin:auto;padding:25px}
.header{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:20px;margin-bottom:18px}
.header h1{margin:0 0 5px;font-size:24px}
.muted{color:#667085;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}
.stat strong{display:block;font-size:22px;margin-top:5px}
.toolbar{display:flex;gap:10px;margin-bottom:18px}
.toolbar input{flex:1}
input,textarea,select{width:100%;padding:11px;border:1px solid #d9dee8;border-radius:9px;outline:0}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:600}
.primary{background:#155eef;color:white}
.light{background:#eef2f6;color:#344054}
.danger{background:#fee4e2;color:#b42318}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.business{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}
.cover{height:115px;background:#e9eef7;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.logo{width:62px;height:62px;border-radius:12px;object-fit:contain;background:#fff;border:3px solid #fff;position:absolute;left:15px;bottom:-30px}
.business-body{padding:38px 15px 15px}
.business h3{margin:0 0 4px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#eef2f6}
.verified{background:#ecfdf3;color:#027a48}
.featured{background:#fff7ed;color:#c2410c}
.actions{display:flex;gap:7px;margin-top:14px}
.actions button{flex:1}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modal-box{background:#fff;width:min(850px,100%);max-height:92vh;overflow:auto;border-radius:15px;padding:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.group{margin-bottom:12px}
.group label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.close{float:right;background:#f2f4f7}
.empty{text-align:center;padding:45px;color:#667085}
@media(max-width:850px){.stats,.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.container{padding:15px}.stats,.grid,.form-grid{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style>
</head>

<body>

<main class="container">

<section class="header">
  <h1>Business Management</h1>
  <p class="muted">Manage businesses, verification, visibility and marketplace information.</p>
</section>

<section class="stats">
  <div class="stat">
    <span class="muted">Total Businesses</span>
    <strong id="total">0</strong>
  </div>
  <div class="stat">
    <span class="muted">Verified</span>
    <strong id="verified">0</strong>
  </div>
  <div class="stat">
    <span class="muted">Featured</span>
    <strong id="featured">0</strong>
  </div>
  <div class="stat">
    <span class="muted">Published</span>
    <strong id="published">0</strong>
  </div>
</section>

<section class="toolbar">
  <input id="search" placeholder="Search businesses...">

  <select id="status">
    <option value="">All Status</option>
    <option value="published">Published</option>
    <option value="draft">Draft</option>
    <option value="suspended">Suspended</option>
  </select>

  <button class="primary" id="addBusiness">
    <i class="fa fa-plus"></i> Add Business
  </button>
</section>

<section id="businessList" class="grid">
  <div class="empty">Loading businesses...</div>
</section>

</main>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<button class="close" id="close">✕</button>

<h2 id="modalTitle">Add Business</h2>

<form id="form">

<div class="form-grid">

<div class="group">
<label>Business Name</label>
<input id="name" required>
</div>

<div class="group">
<label>Slug</label>
<input id="slug">
</div>

<div class="group">
<label>Category</label>
<input id="category">
</div>

<div class="group">
<label>Subcategory</label>
<input id="subcategory">
</div>

<div class="group">
<label>Business Type</label>
<input id="businessType">
</div>

<div class="group">
<label>Industry</label>
<input id="industry">
</div>

<div class="group">
<label>Owner Name</label>
<input id="ownerName">
</div>

<div class="group">
<label>Owner ID</label>
<input id="ownerId">
</div>

<div class="group">
<label>Email</label>
<input id="email" type="email">
</div>

<div class="group">
<label>Phone</label>
<input id="phone">
</div>

<div class="group">
<label>WhatsApp</label>
<input id="whatsapp">
</div>

<div class="group">
<label>Website</label>
<input id="website">
</div>

<div class="group">
<label>Country</label>
<input id="country">
</div>

<div class="group">
<label>Region</label>
<input id="region">
</div>

<div class="group">
<label>City</label>
<input id="city">
</div>

<div class="group">
<label>Address</label>
<input id="address">
</div>

<div class="group">
<label>Logo URL</label>
<input id="logo">
</div>

<div class="group">
<label>Cover Image URL</label>
<input id="coverImage">
</div>

<div class="group">
<label>Price Range</label>
<input id="priceRange" placeholder="e.g. $$">
</div>

<div class="group">
<label>Currency</label>
<input id="currency" value="TZS">
</div>

<div class="group">
<label>Status</label>
<select id="businessStatus">
<option value="draft">Draft</option>
<option value="published">Published</option>
<option value="suspended">Suspended</option>
</select>
</div>

<div class="group">
<label>Verified</label>
<select id="isVerified">
<option value="false">No</option>
<option value="true">Yes</option>
</select>
</div>

<div class="group">
<label>Featured</label>
<select id="isFeatured">
<option value="false">No</option>
<option value="true">Yes</option>
</select>
</div>

</div>

<div class="group">
<label>Short Description</label>
<textarea id="shortDescription"></textarea>
</div>

<div class="group">
<label>Description</label>
<textarea id="description"></textarea>
</div>

<div class="group">
<label>Services</label>
<textarea id="services"
placeholder="Service 1, Service 2, Service 3"></textarea>
</div>

<div class="group">
<label>Products</label>
<textarea id="products"
placeholder="Product 1, Product 2, Product 3"></textarea>
</div>

<div class="group">
<label>Opening Hours</label>
<textarea id="openingHours"
placeholder="Mon-Fri: 08:00 - 18:00"></textarea>
</div>

<div class="group">
<label>Social Links</label>
<textarea id="socialLinks"
placeholder="Instagram, Facebook, LinkedIn..."></textarea>
</div>

<button class="primary" style="width:100%">
<i class="fa fa-save"></i> Save Business
</button>

</form>

</div>
</div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* STATE */

let businesses=[];
let editingId=null;


/* DOM */

const list=document.getElementById("businessList");
const modal=document.getElementById("modal");
const form=document.getElementById("form");


/* HELPERS */

const esc=v=>String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");


const arr=v=>
String(v||"")
.split(",")
.map(x=>x.trim())
.filter(Boolean);


/* LOAD */

async function loadBusinesses(){

 try{

   const snap=
     await getDocs(
       collection(db,"businesses")
     );

   businesses=[];

   snap.forEach(x=>{
     businesses.push({
       id:x.id,
       ...x.data()
     });
   });

   updateStats();
   render();

 }catch(error){

   console.error(error);

   list.innerHTML=
   `<div class="empty">
      Failed to load businesses.
    </div>`;

 }

}


/* STATS */

function updateStats(){

 document.getElementById("total")
 .textContent=businesses.length;

 document.getElementById("verified")
 .textContent=
 businesses.filter(x=>x.verified===true).length;

 document.getElementById("featured")
 .textContent=
 businesses.filter(x=>x.featured===true).length;

 document.getElementById("published")
 .textContent=
 businesses.filter(x=>x.status==="published").length;

}


/* RENDER */

function render(){

 const search=
   document.getElementById("search")
   .value.toLowerCase();

 const status=
   document.getElementById("status").value;

 const filtered=
   businesses.filter(b=>{

     const text=
       `${b.name||""} ${b.category||""} ${b.city||""} ${b.country||""}`
       .toLowerCase();

     return (
       text.includes(search) &&
       (!status || b.status===status)
     );

   });


 if(!filtered.length){

   list.innerHTML=
   `<div class="empty">
      <i class="fa fa-building"></i>
      <p>No businesses found.</p>
    </div>`;

   return;

 }


 list.innerHTML=
 filtered.map(b=>`

 <article class="business">

   <div class="cover">

     ${
       b.coverImage
       ? `<img src="${esc(b.coverImage)}">`
       : ""
     }

     <img
       class="logo"
       src="${esc(
         b.logo||
         "https://via.placeholder.com/100"
       )}"
     >

   </div>

   <div class="business-body">

     <h3>
       ${esc(b.name||"Unnamed Business")}
     </h3>

     <div class="muted">
       ${esc(b.category||"Business")}
       ${b.city ? ` · ${esc(b.city)}` : ""}
     </div>

     <div class="badges">

       ${
         b.verified
         ? `<span class="badge verified">
             <i class="fa fa-check-circle"></i>
             Verified
            </span>`
         : ""
       }

       ${
         b.featured
         ? `<span class="badge featured">
             <i class="fa fa-star"></i>
             Featured
            </span>`
         : ""
       }

       <span class="badge">
         ${esc(b.status||"draft")}
       </span>

     </div>

     <p class="muted">
       ${esc(
         b.shortDescription||
         b.description||
         "No description"
       )}
     </p>

     <div class="muted">
       <i class="fa fa-eye"></i>
       ${Number(b.views||0).toLocaleString()}
       &nbsp;
       <i class="fa fa-heart"></i>
       ${Number(b.likes||0).toLocaleString()}
       &nbsp;
       <i class="fa fa-star"></i>
       ${Number(b.rating||0).toFixed(1)}
     </div>

     <div class="actions">

       <button
         class="light"
         onclick="editBusiness('${b.id}')">
         <i class="fa fa-edit"></i>
         Edit
       </button>

       <button
         class="primary"
         onclick="toggleVerify('${b.id}')">
         <i class="fa fa-check"></i>
       </button>

       <button
         class="danger"
         onclick="removeBusiness('${b.id}')">
         <i class="fa fa-trash"></i>
       </button>

     </div>

   </div>

 </article>

 `).join("");

}


/* SEARCH */

document.getElementById("search")
.addEventListener("input",render);

document.getElementById("status")
.addEventListener("change",render);


/* OPEN */

document.getElementById("addBusiness")
.onclick=()=>{

 editingId=null;

 form.reset();

 document.getElementById("modalTitle")
 .textContent="Add Business";

 modal.classList.add("show");

};


/* CLOSE */

document.getElementById("close")
.onclick=()=>{
 modal.classList.remove("show");
};


/* SAVE */

form.onsubmit=async e=>{

 e.preventDefault();

 const data={

   name:name.value.trim(),
   slug:slug.value.trim(),

   description:description.value.trim(),
   shortDescription:
     shortDescription.value.trim(),

   logo:logo.value.trim(),
   coverImage:coverImage.value.trim(),

   ownerId:ownerId.value.trim(),
   ownerName:ownerName.value.trim(),

   email:email.value.trim(),
   phone:phone.value.trim(),
   whatsapp:whatsapp.value.trim(),
   website:website.value.trim(),

   country:country.value.trim(),
   region:region.value.trim(),
   city:city.value.trim(),
   address:address.value.trim(),

   category:category.value.trim(),
   subcategory:subcategory.value.trim(),

   businessType:businessType.value.trim(),
   industry:industry.value.trim(),

   services:arr(services.value),
   products:arr(products.value),

   priceRange:priceRange.value.trim(),
   currency:currency.value.trim(),

   openingHours:
     openingHours.value.trim(),

   socialLinks:
     socialLinks.value.trim(),

   verified:
     isVerified.value==="true",

   featured:
     isFeatured.value==="true",

   status:
     businessStatus.value,

   updatedAt:serverTimestamp()

 };


 try{

   if(editingId){

     await updateDoc(
       doc(db,"businesses",editingId),
       data
     );

   }else{

     data.views=0;
     data.likes=0;
     data.rating=0;
     data.ratingCount=0;
     data.followersCount=0;
     data.productsCount=0;
     data.servicesCount=0;
     data.jobsCount=0;

     data.createdAt=serverTimestamp();
     data.publishedAt=
       data.status==="published"
       ? serverTimestamp()
       : null;

     await addDoc(
       collection(db,"businesses"),
       data
     );

   }

   modal.classList.remove("show");

   await loadBusinesses();

 }catch(error){

   console.error(error);

   alert("Unable to save business.");

 }

};


/* EDIT */

window.editBusiness=async id=>{

 const b=
   businesses.find(x=>x.id===id);

 if(!b)return;

 editingId=id;

 document.getElementById("modalTitle")
 .textContent="Edit Business";


 Object.keys(b).forEach(key=>{

   const el=document.getElementById(key);

   if(!el)return;

   if(key==="verified" || key==="featured"){

     el.value=b[key]?"true":"false";

   }else if(Array.isArray(b[key])){

     el.value=b[key].join(", ");

   }else{

     el.value=b[key]??"";

   }

 });


 modal.classList.add("show");

};


/* VERIFY */

window.toggleVerify=async id=>{

 const b=
   businesses.find(x=>x.id===id);

 if(!b)return;

 try{

   await updateDoc(
     doc(db,"businesses",id),
     {
       verified:!b.verified,
       updatedAt:serverTimestamp()
     }
   );

   await loadBusinesses();

 }catch(error){

   console.error(error);

   alert("Verification update failed.");

 }

};


/* DELETE */

window.removeBusiness=async id=>{

 if(!confirm(
   "Delete this business permanently?"
 ))return;

 try{

   await deleteDoc(
     doc(db,"businesses",id)
   );

   await loadBusinesses();

 }catch(error){

   console.error(error);

   alert("Delete failed.");

 }

};


/* START */

loadBusinesses();

</script>

</body>
</html>
