<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Careers Admin | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}
main{max-width:1100px;margin:auto;padding:25px 15px}
.card{background:#fff;padding:18px;border-radius:12px;margin-bottom:18px;border:1px solid #e5e7eb}
h1,h2,h3{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;padding:18px;border-radius:10px;border:1px solid #e5e7eb}
.num{font-size:27px;font-weight:bold;margin-top:7px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:7px}
textarea{min-height:100px}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}
button,.btn{border:0;border-radius:7px;padding:9px 13px;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.red{background:#dc2626;color:white}
.gray{background:#e5e7eb;color:#111827}
.orange{background:#f59e0b;color:white}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.job{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:17px}
.company{color:#2563eb;font-weight:bold}
.meta{font-size:13px;color:#667085;margin:7px 0}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:11px;margin:2px}
.published{background:#dcfce7;color:#166534}
.draft{background:#f3f4f6;color:#374151}
.closed{background:#fee2e2;color:#991b1b}
.featured{background:#fef3c7;color:#92400e}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;padding:40px;color:#667085}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:10}
.modal.show{display:flex}
.box{background:#fff;border-radius:12px;width:100%;max-width:800px;max-height:92vh;overflow:auto}
.boxhead{padding:17px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}
.boxbody{padding:18px}
.boxfoot{padding:15px;border-top:1px solid #ddd;text-align:right}
.close{background:none;font-size:25px}
@media(max-width:800px){
.stats,.grid{grid-template-columns:1fr 1fr}
.toolbar,.form{grid-template-columns:1fr}
.full{grid-column:auto}
}
@media(max-width:500px){
.stats,.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<strong>LetsStudy Pro — Careers</strong>
<span>Career Management</span>
</header>

<main>

<h1>💼 Careers</h1>

<p>Manage jobs, internships and career opportunities.</p>

<!-- STATS -->

<div class="stats">

<div class="stat">
<div>Total Careers</div>
<div class="num" id="total">0</div>
</div>

<div class="stat">
<div>Published</div>
<div class="num" id="published">0</div>
</div>

<div class="stat">
<div>Drafts</div>
<div class="num" id="draft">0</div>
</div>

<div class="stat">
<div>Featured</div>
<div class="num" id="featured">0</div>
</div>

</div>

<br>

<!-- ADD FORM -->

<div class="card">

<h2>➕ Add / Edit Career</h2>

<form id="careerForm">

<input type="hidden" id="careerId">

<div class="form">

<div class="full">
<label>Career Title *</label>
<input id="title" required placeholder="Frontend Developer">
</div>

<div>
<label>Company *</label>
<input id="company" required placeholder="Company name">
</div>

<div>
<label>Location</label>
<input id="location" placeholder="Dar es Salaam / Remote">
</div>

<div>
<label>Type</label>
<select id="type">
<option>Full Time</option>
<option>Part Time</option>
<option>Internship</option>
<option>Contract</option>
<option>Remote</option>
<option>Freelance</option>
</select>
</div>

<div>
<label>Category</label>
<select id="category">
<option>Technology</option>
<option>Business</option>
<option>Marketing</option>
<option>Programming</option>
<option>AI</option>
<option>Cybersecurity</option>
<option>Design</option>
<option>Education</option>
<option>Finance</option>
<option>Other</option>
</select>
</div>

<div>
<label>Salary</label>
<input id="salary" placeholder="TZS 1,500,000 - 2,500,000">
</div>

<div>
<label>Status</label>
<select id="status">
<option value="published">Published</option>
<option value="draft">Draft</option>
<option value="closed">Closed</option>
</select>
</div>

<div>
<label>Featured</label>
<select id="isFeatured">
<option value="false">No</option>
<option value="true">Yes</option>
</select>
</div>

<div class="full">
<label>Application URL</label>
<input id="applicationUrl" type="url"
placeholder="https://example.com/apply">
</div>

<div class="full">
<label>Skills</label>
<input id="skills"
placeholder="JavaScript, HTML, CSS, Firebase">
</div>

<div class="full">
<label>Requirements</label>
<textarea id="requirements"
placeholder="Enter requirements"></textarea>
</div>

<div class="full">
<label>Description *</label>
<textarea id="description" required
placeholder="Enter career description"></textarea>
</div>

</div>

<br>

<button class="primary" id="saveBtn">
Add Career
</button>

<button type="button" class="gray"
onclick="clearForm()">
Clear
</button>

</form>

</div>


<!-- SEARCH -->

<div class="card">

<h2>🔎 Manage Careers</h2>

<div class="toolbar">

<input id="search"
placeholder="Search careers...">

<select id="filterStatus">
<option value="">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
<option value="closed">Closed</option>
</select>

<select id="filterType">
<option value="">All Types</option>
<option>Full Time</option>
<option>Part Time</option>
<option>Internship</option>
<option>Contract</option>
<option>Remote</option>
<option>Freelance</option>
</select>

<select id="filterCategory">
<option value="">All Categories</option>
<option>Technology</option>
<option>Business</option>
<option>Marketing</option>
<option>Programming</option>
<option>AI</option>
<option>Cybersecurity</option>
<option>Design</option>
<option>Education</option>
<option>Finance</option>
</select>

</div>

</div>


<!-- CAREERS -->

<div id="list" class="grid">
<div class="empty">Loading...</div>
</div>

</main>


<!-- PREVIEW MODAL -->

<div class="modal" id="modal">

<div class="box">

<div class="boxhead">

<h2>Career Details</h2>

<button class="close"
onclick="closeModal()">×</button>

</div>

<div class="boxbody" id="details"></div>

</div>

</div>


<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:"G-85B7V5H5J0"

};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let careers=[];
let editingId=null;

const $=id=>document.getElementById(id);


/* ESCAPE */

function esc(x){

return String(x||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* LOAD */

async function load(){

try{

const snap=
await getDocs(collection(db,"careers"));

careers=snap.docs.map(d=>({
id:d.id,
...d.data()
}));

careers.sort((a,b)=>
(b.createdAt?.seconds||0)-
(a.createdAt?.seconds||0)
);

stats();
render();

}catch(e){

console.error(e);

$("list").innerHTML=
`<div class="empty">Failed to load careers.</div>`;

}

}


/* STATS */

function stats(){

$("total").textContent=careers.length;

$("published").textContent=
careers.filter(x=>x.status==="published").length;

$("draft").textContent=
careers.filter(x=>x.status==="draft").length;

$("featured").textContent=
careers.filter(x=>x.featured===true).length;

}


/* FILTER */

function filtered(){

const q=$("search").value.toLowerCase();
const status=$("filterStatus").value;
const type=$("filterType").value;
const category=$("filterCategory").value;

return careers.filter(c=>{

const text=[
c.title,c.company,c.location,
c.description,c.salary,c.category,
...(c.skills||[])
].join(" ").toLowerCase();

return(
(!q||text.includes(q)) &&
(!status||c.status===status) &&
(!type||c.type===type) &&
(!category||c.category===category)
);

});

}


/* RENDER */

function render(){

const list=filtered();

if(!list.length){

$("list").innerHTML=
`<div class="empty">
<h3>No careers found</h3>
<p>Add a new career or change your filters.</p>
</div>`;

return;

}

$("list").innerHTML=list.map(c=>`

<div class="job">

<h3>${esc(c.title)}</h3>

<div class="company">
${esc(c.company)}
</div>

<div class="meta">
📍 ${esc(c.location||"Not specified")}
</div>

<div class="meta">
💼 ${esc(c.type||"Not specified")}
</div>

<div class="meta">
💰 ${esc(c.salary||"Not specified")}
</div>

<span class="badge ${c.status||"draft"}">
${esc(c.status||"draft")}
</span>

${c.featured?
`<span class="badge featured">⭐ Featured</span>`:""}

<p>
${esc(c.description||"")}
</p>

<div class="actions">

<button class="gray"
onclick="preview('${c.id}')">
👁 View
</button>

<button class="primary"
onclick="editCareer('${c.id}')">
✏ Edit
</button>

<button class="orange"
onclick="togglePublish('${c.id}')">
${c.status==="published"?"Unpublish":"Publish"}
</button>

<button class="red"
onclick="deleteCareer('${c.id}')">
🗑 Delete
</button>

</div>

</div>

`).join("");

}


/* ADD / UPDATE */

$("careerForm").onsubmit=async e=>{

e.preventDefault();

const title=$("title").value.trim();
const company=$("company").value.trim();
const description=$("description").value.trim();

if(!title||!company||!description){

alert("Title, company and description are required.");
return;

}

const data={

title,

slug:title
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,""),

company,

location:$("location").value.trim(),

type:$("type").value,

category:$("category").value,

salary:$("salary").value.trim(),

status:$("status").value,

featured:$("isFeatured").value==="true",

applicationUrl:
$("applicationUrl").value.trim(),

skills:$("skills").value
.split(",")
.map(x=>x.trim())
.filter(Boolean),

requirements:
$("requirements").value.trim(),

description,

updatedAt:serverTimestamp()

};

$("saveBtn").disabled=true;
$("saveBtn").textContent="Saving...";

try{

if(editingId){

await updateDoc(
doc(db,"careers",editingId),
data
);

alert("Career updated successfully.");

}else{

await addDoc(
collection(db,"careers"),
{
...data,
createdAt:serverTimestamp()
}
);

alert("Career added successfully.");

}

clearForm();
await load();

}catch(error){

console.error(error);
alert("Error: "+error.message);

}

$("saveBtn").disabled=false;
$("saveBtn").textContent="Add Career";

};


/* EDIT */

window.editCareer=id=>{

const c=careers.find(x=>x.id===id);

if(!c)return;

editingId=id;

$("careerId").value=id;

$("title").value=c.title||"";
$("company").value=c.company||"";
$("location").value=c.location||"";
$("type").value=c.type||"Full Time";
$("category").value=c.category||"Technology";
$("salary").value=c.salary||"";
$("status").value=c.status||"draft";
$("isFeatured").value=c.featured?"true":"false";
$("applicationUrl").value=c.applicationUrl||"";
$("skills").value=(c.skills||[]).join(", ");
$("requirements").value=c.requirements||"";
$("description").value=c.description||"";

$("saveBtn").textContent="Update Career";

window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* CLEAR */

window.clearForm=()=>{

editingId=null;

$("careerForm").reset();

$("careerId").value="";

$("saveBtn").textContent="Add Career";

};


/* DELETE */

window.deleteCareer=async id=>{

const c=careers.find(x=>x.id===id);

if(!c)return;

if(!confirm(
`Delete "${c.title}"?`
))return;

try{

await deleteDoc(
doc(db,"careers",id)
);

await load();

}catch(e){

alert(e.message);

}

};


/* PUBLISH */

window.togglePublish=async id=>{

const c=careers.find(x=>x.id===id);

if(!c)return;

const newStatus=
c.status==="published"
?"draft"
:"published";

try{

await updateDoc(
doc(db,"careers",id),
{
status:newStatus,
updatedAt:serverTimestamp()
}
);

await load();

}catch(e){

alert(e.message);

}

};


/* PREVIEW */

window.preview=id=>{

const c=careers.find(x=>x.id===id);

if(!c)return;

$("details").innerHTML=`

<h1>${esc(c.title)}</h1>

<h3>${esc(c.company)}</h3>

<p>
📍 ${esc(c.location||"-")}<br>
💼 ${esc(c.type||"-")}<br>
💰 ${esc(c.salary||"-")}
</p>

<p>
<span class="badge">
${esc(c.category||"General")}
</span>

<span class="badge ${c.status}">
${esc(c.status)}
</span>

${c.featured?
`<span class="badge featured">⭐ Featured</span>`:""}

</p>

<hr>

<h3>Description</h3>
<p>${esc(c.description)}</p>

<h3>Requirements</h3>
<p>${esc(c.requirements||"Not specified")}</p>

<h3>Skills</h3>

<p>
${(c.skills||[])
.map(x=>`<span class="badge">${esc(x)}</span>`)
.join(" ")}
</p>

${
c.applicationUrl
?
`<a class="btn primary"
href="${esc(c.applicationUrl)}"
target="_blank"
rel="noopener">
Apply Now →
</a>`
:""
}

`;

$("modal").classList.add("show");

};


window.closeModal=()=>{
$("modal").classList.remove("show");
};


/* FILTER EVENTS */

$("search").oninput=render;
$("filterStatus").onchange=render;
$("filterType").onchange=render;
$("filterCategory").onchange=render;


/* START */

load();

</script>

</body>
</html>
