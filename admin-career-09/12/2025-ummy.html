
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Careers | LetsStudy Pro</title>

<meta name="robots" content="noindex,nofollow">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #101c3b;
    color: white;
    padding: 20px;
}

header h1 {
    font-size: 22px;
}

header p {
    margin-top: 8px;
    color: #cbd5e1;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px #00000008;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 18px;
    border-radius: 10px;
}

.stat strong {
    display: block;
    font-size: 25px;
    color: #2454db;
    margin-top: 8px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d7deea;
    border-radius: 7px;
    margin-top: 7px;
    margin-bottom: 15px;
    font-size: 14px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

label {
    font-size: 14px;
    font-weight: bold;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: #2454db;
    color: white;
}

.secondary {
    background: #e8edf5;
    color: #172033;
}

.danger {
    background: #dc2626;
    color: white;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.career {
    border: 1px solid #e5eaf2;
    padding: 16px;
    border-radius: 10px;
    margin-top: 12px;
}

.career h3 {
    margin-bottom: 8px;
}

.career p {
    margin: 6px 0;
    color: #64748b;
    font-size: 14px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.status {
    padding: 12px;
    background: #eef3ff;
    border-radius: 7px;
    margin-bottom: 15px;
    font-size: 14px;
}

.hidden {
    display: none !important;
}

#message {
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 7px;
    display: none;
}

#message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

#message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

@media(max-width:600px) {
    .stats {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>LetsStudy Pro</h1>
    <p>Admin Dashboard • Careers Management</p>
</header>

<div class="container">

    <div id="message"></div>

    <div id="loading" class="card">
        Checking administrator account...
    </div>

    <div id="adminPanel" class="hidden">

        <div class="card">
            <h2>Administrator</h2>
            <p id="adminInfo" style="margin-top:10px;"></p>
            <p id="permissionInfo" style="margin-top:8px;"></p>

            <div class="actions">
                <button class="secondary" onclick="location.href='admin.html'">
                    Dashboard
                </button>

                <button class="danger" id="logoutBtn">
                    Logout
                </button>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                Total Careers
                <strong id="totalCareers">0</strong>
            </div>

            <div class="stat">
                Published
                <strong id="publishedCareers">0</strong>
            </div>

            <div class="stat">
                Drafts
                <strong id="draftCareers">0</strong>
            </div>
        </div>

        <div class="card" id="formCard">
            <h2 id="formTitle">Add Career</h2>

            <form id="careerForm">

                <input type="hidden" id="careerId">

                <label>Career Title *</label>
                <input id="title" required placeholder="e.g. Software Developer">

                <label>Organization *</label>
                <input id="organization" required placeholder="Organization name">

                <label>Location *</label>
                <input id="location" required placeholder="e.g. Tanzania">

                <label>Employment Type</label>
                <select id="type">
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Internship">Internship</option>
                    <option value="Contract">Contract</option>
                    <option value="Remote">Remote</option>
                </select>

                <label>Application Deadline</label>
                <input type="date" id="deadline">

                <label>Description *</label>
                <textarea id="description" required
                placeholder="Career description"></textarea>

                <label>Requirements</label>
                <textarea id="requirements"
                placeholder="Qualifications and requirements"></textarea>

                <label>Application URL</label>
                <input type="url" id="applicationUrl"
                placeholder="https://example.com/apply">

                <label>Status</label>
                <select id="status">
                    <option value="draft">Draft</option>
                    <option value="published">Published</option>
                </select>

                <button type="submit" class="primary" id="saveBtn">
                    Save Career
                </button>

                <button type="button" class="secondary"
                id="cancelEditBtn">
                    Cancel
                </button>

            </form>
        </div>

        <div class="card">
            <h2>Manage Careers</h2>

            <input id="searchInput"
            placeholder="Search careers...">

            <select id="filterStatus">
                <option value="all">All Careers</option>
                <option value="published">Published</option>
                <option value="draft">Draft</option>
            </select>

            <button class="secondary" id="refreshBtn">
                Refresh
            </button>

            <div id="careerList"></div>
        </div>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

/* =========================================
   1. FIREBASE CONFIGURATION
========================================= */

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "let-s-study-pro-course.firebaseapp.com",
    projectId: "let-s-study-pro-course",
    storageBucket: "let-s-study-pro-course.firebasestorage.app",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =========================================
   2. GLOBAL VARIABLES
========================================= */

let currentAdmin = null;
let currentAdminId = null;
let careers = [];

const adminPanel = document.getElementById("adminPanel");
const loading = document.getElementById("loading");
const messageBox = document.getElementById("message");
const careerForm = document.getElementById("careerForm");

/* =========================================
   3. MESSAGE
========================================= */

function showMessage(message, type = "success") {
    messageBox.textContent = message;
    messageBox.className = type;

    setTimeout(() => {
        messageBox.style.display = "none";
    }, 5000);
}

/* =========================================
   4. READ ADMIN ID FROM LOGIN-ADMIN.HTML
========================================= */

function getAdminId() {
    return localStorage.getItem("adminId");
}

/* =========================================
   5. ADMIN AUTHENTICATION
========================================= */

onAuthStateChanged(auth, async (user) => {

    try {

        if (!user) {
            location.href = "login-admin.html";
            return;
        }

        currentAdminId = getAdminId();

        if (!currentAdminId) {
            throw new Error(
                "Admin ID not found. Please login again."
            );
        }

        /*
        Admin document:
        admins/{adminId}
        */

        const adminRef = doc(
            db,
            "admins",
            currentAdminId
        );

        const adminSnapshot = await getDoc(adminRef);

        if (!adminSnapshot.exists()) {
            throw new Error(
                "Administrator account not found."
            );
        }

        currentAdmin = adminSnapshot.data();

        /* Check status */

        if (
            currentAdmin.status !== "active" &&
            currentAdmin.status !== "approved"
        ) {
            throw new Error(
                "Administrator account is inactive."
            );
        }

        /* Check logged-in email if admin email exists */

        if (
            currentAdmin.email &&
            user.email &&
            currentAdmin.email.toLowerCase() !==
            user.email.toLowerCase()
        ) {
            throw new Error(
                "Admin email does not match logged-in account."
            );
        }

        /*
        CAREERS PERMISSIONS

        Supports:
        permissions.manageCareers
        permissions.careers
        accessLevel
        role
        */

        const permissions = currentAdmin.permissions || {};

        const canManageCareers =
            permissions.manageCareers === true ||
            permissions.careers === true ||
            currentAdmin.accessLevel === "all" ||
            currentAdmin.role === "admin";

        if (!canManageCareers) {
            throw new Error(
                "You do not have permission to manage careers."
            );
        }

        loading.classList.add("hidden");
        adminPanel.classList.remove("hidden");

        document.getElementById("adminInfo").textContent =
            "Admin ID: " + currentAdminId +
            " | Email: " + (currentAdmin.email || user.email || "");

        document.getElementById("permissionInfo").textContent =
            "Careers Management: Authorized";

        await loadCareers();

    } catch (error) {

        loading.textContent = error.message;

        showMessage(error.message, "error");

    }

});

/* =========================================
   6. LOAD CAREERS
========================================= */

async function loadCareers() {

    try {

        const snapshot = await getDocs(
            collection(db, "careers")
        );

        careers = [];

        snapshot.forEach((item) => {
            careers.push({
                id: item.id,
                ...item.data()
            });
        });

        updateStats();
        renderCareers();

    } catch (error) {

        showMessage(
            "Failed to load careers: " + error.message,
            "error"
        );

    }

}

/* =========================================
   7. CAREER STATISTICS
========================================= */

function updateStats() {

    document.getElementById("totalCareers").textContent =
        careers.length;

    document.getElementById("publishedCareers").textContent =
        careers.filter(c => c.status === "published").length;

    document.getElementById("draftCareers").textContent =
        careers.filter(c => c.status === "draft").length;

}

/* =========================================
   8. DISPLAY CAREERS
========================================= */

function renderCareers() {

    const list = document.getElementById("careerList");

    const search = document.getElementById("searchInput")
        .value.toLowerCase();

    const filter = document.getElementById("filterStatus").value;

    list.innerHTML = "";

    const filtered = careers.filter(career => {

        const matchesSearch =
            (career.title || "").toLowerCase().includes(search) ||
            (career.organization || "").toLowerCase().includes(search) ||
            (career.location || "").toLowerCase().includes(search);

        const matchesStatus =
            filter === "all" ||
            career.status === filter;

        return matchesSearch && matchesStatus;

    });

    if (filtered.length === 0) {

        list.innerHTML =
            "<p style='margin-top:15px;color:#64748b'>" +
            "No careers found.</p>";

        return;

    }

    filtered.forEach(career => {

        const item = document.createElement("div");
        item.className = "career";

        const title = document.createElement("h3");
        title.textContent = career.title || "Untitled Career";

        const organization = document.createElement("p");
        organization.textContent =
            "Organization: " + (career.organization || "N/A");

        const location = document.createElement("p");
        location.textContent =
            "Location: " + (career.location || "N/A");

        const status = document.createElement("p");
        status.textContent =
            "Status: " + (career.status || "draft");

        const editButton = document.createElement("button");
        editButton.className = "secondary";
        editButton.textContent = "Edit";

        editButton.onclick = () => editCareer(career.id);

        const deleteButton = document.createElement("button");
        deleteButton.className = "danger";
        deleteButton.textContent = "Delete";

        deleteButton.onclick = () => deleteCareer(career.id);

        const actions = document.createElement("div");
        actions.className = "actions";

        actions.append(editButton, deleteButton);

        item.append(
            title,
            organization,
            location,
            status,
            actions
        );

        list.appendChild(item);

    });

}

/* =========================================
   9. ADD / UPDATE CAREER
========================================= */

careerForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const saveButton = document.getElementById("saveBtn");

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try {

        const careerId =
            document.getElementById("careerId").value;

        const careerData = {

            title: document.getElementById("title").value.trim(),

            organization:
                document.getElementById("organization").value.trim(),

            location:
                document.getElementById("location").value.trim(),

            type:
                document.getElementById("type").value,

            deadline:
                document.getElementById("deadline").value,

            description:
                document.getElementById("description").value.trim(),

            requirements:
                document.getElementById("requirements").value.trim(),

            applicationUrl:
                document.getElementById("applicationUrl").value.trim(),

            status:
                document.getElementById("status").value,

            updatedAt: serverTimestamp(),

            updatedBy: currentAdminId

        };

        if (!careerData.title || !careerData.description) {
            throw new Error("Please complete required fields.");
        }

        if (careerId) {

            await updateDoc(
                doc(db, "careers", careerId),
                careerData
            );

            showMessage("Career updated successfully.");

        } else {

            careerData.createdAt = serverTimestamp();
            careerData.createdBy = currentAdminId;

            await addDoc(
                collection(db, "careers"),
                careerData
            );

            showMessage("Career created successfully.");

        }

        resetForm();
        await loadCareers();

    } catch (error) {

        showMessage(
            "Error saving career: " + error.message,
            "error"
        );

    } finally {

        saveButton.disabled = false;
        saveButton.textContent = "Save Career";

    }

});

/* =========================================
   10. EDIT CAREER
========================================= */

function editCareer(id) {

    const career = careers.find(c => c.id === id);

    if (!career) return;

    document.getElementById("careerId").value = career.id;
    document.getElementById("title").value = career.title || "";
    document.getElementById("organization").value =
        career.organization || "";
    document.getElementById("location").value =
        career.location || "";
    document.getElementById("type").value =
        career.type || "Full-time";
    document.getElementById("deadline").value =
        career.deadline || "";
    document.getElementById("description").value =
        career.description || "";
    document.getElementById("requirements").value =
        career.requirements || "";
    document.getElementById("applicationUrl").value =
        career.applicationUrl || "";
    document.getElementById("status").value =
        career.status || "draft";

    document.getElementById("formTitle").textContent =
        "Edit Career";

    document.getElementById("saveBtn").textContent =
        "Update Career";

    document.getElementById("formCard").scrollIntoView({
        behavior: "smooth"
    });

}

/* =========================================
   11. DELETE CAREER
========================================= */

async function deleteCareer(id) {

    const confirmed = confirm(
        "Are you sure you want to delete this career?"
    );

    if (!confirmed) return;

    try {

        await deleteDoc(
            doc(db, "careers", id)
        );

        showMessage("Career deleted successfully.");

        await loadCareers();

    } catch (error) {

        showMessage(
            "Error deleting career: " + error.message,
            "error"
        );

    }

}

/* =========================================
   12. RESET FORM
========================================= */

function resetForm() {

    careerForm.reset();

    document.getElementById("careerId").value = "";

    document.getElementById("formTitle").textContent =
        "Add Career";

    document.getElementById("saveBtn").textContent =
        "Save Career";

}

/* =========================================
   13. EVENTS
========================================= */

document.getElementById("cancelEditBtn")
.addEventListener("click", resetForm);

document.getElementById("refreshBtn")
.addEventListener("click", loadCareers);

document.getElementById("searchInput")
.addEventListener("input", renderCareers);

document.getElementById("filterStatus")
.addEventListener("change", renderCareers);

/* =========================================
   14. LOGOUT
========================================= */

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

    const confirmed = confirm("Logout from Admin Dashboard?");

    if (!confirmed) return;

    try {

        localStorage.removeItem("adminId");

        await signOut(auth);

        location.href = "login-admin.html";

    } catch (error) {

        showMessage(
            "Logout failed: " + error.message,
            "error"
        );

    
    
    }
});

</script>

</body>
</html>
