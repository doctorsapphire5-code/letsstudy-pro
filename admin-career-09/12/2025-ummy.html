<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Careers | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:#fff;
  padding:18px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:20;
}

header h1{
  margin:0;
  font-size:21px;
}

.back{
  color:#fff;
  text-decoration:none;
  background:#2563eb;
  padding:9px 14px;
  border-radius:8px;
  font-size:14px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:22px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border-radius:12px;
  padding:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.stat small{
  color:#6b7280;
}

.stat strong{
  display:block;
  font-size:27px;
  margin-top:8px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card h2{
  margin-top:0;
  font-size:19px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  border:1px solid #dbe1ea;
  border-radius:8px;
  font:inherit;
  background:#fff;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
}

.save{
  background:#2563eb;
  color:white;
}

.clear{
  background:#e5e7eb;
  color:#111827;
}

.search-row{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,td{
  text-align:left;
  padding:12px;
  border-bottom:1px solid #edf0f4;
  vertical-align:middle;
}

th{
  background:#f8fafc;
  font-size:13px;
}

.career-img{
  width:60px;
  height:45px;
  object-fit:cover;
  border-radius:7px;
  background:#e5e7eb;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.published{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#fef3c7;
  color:#92400e;
}

.featured{
  background:#dbeafe;
  color:#1d4ed8;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.edit{
  background:#2563eb;
  color:white;
}

.toggle{
  background:#f59e0b;
  color:white;
}

.feature{
  background:#7c3aed;
  color:white;
}

.delete{
  background:#dc2626;
  color:white;
}

.message{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.loading{
  text-align:center;
  padding:25px;
  color:#6b7280;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid,
  .search-row{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}

@media(max-width:500px){
  .container{
    padding:12px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  header{
    padding:14px;
  }
}
</style>
</head>

<body>

<header>
  <h1>💼 LetsStudy Pro — Admin Careers</h1>
  <a href="admin.html" class="back">← Admin</a>
</header>

<main class="container">

  <!-- STATS -->

  <section class="stats">

    <div class="stat">
      <small>Total Careers</small>
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat">
      <small>Published</small>
      <strong id="publishedCount">0</strong>
    </div>

    <div class="stat">
      <small>Drafts</small>
      <strong id="draftCount">0</strong>
    </div>

    <div class="stat">
      <small>Featured</small>
      <strong id="featuredCount">0</strong>
    </div>

  </section>


  <!-- MESSAGE -->

  <div id="message" class="message"></div>


  <!-- ADD / EDIT -->

  <section class="card">

    <h2 id="formTitle">➕ Add Career</h2>

    <form id="careerForm">

      <input
        type="hidden"
        id="careerId"
      >

      <div class="form-grid">

        <div class="full">
          <label>Career Title *</label>
          <input
            id="title"
            required
            placeholder="e.g. Software Engineer"
          >
        </div>

        <div>
          <label>Slug</label>
          <input
            id="slug"
            placeholder="software-engineer"
          >
        </div>

        <div>
          <label>Company / Organization *</label>
          <input
            id="company"
            required
            placeholder="Company name"
          >
        </div>

        <div>
          <label>Location</label>
          <input
            id="location"
            placeholder="Dar es Salaam, Tanzania"
          >
        </div>

        <div>
          <label>Job Type</label>
          <select id="type">
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Remote">Remote</option>
            <option value="Internship">Internship</option>
            <option value="Contract">Contract</option>
            <option value="Freelance">Freelance</option>
          </select>
        </div>

        <div>
          <label>Salary</label>
          <input
            id="salary"
            placeholder="e.g. TZS 800,000 - 1,500,000"
          >
        </div>

        <div>
          <label>Status</label>
          <select id="status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>
        </div>

        <div>
          <label>Featured</label>
          <select id="featured">
            <option value="false">No</option>
            <option value="true">Yes</option>
          </select>
        </div>

        <div class="full">
          <label>Skills</label>
          <input
            id="skills"
            placeholder="JavaScript, Firebase, React..."
          >
        </div>

        <div class="full">
          <label>Requirements</label>
          <textarea
            id="requirements"
            placeholder="One requirement per line"
          ></textarea>
        </div>

        <div class="full">
          <label>Description *</label>
          <textarea
            id="description"
            required
            placeholder="Career description..."
          ></textarea>
        </div>

        <div>
          <label>Application URL</label>
          <input
            id="applicationUrl"
            type="url"
            placeholder="https://..."
          >
        </div>

        <div>
          <label>Image URL</label>
          <input
            id="imageUrl"
            type="url"
            placeholder="https://..."
          >
        </div>

      </div>

      <br>

      <button
        type="submit"
        class="save"
        id="saveBtn"
      >
        Save Career
      </button>

      <button
        type="button"
        class="clear"
        id="clearBtn"
      >
        Clear
      </button>

    </form>

  </section>


  <!-- CAREERS -->

  <section class="card">

    <h2>🔎 Career Management</h2>

    <div class="search-row">

      <input
        id="searchInput"
        placeholder="Search careers..."
      >

      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="published">Published</option>
        <option value="draft">Draft</option>
      </select>

      <select id="typeFilter">
        <option value="">All Types</option>
        <option value="Full-time">Full-time</option>
        <option value="Part-time">Part-time</option>
        <option value="Remote">Remote</option>
        <option value="Internship">Internship</option>
        <option value="Contract">Contract</option>
        <option value="Freelance">Freelance</option>
      </select>

      <select id="featuredFilter">
        <option value="">All</option>
        <option value="true">Featured</option>
        <option value="false">Not Featured</option>
      </select>

    </div>

    <div id="loading" class="loading">
      Loading careers...
    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Career</th>
            <th>Company</th>
            <th>Location</th>
            <th>Type</th>
            <th>Status</th>
            <th>Featured</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="careerList"></tbody>

      </table>

    </div>

  </section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "careerForm"
  );

const careerList =
  document.getElementById(
    "careerList"
  );

const loading =
  document.getElementById(
    "loading"
  );

const message =
  document.getElementById(
    "message"
  );

const saveBtn =
  document.getElementById(
    "saveBtn"
  );

const clearBtn =
  document.getElementById(
    "clearBtn"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const statusFilter =
  document.getElementById(
    "statusFilter"
  );

const typeFilter =
  document.getElementById(
    "typeFilter"
  );

const featuredFilter =
  document.getElementById(
    "featuredFilter"
  );


let careers = [];


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showMessage(
  text,
  type = "success"
){

  message.textContent = text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

  setTimeout(() => {

    message.style.display =
      "none";

  },4000);

}


function slugify(text){

  return String(text || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");

}


/* =========================
   FORM VALUES
========================= */

function getFormData(){

  return {

    title:
      document.getElementById(
        "title"
      ).value.trim(),

    slug:
      document.getElementById(
        "slug"
      ).value.trim(),

    company:
      document.getElementById(
        "company"
      ).value.trim(),

    location:
      document.getElementById(
        "location"
      ).value.trim(),

    type:
      document.getElementById(
        "type"
      ).value,

    salary:
      document.getElementById(
        "salary"
      ).value.trim(),

    requirements:
      document.getElementById(
        "requirements"
      ).value.trim(),

    skills:
      document.getElementById(
        "skills"
      ).value.trim(),

    description:
      document.getElementById(
        "description"
      ).value.trim(),

    applicationUrl:
      document.getElementById(
        "applicationUrl"
      ).value.trim(),

    imageUrl:
      document.getElementById(
        "imageUrl"
      ).value.trim(),

    status:
      document.getElementById(
        "status"
      ).value,

    featured:
      document.getElementById(
        "featured"
      ).value === "true"

  };

}


/* =========================
   LOAD CAREERS
========================= */

async function loadCareers(){

  loading.style.display =
    "block";

  try{

    const snapshot =
      await getDocs(
        collection(db,"careers")
      );

    careers = [];

    snapshot.forEach(
      item => {

        careers.push({

          id:item.id,
          ...item.data()

        });

      }
    );

    updateStats();

    renderCareers();

  }catch(error){

    console.error(error);

    showMessage(
      "Failed to load careers: " +
      error.message,
      "error"
    );

  }finally{

    loading.style.display =
      "none";

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  const total =
    careers.length;

  const published =
    careers.filter(
      item =>
        item.status ===
        "published"
    ).length;

  const drafts =
    careers.filter(
      item =>
        item.status !==
        "published"
    ).length;

  const featured =
    careers.filter(
      item =>
        item.featured === true
    ).length;

  document.getElementById(
    "totalCount"
  ).textContent = total;

  document.getElementById(
    "publishedCount"
  ).textContent = published;

  document.getElementById(
    "draftCount"
  ).textContent = drafts;

  document.getElementById(
    "featuredCount"
  ).textContent = featured;

}


/* =========================
   RENDER
========================= */

function renderCareers(){

  const search =
    searchInput.value
      .toLowerCase()
      .trim();

  const status =
    statusFilter.value;

  const type =
    typeFilter.value;

  const featured =
    featuredFilter.value;

  const filtered =
    careers.filter(item => {

      const searchable = [

        item.title,
        item.company,
        item.location,
        item.type,
        item.skills,
        item.description

      ]
      .join(" ")
      .toLowerCase();

      if(
        search &&
        !searchable.includes(search)
      ){
        return false;
      }

      if(
        status &&
        item.status !== status
      ){
        return false;
      }

      if(
        type &&
        item.type !== type
      ){
        return false;
      }

      if(
        featured &&
        String(
          item.featured === true
        ) !== featured
      ){
        return false;
      }

      return true;

    });


  careerList.innerHTML = "";


  if(!filtered.length){

    careerList.innerHTML = `
      <tr>
        <td colspan="7"
            style="text-align:center;padding:30px">
          No careers found.
        </td>
      </tr>
    `;

    return;

  }


  filtered.forEach(item => {

    const row =
      document.createElement("tr");

    row.innerHTML = `

      <td>

        ${
          item.imageUrl
          ? `
            <img
              class="career-img"
              src="${escapeHtml(
                item.imageUrl
              )}"
              alt=""
            >
          `
          : "💼"
        }

        <strong>
          ${escapeHtml(
            item.title ||
            "Untitled Career"
          )}
        </strong>

      </td>

      <td>
        ${escapeHtml(
          item.company ||
          "-"
        )}
      </td>

      <td>
        ${escapeHtml(
          item.location ||
          "-"
        )}
      </td>

      <td>
        ${escapeHtml(
          item.type ||
          "-"
        )}
      </td>

      <td>

        <span class="badge ${
          item.status ===
          "published"
          ? "published"
          : "draft"
        }">

          ${escapeHtml(
            item.status ||
            "draft"
          )}

        </span>

      </td>

      <td>

        ${
          item.featured === true
          ? `
            <span class="badge featured">
              ⭐ Featured
            </span>
          `
          : "-"
        }

      </td>

      <td>

        <div class="actions">

          <button
            class="edit"
            data-action="edit"
            data-id="${item.id}"
          >
            ✏ Edit
          </button>

          <button
            class="toggle"
            data-action="toggle"
            data-id="${item.id}"
          >
            ${
              item.status ===
              "published"
              ? "Unpublish"
              : "Publish"
            }
          </button>

          <button
            class="feature"
            data-action="feature"
            data-id="${item.id}"
          >
            ${
              item.featured === true
              ? "Remove Featured"
              : "Feature"
            }
          </button>

          <button
            class="delete"
            data-action="delete"
            data-id="${item.id}"
          >
            🗑 Delete
          </button>

        </div>

      </td>

    `;

    careerList.appendChild(row);

  });

}


/* =========================
   SAVE
========================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    saveBtn.disabled = true;

    saveBtn.textContent =
      "Saving...";

    try{

      const id =
        document.getElementById(
          "careerId"
        ).value;

      const data =
        getFormData();

      if(!data.slug){

        data.slug =
          slugify(data.title);

      }


      if(id){

        await updateDoc(
          doc(
            db,
            "careers",
            id
          ),
          {

            ...data,

            updatedAt:
              serverTimestamp(),

            ...(data.status ===
              "published"
              ? {
                  publishedAt:
                    serverTimestamp()
                }
              : {})

          }
        );

        showMessage(
          "Career updated successfully."
        );

      }else{

        await addDoc(
          collection(
            db,
            "careers"
          ),
          {

            ...data,

            views:0,

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp(),

            publishedAt:
              data.status ===
              "published"
              ? serverTimestamp()
              : null

          }
        );

        showMessage(
          "Career created successfully."
        );

      }

      clearForm();

      await loadCareers();

    }catch(error){

      console.error(error);

      showMessage(
        "Save failed: " +
        error.message,
        "error"
      );

    }finally{

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "Save Career";

    }

  }
);


/* =========================
   EDIT / ACTIONS
========================= */

careerList.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "button"
      );

    if(!button) return;

    const id =
      button.dataset.id;

    const action =
      button.dataset.action;

    const item =
      careers.find(
        career =>
          career.id === id
      );

    if(!item) return;


    if(action === "edit"){

      editCareer(item);

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

      return;

    }


    if(action === "toggle"){

      const newStatus =
        item.status ===
        "published"
        ? "draft"
        : "published";

      try{

        await updateDoc(
          doc(          db,
          "careers",
          id
        ),
        {
          title: titleInput.value.trim(),
          slug: slugInput.value.trim(),
          description: descriptionInput.value.trim(),
          company: companyInput.value.trim(),
          location: locationInput.value.trim(),
          type: typeInput.value,
          salary: salaryInput.value.trim(),
          requirements: requirementsInput.value.trim(),
          skills: skillsInput.value.trim(),
          applicationUrl: applicationUrlInput.value.trim(),
          status: statusInput.value,
          featured: featuredInput.checked,
          updatedAt: serverTimestamp()
        }
      );

      showToast(
        "Career updated successfully.",
        "success"
      );

      closeModal();

      await loadCareers();

    }catch(error){

      console.error(
        "Update career error:",
        error
      );

      showToast(
        "Failed to update career.",
        "error"
      );

    }finally{

      saveBtn.disabled = false;

      saveBtn.textContent =
        "Save Career";

    }

  }


  /* =========================
     DELETE CAREER
  ========================= */

  async function deleteCareer(id){

    const career =
      careers.find(
        item => item.id === id
      );

    if(!career) return;

    const confirmed =
      confirm(
        `Delete "${career.title}"?`
      );

    if(!confirmed) return;

    try{

      await deleteDoc(
        doc(
          db,
          "careers",
          id
        )
      );

      showToast(
        "Career deleted successfully.",
        "success"
      );

      await loadCareers();

    }catch(error){

      console.error(
        "Delete career error:",
        error
      );

      showToast(
        "Failed to delete career.",
        "error"
      );

    }

  }


  /* =========================
     PUBLISH / UNPUBLISH
  ========================= */

  async function togglePublish(
    id,
    currentStatus
  ){

    try{

      const newStatus =
        currentStatus ===
        "published"
          ? "draft"
          : "published";

      const data = {
        status: newStatus,
        updatedAt: serverTimestamp()
      };

      if(
        newStatus ===
        "published"
      ){

        data.publishedAt =
          serverTimestamp();

      }

      await updateDoc(
        doc(
          db,
          "careers",
          id
        ),
        data
      );

      showToast(
        newStatus === "published"
          ? "Career published."
          : "Career unpublished.",
        "success"
      );

      await loadCareers();

    }catch(error){

      console.error(
        "Publish career error:",
        error
      );

      showToast(
        "Unable to update career status.",
        "error"
      );

    }

  }


  /* =========================
     FEATURED
  ========================= */

  async function toggleFeatured(
    id,
    currentFeatured
  ){

    try{

      await updateDoc(
        doc(
          db,
          "careers",
          id
        ),
        {
          featured:
            !currentFeatured,
          updatedAt:
            serverTimestamp()
        }
      );

      showToast(
        !currentFeatured
          ? "Career added to featured."
          : "Career removed from featured.",
        "success"
      );

      await loadCareers();

    }catch(error){

      console.error(
        "Featured error:",
        error
      );

      showToast(
        "Unable to update featured status.",
        "error"
      );

    }

  }


  /* =========================
     RENDER CAREERS
  ========================= */

  function renderCareers(){

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    const status =
      statusFilter.value;

    const type =
      typeFilter.value;

    const filtered =
      careers.filter(
        item => {

          const matchesSearch =
            !search ||
            String(
              item.title || ""
            )
              .toLowerCase()
              .includes(search) ||

            String(
              item.company || ""
            )
              .toLowerCase()
              .includes(search) ||

            String(
              item.location || ""
            )
              .toLowerCase()
              .includes(search);

          const matchesStatus =
            status === "all" ||
            item.status === status;

          const matchesType =
            type === "all" ||
            item.type === type;

          return (
            matchesSearch &&
            matchesStatus &&
            matchesType
          );

        }
      );

    if(
      filtered.length === 0
    ){

      careerList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">
            💼
          </div>

          <h3>
            No careers found
          </h3>

          <p>
            Try another search or add
            a new career opportunity.
          </p>
        </div>
      `;

      return;

    }

    careerList.innerHTML =
      filtered.map(
        item => `

          <article
            class="career-card"
          >

            <div class="career-content">

              <div class="career-top">

                <div>

                  <h3>
                    ${escapeHtml(
                      item.title ||
                      "Untitled Career"
                    )}
                  </h3>

                  <p class="company">
                    🏢
                    ${escapeHtml(
                      item.company ||
                      "Company not specified"
                    )}
                  </p>

                </div>

                ${
                  item.featured
                    ? `
                      <span class="featured">
                        ⭐ Featured
                      </span>
                    `
                    : ""
                }

              </div>

              <div class="career-meta">

                ${
                  item.location
                    ? `
                      <span>
                        📍
                        ${escapeHtml(
                          item.location
                        )}
                      </span>
                    `
                    : ""
                }

                ${
                  item.type
                    ? `
                      <span>
                        💼
                        ${escapeHtml(
                          item.type
                        )}
                      </span>
                    `
                    : ""
                }

                ${
                  item.salary
                    ? `
                      <span>
                        💰
                        ${escapeHtml(
                          item.salary
                        )}
                      </span>
                    `
                    : ""
                }

              </div>

              <p class="description">
                ${escapeHtml(
                  item.description ||
                  "No description available."
                )}
              </p>

              <div class="career-footer">

                <span
                  class="status
                  ${
                    item.status ===
                    "published"
                      ? "published"
                      : "draft"
                  }"
                >
                  ${
                    item.status ===
                    "published"
                      ? "Published"
                      : "Draft"
                  }
                </span>

                <div class="actions">

                  <button
                    class="btn btn-edit"
                    onclick="editCareer('${item.id}')"
                  >
                    ✏️ Edit
                  </button>

                  <button
                    class="btn btn-publish"
                    onclick="togglePublish(
                      '${item.id}',
                      '${item.status || "draft"}'
                    )"
                  >
                    ${
                      item.status ===
                      "published"
                        ? "Unpublish"
                        : "Publish"
                    }
                  </button>

                  <button
                    class="btn btn-feature"
                    onclick="toggleFeatured(
                      '${item.id}',
                      ${item.featured === true}
                    )"
                  >
                    ${
                      item.featured
                        ? "Remove Featured"
                        : "⭐ Feature"
                    }
                  </button>

                  <button
                    class="btn btn-delete"
                    onclick="deleteCareer('${item.id}')"
                  >
                    🗑️ Delete
                  </button>

                </div>

              </div>

            </div>

          </article>

        `
      ).join("");

  }


  /* =========================
     LOAD CAREERS
  ========================= */

  async function loadCareers(){

    careerList.innerHTML = `
      <div class="loading">
        Loading careers...
      </div>
    `;

    try{

      const snapshot =
        await getDocs(
          collection(
            db,
            "careers"
          )
        );

      careers =
        snapshot.docs.map(
          item => ({
            id: item.id,
            ...item.data()
          })
        );

      careers.sort(
        (a,b) => {

          const aTime =
            getTimestamp(
              a.updatedAt ||
              a.createdAt
            );

          const bTime =
            getTimestamp(
              b.updatedAt ||
              b.createdAt
            );

          return bTime - aTime;

        }
      );

      updateStats();

      renderCareers();

    }catch(error){

      console.error(
        "Load careers error:",
        error
      );

      careerList.innerHTML = `
        <div class="error-state">
          <h3>
            Unable to load careers
          </h3>

          <p>
            Please check your Firebase
            connection and Firestore rules.
          </p>

          <button
            class="btn btn-primary"
            onclick="loadCareers()"
          >
            Try Again
          </button>
        </div>
      `;

    }

  }


  /* =========================
     STATISTICS
  ========================= */

  function updateStats(){

    const total =
      careers.length;

    const published =
      careers.filter(
        item =>
          item.status ===
          "published"
      ).length;

    const drafts =
      careers.filter(
        item =>
          item.status !==
          "published"
      ).length;

    const featured =
      careers.filter(
        item =>
          item.featured === true
      ).length;

    if(totalEl)
      totalEl.textContent =
        formatNumber(total);

    if(publishedEl)
      publishedEl.textContent =
        formatNumber(published);

    if(draftsEl)
      draftsEl.textContent =
        formatNumber(drafts);

    if(featuredEl)
      featuredEl.textContent =
        formatNumber(featured);

  }


  /* =========================
     SEARCH / FILTERS
  ========================= */

  searchInput.addEventListener(
    "input",
    renderCareers
  );

  statusFilter.addEventListener(
    "change",
    renderCareers
  );

  typeFilter.addEventListener(
    "change",
    renderCareers
  );


  /* =========================
     ADD CAREER
  ========================= */

  addBtn.addEventListener(
    "click",
    () => {

      editingId = null;

      form.reset();

      modalTitle.textContent =
        "Add Career";

      saveBtn.textContent =
        "Save Career";

      modal.classList.add(
        "show"
      );

    }
  );


  /* =========================
     CLOSE MODAL
  ========================= */

  closeBtn.addEventListener(
    "click",
    closeModal
  );

  cancelBtn.addEventListener(
    "click",
    closeModal
  );

  function closeModal(){

    modal.classList.remove(
      "show"
    );

    editingId = null;

  }


  /* =========================
     ESCAPE MODAL
  ========================= */

  document.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Escape"
      ){

        closeModal();

      }

    }
  );


  /* =========================
     INITIAL LOAD
  ========================= */

  loadCareers();

});

</script>

</body>
</html>
