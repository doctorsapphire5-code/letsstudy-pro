<style>
*{
  box-sizing:border-box;
}

body{

}

header{

.header-inner{

.logo{

.back{

.hero{

.btn{

.btn-primary{

.btn-danger{

.stat{

.stat-label{

.filters{

.table-wrap{

table{

th,

.company{

.company-name{

.muted{

.badge-published{

.badge-draft{

}

.badge-featured{
  background:#ede9fe;

}

.badge-normal{

}

.actions{

}

.action-btn{

.edit{

<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
  initializeApp(
    firebaseConfig
  );

const db =
  getFirestore(app);


/* =====================================================
   COLLECTION
===================================================== */

const careersRef =
  collection(
    db,
    "careers"
  );


/* =====================================================
   STATE
===================================================== */

let careers = [];

let editingId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "careerForm"
  );

const modal =
  document.getElementById(
    "careerModal"
  );

const table =
  document.getElementById(
    "careerTable"
  );

const loading =
  document.getElementById(
    "loading"
  );

const message =
  document.getElementById(
    "message"
  );


/* =====================================================
   HELPERS
===================================================== */

function $(id){

  return document.getElementById(
    id
  );

}


function slugify(value){

  return String(
    value || ""
  )
  .toLowerCase()
  .trim()
  .replace(
    /[^a-z0-9\s-]/g,
    ""
  )
  .replace(
    /\s+/g,
    "-"
  )
  .replace(
    /-+/g,
    "-"
  );

}


function toArray(value){

  if(
    Array.isArray(value)
  ){

    return value
      .map(
        item =>
          String(item).trim()
      )
      .filter(Boolean);

  }

  return String(
    value || ""
  )
  .split("\n")
  .map(
    item =>
      item.trim()
  )
  .filter(Boolean);

}


function toText(value){

  if(
    !Array.isArray(value)
  ){

    return "";

  }

  return value.join(
    "\n"
  );

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function showMessage(
  text,
  type = "success"
){

  message.textContent =
    text;

  message.className =
    "message show " +
    type;

  setTimeout(
    () => {

      message.className =
        "message";

    },
    4000
  );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value){

    return "—";

  }

  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value
        .toDate()
        .toLocaleDateString();

    }

    return new Date(
      value
    ).toLocaleDateString();

  }catch(error){

    return "—";

  }

}


/* =====================================================
   LOAD CAREERS
===================================================== */

async function loadCareers(){

  loading.style.display =
    "block";

  try{

    const snapshot =
      await getDocs(
        careersRef
      );

    careers =
      snapshot.docs.map(
        item => ({

          id:
            item.id,

          ...item.data()

        })
      );

    renderFilters();

    renderCareers();

    updateStats();

  }catch(error){

    console.error(
      "Load careers error:",
      error
    );

    showMessage(
      "Failed to load careers: " +
      error.message,
      "error"
    );

  }finally{

    loading.style.display =
      "none";

  }

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

  const total =
    careers.length;


  const published =
    careers.filter(
      career =>
        career.status ===
        "published"
    ).length;


  const drafts =
    careers.filter(
      career =>
        career.status ===
        "draft"
    ).length;


  const featured =
    careers.filter(
      career =>
        career.featured ===
        true
    ).length;


  const applications =
    careers.reduce(
      (
        total,
        career
      ) => {

        return total +
          Number(
            career.applications ||
            0
          );

      },
      0
    );


  $("totalCount")
    .textContent =
    total;


  $("publishedCount")
    .textContent =
    published;


  $("draftCount")
    .textContent =
    drafts;


  $("featuredCount")
    .textContent =
    featured;


  $("applicationsCount")
    .textContent =
    applications;

}


/* =====================================================
   FILTER OPTIONS
===================================================== */

function renderFilters(){

  const countries =
    [
      ...new Set(

        careers
          .map(
            career =>
              career.country
          )
          .filter(Boolean)

      )
    ].sort();


  const categories =
    [
      ...new Set(

        careers
          .map(
            career =>
              career.category
          )
          .filter(Boolean)

      )
    ].sort();


  const countryFilter =
    $("countryFilter");


  const categoryFilter =
    $("categoryFilter");


  const selectedCountry =
    countryFilter.value;


  const selectedCategory =
    categoryFilter.value;


  countryFilter.innerHTML = `

    <option value="">
      All Countries
    </option>

    ${countries.map(
      country => `

        <option value="${escapeHtml(
          country
        )}">

          ${escapeHtml(
            country
          )}

        </option>

      `
    ).join("")}

  `;


  categoryFilter.innerHTML = `

    <option value="">
      All Categories
    </option>

    ${categories.map(
      category => `

        <option value="${escapeHtml(
          category
        )}">

          ${escapeHtml(
            category
          )}

        </option>

      `
    ).join("")}

  `;


  countryFilter.value =
    selectedCountry;


  categoryFilter.value =
    selectedCategory;

}


/* =====================================================
   FILTER CAREERS
===================================================== */

function getFilteredCareers(){

  const search =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const status =
    $("statusFilter")
      .value;


  const country =
    $("countryFilter")
      .value;


  const category =
    $("categoryFilter")
      .value;


  return careers.filter(
    career => {

      const searchable = [

        career.title,

        career.slug,

        career.company,

        career.location,

        career.country,

        career.category,

        career.industry,

        career.experienceLevel,

        career.educationLevel,

        ...(Array.isArray(
          career.skills
        )
          ? career.skills
          : [])

      ]
      .join(" ")
      .toLowerCase();


      return (

        (
          !search ||
          searchable.includes(
            search
          )
        )

        &&

        (
          !status ||
          career.status ===
          status
        )

        &&

        (
          !country ||
          career.country ===
          country
        )

        &&

        (
          !category ||
          career.category ===
          category
        )

      );

    }
  );

}


/* =====================================================
   RENDER CAREERS
===================================================== */

  const filtered =

    table.innerHTML = `

      <tr>

        <td
          colspan="10"
          class="empty"
        >

          No careers found.

        </td>

      </tr>

    `;

    return;

  }


  table.innerHTML =
    filtered.map(
      career => {

        const logo =
          career.companyLogo
            ? `

              <img
                src="${escapeHtml(
                  career.companyLogo
                )}"
                class="company-logo"
                alt=""
              >

            `
            : `

              <div
                class="company-logo"
                style="
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  font-size:20px;
                "
              >
                💼
              </div>

            `;


        return `

          <tr>

            <td>

              <div class="company">

                ${logo}

                <div>

                  <div class="company-name">

                    ${escapeHtml(
                      career.title ||
                      "Untitled Career"
                    )}

                  </div>

                  <div class="muted">

                    ${escapeHtml(
                      career.company ||
                      "No company"
                    )}

                  </div>

                </div>

              </div>

            </td>


            <td>

              ${escapeHtml(
                career.location ||
                "—"
              )}

              <div class="muted">

                ${escapeHtml(
                  career.country ||
                  ""
                )}

              </div>

            </td>


            <td>

              ${escapeHtml(
                career.employmentType ||
                "—"
              )}

              <div class="muted">

                ${escapeHtml(
                  career.workMode ||
                  ""
                )}

              </div>

            </td>


            <td>

              ${escapeHtml(
                career.experienceLevel ||
                "—"
              )}

            </td>


            <td>

              ${formatDate(
                career.deadline
              )}

            </td>


            <td>

              ${
                career.status ===
                "published"

                  ? `

                    <span
                      class="badge badge-published"
                    >
                      Published
                    </span>

                  `

                  : `

                    <span
                      class="badge badge-draft"
                    >
                      Draft
                    </span>

                  `
              }

            </td>


            <td>

              ${
                career.featured ===
                true

                  ? `

                    <span
                      class="badge badge-featured"
                    >
                      Featured
                    </span>

                  `

                  : `

                    <span
                      class="badge badge-normal"
                    >
                      No
                    </span>

                  `
              }

            </td>


            <td>

              ${Number(
                career.views ||
                0
              ).toLocaleString()}

            </td>


            <td>

              ${Number(
                career.applications ||
                0
              ).toLocaleString()}

            </td>


            <td>

              <div class="actions">

                <button
                  class="action-btn edit"
                  data-action="edit"
                  data-id="${career.id}"
                >
                  Edit
                </button>


                <button
                  class="action-btn feature"
                  data-action="feature"
                  data-id="${career.id}"
                >

                  ${
                    career.featured
                      ? "Unfeature"
                      : "Feature"
                  }

                </button>


                <button
                  class="action-btn delete"
                  data-action="delete"
                  data-id="${career.id}"
                >
                  Delete
                </button>

              </div>

            </td>

          </tr>

        `;

      }
    ).join("");

}


/* =====================================================

===================================================== */

function openModal(){

}


/* =====================================================

===================================================== */

function closeModal(){

  modal.classList.remove(

  resetForm();

}

===================================================== */

function resetForm(){

  editingId =

  $("careerId")

  $("modalTitle")

    "Add Career";


  $("saveBtn")

/* =====================================================
   EDIT CAREER
===================================================== */

async function editCareer(id){

  try{

    const careerRef =
      doc(
        db,
        "careers",
        id
      );


    const snapshot =
      await getDoc(
        careerRef
      );


    if(!snapshot.exists()){

      showMessage(
        "Career not found.",
        "error"
      );

      return;

    }


    const data =
      snapshot.data();


    editingId =
      id;


    $("careerId").value =
      id;


    $("title").value =
      data.title || "";


    $("slug").value =
      data.slug || "";


    $("shortDescription").value =
      data.shortDescription ||
      "";


    $("description").value =
      data.description ||
      "";


    $("company").value =
      data.company || "";


    $("companyLogo").value =
      data.companyLogo ||
      "";


    $("location").value =
      data.location || "";


    $("country").value =
      data.country || "";


    $("employmentType").value =
      data.employmentType ||
      "";


    $("workMode").value =
      data.workMode || "";


    $("salary").value =
      data.salary || "";


    $("currency").value =
      data.currency ||
      "TZS";


    $("category").value =
      data.category || "";


    $("industry").value =
      data.industry || "";


    $("experienceLevel").value =
      data.experienceLevel ||
      "";


    $("educationLevel").value =
      data.educationLevel ||
      "";


    $("skills").value =
      toText(
        data.skills
      );


    $("requirements").value =
      toText(
        data.requirements
      );


    $("responsibilities").value =
      toText(
        data.responsibilities
      );


    $("benefits").value =
      toText(
        data.benefits
      );


    $("applicationUrl").value =
      data.applicationUrl ||
      "";


    $("deadline").value =
      data.deadline ||
      "";


    $("status").value =
      data.status ||
      "draft";


    $("featured").value =
      data.featured === true
        ? "true"
        : "false";


    $("modalTitle")
      .textContent =
      "Edit Career";


    $("saveBtn")
      .textContent =
      "Update Career";


    openModal();

  }catch(error){

    console.error(
      error
    );

    showMessage(
      "Unable to load career.",
      "error"
    );

  }

}


/* =====================================================
   DELETE CAREER
===================================================== */

async function deleteCareer(id){

  const career =
    careers.find(
      item =>
        item.id === id
    );


  if(!career){

    return;

  }


  const confirmed =
    confirm(
      `Delete "${career.title || "this career"}"?`
    );


  if(!confirmed){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "careers",
        id
      )
    );


    showMessage(
      "Career deleted successfully."
    );


    await loadCareers();

  }catch(error){

    console.error(
      error
    );

    showMessage(
      "Delete failed: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   FEATURE / UNFEATURE
===================================================== */

async function toggleFeatured(id){

  const career =
    careers.find(
      item =>
        item.id === id
    );


  if(!career){

    return;

  }


  try{

    await updateDoc(

      doc(
        db,
        "careers",
        id
      ),

      {

        featured:
          career.featured !==
          true,

        updatedAt:
          serverTimestamp()

      }

    );


    showMessage(
      career.featured === true
        ? "Career unfeatured."
        : "Career featured."
    );


    await loadCareers();

  }catch(error){

    console.error(
      error
    );

    showMessage(
      "Unable to update career.",
      "error"
    );

  }

}


/* =====================================================
   TABLE ACTIONS
===================================================== */

table.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if(!button){

      return;

    }


    const id =
      button.dataset.id;


    const action =
      button.dataset.action;


    if(
      action ===
      "edit"
    ){

      editCareer(
        id
      );

    }


    if(
      action ===
      "delete"
    ){

      deleteCareer(
        id
      );

    }


    if(
      action ===
      "feature"
    ){

      toggleFeatured(
        id
      );

    }

  }
);

   SAVE / UPDATE CAREER
===================================================== */

form.addEventListener(

    event.preventDefault();


    const title =

      );

    }


    const status =

        .value;


    const careerData = {

      slug:
        $("slug")
          .value
          .trim() ||
        slugify(
          title
        ),

      shortDescription:
        $("shortDescription")
          .value
          .trim(),

          .trim(),

      location:
        $("location")
          .value
          .trim(),

      country:
        $("country")
          .value
          .trim(),

      employmentType:
        $("employmentType")
          .value,

      workMode:
        $("workMode")
          .value,

      salary:

          .value
          .trim(),

          .value,

          .value

    };


    const saveBtn =

    saveBtn.disabled =

      editingId
        ? "Updating..."
        : "Saving...";


    try{

      if(editingId){

        const existing =
          careers.find(
            item =>
              item.id ===
              editingId
          );


        await updateDoc(

          doc(
            db,
            "careers",
            editingId
          ),

          careerData

        );


        if(
          status ===
          "published" &&
          existing?.status !==
          "published"
        ){

          await updateDoc(

  doc(
    db,
    "careers",
    editingId
  ),

  careerData

);


if(
  status === "published" &&

){

    doc(
      db,
      "careers",
      editingId
    ),

}


showMessage(

);


} else {

      createdBy:

          : null

  showMessage(

  );

closeModal();

await loadCareers();


}catch(error){

  );

  );


}finally{

  saveBtn.disabled =

}

});
