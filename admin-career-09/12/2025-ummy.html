<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Careers | LetsStudy Pro</title>
<meta name="description" content="Manage career opportunities on LetsStudy Pro.">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f6fb;color:#172033}
.topbar{background:#101d3a;color:#fff;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:20px}
.topbar p{font-size:12px;color:#cbd5e1;margin-top:5px}
button{border:0;padding:10px 14px;border-radius:7px;cursor:pointer;font-weight:600}
.primary{background:#2457d6;color:#fff}
.danger{background:#dc3545;color:#fff}
.secondary{background:#e8edf7;color:#172033}
.success{background:#198754;color:#fff}
.warning{background:#f2b705;color:#172033}
.container{max-width:1250px;margin:25px auto;padding:0 15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.stat{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 12px #00000008}
.stat p{color:#68758b;font-size:13px}
.stat h2{font-size:27px;margin-top:9px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d8deea;border-radius:7px;font-size:14px;background:#fff}
.toolbar input{flex:1;min-width:180px}
.toolbar select{width:auto;min-width:140px}
.table-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #00000008}
.table-head{padding:17px;border-bottom:1px solid #edf0f5}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{text-align:left;padding:13px;border-bottom:1px solid #edf0f5;font-size:13px}
th{background:#f8faff;color:#536078}
td strong{font-size:14px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{padding:7px 9px;font-size:12px}
.status{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold;display:inline-block}
.published{background:#d9f7e7;color:#137342}
.draft{background:#fff0d2;color:#946200}
.featured{background:#e6eaff;color:#294db3}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:1000;padding:15px;overflow-y:auto}
.modal-box{background:#fff;max-width:760px;margin:25px auto;border-radius:12px;padding:22px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}
.modal-header h2{font-size:20px}
.close{background:#edf0f5;font-size:20px;padding:5px 12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
.full{grid-column:1/-1}
.checks{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0}
.checks label{display:flex;gap:7px;align-items:center;font-size:13px}
.checks input{width:auto}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:15px}
#message{display:none;padding:12px;border-radius:7px;margin-bottom:15px;font-size:13px}
#connectionStatus{font-size:12px;color:#cbd5e1}
.empty{text-align:center;padding:35px;color:#758198}
.preview img{width:100%;max-height:230px;object-fit:cover;border-radius:8px;margin-bottom:15px}
.preview h2{margin:10px 0}
.preview p{line-height:1.6;margin:8px 0;color:#4c5870}
@media(max-width:700px){
.stats{grid-template-columns:repeat(2,1fr)}
.form-grid{grid-template-columns:1fr}
.full{grid-column:auto}
.topbar{align-items:flex-start}
}
</style>
</head>

<body>

<header class="topbar">
<div>
<h2>LetsStudy Pro | Admin Careers</h2>
<p>Manage career opportunities and job listings</p>
</div>
<div>
<span id="connectionStatus">Connecting to Firebase...</span>
</div>
</header>

<main id="adminApp" style="display:block"><h1>Admin Careers</h1>
<div class="container">

<div id="message"></div>

<section class="stats">
<div class="stat"><p>Total Careers</p><h2 id="totalCount">0</h2></div>
<div class="stat"><p>Published</p><h2 id="publishedCount">0</h2></div>
<div class="stat"><p>Drafts</p><h2 id="draftCount">0</h2></div>
<div class="stat"><p>Featured</p><h2 id="featuredCount">0</h2></div>
</section>

<div class="toolbar">
<input id="searchInput" placeholder="Search career title, company or location...">
<select id="statusFilter">
<option value="all">All Status</option>
<option value="published">Published</option>
<option value="draft">Drafts</option>
</select>
<select id="typeFilter">
<option value="all">All Types</option>
<option value="Full-time">Full-time</option>
<option value="Part-time">Part-time</option>
<option value="Internship">Internship</option>
<option value="Remote">Remote</option>
<option value="Contract">Contract</option>
</select>
<button class="primary" id="addCareerBtn">+ Add Career</button>
</div>

<div class="table-card">
<div class="table-head"><strong>Career Opportunities</strong></div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Career</th>
<th>Company</th>
<th>Location</th>
<th>Type</th>
<th>Status</th>
<th>Featured</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="careerTable">
<tr><td colspan="7" class="empty">Loading careers...</td></tr>
</tbody>
</table>
</div>
</div>

</div>
</main>

<!-- ADD / EDIT MODAL -->
<div class="modal" id="careerModal">
<div class="modal-box">
<div class="modal-header">
<h2 id="modalTitle">Add Career</h2>
<button class="close" type="button" onclick="closeModal('careerModal')">×</button>
</div>

<form id="careerForm">
<div class="form-grid">

<div class="field">
<label>Career Title *</label>
<input id="title" required="" placeholder="e.g. Software Developer">
</div>

<div class="field">
<label>Company *</label>
<input id="company" required="" placeholder="Company name">
</div>

<div class="field">
<label>Location *</label>
<input id="location" required="" placeholder="e.g. Remote / Tanzania">
</div>

<div class="field">
<label>Career Type *</label>
<select id="type" required="">
<option value="Full-time">Full-time</option>
<option value="Part-time">Part-time</option>
<option value="Internship">Internship</option>
<option value="Remote">Remote</option>
<option value="Contract">Contract</option>
<option value="Temporary">Temporary</option>
</select>
</div>

<div class="field">
<label>Category</label>
<input id="category" placeholder="e.g. Technology">
</div>

<div class="field">
<label>Career Level</label>
<select id="level">
<option value="Entry Level">Entry Level</option>
<option value="Junior">Junior</option>
<option value="Mid Level">Mid Level</option>
<option value="Senior">Senior</option>
<option value="Manager">Manager</option>
<option value="Executive">Executive</option>
</select>
</div>

<div class="field">
<label>Salary</label>
<input id="salary" placeholder="e.g. Negotiable">
</div>

<div class="field">
<label>Application Deadline</label>
<input id="deadline" type="date">
</div>

<div class="field full">
<label>Image URL</label>
<input id="image" type="url" placeholder="https://example.com/image.jpg">
</div>

<div class="field full">
<label>Description *</label>
<textarea id="description" rows="5" required="" placeholder="Describe this career opportunity..."></textarea>
</div>

<div class="field full">
<label>Requirements</label>
<textarea id="requirements" rows="4" placeholder="Enter qualifications and requirements..."></textarea>
</div>

<div class="field full">
<label>Benefits</label>
<textarea id="benefits" rows="3" placeholder="Enter benefits..."></textarea>
</div>

<div class="field full">
<label>Application Link</label>
<input id="applyLink" type="url" placeholder="https://example.com/apply">
</div>

</div>

<div class="checks">
<label><input type="checkbox" id="published"> Published</label>
<label><input type="checkbox" id="featured"> Featured</label>
</div>

<div class="form-actions">
<button type="button" class="secondary" onclick="closeModal('careerModal')">Cancel</button>
<button type="submit" class="primary" id="saveBtn">Save Career</button>
</div>
</form>
</div>
</div>

<!-- PREVIEW MODAL -->
<div class="modal" id="previewModal">
<div class="modal-box">
<div class="modal-header">
<h2>Career Preview</h2>
<button class="close" onclick="closeModal('previewModal')">×</button>
</div>
<div id="previewContent" class="preview"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
doc,
updateDoc,
deleteDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
authDomain: "let-s-study-pro-course.firebaseapp.com",
databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId: "let-s-study-pro-course",
storageBucket: "let-s-study-pro-course.firebasestorage.app",
messagingSenderId: "474928293390",
appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const careersRef = collection(db, "careers");

const $ = id => document.getElementById(id);

let careers = [];
let editingId = null;

function escapeHTML(value = "") {
return String(value).replace(/[&<>"']/g, char => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
})[char]);
}

function safeURL(value) {
try {
const url = new URL(value);
return ["http:", "https:"].includes(url.protocol) ? url.href : "";
} catch {
return "";
}
}

function showMessage(message, type = "success") {
const box = $("message");
box.textContent = message;
box.style.display = "block";
box.style.background = type === "success" ? "#d9f7e7" : "#ffe0e0";
box.style.color = type === "success" ? "#137342" : "#a51d2d";
window.scrollTo({top:0, behavior:"smooth"});
setTimeout(() => box.style.display = "none", 4500);
}

window.closeModal = function(id) {
$(id).style.display = "none";
};

function openModal(id) {
$(id).style.display = "block";
}

function isPublished(career) {
return career.published === true || career.status === "published";
}

function updateStats() {
$("totalCount").textContent = careers.length;
$("publishedCount").textContent = careers.filter(isPublished).length;
$("draftCount").textContent = careers.filter(c => !isPublished(c)).length;
$("featuredCount").textContent = careers.filter(c => c.featured === true).length;
}

async function loadCareers() {
$("connectionStatus").textContent = "Loading...";

try {
const snapshot = await getDocs(careersRef);
careers = snapshot.docs.map(item => ({
id: item.id,
...item.data()
}));

updateStats();
renderCareers();

$("connectionStatus").textContent = "Firebase Connected";
} catch (error) {
console.error(error);
$("connectionStatus").textContent = "Connection Error";
$("careerTable").innerHTML =
'<tr><td colspan="7" class="empty">Unable to load careers. Check your Firestore Security Rules and connection.</td></tr>';
showMessage(error.message, "error");
}
}

function renderCareers() {
const search = $("searchInput").value.toLowerCase().trim();
const status = $("statusFilter").value;
const type = $("typeFilter").value;

let filtered = careers.filter(career => {
const matchesSearch = [
career.title,
career.company,
career.location,
career.category
].some(value => String(value || "").toLowerCase().includes(search));

const matchesStatus =
status === "all" ||
(status === "published" && isPublished(career)) ||
(status === "draft" && !isPublished(career));

const matchesType = type === "all" || career.type === type;

return matchesSearch && matchesStatus && matchesType;
});

if (!filtered.length) {
$("careerTable").innerHTML =
'<tr><td colspan="7" class="empty">No careers found.</td></tr>';
return;
}

$("careerTable").innerHTML = filtered.map(career => `
<tr>
<td><strong>${escapeHTML(career.title || "Untitled")}</strong></td>
<td>${escapeHTML(career.company || "-")}</td>
<td>${escapeHTML(career.location || "-")}</td>
<td>${escapeHTML(career.type || "-")}</td>
<td>
<span class="status ${isPublished(career) ? "published" : "draft"}">
${isPublished(career) ? "Published" : "Draft"}
</span>
</td>
<td>
${career.featured === true
? '<span class="status featured">Featured</span>'
: "—"}
</td>
<td>
<div class="actions">
<button class="secondary" data-action="preview" data-id="${escapeHTML(career.id)}">View</button>
<button class="primary" data-action="edit" data-id="${escapeHTML(career.id)}">Edit</button>
<button class="warning" data-action="toggle" data-id="${escapeHTML(career.id)}">${isPublished(career) ? "Unpublish" : "Publish"}</button>
<button class="danger" data-action="delete" data-id="${escapeHTML(career.id)}">Delete</button>
</div>
</td>
</tr>
`).join("");
}

function resetForm() {
$("careerForm").reset();
editingId = null;
$("modalTitle").textContent = "Add Career";
$("saveBtn").textContent = "Save Career";
}

function editCareer(id) {
const career = careers.find(item => item.id === id);
if (!career) return;

editingId = id;

$("modalTitle").textContent = "Edit Career";
$("title").value = career.title || "";
$("company").value = career.company || "";
$("location").value = career.location || "";
$("type").value = career.type || "Full-time";
$("category").value = career.category || "";
$("level").value = career.level || "Entry Level";
$("salary").value = career.salary || "";
$("deadline").value = career.deadline || "";
$("image").value = career.image || career.imageUrl || "";
$("description").value = career.description || "";
$("requirements").value = career.requirements || "";
$("benefits").value = career.benefits || "";
$("applyLink").value = career.applyLink || "";
$("published").checked = isPublished(career);
$("featured").checked = career.featured === true;

$("saveBtn").textContent = "Update Career";
openModal("careerModal");
}

function previewCareer(id) {
const career = careers.find(item => item.id === id);
if (!career) return;

const image = safeURL(career.image || career.imageUrl || "");
const applyLink = safeURL(career.applyLink || "");

$("previewContent").innerHTML = `
${image ? `<img src="${escapeHTML(image)}" alt="Career image">` : ""}
<h2>${escapeHTML(career.title || "Untitled")}</h2>
<p><strong>Company:</strong> ${escapeHTML(career.company || "-")}</p>
<p><strong>Location:</strong> ${escapeHTML(career.location || "-")}</p>
<p><strong>Type:</strong> ${escapeHTML(career.type || "-")}</p>
<p><strong>Category:</strong> ${escapeHTML(career.category || "-")}</p>
<p><strong>Level:</strong> ${escapeHTML(career.level || "-")}</p>
<p><strong>Salary:</strong> ${escapeHTML(career.salary || "Not specified")}</p>
<p><strong>Deadline:</strong> ${escapeHTML(career.deadline || "Not specified")}</p>
<hr style="margin:15px 0;border:0;border-top:1px solid #ddd">
<h3>Description</h3>
<p>${escapeHTML(career.description || "No description").replace(/\n/g, "<br>")}</p>
<h3>Requirements</h3>
<p>${escapeHTML(career.requirements || "Not specified").replace(/\n/g, "<br>")}</p>
<h3>Benefits</h3>
<p>${escapeHTML(career.benefits || "Not specified").replace(/\n/g, "<br>")}</p>
${applyLink ? `<p><a href="${escapeHTML(applyLink)}" target="_blank" rel="noopener">Application Link</a></p>` : ""}
`;

openModal("previewModal");
}

$("addCareerBtn").addEventListener("click", () => {
resetForm();
openModal("careerModal");
});

$("careerForm").addEventListener("submit", async event => {
event.preventDefault();

const saveBtn = $("saveBtn");
saveBtn.disabled = true;
saveBtn.textContent = "Saving...";

const careerData = {
title: $("title").value.trim(),
company: $("company").value.trim(),
location: $("location").value.trim(),
type: $("type").value,
category: $("category").value.trim(),
level: $("level").value,
salary: $("salary").value.trim(),
deadline: $("deadline").value,
image: $("image").value.trim(),
description: $("description").value.trim(),
requirements: $("requirements").value.trim(),
benefits: $("benefits").value.trim(),
applyLink: $("applyLink").value.trim(),
published: $("published").checked,
featured: $("featured").checked,
status: $("published").checked ? "published" : "draft",
updatedAt: serverTimestamp()
};

try {
if (editingId) {
await updateDoc(doc(db, "careers", editingId), careerData);
showMessage("Career updated successfully.");
} else {
careerData.createdAt = serverTimestamp();
await addDoc(careersRef, careerData);
showMessage("Career added successfully.");
}

closeModal("careerModal");
resetForm();
await loadCareers();

} catch (error) {
console.error(error);
showMessage("Save failed: " + error.message, "error");
} finally {
saveBtn.disabled = false;
saveBtn.textContent = editingId ? "Update Career" : "Save Career";
}
});

$("careerTable").addEventListener("click", async event => {
const button = event.target.closest("button[data-action]");
if (!button) return;

const id = button.dataset.id;
const action = button.dataset.action;

if (action === "edit") {
editCareer(id);
return;
}

if (action === "preview") {
previewCareer(id);
return;
}

const career = careers.find(item => item.id === id);
if (!career) return;

try {
if (action === "toggle") {
const newStatus = !isPublished(career);

await updateDoc(doc(db, "careers", id), {
published: newStatus,
status: newStatus ? "published" : "draft",
updatedAt: serverTimestamp()
});

showMessage(newStatus ? "Career published." : "Career unpublished.");
await loadCareers();
}

if (action === "delete") {
if (!confirm(`Delete "${career.title || "this career"}"? This cannot be undone.`)) return;

await deleteDoc(doc(db, "careers", id));
showMessage("Career deleted successfully.");
await loadCareers();
}

} catch (error) {
console.error(error);
showMessage("Action failed: " + error.message, "error");
}
});

$("searchInput").addEventListener("input", renderCareers);
$("statusFilter").addEventListener("change", renderCareers);
$("typeFilter").addEventListener("change", renderCareers);

loadCareers();
</script>



</body></html>
