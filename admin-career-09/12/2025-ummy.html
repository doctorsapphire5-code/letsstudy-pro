<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Careers | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#f5f7fa;
  color:#172033
}

button,input,textarea,select{
  font:inherit
}

button{cursor:pointer}

.header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:20
}

.nav{
  max-width:1200px;
  height:100%;
  margin:auto;
  padding:0 18px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.logo{
  color:#059669;
  font-size:20px;
  font-weight:950;
  text-decoration:none
}

.nav a{
  text-decoration:none;
  background:#ecfdf5;
  color:#047857;
  padding:9px 12px;
  border-radius:8px;
  font-size:10px;
  font-weight:900
}

.container{
  max-width:1200px;
  margin:auto;
  padding:28px 18px 70px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px
}

.top h1{
  margin:0;
  font-size:25px
}

.top p{
  margin:5px 0 0;
  color:#667085;
  font-size:10px
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-size:10px;
  font-weight:950
}

.primary{
  background:#059669;
  color:#fff
}

.secondary{
  background:#ecfdf5;
  color:#047857
}

.danger{
  background:#fef3f2;
  color:#b42318
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:15px
}

.stat{
  background:#fff;
  border:1px solid #e5e9ee;
  border-radius:13px;
  padding:15px
}

.stat strong{
  display:block;
  font-size:22px;
  color:#059669
}

.stat span{
  color:#667085;
  font-size:9px;
  font-weight:800
}

.toolbar{
  background:#fff;
  border:1px solid #e5e9ee;
  border-radius:13px;
  padding:12px;
  display:flex;
  gap:8px;
  margin-bottom:15px
}

.search{
  flex:1;
  border:1px solid #dce1e7;
  border-radius:8px;
  padding:10px;
  outline:none;
  font-size:10px
}

select{
  border:1px solid #dce1e7;
  border-radius:8px;
  padding:10px;
  outline:none;
  font-size:10px;
  background:#fff
}

.table-card{
  background:#fff;
  border:1px solid #e5e9ee;
  border-radius:14px;
  overflow:hidden
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  padding:13px;
  text-align:left;
  border-bottom:1px solid #edf0f2;
  font-size:10px
}

th{
  background:#f8fafc;
  color:#667085;
  font-size:9px;
  font-weight:950
}

td{
  color:#475467
}

.title{
  color:#172033;
  font-weight:950
}

.company{
  color:#059669;
  font-weight:850;

}

.badge{
  display:inline-block;
  padding:5px 7px;
  border-radius:6px;
  background:#f2f4f7;
  color:#475467;
  font-size:8px;
  font-weight:900
}

.published{
  background:#ecfdf3;
  color:#027a48
}

.draft{
  background:#fff7ed;
  color:#c2410c
}

.featured{
  background:#fff7ed;

}

.actions{

  gap:5px
}

.action{
  border:0;
  padding:7px 8px;
  border-radius:6px;
  font-size:8px;
  font-weight:900
}

.empty{
  text-align:center;
  padding:45px;
  color:#667085;
  font-size:10px
}


/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100
}

.modal.show{
  display:flex
}

.modal-box{
  width:100%;
  max-width:750px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
  padding:22px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}

.modal-head h2{
  margin:0;
  font-size:18px
}

.close{
  border:0;
  background:#f2f4f7;
  width:32px;
  height:32px;
  border-radius:8px;
  font-size:18px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.field{
  margin-bottom:3px
}

.full{
  grid-column:1/-1
}

label{
  display:block;
  margin-bottom:5px;
  font-size:9px;
  font-weight:950;
  color:#475467
}

input,
textarea,
select{
  width:100%;
  border:1px solid #dce1e7;
  border-radius:8px;
  padding:10px;
  outline:none;
  font-size:10px
}

textarea{
  min-height:90px;
  resize:vertical
}

.check{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:8px
}

.check input{
  width:auto
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px
}

.loading{
  text-align:center;
  padding:45px;
  color:#667085;
  font-size:10px
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#172033;
  color:#fff;
  padding:12px 15px;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
  display:none;
  z-index:200
}

.toast.show{
  display:block
}

@media(max-width:800px){

.stats{
  grid-template-columns:1fr 1fr
}

.toolbar{
  flex-direction:column
}

.table-card{
  overflow-x:auto
}

table{
  min-width:850px
}

}

@media(max-width:600px){

.top{
  align-items:flex-start;
  flex-direction:column
}

.form-grid{
  grid-template-columns:1fr
}

.full{
  grid-column:auto
}

}
</style>
</head>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
doc,
addDoc,
updateDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================
FIREBASE
===================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAXKXbkljsyRg_0rj0odBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================
STATE
===================================== */

let careers=[];

let editingId=null;


/* =====================================
HELPERS
===================================== */

const $ =
id =>
document.getElementById(id);


function escapeHTML(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function toast(message){

$("toast").textContent=
message;

$("toast").classList.add("show");

setTimeout(
()=>
$("toast").classList.remove("show"),
2500
);

}


function arrayFromText(value){

return String(value||"")
.split(/\n|,/)
.map(
x=>x.trim()
)
.filter(Boolean);

}


function dateValue(value){

if(!value)
return "";

try{

if(
typeof value.toDate===
"function"
){

const d=value.toDate();

return d.toISOString()
.slice(0,10);

}

return new Date(value)
.toISOString()
.slice(0,10);

}catch{

return "";

}

}


/* =====================================
AUTH
===================================== */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href=
"login.html";

return;

}

/*
  IMPORTANT:
  Production Firestore Rules should verify
  the user's admin role.
*/

await loadCareers();

});


/* =====================================
LOAD
===================================== */

async function loadCareers(){

try{

const snap=
await getDocs(
collection(
db,
"careers"
)
);


careers=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);


careers.sort(
(a,b)=>
(b.createdAt?.seconds||0)-
(a.createdAt?.seconds||0)
);


buildCategories();

render();

updateStats();


$("loading").style.display=
"none";

$("careerTable").style.display=
"table";


}catch(error){

console.error(error);

$("loading").textContent=
"Unable to load careers.";

}

}


/* =====================================
CATEGORIES
===================================== */

function buildCategories(){

const categories=
[
...new Set(
careers
.map(c=>c.category)
.filter(Boolean)
)
].sort();


$("categoryFilter").innerHTML=
`
<option value="all">
All Categories
</option>
`+
categories
.map(
category=>
`
<option value="${escapeHTML(category)}">
${escapeHTML(category)}
</option>
`
)
.join("");

}


/* =====================================
FILTER
===================================== */

$("search").addEventListener(
"input",
render
);

$("statusFilter").addEventListener(
"change",
render
);

$("categoryFilter").addEventListener(
"change",
render
);


function render(){

const search=
$("search")
.value
.toLowerCase()
.trim();


const status=
$("statusFilter").value;

const category=
$("categoryFilter").value;


const filtered=
careers.filter(
career=>{

const text=
`
${career.title||""}
${career.company||""}
${career.category||""}
${career.industry||""}
${career.location||""}
`.toLowerCase();


return (
!search||
text.includes(search)
)
&&
(
status==="all"||
career.status===status
)
&&
(
category==="all"||
career.category===category
);

});


if(!filtered.length){

$("careerRows").innerHTML=
`
<tr>
<td colspan="6">
<div class="empty">
No careers found.
</div>
</td>
</tr>
`;

return;

}


$("careerRows").innerHTML=
filtered.map(
career=>{

const status=
career.status||
"draft";


return `
<tr>

<td>

<div class="title">
${escapeHTML(
career.title||
"Untitled"
)}
</div>

<div class="company">
${escapeHTML(
career.company||
""
)}
</div>

</td>


<td>
${escapeHTML(
career.location||
"-"
)}
</td>


<td>

${escapeHTML(
career.employmentType||
"-"
)}

<br>

<span class="badge">
${escapeHTML(
career.workMode||
"-"
)}
</span>

</td>


<td>

<span class="badge ${
status==="published"
?"published"
:"draft"
}">
${escapeHTML(status)}
</span>

${career.featured
?`
<span class="badge featured">
★ Featured
</span>
`
:""}

</td>


<td>

👁 ${
Number(
career.views||0
).toLocaleString()
}

<br>

<span style="font-size:8px">
Applications:
${
Number(
career.applications||0
).toLocaleString()
}
</span>

</td>


<td>

<div class="actions">

<button
class="action secondary"
data-action="view"
data-id="${career.id}">
View
</button>

<button
class="action secondary"
data-action="edit"
data-id="${career.id}">
Edit
</button>

<button
class="action danger"
data-action="delete"
data-id="${career.id}">
Delete
</button>

</div>

</td>

</tr>
`;

}
).join("");

}


/* =====================================
STATS
===================================== */

function updateStats(){

$("total").textContent=
careers.length;


$("published").textContent=
careers.filter(
c=>c.status==="published"
).length;


$("featured").textContent=
careers.filter(
c=>c.featured
).length;


$("applications").textContent=
careers.reduce(
(sum,c)=>
sum+
Number(c.applications||0),
0
);

}


/* =====================================
OPEN MODAL
===================================== */

$("addBtn").onclick=()=>{

editingId=null;

$("modalTitle")
.textContent=
"Add Career";

$("careerForm").reset();

$("currency").value="TZS";

$("modal")
.classList.add("show");

};


$("closeBtn").onclick=
closeModal;

$("cancelBtn").onclick=
closeModal;


function closeModal(){

$("modal")
.classList.remove("show");

}


/* =====================================
EDIT
===================================== */

function editCareer(id){

const career=
careers.find(
c=>c.id===id
);

if(!career)return;


editingId=id;

$("modalTitle")
.textContent=
"Edit Career";


$("title").value=
career.title||"";

$("company").value=
career.company||"";

$("slug").value=
career.slug||"";

$("companyLogo").value=
career.companyLogo||"";

$("shortDescription").value=
career.shortDescription||"";

$("description").value=
career.description||"";

$("location").value=
career.location||"";

$("country").value=
career.country||"";

$("employmentType").value=
career.employmentType||"";

$("workMode").value=
career.workMode||"";

$("salary").value=
typeof career.salary==="object"
?JSON.stringify(career.salary)
:career.salary||"";

$("currency").value=
career.currency||"TZS";

$("category").value=
career.category||"";

$("industry").value=
career.industry||"";

$("experienceLevel").value=
career.experienceLevel||"";

$("educationLevel").value=
career.educationLevel||"";

$("skills").value=
Array.isArray(career.skills)
?career.skills.join(", ")
:career.skills||"";

$("requirements").value=
Array.isArray(career.requirements)
?career.requirements.join("\n")
:career.requirements||"";

$("responsibilities").value=
Array.isArray(career.responsibilities)
?career.responsibilities.join("\n")
:career.responsibilities||"";

$("benefits").value=
Array.isArray(career.benefits)
?career.benefits.join("\n")
:career.benefits||"";

$("applicationUrl").value=
career.applicationUrl||"";

$("deadline").value=
dateValue(career.deadline);

$("status").value=
career.status||"draft";

$("featured").checked=
Boolean(career.featured);


$("modal")
.classList.add("show");

}


/* =====================================
SAVE
===================================== */

$("careerForm")
.addEventListener(
"submit",
async event=>{

event.preventDefault();


const data={

title:
$("title").value.trim(),

company:
$("company").value.trim(),

slug:
$("slug").value.trim()
||
$("title").value
.trim()
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,""),

shortDescription:
$("shortDescription").value.trim(),

description:
$("description").value.trim(),

companyLogo:
$("companyLogo").value.trim(),

location:
$("location").value.trim(),

country:
$("country").value.trim(),

employmentType:
$("employmentType").value,

workMode:
$("workMode").value,

salary:
$("salary").value.trim(),

currency:
$("currency").value.trim()
||
"TZS",

category:

/* =====================================
TABLE ACTIONS
===================================== */

$("careerRows")
.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "[data-action]"
      );

    if(!button) return;

    const id =
      button.dataset.id;

    const action =
      button.dataset.action;


    if(
      action === "edit"
    ){

      editCareer(id);

    }


    if(
      action === "view"
    ){

      window.open(
        `career.html?careerId=${
          encodeURIComponent(id)
        }`,
        "_blank"
      );

    }


    if(
      action === "delete"
    ){

      await deleteCareer(id);

    }

  }
);


/* =====================================
DELETE CAREER
===================================== */

async function deleteCareer(id){

  const career =
    careers.find(
      c => c.id === id
    );

  if(!career) return;


  const confirmed =
    confirm(
      `Delete "${career.title}"?`
    );

  if(!confirmed) return;


  try{

    await deleteDoc(
      doc(
        db,
        "careers",
        id
      )
    );


    toast(
      "Career deleted successfully."
    );


    await loadCareers();


  }catch(error){

    console.error(
      "Delete error:",
      error
    );

    toast(
      "Unable to delete career."
    );

  }

}
