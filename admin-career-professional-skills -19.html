<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin | Career & Professional Skills</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f6f7fb;
  color:#172033;
}

button,
input,
textarea,
select{
  font:inherit;
}

.header{
  background:#111827;
  color:#fff;
  padding:16px 20px;
}

.nav{
  max-width:1250px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.logout{
  border:0;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  background:#ef4444;
  color:#fff;
  font-weight:800;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:25px 18px 60px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px;
}

h1{
  margin:0;
  font-size:28px;
}

.subtitle{
  color:#667085;
  margin-top:6px;
}

.add{
  border:0;
  padding:12px 17px;
  border-radius:10px;
  cursor:pointer;
  background:#2563eb;
  color:#fff;
  font-weight:850;
}

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:18px;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.stat span{
  color:#667085;
  font-size:13px;
}

.toolbar{
  background:#fff;
  padding:14px;
  border:1px solid #e5e7eb;
  border-radius:14px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.search{
  flex:1;
  min-width:220px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d9dee8;
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.toolbar select{
  width:auto;
  min-width:160px;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
}

.table-wrap{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  padding:13px 14px;
  text-align:left;
  border-bottom:1px solid #eef0f4;
  font-size:13px;
}

th{
  background:#f8fafc;
  color:#475467;
}

.course{
  display:flex;
  align-items:center;
  gap:10px;
}

.course img{
  width:55px;
  height:42px;
  object-fit:cover;
  border-radius:7px;
  background:#eee;
}

.course-title{
  font-weight:850;
}

.muted{
  color:#667085;
  margin-top:3px;
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
}

.free{
  background:#dcfce7;
  color:#166534;
}

.paid{
  background:#fce7f3;
  color:#9d174d;
}

.published{
  background:#dbeafe;
  color:#1d4ed8;
}

.draft{
  background:#f1f5f9;
  color:#475569;
}

.edit,
.delete{
  border:0;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
  font-weight:800;
}

.edit{
  background:#dbeafe;
  color:#1d4ed8;
}

.delete{
  background:#fee2e2;
  color:#b91c1c;
}

.empty{
  padding:45px;
  text-align:center;
  color:#667085;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#0008;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h2{
  margin:0;
}

.close{
  border:0;
  background:#f1f5f9;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);
  gap:13px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  font-weight:850;
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:18px;
}

.cancel,
.save{
  border:0;
  padding:11px 17px;
  border-radius:9px;
  cursor:pointer;
  font-weight:850;
}

.cancel{
  background:#f1f5f9;
}

.save{
  background:#2563eb;
  color:#fff;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:200;
  background:#111827;
  color:#fff;
  padding:13px 17px;
  border-radius:10px;
  display:none;
  box-shadow:0 10px 30px #0003;
}

.toast.show{
  display:block;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr;
  }

  .container{
    padding:20px 12px;
  }

}
</style>
</head>

<body>

<header class="header">

  <div class="nav">

    <div class="logo">
      LetsStudy Pro Admin
    </div>

    <button
      id="logout"
      class="logout">

      Logout

    </button>

  </div>

</header>


<main class="container">

  <div class="top">

    <div>

      <h1>
        Career & Professional Skills
      </h1>

      <div class="subtitle">
        Manage career development and professional skills courses.
      </div>

    </div>

    <button
      id="addCourse"
      class="add">

      + Add Course

    </button>

  </div>


  <div class="stats">

    <div class="stat">
      <span>Total Courses</span>
      <strong id="totalCourses">0</strong>
    </div>

    <div class="stat">
      <span>Published</span>
      <strong id="publishedCourses">0</strong>
    </div>

    <div class="stat">
      <span>Free</span>
      <strong id="freeCourses">0</strong>
    </div>

    <div class="stat">
      <span>Paid</span>
      <strong id="paidCourses">0</strong>
    </div>

  </div>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="Search courses...">

    <select id="filter">

      <option value="">
        All Courses
      </option>

      <option value="published">
        Published
      </option>

      <option value="draft">
        Draft
      </option>

      <option value="free">
        Free
      </option>

      <option value="paid">
        Paid
      </option>

    </select>

  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>Course</th>
          <th>Level</th>
          <th>Price</th>
          <th>Status</th>
          <th>Actions</th>

        </tr>

      </thead>

      <tbody id="courseList">

        <tr>

          <td
            colspan="5"
            class="empty">

            Loading courses...

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</main>


<!-- MODAL -->

<div
  id="modal"
  class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Add Course
      </h2>

      <button
        id="closeModal"
        class="close">

        ×

      </button>

    </div>


    <form id="courseForm">

      <div class="form-grid">


        <div class="field full">

          <label>
            Course Title
          </label>

          <input
            id="title"
            required
            placeholder="e.g. Professional Communication Skills">

        </div>


        <div class="field">

          <label>
            Level
          </label>

          <select id="level">

            <option>
              Beginner
            </option>

            <option>
              Intermediate
            </option>

            <option>
              Advanced
            </option>

            <option>
              Professional
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Instructor
          </label>

          <input
            id="instructor"
            value="LetsStudy Pro">

        </div>


        <div class="field">

          <label>
            Price
          </label>

          <input
            id="price"
            type="number"
            min="0"
            value="0">

        </div>


        <div class="field">

          <label>
            Discount Price
          </label>

          <input
            id="discountPrice"
            type="number"
            min="0"
            placeholder="Optional">

        </div>


        <div class="field">

          <label>
            Currency
          </label>

          <select id="currency">

            <option>
              TZS
            </option>

            <option>
              USD
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Status
          </label>

          <select id="status">

            <option value="draft">
              Draft
            </option>

            <option value="published">
              Published
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Featured
          </label>

          <select id="featured">

            <option value="false">
              No
            </option>

            <option value="true">
              Yes
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Certificate
          </label>

          <select id="certificate">

            <option value="true">
              Enabled
            </option>

            <option value="false">
              Disabled
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Duration
          </label>

          <input
            id="duration"
            placeholder="e.g. 8 weeks">

        </div>


        <div class="field">

          <label>
            Lesson Count
          </label>

          <input
            id="lessonCount"
            type="number"
            min="0"
            value="0">

        </div>


        <div class="field full">

          <label>
            Thumbnail URL
          </label>

          <input
            id="thumbnail"
            placeholder="https://...">

        </div>


        <div class="field full">

          <label>
            Short Description
          </label>

          <input
            id="shortDescription"
            placeholder="Short course description">

        </div>


        <div class="field full">

          <label>
            Description
          </label>

          <textarea
            id="description"
            placeholder="Full course description"></textarea>

        </div>


        <div class="field full">

          <label>
            Tags
          </label>

          <input
            id="tags"
            placeholder="communication, leadership, career">

        </div>


      </div>


      <div class="actions">

        <button
          type="button"
          id="cancel"
          class="cancel">

          Cancel

        </button>

        <button
          type="submit"
          class="save">

          Save Course

        </button>

      </div>

    </form>

  </div>

</div>


<div
  id="toast"
  class="toast">
</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =========================================
   VARIABLES
========================================= */

let courses = [];

let editingId = null;


/* =========================================
   HELPERS
========================================= */

const $ =
  id =>
    document.getElementById(id);


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      location.href =
        "login.html";

    }

  }
);


/* =========================================
   LOAD COURSES
========================================= */

async function loadCourses(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "courses"
        )
      );


    courses =
      snapshot.docs

      .map(
        item => ({

          id:item.id,
          ...item.data()

        })
      )

      .filter(
        course => {

          const category =
            String(
              course.categoryId ||
              ""
            ).toLowerCase();

          const name =
            String(
              course.categoryName ||
              ""
            ).toLowerCase();

          return (

            category ===
            "career-professional-skills"

            ||

            name.includes(
              "career"
            )

            ||

            name.includes(
              "professional skills"
            )

          );

        }
      );


    render();


  }

  catch(error){

    console.error(error);

    toast(
      "Unable to load courses."
    );

  }

}


/* =========================================
   RENDER
========================================= */

function render(){

  const search =
    $("search")
      .value
      .toLowerCase()
      .trim();


  const filter =
    $("filter")
      .value;


  let list =
    courses.filter(
      course => {

        const title =
          String(
            course.title ||
            ""
          ).toLowerCase();


        const description =
          String(
            course.description ||
            ""
          ).toLowerCase();


        const free =
          course.isFree === true ||
          Number(
            course.price || 0
          ) === 0;


        const status =
          course.status ||
          "draft";


        const matchesSearch =

          !search ||

          title.includes(search) ||

          description.includes(search);


        const matchesFilter =

          !filter ||

          (
            filter ===
            "free" &&
            free
          ) ||

          (
            filter ===
            "paid" &&
            !free
          ) ||

          (
            filter ===
            "published" &&
            status ===
            "published"
          ) ||

          (
            filter ===
            "draft" &&
            status !==
            "published"
          );


        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );


  const total =
    courses.length;


  const published =
    courses.filter(
      c =>
        c.status ===
        "published"
    ).length;


  const free =
    courses.filter(
      c =>
        c.isFree === true ||
        Number(
          c.price || 0
        ) === 0
    ).length;


  const paid =
    total - free;


  $("totalCourses")
    .textContent =
    total;


  $("publishedCourses")
    .textContent =
    published;


  $("freeCourses")
    .textContent =
    free;


  $("paidCourses")
    .textContent =
    paid;


  const tbody =
    $("courseList");


  if(!list.length){

    tbody.innerHTML = `

      <tr>

        <td
          colspan="5"
          class="empty">

          No Career & Professional Skills
          courses found.

        </td>

      </tr>

    `;

    return;

  }


  tbody.innerHTML =
    list
      .map(
        course => {

          const free =
            course.isFree === true ||
            Number(
              course.price || 0
            ) === 0;


          const price =
            Number(
              course.discountPrice ??
              course.price ??
              0
            );


          return `

            <tr>

              <td>

                <div class="course">

                  <img
                    src="${escapeHTML(
                      course.thumbnail ||
                      "https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=600"
                    )}"
                    alt=""
                  >

                  <div>

                    <div class="course-title">

                      ${escapeHTML(
                        course.title ||
                        "Untitled Course"
                      )}

                    </div>

                    <div class="muted">

                      ${escapeHTML(
                        course.instructorName ||
                        "LetsStudy Pro"
                      )}

                    </div>

                  </div>

                </div>

              </td>


              <td>

                ${escapeHTML(
                  course.level ||
                  "Beginner"
                )}

              </td>


              <td>

                <span
                  class="badge ${
                    free
                      ? "free"
                      : "paid"
                  }">

                  ${
                    free
                      ? "FREE"
                      :
                      `${escapeHTML(
                        course.currency ||
                        "TZS"
                      )}
                      ${price.toLocaleString()}`
                  }

                </span>

              </td>


              <td>

                <span
                  class="badge ${
                    course.status ===
                    "published"
                      ? "published"
                      : "draft"
                  }">

                  ${escapeHTML(
                    course.status ||
                    "draft"
                  )}

                </span>

              </td>


              <td>

                <button
                  class="edit"
                  onclick="
                    editCourse(
                      '${course.id}'
                    )
                  ">

                  Edit

                </button>


                <button
                  class="delete"
                  onclick="
                    removeCourse(
                      '${course.id}'
                    )
                  ">

                  Delete

                </button>

              </td>

            </tr>

          `;

        }
      )
      .join("");

}


/* =========================================
   OPEN ADD
========================================= */

$("addCourse")
.addEventListener(
  "click",
  () => {

    editingId =
      null;

    $("courseForm")
      .reset();

    $("price").value =
      0;

    $("currency").value =
      "TZS";

    $("instructor").value =
      "LetsStudy Pro";

    $("modalTitle")
  .textContent =
  "Add Career Course";

$("modal")
  .classList
  .add("show");

});


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal(){

  $("modal")
    .classList
    .remove("show");

  editingId = null;

}


$("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


$("cancel")
  .addEventListener(
    "click",
    closeModal
  );


$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target ===
        $("modal")
      ){

        closeModal();

      }

    }
  );


/* =========================================
   EDIT COURSE
========================================= */

window.editCourse =
function(id){

  const course =
    courses.find(
      item =>
        item.id === id
    );


  if(!course){

    toast(
      "Course not found."
    );

    return;

  }


  editingId = id;


  $("title").value =
    course.title || "";


  $("level").value =
    course.level ||
    "Beginner";


  $("instructor").value =
    course.instructorName ||
    "LetsStudy Pro";


  $("price").value =
    course.price || 0;


  $("discountPrice").value =
    course.discountPrice ??
    "";


  $("currency").value =
    course.currency ||
    "TZS";


  $("status").value =
    course.status ||
    "draft";


  $("featured").value =
    String(
      course.featured === true
    );


  $("certificate").value =
    String(
      course.certificateEnabled !== false
    );


  $("duration").value =
    course.duration || "";


  $("lessonCount").value =
    course.lessonCount || 0;


  $("thumbnail").value =
    course.thumbnail || "";


  $("shortDescription").value =
    course.shortDescription ||
    "";


  $("description").value =
    course.description ||
    "";


  $("tags").value =

    Array.isArray(course.tags)

      ? course.tags.join(", ")

      : course.tags || "";


  $("modalTitle")
    .textContent =
    "Edit Career Course";


  $("modal")
    .classList
    .add("show");

};


/* =========================================
   DELETE COURSE
========================================= */

window.removeCourse =
async function(id){

  const course =
    courses.find(
      item =>
        item.id === id
    );


  if(!course){

    return;

  }


  const confirmed =
    confirm(
      `Delete "${course.title}"?`
    );


  if(!confirmed){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "courses",
        id
      )
    );


    toast(
      "Course deleted successfully."
    );


    await loadCourses();

  }

  catch(error){

    console.error(
      "Delete error:",
      error
    );


    toast(
      "Failed to delete course."
    );

  }

};


/* =========================================
   SAVE COURSE
========================================= */

$("courseForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const title =
        $("title")
          .value
          .trim();


      if(!title){

        toast(
          "Course title is required."
        );

        return;

      }


      const price =
        Number(
          $("price")
            .value || 0
        );


      const discountValue =
        $("discountPrice")
          .value
          .trim();


      const tags =
        $("tags")
          .value
          .split(",")
          .map(
            tag =>
              tag.trim()
          )
          .filter(Boolean);


      const slug =
        title
          .toLowerCase()
          .replace(
            /[^a-z0-9]+/g,
            "-"
          )
          .replace(
            /^-|-$/g,
            ""
          );


      const status =
        $("status")
          .value;


      const courseData = {

        title,

        slug,

        categoryId:
          "career-professional-skills",

        categoryName:
          "Career & Professional Skills",

        description:
          $("description")
            .value
            .trim(),

        shortDescription:
          $("shortDescription")
            .value
            .trim(),

        instructorName:
          $("instructor")
            .value
            .trim(),

        level:
          $("level")
            .value,

        price,

        currency:
          $("currency")
            .value,

        discountPrice:
          discountValue === ""
            ? null
            : Number(
                discountValue
              ),

        isFree:
          price === 0,

        thumbnail:
          $("thumbnail")
            .value
            .trim(),

        duration:
          $("duration")
            .value
            .trim(),

        lessonCount:
          Number(
            $("lessonCount")
              .value || 0
          ),

        tags,

        status,

        published:
          status ===
          "published",

        featured:
          $("featured")
            .value ===
          "true",

        certificateEnabled:
          $("certificate")
            .value ===
          "true",

        updatedAt:
          serverTimestamp()

      };


      try{

        /* ================================
           EDIT
        ================================= */

        if(editingId){

          await updateDoc(

            doc(
              db,
              "courses",
              editingId
            ),

            courseData

          );


          toast(
            "Course updated successfully."
          );

        }


        /* ================================
           CREATE
        ================================= */

        else{

          courseData.createdAt =
            serverTimestamp();


          courseData.publishedAt =

            status ===
            "published"

              ? serverTimestamp()

              : null;


          courseData.enrollmentCount =
            0;


          courseData.rating =
            0;


          courseData.ratingCount =
            0;


          await addDoc(

            collection(
              db,
              "courses"
            ),

            courseData

          );


          toast(
            "Career course added successfully."
          );

        }


        closeModal();


        await loadCourses();

      }

      catch(error){

        console.error(
          "Save error:",
          error
        );


        toast(
          "Failed to save course."
        );

      }

    }
  );


/* =========================================
   SEARCH
========================================= */

$("search")
  .addEventListener(
    "input",
    render
  );


/* =========================================
   FILTER
========================================= */

$("filter")
  .addEventListener(
    "change",
    render
  );


/* =========================================
   LOGOUT
========================================= */

$("logout")
  .addEventListener(
    "click",
    async () => {

      try{

        await signOut(
          auth
        );


        window.location.href =
          "login.html";

      }

      catch(error){

        console.error(
          error
        );

        toast(
          "Logout failed."
        );

      }

    }
  );


/* =========================================
   TOAST
========================================= */

function toast(message){

  const element =
    $("toast");


  if(!element){

    return;

  }


  element.textContent =
    message;


  element.classList
    .add("show");


  setTimeout(
    () => {

      element.classList
        .remove("show");

    },
    2800
  );

}


/* =========================================
   INITIAL LOAD
========================================= */

loadCourses();

</script>

</body>
</html>
