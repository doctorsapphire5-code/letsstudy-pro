<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Admin Career Management | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.header{
  background:#111827;
  color:white;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
}

.header h1{
  font-size:21px;
}

.header small{
  opacity:.7;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:24px;
}

.card{
  background:white;
  border-radius:16px;
  padding:22px;
  box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.card h2{
  margin-bottom:18px;
  font-size:19px;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:600;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d7dce5;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{

}

textarea{
  min-height:110px;
  resize:vertical;
}

.btn{
  border:0;
  border-radius:10px;

  font-weight:600;
  font-size:14px;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-success{
  background:#16a34a;
  color:white;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.search{
  margin-bottom:18px;
}

.search input{
  padding:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.job-list{

.job{

  padding:18px;
}

.job-header{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.job-title{
  font-size:18px;
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:12px;
  margin-top:8px;
}

.job-description{
  margin:14px 0;
  color:#596273;
  line-height:1.6;
}

.meta{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  font-size:13px;
  color:#6b7280;
  margin-bottom:14px;
}

.loading{
  text-align:center;
  padding:40px;
  color:#6b7280;
}

.empty{
  text-align:center;
  padding:45px;
  color:#6b7280;
}

.alert{
  display:none;
  padding:12px 15px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:14px;
}

.alert.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.alert.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:900px){
  .grid{

@media(max-width:600px){

    padding:14px;
  }

  .header{

  }

    flex-direction:column;
  }
}

/* =========================================

let careers = [];

let editingId = null;


/* =========================================
   ALERT
========================================= */

function showAlert(
  message,
  type = "success"
){

  const box =
    document.getElementById(
      "alertBox"
    );

  box.textContent =
    message;

  box.className =
    "alert " + type;

  setTimeout(
    () => {

      box.className =
        "alert";

    },
    4000
  );

}


/* =========================================
   LOAD CAREERS
========================================= */

async function loadCareers(){

  careerList.innerHTML = `
    <div class="loading">
      Loading careers...
    </div>
  `;

  try{

    const careersRef =
      collection(
        db,
        "careers"
      );

    const snapshot =
      await getDocs(
        careersRef
      );

    careers =
      snapshot.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );

    careers.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );

    updateStats();

    renderCareers();

  }
  catch(error){

    console.error(
      "Load careers error:",
      error
    );

    careerList.innerHTML = `
      <div class="empty">
        <h3>Unable to load careers</h3>
        <p>
          ${escapeHtml(error.message)}
        </p>
      </div>
    `;

    showAlert(
      "Unable to load careers.",
      "error"
    );

  }

}


/* =========================================
   STATS
========================================= */

function updateStats(){

  const total =
    careers.length;

  const active =
    careers.filter(
      item =>
        item.status !== "inactive"
    ).length;

  const inactive =
    careers.filter(
      item =>
        item.status === "inactive"
    ).length;

  document.getElementById(
    "totalCareers"
  ).textContent =
    total;

  document.getElementById(
    "activeCareers"
  ).textContent =
    active;

  document.getElementById(
    "inactiveCareers"
  ).textContent =
    inactive;

}


/* =========================================
   RENDER
========================================= */

function renderCareers(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();

  const filtered =
    careers.filter(
      item => {

        const text = [

          item.title,
          item.category,
          item.location,
          item.type,
          item.description

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return text.includes(
          keyword
        );

      }
    );


  if(!filtered.length){

    careerList.innerHTML = `
      <div class="empty">

        <h3>
          No careers found
        </h3>

        <p>
          Add a career using the form.
        </p>

      </div>
    `;

    return;

  }


  careerList.innerHTML =
    filtered.map(
      item => `

        <article class="job">

          <div class="job-header">

            <div>

              <div class="job-title">
                ${escapeHtml(
                  item.title || "Untitled Career"
                )}
              </div>

              <span class="badge">
                ${escapeHtml(
                  item.category || "General"
                )}
              </span>

            </div>

            <span class="badge">
              ${item.status === "inactive"
                ? "Inactive"
                : "Active"}
            </span>

          </div>


          <div class="meta">

            <span>
              📍 ${escapeHtml(
                item.location || "Not specified"
              )}
            </span>

            <span>
              💼 ${escapeHtml(
                item.type || "Not specified"
              )}
            </span>

            <span>
              💰 ${escapeHtml(
                item.salary || "Not specified"
              )}
            </span>

          </div>


          <div class="job-description">

            ${escapeHtml(
              item.description || ""
            )}

          </div>


          ${
            item.requirements
              ? `
                <p>
                  <strong>
                    Requirements:
                  </strong><br>

                  ${escapeHtml(
                    item.requirements
                  )}
                </p>
              `
              : ""
          }


          <br>


          <div class="actions">

            ${
              item.applyUrl
                ? `
                  <a
                    class="btn btn-success"
                    href="${escapeAttribute(
                      item.applyUrl
                    )}"
                    target="_blank"
                    rel="noopener">

                    Apply

                  </a>
                `
                : ""
            }


            <button
              class="btn btn-primary"
              onclick="editCareer('${item.id}')">

              Edit

            </button>


            <button
              class="btn btn-danger"
              onclick="removeCareer('${item.id}')">

              Delete

            </button>

          </div>

        </article>

      `
    )
    .join("");

}


/* =========================================
   ADD / UPDATE
========================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const data = {

      title:
        title.value.trim(),

      category:
        category.value.trim(),

      location:
        locationInput.value.trim(),

      type:
        type.value,

      salary:
        salary.value.trim(),

      description:
        description.value.trim(),

      requirements:
        requirements.value.trim(),

      applyUrl:
        applyUrl.value.trim(),

      status:
        status.value,

      updatedAt:
        serverTimestamp()

    };


    if(!data.title){

      showAlert(
        "Career title is required.",
        "error"
      );

      return;

    }


    if(!data.description){

      showAlert(
        "Career description is required.",
        "error"
      );

      return;

    }


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "Saving...";


    try{

      if(editingId){

        await updateDoc(
          doc(
            db,
            "careers",
            editingId
          ),
          data
        );

        showAlert(
          "Career updated successfully."
        );

      }
      else{

        await addDoc(
          collection(
            db,
            "careers"
          ),
          {

            ...data,

            createdAt:
              serverTimestamp()

          }
        );

        showAlert(
          "Career added successfully."
        );

      }


      resetForm();

      await loadCareers();

    }
    catch(error){

      console.error(
        "Save career error:",
        error
      );

      showAlert(
        "Unable to save career: " +
        error.message,
        "error"
      );

    }
    finally{

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        editingId
          ? "Update Career"
          : "Add Career";

    }

  }
);


/* =========================================
   EDIT
========================================= */

window.editCareer =
  function(id){

    const career =
      careers.find(
        item =>
          item.id === id
      );

    if(!career){

      showAlert(
        "Career not found.",
        "error"
      );

      return;

    }


    editingId =
      id;

    title.value =
      career.title || "";

    category.value =
      career.category || "";

    locationInput.value =
      career.location || "";

    type.value =
      career.type || "Full Time";

    salary.value =
      career.salary || "";

    description.value =
      career.description || "";

    requirements.value =
      career.requirements || "";

    applyUrl.value =
      career.applyUrl || "";

    status.value =
      career.status || "active";


    formTitle.textContent =
      "Edit Career";

    saveBtn.textContent =
      "Update Career";

    cancelBtn.style.display =
      "inline-block";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  };


/* =========================================
   DELETE
========================================= */

window.removeCareer =
  async function(id){

    const career =
      careers.find(
        item =>
          item.id === id
      );

    if(!career){

      return;

    }


    const confirmed =
      confirm(
        `Delete "${career.title}"?`
      );

    if(!confirmed){

      return;

    }


    try{

      await deleteDoc(
        doc(
          db,
          "careers",
          id
        )
      );

      showAlert(
        "Career deleted successfully."
      );

      await loadCareers();

    }
    catch(error){

      console.error(
        "Delete career error:",
        error
      );

      showAlert(
        "Unable to delete career: " +
        error.message,
        "error"
      );

    }

  };

   RESET
========================================= */

  status.value =

  formTitle.textContent =
    "Add Career";

  saveBtn.textContent =

  cancelBtn.style.display =

}


cancelBtn.addEventListener(

);


searchInput.addEventListener(

);


/* =========================================
   SECURITY-SAFE HTML ESCAPE
========================================= */

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   STATE
========================================= */

let careers = [];
let filteredCareers = [];
let editingCareerId = null;

let currentPage = 1;
const pageSize = 12;


/* =========================================

========================================= */

const careerForm =
  document.getElementById("careerForm");

const careerModal =
  document.getElementById("careerModal");

const careerGrid =

/* =========================================
   FIREBASE COLLECTION
========================================= */

const careersRef =
  collection(
    db,
    "careers"
  );


/* =========================================
   LOAD CAREERS
========================================= */

async function loadCareers(){

  try{

    if(loading){

      loading.style.display =
        "block";

    }

    const snapshot =
      await getDocs(
        query(
          careersRef,
          orderBy(
            "createdAt",
            "desc"
          )
        )
      );

    careers =
      snapshot.docs.map(
        item => ({
          id:
            item.id,

          ...item.data()
        })
      );

  }
  catch(error){

    console.error(
      "Career loading error:",
      error
    );

    /*
      Fallback query in case
      createdAt is missing.
    */

    try{

      const snapshot =
        await getDocs(
          careersRef
        );

      careers =
        snapshot.docs.map(
          item => ({
            id:
              item.id,

            ...item.data()
          })
        );

    }
    catch(fallbackError){

      console.error(
        fallbackError
      );

      careers = [];

      showToast(
        "Unable to load careers.",
        "error"
      );

    }

  }
  finally{

    if(loading){

      loading.style.display =
        "none";

    }

    applyFilters();

  }

}


/* =========================================
   FILTER CAREERS
========================================= */

function applyFilters(){

  const search =

    )
    .toLowerCase()
    .trim();

  const category =
    String(
      categoryFilter?.value || ""
    )
    .toLowerCase();

  const status =

    )
    .toLowerCase();


  filteredCareers =
    careers.filter(
      career => {

        const title =
          String(
            career.title || ""
          )
          .toLowerCase();

        const description =
          String(
            career.description || ""
          )
          .toLowerCase();

        const careerCategory =
          String(
            career.category || ""
          )
          .toLowerCase();

        const careerStatus =
          String(
            career.status || "active"
          )
          .toLowerCase();


        const matchesSearch =
          !search ||
          title.includes(search) ||
          description.includes(search) ||
          careerCategory.includes(search);


        const matchesCategory =
          !category ||
          careerCategory === category;


        const matchesStatus =
          !status ||
          careerStatus === status;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesStatus
        );

      }
    );


  currentPage = 1;

  renderCareers();

  renderPagination();

  updateStatistics();

}


/* =========================================
   RENDER CAREERS
========================================= */

function renderCareers(){

  if(!careerGrid){

    return;

  }


  careerGrid.innerHTML = "";


  if(!filteredCareers.length){

    if(emptyState){

      emptyState.style.display =
        "block";

    }

    return;

  }


  if(emptyState){

    emptyState.style.display =
      "none";

  }


  const start =
    (currentPage - 1) *
    pageSize;


  const end =
    start + pageSize;


  const pageItems =
    filteredCareers.slice(
      start,
      end
    );


  pageItems.forEach(
    career => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "career-card";


      const skills =
        Array.isArray(
          career.skills
        )
        ? career.skills
        : String(
            career.skills || ""
          )
          .split(",")
          .map(
            item =>
              item.trim()
          )
          .filter(Boolean);


      const status =
        career.status ||
        "active";


      const featured =
        career.featured === true;


      const image =
        career.image ||
        "https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=900&q=80";


      card.innerHTML = `

        <div class="career-image">

          <img
            src="${escapeAttribute(image)}"
            alt="${escapeAttribute(career.title || "Career")}"
            loading="lazy"
            onerror="this.src='https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=900&q=80'"
          >

          ${
            featured
            ? `
              <span class="featured-badge">
                ★ Featured
              </span>
            `
            : ""
          }

          <span class="status-badge ${escapeAttribute(status)}">
            ${escapeHTML(status)}
          </span>

        </div>


        <div class="career-content">

          <div class="career-category">
            ${escapeHTML(
              career.category ||
              "Career"
            )}
          </div>


          <h3>
            ${escapeHTML(
              career.title ||
              "Untitled Career"
            )}
          </h3>


          <p>
            ${escapeHTML(
              career.description ||
              "No description available."
            )}
          </p>


          ${
            skills.length
            ? `
              <div class="skills-list">

                ${skills
                  .slice(0,5)
                  .map(
                    skill => `
                      <span>
                        ${escapeHTML(skill)}
                      </span>
                    `
                  )
                  .join("")
                }

              </div>
            `
            : ""
          }


          <div class="career-meta">

            ${
              career.salary
              ? `
                <div>
                  💰
                  ${escapeHTML(
                    career.salary
                  )}
                </div>
              `
              : ""
            }

            ${
              career.education
              ? `
                <div>
                  🎓
                  ${escapeHTML(
                    career.education
                  )}
                </div>
              `
              : ""
            }

            ${
              career.demand
              ? `
                <div>
                  📈
                  ${escapeHTML(
                    career.demand
                  )}
                </div>
              `
              : ""
            }

          </div>


          <div class="career-actions">

            <button
              type="button"
              class="btn-edit"
              onclick="editCareer('${escapeAttribute(career.id)}')"
            >
              ✏️ Edit
            </button>


            <button
              type="button"
              class="btn-delete"
              onclick="deleteCareer('${escapeAttribute(career.id)}')"
            >
              🗑 Delete
            </button>

          </div>

        </div>

      `;


      careerGrid.appendChild(
        card
      );

    }
  );

}


/* =========================================
   OPEN MODAL
========================================= */

function openCareerModal(
  career = null
){

  editingCareerId =
    career?.id || null;


  if(careerIdInput){

    careerIdInput.value =
      career?.id || "";

  }


  if(titleInput){

    titleInput.value =
      career?.title || "";

  }


  if(categoryInput){

    categoryInput.value =
      career?.category || "";

  }


  if(descriptionInput){

    descriptionInput.value =
      career?.description || "";

  }


  if(skillsInput){

    skillsInput.value =
      Array.isArray(
        career?.skills
      )
      ? career.skills.join(", ")
      : (
          career?.skills || ""
        );

  }


  if(salaryInput){

    salaryInput.value =
      career?.salary || "";

  }


  if(educationInput){

    educationInput.value =
      career?.education || "";

  }


  if(demandInput){

    demandInput.value =
      career?.demand || "";

  }


  if(statusInput){

    statusInput.value =
      career?.status ||
      "active";

  }


  if(imageInput){

    imageInput.value =
      career?.image || "";

  }


  if(featuredInput){

    featuredInput.checked =
      career?.featured === true;

  }


  const modalTitle =
    document.getElementById(
      "careerModalTitle"
    );


  if(modalTitle){

    modalTitle.textContent =
      career
      ? "Edit Career"
      : "Add Career";

  }


  if(careerModal){

    careerModal.classList.add(
      "show"
    );

    careerModal.style.display =
      "flex";

  }

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeCareerModal(){

  if(careerModal){

    careerModal.classList.remove(
      "show"
    );

    careerModal.style.display =
      "none";

  }

  editingCareerId =
    null;

  if(careerForm){

    careerForm.reset();

  }

}


/* =========================================
   EDIT CAREER
========================================= */

function editCareer(id){

  const career =
    careers.find(
      item =>
        item.id === id
    );


  if(!career){

    showToast(
      "Career not found.",
      "error"
    );

    return;

  }


  openCareerModal(
    career
  );

}


/* =========================================
   SAVE CAREER
========================================= */

async function saveCareer(
  event
){

  if(event){

    event.preventDefault();

  }


  const title =
    titleInput?.value.trim();


  if(!title){

    showToast(
      "Career title is required.",
      "error"
    );

    return;

  }


  const skills =
    String(
      skillsInput?.value || ""
    )
    .split(",")
    .map(
      item =>
        item.trim()
    )
    .filter(Boolean);


  const careerData = {

    title,

    category:
      categoryInput?.value.trim() ||
      "General",

    description:
      descriptionInput?.value.trim() ||
      "",

    skills,

    salary:
      salaryInput?.value.trim() ||
      "",

    education:
      educationInput?.value.trim() ||
      "",

    demand:
      demandInput?.value.trim() ||
      "",

    status:
      statusInput?.value ||
      "active",

    image:
      imageInput?.value.trim() ||
      "",

    featured:
      featuredInput?.checked === true,

    updatedAt:
      serverTimestamp()

  };


  try{

    setFormLoading(
      true
    );


    if(editingCareerId){

      await updateDoc(
        doc(
          db,
          "careers",
          editingCareerId
        ),
        careerData
      );


      showToast(
        "Career updated successfully.",
        "success"
      );

    }
    else{

      await addDoc(
        careersRef,
        {
          ...careerData,

          createdAt:
            serverTimestamp(),

          views:
            0,

          applications:
            0
        }
      );


      showToast(
        "Career added successfully.",
        "success"
      );

    }


    closeCareerModal();

    await loadCareers();

  }
  catch(error){

    console.error(
      "Save career error:",
      error
    );

    showToast(
      "Unable to save career.",
      "error"
    );

  }
  finally{

    setFormLoading(
      false
    );

  }

}


/* =========================================
   DELETE CAREER
========================================= */

async function deleteCareer(
  id
){

  const career =
    careers.find(
      item =>
        item.id === id
    );


  if(!career){

    return;

  }


  const confirmed =
    confirm(
      `Delete "${career.title || "this career"}"?`
    );


  if(!confirmed){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "careers",
        id
      )
    );


    showToast(
      "Career deleted.",
      "success"
    );


    await loadCareers();

  }
  catch(error){

    console.error(
      "Delete career error:",
      error
    );

    showToast(
      "Unable to delete career.",
      "error"
    );

  }

}


/* =========================================
   TOGGLE FEATURED
========================================= */

async function toggleFeatured(
  id
){

  const career =
    careers.find(
      item =>
        item.id === id
    );


  if(!career){

    return;

  }


  try{

    await updateDoc(
      doc(
        db,
        "careers",
        id
      ),
      {
        featured:
          career.featured !== true,

        updatedAt:
          serverTimestamp()
      }
    );


    await loadCareers();

  }
  catch(error){

    console.error(
      error
    );

    showToast(
      "Unable to update career.",
      "error"
    );

  }

}


/* =========================================
   STATISTICS
========================================= */

function updateStatistics(){

  const total =
    document.getElementById(
      "totalCareers"
    );

  const active =
    document.getElementById(
      "activeCareers"
    );

  const featured =
    document.getElementById(
      "featuredCareers"
    );

  const views =
    document.getElementById(
      "careerViews"
    );


  if(total){

    total.textContent =
      careers.length;

  }


  if(active){

    active.textContent =
      careers.filter(
        item =>
          (
            item.status ||
            "active"
          ) === "active"
      ).length;

  }


  if(featured){

    featured.textContent =
      careers.filter(
        item =>
          item.featured === true
      ).length;

  }


  if(views){

    views.textContent =
      careers.reduce(
        (
          total,
          item
        ) =>
          total +
          Number(
            item.views || 0
          ),
        0
      )
      .toLocaleString();

  }

}


/* =========================================
   PAGINATION
========================================= */

function renderPagination(){

  if(!pagination){

    return;

  }


  pagination.innerHTML =
    "";


  const totalPages =
    Math.ceil(
      filteredCareers.length /
      pageSize
    );


  if(totalPages <= 1){

    return;

  }


  for(
    let page = 1;
    page <= totalPages;
    page++
  ){

    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.textContent =
      page;


    if(
      page === currentPage
    ){

      button.classList.add(
        "active"
      );

    }


    button.onclick =
      () => {

        currentPage =
          page;

        renderCareers();

        renderPagination();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      };


    pagination.appendChild(
      button
    );

  }

}


/* =========================================
   FORM LOADING
========================================= */

function setFormLoading(
  state
){

  const submit =
    careerForm?.querySelector(
      '[type="submit"]'
    );


  if(!submit){

    return;

  }


  submit.disabled =
    state;


  submit.textContent =
    state
    ? "Saving..."
    : (
        editingCareerId
        ? "Update Career"
        : "Save Career"
      );

}


/* =========================================
   TOAST
========================================= */

function showToast(
  message,
  type = "info"
){

  let toast =
    document.getElementById(
      "careerToast"
    );


  if(!toast){

    toast =
      document.createElement(
        "div"
      );

    toast.id =
      "careerToast";

    toast.className =
      "career-toast";

    document.body.appendChild(
      toast
    );

  }


  toast.className =
    `career-toast ${type}`;


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.__careerToastTimer
  );


  window.__careerToastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3000
    );

}
