<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Add Career | LetsStudy Pro</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
color:#111827;
}


/* HEADER */

.header{
height:65px;
background:#111827;
color:white;
display:flex;
align-items:center;
padding:0 20px;
}

.header h2{
font-size:20px;
}


/* CONTAINER */

.container{
max-width:800px;
margin:30px auto;
padding:20px;
}


/* CARD */

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #0001;
}


/* FORM */

.form-group{
margin-bottom:15px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input,
textarea,
select{

width:100%;
padding:12px;

border:1px solid #ddd;

border-radius:8px;

font-size:15px;

}


textarea{
height:120px;
resize:none;
}


/* BUTTON */

button{

width:100%;

padding:14px;

border:none;

border-radius:8px;

background:#111827;

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{

opacity:.9;

}


/* MESSAGE */

#message{

margin-top:15px;

text-align:center;

font-weight:bold;

}


</style>

</head>


<body>


<header class="header">

<h2>
LetsStudy Pro - Add Career
</h2>

</header>



<div class="container">


<div class="card">


<h2 style="margin-bottom:20px;">
Create New Career
</h2>



<div class="form-group">

<label>
Career Title
</label>

<input
id="title"
placeholder="Software Engineer">

</div>



<div class="form-group">

<label>
Category
</label>

<select id="category">

<option>
Technology
</option>

<option>
Engineering
</option>

<option>
Health
</option>

<option>
Business
</option>

<option>
Education
</option>

</select>

</div>



<div class="form-group">

<label>
Description
</label>

<textarea
id="description"
placeholder="Career description">
</textarea>

</div>



<div class="form-group">

<label>
Education Required
</label>

<input
id="education"
placeholder="Bachelor Degree">

</div>



<div class="form-group">

<label>
Skills
</label>

<input
id="skills"
placeholder="Programming, Communication">

</div>



<div class="form-group">

<label>
Subjects
</label>

<input
id="subjects"
placeholder="Mathematics, Physics">

</div>



<div class="form-group">

<label>
Average Salary
</label>

<input
id="salary"
placeholder="TZS 1,000,000">

</div>



<div class="form-group">

<label>
Career Opportunities
</label>

<textarea
id="opportunities"
placeholder="Companies, industries...">
</textarea>

</div>



<div class="form-group">

<label>
Related Courses
</label>

<input
id="courses"
placeholder="Computer Science Course">

</div>



<button onclick="addCareer()">

Save Career

</button>



<p id="message"></p>



</div>

</div>




<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {

getFirestore,

collection,

addDoc,

serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";





// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};




const app =
initializeApp(firebaseConfig);



const db =
getFirestore(app);





/* ADD CAREER */


window.addCareer = async function(){



try{


await addDoc(

collection(db,"careers"),

{


title:
document.getElementById("title").value,


category:
document.getElementById("category").value,


description:
document.getElementById("description").value,


education:
document.getElementById("education").value,


skills:
document.getElementById("skills").value.split(","),


subjects:
document.getElementById("subjects").value.split(","),


salary:
document.getElementById("salary").value,


opportunities:
document.getElementById("opportunities").value,


relatedCourses:
document.getElementById("courses").value.split(","),


status:"active",


createdAt:
serverTimestamp()


}

);



document.getElementById("message").innerHTML=

"✅ Career Added Successfully";



}catch(error){


document.getElementById("message").innerHTML=

"❌ Error: "+error.message;



}



}



</script>


</body>

</html>
