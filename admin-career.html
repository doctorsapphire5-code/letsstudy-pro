<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Career | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
header h1{flex:1;margin:0;font-size:18px}
button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:600}
.back{background:#eef2ff;color:#1d4ed8}
.primary{background:#2563eb;color:#fff}
.success{background:#dcfce7;color:#15803d}
.danger{background:#fee2e2;color:#b91c1c}
.warning{background:#fef3c7;color:#a16207}
main{max-width:1250px;margin:auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:16px;margin-bottom:16px}
.stat span{font-size:11px;color:#64748b}
.stat b{display:block;font-size:22px;margin-top:5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{flex:1;min-width:200px}
input,select,textarea{width:100%;padding:10px;border:1px solid #dbe1e8;border-radius:9px;background:#fff;outline:none}
textarea{resize:vertical}
.table{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4;white-space:nowrap}
th{font-size:10px;color:#64748b}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:9px;font-weight:bold}
.active{background:#dcfce7;color:#15803d}
.closed{background:#fee2e2;color:#b91c1c}
.draft{background:#f1f5f9;color:#64748b}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:100}
.modal.show{display:flex}
.box{background:#fff;width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:17px;padding:20px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.head h2{flex:1;margin:0;font-size:18px}
.field{margin-bottom:13px}
label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.empty{text-align:center;padding:35px;color:#64748b}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:200;font-size:12px}
.toast.show{display:block}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.stats,.grid{grid-template-columns:1fr}}
</style></head><body><header><button class="back"
onclick="location.href='admin-dashboard.html'">
←
</button>

<h1>💼 Career Management</h1><button class="primary"
onclick="openJob()">

+ Add Job
  </button>

</header><main><section class="stats"><div class="card stat">
<span>Total Jobs</span>
<b id="totalJobs">0</b>
</div><div class="card stat">
<span>Active Jobs</span>
<b id="activeJobs">0</b>
</div><div class="card stat">
<span>Applications</span>
<b id="applications">0</b>
</div><div class="card stat">
<span>Closing Soon</span>
<b id="closingSoon">0</b>
</div></section><section class="card"><div class="toolbar"><input
id="search"
placeholder="Search jobs, company or location..."
oninput="renderJobs()">

<select id="statusFilter"
onchange="renderJobs()">

<option value="all">All Status</option>
<option value="active">Active</option>
<option value="draft">Draft</option>
<option value="closed">Closed</option></select><select id="typeFilter"
onchange="renderJobs()">

<option value="all">All Types</option>
<option value="full-time">Full Time</option>
<option value="part-time">Part Time</option>
<option value="internship">Internship</option>
<option value="contract">Contract</option>
<option value="remote">Remote</option></select></div><div class="table"><table><thead><tr>
<th>Job</th>
<th>Company</th>
<th>Location</th>
<th>Type</th>
<th>Deadline</th>
<th>Status</th>
<th>Applications</th>
<th>Action</th>
</tr></thead><tbody id="jobList"></tbody></table></div></section></main><!-- ADD / EDIT JOB --><div
id="jobModal"
class="modal"><div class="box"><div class="head"><h2 id="modalTitle">
Add Career
</h2><button
class="back"
onclick="closeJob()">
✕
</button>

</div><div class="field"><label>Job Title *</label>

<input
id="jobTitle"
placeholder="e.g. Frontend Developer">

</div><div class="grid"><div class="field"><label>Company *</label>

<input
id="company"
placeholder="Company name">

</div><div class="field"><label>Location</label>

<input
id="location"
placeholder="Dar es Salaam / Remote">

</div></div><div class="grid"><div class="field"><label>Job Type</label>

<select id="jobType"><option value="full-time">Full Time</option>
<option value="part-time">Part Time</option>
<option value="internship">Internship</option>
<option value="contract">Contract</option>
<option value="remote">Remote</option></select></div><div class="field"><label>Status</label>

<select id="jobStatus"><option value="active">Active</option>
<option value="draft">Draft</option>
<option value="closed">Closed</option></select></div></div><div class="grid"><div class="field"><label>Category</label>

<input
id="category"
placeholder="Technology">

</div><div class="field"><label>Deadline</label>

<input
id="deadline"
type="date">

</div></div><div class="grid"><div class="field"><label>Salary</label>

<input
id="salary"
placeholder="TZS 800,000 - 1,500,000">

</div><div class="field"><label>Application URL</label>

<input
id="applyUrl"
placeholder="https://...">

</div></div><div class="field"><label>Short Description</label>

<textarea
id="description"
rows="4"
placeholder="Describe the opportunity..."></textarea></div><div class="field"><label>Requirements</label>

<textarea
id="requirements"
rows="5"
placeholder="Education, skills, experience..."></textarea></div><div class="field"><label>Company Logo URL</label>

<input
id="logo"
placeholder="https://...">

</div><div class="actions"><button
class="primary"
onclick="saveJob()">

Save Job

</button><button
class="back"
onclick="closeJob()">

Cancel

</button></div></div></div><div
id="toast"
class="toast">
</div><script type="module">


/* =========================================
 FIREBASE
========================================= */

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
doc,
getDoc,
getDocs,
addDoc,
updateDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let admin=null;
let jobs=[];
let editingId=null;


/* =========================================
 ADMIN AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="login.html";
return;

}

const snap=
await getDoc(
doc(db,"users",user.uid)
);

if(
!snap.exists() ||
snap.data().role!=="admin"
){

alert("Access denied");
location.href="dashboard.html";
return;

}

admin=user;

loadJobs();

});


/* =========================================
 LOAD JOBS
========================================= */

async function loadJobs(){

try{

const snap=
await getDocs(
collection(db,"careers")
);

jobs=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

jobs.sort(
(a,b)=>
getTime(b.createdAt)-
getTime(a.createdAt)
);

updateStats();
renderJobs();

}catch(error){

console.error(error);

toast(
"Unable to load careers."
);

}

}


/* =========================================
 STATS
========================================= */

function updateStats(){

document.getElementById(
"totalJobs"
).textContent=
jobs.length;


document.getElementById(
"activeJobs"
).textContent=
jobs.filter(
x=>x.status==="active"
).length;


document.getElementById(
"applications"
).textContent=
jobs.reduce(
(a,x)=>
a+Number(x.applications||0),
0
);


const now=
Date.now();

const sevenDays=
7*24*60*60*1000;

document.getElementById(
"closingSoon"
).textContent=
jobs.filter(x=>{

if(!x.deadline)
return false;

const d=
new Date(
x.deadline
).getTime();

return(
x.status==="active" &&
d>=now &&
d-now<=sevenDays
);

}).length;

}


/* =========================================
 RENDER
========================================= */

window.renderJobs=function(){

const search=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

const status=
document.getElementById(
"statusFilter"
).value;

const type=
document.getElementById(
"typeFilter"
).value;


const data=
jobs.filter(x=>{

const text=
`${x.title||""}
${x.company||""}
${x.location||""}
${x.category||""}`
.toLowerCase();

return(

text.includes(search) &&

(status==="all"||
x.status===status) &&

(type==="all"||
x.type===type)

);

});


const list=
document.getElementById(
"jobList"
);


if(!data.length){

list.innerHTML=`

<tr>
<td colspan="8">

<div class="empty">

No career opportunities found.

</div>

</td>
</tr>

`;

return;

}


list.innerHTML=
data.map(x=>`

<tr>

<td>
<strong>
${esc(x.title||"-")}
</strong>
</td>

<td>
${esc(x.company||"-")}
</td>

<td>
${esc(x.location||"-")}
</td>

<td>
${esc(x.type||"-")}
</td>

<td>
${esc(x.deadline||"-")}
</td>

<td>

<span class="badge ${
x.status||"draft"
}">

${esc(
x.status||"draft"
)}

</span>

</td>

<td>
${Number(x.applications||0)}
</td>

<td>

<button
class="back"
onclick="editJob('${x.id}')">

Edit

</button>

<button
class="danger"
onclick="removeJob('${x.id}')">

Delete

</button>

</td>

</tr>

`).join("");

};


/* =========================================
 OPEN JOB
========================================= */

window.openJob=function(){

editingId=null;

document.getElementById(
"modalTitle"
).textContent=
"Add Career";


clearForm();


document.getElementById(
"jobModal"
).classList.add("show");

};


/* =========================================
 EDIT JOB
========================================= */

window.editJob=function(id){

const job=
jobs.find(
x=>x.id===id
);

if(!job)
return;

editingId=id;


document.getElementById(
"modalTitle"
).textContent=
"Edit Career";


document.getElementById(
"jobTitle"
).value=
job.title||"";


document.getElementById(
"company"
).value=
job.company||"";


document.getElementById(
"location"
).value=
job.location||"";


document.getElementById(
"jobType"
).value=
job.type||"full-time";


document.getElementById(
"jobStatus"
).value=
job.status||"active";


document.getElementById(
"category"
).value=
job.category||"";


document.getElementById(
"deadline"
).value=
job.deadline||"";


document.getElementById(
"salary"
).value=
job.salary||"";


document.getElementById(
"applyUrl"
).value=
job.applyUrl||"";


document.getElementById(
"description"
).value=
job.description||"";


document.getElementById(
"requirements"
).value=
job.requirements||"";


document.getElementById(
"logo"
).value=
job.logo||"";


document.getElementById(
"jobModal"
).classList.add("show");

};


/* =========================================
 SAVE
========================================= */

window.saveJob=async function(){

const title=
document.getElementById(
"jobTitle"
).value.trim();

const company=
document.getElementById(
"company"
).value.trim();


if(!title||!company){

toast(
"Job title and company are required."
);

return;

}


const data={

title,

company,

location:
document.getElementById(
"location"
).value.trim(),

type:
document.getElementById(
"jobType"
).value,

status:
document.getElementById(
"jobStatus"
).value,

category:
document.getElementById(
"category"
).value.trim(),

deadline:
document.getElementById(
"deadline"
).value,

salary:
document.getElementById(
"salary"
).value.trim(),

applyUrl:
document.getElementById(
"applyUrl"
).value.trim(),

description:
document.getElementById(
"description"
).value.trim(),

requirements:
document.getElementById(
"requirements"
).value.trim(),

logo:
document.getElementById(
"logo"
).value.trim(),

updatedAt:
serverTimestamp(),

updatedBy:
admin.uid

};


try{

if(editingId){

await updateDoc(

doc(
db,
"careers",
editingId
),

data

);

toast(
"Career updated successfully."
);

}else{

await addDoc(

collection(
db,
"careers"
),

{

...data,

applications:0,

createdAt:
serverTimestamp(),

createdBy:
admin.uid

}

);

toast(
"Career added successfully."
);

}


closeJob();

await loadJobs();


}catch(error){

console.error(error);

toast(
"Unable to save career."
);

}

};


/* =========================================
 DELETE
========================================= */

window.removeJob=
async function(id){

const job=
jobs.find(
x=>x.id===id
);

if(!job)
return;


if(
!confirm(
`Delete "${job.title}"?`
)
)
return;


try{

await deleteDoc(
doc(
db,
"careers",
id
)
);

toast(
"Career deleted."
);

await loadJobs();

}catch(error){

console.error(error);

toast(
"Unable to delete career."
);

}

};


/* =========================================
 CLOSE
========================================= */

window.closeJob=function(){

document.getElementById(
"jobModal"
).classList.remove("show");

editingId=null;

};


function clearForm(){

[
"jobTitle",
"company",
"location",
"category",
"deadline",
"salary",
"applyUrl",
"description",
"requirements",
"logo"
]
.forEach(id=>{

document.getElementById(id).value="";

});

document.getElementById(
"jobType"
).value="full-time";

document.getElementById(
"jobStatus"
).value="active";

}


/* =========================================
 HELPERS
========================================= */

function getTime(timestamp){

if(!timestamp)
return 0;

try{

if(
typeof timestamp.toDate===
"function"
){

return timestamp
.toDate()
.getTime();

}

return new Date(timestamp)
.getTime();

}catch{

return 0;

}

}


function esc(value){

return String(
value??""
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function toast(message){

const el=
document.getElementById(
"toast"
);

el.textContent=message;

el.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
