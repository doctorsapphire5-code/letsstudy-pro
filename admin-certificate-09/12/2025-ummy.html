body{

}

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
}
from

  collection,
  addDoc,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  deleteDoc,

}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const auth =
  getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "certificateForm"
  );

const certificateNumber =
  document.getElementById(
    "certificateNumber"
  );

const studentName =
  document.getElementById(
    "studentName"
  );

const studentEmail =
  document.getElementById(
    "studentEmail"
  );

const templateId =
  document.getElementById(
    "templateId"
  );

const courseId =
  document.getElementById(
    "courseId"
  );

const completionDate =
  document.getElementById(
    "completionDate"
  );

const status =
  document.getElementById(
    "status"
  );

const certificateList =
  document.getElementById(
    "certificateList"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const saveBtn =
  document.getElementById(
    "saveBtn"
  );

const cancelBtn =
  document.getElementById(
    "cancelBtn"
  );

const formTitle =
  document.getElementById(
    "formTitle"
  );

const message =
  document.getElementById(
    "message"
  );

const authStatus =
  document.getElementById(
    "authStatus"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const dashboardButton =
  document.getElementById(
    "dashboardButton"
  );

const certificateApp =
  document.getElementById(
    "certificateApp"
  );


/* =====================================================
   STATE
===================================================== */

let certificates = [];

let editId = null;

let currentUser = null;

let isAdmin = false;


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  error=false
){

  message.textContent =
    String(text || "");

  message.className =
    "message " +
    (
      error
      ? "error"
      : "success"
    );

}


/* =====================================================
   REQUIRE ADMIN
===================================================== */

function requireAdmin(){

  if(
    !currentUser ||
    !isAdmin
  ){

    showMessage(
      "Administrator authentication is required.",
      true
    );

    return false;

  }

  return true;

}


/* =====================================================
   LOAD CERTIFICATES
===================================================== */

async function loadCertificates(){

  if(!requireAdmin()){

    return;

  }


  certificateList.innerHTML = `

    <div class="empty">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <br><br>

      Loading certificates...

    </div>

  `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "certificates"
        )
      );


    certificates =
      snapshot.docs.map(
        document => ({

          id:document.id,

          ...document.data()

        })
      );


    renderCertificates();


  }catch(error){

    console.error(
      "Certificate loading error:",
      error
    );


    if(
      error.code ===
      "permission-denied"
    ){

      certificateList.innerHTML = `

        <div class="empty">

          <i class="fa-solid fa-lock"></i>

          <br><br>

          Permission denied.

          <br><br>

          Your Firestore rules do not allow this administrator to read certificates.

        </div>

      `;

    }else{

      certificateList.innerHTML = `

        <div class="empty">

          <i class="fa-solid fa-triangle-exclamation"></i>

          <br><br>

          Unable to load certificates.

          <br><br>

          ${esc(error.message)}

        </div>

      `;

    }

  }

}


/* =====================================================
   RENDER
===================================================== */

function renderCertificates(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    certificates.filter(
      certificate => {

        const text = [

          certificate.certificateNumber,

          certificate.studentName,

          certificate.studentEmail,

          certificate.courseId,

          certificate.templateId

        ]
        .map(
          value =>
            String(
              value ?? ""
            )
        )
        .join(" ")
        .toLowerCase();


        return text.includes(
          query
        );

      }
    );


  if(!filtered.length){

    certificateList.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-certificate"></i>

        <br><br>

        No certificates found.

      </div>

    `;

    return;

  }


  certificateList.innerHTML =
    filtered.map(
      certificate => {

        const certificateStatus =
          String(
            certificate.status ||
            "active"
          )
          .trim()
          .toLowerCase();


        const badgeClass =
          certificateStatus === "revoked"
            ? "revoked"
            : certificateStatus === "pending"
              ? "pending"
              : "active";


        return `

          <div
            class="certificate"
            data-id="${esc(
              certificate.id
            )}"
          >

            <div class="cert-top">

              <div>

                <div class="cert-name">

                  <i class="fa-solid fa-user-graduate"></i>

                  ${esc(
                    certificate.studentName ||
                    "Unnamed Student"
                  )}

                </div>


                <div class="cert-number">

                  ${esc(
                    certificate.certificateNumber ||
                    "No certificate number"
                  )}

                </div>


                <div class="meta">

                  <span class="badge">

                    Email:
                    ${esc(
                      certificate.studentEmail ||
                      "-"
                    )}

                  </span>


                  <span class="badge">

                    Course:
                    ${esc(
                      certificate.courseId ||
                      "-"
                    )}

                  </span>


                  <span class="badge">

                    Template:
                    ${esc(
                      certificate.templateId ||
                      "-"
                    )}

                  </span>


                  <span class="badge">

                    Completion:
                    ${esc(
                      certificate.completionDate ||
                      "-"
                    )}

                  </span>


                  <span class="badge ${badgeClass}">

                    Status:
                    ${esc(
                      certificateStatus
                    )}

                  </span>


                  <span class="badge">

                    ID:
                    ${esc(
                      certificate.id
                    )}

                  </span>

                </div>

              </div>


              <div class="item-actions">


                <button
                  type="button"
                  class="secondary edit-btn"
                  data-id="${esc(
                    certificate.id
                  )}"
                  title="Edit certificate"
                >

                  <i class="fa-solid fa-pen"></i>

                </button>


                ${
                  certificateStatus !==
                  "revoked"

                  ?

                  `

                  <button
                    type="button"
                    class="danger revoke-btn"
                    data-id="${esc(
                      certificate.id
                    )}"
                    title="Revoke certificate"
                  >

                    <i class="fa-solid fa-ban"></i>

                  </button>

                  `

                  :

                  ""

                }


                <button
                  type="button"
                  class="danger delete-btn"
                  data-id="${esc(
                    certificate.id
                  )}"
                  title="Delete certificate"
                >

                  <i class="fa-solid fa-trash"></i>

                </button>


              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   CREATE / UPDATE
===================================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(!requireAdmin()){

      return;

    }


    const certificateData = {

      certificateNumber:
        certificateNumber.value
          .trim(),

      studentName:
        studentName.value
          .trim(),

      studentEmail:
        studentEmail.value
          .trim()
          .toLowerCase(),

      templateId:
        templateId.value
          .trim(),

      courseId:
        courseId.value
          .trim(),

      completionDate:
        completionDate.value,

      status:
        status.value

    };


    if(
      !certificateData.certificateNumber ||
      !certificateData.studentName ||
      !certificateData.studentEmail ||
      !certificateData.templateId ||
      !certificateData.courseId ||
      !certificateData.completionDate
    ){

      showMessage(
        "Please fill all required fields.",
        true
      );

      return;
      }


      if(
        certificateData.studentEmail.length >
        254
      ){

        showMessage(
          "Student email is too long.",
          true
        );

        return;
      }


      if(
        !["active","pending","revoked"]
          .includes(
            certificateData.status
          )
      ){

        showMessage(
          "Invalid certificate status.",
          true
        );

        return;
      }


      saveBtn.disabled = true;


      try{

        /* UPDATE */

        if(editId){

          await updateDoc(

            doc(
              db,
              "certificates",
              editId
            ),

            {
              certificateNumber:
                certificateData.certificateNumber,

              studentName:
                certificateData.studentName,

              studentEmail:
                certificateData.studentEmail,

              templateId:
                certificateData.templateId,

              courseId:
                certificateData.courseId,

              completionDate:
                certificateData.completionDate,

              status:
                certificateData.status,

              updatedBy:
                currentUser.uid,

              updatedAt:
                serverTimestamp()
            }

          );


          showMessage(
            "Certificate updated successfully."
          );

        }

        /* CREATE */

        else{

          const certificateRef =
            await addDoc(

              collection(
                db,
                "certificates"
              ),

              {
                certificateNumber:
                  certificateData.certificateNumber,

                studentName:
                  certificateData.studentName,

                studentEmail:
                  certificateData.studentEmail,

                templateId:
                  certificateData.templateId,

                courseId:
                  certificateData.courseId,

                completionDate:
                  certificateData.completionDate,

                status:
                  certificateData.status,

                createdBy:
                  currentUser.uid,

                createdAt:
                  serverTimestamp(),

                updatedBy:
                  null,

                updatedAt:
                  null,

                revokedAt:
                  certificateData.status ===
                  "revoked"
                    ? serverTimestamp()
                    : null,

                revokedBy:
                  certificateData.status ===
                  "revoked"
                    ? currentUser.uid
                    : null
              }

            );


          console.log(
            "Certificate created:",
            certificateRef.id
          );


          showMessage(
            "Certificate created successfully."
          );

        }


        resetForm();

        await loadCertificates();

      }catch(error){

        console.error(
          "Certificate save error:",
          error
        );


        showMessage(
          error.code ===
          "permission-denied"

            ? "Permission denied by Firestore security rules."

            : error.message,

          true
        );

      }finally{

        saveBtn.disabled = false;

      }

    }
);


/* =====================================================
   EDIT
===================================================== */

function editCertificate(id){

  if(!requireAdmin()){
    return;
  }


  const certificate =
    certificates.find(
      item =>
        item.id === id
    );


  if(!certificate){

    showMessage(
      "Certificate not found.",
      true
    );

    return;
  }


  editId =
    certificate.id;


  certificateNumber.value =
    certificate.certificateNumber || "";


  studentName.value =
    certificate.studentName || "";


  studentEmail.value =
    certificate.studentEmail || "";


  templateId.value =
    certificate.templateId || "";


  courseId.value =
    certificate.courseId || "";


  completionDate.value =
    certificate.completionDate || "";


  status.value =
    certificate.status || "active";


  formTitle.textContent =
    "Edit Certificate";


  saveBtn.innerHTML = `

    <i class="fa-solid fa-save"></i>

    Update Certificate

  `;


  cancelBtn.style.display =
    "inline-block";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =====================================================
   REVOKE
===================================================== */

async function revokeCertificate(id){

  if(!requireAdmin()){
    return;
  }


  const certificate =
    certificates.find(
      item =>
        item.id === id
    );


  if(!certificate){

    showMessage(
      "Certificate not found.",
      true
    );

    return;
  }


  if(
    String(
      certificate.status || ""
    ).toLowerCase() ===
    "revoked"
  ){

    showMessage(
      "This certificate is already revoked.",
      true
    );

    return;
  }


  const confirmed =
    window.confirm(
      `Revoke certificate ${
        certificate.certificateNumber || id
      }?`
    );


  if(!confirmed){
    return;
  }


  try{

    await updateDoc(

      doc(
        db,
        "certificates",
        id
      ),

      {
        status:"revoked",

        revokedAt:
          serverTimestamp(),

        revokedBy:
          currentUser.uid,

        updatedAt:
          serverTimestamp(),

        updatedBy:
          currentUser.uid
      }

    );


    showMessage(
      "Certificate revoked successfully."
    );


    await loadCertificates();

  }catch(error){

    console.error(
      "Certificate revoke error:",
      error
    );


    showMessage(
      error.code ===
      "permission-denied"

        ? "Permission denied by Firestore security rules."

        : error.message,

      true
    );

  }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteCertificate(id){

  if(!requireAdmin()){
    return;
  }


  const certificate =
    certificates.find(
      item =>
        item.id === id
    );


  if(!certificate){

    showMessage(
      "Certificate not found.",
      true
    );

    return;
  }


  const confirmed =
    window.confirm(
      `Delete certificate ${
        certificate.certificateNumber || id
      }? This action cannot be undone.`
    );


  if(!confirmed){
    return;
  }


  try{

    await deleteDoc(

      doc(
        db,
        "certificates",
        id
      )

    );


    showMessage(
      "Certificate deleted successfully."
    );


    await loadCertificates();

  }catch(error){

    console.error(
      "Certificate delete error:",
      error
    );


    showMessage(
      error.code ===
      "permission-denied"

        ? "Permission denied by Firestore security rules."

        : error.message,

      true
    );

  }

}


/* =====================================================
   CERTIFICATE ACTIONS
===================================================== */

certificateList.addEventListener(
  "click",
  event => {

    const editButton =
      event.target.closest(
        ".edit-btn"
      );


    if(editButton){

      editCertificate(
        editButton.dataset.id
      );

      return;
    }


    const revokeButton =
      event.target.closest(
        ".revoke-btn"
      );


    if(revokeButton){

      revokeCertificate(
        revokeButton.dataset.id
      );

      return;
    }


    const deleteButton =
      event.target.closest(
        ".delete-btn"
      );


    if(deleteButton){

      deleteCertificate(
        deleteButton.dataset.id
      );

    }

  }
);


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

  editId = null;

  form.reset();

  status.value =
    "active";

  formTitle.textContent =
    "Create Certificate";


  saveBtn.innerHTML = `

    <i class="fa-solid fa-plus"></i>

    Create Certificate

  `;


  cancelBtn.style.display =
    "none";

}


cancelBtn.addEventListener(
  "click",
  resetForm
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  renderCertificates
);


/* =====================================================
   MANUAL NAVIGATION
===================================================== */

loginButton.addEventListener(
  "click",
  () => {

    window.location.href =
      "login-admin.html";

  }
);


dashboardButton.addEventListener(
  "click",
  () => {

    window.location.href =
      "admin-dashboard.html";

  }
);



</script>
