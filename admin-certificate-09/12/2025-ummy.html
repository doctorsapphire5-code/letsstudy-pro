<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Certificates | Let'sStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

.container{
max-width:1150px;
margin:auto;
padding:20px;
}

.admin{
display:inline-flex;
align-items:center;
gap:8px;
background:#172033;
color:#fff;
padding:8px 13px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-bottom:15px;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:18px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
}

h1,h2{
margin-top:0;
}

.subtitle{
color:#64748b;
font-size:13px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.full{
grid-column:1/-1;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:7px;
}

input,select{
width:100%;
padding:12px;
border:1px solid #dbe2ea;
border-radius:9px;
outline:none;
font-family:inherit;
}

input:focus,
select:focus{
border-color:#2563eb;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
}

button{
border:0;
border-radius:9px;
padding:11px 16px;
cursor:pointer;
font-weight:bold;
}

.primary{
background:#2563eb;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#334155;
}

.danger{
background:#fee2e2;
color:#dc2626;
}

.success-btn{
background:#dcfce7;
color:#166534;
}

.search{
margin-bottom:15px;
}

.search input{
max-width:500px;
}

.certificate{
border:1px solid #e5e7eb;
border-radius:14px;
padding:17px;
margin-bottom:12px;
}

.cert-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px;
}

.cert-name{
font-size:18px;
font-weight:bold;
margin-bottom:7px;
}

.cert-number{
font-family:monospace;
font-size:12px;
color:#64748b;
}

.meta{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:12px;
}

.badge{
background:#f1f5f9;
color:#475569;
padding:6px 9px;
border-radius:20px;
font-size:11px;
}

.badge.active{
background:#dcfce7;
color:#166534;
}

.badge.revoked{
background:#fee2e2;
color:#991b1b;
}

.item-actions{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.message{
display:none;
padding:12px;
border-radius:9px;
margin-bottom:15px;
font-size:13px;
}

.message.success{
display:block;
background:#dcfce7;
color:#166534;
}

.message.error{
display:block;
background:#fee2e2;
color:#991b1b;
}

.empty{
text-align:center;
padding:40px 20px;
color:#64748b;
}

@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.cert-top{
flex-direction:column;
}

}
</style>
</head>

<body>

<div class="container">

<div class="admin">
<i class="fa-solid fa-shield-halved"></i>
ADMIN
</div>


<div class="card">

<h1>
<i class="fa-solid fa-certificate"></i>
Certificate Management
</h1>

<p class="subtitle">
Create, manage and revoke course certificates.
</p>

</div>


<div id="message" class="message"></div>


<!-- FORM -->

<div class="card">

<h2 id="formTitle">
Create Certificate
</h2>

<form id="certificateForm">

<div class="grid">


<div>

<label>
Certificate Number
</label>

<input
id="certificateNumber"
type="text"
placeholder="e.g. LSP-2026-00001"
required>

</div>


<div>

<label>
Student Name
</label>

<input
id="studentName"
type="text"
placeholder="Student full name"
required>

</div>


<div>

<label>
Student Email
</label>

<input
id="studentEmail"
type="email"
placeholder="student@example.com"
required>

</div>


<div>

<label>
Template ID
</label>

<input
id="templateId"
type="text"
placeholder="Certificate template ID"
required>

</div>


<div>

<label>
Course ID
</label>

<input
id="courseId"
type="text"
placeholder="Course ID"
required>

</div>


<div>

<label>
Completion Date
</label>

<input
id="completionDate"
type="date"
required>

</div>


<div>

<label>
Status
</label>

<select id="status">

<option value="active">
Active
</option>

<option value="pending">
Pending
</option>

<option value="revoked">
Revoked
</option>

</select>

</div>

</div>


<div class="actions">

<button
type="submit"
id="saveBtn"
class="primary">

<i class="fa-solid fa-plus"></i>

Create Certificate

</button>


<button
type="button"
id="cancelBtn"
class="secondary"
style="display:none">

Cancel

</button>

</div>

</form>

</div>


<!-- CERTIFICATES -->

<div class="card">

<h2>
All Certificates
</h2>

<div class="search">

<input
id="searchInput"
type="search"
placeholder="Search student, email, course or certificate number...">

</div>


<div id="certificateList">

<div class="empty">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Loading certificates...

</div>

</div>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
updateDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const form=
document.getElementById(
"certificateForm"
);

const certificateNumber=
document.getElementById(
"certificateNumber"
);

const studentName=
document.getElementById(
"studentName"
);

const studentEmail=
document.getElementById(
"studentEmail"
);

const templateId=
document.getElementById(
"templateId"
);

const courseId=
document.getElementById(
"courseId"
);

const completionDate=
document.getElementById(
"completionDate"
);

const status=
document.getElementById(
"status"
);

const certificateList=
document.getElementById(
"certificateList"
);

const searchInput=
document.getElementById(
"searchInput"
);

const saveBtn=
document.getElementById(
"saveBtn"
);

const cancelBtn=
document.getElementById(
"cancelBtn"
);

const formTitle=
document.getElementById(
"formTitle"
);

const message=
document.getElementById(
"message"
);


let certificates=[];

let editId=null;

let currentUser=null;


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
error=false
){

message.textContent=text;

message.className=
"message "+
(error?"error":"success");

setTimeout(()=>{

message.className=
"message";

},4000);

}


/* =====================================================
   LOAD
===================================================== */

async function loadCertificates(){

certificateList.innerHTML=`

<div class="empty">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Loading certificates...

</div>

`;


try{

const snapshot=
await getDocs(
collection(
db,
"certificates"
)
);


certificates=
snapshot.docs.map(
d=>({

id:d.id,

...d.data()

})
);


renderCertificates();

}catch(error){

console.error(error);

certificateList.innerHTML=`

<div class="empty">

<i class="fa-solid fa-triangle-exclamation"></i>

<br><br>

${esc(error.message)}

</div>

`;

}

}


/* =====================================================
   RENDER
===================================================== */

function renderCertificates(){

const q=
searchInput.value
.trim()
.toLowerCase();


const filtered=
certificates.filter(c=>{

return(

String(
c.certificateNumber||""
)
.toLowerCase()
.includes(q)

||

String(
c.studentName||""
)
.toLowerCase()
.includes(q)

||

String(
c.studentEmail||""
)
.toLowerCase()
.includes(q)

||

String(
c.courseId||""
)
.toLowerCase()
.includes(q)

);

});


if(!filtered.length){

certificateList.innerHTML=`

<div class="empty">

<i class="fa-solid fa-certificate"></i>

<br><br>

No certificates found.

</div>

`;

return;

}


certificateList.innerHTML=
filtered.map(c=>`

<div class="certificate">

<div class="cert-top">

<div>

<div class="cert-name">

<i class="fa-solid fa-user-graduate"></i>

${esc(
c.studentName
)}

</div>


<div class="cert-number">

${esc(
c.certificateNumber
)}

</div>


<div class="meta">

<span class="badge">

Email:
${esc(
c.studentEmail
)}

</span>


<span class="badge">

Course:
${esc(
c.courseId
)}

</span>


<span class="badge">

Template:
${esc(
c.templateId
)}

</span>


<span class="badge">

Completion:
${esc(
c.completionDate
)}

</span>


<span class="badge ${
c.status==="revoked"
?"revoked"
:"active"
}">

Status:
${esc(
c.status||"active"
)}

</span>


<span class="badge">

ID:
${esc(c.id)}

</span>

</div>

</div>


<div class="item-actions">

<button
class="secondary"
title="Edit"
onclick="editCertificate('${c.id}')">

<i class="fa-solid fa-pen"></i>

</button>


${
c.status==="revoked"
?
""
:
`
<button
class="danger"
title="Revoke"
onclick="revokeCertificate('${c.id}')">

<i class="fa-solid fa-ban"></i>

</button>
`
}


<button
class="danger"
title="Delete"
onclick="deleteCertificate('${c.id}')">

<i class="fa-solid fa-trash"></i>

</button>

</div>

</div>

</div>

`).join("");

}


/* =====================================================
   CREATE / UPDATE
===================================================== */

form.addEventListener(
"submit",
async e=>{

e.preventDefault();


if(!currentUser){

showMessage(
"Admin login required.",
true
);

return;

}


const data={

certificateNumber:
certificateNumber.value.trim(),

studentName:
studentName.value.trim(),

studentEmail:
studentEmail.value.trim(),

templateId:
templateId.value.trim(),

courseId:
courseId.value.trim(),

completionDate:
completionDate.value,

status:
status.value

};


if(
!data.certificateNumber||
!data.studentName||
!data.studentEmail||
!data.templateId||
!data.courseId||
!data.completionDate
){

showMessage(
"Please fill all required fields.",
true
);

return;

}


saveBtn.disabled=true;


try{


/* UPDATE */

if(editId){

await updateDoc(

doc(
db,
"certificates",
editId
),

data

);


showMessage(
"Certificate updated successfully."
);

}


/* CREATE */

else{

const certificateRef=
await addDoc(

collection(
db,
"certificates"
),

{

certificateNumber:
data.certificateNumber,

studentName:
data.studentName,

studentEmail:
data.studentEmail,

templateId:
data.templateId,

courseId:
data.courseId,

completionDate:
data.completionDate,

status:
data.status,

createdBy:
currentUser.uid,

createdAt:
serverTimestamp(),

revokedAt:null,

revokedBy:null

}

);


console.log(
"Automatic certificate ID:",
certificateRef.id
);


showMessage(
"Certificate created successfully."
);

}


resetForm();

await loadCertificates();

}catch(error){

console.error(error);

showMessage(
error.message,
true
);

}


saveBtn.disabled=false;

});


/* =====================================================
   EDIT
===================================================== */

window.editCertificate=function(id){

const c=
certificates.find(
x=>x.id===id
);

if(!c)return;


editId=id;

certificateNumber.value=
c.certificateNumber||"";

studentName.value=
c.studentName||"";

studentEmail.value=
c.studentEmail||"";

templateId.value=
c.templateId||"";

courseId.value=
c.courseId||"";

completionDate.value=
c.completionDate||"";

status.value=
c.status||"active";


formTitle.textContent=
"Edit Certificate";


saveBtn.innerHTML=`

<i class="fa-solid fa-save"></i>

Update Certificate

`;

cancelBtn.style.display=
"inline-block";


window.scrollTo({

top:0,

behavior:"smooth"

});

};


/* =====================================================
   REVOKE
===================================================== */

window.revokeCertificate=
async function(id){

const c=
certificates.find(
x=>x.id===id
);

if(!c)return;


if(
!confirm(
`Revoke certificate ${c.certificateNumber}?`
)
)return;


try{

await updateDoc(

doc(
db,
"certificates",
id
),

{

status:"revoked",

revokedAt:
serverTimestamp(),

revokedBy:
currentUser.uid

}

);


showMessage(
"Certificate revoked successfully."
);


await loadCertificates();

}catch(error){

console.error(error);

showMessage(
error.message,
true
);

}

};


/* =====================================================
   DELETE
===================================================== */

window.deleteCertificate=
async function(id){

const c=
certificates.find(
x=>x.id===id
);

if(!c)return;


if(
!confirm(
`Delete certificate ${c.certificateNumber}?`
)
)return;


try{

await deleteDoc(

doc(
db,
"certificates",
id
)

);


showMessage(
"Certificate deleted successfully."
);


await loadCertificates();

}catch(error){

console.error(error);

showMessage(
error.message,
true
);

}

};


/* =====================================================
   RESET
===================================================== */

function resetForm(){

editId=null;

form.reset();

status.value="active";

formTitle.textContent=
"Create Certificate";

saveBtn.innerHTML=`

<i class="fa-solid fa-plus"></i>

Create Certificate

`;

cancelBtn.style.display=
"none";

}


cancelBtn.addEventListener(
"click",
resetForm
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
"input",
renderCertificates
);


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
auth,
async user=>{

if(!user){

currentUser=null;

certificateList.innerHTML=`

<div class="empty">

<i class="fa-solid fa-lock"></i>

<br><br>

Admin login required.

</div>

`;

return;

}


currentUser=user;

await loadCertificates();

});

</script>

</body>
</html>
