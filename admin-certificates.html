<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Certificates | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}
header{
  background:#111827;
  color:#fff;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h2{margin:0}
.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}
.stat,.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 4px 15px #00000010;
}
.stat strong{
  display:block;
  font-size:28px;
  margin-top:5px;
}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
input,select,button{
  padding:11px 13px;
  border-radius:8px;
  border:1px solid #ddd;
}
input,select{background:#fff}
button{
  cursor:pointer;
  border:0;
  background:#2563eb;
  color:#fff;
}
button.danger{background:#dc2626}
button.secondary{background:#6b7280}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
}
.cert{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 4px 15px #00000010;
}
.cert h3{margin:5px 0}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#dcfce7;
  color:#166534;
  font-size:12px;
}
.actions{
  display:flex;
  gap:7px;
  margin-top:15px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal-box{
  background:#fff;
  width:100%;
  max-width:550px;
  border-radius:15px;
  padding:22px;
  max-height:90vh;
  overflow:auto;
}
.form-group{margin-bottom:12px}
.form-group label{
  display:block;
  margin-bottom:5px;
  font-weight:bold;
}
.form-group input,
.form-group select{
  width:100%;
}
.form-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}
.empty{
  text-align:center;
  padding:40px;
  color:#777;
}
@media(max-width:650px){
  .stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h2>🎓 Certificate Admin</h2>
  <button onclick="openModal()">+ Add Certificate</button>
</header>

<div class="container">

  <div class="stats">
    <div class="stat">
      Total Certificates
      <strong id="total">0</strong>
    </div>

    <div class="stat">
      Issued
      <strong id="issued">0</strong>
    </div>

    <div class="stat">
      Revoked
      <strong id="revoked">0</strong>
    </div>
  </div>

  <div class="toolbar">

    <input
      id="search"
      placeholder="Search certificate..."
    >

    <select id="status">
      <option value="">All Status</option>
      <option value="issued">Issued</option>
      <option value="revoked">Revoked</option>
    </select>

    <button onclick="loadCertificates()">
      🔄 Refresh
    </button>

  </div>

  <div id="loading" class="empty">
    Loading certificates...
  </div>

  <div id="certificates" class="grid"></div>

</div>


<!-- MODAL -->

<div id="modal" class="modal">

  <div class="modal-box">

    <h2 id="modalTitle">
      Add Certificate
    </h2>

    <form id="form">

      <input type="hidden" id="id">

      <div class="form-group">
        <label>Certificate Number</label>
        <input id="number" required>
      </div>

      <div class="form-group">
        <label>Student Name</label>
        <input id="student" required>
      </div>

      <div class="form-group">
        <label>Course</label>
        <input id="course" required>
      </div>

      <div class="form-group">
        <label>Issue Date</label>
        <input id="date" type="date" required>
      </div>

      <div class="form-group">
        <label>Status</label>

        <select id="certStatus">
          <option value="issued">Issued</option>
          <option value="revoked">Revoked</option>
        </select>

      </div>

      <div class="form-group">
        <label>Certificate URL</label>
        <input
          id="url"
          type="url"
          placeholder="https://..."
        >
      </div>

      <div class="form-actions">

        <button type="submit">
          💾 Save
        </button>

        <button
          type="button"
          class="secondary"
          onclick="closeModal()"
        >
          Cancel
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   FIREBASE
===================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const certificatesRef =
  collection(
    db,
    "certificates"
  );


/* =====================================
   STATE
===================================== */

let certificates = [];
let editingId = null;


/* =====================================
   ELEMENTS
===================================== */

const list =
  document.getElementById(
    "certificates"
  );

const loading =
  document.getElementById(
    "loading"
  );

const search =
  document.getElementById(
    "search"
  );

const status =
  document.getElementById(
    "status"
  );


/* =====================================
   ESCAPE
===================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================
   LOAD
===================================== */

async function loadCertificates(){

  loading.style.display =
    "block";

  list.innerHTML = "";

  try{

    const snap =
      await getDocs(
        certificatesRef
      );

    certificates =
      snap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );

    render();

  }
  catch(error){

    console.error(error);

    list.innerHTML =
      `<div class="empty">
        Failed to load certificates.
      </div>`;

  }
  finally{

    loading.style.display =
      "none";

  }

}


/* =====================================
   RENDER
===================================== */

function render(){

  const q =
    search.value
      .toLowerCase()
      .trim();

  const filter =
    status.value;


  const data =
    certificates.filter(c => {

      const text =
        `
        ${c.number || ""}
        ${c.student || ""}
        ${c.course || ""}
        `
        .toLowerCase();

      return (
        (!q || text.includes(q)) &&
        (!filter ||
          (c.status || "issued") === filter)
      );

    });


  updateStats();


  if(!data.length){

    list.innerHTML =
      `<div class="empty">
        No certificates found.
      </div>`;

    return;

  }


  list.innerHTML =
    data.map(c => `

      <div class="cert">

        <span class="badge">
          ${escapeHTML(
            c.status || "issued"
          )}
        </span>

        <h3>
          ${escapeHTML(
            c.student
          )}
        </h3>

        <p>
          <b>Certificate:</b>
          ${escapeHTML(
            c.number
          )}
        </p>

        <p>
          <b>Course:</b>
          ${escapeHTML(
            c.course
          )}
        </p>

        <p>
          <b>Issued:</b>
          ${escapeHTML(
            c.date || "-"
          )}
        </p>

        <div class="actions">

          <button
            onclick="editCertificate('${c.id}')"
          >
            ✏️ Edit
          </button>

          ${
            c.url
            ? `
              <button
                class="secondary"
                onclick="window.open('${escapeHTML(c.url)}','_blank')"
              >
                👁 View
              </button>
            `
            : ""
          }

          <button
            class="danger"
            onclick="removeCertificate('${c.id}')"
          >
            🗑 Delete
          </button>

        </div>

      </div>

    `).join("");

}


/* =====================================
   STATISTICS
===================================== */

function updateStats(){

  document.getElementById(
    "total"
  ).textContent =
    certificates.length;


  document.getElementById(
    "issued"
  ).textContent =
    certificates.filter(
      c =>
        (c.status || "issued")
        === "issued"
    ).length;


  document.getElementById(
    "revoked"
  ).textContent =
    certificates.filter(
      c =>
        c.status === "revoked"
    ).length;

}


/* =====================================
   MODAL
===================================== */

window.openModal =
function(certificate=null){

  editingId =
    certificate?.id || null;

  document.getElementById(
    "modalTitle"
  ).textContent =
    certificate
    ? "Edit Certificate"
    : "Add Certificate";


  document.getElementById(
    "id"
  ).value =
    certificate?.id || "";


  document.getElementById(
    "number"
  ).value =
    certificate?.number || "";


  document.getElementById(
    "student"
  ).value =
    certificate?.student || "";


  document.getElementById(
    "course"
  ).value =
    certificate?.course || "";


  document.getElementById(
    "date"
  ).value =
    certificate?.date || "";


  document.getElementById(
    "certStatus"
  ).value =
    certificate?.status ||
    "issued";


  document.getElementById(
    "url"
  ).value =
    certificate?.url || "";


  document.getElementById(
    "modal"
  ).style.display =
    "flex";

};


window.closeModal =
function(){

  document.getElementById(
    "modal"
  ).style.display =
    "none";

  document.getElementById(
    "form"
  ).reset();

  editingId = null;

};


/* =====================================
   EDIT
===================================== */

window.editCertificate =
function(id){

  const certificate =
    certificates.find(
      c => c.id === id
    );

  if(certificate){

    openModal(
      certificate
    );

  }

};


/* =====================================
   SAVE
===================================== */

document.getElementById(
  "form"
).addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const data = {

      number:
        document.getElementById(
          "number"
        ).value.trim(),

      student:
        document.getElementById(
          "student"
        ).value.trim(),

      course:
        document.getElementById(
          "course"
        ).value.trim(),

      date:
        document.getElementById(
          "date"
        ).value,

      status:
        document.getElementById(
          "certStatus"
        ).value,

      url:
        document.getElementById(
          "url"
        ).value.trim(),

      updatedAt:
        serverTimestamp()

    };


    try{

      if(editingId){

        await updateDoc(
          doc(
            db,
            "certificates",
            editingId
          ),
          data
        );

        alert(
          "Certificate updated."
        );

      }
      else{

        await addDoc(
          certificatesRef,
          {
            ...data,

            createdAt:
              serverTimestamp()
          }
        );

        alert(
          "Certificate created."
        );

      }


      closeModal();

      await loadCertificates();

    }
    catch(error){

      console.error(error);

      alert(
        "Failed to save certificate."
      );

    }

  }
);


/* =====================================
   DELETE
===================================== */

window.removeCertificate =
async function(id){

  const certificate =
    certificates.find(
      c => c.id === id
    );


  if(
    !confirm(
      `Delete certificate ${
        certificate?.number || ""
      }?`
    )
  ){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "certificates",
        id
      )
    );

    await loadCertificates();

  }
  catch(error){

    console.error(error);

    alert(
      "Failed to delete certificate."
    );

  }

};


/* =====================================
   FILTERS
===================================== */

search.addEventListener(
  "input",
  render
);

status.addEventListener(
  "change",
  render
);


/* =====================================
   START
===================================== */

loadCertificates();

</script>

</body>
</html>
