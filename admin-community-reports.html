<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Community Reports | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
header{
  background:#111827;
  color:#fff;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center
}
header h2{margin:0}
.container{
  max-width:1200px;
  margin:auto;
  padding:20px
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:15px;
  margin-bottom:20px
}
.stat{
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 18px rgba(0,0,0,.06)
}
.stat b{
  display:block;
  font-size:28px;
  margin-top:8px
}
.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.06)
}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}
input,select,button,textarea{
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:14px
}
input{
  flex:1;
  min-width:220px
}
button{
  border:0;
  cursor:pointer;
  color:#fff;
  background:#2563eb
}
button.secondary{background:#64748b}
button.success{background:#16a34a}
button.danger{background:#dc2626}
table{
  width:100%;
  border-collapse:collapse
}
th,td{
  padding:13px;
  border-bottom:1px solid #eee;
  text-align:left;
  vertical-align:top
}
th{background:#f8fafc}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  background:#e2e8f0
}
.pending{background:#fef3c7;color:#92400e}
.reviewing{background:#dbeafe;color:#1e40af}
.resolved{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}
.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}
.empty{
  text-align:center;
  padding:40px;
  color:#64748b
}
#loading{
  text-align:center;
  padding:30px
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10
}
.modal-box{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
  padding:22px
}
.row{
  padding:11px 0;
  border-bottom:1px solid #eee
}
textarea{
  width:100%;
  min-height:120px;
  resize:vertical
}
@media(max-width:700px){
  table{font-size:12px}
  th:nth-child(4),
  td:nth-child(4){display:none}
}
</style>
</head>

<body>

<header>
  <h2>🚨 Community Reports</h2>
  <button onclick="loadReports()">↻ Refresh</button>
</header>

<div class="container">

  <div class="stats">

    <div class="stat">
      Total Reports
      <b id="totalReports">0</b>
    </div>

    <div class="stat">
      Pending
      <b id="pendingReports">0</b>
    </div>

    <div class="stat">
      Reviewing
      <b id="reviewingReports">0</b>
    </div>

    <div class="stat">
      Resolved
      <b id="resolvedReports">0</b>
    </div>

  </div>


  <div class="card">

    <div class="controls">

      <input
        id="searchInput"
        placeholder="Search report, reason, user..."
        oninput="renderReports()"
      >

      <select
        id="statusFilter"
        onchange="renderReports()">

        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="reviewing">Reviewing</option>
        <option value="resolved">Resolved</option>
        <option value="rejected">Rejected</option>

      </select>

      <select
        id="typeFilter"
        onchange="renderReports()">

        <option value="">All Types</option>
        <option value="post">Post</option>
        <option value="comment">Comment</option>
        <option value="user">User</option>
        <option value="group">Group</option>
        <option value="message">Message</option>

      </select>

    </div>

  </div>


  <div class="card">

    <div id="loading">
      Loading reports...
    </div>

    <div id="tableWrap" style="display:none">

      <table>

        <thead>

          <tr>
            <th>Report</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="reportsBody"></tbody>

      </table>

      <div
        id="empty"
        class="empty"
        style="display:none">

        No reports found.

      </div>

    </div>

  </div>

</div>


<!-- DETAILS MODAL -->

<div
  id="reportModal"
  class="modal">

  <div class="modal-box">

    <h3>Report Details</h3>

    <div id="reportDetails"></div>

    <br>

    <button
      class="secondary"
      onclick="closeModal()">

      Close

    </button>

  </div>

</div>


<!-- RESOLVE MODAL -->

<div
  id="resolveModal"
  class="modal">

  <div class="modal-box">

    <h3>Resolve Report</h3>

    <textarea
      id="resolutionNote"
      placeholder="Enter resolution note...">
    </textarea>

    <br><br>

    <button
      class="success"
      onclick="saveResolution()">

      Resolve Report

    </button>

    <button
      class="secondary"
      onclick="closeResolve()">

      Cancel

    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   FIREBASE
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbjsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================
   STATE
===================================== */

let reports = [];

let selectedReportId =
  null;


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);


/* =====================================
   LOAD REPORTS
===================================== */

window.loadReports =
async function(){

  const loading =
    document.getElementById(
      "loading"
    );

  const tableWrap =
    document.getElementById(
      "tableWrap"
    );

  loading.style.display =
    "block";

  tableWrap.style.display =
    "none";

  try{

    const snap =
      await getDocs(
        collection(
          db,
          "communityReports"
        )
      );

    reports = [];

    snap.forEach(
      item => {

        reports.push({

          id:
            item.id,

          ...item.data()

        });

      }
    );


    reports.sort(
      (a,b) => {

        const ad =
          getDate(
            a.createdAt
          );

        const bd =
          getDate(
            b.createdAt
          );

        return bd - ad;

      }
    );


    updateStats();

    renderReports();

    loading.style.display =
      "none";

    tableWrap.style.display =
      "block";

  }
  catch(error){

    console.error(
      "Reports error:",
      error
    );

    loading.innerHTML =
      "Failed to load reports.";

  }

};


/* =====================================
   DATE
===================================== */

function getDate(
  value
){

  if(!value)
    return 0;

  if(
    typeof value.toDate ===
    "function"
  ){

    return value
      .toDate()
      .getTime();

  }

  const date =
    new Date(value);

  return isNaN(
    date.getTime()
  )
    ? 0
    : date.getTime();

}


function formatDate(
  value
){

  const time =
    getDate(value);

  if(!time)
    return "-";

  return new Date(
    time
  ).toLocaleString();

}


/* =====================================
   STATS
===================================== */

function updateStats(){

  const total =
    reports.length;

  const pending =
    reports.filter(
      r =>
        normalize(
          r.status
        ) === "pending"
    ).length;

  const reviewing =
    reports.filter(
      r =>
        normalize(
          r.status
        ) === "reviewing"
    ).length;

  const resolved =
    reports.filter(
      r =>
        normalize(
          r.status
        ) === "resolved"
    ).length;


  document.getElementById(
    "totalReports"
  ).textContent =
    total;

  document.getElementById(
    "pendingReports"
  ).textContent =
    pending;

  document.getElementById(
    "reviewingReports"
  ).textContent =
    reviewing;

  document.getElementById(
    "resolvedReports"
  ).textContent =
    resolved;

}


/* =====================================
   RENDER
===================================== */

window.renderReports =
function(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
    .toLowerCase()
    .trim();

  const status =
    document.getElementById(
      "statusFilter"
    ).value;

  const type =
    document.getElementById(
      "typeFilter"
    ).value;


  const filtered =
    reports.filter(
      report => {

        const text =
          [

            report.reason,
            report.description,
            report.reporterName,
            report.reporterEmail,
            report.targetName,
            report.targetId

          ]
          .map(
            x =>
              String(
                x || ""
              ).toLowerCase()
          )
          .join(" ");


        const reportStatus =
          normalize(
            report.status ||
            "pending"
          );

        const reportType =
          normalize(
            report.type ||
            report.targetType ||
            ""
          );


        return (

          (!search ||
            text.includes(
              search
            ))

          &&

          (!status ||
            reportStatus ===
            status)

          &&

          (!type ||
            reportType ===
            type)

        );

      }
    );


  const body =
    document.getElementById(
      "reportsBody"
    );

  const empty =
    document.getElementById(
      "empty"
    );


  body.innerHTML = "";


  if(!filtered.length){

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  filtered.forEach(
    report => {

      const status =
        normalize(
          report.status ||
          "pending"
        );

      const type =
        normalize(
          report.type ||
          report.targetType ||
          "community"
        );


      const tr =
        document.createElement(
          "tr"
        );


      tr.innerHTML = `

        <td>

          <strong>
            ${escapeHTML(
              report.targetName ||
              report.title ||
              "Community Report"
            )}
          </strong>

          <br>

          <small>
            ${escapeHTML(
              type
            )}
          </small>

        </td>

        <td>

          ${escapeHTML(
            report.reason ||
            report.description ||
            "No reason provided"
          )}

          ${
            report.reporterName
              ? `<br>
                 <small>
                 By ${escapeHTML(
                   report.reporterName
                 )}
                 </small>`
              : ""
          }

        </td>

        <td>

          <span class="badge ${escapeHTML(status)}">

            ${escapeHTML(status)}

          </span>

        </td>

        <td>

          ${formatDate(
            report.createdAt ||
            report.timestamp
          )}

        </td>

        <td>

          <div class="actions">

            <button
              onclick="viewReport('${report.id}')">

              View

            </button>

            ${
              status !== "resolved"
                ? `
                <button
                  class="success"
                  onclick="openResolve('${report.id}')">

                  Resolve

                </button>
                `
                : ""
            }

            <button
              class="danger"
              onclick="deleteReport('${report.id}')">

              Delete

            </button>

          </div>

        </td>

      `;


      body.appendChild(
        tr
      );

    }
  );

};


/* =====================================
   VIEW
===================================== */

window.viewReport =
function(id){

  const report =
    reports.find(
      r => r.id === id
    );

  if(!report)
    return;


  document.getElementById(
    "reportDetails"
  ).innerHTML = `

    <div class="row">
      <strong>Type:</strong><br>
      ${escapeHTML(
        report.type ||
        report.targetType ||
        "-"
      )}
    </div>

    <div class="row">
      <strong>Reason:</strong><br>
      ${escapeHTML(
        report.reason ||
        "-"
      )}
    </div>

    <div class="row">
      <strong>Description:</strong><br>
      ${escapeHTML(
        report.description ||
        "-"
      )}
    </div>

    <div class="row">
      <strong>Reporter:</strong><br>
      ${escapeHTML(
        report.reporterName ||
        report.reporterEmail ||
        report.reporterId ||
        "-"
      )}
    </div>

    <div class="row">
      <strong>Target:</strong><br>
      ${escapeHTML(
        report.targetName ||
        report.targetId ||
        "-"
      )}
    </div>

    <div class="row">
      <strong>Status:</strong><br>
      ${escapeHTML(
        report.status ||
        "pending"
      )}
    </div>

    <div class="row">
      <strong>Date:</strong><br>
      ${formatDate(
        report.createdAt ||
        report.timestamp
      )}
    </div>

    <div class="row">
      <strong>Resolution:</strong><br>
      ${escapeHTML(
        report.resolutionNote ||
        "-"
      )}
    </div>

  `;


  document.getElementById(
    "reportModal"
  ).style.display =
    "flex";

};


/* =====================================
   CLOSE
===================================== */

window.closeModal =
function(){

  document.getElementById(
    "reportModal"
  ).style.display =
    "none";

};


/* =====================================
   OPEN RESOLVE
===================================== */

window.openResolve =
function(id){

  selectedReportId =
    id;

  document.getElementById(
    "resolutionNote"
  ).value = "";

  document.getElementById(
    "resolveModal"
  ).style.display =
    "flex";

};


window.closeResolve =
function(){

  document.getElementById(
    "resolveModal"
  ).style.display =
    "none";

  selectedReportId =
    null;

};


/* =====================================
   RESOLVE
===================================== */

window.saveResolution =
async function(){

  if(!selectedReportId)
    return;


  const note =
    document.getElementById(
      "resolutionNote"
    ).value.trim();


  try{

    await updateDoc(
      doc(
        db,
        "communityReports",
        selectedReportId
      ),
      {

        status:
          "resolved",

        resolutionNote:
          note,

        resolvedAt:
          serverTimestamp()

      }
    );


    alert(
      "Report resolved."
    );


    closeResolve();

    await loadReports();

  }
  catch(error){

    console.error(
      error
    );

    alert(
      "Failed to resolve report."
    );

  }

};


/* =====================================
   CHANGE STATUS
===================================== */

async function changeStatus(
  id,
  status
){

  try{

    await updateDoc(
      doc(
        db,
        "communityReports",
        id
      ),
      {
        status:
          status
      }
    );

    await loadReports();

  }
  catch(error){

    console.error(
      error
    );

  }

}


/* =====================================
   DELETE
===================================== */

window.deleteReport =
async function(id){

  if(
    !confirm(
      "Delete this report permanently?"
    )
  ){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "communityReports",
        id
      )
    );


    alert(
      "Report deleted."
    );


    await loadReports();

  }
  catch(error){

    console.error(
      error
    );

    alert(
      "Failed to delete report."
    );

  }

};


/* =====================================
   NORMALIZE
===================================== */

function normalize(
  value
){

  return String(
    value || ""
  )
  .toLowerCase()
  .trim();

}


/* =====================================
   ESCAPE
===================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================
   START
===================================== */

loadReports();

</script>

</body>
</html>
