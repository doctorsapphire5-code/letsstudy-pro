<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Add Course | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
height:65px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5%;
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:20px;
font-weight:800;
color:#2563eb
}

header a{
text-decoration:none;
color:#475569
}

main{
max-width:1100px;
margin:25px auto;
padding:0 15px 50px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px
}

.top h1{
margin:0;
font-size:25px
}

.top small{
color:#64748b
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:22px;
margin-bottom:18px
}

.card h2{
font-size:17px;
margin:0 0 18px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px
}

.full{
grid-column:1/-1
}

.field label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px
}

input,
textarea,
select{
width:100%;
padding:12px;
border:1px solid #d8dee8;
border-radius:8px;
outline:none;
font:inherit;
background:#fff
}

input:focus,
textarea:focus,
select:focus{
border-color:#2563eb
}

textarea{
min-height:130px;
resize:vertical
}

.help{
display:block;
margin-top:5px;
font-size:11px;
color:#64748b
}

.checkbox{
display:flex;
align-items:center;
gap:8px;
margin-top:25px
}

.checkbox input{
width:auto
}

.actions{
display:flex;
justify-content:flex-end;
gap:9px;
flex-wrap:wrap
}

button{
border:0;
border-radius:8px;
padding:11px 16px;
font-weight:700;
cursor:pointer
}

.cancel{
background:#e5e7eb;
color:#172033
}

.save{
background:#2563eb;
color:#fff
}

.check{
background:#16a34a;
color:#fff
}

.edit{
background:#f59e0b;
color:#fff
}

.preview{
background:#0f172a;
color:#fff
}

#message{
margin-top:15px;
font-size:13px
}

#courseTools{
display:none
}

@media(max-width:700px){

.grid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

.top{
align-items:flex-start;
gap:10px;
flex-direction:column
}

.actions button{
width:100%
}

}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<a href="admin-course.html">
<i class="fa fa-arrow-left"></i>
Courses
</a>

</header>


<main>

<div class="top">

<div>
<h1>Add Course</h1>
<small>Create a new course for LetsStudy Pro LMS</small>
</div>

</div>


<form id="courseForm">


<!-- BASIC INFORMATION -->

<div class="card">

<h2>
<i class="fa fa-book"></i>
Basic Information
</h2>

<div class="grid">

<div class="field full">

<label>Course Title *</label>

<input
id="title"
required
placeholder="Enter course title">

</div>


<div class="field">

<label>Slug</label>

<input
id="slug"
placeholder="course-slug">

<small class="help">
Generated automatically from title
</small>

</div>


<div class="field">

<label>Category *</label>

<input
id="category"
required
placeholder="e.g. Business">

</div>


<div class="field full">

<label>Short Description</label>

<input
id="shortDescription"
placeholder="Short description of the course">

</div>


<div class="field full">

<label>Course Description *</label>

<textarea
id="description"
required
placeholder="Write full course description..."></textarea>

</div>


<div class="field full">

<label>Tags</label>

<input
id="tags"
placeholder="business, marketing, digital">

</div>

</div>

</div>


<!-- COURSE DETAILS -->

<div class="card">

<h2>
<i class="fa fa-circle-info"></i>
Course Details
</h2>

<div class="grid">

<div class="field">

<label>Level</label>

<select id="level">

<option value="beginner">
Beginner
</option>

<option value="intermediate">
Intermediate
</option>

<option value="advanced">
Advanced
</option>

<option value="all">
All Levels
</option>

</select>

</div>


<div class="field">

<label>Language</label>

<input
id="language"
value="English">

</div>


<div class="field">

<label>Duration</label>

<input
id="duration"
placeholder="e.g. 8 weeks">

</div>


<div class="field">

<label>Instructor</label>

<input
id="instructor"
placeholder="Instructor name">

</div>


<div class="field full">

<label>Learning Outcomes</label>

<textarea
id="outcomes"
placeholder="What will students learn?"></textarea>

</div>


<div class="field full">

<label>Requirements</label>

<textarea
id="requirements"
placeholder="Course requirements"></textarea>

</div>


<div class="field full">

<label>Target Audience</label>

<textarea
id="targetAudience"
placeholder="Who is this course for?"></textarea>

</div>

</div>

</div>


<!-- MEDIA -->

<div class="card">

<h2>
<i class="fa fa-image"></i>
Course Media
</h2>

<div class="grid">

<div class="field full">

<label>Thumbnail URL</label>

<input
id="thumbnail"
type="url"
placeholder="https://example.com/course.jpg">

</div>


<div class="field">

<label>Cover Image URL</label>

<input
id="coverImage"
type="url"
placeholder="https://...">

</div>


<div class="field">

<label>Preview Video URL</label>

<input
id="previewVideo"
type="url"
placeholder="https://...">

</div>

</div>

</div>


<!-- PRICING -->

<div class="card">

<h2>
<i class="fa fa-money-bill"></i>
Pricing
</h2>

<div class="grid">

<div class="field">

<label>Course Type</label>

<select id="type">

<option value="free">
Free
</option>

<option value="paid">
Paid
</option>

</select>

</div>


<div class="field">

<label>Currency</label>

<select id="currency">

<option value="TZS">
TZS
</option>

<option value="USD">
USD
</option>

</select>

</div>


<div class="field">

<label>Price</label>

<input
id="price"
type="number"
min="0"
value="0">

</div>


<div class="field">

<label>Discount Price</label>

<input
id="discountPrice"
type="number"
min="0"
value="0">

</div>

</div>

</div>


<!-- PUBLISH -->

<div class="card">

<h2>
<i class="fa fa-gear"></i>
Publishing
</h2>

<div class="grid">

<div class="field">

<label>Status</label>

<select id="status">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>

</div>


<div class="checkbox">

<input
id="featured"
type="checkbox">

<label for="featured">
Featured Course
</label>

</div>

</div>

</div>


<!-- ACTIONS -->

<div class="card">

<div class="actions">

<button
type="button"
class="cancel"
onclick="location.href='admin-course.html'">

Cancel

</button>


<button
type="button"
class="check"
id="checkBtn"
style="display:none">

<i class="fa fa-check"></i>
Check

</button>


<button
type="button"
class="edit"
id="editBtn"
style="display:none">

<i class="fa fa-pen"></i>
Edit

</button>


<button
type="button"
class="preview"
id="previewBtn"
style="display:none">

<i class="fa fa-eye"></i>
Preview

</button>


<button
type="submit"
class="save">

<i class="fa fa-floppy-disk"></i>
Save Course

</button>

</div>

<div id="message"></div>

</div>


</form>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getFirestore,
collection,
addDoc,
serverTimestamp,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* HELPERS */

const $=id=>
document.getElementById(id);

let courseId=null;


/* EDIT MODE */

const params=
new URLSearchParams(
location.search
);

courseId=params.get("id");


/* SLUG */

$("title").addEventListener(
"input",
()=>{

if(!$("slug").dataset.manual){

$("slug").value=
slugify($("title").value);

}

});


$("slug").addEventListener(
"input",
()=>{

$("slug").dataset.manual="true";

});


function slugify(value){

return value
.toLowerCase()
.trim()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");

}


/* LOAD COURSE FOR EDIT */

async function loadCourse(){

if(!courseId)return;

try{

const snap=
await getDoc(
doc(db,"courses",courseId)
);

if(!snap.exists()){

$("message").textContent=
"Course not found.";

return;

}

const c=snap.data();

$("title").value=c.title||"";
$("slug").value=c.slug||"";
$("category").value=c.category||"";
$("shortDescription").value=
c.shortDescription||"";
$("description").value=
c.description||"";
$("tags").value=
Array.isArray(c.tags)
?c.tags.join(", ")
:c.tags||"";

$("level").value=
c.level||"beginner";

$("language").value=
c.language||"English";

$("duration").value=
c.duration||"";

$("instructor").value=
c.instructor||"";

$("outcomes").value=
Array.isArray(c.outcomes)
?c.outcomes.join("\n")
:c.outcomes||"";

$("requirements").value=
Array.isArray(c.requirements)
?c.requirements.join("\n")
:c.requirements||"";

$("targetAudience").value=
c.targetAudience||"";

$("thumbnail").value=
c.thumbnail||"";

$("coverImage").value=
c.coverImage||"";

$("previewVideo").value=
c.previewVideo||"";

$("type").value=
c.type||"free";

$("currency").value=
c.currency||"TZS";

$("price").value=
c.price||0;

$("discountPrice").value=
c.discountPrice||0;

$("status").value=
c.status||"draft";

$("featured").checked=
!!c.featured;


/* BUTTONS */

$("checkBtn").style.display=
"inline-block";

$("editBtn").style.display=
"inline-block";

$("previewBtn").style.display=
"inline-block";

$("editBtn").disabled=true;

$("message").textContent=
"Editing existing course.";

$("message").style.color=
"#2563eb";

}catch(error){

console.error(error);

}

}


/* SAVE COURSE */

$("courseForm").addEventListener(
"submit",
async e=>{

e.preventDefault();


const title=
$("title").value.trim();

const description=
$("description").value.trim();

const category=
$("category").value.trim();


if(!title||
!description||
!category){

$("message").textContent=
"Please fill all required fields.";

$("message").style.color=
"#dc2626";

return;

}


const tags=
$("tags").value
.split(",")
.map(x=>x.trim())
.filter(Boolean);


const outcomes=
$("outcomes").value
.split("\n")
.map(x=>x.trim())
.filter(Boolean);


const requirements=
$("requirements").value
.split("\n")
.map(x=>x.trim())
.filter(Boolean);


const data={

title,

slug:$("slug").value.trim()||
slugify(title),

shortDescription:
$("shortDescription").value.trim(),

description,

category,

tags,

level:$("level").value,

language:
$("language").value.trim(),

duration:
$("duration").value.trim(),

instructor:
$("instructor").value.trim(),

outcomes,

requirements,

targetAudience:
$("targetAudience").value.trim(),

thumbnail:
$("thumbnail").value.trim(),

coverImage:
$("coverImage").value.trim(),

previewVideo:
$("previewVideo").value.trim(),

type:$("type").value,

price:
Number($("price").value||0),

discountPrice:
Number($("discountPrice").value||0),

currency:$("currency").value,

status:$("status").value,

featured:
$("featured").checked,

updatedAt:
serverTimestamp()

};


try{

$("message").textContent=
"Saving course...";

$("message").style.color=
"#2563eb";


if(courseId){

/*
  EDIT MODE
  Put your updateDoc here
  if you want direct editing.
*/

alert(
"Course exists. Use Edit Course page for updating."
);

}else{

data.createdBy="admin";

data.createdAt=
serverTimestamp();

data.enrollmentCount=0;

data.rating=0;

data.ratingCount=0;

data.publishedAt=
data.status==="published"
?serverTimestamp()
:null;


const ref=
await addDoc(
collection(db,"courses"),
data
);

courseId=ref.id;


$("message").textContent=
"Course created successfully.";

$("message").style.color=
"#16a34a";


$("checkBtn").style.display=
"inline-block";

$("editBtn").style.display=
"inline-block";

$("previewBtn").style.display=
"inline-block";


/*
 Save ID for actions
*/

$("editBtn").onclick=()=>{
location.href=
`edit-course.html?id=${courseId}`;
};

$("previewBtn").onclick=()=>{
location.href=
`course.html?id=${courseId}`;
};

$("checkBtn").onclick=()=>{
location.href=
`course-check.html?id=${courseId}`;
};

}

}catch(error){

console.error(error);

$("message").textContent=
error.message||
"Failed to save course.";

$("message").style.color=
"#dc2626";

}

});


loadCourse();

</script>

</body>
</html>
