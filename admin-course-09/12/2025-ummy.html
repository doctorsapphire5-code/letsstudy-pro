<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Courses | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7fb;
 color:#172033
}
header{
 background:#07111f;
 color:white;
 padding:16px 5%;
 display:flex;
 justify-content:space-between;
 align-items:center
}
.logo{font-size:21px;font-weight:800}
.logo span{color:#22d3ee}
.container{width:min(1200px,94%);margin:25px auto}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px
}
.stat,.card{
 background:white;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:18px
}
.stat b{
 display:block;
 font-size:25px;
 margin-top:5px
}
.toolbar{
 display:flex;
 gap:10px;
 margin:18px 0;
 flex-wrap:wrap
}
.toolbar input{flex:1}
input,textarea,select{
 width:100%;
 padding:11px;
 border:1px solid #d9e0e8;
 border-radius:8px;
 font:inherit
}
textarea{min-height:100px}
button{
 border:0;
 padding:10px 14px;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold
}
.primary{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.gray{background:#e5e7eb;color:#172033}
.form{display:none;margin-bottom:20px}
.form.show{display:block}
.row{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}
.field{margin-bottom:12px}
.field label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-bottom:5px
}
table{
 width:100%;
 border-collapse:collapse
}
th,td{
 padding:12px;
 border-bottom:1px solid #edf0f3;
 text-align:left;
 font-size:13px
}
.thumb{
 width:55px;
 height:42px;
 object-fit:cover;
 border-radius:7px
}
.actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap
}
.badge{
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 background:#e5e7eb
}
.pub{background:#dcfce7;color:#166534}
.feat{background:#fef3c7;color:#92400e}
@media(max-width:800px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .row{grid-template-columns:1fr}
 .tableWrap{overflow:auto}
}
</style>
</head>

<body>

<header>
<div class="logo">LetsStudy <span>Pro</span></div>
<b>Admin Course</b>
</header>

<div class="container">

<h1>Course Management</h1>

<div class="stats">
<div class="stat">
Total Courses
<b id="total">0</b>
</div>

<div class="stat">
Published
<b id="published">0</b>
</div>

<div class="stat">
Drafts
<b id="drafts">0</b>
</div>

<div class="stat">
Featured
<b id="featured">0</b>
</div>
</div>

<div class="toolbar">

<input id="search"
placeholder="Search courses..."
oninput="render()">

<select id="statusFilter"
onchange="render()">
<option value="">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>

<button class="primary"
onclick="openForm()">
<i class="fa fa-plus"></i>
Add Course
</button>

</div>


<!-- ================= FORM ================= -->

<div id="form" class="card form">

<h2 id="formTitle">Add Course</h2>

<input type="hidden" id="courseId">

<div class="row">

<div class="field">
<label>Title</label>
<input id="title">
</div>

<div class="field">
<label>Slug</label>
<input id="slug">
</div>

<div class="field">
<label>Short Description</label>
<input id="shortDescription">
</div>

<div class="field">
<label>Category</label>
<input id="category">
</div>

<div class="field">
<label>Subcategory</label>
<input id="subcategory">
</div>

<div class="field">
<label>Instructor ID</label>
<input id="instructorId">
</div>

<div class="field">
<label>Instructor Name</label>
<input id="instructorName">
</div>

<div class="field">
<label>Level</label>
<select id="level">
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
<option>All Levels</option>
</select>
</div>

<div class="field">
<label>Language</label>
<input id="language" value="English">
</div>

<div class="field">
<label>Duration</label>
<input id="duration" placeholder="10 hours">
</div>

<div class="field">
<label>Thumbnail URL</label>
<input id="thumbnail">
</div>

<div class="field">
<label>Preview Video URL</label>
<input id="previewVideo">
</div>

<div class="field">
<label>Price</label>
<input id="price" type="number" value="0">
</div>

<div class="field">
<label>Discount Price</label>
<input id="discountPrice" type="number" value="0">
</div>

<div class="field">
<label>Currency</label>
<input id="currency" value="TZS">
</div>

</div>

<div class="field">
<label>Description</label>
<textarea id="description"></textarea>
</div>

<div class="row">

<div class="field">
<label>Requirements</label>
<textarea id="requirements"></textarea>
</div>

<div class="field">
<label>What You Learn</label>
<textarea id="whatYouLearn"></textarea>
</div>

<div class="field">
<label>Target Audience</label>
<textarea id="targetAudience"></textarea>
</div>

<div class="field">
<label>Tags</label>
<input id="tags"
placeholder="business, marketing, SEO">
</div>

</div>

<div class="row">

<label>
<input type="checkbox" id="isFree">
Free Course
</label>

<label>
<input type="checkbox" id="certificate">
Certificate
</label>

<label>
<input type="checkbox" id="featuredCheck">
Featured
</label>

<label>
<input type="checkbox" id="publishedCheck">
Published
</label>

</div>

<br>

<button class="primary"
onclick="saveCourse()">
<i class="fa fa-save"></i>
Save Course
</button>

<button class="gray"
onclick="closeForm()">
Cancel
</button>

</div>


<!-- ================= TABLE ================= -->

<div class="card">

<div class="tableWrap">

<table>

<thead>
<tr>
<th>Course</th>
<th>Category</th>
<th>Level</th>
<th>Price</th>
<th>Content</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

</div>


<script type="module">

import{
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import{
 getFirestore,
 collection,
 getDocs,
 addDoc,
 doc,
 updateDoc,
 deleteDoc,
 serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

let courses=[];


/* ================= HELPERS ================= */

const $=id=>document.getElementById(id);

const value=id=>
$(id).value.trim();

function arrayValue(id){

return value(id)
.split("\n")
.map(x=>x.trim())
.filter(Boolean);

}

function escapeHtml(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function makeSlug(text){

return String(text||"")
.toLowerCase()
.trim()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");

}


/* ================= LOAD ================= */

async function loadCourses(){

try{

const snap=
await getDocs(
collection(db,"courses")
);

courses=
snap.docs.map(d=>({
id:d.id,
...d.data()
}));

render();

}catch(error){

console.error(error);

alert(
"Unable to load courses: "+
error.message
);

}

}


/* ================= RENDER ================= */

window.render=function(){

const search=
value("search").toLowerCase();

const filter=
$("statusFilter").value;

const data=
courses.filter(c=>{

const text=
`${c.title||""} ${c.category||""}`
.toLowerCase();

const status=
c.published||
c.status==="published"
?"published":"draft";

return text.includes(search)&&
(!filter||filter===status);

});


$("total").textContent=
courses.length;

$("published").textContent=
courses.filter(c=>
c.published||
c.status==="published"
).length;

$("drafts").textContent=
courses.filter(c=>
!c.published&&
c.status!=="published"
).length;

$("featured").textContent=
courses.filter(c=>c.featured).length;


$("table").innerHTML=
data.length

?data.map(c=>{

const status=
c.published||
c.status==="published";

return`

<tr>

<td>

<div style="
display:flex;
gap:9px;
align-items:center">

<img class="thumb"
src="${escapeHtml(
c.thumbnail||
"https://via.placeholder.com/100"
)}"
onerror="
this.src='https://via.placeholder.com/100'
">

<div>

<b>
${escapeHtml(
c.title||"Untitled Course"
)}
</b>

<br>

<small>
${escapeHtml(
c.instructorName||
"No instructor"
)}
</small>

</div>

</div>

</td>

<td>
${escapeHtml(c.category||"-")}
</td>

<td>
${escapeHtml(c.level||"-")}
</td>

<td>

${
c.isFree||Number(c.price||0)===0

?"Free"

:

`${escapeHtml(
c.currency||"TZS"
)}
${Number(
c.discountPrice||c.price
).toLocaleString()}`

}

</td>

<td>
${c.modulesCount||0} modules<br>
${c.lessonsCount||0} lessons
</td>

<td>

<span class="badge ${status?"pub":""}">
${status?"Published":"Draft"}
</span>

${c.featured?

`<span class="badge feat">
Featured
</span>`:""}

</td>

<td>

<div class="actions">

<button class="gray"
onclick="editCourse('${c.id}')">
<i class="fa fa-edit"></i>
</button>

<button class="primary"
onclick="previewCourse('${c.id}')">
<i class="fa fa-eye"></i>
</button>

<button class="green"
onclick="togglePublish(
'${c.id}',
${status}
)">
<i class="fa fa-upload"></i>
</button>

<button class="gray"
onclick="toggleFeatured(
'${c.id}',
${!!c.featured}
)">
<i class="fa fa-star"></i>
</button>

<button class="danger"
onclick="deleteCourse('${c.id}')">
<i class="fa fa-trash"></i>
</button>

</div>

</td>

</tr>

`;

}).join("")

:

`<tr>
<td colspan="7"
style="text-align:center;padding:30px">
No courses found.
</td>
</tr>`;

};


/* ================= FORM ================= */

window.openForm=function(){

clearForm();

$("formTitle").textContent=
"Add Course";

$("form").classList.add("show");

window.scrollTo({
top:0,
behavior:"smooth"
});

};

window.closeForm=function(){

$("form").classList.remove("show");

};

function clearForm(){

$("courseId").value="";
$("title").value="";
$("slug").value="";
$("shortDescription").value="";
$("description").value="";
$("category").value="";
$("subcategory").value="";
$("instructorId").value="";
$("instructorName").value="";
$("level").value="Beginner";
$("language").value="English";
$("duration").value="";
$("thumbnail").value="";
$("previewVideo").value="";
$("price").value=0;
$("discountPrice").value=0;
$("currency").value="TZS";
$("requirements").value="";
$("whatYouLearn").value="";
$("targetAudience").value="";
$("tags").value="";

$("isFree").checked=false;
$("certificate").checked=false;
$("featuredCheck").checked=false;
$("publishedCheck").checked=false;

}


/* ================= SAVE ================= */

window.saveCourse=async function(){

const id=value("courseId");

const title=value("title");

if(!title){

alert("Course title is required.");
return;

}

const slug=
value("slug")||
makeSlug(title);


const old=
courses.find(c=>c.id===id);


const published=
$("publishedCheck").checked;


const data={

title,

slug,

shortDescription:
value("shortDescription"),

description:
value("description"),

thumbnail:
value("thumbnail"),

previewVideo:
value("previewVideo"),

instructorId:
value("instructorId"),

instructorName:
value("instructorName"),

category:
value("category"),

subcategory:
value("subcategory"),

level:
$("level").value,

language:
value("language"),

duration:
value("duration"),

lessonsCount:
old?.lessonsCount||0,

modulesCount:
old?.modulesCount||0,

price:
Number(value("price")||0),

discountPrice:
Number(value("discountPrice")||0),

currency:
value("currency")||"TZS",

isFree:
$("isFree").checked,

certificate:
$("certificate").checked,

requirements:
arrayValue("requirements"),

whatYouLearn:
arrayValue("whatYouLearn"),

targetAudience:
value("targetAudience"),

tags:
value("tags")
.split(",")
.map(x=>x.trim())
.filter(Boolean),

status:
published?"published":"draft",

published,

featured:
$("featuredCheck").checked,

rating:
old?.rating||0,

ratingCount:
old?.ratingCount||0,

enrollmentCount:
old?.enrollmentCount||0,

views:
old?.views||0,

updatedAt:
serverTimestamp()

};


try{

if(id){

await updateDoc(
doc(db,"courses",id),
data
);

alert("Course updated successfully.");

}else{

data.createdBy="admin";

data.createdAt=
serverTimestamp();

if(published){

data.publishedAt=
serverTimestamp();

}

await addDoc(
collection(db,"courses"),
data
);

alert("Course created successfully.");

}

closeForm();

await loadCourses();

}catch(error){

console.error(error);

alert(error.message);

}

};


/* ================= EDIT ================= */

window.editCourse=function(id){

const c=
courses.find(x=>x.id===id);

if(!c)return;

openForm();

$("formTitle").textContent=
"Edit Course";

$("courseId").value=id;

$("title").value=c.title||"";
$("slug").value=c.slug||"";
$("shortDescription").value=
c.shortDescription||"";
$("description").value=
c.description||"";
$("thumbnail").value=
c.thumbnail||"";
$("previewVideo").value=
c.previewVideo||"";
$("instructorId").value=
c.instructorId||"";
$("instructorName").value=
c.instructorName||"";
$("category").value=
c.category||"";
$("subcategory").value=
c.subcategory||"";
$("level").value=
c.level||"Beginner";
$("language").value=
c.language||"English";
$("duration").value=
c.duration||"";
$("price").value=
c.price||0;
$("discountPrice").value=
c.discountPrice||0;
$("currency").value=
c.currency||"TZS";

$("isFree").checked=
!!c.isFree;

$("certificate").checked=
!!c.certificate;

$("featuredCheck").checked=
!!c.featured;

$("publishedCheck").checked=
!!c.published;

$("requirements").value=
Array.isArray(c.requirements)
?c.requirements.join("\n")
:c.requirements||"";

$("whatYouLearn").value=
Array.isArray(c.whatYouLearn)
?c.whatYouLearn.join("\n")
:c.whatYouLearn||"";

$("targetAudience").value=
c.targetAudience||"";

$("tags").value=
Array.isArray(c.tags)
?c.tags.join(", ")
:c.tags||"";

};


/* ================= PREVIEW ================= */

window.previewCourse=function(id){

if(!id){

alert("Course ID missing.");
return;

}

localStorage.setItem(
"selectedCourseId",
id
);

window.location.href=
"course.html";

};


/* ================= DELETE ================= */

window.deleteCourse=async function(id){

if(!confirm(
"Delete this course permanently?"
))return;

try{

await deleteDoc(
doc(db,"courses",id)
);

alert("Course deleted.");

await loadCourses();

}catch(error){

alert(error.message);

}

};


/* ================= PUBLISH ================= */

window.togglePublish=
async function(id,current){

try{

const data={

published:!current,

status:
!current?"published":"draft",

updatedAt:
serverTimestamp()

};

if(!current){

data.publishedAt=
serverTimestamp();

}

await updateDoc(
doc(db,"courses",id),
data
);

await loadCourses();

}catch(error){

alert(error.message);

}

};


/* ================= FEATURED ================= */

window.toggleFeatured=
async function(id,current){

try{

await updateDoc(

doc(db,"courses",id),

{
featured:!current,
updatedAt:serverTimestamp()
}

);

await loadCourses();

}catch(error){

alert(error.message);

}

};


/* ================= START ================= */

loadCourses();

</script>

</body>
</html>
