<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Courses | LetsStudy Pro</title>

<meta name="description"
content="LetsStudy Pro administrator course management dashboard.">

<meta name="robots" content="noindex,nofollow">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

header b{
  font-size:20px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 10px #0001;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card strong{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

input,
select,
textarea,
button{
  font:inherit;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d5d9e2;
  border-radius:8px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

.search{
  flex:1;
  min-width:220px;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.danger{
  background:#dc2626;
  color:white;
}

.success{
  background:#16a34a;
  color:white;
}

.warning{
  background:#d97706;
  color:white;
}

.small{
  padding:7px 9px;
  font-size:13px;
  margin:2px;
}

.table-wrap{
  overflow:auto;
  background:white;
  border-radius:12px;
  box-shadow:0 2px 10px #0001;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th,
td{
  text-align:left;
  padding:13px;
  border-bottom:1px solid #eee;
  vertical-align:middle;
}

th{
  background:#f9fafb;
}

.badge{
  padding:5px 8px;
  border-radius:20px;
  font-size:12px;
  display:inline-block;
}

.green{
  background:#dcfce7;
  color:#166534;
}

.red{
  background:#fee2e2;
  color:#991b1b;
}

.blue{
  background:#dbeafe;
  color:#1e40af;
}

.orange{
  background:#ffedd5;
  color:#9a3412;
}

.status-box{
  margin-bottom:20px;
  padding:14px;
  border-radius:10px;
  display:none;
}

.status-box.show{
  display:block;
}

.status-info{
  background:#dbeafe;
  color:#1e40af;
}

.status-error{
  background:#fee2e2;
  color:#991b1b;
}

.status-success{
  background:#dcfce7;
  color:#166534;
}

#adminApp{
  display:block;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:700px;
  max-width:100%;
  max-height:95vh;
  overflow:auto;
  border-radius:14px;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  font-weight:bold;
  display:block;
  margin-bottom:5px;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  padding:30px;
  color:#6b7280;
}

.loading{
  text-align:center;
  padding:25px;
}

.preview{
  width:100%;
  border:0;
  border-radius:10px;
  min-height:500px;
  background:white;
}

.thumbnail-preview{
  width:70px;
  height:50px;
  object-fit:cover;
  border-radius:7px;
  background:#eee;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  header{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>

  <div>
    <b>📚 LetsStudy Pro</b>
    <div style="font-size:13px;opacity:.9">
      Admin Course Management
    </div>
  </div>

  <div class="actions">

    <button
      id="dashboardBtn"
      class="secondary"
      type="button">
      Admin Dashboard
    </button>

  </div>

</header>


<div
  id="adminApp"
  class="container">

  <div
    id="statusBox"
    class="status-box">
  </div>


  <h2>Course Management</h2>


  <div class="stats">

    <div class="card">
      Total Courses
      <strong id="total">0</strong>
    </div>

    <div class="card">
      Published
      <strong id="published">0</strong>
    </div>

    <div class="card">
      Drafts
      <strong id="drafts">0</strong>
    </div>

    <div class="card">
      Featured
      <strong id="featured">0</strong>
    </div>

  </div>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="Search courses, category, instructor...">

    <select id="status">

      <option value="all">All Status</option>
      <option value="published">Published</option>
      <option value="draft">Draft</option>

    </select>


    <select id="access">

      <option value="all">All Access</option>
      <option value="free">Free</option>
      <option value="paid">Paid</option>

    </select>


    <button
      id="addCourseBtn"
      class="primary"
      type="button">
      + Add Course
    </button>

  </div>


  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>Course</th>
          <th>Category</th>
          <th>Access</th>
          <th>Price</th>
          <th>Status</th>
          <th>Featured</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="courses">

        <tr>
          <td
            colspan="7"
            class="loading">
            Loading courses...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>


<!-- COURSE MODAL -->

<div
  id="modal"
  class="modal">

  <div class="modal-box">

    <h2 id="modalTitle">
      Add Course
    </h2>


    <form id="form">

      <input
        type="hidden"
        id="courseId">


      <div class="grid">

        <div class="full">

          <label>Course Title *</label>

          <input
            id="title"
            required
            maxlength="200">

        </div>


        <div>

          <label>Category</label>

          <input
            id="category"
            placeholder="Physics, Business, IT..."
            maxlength="100">

        </div>


        <div>

          <label>Level</label>

          <select id="level">

            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>

          </select>

        </div>


        <div>

          <label>Access Type</label>

          <select id="accessType">

            <option value="free">Free</option>
            <option value="paid">Paid</option>

          </select>

        </div>


        <div>

          <label>Price</label>

          <input
            id="price"
            type="number"
            min="0"
            step="1"
            placeholder="0">

        </div>


        <div class="full">

          <label>Short Description</label>

          <textarea
            id="description"
            rows="4"
            maxlength="1000"></textarea>

        </div>


        <div class="full">

          <label>Thumbnail URL</label>

          <input
            id="thumbnail"
            type="url"
            placeholder="https://...">

        </div>


        <div>

          <label>Instructor</label>

          <input
            id="instructorName"
            maxlength="150">

        </div>


        <div>

          <label>Language</label>

          <input
            id="language"
            value="English"
            maxlength="50">

        </div>


        <div>

          <label>Certificate</label>

          <select id="certificate">

            <option value="false">No</option>
            <option value="true">Yes</option>

          </select>

        </div>


        <div>

          <label>Featured</label>

          <select id="isFeatured">

            <option value="false">No</option>
            <option value="true">Yes</option>

          </select>

        </div>


        <div>

          <label>Published</label>

          <select id="isPublished">

            <option value="true">Published</option>
            <option value="false">Draft</option>

          </select>

        </div>

      </div>


      <br>


      <div class="actions">

        <button
          id="saveBtn"
          type="submit"
          class="primary">
          Save Course
        </button>

        <button
          id="cancelBtn"
          type="button"
          class="secondary">
          Cancel
        </button>

      </div>

    </form>

  </div>

</div>


<!-- PREVIEW MODAL -->

<div
  id="previewModal"
  class="modal">

  <div class="modal-box">

    <h2>Course Preview</h2>

    <div id="previewContent"></div>

    <br>

    <button
      id="closePreview"
      class="secondary"
      type="button">
      Close
    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsRgI_0rj0rodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   STATE
========================= */

let courses = [];

let editing = null;


/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showStatus(
  message,
  type="info"
){

  const box =
    $("statusBox");

  box.textContent =
    message;

  box.className =
    "status-box show status-" +
    type;

}


function accessType(course){

  if(course?.isFree === true)
    return "free";

  if(course?.accessType){

    return String(
      course.accessType
    ).toLowerCase() === "free"
      ? "free"
      : "paid";

  }

  if(course?.premium === true)
    return "paid";

  if(course?.isPremium === true)
    return "paid";

  if(course?.paid === true)
    return "paid";

  return Number(
    course?.price || 0
  ) > 0
    ? "paid"
    : "free";

}


function coursePrice(course){

  if(
    accessType(course) === "free"
  ){

    return "Free";

  }

  const amount =
    Number(
      course?.discountPrice ??
      course?.price ??
      0
    );

  return (
    course?.currency ||
    "TZS"
  ) +
  " " +
  amount.toLocaleString();

}


/* =========================
   RENDER
========================= */

function render(){

  const search =
    $("search")
      .value
      .trim()
      .toLowerCase();

  const status =
    $("status").value;

  const access =
    $("access").value;


  const list =
    courses.filter(course => {

      const text = [

        course.title,
        course.category,
        course.instructorName,
        course.description,
        course.level

      ]
      .map(value =>
        String(value ?? "")
      )
      .join(" ")
      .toLowerCase();


      if(
        search &&
        !text.includes(search)
      ){

        return false;

      }


      const courseStatus =
        course.published === true
          ? "published"
          : "draft";


      if(
        status !== "all" &&
        status !== courseStatus
      ){

        return false;

      }


      if(
        access !== "all" &&
        access !== accessType(course)
      ){

        return false;

      }


      return true;

    });


  $("total").textContent =
    courses.length;

  $("published").textContent =
    courses.filter(
      c => c.published === true
    ).length;

  $("drafts").textContent =
    courses.filter(
      c => c.published !== true
    ).length;

  $("featured").textContent =
    courses.filter(
      c => c.featured === true
    ).length;


  if(!list.length){

    $("courses").innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          No courses found.
        </td>
      </tr>
    `;

    return;

  }


  $("courses").innerHTML =
    list.map(course => {

      const paid =
        accessType(course) === "paid";


      return `

        <tr>

          <td>

            <strong>
              ${esc(
                course.title ||
                "Untitled Course"
              )}
            </strong>

            <br>

            <small>
              ${esc(
                course.instructorName ||
                "No instructor"
              )}
            </small>

          </td>


          <td>
            ${esc(
              course.category ||
              "General"
            )}
          </td>


          <td>

            <span class="badge ${
              paid
                ? "blue"
                : "green"
            }">

              ${
                paid
                  ? "Paid"
                  : "Free"
              }

            </span>

          </td>


          <td>
            ${esc(
              coursePrice(course)
            )}
          </td>


          <td>

            <span class="badge ${
              course.published
                ? "green"
                : "red"
            }">

              ${
                course.published
                  ? "Published"
                  : "Draft"
              }

            </span>

          </td>


          <td>

            ${
              course.featured
                ? '<span class="badge orange">⭐ Featured</span>'
                : "No"
            }

          </td>


          <td>

            <div class="actions">

              <button
                class="small"
                data-action="edit"
                data-id="${esc(course.id)}"
                type="button">
                ✏️ Edit
              </button>


              <button
                class="small"
                data-action="publish"
                data-id="${esc(course.id)}"
                type="button">

                ${
                  course.published
                    ? "Unpublish"
                    : "Publish"
                }

              </button>


              <button
                class="small"
                data-action="featured"
                data-id="${esc(course.id)}"
                type="button">

                ${
                  course.featured
                    ? "Unfeature"
                    : "Feature"
                }

              </button>


              <button
                class="small"
                data-action="preview"
                data-id="${esc(course.id)}"
                type="button">

                👁 Preview

              </button>


              <button
                class="small danger"
                data-action="delete"
                data-id="${esc(course.id)}"
                type="button">

                Delete

              </button>

            </div>

          </td>

        </tr>

      `;

    }).join("");

}


/* =========================
   LOAD COURSES
========================= */

async function loadCourses(){

  $("courses").innerHTML = `
    <tr>
      <td colspan="7" class="loading">
        Loading courses...
      </td>
    </tr>
  `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "courses"
        )
      );


    courses =
      snapshot.docs.map(item => ({
        id:item.id,
        ...item.data()
      }));


    render();


    showStatus(
      `${courses.length} course(s) loaded successfully.`,
      "success"
    );


  }catch(error){

    console.error(
      "Load courses error:",
      error
    );


    $("courses").innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          ${esc(error.message)}
        </td>
      </tr>
    `;


    showStatus(
      "Failed to load courses: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   OPEN MODAL
========================= */

function openModal(course=null){

  editing = course;


  $("modal").classList.add(
    "show"
  );


  $("modalTitle").textContent =
    course
      ? "Edit Course"
      : "Add Course";


  $("courseId").value =
    course?.id || "";

  $("title").value =
    course?.title || "";

  $("category").value =
    course?.category || "";

  $("level").value =
    course?.level || "Beginner";

  $("accessType").value =
    accessType(course || {});

  $("price").value =
    course?.price ?? "";

  $("description").value =
    course?.description || "";

  $("thumbnail").value =
    course?.thumbnail ||
    course?.thumbnailUrl ||
    "";

  $("instructorName").value =
    course?.instructorName || "";

  $("language").value =
    course?.language || "English";

  $("certificate").value =
    String(
      course?.certificate === true
    );

  $("isFeatured").value =
    String(
      course?.featured === true
    );

  $("isPublished").value =
    String(
      course?.published === true
    );

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  $("modal")
    .classList
    .remove("show");

  editing = null;

  $("form").reset();

  $("language").value =
    "English";

}


/* =========================
   SAVE COURSE
========================= */

$("form").addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const saveBtn =
      $("saveBtn");

    saveBtn.disabled = true;

    saveBtn.textContent =
      "Saving...";


    try{

      const title =
        $("title")
          .value
          .trim();


      if(!title){

        throw new Error(
          "Course title is required."
        );

      }


      const access =
        $("accessType").value;


      const price =
        access === "paid"
          ? Number(
              $("price").value || 0
            )
          : 0;


      const data = {

        title,

        category:
          $("category")
            .value
            .trim(),

        level:
          $("level").value,

        accessType:
          access,

        isFree:
          access === "free",

        premium:
          access === "paid",

        isPremium:
          access === "paid",

        paid:
          access === "paid",

        price,

        currency:
          "TZS",

        description:
          $("description")
            .value
            .trim(),

        thumbnail:
          $("thumbnail")
            .value
            .trim(),

        thumbnailUrl:
          $("thumbnail")
            .value
            .trim(),

        instructorName:
          $("instructorName")
            .value
            .trim(),

        language:
          $("language")
            .value
            .trim() ||
          "English",

        certificate:
          $("certificate").value ===
          "true",

                featured:
          $("isFeatured").value ===
          "true",

        published:
          $("isPublished").value ===
          "true",

        updatedAt:
          serverTimestamp()

      };


      /* =========================
         CREATE / UPDATE
      ========================= */

      if(editing){

        await updateDoc(
          doc(
            db,
            "courses",
            editing.id
          ),
          data
        );

        showStatus(
          "Course updated successfully.",
          "success"
        );

      }else{

        data.createdAt =
          serverTimestamp();

        await addDoc(
          collection(
            db,
            "courses"
          ),
          data
        );

        showStatus(
          "Course created successfully.",
          "success"
        );

      }


      closeModal();

      await loadCourses();


    }catch(error){

      console.error(
        "Save course error:",
        error
      );

      showStatus(
        "Failed to save course: " +
        error.message,
        "error"
      );

    }finally{

      saveBtn.disabled = false;

      saveBtn.textContent =
        "Save Course";

    }

  }
);


/* =========================
   TABLE ACTIONS
========================= */

$("courses").addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );

    if(!button) return;


    const id =
      button.dataset.id;

    const action =
      button.dataset.action;


    const course =
      courses.find(
        c => c.id === id
      );


    if(!course) return;


    try{

      /* EDIT */

      if(action === "edit"){

        openModal(course);

        return;

      }


      /* PREVIEW */

      if(action === "preview"){

        previewCourse(course);

        return;

      }


      /* PUBLISH / UNPUBLISH */

      if(action === "publish"){

        const newStatus =
          course.published !== true;


        await updateDoc(
          doc(
            db,
            "courses",
            id
          ),
          {
            published:
              newStatus,

            updatedAt:
              serverTimestamp()
          }
        );


        showStatus(
          newStatus
            ? "Course published successfully."
            : "Course unpublished successfully.",
          "success"
        );


        await loadCourses();

        return;

      }


      /* FEATURE / UNFEATURE */

      if(action === "featured"){

        const newFeatured =
          course.featured !== true;


        await updateDoc(
          doc(
            db,
            "courses",
            id
          ),
          {
            featured:
              newFeatured,

            updatedAt:
              serverTimestamp()
          }
        );


        showStatus(
          newFeatured
            ? "Course featured successfully."
            : "Course unfeatured successfully.",
          "success"
        );


        await loadCourses();

        return;

      }


      /* DELETE */

      if(action === "delete"){

        const confirmed =
          confirm(
            `Delete "${course.title || "this course"}"? This action cannot be undone.`
          );


        if(!confirmed) return;


        await deleteDoc(
          doc(
            db,
            "courses",
            id
          )
        );


        showStatus(
          "Course deleted successfully.",
          "success"
        );


        await loadCourses();

      }

    }catch(error){

      console.error(
        "Course action error:",
        error
      );


      showStatus(
        "Action failed: " +
        error.message,
        "error"
      );

    }

  }
);


/* =========================
   PREVIEW COURSE
========================= */

function previewCourse(course){

  const thumbnail =
    course.thumbnail ||
    course.thumbnailUrl ||
    "";


  const paid =
    accessType(course) === "paid";


  $("previewContent").innerHTML = `

    ${
      thumbnail
        ? `
          <img
            src="${esc(thumbnail)}"
            alt="${esc(course.title || "Course")}"
            style="
              width:100%;
              max-height:300px;
              object-fit:cover;
              border-radius:10px;
              margin-bottom:15px;
            "
            onerror="this.style.display='none'">
        `
        : ""
    }


    <h2>
      ${esc(
        course.title ||
        "Untitled Course"
      )}
    </h2>


    <p>

      <span class="badge ${
        paid
          ? "blue"
          : "green"
      }">

        ${
          paid
            ? "Paid"
            : "Free"
        }

      </span>


      ${
        course.featured
          ? `
            <span class="badge orange">
              ⭐ Featured
            </span>
          `
          : ""
      }


      ${
        course.published
          ? `
            <span class="badge green">
              Published
            </span>
          `
          : `
            <span class="badge red">
              Draft
            </span>
          `
      }

    </p>


    <p>
      <strong>Category:</strong>
      ${esc(
        course.category ||
        "General"
      )}
    </p>


    <p>
      <strong>Level:</strong>
      ${esc(
        course.level ||
        "Beginner"
      )}
    </p>


    <p>
      <strong>Instructor:</strong>
      ${esc(
        course.instructorName ||
        "Not specified"
      )}
    </p>


    <p>
      <strong>Language:</strong>
      ${esc(
        course.language ||
        "English"
      )}
    </p>


    <p>
      <strong>Price:</strong>
      ${esc(
        coursePrice(course)
      )}
    </p>


    <p>
      <strong>Certificate:</strong>
      ${
        course.certificate === true
          ? "Available"
          : "Not available"
      }
    </p>


    <hr>


    <p>
      ${esc(
        course.description ||
        "No description available."
      )}
    </p>

  `;


  $("previewModal")
    .classList
    .add("show");

}


/* =========================
   EVENTS
========================= */

$("addCourseBtn")
  .addEventListener(
    "click",
    () => {

      openModal();

    }
  );


$("cancelBtn")
  .addEventListener(
    "click",
    closeModal
  );


$("closePreview")
  .addEventListener(
    "click",
    () => {

      $("previewModal")
        .classList
        .remove("show");

    }
  );


$("dashboardBtn")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "admin-dashboard.html";

    }
  );


$("search")
  .addEventListener(
    "input",
    render
  );


$("status")
  .addEventListener(
    "change",
    render
  );


$("access")
  .addEventListener(
    "change",
    render
  );


/* CLOSE MODAL BY CLICKING OUTSIDE */

$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target ===
        $("modal")
      ){

        closeModal();

      }

    }
  );


$("previewModal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target ===
        $("previewModal")
      ){

        $("previewModal")
          .classList
          .remove("show");

      }

    }
  );


/* =========================
   ACCESS / PRICE CONTROL
========================= */

$("accessType")
  .addEventListener(
    "change",
    () => {

      const paid =
        $("accessType").value ===
        "paid";


      $("price").disabled =
        !paid;


      if(!paid){

        $("price").value = "0";

      }

    }
  );


/* =========================
   START APPLICATION
========================= */

$("price").disabled =
  $("accessType").value !==
  "paid";


loadCourses();

</script>
