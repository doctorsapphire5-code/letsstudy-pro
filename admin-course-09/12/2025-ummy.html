<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Courses | LetsStudy Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:800}.logo span{color:#60a5fa}
.container{width:min(1200px,94%);margin:25px auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat,.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px}
.stat b{font-size:25px;display:block}
.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
input,textarea,select{width:100%;padding:11px;border:1px solid #dbe1e8;border-radius:8px;font:inherit}
textarea{min-height:100px;resize:vertical}
button,.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold}
.primary{background:#2563eb;color:white}.danger{background:#dc2626;color:white}
.gray{background:#e5e7eb}.green{background:#16a34a;color:white}
.form{display:none;margin-bottom:20px}
.form.show{display:block}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field{margin-bottom:12px}
.field label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
.thumb{width:55px;height:40px;object-fit:cover;border-radius:6px}
.badge{padding:4px 8px;border-radius:15px;font-size:11px;background:#e5e7eb}
.published{background:#dcfce7;color:#166534}
.draft{background:#fee2e2;color:#991b1b}
.featured{background:#fef3c7;color:#92400e}
.actions{display:flex;gap:5px;flex-wrap:wrap}
@media(max-width:800px){
.stats{grid-template-columns:repeat(2,1fr)}
.row{grid-template-columns:1fr}
.table-wrap{overflow:auto}
}
</style>
</head>

<body>

<header>
<div class="logo">LetsStudy <span>Pro</span></div>
<div>Course Management</div>
</header>

<div class="container">

<h1>Course Management</h1>

<div class="stats">
<div class="stat">Total Courses<b id="total">0</b></div>
<div class="stat">Published<b id="published">0</b></div>
<div class="stat">Drafts<b id="drafts">0</b></div>
<div class="stat">Featured<b id="featured">0</b></div>
</div>


<div class="toolbar">

<input id="search"
placeholder="Search courses..."
oninput="render()">

<select id="filter" onchange="render()">
<option value="">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>

<button class="primary" onclick="openForm()">
<i class="fa fa-plus"></i> Add Course
</button>

</div>


<!-- ================= FORM ================= -->

<div id="form" class="card form">

<h2 id="formTitle">Add Course</h2>

<input type="hidden" id="courseId">

<div class="row">

<div class="field">
<label>Title</label>
<input id="title" required>
</div>

<div class="field">
<label>Slug</label>
<input id="slug" required>
</div>

<div class="field">
<label>Instructor ID</label>
<input id="instructorId">
</div>

<div class="field">
<label>Instructor Name</label>
<input id="instructorName">
</div>

<div class="field">
<label>Category</label>
<input id="category">
</div>

<div class="field">
<label>Subcategory</label>
<input id="subcategory">
</div>

<div class="field">
<label>Level</label>
<select id="level">
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
<option>All Levels</option>
</select>
</div>

<div class="field">
<label>Language</label>
<input id="language" value="English">
</div>

<div class="field">
<label>Duration</label>
<input id="duration" placeholder="10 hours">
</div>

<div class="field">
<label>Thumbnail URL</label>
<input id="thumbnail">
</div>

<div class="field">
<label>Preview Video URL</label>
<input id="previewVideo">
</div>

<div class="field">
<label>Price</label>
<input id="price" type="number" value="0">
</div>

<div class="field">
<label>Discount Price</label>
<input id="discountPrice" type="number" value="0">
</div>

<div class="field">
<label>Currency</label>
<input id="currency" value="TZS">
</div>

</div>


<div class="field">
<label>Short Description</label>
<textarea id="shortDescription"></textarea>
</div>

<div class="field">
<label>Description</label>
<textarea id="description"></textarea>
</div>

<div class="row">

<div class="field">
<label>Requirements</label>
<textarea id="requirements"
placeholder="One requirement per line"></textarea>
</div>

<div class="field">
<label>What You Learn</label>
<textarea id="whatYouLearn"
placeholder="One item per line"></textarea>
</div>

<div class="field">
<label>Target Audience</label>
<textarea id="targetAudience"></textarea>
</div>

<div class="field">
<label>Tags</label>
<input id="tags"
placeholder="html, css, javascript">
</div>

</div>


<div class="row">

<label>
<input type="checkbox" id="isFree">
Free Course
</label>

<label>
<input type="checkbox" id="certificate">
Certificate
</label>

<label>
<input type="checkbox" id="featuredCheck">
Featured
</label>

<label>
<input type="checkbox" id="publishedCheck">
Published
</label>

</div>

<br>

<button class="primary" onclick="saveCourse()">
<i class="fa fa-save"></i> Save Course
</button>

<button class="gray" onclick="closeForm()">
Cancel
</button>

</div>


<!-- ================= TABLE ================= -->

<div class="card">

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Course</th>
<th>Category</th>
<th>Level</th>
<th>Price</th>
<th>Content</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

</div>


<script type="module">

import{
initializeApp
}from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import{
getFirestore,
collection,
getDocs,
addDoc,
doc,
updateDoc,
deleteDoc,
serverTimestamp
}from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let courses=[];


/* ================= HELPERS ================= */

const $=id=>document.getElementById(id);

const val=id=>$(id).value.trim();

function list(id){

return val(id)
.split("\n")
.map(x=>x.trim())
.filter(Boolean);

}


/* ================= LOAD ================= */

async function load(){

const snap=await getDocs(
collection(db,"courses")
);

courses=snap.docs.map(d=>({
id:d.id,
...d.data()
}));

render();

}


/* ================= RENDER ================= */

window.render=function(){

const search=
$("search").value.toLowerCase();

const filter=
$("filter").value;

const data=courses.filter(c=>{

const match=
(c.title||"")
.toLowerCase()
.includes(search)||
(c.category||"")
.toLowerCase()
.includes(search);

const status=
c.published||c.status==="published"
?"published"
:"draft";

return match&&
(!filter||filter===status);

});


$("total").textContent=
courses.length;

$("published").textContent=
courses.filter(c=>
c.published||
c.status==="published"
).length;

$("drafts").textContent=
courses.filter(c=>
!c.published&&
c.status!=="published"
).length;

$("featured").textContent=
courses.filter(c=>c.featured).length;


$("table").innerHTML=
data.length?

data.map(c=>`

<tr>

<td>

<div style="display:flex;gap:9px;align-items:center">

<img class="thumb"
src="${c.thumbnail||
'https://via.placeholder.com/100'}"
onerror="this.src='https://via.placeholder.com/100'">

<div>

<b>${escapeHtml(c.title||
"Untitled Course")}</b>

<br>

<small>
${escapeHtml(
c.instructorName||
"No instructor"
)}
</small>

</div>

</div>

</td>

<td>${escapeHtml(c.category||"-")}</td>

<td>${escapeHtml(c.level||"-")}</td>

<td>

${
c.isFree||!Number(c.price)
?"Free"
:
`${c.currency||"TZS"} ${
Number(c.discountPrice||c.price)
.toLocaleString()
}`
}

</td>

<td>

${c.modulesCount||0} modules<br>
${c.lessonsCount||0} lessons

</td>

<td>

<span class="badge ${
c.published||
c.status==="published"
?"published":"draft"
}">

${
c.published||
c.status==="published"
?"Published":"Draft"
}

</span>

${c.featured?
`<span class="badge featured">
Featured
</span>`:""}

</td>

<td>

<div class="actions">

<button class="gray"
onclick="editCourse('${c.id}')">
<i class="fa fa-edit"></i>
</button>

<button class="primary"
onclick="previewCourse('${c.slug||""}')">
<i class="fa fa-eye"></i>
</button>

<button class="green"
onclick="togglePublish('${c.id}',${!!c.published})">
<i class="fa fa-upload"></i>
</button>

<button class="gray"
onclick="toggleFeatured('${c.id}',${!!c.featured})">
<i class="fa fa-star"></i>
</button>

<button class="danger"
onclick="removeCourse('${c.id}')">
<i class="fa fa-trash"></i>
</button>

</div>

</td>

</tr>

`).join("")

:

`<tr>
<td colspan="7"
style="text-align:center;padding:30px">
No courses found.
</td>
</tr>`;

};


/* ================= FORM ================= */

window.openForm=function(){

$("form").classList.add("show");
$("formTitle").textContent="Add Course";

clearForm();

window.scrollTo({
top:0,
behavior:"smooth"
});

};

window.closeForm=function(){

$("form").classList.remove("show");

};


function clearForm(){

document.querySelectorAll(
"#form input,#form textarea"
).forEach(x=>{

if(x.type==="checkbox")
x.checked=false;
else
x.value="";

});

$("level").value="Beginner";
$("language").value="English";
$("currency").value="TZS";
$("price").value=0;
$("discountPrice").value=0;
$("courseId").value="";

}


/* ================= SAVE ================= */

window.saveCourse=async function(){

const id=val("courseId");

const data={

title:val("title"),

slug:val("slug"),

shortDescription:
val("shortDescription"),

description:
val("description"),

thumbnail:
val("thumbnail"),

previewVideo:
val("previewVideo"),

instructorId:
val("instructorId"),

instructorName:
val("instructorName"),

category:
val("category"),

subcategory:
val("subcategory"),

level:
$("level").value,

language:
val("language"),

duration:
val("duration"),

lessonsCount:
id?
Number(
courses.find(x=>x.id===id)
?.lessonsCount||0
):0,

modulesCount:
id?
Number(
courses.find(x=>x.id===id)
?.modulesCount||0
):0,

price:
Number(val("price")||0),

discountPrice:
Number(val("discountPrice")||0),

currency:
val("currency")||"TZS",

isFree:
$("isFree").checked,

certificate:
$("certificate").checked,

requirements:
list("requirements"),

whatYouLearn:
list("whatYouLearn"),

targetAudience:
val("targetAudience"),

tags:
val("tags")
.split(",")
.map(x=>x.trim())
.filter(Boolean),

status:
$("publishedCheck").checked
?"published"
:"draft",

featured:
$("featuredCheck").checked,

published:
$("publishedCheck").checked,

rating:
id?
Number(
courses.find(x=>x.id===id)
?.rating||0
):0,

ratingCount:
id?
Number(
courses.find(x=>x.id===id)
?.ratingCount||0
):0,

enrollmentCount:
id?
Number(
courses.find(x=>x.id===id)
?.enrollmentCount||0
):0,

views:
id?
Number(
courses.find(x=>x.id===id)
?.views||0
):0,

updatedAt:
serverTimestamp()

};


if(!data.title||!data.slug){

alert("Title and slug are required.");
return;

}


try{

if(id){

await updateDoc(
doc(db,"courses",id),
data
);

alert("Course updated successfully.");

}else{

data.createdBy="admin";
data.createdAt=serverTimestamp();

if(data.published)
data.publishedAt=serverTimestamp();

await addDoc(
collection(db,"courses"),
data
);

alert("Course created successfully.");

}

closeForm();
await load();

}catch(e){

console.error(e);
alert(e.message);

}

};


/* ================= EDIT ================= */

window.editCourse=function(id){

const c=
courses.find(x=>x.id===id);

if(!c)return;

openForm();

$("formTitle").textContent=
"Edit Course";

$("courseId").value=id;

$("title").value=c.title||"";
$("slug").value=c.slug||"";
$("shortDescription").value=
c.shortDescription||"";
$("description").value=
c.description||"";

$("thumbnail").value=
c.thumbnail||"";

$("previewVideo").value=
c.previewVideo||"";

$("instructorId").value=
c.instructorId||"";

$("instructorName").value=
c.instructorName||"";

$("category").value=
c.category||"";

$("subcategory").value=
c.subcategory||"";

$("level").value=
c.level||"Beginner";

$("language").value=
c.language||"English";

$("duration").value=
c.duration||"";

$("price").value=
c.price||0;

$("discountPrice").value=
c.discountPrice||0;

$("currency").value=
c.currency||"TZS";

$("isFree").checked=
!!c.isFree;

$("certificate").checked=
!!c.certificate;

$("featuredCheck").checked=
!!c.featured;

$("publishedCheck").checked=
!!c.published;

$("requirements").value=
Array.isArray(c.requirements)
?c.requirements.join("\n")
:c.requirements||"";

$("whatYouLearn").value=
Array.isArray(c.whatYouLearn)
?c.whatYouLearn.join("\n")
:c.whatYouLearn||"";

$("targetAudience").value=
c.targetAudience||"";

$("tags").value=
Array.isArray(c.tags)
?c.tags.join(", ")
:c.tags||"";

};


/* ================= DELETE ================= */

window.removeCourse=async function(id){

if(!confirm(
"Delete this course permanently?"
))return;

try{

await deleteDoc(
doc(db,"courses",id)
);

alert("Course deleted.");

await load();

}catch(e){

alert(e.message);

}

};


/* ================= PUBLISH ================= */

window.togglePublish=async function(id,current){

try{

const data={
published:!current,
status:!current?"published":"draft",
updatedAt:serverTimestamp()
};

if(!current)
data.publishedAt=
serverTimestamp();

await updateDoc(
doc(db,"courses",id),
data
);

await load();

}catch(e){

alert(e.message);

}

};


/* ================= FEATURED ================= */

window.toggleFeatured=async function(id,current){

try{

await updateDoc(
doc(db,"courses",id),
{
featured:!current,
updatedAt:serverTimestamp()
}
);

await load();

}catch(e){

alert(e.message);

}

};


/* ================= PREVIEW ================= */

window.previewCourse=function(slug){

if(!slug)return;

window.open(
`course.html?slug=${encodeURIComponent(slug)}`,
"_blank"
);

};


/* ================= ESCAPE ================= */

function escapeHtml(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================= START ================= */

load();

</script>

</body>
</html>
