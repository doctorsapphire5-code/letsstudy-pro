<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Admin Courses | LetsStudy Pro</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  height:65px;
  background:#111827;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 25px;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.logo span{
  color:#60a5fa;
}

.header a{
  color:#fff;
  text-decoration:none;
  font-size:13px;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.page-title h1{
  font-size:27px;
}

.page-title p{
  color:#6b7280;
  font-size:13px;
  margin-top:4px;
}

.primary{
  background:#2563eb;
  color:#fff;
  border:0;
  padding:11px 17px;
  border-radius:9px;
  font-weight:800;
}

.primary:hover{
  background:#1d4ed8;
}

/* =====================================================
   STATISTICS
===================================================== */

.stats{
  display:grid;
  grid-template-columns:
    repeat(6,1fr);
  gap:13px;
  margin-bottom:22px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:17px;
}

.stat-icon{
  font-size:20px;
  margin-bottom:8px;
}

.stat strong{
  display:block;
  font-size:23px;
}

.stat span{
  color:#6b7280;
  font-size:11px;
}

/* =====================================================
   FILTER
===================================================== */

.filters{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;

  padding:17px;

  display:grid;
  grid-template-columns:
    2fr 1fr 1fr 1fr auto;

  gap:10px;

  margin-bottom:20px;
}

.input,
select,
textarea{
  width:100%;

  border:1px solid #d1d5db;

  border-radius:8px;

  padding:10px;

  background:#fff;

  outline:none;
}

.input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

/* =====================================================
   TABLE
===================================================== */

.table-card{
  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:14px;

  overflow:hidden;
}

.table-scroll{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

th{
  background:#f9fafb;

  color:#6b7280;

  text-align:left;

  font-size:11px;

  text-transform:uppercase;

  padding:13px;

  border-bottom:1px solid #e5e7eb;
}

td{
  padding:13px;

  border-bottom:1px solid #f0f1f3;

  font-size:12px;

  vertical-align:middle;
}

.course{
  display:flex;

  align-items:center;

  gap:10px;

  min-width:230px;
}

.course img,
.course-placeholder{
  width:55px;
  height:42px;

  border-radius:7px;

  object-fit:cover;
}

.course-placeholder{
  background:#eff6ff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:19px;
}

.course-name{
  font-weight:800;
}

.course-id{
  color:#9ca3af;
  font-size:9px;
  margin-top:3px;
}

.badge{
  display:inline-block;

  padding:4px 7px;

  border-radius:20px;

  font-size:9px;

  font-weight:900;
}

.published{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#f3f4f6;
  color:#4b5563;
}

.free{
  background:#dbeafe;
  color:#1d4ed8;
}

.paid{
  background:#fce7f3;
  color:#9d174d;
}

.featured{
  background:#fef3c7;
  color:#92400e;
}

.actions{
  display:flex;
  gap:5px;
}

.action{
  border:1px solid #e5e7eb;

  background:#fff;

  width:31px;
  height:31px;

  border-radius:7px;
}

.action:hover{
  background:#f3f4f6;
}

.delete:hover{
  background:#fee2e2;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.55);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:500;
}

.modal.active{
  display:flex;
}

.modal-box{
  background:#fff;

  width:100%;

  max-width:700px;

  max-height:92vh;

  overflow-y:auto;

  border-radius:17px;

  padding:24px;
}

.modal-header{
  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:20px;
}

.close{
  border:0;
  background:#f3f4f6;

  width:32px;
  height:32px;

  border-radius:50%;
}

.form-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:15px;
}

.form-group{
  margin-bottom:15px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  display:block;

  font-size:11px;

  font-weight:800;

  margin-bottom:6px;
}

.modal-actions{
  display:flex;

  justify-content:flex-end;

  gap:10px;

  margin-top:20px;
}

.secondary{
  background:#fff;

  border:1px solid #d1d5db;

  padding:10px 15px;

  border-radius:8px;

  font-weight:700;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
  text-align:center;

  padding:60px 20px;

  color:#6b7280;
}

.empty-icon{
  font-size:42px;

  margin-bottom:10px;
}

@media(max-width:1000px){

  .stats{
    grid-template-columns:
      repeat(3,1fr);
  }

  .filters{
    grid-template-columns:
      1fr 1fr;
  }

}

@media(max-width:600px){

  .container{
    padding:15px;
  }

  .stats{
    grid-template-columns:
      1fr 1fr;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .page-title{
    align-items:flex-start;
    flex-direction:column;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<main class="container">

    <div class="stat">

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  updateDoc,
  deleteDoc,
  getDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


/* =====================================================
   STATE
===================================================== */

let courses = [];

let editingId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const table =
  document.getElementById(
    "courseTable"
  );

const modal =
  document.getElementById(
    "courseModal"
  );

const form =
  document.getElementById(
    "courseForm"
  );


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   LOAD COURSES
===================================================== */

async function loadCourses(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "courses"
        )
      );


    courses = [];


    snapshot.forEach(
      item => {

        const data =
          item.data();


        courses.push({

          ...data,

          coursesId:
            data.coursesId ||
            item.id

        });

      }
    );


    updateStatistics();

    populateCategories();

    renderCourses();

  }
  catch(error){

    console.error(
      error
    );


    table.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty"
        >

          ❌ Unable to load courses.

        </td>

      </tr>

    `;

  }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

  const total =
    courses.length;


  const published =
    courses.filter(
      c =>
        c.published === true
    ).length;


  const draft =
    total -
    published;


  const free =
    courses.filter(
      c =>
        (
          c.accessType ===
          "free"
        ) ||
        Number(
          c.price ||
          0
        ) === 0
    ).length;


  const paid =
    courses.filter(
      c =>
        Number(
          c.price ||
          0
        ) > 0
    ).length;


  const students =
    courses.reduce(
      (
        sum,
        c
      ) =>
        sum +
        Number(
          c.studentCount ||
          c.studentsCount ||
          0
        ),
      0
    );


  document.getElementById(
    "totalCourses"
  ).textContent =
    total;


  document.getElementById(
    "publishedCourses"
  ).textContent =
    published;


  document.getElementById(
    "draftCourses"
  ).textContent =
    draft;


  document.getElementById(
    "freeCourses"
  ).textContent =
    free;


  document.getElementById(
    "paidCourses"
  ).textContent =
    paid;


  document.getElementById(
    "totalStudents"
  ).textContent =
    students.toLocaleString();

}


/* =====================================================
   CATEGORIES
===================================================== */

function populateCategories(){

  const select =
    document.getElementById(
      "category"
    );


  const categories =
    [
      ...new Set(
        courses
          .map(
            c =>
              c.category
          )
          .filter(Boolean)
      )
    ]
    .sort();


  select.innerHTML =
    `
      <option value="">
        All Categories
      </option>
    `;


  categories.forEach(
    category => {

      select.innerHTML += `

        <option
          value="${escapeHtml(
            category
          )}"
        >
          ${escapeHtml(
            category
          )}
        </option>

      `;

    }
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderCourses(
  list = courses
){

  if(
    !list.length
  ){

    table.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty"
        >

          <div class="empty-icon">
            🎓
          </div>

          No courses found.

        </td>

      </tr>

    `;

    return;

  }


  table.innerHTML =
    list.map(
      course => {

        const access =
          course.accessType ||
          (
            Number(
              course.price ||
              0
            ) > 0
              ? "paid"
              : "free"
          );


        const published =
          course.published === true;


        const featured =
          course.featured === true;


        const lessonCount =
          Number(
            course.lessonCount ||
            course.lessonsCount ||
            0
          );


        const studentCount =
          Number(
            course.studentCount ||
            course.studentsCount ||
            0
          );


        const price =
          Number(
            course.price ||
            0
          );


        const currency =
          course.currency ||
          "TZS";


        const courseId =
          course.coursesId ||
          "";


        return `

          <tr>

            <!-- COURSE -->
            <td>

              <div class="course">

                ${
                  course.thumbnail
                  ?

                  `
                  <img
                    src="${escapeHtml(
                      course.thumbnail
                    )}"
                    alt="${escapeHtml(
                      course.title ||
                      "Course"
                    )}"
                  >
                  `

                  :

                  `
                  <div
                    class="course-placeholder"
                  >
                    🎓
                  </div>
                  `
                }


                <div>

                  <div class="course-name">

                    ${escapeHtml(
                      course.title ||
                      "Untitled Course"
                    )}

                  </div>


                  <div class="course-id">

                    ID:
                    ${escapeHtml(
                      courseId
                    )}

                  </div>

                </div>

              </div>

            </td>


            <!-- CATEGORY -->
            <td>

              <span>

                ${escapeHtml(
                  course.category ||
                  "General"
                )}

              </span>

            </td>


            <!-- LESSONS -->
            <td>

              <strong>

                ${lessonCount}

              </strong>

            </td>


            <!-- STUDENTS -->
            <td>

              ${studentCount.toLocaleString()}

            </td>


            <!-- PRICE -->
            <td>

              ${
                access === "free"

                ?

                `
                <span
                  class="badge free"
                >
                  FREE
                </span>
                `

                :

                access === "plan"

                ?

                `
                <span
                  class="badge paid"
                >
                  PLAN
                </span>
                `

                :

                `
                <strong>

                  ${escapeHtml(
                    currency
                  )}

                  ${price.toLocaleString()}

                </strong>
                `

              }

            </td>


            <!-- STATUS -->
            <td>

              ${
                published

                ?

                `
                <span
                  class="badge published"
                >
                  PUBLISHED
                </span>
                `

                :

                `
                <span
                  class="badge draft"
                >
                  DRAFT
                </span>
                `

              }

            </td>


            <!-- FEATURED -->
            <td>

              ${
                featured

                ?

                `
                <span
                  class="badge featured"
                >
                  ⭐ YES
                </span>
                `

                :

                `
                <span
                  style="
                    color:#9ca3af;
                  "
                >
                  —
                </span>
                `

              }

            </td>


            <!-- ACTIONS -->
            <td>

              <div
                class="actions"
              >


                <!-- VIEW -->
                <button
                  class="action"
                  title="View Course"
                  onclick="viewCourse(
                    '${escapeHtml(
                      courseId
                    )}'
                  )"
                >
                  👁
                </button>


                <!-- EDIT -->
                <button
                  class="action"
                  title="Edit Course"
                  onclick="editCourse(
                    '${escapeHtml(
                      courseId
                    )}'
                  )"
                >
                  ✏️
                </button>


                <!-- LESSONS -->
                <button
                  class="action"
                  title="Manage Lessons"
                  onclick="openLessons(
                    '${escapeHtml(
                      courseId
                    )}'
                  )"
                >
                  📚
                </button>


                <!-- REVIEWS -->
                <button
                  class="action"
                  title="Reviews"
                  onclick="openReviews(
                    '${escapeHtml(
                      courseId
                    )}'
                  )"
                >
                  ⭐
                </button>


                <!-- DASHBOARD -->
                <button
                  class="action"
                  title="Course Dashboard"
                  onclick="openDashboard(
                    '${escapeHtml(
                      courseId
                    )}'
                  )"
                >
                  📊
                </button>


                <!-- PUBLISH -->
                <button
                  class="action"
                  title="${
                    published
                    ? "Unpublish"
                    : "Publish"
                  }"
                  onclick="togglePublish(
                    '${escapeHtml(
                      courseId
                    )}'
                  )"
                >

                  ${
                    published
                    ? "⏸"
                    : "▶️"
                  }

                </button>


                <!-- DELETE -->
                <button
                  class="action delete"
                  title="Delete Course"
                  onclick="deleteCourse(
                    '${escapeHtml(
                      courseId
                    )}'
                  )"
                >
                  🗑
                </button>


              </div>

            </td>

          </tr>

        `;

      }
    )
    .join("");

}

/* =====================================================
   EDIT COURSE
===================================================== */

window.editCourse =
async function(
  coursesId
){

  const course =
    courses.find(
      item =>
        item.coursesId ===
        coursesId
    );


  if(
    !course
  ){

    alert(
      "Course not found."
    );

    return;

  }


  editingId =
    coursesId;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Course";


  document.getElementById(
    "coursesId"
  ).value =
    coursesId;


  document.getElementById(
    "courseTitle"
  ).value =
    course.title ||
    "";


  document.getElementById(
    "courseCategory"
  ).value =
    course.category ||
    "";


  document.getElementById(
    "courseLevel"
  ).value =
    course.level ||
    "All Levels";


  document.getElementById(
    "accessType"
  ).value =
    course.accessType ||
    (
      Number(
        course.price ||
        0
      ) > 0
      ? "paid"
      : "free"
    );


  document.getElementById(
    "coursePrice"
  ).value =
    course.price ||
    0;


  document.getElementById(
    "currency"
  ).value =
    course.currency ||
    "TZS";


  document.getElementById(
    "courseDuration"
  ).value =
    course.duration ||
    "";


  document.getElementById(
    "courseLanguage"
  ).value =
    course.language ||
    course.courseLanguage ||
    "English";


  document.getElementById(
    "thumbnail"
  ).value =
    course.thumbnail ||
    course.thumbnailUrl ||
    "";


  document.getElementById(
    "shortDescription"
  ).value =
    course.shortDescription ||
    "";


  document.getElementById(
    "description"
  ).value =
    course.description ||
    "";


  document.getElementById(
    "published"
  ).value =
    course.published === true
      ? "true"
      : "false";


  document.getElementById(
    "featured"
  ).value =
    course.featured === true
      ? "true"
      : "false";


  modal.classList.add(
    "active"
  );

};

      ).value =

      document.getElementById(
        "courseLevel"
      ).value =
        "All Levels";


      document.getElementById(
        "courseLanguage"
      ).value =
