<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Courses | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}

header{
 background:#fff;
 padding:16px 5%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #e5e7eb;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 font-size:22px;
 font-weight:800
}

.logo span{
 color:#2563eb
}

.btn{
 border:0;
 border-radius:8px;
 padding:10px 15px;
 cursor:pointer;
 background:#2563eb;
 color:#fff
}

.btn.dark{background:#111827}
.btn.red{background:#dc2626}
.btn.green{background:#16a34a}
.btn.gray{background:#64748b}

.container{
 width:92%;
 max-width:1400px;
 margin:30px auto
}

.stats{
 display:grid;
 grid-template-columns:
 repeat(5,1fr);
 gap:15px;
 margin-bottom:25px
}

.stat{
 background:#fff;
 padding:20px;
 border-radius:12px;
 box-shadow:0 3px 15px #00000008
}

.stat h3{
 margin:0;
 font-size:28px
}

.stat p{
 color:#64748b;
 margin:7px 0 0
}

.toolbar{
 background:#fff;
 padding:18px;
 border-radius:12px;
 display:grid;
 grid-template-columns:2fr 1fr 1fr auto;
 gap:10px;
 margin-bottom:20px
}

input,select,textarea{
 width:100%;
 padding:11px;
 border:1px solid #d9dee7;
 border-radius:8px;
 outline:none;
 font:inherit
}

.table-wrap{
 background:#fff;
 border-radius:12px;
 overflow:auto;
 box-shadow:0 3px 18px #00000008
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:1000px
}

th,td{
 padding:14px;
 border-bottom:1px solid #edf0f4;
 text-align:left
}

th{
 background:#f8fafc;
 font-size:13px
}

.course-img{
 width:70px;
 height:45px;
 object-fit:cover;
 border-radius:7px
}

.badge{
 display:inline-block;
 padding:5px 8px;
 border-radius:20px;
 font-size:11px;
 margin:2px
}

.published{
 background:#dcfce7;
 color:#15803d
}

.draft{
 background:#fef3c7;
 color:#a16207
}

.featured{
 background:#dbeafe;
 color:#1d4ed8
}

.free{
 background:#dcfce7;
 color:#166534
}

.actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap
}

.actions button{
 border:0;
 padding:7px 9px;
 border-radius:7px;
 cursor:pointer
}

.edit{background:#dbeafe;color:#1d4ed8}
.preview{background:#e0e7ff;color:#4338ca}
.publish{background:#dcfce7;color:#15803d}
.delete{background:#fee2e2;color:#b91c1c}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:100
}

.modal.show{
 display:flex
}

.modal-box{
 background:#fff;
 width:100%;
 max-width:850px;
 max-height:92vh;
 overflow:auto;
 border-radius:15px;
 padding:25px
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px
}

.close{
 border:0;
 width:35px;
 height:35px;
 border-radius:50%;
 cursor:pointer
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px
}

.full{
 grid-column:1/-1
}

label{
 display:block;
 margin-bottom:6px;
 font-weight:600;
 font-size:13px
}

.form-group{
 margin-bottom:5px
}

.checkbox{
 display:flex;
 align-items:center;
 gap:8px
}

.checkbox input{
 width:auto
}

.form-actions{
 display:flex;
 gap:10px;
 margin-top:20px
}

.preview-card{
 background:#fff;
 border-radius:15px;
 overflow:hidden
}

.preview-card img{
 width:100%;
 height:250px;
 object-fit:cover
}

.preview-content{
 padding:25px
}

.price{
 font-size:25px;
 font-weight:800;
 margin:12px 0
}

.old{
 text-decoration:line-through;
 color:#94a3b8;
 font-size:14px
}

.empty{
 padding:60px;
 text-align:center;
 color:#64748b
}

.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 background:#111827;
 color:#fff;
 padding:13px 18px;
 border-radius:8px;
 display:none;
 z-index:200
}

.toast.show{
 display:block
}

@media(max-width:900px){
 .stats{
   grid-template-columns:repeat(2,1fr)
 }

 .toolbar{
   grid-template-columns:1fr
 }

 .form-grid{
   grid-template-columns:1fr
 }

 .full{
   grid-column:auto
 }
}
</style>
</head>

<body>

<header>

 <div class="logo">
   LetsStudy <span>Pro</span>
 </div>

 <button
   class="btn dark"
   onclick="location.href='admin.html'">

   <i class="fa-solid fa-arrow-left"></i>
   Dashboard

 </button>

</header>


<main class="container">

 <h1>Course Management</h1>

 <p style="color:#64748b">
   Manage courses, publishing, pricing,
   instructors and course visibility.
 </p>


<!-- ================= STATS ================= -->

<div class="stats">

 <div class="stat">
   <h3 id="totalCourses">0</h3>
   <p>Total Courses</p>
 </div>

 <div class="stat">
   <h3 id="publishedCourses">0</h3>
   <p>Published</p>
 </div>

 <div class="stat">
   <h3 id="draftCourses">0</h3>
   <p>Drafts</p>
 </div>

 <div class="stat">
   <h3 id="freeCourses">0</h3>
   <p>Free Courses</p>
 </div>

 <div class="stat">
   <h3 id="enrollments">0</h3>
   <p>Enrollments</p>
 </div>

</div>


<!-- ================= TOOLBAR ================= -->

<div class="toolbar">

 <input
   id="search"
   placeholder="Search courses..."
 >

 <select id="statusFilter">

   <option value="">
     All Status
   </option>

   <option value="published">
     Published
   </option>

   <option value="draft">
     Draft
   </option>

 </select>


 <select id="categoryFilter">

   <option value="">
     All Categories
   </option>

 </select>


 <button
   class="btn"
   onclick="openAdd()">

   <i class="fa-solid fa-plus"></i>
   Add Course

 </button>

</div>


<!-- ================= TABLE ================= -->

<div class="table-wrap">

 <table>

  <thead>

   <tr>

    <th>Course</th>
    <th>Category</th>
    <th>Level</th>
    <th>Price</th>
    <th>Content</th>
    <th>Enrollments</th>
    <th>Status</th>
    <th>Actions</th>

   </tr>

  </thead>

  <tbody id="courseTable">

   <tr>
    <td colspan="8">
     <div class="empty">
       Loading courses...
     </div>
    </td>
   </tr>

  </tbody>

 </table>

</div>

</main>


<!-- ================= COURSE MODAL ================= -->

<div
 id="courseModal"
 class="modal">

 <div class="modal-box">

  <div class="modal-head">

   <h2 id="modalTitle">
     Add Course
   </h2>

   <button
    class="close"
    onclick="closeModal()">

    <i class="fa-solid fa-xmark"></i>

   </button>

  </div>


  <form id="courseForm">

   <div class="form-grid">


    <div class="form-group full">

     <label>Course Title</label>

     <input
       id="title"
       required
       placeholder="e.g. Digital Marketing">

    </div>


    <div class="form-group">

     <label>Slug</label>

     <input
       id="slug"
       placeholder="digital-marketing">

    </div>


    <div class="form-group">

     <label>Instructor Name</label>

     <input
       id="instructorName"
       placeholder="Instructor name">

    </div>


    <div class="form-group">

     <label>Instructor ID</label>

     <input
       id="instructorId"
       placeholder="Instructor ID">

    </div>


    <div class="form-group">

     <label>Category</label>

     <input
       id="category"
       placeholder="Business">

    </div>


    <div class="form-group">

     <label>Subcategory</label>

     <input
       id="subcategory"
       placeholder="Marketing">

    </div>


    <div class="form-group">

     <label>Level</label>

     <select id="level">

      <option value="Beginner">
       Beginner
      </option>

      <option value="Intermediate">
       Intermediate
      </option>

      <option value="Advanced">
       Advanced
      </option>

      <option value="All Levels">
       All Levels
      </option>

     </select>

    </div>


    <div class="form-group">

     <label>Language</label>

     <input
       id="language"
       value="English">

    </div>


    <div class="form-group">

     <label>Duration</label>

     <input
       id="duration"
       placeholder="10 hours">

    </div>


    <div class="form-group">

     <label>Lessons Count</label>

     <input
       id="lessonsCount"
       type="number"
       min="0"
       value="0">

    </div>


    <div class="form-group">

     <label>Modules Count</label>

     <input
       id="modulesCount"
       type="number"
       min="0"
       value="0">

    </div>


    <div class="form-group">

     <label>Price</label>

     <input
       id="price"
       type="number"
       min="0"
       value="0">

    </div>


    <div class="form-group">

     <label>Discount Price</label>

     <input
       id="discountPrice"
       type="number"
       min="0"
       value="0">

    </div>


    <div class="form-group">

     <label>Currency</label>

     <input
       id="currency"
       value="TZS">

    </div>


    <div class="form-group">

     <label>Thumbnail URL</label>

     <input
       id="thumbnail"
       placeholder="https://...">

    </div>


    <div class="form-group full">

     <label>Preview Video URL</label>

     <input
       id="previewVideo"
       placeholder="https://youtube.com/...">

    </div>


    <div class="form-group full">

     <label>Short Description</label>

     <textarea
       id="shortDescription"
       rows="3"></textarea>

    </div>


    <div class="form-group full">

     <label>Description</label>

     <textarea
       id="description"
       rows="6"></textarea>

    </div>


    <div class="form-group full">

     <label>
       Requirements
       <small>
         One item per line
       </small>
     </label>

     <textarea
       id="requirements"
       rows="5"></textarea>

    </div>


    <div class="form-group full">

     <label>
       What You Learn
       <small>
         One item per line
       </small>
     </label>

     <textarea
       id="whatYouLearn"
       rows="5"></textarea>

    </div>


    <div class="form-group full">

     <label>
       Target Audience
     </label>

     <textarea
       id="targetAudience"
       rows="4"></textarea>

    </div>


    <div class="form-group full">

     <label>
       Tags
       <small>
         One tag per line
       </small>
     </label>

     <textarea
       id="tags"
       rows="3"></textarea>

    </div>


    <div class="checkbox">

     <input
       id="isFree"
       type="checkbox">

     <label
       for="isFree">
       Free Course
     </label>

    </div>


    <div class="checkbox">

     <input
       id="certificate"
       type="checkbox">

     <label
       for="certificate">
       Certificate Available
     </label>

    </div>


    <div class="checkbox">

     <input
       id="featured"
       type="checkbox">

     <label
       for="featured">
       Featured Course
     </label>

    </div>


    <div class="checkbox">

     <input
       id="published"
       type="checkbox">

     <label
       for="published">
       Published
     </label>

    </div>


   </div>


   <div class="form-actions">

    <button
      type="submit"
      class="btn">

      <i class="fa-solid fa-save"></i>
      Save Course

    </button>


    <button
      type="button"
      class="btn gray"
      onclick="closeModal()">

      Cancel

    </button>

   </div>

  </form>

 </div>

</div>


<!-- ================= PREVIEW MODAL ================= -->

<div
 id="previewModal"
 class="modal">

 <div
   class="modal-box"
   id="previewBox">
 </div>

</div>


<div
 id="toast"
 class="toast">
</div>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 doc,
 getDoc,
 addDoc,
 updateDoc,
 deleteDoc,
 serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= FIREBASE ================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app=
 initializeApp(
   firebaseConfig
 );

const db=
 getFirestore(app);


/* ================= STATE ================= */

let courses=[];
let editingId=null;


/* ================= DOM ================= */

const table=
 document.getElementById(
   "courseTable"
 );

const form=
 document.getElementById(
   "courseForm"
 );


/* ================= LOAD ================= */

async function loadCourses(){

 try{

  const snap=
   await getDocs(
    collection(
      db,
      "courses"
    )
   );


  courses=[];


  snap.forEach(item=>{

   courses.push({

    id:item.id,
    ...item.data()

   });

  });


  updateStats();
  buildCategories();
  renderCourses();

 }catch(error){

  console.error(
    error
  );

  table.innerHTML=`

   <tr>
    <td colspan="8">

     <div class="empty">

      Failed to load courses.

     </div>

    </td>
   </tr>

  `;

 }

}


/* ================= STATS ================= */

function updateStats(){

 const total=
   courses.length;

 const published=
   courses.filter(
    c =>
      c.published===true ||
      c.status==="published"
   ).length;

 const drafts=
   courses.filter(
    c =>
      c.status==="draft" ||
      c.published!==true
   ).length;

 const free=
   courses.filter(
    c =>
      c.isFree===true ||
      Number(c.price||0)===0
   ).length;

 const enrollments=
   courses.reduce(
    (sum,c)=>
      sum+
      Number(
       c.enrollmentCount||0
      ),
    0
   );


 document.getElementById(
   "totalCourses"
 ).textContent=total;


 document.getElementById(
   "publishedCourses"
 ).textContent=published;


 document.getElementById(
   "draftCourses"
 ).textContent=drafts;


 document.getElementById(
   "freeCourses"
 ).textContent=free;


 document.getElementById(
   "enrollments"
 ).textContent=
   enrollments.toLocaleString();

}


/* ================= CATEGORIES ================= */

function buildCategories(){

 const select=
   document.getElementById(
     "categoryFilter"
   );

 const categories=
   [
    ...new Set(
      courses
       .map(c=>c.category)
       .filter(Boolean)
    )
   ].sort();


 select.innerHTML=
   `<option value="">
      All Categories
    </option>`;


 categories.forEach(
  category=>{

   select.innerHTML+=`

    <option
      value="${escapeAttr(
        category
      )}">

      ${escapeHTML(
        category
      )}

    </option>

   `;

  }
 );

}


/* ================= RENDER ================= */

function renderCourses(){

 const keyword=
   document.getElementById(
     "search"
   ).value
    .trim()
    .toLowerCase();


 const status=
   document.getElementById(
     "statusFilter"
   ).value;


 const category=
   document.getElementById(
     "categoryFilter"
   ).value;


 let result=
   courses.filter(
    course=>{

     const text=`

       ${course.title||""}
       ${course.slug||""}
       ${course.category||""}
       ${course.subcategory||""}
       ${course.instructorName||""}
       ${course.description||""}

     `.toLowerCase();


     const matchesSearch=
       text.includes(
         keyword
       );


     const matchesCategory=
       !category ||
       course.category===
       category;


     const isPublished=
       course.published===true ||
       course.status==="published";


     const matchesStatus=
       !status ||

       (
        status==="published" &&
        isPublished
       ) ||

       (
        status==="draft" &&
        !isPublished
       );


     return(
       matchesSearch &&
       matchesCategory &&
       matchesStatus
     );

    }
   );


 if(!result.length){

  table.innerHTML=`

   <tr>

    <td colspan="8">

     <div class="empty">

      <i
       class="
        fa-solid
        fa-book-open
       "
       style="font-size:35px">
      </i>

      <h3>
       No courses found
      </h3>

     </div>

    </td>

   </tr>

  `;

  return;

 }


 table.innerHTML=
   result
    .map(
      courseRow
    )
    .join("");

}


/* ================= COURSE ROW ================= */

function courseRow(course){

 const published=
   course.published===true ||
   course.status==="published";


 const price=
   course.isFree ||
   Number(course.price||0)===0
   ? "Free"
   :
   `${course.currency||"TZS"}
    ${Number(
      course.discountPrice||
      course.price||
      0
    ).toLocaleString()}`;


 return `

  <tr>

   <td>

    <div
     style="
      display:flex;
      gap:10px;
      align-items:center;
     ">

     <img
      class="course-img"
      src="${safeImage(
       course.thumbnail
      )}"
      onerror="
       this.src='https://via.placeholder.com/100'
      "
      alt="">

     <div>

      <strong>
       ${escapeHTML(
        course.title||
        "Untitled Course"
       )}
      </strong>

      <br>

      <small
       style="color:#64748b">

       ${escapeHTML(
        course.instructorName||
        "No instructor"
       )}

      </small>

     </div>

    </div>

   </td>


   <td>

    ${escapeHTML(
      course.category||
      "-"
    )}

   </td>


   <td>

    ${escapeHTML(
      course.level||
      "-"
    )}

   </td>


   <td>

    <strong>
     ${price}
    </strong>

   </td>


   <td>

    ${Number(
      course.modulesCount||0
    )} modules

    <br>

    ${Number(
      course.lessonsCount||0
    )} lessons

   </td>


   <td>

    ${Number(
      course.enrollmentCount||0
    ).toLocaleString()}

   </td>


   <td>

    ${
      published

      ? `
       <span class="
        badge
        published
       ">
        Published
       </span>
      `

      : `
       <span class="
        badge
        draft
       ">
        Draft
       </span>
      `
    }


    ${
      course.featured
      ? `
       <span class="
        badge
        featured
       ">
        Featured
       </span>
      `
      : ""
    }

   </td>


   <td>

    <div class="actions">

     <button
      class="edit"
      onclick="
       editCourse(
        '${escapeAttr(course.id)}'
       )
      ">

      <i class="fa-solid fa-pen"></i>

     </button>


     <button
      class="preview"
      onclick="
       previewCourse(
        '${escapeAttr(course.id)}'
       )
      ">

      <i class="fa-solid fa-eye"></i>

     </button>


     <button
      class="publish"
      onclick="
       togglePublish(
        '${escapeAttr(course.id)}'
       )
      ">

      <i
       class="
        fa-solid
        ${
         published
         ? "fa-eye-slash"
         : "fa-upload"
        }
       ">
      </i>

     </button>


     <button
      class="delete"
      onclick="
       deleteCourse(
        '${escapeAttr(course.id)}'
       )
      ">

      <i class="fa-solid fa-trash"></i>

     </button>

    </div>

   </td>

  </tr>

 `;

}


/* ================= ADD ================= */

window.openAdd=function(){

 editingId=null;

 form.reset();

 document.getElementById(
   "modalTitle"
 ).textContent=
   "Add Course";


 document.getElementById(
   "currency"
 ).value=
   "TZS";


 document.getElementById(
   "language"
 ).value=
   "English";


 document.getElementById(
   "courseModal"
 ).classList.add(
   "show"
 );

};


/* ================= EDIT ================= */

window.editCourse=
async function(id){

 const course=
   courses.find(
    c=>c.id===id
   );


 if(!course)return;


 editingId=id;


 document.getElementById(
   "modalTitle"
 ).textContent=
   "Edit Course";


 setValue(
  "title",
  course.title
 );


 setValue(
  "slug",
  course.slug
 );


 setValue(
  "instructorId",
  course.instructorId
 );


 setValue(
  "instructorName",
  course.instructorName
 );


 setValue(
  "category",
  course.category
 );


 setValue(
  "subcategory",
  course.subcategory
 );


 setValue(
  "level",
  course.level
 );


 setValue(
  "language",
  course.language
 );


  setValue(
   "lessonsCount",
   course.lessonsCount
 );

 setValue(
   "modulesCount",
   course.modulesCount
 );

 setValue(
   "price",
   course.price
 );

 setValue(
   "discountPrice",
   course.discountPrice
 );

 setValue(
   "currency",
   course.currency
 );

 setValue(
   "thumbnail",
   course.thumbnail
 );

 setValue(
   "previewVideo",
   course.previewVideo
 );

 setValue(
   "shortDescription",
   course.shortDescription
 );

 setValue(
   "description",
   course.description
 );

 setValue(
   "requirements",
   arrayText(
     course.requirements
   )
 );

 setValue(
   "whatYouLearn",
   arrayText(
     course.whatYouLearn
   )
 );

 setValue(
   "targetAudience",
   arrayText(
     course.targetAudience
   )
 );

 setValue(
   "tags",
   arrayText(
     course.tags
   )
 );

 document.getElementById(
   "isFree"
 ).checked =
   course.isFree === true;

 document.getElementById(
   "certificate"
 ).checked =
   course.certificate === true;

 document.getElementById(
   "featured"
 ).checked =
   course.featured === true;

 document.getElementById(
   "published"
 ).checked =
   course.published === true ||
   course.status === "published";

 document.getElementById(
   "courseModal"
 ).classList.add(
   "show"
 );

};


/* ================= SAVE COURSE ================= */

form.addEventListener(
 "submit",
 async event => {

   event.preventDefault();

   const button =
     form.querySelector(
       "button[type=submit]"
     );

   button.disabled = true;
   button.innerHTML =
     `<i class="fa-solid fa-spinner fa-spin"></i>
      Saving...`;

   try {

     const published =
       document.getElementById(
         "published"
       ).checked;

     const data = {

       title:
         value("title"),

       slug:
         value("slug") ||
         slugify(
           value("title")
         ),

       shortDescription:
         value(
           "shortDescription"
         ),

       description:
         value(
           "description"
         ),

       thumbnail:
         value("thumbnail"),

       previewVideo:
         value("previewVideo"),

       instructorId:
         value("instructorId"),

       instructorName:
         value("instructorName"),

       category:
         value("category"),

       subcategory:
         value("subcategory"),

       level:
         value("level"),

       language:
         value("language"),

       duration:
         value("duration"),

       lessonsCount:
         Number(
           value("lessonsCount")
         ) || 0,

       modulesCount:
         Number(
           value("modulesCount")
         ) || 0,

       price:
         Number(
           value("price")
         ) || 0,

       discountPrice:
         Number(
           value("discountPrice")
         ) || 0,

       currency:
         value("currency") ||
         "TZS",

       isFree:
         document.getElementById(
           "isFree"
         ).checked,

       certificate:
         document.getElementById(
           "certificate"
         ).checked,

       requirements:
         toArray(
           value("requirements")
         ),

       whatYouLearn:
         toArray(
           value("whatYouLearn")
         ),

       targetAudience:
         toArray(
           value("targetAudience")
         ),

       tags:
         toArray(
           value("tags")
         ),

       status:
         published
         ? "published"
         : "draft",

       published:
         published,

       featured:
         document.getElementById(
           "featured"
         ).checked,

       updatedAt:
         serverTimestamp()

     };


     /* ================= EDIT ================= */

     if (editingId) {

       const oldCourse =
         courses.find(
           c => c.id === editingId
         );

       /*
        * Keep the original
        * createdAt value.
        */

       await updateDoc(
         doc(
           db,
           "courses",
           editingId
         ),
         data
       );


       /*
        * Set publishedAt only
        * when publishing.
        */

       if (
         published &&
         !oldCourse?.published
       ) {

         await updateDoc(
           doc(
             db,
             "courses",
             editingId
           ),
           {
             publishedAt:
               serverTimestamp()
           }
         );

       }


       if (
         !published &&
         oldCourse?.published
       ) {

         await updateDoc(
           doc(
             db,
             "courses",
             editingId
           ),
           {
             publishedAt: null
           }
         );

       }


       showToast(
         "Course updated successfully."
       );

     }


     /* ================= ADD ================= */

     else {

       data.createdBy =
         "admin";

       data.createdAt =
         serverTimestamp();

       data.views = 0;

       data.rating = 0;

       data.ratingCount = 0;

       data.enrollmentCount = 0;

       data.publishedAt =
         published
         ? serverTimestamp()
         : null;


       await addDoc(
         collection(
           db,
           "courses"
         ),
         data
       );


       showToast(
         "Course added successfully."
       );

     }


     closeModal();

     await loadCourses();


   } catch (error) {

     console.error(error);

     showToast(
       "Error: " +
       error.message
     );

   } finally {

     button.disabled = false;

     button.innerHTML =
       `<i class="fa-solid fa-save"></i>
        Save Course`;

   }

 });


/* ================= TOGGLE PUBLISH ================= */

window.togglePublish =
 async function(id) {

   const course =
     courses.find(
       c => c.id === id
     );

   if (!course) return;

   const isPublished =
     course.published === true ||
     course.status === "published";

   try {

     const data = {

       published:
         !isPublished,

       status:
         !isPublished
         ? "published"
         : "draft",

       updatedAt:
         serverTimestamp()

     };


     if (!isPublished) {

       data.publishedAt =
         serverTimestamp();

     } else {

       data.publishedAt =
         null;

     }


     await updateDoc(
       doc(
         db,
         "courses",
         id
       ),
       data
     );


     showToast(
       !isPublished
       ? "Course published."
       : "Course moved to draft."
     );


     await loadCourses();

   } catch (error) {

     console.error(error);

     showToast(
       "Unable to update course."
     );

   }

 };


/* ================= DELETE COURSE ================= */

window.deleteCourse =
 async function(id) {

   const course =
     courses.find(
       c => c.id === id
     );

   if (!course) return;

   const confirmDelete =
     confirm(
       `Delete "${course.title}"?\n\n` +
       `This action cannot be undone.`
     );

   if (!confirmDelete) return;

   try {

     await deleteDoc(
       doc(
         db,
         "courses",
         id
       )
     );

     showToast(
       "Course deleted successfully."
     );

     await loadCourses();

   } catch (error) {

     console.error(error);

     showToast(
       "Unable to delete course."
     );

   }

 };

/* ================= HELPERS ================= */

function value(id) {

 const el =
   document.getElementById(id);

 return el
   ? el.value.trim()
   : "";

}


function setValue(
 id,
 val
) {

 const el =
   document.getElementById(id);

 if (el) {

   el.value =
     val ?? "";

 }

}


function toArray(text) {

 return String(
   text || ""
 )
 .split(/\r?\n/)
 .map(
   item =>
     item.trim()
 )
 .filter(Boolean);

}


function arrayText(value) {

 if (
   Array.isArray(value)
 ) {

   return value.join(
     "\n"
   );

 }

 return value || "";

}


function listHTML(value) {

 if (
   !Array.isArray(value) ||
   !value.length
 ) {

   return `
     <p>
       No data available.
     </p>
   `;

 }

 return `

   <ul>

     ${value.map(
       item => `
         <li>
           ${escapeHTML(item)}
         </li>
       `
     ).join("")}

   </ul>

 `;

}


function slugify(text) {

 return String(
   text || ""
 )
 .toLowerCase()
 .trim()
 .replace(
   /[^a-z0-9]+/g,
   "-"
 )
 .replace(
   /^-+|-+$/g,
   "");

}


function safeImage(url) {

 if (!url) {

   return "https://via.placeholder.com/800x450";

 }

 try {

   const parsed =
     new URL(url);

   if (
     parsed.protocol ===
       "https:" ||
     parsed.protocol ===
       "http:"
   ) {

     return parsed.href;

   }

 } catch (error) {}

 return "https://via.placeholder.com/800x450";

}


function escapeHTML(value) {

 return String(
   value ?? ""
 )
 .replace(
   /&/g,
   "&amp;"
 )
 .replace(
   /</g,
   "&lt;"
 )
 .replace(
   />/g,
   "&gt;"
 )
 .replace(
   /"/g,
   "&quot;"
 )
 .replace(
   /'/g,
   "&#039;"
 );

}


function escapeAttr(value) {

 return escapeHTML(
   value
 );

}


function showToast(
 message
) {

 const toast =
   document.getElementById(
     "toast"
   );

 toast.textContent =
   message;

 toast.classList.add(
   "show"
 );

 setTimeout(
   () => {

     toast.classList.remove(
       "show"
     );

   },
   3000
 );

}
