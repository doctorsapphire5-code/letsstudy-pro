<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Add Course | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#2563eb;
  font-size:20px;
  font-weight:800;
}

header a{
  color:#475569;
  text-decoration:none;
}

main{
  max-width:850px;
  margin:30px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:25px;
}

h2{
  margin-top:0;
  margin-bottom:22px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.field{
  margin-bottom:5px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #d9dee7;
  border-radius:8px;
  outline:none;
  background:#fff;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.actions{
  margin-top:22px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 20px;
  cursor:pointer;
  font-weight:700;
}

.cancel{
  background:#e5e7eb;
}

.save{
  background:#2563eb;
  color:#fff;
}

#message{
  margin-top:15px;
  font-size:14px;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .actions{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<a href="admin-course.html">
← Back to Courses
</a>

</header>


<main>

<div class="card">

<h2>Add Course</h2>

<form id="courseForm">

<div class="grid">


<div class="field full">
<label>Course Title *</label>

<input
id="title"
required
placeholder="Enter course title"
>
</div>


<div class="field full">
<label>Short Description</label>

<input
id="shortDescription"
placeholder="Brief description of the course"
>
</div>


<div class="field full">
<label>Description *</label>

<textarea
id="description"
required
placeholder="Describe the course..."
></textarea>
</div>


<div class="field">
<label>Category *</label>

<input
id="category"
required
placeholder="e.g. Business"
>
</div>


<div class="field">
<label>Level</label>

<select id="level">

<option value="beginner">
Beginner
</option>

<option value="intermediate">
Intermediate
</option>

<option value="advanced">
Advanced
</option>

<option value="all">
All Levels
</option>

</select>
</div>


<div class="field">
<label>Language</label>

<input
id="language"
value="English"
>
</div>


<div class="field">
<label>Duration</label>

<input
id="duration"
placeholder="e.g. 8 weeks"
>
</div>


<div class="field">
<label>Instructor</label>

<input
id="instructor"
placeholder="Instructor name"
>
</div>


<div class="field full">
<label>Thumbnail URL</label>

<input
id="thumbnail"
type="url"
placeholder="https://..."
>
</div>


<div class="field">
<label>Price</label>

<input
id="price"
type="number"
min="0"
value="0"
>
</div>


<div class="field">
<label>Discount Price</label>

<input
id="discountPrice"
type="number"
min="0"
value="0"
>
</div>


<div class="field">
<label>Currency</label>

<select id="currency">

<option value="TZS">
TZS
</option>

<option value="USD">
USD
</option>

</select>
</div>


<div class="field">
<label>Status</label>

<select id="status">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>
</div>


<div class="field">
<label>
<input
id="featured"
type="checkbox"
style="width:auto"
>
 Featured Course
</label>
</div>


</div>


<div class="actions">

<button
type="button"
class="cancel"
onclick="location.href='admin-course.html'">
Cancel
</button>

<button
type="submit"
class="save">
Save Course
</button>

</div>


<div id="message"></div>

</form>

</div>

</main>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import{
getFirestore,
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig={

apiKey:"YOUR_API_KEY",

authDomain:
"YOUR_PROJECT.firebaseapp.com",

projectId:
"YOUR_PROJECT_ID",

storageBucket:
"YOUR_PROJECT.firebasestorage.app",

messagingSenderId:
"YOUR_SENDER_ID",

appId:
"YOUR_APP_ID"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ELEMENTS */

const form=
document.getElementById("courseForm");

const message=
document.getElementById("message");


/* SLUG */

function createSlug(text){

return text
.toLowerCase()
.trim()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");

}


/* SAVE */

form.addEventListener(
"submit",
async function(e){

e.preventDefault();


const title=
document.getElementById("title")
.value.trim();

const description=
document.getElementById("description")
.value.trim();

const category=
document.getElementById("category")
.value.trim();


if(!title||!description||!category){

message.textContent=
"Please fill all required fields.";

message.style.color="#dc2626";

return;

}


try{

message.textContent=
"Saving course...";

message.style.color="#2563eb";


const course={

title:title,

slug:createSlug(title),

shortDescription:
document.getElementById(
"shortDescription"
).value.trim(),

description:description,

category:category,

level:
document.getElementById(
"level"
).value,

language:
document.getElementById(
"language"
).value.trim(),

duration:
document.getElementById(
"duration"
).value.trim(),

instructor:
document.getElementById(
"instructor"
).value.trim(),

thumbnail:
document.getElementById(
"thumbnail"
).value.trim(),

price:
Number(
document.getElementById(
"price"
).value||0
),

discountPrice:
Number(
document.getElementById(
"discountPrice"
).value||0
),

currency:
document.getElementById(
"currency"
).value,

status:
document.getElementById(
"status"
).value,

featured:
document.getElementById(
"featured"
).checked,

enrollmentCount:0,

rating:0,

ratingCount:0,

createdBy:"admin",

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp(),

publishedAt:
document.getElementById(
"status"
).value==="published"
?serverTimestamp()
:null

};


const ref=
await addDoc(
collection(db,"courses"),
course
);


message.textContent=
"Course added successfully.";

message.style.color="#16a34a";


form.reset();


document.getElementById(
"level"
).value="beginner";

document.getElementById(
"currency"
).value="TZS";

document.getElementById(
"status"
).value="draft";


console.log(
"Course ID:",
ref.id
);


}catch(error){

console.error(error);

message.textContent=
"Failed to save course.";

message.style.color="#dc2626";

}

});

</script>

</body>
</html>
