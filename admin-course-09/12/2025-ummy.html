<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Management | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 padding:16px 5%;
 display:flex;
 justify-content:space-between;
 align-items:center
}
.logo{
 color:#2563eb;
 font-size:20px;
 font-weight:800
}
header a{
 text-decoration:none;
 color:#475569
}
main{
 max-width:1200px;
 margin:auto;
 padding:25px 15px 50px
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px
}
.top h1{
 margin:0
}
.btn{
 border:0;
 border-radius:8px;
 padding:11px 15px;
 cursor:pointer;
 font-weight:700
}
.primary{
 background:#2563eb;
 color:#fff
}
.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:20px;
 margin-bottom:20px
}
.form{
 display:none
}
.form.active{
 display:block
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px
}
.full{
 grid-column:1/-1
}
label{
 display:block;
 font-size:13px;
 font-weight:700;
 margin-bottom:6px
}
input,textarea,select{
 width:100%;
 padding:11px;
 border:1px solid #d8dee8;
 border-radius:8px;
 outline:none
}
textarea{
 min-height:120px;
 resize:vertical
}
.actions{
 display:flex;
 gap:6px;
 flex-wrap:wrap
}
.action{
 border:0;
 padding:8px 10px;
 border-radius:7px;
 cursor:pointer;
 color:#fff
}
.edit{background:#f59e0b}
.preview{background:#2563eb}
.status{background:#16a34a}
.delete{background:#dc2626}
table{
 width:100%;
 border-collapse:collapse
}
th,td{
 padding:12px 10px;
 border-bottom:1px solid #eee;
 text-align:left;
 font-size:13px
}
th{
 background:#f8fafc
}
.badge{
 padding:5px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:700
}
.published{
 background:#dcfce7;
 color:#15803d
}
.draft{
 background:#fef3c7;
 color:#92400e
}
.empty{
 text-align:center;
 padding:40px;
 color:#64748b
}
.message{
 margin-top:12px;
 font-size:13px
}
@media(max-width:750px){
 .grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 table{min-width:800px}
 .table-wrap{overflow:auto}
}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<a href="admin.html">
<i class="fa fa-arrow-left"></i>
Admin
</a>

</header>

<main>

<div class="top">

<div>
<h1>Course Management</h1>
<small>Manage courses, status, editing and previews</small>
</div>

<button
class="btn primary"
id="addBtn">

<i class="fa fa-plus"></i>
Add Course

</button>

</div>


<!-- ADD / EDIT FORM -->

<section
class="card form"
id="courseFormBox">

<h2 id="formTitle">
Add Course
</h2>

<form id="courseForm">

<div class="grid">

<div class="full">

<label>Course Title *</label>

<input
id="title"
required
placeholder="Enter course title">

</div>


<div>

<label>Category *</label>

<input
id="category"
required
placeholder="e.g. Technology">

</div>


<div>

<label>Level</label>

<select id="level">

<option value="beginner">Beginner</option>
<option value="intermediate">Intermediate</option>
<option value="advanced">Advanced</option>
<option value="all">All Levels</option>

</select>

</div>


<div>

<label>Language</label>

<input
id="language"
value="English">

</div>


<div>

<label>Duration</label>

<input
id="duration"
placeholder="e.g. 8 weeks">

</div>


<div>

<label>Instructor</label>

<input
id="instructor"
placeholder="Instructor name">

</div>


<div class="full">

<label>Short Description</label>

<input
id="shortDescription">

</div>


<div class="full">

<label>Description *</label>

<textarea
id="description"
required></textarea>

</div>


<div class="full">

<label>Thumbnail URL</label>

<input
id="thumbnail"
type="url"
placeholder="https://...">

</div>


<div>

<label>Price</label>

<input
id="price"
type="number"
min="0"
value="0">

</div>


<div>

<label>Currency</label>

<select id="currency">

<option value="TZS">TZS</option>
<option value="USD">USD</option>

</select>

</div>


<div>

<label>Status</label>

<select id="status">

<option value="draft">Draft</option>
<option value="published">Published</option>

</select>

</div>


<div>

<label>Featured</label>

<select id="featured">

<option value="false">No</option>
<option value="true">Yes</option>

</select>

</div>

</div>


<div class="actions" style="margin-top:20px">

<button
type="submit"
class="btn primary">

<i class="fa fa-save"></i>
Save Course

</button>

<button
type="button"
class="btn"
id="cancelBtn">

Cancel

</button>

</div>

<div
id="message"
class="message">
</div>

</form>

</section>


<!-- COURSES -->

<section class="card">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px">

<h2>Courses</h2>

<span id="count">
0 courses
</span>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>Course</th>
<th>Category</th>
<th>Price</th>
<th>Status</th>
<th>Featured</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="courseList">

<tr>
<td colspan="6"
class="empty">

Loading courses...

</td>
</tr>

</tbody>

</table>

</div>

</section>

</main>


<script type="module">

import{
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
 getFirestore,
 collection,
 addDoc,
 getDocs,
 doc,
 getDoc,
 updateDoc,
 serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ELEMENTS */

const box=
document.getElementById("courseFormBox");

const form=
document.getElementById("courseForm");

const list=
document.getElementById("courseList");

const message=
document.getElementById("message");

let editId=null;


/* ADD BUTTON */

document.getElementById("addBtn")
.onclick=()=>{

 editId=null;

 form.reset();

 document.getElementById("formTitle")
 .textContent="Add Course";

 document.getElementById("status")
 .value="draft";

 document.getElementById("currency")
 .value="TZS";

 box.classList.add("active");

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

};


/* CANCEL */

document.getElementById("cancelBtn")
.onclick=()=>{

 box.classList.remove("active");

 editId=null;

};


/* SLUG */

function slugify(text){

 return text
 .toLowerCase()
 .trim()
 .replace(/[^a-z0-9]+/g,"-")
 .replace(/^-+|-+$/g,"");

}


/* SAVE */

form.onsubmit=
async e=>{

 e.preventDefault();

 const title=
 document.getElementById("title")
 .value.trim();

 const description=
 document.getElementById("description")
 .value.trim();

 const category=
 document.getElementById("category")
 .value.trim();


 if(!title||
 !description||
 !category){

 message.textContent=
 "Please fill required fields.";

 return;

 }


 const data={

 title,

 slug:slugify(title),

 category,

 level:
 document.getElementById("level")
 .value,

 language:
 document.getElementById("language")
 .value,

 duration:
 document.getElementById("duration")
 .value,

 instructor:
 document.getElementById("instructor")
 .value,

 shortDescription:
 document.getElementById("shortDescription")
 .value,

 description,

 thumbnail:
 document.getElementById("thumbnail")
 .value,

 price:
 Number(
 document.getElementById("price")
 .value||0
 ),

 currency:
 document.getElementById("currency")
 .value,

 status:
 document.getElementById("status")
 .value,

 featured:
 document.getElementById("featured")
 .value==="true",

 updatedAt:
 serverTimestamp()

 };


 try{

 message.textContent="Saving...";


 if(editId){

  await updateDoc(
   doc(db,"courses",editId),
   data
  );

  message.textContent=
  "Course updated successfully.";

 }else{

  data.createdBy="admin";

  data.createdAt=
  serverTimestamp();

  data.enrollmentCount=0;

  data.rating=0;

  data.ratingCount=0;

  data.publishedAt=
   data.status==="published"
   ?serverTimestamp()
   :null;

  await addDoc(
   collection(db,"courses"),
   data
  );

  message.textContent=
  "Course added successfully.";

 }


 box.classList.remove("active");

 editId=null;

 await loadCourses();


 }catch(error){

 console.error(error);

 message.textContent=
 error.message;

 }

};


/* LOAD COURSES */

async function loadCourses(){

 try{

 const snap=
 await getDocs(
  collection(db,"courses")
 );

 document.getElementById("count")
 .textContent=
 `${snap.size} courses`;


 if(snap.empty){

  list.innerHTML=`
  <tr>
  <td colspan="6"
  class="empty">
  No courses found.
  </td>
  </tr>`;

  return;

 }


 list.innerHTML="";


 snap.forEach(d=>{

 const c=d.data();

 const status=
 c.status||"draft";

 list.innerHTML+=`

 <tr>

 <td>
 <strong>
 ${safe(c.title||"Untitled")}
 </strong>
 </td>

 <td>
 ${safe(c.category||"-")}
 </td>

 <td>
 ${safe(c.currency||"TZS")}
 ${Number(c.price||0).toLocaleString()}
 </td>

 <td>

 <span class="badge
 ${status==="published"
 ?"published":"draft"}">

 ${safe(status)}

 </span>

 </td>

 <td>
 ${c.featured?"Yes":"No"}
 </td>

 <td>

 <div class="actions">

 <button
 class="action edit"
 onclick="editCourse('${d.id}')">

 <i class="fa fa-pen"></i>
 Edit

 </button>


 <button
 class="action preview"
 onclick="previewCourse('${d.id}')">

 <i class="fa fa-eye"></i>
 Preview

 </button>


 <button
 class="action status"
 onclick="toggleStatus(
 '${d.id}',
 '${status}'
 )">

 <i class="fa fa-power-off"></i>
 Status

 </button>

 </div>

 </td>

 </tr>

 `;

 });


 }catch(error){

 console.error(error);

 list.innerHTML=`
 <tr>
 <td colspan="6"
 class="empty">

 Failed to load courses.

 </td>
 </tr>`;

 }

}


/* EDIT */

window.editCourse=
async id=>{

 try{

 const snap=
 await getDoc(
  doc(db,"courses",id)
 );

 if(!snap.exists())return;

 const c=snap.data();

 editId=id;

 document.getElementById("title")
 .value=c.title||"";

 document.getElementById("category")
 .value=c.category||"";

 document.getElementById("level")
 .value=c.level||"beginner";

 document.getElementById("language")
 .value=c.language||"English";

 document.getElementById("duration")
 .value=c.duration||"";

 document.getElementById("instructor")
 .value=c.instructor||"";

 document.getElementById("shortDescription")
 .value=c.shortDescription||"";

 document.getElementById("description")
 .value=c.description||"";

 document.getElementById("thumbnail")
 .value=c.thumbnail||"";

 document.getElementById("price")
 .value=c.price||0;

 document.getElementById("currency")
 .value=c.currency||"TZS";

 document.getElementById("status")
 .value=c.status||"draft";

 document.getElementById("featured")
 .value=c.featured
 ?"true":"false";


 document.getElementById("formTitle")
 .textContent="Edit Course";


 box.classList.add("active");


 window.scrollTo({
  top:0,
  behavior:"smooth"
 });


 }catch(error){

 console.error(error);

 }

};


/* PREVIEW */

window.previewCourse=
id=>{

 location.href=
 `course.html?id=${encodeURIComponent(id)}`;

};


/* STATUS */

window.toggleStatus=
async(id,current)=>{

 const next=
 current==="published"
 ?"draft"
 :"published";


 if(!confirm(
 `Change course status to ${next}?`
 ))return;


 try{

 await updateDoc(

  doc(db,"courses",id),

  {
   status:next,
   updatedAt:serverTimestamp(),

   publishedAt:
   next==="published"
   ?serverTimestamp()
   :null
  }

 );


 await loadCourses();


 }catch(error){

 alert(error.message);

 }

};


/* ESCAPE */

function safe(value){

 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* START */

loadCourses();

</script>

</body>
</html>
