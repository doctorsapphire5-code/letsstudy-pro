<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LetsStudy Pro - Courses</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px}
.container{max-width:1200px;margin:auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 10px #0001}
.card strong{display:block;font-size:25px;margin-top:5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px;border:1px solid #d5d9e2;border-radius:8px}
.search{flex:1;min-width:220px}
button{border:0;border-radius:8px;padding:11px 15px;cursor:pointer}
.primary{background:#2563eb;color:white}
.danger{background:#dc2626;color:white}
.small{padding:7px 9px;font-size:13px;margin:2px}
.table-wrap{overflow:auto;background:white;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{text-align:left;padding:13px;border-bottom:1px solid #eee}
.badge{padding:5px 8px;border-radius:20px;font-size:12px}
.green{background:#dcfce7;color:#166534}
.red{background:#fee2e2;color:#991b1b}
.blue{background:#dbeafe;color:#1e40af}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modal-box{background:white;width:700px;max-width:100%;max-height:95vh;overflow:auto;border-radius:14px;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:700px){
.stats{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
}
</style>
</head>

<body>

<header>
<b>📚 LetsStudy Pro</b>
<button onclick="logout()">Logout</button>
</header>

<div class="container">

<h2>Course Management</h2>

<div class="stats">
<div class="card">Total Courses<strong id="total">0</strong></div>
<div class="card">Published<strong id="published">0</strong></div>
<div class="card">Drafts<strong id="drafts">0</strong></div>
<div class="card">Featured<strong id="featured">0</strong></div>
</div>

<div class="toolbar">
<input id="search" class="search" placeholder="Search courses...">

<select id="status">
<option value="all">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>

<select id="access">
<option value="all">All Access</option>
<option value="free">Free</option>
<option value="paid">Paid</option>
</select>

<button class="primary" onclick="openModal()">+ Add Course</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Course</th>
<th>Category</th>
<th>Access</th>
<th>Price</th>
<th>Status</th>
<th>Featured</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="courses">
<tr><td colspan="7">Loading...</td></tr>
</tbody>
</table>
</div>

</div>

<!-- MODAL -->

<div id="modal" class="modal">
<div class="modal-box">

<h2 id="modalTitle">Add Course</h2>

<form id="form">

<input type="hidden" id="courseId">

<div class="grid">

<div class="full">
<label>Course Title *</label>
<input id="title" required>
</div>

<div>
<label>Category</label>
<input id="category" placeholder="Physics, Business, IT...">
</div>

<div>
<label>Level</label>
<select id="level">
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
</select>
</div>

<div>
<label>Access Type</label>
<select id="accessType">
<option value="free">Free</option>
<option value="paid">Paid</option>
</select>
</div>

<div>
<label>Price</label>
<input id="price" type="number" min="0" placeholder="0">
</div>

<div class="full">
<label>Short Description</label>
<textarea id="description" rows="3"></textarea>
</div>

<div class="full">
<label>Thumbnail URL</label>
<input id="thumbnail" placeholder="https://...">
</div>

<div>
<label>Instructor</label>
<input id="instructorName">
</div>

<div>
<label>Language</label>
<input id="language" value="English">
</div>

<div>
<label>Certificate</label>
<select id="certificate">
<option value="false">No</option>
<option value="true">Yes</option>
</select>
</div>

<div>
<label>Featured</label>
<select id="isFeatured">
<option value="false">No</option>
<option value="true">Yes</option>
</select>
</div>

<div>
<label>Published</label>
<select id="isPublished">
<option value="true">Published</option>
<option value="false">Draft</option>
</select>
</div>

</div>

<br>

<div class="actions">
<button type="submit" class="primary">Save Course</button>
<button type="button" onclick="closeModal()">Cancel</button>
</div>

</form>
</div>
</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
doc,
updateDoc,
deleteDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let courses=[];
let editing=null;

const $=id=>document.getElementById(id);

function esc(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function accessType(c){

if(c.isFree===true)return "free";

if(c.accessType)
return String(c.accessType).toLowerCase()==="free"
?"free":"paid";

if(c.premium===true)return "paid";
if(c.paid===true)return "paid";

return Number(c.price||0)>0?"paid":"free";
}

function price(c){

if(accessType(c)==="free")return "Free";

return `${c.currency||"TZS"} ${Number(c.discountPrice||c.price||0).toLocaleString()}`;
}

function render(){

let search=$("search").value.toLowerCase();
let status=$("status").value;
let access=$("access").value;

let list=courses.filter(c=>{

let text=[
c.title,
c.category,
c.instructorName
].join(" ").toLowerCase();

if(search&&!text.includes(search))
return false;

let st=c.published===true?"published":"draft";

if(status!=="all"&&status!==st)
return false;

if(access!=="all"&&access!==accessType(c))
return false;

return true;
});

$("total").textContent=courses.length;

$("published").textContent=
courses.filter(c=>c.published===true).length;

$("drafts").textContent=
courses.filter(c=>c.published!==true).length;

$("featured").textContent=
courses.filter(c=>c.featured===true).length;

if(!list.length){

$("courses").innerHTML=
`<tr><td colspan="7">No courses found.</td></tr>`;

return;
}

$("courses").innerHTML=list.map(c=>{

let paid=accessType(c)==="paid";

return `
<tr>

<td>
<strong>${esc(c.title||"Untitled Course")}</strong><br>
<small>${esc(c.instructorName||"")}</small>
</td>

<td>${esc(c.category||"General")}</td>

<td>
<span class="badge ${paid?"blue":"green"}">
${paid?"Paid":"Free"}
</span>
</td>

<td>${esc(price(c))}</td>

<td>
<span class="badge ${c.published?"green":"red"}">
${c.published?"Published":"Draft"}
</span>
</td>

<td>${c.featured?"⭐ Yes":"No"}</td>

<td>
<div class="actions">

<button class="small"
onclick="editCourse('${c.id}')">
✏️ Edit
</button>

<button class="small"
onclick="togglePublish('${c.id}')">
${c.published?"Unpublish":"Publish"}
</button>

<button class="small"
onclick="toggleFeatured('${c.id}')">
${c.featured?"Unfeature":"Feature"}
</button>

<button class="small"
onclick="previewCourse('${c.id}')">
👁
</button>

<button class="small danger"
onclick="removeCourse('${c.id}')">
Delete
</button>

</div>
</td>

</tr>
`;

}).join("");

}

async function load(){

try{

const snap=
await getDocs(collection(db,"courses"));

courses=snap.docs.map(d=>({
id:d.id,
...d.data()
}));

render();

}catch(error){

console.error(error);

$("courses").innerHTML=
`<tr><td colspan="7">
Failed to load courses: ${esc(error.message)}
</td></tr>`;

}

}

window.openModal=function(course=null){

editing=course;

$("modal").classList.add("show");

$("modalTitle").textContent=
course?"Edit Course":"Add Course";

$("courseId").value=course?.id||"";
$("title").value=course?.title||"";
$("category").value=course?.category||"";
$("level").value=course?.level||"Beginner";

$("accessType").value=
accessType(course||{})||"free";

$("price").value=course?.price||"";
$("description").value=
course?.description||"";

$("thumbnail").value=
course?.thumbnail||"";

$("instructorName").value=
course?.instructorName||"";

$("language").value=
course?.language||"English";

$("certificate").value=
String(course?.certificate===true);

$("isFeatured").value=
String(course?.featured===true);

$("isPublished").value=
String(course?.published===true);

};

window.closeModal=function(){

$("modal").classList.remove("show");
editing=null;

$("form").reset();

$("language").value="English";

};

$("form").addEventListener(
"submit",
async e=>{

e.preventDefault();

let access=
$("accessType").value;

let p=
Number($("price").value||0);

if(access==="paid"&&p<=0){

alert("Please enter a valid paid course price.");
return;

}

let data={

title:$("title").value.trim(),

category:$("category").value.trim(),

level:$("level").value,

accessType:access,

isFree:access==="free",

premium:access==="paid",

isPremium:access==="paid",

paid:access==="paid",

price:access==="paid"?p:0,

currency:"TZS",

description:$("description").value.trim(),

thumbnail:$("thumbnail").value.trim(),

instructorName:
$("instructorName").value.trim(),

language:$("language").value.trim()||"English",

certificate:
$("certificate").value==="true",

featured:
$("isFeatured").value==="true",

published:
$("isPublished").value==="true",

status:
$("isPublished").value==="true"
?"published":"draft",

updatedAt:serverTimestamp()

};

try{

if(editing){

await updateDoc(
doc(db,"courses",editing.id),
data
);

alert("Course updated successfully.");

}else{

data.createdAt=serverTimestamp();

await addDoc(
collection(db,"courses"),
data
);

alert("Course created successfully.");

}

closeModal();

await load();

}catch(error){

console.error(error);

alert(
"Save failed: "+error.message
);

}

});

window.editCourse=function(id){

let c=courses.find(x=>x.id===id);

if(c)openModal(c);

};

window.togglePublish=async function(id){

let c=courses.find(x=>x.id===id);

if(!c)return;

try{

await updateDoc(
doc(db,"courses",id),
{
published:!c.published,
status:!c.published
?"published":"draft",
updatedAt:serverTimestamp()
}
);

await load();

}catch(e){

alert(e.message);

}

};

window.toggleFeatured=async function(id){

let c=courses.find(x=>x.id===id);

if(!c)return;

try{

await updateDoc(
doc(db,"courses",id),
{
featured:!c.featured,
updatedAt:serverTimestamp()
}
);

await load();

}catch(e){

alert(e.message);

}

};

window.removeCourse=async function(id){

let c=courses.find(x=>x.id===id);

if(!confirm(
`Delete "${c?.title||"this course"}"?`
))return;

try{

await deleteDoc(
doc(db,"courses",id)
);

await load();

}catch(e){

alert(e.message);

}

};

window.previewCourse=function(id){

localStorage.setItem(
"selectedCourseId",
id
);

location.href="course.html";

};

window.logout=async function(){

await signOut(auth);

location.href="login-admin.html";

};

$("search").addEventListener(
"input",render
);

$("status").addEventListener(
"change",render
);

$("access").addEventListener(
"change",render
);

/*
AUTH
If your admin page already has its own
admin-role verification, keep that logic.
*/

onAuthStateChanged(auth,user=>{

if(!user){

location.href="login-admin.html";
return;

}

load();

});

</script>

</body>
</html>
