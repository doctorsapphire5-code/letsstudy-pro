<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Courses | LetsStudy Pro</title>

<meta name="description"
content="Secure LetsStudy Pro administrator course management dashboard.">

<meta name="robots" content="noindex,nofollow">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

header b{
  font-size:20px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 10px #0001;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card strong{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

input,
select,
textarea,
button{
  font:inherit;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d5d9e2;
  border-radius:8px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

.search{
  flex:1;
  min-width:220px;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.danger{
  background:#dc2626;
  color:white;
}

.success{
  background:#16a34a;
  color:white;
}

.warning{
  background:#d97706;
  color:white;
}

.small{
  padding:7px 9px;
  font-size:13px;
  margin:2px;
}

.table-wrap{
  overflow:auto;
  background:white;
  border-radius:12px;
  box-shadow:0 2px 10px #0001;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,
td{
  text-align:left;
  padding:13px;
  border-bottom:1px solid #eee;
  vertical-align:middle;
}

th{
  background:#f9fafb;
}

.badge{
  padding:5px 8px;
  border-radius:20px;
  font-size:12px;
  display:inline-block;
}

.green{
  background:#dcfce7;
  color:#166534;
}

.red{
  background:#fee2e2;
  color:#991b1b;
}

.blue{
  background:#dbeafe;
  color:#1e40af;
}

.orange{
  background:#ffedd5;
  color:#9a3412;
}

.status-box{
  margin-bottom:20px;
  padding:14px;
  border-radius:10px;
  display:none;
}

.status-box.show{
  display:block;
}

.status-info{
  background:#dbeafe;
  color:#1e40af;
}

.status-error{
  background:#fee2e2;
  color:#991b1b;
}

.status-success{
  background:#dcfce7;
  color:#166534;
}

#adminApp{
  display:none;
}

.auth-gate{
  max-width:700px;
  margin:60px auto;
  padding:20px;
}

.auth-gate h2{
  margin-top:0;
}

.auth-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:700px;
  max-width:100%;
  max-height:95vh;
  overflow:auto;
  border-radius:14px;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  font-weight:bold;
  display:block;
  margin-bottom:5px;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  padding:30px;
  color:#6b7280;
}

.user-info{
  font-size:13px;
  opacity:.9;
}

.loading{
  text-align:center;
  padding:25px;
}

@media(max-width:800px){

.stats{
  grid-template-columns:1fr 1fr;
}

}

@media(max-width:700px){

.grid{
  grid-template-columns:1fr;
}

.full{
  grid-column:auto;
}

header{
  align-items:flex-start;
}

}
</style>
</head>

<body>

<header>

  <div>
    <b>📚 LetsStudy Pro</b>
    <div class="user-info" id="adminInfo">
      Admin Course Management
    </div>
  </div>

  <div class="actions">

    <button
      id="dashboardBtn"
      class="secondary"
      type="button">
      Admin Dashboard
    </button>

    <button
      id="logoutBtn"
      class="danger"
      type="button">
      Logout
    </button>

  </div>

</header>


</div>


<!-- ADMIN APP -->

<div
  id="adminApp"
  class="container">

  <div
    id="statusBox"
    class="status-box">
  </div>


  <h2>Course Management</h2>

  <div class="stats">

    <div class="card">
      Total Courses
      <strong id="total">0</strong>
    </div>

    <div class="card">
      Published
      <strong id="published">0</strong>
    </div>

    <div class="card">
      Drafts
      <strong id="drafts">0</strong>
    </div>

    <div class="card">
      Featured
      <strong id="featured">0</strong>
    </div>

  </div>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="Search courses, category, instructor...">

    <select id="status">

      <option value="all">
        All Status
      </option>

      <option value="published">
        Published
      </option>

      <option value="draft">
        Draft
      </option>

    </select>


    <select id="access">

      <option value="all">
        All Access
      </option>

      <option value="free">
        Free
      </option>

      <option value="paid">
        Paid
      </option>

    </select>


    <button
      id="addCourseBtn"
      class="primary"
      type="button">
      + Add Course
    </button>

  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>
          <th>Course</th>
          <th>Category</th>
          <th>Access</th>
          <th>Price</th>
          <th>Status</th>
          <th>Featured</th>
          <th>Actions</th>
        </tr>

      </thead>

      <tbody id="courses">

        <tr>
          <td
            colspan="7"
            class="loading">
            Loading courses...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>


<!-- COURSE MODAL -->

<div
  id="modal"
  class="modal">

  <div class="modal-box">

    <h2 id="modalTitle">
      Add Course
    </h2>


    <form id="form">

      <input
        type="hidden"
        id="courseId">


      <div class="grid">


        <div class="full">

          <label>
            Course Title *
          </label>

          <input
            id="title"
            required
            maxlength="200">

        </div>


        <div>

          <label>
            Category
          </label>

          <input
            id="category"
            placeholder="Physics, Business, IT..."
            maxlength="100">

        </div>


        <div>

          <label>
            Level
          </label>

          <select id="level">

            <option value="Beginner">
              Beginner
            </option>

            <option value="Intermediate">
              Intermediate
            </option>

            <option value="Advanced">
              Advanced
            </option>

          </select>

        </div>


        <div>

          <label>
            Access Type
          </label>

          <select id="accessType">

            <option value="free">
              Free
            </option>

            <option value="paid">
              Paid
            </option>

          </select>

        </div>


        <div>

          <label>
            Price
          </label>

          <input
            id="price"
            type="number"
            min="0"
            step="1"
            placeholder="0">

        </div>


        <div class="full">

          <label>
            Short Description
          </label>

          <textarea
            id="description"
            rows="4"
            maxlength="1000">
          </textarea>

        </div>


        <div class="full">

          <label>
            Thumbnail URL
          </label>

          <input
            id="thumbnail"
            type="url"
            placeholder="https://...">

        </div>


        <div>

          <label>
            Instructor
          </label>

          <input
            id="instructorName"
            maxlength="150">

        </div>


        <div>

          <label>
            Language
          </label>

          <input
            id="language"
            value="English"
            maxlength="50">

        </div>


        <div>

          <label>
            Certificate
          </label>

          <select id="certificate">

            <option value="false">
              No
            </option>

            <option value="true">
              Yes
            </option>

          </select>

        </div>


        <div>

          <label>
            Featured
          </label>

          <select id="isFeatured">

            <option value="false">
              No
            </option>

            <option value="true">
              Yes
            </option>

          </select>

        </div>


        <div>

          <label>
            Published
          </label>

          <select id="isPublished">

            <option value="true">
              Published
            </option>

            <option value="false">
              Draft
            </option>

          </select>

        </div>

      </div>


      <br>


      <div class="actions">

        <button
          id="saveBtn"
          type="submit"
          class="primary">
          Save Course
        </button>

        <button
          id="cancelBtn"
          type="button"
          class="secondary">
          Cancel
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  getDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0rodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   STATE
========================= */

let courses = [];

let editing = null;

let currentAdmin = null;


/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showStatus(message,type="info"){

  const box = $("statusBox");

  box.textContent = message;

  box.className =
    "status-box show status-" + type;

}


function clearStatus(){

  $("statusBox").className =
    "status-box";

  $("statusBox").textContent = "";

}


/* =========================
   ACCESS TYPE
========================= */

function accessType(course){

  if(course?.isFree === true){

    return "free";

  }


  if(course?.accessType){

    return String(
      course.accessType
    ).toLowerCase() === "free"
      ? "free"
      : "paid";

  }


  if(course?.premium === true){

    return "paid";

  }


  if(course?.isPremium === true){

    return "paid";

  }


  if(course?.paid === true){

    return "paid";

  }


  return Number(
    course?.price || 0
  ) > 0
    ? "paid"
    : "free";

}


/* =========================
   PRICE
========================= */

function coursePrice(course){

  if(
    accessType(course) === "free"
  ){

    return "Free";

  }


  const amount =
    Number(
      course?.discountPrice ??
      course?.price ??
      0
    );


  return `${
    course?.currency || "TZS"
  } ${amount.toLocaleString()}`;

}






/* =========================
   RENDER
========================= */

function render(){

  const search =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const status =
    $("status").value;


  const access =
    $("access").value;


  const list =
    courses.filter(course => {

      const text = [

        course.title,

        course.category,

        course.instructorName,

        course.description,

        course.level

      ]
      .map(value =>
        String(value ?? "")
      )
      .join(" ")
      .toLowerCase();


      if(
        search &&
        !text.includes(search)
      ){

        return false;

      }


      const courseStatus =
        course.published === true
          ? "published"
          : "draft";


      if(
        status !== "all" &&
        status !== courseStatus
      ){

        return false;

      }


      if(
        access !== "all" &&
        access !== accessType(course)
      ){

        return false;

      }


      return true;

    });


  $("total").textContent =
    courses.length;


  $("published").textContent =
    courses.filter(
      course =>
        course.published === true
    ).length;


  $("drafts").textContent =
    courses.filter(
      course =>
        course.published !== true
    ).length;


  $("featured").textContent =
    courses.filter(
      course =>
        course.featured === true
    ).length;


  if(!list.length){

    $("courses").innerHTML = `
      <tr>
        <td
          colspan="7"
          class="empty">
          No courses found.
        </td>
      </tr>
    `;

    return;

  }


  $("courses").innerHTML =
    list.map(course => {

      const paid =
        accessType(course) === "paid";


      return `

        <tr>

          <td>

            <strong>
              ${esc(
                course.title ||
                "Untitled Course"
              )}
            </strong>

            <br>

            <small>
              ${esc(
                course.instructorName ||
                "No instructor"
              )}
            </small>

          </td>


          <td>
            ${esc(
              course.category ||
              "General"
            )}
          </td>


          <td>

            <span
              class="badge ${
                paid
                  ? "blue"
                  : "green"
              }">

              ${paid
                ? "Paid"
                : "Free"}

            </span>

          </td>


          <td>
            ${esc(
              coursePrice(course)
            )}
          </td>


          <td>

            <span
              class="badge ${
                course.published
                  ? "green"
                  : "red"
              }">

              ${
                course.published
                  ? "Published"
                  : "Draft"
              }

            </span>

          </td>


          <td>

            ${
              course.featured
                ? '<span class="badge orange">⭐ Featured</span>'
                : "No"
            }

          </td>


          <td>

            <div
              class="actions">

              <button
                class="small"
                data-action="edit"
                data-id="${esc(course.id)}"
                type="button">
                ✏️ Edit
              </button>


              <button
                class="small"
                data-action="publish"
                data-id="${esc(course.id)}"
                type="button">

                ${
                  course.published
                    ? "Unpublish"
                    : "Publish"
                }

              </button>


              <button
                class="small"
                data-action="featured"
                data-id="${esc(course.id)}"
                type="button">

                ${
                  course.featured
                    ? "Unfeature"
                    : "Feature"
                }

              </button>


              <button
                class="small"
                data-action="preview"
                data-id="${esc(course.id)}"
                type="button">

                👁 Preview

              </button>


              <button
                class="small danger"
                data-action="delete"
                data-id="${esc(course.id)}"
                type="button">

                Delete

              </button>

            </div>

          </td>

        </tr>

      `;

    }).join("");

}


/* =========================
   LOAD COURSES
========================= */

async function loadCourses(){

  $("courses").innerHTML = `
    <tr>
      <td
        colspan="7"
        class="loading">
        Loading courses...
      </td>
    </tr>
  `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "courses"
        )
      );


    courses =
      snapshot.docs.map(
        item => ({

          id:item.id,

          ...item.data()

        })
      );


    render();

    showStatus(
      `${courses.length} course(s) loaded successfully.`,
      "success"
    );


  }catch(error){

    console.error(
      "Load courses error:",
      error
    );


    let message =
      "Failed to load courses.";


    if(
      error.code ===
      "permission-denied"
    ){

      message =
        "Permission denied. Firestore rules must allow active administrators to read courses.";

    }else{

      message +=
        " " +
        error.message;

    }


    $("courses").innerHTML = `
      <tr>
        <td
          colspan="7"
          class="empty">
          ${esc(message)}
        </td>
      </tr>
    `;


    showStatus(
      message,
      "error"
    );

  }

}


/* =========================
   OPEN MODAL
========================= */

function openModal(course=null){

  editing = course;


  $("modal").classList.add(
    "show"
  );


  $("modalTitle").textContent =
    course
      ? "Edit Course"
      : "Add Course";


  $("courseId").value =
    course?.id || "";

  $("title").value =
    course?.title || "";

  $("category").value =
    course?.category || "";

  $("level").value =
    course?.level || "Beginner";


  $("accessType").value =
    accessType(course || {});


  $("price").value =
    course?.price ?? "";

  $("description").value =
    course?.description || "";

  $("thumbnail").value =
    course?.thumbnail || "";

  $("instructorName").value =
    course?.instructorName || "";

  $("language").value =
    course?.language || "English";


  $("certificate").value =
    String(
      course?.certificate === true
    );


  $("isFeatured").value =
    String(
      course?.featured === true
    );


  $("isPublished").value =
    String(
      course?.published === true
    );

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  $("modal")
    .classList
    .remove("show");

  editing = null;

  $("form").reset();

  $("language").value =
    "English";

}


/* =========================
   SAVE COURSE
========================= */

$("form").addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(!currentAdmin){

      showStatus(
        "Administrator session is required.",
        "error"
      );

      return;

    }


    const title =
      $("title")
        .value
        .trim();


    const category =
      $("category")
        .value
        .trim();


    const level =
      $("level").value;


    const access =
      $("accessType").value;


    const priceValue =
      Number(
        $("price").value || 0
      );


    const description =
      $("description")
        .value
        .trim();


    const thumbnail =
      $("thumbnail")
        .value
        .trim();


    const instructorName =
      $("instructorName")
        .value
        .trim();


    const language =
      $("language")
        .value
        .trim() ||
      "English";


    const certificate =
      $("certificate")
        .value === "true";


    const featured =
      $("isFeatured")
        .value === "true";


    const published =
      $("isPublished")
        .value === "true";


    if(!title){

      showStatus(
        "Course title is required.",
        "error"
      );

      return;

    }


    if(
      access === "paid" &&
      (
        !Number.isFinite(priceValue) ||
        priceValue <= 0
      )
    ){

      showStatus(
        "Please enter a valid price for a paid course.",
        "error"
      );

      return;

    }


    if(
      thumbnail &&
      !/^https?:\/\//i.test(
        thumbnail
      )
    ){

      showStatus(
        "Thumbnail URL must start with http:// or https://.",
        "error"
      );

      return;

    }


    const data = {

      title,

      category,

      level,

      accessType:access,

      isFree:
        access === "free",

      premium:
        access === "paid",

      isPremium:
        access === "paid",

      paid:
        access === "paid",

      price:
        access === "paid"
          ? priceValue
          : 0,

      currency:"TZS",

      description,

      thumbnail,

      instructorName,

      language,

      certificate,

      featured,

      published,

      status:
        published
          ? "published"
          : "draft",

      updatedAt:
        serverTimestamp(),

      updatedBy:
        currentAdmin.uid

    };


    const saveButton =
      $("saveBtn");


    saveButton.disabled = true;

    saveButton.textContent =
      "Saving...";


    try{

      if(editing){

        await updateDoc(

          doc(
            db,
            "courses",
            editing.id
          ),

          data

        );


        showStatus(
          "Course updated successfully.",
          "success"
        );


      }else{

        data.createdAt =
          serverTimestamp();

        data.createdBy =
          currentAdmin.uid;


        const newCourse =
          await addDoc(

            collection(
              db,
              "courses"
            ),

            data

          );


        console.log(
          "Created course:",
          newCourse.id
        );


        showStatus(
          "Course created successfully.",
          "success"
        );

      }


      closeModal();

      await loadCourses();


    }catch(error){

      console.error(
        "Save course error:",
        error
      );


      showStatus(
        "Save failed: " +
        error.message,
        "error"
      );


    }finally{

      saveButton.disabled =
        false;

      saveButton.textContent =
        "Save Course";

    }

  }
);


/* =========================
   EDIT COURSE
========================= */

function editCourse(id){

  const course =
    courses.find(
      item => item.id === id
    );


  if(!course){

    showStatus(
      "Course could not be found.",
      "error"
    );

    return;

  }


  openModal(course);

}


/* =========================
   TOGGLE PUBLISH
========================= */

async function togglePublish(id){

  const course =
    courses.find(
      item => item.id === id
    );


  if(!course)return;


  const nextState =
    course.published !== true;


  try{

    await updateDoc(

      doc(
        db,
        "courses",
        id
      ),

      {

        published:
          nextState,

        status:
          nextState
            ? "published"
            : "draft",

        updatedAt:
          serverTimestamp(),

        updatedBy:
          currentAdmin.uid

      }

    );


    showStatus(
      nextState
        ? "Course published successfully."
        : "Course moved to draft.",
      "success"
    );


    await loadCourses();


  }catch(error){

    console.error(
      "Publish update error:",
      error
    );


    showStatus(
      "Publish update failed: " +
      error.message,
      "error"
    );

  }

}

/* =========================
   DELETE COURSE
========================= */

async function removeCourse(id){

  const course =
    courses.find(
      item => item.id === id
    );


  if(!course)return;


  const title =
    course.title ||
    "this course";


  const confirmed =
    window.confirm(
      `Delete "${title}"?\n\nThis action cannot be undone.`
    );


  if(!confirmed)return;


  try{

    await deleteDoc(

      doc(
        db,
        "courses",
        id
      )

    );


    showStatus(
      "Course deleted successfully.",
      "success"
    );


    await loadCourses();


  }catch(error){

    console.error(
      "Delete course error:",
      error
    );


    showStatus(
      "Delete failed: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   PREVIEW COURSE
========================= */

function previewCourse(id){

  localStorage.setItem(
    "selectedCourseId",
    id
  );


  window.location.href =
    "course.html";

}


/* =========================
   EVENT DELEGATION
========================= */

$("courses").addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if(!button)return;


    const action =
      button.dataset.action;


    const id =
      button.dataset.id;


    if(!id)return;


    if(action === "edit"){

      editCourse(id);

      return;

    }


    if(action === "publish"){

      await togglePublish(id);

      return;

    }


    if(action === "featured"){

      await toggleFeatured(id);

      return;

    }


    if(action === "preview"){

      previewCourse(id);

      return;

    }


    if(action === "delete"){

      await removeCourse(id);

      return;

    }

  }
);

);

  render
);


$("access").addEventListener(

  render
);
