<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Course FAQs | LetsStudy Pro Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Inter,Arial,sans-serif;
background:#f5f7fb;
color:#101828
}

button,input,textarea{font:inherit}

button{
border:0;
cursor:pointer;
border-radius:10px;
padding:11px 16px;
font-weight:800
}

.primary{background:#155eef;color:#fff}
.secondary{background:#eef4ff;color:#155eef}
.danger{background:#fee4e2;color:#b42318}

.header{
height:68px;
background:#fff;
border-bottom:1px solid #eaecf0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
position:sticky;
top:0;
z-index:20
}

.logo{
font-size:21px;
font-weight:900;
color:#155eef
}

.admin{
font-size:13px;
color:#667085
}

.container{
width:min(1100px,100%);
margin:auto;
padding:25px 16px 60px
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
flex-wrap:wrap;
margin-bottom:22px
}

h1{font-size:28px}

.subtitle{
color:#667085;
margin-top:5px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-bottom:18px
}

.stat{
background:#fff;
border:1px solid #eaecf0;
border-radius:15px;
padding:18px
}

.stat span{
font-size:13px;
color:#667085
}

.stat strong{
display:block;
font-size:27px;
margin-top:5px
}

.card{
background:#fff;
border:1px solid #eaecf0;
border-radius:16px;
padding:18px;
margin-bottom:14px
}

.filters{
display:flex;
gap:10px;
flex-wrap:wrap
}

.search{
flex:1;
min-width:220px;
padding:12px 14px;
border:1px solid #d0d5dd;
border-radius:10px;
outline:none
}

.search:focus,
input:focus,
textarea:focus{
border-color:#155eef;
box-shadow:0 0 0 3px #155eef12
}

.faq{
display:flex;
justify-content:space-between;
gap:20px
}

.faq-content{
flex:1
}

.question{
font-size:18px;
font-weight:850
}

.answer{
margin-top:8px;
color:#667085;
white-space:pre-wrap
}

.meta{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:14px
}

.badge{
background:#f2f4f7;
color:#475467;
padding:5px 9px;
border-radius:20px;
font-size:11px;
font-weight:800
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}

.loading,
.empty{
text-align:center;
padding:40px 20px;
color:#667085
}

.error{
display:none;
background:#fef3f2;
border:1px solid #fecdca;
color:#b42318;
padding:13px;
border-radius:10px;
margin-bottom:15px
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
align-items:center;
justify-content:center;
padding:15px
}

.modal.show{display:flex}

.modal-box{
width:min(650px,100%);
max-height:94vh;
overflow:auto;
background:#fff;
border-radius:18px;
padding:22px
}

.modal-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px
}

.close{
background:#f2f4f7;
font-size:20px;
padding:7px 12px
}

.form-group{
margin-bottom:15px
}

label{
display:block;
font-size:13px;
font-weight:800;
margin-bottom:6px
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #d0d5dd;
border-radius:10px;
outline:none
}

textarea{
resize:vertical
}

.form-actions{
display:flex;
justify-content:flex-end;
gap:9px;
margin-top:20px
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr
}

.faq{
flex-direction:column
}

.actions button{
flex:1
}

}
</style>
</head>

<body>

<header class="header">

<div class="logo">
LetsStudy Pro
</div>

<div class="admin">
Admin • Course FAQs
</div>

</header>


<main class="container">

<div class="top">

<div>
<h1>Course FAQs</h1>
<p class="subtitle">
Manage frequently asked questions for your courses.
</p>
</div>

<button
class="primary"
onclick="openCreate()">

+ Add FAQ

</button>

</div>


<div id="error" class="error"></div>


<div class="stats">

<div class="stat">
<span>Total FAQs</span>
<strong id="total">0</strong>
</div>

<div class="stat">
<span>Courses</span>
<strong id="courses">0</strong>
</div>

<div class="stat">
<span>Current Course</span>
<strong id="currentCourse">All</strong>
</div>

</div>


<div class="card">

<div class="filters">

<input
id="search"
class="search"
placeholder="Search questions or answers..."
>

<input
id="courseFilter"
class="search"
placeholder="Filter by courseId..."
>

</div>

</div>


<section id="faqList">

<div class="card loading">
Loading FAQs...
</div>

</section>

</main>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
Add FAQ
</h2>

<button
class="close"
onclick="closeModal()">

×

</button>

</div>


<form id="faqForm">

<div class="form-group">

<label>Course ID *</label>

<input
id="courseId"
required
placeholder="e.g. course123"
>

</div>


<div class="form-group">

<label>Question *</label>

<input
id="question"
required
placeholder="Enter frequently asked question"
>

</div>


<div class="form-group">

<label>Answer *</label>

<textarea
id="answer"
rows="7"
required
placeholder="Enter the answer"
></textarea>

</div>


<div class="form-group">

<label>Order</label>

<input
id="order"
type="number"
min="0"
value="0"
placeholder="0"
>

</div>


<div class="form-actions">

<button
type="button"
class="secondary"
onclick="closeModal()">

Cancel

</button>

<button
type="submit"
class="primary">

Save FAQ

</button>

</div>

</form>

</div>

</div>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import{
getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================
FIREBASE CONFIG
===================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcXKAVXKbXkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let faqs=[];
let editingId=null;


/* =====================================
COURSE ID FROM URL
===================================== */

const params=
new URLSearchParams(
location.search
);

const urlCourseId=
params.get("courseId");


if(urlCourseId){

document.getElementById(
"courseFilter"
).value=urlCourseId;

document.getElementById(
"currentCourse"
).textContent=urlCourseId;

}


/* =====================================
LOAD
===================================== */

async function loadFAQs(){

try{

const snapshot=
await getDocs(
collection(db,"courseFAQs")
);

faqs=
snapshot.docs.map(d=>({

id:d.id,
...d.data()

}));

render();

}catch(error){

showError(error.message);

}

}


/* =====================================
RENDER
===================================== */

window.render=function(){

const search=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const course=
document.getElementById("courseFilter")
.value
.toLowerCase()
.trim();


const filtered=
faqs
.filter(faq=>{

const question=
String(faq.question||"")
.toLowerCase();

const answer=
String(faq.answer||"")
.toLowerCase();

const faqCourse=
String(faq.courseId||"")
.toLowerCase();

return(

(!search||
question.includes(search)||
answer.includes(search))&&

(!course||
faqCourse.includes(course))

);

})
.sort((a,b)=>
Number(a.order??999999)-
Number(b.order??999999)
);


/* Stats */

document.getElementById(
"total"
).textContent=faqs.length;


document.getElementById(
"courses"
).textContent=
new Set(
faqs
.map(x=>x.courseId)
.filter(Boolean)
).size;


document.getElementById(
"currentCourse"
).textContent=
course||"All";


if(!filtered.length){

document.getElementById(
"faqList"
).innerHTML=`

<div class="card empty">

No FAQs found.

</div>

`;

return;

}


document.getElementById(
"faqList"
).innerHTML=

filtered.map(faq=>`

<div class="card faq">

<div class="faq-content">

<div class="question">

${escapeHTML(
faq.question||"Untitled Question"
)}

</div>


<div class="answer">

${escapeHTML(
faq.answer||"No answer"
)}

</div>


<div class="meta">

<span class="badge">
Course:
${escapeHTML(faq.courseId||"-")}
</span>

<span class="badge">
Order:
${Number(faq.order??0)}
</span>

<span class="badge">
ID:
${escapeHTML(faq.id)}
</span>

</div>

</div>


<div class="actions">

<button
class="secondary"
onclick="editFAQ('${faq.id}')">

Edit

</button>

<button
class="danger"
onclick="deleteFAQ('${faq.id}')">

Delete

</button>

</div>

</div>

`).join("");

};


/* =====================================
CREATE
===================================== */

window.openCreate=function(){

editingId=null;

document.getElementById(
"modalTitle"
).textContent="Add FAQ";

document.getElementById(
"faqForm"
).reset();

document.getElementById(
"order"
).value="0";


if(urlCourseId){

document.getElementById(
"courseId"
).value=urlCourseId;

}


document.getElementById(
"modal"
).classList.add("show");

};


/* =====================================
EDIT
===================================== */

window.editFAQ=function(id){

const faq=
faqs.find(x=>x.id===id);

if(!faq)return;

editingId=id;

document.getElementById(
"modalTitle"
).textContent="Edit FAQ";

document.getElementById(
"courseId"
).value=faq.courseId||"";

document.getElementById(
"question"
).value=faq.question||"";

document.getElementById(
"answer"
).value=faq.answer||"";

document.getElementById(
"order"
).value=faq.order??0;


document.getElementById(
"modal"
).classList.add("show");

};


/* =====================================
SAVE
===================================== */

document.getElementById(
"faqForm"
).addEventListener(
"submit",
async e=>{

e.preventDefault();


const courseId=
document.getElementById(
"courseId"
).value.trim();

const question=
document.getElementById(
"question"
).value.trim();

const answer=
document.getElementById(
"answer"
).value.trim();

const order=
Number(
document.getElementById(
"order"
).value||0
);


if(!courseId||
!question||
!answer){

showError(
"Course ID, question and answer are required."
);

return;

}


try{

const data={

courseId,
question,
answer,
order

};


if(editingId){

await updateDoc(

doc(
db,
"courseFAQs",
editingId
),

{
...data,
updatedAt:
serverTimestamp()
}

);

}else{

await addDoc(

collection(
db,
"courseFAQs"
),

{
...data,

createdBy:"admin",

createdAt:
serverTimestamp()

}

);

}


closeModal();

await loadFAQs();


}catch(error){

showError(
error.message
);

}

});


/* =====================================
DELETE
===================================== */

window.deleteFAQ=
async function(id){

const faq=
faqs.find(x=>x.id===id);

if(!confirm(
`Delete "${faq?.question||"this FAQ"}"?`
))return;


try{

await deleteDoc(
doc(
db,
"courseFAQs",
id
)
);

await loadFAQs();


}catch(error){

showError(
error.message
);

}

};


/* =====================================
CLOSE
===================================== */

window.closeModal=function(){

document.getElementById(
"modal"
).classList.remove("show");

};


/* =====================================
SEARCH
===================================== */

document.getElementById(
"search"
).addEventListener(
"input",
render
);

document.getElementById(
"courseFilter"
).addEventListener(
"input",
render
);


/* =====================================
ERROR
===================================== */

function showError(message){

const el=
document.getElementById(
"error"
);

el.textContent=message;

el.style.display="block";

setTimeout(()=>{

el.style.display="none";

},6000);

}


/* =====================================
ESCAPE
===================================== */

function escapeHTML(value){

return String(
value??""
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================
START
===================================== */

loadFAQs();

</script>

</body>
</html>
