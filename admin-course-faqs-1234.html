<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Course FAQs | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.admin{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#172033;
  color:#fff;
  padding:8px 13px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:15px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

h1,h2{
  margin-top:0;
}

.subtitle{
  color:#64748b;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  font-family:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#2563eb;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#e2e8f0;
  color:#334155;
}

.danger{
  background:#fee2e2;
  color:#dc2626;
}

.search{
  margin-bottom:15px;
}

.search input{
  max-width:500px;
}

.faq{
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:16px;
  margin-bottom:12px;
}

.faq-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.faq h3{
  margin:0 0 10px;
  font-size:16px;
}

.answer{
  color:#475569;
  line-height:1.7;
  font-size:14px;
  white-space:pre-line;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.badge{
  background:#f1f5f9;
  color:#475569;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
}

.item-actions{
  display:flex;
  gap:7px;
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-bottom:15px;
  font-size:13px;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  text-align:center;
  padding:40px;
  color:#64748b;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .faq-top{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<div class="container">

<div class="admin">
<i class="fa-solid fa-shield-halved"></i>
ADMIN
</div>


<div class="card">

<h1>
<i class="fa-solid fa-circle-question"></i>
Course FAQs
</h1>

<p class="subtitle">
Create and manage frequently asked questions for courses.
</p>

</div>


<div id="message" class="message"></div>


<!-- FAQ FORM -->

<div class="card">

<h2 id="formTitle">
Add Course FAQ
</h2>

<form id="faqForm">

<div class="grid">


<div>

<label>
Course ID
</label>

<input
id="courseId"
type="text"
placeholder="Enter course ID"
required>

</div>


<div>

<label>
Order</label>

<input
id="order"
type="number"
min="0"
value="0"
required>

</div>


<div class="full">

<label>
Question
</label>

<input
id="question"
type="text"
placeholder="Enter frequently asked question"
required>

</div>


<div class="full">

<label>
Answer
</label>

<textarea
id="answer"
placeholder="Write the answer..."
required></textarea>

</div>

</div>


<div class="actions">

<button
id="saveBtn"
type="submit"
class="primary">

<i class="fa-solid fa-plus"></i>

Add FAQ

</button>


<button
id="cancelBtn"
type="button"
class="secondary"
style="display:none">

<i class="fa-solid fa-xmark"></i>

Cancel

</button>

</div>

</form>

</div>


<!-- FAQ LIST -->

<div class="card">

<h2>
All Course FAQs
</h2>

<div class="search">

<input
id="searchInput"
type="search"
placeholder="Search question, answer or course ID...">

</div>


<div id="faqList">

<div class="empty">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Loading FAQs...

</div>

</div>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
updateDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const form =
document.getElementById("faqForm");

const courseIdInput =
document.getElementById("courseId");

const questionInput =
document.getElementById("question");

const answerInput =
document.getElementById("answer");

const orderInput =
document.getElementById("order");

const faqList =
document.getElementById("faqList");

const searchInput =
document.getElementById("searchInput");

const message =
document.getElementById("message");

const saveBtn =
document.getElementById("saveBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const formTitle =
document.getElementById("formTitle");


let faqs = [];

let editId = null;

let currentUser = null;


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
error=false
){

message.textContent = text;

message.className =
"message " +
(error ? "error" : "success");

setTimeout(()=>{

message.className =
"message";

},4000);

}


/* =====================================================
   LOAD FAQs
===================================================== */

async function loadFAQs(){

faqList.innerHTML = `

<div class="empty">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Loading FAQs...

</div>

`;


try{

const snapshot =
await getDocs(
collection(
db,
"courseFAQs"
)
);


faqs =
snapshot.docs.map(
item => ({

id:item.id,

...item.data()

})
);


faqs.sort(
(a,b)=>
Number(a.order || 0)
-
Number(b.order || 0)
);


renderFAQs();

}
catch(error){

console.error(error);

faqList.innerHTML = `

<div class="empty">

<i class="fa-solid fa-triangle-exclamation"></i>

<br><br>

${esc(
error.message ||
"Failed to load FAQs."
)}

</div>

`;

}

}


/* =====================================================
   RENDER
===================================================== */

function renderFAQs(){

const search =
searchInput.value
.trim()
.toLowerCase();


const filtered =
faqs.filter(faq => {

return (

String(
faq.question || ""
)
.toLowerCase()
.includes(search)

||

String(
faq.answer || ""
)
.toLowerCase()
.includes(search)

||

String(
faq.courseId || ""
)
.toLowerCase()
.includes(search)

);

});


if(!filtered.length){

faqList.innerHTML = `

<div class="empty">

<i class="fa-solid fa-circle-question"></i>

<br><br>

No FAQs found.

</div>

`;

return;

}


faqList.innerHTML =
filtered.map(
faq => `

<div class="faq">

<div class="faq-top">

<div style="flex:1">

<h3>

<i class="fa-solid fa-question"></i>

${esc(
faq.question ||
"Untitled Question"
)}

</h3>


<div class="answer">

${esc(
faq.answer ||
"No answer."
)}

</div>


<div class="meta">

<span class="badge">

Course:
${esc(
faq.courseId || "-"
)}

</span>


<span class="badge">

Order:
${Number(
faq.order || 0
)}

</span>


<span class="badge">

ID:
${esc(
faq.id
)}

</span>

</div>

</div>


<div class="item-actions">

<button
class="secondary"
title="Edit"
onclick="editFAQ('${faq.id}')">

<i class="fa-solid fa-pen"></i>

</button>


<button
class="danger"
title="Delete"
onclick="deleteFAQ('${faq.id}')">

<i class="fa-solid fa-trash"></i>

</button>

</div>

</div>

</div>

`
).join("");

}


/* =====================================================
   ADD / UPDATE FAQ
===================================================== */

form.addEventListener(
"submit",
async event => {

event.preventDefault();


if(!currentUser){

showMessage(
"Admin login required.",
true
);

return;

}


const data = {

courseId:
courseIdInput.value.trim(),

question:
questionInput.value.trim(),

answer:
answerInput.value.trim(),

order:
Number(
orderInput.value || 0
)

};


if(!data.courseId){

showMessage(
"Course ID is required.",
true
);

return;

}


if(!data.question){

showMessage(
"Question is required.",
true
);

return;

}


if(!data.answer){

showMessage(
"Answer is required.",
true
);

return;

}


saveBtn.disabled = true;


try{


/* ================================
   UPDATE
================================ */

if(editId){

await updateDoc(

doc(
db,
"courseFAQs",
editId
),

data

);


showMessage(
"FAQ updated successfully."
);

}


/* ================================
   CREATE
   AUTOMATIC FIREBASE ID
================================ */

else{

const faqRef =
await addDoc(

collection(
db,
"courseFAQs"
),

{

courseId:
data.courseId,

question:
data.question,

answer:
data.answer,

order:
data.order,

createdBy:
currentUser.uid,

createdAt:
serverTimestamp()

}

);


console.log(
"Automatic FAQ ID:",
faqRef.id
);


showMessage(
"FAQ created successfully."
);

}


resetForm();

await loadFAQs();

}
catch(error){

console.error(error);

showMessage(
error.message ||
"Failed to save FAQ.",
true
);

}


saveBtn.disabled = false;

});


/* =====================================================
   EDIT FAQ
===================================================== */

window.editFAQ =
function(id){

const faq =
faqs.find(
item =>
item.id === id
);


if(!faq)
return;


editId = id;


courseIdInput.value =
faq.courseId || "";

questionInput.value =
faq.question || "";

answerInput.value =
faq.answer || "";

orderInput.value =
faq.order || 0;


formTitle.textContent =
"Edit Course FAQ";


saveBtn.innerHTML = `

<i class="fa-solid fa-save"></i>

Update FAQ

`;


cancelBtn.style.display =
"inline-block";


window.scrollTo({

top:0,

behavior:"smooth"

});

};


/* =====================================================
   DELETE FAQ
===================================================== */

window.deleteFAQ =
async function(id){

const faq =
faqs.find(
item =>
item.id === id
);


if(!faq)
return;


const confirmed =
confirm(
`Delete "${faq.question}"?`
);


if(!confirmed)
return;


try{

await deleteDoc(

doc(
db,
"courseFAQs",
id
)

);


showMessage(
"FAQ deleted successfully."
);


await loadFAQs();

}
catch(error){

console.error(error);

showMessage(
error.message ||
"Failed to delete FAQ.",
true
);

}

};


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

editId = null;

form.reset();

orderInput.value = 0;

formTitle.textContent =
"Add Course FAQ";


saveBtn.innerHTML = `

<i class="fa-solid fa-plus"></i>

Add FAQ

`;


cancelBtn.style.display =
"none";

}


cancelBtn.addEventListener(
"click",
resetForm
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
"input",
renderFAQs
);


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
auth,
async user => {

if(!user){

currentUser = null;

faqList.innerHTML = `

<div class="empty">

<i class="fa-solid fa-lock"></i>

<br><br>

Admin login required.

</div>

`;

return;

}


currentUser = user;

await loadFAQs();

});

</script>

</body>
</html>
