<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Content Management</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f8fb;font-family:Inter,Arial,sans-serif;color:#172033}
button,input,textarea,select{font:inherit}
.container{max-width:1100px;margin:auto;padding:25px}
.header{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin-bottom:20px}
.header h1{margin:0 0 5px;font-size:24px}
.header p{margin:0;color:#667085}
select,input,textarea{width:100%;padding:11px;border:1px solid #d9dee8;border-radius:9px;outline:none}
button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:600}
.primary{background:#155eef;color:#fff}
.danger{background:#fee4e2;color:#b42318}
.light{background:#eef2f6;color:#344054}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tabs button.active{background:#155eef;color:white}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:15px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h3{margin:0 0 5px}
.muted{color:#667085;font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid #eaecf0;border-radius:10px;margin-top:10px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.modal-box{background:#fff;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:15px;padding:20px}
.form-group{margin-bottom:13px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{text-align:center;padding:35px;color:#667085}
@media(max-width:650px){.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.card-head{align-items:flex-start;flex-direction:column}}
</style>
</head>

<body>

<main class="container">

  <section class="header">
    <h1>Course Content Management</h1>
    <p id="courseName">Select a course to manage its content.</p>

    <br>

    <select id="courseSelect">
      <option value="">Select Course</option>
    </select>
  </section>

  <div id="content" style="display:none">

    <div class="tabs">
      <button class="active" data-tab="modules">Modules</button>
      <button data-tab="lessons">Lessons</button>
      <button data-tab="quizzes">Quizzes</button>
      <button data-tab="assignments">Assignments</button>
      <button data-tab="resources">Resources</button>
    </div>

    <section class="card">
      <div class="card-head">
        <div>
          <h3 id="sectionTitle">Modules</h3>
          <span class="muted" id="count"></span>
        </div>
        <button class="primary" id="addBtn">
          <i class="fa fa-plus"></i> Add
        </button>
      </div>

      <div id="list"></div>
    </section>

  </div>
</main>


<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">

    <div class="card-head">
      <h3 id="modalTitle">Add Content</h3>
      <button class="light" id="closeModal">✕</button>
    </div>

    <br>

    <form id="form">

      <div class="form-group">
        <label>Title</label>
        <input id="title" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" rows="4"></textarea>
      </div>

      <div id="extra"></div>

      <button class="primary" style="width:100%">
        <i class="fa fa-save"></i> Save
      </button>

    </form>
  </div>
</div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 query,
 where,
 orderBy,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* STATE */

let courseId="";
let currentTab="modules";
let editingId=null;


/* DOM */

const courseSelect=document.getElementById("courseSelect");
const content=document.getElementById("content");
const list=document.getElementById("list");
const count=document.getElementById("count");
const sectionTitle=document.getElementById("sectionTitle");
const addBtn=document.getElementById("addBtn");
const modal=document.getElementById("modal");
const form=document.getElementById("form");


/* ESCAPE */

const esc=v=>String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");


/* COLLECTION MAP */

const collections={
 modules:"courseModules",
 lessons:"lessons",
 quizzes:"quizzes",
 assignments:"assignments",
 resources:"resources"
};


/* LOAD COURSES */

async function loadCourses(){

 const snap=await getDocs(collection(db,"courses"));

 snap.forEach(x=>{

   const c=x.data();

   const option=document.createElement("option");

   option.value=x.id;
   option.textContent=c.title||"Untitled Course";

   courseSelect.appendChild(option);

 });

}


/* SELECT COURSE */

courseSelect.onchange=async()=>{

 courseId=courseSelect.value;

 if(!courseId){
   content.style.display="none";
   return;
 }

 content.style.display="block";

 document.getElementById("courseName")
 .textContent=
 courseSelect.options[courseSelect.selectedIndex].text;

 await loadContent();

};


/* LOAD CONTENT */

async function loadContent(){

 list.innerHTML=
 `<div class="empty">
   <i class="fa fa-spinner fa-spin"></i>
   Loading...
 </div>`;

 try{

   const ref=collection(
     db,
     collections[currentTab]
   );

   const q=query(
     ref,
     where("courseId","==",courseId)
   );

   const snap=await getDocs(q);

   const data=[];

   snap.forEach(x=>{
     data.push({
       id:x.id,
       ...x.data()
     });
   });

   data.sort((a,b)=>
     (a.order||0)-(b.order||0)
   );

   count.textContent=
     `${data.length} item${data.length===1?"":"s"}`;

   if(!data.length){

     list.innerHTML=`
       <div class="empty">
         No ${currentTab} found.
       </div>
     `;

     return;
   }

   list.innerHTML=data.map(item=>`

     <div class="item">

       <div>
         <strong>${esc(item.title)}</strong>
         <div class="muted">
           ${esc(item.description||"No description")}
         </div>
       </div>

       <div class="actions">

         <button
           class="light"
           onclick="editItem('${item.id}')">
           <i class="fa fa-edit"></i>
         </button>

         <button
           class="danger"
           onclick="removeItem('${item.id}')">
           <i class="fa fa-trash"></i>
         </button>

       </div>

     </div>

   `).join("");

 }catch(error){

   console.error(error);

   list.innerHTML=
   `<div class="empty">
      Failed to load content.
    </div>`;

 }

}


/* TABS */

document.querySelectorAll(".tabs button")
.forEach(button=>{

 button.onclick=async()=>{

   document.querySelectorAll(".tabs button")
   .forEach(x=>x.classList.remove("active"));

   button.classList.add("active");

   currentTab=button.dataset.tab;

   sectionTitle.textContent=
     currentTab.charAt(0).toUpperCase()+
     currentTab.slice(1);

   await loadContent();

 };

});


/* EXTRA FIELDS */

function extraFields(){

 if(currentTab==="lessons"){

   return `
   <div class="grid">

    <div class="form-group">
      <label>Lesson Type</label>
      <select id="type">
       <option value="video">Video</option>
       <option value="text">Text</option>
       <option value="pdf">PDF</option>
       <option value="audio">Audio</option>
       <option value="live">Live Class</option>
      </select>
    </div>

    <div class="form-group">
      <label>Duration</label>
      <input id="duration" placeholder="15 min">
    </div>

   </div>

   <div class="form-group">
     <label>Content / URL</label>
     <input id="url" placeholder="Video, PDF or resource URL">
   </div>
   `;
 }


 if(currentTab==="quizzes"){

   return `
   <div class="grid">

    <div class="form-group">
      <label>Passing Score</label>
      <input id="passingScore" type="number" value="70">
    </div>

    <div class="form-group">
      <label>Time Limit</label>
      <input id="timeLimit" placeholder="30 minutes">
    </div>

   </div>
   `;
 }


 if(currentTab==="assignments"){

   return `
   <div class="grid">

    <div class="form-group">
      <label>Due Date</label>
      <input id="dueDate" type="datetime-local">
    </div>

    <div class="form-group">
      <label>Maximum Score</label>
      <input id="maxScore" type="number" value="100">
    </div>

   </div>

   <div class="form-group">
     <label>Attachment / Submission URL</label>
     <input id="url" placeholder="Optional URL">
   </div>
   `;
 }


 if(currentTab==="resources"){

   return `
   <div class="grid">

    <div class="form-group">
      <label>Resource Type</label>
      <select id="type">
       <option value="pdf">PDF</option>
       <option value="document">Document</option>
       <option value="video">Video</option>
       <option value="audio">Audio</option>
       <option value="link">External Link</option>
      </select>
    </div>

    <div class="form-group">
      <label>URL</label>
      <input id="url" required>
    </div>

   </div>
   `;
 }

 return `
 <div class="form-group">
   <label>Order</label>
   <input id="order" type="number" value="0">
 </div>
 `;
}


/* OPEN ADD */

addBtn.onclick=()=>{

 editingId=null;

 document.getElementById("modalTitle")
 .textContent=
 `Add ${currentTab.slice(0,-1)}`;

 form.reset();

 document.getElementById("extra").innerHTML=
 extraFields();

 modal.classList.add("show");

};


/* CLOSE */

document.getElementById("closeModal")
.onclick=()=>modal.classList.remove("show");


/* SAVE */

form.onsubmit=async e=>{

 e.preventDefault();

 const data={
   title:document.getElementById("title").value.trim(),
   description:document.getElementById("description").value.trim(),
   courseId,
   updatedAt:serverTimestamp()
 };


 if(currentTab==="modules"){

   data.order=
     Number(document.getElementById("order")?.value||0);

 }


 if(currentTab==="lessons"){

   data.type=
     document.getElementById("type").value;

   data.duration=
     document.getElementById("duration").value;

   data.url=
     document.getElementById("url").value;

 }


 if(currentTab==="quizzes"){

   data.passingScore=
     Number(document.getElementById("passingScore").value);

   data.timeLimit=
     document.getElementById("timeLimit").value;

 }


 if(currentTab==="assignments"){

   data.dueDate=
     document.getElementById("dueDate").value;

   data.maxScore=
     Number(document.getElementById("maxScore").value);

   data.url=
     document.getElementById("url").value;

 }


 if(currentTab==="resources"){

   data.type=
     document.getElementById("type").value;

   data.url=
     document.getElementById("url").value;

 }


 try{

   if(editingId){

     await updateDoc(
       doc(
         db,
         collections[currentTab],
         editingId
       ),
       data
     );

   }else{

     data.createdAt=serverTimestamp();

     await addDoc(
       collection(
         db,
         collections[currentTab]
       ),
       data
     );

   }

   modal.classList.remove("show");

   await loadContent();

 }catch(error){

   console.error(error);

   alert("Failed to save content.");

 }

};


/* EDIT */

window.editItem=async id=>{

 editingId=id;

 const snap=await getDocs(
   query(
     collection(
       db,
       collections[currentTab]
     ),
     where("__name__","==",id)
   )
 );

 let item=null;

 snap.forEach(x=>{
   item=x.data();
 });

 if(!item)return;

 document.getElementById("modalTitle")
 .textContent=
 `Edit ${currentTab.slice(0,-1)}`;

 document.getElementById("title").value=
   item.title||"";

 document.getElementById("description").value=
   item.description||"";

 document.getElementById("extra").innerHTML=
   extraFields();

 setTimeout(()=>{

   Object.keys(item).forEach(key=>{

     const el=document.getElementById(key);

     if(el && key!=="courseId"){
       el.value=item[key]||"";
     }

   });

 },10);

 modal.classList.add("show");

};


/* DELETE */

window.removeItem=async id=>{

 if(!confirm(
   `Delete this ${currentTab.slice(0,-1)}?`
 )) return;

 try{

   await deleteDoc(
     doc(
       db,
       collections[currentTab],
       id
     )
   );

   await loadContent();

 }catch(error){

   console.error(error);

   alert("Delete failed.");

 }

};


/* START */

loadCourses();

</script>

</body>
</html>
