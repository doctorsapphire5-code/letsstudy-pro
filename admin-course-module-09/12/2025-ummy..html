<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Admin Modules | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

.container{
max-width:1100px;
margin:auto;
padding:18px;
}

/* HEADER */

.header{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:18px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.header-top{
display:flex;
align-items:center;
gap:14px;
}

.header-icon{
width:52px;
height:52px;
border-radius:13px;
background:#eff6ff;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

.header h1{
margin:0;
font-size:23px;
}

.header p{
margin:6px 0 0;
color:#64748b;
font-size:13px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:18px;
}

.stat{
background:#fff;
border-radius:14px;
padding:17px;
box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.stat-label{
font-size:12px;
color:#64748b;
}

.stat-value{
font-size:24px;
font-weight:bold;
margin-top:5px;
}

/* FORM */

.form-card{
background:#fff;
padding:20px;
border-radius:16px;
margin-bottom:18px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.form-title{
font-size:17px;
font-weight:bold;
margin-bottom:15px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px;
}

.field{
display:flex;
flex-direction:column;
gap:6px;
}

.field.full{
grid-column:1/-1;
}

label{
font-size:12px;
font-weight:bold;
color:#475569;
}

input,
textarea,
select{
width:100%;
border:1px solid #dbe2ea;
border-radius:9px;
padding:11px 12px;
font-family:inherit;
font-size:13px;
outline:none;
background:#fff;
}

textarea{
min-height:100px;
resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
border-color:#2563eb;
}

/* BUTTONS */

.actions{
display:flex;
gap:9px;
margin-top:15px;
flex-wrap:wrap;
}

button{
border:0;
border-radius:9px;
padding:11px 16px;
font-weight:bold;
cursor:pointer;
font-size:13px;
}

.btn-primary{
background:#2563eb;
color:#fff;
}

.btn-secondary{
background:#e2e8f0;
color:#334155;
}

.btn-danger{
background:#fee2e2;
color:#b91c1c;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

/* LIST */

.list-card{
background:#fff;
border-radius:16px;
padding:18px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.list-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.list-title{
font-size:17px;
font-weight:bold;
}

.search{
max-width:300px;
}

/* MODULE */

.module{
border:1px solid #e5e7eb;
border-radius:13px;
padding:15px;
margin-bottom:11px;
display:flex;
gap:14px;
align-items:flex-start;
}

.module-order{
width:42px;
height:42px;
border-radius:50%;
background:#eff6ff;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
flex-shrink:0;
}

.module-content{
flex:1;
min-width:0;
}

.module-title{
font-size:15px;
font-weight:bold;
}

.module-description{
font-size:12px;
color:#64748b;
margin-top:5px;
line-height:1.5;
}

.meta{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:9px;
}

.badge{
font-size:10px;
padding:5px 9px;
border-radius:20px;
background:#f1f5f9;
color:#475569;
}

.published{
background:#dcfce7;
color:#166534;
}

.active{
background:#dcfce7;
color:#166534;
}

.draft{
background:#fef3c7;
color:#92400e;
}

.inactive{
background:#fee2e2;
color:#991b1b;
}

.module-actions{
display:flex;
gap:7px;
}

.icon-btn{
width:36px;
height:36px;
padding:0;
display:flex;
align-items:center;
justify-content:center;
}

.edit{
background:#eff6ff;
color:#2563eb;
}

.delete{
background:#fee2e2;
color:#dc2626;
}

/* EMPTY */

.empty{
text-align:center;
padding:45px 15px;
color:#64748b;
}

.empty i{
font-size:35px;
margin-bottom:12px;
}

/* LOADING */

.loading{
text-align:center;
padding:40px;
color:#64748b;
}

/* MESSAGE */

.message{
display:none;
padding:12px 14px;
border-radius:9px;
margin-bottom:15px;
font-size:13px;
}

.success{
background:#dcfce7;
color:#166534;
}

.error{
background:#fee2e2;
color:#991b1b;
}

/* MOBILE */

@media(max-width:700px){

.container{
padding:10px;
}

.stats{
grid-template-columns:1fr;
}

.form-grid{
grid-template-columns:1fr;
}

.field.full{
grid-column:auto;
}

.list-header{
flex-direction:column;
align-items:stretch;
}

.search{
max-width:none;
}

.module{
flex-wrap:wrap;
}

.module-actions{
width:100%;
justify-content:flex-end;
}

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<div class="header-top">

<div class="header-icon">
<i class="fa-solid fa-layer-group"></i>
</div>

<div>

<h1>
Admin Modules
</h1>

<p>
Manage course modules
</p>

</div>

</div>

</div>


<!-- MESSAGE -->

<div
id="message"
class="message">
</div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="stat-label">
Total Modules
</div>

<div
id="totalModules"
class="stat-value">
0
</div>

</div>


<div class="stat">

<div class="stat-label">
Published
</div>

<div
id="publishedModules"
class="stat-value">
0
</div>

</div>


<div class="stat">

<div class="stat-label">
Draft
</div>

<div
id="draftModules"
class="stat-value">
0
</div>

</div>

</div>


<!-- FORM -->

<div class="form-card">

<div
id="formTitle"
class="form-title">

Add Module

</div>


<div class="form-grid">


<div class="field">

<label>
Course
</label>

<select
id="courseId">

<option value="">
Select course
</option>

</select>

</div>


<div class="field">

<label>
Title
</label>

<input
id="title"
type="text"
placeholder="Module title">

</div>


<div class="field full">

<label>
Description
</label>

<textarea
id="description"
placeholder="Module description"></textarea>

</div>


<div class="field">

<label>
Order
</label>

<input
id="order"
type="number"
min="1"
value="1">

</div>


<div class="field">

<label>
Status
</label>

<select
id="status">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

</select>

</div>

</div>


<div class="actions">

<button
id="saveBtn"
class="btn-primary"
type="button">

<i class="fa-solid fa-plus"></i>
Add Module

</button>


<button
id="cancelBtn"
class="btn-secondary"
type="button"
style="display:none">

Cancel

</button>

</div>

</div>


<!-- LIST -->

<div class="list-card">

<div class="list-header">

<div class="list-title">
Course Modules
</div>

<input
id="search"
class="search"
type="search"
placeholder="Search modules...">

</div>


<div id="modulesList">

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Loading modules...

</div>

</div>

</div>

</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(
firebaseConfig
);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const courseSelect =
document.getElementById("courseId");

const titleInput =
document.getElementById("title");

const descriptionInput =
document.getElementById("description");

const orderInput =
document.getElementById("order");

const statusSelect =
document.getElementById("status");

const saveBtn =
document.getElementById("saveBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const modulesList =
document.getElementById("modulesList");

const searchInput =
document.getElementById("search");

const message =
document.getElementById("message");

const totalModules =
document.getElementById("totalModules");

const publishedModules =
document.getElementById("publishedModules");

const draftModules =
document.getElementById("draftModules");

const formTitle =
document.getElementById("formTitle");


/* =====================================================
   STATE
===================================================== */

let modules = [];

let courses = [];

let editingModuleId = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(
value ?? ""
)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type="success"
){

message.textContent =
text;

message.className =
"message " + type;

message.style.display =
"block";

setTimeout(
()=>{
message.style.display =
"none";
},
3500
);

}


/* =====================================================
   LOAD COURSES
===================================================== */

async function loadCourses(){

try{

const snapshot =
await getDocs(
collection(
db,
"courses"
)
);

courses =
snapshot.docs.map(
courseDoc => ({

id:
courseDoc.id,

...courseDoc.data()

})
);


/* SORT COURSES BY TITLE */

courses.sort(
(a,b)=>
String(a.title || "")
.localeCompare(
String(b.title || "")
)
);


courseSelect.innerHTML = `

<option value="">
Select course
</option>

`;


courses.forEach(
course => {

const option =
document.createElement(
"option"
);

option.value =
course.id;

option.textContent =
course.title ||
course.id;

courseSelect.appendChild(
option
);

});


}catch(error){

console.error(
"Course loading error:",
error
);

throw error;

}

}


/* =====================================================
   LOAD MODULES
===================================================== */

async function loadModules(){

modulesList.innerHTML = `

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Loading modules...

</div>

`;


try{

const snapshot =
await getDocs(
collection(
db,
"modules"
)
);


modules =
snapshot.docs.map(
moduleDoc => ({

id:
moduleDoc.id,

...moduleDoc.data()

})
);


/* SORT */

modules.sort(
(a,b)=>{

const courseA =
String(a.courseId || "");

const courseB =
String(b.courseId || "");

if(courseA !== courseB){

return courseA.localeCompare(
courseB
);

}

return Number(
a.order || 0
)
-
Number(
b.order || 0
);

}
);


/* STATS */

totalModules.textContent =
modules.length;


publishedModules.textContent =
modules.filter(
m => {

const status =
String(
m.status || ""
)
.toLowerCase();

return (
status === "published" ||
status === "active"
);

}
).length;


draftModules.textContent =
modules.filter(
m =>
String(
m.status || ""
)
.toLowerCase()
===
"draft"
).length;


renderModules();


}catch(error){

console.error(
"Module loading error:",
error
);

modulesList.innerHTML = `

<div class="empty">

<i class="fa-solid fa-triangle-exclamation"></i>

<br><br>

${escapeHTML(
error.message ||
"Failed to load modules."
)}

</div>

`;

}

}


/* =====================================================
   RENDER MODULES
===================================================== */

function renderModules(){

const search =
searchInput.value
.trim()
.toLowerCase();


const filtered =
modules.filter(
module => {

const course =
courses.find(
c =>
c.id ===
module.courseId
);

const courseTitle =
String(
course?.title || ""
)
.toLowerCase();


const title =
String(
module.title || ""
)
.toLowerCase();


const description =
String(
module.description || ""
)
.toLowerCase();


const status =
String(
module.status || ""
)
.toLowerCase();


return (

title.includes(search)

||

description.includes(search)

||

courseTitle.includes(search)

||

status.includes(search)

);

}
);


if(!filtered.length){

modulesList.innerHTML = `

<div class="empty">

<i class="fa-solid fa-layer-group"></i>

<br>

No modules found.

</div>

`;

return;

}


modulesList.innerHTML =
filtered.map(
module => {

const course =
courses.find(
c =>
c.id ===
module.courseId
);


const status =
String(
module.status ||
"draft"
)
.toLowerCase();


const safeStatus =
[
"published",
"active",
"draft",
"inactive"
].includes(status)
?
status
:
"";


return `

<div
class="module"
data-id="${escapeHTML(module.id)}">


<div class="module-order">

${Number(
module.order
) || 1}

</div>


<div class="module-content">


<div class="module-title">

${escapeHTML(
module.title ||
"Untitled Module"
)}

</div>


<div class="module-description">

${escapeHTML(
module.description ||
"No description"
)}

</div>


<div class="meta">


<span class="badge">

<i class="fa-solid fa-book"></i>

${escapeHTML(
course?.title ||
module.courseId ||
"Unknown Course"
)}

</span>


<span class="badge ${safeStatus}">

${escapeHTML(
module.status ||
"Draft"
)}

</span>


<span class="badge">

Order:
${Number(
module.order
) || 1}

</span>


</div>


</div>


<div class="module-actions">


<button
class="icon-btn edit"
title="Edit"
type="button"
data-action="edit"
data-id="${escapeHTML(module.id)}">

<i class="fa-solid fa-pen"></i>

</button>


<button
class="icon-btn delete"
title="Delete"
type="button"
data-action="delete"
data-id="${escapeHTML(module.id)}">

<i class="fa-solid fa-trash"></i>

</button>


</div>


</div>

`;

}
).join("");

}


/* =====================================================
   ADD / UPDATE
===================================================== */

saveBtn.addEventListener(
"click",
async ()=>{

const courseId =
courseSelect.value;

const title =
titleInput.value.trim();

const description =
descriptionInput.value.trim();

const order =
Number(
orderInput.value
);

const status =
statusSelect.value;


if(!courseId){

showMessage(
"Please select a course.",
"error"
);

return;

}


if(!title){

showMessage(
"Module title is required.",
"error"
);

return;

}


if(!Number.isFinite(order) || order < 1){

showMessage(
"Enter a valid module order.",
"error"
);

return;

}


if(!status){

showMessage(
"Please select module status.",
"error"
);

return;

}


saveBtn.disabled =
true;


try{

const moduleData = {

courseId:
courseId,

title:
title,

description:
description,

order:
order,

status:
status,

updatedAt:
serverTimestamp()

};


/* UPDATE */

if(editingModuleId){

await updateDoc(

doc(
db,
"modules",
editingModuleId
),

moduleData

);


showMessage(
"Module updated successfully."
);

}


/* CREATE */

else{

await addDoc(

collection(
db,
"modules"
),

{

courseId:
courseId,

title:
title,

description:
description,

order:
order,

status:
status,

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}

);


showMessage(
"Module added successfully."
);

}


resetForm();

await loadModules();


}catch(error){

console.error(
"Save module error:",
error
);

showMessage(
error.message ||
"Operation failed.",
"error"
);

}


saveBtn.disabled =
false;

});


/* =====================================================
   EDIT MODULE
===================================================== */

window.editModule =
function(id){

const module =
modules.find(
m =>
m.id === id
);

if(!module)
return;


editingModuleId =
id;


courseSelect.value =
module.courseId ||
"";

titleInput.value =
module.title ||
"";

descriptionInput.value =
module.description ||
"";

orderInput.value =
module.order ||
1;


const moduleStatus =
String(
module.status ||
"draft"
)
.toLowerCase();


statusSelect.value =
[
"draft",
"published",
"active",
"inactive"
].includes(
moduleStatus
)
?
moduleStatus
:
"draft";


formTitle.textContent =
"Edit Module";


saveBtn.innerHTML = `

<i class="fa-solid fa-save"></i>

Update Module

`;


cancelBtn.style.display =
"inline-block";


window.scrollTo({

top:0,

behavior:"smooth"

});

};


/* =====================================================
   DELETE MODULE
===================================================== */

window.removeModule =
async function(id){

const module =
modules.find(
m =>
m.id === id
);

if(!module)
return;


const confirmed =
confirm(
`Delete module "${module.title || ""}"?`
);


if(!confirmed)
return;


try{

await deleteDoc(

doc(
db,
"modules",
id
)

);


showMessage(
"Module deleted successfully."
);


await loadModules();


}catch(error){

console.error(
"Delete module error:",
error
);

showMessage(
error.message ||
"Failed to delete module.",
"error"
);

}

};


/* =====================================================
   LIST ACTIONS
===================================================== */

modulesList.addEventListener(
"click",
event => {

const button =
event.target.closest(
"button[data-action]"
);

if(!button)
return;


const id =
button.dataset.id;

const action =
button.dataset.action;


if(action === "edit"){

window.editModule(id);

}


if(action === "delete"){

window.removeModule(id);

}

}
);


/* =====================================================
   CANCEL
===================================================== */

cancelBtn.addEventListener(
"click",
resetForm
);


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

editingModuleId =
null;

courseSelect.value =
"";

titleInput.value =
"";

descriptionInput.value =
"";

orderInput.value =
1;

statusSelect.value =
"draft";

formTitle.textContent =
"Add Module";

saveBtn.innerHTML = `

<i class="fa-solid fa-plus"></i>

Add Module

`;

cancelBtn.style.display =
"none";

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
"input",
renderModules
);


/* =====================================================
   INITIAL LOAD
===================================================== */

async function initialize(){

try{

await loadCourses();

await loadModules();

}catch(error){

console.error(
"Initialization error:",
error
);

modulesList.innerHTML = `

<div class="empty">

<i class="fa-solid fa-triangle-exclamation"></i>

<br><br>

${escapeHTML(
error.message ||
"Unable to load modules."
)}

</div>

`;

}

}


initialize();

</script>

</body>
</html>
