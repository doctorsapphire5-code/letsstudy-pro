<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Modules | LetsStudy Pro</title>
<meta name="description" content="LetsStudy Pro Admin Curriculum Manager">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.top{height:65px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
.logo{font-size:20px;font-weight:800;color:#155eef}
.top-right{display:flex;gap:8px}
.container{max-width:1250px;margin:auto;padding:25px 16px 60px}
.hero{background:linear-gradient(135deg,#101828,#155eef);color:#fff;border-radius:20px;padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 8px;font-size:30px}
.hero p{margin:0;opacity:.9}
.toolbar{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:16px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap}
input,textarea,select{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:#155eef}
.search{flex:1;min-width:220px}
.primary{background:#155eef;color:#fff;padding:11px 16px;border-radius:10px;font-weight:700}
.secondary{background:#eef4ff;color:#155eef;padding:11px 16px;border-radius:10px;font-weight:700}
.danger{background:#fee4e2;color:#b42318;padding:8px 11px;border-radius:8px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:15px}
.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:#667085}
.module{background:#fff;border:1px solid #e5e7eb;border-radius:16px;margin-bottom:14px;overflow:hidden}
.module-head{padding:17px;display:flex;align-items:center;gap:12px}
.module-title{flex:1}
.module-title h2{margin:0 0 5px;font-size:17px}
.module-title p{margin:0;color:#667085;font-size:13px}
.module-actions{display:flex;gap:6px;flex-wrap:wrap}
.module-body{display:none;background:#fafafa;border-top:1px solid #eee;padding:18px}
.module-body.open{display:block}
.section{margin-bottom:20px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section h3{margin:0;font-size:15px}
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px}
.card h4{margin:0 0 6px}.card p{margin:0;color:#667085;font-size:13px;line-height:1.5}
.actions{display:flex;gap:6px;margin-top:12px}
.small{padding:7px 10px;border-radius:8px;background:#eef4ff;color:#155eef;font-size:12px;font-weight:700}
.badge{display:inline-block;background:#f2f4f7;border-radius:20px;padding:4px 8px;font-size:11px;margin:7px 4px 0 0}
.empty{text-align:center;padding:30px;color:#667085}
.loading{text-align:center;padding:40px}
.error{background:#fef3f2;color:#b42318;padding:13px;border-radius:10px;margin-bottom:15px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:100}
.modal.show{display:flex}
.modal-box{background:#fff;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h2{margin:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.close{background:#f2f4f7;border-radius:9px;padding:8px 12px}
.toast{position:fixed;right:18px;bottom:18px;background:#101828;color:#fff;padding:13px 17px;border-radius:10px;display:none;z-index:200}
.toast.show{display:block}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.card-grid,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.module-head{align-items:flex-start;flex-direction:column}.module-actions{width:100%}}
</style>
</head>

<body>

<header class="top">
  <div class="logo">LetsStudy Pro <small>ADMIN</small></div>
  <div class="top-right">
    <button class="secondary" onclick="location.reload()">Refresh</button>
  </div>
</header>

<main class="container">

<section class="hero">
  <h1>Curriculum Manager</h1>
  <p>Manage Modules → Lessons → Quizzes → Assignments → Resources → Announcements → FAQs.</p>
</section>

<div class="toolbar">
  <input id="courseId" placeholder="Enter Course ID">
  <button class="primary" onclick="loadCurriculum()">Load Course</button>
</div>

<div id="error"></div>

<div class="stats">
  <div class="stat"><b id="mCount">0</b><span>Modules</span></div>
  <div class="stat"><b id="lCount">0</b><span>Lessons</span></div>
  <div class="stat"><b id="qCount">0</b><span>Quizzes</span></div>
  <div class="stat"><b id="aCount">0</b><span>Assignments</span></div>
  <div class="stat"><b id="rCount">0</b><span>Resources</span></div>
  <div class="stat"><b id="fCount">0</b><span>FAQs</span></div>
</div>

<div class="toolbar">
  <input class="search" id="search" placeholder="Search modules, lessons...">
  <button class="primary" onclick="openForm('module')">+ Module</button>
</div>

<div id="modules">
  <div class="empty">Enter a course ID and click Load Course.</div>
</div>

</main>

<!-- MODAL -->

<div class="modal" id="modal">
<div class="modal-box">

<div class="modal-head">
  <h2 id="modalTitle">Add</h2>
  <button class="close" onclick="closeModal()">✕</button>
</div>

<form id="form">

<div id="fields"></div>

<div class="form-actions">
  <button type="button" class="close" onclick="closeModal()">Cancel</button>
  <button class="primary" type="submit">Save</button>
</div>

</form>
</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import{
getFirestore,
collection,
doc,
getDoc,
getDocs,
query,
where,
addDoc,
updateDoc,
deleteDoc,
serverTimestamp
}
from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
apiKey:"AIzaSyBcKXbAVKXbkljsyRgI_0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* STATE */

let courseId="";
let data={
modules:[],
lessons:[],
quizzes:[],
assignments:[],
resources:[],
announcements:[],
courseFAQs:[]
};

let editingId=null;
let editingCollection=null;


/* HELPERS */

const $=id=>document.getElementById(id);

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function toast(msg){
$("toast").textContent=msg;
$("toast").classList.add("show");
setTimeout(()=>$("toast").classList.remove("show"),2500);
}

function showError(msg){
$("error").innerHTML=
`<div class="error">${esc(msg)}</div>`;
}


/* LOAD COLLECTION */

async function getByCourse(collectionName){

const q=query(
collection(db,collectionName),
where("courseId","==",courseId)
);

const snap=await getDocs(q);

return snap.docs.map(d=>({
id:d.id,
...d.data()
}));

}


/* LOAD CURRICULUM */

window.loadCurriculum=async function(){

courseId=$("courseId").value.trim();

if(!courseId){
showError("Please enter a Course ID.");
return;
}

try{

$("modules").innerHTML=
`<div class="loading">Loading curriculum...</div>`;

const results=await Promise.all([
getByCourse("modules"),
getByCourse("lessons"),
getByCourse("quizzes"),
getByCourse("assignments"),
getByCourse("resources"),
getByCourse("announcements"),
getByCourse("courseFAQs")
]);

[
data.modules,
data.lessons,
data.quizzes,
data.assignments,
data.resources,
data.announcements,
data.courseFAQs
]=results;

data.modules.sort((a,b)=>
Number(a.order||0)-Number(b.order||0));

data.lessons.sort((a,b)=>
Number(a.order||0)-Number(b.order||0));

updateStats();
render();

toast("Curriculum loaded.");

}catch(e){

console.error(e);
showError(e.message);

}

};


/* STATS */

function updateStats(){

$("mCount").textContent=data.modules.length;
$("lCount").textContent=data.lessons.length;
$("qCount").textContent=data.quizzes.length;
$("aCount").textContent=data.assignments.length;
$("rCount").textContent=data.resources.length;
$("fCount").textContent=data.courseFAQs.length;

}


/* RENDER */

function render(){

const search=$("search").value.toLowerCase().trim();

let modules=data.modules.filter(m=>{

if(!search)return true;

const ls=data.lessons.filter(
l=>l.moduleId===m.id
);

return(
String(m.title||"").toLowerCase().includes(search)||
ls.some(l=>
String(l.title||"").toLowerCase().includes(search)
)
);

});


if(!modules.length){

$("modules").innerHTML=
`<div class="empty">No modules found.</div>`;

return;

}


$("modules").innerHTML=modules.map((m,i)=>{

const lessons=data.lessons.filter(
l=>l.moduleId===m.id
);

return`

<article class="module">

<div class="module-head">

<div class="module-title">
<h2>${i+1}. ${esc(m.title||"Untitled Module")}</h2>
<p>${esc(m.description||"")}</p>

<span class="badge">
${esc(m.status||"draft")}
</span>

<span class="badge">
${lessons.length} Lessons
</span>
</div>

<div class="module-actions">

<button class="small"
onclick="toggle('${m.id}')">
Open
</button>

<button class="small"
onclick="editItem('modules','${m.id}')">
Edit
</button>

<button class="danger"
onclick="removeItem('modules','${m.id}')">
Delete
</button>

</div>

</div>

<div class="module-body" id="body-${m.id}">

${renderLessons(m.id)}

${renderGlobalSection(
"Quizzes",
"quizzes",
data.quizzes,
m.id
)}

${renderGlobalSection(
"Assignments",
"assignments",
data.assignments,
m.id
)}

${renderGlobalSection(
"Resources",
"resources",
data.resources,
m.id
)}

${renderGlobalSection(
"Announcements",
"announcements",
data.announcements,
m.id
)}

${renderGlobalSection(
"FAQs",
"courseFAQs",
data.courseFAQs,
m.id
)}

</div>

</article>

`;

}).join("");

}


/* LESSONS */

function renderLessons(moduleId){

const list=data.lessons.filter(
x=>x.moduleId===moduleId
);

return`

<div class="section">

<div class="section-head">
<h3>📚 Lessons (${list.length})</h3>

<button class="small"
onclick="openForm('lessons',null,'${moduleId}')">
+ Lesson
</button>
</div>

<div class="card-grid">

${list.length?list.map(l=>`

<div class="card">

<h4>${esc(l.title||"Lesson")}</h4>

<p>${esc(l.description||"")}</p>

<span class="badge">${esc(l.type||"lesson")}</span>

${l.duration?
`<span class="badge">${esc(l.duration)}</span>`:""}

<span class="badge">
Order ${esc(l.order??0)}
</span>

<div class="actions">

<button class="small"
onclick="editItem('lessons','${l.id}')">
Edit
</button>

<button class="danger"
onclick="removeItem('lessons','${l.id}')">
Delete
</button>

</div>

</div>

`).join(""):
`<div class="empty">No lessons.</div>`}

</div>
</div>

`;

}


/* OTHER SECTIONS */

function renderGlobalSection(title,collectionName,list,moduleId){

/*
Quizzes, assignments, resources, announcements and FAQs
are linked by courseId, therefore they are shown under
the selected course.
*/

if(!list.length)return"";

let icon={
quizzes:"📝",
assignments:"📋",
resources:"📎",
announcements:"📢",
courseFAQs:"❓"
}[collectionName]||"•";

return`

<div class="section">

<div class="section-head">

<h3>${icon} ${title} (${list.length})</h3>

<button class="small"
onclick="openForm('${collectionName}')">
+ Add
</button>

</div>

<div class="card-grid">

${list.map(x=>`

<div class="card">

<h4>
${esc(
x.title||
x.name||
x.question||
"Untitled"
)}
</h4>

<p>
${esc(
x.description||
x.instructions||
x.message||
x.answer||
""
)}
</p>

${
x.priority?
`<span class="badge">${esc(x.priority)}</span>`:""
}

${
x.type?
`<span class="badge">${esc(x.type)}</span>`:""
}

<div class="actions">

<button class="small"
onclick="editItem('${collectionName}','${x.id}')">
Edit
</button>

<button class="danger"
onclick="removeItem('${collectionName}','${x.id}')">
Delete
</button>

</div>

</div>

`).join("")}

</div>
</div>

`;

}


/* TOGGLE */

window.toggle=function(id){

const el=$("body-"+id);

if(el)el.classList.toggle("open");

};


/* FORM FIELD GENERATOR */

function field(label,name,type="text",value="",full=false){

return`

<div class="field ${full?"full":""}">

<label>${label}</label>

${
type==="textarea"
?`<textarea name="${name}" rows="4">${esc(value)}</textarea>`
:type==="select"
?`<select name="${name}">
<option value="draft" ${value==="draft"?"selected":""}>Draft</option>
<option value="published" ${value==="published"?"selected":""}>Published</option>
</select>`
:`<input type="${type}" name="${name}" value="${esc(value)}">`
}

</div>

`;

}


/* OPEN FORM */

window.openForm=function(type,id=null,moduleId=null){

editingId=id;
editingCollection=type;

const existing=
id?data[type].find(x=>x.id===id):null;

let html="";

switch(type){

case"module":

$("modalTitle").textContent=
id?"Edit Module":"Add Module";

html+=field("Title","title","text",
existing?.title||"");

html+=field("Description","description",
"textarea",existing?.description||"",true);

html+=field("Order","order","number",
existing?.order??0);

html+=field("Status","status","select",
existing?.status||"draft");

break;


case"lessons":

$("modalTitle").textContent=
id?"Edit Lesson":"Add Lesson";

html+=field("Title","title","text",
existing?.title||"");

html+=field("Module ID","moduleId","text",
existing?.moduleId||moduleId||"");

html+=field("Type","type","text",
existing?.type||"video");

html+=field("Description","description",
"textarea",existing?.description||"",true);

html+=field("Content URL","contentUrl","url",
existing?.contentUrl||"");

html+=field("Duration","duration","text",
existing?.duration||"");

html+=field("Order","order","number",
existing?.order??0);

html+=field("Status","status","select",
existing?.status||"draft");

break;


case"quizzes":

$("modalTitle").textContent=
id?"Edit Quiz":"Add Quiz";

html+=field("Title","title","text",
existing?.title||"");

html+=field("Description","description",
"textarea",existing?.description||"",true);

html+=field("Passing Score","passingScore","number",
existing?.passingScore??70);

html+=field("Time Limit","timeLimit","text",
existing?.timeLimit||"");

html+=field("Attempts","attempts","number",
existing?.attempts??1);

break;


case"assignments":

$("modalTitle").textContent=
id?"Edit Assignment":"Add Assignment";

html+=field("Title","title","text",
existing?.title||"");

html+=field("Instructions","instructions",
"textarea",existing?.instructions||"",true);

html+=field("Points","points","number",
existing?.points??100);

html+=field("Submission Type","submissionType","text",
existing?.submissionType||"file");

html+=field("Deadline","deadline","datetime-local",
existing?.deadline||"");

break;


case"resources":

$("modalTitle").textContent=
id?"Edit Resource":"Add Resource";

html+=field("Name","name","text",
existing?.name||"");

html+=field("Type","type","text",
existing?.type||"PDF");

html+=field("URL","url","url",
existing?.url||"");

html+=field("Description","description",
"textarea",existing?.description||"",true);

break;


case"announcements":

$("modalTitle").textContent=
id?"Edit Announcement":"Add Announcement";

html+=field("Title","title","text",
existing?.title||"");

html+=field("Message","message",
"textarea",existing?.message||"",true);

html+=field("Priority","priority","text",
existing?.priority||"normal");

html+=field("Publish Date","publishDate",
"datetime-local",existing?.publishDate||"");

break;


case"courseFAQs":

$("modalTitle").textContent=
id?"Edit FAQ":"Add FAQ";

html+=field("Question","question",
"text",existing?.question||"",true);

html+=field("Answer","answer",
"textarea",existing?.answer||"",true);

html+=field("Order","order","number",
existing?.order??0);

break;

default:return;

}

$("fields").innerHTML=
`<div class="form-grid">${html}</div>`;

$("modal").classList.add("show");

};


/* CLOSE */

window.closeModal=function(){

$("modal").classList.remove("show");
editingId=null;
editingCollection=null;

};


/* SAVE */

$("form").addEventListener("submit",async e=>{

e.preventDefault();

if(!courseId){
toast("Load a course first.");
return;
}

try{

const fd=new FormData(e.target);
const values=Object.fromEntries(fd.entries());

if(values.order!=="")
values.order=Number(values.order);

if(values.passingScore!=="")
values.passingScore=Number(values.passingScore);

if(values.attempts!=="")
values.attempts=Number(values.attempts);

if(values.points!=="")
values.points=Number(values.points);


/* ALWAYS LINK TO COURSE */

values.courseId=courseId;


/* TIMESTAMPS */

if(editingId){

values.updatedAt=serverTimestamp();

await updateDoc(
doc(db,editingCollection,editingId),
values
);

toast("Updated successfully.");

}else{

values.createdAt=serverTimestamp();

await addDoc(
collection(db,editingCollection),
values
);

toast("Created successfully.");

}

closeModal();

await loadCurriculum();

}catch(e){

console.error(e);
showError(e.message);

}

});


/* EDIT */

window.editItem=function(collectionName,id){

openForm(collectionName,id);

};


/* DELETE */

window.removeItem=async function(collectionName,id){

if(!confirm(
"Delete this item permanently?"
))return;

try{

await deleteDoc(
doc(db,collectionName,id)
);

toast("Deleted successfully.");

await loadCurriculum();

}catch(e){

console.error(e);
showError(e.message);

}

};


/* SEARCH */

$("search").addEventListener(
"input",render
);


/* URL COURSE ID */

const params=
new URLSearchParams(location.search);

const urlCourse=params.get("courseId");

if(urlCourse){

$("courseId").value=urlCourse;
loadCurriculum();

}

</script>

</body>
</html>
