<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Courses | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer;border-radius:9px;padding:9px 12px}
header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:10}
header h1{font-size:18px;flex:1;margin:0}
.back{background:#eef2ff;color:#1d4ed8}
.primary{background:#2563eb;color:#fff}
.danger{background:#fee2e2;color:#b91c1c}
main{max-width:1250px;margin:auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat,.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px}
.stat span{font-size:11px;color:#64748b}
.stat b{display:block;font-size:23px;margin-top:5px}
.toolbar{display:flex;gap:8px;margin-bottom:14px}
.toolbar input{max-width:420px}
input,select,textarea{width:100%;padding:10px;border:1px solid #dbe1e8;border-radius:9px;outline:none;background:#fff}
.table{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4;vertical-align:middle}
th{font-size:10px;color:#64748b}
.course{display:flex;align-items:center;gap:9px;min-width:220px}
.course img{width:55px;height:40px;object-fit:cover;border-radius:7px;background:#e5e7eb}
.badge{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:bold}
.published{background:#dcfce7;color:#15803d}
.draft{background:#e5e7eb;color:#475569}
.featured{background:#fef3c7;color:#a16207}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:50}
.modal.show{display:flex}
.box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:700px;max-height:92vh;overflow:auto}
.modalhead{display:flex;align-items:center;margin-bottom:16px}
.modalhead h2{flex:1;font-size:18px;margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:5px}
.full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:12px}
.check input{width:auto}
.empty{text-align:center;padding:35px;color:#64748b}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;font-size:12px;display:none;z-index:100}
.toast.show{display:block}
@media(max-width:750px){
.stats{grid-template-columns:1fr 1fr}
.form{grid-template-columns:1fr}
.full{grid-column:auto}
}
</style></head><body><header><button class="back"
onclick="location.href='admin-dashboard.html'">
←
</button>

<h1>📚 Course Management</h1><button class="primary"
onclick="openCreate()">

+ Add Course
  </button>

</header><main><section class="stats"><div class="stat">
<span>Total Courses</span>
<b id="total">0</b>
</div><div class="stat">
<span>Published</span>
<b id="published">0</b>
</div><div class="stat">
<span>Drafts</span>
<b id="drafts">0</b>
</div><div class="stat">
<span>Featured</span>
<b id="featured">0</b>
</div></section><section class="card"><div class="toolbar"><input
id="search"
placeholder="Search course title..."
oninput="render()"

«»

<select
id="filter"
onchange="render()">

<option value="all">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option></select><select
id="categoryFilter"
onchange="render()">

<option value="all">All Categories</option>
<option value="physics">Physics</option>
<option value="chemistry">Chemistry</option>
<option value="mathematics">Mathematics</option>
<option value="biology">Biology</option>
<option value="computer">Computer Science</option>
<option value="business">Business</option>
<option value="other">Other</option></select></div><div class="table"><table><thead><tr>
<th>Course</th>
<th>Category</th>
<th>Price</th>
<th>Lessons</th>
<th>Status</th>
<th>Featured</th>
<th>Actions</th>
</tr></thead><tbody id="courseList"></tbody></table></div></section></main><!-- COURSE MODAL --><div
id="courseModal"
class="modal"><div class="box"><div class="modalhead"><h2 id="modalTitle">
Add Course
</h2><button
onclick="closeModal()">
✕
</button>

</div><form id="courseForm"><div class="form"><div class="field full"><label>Course Title</label>

<input
id="title"
required
placeholder="Advanced Physics Form 5"

«»

</div><div class="field"><label>Category</label>

<select id="category"><option value="physics">Physics</option>
<option value="chemistry">Chemistry</option>
<option value="mathematics">Mathematics</option>
<option value="biology">Biology</option>
<option value="computer">Computer Science</option>
<option value="business">Business</option>
<option value="other">Other</option></select></div><div class="field"><label>Level</label>

<select id="level"><option>Form 1</option>
<option>Form 2</option>
<option>Form 3</option>
<option>Form 4</option>
<option>Form 5</option>
<option>Form 6</option>
<option>University</option>
<option>Professional</option></select></div><div class="field"><label>Price (TZS)</label>

<input
id="price"
type="number"
min="0"
value="0"

«»

</div><div class="field"><label>Old Price (TZS)</label>

<input
id="oldPrice"
type="number"
min="0"
value="0"

«»

</div><div class="field"><label>Instructor</label>

<input
id="instructor"
placeholder="Instructor name"

«»

</div><div class="field"><label>Course Image URL</label>

<input
id="image"
type="url"
placeholder="https://..."

«»

</div><div class="field"><label>Video Preview URL</label>

<input
id="preview"
type="url"
placeholder="https://..."

«»

</div><div class="field"><label>Status</label>

<select id="status"><option value="draft">Draft</option>
<option value="published">Published</option></select></div><div class="field"><label>Duration</label>

<input
id="duration"
placeholder="8 weeks"

«»

</div><div class="field"><label>Course Slug</label>

<input
id="slug"
placeholder="advanced-physics-form-5"

«»

</div><div class="field full"><label>Description</label>

<textarea
id="description"
rows="5"
placeholder="Describe this course..."
></textarea></div><div class="field"><label class="check"><input
id="featured"
type="checkbox"

«»

Featured Course

</label></div><div class="field"><label class="check"><input
id="certificate"
type="checkbox"
checked

«»

Certificate Available

</label></div></div><br><button
class="primary"
type="submit">

💾 Save Course

</button></form></div></div><div
id="toast"
class="toast">
Saved
</div><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
doc,
getDoc,
getDocs,
addDoc,
updateDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* ==========================================
   STATE
========================================== */

let courses=[];

let editingId=null;

let currentAdmin=null;


/* ==========================================
   ADMIN AUTH
========================================== */


onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      location.href = "login.html";
      return;

    }

    admin = user;

    loadJobs();

  }
);

/* ==========================================
   LOAD COURSES
========================================== */

async function loadCourses(){

try{

const snap=
await getDocs(
collection(db,"courses")
);

courses=
snap.docs.map(
d=>({

id:d.id,
...d.data()

})
);

updateStats();

render();

}catch(error){

console.error(error);

document.getElementById(
"courseList"
).innerHTML=`

<tr>
<td colspan="7">
<div class="empty">
Unable to load courses.
</div>
</td>
</tr>

`;

}

}


/* ==========================================
   STATS
========================================== */

function updateStats(){

document.getElementById(
"total"
).textContent=courses.length;

document.getElementById(
"published"
).textContent=
courses.filter(
x=>x.status==="published"
).length;

document.getElementById(
"drafts"
).textContent=
courses.filter(
x=>x.status!=="published"
).length;

document.getElementById(
"featured"
).textContent=
courses.filter(
x=>x.featured===true
).length;

}


/* ==========================================
   RENDER
========================================== */

window.render=function(){

const search=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

const status=
document.getElementById(
"filter"
).value;

const category=
document.getElementById(
"categoryFilter"
).value;


const data=
courses.filter(c=>{

const title=
(c.title||"")
.toLowerCase();

const searchMatch=
title.includes(search);

const statusMatch=
status==="all" ||
c.status===status;

const categoryMatch=
category==="all" ||
c.category===category;

return(
searchMatch &&
statusMatch &&
categoryMatch
);

});


const list=
document.getElementById(
"courseList"
);


if(!data.length){

list.innerHTML=`

<tr>

<td colspan="7">

<div class="empty">

<h3>No courses found</h3>

<p>
Create your first course using
<strong>+ Add Course</strong>.
</p>

</div>

</td>

</tr>

`;

return;

}


list.innerHTML=
data.map(courseRow)
.join("");

};


/* ==========================================
   COURSE ROW
========================================== */

function courseRow(c){

const image=
c.image ||
"https://via.placeholder.com/120x80?text=Course";

return`

<tr>

<td>

<div class="course">

<img
src="${esc(image)}"
alt="${esc(c.title||"Course")}"
onerror="
this.src='https://via.placeholder.com/120x80?text=Course'
"
>

<div>

<strong>
${esc(c.title||"Untitled")}
</strong>

<br>

<small>
${esc(c.level||"")}
${c.instructor?
" • "+esc(c.instructor):""}
</small>

</div>

</div>

</td>


<td>
${esc(c.category||"other")}
</td>


<td>

TZS ${Number(
c.price||0
).toLocaleString()}

${Number(c.oldPrice||0)>Number(c.price||0)
?
`<br>
<small style="text-decoration:line-through;color:#94a3b8">
TZS ${Number(c.oldPrice).toLocaleString()}
</small>`
:""}

</td>


<td>
${Number(c.lessonsCount||0)}
</td>


<td>

<span class="badge ${
c.status==="published"
?"published"
:"draft"
}">

${c.status==="published"
?"Published"
:"Draft"}

</span>

</td>


<td>

${
c.featured
?
`<span class="badge featured">
⭐ Yes
</span>`
:
"—"
}

</td>


<td>

<button
class="back"
onclick="editCourse('${c.id}')">

Edit

</button>

<button
class="danger"
onclick="deleteCourse('${c.id}')">

Delete

</button>

</td>

</tr>

`;

}


/* ==========================================
   OPEN CREATE
========================================== */

window.openCreate=function(){

editingId=null;

document.getElementById(
"modalTitle"
).textContent="Add Course";

document.getElementById(
"courseForm"
).reset();

document.getElementById(
"certificate"
).checked=true;

document.getElementById(
"courseModal"
).classList.add("show");

};


/* ==========================================
   EDIT
========================================== */

window.editCourse=function(id){

const c=
courses.find(x=>x.id===id);

if(!c)return;

editingId=id;

document.getElementById(
"modalTitle"
).textContent="Edit Course";


set("title",c.title);
set("category",c.category||"other");
set("level",c.level||"Form 1");
set("price",c.price||0);
set("oldPrice",c.oldPrice||0);
set("instructor",c.instructor||"");
set("image",c.image||"");
set("preview",c.preview||"");
set("status",c.status||"draft");
set("duration",c.duration||"");
set("slug",c.slug||"");
set("description",c.description||"");


document.getElementById(
"featured"
).checked=
c.featured===true;


document.getElementById(
"certificate"
).checked=
c.certificate!==false;


document.getElementById(
"courseModal"
).classList.add("show");

};


/* ==========================================
   SAVE COURSE
========================================== */

document.getElementById(
"courseForm"
).addEventListener(
"submit",
async e=>{

e.preventDefault();

const title=
get("title");

const slug=
get("slug") ||
slugify(title);


const data={

title,

slug,

category:get("category"),

level:get("level"),

price:Number(
get("price")||0
),

oldPrice:Number(
get("oldPrice")||0
),

instructor:get("instructor"),

image:get("image"),

preview:get("preview"),

status:get("status"),

duration:get("duration"),

description:get("description"),

featured:
document.getElementById(
"featured"
).checked,

certificate:
document.getElementById(
"certificate"
).checked,

updatedAt:
serverTimestamp()

};


try{

if(editingId){

await updateDoc(
doc(
db,
"courses",
editingId
),
data
);

toast("Course updated successfully.");

}else{

await addDoc(
collection(
db,
"courses"
),
{

...data,

lessonsCount:0,

studentsCount:0,

rating:0,

reviewsCount:0,

createdBy:
currentAdmin.uid,

createdAt:
serverTimestamp()

}
);

toast("Course created successfully.");

}

closeModal();

await loadCourses();

}catch(error){

console.error(error);

toast(
"Unable to save course."
);

}

});


/* ==========================================
   DELETE
========================================== */

window.deleteCourse=
async function(id){

const c=
courses.find(x=>x.id===id);

if(!c)return;

if(!confirm(
`Delete "${c.title}"?`
))return;

try{

await deleteDoc(
doc(
db,
"courses",
id
)
);

toast("Course deleted.");

await loadCourses();

}catch(error){

console.error(error);

toast(
"Unable to delete course."
);

}

};


/* ==========================================
   CLOSE MODAL
========================================== */

window.closeModal=function(){

document.getElementById(
"courseModal"
).classList.remove("show");

editingId=null;

};


/* ==========================================
   HELPERS
========================================== */

function get(id){

return document
.getElementById(id)
.value
.trim();

}

function set(id,value){

document.getElementById(id)
.value=value;

}

function slugify(text){

return String(text||"")
.toLowerCase()
.trim()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");

}

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function toast(text){

const el=
document.getElementById("toast");

el.textContent=text;

el.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
