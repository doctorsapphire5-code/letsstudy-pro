<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Courses | LetsStudy Pro</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:#fff;
  padding:22px;
}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.brand h1{
  font-size:25px;
}

.brand p{
  margin-top:5px;
  opacity:.8;
  font-size:13px;
}

.container{
  max-width:1250px;
  margin:25px auto;
  padding:0 16px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.search,
select{
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:10px;
  padding:12px 14px;
  outline:none;
}

.search{
  flex:1;
  min-width:220px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:700;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-success{
  background:#16a34a;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.stat span{
  color:#6b7280;
  font-size:13px;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:7px;
}

.courses{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(285px,1fr));
  gap:18px;
}

.course-card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #edf0f5;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.course-image{
  height:160px;
  background:#dbeafe;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:50px;
  overflow:hidden;
}

.course-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.course-body{
  padding:17px;
}

.course-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:7px;
}

.description{
  color:#6b7280;
  font-size:14px;
  line-height:1.5;
  min-height:42px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:12px 0;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  background:#eff6ff;
  color:#2563eb;
}

.badge.paid{
  background:#fff7ed;
  color:#ea580c;
}

.badge.published{
  background:#ecfdf5;
  color:#16a34a;
}

.badge.draft{
  background:#f3f4f6;
  color:#6b7280;
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#6b7280;
  font-size:12px;
  margin-bottom:14px;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  flex:1;
  padding:9px;
  border-radius:8px;
}

.empty{
  background:#fff;
  padding:55px;
  border-radius:15px;
  text-align:center;
  color:#6b7280;
}

.loading{
  text-align:center;
  padding:40px;
  color:#6b7280;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:24px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  background:#f3f4f6;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:9px;
  outline:none;
}

.form-group textarea{
  min-height:105px;
  resize:vertical;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:#fff;
  padding:14px 18px;
  border-radius:10px;
  display:none;
  z-index:2000;
}

.toast.show{
  display:block;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:550px){

  .stats{
    grid-template-columns:1fr;
  }

  .form-row{
    grid-template-columns:1fr;
  }

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>

</head>

<body>


<header>

<div class="header-inner">

<div class="brand">

<h1>📚 Course Administration</h1>

<p>LetsStudy Pro LMS</p>

</div>

<button
class="btn btn-success"
onclick="openCreateModal()">

+ Create Course

</button>

<main class="container">


<!-- STATISTICS -->

<div class="stats">

0
</strong>

</div>


<div class="stat">

<span>Published</span>

</strong>

<div class="stat">

<span>Drafts</span>

<strong id="draftCourses">
0
</strong>

</div>


<div class="stat">

<span>Total Students</span>

<strong id="totalStudents">
0
</strong>

</div>


<!-- TOOLBAR -->

<div class="toolbar">

<input
id="searchInput"
class="search"
type="search"
placeholder="Search courses..."
oninput="renderCourses()">


<select
id="categoryFilter"
class="search"
onchange="renderCourses()">

<option value="">
All Categories
</option>

<option value="Technology">
Technology
</option>

<option value="Business">
Business
</option>

<option value="Marketing">
Marketing
</option>

<option value="Education">
Education
</option>

<option value="Programming">
Programming
</option>

<option value="Design">
Design
</option>

<option value="Career">
Career
</option>

<option value="Other">
Other
</option>

</select>


<select
id="statusFilter"
class="search"
onchange="renderCourses()">

<option value="">
All Status
</option>

<option value="published">
Published
</option>

<option value="draft">
Draft
</option>

</select>


<button
class="btn btn-secondary"
onclick="loadCourses()">

↻ Refresh

</button>

</div>


<div
id="loading"
class="loading">

Loading courses...

</div>


<div
id="coursesContainer"
class="courses">

<div
id="emptyState"

style="display:none">

<p>Create your first course.</p>

<br>

<button

onclick="openCreateModal()">

</div>


</main>


<!-- COURSE MODAL -->

<div
id="courseModal"
class="modal">

<div class="modal-box">


<div class="modal-header">

</h2>

onclick="closeModal()">

<form id="courseForm">


<div class="form-group">

<div class="form-row">


<div class="form-group">

<label>Category</label>

<select
id="courseCategory"
required>

<option value="Business">

<option value="Marketing">

<div class="form-group">

<select id="courseLevel">

<div

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp,
  query,
  orderBy
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


const coursesRef =
  collection(
    db,
    "courses"
  );


let courses = [];

let editingId = null;


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
  auth,
  user => {

    console.log(
      "Current user:",
      user
        ? user.email
        : "Guest"
    );

  }
);


/* =====================================
   LOAD COURSES
===================================== */

async function loadCourses(){

  const loading =
    document.getElementById(
      "loading"
    );

  loading.style.display =
    "block";

  try{

    const q =
      query(
        coursesRef,
        orderBy(
          "createdAt",
          "desc"
        )
      );

    const snapshot =
      await getDocs(q);

    courses =
      snapshot.docs.map(
        item => ({

          id:
            item.id,

          ...item.data()

        })
      );

  }
  catch(error){

    console.warn(
      "Ordered query failed:",
      error
    );

    try{

      const snapshot =
        await getDocs(
          coursesRef
        );

      courses =
        snapshot.docs.map(
          item => ({

            id:
              item.id,

            ...item.data()

          })
        );

    }
    catch(secondError){

      console.error(
        secondError
      );

      showToast(
        "Unable to load courses"
      );

    }

  }


  loading.style.display =
    "none";

  renderCourses();

}


window.loadCourses =
  loadCourses;


/* =====================================
   RENDER COURSES
===================================== */

function renderCourses(){

  const container =
    document.getElementById(
      "coursesContainer"
    );

  const empty =
    document.getElementById(
      "emptyState"
    );


  const search =
    document.getElementById(
      "searchInput"
    ).value
      .toLowerCase()
      .trim();


  const category =
    document.getElementById(
      "categoryFilter"
    ).value;


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const filtered =
    courses.filter(
      course => {

        const title =
          String(
            course.title ||
            course.name ||
            ""
          ).toLowerCase();


        const description =
          String(
            course.description ||
            ""
          ).toLowerCase();


        const instructor =
          String(
            course.instructor ||
            ""
          ).toLowerCase();


        const matchesSearch =
          !search ||
          title.includes(search) ||
          description.includes(search) ||
          instructor.includes(search);


        const matchesCategory =
          !category ||
          course.category === category;


        const matchesStatus =
          !status ||
          course.status === status;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesStatus
        );

      }
    );


  container.innerHTML =
    "";


  if(!filtered.length){

    container.style.display =
      "none";

    empty.style.display =
      "block";

    updateStats();

    return;

  }


  container.style.display =
    "grid";

  empty.style.display =
    "none";


  filtered.forEach(
    course => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "course-card";


      const thumbnail =
        course.thumbnail ||
        course.image ||
        "";


      const image =
        thumbnail
          ? `
            <img
              src="${escapeAttribute(thumbnail)}"
              alt="Course thumbnail"
              onerror="this.style.display='none'">
          `
          : "📚";


      const price =
        Number(
          course.price || 0
        );


      const priceText =
        course.type === "free" ||
        price === 0
          ? "Free"
          : "TZS " +
            price.toLocaleString();


      const statusClass =
        course.status ===
        "published"
          ? "published"
          : "draft";


      card.innerHTML = `

        <div class="course-image">

          ${image}

        </div>


        <div class="course-body">

          <div class="course-title">

            ${escapeHTML(
              course.title ||
              course.name ||
              "Untitled Course"
            )}

          </div>


          <div class="description">

            ${escapeHTML(
              course.description ||
              "No description"
            )}

          </div>


          <div class="badges">

            <span class="badge">

              ${escapeHTML(
                course.category ||
                "Other"
              )}

            </span>


            <span class="badge">

              ${escapeHTML(
                course.level ||
                "Beginner"
              )}

            </span>


            <span class="badge ${
              course.type === "paid"
                ? "paid"
                : ""
            }">

              ${priceText}

            </span>


            <span class="badge ${statusClass}">

              ${
                course.status ===
                "published"
                  ? "✓ Published"
                  : "Draft"
              }

            </span>

          </div>


          <div class="meta">

            <span>

              👨‍🏫 ${
                escapeHTML(
                  course.instructor ||
                  "Not assigned"
                )
              }

            </span>


            <span>

              👥 ${
                Number(
                  course.students ||
                  course.enrolledCount ||
                  0
                )
              }

            </span>

          </div>


          <div class="actions">

            <button
              class="btn-secondary"
              onclick="editCourse('${course.id}')">

              ✏️ Edit

            </button>


            <button
              class="btn-danger"
              onclick="removeCourse('${course.id}')">

              🗑 Delete

            </button>

          </div>

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );


  updateStats();

}


/* =====================================
   STATISTICS
===================================== */

function updateStats(){

  document.getElementById(
    "totalCourses"
  ).textContent =
    courses.length;


  document.getElementById(
    "publishedCourses"
  ).textContent =
    courses.filter(
      course =>
        course.status ===
        "published"
    ).length;


  document.getElementById(
    "draftCourses"
  ).textContent =
    courses.filter(
      course =>
        course.status !==
        "published"
    ).length;


  const students =
    courses.reduce(
      (
        total,
        course
      ) => {

        return (
          total +
          Number(
            course.students ||
            course.enrolledCount ||
            0
          )
        );

      },
      0
    );


  document.getElementById(
    "totalStudents"
  ).textContent =
    students.toLocaleString();

}


/* =====================================
   CREATE MODAL
===================================== */

function openCreateModal(){

  editingId =
    null;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Create Course";


  document.getElementById(
    "saveText"
  ).textContent =
    "Create Course";


  document.getElementById(
    "courseForm"
  ).reset();


  document.getElementById(
    "coursePrice"
  ).value =
    "0";


  document.getElementById(
    "courseStudents"
  ).value =
    "0";


  document.getElementById(
    "courseStatus"
  ).value =
    "draft";


  document.getElementById(
    "courseType"
  ).value =
    "free";


  document.getElementById(
    "courseModal"
  ).classList.add(
    "show"
  );

}


window.openCreateModal =
  openCreateModal;


/* =====================================
   EDIT COURSE
===================================== */

function editCourse(id){

  const course =
    courses.find(
      item =>
        item.id === id
    );


  if(!course){

    showToast(
      "Course not found"
    );

    return;

  }


  editingId =
    id;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Course";


  document.getElementById(
    "saveText"
  ).textContent =
    "Save Changes";


  document.getElementById(
    "courseTitle"
  ).value =
    course.title ||
    course.name ||
    "";


  document.getElementById(
    "courseCategory"
  ).value =
    course.category ||
    "Other";


  document.getElementById(
    "courseLevel"
  ).value =
    course.level ||
    "Beginner";


  document.getElementById(
    "courseType"
  ).value =
    course.type ||
    "free";


  document.getElementById(
    "coursePrice"
  ).value =
    Number(
      course.price || 0
    );


  document.getElementById(
    "courseInstructor"
  ).value =
    course.instructor ||
    "";


  document.getElementById(
    "courseDuration"
  ).value =
    course.duration ||
    "";

document.getElementById(
    "courseCategory"
  ).value =
    course.category ||
    "";

document.getElementById(
    "courseLevel"
  ).value =
    course.level ||
    "Beginner";

document.getElementById(
    "coursePrice"
  ).value =
    course.price ||
    0;

document.getElementById(
    "courseStatus"
  ).value =
    course.status ||
    "draft";

document.getElementById(
    "courseDescription"
  ).value =
    course.description ||
    "";

document.getElementById(
    "courseThumbnail"
  ).value =
    course.thumbnail ||
    "";

document.getElementById(
    "courseInstructor"
  ).value =
    course.instructor ||
    "";

document.getElementById(
    "courseTags"
  ).value =
    Array.isArray(course.tags)
      ? course.tags.join(", ")
      : (
          course.tags ||
          ""
        );

editingCourseId =
  id;

document.getElementById(
  "courseModalTitle"
).textContent =
  "Edit Course";

document.getElementById(
  "courseModal"
).classList.add(
  "active"
);

}


/* =====================================
   CLOSE COURSE MODAL
===================================== */

function closeCourseModal(){

  document.getElementById(
    "courseModal"
  ).classList.remove(
    "active"
  );

  editingCourseId =
    null;

  document.getElementById(
    "courseForm"
  ).reset();

}


/* =====================================
   SAVE COURSE
===================================== */

async function saveCourse(){

  const title =
    document.getElementById(
      "courseTitle"
    ).value.trim();

  const description =
    document.getElementById(
      "courseDescription"
    ).value.trim();

  const category =
    document.getElementById(
      "courseCategory"
    ).value.trim();

  const level =
    document.getElementById(
      "courseLevel"
    ).value;

  const duration =
    document.getElementById(
      "courseDuration"
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        "coursePrice"
      ).value || 0
    );

  const status =
    document.getElementById(
      "courseStatus"
    ).value;

  const thumbnail =
    document.getElementById(
      "courseThumbnail"
    ).value.trim();

  const instructor =
    document.getElementById(
      "courseInstructor"
    ).value.trim();

  const tags =
    document.getElementById(
      "courseTags"
    ).value
      .split(",")
      .map(
        tag =>
          tag.trim()
      )
      .filter(Boolean);


  if(!title){

    showToast(
      "Course title is required",
      "error"
    );

    return;

  }


  saveCourseBtn.disabled =
    true;

  saveCourseBtn.textContent =
    "Saving...";


  try{

    const data = {

      title,

      description,

      category,

      level,

      duration,

      price,

      status,

      thumbnail,

      instructor,

      tags,

      updatedAt:
        serverTimestamp(),

      updatedBy:
        currentAdmin?.uid ||
        null

    };


    if(editingCourseId){

      await updateDoc(
        doc(
          db,
          "courses",
          editingCourseId
        ),
        data
      );

      showToast(
        "Course updated successfully",
        "success"
      );

    }else{

      data.createdAt =
        serverTimestamp();

      data.createdBy =
        currentAdmin?.uid ||
        null;

      data.enrolled =
        0;

      data.rating =
        0;

      data.reviews =
        0;

      await addDoc(
        collection(
          db,
          "courses"
        ),
        data
      );

      showToast(
        "Course created successfully",
        "success"
      );

    }


    closeCourseModal();

    await loadCourses();

  }
  catch(error){

    console.error(
      "Save course error:",
      error
    );

    showToast(
      error.message ||
      "Unable to save course",
      "error"
    );

  }
  finally{

    saveCourseBtn.disabled =
      false;

    saveCourseBtn.textContent =
      "Save Course";

  }

}


/* =====================================
   DELETE COURSE
===================================== */

async function deleteCourse(id){

  const course =
    courses.find(
      c => c.id === id
    );

  if(!course){

    return;

  }


  const confirmed =
    confirm(
      `Delete "${course.title}"?\n\nThis action cannot be undone.`
    );

  if(!confirmed){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "courses",
        id
      )
    );

    showToast(
      "Course deleted successfully",
      "success"
    );

    await loadCourses();

  }
  catch(error){

    console.error(
      "Delete course error:",
      error
    );

    showToast(
      error.message ||
      "Unable to delete course",
      "error"
    );

  }

}


/* =====================================
   SEARCH COURSES
===================================== */

function searchCourses(){

  const query =
    document.getElementById(
      "courseSearch"
    ).value
      .toLowerCase()
      .trim();


  const category =
    document.getElementById(
      "filterCategory"
    ).value
      .toLowerCase();


  const status =
    document.getElementById(
      "filterStatus"
    ).value
      .toLowerCase();


  const filtered =
    courses.filter(
      course => {

        const matchesSearch =
          !query ||
          String(
            course.title || ""
          )
          .toLowerCase()
          .includes(query) ||

          String(
            course.description || ""
          )
          .toLowerCase()
          .includes(query) ||

          String(
            course.instructor || ""
          )
          .toLowerCase()
          .includes(query);


        const matchesCategory =
          !category ||
          String(
            course.category || ""
          )
          .toLowerCase() ===
          category;


        const matchesStatus =
          !status ||
          String(
            course.status || ""
          )
          .toLowerCase() ===
          status;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesStatus
        );

      }
    );


  renderCourses(
    filtered
  );

}


/* =====================================
   RENDER COURSES
===================================== */

function renderCourses(
  list
){

  const container =
    document.getElementById(
      "coursesContainer"
    );


  if(!list.length){

    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📚</div>
        <h3>No courses found</h3>
        <p>Create a new course or change your search filters.</p>
      </div>
    `;

    return;

  }


  container.innerHTML =
    list.map(
      course => {

        const title =
          escapeHtml(
            course.title ||
            "Untitled Course"
          );

        const description =
          escapeHtml(
            course.description ||
            "No description"
          );

        const category =
          escapeHtml(
            course.category ||
            "General"
          );

        const level =
          escapeHtml(
            course.level ||
            "Beginner"
          );

        const instructor =
          escapeHtml(
            course.instructor ||
            "Administrator"
          );

        const status =
          String(
            course.status ||
            "draft"
          );


        return `
          <article class="course-card">

            <div class="course-image">

              ${
                course.thumbnail
                ?
                `<img
                  src="${escapeAttribute(
                    course.thumbnail
                  )}"
                  alt="${escapeAttribute(
                    title
                  )}"
                  loading="lazy"
                >`
                :
                `<div class="course-placeholder">
                  📚
                </div>`
              }

              <span class="status-badge ${escapeAttribute(
                status
              )}">
                ${escapeHtml(
                  status
                )}
              </span>

            </div>


            <div class="course-body">

              <span class="course-category">
                ${category}
              </span>

              <h3>
                ${title}
              </h3>

              <p>
                ${description}
              </p>


              <div class="course-meta">

                <span>
                  🎓 ${level}
                </span>

                <span>
                  ⏱️ ${
                    escapeHtml(
                      course.duration ||
                      "Self-paced"
                    )
                  }
                </span>

              </div>


              <div class="course-meta">

                <span>
                  👨‍🏫 ${instructor}
                </span>

                <span>
                  👥 ${
                    Number(
                      course.enrolled ||
                      0
                    ).toLocaleString()
                  }
                </span>

              </div>


              <div class="course-footer">

                <strong>
                  ${
                    Number(
                      course.price ||
                      0
                    ) === 0
                    ?
                    "FREE"
                    :
                    "TZS " +
                    Number(
                      course.price
                    ).toLocaleString()
                  }
                </strong>


                <div class="course-actions">

                  <button
                    class="btn small"
                    onclick="editCourse('${course.id}')"
                  >
                    ✏️ Edit
                  </button>

                  <button
                    class="btn danger small"
                    onclick="deleteCourse('${course.id}')"
                  >
                    🗑️ Delete
                  </button>

                </div>

              </div>

            </div>

          </article>
        `;

      }
    )
    .join("");

}


/* =====================================
   LOAD COURSE STATISTICS
===================================== */

function updateStatistics(){

  const total =
    courses.length;

  const published =
    courses.filter(
      c =>
        String(
          c.status || ""
        ).toLowerCase() ===
        "published"
    ).length;

  const drafts =
    courses.filter(
      c =>
        String(
          c.status || ""
        ).toLowerCase() ===
        "draft"
    ).length;

  const students =
    courses.reduce(
      (
        total,
        course
      ) =>
        total +
        Number(
          course.enrolled ||
          0
        ),
      0
    );


  document.getElementById(
    "totalCourses"
  ).textContent =
    total.toLocaleString();

  document.getElementById(
    "publishedCourses"
  ).textContent =
    published.toLocaleString();

  document.getElementById(
    "draftCourses"
  ).textContent =
    drafts.toLocaleString();

  document.getElementById(
    "totalStudents"
  ).textContent =
    students.toLocaleString();

}


/* =====================================
   LOAD COURSES
===================================== */

async function loadCourses(){

  const container =
    document.getElementById(
      "coursesContainer"
    );


  container.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading courses...</p>
    </div>
  `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "courses"
        )
      );


    courses =
      snapshot.docs.map(
        item => ({

          id:
            item.id,

          ...item.data()

        })
      );


    courses.sort(
      (
        a,
        b
      ) => {

        const aTime =
          a.createdAt?.seconds ||
          0;

        const bTime =
          b.createdAt?.seconds ||
          0;

        return (
          bTime -
          aTime
        );

      }
    );


    updateStatistics();

    loadCategories();

    searchCourses();

  }
  catch(error){

    console.error(
      "Load courses error:",
      error
    );

    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <h3>Unable to load courses</h3>
        <p>
          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}
        </p>
      </div>
    `;

  }

}


/* =====================================
   LOAD CATEGORIES
===================================== */

function loadCategories(){

  const select =
    document.getElementById(
      "filterCategory"
    );


  const categories =
    [
      ...new Set(
        courses
          .map(
            course =>
              course.category
          )
          .filter(Boolean)
      )
    ]
    .sort();


  select.innerHTML = `
    <option value="">
      All Categories
    </option>
  `;


  categories.forEach(
    category => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        category;

      option.textContent =
        category;

      select.appendChild(
        option
      );

    }
  );

}


/* =====================================
   CREATE NEW COURSE
===================================== */

function createCourse(){

  editingCourseId =
    null;

  document.getElementById(
    "courseForm"
  ).reset();

  document.getElementById(
    "coursePrice"
  ).value =
    0;

  document.getElementById(
    "courseStatus"
  ).value =
    "draft";

  document.getElementById(
    "courseModalTitle"
  ).textContent =
    "Create Course";

  document.getElementById(
    "courseModal"
  ).classList.add(
    "active"
  );

}


/* =====================================
   TOAST
===================================== */

function showToast(
  message,
  type = "success"
){

  const toast =
    document.getElementById(
      "toast"
    );

  if(!toast){

    alert(message);

    return;

  }


  toast.textContent =
    message;

  toast.className =
    "toast " +
    type;

  toast.classList.add(
    "show"
  );


  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },
    3000
  );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );

}


/* =====================================
   EXPORT COURSES
===================================== */

function exportCourses(){

  if(!courses.length){

    showToast(
      "No courses to export",
      "error"
    );

    return;

  }


  const rows = [

    [
      "ID",
      "Title",
      "Category",
      "Level",
      "Instructor",
      "Price",
      "Status",
      "Enrolled"
    ]

  ];


  courses.forEach(
    course => {

      rows.push([

        course.id || "",

        course.title || "",

        course.category || "",

        course.level || "",

        course.instructor || "",

        course.price || 0,

        course.status || "",

        course.enrolled || 0

      ]);

    }
  );


  const csv =
    rows
      .map(
        row =>
          row
            .map(
              value =>
                `"${String(
                  value
                )
                  .replace(
                    /"/g,
                    '""'
                  )}"`
            )
            .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );

  link.href =
    url;

  link.download =
    "letsstudy-courses.csv";

  link.click();

  URL.revokeObjectURL(
    url
  );

}


/* =====================================
   START APPLICATION
===================================== */

loadCourses();

</script>
