<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Courses | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:#111827;
 color:#fff;
 padding:16px 20px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 position:sticky;
 top:0;
 z-index:20
}
.container{
 max-width:1200px;
 margin:auto;
 padding:20px
}
.card{
 background:#fff;
 border-radius:14px;
 padding:18px;
 margin-bottom:18px;
 box-shadow:0 3px 15px #0001
}
.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px
}
.stat{
 font-size:26px;
 font-weight:800;
 margin-top:7px
}
.form-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}
input,textarea,select{
 width:100%;
 padding:12px;
 border:1px solid #dbe0e7;
 border-radius:9px;
 font:inherit
}
textarea{
 min-height:110px;
 resize:vertical
}
.full{
 grid-column:1/-1
}
button{
 border:0;
 padding:10px 14px;
 border-radius:8px;
 cursor:pointer;
 font-weight:700
}
.primary{background:#2563eb;color:#fff}
.success{background:#16a34a;color:#fff}
.danger{background:#dc2626;color:#fff}
.warning{background:#f59e0b;color:#111}
.gray{background:#e5e7eb;color:#111}
.toolbar{
 display:grid;
 grid-template-columns:2fr 1fr 1fr;
 gap:10px;
 margin-bottom:15px
}
.course{
 border:1px solid #e5e7eb;
 border-radius:13px;
 padding:15px;
 margin-bottom:12px
}
.course h3{
 margin:0 0 7px
}
.meta{
 color:#6b7280;
 font-size:13px;
 line-height:1.7
}
.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-top:12px
}
.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 background:#eef2ff;
 color:#3730a3;
 margin-right:4px
}
.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:100
}
.modal-box{
 background:#fff;
 width:min(800px,100%);
 max-height:90vh;
 overflow:auto;
 border-radius:16px;
 padding:20px
}
.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px
}
.empty{
 text-align:center;
 padding:30px;
 color:#6b7280
}
.hidden{display:none}
@media(max-width:800px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .form-grid,.toolbar{grid-template-columns:1fr}
}
@media(max-width:500px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
 <strong>📚 LetsStudy Pro — Course Admin</strong>
 <button class="gray" onclick="logout()">Logout</button>
</header>

<main class="container">

<!-- =====================================
     STATISTICS
===================================== -->

<section class="grid">

 <div class="card">
  <div>Total Courses</div>
  <div id="totalCourses" class="stat">0</div>
 </div>

 <div class="card">
  <div>Published</div>
  <div id="publishedCourses" class="stat">0</div>
 </div>

 <div class="card">
  <div>Free Courses</div>
  <div id="freeCourses" class="stat">0</div>
 </div>

 <div class="card">
  <div>Featured</div>
  <div id="featuredCourses" class="stat">0</div>
 </div>

</section>


<!-- =====================================
     ADD COURSE
===================================== -->

<section class="card">

 <h2>Create Course</h2>

 <form id="courseForm">

  <div class="form-grid">

   <div>
    <label>Course Title</label>
    <input
     id="courseTitle"
     required
     placeholder="e.g. A-Level Biology"
    >
   </div>

   <div>
    <label>Slug</label>
    <input
     id="courseSlug"
     placeholder="a-level-biology"
    >
   </div>

   <div>
    <label>Category</label>
    <input
     id="courseCategory"
     placeholder="Biology"
    >
   </div>

   <div>
    <label>Level</label>
    <select id="courseLevel">
     <option value="beginner">Beginner</option>
     <option value="intermediate">Intermediate</option>
     <option value="advanced">Advanced</option>
     <option value="all">All Levels</option>
    </select>
   </div>

   <div>
    <label>Language</label>
    <select id="courseLanguage">
     <option value="English">English</option>
     <option value="Swahili">Swahili</option>
     <option value="English & Swahili">
      English & Swahili
     </option>
    </select>
   </div>

   <div>
    <label>Instructor Name</label>
    <input
     id="instructorName"
     placeholder="Instructor name"
    >
   </div>

   <div>
    <label>Instructor ID</label>
    <input
     id="instructorId"
     placeholder="Firebase UID"
    >
   </div>

   <div>
    <label>Duration</label>
    <input
     id="courseDuration"
     placeholder="e.g. 12 weeks"
    >
   </div>

   <div>
    <label>Price</label>
    <input
     id="coursePrice"
     type="number"
     min="0"
     value="0"
    >
   </div>

   <div>
    <label>Discount Price</label>
    <input
     id="discountPrice"
     type="number"
     min="0"
     value="0"
    >
   </div>

   <div>
    <label>Currency</label>
    <input
     id="currency"
     value="TZS"
    >
   </div>

   <div>
    <label>Thumbnail URL</label>
    <input
     id="thumbnail"
     placeholder="https://..."
    >
   </div>

   <div class="full">
    <label>Banner URL</label>
    <input
     id="banner"
     placeholder="https://..."
    >
   </div>

   <div class="full">
    <label>Short Description</label>
    <textarea
     id="shortDescription"
     placeholder="Short course description"
    ></textarea>
   </div>

   <div class="full">
    <label>Description</label>
    <textarea
     id="description"
     placeholder="Full course description"
    ></textarea>
   </div>

   <div class="full">
    <label>Requirements</label>
    <textarea
     id="requirements"
     placeholder="Course requirements"
    ></textarea>
   </div>

   <div class="full">
    <label>Learning Outcomes</label>
    <textarea
     id="learningOutcomes"
     placeholder="What students will learn"
    ></textarea>
   </div>

   <div class="full">
    <label>Tags</label>
    <input
     id="tags"
     placeholder="biology, science, a-level"
    >
   </div>

   <div>
    <label>
     <input
      id="isFree"
      type="checkbox"
     >
     Free Course
    </label>
   </div>

   <div>
    <label>
     <input
      id="published"
      type="checkbox"
     >
     Published
    </label>
   </div>

   <div>
    <label>
     <input
      id="featured"
      type="checkbox"
     >
     Featured
    </label>
   </div>

   <div>
    <label>
     <input
      id="certificateEnabled"
      type="checkbox"
      checked
     >
     Certificate Enabled
    </label>
   </div>

   <div class="full">

    <button
     class="primary"
     type="submit"
    >
     ➕ Create Course
    </button>

    <button
     type="button"
     class="gray"
     onclick="resetForm()"
    >
     Clear
    </button>

   </div>

  </div>

 </form>

</section>


<!-- =====================================
     COURSE LIST
===================================== -->

<section class="card">

 <h2>Courses</h2>

 <div class="toolbar">

  <input
   id="search"
   placeholder="Search courses..."
  >

  <select id="statusFilter">
   <option value="all">All Status</option>
   <option value="published">Published</option>
   <option value="draft">Draft</option>
  </select>

  <select id="categoryFilter">
   <option value="all">All Categories</option>
  </select>

 </div>

 <div id="courseList">
  Loading courses...
 </div>

</section>

</main>


<!-- =====================================
     EDIT MODAL
===================================== -->

<div
 id="editModal"
 class="modal"
>

 <div class="modal-box">

  <div class="modal-head">

   <h2>Edit Course</h2>

   <button
    class="gray"
    onclick="closeModal()"
   >
    ✕
   </button>

  </div>

  <div class="form-grid">

   <div class="full">
    <label>Title</label>
    <input id="editTitle">
   </div>

   <div>
    <label>Category</label>
    <input id="editCategory">
   </div>

   <div>
    <label>Level</label>
    <select id="editLevel">
     <option value="beginner">Beginner</option>
     <option value="intermediate">Intermediate</option>
     <option value="advanced">Advanced</option>
     <option value="all">All Levels</option>
    </select>
   </div>

   <div>
    <label>Price</label>
    <input
     id="editPrice"
     type="number"
    >
   </div>

   <div>
    <label>Discount Price</label>
    <input
     id="editDiscount"
     type="number"
    >
   </div>

   <div>
    <label>Duration</label>
    <input id="editDuration">
   </div>

   <div class="full">
    <label>Short Description</label>
    <textarea id="editShort"></textarea>
   </div>

   <div class="full">
    <label>Description</label>
    <textarea id="editDescription"></textarea>
   </div>

   <div class="full">
    <label>Thumbnail</label>
    <input id="editThumbnail">
   </div>

   <div class="full">
    <label>Tags</label>
    <input id="editTags">
   </div>

   <div>

    <label>
     <input
      id="editFree"
      type="checkbox"
     >
     Free
    </label>

   </div>

   <div>

    <label>
     <input
      id="editPublished"
      type="checkbox"
     >
     Published
    </label>

   </div>

   <div>

    <label>
     <input
      id="editFeatured"
      type="checkbox"
     >
     Featured
    </label>

   </div>

   <div>

    <label>
     <input
      id="editCertificate"
      type="checkbox"
     >
     Certificate
    </label>

   </div>

   <div class="full">

    <button
     class="primary"
     onclick="saveEdit()"
    >
     💾 Save Changes
    </button>

   </div>

  </div>

 </div>

</div>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

 measurementId:
 "G-85B7V5H5J0"

};


const app =
 initializeApp(
  firebaseConfig
 );

const auth =
 getAuth(app);

const db =
 getFirestore(app);


/* =====================================
   STATE
===================================== */

let courses = [];

let editingId = null;

let currentUser = null;


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
 auth,
 async user => {

  currentUser = user;

  await loadCourses();

 }
);


/* =====================================
   LOAD COURSES
===================================== */

async function loadCourses(){

 try{

  const snap =
   await getDocs(
    collection(
     db,
     "courses"
    )
   );

  courses =
   snap.docs.map(
    d => ({
     id:d.id,
     ...d.data()
    })
   );

  updateStats();

  updateCategories();

  renderCourses();

 }
 catch(error){

  console.error(
   "Course loading error:",
   error
  );

  document.getElementById(
   "courseList"
  ).innerHTML =
   "<div class='empty'>Failed to load courses.</div>";

 }

}


/* =====================================
   CREATE COURSE
===================================== */

document
 .getElementById(
  "courseForm"
 )
 .addEventListener(
  "submit",
  async event => {

   event.preventDefault();

   const title =
    value("courseTitle");

   if(!title){

    alert(
     "Course title is required."
    );

    return;

   }


   try{

    const slug =
     value("courseSlug") ||
     createSlug(title);

    const isFree =
     checked("isFree");

    const published =
     checked("published");

    const data = {

     title,

     slug,

     description:
      value("description"),

     shortDescription:
      value("shortDescription"),

     thumbnail:
      value("thumbnail"),

     banner:
      value("banner"),

     categoryId:
      createSlug(
       value("courseCategory")
      ),

     categoryName:
      value("courseCategory"),

     instructorId:
      value("instructorId"),

     instructorName:
      value("instructorName"),

     level:
      value("courseLevel"),

     language:
      value("courseLanguage"),

     price:
      Number(
       value("coursePrice")
      ) || 0,

     currency:
      value("currency") ||
      "TZS",

     discountPrice:
      Number(
       value("discountPrice")
      ) || 0,

     isFree,

     status:
      published ?
      "published" :
      "draft",

     featured:
      checked("featured"),

     published,

     rating:0,

     ratingCount:0,

     enrollmentCount:0,

     duration:
      value("courseDuration"),

     lessonCount:0,

     certificateEnabled:
      checked(
       "certificateEnabled"
      ),

     requirements:
      value("requirements"),

     learningOutcomes:
      value("learningOutcomes"),

     tags:
      value("tags")
       .split(",")
       .map(
        x => x.trim()
       )
       .filter(Boolean),

     createdAt:
      serverTimestamp(),

     updatedAt:
      serverTimestamp(),

     publishedAt:
      published ?
      serverTimestamp() :
      null,

     createdBy:
      currentUser?.uid ||
      ""

    };


    await addDoc(
     collection(
      db,
      "courses"
     ),
     data
    );


    alert(
     "Course created successfully."
    );

    resetForm();

    await loadCourses();

   }
   catch(error){

    console.error(error);

    alert(
     "Failed to create course: " +
     error.message
    );

   }

  }
);


/* =====================================
   RENDER
===================================== */

function renderCourses(){

 const search =
  value("search")
   .toLowerCase();

 const status =
  value("statusFilter");

 const category =
  value("categoryFilter");


 const filtered =
  courses.filter(
   course => {

    const text =
     (
      course.title ||
      ""
     ).toLowerCase();

    const matchesSearch =
     !search ||
     text.includes(search);

    const matchesStatus =
     status === "all" ||
     (
      status === "published" &&
      course.published === true
     ) ||
     (
      status === "draft" &&
      course.published !== true
     );

    const matchesCategory =
     category === "all" ||
     (
      course.categoryName ||
      ""
     ) === category;

    return (
     matchesSearch &&
     matchesStatus &&
     matchesCategory
    );

   }
  );


 const container =
  document.getElementById(
   "courseList"
  );


 if(!filtered.length){

  container.innerHTML = `
   <div class="empty">
    <div style="font-size:35px">
     📚
    </div>
    <p>No courses found.</p>
   </div>
  `;

  return;

 }


 container.innerHTML =
  filtered.map(
   course => {

    const price =
     course.isFree
     ? "FREE"
     : (
      course.currency ||
      "TZS"
     ) +
     " " +
     Number(
      course.discountPrice ||
      course.price ||
      0
     ).toLocaleString();


    return `

     <div class="course">

      <h3>
       ${escapeHTML(
        course.title ||
        "Untitled Course"
       )}
      </h3>

      <div class="meta">

       Category:
       ${escapeHTML(
        course.categoryName ||
        "-"
       )}

       <br>

       Level:
       ${escapeHTML(
        course.level ||
        "-"
       )}

       <br>

       Instructor:
       ${escapeHTML(
        course.instructorName ||
        "-"
       )}

       <br>

       Price:
       <strong>
        ${escapeHTML(price)}
       </strong>

       <br>

       Enrollments:
       ${Number(
        course.enrollmentCount ||
        0
       ).toLocaleString()}

       <br>

       Rating:
       ⭐
       ${Number(
        course.rating ||
        0
       ).toFixed(1)}

      </div>

      <div style="margin-top:8px">

       <span class="badge">
        ${
         course.published
         ? "Published"
         : "Draft"
        }
       </span>

       ${
        course.featured
        ? `
         <span class="badge">
          ⭐ Featured
         </span>
        `
        : ""
       }

       ${
        course.isFree
        ? `
         <span class="badge">
          Free
         </span>
        `
        : ""
       }

      </div>

      <div class="actions">

       <button
        class="primary"
        onclick="editCourse('${course.id}')"
       >
        ✏️ Edit
       </button>

       <button
        class="warning"
        onclick="togglePublish('${course.id}')"
       >
        ${
         course.published
         ? "Unpublish"
         : "Publish"
        }
       </button>

       <button
        class="success"
        onclick="toggleFeatured('${course.id}')"
       >
        ${
         course.featured
         ? "Remove Featured"
         : "⭐ Featured"
        }
       </button>

       <button
        class="danger"
        onclick="deleteCourse('${course.id}')"
       >
        🗑 Delete
       </button>

      </div>

     </div>

    `;

   }
  ).join("");

}


/* =====================================
   EDIT COURSE
===================================== */

window.editCourse =
 function(id){

  const course =
   courses.find(
    x => x.id === id
   );

  if(!course)
   return;

  editingId = id;


  document.getElementById(
   "editTitle"
  ).value =
   course.title || "";


  document.getElementById(
   "editCategory"
  ).value =
   course.categoryName || "";


  document.getElementById(
   "editLevel"
  ).value =
   course.level || "all";


  document.getElementById(
   "editPrice"
  ).value =
   course.price || 0;


  document.getElementById(
   "editDiscount"
  ).value =
   course.discountPrice || 0;


  document.getElementById(
   "editDuration"
  ).value =
   course.duration || "";


  document.getElementById(
   "editShort"
  ).value =
   course.shortDescription || "";


  document.getElementById(
   "editDescription"
  ).value =
   course.description || "";


  document.getElementById(
   "editThumbnail"
  ).value =
   course.thumbnail || "";


  document.getElementById(
   "editTags"
  ).value =
   Array.isArray(
    course.tags
   )
   ? course.tags.join(", ")
   : (
    course.tags || ""
   );


  document.getElementById(
   "editFree"
  ).checked =
   course.isFree === true;


  document.getElementById(
   "editPublished"
  ).checked =
   course.published === true;


  document.getElementById(
   "editFeatured"
  ).checked =
   course.featured === true;


  document.getElementById(
   "editCertificate"
  ).checked =
   course.certificateEnabled !== false;


  document.getElementById(
   "editModal"
  ).style.display =
   "flex";

 };


/* =====================================
   SAVE EDIT
===================================== */

window.saveEdit =
 async function(){

  if(!editingId)
   return;


  const data = {

   title:
    value("editTitle"),

   categoryName:
    value("editCategory"),

   categoryId:
    createSlug(
     value("editCategory")
    ),

   level:
    value("editLevel"),

   price:
    Number(
     value("editPrice")
    ) || 0,

   discountPrice:
    Number(
     value("editDiscount")
    ) || 0,

   duration:
    value("editDuration"),

   shortDescription:
    value("editShort"),

   description:
    value("editDescription"),

   thumbnail:
    value("editThumbnail"),

   tags:
    value("editTags")
     .split(",")
     .map(
      x => x.trim()
     )
     .filter(Boolean),

   isFree:
    checked("editFree"),

   published:
    checked("editPublished"),

status:
    checked("editPublished")
      ? "published"
      : "draft",

featured:
    checked("editFeatured"),

certificateEnabled:
    checked("editCertificate"),

updatedAt:
    serverTimestamp(),

publishedAt:
    checked("editPublished")
      ? serverTimestamp()
      : null

};


try{

  await updateDoc(
    doc(
      db,
      "courses",
      editingId
    ),
    data
  );

  alert(
    "Course updated successfully."
  );

  closeModal();

  await loadCourses();

}
catch(error){

  console.error(
    "Update course error:",
    error
  );

  alert(
    "Failed to update course: " +
    error.message
  );

}

};


/* =====================================
   PUBLISH / UNPUBLISH
===================================== */

window.togglePublish =
async function(id){

  const course =
    courses.find(
      item => item.id === id
    );

  if(!course){

    alert(
      "Course not found."
    );

    return;

  }


  const newStatus =
    course.published !== true;


  const action =
    newStatus
      ? "publish"
      : "unpublish";


  if(
    !confirm(
      "Are you sure you want to " +
      action +
      " this course?"
    )
  ){

    return;

  }


  try{

    await updateDoc(
      doc(
        db,
        "courses",
        id
      ),
      {

        published:
          newStatus,

        status:
          newStatus
            ? "published"
            : "draft",

        publishedAt:
          newStatus
            ? serverTimestamp()
            : null,

        updatedAt:
          serverTimestamp()

      }
    );


    await loadCourses();

  }
  catch(error){

    console.error(
      "Publish error:",
      error
    );

    alert(
      "Failed to update course status."
    );

  }

};


/* =====================================
   FEATURED
===================================== */

window.toggleFeatured =
async function(id){

  const course =
    courses.find(
      item => item.id === id
    );

  if(!course){

    return;

  }


  try{

    await updateDoc(
      doc(
        db,
        "courses",
        id
      ),
      {

        featured:
          course.featured !== true,

        updatedAt:
          serverTimestamp()

      }
    );


    await loadCourses();

  }
  catch(error){

    console.error(
      "Featured update error:",
      error
    );

    alert(
      "Failed to update featured status."
    );

  }

};


/* =====================================
   DELETE COURSE
===================================== */

window.deleteCourse =
async function(id){

  const course =
    courses.find(
      item => item.id === id
    );

  if(!course){

    return;

  }


  const confirmed =
    confirm(
      "Delete this course?\n\n" +
      course.title +
      "\n\nThis action cannot be undone."
    );


  if(!confirmed){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "courses",
        id
      )
    );


    alert(
      "Course deleted successfully."
    );


    await loadCourses();

  }
  catch(error){

    console.error(
      "Delete course error:",
      error
    );

    alert(
      "Failed to delete course: " +
      error.message
    );

  }

};


/* =====================================
   STATISTICS
===================================== */

function updateStats(){

  const total =
    courses.length;


  const published =
    courses.filter(
      course =>
        course.published === true
    ).length;


  const free =
    courses.filter(
      course =>
        course.isFree === true
    ).length;


  const featured =
    courses.filter(
      course =>
        course.featured === true
    ).length;


  document.getElementById(
    "totalCourses"
  ).textContent =
    total;


  document.getElementById(
    "publishedCourses"
  ).textContent =
    published;


  document.getElementById(
    "freeCourses"
  ).textContent =
    free;


  document.getElementById(
    "featuredCourses"
  ).textContent =
    featured;

}


/* =====================================
   CATEGORY FILTER
===================================== */

function updateCategories(){

  const select =
    document.getElementById(
      "categoryFilter"
    );


  const categories =
    [
      ...new Set(
        courses
          .map(
            course =>
              course.categoryName
          )
          .filter(Boolean)
      )
    ]
    .sort();


  select.innerHTML =
    `
      <option value="all">
        All Categories
      </option>
    `;


  categories.forEach(
    category => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        category;


      option.textContent =
        category;


      select.appendChild(
        option
      );

    }
  );

}

/* =====================================
   SLUG GENERATOR
===================================== */

function createSlug(text){

  return String(
    text || ""
  )
  .toLowerCase()
  .trim()
  .replace(
    /[^a-z0-9]+/g,
    "-"
  )
  .replace(
    /^-+|-+$/g,
    "");

}


/* =====================================
   HTML ESCAPE
===================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
