<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Courses | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:#111827;
 color:#fff;
 padding:18px 22px;
 display:flex;
 justify-content:space-between;
 align-items:center
}
.container{
 max-width:1200px;
 margin:auto;
 padding:20px
}
.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin-bottom:20px
}
.card{
 background:#fff;
 border-radius:14px;
 padding:18px;
 box-shadow:0 3px 15px #0001
}
.stat{
 font-size:28px;
 font-weight:bold;
 margin-top:8px
}
.form{
 display:grid;
 gap:11px
}
input,textarea,select{
 width:100%;
 padding:12px;
 border:1px solid #d9dee8;
 border-radius:9px;
 font-size:15px
}
textarea{
 min-height:100px;
 resize:vertical
}
button{
 border:0;
 border-radius:9px;
 padding:10px 15px;
 cursor:pointer;
 font-weight:bold
}
.primary{background:#2563eb;color:#fff}
.danger{background:#dc2626;color:#fff}
.secondary{background:#e5e7eb;color:#111}
.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap
}
.toolbar{
 display:grid;
 grid-template-columns:2fr 1fr;
 gap:10px;
 margin-bottom:15px
}
.course{
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:16px;
 margin-bottom:12px
}
.course h3{
 margin:0 0 7px
}
.meta{
 color:#6b7280;
 font-size:13px;
 line-height:1.7
}
.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 background:#eef2ff;
 color:#3730a3;
 font-size:12px
}
#loading{
 text-align:center;
 padding:50px
}
.hidden{display:none}
@media(max-width:800px){
 .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
 .grid{grid-template-columns:1fr}
 .toolbar{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
 <strong>📚 LetsStudy Pro — Courses</strong>
 <button class="secondary" onclick="logout()">Logout</button>
</header>

<div id="loading">Loading Courses...</div>

<main id="app" class="container hidden">

 <div class="grid">

  <div class="card">
   <div>Total Courses</div>
   <div id="total" class="stat">0</div>
  </div>

  <div class="card">
   <div>Published</div>
   <div id="published" class="stat">0</div>
  </div>

  <div class="card">
   <div>Drafts</div>
   <div id="drafts" class="stat">0</div>
  </div>

  <div class="card">
   <div>Free Courses</div>
   <div id="free" class="stat">0</div>
  </div>

 </div>


 <section class="card">

  <h2 id="formTitle">
   Create Course
  </h2>

  <form id="courseForm" class="form">

   <input
    id="courseTitle"
    placeholder="Course title"
    required
   >

   <textarea
    id="courseDescription"
    placeholder="Course description"
    required
   ></textarea>

   <input
    id="courseCategory"
    placeholder="Category e.g. Technology"
    required
   >

   <input
    id="courseInstructor"
    placeholder="Instructor name"
   >

   <input
    id="courseDuration"
    placeholder="Duration e.g. 8 Weeks"
   >

   <input
    id="coursePrice"
    type="number"
    min="0"
    placeholder="Price TZS"
   >

   <input
    id="courseImage"
    placeholder="Course image URL"
   >

   <select id="courseLevel">
    <option value="beginner">Beginner</option>
    <option value="intermediate">Intermediate</option>
    <option value="advanced">Advanced</option>
   </select>

   <select id="courseStatus">
    <option value="draft">Draft</option>
    <option value="published">Published</option>
   </select>

   <div class="actions">

    <button
     class="primary"
     type="submit"
    >
     <span id="submitText">
      Create Course
     </span>
    </button>

    <button
     type="button"
     class="secondary"
     onclick="resetForm()"
    >
     Clear
    </button>

   </div>

  </form>

 </section>

 <br>

 <section class="card">

  <div class="toolbar">

   <input
    id="search"
    placeholder="Search courses..."
   >

   <select id="filter">
    <option value="all">All Courses</option>
    <option value="published">Published</option>
    <option value="draft">Drafts</option>
    <option value="free">Free</option>
   </select>

  </div>

  <div id="courseList"></div>

 </section>

</main>


<script type="module">

import {
 initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 doc,
 updateDoc,
 deleteDoc,
 serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   FIREBASE
===================================== */

const firebaseConfig = {
 apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
 authDomain:"let-s-study-pro-course.firebaseapp.com",
 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
 projectId:"let-s-study-pro-course",
 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",
 messagingSenderId:"474928293390",
 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
 measurementId:"G-85B7V5H5J0"
};

const app =
 initializeApp(firebaseConfig);

const auth =
 getAuth(app);

const db =
 getFirestore(app);


/* =====================================
   STATE
===================================== */

let courses = [];
let editingId = null;
let currentUser = null;


/* =====================================
   ELEMENTS
===================================== */

const loading =
 document.getElementById("loading");

const appBox =
 document.getElementById("app");

const form =
 document.getElementById("courseForm");

const list =
 document.getElementById("courseList");


/* =====================================
   ESCAPE
===================================== */

function escapeHTML(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
 auth,
 async user => {

  currentUser = user || null;

  loading.classList.add("hidden");
  appBox.classList.remove("hidden");

  await loadCourses();

 }
);


/* =====================================
   LOAD COURSES
===================================== */

async function loadCourses(){

 try{

  const snap =
   await getDocs(
    collection(
     db,
     "courses"
    )
   );

  courses =
   snap.docs.map(
    item => ({
     id:item.id,
     ...item.data()
    })
   );

  courses.sort(
   (a,b) => {

    const x =
     a.createdAt?.seconds || 0;

    const y =
     b.createdAt?.seconds || 0;

    return y-x;

   }
  );

  renderCourses();
  updateStats();

 }
 catch(error){

  console.error(
   "Courses error:",
   error
  );

  list.innerHTML =
   `<div class="course">
    Failed to load courses.
   </div>`;

 }

}


/* =====================================
   STATS
===================================== */

function updateStats(){

 const total =
  courses.length;

 const published =
  courses.filter(
   c => c.status === "published"
  ).length;

 const drafts =
  courses.filter(
   c =>
    !c.status ||
    c.status === "draft"
  ).length;

 const free =
  courses.filter(
   c =>
    Number(c.price || 0) === 0
  ).length;

 document.getElementById(
  "total"
 ).textContent = total;

 document.getElementById(
  "published"
 ).textContent = published;

 document.getElementById(
  "drafts"
 ).textContent = drafts;

 document.getElementById(
  "free"
 ).textContent = free;

}


/* =====================================
   RENDER
===================================== */

function renderCourses(){

 const search =
  document.getElementById(
   "search"
  ).value
   .toLowerCase()
   .trim();

 const filter =
  document.getElementById(
   "filter"
  ).value;


 const filtered =
  courses.filter(
   course => {

    const text =
     (
      course.title || ""
     ).toLowerCase()
     + " " +
     (
      course.category || ""
     ).toLowerCase()
     + " " +
     (
      course.instructor || ""
     ).toLowerCase();

    const matchesSearch =
     !search ||
     text.includes(search);

    let matchesFilter = true;

    if(
     filter === "published"
    ){

     matchesFilter =
      course.status ===
      "published";

    }

    if(
     filter === "draft"
    ){

     matchesFilter =
      !course.status ||
      course.status === "draft";

    }

    if(
     filter === "free"
    ){

     matchesFilter =
      Number(
       course.price || 0
      ) === 0;

    }

    return (
     matchesSearch &&
     matchesFilter
    );

   }
  );


 if(!filtered.length){

  list.innerHTML =
   `<div class="course">
    No courses found.
   </div>`;

  return;

 }


 list.innerHTML =
  filtered.map(
   course => `

   <div class="course">

    <h3>
     ${escapeHTML(
      course.title ||
      "Untitled Course"
     )}
    </h3>

    <p>
     ${escapeHTML(
      course.description ||
      ""
     )}
    </p>

    <div class="meta">

     <span class="badge">
      ${escapeHTML(
       course.status ||
       "draft"
      )}
     </span>

     &nbsp;

     Category:
     ${escapeHTML(
      course.category ||
      "General"
     )}

     <br>

     Instructor:
     ${escapeHTML(
      course.instructor ||
      "Not assigned"
     )}

     <br>

     Level:
     ${escapeHTML(
      course.level ||
      "beginner"
     )}

     <br>

     Duration:
     ${escapeHTML(
      course.duration ||
      "Not specified"
     )}

     <br>

     Price:
     TZS ${Number(
      course.price || 0
     ).toLocaleString()}

    </div>

    <br>

    <div class="actions">

     <button
      class="secondary"
      onclick="editCourse('${course.id}')"
     >
      Edit
     </button>

     <button
      class="secondary"
      onclick="toggleStatus('${course.id}')"
     >
      ${course.status === "published"
       ? "Unpublish"
       : "Publish"}
     </button>

     <button
      class="danger"
      onclick="deleteCourse('${course.id}')"
     >
      Delete
     </button>

    </div>

   </div>

  `
  ).join("");

}


/* =====================================
   CREATE / UPDATE
===================================== */

form.addEventListener(
 "submit",
 async event => {

  event.preventDefault();


  const data = {

   title:
    document.getElementById(
     "courseTitle"
    ).value.trim(),

   description:
    document.getElementById(
     "courseDescription"
    ).value.trim(),

   category:
    document.getElementById(
     "courseCategory"
    ).value.trim(),

   instructor:
    document.getElementById(
     "courseInstructor"
    ).value.trim(),

   duration:
    document.getElementById(
     "courseDuration"
    ).value.trim(),

   price:
    Number(
     document.getElementById(
      "coursePrice"
     ).value || 0
    ),

   image:
    document.getElementById(
     "courseImage"
    ).value.trim(),

   level:
    document.getElementById(
     "courseLevel"
    ).value,

   status:
    document.getElementById(
     "courseStatus"
    ).value,

   updatedAt:
    serverTimestamp()

  };


  if(!data.title){

   alert(
    "Course title is required."
   );

   return;

  }


  try{

   if(editingId){

    await updateDoc(
     doc(
      db,
      "courses",
      editingId
     ),
     data
    );

    alert(
     "Course updated."
    );

   }
   else{

    await addDoc(
     collection(
      db,
      "courses"
     ),
     {

      ...data,

      createdAt:
       serverTimestamp(),

      createdBy:
       currentUser?.uid ||
       "admin",

      students:0,

      rating:0,

      reviews:0

     }
    );

    alert(
     "Course created."
    );

   }


   resetForm();

   await loadCourses();

  }
  catch(error){

   console.error(error);

   alert(
    "Operation failed: " +
    error.message
   );

  }

 }
);


/* =====================================
   EDIT
===================================== */

window.editCourse =
 function(id){

  const course =
   courses.find(
    c => c.id === id
   );

  if(!course) return;

  editingId = id;


  document.getElementById(
   "courseTitle"
  ).value =
   course.title || "";

  document.getElementById(
   "courseDescription"
  ).value =
   course.description || "";

  document.getElementById(
   "courseCategory"
  ).value =
   course.category || "";

  document.getElementById(
   "courseInstructor"
  ).value =
   course.instructor || "";

  document.getElementById(
   "courseDuration"
  ).value =
   course.duration || "";

  document.getElementById(
   "coursePrice"
  ).value =
   course.price || 0;

  document.getElementById(
   "courseImage"
  ).value =
   course.image || "";

  document.getElementById(
   "courseLevel"
  ).value =
   course.level || "beginner";

  document.getElementById(
   "courseStatus"
  ).value =
   course.status || "draft";


  document.getElementById(
   "formTitle"
  ).textContent =
   "Edit Course";

  document.getElementById(
   "submitText"
  ).textContent =
   "Update Course";


  window.scrollTo({
   top:0,
   behavior:"smooth"
  });

 };


/* =====================================
   DELETE
===================================== */

window.deleteCourse =
 async function(id){

  if(
   !confirm(
    "Delete this course permanently?"
   )
  ){

   return;

  }


  try{

   await deleteDoc(
    doc(
     db,
     "courses",
     id
    )
   );

   await loadCourses();

  }
  catch(error){

   console.error(error);

   alert(
    "Delete failed: " +
    error.message
   );

  }

 };


/* =====================================
   PUBLISH / UNPUBLISH
===================================== */

window.toggleStatus =
 async function(id){

  const course =
   courses.find(
    c => c.id === id
   );

  if(!course) return;


  const status =
   course.status ===
   "published"
    ? "draft"
    : "published";


  try{

   await updateDoc(
    doc(
     db,
     "courses",
     id
    ),
    {

     status,

     updatedAt:
      serverTimestamp()

    }
   );

   await loadCourses();

  }
  catch(error){

   console.error(error);

   alert(
    "Status update failed."
   );

  }

 };


/* =====================================
   RESET
===================================== */

window.resetForm =
 function(){

  editingId = null;

  form.reset();

  document.getElementById(
   "coursePrice"
  ).value = 0;

  document.getElementById(
   "formTitle"
  ).textContent =
   "Create Course";

  document.getElementById(
   "submitText"
  ).textContent =
   "Create Course";

 };


/* =====================================
   SEARCH / FILTER
===================================== */

document.getElementById(
 "search"
).addEventListener(
 "input",
 renderCourses
);

document.getElementById(
 "filter"
).addEventListener(
 "change",
 renderCourses
);


/* =====================================
   LOGOUT
===================================== */

window.logout =
 async function(){

  await signOut(auth);

  location.href =
   "login.html";

 };

</script>

</body>
</html>
