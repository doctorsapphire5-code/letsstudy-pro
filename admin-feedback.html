<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Feedback - LetsStudy Pro</title>

<meta name="description"
content="LetsStudy Pro Admin Feedback Management">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#101828
}

header{
  background:#101828;
  color:#fff;
  padding:16px 20px
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.logo{
  font-size:21px;
  font-weight:800
}

.nav a{
  color:#fff;
  text-decoration:none;
  margin-left:14px;
  font-size:14px
}

main{
  max-width:1200px;
  margin:25px auto;
  padding:0 16px
}

h1{
  margin-bottom:5px
}

.subtitle{
  color:#667085;
  margin-top:0
}

.stats{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(170px,1fr));
  gap:15px;
  margin:22px 0
}

.stat{
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.05)
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:7px
}

.panel{
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.05)
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px
}

.toolbar input{
  flex:1;
  min-width:240px
}

input,select{
  padding:12px;
  border:1px solid #d0d5dd;
  border-radius:9px;
  font:inherit;
  outline:none
}

select{
  min-width:170px;
}

input:focus,select:focus{
  border-color:#175cd3
}

.feedback-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));
  gap:18px
}

.feedback{
  border:1px solid #eaecf0;
  border-radius:14px;
  padding:17px;
  background:#fff
}

.feedback h3{
  margin:8px 0 5px
}

.meta{
  color:#667085;
  font-size:13px;
  line-height:1.6
}

.message{
  margin:14px 0;
  color:#344054;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800
}

.new{
  background:#dbeafe;
  color:#1d4ed8
}

.reviewed{
  background:#dcfae6;
  color:#067647
}

.stars{
  margin-top:7px;
  letter-spacing:2px
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:14px
}

button,.btn{
  border:0;
  border-radius:8px;
  padding:9px 12px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  font-size:12px;
  display:inline-block
}

.primary{
  background:#101828;
  color:#fff
}

.success{
  background:#087443;
  color:#fff
}

.warning{
  background:#b54708;
  color:#fff
}

.danger{
  background:#b42318;
  color:#fff
}

.secondary{
  background:#eef2f6;
  color:#344054
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:#667085
}

#notice{
  display:none;
  padding:13px;
  border-radius:9px;
  margin-bottom:18px
}

.notice-ok{
  display:block!important;
  background:#dcfae6;
  color:#067647
}

.notice-error{
  display:block!important;
  background:#fee4e2;
  color:#b42318
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(16,24,40,.65);
  z-index:1000;
  padding:20px;
  overflow:auto
}

.modal-box{
  max-width:700px;
  margin:50px auto;
  background:#fff;
  border-radius:16px;
  padding:25px;
  position:relative
}

.close{
  position:absolute;
  right:15px;
  top:15px;
  background:#eef2f6;
  color:#101828;
  border:0;
  border-radius:50%;
  width:35px;
  height:35px;
  cursor:pointer;
  font-size:18px
}

.detail{
  margin:12px 0;
  line-height:1.6
}

.detail strong{
  display:block;
  font-size:12px;
  color:#667085;
  margin-bottom:3px
}

@media(max-width:650px){

  .nav{
    flex-direction:column;
    align-items:flex-start
  }

  .nav a{
    margin-left:0;
    margin-right:12px
  }

  .feedback-grid{
    grid-template-columns:1fr
  }

  .panel{
    padding:15px
  }

}
</style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      LetsStudy Pro — Admin
    </div>

    <div>
      <a href="admin.html">Dashboard</a>
      <a href="feedback.html">Feedback</a>
      <a href="index.html">Website</a>
    </div>

  </div>

</header>


<main>

  <h1>Feedback Management</h1>

  <p class="subtitle">
    Review and manage feedback submitted by LetsStudy Pro users.
  </p>

  <div id="notice"></div>


  <!-- STATS -->

  <section class="stats">

    <div class="stat">
      Total Feedback
      <strong id="total">0</strong>
    </div>

    <div class="stat">
      New
      <strong id="newCount">0</strong>
    </div>

    <div class="stat">
      Reviewed
      <strong id="reviewedCount">0</strong>
    </div>

    <div class="stat">
      Average Rating
      <strong id="averageRating">—</strong>
    </div>

  </section>


  <!-- FEEDBACK -->

  <section class="panel">

    <h2>User Feedback</h2>

    <div class="toolbar">

      <input
        id="search"
        type="search"
        placeholder="Search name, email, subject, message..."
      >

      <select id="statusFilter">

        <option value="all">
          All Status
        </option>

        <option value="new">
          New
        </option>

        <option value="reviewed">
          Reviewed
        </option>

      </select>


      <select id="typeFilter">

        <option value="all">
          All Types
        </option>

      </select>

    </div>


    <div
      id="feedbackGrid"
      class="feedback-grid"
    >

      <div class="empty">
        Loading feedback...
      </div>

    </div>

  </section>

</main>


<!-- DETAILS MODAL -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <button
      class="close"
      id="closeModal"
    >
      ×
    </button>

    <h2 id="modalTitle">
      Feedback Details
    </h2>

    <div id="modalContent"></div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


const grid =
  document.getElementById("feedbackGrid");

const search =
  document.getElementById("search");

const statusFilter =
  document.getElementById("statusFilter");

const typeFilter =
  document.getElementById("typeFilter");

const modal =
  document.getElementById("modal");

const modalContent =
  document.getElementById("modalContent");

const modalTitle =
  document.getElementById("modalTitle");

const notice =
  document.getElementById("notice");


let feedbacks = [];


function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function getStatus(item){

  if(
    item.status &&
    String(item.status).toLowerCase()
      === "reviewed"
  ){

    return "reviewed";

  }

  if(item.reviewed === true)
    return "reviewed";

  return "new";

}


function dateText(timestamp){

  if(!timestamp)
    return "";

  try{

    if(
      typeof timestamp.toDate === "function"
    ){

      return timestamp
        .toDate()
        .toLocaleString();

    }

    return new Date(timestamp)
      .toLocaleString();

  }catch{

    return "";

  }

}


function showNotice(text,type="ok"){

  notice.textContent = text;

  notice.className =
    type === "ok"
      ? "notice-ok"
      : "notice-error";

  setTimeout(()=>{

    notice.style.display = "none";

  },4000);

}


async function loadFeedback(){

  try{

    const snap =
      await getDocs(
        collection(db,"feedback")
      );

    feedbacks = [];

    snap.forEach(item=>{

      feedbacks.push({

        id:item.id,
        ...item.data()

      });

    });


    feedbacks.sort((a,b)=>{

      const aTime =
        a.createdAt?.seconds || 0;

      const bTime =
        b.createdAt?.seconds || 0;

      return bTime - aTime;

    });


    updateStats();
    buildTypes();
    render();

  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="empty">
        Failed to load feedback.
        <br><br>
        ${esc(error.message)}
      </div>
    `;

  }

}


function updateStats(){

  document.getElementById(
    "total"
  ).textContent =
    feedbacks.length;


  document.getElementById(
    "newCount"
  ).textContent =
    feedbacks.filter(
      x=>getStatus(x)==="new"
    ).length;


  document.getElementById(
    "reviewedCount"
  ).textContent =
    feedbacks.filter(
      x=>getStatus(x)==="reviewed"
    ).length;


  const ratings =
    feedbacks
      .map(x=>Number(x.rating))
      .filter(x=>x>=1 && x<=5);


  if(ratings.length){

    const avg =
      ratings.reduce(
        (a,b)=>a+b,
        0
      ) / ratings.length;

    document.getElementById(
      "averageRating"
    ).textContent =
      avg.toFixed(1) + "/5";

  }else{

    document.getElementById(
      "averageRating"
    ).textContent = "—";

  }

}


function buildTypes(){

  const current =
    typeFilter.value;

  const types =
    new Set();


  feedbacks.forEach(item=>{

    if(item.type){

      types.add(
        String(item.type)
      );

    }

  });


  typeFilter.innerHTML =
    `
      <option value="all">
        All Types
      </option>
    `;


  [...types]
    .sort()
    .forEach(type=>{

      const option =
        document.createElement("option");

      option.value = type;
      option.textContent = type;

      typeFilter.appendChild(
        option
      );

    });


  if(
    [...typeFilter.options]
      .some(
        option =>
          option.value === current
      )
  ){

    typeFilter.value = current;

  }

}


function render(){

  const q =
    search.value
      .toLowerCase()
      .trim();

  const selectedStatus =
    statusFilter.value;

  const selectedType =
    typeFilter.value;


  const filtered =
    feedbacks.filter(item=>{

      const searchable = [

        item.name,
        item.email,
        item.subject,
        item.message,
        item.page,
        item.type

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      return (

        (
          !q ||
          searchable.includes(q)
        )

        &&

        (
          selectedStatus === "all" ||
          getStatus(item) === selectedStatus
        )

        &&

        (
          selectedType === "all" ||
          String(item.type || "")
            === selectedType
        )

      );

    });


  grid.innerHTML = "";


  if(!filtered.length){

    grid.innerHTML = `
      <div class="empty">
        No feedback found.
      </div>
    `;

    return;

  }


  filtered.forEach(item=>{

    const status =
      getStatus(item);


    const name =
      item.name ||
      "Anonymous";


    const type =
      item.type ||
      "General Feedback";


    const subject =
      item.subject ||
      "No subject";


    const message =
      item.message ||
      "";


    const rating =
      Number(item.rating);


    const date =
      dateText(item.createdAt);


    const card =
      document.createElement("article");

    card.className =
      "feedback";


    card.innerHTML = `

      <span class="badge ${status}">
        ${status}
      </span>

      <h3>
        ${esc(subject)}
      </h3>

      <div class="meta">

        <strong>
          ${esc(name)}
        </strong>

        ${
          item.email
          ? `
            <br>
            ${esc(item.email)}
          `
          : ""
        }

        <br>
        ${esc(type)}

        ${
          date
          ? `<br>${esc(date)}`
          : ""
        }

      </div>


      ${
        rating >= 1 && rating <= 5
        ?
        `
          <div class="stars">
            ${"★".repeat(rating)}
            ${"☆".repeat(5-rating)}
          </div>
        `
        :
        ""
      }


      <div class="message">

        ${esc(message).slice(0,220)}
        ${message.length > 220 ? "..." : ""}

      </div>


      <div class="buttons">

        <button
          class="primary"
          data-view="${esc(item.id)}"
        >
          View
        </button>

        ${
          status === "new"
          ?
          `
            <button
              class="success"
              data-review="${esc(item.id)}"
            >
              Mark Reviewed
            </button>
          `
          :
          `
            <button
              class="warning"
              data-unreview="${esc(item.id)}"
            >
              Mark New
            </button>
          `
        }

        <button
          class="danger"
          data-delete="${esc(item.id)}"
        >
          Delete
        </button>

      </div>

    `;


    grid.appendChild(card);

  });


  document
    .querySelectorAll("[data-view]")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{
          viewFeedback(
            button.dataset.view
          );
        }
      );

    });


  document
    .querySelectorAll("[data-review]")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{
          setReviewed(
            button.dataset.review,
            true
          );
        }
      );

    });


  document
    .querySelectorAll("[data-unreview]")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{
          setReviewed(
            button.dataset.unreview,
            false
          );
        }
      );

    });


  document
    .querySelectorAll("[data-delete]")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{
          deleteFeedback(
            button.dataset.delete
          );
        }
      );

    });

}


function viewFeedback(id){

  const item =
    feedbacks.find(
      x=>x.id===id
    );

  if(!item)
    return;


  const rating =
    Number(item.rating);


  const stars =
    rating >= 1 && rating <= 5
      ? "★".repeat(rating) +
        "☆".repeat(5-rating)
      : "No rating";


  modalTitle.textContent =
    item.subject ||
    "Feedback Details";


  modalContent.innerHTML = `

    <div class="detail">
      <strong>STATUS</strong>
      ${esc(getStatus(item))}
    </div>

    <div class="detail">
      <strong>NAME</strong>
      ${esc(item.name || "Anonymous")}
    </div>

    <div class="detail">
      <strong>EMAIL</strong>
      ${esc(item.email || "Not provided")}
    </div>

    <div class="detail">
      <strong>TYPE</strong>
      ${esc(item.type || "General Feedback")}
    </div>

    <div class="detail">
      <strong>RATING</strong>
      ${stars}
    </div>

    <div class="detail">
      <strong>RELATED PAGE / FEATURE</strong>
      ${esc(item.page || "Not specified")}
    </div>

    <div class="detail">
      <strong>SUBJECT</strong>
      ${esc(item.subject || "No subject")}
    </div>

    <div class="detail">
      <strong>FEEDBACK</strong>
      <div style="white-space:pre-wrap">
        ${esc(item.message || "No message")}
      </div>
    </div>

    <div class="detail">
      <strong>SUBMITTED</strong>
      ${esc(dateText(item.createdAt) || "Unknown")}
    </div>

  `;


  modal.style.display = "block";

}


async function setReviewed(id,reviewed){

  try{

    await updateDoc(

      doc(
        db,
        "feedback",
        id
      ),

      {
        reviewed:reviewed,

        status:
          reviewed
            ? "reviewed"
            : "new",

        updatedAt:
          serverTimestamp()
      }

    );


    showNotice(
      reviewed
        ? "Feedback marked as reviewed."
        : "Feedback marked as new."
    );


    await loadFeedback();

  }catch(error){

    console.error(error);

    showNotice(
      error.message,
      "error"
    );

  }

}


async function deleteFeedback(id){

  const item =
    feedbacks.find(
      x=>x.id===id
    );


  const name =
    item?.name ||
    "this feedback";


  if(
    !confirm(
      `Delete feedback from ${name}? This cannot be undone.`
    )
  ){

    return;

  }


  try{

    await deleteDoc(

      doc(
        db,
        "feedback",
        id
      )

    );


    showNotice(
      "Feedback deleted successfully."
    );


    await loadFeedback();

  }catch(error){

    console.error(error);

    showNotice(
      error.message,
      "error"
    );

  }

}


search.addEventListener(
  "input",
  render
);

statusFilter.addEventListener(
  "change",
  render
);

typeFilter.addEventListener(
  "change",
  render
);


document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    ()=>{
      modal.style.display = "none";
    }
  );


modal.addEventListener(
  "click",
  event=>{

    if(event.target === modal){

      modal.style.display = "none";

    }

  }
);


loadFeedback();

</script>

</body>
</html>
