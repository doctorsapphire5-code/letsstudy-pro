<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;

body{

    Inter,

button,

/* =========================
   HEADER
========================= */

.header{
  height:72px;

  position:sticky;
  top:0;
  z-index:1000;

  background:rgba(255,255,255,.94);

  backdrop-filter:blur(15px);

  border-bottom:1px solid #e5e9f0;
}

.header-inner{
  max-width:1400px;
  height:100%;
  margin:auto;

  padding:0 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{

  align-items:center;
  gap:11px;

  font-weight:800;
  font-size:19px;
}

.brand-icon{
  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  border-radius:12px;

  color:#fff;

  background:

      135deg,
      #2563eb,
      #7c3aed

}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.icon-btn{
  width:42px;
  height:42px;

  border:1px solid #e1e6ef;

  background:#fff;

  border-radius:11px;

  display:grid;
  place-items:center;

  transition:.2s;
}

.icon-btn:hover{
  border-color:#2563eb;
  transform:translateY(-1px);
}

/* =========================
   PAGE
========================= */

.page{
  max-width:1400px;
  margin:auto;
  padding:32px 22px 70px;
}

.page-head{
  display:flex;
  justify-content:space-between;

}

.page-title h1{

}

.page-title p{

  font-size:14px;
}

.add-btn{

  color:#fff;

      #2563eb,

}

.add-btn:hover{

}

/* =========================
   STATS
========================= */

.stats{

  margin-bottom:25px;
}

.stat{

.stat-top{

}

.stat-icon{

  height:42px;

  place-items:center;

  border-radius:11px;

  background:#eff6ff;

  font-size:20px;
}

.stat strong{
  display:block;

  font-size:28px;

  margin-top:13px;
}

.stat span{
  color:#718096;
  font-size:13px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{

  border:1px solid #e6eaf0;

  border-radius:16px;

  padding:15px;

  display:flex;

  align-items:center;

  gap:12px;

  margin-bottom:18px;
}

.search{
  flex:1;

}

.search span{

}

.search input{

.search input:focus{

}

.refresh-btn{

  border:
    1px solid #dfe4ec;

  background:#fff;

  border-radius:10px;

  font-weight:650;
}

/* =========================
   TABLE
========================= */

.table-card{

  border:1px solid #e6eaf0;

  border-radius:17px;

  overflow:hidden;

  box-shadow:
    0 8px 28px
    rgba(30,41,59,.05);
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{

}

thead{

}

th{

}

td{

  font-size:13px;
}

.user-cell{

}

}

.avatar img{

}

.user-info strong{

}

.user-info span{

}

.badge{

  font-weight:750;
}

.action-group{

}

.small-btn{

}

.small-btn.delete:hover{

}

/* =========================
   EMPTY
========================= */

.empty{

  padding:65px 20px;

}

.empty-icon{
  font-size:42px;

  margin-bottom:10px;
}

.empty h3{

}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  background:
    rgba(15,23,42,.55);

  backdrop-filter:blur(5px);

  z-index:3000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal.show{

}

.modal-box{
  width:100%;
  max-width:520px;

  border-radius:18px;

  box-shadow:
    0 30px 80px

  overflow:hidden;

  animation:
    modalIn .25s ease;
}

@keyframes modalIn{

  from{
    opacity:0;
    transform:
      translateY(15px)
      scale(.98);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

.modal-head{
  padding:19px 20px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  border-bottom:

}

.modal-head h2{
  font-size:19px;
}

.close-btn{
  border:0;

  background:#f1f5f9;

  width:35px;
  height:35px;

  border-radius:9px;

  font-size:19px;
}

.form{
  padding:20px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;

  margin-bottom:7px;

  font-size:13px;

  font-weight:700;
}

.field input,
.field select{
  width:100%;

  height:45px;

  border:
    1px solid #dfe4ec;

}

.field input:focus,

}

.form-actions{

  gap:9px;

  margin-top:20px;
}

.cancel-btn{
  border:
    1px solid #dfe4ec;

  background:#fff;

  padding:10px 16px;

  border-radius:9px;
}

.save-btn{
  border:0;

  background:#2563eb;

  color:#fff;

  padding:10px 18px;

  border-radius:9px;

  font-weight:700;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  right:20px;
  bottom:20px;

  z-index:5000;

  background:#111827;

  color:#fff;

  padding:13px 17px;

  border-radius:10px;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.2);

  opacity:0;

  transform:
    translateY(15px);

  pointer-events:none;

  transition:.25s;
}

.toast.show{
  opacity:1;

  transform:
    translateY(0);
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;

  inset:0;

  z-index:6000;

  background:
    rgba(255,255,255,.8);

  display:flex;

  align-items:center;
  justify-content:center;
}

.loading.hide{
  display:none;
}

.spinner{
  width:45px;
  height:45px;

  border:
    4px solid #e5e7eb;

  border-top-color:#2563eb;

  border-radius:50%;

  animation:
    spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================

}

  }

}

</style>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  doc,
  serverTimestamp,
  query,
  orderBy
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "YOUR_API_KEY",

  authDomain:
    "YOUR_PROJECT.firebaseapp.com",

  projectId:
    "YOUR_PROJECT_ID",

  storageBucket:
    "YOUR_PROJECT.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


const app =
  initializeApp(
    firebaseConfig
  );

const db =
  getFirestore(app);


/* =========================
   COLLECTION
========================= */

const COLLECTION_NAME =
  "followships";


/* =========================
   DOM
========================= */

const body =
  document.getElementById(
    "followshipBody"
  );

const emptyState =
  document.getElementById(
    "emptyState"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const loading =
  document.getElementById(
    "loading"
  );

const addModal =
  document.getElementById(
    "addModal"
  );

const form =
  document.getElementById(
    "followshipForm"
  );

const toast =
  document.getElementById(
    "toast"
  );


/* =========================
   DATA
========================= */

let followships = [];


/* =========================
   TOAST
========================= */

function showToast(
  message
){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },
    2500
  );

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(
  value
){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   DATE
========================= */

function formatDate(
  timestamp
){

  if(!timestamp){
    return "—";
  }

  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleString();

  }catch{

    return "—";

  }

}


/* =========================
   LOAD DATA
========================= */

async function loadFollowships(){

  loading.classList.remove(
    "hide"
  );

  try{

    const ref =
      collection(
        db,
        COLLECTION_NAME
      );

    const q =
      query(
        ref,
        orderBy(
          "createdAt",
          "desc"
        )
      );

    const snapshot =
      await getDocs(q);

    followships = [];

    snapshot.forEach(
      item => {

        followships.push({

          id:item.id,

          ...item.data()

        });

      }
    );

  }catch(error){

    console.error(
      "Followships load error:",
      error
    );

    /*
      Fallback if createdAt
      does not exist on old docs.
    */

    try{

      const snapshot =
        await getDocs(
          collection(
            db,
            COLLECTION_NAME
          )
        );

      followships = [];

      snapshot.forEach(
        item => {

          followships.push({

            id:item.id,

            ...item.data()

          });

        }
      );

    }catch(secondError){

      console.error(
        secondError
      );

      showToast(
        "Unable to load followships."
      );

    }

  }finally{

    loading.classList.add(
      "hide"
    );

  }

  render();

}


/* =========================
   STATS
========================= */

function updateStats(){

  const total =
    followships.length;


  const followers =
    new Set(
      followships
        .map(
          item =>
            item.followerId ||
            item.followerUid
        )
        .filter(Boolean)
    );


  const following =
    new Set(
      followships
        .map(
          item =>
            item.followingId ||
            item.followingUid
        )
        .filter(Boolean)
    );


  const today =
    new Date();

  today.setHours(
    0,
    0,
    0,
    0
  );


  let todayCount = 0;


      followships.forEach(
      item => {

        if(
          !item.createdAt
        ){

          return;

        }

        try{

          const date =
            item.createdAt.toDate
              ? item.createdAt.toDate()
              : new Date(
                  item.createdAt
                );

          if(
            date >= today
          ){

            todayCount++;

          }

        }catch(error){

          console.warn(
            "Invalid followship date:",
            error
          );

        }

      }
    );


    document.getElementById(
      "totalFollows"
    ).textContent =
      total.toLocaleString();


    document.getElementById(
      "uniqueFollowers"
    ).textContent =
      followers.size.toLocaleString();


    document.getElementById(
      "uniqueFollowing"
    ).textContent =
      following.size.toLocaleString();


    document.getElementById(
      "todayFollows"
    ).textContent =
      todayCount.toLocaleString();

  }


  /* =========================
     AVATAR
  ========================== */

  function avatarHTML(
    uid,
    photoURL
  ){

    if(photoURL){

      return `

        <div class="avatar">

          <img
            src="${escapeHTML(
              photoURL
            )}"
            alt=""
            onerror="
              this.parentElement.innerHTML='👤'
            "
          >

        </div>

      `;

    }


    const letter =
      String(
        uid || "U"
      )
      .charAt(0)
      .toUpperCase();


    return `

      <div class="avatar">
        ${escapeHTML(letter)}
      </div>

    `;

  }


  /* =========================
     USER CELL
  ========================== */

  function userCell(
    uid,
    name,
    photoURL
  ){

    return `

      <div class="user-cell">

        ${avatarHTML(
          uid,
          photoURL
        )}

        <div class="user-info">

          <strong>
            ${escapeHTML(
              name ||
              uid ||
              "Unknown User"
            )}
          </strong>

          <span>
            ${escapeHTML(
              uid ||
              "No UID"
            )}
          </span>

        </div>

      </div>

    `;

  }


  /* =========================
     RENDER TABLE
  ========================== */

  function render(){

    const search =
      searchInput
        .value
        .toLowerCase()
        .trim();


    const filtered =
      followships.filter(
        item => {

          if(!search){

            return true;

          }


          const searchableText = [

            item.followerId,

            item.followerUid,

            item.followerName,

            item.followingId,

            item.followingUid,

            item.followingName,

            item.status

          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


          return searchableText.includes(
            search
          );

        }
      );


    body.innerHTML = "";


    if(
      filtered.length === 0
    ){

      emptyState.style.display =
        "block";

      updateStats();

      return;

    }


    emptyState.style.display =
      "none";


    filtered.forEach(
      (
        item,
        index
      ) => {

        const follower =
          item.followerId ||
          item.followerUid ||
          "";


        const following =
          item.followingId ||
          item.followingUid ||
          "";


        const status =
          item.status ||
          "active";


        const row =
          document.createElement(
            "tr"
          );


        row.innerHTML = `

          <td>
            ${index + 1}
          </td>

          <td>

            ${userCell(
              follower,
              item.followerName,
              item.followerPhotoURL
            )}

          </td>

          <td>

            ${userCell(
              following,
              item.followingName,
              item.followingPhotoURL
            )}

          </td>

          <td>

            <span class="badge">
              ${escapeHTML(
                status
              )}
            </span>

          </td>

          <td>
            ${escapeHTML(
              formatDate(
                item.createdAt
              )
            )}
          </td>

          <td>

            <div class="action-group">

              <button
                class="small-btn delete"
                data-delete="${escapeHTML(
                  item.id
                )}"
              >
                Delete
              </button>

            </div>

          </td>

        `;


        body.appendChild(
          row
        );

      }
    );


    updateStats();

  }


  /* =========================
     DELETE FOLLOWSHIP
  ========================== */

  body.addEventListener(
    "click",
    async event => {

      const button =
        event.target.closest(
          "[data-delete]"
        );


      if(!button){

        return;

      }


      const id =
        button.dataset.delete;


      if(!id){

        return;

      }


      const confirmed =
        confirm(
          "Delete this followship?"
        );


      if(!confirmed){

        return;

      }


      try{

        await deleteDoc(
          doc(
            db,
            COLLECTION_NAME,
            id
          )
        );


        followships =
          followships.filter(
            item =>
              item.id !== id
          );


        render();


        showToast(
          "Followship deleted successfully."
        );

      }catch(error){

        console.error(
          "Delete followship error:",
          error
        );


        showToast(
          "Failed to delete followship."
        );

      }

    }
  );


  /* =========================
     OPEN ADD MODAL
  ========================== */

  document
    .getElementById(
      "openAddBtn"
    )
    .addEventListener(
      "click",
      () => {

        addModal.classList.add(
          "show"
        );


        document
          .getElementById(
            "followerId"
          )
          .focus();

      }
    );


  /* =========================
     CLOSE MODAL
  ========================== */

  function closeModal(){

    addModal.classList.remove(
      "show"
    );


    form.reset();

  }


  document
    .getElementById(
      "closeModal"
    )
    .addEventListener(
      "click",
      closeModal
    );


  document
    .getElementById(
      "cancelBtn"
    )
    .addEventListener(
      "click",
      closeModal
    );


  addModal.addEventListener(
    "click",
    event => {

      if(
        event.target ===
        addModal
      ){

        closeModal();

      }

    }
  );


  /* =========================
     ADD FOLLOWSHIP
  ========================== */

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const followerId =
        document
          .getElementById(
            "followerId"
          )
          .value
          .trim();


      const followingId =
        document
          .getElementById(
            "followingId"
          )
          .value
          .trim();


      const status =
        document
          .getElementById(
            "status"
          )
          .value;


      if(!followerId){

        showToast(
          "Enter follower UID."
        );

        return;

      }


      if(!followingId){

        showToast(
          "Enter following UID."
        );

        return;

      }


      if(
        followerId ===
        followingId
      ){

        showToast(
          "A user cannot follow themselves."
        );

        return;

      }


      const submitBtn =
        form.querySelector(
          ".save-btn"
        );


      submitBtn.disabled =
        true;

      submitBtn.textContent =
        "Adding...";


      try{

        const newFollowship =
          await addDoc(
            collection(
              db,
              COLLECTION_NAME
            ),
            {

              followerId:
                followerId,

              followingId:
                followingId,

              status:
                status,

              createdAt:
                serverTimestamp()

            }
          );


        followships.unshift({

          id:
            newFollowship.id,

          followerId:
            followerId,

          followingId:
            followingId,

          status:
            status,

          createdAt:
            new Date()

        });


        closeModal();

        render();


        showToast(
          "Followship added successfully."
        );


      }catch(error){

        console.error(
          "Add followship error:",
          error
        );


        showToast(
          "Failed to add followship."
        );

      }finally{

        submitBtn.disabled =
          false;

        submitBtn.textContent =
          "Add Followship";

      }

    }
  );


  /* =========================
     SEARCH
  ========================== */

  searchInput.addEventListener(
    "input",
    () => {

      render();

    }
  );


  /* =========================
     REFRESH
  ========================== */

  document
    .getElementById(
      "refreshBtn"
    )
    .addEventListener(
      "click",
      async () => {

        await loadFollowships();

        showToast(
          "Followships refreshed."
        );

      }
    );


  /* =========================
     THEME
  ========================== */

  const themeBtn =
    document.getElementById(
      "themeBtn"
    );


  function updateTheme(){

    const dark =
      document.body.classList.contains(
        "dark"
      );


    themeBtn.textContent =
      dark
        ? "☀️"
        : "🌙";

  }


  if(
    localStorage.getItem(
      "letsStudyTheme"
    ) === "dark"
  ){

    document.body.classList.add(
      "dark"
    );

  }


  updateTheme();


  themeBtn.addEventListener(
    "click",
    () => {

      document.body.classList.toggle(
        "dark"
      );


      localStorage.setItem(
        "letsStudyTheme",
        document.body.classList.contains(
          "dark"
        )
          ? "dark"
          : "light"
      );


      updateTheme();

    }
  );


  /* =========================
     ESC KEY
  ========================== */

  document.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Escape"
      ){

        closeModal();

      }

    }
  );


  /* =========================
     INITIAL LOAD
  ========================== */

  async function init(){

    try{

      await loadFollowships();

    }catch(error){

      console.error(
        "Initialization error:",
        error
      );

    }finally{

      loading.classList.add(
        "hide"
      );

    }

  }


  init();

</script>

</body>
</html>
