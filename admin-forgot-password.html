<body>

<div class="container">

  <div class="brand">LetsStudy Pro</div>

  <div class="icon">🔑</div>

  <h1>Forgot Password?</h1>

  <p class="description">
    Don't worry. Enter your administrator email address
    and we will send you instructions to reset your password.
  </p>

  <div id="message" class="message"></div>

  <form id="forgotForm">

    <label for="email">Admin Email Address</label>

    <input type="email" id="email" placeholder="Enter your registered email" autocomplete="email" required="">

    <button type="submit" id="submitBtn">
      Send Password Reset Link
    </button>

  </form>

  <div class="links">
    <a href="admin-login.html">Back to Admin Login</a><br>
    <a href="admin-reset-password.html">Reset Password Page</a>
  </div>

  <footer>
    LetsStudy Pro · Learn. Build. Work. Grow.
  </footer>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbKXjsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const $ = id => document.getElementById(id);

function showMessage(text,type){
  $("message").textContent = text;
  $("message").className = "message " + type;
}

$("forgotForm").addEventListener("submit",async function(e){

  e.preventDefault();

  const email = $("email").value.trim().toLowerCase();

  if(!email){
    showMessage("Please enter your email address.","error");
    return;
  }

  $("submitBtn").disabled = true;
  $("submitBtn").textContent = "Sending...";
  $("message").className = "message";

  try{

    await auth.sendPasswordResetEmail(email);

    showMessage(
      "If an account exists for this email, a password reset link has been sent. Please check your inbox and spam folder.",
      "success"
    );

    $("forgotForm").reset();

  }catch(error){

    if(
      error.code === "auth/user-not-found" ||
      error.code === "auth/invalid-email"
    ){

      showMessage(
        "If an account exists for this email, a reset link will be sent. Please check your email address.",
        "success"
      );

    }else if(error.code === "auth/too-many-requests"){

      showMessage(
        "Too many attempts. Please wait before trying again.",
        "error"
      );

    }else{

      showMessage(
        "Unable to process your request. Please try again later.",
        "error"
      );

    }

  }finally{

    $("submitBtn").disabled = false;
    $("submitBtn").textContent = "Send Password Reset Link";

  }

});
</script>
