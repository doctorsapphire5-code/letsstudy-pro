<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Instructor Applications | LetsStudy Pro Admin
</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#1e293b;
}

.header{
  background:#0f172a;
  color:#fff;
  padding:18px;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.logo span{
  color:#60a5fa;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 18px 60px;
}

.page-title{
  margin-bottom:20px;
}

.page-title h1{
  font-size:25px;
  margin-bottom:6px;
}

.page-title p{
  color:#64748b;
  font-size:12px;
}


/* =====================================================
   STATS
===================================================== */

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);

  gap:12px;
  margin-bottom:22px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:18px;
}

.stat-label{
  color:#64748b;
  font-size:10px;
  font-weight:800;
}

.stat-value{
  font-size:25px;
  font-weight:900;
  margin-top:7px;
}


/* =====================================================
   FILTER
===================================================== */

.filter{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:15px;
  margin-bottom:18px;

  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.filter input,
.filter select{
  border:1px solid #cbd5e1;
  border-radius:8px;
  padding:10px;
  font-size:11px;
  outline:none;
}

.filter input{
  flex:1;
}


/* =====================================================
   APPLICATION
===================================================== */

.application{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:15px;
  margin-bottom:14px;
  overflow:hidden;
}

.application-header{
  padding:17px;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  gap:15px;

  border-bottom:1px solid #f1f5f9;
}

.name{
  font-size:16px;
  font-weight:900;
}

.email{
  color:#64748b;
  font-size:10px;
  margin-top:4px;
}

.badge{
  padding:6px 9px;
  border-radius:20px;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.approved{
  background:#dcfce7;
  color:#166534;
}

.rejected{
  background:#fee2e2;
  color:#991b1b;
}

.application-body{
  padding:18px;
}

.details{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;

  margin-bottom:16px;
}

.detail{
  background:#f8fafc;
  padding:11px;
  border-radius:8px;
}

.detail-label{
  color:#94a3b8;
  font-size:8px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:4px;
}

.detail-value{
  font-size:10px;
  font-weight:700;
  word-break:break-word;
}

.description{
  margin-top:12px;
}

.description h3{
  font-size:11px;
  margin-bottom:6px;
}

.description p{
  color:#64748b;
  font-size:10px;
  line-height:1.7;
  white-space:pre-wrap;
}


/* =====================================================
   ACTIONS
===================================================== */

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;

  padding-top:17px;
  margin-top:17px;

  border-top:1px solid #f1f5f9;
}

.btn{
  border:0;
  padding:10px 15px;
  border-radius:8px;

  color:#fff;

  font-size:10px;
  font-weight:900;

  cursor:pointer;
}

.approve{
  background:#16a34a;
}

.reject{
  background:#dc2626;
}

.view{
  background:#2563eb;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}


/* =====================================================
   LOADING
===================================================== */

.loading,
.empty{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;

  padding:40px;

  text-align:center;

  color:#64748b;

  font-size:12px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:800px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .details{
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:550px){

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
  }

  .stats,
  .details{
    grid-template-columns:1fr;
  }

  .application-header{
    flex-direction:column;
  }

}

</style>

</head>


<body>


<header class="header">

<div class="header-inner">

<div class="logo">
  LetsStudy <span>Pro</span> Admin
</div>

<a
  href="admin.html"
  style="
    color:#cbd5e1;
    font-size:11px;
  "
>
  ← Admin Dashboard
</a>

</div>

</header>


<main class="container">


<div class="page-title">

<h1>
  Instructor Applications
</h1>

<p>
  Review, approve or reject instructor applications.
</p>

</div>


<!-- =====================================================
     STATISTICS
===================================================== -->

<div class="stats">

<div class="stat">

<div class="stat-label">
  TOTAL
</div>

<div
  id="totalCount"
  class="stat-value"
>
  0
</div>

</div>


<div class="stat">

<div class="stat-label">
  PENDING
</div>

<div
  id="pendingCount"
  class="stat-value"
>
  0
</div>

</div>


<div class="stat">

<div class="stat-label">
  APPROVED
</div>

<div
  id="approvedCount"
  class="stat-value"
>
  0
</div>

</div>


<div class="stat">

<div class="stat-label">
  REJECTED
</div>

<div
  id="rejectedCount"
  class="stat-value"
>
  0
</div>

</div>

</div>


<!-- =====================================================
     FILTER
===================================================== -->

<div class="filter">

<input
  id="search"
  type="search"
  placeholder="Search applicant..."
>


<select id="statusFilter">

<option value="all">
  All Applications
</option>

<option value="pending">
  Pending
</option>

<option value="approved">
  Approved
</option>

<option value="rejected">
  Rejected
</option>

</select>

</div>


<!-- =====================================================
     APPLICATIONS
===================================================== -->

<div
  id="loading"
  class="loading"
>
  Loading applications...
</div>


<div
  id="applications"
></div>


<div
  id="empty"
  class="empty"
  style="display:none;"
>
  No instructor applications found.
</div>


</main>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


/* =====================================================
   ELEMENTS
===================================================== */

const applications =
  document.getElementById(
    "applications"
  );

const loading =
  document.getElementById(
    "loading"
  );

const empty =
  document.getElementById(
    "empty"
  );

const search =
  document.getElementById(
    "search"
  );

const statusFilter =
  document.getElementById(
    "statusFilter"
  );


let allApplications = [];


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   LOAD
===================================================== */

async function loadApplications(){

  loading.style.display =
    "block";

  applications.innerHTML =
    "";

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "instructorApplications"
        )
      );


    allApplications = [];


    snapshot.forEach(
      applicationDoc => {

        allApplications.push({

          applicationId:
            applicationDoc.id,

          ...applicationDoc.data()

        });

      }
    );


    updateStatistics();

    renderApplications(
      allApplications
    );


  }
  catch(error){

    console.error(
      error
    );

    loading.textContent =
      "Unable to load instructor applications.";

  }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

  const total =
    allApplications.length;


  const pending =
    allApplications.filter(
      item =>
        item.status ===
        "pending"
    ).length;


  const approved =
    allApplications.filter(
      item =>
        item.status ===
        "approved"
    ).length;


  const rejected =
    allApplications.filter(
      item =>
        item.status ===
        "rejected"
    ).length;


  document.getElementById(
    "totalCount"
  ).textContent =
    total;


  document.getElementById(
    "pendingCount"
  ).textContent =
    pending;


  document.getElementById(
    "approvedCount"
  ).textContent =
    approved;


  document.getElementById(
    "rejectedCount"
  ).textContent =
    rejected;

}


/* =====================================================
   RENDER
===================================================== */

function renderApplications(
  list
){

  loading.style.display =
    "none";


  applications.innerHTML =
    "";


  if(
    !list.length
  ){

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  list.forEach(
    application => {

      applications.insertAdjacentHTML(

        "beforeend",

        createApplication(
          application
        )

      );

    }
  );

}


/* =====================================================
   CARD
===================================================== */

function createApplication(
  item
){

  const status =
    item.status ||
    "pending";


  return `

  <article
    class="application"
    data-id="${escapeHtml(
      item.applicationId
    )}"
  >


    <div class="application-header">

      <div>

        <div class="name">

          ${escapeHtml(
            item.fullName ||
            "Unknown Applicant"
          )}

        </div>


        <div class="email">

          ${escapeHtml(
            item.email ||
            ""
          )}

        </div>

      </div>


      <span
        class="badge ${escapeHtml(
          status
        )}"
      >

        ${escapeHtml(
          status
        )}

      </span>

    </div>


    <div class="application-body">


      <div class="details">


        ${detail(
          "Profession",
          item.profession
        )}


        ${detail(
          "Expertise",
          item.expertise
        )}


        ${detail(
          "Experience",
          item.experience
        )}


        ${detail(
          "Education",
          item.education
        )}


        ${detail(
          "Country",
          item.country
        )}


        ${detail(
          "Phone",
          item.phone
        )}


        ${detail(
          "Course",
          item.courseTitle
        )}


        ${detail(
          "Website",
          item.website
        )}


        ${detail(
          "LinkedIn",
          item.linkedin
        )}


      </div>


      <div class="description">

        <h3>
          Professional Bio
        </h3>

        <p>

          ${escapeHtml(
            item.bio ||
            "No bio provided."
          )}

        </p>

      </div>


      <div class="description">

        <h3>
          Course Plan
        </h3>

        <p>

          ${escapeHtml(
            item.courseDescription ||
            "No course plan provided."
          )}

        </p>

      </div>


      <div class="actions">


        ${
          status ===
          "pending"

          ?

          `

          <button
            class="btn approve"
            data-action="approve"
            data-id="${escapeHtml(
              item.applicationId
            )}"
          >
            ✓ Approve
          </button>


          <button
            class="btn reject"
            data-action="reject"
            data-id="${escapeHtml(
              item.applicationId
            )}"
          >
            ✕ Reject
          </button>

          `

          :

          ""

        }


        ${
          item.website

          ?

          `

          <a
            class="btn view"
            href="${escapeHtml(
              item.website
            )}"
            target="_blank"
            rel="noopener"
          >
            View Website
          </a>

          `

          :

          ""

        }


        ${
          item.linkedin

          ?

          `

          <a
            class="btn view"
            href="${escapeHtml(
              item.linkedin
            )}"
            target="_blank"
            rel="noopener"
          >
            LinkedIn
          </a>

          `

          :

          ""

        }


      </div>


    </div>

  </article>

  `;

}


/* =====================================================
   DETAIL
===================================================== */

function detail(
  label,
  value
){

  return `

    <div class="detail">

      <div class="detail-label">

        ${label}

      </div>

      <div class="detail-value">

        ${escapeHtml(
          value ||
          "—"
        )}

      </div>

    </div>

  `;

}


/* =====================================================
   APPROVE
===================================================== */

async function approveApplication(
  applicationId
){

  if(
    !confirm(
      "Approve this instructor application?"
    )
  ){

    return;

  }


  try{

    const applicationRef =
      doc(
        db,
        "instructorApplications",
        applicationId
      );


    const snapshot =
      await getDoc(
        applicationRef
      );


    if(
      !snapshot.exists()
    ){

      alert(
        "Application no longer exists."
      );

      return;

    }


    const application =
      snapshot.data();


    if(
      application.status ===
      "approved"
    ){

      alert(
        "This application is already approved."
      );

      return;

    }


    /*
      CREATE INSTRUCTOR
    */

    const instructorRef =
      await addDoc(

        collection(
          db,
          "instructors"
        ),

        {

          name:
            application.fullName ||
            "",

          displayName:
            application.fullName ||
            "",

          email:
            application.email ||
            "",

          phone:
            application.phone ||
            "",

          country:
            application.country ||
            "",

          profession:
            application.profession ||
            "",

          specialization:
            application.expertise ||
            "",

          category:
            application.expertise ||
            "",

          experience:
            application.experience ||
            "",

          education:
            application.education ||
            "",

          bio:
            application.bio ||
            "",

          website:
            application.website ||
            "",

          linkedin:
            application.linkedin ||
            "",

          courseTitle:
            application.courseTitle ||
            "",

          courseDescription:
            application.courseDescription ||
            "",

          role:
            "instructor",

          status:
            "active",

          verified:
            true,

          coursesCount:
            0,

          studentsCount:
            0,

          rating:
            0,

          reviewsCount:
            0,

          applicationId:
            applicationId,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }

      );


    /*
      UPDATE APPLICATION
    */

    await updateDoc(

      applicationRef,

      {

        status:
          "approved",

        reviewed:
          true,

        instructorId:
          instructorRef.id,

        reviewedAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }

    );


    alert(
      "Instructor approved successfully."
    );


    await loadApplications();

  }
  catch(error){

    console.error(
      "APPROVE ERROR:",
      error
    );

    alert(
      "Unable to approve application."
    );

  }

}


/* =====================================================
   REJECT
===================================================== */

async function rejectApplication(
  applicationId
){

  const reason =
    prompt(
      "Enter rejection reason:"
    );


  if(
    reason ===
    null
  ){

    return;

  }


  try{

    const applicationRef =
      doc(
        db,
        "instructorApplications",
        applicationId
      );


    await updateDoc(

      applicationRef,

      {

        status:
          "rejected",

        reviewed:
          true,

        rejectionReason:
          reason.trim(),

        reviewedAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }

    );


    alert(
      "Application rejected."
    );


    await loadApplications();

  }
  catch(error){

    console.error(
      "REJECT ERROR:",
      error
    );

    alert(
      "Unable to reject application."
    );

  }

}


/* =====================================================
   ACTION EVENTS
===================================================== */

applications.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-action]"
      );


    if(
      !button
    ){

      return;

    }


    const action =
      button.dataset.action;


    const id =
      button.dataset.id;


    if(
      action ===
      "approve"
    ){

      approveApplication(
        id
      );

    }


    if(
      action ===
      "reject"
    ){

      rejectApplication(
        id
      );

    }

  }
);


/* =====================================================
   FILTER
===================================================== */

function applyFilters(){

  const term =
    search.value
      .trim()
      .toLowerCase();


  const status =
    statusFilter.value;


  const filtered =
    allApplications.filter(
      item => {

        const searchable = [

          item.fullName,

          item.email,

          item.profession,

          item.expertise,

          item.country,

          item.courseTitle

        ]

        .filter(Boolean)

        .join(" ")

        .toLowerCase();


        const matchesSearch =
          !term ||
          searchable.includes(
            term
          );


        const matchesStatus =
          status ===
            "all"

          ||

          item.status ===
            status;


        return (
          matchesSearch &&
          matchesStatus
        );

      }
    );


  renderApplications(
    filtered
  );

}


search.addEventListener(
  "input",
  applyFilters
);


statusFilter.addEventListener(
  "change",
  applyFilters
);


/* =====================================================
   INITIALIZE
===================================================== */

loadApplications();


/* =====================================================
   END
===================================================== */

</script>

</body>

</html>
