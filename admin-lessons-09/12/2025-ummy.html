<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Lessons | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:#f5f7fb;
color:#101828
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #eaecf0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
position:sticky;
top:0;
z-index:20
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef
}

.container{
max-width:1200px;
margin:auto;
padding:25px 16px 60px
}

.hero{
background:linear-gradient(135deg,#101828,#155eef);
color:white;
border-radius:18px;
padding:25px;
margin-bottom:18px
}

.hero h1{
margin:0 0 7px;
font-size:28px
}

.hero p{
margin:0;
opacity:.9
}

.toolbar{
background:#fff;
border:1px solid #eaecf0;
border-radius:15px;
padding:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:18px
}

input,select,textarea{
width:100%;
border:1px solid #d0d5dd;
border-radius:9px;
padding:11px;
font:inherit;
outline:none
}

input:focus,
select:focus,
textarea:focus{
border-color:#155eef
}

.course-input{
flex:1;
min-width:220px
}

button{
border:0;
border-radius:9px;
padding:10px 14px;
cursor:pointer;
font-weight:700
}

.primary{
background:#155eef;
color:white
}

.secondary{
background:#eef4ff;
color:#155eef
}

.danger{
background:#fee4e2;
color:#b42318
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:18px
}

.stat{
background:#fff;
border:1px solid #eaecf0;
border-radius:13px;
padding:15px
}

.stat b{
display:block;
font-size:23px
}

.stat span{
font-size:12px;
color:#667085
}

.search{
flex:1;
min-width:200px
}

.lesson{
background:#fff;
border:1px solid #eaecf0;
border-radius:15px;
padding:17px;
margin-bottom:10px;
display:flex;
gap:15px;
align-items:center
}

.number{
width:42px;
height:42px;
border-radius:11px;
background:#eef4ff;
color:#155eef;
display:grid;
place-items:center;
font-weight:800;
flex-shrink:0
}

.info{
flex:1
}

.info h3{
margin:0 0 5px;
font-size:16px
}

.info p{
margin:0;
font-size:13px;
color:#667085
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
background:#f2f4f7;
font-size:11px;
margin:7px 5px 0 0
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}

.empty{
background:#fff;
border:1px dashed #d0d5dd;
border-radius:15px;
padding:45px;
text-align:center;
color:#667085
}

.error{
background:#fef3f2;
color:#b42318;
padding:13px;
border-radius:10px;
margin-bottom:15px
}

.modal{
position:fixed;
inset:0;
background:#0008;
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:100
}

.modal.show{
display:flex
}

.modal-box{
background:#fff;
width:min(700px,100%);
max-height:92vh;
overflow:auto;
border-radius:18px;
padding:22px
}

.modal-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px
}

.modal-head h2{
margin:0
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.field{
margin-bottom:10px
}

.field.full{
grid-column:1/-1
}

.field label{
display:block;
font-size:12px;
font-weight:700;
margin-bottom:6px
}

.form-actions{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:15px
}

.preview{
margin-top:15px;
border:1px solid #eaecf0;
border-radius:12px;
overflow:hidden;
background:#000;
aspect-ratio:16/9
}

.preview iframe,
.preview video{
width:100%;
height:100%;
border:0
}

.toast{
position:fixed;
right:18px;
bottom:18px;
background:#101828;
color:white;
padding:13px 17px;
border-radius:10px;
display:none;
z-index:200
}

.toast.show{
display:block
}

@media(max-width:700px){

.stats{
grid-template-columns:repeat(2,1fr)
}

.lesson{
align-items:flex-start;
flex-direction:column
}

.actions{
width:100%
}

.form-grid{
grid-template-columns:1fr
}

.field.full{
grid-column:auto
}

}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro <small>ADMIN</small>
</div>

<button class="secondary"
onclick="location.reload()">
↻ Refresh
</button>

</header>


<main class="container">

<section class="hero">

<h1>Lesson Manager</h1>

<p>
Create and manage course lessons directly from Firebase Firestore.
</p>

</section>


<div class="toolbar">

<input
id="courseId"
class="course-input"
placeholder="Course ID">

<button
class="primary"
onclick="loadLessons()">
Load Course
</button>

<button
class="secondary"
onclick="openCreate()">
+ New Lesson
</button>

</div>


<div id="error"></div>


<div class="stats">

<div class="stat">
<b id="total">0</b>
<span>Total Lessons</span>
</div>

<div class="stat">
<b id="published">0</b>
<span>Published</span>
</div>

<div class="stat">
<b id="draft">0</b>
<span>Drafts</span>
</div>

<div class="stat">
<b id="modules">0</b>
<span>Modules</span>
</div>

</div>


<div class="toolbar">

<input
id="search"
class="search"
placeholder="Search lessons...">

<select id="moduleFilter">
<option value="">All Modules</option>
</select>

</div>


<div id="lessonList">

<div class="empty">
Enter a Course ID and load the course.
</div>

</div>

</main>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
New Lesson
</h2>

<button
class="secondary"
onclick="closeModal()">
✕
</button>

</div>


<form id="lessonForm">

<div class="form-grid">

<div class="field">

<label>Course ID</label>

<input
name="courseId"
id="formCourseId"
required>

</div>


<div class="field">

<label>Module ID</label>

<select
name="moduleId"
id="moduleId"
required>

<option value="">
Select Module
</option>

</select>

</div>


<div class="field full">

<label>Lesson Title</label>

<input
name="title"
id="title"
required
placeholder="e.g. Introduction to HTML">

</div>


<div class="field">

<label>Lesson Type</label>

<select name="type" id="type">

<option value="video">Video</option>
<option value="text">Text</option>
<option value="pdf">PDF</option>
<option value="audio">Audio</option>
<option value="embed">Embed</option>
<option value="assignment">Assignment</option>
<option value="other">Other</option>

</select>

</div>


<div class="field">

<label>Duration</label>

<input
name="duration"
id="duration"
placeholder="e.g. 15 minutes">

</div>


<div class="field">

<label>Order</label>

<input
type="number"
name="order"
id="order"
value="1">

</div>


<div class="field">

<label>Status</label>

<select name="status" id="status">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>

</div>


<div class="field full">

<label>Content URL</label>

<input
name="contentUrl"
id="contentUrl"
type="url"
placeholder="https://...">

</div>


<div class="field full">

<label>Description</label>

<textarea
name="description"
id="description"
rows="5"
placeholder="Describe this lesson..."></textarea>

</div>

</div>


<div
id="preview"
class="preview"
style="display:none">
</div>


<div class="form-actions">

<button
type="button"
class="secondary"
onclick="closeModal()">
Cancel
</button>

<button
type="submit"
class="primary">
Save Lesson
</button>

</div>

</form>

</div>

</div>


<div id="toast" class="toast"></div>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import{
getFirestore,
collection,
doc,
getDoc,
getDocs,
query,
where,
addDoc,
updateDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/*
==================================================
FIREBASE
==================================================
*/

const firebaseConfig={

apiKey:
"AIzaSyBcKXbAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/*
==================================================
STATE
==================================================
*/

let courseId="";

let lessons=[];

let modules=[];

let editingId=null;


/*
==================================================
HELPERS
==================================================
*/

const $=id=>
document.getElementById(id);


function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function toast(message){

$("toast").textContent=message;

$("toast").classList.add("show");

setTimeout(
()=>$("toast").classList.remove("show"),
2500
);

}


function error(message){

$("error").innerHTML=
`<div class="error">${esc(message)}</div>`;

}


/*
==================================================
LOAD LESSONS
==================================================
*/

window.loadLessons=async function(){

courseId=
$("courseId").value.trim();

if(!courseId){

error("Enter a Course ID.");

return;

}


try{

$("lessonList").innerHTML=
`<div class="empty">Loading lessons...</div>`;


/*
LOAD LESSONS
*/

const lessonQuery=
query(
collection(db,"lessons"),
where("courseId","==",courseId)
);


/*
LOAD MODULES
*/

const moduleQuery=
query(
collection(db,"modules"),
where("courseId","==",courseId)
);


const [
lessonSnap,
moduleSnap
]=await Promise.all([

getDocs(lessonQuery),

getDocs(moduleQuery)

]);


lessons=
lessonSnap.docs.map(d=>({

id:d.id,
...d.data()

}));


modules=
moduleSnap.docs.map(d=>({

id:d.id,
...d.data()

}));


lessons.sort(
(a,b)=>
Number(a.order||0)-
Number(b.order||0)
);


modules.sort(
(a,b)=>
Number(a.order||0)-
Number(b.order||0)
);


updateStats();

populateModules();

renderLessons();

toast("Lessons loaded.");

}catch(e){

console.error(e);

error(e.message);

}

};


/*
==================================================
STATS
==================================================
*/

function updateStats(){

$("total").textContent=
lessons.length;

$("published").textContent=
lessons.filter(
x=>x.status==="published"
).length;

$("draft").textContent=
lessons.filter(
x=>x.status!=="published"
).length;

$("modules").textContent=
modules.length;

}


/*
==================================================
MODULE SELECT
==================================================
*/

function populateModules(selected=""){

$("moduleId").innerHTML=

`<option value="">
Select Module
</option>`

+

modules.map(m=>`

<option
value="${esc(m.id)}"
${m.id===selected?"selected":""}>

${esc(m.title||m.id)}

</option>

`).join("");


$("moduleFilter").innerHTML=

`<option value="">
All Modules
</option>`

+

modules.map(m=>`

<option value="${esc(m.id)}">

${esc(m.title||m.id)}

</option>

`).join("");

}


/*
==================================================
RENDER
==================================================
*/

function renderLessons(){

const search=
$("search").value
.toLowerCase()
.trim();

const filter=
$("moduleFilter").value;


const list=
lessons.filter(l=>{

const matchesSearch=
!search||
String(l.title||"")
.toLowerCase()
.includes(search)||
String(l.description||"")
.toLowerCase()
.includes(search);

const matchesModule=
!filter||
l.moduleId===filter;

return matchesSearch&&matchesModule;

});


if(!list.length){

$("lessonList").innerHTML=
`<div class="empty">
No lessons found.
</div>`;

return;

}


$("lessonList").innerHTML=
list.map((l,index)=>{

const module=
modules.find(
m=>m.id===l.moduleId
);


return`

<div class="lesson">

<div class="number">
${Number(l.order??index+1)}
</div>


<div class="info">

<h3>
${esc(l.title||"Untitled Lesson")}
</h3>

<p>
${esc(
l.description||
"No description"
)}
</p>


<span class="badge">
${esc(l.type||"lesson")}
</span>


<span class="badge">
${esc(l.status||"draft")}
</span>


<span class="badge">
${esc(
module?.title||
"Module not found"
)}
</span>


${
l.duration
?
`<span class="badge">
⏱ ${esc(l.duration)}
</span>`
:""
}


<div class="actions">

<button
class="secondary"
onclick="previewLesson('${l.id}')">

Preview

</button>


<button
class="secondary"
onclick="editLesson('${l.id}')">

Edit

</button>


<button
class="danger"
onclick="deleteLesson('${l.id}')">

Delete

</button>

</div>

</div>

</div>

`;

}).join("");

}


/*
==================================================
CREATE
==================================================
*/

window.openCreate=function(){

if(!courseId){

error(
"Load a course before creating a lesson."
);

return;

}


editingId=null;

$("modalTitle").textContent=
"New Lesson";


$("lessonForm").reset();


$("formCourseId").value=
courseId;


$("order").value=
lessons.length+1;


$("status").value=
"draft";


populateModules();


$("modal").classList.add("show");

};


/*
==================================================
EDIT
==================================================
*/

window.editLesson=function(id){

const lesson=
lessons.find(x=>x.id===id);

if(!lesson)return;

editingId=id;


$("modalTitle").textContent=
"Edit Lesson";


$("formCourseId").value=
lesson.courseId||courseId;

$("title").value=
lesson.title||"";

$("type").value=
lesson.type||"video";

$("duration").value=
lesson.duration||"";

$("order").value=
lesson.order??1;

$("status").value=
lesson.status||"draft";

$("contentUrl").value=
lesson.contentUrl||"";

$("description").value=
lesson.description||"";


populateModules(
lesson.moduleId||""
);


$("modal").classList.add("show");

};


/*
==================================================
CLOSE
==================================================
*/

window.closeModal=function(){

$("modal").classList.remove("show");

editingId=null;

$("preview").style.display=
"none";

$("preview").innerHTML="";

};


/*
==================================================
SAVE
==================================================
*/

$("lessonForm").addEventListener(
"submit",
async e=>{

e.preventDefault();


try{

const fd=
new FormData(e.target);

const values=
Object.fromEntries(fd.entries());


values.courseId=
$("formCourseId").value.trim();


values.moduleId=
$("moduleId").value;


values.order=
Number(values.order||0);


/*
CREATOR
*/

if(!editingId){

values.createdBy=
"admin";

values.createdAt=
serverTimestamp();

values.updatedAt=
serverTimestamp();


await addDoc(
collection(db,"lessons"),
values
);


toast("Lesson created.");

}else{

values.updatedAt=
serverTimestamp();


await updateDoc(

doc(
db,
"lessons",
editingId
),

values

);


toast("Lesson updated.");

}


closeModal();

await loadLessons();

}catch(e){

console.error(e);

error(e.message);

}

});


/*
==================================================
DELETE
==================================================
*/

window.deleteLesson=
async function(id){

const lesson=
lessons.find(x=>x.id===id);


if(!lesson)return;


if(!confirm(
`Delete "${lesson.title||"this lesson"}"?`
))return;


try{

await deleteDoc(
doc(db,"lessons",id)
);


toast("Lesson deleted.");

await loadLessons();

}catch(e){

console.error(e);

error(e.message);

}

};


/*
==================================================
PREVIEW
==================================================
*/

window.previewLesson=function(id){

const lesson=
lessons.find(x=>x.id===id);

if(!lesson)return;


const url=
lesson.contentUrl||"";


if(!url){

alert(
"This lesson has no contentUrl."
);

return;

}


let target=
"lesson.html?lessonId="+
encodeURIComponent(id);


window.open(
target,
"_blank"
);

};


/*
==================================================
LIVE PREVIEW IN MODAL
==================================================
*/

$("contentUrl").addEventListener(
"input",
()=>{

const url=
$("contentUrl").value.trim();

const type=
$("type").value;

const preview=
$("preview");


if(!url){

preview.style.display="none";

preview.innerHTML="";

return;

}


const youtube=
url.match(
/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/
);


if(youtube){

preview.style.display="block";

preview.innerHTML=`

<iframe
src="https://www.youtube.com/embed/${esc(youtube[1])}"
allowfullscreen>
</iframe>

`;

return;

}


if(
type==="video"||
/\.(mp4|webm|ogg)(\?|$)/i.test(url)
){

preview.style.display="block";

preview.innerHTML=`

<video
controls
src="${esc(url)}">
</video>

`;

return;

}


preview.style.display="block";

preview.innerHTML=`

<iframe
src="${esc(url)}">
</iframe>

`;

});


/*
==================================================
SEARCH
==================================================
*/

$("search").addEventListener(
"input",
renderLessons
);


/*
==================================================
FILTER
==================================================
*/

$("moduleFilter").addEventListener(
"change",
renderLessons
);


/*
==================================================
URL COURSE ID
==================================================
*/

const params=
new URLSearchParams(location.search);

const urlCourse=
params.get("courseId");


if(urlCourse){

$("courseId").value=
urlCourse;

loadLessons();

}


/*
==================================================
YEAR
==================================================
*/

</script>

</body>
</html>
