<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Lessons | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.header{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.header-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-icon{
  width:52px;
  height:52px;
  border-radius:13px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.header h1{
  margin:0;
  font-size:23px;
}

.header p{
  margin:6px 0 0;
  color:#64748b;
  font-size:13px;
}

.message{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:13px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:#fff;
  border-radius:14px;
  padding:17px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.stat-label{
  font-size:12px;
  color:#64748b;
}

.stat-value{
  font-size:24px;
  font-weight:bold;
  margin-top:5px;
}

.form-card,
.list-card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.form-title,
.list-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:15px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:12px;
  font-weight:bold;
  color:#475569;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:9px;
  padding:11px 12px;
  font-family:inherit;
  font-size:13px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
}

.actions{
  display:flex;
  gap:9px;
  margin-top:15px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-secondary{
  background:#e2e8f0;
  color:#334155;
}

.list-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.search{
  max-width:300px;
}

.lesson{
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:15px;
  margin-bottom:11px;
  display:flex;
  gap:14px;
  align-items:flex-start;
}

.lesson-order{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

.lesson-content{
  flex:1;
  min-width:0;
}

.lesson-title{
  font-size:15px;
  font-weight:bold;
}

.lesson-description{
  font-size:12px;
  color:#64748b;
  margin-top:5px;
  line-height:1.5;
}

.meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:9px;
}

.badge{
  font-size:10px;
  padding:5px 9px;
  border-radius:20px;
  background:#f1f5f9;
  color:#475569;
}

.published,
.active{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#fef3c7;
  color:#92400e;
}

.inactive{
  background:#fee2e2;
  color:#991b1b;
}

.lesson-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:36px;
  height:36px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.edit{
  background:#eff6ff;
  color:#2563eb;
}

.delete{
  background:#fee2e2;
  color:#dc2626;
}

.empty,
.loading{
  text-align:center;
  padding:45px 15px;
  color:#64748b;
}

.empty i,
.loading i{
  font-size:35px;
  margin-bottom:12px;
}

@media(max-width:750px){

  .container{
    padding:10px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .list-header{
    flex-direction:column;
    align-items:stretch;
  }

  .search{
    max-width:none;
  }

  .lesson{
    flex-wrap:wrap;
  }

  .lesson-actions{
    width:100%;
    justify-content:flex-end;
  }
}

@media(max-width:400px){

  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">

    <div class="header-top">

      <div class="header-icon">
        <i class="fa-solid fa-book-open"></i>
      </div>

      <div>
        <h1>Admin Lessons</h1>
        <p>Manage course lessons</p>
      </div>

    </div>

  </div>


  <!-- MESSAGE -->
  <div id="message" class="message"></div>


  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      <div class="stat-label">Total Lessons</div>
      <div id="totalLessons" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Published</div>
      <div id="publishedLessons" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Draft</div>
      <div id="draftLessons" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Video Lessons</div>
      <div id="videoLessons" class="stat-value">0</div>
    </div>

  </div>


  <!-- FORM -->
  <div class="form-card">

    <div id="formTitle" class="form-title">
      Add Lesson
    </div>

    <div class="form-grid">

      <!-- COURSE -->
      <div class="field">

        <label>Course</label>

        <select id="courseId">

          <option value="">
            Select course
          </option>

        </select>

      </div>


      <!-- MODULE -->
      <div class="field">

        <label>Module</label>

        <select id="moduleId">

          <option value="">
            Select module
          </option>

        </select>

      </div>


      <!-- TITLE -->
      <div class="field">

        <label>Lesson Title</label>

        <input
          id="title"
          type="text"
          placeholder="Lesson title">

      </div>


      <!-- TYPE -->
      <div class="field">

        <label>Lesson Type</label>

        <select id="type">

          <option value="video">Video</option>
          <option value="text">Text</option>
          <option value="pdf">PDF</option>
          <option value="audio">Audio</option>
          <option value="live">Live</option>
          <option value="other">Other</option>

        </select>

      </div>


      <!-- DESCRIPTION -->
      <div class="field full">

        <label>Description</label>

        <textarea
          id="description"
          placeholder="Lesson description"></textarea>

      </div>


      <!-- CONTENT URL -->
      <div class="field full">

        <label>Content URL</label>

        <input
          id="contentUrl"
          type="url"
          placeholder="https://...">

      </div>


      <!-- DURATION -->
      <div class="field">

        <label>Duration</label>

        <input
          id="duration"
          type="text"
          placeholder="10:30">

      </div>


      <!-- ORDER -->
      <div class="field">

        <label>Order</label>

        <input
          id="order"
          type="number"
          min="1"
          value="1">

      </div>


      <!-- STATUS -->
      <div class="field">

        <label>Status</label>

        <select id="status">

          <option value="draft">
            Draft
          </option>

          <option value="published">
            Published
          </option>

          <option value="active">
            Active
          </option>

          <option value="inactive">
            Inactive
          </option>

        </select>

      </div>

    </div>


    <div class="actions">

      <button
        id="saveBtn"
        class="btn-primary">

        <i class="fa-solid fa-plus"></i>

        Add Lesson

      </button>


      <button
        id="cancelBtn"
        class="btn-secondary"
        style="display:none">

        Cancel

      </button>

    </div>

  </div>


  <!-- LIST -->
  <div class="list-card">

    <div class="list-header">

      <div class="list-title">
        Course Lessons
      </div>

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search lessons...">

    </div>


    <div id="lessonsList">

      <div class="loading">

        <i class="fa-solid fa-spinner fa-spin"></i>

        <br><br>

        Loading lessons...

      </div>

    </div>

  </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const courseSelect =
document.getElementById("courseId");

const moduleSelect =
document.getElementById("moduleId");

const titleInput =
document.getElementById("title");

const typeSelect =
document.getElementById("type");

const descriptionInput =
document.getElementById("description");

const contentUrlInput =
document.getElementById("contentUrl");

const durationInput =
document.getElementById("duration");

const orderInput =
document.getElementById("order");

const statusSelect =
document.getElementById("status");

const saveBtn =
document.getElementById("saveBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const lessonsList =
document.getElementById("lessonsList");

const searchInput =
document.getElementById("search");

const message =
document.getElementById("message");

const totalLessons =
document.getElementById("totalLessons");

const publishedLessons =
document.getElementById("publishedLessons");

const draftLessons =
document.getElementById("draftLessons");

const videoLessons =
document.getElementById("videoLessons");

const formTitle =
document.getElementById("formTitle");


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let lessons = [];

let courses = [];

let modules = [];

let editingLessonId = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type = "success"
){

  message.textContent = text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

  setTimeout(() => {

    message.style.display =
      "none";

  },3500);

}


/* =====================================================
   LOAD COURSES
===================================================== */

async function loadCourses(){

  const snap =
    await getDocs(
      collection(
        db,
        "courses"
      )
    );


  courses =
    snap.docs.map(
      item => ({

        id:item.id,

        ...item.data()

      })
    );


  courseSelect.innerHTML = `

    <option value="">
      Select course
    </option>

  `;


  courses.forEach(
    course => {

      const option =
        document.createElement("option");

      option.value =
        course.id;

      option.textContent =
        course.title ||
        course.id;

      courseSelect.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   LOAD MODULES
===================================================== */

async function loadModules(){

  const snap =
    await getDocs(
      collection(
        db,
        "modules"
      )
    );


  modules =
    snap.docs.map(
      item => ({

        id:item.id,

        ...item.data()

      })
    );


  updateModuleSelect();

}


/* =====================================================
   MODULE SELECT
===================================================== */

function updateModuleSelect(){

  const selectedCourse =
    courseSelect.value;


  moduleSelect.innerHTML = `

    <option value="">
      Select module
    </option>

  `;


  if(!selectedCourse)
    return;


  const courseModules =
    modules
      .filter(
        module =>
          module.courseId ===
          selectedCourse
      )
      .sort(
        (a,b) =>
          Number(a.order || 0) -
          Number(b.order || 0)
      );


  courseModules.forEach(
    module => {

      const option =
        document.createElement("option");

      option.value =
        module.id;

      option.textContent =
        `${module.order || ""} - ${
          module.title || module.id
        }`;

      moduleSelect.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   COURSE CHANGE
===================================================== */

courseSelect.addEventListener(
  "change",
  updateModuleSelect
);


/* =====================================================
   LOAD LESSONS
===================================================== */

async function loadLessons(){

  lessonsList.innerHTML = `

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <br><br>

      Loading lessons...

    </div>

  `;


  const snap =
    await getDocs(
      collection(
        db,
        "lessons"
      )
    );


  lessons =
    snap.docs.map(
      item => ({

        id:item.id,

        ...item.data()

      })
    );


  lessons.sort(
    (a,b) =>
      Number(a.order || 0) -
      Number(b.order || 0)
  );


  updateStats();

  renderLessons();

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  totalLessons.textContent =
    lessons.length;


  publishedLessons.textContent =
    lessons.filter(
      lesson => {

        const status =
          String(
            lesson.status || ""
          ).toLowerCase();

        return (
          status === "published" ||
          status === "active"
        );

      }
    ).length;


  draftLessons.textContent =
    lessons.filter(
      lesson =>
        String(
          lesson.status || ""
        ).toLowerCase() ===
        "draft"
    ).length;


  videoLessons.textContent =
    lessons.filter(
      lesson =>
        String(
          lesson.type || ""
        ).toLowerCase() ===
        "video"
    ).length;

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(status){

  const value =
    String(
      status || ""
    ).toLowerCase();


  if(
    value === "published" ||
    value === "active"
  )
    return value;


  if(value === "draft")
    return "draft";


  if(value === "inactive")
    return "inactive";


  return "";

}


/* =====================================================
   RENDER LESSONS
===================================================== */

function renderLessons(){

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    lessons.filter(
      lesson => {

        const course =
          courses.find(
            c =>
              c.id ===
              lesson.courseId
          );


        const module =
          modules.find(
            m =>
              m.id ===
              lesson.moduleId
          );


        return (

          String(
            lesson.title || ""
          )
          .toLowerCase()
          .includes(search)

          ||

          String(
            lesson.description || ""
          )
          .toLowerCase()
          .includes(search)

          ||

          String(
            lesson.type || ""
          )
          .toLowerCase()
          .includes(search)

          ||

          String(
            course?.title || ""
          )
          .toLowerCase()
          .includes(search)

          ||

          String(
            module?.title || ""
          )
          .toLowerCase()
          .includes(search)

        );

      }
    );


  if(!filtered.length){

    lessonsList.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-book-open"></i>

        <br><br>

        No lessons found.

      </div>

    `;

    return;

  }


  lessonsList.innerHTML =
    filtered.map(
      lesson => {

        const course =
          courses.find(
            c =>
              c.id ===
              lesson.courseId
          );


        const module =
          modules.find(
            m =>
              m.id ===
              lesson.moduleId
          );


        return `

          <div class="lesson">

            <div class="lesson-order">

              ${Number(
                lesson.order
              ) || 1}

            </div>


            <div class="lesson-content">

              <div class="lesson-title">

                ${escapeHTML(
                  lesson.title ||
                  "Untitled Lesson"
                )}

              </div>


              <div class="lesson-description">

                ${escapeHTML(
                  lesson.description ||
                  "No description"
                )}

              </div>


              <div class="meta">

                <span class="badge">

                  <i class="fa-solid fa-graduation-cap"></i>

                  ${escapeHTML(
                    course?.title ||
                    lesson.courseId ||
                    "Unknown Course"
                  )}

                </span>


                <span class="badge">

                  <i class="fa-solid fa-layer-group"></i>

                  ${escapeHTML(
                    module?.title ||
                    lesson.moduleId ||
                    "Unknown Module"
                  )}

                </span>


                <span class="badge">

                  ${escapeHTML(
                    lesson.type ||
                    "Unknown"
                  )}

                </span>


                ${
  lesson.duration
    ? `
      <span class="badge">
        <i class="fa-regular fa-clock"></i>
        ${escapeHTML(lesson.duration)}
      </span>
    `
    : ""
}

<span
  class="badge ${
    statusClass(lesson.status)
  }"
>
  ${escapeHTML(
    lesson.status || "Unknown"
  )}
</span>

</div>

</div>

<div class="lesson-actions">

<button
  class="icon-btn edit"
  title="Edit Lesson"
  onclick="editLesson('${lesson.id}')"
>
  <i class="fa-solid fa-pen"></i>
</button>

<button
  class="icon-btn delete"
  title="Delete Lesson"
  onclick="deleteLesson('${lesson.id}')"
>
  <i class="fa-solid fa-trash"></i>
</button>

</div>

</div>

`;

}).join("");

}


/* =====================================================
   SAVE LESSON
===================================================== */

saveBtn.addEventListener(
  "click",
  async () => {

    const courseId =
      courseSelect.value;

    const moduleId =
      moduleSelect.value;

    const title =
      titleInput.value.trim();

    const type =
      typeSelect.value;

    const description =
      descriptionInput.value.trim();

    const contentUrl =
      contentUrlInput.value.trim();

    const duration =
      durationInput.value.trim();

    const order =
      Number(orderInput.value);

    const status =
      statusSelect.value;


    if(!courseId){
      showMessage(
        "Please select a course.",
        "error"
      );
      return;
    }


    if(!moduleId){
      showMessage(
        "Please select a module.",
        "error"
      );
      return;
    }


    if(!title){
      showMessage(
        "Lesson title is required.",
        "error"
      );
      return;
    }


    if(!order || order < 1){
      showMessage(
        "Enter a valid lesson order.",
        "error"
      );
      return;
    }


    saveBtn.disabled = true;


    try{

      /* =========================================
         UPDATE
      ========================================= */

      if(editingLessonId){

        await updateDoc(

          doc(
            db,
            "lessons",
            editingLessonId
          ),

          {
            courseId: courseId,
            moduleId: moduleId,
            title: title,
            type: type,
            description: description,
            contentUrl: contentUrl,
            duration: duration,
            order: order,
            status: status,
            updatedAt: serverTimestamp()
          }

        );


        showMessage(
          "Lesson updated successfully."
        );

      }

      /* =========================================
         CREATE
         FIREBASE GENERATES ID AUTOMATICALLY
      ========================================= */

      else{

        const lessonRef =
          await addDoc(

            collection(
              db,
              "lessons"
            ),

            {
              courseId: courseId,
              moduleId: moduleId,
              title: title,
              type: type,
              description: description,
              contentUrl: contentUrl,
              duration: duration,
              order: order,
              status: status,

              createdBy:
                currentUser.uid,

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp()
            }

          );


        console.log(
          "Firebase Lesson ID:",
          lessonRef.id
        );


        showMessage(
          "Lesson created successfully."
        );

      }


      resetForm();

      await loadLessons();

    }
    catch(error){

      console.error(
        "Lesson Error:",
        error
      );

      showMessage(
        error.message ||
        "Operation failed.",
        "error"
      );

    }


    saveBtn.disabled = false;

  }
);


/* =====================================================
   EDIT LESSON
===================================================== */

window.editLesson =
function(id){

  const lesson =
    lessons.find(
      item =>
        item.id === id
    );


  if(!lesson)
    return;


  editingLessonId = id;


  courseSelect.value =
    lesson.courseId || "";


  updateModuleSelect();


  moduleSelect.value =
    lesson.moduleId || "";


  titleInput.value =
    lesson.title || "";


  typeSelect.value =
    lesson.type || "video";


  descriptionInput.value =
    lesson.description || "";


  contentUrlInput.value =
    lesson.contentUrl || "";


  durationInput.value =
    lesson.duration || "";


  orderInput.value =
    lesson.order || 1;


  statusSelect.value =
    lesson.status || "draft";


  formTitle.textContent =
    "Edit Lesson";


  saveBtn.innerHTML = `
    <i class="fa-solid fa-save"></i>
    Update Lesson
  `;


  cancelBtn.style.display =
    "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* =====================================================
   DELETE LESSON
===================================================== */

window.deleteLesson =
async function(id){

  const lesson =
    lessons.find(
      item =>
        item.id === id
    );


  if(!lesson)
    return;


  const confirmed =
    confirm(
      `Delete lesson "${lesson.title || ""}"?`
    );


  if(!confirmed)
    return;


  try{

    await deleteDoc(

      doc(
        db,
        "lessons",
        id
      )

    );


    showMessage(
      "Lesson deleted successfully."
    );


    await loadLessons();

  }
  catch(error){

    console.error(
      error
    );

    showMessage(
      error.message ||
      "Failed to delete lesson.",
      "error"
    );

  }

};


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

  editingLessonId = null;


  courseSelect.value = "";


  moduleSelect.innerHTML = `
    <option value="">
      Select module
    </option>
  `;


  titleInput.value = "";


  typeSelect.value =
    "video";


  descriptionInput.value =
    "";


  contentUrlInput.value =
    "";


  durationInput.value =
    "";


  orderInput.value =
    1;


  statusSelect.value =
    "draft";


  formTitle.textContent =
    "Add Lesson";


  saveBtn.innerHTML = `
    <i class="fa-solid fa-plus"></i>
    Add Lesson
  `;


  cancelBtn.style.display =
    "none";

}


/* =====================================================
   CANCEL
===================================================== */

cancelBtn.addEventListener(
  "click",
  resetForm
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  renderLessons
);


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      currentUser = null;

      lessonsList.innerHTML = `
        <div class="empty">

          <i class="fa-solid fa-lock"></i>

          <br><br>

          Please login as administrator.

        </div>
      `;

      return;

    }


    currentUser = user;


    try{

      await loadCourses();

      await loadModules();

      await loadLessons();

    }
    catch(error){

      console.error(
        error
      );


      lessonsList.innerHTML = `
        <div class="empty">

          <i class="fa-solid fa-triangle-exclamation"></i>

          <br><br>

          ${escapeHTML(
            error.message ||
            "Failed to load lessons."
          )}

        </div>
      `;

    }

  }
);

</script>

</body>
