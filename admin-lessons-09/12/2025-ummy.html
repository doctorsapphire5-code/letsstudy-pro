<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Lessons | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.header-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-icon{
  width:52px;
  height:52px;
  border-radius:13px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.header h1{
  margin:0;
  font-size:23px;
}

.header p{
  margin:6px 0 0;
  color:#64748b;
  font-size:13px;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:13px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}


/* =====================================================
   STATS
===================================================== */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:#fff;
  border-radius:14px;
  padding:17px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.stat-label{
  font-size:12px;
  color:#64748b;
}

.stat-value{
  font-size:24px;
  font-weight:bold;
  margin-top:5px;
}


/* =====================================================
   FORM
===================================================== */

.form-card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.form-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:15px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:12px;
  font-weight:bold;
  color:#475569;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:9px;
  padding:11px 12px;
  font-family:inherit;
  font-size:13px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
}


/* =====================================================
   BUTTONS
===================================================== */

.actions{
  display:flex;
  gap:9px;
  margin-top:15px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-secondary{
  background:#e2e8f0;
  color:#334155;
}


/* =====================================================
   LIST
===================================================== */

.list-card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.list-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.list-title{
  font-size:17px;
  font-weight:bold;
}

.search{
  max-width:300px;
}


/* =====================================================
   LESSON
===================================================== */

.lesson{
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:15px;
  margin-bottom:11px;
  display:flex;
  gap:14px;
  align-items:flex-start;
}

.lesson-order{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

.lesson-content{
  flex:1;
  min-width:0;
}

.lesson-title{
  font-size:15px;
  font-weight:bold;
}

.lesson-description{
  font-size:12px;
  color:#64748b;
  margin-top:5px;
  line-height:1.5;
}

.meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:9px;
}

.badge{
  font-size:10px;
  padding:5px 9px;
  border-radius:20px;
  background:#f1f5f9;
  color:#475569;
}

.published,
.active{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#fef3c7;
  color:#92400e;
}

.inactive{
  background:#fee2e2;
  color:#991b1b;
}

.lesson-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:36px;
  height:36px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.edit{
  background:#eff6ff;
  color:#2563eb;
}

.delete{
  background:#fee2e2;
  color:#dc2626;
}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.empty,
.loading{
  text-align:center;
  padding:45px 15px;
  color:#64748b;
}

.empty i,
.loading i{
  font-size:35px;
  margin-bottom:12px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:750px){

  .container{
    padding:10px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .list-header{
    flex-direction:column;
    align-items:stretch;
  }

  .search{
    max-width:none;
  }

  .lesson{
    flex-wrap:wrap;
  }

  .lesson-actions{
    width:100%;
    justify-content:flex-end;
  }

}

@media(max-width:400px){

  .stats{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

  <div class="header-top">

    <div class="header-icon">
      <i class="fa-solid fa-book-open"></i>
    </div>

    <div>

      <h1>
        Admin Lessons
      </h1>

      <p>
        Manage course lessons
      </p>

    </div>

  </div>

</div>


<!-- =====================================================
     MESSAGE
===================================================== -->

<div
id="message"
class="message">
</div>


<!-- =====================================================
     STATS
===================================================== -->

<div class="stats">


  <div class="stat">

    <div class="stat-label">
      Total Lessons
    </div>

    <div
    id="totalLessons"
    class="stat-value">
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      Published
    </div>

    <div
    id="publishedLessons"
    class="stat-value">
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      Draft
    </div>

    <div
    id="draftLessons"
    class="stat-value">
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      Video Lessons
    </div>

    <div
    id="videoLessons"
    class="stat-value">
      0
    </div>

  </div>


</div>


<!-- =====================================================
     FORM
===================================================== -->

<div class="form-card">


  <div
  id="formTitle"
  class="form-title">

    Add Lesson

  </div>


  <div class="form-grid">


    <!-- COURSE -->

    <div class="field">

      <label>
        Course
      </label>

      <select
      id="courseId">

        <option value="">
          Select course
        </option>

      </select>

    </div>


    <!-- MODULE -->

    <div class="field">

      <label>
        Module
      </label>

      <select
      id="moduleId">

        <option value="">
          Select module
        </option>

      </select>

    </div>


    <!-- TITLE -->

    <div class="field">

      <label>
        Lesson Title
      </label>

      <input
      id="title"
      type="text"
      placeholder="Lesson title">

    </div>


    <!-- TYPE -->

    <div class="field">

      <label>
        Lesson Type
      </label>

      <select
      id="type">

        <option value="video">
          Video
        </option>

        <option value="text">
          Text
        </option>

        <option value="pdf">
          PDF
        </option>

        <option value="audio">
          Audio
        </option>

        <option value="live">
          Live
        </option>

        <option value="other">
          Other
        </option>

      </select>

    </div>


    <!-- DESCRIPTION -->

    <div class="field full">

      <label>
        Description
      </label>

      <textarea
      id="description"
      placeholder="Lesson description"></textarea>

    </div>


    <!-- CONTENT URL -->

    <div class="field full">

      <label>
        Content URL
      </label>

      <input
      id="contentUrl"
      type="url"
      placeholder="https://...">

    </div>


    <!-- DURATION -->

    <div class="field">

      <label>
        Duration
      </label>

      <input
      id="duration"
      type="text"
      placeholder="10:30">

    </div>


    <!-- ORDER -->

    <div class="field">

      <label>
        Order
      </label>

      <input
      id="order"
      type="number"
      min="1"
      value="1">

    </div>


    <!-- STATUS -->

    <div class="field">

      <label>
        Status
      </label>

      <select
      id="status">

        <option value="draft">
          Draft
        </option>

        <option value="published">
          Published
        </option>

        <option value="active">
          Active
        </option>

        <option value="inactive">
          Inactive
        </option>

      </select>

    </div>


  </div>


  <div class="actions">


    <button
    id="saveBtn"
    class="btn-primary"
    type="button">

      <i class="fa-solid fa-plus"></i>

      Add Lesson

    </button>


    <button
    id="cancelBtn"
    class="btn-secondary"
    type="button"
    style="display:none">

      Cancel

    </button>


  </div>


</div>


<!-- =====================================================
     LESSON LIST
===================================================== -->

<div class="list-card">


  <div class="list-header">

    <div class="list-title">
      Course Lessons
    </div>


    <input
    id="search"
    class="search"
    type="search"
    placeholder="Search lessons...">

  </div>


  <div id="lessonsList">

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <br><br>

      Loading lessons...

    </div>

  </div>


</div>


</div>


<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(
  firebaseConfig
);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const courseSelect =
document.getElementById(
  "courseId"
);

const moduleSelect =
document.getElementById(
  "moduleId"
);

const titleInput =
document.getElementById(
  "title"
);

const typeSelect =
document.getElementById(
  "type"
);

const descriptionInput =
document.getElementById(
  "description"
);

const contentUrlInput =
document.getElementById(
  "contentUrl"
);

const durationInput =
document.getElementById(
  "duration"
);

const orderInput =
document.getElementById(
  "order"
);

const statusSelect =
document.getElementById(
  "status"
);

const saveBtn =
document.getElementById(
  "saveBtn"
);

const cancelBtn =
document.getElementById(
  "cancelBtn"
);

const lessonsList =
document.getElementById(
  "lessonsList"
);

const searchInput =
document.getElementById(
  "search"
);

const message =
document.getElementById(
  "message"
);

const totalLessons =
document.getElementById(
  "totalLessons"
);

const publishedLessons =
document.getElementById(
  "publishedLessons"
);

const draftLessons =
document.getElementById(
  "draftLessons"
);

const videoLessons =
document.getElementById(
  "videoLessons"
);

const formTitle =
document.getElementById(
  "formTitle"
);


/* =====================================================
   STATE
===================================================== */

let lessons = [];

let courses = [];

let modules = [];

let editingLessonId = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type = "success"
){

  message.textContent =
    text;

  message.className =
    "message " + type;

  message.style.display =
    "block";


  setTimeout(
    () => {

      message.style.display =
        "none";

    },
    3500
  );

}


/* =====================================================
   LOAD COURSES
===================================================== */

async function loadCourses(){

  const snapshot =
    await getDocs(
      collection(
        db,
        "courses"
      )
    );


  courses =
    snapshot.docs.map(
      item => ({

        id:
          item.id,

        ...item.data()

      })
    );


  courses.sort(
    (a,b) => {

      return String(
        a.title || ""
      ).localeCompare(
        String(
          b.title || ""
        )
      );

    }
  );


  courseSelect.innerHTML = `

    <option value="">
      Select course
    </option>

  `;


  courses.forEach(
    course => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        course.id;


      option.textContent =
        course.title ||
        course.name ||
        course.id;


      courseSelect.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   LOAD MODULES
===================================================== */

async function loadModules(){

  const snapshot =
    await getDocs(
      collection(
        db,
        "modules"
      )
    );


  modules =
    snapshot.docs.map(
      item => ({

        id:
          item.id,

        ...item.data()

      })
    );


  modules.sort(
    (a,b) => {

      const courseA =
        String(
          a.courseId || ""
        );

      const courseB =
        String(
          b.courseId || ""
        );


      if(
        courseA !== courseB
      ){

        return courseA.localeCompare(
          courseB
        );

      }


      return Number(
        a.order || 0
      )
      -
      Number(
        b.order || 0
      );

    }
  );


  updateModuleSelect();

}


/* =====================================================
   UPDATE MODULE SELECT
===================================================== */

function updateModuleSelect(){

  const selectedCourse =
    courseSelect.value;


  moduleSelect.innerHTML = `

    <option value="">
      Select module
    </option>

  `;


  if(!selectedCourse)
    return;


  const courseModules =
    modules
      .filter(
        module =>
          module.courseId ===
          selectedCourse
      )
      .sort(
        (a,b) =>
          Number(
            a.order || 0
          )
          -
          Number(
            b.order || 0
          )
      );


  courseModules.forEach(
    module => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        module.id;


      option.textContent =
        `${module.order || ""} - ${
          module.title ||
          module.id
        }`;


      moduleSelect.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   COURSE CHANGE
===================================================== */

courseSelect.addEventListener(
  "change",
  () => {

    updateModuleSelect();

  }
);


/* =====================================================
   LOAD LESSONS
===================================================== */

async function loadLessons(){

  lessonsList.innerHTML = `

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <br><br>

      Loading lessons...

    </div>

  `;


  const snapshot =
    await getDocs(
      collection(
        db,
        "lessons"
      )
    );


  lessons =
    snapshot.docs.map(
      item => ({

        id:
          item.id,

        ...item.data()

      })
    );


  lessons.sort(
    (a,b) => {

      const courseA =
        String(
          a.courseId || ""
        );

      const courseB =
        String(
          b.courseId || ""
        );


      if(
        courseA !== courseB
      ){

        return courseA.localeCompare(
          courseB
        );

      }


      const moduleA =
        String(
          a.moduleId || ""
        );

      const moduleB =
        String(
          b.moduleId || ""
        );


      if(
        moduleA !== moduleB
      ){

        return moduleA.localeCompare(
          moduleB
        );

      }


      return Number(
        a.order || 0
      )
      -
      Number(
        b.order || 0
      );

    }
  );


  updateStats();

  renderLessons();

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  totalLessons.textContent =
    lessons.length;


  publishedLessons.textContent =
    lessons.filter(
      lesson => {

        const status =
          String(
            lesson.status || ""
          )
          .toLowerCase();


        return (
          status ===
          "published"
          ||
          status ===
          "active"
        );

      }
    ).length;


  draftLessons.textContent =
    lessons.filter(
      lesson => {

        return (
          String(
            lesson.status || ""
          )
          .toLowerCase()
          ===
          "draft"
        );

      }
    ).length;


  videoLessons.textContent =
    lessons.filter(
      lesson => {

        return (
          String(
            lesson.type || ""
          )
          .toLowerCase()
          ===
          "video"
        );

      }
    ).length;

}


/* ===========================
   RENDER LESSONS
=========================== */

function renderLessons(){

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    lessons.filter(
      lesson => {

        const course =
          courses.find(
            c =>
              c.id ===
              lesson.courseId
          );


        const module =
          modules.find(
            m =>
              m.id ===
              lesson.moduleId
          );


        const title =
          String(
            lesson.title || ""
          )
          .toLowerCase();


        const description =
          String(
            lesson.description || ""
          )
          .toLowerCase();


        const type =
          String(
            lesson.type || ""
          )
          .toLowerCase();


        const courseTitle =
          String(
            course?.title || ""
          )
          .toLowerCase();


        const moduleTitle =
          String(
            module?.title || ""
          )
          .toLowerCase();


        return (
          title.includes(search) ||
          description.includes(search) ||
          type.includes(search) ||
          courseTitle.includes(search) ||
          moduleTitle.includes(search)
        );

      }
    );


  if(!filtered.length){

    lessonsList.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-book-open"></i>

        <br><br>

        No lessons found.

      </div>

    `;

    return;

  }


  lessonsList.innerHTML =
    filtered.map(
      lesson => {

        const course =
          courses.find(
            c =>
              c.id ===
              lesson.courseId
          );


        const module =
          modules.find(
            m =>
              m.id ===
              lesson.moduleId
          );


        const status =
          String(
            lesson.status ||
            "draft"
          )
          .toLowerCase();


        return `

          <div
            class="lesson"
            data-id="${escapeHTML(
              lesson.id
            )}">

            <div class="lesson-order">

              ${
                Number(
                  lesson.order
                ) || 1
              }

            </div>


            <div class="lesson-content">

              <div class="lesson-title">

                ${escapeHTML(
                  lesson.title ||
                  "Untitled Lesson"
                )}

              </div>


              <div class="lesson-description">

                ${escapeHTML(
                  lesson.description ||
                  "No description"
                )}

              </div>


              <div class="meta">

                <span class="badge">

                  <i class="fa-solid fa-graduation-cap"></i>

                  ${escapeHTML(
                    course?.title ||
                    lesson.courseId ||
                    "Unknown Course"
                  )}

                </span>


                <span class="badge">

                  <i class="fa-solid fa-layer-group"></i>

                  ${escapeHTML(
                    module?.title ||
                    lesson.moduleId ||
                    "Unknown Module"
                  )}

                </span>


                <span class="badge">

                  <i class="fa-solid fa-tag"></i>

                  ${escapeHTML(
                    lesson.type ||
                    "Unknown"
                  )}

                </span>


                ${
                  lesson.duration
                    ? `
                      <span class="badge">

                        <i class="fa-solid fa-clock"></i>

                        ${escapeHTML(
                          lesson.duration
                        )}

                      </span>
                    `
                    : ""
                }


                <span
                  class="badge ${
                    statusClass(
                      status
                    )
                  }">

                  ${escapeHTML(
                    lesson.status ||
                    "draft"
                  )}

                </span>


                <span class="badge">

                  Order:
                  ${
                    Number(
                      lesson.order
                    ) || 1
                  }

                </span>


                ${
                  lesson.contentUrl
                    ? `
                      <span class="badge">

                        <i class="fa-solid fa-link"></i>

                        URL

                      </span>
                    `
                    : ""
                }

              </div>

            </div>


            <div class="lesson-actions">

              <button
                class="icon-btn edit"
                type="button"
                title="Edit"
                data-action="edit"
                data-id="${escapeHTML(
                  lesson.id
                )}">

                <i class="fa-solid fa-pen"></i>

              </button>


              <button
                class="icon-btn delete"
                type="button"
                title="Delete"
                data-action="delete"
                data-id="${escapeHTML(
                  lesson.id
                )}">

                <i class="fa-solid fa-trash"></i>

              </button>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* ===========================
   SAVE LESSON
=========================== */

saveBtn.addEventListener(
  "click",
  async () => {

    const courseId =
      courseSelect.value;

    const moduleId =
      moduleSelect.value;

    const title =
      titleInput.value.trim();

    const type =
      typeSelect.value;

    const description =
      descriptionInput.value.trim();

    const contentUrl =
      contentUrlInput.value.trim();

    const duration =
      durationInput.value.trim();

    const order =
      Number(
        orderInput.value
      );

    const status =
      statusSelect.value;


    if(!courseId){

      showMessage(
        "Please select a course.",
        "error"
      );

      return;

    }


    if(!moduleId){

      showMessage(
        "Please select a module.",
        "error"
      );

      return;

    }


    if(!title){

      showMessage(
        "Lesson title is required.",
        "error"
      );

      return;

    }


    if(
      !Number.isFinite(order) ||
      order < 1
    ){

      showMessage(
        "Enter a valid lesson order.",
        "error"
      );

      return;

    }


    saveBtn.disabled =
      true;


    try{

      const lessonData = {

        courseId:
          courseId,

        moduleId:
          moduleId,

        title:
          title,

        type:
          type,

        description:
          description,

        contentUrl:
          contentUrl,

        duration:
          duration,

        order:
          order,

        status:
          status,

        updatedAt:
          serverTimestamp()

      };


      if(editingLessonId){

        await updateDoc(

          doc(
            db,
            "lessons",
            editingLessonId
          ),

          lessonData

        );


        showMessage(
          "Lesson updated successfully."
        );

      }else{

        await addDoc(

          collection(
            db,
            "lessons"
          ),

          {

            ...lessonData,

            createdAt:
              serverTimestamp()

          }

        );


        showMessage(
          "Lesson added successfully."
        );

      }


      resetForm();

      await loadLessons();


    }catch(error){

      console.error(
        "Save lesson error:",
        error
      );


      showMessage(
        error.message ||
        "Unable to save lesson.",
        "error"
      );

    }finally{

      saveBtn.disabled =
        false;

    }

  }
);


/* ===========================
   EDIT LESSON
=========================== */

window.editLesson =
function(id){

  const lesson =
    lessons.find(
      item =>
        item.id === id
    );


  if(!lesson)
    return;


  editingLessonId =
    id;


  courseSelect.value =
    lesson.courseId || "";


  updateModuleSelect();


  moduleSelect.value =
    lesson.moduleId || "";


  titleInput.value =
    lesson.title || "";


  typeSelect.value =
    lesson.type || "video";


  descriptionInput.value =
    lesson.description || "";


  contentUrlInput.value =
    lesson.contentUrl || "";


  durationInput.value =
    lesson.duration || "";


  orderInput.value =
    lesson.order || 1;


  statusSelect.value =
    lesson.status || "draft";


  formTitle.textContent =
    "Edit Lesson";


  saveBtn.innerHTML = `

    <i class="fa-solid fa-save"></i>

    Update Lesson

  `;


  cancelBtn.style.display =
    "inline-block";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

};


/* ===========================
   DELETE LESSON
=========================== */

window.removeLesson =
async function(id){

  const lesson =
    lessons.find(
      item =>
        item.id === id
    );


  if(!lesson)
    return;


  const confirmed =
    confirm(
      `Delete lesson "${
        lesson.title ||
        "Untitled Lesson"
      }"?`
    );


  if(!confirmed)
    return;


  try{

    await deleteDoc(

      doc(
        db,
        "lessons",
        id
      )

    );


    showMessage(
      "Lesson deleted successfully."
    );


    await loadLessons();


  }catch(error){

    console.error(
      "Delete lesson error:",
      error
    );


    showMessage(
      error.message ||
      "Unable to delete lesson.",
      "error"
    );

  }

};


/* ===========================
   LIST ACTIONS
=========================== */

lessonsList.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if(!button)
      return;


    const id =
      button.dataset.id;

    const action =
      button.dataset.action;


    if(action === "edit"){

      window.editLesson(id);

    }


    if(action === "delete"){

      window.removeLesson(id);

    }

  }
);


/* ===========================
   CANCEL EDIT
=========================== */

cancelBtn.addEventListener(
  "click",
  resetForm
);


/* ===========================
   RESET FORM
=========================== */

function resetForm(){

  editingLessonId =
    null;


  courseSelect.value =
    "";


  moduleSelect.innerHTML = `

    <option value="">
      Select module
    </option>

  `;


  titleInput.value =
    "";


  typeSelect.value =
    "video";


  descriptionInput.value =
    "";


  contentUrlInput.value =
    "";


  durationInput.value =
    "";


  orderInput.value =
    1;


  statusSelect.value =
    "draft";


  formTitle.textContent =
    "Add Lesson";


  saveBtn.innerHTML = `

    <i class="fa-solid fa-plus"></i>

    Add Lesson

  `;


  cancelBtn.style.display =
    "none";

}


/* ===========================
   SEARCH
=========================== */

searchInput.addEventListener(
  "input",
  renderLessons
);


/* ===========================
   INITIALIZE
=========================== */

async function initialize(){

  try{

    await loadCourses();

    await loadModules();

    await loadLessons();

  }catch(error){

    console.error(
      "Initialization error:",
      error
    );


    lessonsList.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-triangle-exclamation"></i>

        <br><br>

        ${escapeHTML(
          error.message ||
          "Unable to load lessons."
        )}

      </div>

    `;

  }

}


initialize();


</script>
