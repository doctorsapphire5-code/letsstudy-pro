<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Lessons | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:#111827;
 color:white;
 padding:16px 5%;
 font-weight:700
}
main{
 max-width:1100px;
 margin:auto;
 padding:20px
}
.card,.lesson{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:16px;
 margin-bottom:15px
}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px
}
.stat{
 background:#fff;
 padding:15px;
 border-radius:10px;
 border:1px solid #e5e7eb
}
.num{
 font-size:25px;
 font-weight:700;
 margin-top:5px
}
.form{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.full{grid-column:1/-1}
label{
 display:block;
 font-size:13px;
 font-weight:700;
 margin-bottom:4px
}
input,select,textarea{
 width:100%;
 padding:10px;
 border:1px solid #d1d5db;
 border-radius:7px
}
textarea{min-height:100px}
button{
 border:0;
 border-radius:7px;
 padding:9px 12px;
 cursor:pointer
}
.blue{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.red{background:#dc2626;color:white}
.orange{background:#f59e0b;color:white}
.gray{background:#e5e7eb;color:#111827}
.toolbar{
 display:grid;
 grid-template-columns:2fr 1fr 1fr;
 gap:8px
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}
.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 margin:3px
}
.published{
 background:#dcfce7;
 color:#166534
}
.draft{
 background:#e5e7eb;
 color:#374151
}
.preview{
 background:#dbeafe;
 color:#1e40af
}
.actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin-top:12px
}
.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:10
}
.modalBox{
 background:white;
 width:min(800px,100%);
 max-height:90vh;
 overflow:auto;
 border-radius:12px;
 padding:20px
}
.video{
 width:100%;
 max-height:350px;
 background:#000;
 border-radius:8px
}
@media(max-width:750px){
 .stats,.grid{grid-template-columns:1fr 1fr}
 .form,.toolbar{grid-template-columns:1fr}
 .full{grid-column:auto}
}
@media(max-width:450px){
 .stats,.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
🎓 LetsStudy Pro — Admin Lessons
</header>

<main>

<h1>Lesson Management</h1>

<div class="stats">

<div class="stat">
Total Lessons
<div class="num" id="total">0</div>
</div>

<div class="stat">
Published
<div class="num" id="published">0</div>
</div>

<div class="stat">
Drafts
<div class="num" id="drafts">0</div>
</div>

<div class="stat">
Courses
<div class="num" id="courses">0</div>
</div>

</div>


<!-- ADD / EDIT LESSON -->

<div class="card">

<h2>➕ Add / Edit Lesson</h2>

<form id="lessonForm">

<input type="hidden" id="lessonId">

<div class="form">

<div class="full">
<label>Course *</label>
<select id="course" required>
<option value="">Select Course</option>
</select>
</div>

<div>
<label>Module</label>
<select id="module">
<option value="">Select Module</option>
</select>
</div>

<div>
<label>Lesson Title *</label>
<input id="title" required>
</div>

<div>
<label>Order</label>
<input id="order" type="number" min="1" value="1">
</div>

<div>
<label>Lesson Type</label>
<select id="type">
<option value="video">Video</option>
<option value="article">Article</option>
<option value="pdf">PDF</option>
<option value="quiz">Quiz</option>
<option value="assignment">Assignment</option>
<option value="live">Live</option>
</select>
</div>

<div>
<label>Video Duration (seconds)</label>
<input id="videoDuration" type="number" min="0" value="0">
</div>

<div class="full">
<label>Video URL</label>
<input id="videoUrl" type="url"
placeholder="https://...">
</div>

<div class="full">
<label>PDF URL</label>
<input id="pdfUrl" type="url"
placeholder="https://...">
</div>

<div class="full">
<label>Resources</label>
<input id="resources"
placeholder="https://file1.pdf, https://file2.pdf">
</div>

<div class="full">
<label>Description</label>
<textarea id="description"></textarea>
</div>

<div class="full">
<label>Article / Lesson Content</label>
<textarea id="content"
placeholder="Lesson content..."></textarea>
</div>

<div>
<label>Published</label>
<select id="published">
<option value="false">Draft</option>
<option value="true">Published</option>
</select>
</div>

<div>
<label>Preview</label>
<select id="preview">
<option value="false">No</option>
<option value="true">Yes</option>
</select>
</div>

</div>

<br>

<button class="blue">
Save Lesson
</button>

<button
type="button"
class="gray"
onclick="clearForm()">
Clear
</button>

</form>

</div>


<!-- SEARCH -->

<div class="card">

<h2>🔎 Lessons</h2>

<div class="toolbar">

<input id="search"
placeholder="Search lesson...">

<select id="filterCourse">
<option value="">All Courses</option>
</select>

<select id="filterStatus">
<option value="">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>

</div>

</div>


<div id="lessons" class="grid">
Loading...
</div>

</main>


<!-- PREVIEW -->

<div class="modal" id="previewModal">

<div class="modalBox">

<div style="display:flex;justify-content:space-between;gap:10px">

<h2 id="previewTitle">Lesson</h2>

<button
class="gray"
onclick="closePreview()">
✕
</button>

</div>

<div id="previewBody"></div>

</div>

</div>


<script type="module">

import{
 initializeApp
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 serverTimestamp
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

let courses=[];
let lessons=[];
let editing=null;

const $=id=>
document.getElementById(id);


function clean(x){

return String(x??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* LOAD COURSES */

async function loadCourses(){

const snap=await getDocs(
collection(db,"courses")
);

courses=snap.docs.map(d=>({
id:d.id,
...d.data()
}));


$("course").innerHTML=
'<option value="">Select Course</option>'
+
courses.map(c=>
`<option value="${c.id}">
${clean(c.title)}
</option>`
).join("");


$("filterCourse").innerHTML=
'<option value="">All Courses</option>'
+
courses.map(c=>
`<option value="${c.id}">
${clean(c.title)}
</option>`
).join("");


$("courses").textContent=
courses.length;

}


/* LOAD MODULES */

$("course").onchange=async()=>{

const courseId=$("course").value;

$("module").innerHTML=
'<option value="">Select Module</option>';

if(!courseId)return;

const snap=await getDocs(
collection(
db,
"courses",
courseId,
"modules"
)
);

$("module").innerHTML+=
snap.docs.map(d=>{

const m=d.data();

return `
<option value="${d.id}">
${clean(m.title)}
</option>
`;

}).join("");

};


/* LOAD ALL LESSONS */

async function loadLessons(){

lessons=[];

for(const c of courses){

const snap=await getDocs(
collection(
db,
"courses",
c.id,
"lessons"
)
);

snap.docs.forEach(d=>{

lessons.push({

id:d.id,
courseId:c.id,
courseTitle:c.title,
...d.data()

});

});

}

stats();

render();

}


/* STATS */

function stats(){

$("total").textContent=
lessons.length;

$("published").textContent=
lessons.filter(x=>
x.isPublished===true
).length;

$("drafts").textContent=
lessons.filter(x=>
x.isPublished!==true
).length;

}


/* RENDER */

function render(){

const q=
$("search").value
.toLowerCase()
.trim();

const course=
$("filterCourse").value;

const status=
$("filterStatus").value;


const data=lessons.filter(l=>{

const text=[
l.title,
l.description,
l.content,
l.type,
l.courseTitle
].join(" ").toLowerCase();

const state=
l.isPublished
?"published"
:"draft";

return(

(!q||text.includes(q))&&
(!course||l.courseId===course)&&
(!status||state===status)

);

});


if(!data.length){

$("lessons").innerHTML=
"<div class='card'>No lessons found.</div>";

return;

}


$("lessons").innerHTML=
data.map(l=>`

<div class="lesson">

<h3>
📖 ${clean(l.title)}
</h3>

<p>
<b>Course:</b>
${clean(l.courseTitle)}
</p>

<p>
<b>Type:</b>
${clean(l.type||"video")}
</p>

<span class="badge ${
l.isPublished
?"published"
:"draft"
}">
${l.isPublished
?"Published"
:"Draft"}
</span>

${l.isPreview
?
"<span class='badge preview'>Preview</span>"
:""}

<p>
${clean(l.description||"")}
</p>

<div class="actions">

<button
class="blue"
onclick="previewLesson('${l.courseId}','${l.id}')">
👁 Preview
</button>

<button
class="gray"
onclick="editLesson('${l.courseId}','${l.id}')">
✏ Edit
</button>

<button
class="orange"
onclick="togglePublish('${l.courseId}','${l.id}',${!!l.isPublished})">
${l.isPublished
?"Unpublish"
:"Publish"}
</button>

<button
class="red"
onclick="deleteLesson('${l.courseId}','${l.id}')">
🗑 Delete
</button>

</div>

</div>

`).join("");

}


/* SAVE LESSON */

$("lessonForm").onsubmit=async e=>{

e.preventDefault();

const courseId=
$("course").value;

if(!courseId){

alert("Select a course.");

return;

}


const data={

title:
$("title").value.trim(),

description:
$("description").value.trim(),

moduleId:
$("module").value,

order:
Number($("order").value||1),

type:
$("type").value,

videoUrl:
$("videoUrl").value.trim(),

videoDuration:
Number($("videoDuration").value||0),

content:
$("content").value.trim(),

pdfUrl:
$("pdfUrl").value.trim(),

resources:
$("resources").value
.split(",")
.map(x=>x.trim())
.filter(Boolean),

isPreview:
$("preview").value==="true",

isPublished:
$("published").value==="true",

updatedAt:
serverTimestamp()

};


try{

if(editing){

await updateDoc(
doc(
db,
"courses",
editing.courseId,
"lessons",
editing.lessonId
),
data
);

alert("Lesson updated.");

}else{

await addDoc(
collection(
db,
"courses",
courseId,
"lessons"
),
{
...data,
createdAt:
serverTimestamp()
}
);

alert("Lesson created.");

}

clearForm();

await loadLessons();

}catch(error){

alert(error.message);

}

};


/* EDIT */

window.editLesson=async(
courseId,
lessonId
)=>{

const lesson=
lessons.find(x=>
x.courseId===courseId &&
x.id===lessonId
);

if(!lesson)return;

editing={
courseId,
lessonId
};

$("course").value=courseId;

$("course").dispatchEvent(
new Event("change")
);

setTimeout(()=>{

$("module").value=
lesson.moduleId||"";

},300);

$("lessonId").value=lessonId;

$("title").value=
lesson.title||"";

$("order").value=
lesson.order||1;

$("type").value=
lesson.type||"video";

$("videoDuration").value=
lesson.videoDuration||0;

$("videoUrl").value=
lesson.videoUrl||"";

$("pdfUrl").value=
lesson.pdfUrl||"";

$("resources").value=
(lesson.resources||[]).join(", ");

$("description").value=
lesson.description||"";

$("content").value=
lesson.content||"";

$("published").value=
lesson.isPublished
?"true":"false";

$("preview").value=
lesson.isPreview
?"true":"false";

window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* CLEAR */

window.clearForm=()=>{

editing=null;

$("lessonForm").reset();

$("lessonId").value="";

$("order").value=1;

};


/* DELETE */

window.deleteLesson=async(
courseId,
lessonId
)=>{

if(!confirm(
"Delete this lesson?"
))return;

await deleteDoc(
doc(
db,
"courses",
courseId,
"lessons",
lessonId
)
);

await loadLessons();

};


/* PUBLISH */

window.togglePublish=async(
courseId,
lessonId,
state
)=>{

await updateDoc(
doc(
db,
"courses",
courseId,
"lessons",
lessonId
),
{
isPublished:!state,
updatedAt:serverTimestamp()
}
);

await loadLessons();

};


/* PREVIEW */

window.previewLesson=(
courseId,
lessonId
)=>{

const l=
lessons.find(x=>
x.courseId===courseId &&
x.id===lessonId
);

if(!l)return;

$("previewTitle").textContent=
l.title||"Lesson Preview";

let html="";

if(l.videoUrl){

html+=`
<video
class="video"
controls
src="${clean(l.videoUrl)}">
</video>
`;

}

if(l.pdfUrl){

html+=`
<p>
<a
href="${clean(l.pdfUrl)}"
target="_blank">
📄 Open PDF
</a>
</p>
`;

}

if(l.content){

html+=`
<div>
${clean(l.content)
.replaceAll("\n","<br>")}
</div>
`;

}

if(!html){

html="<p>No lesson content available.</p>";

}

$("previewBody").innerHTML=html;

$("previewModal").style.display="flex";

};


/* CLOSE PREVIEW */

window.closePreview=()=>{

$("previewModal").style.display="none";

};


/* FILTERS */

$("search").oninput=render;

$("filterCourse").onchange=render;

$("filterStatus").onchange=render;


/* START */

await loadCourses();

await loadLessons();

</script>

</body>
</html>
