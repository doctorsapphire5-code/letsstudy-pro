<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Lesson | LetsStudy Pro Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:250px;
  height:100vh;
  background:#111827;
  color:white;
  padding:22px 15px;
  z-index:1000;
  transition:.3s;
}

.brand{
  font-size:22px;
  font-weight:800;
  padding:0 12px 25px;
}

.brand span{
  color:#3b82f6;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  margin:4px 0;
  border-radius:9px;
  color:#d1d5db;
  text-decoration:none;
  font-size:14px;
}

.sidebar a:hover,
.sidebar a.active{
  background:#2563eb;
  color:white;
}

.close-sidebar{
  display:none;
  position:absolute;
  right:15px;
  top:15px;
  cursor:pointer;
}

.main{
  margin-left:250px;
  min-height:100vh;
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
}

.menu-btn{
  display:none;
  font-size:24px;
  cursor:pointer;
}

.content{
  max-width:1000px;
  margin:auto;
  padding:28px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.header h1{
  font-size:28px;
  margin-bottom:6px;
}

.header p{
  color:#6b7280;
}

.back{
  text-decoration:none;
  padding:11px 17px;
  background:white;
  border:1px solid #e5e7eb;
  border-radius:9px;
  color:#374151;
}

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:25px;
  margin-bottom:22px;
}

.card h2{
  font-size:18px;
  margin-bottom:20px;
}

.course-info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  padding:16px;
  border-radius:10px;
  margin-bottom:22px;
}

.course-info strong{
  display:block;
  color:#1d4ed8;
  margin-bottom:5px;
}

.course-info span{
  color:#475569;
  font-size:14px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:600;
  font-size:14px;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #d1d5db;
  border-radius:9px;
  outline:none;
  font-size:14px;
  font-family:Arial,sans-serif;
}

textarea{
  min-height:150px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.full{
  grid-column:1/-1;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:10px;
}

.checkbox input{
  width:auto;
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:12px;
}

.btn{
  border:0;
  padding:13px 22px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
}

.cancel{
  background:#f3f4f6;
  color:#374151;
}

.save{
  background:#2563eb;
  color:white;
}

.save:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:13px;
  border-radius:9px;
  margin-bottom:20px;
  font-size:14px;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:850px){

  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .close-sidebar{
    display:block;
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}

@media(max-width:600px){

  .content{
    padding:18px;
  }

  .header{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
    text-align:center;
  }
}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

  <div class="close-sidebar" onclick="toggleSidebar()">✕</div>

  <div class="brand">
    Lets<span>Study</span> Pro
  </div>

  <a href="admin-dashboard.html">📊 Dashboard</a>
  <a href="admin-students.html">👨‍🎓 Students</a>
  <a href="admin-courses.html" class="active">📚 Courses</a>
  <a href="admin-payments.html">💳 Payments</a>
  <a href="admin-orders.html">🛒 Orders</a>
  <a href="admin-scholarships.html">🎓 Scholarships</a>
  <a href="admin-certificates.html">🏆 Certificates</a>
  <a href="admin-withdrawal.html">💰 Withdrawals</a>
  <a href="admin-settings.html">⚙️ Settings</a>

</aside>


<main class="main">

<header class="topbar">

  <div style="display:flex;align-items:center;gap:15px;">

    <div class="menu-btn" onclick="toggleSidebar()">
      ☰
    </div>

    <strong>Course Management</strong>

  </div>

  <span style="color:#6b7280;font-size:14px;">
    Admin Panel
  </span>

</header>


<section class="content">

  <div class="header">

    <div>
      <h1>Add New Lesson</h1>
      <p>Add a lesson to your course.</p>
    </div>

    <a href="admin-courses.html" class="back">
      ← Courses
    </a>

  </div>


  <div id="message"></div>


  <div class="card">

    <div class="course-info">

      <strong id="courseTitle">
        Loading course...
      </strong>

      <span id="courseIdText"></span>

    </div>


    <form id="lessonForm">

      <div class="grid">

        <div class="form-group">

          <label>Lesson Number *</label>

          <input
            type="number"
            id="lessonNumber"
            min="1"
            placeholder="1"
            required
          >

        </div>


        <div class="form-group">

          <label>Lesson Type *</label>

          <select id="lessonType" required>

            <option value="video">
              Video Lesson
            </option>

            <option value="pdf">
              PDF / Document
            </option>

            <option value="text">
              Text Lesson
            </option>

            <option value="quiz">
              Quiz
            </option>

          </select>

        </div>


        <div class="form-group full">

          <label>Lesson Title *</label>

          <input
            type="text"
            id="title"
            placeholder="e.g. Introduction to HTML"
            required
          >

        </div>


        <div class="form-group full">

          <label>Lesson Description</label>

          <textarea
            id="description"
            placeholder="Describe what students will learn in this lesson..."
          ></textarea>

        </div>


        <div class="form-group full">

          <label>Video URL</label>

          <input
            type="url"
            id="videoUrl"
            placeholder="https://youtube.com/... or video URL"
          >

        </div>


        <div class="form-group full">

          <label>PDF / Document URL</label>

          <input
            type="url"
            id="pdfUrl"
            placeholder="https://..."
          >

        </div>


        <div class="form-group">

          <label>Duration</label>

          <input
            type="text"
            id="duration"
            placeholder="e.g. 15 minutes"
          >

        </div>


        <div class="form-group">

          <label>Content Order</label>

          <input
            type="number"
            id="order"
            min="1"
            placeholder="1"
            required
          >

        </div>


        <div class="form-group full">

          <label>Lesson Content</label>

          <textarea
            id="content"
            style="min-height:220px;"
            placeholder="Write lesson content here..."
          ></textarea>

        </div>


        <div class="form-group full">

          <label class="checkbox">

            <input
              type="checkbox"
              id="freePreview"
            >

            <span>
              Allow students to preview this lesson for free
            </span>

          </label>

        </div>


        <div class="form-group full">

          <label class="checkbox">

            <input
              type="checkbox"
              id="published"
              checked
            >

            <span>
              Publish this lesson immediately
            </span>

          </label>

        </div>

      </div>


      <div class="actions">

        <a
          href="admin-courses.html"
          class="btn cancel"
        >
          Cancel
        </a>

        <button
          type="submit"
          class="btn save"
          id="saveBtn"
        >
          Add Lesson
        </button>

      </div>

    </form>

  </div>

</section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ============================================
   FIREBASE CONFIG
============================================ */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ============================================
   COURSE ID
============================================ */

const params =
  new URLSearchParams(
    window.location.search
  );

const courseId =
  params.get("courseId");


let currentUser = null;


/* ============================================
   CHECK LOGIN
============================================ */
onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);



/* ============================================
   LOAD COURSE
============================================ */

async function loadCourse(){

  try {

    const courseRef =
      doc(
        db,
        "courses",
        courseId
      );

    const snap =
      await getDoc(courseRef);


    if (!snap.exists()) {

      showMessage(
        "Course not found.",
        "error"
      );

      return;
    }


    const data =
      snap.data();


    document.getElementById(
      "courseTitle"
    ).textContent =
      data.title || "Untitled Course";


    document.getElementById(
      "courseIdText"
    ).textContent =
      "Course ID: " + courseId;


  } catch(error){

    console.error(error);

    showMessage(
      "Unable to load course.",
      "error"
    );

  }

}


/* ============================================
   SAVE LESSON
============================================ */

document
  .getElementById("lessonForm")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      if (!courseId) {

        showMessage(
          "Course ID is missing.",
          "error"
        );

        return;
      }


      const saveBtn =
        document.getElementById(
          "saveBtn"
        );


      saveBtn.disabled = true;

      saveBtn.textContent =
        "Adding Lesson...";


      try {

        const lessonData = {

          courseId:

            courseId,

          lessonNumber:

            Number(
              document
                .getElementById(
                  "lessonNumber"
                )
                .value
            ),

          title:

            document
              .getElementById(
                "title"
              )
              .value
              .trim(),

          type:

            document
              .getElementById(
                "lessonType"
              )
              .value,

          description:

            document
              .getElementById(
                "description"
              )
              .value
              .trim(),

          videoUrl:

            document
              .getElementById(
                "videoUrl"
              )
              .value
              .trim(),

          pdfUrl:

            document
              .getElementById(
                "pdfUrl"
              )
              .value
              .trim(),

          duration:

            document
              .getElementById(
                "duration"
              )
              .value
              .trim(),

          order:

            Number(
              document
                .getElementById(
                  "order"
                )
                .value
            ),

          content:

            document
              .getElementById(
                "content"
              )
              .value
              .trim(),

          freePreview:

            document
              .getElementById(
                "freePreview"
              )
              .checked,

          published:

            document
              .getElementById(
                "published"
              )
              .checked,

          createdBy:

            currentUser.uid,

          createdByEmail:

            currentUser.email || "",

          createdAt:

            serverTimestamp(),

          updatedAt:

            serverTimestamp()

        };


        await addDoc(

          collection(
            db,
            "lessons"
          ),

          lessonData

        );


        showMessage(
          "Lesson added successfully!",
          "success"
        );


        document
          .getElementById(
            "lessonForm"
          )
          .reset();


        document
          .getElementById(
            "published"
          )
          .checked = true;


        setTimeout(() => {

          window.location.href =
            "admin-course-lessons.html?courseId=" +
            encodeURIComponent(courseId);

        }, 1000);


      } catch(error){

        console.error(
          "Lesson error:",
          error
        );


        showMessage(
          "Failed to add lesson: " +
          error.message,
          "error"
        );


        saveBtn.disabled = false;

        saveBtn.textContent =
          "Add Lesson";

      }

    }
  );


/* ============================================
   MESSAGE
============================================ */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent = text;

  box.className =
    "message " + type;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ============================================
   SIDEBAR
============================================ */

window.toggleSidebar = function(){

  document
    .getElementById(
      "sidebar"
    )
    .classList
    .toggle("open");

};

</script>

</body>
</html>
