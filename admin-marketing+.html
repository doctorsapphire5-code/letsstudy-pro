<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

button,input,textarea,select{font:inherit}

.container{
 max-width:1200px;
 margin:auto;
 padding:24px
}

.header{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:15px;
 padding:20px;
 margin-bottom:18px
}

.header h1{
 margin:0 0 5px;
 font-size:24px
}

.muted{
 color:#667085;
 font-size:13px
}

.stats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:12px;
 margin-bottom:18px
}

.stat{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:15px
}

.stat span{
 display:block;
 color:#667085;
 font-size:11px
}

.stat strong{
 display:block;
 margin-top:6px;
 font-size:21px
}

.toolbar{
 display:grid;
 grid-template-columns:2fr 1fr 1fr auto;
 gap:10px;
 margin-bottom:18px
}

input,select,textarea{
 width:100%;
 padding:11px;
 border:1px solid #d9dee8;
 border-radius:9px;
 outline:none;
 background:#fff
}

textarea{
 min-height:100px;
 resize:vertical
}

button{
 border:0;
 border-radius:9px;
 padding:10px 14px;
 cursor:pointer;
 font-weight:700
}

.primary{
 background:#155eef;
 color:#fff
}

.light{
 background:#eef2f6;
 color:#344054
}

.danger{
 background:#fee4e2;
 color:#b42318
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 overflow:hidden
}

.cover{
 height:160px;
 background:#e9eef7;
 position:relative
}

.cover img{
 width:100%;
 height:100%;
 object-fit:cover
}

.badge{
 position:absolute;
 top:10px;
 padding:5px 9px;
 border-radius:20px;
 font-size:10px;
 font-weight:700
}

.featured{
 left:10px;
 background:#f59e0b;
 color:#fff
}

.status{
 right:10px
}

.published{
 background:#ecfdf3;
 color:#027a48
}

.draft{
 background:#f2f4f7;
 color:#475467
}

.body{
 padding:15px
}

.type{
 color:#155eef;
 font-size:10px;
 font-weight:800;
 text-transform:uppercase
}

.body h3{
 margin:5px 0;
 font-size:17px
}

.description{
 color:#667085;
 font-size:12px;
 line-height:1.6
}

.meta{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-top:12px
}

.meta div{
 background:#f8fafc;
 padding:8px;
 border-radius:7px;
 font-size:11px
}

.meta b{
 display:block;
 font-size:13px;
 color:#172033
}

.actions{
 display:flex;
 gap:7px;
 margin-top:13px
}

.actions button{
 flex:1;
 font-size:11px
}

.empty{
 grid-column:1/-1;
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:55px;
 text-align:center;
 color:#667085
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:15px
}

.modal.show{
 display:flex
}

.modal-box{
 width:min(850px,100%);
 max-height:92vh;
 overflow:auto;
 background:#fff;
 border-radius:15px;
 padding:20px
}

.close{
 float:right;
 background:#f2f4f7
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.group label{
 display:block;
 font-size:12px;
 font-weight:700;
 margin-bottom:5px
}

.full{
 grid-column:1/-1
}

.save{
 width:100%;
 margin-top:14px
}

@media(max-width:900px){

 .stats{
  grid-template-columns:repeat(2,1fr)
 }

 .grid{
  grid-template-columns:repeat(2,1fr)
 }

 .toolbar{
  grid-template-columns:1fr 1fr
 }

}

@media(max-width:600px){

 .container{
  padding:15px
 }

 .stats,
 .grid,
 .toolbar,
 .form-grid{
  grid-template-columns:1fr
 }

 .full{
  grid-column:auto
 }

}
</style>
</head>

<body>

<main class="container">

<!-- HEADER -->

<section class="header">

<h1>
<i class="fa-solid fa-bullhorn"></i>
Marketing Management
</h1>

<p class="muted">
Create and manage campaigns, promotions and
marketing content across the LetsStudy Pro ecosystem.
</p>

</section>


<!-- STATS -->

<section class="stats">

<div class="stat">
<span>Campaigns</span>
<strong id="total">0</strong>
</div>

<div class="stat">
<span>Active</span>
<strong id="active">0</strong>
</div>

<div class="stat">
<span>Impressions</span>
<strong id="impressions">0</strong>
</div>

<div class="stat">
<span>Clicks</span>
<strong id="clicks">0</strong>
</div>

<div class="stat">
<span>Conversions</span>
<strong id="conversions">0</strong>
</div>

</section>


<!-- TOOLBAR -->

<section class="toolbar">

<input
 id="search"
 placeholder="Search campaigns..."
>

<select id="statusFilter">

<option value="">
All Status
</option>

<option value="published">
Published
</option>

<option value="draft">
Draft
</option>

<option value="ended">
Ended
</option>

</select>


<select id="typeFilter">

<option value="">
All Types
</option>

</select>


<button
 id="addBtn"
 class="primary">

<i class="fa fa-plus"></i>
Create Campaign

</button>

</section>


<!-- CAMPAIGNS -->

<section
 id="campaigns"
 class="grid">

<div class="empty">
Loading campaigns...
</div>

</section>

</main>


<!-- MODAL -->

<div
 id="modal"
 class="modal">

<div class="modal-box">

<button
 id="close"
 class="close">

<i class="fa fa-xmark"></i>

</button>

<h2 id="modalTitle">
Create Campaign
</h2>


<form id="campaignForm">

<div class="form-grid">


<div class="group">

<label>
Campaign Title
</label>

<input
 id="title"
 required>

</div>


<div class="group">

<label>
Campaign Type
</label>

<select id="type" required>

<option value="">
Select Type
</option>

<option value="course">
Course Promotion
</option>

<option value="marketplace">
Marketplace
</option>

<option value="scholarship">
Scholarship
</option>

<option value="career">
Career
</option>

<option value="business">
Business
</option>

<option value="community">
Community
</option>

<option value="general">
General Promotion
</option>

</select>

</div>


<div class="group">

<label>
Audience
</label>

<select id="audience">

<option value="all">
Everyone
</option>

<option value="students">
Students
</option>

<option value="professionals">
Professionals
</option>

<option value="businesses">
Businesses
</option>

<option value="jobseekers">
Job Seekers
</option>

<option value="creators">
Creators
</option>

</select>

</div>


<div class="group">

<label>
Status
</label>

<select id="status">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

<option value="ended">
Ended
</option>

</select>

</div>


<div class="group">

<label>
Start Date
</label>

<input
 id="startDate"
 type="datetime-local">

</div>


<div class="group">

<label>
End Date
</label>

<input
 id="endDate"
 type="datetime-local">

</div>


<div class="group">

<label>
Budget
</label>

<input
 id="budget"
 type="number"
 min="0"
 value="0">

</div>


<div class="group">

<label>
Currency
</label>

<input
 id="currency"
 value="TZS">

</div>


<div class="group full">

<label>
Image / Banner URL
</label>

<input
 id="imageUrl"
 placeholder="https://...">

</div>


<div class="group full">

<label>
Target URL
</label>

<input
 id="targetUrl"
 placeholder="course.html?id=...">

</div>


<div class="group full">

<label>
Description
</label>

<textarea
 id="description">
</textarea>

</div>


<div class="group">

<label>
Featured
</label>

<select id="featured">

<option value="false">
No
</option>

<option value="true">
Yes
</option>

</select>

</div>


<div class="group">

<label>
Coupon Code
</label>

<input
 id="coupon"
 placeholder="Optional">

</div>

</div>


<button
 class="primary save">

<i class="fa fa-save"></i>

Save Campaign

</button>

</form>

</div>

</div>


<script type="module">

/* =====================================
 FIREBASE
===================================== */

import {
 initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

 measurementId:
 "G-85B7V5H5J0"

};


const app =
 initializeApp(firebaseConfig);

const db =
 getFirestore(app);


/* =====================================
 STATE
===================================== */

let campaigns=[];
let editingId=null;


/* =====================================
 DOM
===================================== */

const modal=
 document.getElementById("modal");

const form=
 document.getElementById(
  "campaignForm"
);

const list=
 document.getElementById(
  "campaigns"
);


/* =====================================
 ESCAPE
===================================== */

function esc(value=""){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =====================================
 LOAD
===================================== */

async function loadCampaigns(){

 try{

  const snap=
   await getDocs(
    collection(
     db,
     "marketingCampaigns"
    )
   );


  campaigns=[];


  snap.forEach(item=>{

   campaigns.push({

    id:item.id,

    ...item.data()

   });

  });


  updateStats();

  buildTypes();

  render();

 }catch(error){

  console.error(error);

  list.innerHTML=`

   <div class="empty">

    <i class="fa fa-triangle-exclamation"></i>

    <p>
     Unable to load campaigns.
    </p>

   </div>

  `;

 }

}


/* =====================================
 STATS
===================================== */

function updateStats(){

 document.getElementById(
  "total"
 ).textContent=
  campaigns.length;


 document.getElementById(
  "active"
 ).textContent=

  campaigns.filter(
   c=>c.status==="published"
  ).length;


 const impressions=

  campaigns.reduce(
   (sum,c)=>
    sum+
    Number(
     c.impressions||0
    ),
   0
  );


 const clicks=

  campaigns.reduce(
   (sum,c)=>
    sum+
    Number(
     c.clicks||0
    ),
   0
  );


 const conversions=

  campaigns.reduce(
   (sum,c)=>
    sum+
    Number(
     c.conversions||0
    ),
   0
  );


 document.getElementById(
  "impressions"
 ).textContent=
  impressions.toLocaleString();


 document.getElementById(
  "clicks"
 ).textContent=
  clicks.toLocaleString();


 document.getElementById(
  "conversions"
 ).textContent=
  conversions.toLocaleString();

}


/* =====================================
 TYPES
===================================== */

function buildTypes(){

 const types=

  [...new Set(

   campaigns
    .map(c=>c.type)
    .filter(Boolean)

  )].sort();


 document.getElementById(
  "typeFilter"
 ).innerHTML=

 `<option value="">
  All Types
 </option>`

 +

 types.map(
  type=>`

   <option value="${esc(type)}">
    ${esc(type)}
   </option>

  `
 ).join("");

}


/* =====================================
 RENDER
===================================== */

function render(){

 const keyword=

  document.getElementById(
   "search"
  ).value
   .toLowerCase()
   .trim();


 const status=

  document.getElementById(
   "statusFilter"
  ).value;


 const type=

  document.getElementById(
   "typeFilter"
  ).value;


 const data=

  campaigns.filter(c=>{

   const text=`

    ${c.title||""}
    ${c.description||""}
    ${c.type||""}
    ${c.audience||""}

   `.toLowerCase();


   return(

    text.includes(keyword)

    &&

    (!status ||
     c.status===status)

    &&

    (!type ||
     c.type===type)

   );

  });


 if(!data.length){

  list.innerHTML=`

   <div class="empty">

    <i class="fa fa-bullhorn"></i>

    <h3>
     No campaigns found
    </h3>

    <p>
     Create your first marketing campaign.
    </p>

   </div>

  `;

  return;

 }


 data.sort(

  (a,b)=>

   Number(
    b.featured||false
   )

   -

   Number(
    a.featured||false
   )

 );


 list.innerHTML=

  data.map(createCard).join("");

}


/* =====================================
 CARD
===================================== */

function createCard(c){

 return `

 <article class="card">

  <div class="cover">

   <img
    src="${esc(
     c.imageUrl||
     "https://via.placeholder.com/700x400?text=Marketing"
    )}"
    alt="${esc(c.title||"Campaign")}"
   >


   ${
    c.featured
    ?
    `<span class="badge featured">
      ★ Featured
     </span>`
    :
    ""
   }


   <span
    class="badge status ${
     c.status==="published"
      ?"published"
      :"draft"
   }">

    ${esc(
     c.status||"draft"
    )}

   </span>

  </div>


  <div class="body">

   <div class="type">

    ${esc(
     c.type||"general"
    )}

   </div>


   <h3>

    ${esc(
     c.title||
     "Untitled Campaign"
    )}

   </h3>


   <p class="description">

    ${esc(
     c.description||
     "Marketing campaign"
    )}

   </p>


   <div class="meta">

    <div>

     Audience

     <b>
      ${esc(
       c.audience||"all"
      )}
     </b>

    </div>


    <div>

     Budget

     <b>

      ${esc(
       c.currency||"TZS"
      )}

      ${Number(
       c.budget||0
      ).toLocaleString()}

     </b>

    </div>


    <div>

     Impressions

     <b>
      ${Number(
       c.impressions||0
      ).toLocaleString()}
     </b>

    </div>


    <div>

     Clicks

     <b>
      ${Number(
       c.clicks||0
      ).toLocaleString()}
     </b>

    </div>


    <div>

     Conversions

     <b>
      ${Number(
       c.conversions||0
      ).toLocaleString()}
     </b>

    </div>


    <div>

     CTR

     <b>

      ${
       Number(c.impressions||0)>0

       ?

       (
        Number(c.clicks||0) /
        Number(c.impressions) *
        100
       ).toFixed(1)

       :

       "0.0"

      }%

     </b>

    </div>

   </div>


   <div class="actions">

    <button
     class="light"
     onclick="editCampaign('${c.id}')">

     <i class="fa fa-edit"></i>

     Edit

    </button>


    <button
     class="primary"
     onclick="toggleStatus('${c.id}')">

     <i class="fa fa-toggle-on"></i>

    </button>


    <button
     class="danger"
     onclick="removeCampaign('${c.id}')">

     <i class="fa fa-trash"></i>

    </button>

   </div>

  </div>

 </article>

 `;

}


/* =====================================
 SEARCH
===================================== */

document
 .getElementById("search")
 .addEventListener(
  "input",
  render
);


document
 .getElementById("statusFilter")
 .addEventListener(
  "change",
  render
);


document
 .getElementById("typeFilter")
 .addEventListener(
  "change",
  render
);


/* =====================================
 OPEN ADD
===================================== */

document
 .getElementById("addBtn")
 .onclick=()=>{

  editingId=null;

  form.reset();

  document.getElementById(
   "currency"
  ).value="TZS";

  document.getElementById(
   "status"
  ).value="draft";

  document.getElementById(
   "audience"
  ).value="all";

  document.getElementById(
   "featured"
  ).value="false";


  document.getElementById(
   "modalTitle"
  ).textContent=
   "Create Campaign";


  modal.classList.add(
   "show"
  );

 };


/* =====================================
 CLOSE
===================================== */

document
 .getElementById("close")
 .onclick=()=>{

  modal.classList.remove(
   "show"
  );

 };


/* =====================================
 SAVE
===================================== */

form.onsubmit=
 async event=>{

  event.preventDefault();


  const status=

   document.getElementById(
    "status"
   ).value;


  const data={

   title:
    document.getElementById(
     "title"
    ).value.trim(),

   type:
    document.getElementById(
     "type"
    ).value,

   audience:
    document.getElementById(
     "audience"
    ).value,

   status:status,

   startDate:
    document.getElementById(
     "startDate"
    ).value,

   endDate:
    document.getElementById(
     "endDate"
    ).value,

   budget:
    Number(
     document.getElementById(
      "budget"
     ).value||0
    ),

   currency:
    document.getElementById(
     "currency"
    ).value.trim()||"TZS",

   imageUrl:
    document.getElementById(
     "imageUrl"
    ).value.trim(),

   targetUrl:
    document.getElementById(
     "targetUrl"
    ).value.trim(),

   description:
    document.getElementById(
     "description"
    ).value.trim(),

   featured:
    document.getElementById(
     "featured"
    ).value==="true",

   coupon:
    document.getElementById(
     "coupon"
    ).value.trim(),

   updatedAt:
    serverTimestamp()

  };


  try{

   if(editingId){

    await updateDoc(

     doc(
      db,
      "marketingCampaigns",
      editingId
     ),

     data

    );

   }else{

    data.impressions=0;
    data.clicks=0;
    data.conversions=0;
    data.createdAt=
     serverTimestamp();

    await addDoc(

     collection(
      db,
      "marketingCampaigns"
     ),

     data

    );

   }


   modal.classList.remove(
    "show"
   );


   await loadCampaigns();


  }catch(error){

   console.error(error);

   alert(
    "Unable to save campaign."
   );

  }

};


/* =====================================
 EDIT
===================================== */

window.editCampaign=
 id=>{

  const c=
   campaigns.find(
    item=>item.id===id
   );


  if(!c)return;


  editingId=id;


  const fields=[

   "title",
   "type",
   "audience",
   "status",
   "startDate",
   "endDate",
   "budget",
   "currency",
   "imageUrl",
   "targetUrl",
   "description",
   "coupon"

  ];


  fields.forEach(key=>{

   const el=
    document.getElementById(
     key
    );


   if(el){

    el.value=
     c[key]??"";

   }

  });


  document.getElementById(
   "featured"
  ).value=

   c.featured
    ?"true"
    :"false";


  document.getElementById(
   "modalTitle"
  ).textContent=
   "Edit Campaign";


  modal.classList.add(
   "show"
  );

};


/* =====================================
 TOGGLE STATUS
===================================== */

window.toggleStatus=
 async id=>{

  const c=
   campaigns.find(
    item=>item.id===id
   );


  if(!c)return;


  const status=

   c.status==="published"
    ?"draft"
    :"published";


  try{

   await updateDoc(

    doc(
     db,
     "marketingCampaigns",
     id
    ),

    {

     status:status,

     updatedAt:
      serverTimestamp()

    }

   );


   await loadCampaigns();


  }catch(error){

   console.error(error);

   alert(
    "Unable to update campaign."
   );

  }

};


/* =====================================
 DELETE
===================================== */

window.removeCampaign=
 async id=>{

  if(
   !confirm(
    "Delete this campaign permanently?"
   )
  )return;


  try{

   await deleteDoc(

    doc(
     db,
     "marketingCampaigns",
     id
    )

   );


   await loadCampaigns();


  }catch(error){

   console.error(error);

   alert(
    "Unable to delete campaign."
   );

  }

};


/* =====================================
 START
===================================== */

loadCampaigns();

</script>

</body>
</html>
