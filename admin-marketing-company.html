<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Marketing | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

button,input,select,textarea{
 font:inherit
}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 5%;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:800
}

.top a{
 text-decoration:none;
 color:#475467;
 font-size:13px;
 font-weight:700
}

.container{
 max-width:1200px;
 margin:25px auto;
 padding:0 20px
}

.title{
 margin-bottom:20px
}

.title h1{
 margin:0 0 7px;
 font-size:28px
}

.title p{
 margin:0;
 color:#667085;
 font-size:13px
}

.layout{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:20px
}

.panel{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:15px;
 padding:20px
}

.panel h2{
 margin:0 0 18px;
 font-size:18px
}

.form-group{
 margin-bottom:14px
}

label{
 display:block;
 margin-bottom:6px;
 font-size:12px;
 font-weight:800
}

input,
select,
textarea{
 width:100%;
 border:1px solid #d9dee8;
 border-radius:9px;
 padding:11px;
 outline:none;
 background:#fff
}

textarea{
 min-height:110px;
 resize:vertical
}

input:focus,
select:focus,
textarea:focus{
 border-color:#155eef
}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.checkbox{
 display:flex;
 align-items:center;
 gap:8px;
 margin:12px 0
}

.checkbox input{
 width:auto
}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:18px
}

.btn{
 border:0;
 border-radius:8px;
 padding:10px 15px;
 cursor:pointer;
 font-size:12px;
 font-weight:800
}

.primary{
 background:#155eef;
 color:#fff
}

.success{
 background:#12b76a;
 color:#fff
}

.warning{
 background:#f79009;
 color:#fff
}

.danger{
 background:#d92d20;
 color:#fff
}

.light{
 background:#eef2f6;
 color:#344054
}

.preview{
 border:1px solid #e5e7eb;
 border-radius:14px;
 overflow:hidden
}

.preview-image{
 height:210px;
 background:#eef2f6
}

.preview-image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.preview-body{
 padding:18px
}

.badge{
 display:inline-block;
 background:#fff3cd;
 color:#9a6700;
 padding:5px 9px;
 border-radius:20px;
 font-size:10px;
 font-weight:800
}

.type{
 margin-top:10px;
 color:#155eef;
 font-size:10px;
 font-weight:800;
 text-transform:uppercase
}

.preview h3{
 margin:7px 0;
 font-size:19px
}

.preview p{
 color:#667085;
 line-height:1.6;
 font-size:12px
}

.tag{
 display:inline-block;
 background:#f2f4f7;
 padding:6px 9px;
 border-radius:20px;
 margin:3px;
 font-size:10px
}

.list{
 margin-top:20px
}

.item{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:14px;
 margin-bottom:10px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px
}

.item-info{
 min-width:0
}

.item-info h3{
 margin:0 0 5px;
 font-size:14px
}

.item-info p{
 margin:0;
 color:#667085;
 font-size:11px
}

.status{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:9px;
 font-weight:800
}

.published{
 background:#ecfdf3;
 color:#027a48
}

.draft{
 background:#f2f4f7;
 color:#475467
}

.item-actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap
}

.small{
 padding:7px 9px;
 font-size:10px
}

.empty{
 padding:35px;
 text-align:center;
 color:#667085;
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:12px
}

.message{
 margin-bottom:15px;
 padding:11px;
 border-radius:8px;
 font-size:12px;
 display:none
}

.message.ok{
 display:block;
 background:#ecfdf3;
 color:#027a48
}

.message.error{
 display:block;
 background:#fef3f2;
 color:#b42318
}

@media(max-width:800px){

 .layout{
  grid-template-columns:1fr
 }

}

@media(max-width:500px){

 .grid2{
  grid-template-columns:1fr
 }

 .item{
  align-items:flex-start;
  flex-direction:column
 }

 .item-actions{
  width:100%
 }

}
</style>
</head>

<body>

<header class="top">

<a class="logo" href="index.html">
LetsStudy Pro
</a>

<a href="marketing.html">
<i class="fa fa-arrow-left"></i>
 View Marketing
</a>

</header>


<main class="container">

<div class="title">

<h1>
Marketing Management
</h1>

<p>
Create, edit, preview and publish promotional campaigns.
</p>

</div>


<div id="message" class="message"></div>


<div class="layout">


<!-- FORM -->

<section class="panel">

<h2>
<i class="fa fa-bullhorn"></i>
 Campaign
</h2>

<form id="form">


<div class="form-group">

<label>
Title
</label>

<input
id="title"
required
placeholder="e.g. 50% Off Web Development Course">

</div>


<div class="grid2">

<div class="form-group">

<label>
Type
</label>

<select id="type">

<option value="Promotion">
Promotion
</option>

<option value="Course">
Course
</option>

<option value="Marketplace">
Marketplace
</option>

<option value="Scholarship">
Scholarship
</option>

<option value="Career">
Career
</option>

<option value="Service">
Service
</option>

<option value="Announcement">
Announcement
</option>

</select>

</div>


<div class="form-group">

<label>
Audience
</label>

<input
id="audience"
placeholder="Students, Everyone...">

</div>

</div>


<div class="form-group">

<label>
Short Description
</label>

<input
id="shortDescription"
placeholder="Short promotional message">

</div>


<div class="form-group">

<label>
Description
</label>

<textarea
id="description"
placeholder="Full campaign description"></textarea>

</div>


<div class="grid2">

<div class="form-group">

<label>
Image URL
</label>

<input
id="imageUrl"
placeholder="https://...">

</div>


<div class="form-group">

<label>
Target URL
</label>

<input
id="targetUrl"
placeholder="course.html?id=COURSE_ID">

</div>

</div>


<div class="grid2">

<div class="form-group">

<label>
Coupon
</label>

<input
id="coupon"
placeholder="WELCOME20">

</div>


<div class="form-group">

<label>
Status
</label>

<select id="status">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>

</div>

</div>


<div class="grid2">

<div class="form-group">

<label>
Start Date
</label>

<input
type="date"
id="startDate">

</div>


<div class="form-group">

<label>
End Date
</label>

<input
type="date"
id="endDate">

</div>

</div>


<div class="checkbox">

<input
type="checkbox"
id="featured">

<label
for="featured">
Featured Campaign
</label>

</div>


<div class="actions">

<button
type="submit"
class="btn primary">

<i class="fa fa-save"></i>
Save Campaign

</button>


<button
type="button"
id="reset"
class="btn light">

<i class="fa fa-plus"></i>
New

</button>

</div>


</form>

</section>


<!-- PREVIEW -->

<section class="panel">

<h2>
<i class="fa fa-eye"></i>
 Live Preview
</h2>


<div class="preview">

<div class="preview-image">

<img
id="previewImage"
src="https://via.placeholder.com/800x500?text=Promotion"
alt="Preview">

</div>


<div class="preview-body">

<span
id="previewBadge"
class="badge"
style="display:none">

★ Featured

</span>


<div
id="previewType"
class="type">

PROMOTION

</div>


<h3 id="previewTitle">
Campaign Title
</h3>


<p id="previewDescription">
Your campaign description will appear here.
</p>


<div>

<span
id="previewAudience"
class="tag">

Everyone

</span>


<span
id="previewCoupon"
class="tag"
style="display:none">

Coupon

</span>

</div>


<div class="actions">

<button
type="button"
id="previewLink"
class="btn primary">

Explore Now
<i class="fa fa-arrow-right"></i>

</button>

</div>

</div>

</div>

</section>

</div>


<!-- CAMPAIGNS -->

<section class="list">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px">

<h2 style="margin:0;font-size:19px">
Campaigns
</h2>

<span
id="count"
style="font-size:11px;color:#667085">

Loading...

</span>

</div>


<div id="campaignList">

<div class="empty">

<i class="fa fa-spinner fa-spin"></i>

<p>
Loading campaigns...
</p>

</div>

</div>

</section>


</main>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 getDoc,
 doc,
 updateDoc,
 deleteDoc,
 serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
 FIREBASE
========================= */

const firebaseConfig={

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsYrgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

 measurementId:
 "G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =========================
 STATE
========================= */

let editId=null;

let campaigns=[];


/* =========================
 DOM
========================= */

const form=
document.getElementById("form");

const message=
document.getElementById("message");

const campaignList=
document.getElementById("campaignList");

const count=
document.getElementById("count");


/* =========================
 ESCAPE
========================= */

function esc(value=""){

 return String(value)

 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* =========================
 MESSAGE
========================= */

function showMessage(text,type="ok"){

 message.textContent=text;

 message.className=
 "message "+type;

 setTimeout(()=>{

  message.className="message";

 },3000);

}


/* =========================
 FORM DATA
========================= */

function getFormData(){

 return{

  title:
   document.getElementById("title").value.trim(),

  type:
   document.getElementById("type").value,

  audience:
   document.getElementById("audience").value.trim(),

  shortDescription:
   document.getElementById("shortDescription").value.trim(),

  description:
   document.getElementById("description").value.trim(),

  imageUrl:
   document.getElementById("imageUrl").value.trim(),

  targetUrl:
   document.getElementById("targetUrl").value.trim(),

  coupon:
   document.getElementById("coupon").value.trim(),

  status:
   document.getElementById("status").value,

  startDate:
   document.getElementById("startDate").value,

  endDate:
   document.getElementById("endDate").value,

  featured:
   document.getElementById("featured").checked

 };

}


/* =========================
 SAVE
========================= */

form.addEventListener(
 "submit",
 async e=>{

  e.preventDefault();


  const data=
   getFormData();


  if(!data.title){

   showMessage(
    "Campaign title is required.",
    "error"
   );

   return;

  }


  try{

   if(editId){

    await updateDoc(

     doc(
      db,
      "marketingCampaigns",
      editId
     ),

     {

      ...data,

      updatedAt:
       serverTimestamp()

     }

    );


    showMessage(
     "Campaign updated successfully."
    );


   }else{

    await addDoc(

     collection(
      db,
      "marketingCampaigns"
     ),

     {

      ...data,

      impressions:0,

      clicks:0,

      createdAt:
       serverTimestamp(),

      updatedAt:
       serverTimestamp(),

      publishedAt:
       data.status==="published"
        ?
        serverTimestamp()
        :
        null

     }

    );


    showMessage(
     "Campaign created successfully."
    );

   }


   resetForm();

   loadCampaigns();


  }catch(error){

   console.error(error);

   showMessage(
    "Failed to save campaign.",
    "error"
   );

  }

 });


/* =========================
 LOAD
========================= */

async function loadCampaigns(){

 try{

  const snap=
   await getDocs(
    collection(
     db,
     "marketingCampaigns"
    )
   );


  campaigns=
   snap.docs.map(
    d=>({
     id:d.id,
     ...d.data()
    })
   );


  campaigns.sort(
   (a,b)=>
    Number(b.featured||false)
    -
    Number(a.featured||false)
  );


  count.textContent=
   `${campaigns.length} campaign${
    campaigns.length===1?"":"s"
   }`;


  renderList();


 }catch(error){

  console.error(error);

  campaignList.innerHTML=`

   <div class="empty">

    Unable to load campaigns.

   </div>

  `;

 }

}


/* =========================
 LIST
========================= */

function renderList(){

 if(!campaigns.length){

  campaignList.innerHTML=`

   <div class="empty">

    <i class="fa fa-bullhorn"></i>

    <p>
     No campaigns created yet.
    </p>

   </div>

  `;

  return;

 }


 campaignList.innerHTML=
 campaigns.map(c=>`

 <div class="item">


  <div class="item-info">

   <h3>

    ${esc(
     c.title||
     "Untitled Campaign"
    )}

    ${
     c.featured
      ?
      `<span class="status"
       style="background:#fff3cd;color:#9a6700">
       Featured
       </span>`
      :
      ""
    }

   </h3>


   <p>

    ${esc(
     c.type||
     "Promotion"
    )}

    ·

    ${esc(
     c.audience||
     "Everyone"
    )}

    ·

    <span class="status ${
     c.status==="published"
      ?"published"
      :"draft"
    }">

     ${esc(
      c.status||
      "draft"
     )}

    </span>

   </p>

  </div>


  <div class="item-actions">


   <button
    class="btn light small"
    onclick="previewCampaign('${c.id}')">

    <i class="fa fa-eye"></i>

    Preview

   </button>


   <button
    class="btn primary small"
    onclick="editCampaign('${c.id}')">

    <i class="fa fa-pen"></i>

    Edit

   </button>


   <button
    class="btn warning small"
    onclick="toggleStatus('${c.id}')">

    <i class="fa fa-power-off"></i>

    ${
     c.status==="published"
      ?"Unpublish"
      :"Publish"
    }

   </button>


   <button
    class="btn danger small"
    onclick="removeCampaign('${c.id}')">

    <i class="fa fa-trash"></i>

    Delete

   </button>


  </div>

 </div>

 `).join("");

}


/* =========================
 EDIT
========================= */

window.editCampaign=
async function(id){

 const snap=
  await getDoc(
   doc(
    db,
    "marketingCampaigns",
    id
   )
  );


 if(!snap.exists()){

  showMessage(
   "Campaign not found.",
   "error"
  );

  return;

 }


 const c=snap.data();

 editId=id;


 document.getElementById("title").value=
  c.title||"";

 document.getElementById("type").value=
  c.type||"Promotion";

 document.getElementById("audience").value=
  c.audience||"";

 document.getElementById("shortDescription").value=
  c.shortDescription||"";

 document.getElementById("description").value=
  c.description||"";

 document.getElementById("imageUrl").value=
  c.imageUrl||"";

 document.getElementById("targetUrl").value=
  c.targetUrl||"";

 document.getElementById("coupon").value=
  c.coupon||"";

 document.getElementById("status").value=
  c.status||"draft";

 document.getElementById("startDate").value=
  c.startDate||"";

 document.getElementById("endDate").value=
  c.endDate||"";

 document.getElementById("featured").checked=
  Boolean(c.featured);


 updatePreview();

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

};


/* =========================
 TOGGLE STATUS
========================= */

window.toggleStatus=
async function(id){

 const c=
  campaigns.find(
   x=>x.id===id
  );


 if(!c)return;


 const newStatus=
  c.status==="published"
   ?
   "draft"
   :
   "published";


 try{

  await updateDoc(

   doc(
    db,
    "marketingCampaigns",
    id
   ),

   {

    status:newStatus,

    updatedAt:
     serverTimestamp(),

    publishedAt:
     newStatus==="published"
      ?
      serverTimestamp()
      :
      null

   }

  );


  showMessage(
   newStatus==="published"
    ?
    "Campaign published."
    :
    "Campaign unpublished."
  );


  loadCampaigns();


 }catch(error){

  console.error(error);

  showMessage(
   "Unable to change campaign status.",
   "error"
  );

 }

};


/* =========================
 DELETE
========================= */

window.removeCampaign=
async function(id){

 const ok=
  confirm(
   "Delete this campaign?"
  );


 if(!ok)return;


 try{

  await deleteDoc(

   doc(
    db,
    "marketingCampaigns",
    id
   )

  );


  showMessage(
   "Campaign deleted."
  );


  loadCampaigns();


 }catch(error){

  console.error(error);

  showMessage(
   "Unable to delete campaign.",
   "error"
  );

 }

};


/* =========================
 PREVIEW
========================= */

window.previewCampaign=
async function(id){

 const snap=
  await getDoc(
   doc(
    db,
    "marketingCampaigns",
    id
   )
  );


 if(!snap.exists())return;


 const c=snap.data();


 editId=id;


 document.getElementById("title").value=
  c.title||"";

 document.getElementById("type").value=
  c.type||"Promotion";

 document.getElementById("audience").value=
  c.audience||"";

 document.getElementById("shortDescription").value=
  c.shortDescription||"";

 document.getElementById("description").value=
  c.description||"";

 document.getElementById("imageUrl").value=
  c.imageUrl||"";

 document.getElementById("targetUrl").value=
  c.targetUrl||"";

 document.getElementById("coupon").value=
  c.coupon||"";

 document.getElementById("status").value=
  c.status||"draft";

 document.getElementById("startDate").value=
  c.startDate||"";

 document.getElementById("endDate").value=
  c.endDate||"";

 document.getElementById("featured").checked=
  Boolean(c.featured);


 updatePreview();


 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

};


/* =========================
 RESET
========================= */

function resetForm(){

 editId=null;

 form.reset();

 document.getElementById("status").value=
  "draft";

 updatePreview();

}


document
.getElementById("reset")
.addEventListener(
 "click",
 resetForm
);


/* =========================
 LIVE PREVIEW
========================= */

function updatePreview(){

 const data=
  getFormData();


 document.getElementById(
  "previewTitle"
 ).textContent=
  data.title||
  "Campaign Title";


 document.getElementById(
  "previewType"
 ).textContent=
  data.type||
  "PROMOTION";


 document.getElementById(
  "previewDescription"
 ).textContent=
  data.description||
  data.shortDescription||
  "Your campaign description will appear here.";


 document.getElementById(
  "previewAudience"
 ).textContent=
  data.audience||
  "Everyone";


 const coupon=
  document.getElementById(
   "previewCoupon"
  );


 if(data.coupon){

  coupon.style.display=
   "inline-block";

  coupon.textContent=
   "Coupon: "+data.coupon;

 }else{

  coupon.style.display=
   "none";

 }


 const badge=
  document.getElementById(
   "previewBadge"
  );


 badge.style.display=
  data.featured
   ?
   "inline-block"
   :
   "none";


 const image=
  document.getElementById(
   "previewImage"
  );


 image.src=
  data.imageUrl||
  "https://via.placeholder.com/800x500?text=Promotion";


 document.getElementById(
  "previewLink"
 ).onclick=()=>{

  if(data.targetUrl){

   window.open(
    data.targetUrl,
    "_blank"
   );

  }else{

   alert(
    "Target URL is missing."
   );

  }

 };

}


/* =========================
 LIVE EVENTS
========================= */

document
.querySelectorAll(
 "#form input,#form textarea,#form select"
)
.forEach(el=>{

 el.addEventListener(
  "input",
  updatePreview
 );

 el.addEventListener(
  "change",
  updatePreview
 );

});


/* =========================
 START
========================= */

updatePreview();

loadCampaigns();

</script>

</body>
</html>
