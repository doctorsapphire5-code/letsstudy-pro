<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Marketing | LetsStudy Pro</title>

<meta name="description"
content="LetsStudy Pro Marketplace Marketing Management">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  background:#111827;
  color:#fff;
  padding:16px 20px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.back-btn{
  color:#fff;
  text-decoration:none;
  background:#374151;
  padding:9px 13px;
  border-radius:8px;
  font-size:13px;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:25px 20px 60px;
}

.page-title{
  margin-bottom:25px;
}

.page-title h1{
  margin:0 0 7px;
  font-size:28px;
}

.page-title p{
  margin:0;
  color:#6b7280;
}


/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  padding:20px;
  border-radius:13px;
  border:1px solid #e5e7eb;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.stat-label{
  color:#6b7280;
  font-size:13px;
  margin-bottom:8px;
}

.stat-value{
  font-size:28px;
  font-weight:800;
}


/* ================= PANEL ================= */

.panel{
  background:#fff;
  border-radius:15px;
  padding:25px;
  border:1px solid #e5e7eb;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
  margin-bottom:25px;
}

.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.panel-title h2{
  margin:0;
  font-size:20px;
}


/* ================= FORM ================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:17px;
}

.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  background:#fff;
  color:#172033;
}

.field textarea{
  min-height:120px;
  resize:vertical;
  line-height:1.5;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 2px rgba(37,99,235,.08);
}

.help{
  color:#6b7280;
  font-size:11px;
  margin-top:5px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:22px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:8px;
  padding:11px 17px;
  font-weight:700;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}


/* ================= TOOLBAR ================= */

.toolbar{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.toolbar input,
.toolbar select{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  background:#fff;
}


/* ================= TABLE ================= */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th,
td{
  text-align:left;
  padding:13px 10px;
  border-bottom:1px solid #eef0f4;
  font-size:13px;
  vertical-align:middle;
}

th{
  background:#f9fafb;
  color:#374151;
}

.product-cell{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:240px;
}

.product-thumb{
  width:48px;
  height:48px;
  border-radius:8px;
  object-fit:cover;
  background:#e5e7eb;
}

.product-title{
  font-weight:700;
}

.product-type{
  color:#6b7280;
  font-size:11px;
  margin-top:4px;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
}

.badge-published{
  background:#dcfce7;
  color:#166534;
}

.badge-draft{
  background:#f3f4f6;
  color:#4b5563;
}

.badge-featured{
  background:#fef3c7;
  color:#92400e;
}

.row-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.small-btn{
  border:0;
  border-radius:6px;
  padding:7px 9px;
  font-size:11px;
  font-weight:700;
}

.edit{
  background:#dbeafe;
  color:#1d4ed8;
}

.delete{
  background:#fee2e2;
  color:#b91c1c;
}

.feature{
  background:#fef3c7;
  color:#92400e;
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:#6b7280;
}

.loading{
  text-align:center;
  padding:40px;
  color:#6b7280;
}


/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  max-width:350px;
  padding:13px 16px;
  border-radius:9px;
  color:#fff;
  background:#111827;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  transform:translateY(120px);
  opacity:0;
  transition:.25s;
  z-index:200;
  font-size:13px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#15803d;
}

.toast.error{
  background:#b91c1c;
}


/* ================= RESPONSIVE ================= */

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:650px){

  .container{
    padding:20px 13px 45px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .page-title h1{
    font-size:23px;
  }

}

</style>
</head>

<main class="container">

<!-- =====================================================

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};



const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);



/* =====================================================
   STATE
===================================================== */

let products = [];

let editingId = null;



/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "productForm"
  );


const table =
  document.getElementById(
    "productTable"
  );


const saveBtn =
  document.getElementById(
    "saveBtn"
  );



/* =====================================================
   VALUE HELPER
===================================================== */

function value(id){

  return document
    .getElementById(id)
    .value
    .trim();

}



/* =====================================================
   CREATE SLUG
===================================================== */

function createSlug(title){

  return title
    .toLowerCase()
    .trim()
    .replace(
      /[^a-z0-9\s-]/g,
      ""
    )
    .replace(
      /\s+/g,
      "-"
    )
    .replace(
      /-+/g,
      "-"
    );

}



/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "marketplace"
        )
      );


    products = [];


    snapshot.forEach(
      productDoc => {

        products.push({

          id:
            productDoc.id,

          ...productDoc.data()

        });

      }
    );


    products.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds ||
          0;

        const bTime =
          b.createdAt?.seconds ||
          0;

        return bTime - aTime;

      }
    );


    updateStats();

    populateFilters();

    renderProducts();


  }catch(error){

    console.error(error);


    table.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty">

          Failed to load products.

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </td>

      </tr>

    `;

  }

}



/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

  document.getElementById(
    "totalCount"
  ).textContent =
    products.length;


  document.getElementById(
    "publishedCount"
  ).textContent =

    products.filter(
      product =>
        product.status ===
        "published"
    ).length;


  document.getElementById(
    "draftCount"
  ).textContent =

    products.filter(
      product =>
        product.status ===
        "draft"
    ).length;


  document.getElementById(
    "featuredCount"
  ).textContent =

    products.filter(
      product =>
        product.featured ===
        true
    ).length;

}



/* =====================================================
   POPULATE FILTERS
===================================================== */

function populateFilters(){

  const categoryFilter =
    document.getElementById(
      "categoryFilter"
    );


  const typeFilter =
    document.getElementById(
      "typeFilter"
    );


  const categories = [
    ...new Set(
      products
        .map(
          product =>
            product.category
        )
        .filter(Boolean)
    )
  ].sort();


  const types = [
    ...new Set(
      products
        .map(
          product =>
            product.type
        )
        .filter(Boolean)
    )
  ].sort();


  categoryFilter.innerHTML = `
    <option value="all">
      All Categories
    </option>
  `;


  categories.forEach(
    category => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        category;

      option.textContent =
        category;

      categoryFilter.appendChild(
        option
      );

    }
  );


  typeFilter.innerHTML = `
    <option value="all">
      All Types
    </option>
  `;


  types.forEach(
    type => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        type;

      option.textContent =
        type;

      typeFilter.appendChild(
        option
      );

    }
  );

}



/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById("statusFilter")
      .value;


  const category =
    document
      .getElementById("categoryFilter")
      .value;


  const type =
    document
      .getElementById("typeFilter")
      .value;


  const filtered =
    products.filter(product => {

      const searchable = [

        product.title,

        product.slug,

        product.description,

        product.shortDescription,

        product.category,

        product.type,

        product.currency

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      const matchesSearch =
        !search ||
        searchable.includes(search);


      const matchesStatus =
        status === "all" ||
        product.status === status;


      const matchesCategory =
        category === "all" ||
        product.category === category;


      const matchesType =
        type === "all" ||
        product.type === type;


      return (
        matchesSearch &&
        matchesStatus &&
        matchesCategory &&
        matchesType
      );

    });


  if(!filtered.length){

    table.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty">

          🛒 No marketplace products found.

        </td>

      </tr>

    `;

    return;

  }


  table.innerHTML = "";


  filtered.forEach(product => {

    const row =
      document.createElement("tr");


    const image =
      product.thumbnail ||
      product.imageUrl ||
      "";


    const statusBadge =
      product.status === "published"

        ? `
          <span class="badge badge-published">
            Published
          </span>
        `

        : `
          <span class="badge badge-draft">
            Draft
          </span>
        `;


    const featuredBadge =
      product.featured === true

        ? `
          <span class="badge badge-featured">
            ⭐ Yes
          </span>
        `

        : "No";


    let priceHTML = "-";


    if(
      product.discountPrice !== null &&
      product.discountPrice !== undefined &&
      product.discountPrice !== ""
    ){

      priceHTML = `

        <strong>
          ${formatPrice(
            product.discountPrice,
            product.currency
          )}
        </strong>

        <br>

        <small
          style="
            color:#888;
            text-decoration:line-through;
          ">

          ${formatPrice(
            product.price,
            product.currency
          )}

        </small>

      `;

    }else{

      priceHTML =
        formatPrice(
          product.price,
          product.currency
        );

    }


    row.innerHTML = `

      <td>

        <div class="product-cell">

          ${
            image

              ? `

                <img
                  src="${escapeAttribute(image)}"
                  class="product-thumb"
                  alt="${escapeAttribute(
                    product.title ||
                    "Product"
                  )}"
                  onerror="
                    this.style.display='none'
                  "
                >

              `

              : `

                <div
                  class="product-thumb"
                  style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:22px;
                  ">

                  🛒

                </div>

              `
          }


          <div>

            <div class="product-title">

              ${escapeHtml(
                product.title ||
                "Untitled Product"
              )}

            </div>


            <div class="product-type">

              ${escapeHtml(
                product.slug ||
                ""
              )}

            </div>

          </div>

        </div>

      </td>


      <td>

        ${escapeHtml(
          product.type ||
          "-"
        )}

      </td>


      <td>

        ${escapeHtml(
          product.category ||
          "-"
        )}

      </td>


      <td>

        ${priceHTML}

      </td>


      <td>

        ${statusBadge}

      </td>


      <td>

        ${featuredBadge}

      </td>


      <td>

        ${Number(
          product.salesCount ||
          0
        )}

      </td>


      <td>

        <div class="row-actions">

          <button
            type="button"
            class="small-btn edit"
            data-edit="${product.id}">

            Edit

          </button>


          <button
            type="button"
            class="small-btn feature"
            data-feature="${product.id}">

            ${
              product.featured === true
                ? "Unfeature"
                : "Feature"
            }

          </button>


          <button
            type="button"
            class="small-btn delete"
            data-delete="${product.id}">

            Delete

          </button>

        </div>

      </td>

    `;


    table.appendChild(row);

  });


  attachRowEvents();

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(
  price,
  currency
){

  if(
    price === undefined ||
    price === null ||
    price === ""
  ){

    return "-";

  }


  const number =
    Number(price);


  if(Number.isNaN(number)){

    return escapeHtml(
      String(price)
    );

  }


  return (

    escapeHtml(
      currency || ""
    ) +

    " " +

    number.toLocaleString()

  );

}


/* =====================================================
   ATTACH ROW EVENTS
===================================================== */

function attachRowEvents(){

  document
    .querySelectorAll(
      "[data-edit]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          editProduct(
            button.dataset.edit
          );

        }
      );

    });


  document
    .querySelectorAll(
      "[data-feature]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          toggleFeatured(
            button.dataset.feature
          );

        }
      );

    });


  document
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          deleteProduct(
            button.dataset.delete
          );

        }
      );

    });

}


/* =====================================================
   GET FORM DATA
===================================================== */

function getFormData(){

  const title =
    document
      .getElementById("title")
      .value
      .trim();


  const priceValue =
    document
      .getElementById("price")
      .value
      .trim();


  const discountValue =
    document
      .getElementById("discountPrice")
      .value
      .trim();


  return {

    title,

    slug:
      document
        .getElementById("slug")
        .value
        .trim() ||
      createSlug(title),


    description:
      document
        .getElementById("description")
        .value
        .trim(),


    shortDescription:
      document
        .getElementById("shortDescription")
        .value
        .trim(),


    type:
      document
        .getElementById("type")
        .value,


    category:
      document
        .getElementById("category")
        .value
        .trim(),


    price:
      priceValue === ""
        ? 0
        : Number(priceValue),


    currency:
      document
        .getElementById("currency")
        .value,


    discountPrice:
      discountValue === ""
        ? null
        : Number(discountValue),


    thumbnail:
      document
        .getElementById("thumbnail")
        .value
        .trim(),


    imageUrl:
      document
        .getElementById("imageUrl")
        .value
        .trim(),


    productUrl:
      document
        .getElementById("productUrl")
        .value
        .trim(),


    courseId:
      document
        .getElementById("courseId")
        .value
        .trim(),


    status:
      document
        .getElementById("status")
        .value,


    featured:
      document
        .getElementById("featured")
        .value === "true"

  };

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    saveBtn.disabled = true;


    saveBtn.textContent =
      editingId
        ? "Updating..."
        : "Saving...";


    try{

      const data =
        getFormData();


      if(!data.title){

        throw new Error(
          "Product title is required."
        );

      }


      if(!data.description){

        throw new Error(
          "Product description is required."
        );

      }


      if(Number.isNaN(data.price)){

        throw new Error(
          "Invalid price."
        );

      }


      if(
        data.discountPrice !== null &&
        Number.isNaN(
          data.discountPrice
        )
      ){

        throw new Error(
          "Invalid discount price."
        );

      }


      if(
        data.discountPrice !== null &&
        data.discountPrice > data.price
      ){

        throw new Error(
          "Discount price cannot be greater than original price."
        );

      }


      if(editingId){

        const oldProduct =
          products.find(
            product =>
              product.id ===
              editingId
          );


        const updateData = {

          ...data,

          updatedAt:
            serverTimestamp()

        };


        if(
          data.status === "published" &&
          oldProduct?.status !== "published"
        ){

          updateData.publishedAt =
            serverTimestamp();

        }


        await updateDoc(

          doc(
            db,
            "marketplace",
            editingId
          ),

          updateData

        );


        showToast(
          "Product updated successfully.",
          "success"
        );


      }else{

        await addDoc(

          collection(
            db,
            "marketplace"
          ),

          {

            ...data,

            rating: 0,

            ratingCount: 0,

            salesCount: 0,

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp(),

            publishedAt:
              data.status === "published"
                ? serverTimestamp()
                : null

          }

        );


        showToast(
          "Product created successfully.",
          "success"
        );

      }


      clearForm();

      await loadProducts();


    }catch(error){

      console.error(error);


      showToast(
        error.message ||
        "Failed to save product.",
        "error"
      );


    }finally{

      saveBtn.disabled = false;

      saveBtn.textContent =
        "Save Product";

    }

  }
);


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id){

  const product =
    products.find(
      item =>
        item.id === id
    );


  if(!product){

    showToast(
      "Product not found.",
      "error"
    );

    return;

  }


  editingId = id;


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Edit Product";


  document.getElementById(
    "title"
  ).value =
    product.title || "";


  document.getElementById(
    "slug"
  ).value =
    product.slug || "";


  document.getElementById(
    "description"
  ).value =
    product.description || "";


  document.getElementById(
    "shortDescription"
  ).value =
    product.shortDescription || "";


  document.getElementById(
    "type"
  ).value =
    product.type || "";


  document.getElementById(
    "category"
  ).value =
    product.category || "";


  document.getElementById(
    "price"
  ).value =
    product.price ?? "";


  document.getElementById(
    "currency"
  ).value =
    product.currency || "";


  document.getElementById(
    "discountPrice"
  ).value =
    product.discountPrice ?? "";


  document.getElementById(
    "thumbnail"
  ).value =
    product.thumbnail || "";


  document.getElementById(
    "imageUrl"
  ).value =
    product.imageUrl || "";


  document.getElementById(
    "productUrl"
  ).value =
    product.productUrl || "";


  document.getElementById(
    "courseId"
  ).value =
    product.courseId || "";


  document.getElementById(
    "status"
  ).value =
    product.status || "draft";


  document.getElementById(
    "featured"
  ).value =
    product.featured === true
      ? "true"
      : "false";


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

  const product =
    products.find(
      item =>
        item.id === id
    );


  if(!product){
    return;
  }


  const confirmed =
    confirm(
      `Are you sure you want to delete "${product.title}"?`
    );


  if(!confirmed){
    return;
  }


  try{

    await deleteDoc(

      doc(
        db,
        "marketplace",
        id
      )

    );


    if(editingId === id){

      clearForm();

    }


    showToast(
      "Product deleted successfully.",
      "success"
    );


    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(
      error.message ||
      "Failed to delete product.",
      "error"
    );

  }

}


/* =====================================================
   FEATURE / UNFEATURE
===================================================== */

async function toggleFeatured(id){

  const product =
    products.find(
      item =>
        item.id === id
    );


  if(!product){
    return;
  }


  try{

    await updateDoc(

      doc(
        db,
        "marketplace",
        id
      ),

      {

        featured:
          product.featured !== true,

        updatedAt:
          serverTimestamp()

      }

    );


    showToast(

      product.featured === true

        ? "Product removed from featured."

        : "Product marked as featured.",

      "success"

    );


    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(
      error.message ||
      "Failed to update featured status.",
      "error"
    );

  }

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

  editingId = null;


  form.reset();


  document.getElementById(
    "formTitle"
  ).textContent =
    "➕ Add Product";


  document.getElementById(
    "status"
  ).value =
    "draft";


  document.getElementById(
    "featured"
  ).value =
    "false";


  saveBtn.textContent =
    "Save Product";

}

/* =====================================================
   TOAST
===================================================== */

function showToast(
  message,
  type = ""
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.className =
    `toast show ${type}`;


  setTimeout(
    () => {

      toast.className =
        "toast";

    },
    3500
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value){

  return escapeHtml(value);

}
