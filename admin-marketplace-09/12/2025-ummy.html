<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Admin | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}
header{background:#111827;color:white;padding:18px 5%;font-weight:bold}
main{max-width:1100px;margin:auto;padding:20px 15px}
.card,.item,.stat{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.num{font-size:26px;font-weight:bold;margin-top:5px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:7px}
textarea{min-height:90px}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:4px}
button{border:0;border-radius:7px;padding:9px 13px;cursor:pointer}
.blue{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.red{background:#dc2626;color:white}
.gray{background:#e5e7eb}
.orange{background:#f59e0b;color:white}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:15px;font-size:11px;margin:2px}
.published{background:#dcfce7;color:#166534}
.draft{background:#f3f4f6}
.featured{background:#fef3c7;color:#92400e}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
@media(max-width:700px){
.stats,.grid{grid-template-columns:1fr 1fr}
.form,.toolbar{grid-template-columns:1fr}
.full{grid-column:auto}
}
@media(max-width:450px){.stats,.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>🚀 LetsStudy Pro — Marketing Admin</header>

<main>

<h1>Marketing</h1>

<div class="stats">
<div class="stat">Campaigns<div class="num" id="total">0</div></div>
<div class="stat">Published<div class="num" id="pub">0</div></div>
<div class="stat">Drafts<div class="num" id="draft">0</div></div>
<div class="stat">Featured<div class="num" id="featured">0</div></div>
</div>

<div class="card">
<h2>➕ Add / Edit Campaign</h2>

<form id="form">

<input type="hidden" id="id">

<div class="form">

<div>
<label>Campaign Name *</label>
<input id="name" required placeholder="Back to School 2026">
</div>

<div>
<label>Campaign Type</label>
<select id="type">
<option>Promotion</option>
<option>Banner</option>
<option>Announcement</option>
<option>Course Promotion</option>
<option>Premium</option>
<option>Referral</option>
<option>Social Media</option>
</select>
</div>

<div>
<label>Title *</label>
<input id="title" required placeholder="Learn More, Pay Less">
</div>

<div>
<label>CTA Text</label>
<input id="cta" placeholder="Start Learning">
</div>

<div class="full">
<label>Description</label>
<textarea id="description"></textarea>
</div>

<div>
<label>Image URL</label>
<input id="image" type="url">
</div>

<div>
<label>Destination URL</label>
<input id="url" type="url" placeholder="/courses.html">
</div>

<div>
<label>Coupon Code</label>
<input id="coupon" placeholder="STUDY2026">
</div>

<div>
<label>Discount (%)</label>
<input id="discount" type="number" min="0" max="100">
</div>

<div>
<label>Start Date</label>
<input id="start" type="datetime-local">
</div>

<div>
<label>End Date</label>
<input id="end" type="datetime-local">
</div>

<div>
<label>Status</label>
<select id="status">
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>
</div>

<div>
<label>Featured</label>
<select id="featured">
<option value="false">No</option>
<option value="true">Yes</option>
</select>
</div>

</div>

<br>

<button class="blue" id="save">Add Campaign</button>
<button type="button" class="gray" onclick="clearForm()">Clear</button>

</form>
</div>

<div class="card">
<h2>🔎 Campaigns</h2>

<div class="toolbar">
<input id="search" placeholder="Search campaigns...">

<select id="filter">
<option value="">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>

<select id="filterType">
<option value="">All Types</option>
<option>Promotion</option>
<option>Banner</option>
<option>Announcement</option>
<option>Course Promotion</option>
<option>Premium</option>
<option>Referral</option>
<option>Social Media</option>
</select>
</div>
</div>

<div id="list" class="grid">Loading...</div>

</main>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let data=[];
let editing=null;

const $=x=>document.getElementById(x);

const clean=x=>String(x||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

async function load(){

const snap=await getDocs(collection(db,"marketing"));

data=snap.docs.map(x=>({
id:x.id,...x.data()
}));

stats();
render();
}

function stats(){

$("total").textContent=data.length;

$("pub").textContent=
data.filter(x=>x.status==="published").length;

$("draft").textContent=
data.filter(x=>x.status==="draft").length;

$("featured").textContent=
data.filter(x=>x.featured===true).length;
}

function render(){

let q=$("search").value.toLowerCase();
let st=$("filter").value;
let ty=$("filterType").value;

let arr=data.filter(x=>{

let text=[
x.name,x.title,x.description,x.coupon
].join(" ").toLowerCase();

return(
(!q||text.includes(q))&&
(!st||x.status===st)&&
(!ty||x.type===ty)
);

});

if(!arr.length){
$("list").innerHTML="<div class='card'>No campaigns found.</div>";
return;
}

$("list").innerHTML=arr.map(x=>`

<div class="item">

<h3>${clean(x.name)}</h3>

<strong>${clean(x.title)}</strong>

<p>${clean(x.description)}</p>

<span class="badge ${x.status}">
${clean(x.status)}
</span>

<span class="badge">
${clean(x.type)}
</span>

${x.featured?
"<span class='badge featured'>⭐ Featured</span>":""}

${x.discount?
`<span class="badge">${x.discount}% OFF</span>`:""}

${x.coupon?
`<p>Coupon: <b>${clean(x.coupon)}</b></p>`:""}

<div class="actions">

<button class="gray"
onclick="editItem('${x.id}')">
✏ Edit
</button>

<button class="orange"
onclick="toggle('${x.id}')">
${x.status==="published"?"Unpublish":"Publish"}
</button>

<button class="red"
onclick="removeItem('${x.id}')">
🗑 Delete
</button>

${x.url?
`<a href="${clean(x.url)}"
target="_blank">
<button class="blue">Open</button>
</a>`:""}

</div>

</div>

`).join("");
}

$("form").onsubmit=async e=>{

e.preventDefault();

let payload={

name:$("name").value.trim(),
type:$("type").value,
title:$("title").value.trim(),
cta:$("cta").value.trim(),
description:$("description").value.trim(),
image:$("image").value.trim(),
url:$("url").value.trim(),
coupon:$("coupon").value.trim(),
discount:Number($("discount").value||0),
startDate:$("start").value,
endDate:$("end").value,
status:$("status").value,
featured:$("featured").value==="true",
updatedAt:serverTimestamp()

};

$("save").disabled=true;
$("save").textContent="Saving...";

try{

if(editing){

await updateDoc(
doc(db,"marketing",editing),
payload
);

alert("Campaign updated.");

}else{

await addDoc(
collection(db,"marketing"),
{
...payload,
createdAt:serverTimestamp()
}
);

alert("Campaign added.");

}

clearForm();
await load();

}catch(e){

alert(e.message);

}

$("save").disabled=false;
$("save").textContent="Add Campaign";
};

window.editItem=id=>{

let x=data.find(a=>a.id===id);
if(!x)return;

editing=id;

$("id").value=id;
$("name").value=x.name||"";
$("type").value=x.type||"Promotion";
$("title").value=x.title||"";
$("cta").value=x.cta||"";
$("description").value=x.description||"";
$("image").value=x.image||"";
$("url").value=x.url||"";
$("coupon").value=x.coupon||"";
$("discount").value=x.discount||0;
$("start").value=x.startDate||"";
$("end").value=x.endDate||"";
$("status").value=x.status||"draft";
$("featured").value=x.featured?"true":"false";

$("save").textContent="Update Campaign";

scrollTo({top:0,behavior:"smooth"});
};

window.clearForm=()=>{

editing=null;

$("form").reset();

$("id").value="";

$("save").textContent="Add Campaign";
};

window.removeItem=async id=>{

let x=data.find(a=>a.id===id);

if(!confirm(
`Delete ${x?.name||"campaign"}?`
))return;

await deleteDoc(doc(db,"marketing",id));

await load();
};

window.toggle=async id=>{

let x=data.find(a=>a.id===id);
if(!x)return;

await updateDoc(
doc(db,"marketing",id),
{
status:x.status==="published"?
"draft":"published",
updatedAt:serverTimestamp()
}
);

await load();
};

$("search").oninput=render;
$("filter").onchange=render;
$("filterType").onchange=render;

load();

</script>

</body>
</html>
