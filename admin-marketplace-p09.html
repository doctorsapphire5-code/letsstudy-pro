<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketplace Admin | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

button,input,textarea,select{
 font:inherit
}

.container{
 max-width:1200px;
 margin:auto;
 padding:24px
}

.header{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:15px;
 padding:20px;
 margin-bottom:18px
}

.header h1{
 margin:0 0 5px;
 font-size:24px
}

.muted{
 color:#667085;
 font-size:13px
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin-bottom:18px
}

.stat{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:16px
}

.stat span{
 color:#667085;
 font-size:12px
}

.stat strong{
 display:block;
 font-size:23px;
 margin-top:5px
}

.toolbar{
 display:grid;
 grid-template-columns:2fr 1fr 1fr auto;
 gap:10px;
 margin-bottom:18px
}

input,textarea,select{
 width:100%;
 padding:11px;
 border:1px solid #d9dee8;
 border-radius:9px;
 outline:none;
 background:#fff
}

textarea{
 min-height:100px;
 resize:vertical
}

button{
 border:0;
 border-radius:9px;
 padding:10px 14px;
 cursor:pointer;
 font-weight:700
}

.primary{
 background:#155eef;
 color:#fff
}

.light{
 background:#eef2f6;
 color:#344054
}

.danger{
 background:#fee4e2;
 color:#b42318
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 overflow:hidden
}

.image{
 height:165px;
 background:#eef2f6;
 position:relative
}

.image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.badge{
 position:absolute;
 top:10px;
 left:10px;
 padding:5px 9px;
 border-radius:20px;
 color:#fff;
 font-size:10px;
 font-weight:700
}

.featured{
 background:#f59e0b
}

.status{
 position:absolute;
 top:10px;
 right:10px;
 padding:5px 9px;
 border-radius:20px;
 font-size:10px;
 font-weight:700
}

.published{
 background:#ecfdf3;
 color:#027a48
}

.draft{
 background:#f2f4f7;
 color:#475467
}

.body{
 padding:15px
}

.type{
 color:#155eef;
 font-size:10px;
 font-weight:800;
 text-transform:uppercase
}

.body h3{
 margin:5px 0;
 font-size:17px
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin:9px 0
}

.tag{
 background:#f2f4f7;
 padding:5px 8px;
 border-radius:20px;
 font-size:10px
}

.price{
 font-weight:800;
 margin:10px 0
}

.old{
 color:#98a2b3;
 text-decoration:line-through;
 font-size:11px;
 margin-right:5px
}

.rating{
 color:#f59e0b;
 font-size:12px
}

.rating span{
 color:#667085
}

.actions{
 display:flex;
 gap:7px;
 margin-top:13px
}

.actions button{
 flex:1
}

.empty{
 grid-column:1/-1;
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 text-align:center;
 padding:50px;
 color:#667085
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:15px
}

.modal.show{
 display:flex
}

.modal-box{
 width:min(850px,100%);
 max-height:92vh;
 overflow:auto;
 background:#fff;
 border-radius:15px;
 padding:20px
}

.close{
 float:right;
 background:#f2f4f7
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.group label{
 display:block;
 font-size:12px;
 font-weight:700;
 margin-bottom:5px
}

.full{
 grid-column:1/-1
}

.save{
 width:100%;
 margin-top:12px
}

@media(max-width:900px){
 .stats,.grid{
  grid-template-columns:1fr 1fr
 }

 .toolbar{
  grid-template-columns:1fr 1fr
 }
}

@media(max-width:600px){
 .stats,.grid,.form-grid,.toolbar{
  grid-template-columns:1fr
 }

 .full{
  grid-column:auto
 }

 .container{
  padding:15px
 }
}
</style>
</head>

<body>

<main class="container">

<!-- HEADER -->

<section class="header">

<h1>
Marketplace Management
</h1>

<p class="muted">
Manage educational products, digital products,
courses, pricing and marketplace publishing.
</p>

</section>


<!-- STATS -->

<section class="stats">

<div class="stat">
<span>Total Products</span>
<strong id="total">0</strong>
</div>

<div class="stat">
<span>Published</span>
<strong id="published">0</strong>
</div>

<div class="stat">
<span>Featured</span>
<strong id="featured">0</strong>
</div>

<div class="stat">
<span>Total Sales</span>
<strong id="sales">0</strong>
</div>

</section>


<!-- TOOLBAR -->

<section class="toolbar">

<input
 id="search"
 placeholder="Search products..."
>

<select id="statusFilter">

<option value="">
All Status
</option>

<option value="published">
Published
</option>

<option value="draft">
Draft
</option>

</select>


<select id="typeFilter">

<option value="">
All Types
</option>

</select>


<button
 class="primary"
 id="addBtn">

<i class="fa fa-plus"></i>

Add Product

</button>

</section>


<!-- PRODUCTS -->

<section
 id="products"
 class="grid">

<div class="empty">
Loading marketplace...
</div>

</section>

</main>


<!-- MODAL -->

<div
 id="modal"
 class="modal">

<div class="modal-box">

<button
 id="close"
 class="close">

<i class="fa fa-xmark"></i>

</button>


<h2 id="modalTitle">
Add Product
</h2>


<form id="form">

<div class="form-grid">


<div class="group">

<label>
Product Title
</label>

<input
 id="title"
 required>

</div>


<div class="group">

<label>
Slug
</label>

<input
 id="slug">

</div>


<div class="group">

<label>
Type
</label>

<select id="type">

<option value="">
Select Type
</option>

<option value="course">
Course
</option>

<option value="ebook">
E-Book
</option>

<option value="notes">
Notes
</option>

<option value="past-paper">
Past Paper
</option>

<option value="template">
Template
</option>

<option value="software">
Software
</option>

<option value="digital">
Digital Product
</option>

<option value="other">
Other
</option>

</select>

</div>


<div class="group">

<label>
Category
</label>

<input
 id="category">

</div>


<div class="group">

<label>
Price
</label>

<input
 id="price"
 type="number"
 min="0">

</div>


<div class="group">

<label>
Discount Price
</label>

<input
 id="discountPrice"
 type="number"
 min="0">

</div>


<div class="group">

<label>
Currency
</label>

<input
 id="currency"
 value="TZS">

</div>


<div class="group">

<label>
Status
</label>

<select id="status">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>

</div>


<div class="group">

<label>
Featured
</label>

<select id="featured">

<option value="false">
No
</option>

<option value="true">
Yes
</option>

</select>

</div>


<div class="group">

<label>
Course ID
</label>

<input
 id="courseId"
 placeholder="Optional">

</div>


<div class="group">

<label>
Product URL
</label>

<input
 id="productUrl">

</div>


<div class="group full">

<label>
Thumbnail URL
</label>

<input
 id="thumbnail">

</div>


<div class="group full">

<label>
Image URL
</label>

<input
 id="imageUrl">

</div>


<div class="group full">

<label>
Short Description
</label>

<textarea
 id="shortDescription">
</textarea>

</div>


<div class="group full">

<label>
Description
</label>

<textarea
 id="description">
</textarea>

</div>

</div>


<button
 class="primary save">

<i class="fa fa-save"></i>

Save Product

</button>

</form>

</div>

</div>


<script type="module">

/* =========================
 FIREBASE
========================= */

import {
 initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

 measurementId:
 "G-85B7V5H5J0"

};


const app=
 initializeApp(firebaseConfig);

const db=
 getFirestore(app);


/* =========================
 STATE
========================= */

let products=[];
let editingId=null;


/* =========================
 DOM
========================= */

const list=
 document.getElementById("products");

const modal=
 document.getElementById("modal");

const form=
 document.getElementById("form");


/* =========================
 ESCAPE
========================= */

function esc(value=""){

 return String(value)

 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");

}


/* =========================
 LOAD
========================= */

async function loadProducts(){

 try{

  const snap=
   await getDocs(
    collection(
     db,
     "marketplace"
    )
   );


  products=[];


  snap.forEach(item=>{

   products.push({

    id:item.id,

    ...item.data()

   });

  });


  updateStats();

  buildTypes();

  render();

 }catch(error){

  console.error(error);

  list.innerHTML=`

   <div class="empty">

    <i class="fa fa-triangle-exclamation"></i>

    <p>
     Unable to load marketplace.
    </p>

   </div>

  `;

 }

}


/* =========================
 STATS
========================= */

function updateStats(){

 document.getElementById(
  "total"
 ).textContent=
  products.length;


 document.getElementById(
  "published"
 ).textContent=

  products.filter(
   p=>p.status==="published"
  ).length;


 document.getElementById(
  "featured"
 ).textContent=

  products.filter(
   p=>p.featured===true
  ).length;


 document.getElementById(
  "sales"
 ).textContent=

  products.reduce(
   (total,p)=>
    total+
    Number(
     p.salesCount||0
    ),
   0
  ).toLocaleString();

}


/* =========================
 TYPES
========================= */

function buildTypes(){

 const types=
  [
   ...new Set(
    products
     .map(p=>p.type)
     .filter(Boolean)
   )
  ].sort();


 document.getElementById(
  "typeFilter"
 ).innerHTML=

 `<option value="">
  All Types
 </option>`

 +

 types.map(
  type=>`

   <option value="${esc(type)}">
    ${esc(type)}
   </option>

  `
 ).join("");

}


/* =========================
 RENDER
========================= */

function render(){

 const keyword=
  document.getElementById(
   "search"
  ).value
   .toLowerCase()
   .trim();


 const status=
  document.getElementById(
   "statusFilter"
  ).value;


 const type=
  document.getElementById(
   "typeFilter"
  ).value;


 const data=
  products.filter(p=>{

   const text=`

    ${p.title||""}

    ${p.category||""}

    ${p.type||""}

    ${p.description||""}

   `.toLowerCase();


   return(

    text.includes(keyword)

    &&

    (!status ||
     p.status===status)

    &&

    (!type ||
     p.type===type)

   );

  });


 if(!data.length){

  list.innerHTML=`

   <div class="empty">

    <i class="fa fa-store"></i>

    <h3>
     No products found
    </h3>

   </div>

  `;

  return;

 }


 data.sort(
  (a,b)=>
   Number(b.featured||false)
   -
   Number(a.featured||false)
 );


 list.innerHTML=

 data.map(p=>`

 <article class="card">


  <div class="image">

   <img
    src="${esc(
     p.thumbnail||
     p.imageUrl||
     "https://via.placeholder.com/700x400?text=Product"
    )}"
    alt="${esc(p.title)}"
   >


   ${
    p.featured
    ?
    `<span class="badge featured">
      ★ Featured
     </span>`
    :
    ""
   }


   <span
    class="status ${
     p.status==="published"
      ?"published"
      :"draft"
    }">

    ${esc(
     p.status||"draft"
    )}

   </span>

  </div>


  <div class="body">


   <div class="type">

    ${esc(
     p.type||"product"
    )}

   </div>


   <h3>

    ${esc(
     p.title||
     "Untitled Product"
    )}

   </h3>


   <p class="muted">

    ${esc(
     p.shortDescription||
     p.description||
     ""
    )}

   </p>


   <div class="tags">

    ${
     p.category
     ?
     `<span class="tag">
       ${esc(p.category)}
      </span>`
     :
     ""
    }


    ${
     p.courseId
     ?
     `<span class="tag">
       Course: ${esc(p.courseId)}
      </span>`
     :
     ""
    }

   </div>


   <div class="price">

    ${
     Number(p.discountPrice||0)>0
     &&
     Number(p.discountPrice)<Number(p.price)

     ?

     `<span class="old">

       ${esc(p.currency||"TZS")}
       ${Number(p.price||0).toLocaleString()}

      </span>`

     :

     ""
    }


    ${esc(
     p.currency||"TZS"
    )}

    ${Number(
     p.discountPrice>0
      ?p.discountPrice
      :p.price||0
    ).toLocaleString()}

   </div>


   <div class="rating">

    ★
    ${Number(
     p.rating||0
    ).toFixed(1)}

    <span>
     (${Number(
      p.ratingCount||0
     )})
    </span>

   </div>


   <div class="muted">

    ${Number(
     p.salesCount||0
    ).toLocaleString()}

    sales

   </div>


   <div class="actions">


    <button
     class="light"
     onclick="editProduct('${p.id}')">

     <i class="fa fa-edit"></i>

     Edit

    </button>


    <button
     class="primary"
     onclick="togglePublish('${p.id}')">

     <i class="fa fa-toggle-on"></i>

    </button>


    <button
     class="danger"
     onclick="deleteProduct('${p.id}')">

     <i class="fa fa-trash"></i>

    </button>


   </div>


  </div>

 </article>

 `).join("");

}


/* =========================
 SEARCH
========================= */

document
 .getElementById("search")
 .addEventListener(
  "input",
  render
);


document
 .getElementById("statusFilter")
 .addEventListener(
  "change",
  render
);


document
 .getElementById("typeFilter")
 .addEventListener(
  "change",
  render
);


/* =========================
 ADD
========================= */

document
 .getElementById("addBtn")
 .onclick=()=>{

  editingId=null;

  form.reset();

  document.getElementById(
   "currency"
  ).value="TZS";

  document.getElementById(
   "status"
  ).value="draft";

  document.getElementById(
   "featured"
  ).value="false";

  document.getElementById(
   "modalTitle"
  ).textContent=
   "Add Product";

  modal.classList.add(
   "show"
  );

 };


/* =========================
 CLOSE
========================= */

document
 .getElementById("close")
 .onclick=()=>{

  modal.classList.remove(
   "show"
  );

 };


/* =========================
 SAVE
========================= */

form.onsubmit=
 async event=>{

 event.preventDefault();


 const title=
  document.getElementById(
   "title"
  ).value.trim();


 const data={

  title:title,

  slug:
   document.getElementById(
    "slug"
   ).value.trim(),

  description:
   document.getElementById(
    "description"
   ).value.trim(),

  shortDescription:
   document.getElementById(
    "shortDescription"
   ).value.trim(),

  type:
   document.getElementById(
    "type"
   ).value,

  category:
   document.getElementById(
    "category"
   ).value.trim(),

  price:
   Number(
    document.getElementById(
     "price"
    ).value||0
   ),

  currency:
   document.getElementById(
    "currency"
   ).value.trim()||"TZS",

  discountPrice:
   Number(
    document.getElementById(
     "discountPrice"
    ).value||0
   ),

  thumbnail:
   document.getElementById(
    "thumbnail"
   ).value.trim(),

  imageUrl:
   document.getElementById(
    "imageUrl"
   ).value.trim(),

  productUrl:
   document.getElementById(
    "productUrl"
   ).value.trim(),

  courseId:
   document.getElementById(
    "courseId"
   ).value.trim(),

  status:
   document.getElementById(
    "status"
   ).value,

  featured:
   document.getElementById(
    "featured"
   ).value==="true",

  updatedAt:
   serverTimestamp()

 };


 try{


  if(editingId){

   await updateDoc(

    doc(
     db,
     "marketplace",
     editingId
    ),

    data

   );

  }else{


   data.rating=0;

   data.ratingCount=0;

   data.salesCount=0;

   data.createdAt=
    serverTimestamp();


   data.publishedAt=

    data.status==="published"

    ?

    serverTimestamp()

    :

    null;


   await addDoc(

    collection(
     db,
     "marketplace"
    ),

    data

   );

  }


  modal.classList.remove(
   "show"
  );


  await loadProducts();


 }catch(error){

  console.error(error);

  alert(
   "Unable to save product."
  );

 }

};


/* =========================
 EDIT
========================= */

window.editProduct=
 id=>{

  const p=
   products.find(
    item=>item.id===id
   );


  if(!p)return;


  editingId=id;


  const fields=[

   "title",
   "slug",
   "description",
   "shortDescription",
   "type",
   "category",
   "price",
   "currency",
   "discountPrice",
   "thumbnail",
   "imageUrl",
   "productUrl",
   "courseId",
   "status"

  ];


  fields.forEach(key=>{

   const element=
    document.getElementById(
     key
    );


   if(element){

    element.value=
     p[key]??"";

   }

  });


  document.getElementById(
   "featured"
  ).value=

   p.featured
    ?"true"
    :"false";


  document.getElementById(
   "modalTitle"
  ).textContent=
   "Edit Product";


  modal.classList.add(
   "show"
  );

};


/* =========================
 PUBLISH
========================= */

window.togglePublish=
 async id=>{

  const p=
   products.find(
    item=>item.id===id
   );


  if(!p)return;


  const newStatus=

   p.status==="published"
    ?"draft"
    :"published";


  try{

   await updateDoc(

    doc(
     db,
     "marketplace",
     id
    ),

    {

     status:newStatus,

     publishedAt:

      newStatus==="published"

       ?

       serverTimestamp()

       :

       p.publishedAt||null,

     updatedAt:
      serverTimestamp()

    }

   );


   await loadProducts();


  }catch(error){

   console.error(error);

   alert(
    "Unable to update status."
   );

  }

};


/* =========================
 DELETE
========================= */

window.deleteProduct=
 async id=>{

  const confirmDelete=
   confirm(
    "Delete this product permanently?"
   );


  if(!confirmDelete)return;


  try{

   await deleteDoc(

    doc(
     db,
     "marketplace",
     id
    )

   );


   await loadProducts();


  }catch(error){

   console.error(error);

   alert(
    "Unable to delete product."
   );

  }

};


/* =========================
 START
========================= */

loadProducts();

</script>

</body>
</html>
