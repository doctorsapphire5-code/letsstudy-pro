<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Marketplace | LetsStudy Pro</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--brand:#4f46e5;--brand2:#7c3aed;--ok:#059669;--warn:#d97706;--bad:#dc2626;--shadow:0 8px 26px rgba(15,23,42,.07);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#131a2e;--ink:#e8ecf6;--mut:#94a3b8;--line:#243049;--shadow:0 8px 26px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:110px;resize:vertical}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{max-width:1280px;margin:auto;padding:0 20px;height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:800;font-size:18px}.logo b{background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.who{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:12px}
.wrap{max-width:1280px;margin:auto;padding:24px 20px 60px}
h1{font-size:26px;letter-spacing:-.5px}.sub{color:var(--mut);margin:2px 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.st small{color:var(--mut);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}.st div{font-size:26px;font-weight:800;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.tools input{flex:2 1 220px}.tools select{flex:1 1 140px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:11px;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--card)}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;box-shadow:0 6px 16px rgba(79,70,229,.3)}.btn.p:hover{color:#fff;opacity:.92}
.btn.d{color:var(--bad)}.btn.d:hover{border-color:var(--bad);color:var(--bad)}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}tr:last-child td{border:0}tr:hover td{background:color-mix(in srgb,var(--brand) 4%,transparent)}
.it{display:flex;align-items:center;gap:12px;min-width:240px}
.th{width:54px;height:40px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;overflow:hidden;flex:none;font-size:18px}.th img{width:100%;height:100%;object-fit:cover}
.it b{display:block;line-height:1.3}.it small{color:var(--mut)}
.pill{font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;text-transform:capitalize;white-space:nowrap}
.pill.published{background:#d1fae5;color:#047857}.pill.draft{background:#fef3c7;color:#92400e}.pill.archived{background:#e2e8f0;color:#475569}
.star{font-size:20px;color:var(--line)}.star.on{color:#f59e0b}
.act{display:flex;gap:6px}.act a,.act button{padding:6px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:600}.act a:hover,.act button:hover{border-color:var(--brand);color:var(--brand)}.act .x:hover{border-color:var(--bad);color:var(--bad)}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px}.ov.on{display:flex}
.md{background:var(--card);border-radius:20px;width:100%;max-width:760px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}.mh h2{font-size:19px}.mh button{font-size:24px;color:var(--mut)}
.mb{padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.mb .full{grid-column:1/-1}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
.chk{display:flex;align-items:center;gap:10px;padding-top:24px}.chk input{width:20px;height:20px}.chk label{margin:0;font-size:14px;color:var(--ink)}
.mf{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
#err{grid-column:1/-1;color:var(--bad);font-size:13.5px;font-weight:600;display:none}
#gate{min-height:70vh;display:grid;place-items:center;text-align:center;padding:20px}#gate p{color:var(--mut);margin:6px 0 18px}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:90}#toast.on{opacity:1;transform:translate(-50%,0)}
#main{display:none}
@media(max-width:640px){.mb{grid-template-columns:1fr}.who span{display:none}}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="admin-dashboard.html">LetsStudy<b>Pro</b> · Admin</a><div class="who"><span id="me"></span><button class="btn" id="out">Sign out</button></div></div></header>

<div id="gate"><div><div style="font-size:48px">🔐</div><h1 id="gT">Checking access…</h1><p id="gP"></p><a class="btn p" id="gB" href="admin-login.html" style="display:none">Go to admin login</a></div></div>

<div class="wrap" id="main">
  <h1>Marketplace</h1><p class="sub">Create, edit, publish and remove products shown on the marketplace.</p>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search title, slug, category, courseId…">
    <select id="fs"><option value="">All statuses</option><option>published</option><option>draft</option><option>archived</option></select>
    <select id="ft"><option value="">All types</option></select>
    <button class="btn p" id="add">+ New product</button>
  </div>
  <div class="tbl"><table><thead><tr><th>Product</th><th>Type</th><th>Price</th><th>Status</th><th>★</th><th>Sales</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="none" style="display:none">No products match.</div></div>
</div>

<div class="ov" id="ov"><div class="md">
  <div class="mh"><h2 id="mT">New product</h2><button id="cls" aria-label="Close">×</button></div>
  <form id="f" novalidate><div class="mb">
    <div class="full"><label>Title *</label><input id="title" maxlength="140"></div>
    <div><label>Slug</label><input id="slug" placeholder="auto from title"></div>
    <div><label>Course ID</label><input id="courseId"></div>
    <div><label>Type</label><select id="type"></select></div>
    <div><label>Category</label><input id="category"></div>
    <div class="full"><label>Short description</label><input id="shortDescription" maxlength="200"></div>
    <div class="full"><label>Description</label><textarea id="description"></textarea></div>
    <div><label>Price</label><input id="price" type="number" min="0" step="1" value="0"></div>
    <div><label>Discount price (0 = none)</label><input id="discountPrice" type="number" min="0" step="1" value="0"></div>
    <div><label>Currency</label><input id="currency" value="TZS" maxlength="5"></div>
    <div><label>Status</label><select id="status"><option>draft</option><option>published</option><option>archived</option></select></div>
    <div><label>Image URL</label><input id="imageUrl" placeholder="https://…"></div>
    <div><label>Thumbnail URL</label><input id="thumbnail" placeholder="https://…"></div>
    <div class="full"><label>Product URL</label><input id="productUrl" placeholder="https://…"></div>
    <div><label>Seller email</label><input id="email" type="email"></div>
    <div><label>Seller phone (e.g. 255712345678)</label><input id="phone" inputmode="tel"></div>
    <div><label>Rating (0–5)</label><input id="rating" type="number" min="0" max="5" step="0.1" value="0"></div>
    <div><label>Rating count</label><input id="ratingCount" type="number" min="0" step="1" value="0"></div>
    <div><label>Sales count</label><input id="salesCount" type="number" min="0" step="1" value="0"></div>
    <div class="chk"><input type="checkbox" id="featured"><label for="featured">Featured product</label></div>
    <div id="err"></div>
  </div>
  <div class="mf"><button type="button" class="btn" id="cn">Cancel</button><button type="submit" class="btn p" id="sv">Save product</button></div></form>
</div></div>
<div id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,getDocs,getDoc,doc,addDoc,updateDoc,deleteDoc,query,where,limit,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// LETSSTUDY PRO FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyBcOYDfAVKXbKXjsyRgI_0rjodBn678tCc",
    authDomain: "let-s-study-pro-course.firebaseapp.com",
    databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId: "let-s-study-pro-course",
    storageBucket: "let-s-study-pro-course.firebasestorage.app",
    messagingSenderId: "474928293390",
    appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId: "G-85B7V5H5J0"
  };
const auth=getAuth(app),db=getFirestore(app),COL="marketplace";
const TYPES=["notes","ebook","template","course","software","bundle","other"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Number(v)||0;
const ts=v=>{try{return(v?.toDate?v.toDate():new Date(v)).getTime()||0}catch{return 0}};
const fd=v=>{const t=ts(v);return t?new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"—"};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2300)};
const slugify=s=>String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80);
const okUrl=u=>!u||/^https?:\/\//i.test(u);
const eff=p=>{const a=num(p.price),d=num(p.discountPrice);return d>0&&d<a?d:a};
let items=[],editId=null,admin=null;

/* ---------- access ---------- */
const okAdmin=d=>!d.status||["active","approved"].includes(String(d.status).toLowerCase());
async function isAdmin(u){
  try{
    const s=await getDoc(doc(db,"admins",u.uid));if(s.exists())return okAdmin(s.data());
    let q=await getDocs(query(collection(db,"admins"),where("uid","==",u.uid),limit(1)));if(!q.empty)return okAdmin(q.docs[0].data());
    if(u.email){q=await getDocs(query(collection(db,"admins"),where("email","==",u.email),limit(1)));if(!q.empty)return okAdmin(q.docs[0].data())}
  }catch(e){console.error(e)}
  return false;
}
function gate(t,p,btn){$("#gT").textContent=t;$("#gP").textContent=p;$("#gB").style.display=btn?"inline-flex":"none";$("#gate").style.display="grid";$("#main").style.display="none"}
onAuthStateChanged(auth,async u=>{
  if(!u){gate("Sign in required","Please sign in with your admin account.",true);setTimeout(()=>location.replace("admin-login.html?next=admin-marketplace.html"),1200);return}
  if(!(await isAdmin(u))){gate("Access denied","This account is not an active admin.",true);return}
  admin=u;$("#me").innerHTML=`<span>${esc(u.email||"Admin")}</span>`;
  $("#gate").style.display="none";$("#main").style.display="block";
  await load();
});
$("#out").onclick=async()=>{await signOut(auth);location.replace("admin-login.html")};

/* ---------- data ---------- */
async function load(){
  try{const s=await getDocs(collection(db,COL));items=s.docs.map(d=>({id:d.id,...d.data()}));items.sort((a,b)=>ts(b.updatedAt||b.createdAt)-ts(a.updatedAt||a.createdAt))}
  catch(e){console.error(e);toast("Could not load products (check Firestore rules)")}
  draw();
}
function draw(){
  const st=s=>items.filter(p=>String(p.status).toLowerCase()===s).length;
  $("#stats").innerHTML=[["Total",items.length],["Published",st("published")],["Drafts",st("draft")],["Featured",items.filter(p=>p.featured===true||p.featured==="true").length],["Total sales",items.reduce((a,p)=>a+num(p.salesCount),0).toLocaleString("en-US")]].map(([k,v])=>`<div class="st"><small>${k}</small><div>${v}</div></div>`).join("");
  const q=$("#q").value.toLowerCase().trim(),fs=$("#fs").value,ft=$("#ft").value;
  const list=items.filter(p=>(!fs||String(p.status).toLowerCase()===fs)&&(!ft||p.type===ft)&&(!q||[p.title,p.slug,p.category,p.courseId,p.type].some(x=>String(x||"").toLowerCase().includes(q))));
  $("#none").style.display=list.length?"none":"block";
  $("#rows").innerHTML=list.map(p=>{
    const img=p.thumbnail||p.imageUrl,fe=p.featured===true||p.featured==="true",s=String(p.status||"draft").toLowerCase();
    return`<tr><td><div class="it"><div class="th">${/^https?:/i.test(img||"")?`<img src="${esc(img)}" alt="" onerror="this.remove()">`:"📝"}</div><div><b>${esc(p.title||"Untitled")}</b><small>${esc(p.category||"—")} · ${esc(p.slug||p.id)}</small></div></div></td>
    <td>${esc(p.type||"—")}</td><td>${eff(p)?`${esc(p.currency||"TZS")} ${eff(p).toLocaleString("en-US")}`:'<span style="color:var(--ok);font-weight:700">Free</span>'}</td>
    <td><span class="pill ${esc(s)}">${esc(s)}</span></td><td><button class="star ${fe?"on":""}" data-a="fe" data-id="${esc(p.id)}" title="Toggle featured">★</button></td>
    <td>${num(p.salesCount).toLocaleString("en-US")}</td><td>${fd(p.updatedAt||p.createdAt)}</td>
    <td><div class="act"><button data-a="ed" data-id="${esc(p.id)}">Edit</button><button data-a="pb" data-id="${esc(p.id)}">${s==="published"?"Unpublish":"Publish"}</button><a href="marketplace-details.html?id=${encodeURIComponent(p.id)}" target="_blank" rel="noopener">View</a><button class="x" data-a="dl" data-id="${esc(p.id)}">Delete</button></div></td></tr>`}).join("");
}
$("#ft").innerHTML+=TYPES.map(t=>`<option>${t}</option>`).join("");
$("#type").innerHTML=TYPES.map(t=>`<option>${t}</option>`).join("");
["q","fs","ft"].forEach(i=>$("#"+i).addEventListener("input",draw));

$("#rows").onclick=async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const p=items.find(x=>x.id===b.dataset.id);if(!p)return;
  try{
    if(b.dataset.a==="ed")return open(p);
    if(b.dataset.a==="fe"){const v=!(p.featured===true||p.featured==="true");await updateDoc(doc(db,COL,p.id),{featured:v,updatedAt:serverTimestamp()});p.featured=v;toast(v?"Marked as featured":"Removed from featured")}
    if(b.dataset.a==="pb"){const pub=String(p.status).toLowerCase()!=="published",u={status:pub?"published":"draft",updatedAt:serverTimestamp()};if(pub&&!p.publishedAt)u.publishedAt=serverTimestamp();await updateDoc(doc(db,COL,p.id),u);toast(pub?"Published":"Moved to draft");return load()}
    if(b.dataset.a==="dl"){if(!confirm(`Delete "${p.title||"this product"}"? This cannot be undone.`))return;await deleteDoc(doc(db,COL,p.id));items=items.filter(x=>x.id!==p.id);toast("Product deleted")}
    draw();
  }catch(err){console.error(err);toast("Action failed: "+(err.code||err.message))}
};

/* ---------- form ---------- */
const F=["title","slug","courseId","type","category","shortDescription","description","price","discountPrice","currency","status","imageUrl","thumbnail","productUrl","email","phone","rating","ratingCount","salesCount"];
function open(p){
  editId=p?p.id:null;$("#mT").textContent=p?"Edit product":"New product";$("#err").style.display="none";
  F.forEach(k=>{const v=p?p[k]:undefined,el=$("#"+k);el.value=v??(k==="currency"?"TZS":k==="status"?"draft":k==="type"?"notes":["price","discountPrice","rating","ratingCount","salesCount"].includes(k)?0:"")});
  $("#featured").checked=!!p&&(p.featured===true||p.featured==="true");
  $("#ov").classList.add("on");$("#title").focus();
}
const close=()=>$("#ov").classList.remove("on");
$("#add").onclick=()=>open(null);$("#cls").onclick=close;$("#cn").onclick=close;
$("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")close()});
$("#title").addEventListener("input",()=>{if(!editId&&!$("#slug").dataset.m)$("#slug").value=slugify($("#title").value)});
$("#slug").addEventListener("input",()=>$("#slug").dataset.m="1");

$("#f").onsubmit=async e=>{
  e.preventDefault();
  const v=k=>$("#"+k).value.trim(),err=m=>{const x=$("#err");x.textContent=m;x.style.display="block"};
  const price=Math.round(num(v("price"))),disc=Math.round(num(v("discountPrice"))),rating=num(v("rating"));
  if(!v("title"))return err("Title is required.");
  if(price<0||disc<0)return err("Prices cannot be negative.");
  if(disc>0&&disc>=price)return err("Discount price must be lower than the price.");
  if(rating<0||rating>5)return err("Rating must be between 0 and 5.");
  for(const k of["imageUrl","thumbnail","productUrl"])if(!okUrl(v(k)))return err("URLs must start with http:// or https://");
  if(v("email")&&!/^\S+@\S+\.\S+$/.test(v("email")))return err("Enter a valid email address.");
  const slug=slugify(v("slug")||v("title"));
  if(items.some(p=>p.slug===slug&&p.id!==editId))return err("Another product already uses this slug.");
  const data={title:v("title"),slug,courseId:v("courseId"),type:v("type"),category:v("category"),shortDescription:v("shortDescription"),description:$("#description").value.trim(),price,discountPrice:disc,currency:(v("currency")||"TZS").toUpperCase(),status:v("status"),imageUrl:v("imageUrl"),thumbnail:v("thumbnail"),productUrl:v("productUrl"),email:v("email"),phone:v("phone"),rating:Math.round(rating*10)/10,ratingCount:Math.round(num(v("ratingCount"))),salesCount:Math.round(num(v("salesCount"))),featured:$("#featured").checked,updatedAt:serverTimestamp()};
  const old=items.find(p=>p.id===editId);
  if(data.status==="published"&&!(old&&old.publishedAt))data.publishedAt=serverTimestamp();
  $("#sv").disabled=true;$("#sv").textContent="Saving…";
  try{
    if(editId)await updateDoc(doc(db,COL,editId),data);
    else await addDoc(collection(db,COL),{...data,createdAt:serverTimestamp(),publishedAt:data.publishedAt||null});
    close();toast(editId?"Product updated":"Product created");await load();
  }catch(x){console.error(x);err("Save failed: "+(x.code||x.message))}
  $("#sv").disabled=false;$("#sv").textContent="Save product";
};
</script>
</body>
</html>
