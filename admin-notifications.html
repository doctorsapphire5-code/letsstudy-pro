<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Notifications Management | LetsStudy Pro</title>

<link rel="icon"
      type="image/png"
      href="https://letsstudy.pro/favicon.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #e2e8f0;
}

.nav{
  width:min(1250px,92%);
  min-height:70px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#0b57d0;
  font-size:20px;
  font-weight:900;
}

.back{
  color:#475569;
  font-weight:700;
}

.container{
  width:min(1250px,92%);
  margin:35px auto;
}

.page-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
}

.page-header h1{
  font-size:32px;
}

.page-header p{
  color:#64748b;
  margin-top:5px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  font-weight:800;
}

.primary{
  background:#0b57d0;
  color:#fff;
}

.secondary{
  background:#f1f5f9;
  color:#334155;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:20px;
}

.stat strong{
  display:block;
  font-size:28px;
  color:#0b57d0;
}

.stat span{
  color:#64748b;
  font-size:13px;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr 180px 180px;
  gap:12px;

  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
}

input,select,textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:11px 13px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#0b57d0;
}

.table-box{
  overflow:auto;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:17px;
}

table{
  width:100%;
  min-width:1000px;
  border-collapse:collapse;
}

th,td{
  padding:15px;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
}

th{
  background:#f8fafc;
  font-size:12px;
  color:#475569;
  text-transform:uppercase;
}

td{
  font-size:14px;
}

.badge{
  display:inline-flex;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.sent{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#fef3c7;
  color:#92400e;
}

.scheduled{
  background:#dbeafe;
  color:#1d4ed8;
}

.info{
  background:#dbeafe;
  color:#1d4ed8;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.warning{
  background:#fef3c7;
  color:#92400e;
}

.urgent{
  background:#fee2e2;
  color:#991b1b;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.action{
  border:0;
  padding:8px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
}

.view{
  background:#e0f2fe;
  color:#0369a1;
}

.edit{
  background:#e0e7ff;
  color:#3730a3;
}

.send{
  background:#dcfce7;
  color:#166534;
}

.delete{
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  text-align:center;
  padding:45px;
  color:#64748b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(15,23,42,.65);

  padding:20px;

  align-items:center;
  justify-content:center;
}

.modal-box{
  width:min(700px,100%);
  max-height:92vh;
  overflow:auto;

  background:#fff;
  border-radius:20px;
  padding:26px;
  position:relative;
}

.close{
  position:absolute;
  top:13px;
  right:13px;

  width:36px;
  height:36px;

  border:0;
  border-radius:50%;

  background:#f1f5f9;
  font-size:20px;
}

.modal-box h2{
  margin-bottom:20px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.form-actions button{
  flex:1;
}

.detail{
  padding:14px 0;
  border-bottom:1px solid #e2e8f0;
}

.detail strong{
  display:block;
  color:#64748b;
  font-size:12px;
  margin-bottom:5px;
}

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .page-header{
    flex-direction:column;
    align-items:flex-start;
  }

}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .page-header h1{
    font-size:27px;
  }

  .form-actions{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      LetsStudy Pro Admin
    </div>

    <a
      href="admin.html"
      class="back">

      ← Admin Dashboard

    </a>

  </div>

</header>


<main class="container">

  <div class="page-header">

    <div>

      <h1>
        Notifications Management
      </h1>

      <p>
        Create and manage notifications
        for LetsStudy Pro users.
      </p>

    </div>

    <button
      class="btn primary"
      onclick="openNotificationModal()">

      + New Notification

    </button>

  </div>


  <!-- STATISTICS -->

  <section class="stats">

    <div class="stat">

      <strong id="totalNotifications">
        0
      </strong>

      <span>
        Total Notifications
      </span>

    </div>

    <div class="stat">

      <strong id="sentNotifications">
        0
      </strong>

      <span>
        Sent
      </span>

    </div>

    <div class="stat">

      <strong id="draftNotifications">
        0
      </strong>

      <span>
        Drafts
      </span>

    </div>

    <div class="stat">

      <strong id="scheduledNotifications">
        0
      </strong>

      <span>
        Scheduled
      </span>

    </div>

  </section>


  <!-- FILTER -->

  <section class="toolbar">

    <input
      id="searchNotification"
      type="search"
      placeholder="Search notifications...">

    <select id="notificationStatusFilter">

      <option value="">
        All Status
      </option>

      <option value="draft">
        Draft
      </option>

      <option value="scheduled">
        Scheduled
      </option>

      <option value="sent">
        Sent
      </option>

    </select>

    <select id="notificationTypeFilter">

      <option value="">
        All Types
      </option>

      <option value="info">
        Information
      </option>

      <option value="success">
        Success
      </option>

      <option value="warning">
        Warning
      </option>

      <option value="urgent">
        Urgent
      </option>

    </select>

  </section>


  <!-- TABLE -->

  <section class="table-box">

    <table>

      <thead>

        <tr>

          <th>
            Title
          </th>

          <th>
            Type
          </th>

          <th>
            Audience
          </th>

          <th>
            Status
          </th>

          <th>
            Created
          </th>

          <th>
            Actions
          </th>

        </tr>

      </thead>

      <tbody
        id="notificationsTable">

        <tr>

          <td
            colspan="6"
            class="empty">

            Loading notifications...

          </td>

        </tr>

      </tbody>

    </table>

  </section>

</main>


<!-- CREATE / EDIT MODAL -->

<div
  id="notificationModal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeNotificationModal()">

      ×

    </button>

    <h2 id="modalTitle">
      New Notification
    </h2>


    <div class="form-group">

      <label>
        Notification Title
      </label>

      <input
        id="notificationTitle"
        placeholder="New course available">

    </div>


    <div class="form-group">

      <label>
        Notification Type
      </label>

      <select id="notificationType">

        <option value="info">
          Information
        </option>

        <option value="success">
          Success
        </option>

        <option value="warning">
          Warning
        </option>

        <option value="urgent">
          Urgent
        </option>

      </select>

    </div>


    <div class="form-group">

      <label>
        Audience
      </label>

      <select id="notificationAudience">

        <option value="all">
          All Users
        </option>

        <option value="students">
          Students
        </option>

        <option value="premium">
          Premium Users
        </option>

        <option value="admins">
          Admins
        </option>

      </select>

    </div>


    <div class="form-group">

      <label>
        Message
      </label>

      <textarea
        id="notificationMessage"
        rows="6"
        placeholder="Write notification message..."></textarea>

    </div>


    <div class="form-group">

      <label>
        Status
      </label>

      <select id="notificationStatus">

        <option value="draft">
          Draft
        </option>

        <option value="scheduled">
          Scheduled
        </option>

        <option value="sent">
          Sent
        </option>

      </select>

    </div>


    <div class="form-actions">

      <button
        class="btn secondary"
        onclick="closeNotificationModal()">

        Cancel

      </button>

      <button
        class="btn primary"
        onclick="saveNotification()">

        Save Notification

      </button>

    </div>

  </div>

</div>


<!-- VIEW MODAL -->

<div
  id="viewModal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeViewModal()">

      ×

    </button>

    <h2>
      Notification Details
    </h2>

    <div id="notificationDetails"></div>

  </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro.firebaseapp.com",

  projectId:
    "let-s-study-pro",

  storageBucket:
    "let-s-study-pro.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   STATE
===================================================== */

let notifications = [];

let selectedNotification = null;


/* =====================================================
   LOAD
===================================================== */

async function loadNotifications(){

  const table =
    document.getElementById(
      "notificationsTable"
    );


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "notifications"
        )
      );


    notifications = [];


    snapshot.forEach(
      item => {

        notifications.push({

          id:
            item.id,

          ...item.data()

        });

      }
    );


    updateStatistics();

    applyFilters();


  }catch(error){

    console.error(
      "Load notifications error:",
      error
    );


    table.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty">

          Failed to load notifications.

        </td>

      </tr>

    `;

  }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

  document.getElementById(
    "totalNotifications"
  ).textContent =
    notifications.length;


  document.getElementById(
    "sentNotifications"
  ).textContent =

    notifications.filter(
      item =>
        normalize(
          item.status
        ) === "sent"
    ).length;


  document.getElementById(
    "draftNotifications"
  ).textContent =

    notifications.filter(
      item =>
        normalize(
          item.status
        ) === "draft"
    ).length;


  document.getElementById(
    "scheduledNotifications"
  ).textContent =

    notifications.filter(
      item =>
        normalize(
          item.status
        ) === "scheduled"
    ).length;

}


/* =====================================================
   FILTER
===================================================== */

function applyFilters(){

  const search =
    document.getElementById(
      "searchNotification"
    )
    .value
    .trim()
    .toLowerCase();


  const status =
    document.getElementById(
      "notificationStatusFilter"
    ).value;


  const type =
    document.getElementById(
      "notificationTypeFilter"
    ).value;


  const filtered =
    notifications.filter(
      item => {

        const title =
          String(
            item.title || ""
          )
          .toLowerCase();


        const message =
          String(
            item.message || ""
          )
          .toLowerCase();


        return (

          (
            !search ||

            title.includes(
              search
            ) ||

            message.includes(
              search
            )
          )

          &&

          (
            !status ||

            normalize(
              item.status
            ) === status
          )

          &&

          (
            !type ||

            normalize(
              item.type
            ) === type
          )

        );

      }
    );


  renderNotifications(
    filtered
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderNotifications(list){

  const table =
    document.getElementById(
      "notificationsTable"
    );


  if(!list.length){

    table.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty">

          No notifications found.

        </td>

      </tr>

    `;

    return;

  }


  table.innerHTML =

    list.map(
      item => {

        const status =
          normalize(
            item.status
          ) || "draft";


        const type =
          normalize(
            item.type
          ) || "info";


        return `

          <tr>

            <td>

              <strong>

                ${escapeHTML(
                  item.title ||
                  "Untitled"
                )}

              </strong>

            </td>


            <td>

              <span
                class="badge ${type}">

                ${escapeHTML(
                  type
                )}

              </span>

            </td>


            <td>

              ${escapeHTML(
                item.audience ||
                "all"
              )}

            </td>


            <td>

              <span
                class="badge ${status}">

                ${escapeHTML(
                  status
                )}

              </span>

            </td>


            <td>

              ${formatDate(
                item.createdAt
              )}

            </td>


            <td>

              <div class="actions">

                <button
                  class="action view"
                  onclick="viewNotification('${item.id}')">

                  View

                </button>


                <button
                  class="action edit"
                  onclick="editNotification('${item.id}')">

                  Edit

                </button>


                ${
                  status !== "sent"

                  ?

                  `
                  <button
                    class="action send"
                    onclick="sendNotification('${item.id}')">

                    Send

                  </button>
                  `

                  :

                  ""
                }


                <button
                  class="action delete"
                  onclick="deleteNotification('${item.id}')">

                  Delete

                </button>

              </div>

            </td>

          </tr>

        `;

      }
    )
    .join("");

}


/* =====================================================
   OPEN ADD
===================================================== */

window.openNotificationModal =
function(){

  selectedNotification =
    null;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "New Notification";


  clearForm();


  document.getElementById(
    "notificationModal"
  ).style.display =
    "flex";

};


/* =====================================================
   EDIT
===================================================== */

window.editNotification =
function(id){

  const item =
    notifications.find(
      notification =>
        notification.id === id
    );


  if(!item){

    alert(
      "Notification not found."
    );

    return;

  }


  selectedNotification =
    item;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Notification";


  document.getElementById(
    "notificationTitle"
  ).value =
    item.title || "";


  document.getElementById(
    "notificationType"
  ).value =
    item.type || "info";


  document.getElementById(
    "notificationAudience"
  ).value =
    item.audience || "all";


  document.getElementById(
    "notificationMessage"
  ).value =
    item.message || "";


  document.getElementById(
    "notificationStatus"
  ).value =
    item.status || "draft";


  document.getElementById(
    "notificationModal"
  ).style.display =
    "flex";

};


/* =====================================================
   SAVE
===================================================== */

window.saveNotification =
async function(){

  const title =
    document.getElementById(
      "notificationTitle"
    )
    .value
    .trim();


  const type =
    document.getElementById(
      "notificationType"
    ).value;


  const audience =
    document.getElementById(
      "notificationAudience"
    ).value;


  const message =
    document.getElementById(
      "notificationMessage"
    )
    .value
    .trim();


  const status =
    document.getElementById(
      "notificationStatus"
    ).value;


  if(!title){

    alert(
      "Please enter notification title."
    );

    return;

  }


  if(!message){

    alert(
      "Please enter notification message."
    );

    return;

  }


  try{

    const data = {

      title:
        title,

      type:
        type,

      audience:
        audience,

      message:
        message,

      status:
        status

    };


    if(selectedNotification){

      await updateDoc(

        doc(
          db,
          "notifications",
          selectedNotification.id
        ),

        {

          ...data,

          updatedAt:
            serverTimestamp()

        }

      );

    }else{

      await addDoc(

        collection(
          db,
          "notifications"
        ),

        {

          ...data,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }

      );

    }


    closeNotificationModal();

    await loadNotifications();


    alert(
      "Notification saved successfully."
    );


  }catch(error){

    console.error(
      "Save notification error:",
      error
    );


    alert(
      "Failed to save notification."
    );

  }

};


/* =====================================================
   SEND
==========
/* =====================================================
   SEND NOTIFICATION
===================================================== */

window.sendNotification =
async function(id){

  const item =
    notifications.find(
      notification =>
        notification.id === id
    );

  if(!item){

    alert(
      "Notification not found."
    );

    return;

  }

  if(
    normalize(item.status) === "sent"
  ){

    alert(
      "This notification has already been sent."
    );

    return;

  }

  const confirmed =
    confirm(
      `Send "${item.title || "this notification"}" now?`
    );

  if(!confirmed){

    return;

  }

  try{

    await updateDoc(

      doc(
        db,
        "notifications",
        id
      ),

      {

        status:
          "sent",

        sentAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }

    );

    await loadNotifications();

    alert(
      "Notification sent successfully."
    );

  }catch(error){

    console.error(
      "SEND NOTIFICATION ERROR:",
      error
    );

    alert(
      "Unable to send notification."
    );

  }

};
