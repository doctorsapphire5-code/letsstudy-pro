<!-- =========================
     ADMIN NOTIFICATIONS
========================= -->

<section class="admin-page">

  <div class="page-header">

    <div>
      <h1>Notifications</h1>

      <p>
        Manage system notifications sent to users.
      </p>
    </div>

    <button
      type="button"
      class="primary-btn"
      id="addNotificationBtn"
    >
      + Add Notification
    </button>

  </div>


  <!-- =========================
       STATISTICS
  ========================= -->

  <div class="stats-grid">

    <div class="stat-card">
      <span>Total Notifications</span>
      <strong id="totalNotifications">0</strong>
    </div>

    <div class="stat-card">
      <span>Unread</span>
      <strong id="unreadNotifications">0</strong>
    </div>

    <div class="stat-card">
      <span>Read</span>
      <strong id="readNotifications">0</strong>
    </div>

    <div class="stat-card">
      <span>Important</span>
      <strong id="importantNotifications">0</strong>
    </div>

  </div>


  <!-- =========================
       FILTERS
  ========================= -->

  <div class="filter-card">

    <input
      type="search"
      id="notificationSearch"
      placeholder="Search notifications..."
    >


    <select id="notificationTypeFilter">

      <option value="all">
        All Types
      </option>

      <option value="system">
        System
      </option>

      <option value="course">
        Course
      </option>

      <option value="payment">
        Payment
      </option>

      <option value="marketing">
        Marketing
      </option>

      <option value="security">
        Security
      </option>

    </select>


    <select id="notificationStatusFilter">

      <option value="all">
        All Status
      </option>

      <option value="unread">
        Unread
      </option>

      <option value="read">
        Read
      </option>

      <option value="important">
        Important
      </option>

    </select>

  </div>


  <!-- =========================
       NOTIFICATIONS
  ========================= -->

  <div
    class="notifications-list"
    id="notificationsList"
  >

    <div class="loading-state">
      Loading notifications...
    </div>

  </div>

</section>


<!-- =========================
     MODAL
========================= -->

<div
  class="modal"
  id="notificationModal"
  style="display:none;"
>

  <div class="modal-content">

    <button
      type="button"
      class="modal-close"
      id="closeNotificationModal"
    >
      ×
    </button>


    <h2 id="notificationModalTitle">
      Add Notification
    </h2>


    <form id="notificationForm">

      <label>
        Title

        <input
          type="text"
          name="title"
          id="notificationTitle"
          required
          maxlength="150"
        >

      </label>


      <label>
        Message

        <textarea
          name="message"
          id="notificationMessage"
          rows="5"
          required
        ></textarea>

      </label>


      <label>
        Type

        <select
          name="type"
          id="notificationType"
        >

          <option value="system">
            System
          </option>

          <option value="course">
            Course
          </option>

          <option value="payment">
            Payment
          </option>

          <option value="marketing">
            Marketing
          </option>

          <option value="security">
            Security
          </option>

        </select>

      </label>


      <label>
        Recipient

        <select
          name="recipientType"
          id="recipientType"
        >

          <option value="all">
            All Users
          </option>

          <option value="students">
            Students
          </option>

          <option value="instructors">
            Instructors
          </option>

          <option value="specific">
            Specific User
          </option>

        </select>

      </label>


      <label
        id="specificUserWrapper"
        style="display:none;"
      >

        User ID

        <input
          type="text"
          name="userId"
          id="notificationUserId"
          placeholder="Firebase User ID"
        >

      </label>


      <label>
        Priority

        <select
          name="priority"
          id="notificationPriority"
        >

          <option value="normal">
            Normal
          </option>

          <option value="important">
            Important
          </option>

          <option value="urgent">
            Urgent
          </option>

        </select>

      </label>


      <label>
        Link

        <input
          type="text"
          name="link"
          id="notificationLink"
          placeholder="/dashboard.html"
        >

      </label>


      <div class="form-actions">

        <button
          type="button"
          class="secondary-btn"
          id="cancelNotificationBtn"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="primary-btn"
        >
          Send Notification
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

  /* =========================
     FIREBASE
  ========================= */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getDatabase,
    ref,
    onValue,
    push,
    set,
    update,
    remove
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  /* =========================
     FIREBASE CONFIG
  ========================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"

  };


  /* =========================
     INITIALIZE
  ========================= */

  const app =
    initializeApp(
      firebaseConfig
    );

  const auth =
    getAuth(app);

  const database =
    getDatabase(app);


  /* =========================
     STATE
  ========================= */

  let notifications = {};

  let editingId = null;


  /* =========================
     ELEMENTS
  ========================= */

  const list =
    document.getElementById(
      "notificationsList"
    );

  const modal =
    document.getElementById(
      "notificationModal"
    );

  const form =
    document.getElementById(
      "notificationForm"
    );

  const search =
    document.getElementById(
      "notificationSearch"
    );

  const typeFilter =
    document.getElementById(
      "notificationTypeFilter"
    );

  const statusFilter =
    document.getElementById(
      "notificationStatusFilter"
    );


  /* =========================
     ESCAPE
  ========================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =========================
     DATE
  ========================= */

  function formatDate(
    timestamp
  ) {

    if (!timestamp) {
      return "-";
    }

    const date =
      new Date(
        timestamp
      );

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "-";

    }

    return date.toLocaleString();

  }


  /* =========================
     LOAD NOTIFICATIONS
  ========================= */

  function loadNotifications() {

    const notificationsRef =
      ref(
        database,
        "notifications"
      );


    onValue(
      notificationsRef,
      snapshot => {

        notifications =
          snapshot.val() || {};

        renderNotifications();

        updateStatistics();

      },
      error => {

        console.error(
          "Firebase error:",
          error
        );

        list.innerHTML = `
          <div class="error-state">
            Failed to load notifications.
          </div>
        `;

      }
    );

  }


  /* =========================
     FILTER
  ========================= */

  function getFilteredNotifications() {

    const query =
      search.value
        .trim()
        .toLowerCase();


    const type =
      typeFilter.value;

    const status =
      statusFilter.value;


    return Object.entries(
      notifications
    )

      .filter(
        ([id, item]) => {

          const searchable =
            `
              ${item.title || ""}
              ${item.message || ""}
              ${item.type || ""}
              ${item.recipientType || ""}
            `
              .toLowerCase();


          if (
            query &&
            !searchable.includes(
              query
            )
          ) {

            return false;

          }


          if (
            type !== "all" &&
            item.type !== type
          ) {

            return false;

          }


          if (
            status === "unread" &&
            item.read === true
          ) {

            return false;

          }


          if (
            status === "read" &&
            item.read !== true
          ) {

            return false;

          }


          if (
            status === "important" &&
            item.priority !==
              "important" &&
            item.priority !==
              "urgent"
          ) {

            return false;

          }


          return true;

        }
      )

      .sort(
        (
          [, a],
          [, b]
        ) =>
          (b.createdAt || 0) -
          (a.createdAt || 0)
      );

  }


  /* =========================
     RENDER
  ========================= */

  function renderNotifications() {

    const entries =
      getFilteredNotifications();


    if (!entries.length) {

      list.innerHTML = `

        <div class="empty-state">

          <div class="empty-icon">
            🔔
          </div>

          <h3>
            No notifications found
          </h3>

          <p>
            There are no notifications
            matching your filters.
          </p>

        </div>

      `;

      return;

    }


    list.innerHTML =
      entries
        .map(
          ([id, item]) => {

            const unread =
              item.read !== true;

            const important =
              item.priority ===
                "important" ||
              item.priority ===
                "urgent";


            return `

              <article
                class="
                  notification-card
                  ${unread ? "unread" : ""}
                  ${important ? "important" : ""}
                "
              >

                <div
                  class="notification-icon"
                >

                  ${
                    item.type === "payment"
                      ? "💳"
                      : item.type === "course"
                      ? "📚"
                      : item.type === "security"
                      ? "🔐"
                      : item.type === "marketing"
                      ? "📢"
                      : "🔔"
                  }

                </div>


                <div
                  class="notification-body"
                >

                  <div
                    class="notification-top"
                  >

                    <h3>
                      ${escapeHtml(
                        item.title ||
                        "Notification"
                      )}
                    </h3>


                    <span
                      class="notification-type"
                    >
                      ${escapeHtml(
                        item.type ||
                        "system"
                      )}
                    </span>

                  </div>


                  <p>
                    ${escapeHtml(
                      item.message ||
                      ""
                    )}
                  </p>


                  <div
                    class="notification-meta"
                  >

                    <span>
                      👤
                      ${escapeHtml(
                        item.recipientType ||
                        "all"
                      )}
                    </span>

                    <span>
                      ${
                        important
                          ? "⚠️ Important"
                          : "Normal"
                      }
                    </span>

                    <span>
                      ${formatDate(
                        item.createdAt
                      )}
                    </span>

                  </div>


                  <div
                    class="notification-actions"
                  >

                    <button
                      type="button"
                      data-action="toggle-read"
                      data-id="${escapeHtml(
                        id
                      )}"
                    >

                      ${
                        unread
                          ? "✓ Mark Read"
                          : "↩ Mark Unread"
                      }

                    </button>


                    <button
                      type="button"
                      data-action="edit"
                      data-id="${escapeHtml(
                        id
                      )}"
                    >
                      ✏️ Edit
                    </button>


                    <button
                      type="button"
                      class="delete-btn"
                      data-action="delete"
                      data-id="${escapeHtml(
                        id
                      )}"
                    >
                      🗑 Delete
                    </button>

                  </div>

                </div>

              </article>

            `;

          }
        )
        .join("");

  }


  /* =========================
     STATISTICS
  ========================= */

  function updateStatistics() {

    const values =
      Object.values(
        notifications
      );


    document.getElementById(
      "totalNotifications"
    ).textContent =
      values.length;


    document.getElementById(
      "unreadNotifications"
    ).textContent =
      values.filter(
        item =>
          item.read !== true
      ).length;


    document.getElementById(
      "readNotifications"
    ).textContent =
      values.filter(
        item =>
          item.read === true
      ).length;


    document.getElementById(
      "importantNotifications"
    ).textContent =
      values.filter(
        item =>
          item.priority ===
            "important" ||
          item.priority ===
            "urgent"
      ).length;

  }


  /* =========================
     OPEN MODAL
  ========================= */

  function openModal(
    id = null
  ) {

    editingId = id;


    if (id) {

      const item =
        notifications[id];

      if (!item) return;


      document.getElementById(
        "notificationModalTitle"
      ).textContent =
        "Edit Notification";


      document.getElementById(
        "notificationTitle"
      ).value =
        item.title || "";


      document.getElementById(
        "notificationMessage"
      ).value =
        item.message || "";


      document.getElementById(
        "notificationType"
      ).value =
        item.type || "system";


      document.getElementById(
        "recipientType"
      ).value =
        item.recipientType ||
        "all";


      document.getElementById(
        "notificationUserId"
      ).value =
        item.userId || "";


      document.getElementById(
        "notificationPriority"
      ).value =
        item.priority ||
        "normal";


      document.getElementById(
        "notificationLink"
      ).value =
        item.link || "";

    } else {

      form.reset();


      document.getElementById(
        "notificationModalTitle"
      ).textContent =
        "Add Notification";

    }


    updateSpecificUserField();


    modal.style.display =
      "flex";

  }


  /* =========================
     CLOSE MODAL
  ========================= */

  function closeModal() {

    modal.style.display =
      "none";

    form.reset();

    editingId = null;

    updateSpecificUserField();

  }


  /* =========================
     SPECIFIC USER
  ========================= */

  function updateSpecificUserField() {

    const type =
      document.getElementById(
        "recipientType"
      ).value;


    const wrapper =
      document.getElementById(
        "specificUserWrapper"
      );


    wrapper.style.display =
      type === "specific"
        ? "block"
        : "none";

  }


  document
    .getElementById(
      "recipientType"
    )
    .addEventListener(
      "change",
      updateSpecificUserField
    );


  /* =========================
     SAVE
  ========================= */

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const title =
        document.getElementById(
          "notificationTitle"
        ).value.trim();


      const message =
        document.getElementById(
          "notificationMessage"
        ).value.trim();


      const type =
        document.getElementById(
          "notificationType"
        ).value;


      const recipientType =
        document.getElementById(
          "recipientType"
        ).value;


      const userId =
        document.getElementById(
          "notificationUserId"
        ).value.trim();


      const priority =
        document.getElementById(
          "notificationPriority"
        ).value;


      const link =
        document.getElementById(
          "notificationLink"
        ).value.trim();


      if (!title || !message) {

        alert(
          "Title and message are required."
        );

        return;

      }


      if (
        recipientType ===
          "specific" &&
        !userId
      ) {

        alert(
          "Enter the specific user ID."
        );

        return;

      }


      const data = {

        title,

        message,

        type,

        recipientType,

        priority,

        link,

        read: false,

        updatedAt:
          Date.now()

      };


      if (
        recipientType ===
        "specific"
      ) {

        data.userId =
          userId;

      }


      try {

        if (editingId) {

          await update(
            ref(
              database,
              `notifications/${editingId}`
            ),
            data
          );

        } else {

          const notificationRef =
            push(
              ref(
                database,
                "notifications"
              )
            );


          data.createdAt =
            Date.now();


          await set(
            notificationRef,
            data
          );

        }


        closeModal();

      } catch (error) {

        console.error(
          "Save notification error:",
          error
        );

        alert(
          "Failed to save notification."
        );

      }

    }
  );


  /* =========================
     ACTIONS
  =======
  /* =========================
     ACTIONS
  ========================= */

  list.addEventListener(
    "click",
    async (event) => {

      const button =
        event.target.closest(
          "[data-action]"
        );

      if (!button) {
        return;
      }

      const action =
        button.dataset.action;

      const id =
        button.dataset.id;

      if (!id || !notifications[id]) {
        return;
      }


      /* =========================
         MARK READ / UNREAD
      ========================= */

      if (
        action === "toggle-read"
      ) {

        try {

          await update(
            ref(
              database,
              `notifications/${id}`
            ),
            {
              read:
                notifications[id].read !== true,

              updatedAt:
                Date.now()
            }
          );

        } catch (error) {

          console.error(
            "Read status error:",
            error
          );

          alert(
            "Failed to update notification status."
          );

        }

        return;
      }


      /* =========================
         EDIT
      ========================= */

      if (
        action === "edit"
      ) {

        openModal(id);

        return;
      }


      /* =========================
         DELETE
      ========================= */

      if (
        action === "delete"
      ) {

        const confirmed =
          window.confirm(
            "Are you sure you want to delete this notification?"
          );

        if (!confirmed) {
          return;
        }

        try {

          await remove(
            ref(
              database,
              `notifications/${id}`
            )
          );

        } catch (error) {

          console.error(
            "Delete notification error:",
            error
          );

          alert(
            "Failed to delete notification."
          );

        }

        return;
      }

    }
  );


  /* =========================
     ADD NOTIFICATION
  ========================= */

  const addNotificationBtn =
    document.getElementById(
      "addNotificationBtn"
    );

  if (addNotificationBtn) {

    addNotificationBtn.addEventListener(
      "click",
      () => {

        openModal();

      }
    );

  }


  /* =========================
     CLOSE MODAL
  ========================= */

  const closeNotificationModal =
    document.getElementById(
      "closeNotificationModal"
    );

  const cancelNotificationBtn =
    document.getElementById(
      "cancelNotificationBtn"
    );


  if (closeNotificationModal) {

    closeNotificationModal.addEventListener(
      "click",
      closeModal
    );

  }


  if (cancelNotificationBtn) {

    cancelNotificationBtn.addEventListener(
      "click",
      closeModal
    );

  }


  /* =========================
     OUTSIDE MODAL CLICK
  ========================= */

  if (modal) {

    modal.addEventListener(
      "click",
      event => {

        if (
          event.target === modal
        ) {

          closeModal();

        }

      }
    );

  }


  /* =========================
     ESC KEY
  ========================= */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape" &&
        modal &&
        modal.style.display !== "none"
      ) {

        closeModal();

      }

    }
  );


  /* =========================
     SEARCH
  ========================= */

  if (search) {

    search.addEventListener(
      "input",
      () => {

        renderNotifications();

      }
    );

  }


  /* =========================
     TYPE FILTER
  ========================= */

  if (typeFilter) {

    typeFilter.addEventListener(
      "change",
      () => {

        renderNotifications();

      }
    );

  }


  /* =========================
     STATUS FILTER
  ========================= */

  if (statusFilter) {

    statusFilter.addEventListener(
      "change",
      () => {

        renderNotifications();

      }
    );

  }


  /* =========================
     AUTHENTICATION
  ========================= */

  onAuthStateChanged(
    auth,
    user => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }


      console.log(
        "Authenticated:",
        user.uid
      );


      loadNotifications();

    }
  );


  /* =========================
     FIREBASE ERROR HANDLING
  ========================= */

  window.addEventListener(
    "unhandledrejection",
    event => {

      console.error(
        "Unhandled Firebase error:",
        event.reason
      );

    }
  );


  /* =========================
     INITIAL STATE
  ========================= */

  updateStatistics();
</script>

</body>
</html>
