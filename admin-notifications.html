<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Notifications | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
header{
  background:#111827;
  color:white;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.container{
  max-width:1200px;
  margin:auto;
  padding:22px
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px
}
.card{
  background:white;
  border-radius:14px;
  padding:18px;
  box-shadow:0 3px 15px #00000010
}
.stat{
  font-size:28px;
  font-weight:bold;
  margin-top:8px
}
.form{
  display:grid;
  gap:12px
}
input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #d8dee9;
  border-radius:9px;
  font-size:15px
}
textarea{min-height:110px;resize:vertical}
button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold
}
.primary{background:#2563eb;color:white}
.danger{background:#dc2626;color:white}
.secondary{background:#e5e7eb;color:#111827}
.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}
.toolbar{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:10px;
  margin-bottom:15px
}
.notification{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  margin-bottom:10px
}
.notification h3{
  margin:0 0 7px
}
.meta{
  color:#6b7280;
  font-size:13px
}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#eef2ff;
  color:#3730a3;
  font-size:12px
}
#loading{
  text-align:center;
  padding:50px
}
.hidden{display:none}
@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .toolbar{grid-template-columns:1fr}
}
@media(max-width:500px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <strong>🔔 LetsStudy Pro — Notifications</strong>
  <button class="secondary" onclick="logout()">Logout</button>
</header>

<div id="loading">
  Loading Notifications...
</div>

<main id="app" class="container hidden">

  <div class="grid">

    <div class="card">
      <div>Total</div>
      <div id="totalCount" class="stat">0</div>
    </div>

    <div class="card">
      <div>Unread</div>
      <div id="unreadCount" class="stat">0</div>
    </div>

    <div class="card">
      <div>Read</div>
      <div id="readCount" class="stat">0</div>
    </div>

    <div class="card">
      <div>Recipients</div>
      <div id="recipientCount" class="stat">0</div>
    </div>

  </div>


  <section class="card">

    <h2 id="formTitle">
      Create Notification
    </h2>

    <form id="notificationForm" class="form">

      <input
        id="title"
        placeholder="Notification title"
        required
      >

      <textarea
        id="message"
        placeholder="Notification message"
        required
      ></textarea>

      <select id="type">

        <option value="general">
          General
        </option>

        <option value="course">
          Course
        </option>

        <option value="payment">
          Payment
        </option>

        <option value="community">
          Community
        </option>

        <option value="system">
          System
        </option>

        <option value="announcement">
          Announcement
        </option>

      </select>

      <select id="audience">

        <option value="all">
          All Users
        </option>

        <option value="student">
          Students
        </option>

        <option value="instructor">
          Instructors
        </option>

        <option value="admin">
          Admins
        </option>

        <option value="user">
          Specific User
        </option>

      </select>

      <input
        id="userId"
        placeholder="Specific User UID (optional)"
      >

      <input
        id="link"
        placeholder="Optional link e.g. course.html"
      >

      <div class="actions">

        <button
          class="primary"
          type="submit"
        >
          <span id="submitText">
            Send Notification
          </span>
        </button>

        <button
          type="button"
          class="secondary"
          onclick="resetForm()"
        >
          Clear
        </button>

      </div>

    </form>

  </section>


  <br>


  <section class="card">

    <div class="toolbar">

      <input
        id="search"
        placeholder="Search notifications..."
      >

      <select id="filter">

        <option value="all">
          All Types
        </option>

        <option value="general">
          General
        </option>

        <option value="course">
          Course
        </option>

        <option value="payment">
          Payment
        </option>

        <option value="community">
          Community
        </option>

        <option value="system">
          System
        </option>

        <option value="announcement">
          Announcement
        </option>

      </select>

    </div>

    <div id="notificationList"></div>

  </section>

</main>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   FIREBASE
===================================== */

const firebaseConfig = {
  apiKey:"AIzaSyBcOYDfAVKXbjsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId:"G-85B7V5H5J0"
};

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================
   STATE
===================================== */

let notifications = [];

let editingId = null;

let currentUser = null;


/* =====================================
   ELEMENTS
===================================== */

const loading =
  document.getElementById("loading");

const adminApp =
  document.getElementById("app");

const form =
  document.getElementById(
    "notificationForm"
  );

const list =
  document.getElementById(
    "notificationList"
  );


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user || null;

    loading.classList.add(
      "hidden"
    );

    adminApp.classList.remove(
      "hidden"
    );

    await loadNotifications();

  }
);


/* =====================================
   LOAD
===================================== */

async function loadNotifications(){

  try{

    const snap =
      await getDocs(
        collection(
          db,
          "notifications"
        )
      );

    notifications =
      snap.docs.map(
        item => ({

          id:item.id,

          ...item.data()

        })
      );

    notifications.sort(
      (a,b) => {

        const x =
          a.createdAt?.seconds || 0;

        const y =
          b.createdAt?.seconds || 0;

        return y - x;

      }
    );

    render();

    updateStats();

  }
  catch(error){

    console.error(error);

    list.innerHTML =
      `<div class="notification">
        Failed to load notifications.
      </div>`;

  }

}


/* =====================================
   STATS
===================================== */

function updateStats(){

  const total =
    notifications.length;

  const unread =
    notifications.filter(
      n => n.read !== true
    ).length;

  const read =
    notifications.filter(
      n => n.read === true
    ).length;

  const recipients =
    new Set(
      notifications
        .map(n =>
          n.userId ||
          n.recipientId ||
          n.audience
        )
    ).size;

  document.getElementById(
    "totalCount"
  ).textContent = total;

  document.getElementById(
    "unreadCount"
  ).textContent = unread;

  document.getElementById(
    "readCount"
  ).textContent = read;

  document.getElementById(
    "recipientCount"
  ).textContent = recipients;

}


/* =====================================
   RENDER
===================================== */

function render(){

  const search =
    document.getElementById(
      "search"
    ).value
      .toLowerCase()
      .trim();

  const filter =
    document.getElementById(
      "filter"
    ).value;


  const filtered =
    notifications.filter(
      n => {

        const text =
          (
            n.title || ""
          ).toLowerCase()
          + " " +
          (
            n.message || ""
          ).toLowerCase();

        const matchesSearch =
          !search ||
          text.includes(search);

        const matchesType =
          filter === "all" ||
          n.type === filter;

        return (
          matchesSearch &&
          matchesType
        );

      }
    );


  if(!filtered.length){

    list.innerHTML =
      `<div class="notification">
        No notifications found.
      </div>`;

    return;

  }


  list.innerHTML =
    filtered.map(
      n => `

      <div class="notification">

        <h3>
          ${escapeHTML(
            n.title ||
            "Untitled"
          )}
        </h3>

        <p>
          ${escapeHTML(
            n.message ||
            ""
          )}
        </p>

        <div class="meta">

          <span class="badge">
            ${escapeHTML(
              n.type ||
              "general"
            )}
          </span>

          &nbsp;

          Audience:
          ${escapeHTML(
            n.audience ||
            "all"
          )}

          &nbsp; • &nbsp;

          ${n.read === true
            ? "Read"
            : "Unread"}

        </div>

        <br>

        <div class="actions">

          <button
            class="secondary"
            onclick="editNotification('${n.id}')"
          >
            Edit
          </button>

          <button
            class="secondary"
            onclick="markRead('${n.id}')"
          >
            ${n.read === true
              ? "Mark Unread"
              : "Mark Read"}
          </button>

          <button
            class="danger"
            onclick="deleteNotification('${n.id}')"
          >
            Delete
          </button>

        </div>

      </div>

      `
    ).join("");

}


/* =====================================
   CREATE / UPDATE
===================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const title =
      document.getElementById(
        "title"
      ).value.trim();

    const message =
      document.getElementById(
        "message"
      ).value.trim();

    const type =
      document.getElementById(
        "type"
      ).value;

    const audience =
      document.getElementById(
        "audience"
      ).value;

    const userId =
      document.getElementById(
        "userId"
      ).value.trim();

    const link =
      document.getElementById(
        "link"
      ).value.trim();


    if(!title || !message){

      alert(
        "Title and message are required."
      );

      return;

    }


    const data = {

      title,

      message,

      type,

      audience,

      userId:
        userId || null,

      link:
        link || null,

      read:false,

      updatedAt:
        serverTimestamp()

    };


    try{

      if(editingId){

        await updateDoc(
          doc(
            db,
            "notifications",
            editingId
          ),
          data
        );

        alert(
          "Notification updated."
        );

      }
      else{

        await addDoc(
          collection(
            db,
            "notifications"
          ),
          {

            ...data,

            createdAt:
              serverTimestamp(),

            createdBy:
              currentUser?.uid ||
              "admin"

          }
        );

        alert(
          "Notification created."
        );

      }


      resetForm();

      await loadNotifications();

    }
    catch(error){

      console.error(error);

      alert(
        "Failed: " +
        error.message
      );

    }

  }
);


/* =====================================
   EDIT
===================================== */

window.editNotification =
  function(id){

    const n =
      notifications.find(
        x => x.id === id
      );

    if(!n) return;


    editingId = id;


    document.getElementById(
      "title"
    ).value =
      n.title || "";

    document.getElementById(
      "message"
    ).value =
      n.message || "";

    document.getElementById(
      "type"
    ).value =
      n.type || "general";

    document.getElementById(
      "audience"
    ).value =
      n.audience || "all";

    document.getElementById(
      "userId"
    ).value =
      n.userId || "";

    document.getElementById(
      "link"
    ).value =
      n.link || "";

    document.getElementById(
      "formTitle"
    ).textContent =
      "Edit Notification";

    document.getElementById(
      "submitText"
    ).textContent =
      "Update Notification";

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  };


/* =====================================
   DELETE
===================================== */

window.deleteNotification =
  async function(id){

    if(
      !confirm(
        "Delete this notification?"
      )
    ){

      return;

    }


    try{

      await deleteDoc(
        doc(
          db,
          "notifications",
          id
        )
      );

      await loadNotifications();

    }
    catch(error){

      console.error(error);

      alert(
        "Delete failed."
      );

    }

  };


/* =====================================
   READ / UNREAD
===================================== */

window.markRead =
  async function(id){

    const n =
      notifications.find(
        x => x.id === id
      );

    if(!n) return;


    try{

      await updateDoc(
        doc(
          db,
          "notifications",
          id
        ),
        {

          read:
            n.read !== true,

          updatedAt:
            serverTimestamp()

        }
      );

      await loadNotifications();

    }
    catch(error){

      console.error(error);

    }

  };


/* =====================================
   RESET
===================================== */

window.resetForm =
  function(){

    editingId = null;

    form.reset();

    document.getElementById(
      "formTitle"
    ).textContent =
      "Create Notification";

    document.getElementById(
      "submitText"
    ).textContent =
      "Send Notification";

  };


/* =====================================
   SEARCH
===================================== */

document.getElementById(
  "search"
).addEventListener(
  "input",
  render
);


document.getElementById(
  "filter"
).addEventListener(
  "change",
  render
);


/* =====================================
   LOGOUT
===================================== */

window.logout =
  async function(){

    await signOut(auth);

    location.href =
      "login.html";

  };

</script>

</body>
</html>
