
  <!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Order | LetsStudy Pro</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    .page {
      max-width: 1100px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .header p {
      color: #687386;
    }

    .back-btn {
      text-decoration: none;
      background: #fff;
      color: #172033;
      border: 1px solid #e1e6ee;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: 600;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow:
        0 6px 25px rgba(15, 23, 42, .04);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    .order-id {
      color: #687386;
      margin-top: 5px;
      word-break: break-all;
    }

    .status {
      display: inline-flex;
      padding: 7px 13px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .status-pending {
      background: #fff7d6;
      color: #956900;
    }

    .status-paid,
    .status-approved,
    .status-completed {
      background: #dcfce7;
      color: #166534;
    }

    .status-processing {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-cancelled,
    .status-failed {
      background: #fee2e2;
      color: #b91c1c;
    }

    .payment-box {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    .info {
      background: #f8fafc;
      border-radius: 12px;
      padding: 15px;
    }

    .info small {
      display: block;
      color: #748095;
      margin-bottom: 6px;
    }

    .info strong {
      word-break: break-word;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .items {
      display: flex;
      flex-direction: column;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #edf0f4;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-name {
      font-weight: 700;
    }

    .item-meta {
      color: #737d8e;
      font-size: 13px;
      margin-top: 4px;
    }

    .item-price {
      font-weight: 700;
      white-space: nowrap;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-top: 18px;
      margin-top: 10px;
      border-top: 2px solid #edf0f4;
      font-size: 20px;
      font-weight: 800;
    }

    .timeline {
      position: relative;
      padding-left: 25px;
    }

    .timeline-item {
      position: relative;
      padding: 0 0 25px 20px;
      border-left: 2px solid #e2e8f0;
    }

    .timeline-item:last-child {
      border-left: 0;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #cbd5e1;
      left: -6px;
      top: 4px;
    }

    .timeline-item.active::before {
      background: #22c55e;
    }

    .timeline-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .timeline-item span {
      color: #737d8e;
      font-size: 13px;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 70px 20px;
      color: #697386;
    }

    .error {
      color: #b91c1c;
    }

    .success-message {
      background: #ecfdf5;
      color: #166534;
      border: 1px solid #bbf7d0;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .warning-message {
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 20px;
    }

    @media (max-width: 700px) {

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .order-top {
        flex-direction: column;
      }

      .payment-box {
        grid-template-columns: 1fr;
      }

      .total-row {
        font-size: 17px;
      }

    }

  </style>

</head>

<body>


<main class="page">

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div>

      <h1>
        Order Details
      </h1>

      <p>
        Track your payment and order status.
      </p>

    </div>

    <a
      href="dashboard.html"
      class="back-btn"
    >
      ← Dashboard
    </a>

  </header>


  <!-- =========================
       CONTENT
  ========================== -->

  <div id="orderContainer">

    <div class="loading">
      Loading order...
    </div>

  </div>

</main>


<script type="module">

  /* =========================
     FIREBASE
  ========================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    getDatabase,
    ref,
    onValue
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  /* =========================
     FIREBASE CONFIG
  ========================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"

  };


  /* =========================
     INITIALIZE
  ========================== */

  const app =
    initializeApp(
      firebaseConfig
    );

  const auth =
    getAuth(app);

  const database =
    getDatabase(app);


  /* =========================
     ELEMENT
  ========================== */

  const container =
    document.getElementById(
      "orderContainer"
    );


  /* =========================
     HELPERS
  ========================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function money(value) {

    return Number(
      value || 0
    ).toLocaleString();

  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return "-";
    }

    return date.toLocaleString();

  }


  function normalizeStatus(value) {

    return String(
      value ||
      "pending"
    )
      .toLowerCase()
      .trim();

  }


  /* =========================
     GET ORDER ID
  ========================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const orderId =
    params.get("id") ||
    params.get("orderId");


  /* =========================
     RENDER
  ========================== */

  function renderOrder(
    id,
    order
  ) {

    if (!order) {

      container.innerHTML = `

        <div class="empty">

          <h2>
            Order not found
          </h2>

          <p>
            This order does not exist
            or is no longer available.
          </p>

        </div>

      `;

      return;

    }


    const status =
      order.approved === true
        ? "approved"
        : normalizeStatus(
            order.status
          );


    const paymentStatus =
      normalizeStatus(
        order.paymentStatus ||
        order.payment_status
      );


    const items =
      Array.isArray(
        order.items
      )
        ? order.items
        : order.items
        ? Object.values(
            order.items
          )
        : [];


    const total =
      order.total ??
      order.amount ??
      order.price ??
      0;


    const isApproved =
      order.approved === true ||
      status === "approved";


    const customerName =
      order.customerName ||
      order.name ||
      order.userName ||
      "Customer";


    container.innerHTML = `

      ${
        isApproved
          ? `
            <div class="success-message">

              <strong>
                ✓ Payment approved
              </strong>

              <div>
                Your order has been
                automatically approved.
              </div>

            </div>
          `
          : paymentStatus === "pending"
          ? `
            <div class="warning-message">

              <strong>
                Payment pending
              </strong>

              <div>
                Your order is waiting
                for payment confirmation.
              </div>

            </div>
          `
          : ""
      }


      <!-- ORDER SUMMARY -->

      <section class="card">

        <div class="order-top">

          <div>

            <h2>
              Order #${escapeHtml(
                order.orderId ||
                id
              )}
            </h2>

            <div class="order-id">

              Created:
              ${formatDate(
                order.createdAt ||
                order.timestamp
              )}

            </div>

          </div>


          <span
            class="
              status
              status-${escapeHtml(
                status
              )}
            "
          >
            ${escapeHtml(
              status
            )}
          </span>

        </div>


        <div class="payment-box">

          <div class="info">

            <small>
              Customer
            </small>

            <strong>
              ${escapeHtml(
                customerName
              )}
            </strong>

          </div>


          <div class="info">

            <small>
              Payment
            </small>

            <strong>
              ${escapeHtml(
                paymentStatus
              )}
            </strong>

          </div>


          <div class="info">

            <small>
              Payment Method
            </small>

            <strong>
              ${escapeHtml(
                order.paymentMethod ||
                "-"
              )}
            </strong>

          </div>

        </div>

      </section>


      <!-- ITEMS -->

      <section class="card">

        <h2 class="section-title">
          Order Items
        </h2>


        <div class="items">

          ${
            items.length
              ? items.map(
                  item => `

                    <div
                      class="item"
                    >

                      <div>

                        <div
                          class="item-name"
                        >
                          ${escapeHtml(
                            item.name ||
                            item.title ||
                            item.productName ||
                            "Item"
                          )}
                        </div>


                        <div
                          class="item-meta"
                        >

                          Quantity:
                          ${
                            item.quantity ||
                            1
                          }

                        </div>

                      </div>


                      <div
                        class="item-price"
                      >

                        ${money(
                          item.total ??
                          item.price ??
                          0
                        )}

                      </div>

                    </div>

                  `
                ).join("")
              : `
                <div
                  class="empty"
                  style="padding:25px;"
                >
                  No items found.
                </div>
              `
          }

        </div>


        <div class="total-row">

          <span>
            Total
          </span>

          <span>
            ${money(
              total
            )}
          </span>

        </div>

      </section>


      <!-- STATUS TIMELINE -->

      <section class="card">

        <h2 class="section-title">
          Order Progress
        </h2>


        <div class="timeline">


          <div
            class="
              timeline-item
              active
            "
          >

            <strong>
              Order Created
            </strong>

            <span>
              ${formatDate(
                order.createdAt ||
                order.timestamp
              )}
            </span>

          </div>


          <div
            class="
              timeline-item
              ${
                paymentStatus === "paid" ||
                paymentStatus === "approved" ||
                isApproved
                  ? "active"
                  : ""
              }
            "
          >

            <strong>
              Payment Confirmed
            </strong>

            <span>
              ${
                paymentStatus === "paid" ||
                paymentStatus === "approved" ||
                isApproved
                  ? "Payment received"
                  : "Waiting for payment"
              }
            </span>

          </div>


          <div
            class="
              timeline-item
              ${
                isApproved
                  ? "active"
                  : ""
              }
            "
          >

            <strong>
              Order Approved
            </strong>

            <span>

              ${
                isApproved
                  ? formatDate(
                      order.approvedAt ||
                      order.updatedAt
                    )
                  : "Waiting for payment confirmation"
              }

            </span>

          </div>


          <div
            class="
              timeline-item
              ${
                status === "completed"
                  ? "active"
                  : ""
              }
            "
          >

            <strong>
              Completed
            </strong>

            <span>

              ${
                status === "completed"
                  ? "Order completed"
                  : "Not completed yet"
              }

            </span>

          </div>

        </div>

      </section>

    `;

  }


  /* =========================
     LOAD ORDER
  ========================== */

  function loadOrder(
    user
  ) {

    if (!orderId) {

      container.innerHTML = `

        <div class="empty">

          <h2>
            No order selected
          </h2>

          <p>
            Open this page using:
            order.html?id=ORDER_ID
          </p>

        </div>

      `;

      return;

    }


    const orderRef =
      ref(
        database,
        `orders/${orderId}`
      );


    onValue(
      orderRef,
      snapshot => {

        const order =
          snapshot.val();


        if (!order) {

          renderOrder(
            orderId,
            null
          );

          return;

        }


        /*
         * Security check:
         * The logged-in user should
         * only see their own order.
         */

        if (
          order.userId &&
          order.userId !== user.uid
        ) {

          container.innerHTML = `

            <div class="error">

              <h2>
                Access denied
              </h2>

              <p>
                This order does not
                belong to your account.
              </p>

            </div>

          `;

          return;

        }


        renderOrder(
          orderId,
          order
        );

      },

      error => {

        console.error(
          "Order error:",
          error
        );

        container.innerHTML = `

          <div class="error">

            Failed to load your order.

          </div>

        `;

      }
    );

  }


  /* =========================
     AUTHENTICATION
  ========================== */

  onAuthStateChanged(
    auth,
    user => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }


      loadOrder(
        user
      );

    }
  );

</script>

</body>
</html>
