<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid #e2e8f0;
}

.nav{
  max-width:1250px;
  min-height:70px;
  margin:auto;
  padding:0 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#0b57d0;
  font-size:20px;
  font-weight:900;
}

.back{
  color:#475569;
  text-decoration:none;
  font-weight:700;
}

.container{
  width:min(1250px,92%);

}

h1{

}

.subtitle{

}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:17px;
  padding:22px;
}

.stat strong{
  display:block;
  font-size:28px;
  color:#0b57d0;
}

.stat span{
  color:#64748b;
  font-size:13px;
}

.toolbar{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:18px;

  display:flex;
  gap:12px;

  margin-bottom:20px;
}

input,
select{
  width:100%;
  min-height:45px;

  padding:10px 13px;

  border:1px solid #cbd5e1;
  border-radius:10px;

  background:#fff;
  outline:none;
}

input:focus,
select:focus{
  border-color:#0b57d0;
}

.btn{
  border:0;
  border-radius:10px;

  min-height:45px;
  padding:0 18px;

  background:#0b57d0;
  color:#fff;

  font-weight:800;
  cursor:pointer;
}

.table-box{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  overflow:auto;
}

table{
  width:100%;
  min-width:1100px;
  border-collapse:collapse;
}

th,
td{
  padding:15px;

  border-bottom:1px solid #e2e8f0;

  text-align:left;
}

th{
  background:#f8fafc;
  color:#475569;

  font-size:12px;
  text-transform:uppercase;
}

td{
  font-size:14px;
}

.badge{
  display:inline-flex;

  padding:5px 10px;

  border-radius:999px;

  font-size:11px;
  font-weight:800;
}

.completed{
  background:#dcfce7;
  color:#166534;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.cancelled{
  background:#fee2e2;
  color:#991b1b;
}

.processing{
  background:#dbeafe;
  color:#1d4ed8;
}

.refunded{
  background:#e0e7ff;
  color:#3730a3;
}

.actions{
  display:flex;
  gap:6px;
}

.action{
  border:0;
  border-radius:7px;

  padding:7px 10px;

  cursor:pointer;

  font-size:12px;
  font-weight:700;
}

.view{
  background:#e0f2fe;
  color:#0369a1;
}

.status{
  background:#f1f5f9;
  color:#334155;
}

.empty{
  text-align:center;
  padding:45px;
  color:#64748b;
}

.amount{
  font-weight:800;
  white-space:nowrap;
}

.modal{
  display:none;

  position:fixed;
  inset:0;

  z-index:999;

  background:rgba(15,23,42,.65);

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal-box{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;

  background:#fff;

  border-radius:20px;

  padding:25px;

  position:relative;
}

.close{
  position:absolute;

  top:15px;
  right:15px;

  width:35px;
  height:35px;

  border:0;
  border-radius:50%;

  background:#f1f5f9;

  cursor:pointer;

  font-size:20px;
}

.detail{
  padding:13px 0;
  border-bottom:1px solid #e2e8f0;
}

.detail strong{
  display:block;

  color:#64748b;

  font-size:12px;

  margin-bottom:4px;
}

.item{
  padding:10px;

  margin-top:8px;

  background:#f8fafc;

  border-radius:10px;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    flex-direction:column;
  }

  h1{
    font-size:27px;
  }

}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      LetsStudy Pro Admin
    </div>

    <a
      href="admin.html"
      class="back">

      ← Admin Dashboard

    </a>

  </div>

</header>


<main class="container">

  <h1>
    Order Management
  </h1>

  <p class="subtitle">
    View, search and manage customer orders.
  </p>


  <!-- =========================
       STATISTICS
  ========================= -->

  <section class="stats">

    <div class="stat">

      <strong id="totalOrders">
        0
      </strong>

      <span>
        Total Orders
      </span>

    </div>


    <div class="stat">

      <strong id="completedOrders">
        0
      </strong>

      <span>
        Completed
      </span>

    </div>


    <div class="stat">

      <strong id="pendingOrders">
        0
      </strong>

      <span>
        Pending
      </span>

    </div>


    <div class="stat">

      <strong id="cancelledOrders">
        0
      </strong>

      <span>
        Cancelled
      </span>

    </div>

  </section>


  <!-- =========================
       FILTERS
  ========================= -->

  <section class="toolbar">

    <input
      id="searchOrder"
      type="search"
      placeholder="Search order ID, email or customer...">


    <select id="statusFilter">

      <option value="">
        All Statuses
      </option>

      <option value="completed">
        Completed
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="processing">
        Processing
      </option>

      <option value="cancelled">
        Cancelled
      </option>

      <option value="refunded">
        Refunded
      </option>

    </select>


    <button
      class="btn"
      onclick="loadOrders()">

      Refresh

    </button>

  </section>


  <!-- =========================
       ORDERS
  ========================= -->

  <section class="table-box">

    <table>

      <thead>

        <tr>

          <th>
            Order ID
          </th>

          <th>
            Customer
          </th>

          <th>
            Items
          </th>

          <th>
            Amount
          </th>

          <th>
            Status
          </th>

          <th>
            Date
          </th>

          <th>
            Actions
          </th>

        </tr>

      </thead>


      <tbody id="ordersTable">

        <tr>

          <td
            colspan="7"
            class="empty">

            Loading orders...

          </td>

        </tr>

      </tbody>

    </table>

  </section>

</main>


<!-- =========================
     ORDER MODAL
========================= -->

<div
  id="orderModal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeOrderModal()">

      ×

    </button>

    <h2>
      Order Details
    </h2>

    <div
      id="orderDetails"
      style="margin-top:20px;">

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro.firebaseapp.com",

  projectId:
    "let-s-study-pro",

  storageBucket:
    "let-s-study-pro.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


let orders = [];


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

  const table =
    document.getElementById(
      "ordersTable"
    );


  table.innerHTML = `
    <tr>
      <td colspan="7"
          class="empty">

        Loading orders...

      </td>
    </tr>
  `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "orders"
        )
      );


    orders = [];


    snapshot.forEach(
      item => {

        orders.push({

          id:
            item.id,

          ...item.data()

        });

      }
    );


    updateStatistics();

    applyFilters();


  }catch(error){

    console.error(
      "Orders error:",
      error
    );


    table.innerHTML = `
      <tr>
        <td colspan="7"
            class="empty">

          Failed to load orders.

        </td>
      </tr>
    `;

  }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

  const total =
    orders.length;


  const completed =
    orders.filter(
      x =>
        normalizeStatus(
          x.status
        ) === "completed"
    ).length;


  const pending =
    orders.filter(
      x =>
        normalizeStatus(
          x.status
        ) === "pending"
    ).length;


  const cancelled =
    orders.filter(
      x =>
        normalizeStatus(
          x.status
        ) === "cancelled"
    ).length;


  document.getElementById(
    "totalOrders"
  ).textContent =
    total;


  document.getElementById(
    "completedOrders"
  ).textContent =
    completed;


  document.getElementById(
    "pendingOrders"
  ).textContent =
    pending;


  document.getElementById(
    "cancelledOrders"
  ).textContent =
    cancelled;

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(status){

  const value =
    String(
      status || "pending"
    )
    .toLowerCase()
    .trim();


  if(
    value === "complete" ||
    value === "paid" ||
    value === "success" ||
    value === "successful"
  ){

    return "completed";

  }


  if(
    value === "cancel" ||
    value === "canceled"
  ){

    return "cancelled";

  }


  return value;

}


/* =====================================================
   FILTERS
===================================================== */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchOrder"
      )
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const filtered =
    orders.filter(
      order => {

        const orderId =
          String(
            order.orderId ||
            order.id ||
            ""
          ).toLowerCase();


        const email =
          String(
            order.email ||
            order.customerEmail ||
            order.userEmail ||
            ""
          ).toLowerCase();


        const name =
          String(
            order.customerName ||
            order.name ||
            ""
          ).toLowerCase();


        const currentStatus =
          normalizeStatus(
            order.status
          );


        return (

          (
            !search ||
            orderId.includes(search) ||
            email.includes(search) ||
            name.includes(search)
          )

          &&

          (
            !status ||
            currentStatus === status
          )

        );

      }
    );


  renderOrders(
    filtered
  );

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(list){

  const table =
    document.getElementById(
      "ordersTable"
    );


  if(!list.length){

    table.innerHTML = `
      <tr>
        <td colspan="7"
            class="empty">

          No orders found.

        </td>
      </tr>
    `;

    return;

  }


  table.innerHTML =
    list.map(
      order => {

        const orderId =
          order.orderId ||
          order.id;


        const customer =
          order.customerName ||
          order.name ||
          order.email ||
          "Unknown";


        const amount =
          order.amount ??
          order.total ??
          0;


        const currency =
          order.currency ||
          "TZS";


        const status =
          normalizeStatus(
            order.status
          );


        const date =
          getOrderDate(
            order
          );


        const items =
          getItemCount(
            order
          );


        return `

          <tr>

            <td>

              <strong>
                ${escapeHTML(
                  orderId
                )}
              </strong>

            </td>


            <td>

              ${escapeHTML(
                customer
              )}

            </td>


            <td>

              ${items}

            </td>


            <td class="amount">

              ${formatAmount(
                amount
              )}

              ${escapeHTML(
                currency
              )}

            </td>


            <td>

              <span
                class="badge ${status}">

                ${escapeHTML(
                  status
                )}

              </span>

            </td>


            <td>

              ${escapeHTML(
                date
              )}

            </td>


            <td>

              <div class="actions">

                <button
                  class="action view"
                  onclick="viewOrder('${order.id}')">

                  View

                </button>


                <button
                  class="action status"
                  onclick="changeOrderStatus('${order.id}')">

                  Status

                </button>

              </div>

            </td>

          </tr>

        `;

      }
    ).join("");

}


/* =====================================================
   ITEM COUNT
===================================================== */

function getItemCount(order){

  if(
    Array.isArray(
      order.items
    )
  ){

    return order.items.length;

  }


  if(
    Array.isArray(
      order.courses
    )
  ){

    return order.courses.length;

  }


  if(
    order.itemsCount
  ){

    return Number(
      order.itemsCount
    );

  }


  return 1;

}


/* =====================================================
   VIEW ORDER
===================================================== */

window.viewOrder =
function(id){

  const order =
    orders.find(
      x => x.id === id
    );


  if(!order) return;


  const details =
    document.getElementById(
      "orderDetails"
    );


  const orderId =
    order.orderId ||
    order.id;


  const customer =
    order.customerName ||
    order.name ||
    "Unknown";


  const email =
    order.email ||
    order.customerEmail ||
    "—";


  const amount =
    order.amount ??
    order.total ??
    0;


  const currency =
    order.currency ||
    "TZS";


  const status =
    normalizeStatus(
      order.status
    );


  let itemsHTML = "";


  const items =
    Array.isArray(
      order.items
    )
      ? order.items
      : Array.isArray(
          order.courses
        )
        ? order.courses
        : [];


  if(items.length){

    itemsHTML =
      items.map(
        item => `

          <div class="item">

            <strong>
              ${escapeHTML(
                item.name ||
                item.title ||
                item.courseName ||
                "Course"
              )}
            </strong>

            ${
              item.price !== undefined
              ? `<br>
                 ${formatAmount(
                   item.price
                 )}
                 ${escapeHTML(
                   currency
                 )}`
              : ""
            }

          </div>

        `
      ).join("");

  }else{

    itemsHTML =
      `<div class="item">
        No item details available.
       </div>`;

  }


  details.innerHTML = `

    <div class="detail">

      <strong>
        Order ID
      </strong>

      ${escapeHTML(
        orderId
      )}

    </div>


    <div class="detail">

      <strong>
        Customer
      </strong>

      ${escapeHTML(
        customer
      )}

    </div>


    <div class="detail">

      <strong>
        Email
      </strong>

      ${escapeHTML(
        email
      )}

    </div>


    <div class="detail">

      <strong>
        Amount
      </strong>

      ${formatAmount(
        amount
      )}
      ${escapeHTML(
        currency
      )}

    </div>


    <div class="detail">

      <strong>
        Status
      </strong>

      <span class="badge ${status}">
        ${escapeHTML(
          status
        )}
      </span>

    </div>


    <div class="detail">

      <strong>
        Items
      </strong>

      ${itemsHTML}

    </div>

  `;


  document.getElementById(
    "orderModal"
  ).style.display =
    "flex";

};


/* =====================================================
   CHANGE STATUS
===================================================== */

window.changeOrderStatus =
async function(id){

  const order =
    orders.find(
      x => x.id === id
    );


  if(!order) return;


  const newStatus =
    prompt(
      "Enter new status:\n\ncompleted\npending\nprocessing\ncancelled\nrefunded",
      normalizeStatus(
        order.status
      )
    );


  if(!newStatus) return;


  const status =
    newStatus
      .trim()
      .toLowerCase();


  const allowed = [
    "completed",
    "pending",
    "processing",
    "cancelled",
    "refunded"
  ];


  if(
    !allowed.includes(
      status
    )
  ){

    alert(
      "Invalid order status."
    );

    return;

  }


  try{

    await updateDoc(
      doc(
        db,
        "orders",
        id
      ),
      {
        status:status
      }
    );


    await loadOrders();


  }catch(error){

    console.error(error);

    alert(
      "Unable to update order status."
    );

  }

};


/* =====================================================
   CLOSE MODAL
===================================================== */

window.closeOrderModal =
function(){

  document.getElementById(
    "orderModal"
  ).style.display =
    "none";

};


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById(
    "searchOrder"
  )
  .addEventListener(
    "input",
    applyFilters
  );


/* =====================================================
   STATUS FILTER
===================================================== */

document
  .getElementById(
    "statusFilter"
  )
  .addEventListener(
    "change",
    applyFilters
  );


/* =====================================================
   DATE
===================================================== */

function getOrderDate(order){

  if(
    order.createdAt?.toDate
  ){

    return order
      .createdAt
      .toDate()
      .toLocaleString();

  }


  if(
    order.timestamp?.toDate
  ){

    return order
      .timestamp
      .toDate()
      .toLocaleString();

  }


  if(
    order.date
  ){

    return String(
      order.date
    );

  }


  return "—";

}


/* =====================================================
   FORMAT
===================================================== */

function formatAmount(amount){

  return (
    Number(amount) || 0
  ).toLocaleString(
    "en-US"
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
    .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
