<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Page Links | LetsStudy Pro Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Arial,
    sans-serif;
  background: #f5f7fb;
  color: #172033;
}

header {
  background: #ffffff;
  padding: 18px 25px;
  border-bottom: 1px solid #e5e9f2;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 20px;
}

.card {
  background: #ffffff;
  border-radius: 18px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow:
    0 8px 30px
    rgba(20,30,50,.06);
}

.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #dce2ec;
  border-radius: 10px;
  outline: none;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: 700;
}

.primary {
  background: #1769ff;
  color: #ffffff;
}

.secondary {
  background: #edf1f7;
  color: #172033;
}

.success {
  background: #20b26b;
  color: #ffffff;
}

.danger {
  background: #e5484d;
  color: #ffffff;
}

.generated {
  display: none;
  margin-top: 20px;
  background: #eef5ff;
  padding: 18px;
  border-radius: 12px;
}

.generated input {
  background: #ffffff;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 14px;
  text-align: left;
  border-bottom: 1px solid #edf0f5;
  vertical-align: middle;
}

th {
  font-size: 12px;
  color: #68748a;
}

.url {
  max-width: 400px;
  word-break: break-all;
  font-size: 12px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 999px;
  font-size: 11px;
  background: #eaf1ff;
  color: #1769ff;
}

@media(max-width:700px) {

  table,
  thead,
  tbody,
  th,
  td,
  tr {
    display: block;
  }

  thead {
    display: none;
  }

  tr {
    background: #ffffff;
    margin-bottom: 15px;
    border-radius: 12px;
    padding: 10px;
  }

  td {
    border: 0;
  }

}

</style>

</head>


<body>


<header>

<h1>
📚 LetsStudy Pro — Page Link Manager
</h1>

</header>


<main class="container">


<!-- CREATE -->

<section class="card">

<h2>
➕ Generate Page Link
</h2>


<div class="form-group">

<label>
Page Title *
</label>

<input
  id="title"
  type="text"
  placeholder="e.g. History Form 5 TIE Notes"
>

</div>


<div class="form-group">

<label>
Page Type
</label>

<select id="pageType">

<option value="resource">
Resource
</option>

<option value="course">
Course
</option>

<option value="career">
Career
</option>

<option value="scholarship">
Scholarship
</option>

<option value="article">
Article
</option>

<option value="page">
Page
</option>

</select>

</div>


<div class="form-group">

<label>
Page File *
</label>

<input
  id="path"
  type="text"
  value="resources.html"
  placeholder="resources.html"
>

</div>


<div class="form-group">

<label>
Description
</label>

<textarea
  id="description"
  placeholder="Short description..."
></textarea>

</div>


<div class="form-group">

<label>
Image URL
</label>

<input
  id="image"
  type="url"
  placeholder="https://..."
>

</div>


<button
  id="generateBtn"
  class="primary"
>

🔗 Generate Link

</button>


<div
  id="generated"
  class="generated"
>

<strong>
Generated Share Link
</strong>

<br><br>

<input
  id="generatedUrl"
  readonly
>

<br><br>

<button
  id="copyGenerated"
  class="success"
>

📋 Copy Link

</button>

</div>

</section>


<!-- LIST -->

<section class="card">

<h2>
🔗 All Page Links
</h2>


<div
  id="loading"
>
Loading...
</div>


<div
  style="overflow-x:auto"
>

<table>

<thead>

<tr>

<th>
Title
</th>

<th>
Type
</th>

<th>
Slug
</th>

<th>
Share Link
</th>

<th>
Actions
</th>

</tr>

</thead>

<tbody
  id="linksTable"
>
</tbody>

</table>

</div>

</section>


</main>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
  createPageLink,
  copyPageLink,
  sharePage,
  whatsappShare
} from
"./js/page-link-system.js";


/* =====================================================
   FIREBASE
===================================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const titleInput =
  document.getElementById(
    "title"
  );


const pageTypeInput =
  document.getElementById(
    "pageType"
  );


const pathInput =
  document.getElementById(
    "path"
  );


const descriptionInput =
  document.getElementById(
    "description"
  );


const imageInput =
  document.getElementById(
    "image"
  );


const generatedBox =
  document.getElementById(
    "generated"
  );


const generatedUrl =
  document.getElementById(
    "generatedUrl"
  );


/* =====================================================
   GENERATE
===================================================== */

document
  .getElementById(
    "generateBtn"
  )
  .addEventListener(
    "click",
    async () => {

      try {

        const title =
          titleInput.value.trim();


        const pageType =
          pageTypeInput.value;


        const path =
          pathInput.value.trim();


        const description =
          descriptionInput.value.trim();


        const image =
          imageInput.value.trim();


        if (!title) {

          alert(
            "Enter page title."
          );

          return;

        }


        if (!path) {

          alert(
            "Enter page file."
          );

          return;

        }


        const result =
          await createPageLink(
            db,
            {

              title,

              pageType,

              path,

              description,

              image,

              status:
                "published"

            }
          );


        generatedUrl.value =
          result.shareUrl;


        generatedBox.style.display =
          "block";


        await loadLinks();


        alert(
          "Page link generated successfully!"
        );


      } catch (error) {

        console.error(
          error
        );


        alert(
          error.message
        );

      }

    }
  );


/* =====================================================
   COPY GENERATED
===================================================== */

document
  .getElementById(
    "copyGenerated"
  )
  .addEventListener(
    "click",
    async () => {

      await copyPageLink(
        generatedUrl.value
      );


      alert(
        "Link copied!"
      );

    }
  );


/* =====================================================
   LOAD LINKS
===================================================== */

async function loadLinks() {

  const table =
    document.getElementById(
      "linksTable"
    );


  const loading =
    document.getElementById(
      "loading"
    );


  table.innerHTML =
    "";


  loading.textContent =
    "Loading...";


  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "pageLinks"
        )
      );


    if (
      snapshot.empty
    ) {

      loading.textContent =
        "No page links found.";

      return;

    }


    loading.textContent =
      "";


    snapshot.forEach(
      pageDoc => {

        const data =
          pageDoc.data();


        const row =
          document.createElement(
            "tr"
          );


        row.innerHTML = `

          <td>

            <strong>
              ${escapeHTML(
                data.title
              )}
            </strong>

          </td>


          <td>

            <span class="badge">

              ${escapeHTML(
                data.pageType
              )}

            </span>

          </td>


          <td>

            ${escapeHTML(
              data.slug
            )}

          </td>


          <td>

            <div class="url">

              ${escapeHTML(
                data.shareUrl
              )}

            </div>

          </td>


          <td>

            <div class="actions">

              <button
                class="secondary copy-btn"
                data-url="${escapeAttr(
                  data.shareUrl
                )}"
              >
                📋 Copy
              </button>


              <button
                class="primary share-btn"
                data-id="${pageDoc.id}"
                data-title="${escapeAttr(
                  data.title
                )}"
                data-url="${escapeAttr(
                  data.shareUrl
                )}"
              >
                📤 Share
              </button>


              <button
                class="success whatsapp-btn"
                data-title="${escapeAttr(
                  data.title
                )}"
                data-url="${escapeAttr(
                  data.shareUrl
                )}"
              >
                WhatsApp
              </button>

            </div>

          </td>

        `;


        table.appendChild(
          row
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    loading.textContent =
      error.message;

  }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttr(
  value
) {

  return escapeHTML(
    value
  );

}


/* =====================================================
   ACTIONS
===================================================== */

document.addEventListener(
  "click",
  async event => {

    const copyBtn =
      event.target.closest(
        ".copy-btn"
      );


    if (copyBtn) {

      await copyPageLink(
        copyBtn.dataset.url
      );


      const old =
        copyBtn.textContent;


      copyBtn.textContent =
        "✅ Copied";


      setTimeout(
        () => {

          copyBtn.textContent =
            old;

        },
        1500
      );


      return;

    }


    const shareBtn =
      event.target.closest(
        ".share-btn"
      );


    if (shareBtn) {

      try {

        await sharePage(
          {

            title:
              shareBtn.dataset.title,

            text:
              `Check out ${shareBtn.dataset.title} on LetsStudy Pro`,

            url:
              shareBtn.dataset.url

          }
        );


      } catch (error) {

        console.log(
          error
        );

      }


      return;

    }


    const whatsappBtn =
      event.target.closest(
        ".whatsapp-btn"
      );


    if (whatsappBtn) {

      whatsappShare(
        {

          title:
            whatsappBtn.dataset.title,

          url:
            whatsappBtn.dataset.url

        }
      );

    }

  }
);


/* =====================================================
   START
===================================================== */

loadLinks();

</script>


</body>

</html>
