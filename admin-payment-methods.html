
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payment Methods | LetsStudy Pro Admin</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    .page {
      max-width: 1450px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .header p {
      color: #6b7485;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary {
      background: #2563eb;
      color: #fff;
    }

    .secondary {
      background: #eef2f7;
      color: #263247;
    }

    .danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;
      margin-bottom: 25px;
    }

    .stat {
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 16px;
      padding: 20px;
    }

    .stat span {
      display: block;
      color: #70798a;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 28px;
    }

    .toolbar {
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #dce2ea;
      border-radius: 10px;
      padding: 11px 13px;
      outline: none;
      background: #fff;
      color: #172033;
      font: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .search {
      flex: 1;
      min-width: 230px;
    }

    .methods-card {
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 16px;
      overflow: hidden;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 950px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #edf0f4;
    }

    th {
      background: #f9fafc;
      color: #6d7686;
      font-size: 12px;
      text-transform: uppercase;
    }

    .method-name {
      font-weight: 800;
    }

    .method-description {
      color: #737d8e;
      font-size: 13px;
      margin-top: 4px;
    }

    .badge {
      display: inline-flex;
      border-radius: 30px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .enabled {
      background: #dcfce7;
      color: #166534;
    }

    .disabled {
      background: #f1f5f9;
      color: #64748b;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .empty,
    .loading,
    .error {
      text-align: center;
      padding: 60px 20px;
      color: #697386;
    }

    .error {
      color: #b91c1c;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .58);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-content {
      width: min(700px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      position: relative;
    }

    .modal-content h2 {
      margin-bottom: 20px;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 15px;
      width: 38px;
      height: 38px;
      padding: 0;
      background: #f1f3f6;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);
      gap: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 10px;
    }

    .checkbox-row input {
      width: auto;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    @media (max-width: 800px) {

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 500px) {

      .stats {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

<main class="page">


  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div>

      <h1>
        Payment Methods
      </h1>

      <p>
        Manage payment methods available
        to customers at checkout.
      </p>

    </div>


    <button
      class="primary"
      id="addMethodBtn"
    >
      + Add Payment Method
    </button>

  </header>


  <!-- =========================
       STATISTICS
  ========================== -->

  <section class="stats">

    <div class="stat">

      <span>
        Total Methods
      </span>

      <strong id="totalMethods">
        0
      </strong>

    </div>


    <div class="stat">

      <span>
        Enabled
      </span>

      <strong id="enabledMethods">
        0
      </strong>

    </div>


    <div class="stat">

      <span>
        Disabled
      </span>

      <strong id="disabledMethods">
        0
      </strong>

    </div>


    <div class="stat">

      <span>
        Default
      </span>

      <strong id="defaultMethod">
        -
      </strong>

    </div>

  </section>


  <!-- =========================
       FILTER
  ========================== -->

  <section class="toolbar">

    <input
      class="search"
      id="searchInput"
      type="search"
      placeholder="Search payment methods..."
    >


    <select
      id="statusFilter"
      style="max-width:200px;"
    >

      <option value="all">
        All Status
      </option>

      <option value="enabled">
        Enabled
      </option>

      <option value="disabled">
        Disabled
      </option>

    </select>

  </section>


  <!-- =========================
       TABLE
  ========================== -->

  <section class="methods-card">

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>
              Method
            </th>

            <th>
              Type
            </th>

            <th>
              Currency
            </th>

            <th>
              Status
            </th>

            <th>
              Default
            </th>

            <th>
              Updated
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>


        <tbody id="methodsBody">

          <tr>

            <td
              colspan="7"
              class="loading"
            >
              Loading payment methods...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<!-- =========================
     ADD / EDIT MODAL
========================= -->

<div
  class="modal"
  id="methodModal"
>

  <div class="modal-content">

    <button
      class="close"
      id="closeModal"
      type="button"
    >
      ×
    </button>


    <h2 id="modalTitle">
      Add Payment Method
    </h2>


    <form
      id="methodForm"
    >

      <input
        type="hidden"
        id="methodId"
      >


      <div class="form-grid">


        <div class="form-group">

          <label>
            Method Name
          </label>

          <input
            id="methodName"
            required
            placeholder="e.g. Mobile Money"
          >

        </div>


        <div class="form-group">

          <label>
            Type
          </label>

          <select
            id="methodType"
            required
          >

            <option value="mobile_money">
              Mobile Money
            </option>

            <option value="bank">
              Bank
            </option>

            <option value="card">
              Card
            </option>

            <option value="paypal">
              PayPal
            </option>

            <option value="wallet">
              Wallet
            </option>

            <option value="crypto">
              Crypto
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <div class="form-group">

          <label>
            Currency
          </label>

          <input
            id="currency"
            placeholder="e.g. TZS"
            value="TZS"
          >

        </div>


        <div class="form-group">

          <label>
            Display Order
          </label>

          <input
            id="displayOrder"
            type="number"
            value="0"
          >

        </div>


        <div class="form-group full">

          <label>
            Description
          </label>

          <input
            id="description"
            placeholder="Short description shown at checkout"
          >

        </div>


        <div class="form-group full">

          <label>
            Payment Instructions
          </label>

          <textarea
            id="instructions"
            placeholder="Enter instructions customers should follow..."
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Account / Merchant Number
          </label>

          <input
            id="accountNumber"
            placeholder="Payment number or account"
          >

        </div>


        <div class="form-group">

          <label>
            Account Name
          </label>

          <input
            id="accountName"
            placeholder="Merchant account name"
          >

        </div>


        <div class="form-group full">

          <div class="checkbox-row">

            <input
              type="checkbox"
              id="enabled"
              checked
            >

            <label
              for="enabled"
            >
              Enable this payment method
            </label>

          </div>

        </div>


        <div class="form-group full">

          <div class="checkbox-row">

            <input
              type="checkbox"
              id="isDefault"
            >

            <label
              for="isDefault"
            >
              Make this the default payment method
            </label>

          </div>

        </div>

      </div>


      <div class="form-actions">

        <button
          type="button"
          class="secondary"
          id="cancelBtn"
        >
          Cancel
        </button>


        <button
          type="submit"
          class="primary"
        >
          Save Payment Method
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

  /* =========================
     FIREBASE CONFIG
  ========================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    getDatabase,
    ref,
    onValue,
    push,
    set,
    update,
    remove
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"

  };


  /* =========================
     INITIALIZE
  ========================== */

  const app =
    initializeApp(
      firebaseConfig
    );

  const auth =
    getAuth(app);

  const database =
    getDatabase(app);


  /* =========================
     STATE
  ========================== */

  let methods = {};


  /* =========================
     ELEMENTS
  ========================== */

  const body =
    document.getElementById(
      "methodsBody"
    );

  const modal =
    document.getElementById(
      "methodModal"
    );

  const form =
    document.getElementById(
      "methodForm"
    );


  /* =========================
     HELPERS
  ========================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )

      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return "-";
    }

    return date.toLocaleString();

  }


  /* =========================
     OPEN MODAL
  ========================== */

  function openModal(
    id = null
  ) {

    form.reset();

    document.getElementById(
      "methodId"
    ).value = "";

    document.getElementById(
      "currency"
    ).value = "TZS";

    document.getElementById(
      "enabled"
    ).checked = true;


    if (id && methods[id]) {

      const method =
        methods[id];


      document.getElementById(
        "modalTitle"
      ).textContent =
        "Edit Payment Method";


      document.getElementById(
        "methodId"
      ).value = id;


      document.getElementById(
        "methodName"
      ).value =
        method.name || "";


      document.getElementById(
        "methodType"
      ).value =
        method.type || "other";


      document.getElementById(
        "currency"
      ).value =
        method.currency || "TZS";


      document.getElementById(
        "displayOrder"
      ).value =
        method.displayOrder ?? 0;


      document.getElementById(
        "description"
      ).value =
        method.description || "";


      document.getElementById(
        "instructions"
      ).value =
        method.instructions || "";


      document.getElementById(
        "accountNumber"
      ).value =
        method.accountNumber || "";


      document.getElementById(
        "accountName"
      ).value =
        method.accountName || "";


      document.getElementById(
        "enabled"
      ).checked =
        method.enabled !== false;


      document.getElementById(
        "isDefault"
      ).checked =
        method.isDefault === true;

    } else {

      document.getElementById(
        "modalTitle"
      ).textContent =
        "Add Payment Method";

    }


    modal.style.display =
      "flex";

  }


  /* =========================
     CLOSE MODAL
  ========================== */

  function closeModal() {

    modal.style.display =
      "none";

  }


  /* =========================
     LOAD METHODS
  ========================== */

  function loadMethods() {

    const methodsRef =
      ref(
        database,
        "paymentMethods"
      );


    onValue(
      methodsRef,
      snapshot => {

        methods =
          snapshot.val() || {};

        renderMethods();

        updateStats();

      },

      error => {

        console.error(
          error
        );

        body.innerHTML = `

          <tr>

            <td
              colspan="7"
              class="error"
            >
              Failed to load payment methods.
            </td>

          </tr>

        `;

      }

    );

  }


  /* =========================
     RENDER
  ========================== */

  function renderMethods() {

    const query =
      document.getElementById(
        "searchInput"
      ).value
        .trim()
        .toLowerCase();


    const filter =
      document.getElementById(
        "statusFilter"
      ).value;


    let entries =
      Object.entries(
        methods
      );


    entries =
      entries.filter(
        ([id, method]) => {

          const text = `

            ${id}

            ${method.name || ""}

            ${method.type || ""}

            ${method.currency || ""}

            ${method.description || ""}

          `.toLowerCase();


          if (
            query &&
            !text.includes(
              query
            )
          ) {

            return false;

          }


          if (
            filter === "enabled" &&
            method.enabled === false
          ) {

            return false;

          }


          if (
            filter === "disabled" &&
            method.enabled !== false
          ) {

            return false;

          }


          return true;

        }
      );


    entries.sort(
      (
        [, a],
        [, b]
      ) =>
        Number(
          a.displayOrder || 0
        ) -
        Number(
          b.displayOrder || 0
        )
    );


    if (!entries.length) {

      body.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="empty"
          >
            No payment methods found.
          </td>

        </tr>

      `;

      return;

    }


    body.innerHTML =
      entries
        .map(
          ([id, method]) => `

            <tr>

              <td>

                <div class="method-name">

                  ${escapeHtml(
                    method.name ||
                    "Unnamed"
                  )}

                </div>

                <div
                  class="method-description"
                >

                  ${escapeHtml(
                    method.description ||
                    ""
                  )}

                </div>

              </td>


              <td>

                ${escapeHtml(
                  method.type ||
                  "other"
                )}

              </td>


              <td>

                ${escapeHtml(
                  method.currency ||
                  "TZS"
                )}

              </td>


              <td>

                <span
                  class="
                    badge
                    ${
                      method.enabled !== false
                        ? "enabled"
                        : "disabled"
                    }
                  "
                >

                  ${
                    method.enabled !== false
                      ? "Enabled"
                      : "Disabled"
                  }

                </span>

              </td>


              <td>

                ${
                  method.isDefault === true
                    ? `
                      <span
                        class="badge enabled"
                      >
                        Default
                      </span>
                    `
                    : "-"
                }

              </td>


              <td>

                ${formatDate(
  method.updatedAt ||
  method.createdAt
)}

              </td>

              <td>

                <div class="actions">

                  <button
                    type="button"
                    class="secondary"
                    data-action="edit"
                    data-id="${escapeHtml(id)}"
                  >
                    Edit
                  </button>

                  <button
                    type="button"
                    class="${
                      method.enabled !== false
                        ? "danger"
                        : "success"
                    }"
                    data-action="toggle"
                    data-id="${escapeHtml(id)}"
                  >
                    ${
                      method.enabled !== false
                        ? "Disable"
                        : "Enable"
                    }
                  </button>

                  <button
                    type="button"
                    class="danger"
                    data-action="delete"
                    data-id="${escapeHtml(id)}"
                  >
                    Delete
                  </button>

                </div>

              </td>

            </tr>

          `
        )
        .join("");

    }


    /* =========================
       UPDATE STATISTICS
    ========================== */

    function updateStats() {

      const values =
        Object.values(methods);

      const enabled =
        values.filter(
          method =>
            method.enabled !== false
        ).length;

      const disabled =
        values.length - enabled;

      const defaultMethod =
        values.find(
          method =>
            method.isDefault === true
        );

      document.getElementById(
        "totalMethods"
      ).textContent =
        values.length;

      document.getElementById(
        "enabledMethods"
      ).textContent =
        enabled;

      document.getElementById(
        "disabledMethods"
      ).textContent =
        disabled;

      document.getElementById(
        "defaultMethod"
      ).textContent =
        defaultMethod?.name || "-";

    }


    /* =========================
       OPEN MODAL
    ========================== */

    function openModal(id = null) {

      form.reset();

      document.getElementById(
        "methodId"
      ).value = "";

      document.getElementById(
        "currency"
      ).value = "TZS";

      document.getElementById(
        "enabled"
      ).checked = true;


      if (id && methods[id]) {

        const method =
          methods[id];

        document.getElementById(
          "modalTitle"
        ).textContent =
          "Edit Payment Method";

        document.getElementById(
          "methodId"
        ).value = id;

        document.getElementById(
          "methodName"
        ).value =
          method.name || "";

        document.getElementById(
          "methodType"
        ).value =
          method.type || "other";

        document.getElementById(
          "currency"
        ).value =
          method.currency || "TZS";

        document.getElementById(
          "displayOrder"
        ).value =
          method.displayOrder ?? 0;

        document.getElementById(
          "description"
        ).value =
          method.description || "";

        document.getElementById(
          "instructions"
        ).value =
          method.instructions || "";

        document.getElementById(
          "accountNumber"
        ).value =
          method.accountNumber || "";

        document.getElementById(
          "accountName"
        ).value =
          method.accountName || "";

        document.getElementById(
          "enabled"
        ).checked =
          method.enabled !== false;

        document.getElementById(
          "isDefault"
        ).checked =
          method.isDefault === true;

      } else {

        document.getElementById(
          "modalTitle"
        ).textContent =
          "Add Payment Method";

      }

      modal.style.display = "flex";

    }


    /* =========================
       CLOSE MODAL
    ========================== */

    function closeModal() {

      modal.style.display = "none";

    }


    /* =========================
       ADD / EDIT PAYMENT METHOD
    ========================== */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const id =
          document.getElementById(
            "methodId"
          ).value.trim();


        const name =
          document.getElementById(
            "methodName"
          ).value.trim();


        const type =
          document.getElementById(
            "methodType"
          ).value;


        const currency =
          document.getElementById(
            "currency"
          ).value.trim().toUpperCase();


        const displayOrder =
          Number(
            document.getElementById(
              "displayOrder"
            ).value || 0
          );


        const description =
          document.getElementById(
            "description"
          ).value.trim();


        const instructions =
          document.getElementById(
            "instructions"
          ).value.trim();


        const accountNumber =
          document.getElementById(
            "accountNumber"
          ).value.trim();


        const accountName =
          document.getElementById(
            "accountName"
          ).value.trim();


        const enabled =
          document.getElementById(
            "enabled"
          ).checked;


        const isDefault =
          document.getElementById(
            "isDefault"
          ).checked;


        if (!name) {

          alert(
            "Payment method name is required."
          );

          return;

        }


        const now =
          Date.now();


        const data = {

          name,

          type,

          currency:

            currency || "TZS",

          displayOrder,

          description,

          instructions,

          accountNumber,

          accountName,

          enabled,

          isDefault,

          updatedAt: now

        };


        try {

          /*
           * If this method becomes
           * default, remove default
           * from all other methods.
           */

          if (isDefault) {

            const updates = {};


            Object.keys(
              methods
            ).forEach(
              methodId => {

                if (
                  !id ||
                  methodId !== id
                ) {

                  updates[
                    `paymentMethods/${methodId}/isDefault`
                  ] = false;

                }

              }
            );


            if (
              Object.keys(
                updates
              ).length
            ) {

              await update(
                ref(database),
                updates
              );

            }

          }


          if (id) {

            await update(
              ref(
                database,
                `paymentMethods/${id}`
              ),
              data
            );

          } else {

            data.createdAt =
              now;

            const newMethodRef =
              push(
                ref(
                  database,
                  "paymentMethods"
                )
              );

            await set(
              newMethodRef,
              data
            );

          }


          closeModal();

          alert(
            "Payment method saved successfully."
          );

        } catch (error) {

          console.error(
            "Payment method save error:",
            error
          );

          alert(
            "Failed to save payment method."
          );

        }

      }
    );


    /* =========================
       TABLE ACTIONS
    ========================== */

    body.addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest(
            "[data-action]"
          );


        if (!button) {
          return;
        }


        const action =
          button.dataset.action;

        const id =
          button.dataset.id;


        if (
          !id ||
          !methods[id]
        ) {

          return;

        }


        /* EDIT */

        if (
          action === "edit"
        ) {

          openModal(id);

          return;

        }


        /* ENABLE / DISABLE */

        if (
          action === "toggle"
        ) {

          try {

            await update(
              ref(
                database,
                `paymentMethods/${id}`
              ),
              {

                enabled:
                  methods[id]
                    .enabled === false,

                updatedAt:
                  Date.now()

              }
            );

          } catch (error) {

            console.error(
              error
            );

            alert(
              "Failed to update payment method."
            );

          }

          return;

        }


        /* DELETE */

        if (
          action === "delete"
        ) {

          const confirmed =
            confirm(
              `Delete "${methods[id].name || "this payment method"}"?`
            );


          if (!confirmed) {
            return;
          }


          try {

            await remove(
              ref(
                database,
                `paymentMethods/${id}`
              )
            );

            alert(
              "Payment method deleted."
            );

          } catch (error) {

            console.error(
              error
            );

            alert(
              "Failed to delete payment method."
            );

          }

        }

      }
    );


    /* =========================
       ADD BUTTON
    ========================== */

    document
      .getElementById(
        "addMethodBtn"
      )
      .addEventListener(
        "click",
        () => {

          openModal();

        }
      );


    /* =========================
       CLOSE BUTTON
    ========================== */

    document
      .getElementById(
        "closeModal"
      )
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById(
        "cancelBtn"
      )
      .addEventListener(
        "click",
        closeModal
      );


    /* =========================
       CLOSE OUTSIDE MODAL
    ========================== */

    modal.addEventListener(
      "click",
      event => {

        if (
          event.target === modal
        ) {

          closeModal();

        }

      }
    );


    /* =========================
       SEARCH
    ========================== */

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        renderMethods
      );


    /* =========================
       STATUS FILTER
    ========================== */

    document
      .getElementById(
        "statusFilter"
      )
      .addEventListener(
        "change",
        renderMethods
      );


    /* =========================
       ESC KEY
    ========================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeModal();

        }

      }
    );


    /* =========================
       AUTHENTICATION
    ========================== */

    onAuthStateChanged(
      auth,
      user => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        /*
         * Load Firebase data only
         * after authentication.
         */

        loadMethods();

      }
    );

  </script>

</body>
</html>
