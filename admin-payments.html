<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Payments | LetsStudy Pro Admin
  </title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(
        1500px,
        calc(100% - 30px)
      );

      margin: auto;
      padding: 28px 0 60px;
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .header p {
      color: #697386;
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-secondary {
      background: white;
      color: #263247;
      border: 1px solid #dce2ea;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* =========================
       STATS
    ========================== */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(5, 1fr);

      gap: 15px;
      margin-bottom: 22px;
    }

    .stat {
      background: white;
      border: 1px solid #e5e9f0;
      border-radius: 15px;
      padding: 19px;
    }

    .stat-label {
      color: #717b8d;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 800;
    }

    .stat-value.approved {
      color: #15803d;
    }

    .stat-value.pending {
      color: #b45309;
    }

    .stat-value.failed {
      color: #dc2626;
    }

    /* =========================
       TOOLBAR
    ========================== */

    .toolbar {
      background: white;
      border: 1px solid #e5e9f0;
      border-radius: 15px;
      padding: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .input,
    .select {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #dce2ea;
      border-radius: 9px;
      background: white;
      outline: none;
      color: #172033;
    }

    .select {
      width: 180px;
    }

    /* =========================
       TABLE
    ========================== */

    .card {
      background: white;
      border: 1px solid #e5e9f0;
      border-radius: 15px;
      overflow: hidden;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1200px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #edf0f4;
      vertical-align: middle;
    }

    th {
      background: #f9fafc;
      color: #70798a;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    td {
      font-size: 13px;
    }

    .user-name {
      font-weight: 800;
    }

    .user-id,
    .transaction-id {
      display: block;
      margin-top: 4px;
      color: #7a8495;
      font-size: 11px;
      word-break: break-all;
    }

    .amount {
      font-weight: 800;
      white-space: nowrap;
    }

    /* =========================
       BADGES
    ========================== */

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge-approved {
      background: #dcfce7;
      color: #166534;
    }

    .badge-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-failed {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-refunded {
      background: #ede9fe;
      color: #6d28d9;
    }

    .badge-cancelled {
      background: #f1f5f9;
      color: #475569;
    }

    .badge-unknown {
      background: #e2e8f0;
      color: #475569;
    }

    /* =========================
       ACTIONS
    ========================== */

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: 1px solid #dce2ea;
      background: white;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .action-btn:hover {
      background: #f8fafc;
    }

    /* =========================
       EMPTY / LOADING
    ========================== */

    .message {
      padding: 65px 20px;
      text-align: center;
      color: #70798a;
    }

    .message.error {
      color: #b91c1c;
    }

    /* =========================
       MODAL
    ========================== */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: min(
        700px,
        100%
      );

      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 22px;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 21px;
    }

    .details-grid {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }

    .detail {
      background: #f8fafc;
      border-radius: 10px;
      padding: 13px;
    }

    .detail.full {
      grid-column: 1 / -1;
    }

    .detail-label {
      color: #758093;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .detail-value {
      font-weight: 700;
      word-break: break-word;
    }

    .modal-footer {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 1100px) {

      .stats {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }

    @media (max-width: 700px) {

      .page {
        width: min(
          100% - 20px,
          1500px
        );
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      .detail.full {
        grid-column: auto;
      }

    }

    @media (max-width: 450px) {

      .stats {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

<main class="page">


  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div>

      <h1>
        Payments
      </h1>

      <p>
        Monitor verified customer payments
        and transactions.
      </p>

    </div>


    <div class="header-actions">

      <button
        class="btn btn-secondary"
        id="refreshBtn"
      >
        ↻ Refresh
      </button>

    </div>

  </header>


  <!-- =========================
       STATS
  ========================== -->

  <section class="stats">


    <div class="stat">

      <div class="stat-label">
        Total Payments
      </div>

      <div
        class="stat-value"
        id="totalPayments"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Approved
      </div>

      <div
        class="stat-value approved"
        id="approvedPayments"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Pending
      </div>

      <div
        class="stat-value pending"
        id="pendingPayments"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Failed
      </div>

      <div
        class="stat-value failed"
        id="failedPayments"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Approved Amount
      </div>

      <div
        class="stat-value approved"
        id="approvedAmount"
      >
        0
      </div>

    </div>

  </section>


  <!-- =========================
       FILTERS
  ========================== -->

  <section class="toolbar">

    <div class="search-box">

      <input
        class="input"
        id="searchInput"
        type="search"
        placeholder="Search user, order, transaction..."
      >

    </div>


    <select
      class="select"
      id="statusFilter"
    >

      <option value="all">
        All Status
      </option>

      <option value="approved">
        Approved
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="failed">
        Failed
      </option>

      <option value="refunded">
        Refunded
      </option>

      <option value="cancelled">
        Cancelled
      </option>

    </select>


    <select
      class="select"
      id="methodFilter"
    >

      <option value="all">
        All Methods
      </option>

    </select>

  </section>


  <!-- =========================
       PAYMENTS TABLE
  ========================== -->

  <section class="card">

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              Customer
            </th>

            <th>
              Order
            </th>

            <th>
              Amount
            </th>

            <th>
              Method
            </th>

            <th>
              Transaction
            </th>

            <th>
              Status
            </th>

            <th>
              Date
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>


        <tbody id="paymentsBody">

          <tr>

            <td
              colspan="8"
              class="message"
            >
              Loading payments...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>


</main>


<!-- =========================
     DETAILS MODAL
========================== -->

<div
  class="modal"
  id="detailsModal"
>

  <div class="modal-content">

    <div class="modal-header">

      <h2>
        Payment Details
      </h2>

      <button
        class="close-btn"
        id="closeModal"
        type="button"
      >
        ×
      </button>

    </div>


    <div
      class="details-grid"
      id="detailsContent"
    ></div>


    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        id="modalCloseBtn"
        type="button"
      >
        Close
      </button>

    </div>

  </div>

</div>


<script type="module">

  /* =========================
     FIREBASE SDK
  ========================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    getDatabase,
    ref,
    get
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  /* =========================
     FIREBASE CONFIG
  ========================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"

  };


  /* =========================
     INITIALIZE
  ========================== */

  const app =
    initializeApp(
      firebaseConfig
    );

  const auth =
    getAuth(app);

  const db =
    getDatabase(app);


  /* =========================
     STATE
  ========================== */

  let payments = {};


  /* =========================
     ELEMENTS
  ========================== */

  const paymentsBody =
    document.getElementById(
      "paymentsBody"
    );

  const searchInput =
    document.getElementById(
      "searchInput"
    );

  const statusFilter =
    document.getElementById(
      "statusFilter"
    );

  const methodFilter =
    document.getElementById(
      "methodFilter"
    );

  const detailsModal =
    document.getElementById(
      "detailsModal"
    );

  const detailsContent =
    document.getElementById(
      "detailsContent"
    );


  /* =========================
     HELPERS
  ========================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "-";

    }

    return date.toLocaleString();

  }


  function formatAmount(
    amount,
    currency
  ) {

    const number =
      Number(amount || 0);


    try {

      return new Intl.NumberFormat(
        undefined,
        {
          style: "currency",
          currency:
            currency || "TZS"
        }
      ).format(
        number
      );

    } catch {

      return `${currency || "TZS"} ${number.toLocaleString()}`;

    }

  }


  function normalizedStatus(
    payment
  ) {

    return String(
      payment.status ||
      payment.paymentStatus ||
      "pending"
    )
      .toLowerCase()
      .trim();

  }


  function statusBadge(
    status
  ) {

    let className =
      "badge-unknown";

    let label =
      status || "Unknown";


    if (
      status === "approved" ||
      status === "success" ||
      status === "successful" ||
      status === "paid" ||
      status === "completed" ||
      status === "verified"
    ) {

      className =
        "badge-approved";

      label =
        "Approved";

    }

    else if (
      status === "pending" ||
      status === "processing"
    ) {

      className =
        "badge-pending";

      label =
        "Pending";

    }

    else if (
      status === "failed" ||
      status === "failure"
    ) {

      className =
        "badge-failed";

      label =
        "Failed";

    }

    else if (
      status === "refunded"
    ) {

      className =
        "badge-refunded";

      label =
        "Refunded";

    }

    else if (
      status === "cancelled" ||
      status === "canceled"
    ) {

      className =
        "badge-cancelled";

      label =
        "Cancelled";

    }


    return `

      <span
        class="badge ${className}"
      >

        ${escapeHtml(label)}

      </span>

    `;

  }


  /* =========================
     LOAD PAYMENTS
  ========================== */

  async function loadPayments() {

    paymentsBody.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="message"
        >
          Loading payments...
        </td>

      </tr>

    `;


    try {

      /*
       * Main Firebase path:
       *
       * payments/
       */

      const snapshot =
        await get(
          ref(
            db,
            "payments"
          )
        );


      payments =
        snapshot.val() || {};


      updateMethodFilter();

      updateStats();

      renderPayments();

    } catch (error) {

      console.error(
        "Payment loading error:",
        error
      );


      paymentsBody.innerHTML = `

        <tr>

          <td
            colspan="8"
            class="message error"
          >
            Failed to load payments.
          </td>

        </tr>

      `;

    }

  }


  /* =========================
     METHOD FILTER
  ========================== */

  function updateMethodFilter() {

    const current =
      methodFilter.value;


    const methods =
      new Set();


    Object.values(
      payments
    ).forEach(
      payment => {

        const method =
          payment.method ||
          payment.paymentMethod ||
          payment.gateway ||
          "Unknown";


        methods.add(
          String(method)
        );

      }
    );


    methodFilter.innerHTML = `

      <option value="all">
        All Methods
      </option>

    `;


    [...methods]
      .sort()
      .forEach(
        method => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            method;

          option.textContent =
            method;

          methodFilter.appendChild(
            option
          );

        }
      );


    if (
      [...methodFilter.options]
        .some(
          option =>
            option.value === current
        )
    ) {

      methodFilter.value =
        current;

    }

  }


  /* =========================
     STATISTICS
  ========================== */

  function updateStats() {

    const values =
      Object.values(
        payments
      );


    let approved = 0;

    let pending = 0;

    let failed = 0;

    let approvedAmount = 0;


    values.forEach(
      payment => {

        const status =
          normalizedStatus(
            payment
          );


        if (
          status === "approved" ||
          status === "success" ||
          status === "successful" ||
          status === "paid" ||
          status === "completed" ||
          status === "verified"
        ) {

          approved++;

          approvedAmount +=
            Number(
              payment.amount ||
              payment.total ||
              0
            );

        }

        else if (
          status === "pending" ||
          status === "processing"
        ) {

          pending++;

        }

        else if (
          status === "failed" ||
          status === "failure"
        ) {

          failed++;

        }

      }
    );


    document.getElementById(
      "totalPayments"
    ).textContent =
      values.length;


    document.getElementById(
      "approvedPayments"
    ).textContent =
      approved;


    document.getElementById(
      "pendingPayments"
    ).textContent =
      pending;


    document.getElementById(
      "failedPayments"
    ).textContent =
      failed;


    document.getElementById(
      "approvedAmount"
    ).textContent =
      approvedAmount.toLocaleString();

  }


  /* =========================
     RENDER PAYMENTS
  ========================== */

  function renderPayments() {

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  const status =
    statusFilter.value;

  const method =
    methodFilter.value;

  let entries =
    Object.entries(payments);


  entries = entries.filter(
    ([id, payment]) => {

      const paymentStatus =
        normalizedStatus(payment);

      const paymentMethod =
        String(
          payment.method ||
          payment.paymentMethod ||
          payment.gateway ||
          "Unknown"
        );


      const searchText = [

        id,

        payment.userId,

        payment.userName,

        payment.name,

        payment.customerName,

        payment.email,

        payment.orderId,

        payment.transactionId,

        payment.reference,

        payment.txnId,

        paymentMethod

      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


      if (
        query &&
        !searchText.includes(query)
      ) {

        return false;

      }


      if (
        status !== "all"
      ) {

        const approvedStatuses = [
          "approved",
          "success",
          "successful",
          "paid",
          "completed",
          "verified"
        ];


        if (
          status === "approved"
        ) {

          if (
            !approvedStatuses.includes(
              paymentStatus
            )
          ) {

            return false;

          }

        } else if (
          paymentStatus !== status
        ) {

          return false;

        }

      }


      if (
        method !== "all" &&
        paymentMethod !== method
      ) {

        return false;

      }


      return true;

    }
  );


  /*
   * Newest payments first.
   */

  entries.sort(
    ([, a], [, b]) => {

      const dateA =
        Number(
          a.createdAt ||
          a.timestamp ||
          a.date ||
          0
        );

      const dateB =
        Number(
          b.createdAt ||
          b.timestamp ||
          b.date ||
          0
        );

      return dateB - dateA;

    }
  );


  if (!entries.length) {

    paymentsBody.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="message"
        >

          No payments found.

        </td>

      </tr>

    `;

    return;

  }


  paymentsBody.innerHTML =
    entries
      .map(
        ([id, payment]) => {

          const userName =
            payment.userName ||
            payment.name ||
            payment.customerName ||
            "Unknown Customer";


          const userId =
            payment.userId ||
            "-";


          const orderId =
            payment.orderId ||
            payment.order ||
            "-";


          const amount =
            payment.amount ??
            payment.total ??
            0;


          const currency =
            payment.currency ||
            "TZS";


          const paymentMethod =
            payment.method ||
            payment.paymentMethod ||
            payment.gateway ||
            "Unknown";


          const transactionId =
            payment.transactionId ||
            payment.reference ||
            payment.txnId ||
            payment.transaction ||
            "-";


          const paymentStatus =
            normalizedStatus(
              payment
            );


          const createdAt =
            payment.createdAt ||
            payment.timestamp ||
            payment.date;


          return `

            <tr>

              <td>

                <div class="user-name">

                  ${escapeHtml(
                    userName
                  )}

                </div>

                <span class="user-id">

                  ${escapeHtml(
                    userId
                  )}

                </span>

              </td>


              <td>

                <strong>

                  ${escapeHtml(
                    orderId
                  )}

                </strong>

              </td>


              <td>

                <span class="amount">

                  ${escapeHtml(
                    formatAmount(
                      amount,
                      currency
                    )
                  )}

                </span>

              </td>


              <td>

                ${escapeHtml(
                  paymentMethod
                )}

              </td>


              <td>

                <span
                  class="transaction-id"
                >

                  ${escapeHtml(
                    transactionId
                  )}

                </span>

              </td>


              <td>

                ${statusBadge(
                  paymentStatus
                )}

              </td>


              <td>

                ${escapeHtml(
                  formatDate(
                    createdAt
                  )
                )}

              </td>


              <td>

                <div class="actions">

                  <button
                    type="button"
                    class="action-btn"
                    data-action="details"
                    data-id="${escapeHtml(
                      id
                    )}"
                  >

                    Details

                  </button>

                </div>

              </td>

            </tr>

          `;

        }
      )
      .join("");

}


/* =========================
   SHOW PAYMENT DETAILS
========================= */

function showDetails(id) {

  const payment =
    payments[id];


  if (!payment) {

    return;

  }


  const status =
    normalizedStatus(
      payment
    );


  const details = [

    [
      "Payment ID",
      id
    ],

    [
      "User ID",
      payment.userId
    ],

    [
      "Customer",
      payment.userName ||
      payment.name ||
      payment.customerName
    ],

    [
      "Email",
      payment.email
    ],

    [
      "Order ID",
      payment.orderId
    ],

    [
      "Amount",
      formatAmount(
        payment.amount ??
        payment.total ??
        0,
        payment.currency ||
        "TZS"
      )
    ],

    [
      "Payment Method",
      payment.method ||
      payment.paymentMethod ||
      payment.gateway
    ],

    [
      "Transaction ID",
      payment.transactionId ||
      payment.reference ||
      payment.txnId ||
      payment.transaction
    ],

    [
      "Status",
      status
    ],

    [
      "Verified",
      payment.verified === true
        ? "Yes"
        : "No"
    ],

    [
      "Created",
      formatDate(
        payment.createdAt ||
        payment.timestamp ||
        payment.date
      )
    ],

    [
      "Approved At",
      formatDate(
        payment.approvedAt
      )
    ],

    [
      "Updated At",
      formatDate(
        payment.updatedAt
      )
    ],

    [
      "Failure Reason",
      payment.failureReason
    ]

  ];


  detailsContent.innerHTML =
    details
      .map(
        ([label, value]) => `

          <div
            class="
              detail
              ${
                label ===
                "Failure Reason"
                  ? "full"
                  : ""
              }
            "
          >

            <div class="detail-label">

              ${escapeHtml(
                label
              )}

            </div>

            <div class="detail-value">

              ${
                label === "Status"
                  ? statusBadge(
                      String(
                        value || ""
                      )
                    )
                  : escapeHtml(
                      value || "-"
                    )
              }

            </div>

          </div>

        `
      )
      .join("");


  detailsModal.classList.add(
    "show"
  );

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal() {

  detailsModal.classList.remove(
    "show"
  );

}


/* =========================
   TABLE ACTIONS
========================= */

paymentsBody.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-action]"
      );


    if (!button) {

      return;

    }


    const action =
      button.dataset.action;

    const id =
      button.dataset.id;


    if (
      action === "details"
    ) {

      showDetails(id);

    }

  }
);


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
  "input",
  renderPayments
);


/* =========================
   STATUS FILTER
========================= */

statusFilter.addEventListener(
  "change",
  renderPayments
);


/* =========================
   METHOD FILTER
========================= */

methodFilter.addEventListener(
  "change",
  renderPayments
);


/* =========================
   REFRESH
========================= */

document
  .getElementById(
    "refreshBtn"
  )
  .addEventListener(
    "click",
    loadPayments
  );


/* =========================
   CLOSE MODAL BUTTON
========================= */

document
  .getElementById(
    "closeModal"
  )
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById(
    "modalCloseBtn"
  )
  .addEventListener(
    "click",
    closeModal
  );


/* =========================
   CLOSE WHEN CLICKING
   OUTSIDE MODAL
========================= */

detailsModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      detailsModal
    ) {

      closeModal();

    }

  }
);


/* =========================
   ESC KEY
========================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeModal();

    }

  }
);


/* =========================
   AUTHENTICATION
========================= */

onAuthStateChanged(
  auth,
  user => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    /*
     * Load real Firebase
     * payment records after
     * authentication.
     */

    loadPayments();

  }
);

</script>

</body>
</html>
