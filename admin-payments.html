<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Payment Management | LetsStudy Pro</title>

<meta name="description"
content="LetsStudy Pro Admin Payment Management">

<link rel="icon"
href="https://letsstudy.pro/favicon.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid #e2e8f0;
}

.nav{
  max-width:1250px;
  min-height:70px;
  margin:auto;
  padding:0 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:900;
  color:#0b57d0;
}

.back{
  color:#475569;
  text-decoration:none;
  font-weight:700;
}

.container{
  width:min(1250px,92%);
  margin:35px auto;
}

h1{
  font-size:32px;
  margin-bottom:7px;
}

.subtitle{
  color:#64748b;
  margin-bottom:28px;
}

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:16px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:17px;
  padding:22px;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-bottom:4px;
  color:#0b57d0;
}

.stat span{
  color:#64748b;
  font-size:13px;
}

.toolbar{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:18px;

  display:flex;
  gap:12px;

  margin-bottom:20px;
}

input,
select{
  width:100%;
  min-height:45px;
  padding:10px 13px;

  border:1px solid #cbd5e1;
  border-radius:10px;

  background:#fff;
  outline:none;
}

input:focus,
select:focus{
  border-color:#0b57d0;
}

.btn{
  border:0;
  border-radius:10px;

  padding:0 18px;

  min-height:45px;

  background:#0b57d0;
  color:#fff;

  font-weight:800;
  cursor:pointer;
}

.table-box{
  background:#fff;

  border:1px solid #e2e8f0;

  border-radius:16px;

  overflow:auto;
}

table{
  width:100%;
  min-width:1050px;

  border-collapse:collapse;
}

th,
td{
  padding:15px;

  border-bottom:
    1px solid #e2e8f0;

  text-align:left;
}

th{
  background:#f8fafc;

  color:#475569;

  font-size:12px;

  text-transform:uppercase;
}

td{
  font-size:14px;
}

.badge{
  display:inline-flex;

  padding:5px 10px;

  border-radius:999px;

  font-size:11px;

  font-weight:800;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.failed{
  background:#fee2e2;
  color:#991b1b;
}

.refunded{
  background:#e0e7ff;
  color:#3730a3;
}

.actions{
  display:flex;
  gap:6px;
}

.action{
  border:0;
  border-radius:7px;

  padding:7px 10px;

  cursor:pointer;

  font-size:12px;
  font-weight:700;
}

.view{
  background:#e0f2fe;
  color:#0369a1;
}

.empty{
  text-align:center;
  padding:45px;
  color:#64748b;
}

.amount{
  font-weight:800;
  white-space:nowrap;
}

.modal{
  display:none;

  position:fixed;

  inset:0;

  z-index:999;

  background:
    rgba(15,23,42,.65);

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal-box{
  width:min(600px,100%);

  max-height:90vh;

  overflow:auto;

  background:#fff;

  border-radius:20px;

  padding:25px;

  position:relative;
}

.modal-close{
  position:absolute;

  top:15px;
  right:15px;

  border:0;

  background:#f1f5f9;

  width:35px;
  height:35px;

  border-radius:50%;

  cursor:pointer;

  font-weight:900;
}

.detail{
  padding:13px 0;

  border-bottom:
    1px solid #e2e8f0;
}

.detail strong{
  display:block;

  color:#64748b;

  font-size:12px;

  margin-bottom:3px;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .toolbar{
    flex-direction:column;
  }

  h1{
    font-size:27px;
  }

}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      LetsStudy Pro Admin
    </div>

    <a
      href="admin.html"
      class="back">
      ← Admin Dashboard
    </a>

  </div>

</header>


<main class="container">

  <h1>
    Payment Management
  </h1>

  <p class="subtitle">
    Monitor and manage LetsStudy Pro payments,
    transactions and payment statuses.
  </p>


  <!-- =========================
       STATISTICS
  ========================= -->

  <section class="stats">

    <div class="stat">

      <strong id="totalPayments">
        0
      </strong>

      <span>
        Total Payments
      </span>

    </div>


    <div class="stat">

      <strong id="successfulPayments">
        0
      </strong>

      <span>
        Successful
      </span>

    </div>


    <div class="stat">

      <strong id="pendingPayments">
        0
      </strong>

      <span>
        Pending
      </span>

    </div>


    <div class="stat">

      <strong id="failedPayments">
        0
      </strong>

      <span>
        Failed
      </span>

    </div>

  </section>


  <!-- =========================
       SEARCH
  ========================= -->

  <section class="toolbar">

    <input
      id="searchPayment"
      type="search"
      placeholder="Search transaction, email or order ID...">


    <select id="statusFilter">

      <option value="">
        All Statuses
      </option>

      <option value="success">
        Successful
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="failed">
        Failed
      </option>

      <option value="refunded">
        Refunded
      </option>

    </select>


    <button
      class="btn"
      onclick="loadPayments()">

      Refresh

    </button>

  </section>


  <!-- =========================
       PAYMENTS TABLE
  ========================= -->

  <section class="table-box">

    <table>

      <thead>

        <tr>

          <th>
            Transaction
          </th>

          <th>
            Customer
          </th>

          <th>
            Amount
          </th>

          <th>
            Method
          </th>

          <th>
            Status
          </th>

          <th>
            Date
          </th>

          <th>
            Actions
          </th>

        </tr>

      </thead>


      <tbody id="paymentsTable">

        <tr>

          <td
            colspan="7"
            class="empty">

            Loading payments...

          </td>

        </tr>

      </tbody>

    </table>

  </section>

</main>


<!-- =========================
     PAYMENT MODAL
========================= -->

<div
  id="paymentModal"
  class="modal">

  <div class="modal-box">

    <button
      class="modal-close"
      onclick="closePaymentModal()">

      ×

    </button>

    <h2>
      Payment Details
    </h2>

    <div
      id="paymentDetails"
      style="margin-top:20px;">

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro.firebaseapp.com",

  projectId:
    "let-s-study-pro",

  storageBucket:
    "let-s-study-pro.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


let payments = [];


/* =====================================================
   LOAD PAYMENTS
===================================================== */

async function loadPayments(){

  const table =
    document.getElementById(
      "paymentsTable"
    );

  table.innerHTML = `
    <tr>
      <td colspan="7"
          class="empty">
        Loading payments...
      </td>
    </tr>
  `;


  try{

    /*
      Change "payments" if your
      Firestore collection uses
      another name.
    */

    const snapshot =
      await getDocs(
        collection(
          db,
          "payments"
        )
      );


    payments = [];


    snapshot.forEach(
      payment => {

        payments.push({

          id:
            payment.id,

          ...payment.data()

        });

      }
    );


    updateStatistics();

    applyFilters();


  }catch(error){

    console.error(
      "Payment loading error:",
      error
    );


    table.innerHTML = `
      <tr>
        <td colspan="7"
            class="empty">

          Failed to load payments.

        </td>
      </tr>
    `;

  }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

  const total =
    payments.length;


  const successful =
    payments.filter(
      payment =>
        normalizeStatus(
          payment.status
        ) === "success"
    ).length;


  const pending =
    payments.filter(
      payment =>
        normalizeStatus(
          payment.status
        ) === "pending"
    ).length;


  const failed =
    payments.filter(
      payment =>
        normalizeStatus(
          payment.status
        ) === "failed"
    ).length;


  document.getElementById(
    "totalPayments"
  ).textContent =
    total;


  document.getElementById(
    "successfulPayments"
  ).textContent =
    successful;


  document.getElementById(
    "pendingPayments"
  ).textContent =
    pending;


  document.getElementById(
    "failedPayments"
  ).textContent =
    failed;

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(status){

  const value =
    String(
      status || "pending"
    )
    .toLowerCase()
    .trim();


  if(
    value === "completed" ||
    value === "paid" ||
    value === "successful"
  ){

    return "success";

  }


  if(
    value === "cancelled" ||
    value === "canceled"
  ){

    return "failed";

  }


  return value;

}


/* =====================================================
   APPLY FILTERS
===================================================== */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchPayment"
      )
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const filtered =
    payments.filter(
      payment => {

        const transaction =
          String(
            payment.transactionId ||
            payment.reference ||
            payment.id ||
            ""
          ).toLowerCase();


        const email =
          String(
            payment.email ||
            payment.customerEmail ||
            ""
          ).toLowerCase();


        const orderId =
          String(
            payment.orderId ||
            ""
          ).toLowerCase();


        const currentStatus =
          normalizeStatus(
            payment.status
          );


        const matchesSearch =
          !search ||
          transaction.includes(search) ||
          email.includes(search) ||
          orderId.includes(search);


        const matchesStatus =
          !status ||
          currentStatus === status;


        return (
          matchesSearch &&
          matchesStatus
        );

      }
    );


  renderPayments(
    filtered
  );

}


/* =====================================================
   RENDER PAYMENTS
===================================================== */

function renderPayments(list){

  const table =
    document.getElementById(
      "paymentsTable"
    );


  if(!list.length){

    table.innerHTML = `
      <tr>
        <td colspan="7"
            class="empty">

          No payments found.

        </td>
      </tr>
    `;

    return;

  }


  table.innerHTML =
    list.map(
      payment => {

        const transaction =
          payment.transactionId ||
          payment.reference ||
          payment.id;


        const customer =
          payment.email ||
          payment.customerEmail ||
          payment.userEmail ||
          "Unknown";


        const amount =
          payment.amount ??
          payment.total ??
          0;


        const currency =
          payment.currency ||
          "TZS";


        const method =
          payment.method ||
          payment.paymentMethod ||
          "—";


        const status =
          normalizeStatus(
            payment.status
          );


        const date =
          getPaymentDate(
            payment
          );


        return `

          <tr>

            <td>

              <strong>
                ${escapeHTML(
                  transaction
                )}
              </strong>

            </td>


            <td>

              ${escapeHTML(
                customer
              )}

            </td>


            <td class="amount">

              ${formatAmount(
                amount
              )}

              ${escapeHTML(
                currency
              )}

            </td>


            <td>

              ${escapeHTML(
                method
              )}

            </td>


            <td>

              <span
                class="badge ${status}">

                ${escapeHTML(
                  status
                )}

              </span>

            </td>


            <td>

              ${escapeHTML(
                date
              )}

            </td>


            <td>

              <div class="actions">

                <button
                  class="action view"
                  onclick="viewPayment('${payment.id}')">

                  View

                </button>

              </div>

            </td>

          </tr>

        `;

      }
    ).join("");

}


/* =====================================================
   VIEW PAYMENT
===================================================== */

window.viewPayment =
function(id){

  const payment =
    payments.find(
      item =>
        item.id === id
    );


  if(!payment) return;


  const transaction =
    payment.transactionId ||
    payment.reference ||
    payment.id;


  const customer =
    payment.email ||
    payment.customerEmail ||
    "Unknown";


  const amount =
    payment.amount ??
    payment.total ??
    0;


  const currency =
    payment.currency ||
    "TZS";


  const status =
    normalizeStatus(
      payment.status
    );


  const method =
    payment.method ||
    payment.paymentMethod ||
    "—";


  const orderId =
    payment.orderId ||
    "—";


  const details =
    document.getElementById(
      "paymentDetails"
    );


  details.innerHTML = `

    <div class="detail">

      <strong>
        Transaction ID
      </strong>

      ${escapeHTML(
        transaction
      )}

    </div>


    <div class="detail">

      <strong>
        Customer
      </strong>

      ${escapeHTML(
        customer
      )}

    </div>


    <div class="detail">

      <strong>
        Amount
      </strong>

      ${formatAmount(
        amount
      )}
      ${escapeHTML(
        currency
      )}

    </div>


    <div class="detail">

      <strong>
        Payment Method
      </strong>

      ${escapeHTML(
        method
      )}

    </div>


    <div class="detail">

      <strong>
        Order ID
      </strong>

      ${escapeHTML(
        orderId
      )}

    </div>


    <div class="detail">

      <strong>
        Status
      </strong>

      <span class="badge ${status}">
        ${escapeHTML(
          status
        )}
      </span>

    </div>

  `;


  document.getElementById(
    "paymentModal"
  ).style.display =
    "flex";

};


/* =====================================================
   CLOSE MODAL
===================================================== */

window.closePaymentModal =
function(){

  document.getElementById(
    "paymentModal"
  ).style.display =
    "none";

};


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById(
    "searchPayment"
  )
  .addEventListener(
    "input",
    applyFilters
  );


/* =====================================================
   STATUS FILTER
===================================================== */

document
  .getElementById(
    "statusFilter"
  )
  .addEventListener(
    "change",
    applyFilters
  );


/* =====================================================
   DATE
===================================================== */

function getPaymentDate(payment){

  if(
    payment.createdAt?.toDate
  ){

    return payment
      .createdAt
      .toDate()
      .toLocaleString();

  }


  if(
    payment.timestamp?.toDate
  ){

    return payment
      .timestamp
      .toDate()
      .toLocaleString();

  }


  if(
    payment.date
  ){

    return String(
      payment.date
    );

  }


  return "—";

}


/* =====================================================
   AMOUNT
===================================================== */

function formatAmount(amount){

  const number =
    Number(amount) || 0;


  return number.toLocaleString(
    "en-US"
  );

}


/* =====================================================
   SECURITY
===================================================== */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      window.location.href =
        "login.html";

      return;

    }


    loadPayments();

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


window.loadPayments =
  loadPayments;

</script>

</body>
</html>
