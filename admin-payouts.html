<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Payouts - Lets Study Pro</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span{
  color:#2563eb;
}

.menu{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.menu a{
  text-decoration:none;
  color:#334155;
  padding:9px 12px;
  border-radius:7px;
  font-size:13px;
}

.menu a:hover,
.menu a.active{
  background:#2563eb;
  color:#fff;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:25px 18px;
}

h1{
  margin-bottom:6px;
}

.subtitle{
  color:#64748b;
  font-size:14px;
  margin-bottom:25px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  padding:20px;
  border-radius:13px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.stat small{
  color:#64748b;
}

.stat strong{
  display:block;
  font-size:24px;
  margin-top:8px;
}

.pending strong{
  color:#d97706;
}

.approved strong{
  color:#16a34a;
}

.rejected strong{
  color:#dc2626;
}

.total strong{
  color:#2563eb;
}

.panel{
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.search{
  flex:1;
  min-width:220px;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
}

select{
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  background:#fff;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th,
td{
  padding:13px 10px;
  text-align:left;
  border-bottom:1px solid #e5e7eb;
  font-size:13px;
}

th{
  color:#64748b;
  font-size:12px;
  background:#f8fafc;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.status.pending{
  background:#fef3c7;
  color:#92400e;
}

.status.approved,
.status.paid{
  background:#dcfce7;
  color:#166534;
}

.status.rejected,
.status.failed{
  background:#fee2e2;
  color:#991b1b;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:7px;
  padding:8px 10px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}

.approve{
  background:#16a34a;
  color:#fff;
}

.reject{
  background:#dc2626;
  color:#fff;
}

.view{
  background:#e5e7eb;
  color:#172033;
}

.loading,
.empty{
  text-align:center;
  padding:40px;
  color:#64748b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:480px;
  background:#fff;
  border-radius:15px;
  padding:25px;
}

.modal-box h2{
  margin-bottom:18px;
}

.info{
  background:#f8fafc;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}

.info div{
  padding:6px 0;
  font-size:13px;
}

.input{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  margin-bottom:10px;
  outline:none;
}

.submit{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#16a34a;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.cancel{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#e5e7eb;
  margin-top:8px;
  cursor:pointer;
}

.message{
  padding:10px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:12px;
  display:none;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:550px){

  .stats{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>


<header>

  <div class="logo">
    Lets <span>Study Pro</span>
  </div>

  <nav class="menu">

    <a href="admin-dashboard.html">
      Dashboard
    </a>

    <a href="admin-students.html">
      Students
    </a>

    <a href="admin-payments.html">
      Payments
    </a>

    <a
      href="admin-payouts.html"
      class="active">
      Payouts
    </a>

    <a href="admin-settings.html">
      Settings
    </a>

  </nav>

</header>


<main class="container">

  <h1>
    Payout Management
  </h1>

  <p class="subtitle">
    Manage student withdrawal and payout requests.
  </p>


  <!-- STATS -->

  <div class="stats">

    <div class="stat pending">

      <small>
        Pending Payouts
      </small>

      <strong id="pendingCount">
        0
      </strong>

    </div>


    <div class="stat approved">

      <small>
        Approved / Paid
      </small>

      <strong id="approvedCount">
        0
      </strong>

    </div>


    <div class="stat rejected">

      <small>
        Rejected
      </small>

      <strong id="rejectedCount">
        0
      </strong>

    </div>


    <div class="stat total">

      <small>
        Total Amount
      </small>

      <strong id="totalAmount">
        TZS 0
      </strong>

    </div>

  </div>


  <!-- PAYOUT TABLE -->

  <section class="panel">

    <div class="toolbar">

      <input
        class="search"
        id="search"
        type="search"
        placeholder="Search user, phone or payout ID..."
      >

      <select id="filter">

        <option value="all">
          All
        </option>

        <option value="pending">
          Pending
        </option>

        <option value="approved">
          Approved
        </option>

        <option value="paid">
          Paid
        </option>

        <option value="rejected">
          Rejected
        </option>

      </select>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Payout ID</th>

            <th>User</th>

            <th>Phone</th>

            <th>Amount</th>

            <th>Status</th>

            <th>Date</th>

            <th>Reference</th>

            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="payouts">

          <tr>

            <td
              colspan="8"
              class="loading">
              Loading payouts...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>



<!-- APPROVE MODAL -->

<div
  class="modal"
  id="approveModal">

  <div class="modal-box">

    <h2>
      Approve Payout
    </h2>

    <div
      class="message"
      id="approveMessage">
    </div>


    <div
      class="info"
      id="approveInfo">
    </div>


    <input
      class="input"
      id="transactionReference"
      placeholder="Payment transaction reference"
    >


    <button
      class="submit"
      id="approveSubmit">

      Mark as Paid

    </button>


    <button
      class="cancel"
      onclick="closeModal()">

      Cancel

    </button>

  </div>

</div>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  onValue,
  update,
  get
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getDatabase(app);


let currentAdmin = null;

let payouts = [];

let selectedPayout = null;


/* =====================================================
   ADMIN AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);

    /*
    IMPORTANT:

    Do not trust the email alone.

    Admin role should be stored server-side
    / protected by Firebase Rules.
    */

    const userSnapshot =
    await get(
      ref(
        db,
        "users/" +
        user.uid
      )
    );


    if(!userSnapshot.exists()){

      alert(
        "Access denied."
      );

      window.location.href =
      "dashboard.html";

      return;

    }


    const profile =
    userSnapshot.val();


    if(
      profile.role !== "admin" &&
      profile.role !== "superadmin"
    ){

      alert(
        "You are not authorized to access this page."
      );

      window.location.href =
      "dashboard.html";

      return;

    }


    currentAdmin = {

      uid:
      user.uid,

      role:
      profile.role

    };


    loadPayouts();

  }
);


/* =====================================================
   LOAD PAYOUTS
===================================================== */

function loadPayouts(){

  const payoutsRef =
  ref(
    db,
    "withdrawals"
  );


  onValue(
    payoutsRef,
    snapshot => {

      const data =
      snapshot.val();


      payouts = [];


      if(data){

        Object.entries(data)
        .forEach(
          ([id,value]) => {

            payouts.push({

              id,

              ...value

            });

          }
        );

      }


      payouts.sort(
        (a,b) =>
        Number(
          b.createdAt || 0
        ) -
        Number(
          a.createdAt || 0
        )
      );


      updateStats();

      renderPayouts();

    },

    error => {

      console.error(error);

      document.getElementById(
        "payouts"
      ).innerHTML = `

        <tr>
          <td
            colspan="8"
            class="empty">

            Unable to load payouts.

          </td>
        </tr>

      `;

    }
  );

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const pending =
  payouts.filter(
    p =>
    String(
      p.status
    ).toLowerCase() ===
    "pending"
  );


  const approved =
  payouts.filter(
    p =>
    ["approved","paid"]
    .includes(
      String(
        p.status
      ).toLowerCase()
    )
  );


  const rejected =
  payouts.filter(
    p =>
    String(
      p.status
    ).toLowerCase() ===
    "rejected"
  );


  const total =
  payouts.reduce(
    (sum,p) =>
    sum +
    Number(
      p.amount || 0
    ),
    0
  );


  document.getElementById(
    "pendingCount"
  ).textContent =
  pending.length;


  document.getElementById(
    "approvedCount"
  ).textContent =
  approved.length;


  document.getElementById(
    "rejectedCount"
  ).textContent =
  rejected.length;


  document.getElementById(
    "totalAmount"
  ).textContent =
  "TZS " +
  total.toLocaleString(
    "en-TZ"
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderPayouts(){

  const tbody =
  document.getElementById(
    "payouts"
  );


  const search =
  document.getElementById(
    "search"
  )
  .value
  .toLowerCase()
  .trim();


  const filter =
  document.getElementById(
    "filter"
  ).value;


  const list =
  payouts.filter(
    payout => {

      const status =
      String(
        payout.status ||
        "pending"
      ).toLowerCase();


      const searchable =
      (

        payout.id +

        " " +

        payout.userId +

        " " +

        payout.phone +

        " " +

        payout.transactionReference

      )
      .toLowerCase();


      const searchMatch =
      !search ||
      searchable.includes(
        search
      );


      const filterMatch =
      filter === "all" ||
      status === filter;


      return (
        searchMatch &&
        filterMatch
      );

    }
  );


  if(!list.length){

    tbody.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty">

          No payout requests found.

        </td>

      </tr>

    `;

    return;

  }


  tbody.innerHTML =
  list.map(
    payoutRow
  ).join("");

}


/* =====================================================
   ROW
===================================================== */

function payoutRow(payout){

  const status =
  String(
    payout.status ||
    "pending"
  ).toLowerCase();


  const amount =
  Number(
    payout.amount || 0
  );


  let actions = "";


  if(
    status === "pending"
  ){

    actions = `

      <div class="actions">

        <button
          class="btn approve"
          onclick="approvePayout('${escapeAttr(payout.id)}')">

          Approve

        </button>

        <button
          class="btn reject"
          onclick="rejectPayout('${escapeAttr(payout.id)}')">

          Reject

        </button>

      </div>

    `;

  }else{

    actions = `

      <button
        class="btn view"
        onclick="viewPayout('${escapeAttr(payout.id)}')">

        View

      </button>

    `;

  }


  return `

    <tr>

      <td>
        ${escapeHtml(payout.id)}
      </td>

      <td>
        ${escapeHtml(payout.userId || "-")}
      </td>

      <td>
        ${escapeHtml(payout.phone || "-")}
      </td>

      <td>
        <strong>
          TZS ${amount.toLocaleString("en-TZ")}
        </strong>
      </td>

      <td>

        <span class="status ${escapeAttr(status)}">

          ${escapeHtml(status)}

        </span>

      </td>

      <td>
        ${formatDate(payout.createdAt)}
      </td>

      <td>
        ${escapeHtml(
          payout.transactionReference ||
          "-"
        )}
      </td>

      <td>
        ${actions}
      </td>

    </tr>

  `;

}


/* =====================================================
   APPROVE
===================================================== */

window.approvePayout =
function(id){

  selectedPayout =
  payouts.find(
    p =>
    p.id === id
  );


  if(!selectedPayout)
    return;


  document.getElementById(
    "approveInfo"
  ).innerHTML = `

    <div>
      <strong>Payout ID:</strong>
      ${escapeHtml(selectedPayout.id)}
    </div>

    <div>
      <strong>User:</strong>
      ${escapeHtml(selectedPayout.userId || "-")}
    </div>

    <div>
      <strong>Phone:</strong>
      ${escapeHtml(selectedPayout.phone || "-")}
    </div>

    <div>
      <strong>Amount:</strong>
      TZS ${
        Number(
          selectedPayout.amount || 0
        ).toLocaleString("en-TZ")
      }
    </div>

  `;


  document.getElementById(
    "transactionReference"
  ).value = "";


  document.getElementById(
    "approveModal"
  ).classList.add("show");

};


/* =====================================================
   COMPLETE PAYOUT
===================================================== */

document.getElementById(
  "approveSubmit"
)
.addEventListener(
  "click",
  async () => {

    if(!selectedPayout)
      return;


    const transactionReference =
    document.getElementById(
      "transactionReference"
    )
    .value
    .trim();


    if(!transactionReference){

      showMessage(
        "approveMessage",
        "Enter the payment transaction reference.",
        "error"
      );

      return;

    }


    try{

      /*
      IMPORTANT:

      This page records the admin action.

      Actual wallet deduction should ideally
      be done by a trusted backend/Cloud Function
      after checking the payout request.
      */


      const payout =
      selectedPayout;


      const updates = {};


      updates[
        `withdrawals/${payout.id}/status`
      ] =
      "paid";


      updates[
        `withdrawals/${payout.id}/transactionReference`
      ] =
      transactionReference;


      updates[
        `withdrawals/${payout.id}/processedBy`
      ] =
      currentAdmin.uid;


      updates[
        `withdrawals/${payout.id}/processedAt`
      ] =
      Date.now();


      await update(
        ref(db),
        updates
      );


      showMessage(
        "approveMessage",
        "Payout marked as paid successfully.",
        "success"
      );


      setTimeout(
        () => {

          closeModal();

        },
        1000
      );


    }catch(error){

      console.error(error);

      showMessage(
        "approveMessage",
        "Unable to process payout.",
        "error"
      );

    }

  }
);


/* =====================================================
   REJECT
===================================================== */

window.rejectPayout =
async function(id){

  const payout =
  payouts.find(
    p =>
    p.id === id
  );


  if(!payout)
    return;


  const reason =
  prompt(
    "Enter rejection reason:"
  );


  if(!reason)
    return;


  try{

    const updates = {};


    updates[
      `withdrawals/${id}/status`
    ] =
    "rejected";


    updates[
      `withdrawals/${id}/rejectionReason`
    ] =
    reason;


    updates[
      `withdrawals/${id}/processedBy`
    ] =
    currentAdmin.uid;


    updates[
      `withdrawals/${id}/processedAt`
    ] =
    Date.now();


    await update(
      ref(db),
      updates
    );


    alert(
      "Payout rejected."
    );


  }catch(error){

    console.error(error);

    alert(
      "Unable to reject payout."
    );

  }

};


/* =====================================================
   VIEW
===================================================== */

window.viewPayout =
function(id){

  const payout =
  payouts.find(
    p =>
    p.id === id
  );


  if(!payout)
    return;


  alert(

    "Payout ID: " +
    payout.id +

    "\n\nUser: " +
    (payout.userId || "-") +

    "\nPhone: " +
    (payout.phone || "-") +

    "\nAmount: TZS " +
    Number(
      payout.amount || 0
    ).toLocaleString("en-TZ") +

    "\nStatus: " +
    (payout.status || "-") +

    "\nReference: " +
    (payout.transactionReference || "-")

  );

};


/* =====================================================
   CLOSE
===================================================== */

window.closeModal =
function(){

  document.getElementById(
    "approveModal"
  ).classList.remove(
    "show"
  );

  selectedPayout = null;

};


/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
  "search"
)
.addEventListener(
  "input",
  renderPayouts
);


document.getElementById(
  "filter"
)
.addEventListener(
  "change",
  renderPayouts
);


/* =====================================================
   HELPERS
===================================================== */

function formatDate(value){

  if(!value)
    return "-";


  const date =
  new Date(
    Number(value)
  );


  if(
    isNaN(
      date.getTime()
    )
  )
    return "-";


  return date.toLocaleString(
    "en-TZ"
  );

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function escapeAttr(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "\\",
    "\\\\"
  )
  .replaceAll(
    "'",
    "\\'"
  );

}

/* =====================================================
   PAGE INITIALIZATION
===================================================== */

document.addEventListener("DOMContentLoaded", () => {

  const search =
    document.getElementById("search");

  const filter =
    document.getElementById("filter");


  if(search){

    search.addEventListener(
      "input",
      renderPayouts
    );

  }


  if(filter){

    filter.addEventListener(
      "change",
      renderPayouts
    );

  }

});


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttr(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "\\",
    "\\\\"
  )
  .replaceAll(
    "'",
    "\\'"
  );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value){

    return "-";

  }


  const date =
    new Date(
      Number(value)
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  return date.toLocaleString(
    "en-TZ",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* =====================================================
   FORMAT MONEY
===================================================== */

function formatMoney(amount){

  return (
    "TZS " +
    Number(
      amount || 0
    ).toLocaleString("en-TZ")
  );

}


/* =====================================================
   RENDER PAYOUTS
===================================================== */

function renderPayouts(){

  const tbody =
    document.getElementById(
      "payouts"
    );


  if(!tbody){

    return;

  }


  const searchInput =
    document.getElementById(
      "search"
    );


  const filterInput =
    document.getElementById(
      "filter"
    );


  const search =
    String(
      searchInput?.value || ""
    )
    .toLowerCase()
    .trim();


  const filter =
    filterInput?.value ||
    "all";


  const filtered =
    payouts.filter(
      payout => {

        const status =
          String(
            payout.status ||
            "pending"
          )
          .toLowerCase();


        const text = [

          payout.id,

          payout.userId,

          payout.phone,

          payout.transactionReference,

          payout.rejectionReason

        ]
        .join(" ")
        .toLowerCase();


        const matchesSearch =
          !search ||
          text.includes(search);


        const matchesFilter =
          filter === "all" ||
          status === filter;


        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );


  if(
    filtered.length === 0
  ){

    tbody.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty">

          No payout requests found.

        </td>

      </tr>

    `;

    return;

  }


  tbody.innerHTML =
    filtered
    .map(
      payoutRow
    )
    .join("");

}


/* =====================================================
   PAYOUT ROW
===================================================== */

function payoutRow(payout){

  const id =
    String(
      payout.id || ""
    );


  const status =
    String(
      payout.status ||
      "pending"
    )
    .toLowerCase();


  const amount =
    Number(
      payout.amount || 0
    );


  let actions = "";


  if(
    status === "pending"
  ){

    actions = `

      <div class="actions">

        <button
          class="btn approve"
          onclick="approvePayout('${escapeAttr(id)}')">

          Approve

        </button>


        <button
          class="btn reject"
          onclick="rejectPayout('${escapeAttr(id)}')">

          Reject

        </button>

      </div>

    `;

  }else{

    actions = `

      <button
        class="btn view"
        onclick="viewPayout('${escapeAttr(id)}')">

        View

      </button>

    `;

  }


  return `

    <tr>

      <td>
        ${escapeHtml(id)}
      </td>


      <td>
        ${escapeHtml(
          payout.userId || "-"
        )}
      </td>


      <td>
        ${escapeHtml(
          payout.phone || "-"
        )}
      </td>


      <td>

        <strong>
          ${formatMoney(amount)}
        </strong>

      </td>


      <td>

        <span
          class="status ${escapeAttr(status)}">

          ${escapeHtml(status)}

        </span>

      </td>


      <td>
        ${formatDate(
          payout.createdAt
        )}
      </td>


      <td>
        ${escapeHtml(
          payout.transactionReference ||
          "-"
        )}
      </td>


      <td>
        ${actions}
      </td>

    </tr>

  `;

}


/* =====================================================
   APPROVE PAYOUT
===================================================== */

window.approvePayout =
async function(id){

  const payout =
    payouts.find(
      item =>
        item.id === id
    );


  if(!payout){

    alert(
      "Payout not found."
    );

    return;

  }


  if(
    String(
      payout.status
    ).toLowerCase() !==
    "pending"
  ){

    alert(
      "This payout has already been processed."
    );

    return;

  }


  selectedPayout =
    payout;


  const info =
    document.getElementById(
      "approveInfo"
    );


  if(info){

    info.innerHTML = `

      <div>
        <strong>Payout ID:</strong>
        ${escapeHtml(
          payout.id
        )}
      </div>

      <div>
        <strong>User:</strong>
        ${escapeHtml(
          payout.userId || "-"
        )}
      </div>

      <div>
        <strong>Phone:</strong>
        ${escapeHtml(
          payout.phone || "-"
        )}
      </div>

      <div>
        <strong>Amount:</strong>
        ${formatMoney(
          payout.amount
        )}
      </div>

    `;

  }


  const reference =
    document.getElementById(
      "transactionReference"
    );


  if(reference){

    reference.value = "";

  }


  document
    .getElementById(
      "approveModal"
    )
    ?.classList.add(
      "show"
    );

};


/* =====================================================
   COMPLETE PAYOUT
===================================================== */

document
  .getElementById(
    "approveSubmit"
  )
  ?.addEventListener(
    "click",
    async () => {

      if(!selectedPayout){

        return;

      }


      const referenceInput =
        document.getElementById(
          "transactionReference"
        );


      const transactionReference =
        String(
          referenceInput?.value || ""
        )
        .trim();


      if(!transactionReference){

        showMessage(
          "approveMessage",
          "Enter the payment transaction reference.",
          "error"
        );

        return;

      }


      const payoutId =
        selectedPayout.id;


      try{

        const updates = {};


        updates[
          `withdrawals/${payoutId}/status`
        ] =
          "paid";


        updates[
          `withdrawals/${payoutId}/transactionReference`
        ] =
          transactionReference;


        updates[
          `withdrawals/${payoutId}/processedBy`
        ] =
          currentAdmin.uid;


        updates[
          `withdrawals/${payoutId}/processedAt`
        ] =
          Date.now();


        await update(
          ref(db),
          updates
        );


        showMessage(
          "approveMessage",
          "Payout marked as paid successfully.",
          "success"
        );


        setTimeout(
          closeModal,
          1000
        );


      }catch(error){

        console.error(
          "Payout error:",
          error
        );


        showMessage(
          "approveMessage",
          "Unable to process payout.",
          "error"
        );

      }

    }
  );


/* =====================================================
   REJECT PAYOUT
===================================================== */

window.rejectPayout =
async function(id){

  const payout =
    payouts.find(
      item =>
        item.id === id
    );


  if(!payout){

    alert(
      "Payout not found."
    );

    return;

  }


  if(
    String(
      payout.status
    ).toLowerCase() !==
    "pending"
  ){

    alert(
      "This payout has already been processed."
    );

    return;

  }


  const reason =
    prompt(
      "Enter rejection reason:"
    );


  if(
    reason === null ||
    !reason.trim()
  ){

    return;

  }


  try{

    const updates = {};


    updates[
      `withdrawals/${id}/status`
    ] =
      "rejected";


    updates[
      `withdrawals/${id}/rejectionReason`
    ] =
      reason.trim();


    updates[
      `withdrawals/${id}/processedBy`
    ] =
      currentAdmin.uid;


    updates[
      `withdrawals/${id}/processedAt`
    ] =
      Date.now();


    await update(
      ref(db),
      updates
    );


    alert(
      "Payout rejected successfully."
    );


  }catch(error){

    console.error(
      "Reject payout error:",
      error
    );


    alert(
      "Unable to reject payout."
    );

  }

};


/* =====================================================
   VIEW PAYOUT
===================================================== */

window.viewPayout =
function(id){

  const payout =
    payouts.find(
      item =>
        item.id === id
    );


  if(!payout){

    return;

  }


  const details = [

    "Payout ID: " +
    (payout.id || "-"),

    "User ID: " +
    (payout.userId || "-"),

    "Phone: " +
    (payout.phone || "-"),

    "Amount: " +
    formatMoney(
      payout.amount
    ),

    "Status: " +
    (payout.status || "-"),

    "Reference: " +
    (
      payout.transactionReference ||
      "-"
    ),

    "Date: " +
    formatDate(
      payout.createdAt
    ),

    "Rejection reason: " +
    (
      payout.rejectionReason ||
      "-"
    )

  ];


  alert(
    details.join("\n\n")
  );

};


/* =====================================================
   CLOSE MODAL
===================================================== */

window.closeModal =
function(){

  document
    .getElementById(
      "approveModal"
    )
    ?.classList.remove(
      "show"
    );


  selectedPayout =
    null;


  const message =
    document.getElementById(
      "approveMessage"
    );


  if(message){

    message.className =
      "message";

    message.textContent =
      "";

  }

};


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
  id,
  message,
  type
){

  const element =
    document.getElementById(
      id
    );


  if(!element){

    return;

  }


  element.textContent =
    message;


  element.className =
    "message " +
    type;

}


/* =====================================================
   UPDATE STATISTICS
===================================================== */

function updateStats(){

  const pending =
    payouts.filter(
      payout =>
        String(
          payout.status ||
          "pending"
        ).toLowerCase() ===
        "pending"
    );


  const approved =
    payouts.filter(
      payout =>
        [
          "approved",
          "paid"
        ].includes(
          String(
            payout.status || ""
          ).toLowerCase()
        )
    );


  const rejected =
    payouts.filter(
      payout =>
        String(
          payout.status || ""
        ).toLowerCase() ===
        "rejected"
    );


  const total =
    payouts.reduce(
      (
        sum,
        payout
      ) =>
        sum +
        Number(
          payout.amount || 0
        ),
      0
    );


  const pendingElement =
    document.getElementById(
      "pendingCount"
    );


  const approvedElement =
    document.getElementById(
      "approvedCount"
    );


  const rejectedElement =
    document.getElementById(
      "rejectedCount"
    );


  const totalElement =
    document.getElementById(
      "totalAmount"
    );


  if(pendingElement){

    pendingElement.textContent =
      pending.length;

  }


  if(approvedElement){

    approvedElement.textContent =
      approved.length;

  }


  if(rejectedElement){

    rejectedElement.textContent =
      rejected.length;

  }


  if(totalElement){

    totalElement.textContent =
      formatMoney(total);

  }

}


/* =====================================================
   REALTIME PAYOUT LISTENER
===================================================== */

function loadPayouts(){

  const payoutsRef =
    ref(
      db,
      "withdrawals"
    );


  onValue(
    payoutsRef,
    snapshot => {

      const data =
        snapshot.val();


      payouts = [];


      if(data){

        Object.entries(
          data
        )
        .forEach(
          ([id,value]) => {

            payouts.push({

              id,

              ...(value || {})

            });

          }
        );

      }


      payouts.sort(
        (
          a,
          b
        ) =>
          Number(
            b.createdAt || 0
          ) -
          Number(
            a.createdAt || 0
          )
      );


      updateStats();

      renderPayouts();

    },
    error => {

      console.error(
        "Firebase error:",
        error
      );


      const tbody =
        document.getElementById(
          "payouts"
        );


      if(tbody){

        tbody.innerHTML = `

          <tr>

            <td
              colspan="8"
              class="empty">

              Unable to load payout data.

            </td>

          </tr>

        `;

      }

    }
  );

}


/* =====================================================
   FINAL SAFETY CHECK
===================================================== */

if(
  typeof currentAdmin !==
  "undefined"
){

  console.log(
    "Admin payouts ready."
  );

}

</script>
