<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premium Courses Management | LetsStudy Pro</title>
<meta name="robots" content="noindex,nofollow">

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.topbar{
 height:64px;background:#fff;border-bottom:1px solid #e5e7eb;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 20px;position:sticky;top:0;z-index:10
}
.brand{font-size:18px;font-weight:800;color:#155eef}
.topbar a{font-size:13px;color:#475467;margin-left:15px}

main{max-width:1400px;margin:auto;padding:25px 20px}

.hero,.toolbar,.stat,.course,.modal{
 background:#fff;border:1px solid #e5e7eb;border-radius:14px
}
.hero{padding:25px;margin-bottom:18px;display:flex;justify-content:space-between;gap:15px}
.hero h1{font-size:26px;margin-bottom:8px}
.hero p{font-size:13px;color:#667085;line-height:1.5}

.btn{
 border:0;border-radius:8px;padding:10px 14px;
 font-size:12px;font-weight:700
}
.primary{background:#155eef;color:#fff}
.secondary{background:#f2f4f7;color:#344054}
.danger{background:#fef3f2;color:#b42318}

.stats{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:12px;margin-bottom:18px
}
.stat{padding:18px}
.stat b{font-size:24px;display:block;margin-bottom:5px}
.stat span{font-size:12px;color:#667085}

.toolbar{
 padding:12px;display:flex;gap:10px;margin-bottom:18px
}
.toolbar input,.toolbar select{
 height:40px;border:1px solid #d0d5dd;border-radius:8px;
 padding:0 10px;outline:none
}
.toolbar input{flex:1;min-width:200px}

.courses{
 display:grid;grid-template-columns:repeat(3,1fr);gap:18px
}
.course{overflow:hidden}
.course-img{height:170px;background:#eef2f7}
.course-img img{width:100%;height:100%;object-fit:cover}
.course-body{padding:16px}
.course h3{font-size:16px;margin-bottom:7px}
.desc{font-size:12px;color:#667085;line-height:1.5;margin-bottom:10px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{background:#f2f4f7;padding:5px 7px;border-radius:5px;font-size:10px}
.price{font-weight:800;margin-bottom:8px}
.status{font-size:10px;font-weight:700;margin-bottom:12px}
.published{color:#067647}
.draft{color:#b54708}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.actions button{border:0;border-radius:7px;padding:9px;font-size:11px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:50px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;color:#667085}
.loading{grid-column:1/-1;text-align:center;padding:50px}

.overlay{
 position:fixed;inset:0;background:#0008;display:none;
 align-items:center;justify-content:center;padding:15px;z-index:100
}
.overlay.show{display:flex}
.modal{width:min(700px,100%);max-height:92vh;overflow:auto}
.modal-head{
 padding:16px 18px;border-bottom:1px solid #e5e7eb;
 display:flex;justify-content:space-between
}
.modal-body{padding:18px}
.modal-foot{
 padding:14px 18px;border-top:1px solid #e5e7eb;
 display:flex;justify-content:flex-end;gap:8px
}
.close{border:0;background:#f2f4f7;width:34px;height:34px;border-radius:7px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:700}
.field input,.field textarea,.field select{
 width:100%;border:1px solid #d0d5dd;border-radius:8px;
 padding:10px;outline:none;font-size:12px
}
.field textarea{min-height:90px;resize:vertical}

.lesson{
 display:flex;justify-content:space-between;align-items:center;
 border:1px solid #e5e7eb;border-radius:9px;padding:12px;margin-bottom:8px
}
.lesson-title{font-size:13px;font-weight:700}
.lesson-meta{font-size:10px;color:#667085;margin-top:4px}
.lesson-actions{display:flex;gap:5px}
.lesson-actions button{border:0;border-radius:6px;padding:8px}

.toast{
 position:fixed;right:15px;bottom:15px;
 background:#172033;color:#fff;padding:12px 15px;
 border-radius:8px;font-size:12px;display:none;z-index:300
}
.toast.show{display:block}
.toast.success{background:#067647}
.toast.error{background:#b42318}

@media(max-width:950px){
 .courses{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
 .hero{display:block}
 .hero .btn{margin-top:15px}
 .stats{grid-template-columns:1fr 1fr}
 .courses{grid-template-columns:1fr}
 .toolbar{flex-wrap:wrap}
 .toolbar input{min-width:100%}
 .form{grid-template-columns:1fr}
 .full{grid-column:auto}
}
</style>
</head>

<body>

<header class="topbar">
 <a href="admin.html" class="brand">
  <i class="fa fa-graduation-cap"></i> LetsStudy Pro
 </a>
 <div>
  <a href="admin.html">Dashboard</a>
  <a href="premium-dashboard.html">Premium</a>
 </div>
</header>

<main>

<section class="hero">
 <div>
  <h1>Premium Course Management</h1>
  <p>Create, edit, publish and manage premium courses and lessons.</p>
 </div>
 <button class="btn primary" id="addCourse">
  <i class="fa fa-plus"></i> Add Course
 </button>
</section>

<section class="stats">
 <div class="stat"><b id="total">0</b><span>Total Courses</span></div>
 <div class="stat"><b id="published">0</b><span>Published</span></div>
 <div class="stat"><b id="draft">0</b><span>Drafts</span></div>
 <div class="stat"><b id="lessons">0</b><span>Total Lessons</span></div>
</section>

<section class="toolbar">
 <input id="search" placeholder="Search courses...">
 <select id="statusFilter">
  <option value="all">All Status</option>
  <option value="published">Published</option>
  <option value="draft">Draft</option>
 </select>
 <select id="levelFilter">
  <option value="all">All Levels</option>
  <option value="Beginner">Beginner</option>
  <option value="Intermediate">Intermediate</option>
  <option value="Advanced">Advanced</option>
 </select>
 <button class="btn secondary" id="refresh">
  <i class="fa fa-refresh"></i>
 </button>
</section>

<section class="premiumCourses" id="premiumCourses">
 <div class="loading">Loading courses...</div>
</section>

</main>

<!-- COURSE MODAL -->
<div class="overlay" id="courseModal">
<div class="modal">

<div class="modal-head">
 <h2 id="modalTitle">Add Course</h2>
 <button class="close" id="closeCourse">×</button>
</div>

<form id="courseForm">

<div class="modal-body">
<input type="hidden" id="courseId">

<div class="form">

<div class="field full">
<label>Course Title</label>
<input id="title" required>
</div>

<div class="field full">
<label>Description</label>
<textarea id="description"></textarea>
</div>

<div class="field full">
<label>Thumbnail URL</label>
<input id="thumbnail" type="url">
</div>

<div class="field">
<label>Instructor</label>
<input id="instructor">
</div>

<div class="field">
<label>Category</label>
<input id="category">
</div>

<div class="field">
<label>Level</label>
<select id="level">
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
</select>
</div>

<div class="field">
<label>Duration</label>
<input id="duration" placeholder="e.g. 8 weeks">
</div>

<div class="field">
<label>Price</label>
<input id="price" type="number" min="0" value="0">
</div>

<div class="field">
<label>Currency</label>
<input id="currency" value="TZS">
</div>

<div class="field">
<label>Status</label>
<select id="courseStatus">
<option value="draft">Draft</option>
<option value="published">Published</option>
</select>
</div>

<label>Featured</label>
<select id="featured">
<option value="false">No</option>
<option value="true">Yes</option>
</select>

</div>

<button type="button" class="btn secondary" id="cancelCourse">Cancel</button>

</div>
</div>

<!-- LESSONS MODAL -->
<div class="overlay" id="lessonModal">
<div class="modal">

<div class="modal-head">
<div>
<h2>Course Lessons</h2>
<small id="lessonCourse"></small>
</div>
<button class="close" id="closeLessons">×</button>
</div>

<div class="modal-body">
<button class="btn primary" id="addLesson">
<i class="fa fa-plus"></i> Add Lesson
</button>
<br><br>
<div id="lessonList"></div>
</div>

</div>
</div>

<!-- LESSON FORM -->
<div class="overlay" id="lessonFormModal">
<div class="modal">

<div class="modal-head">
<h2 id="lessonTitleModal">Add Lesson</h2>
<button class="close" id="closeLessonForm">×</button>
</div>

<form id="lessonForm">

<div class="modal-body">
<input type="hidden" id="lessonIndex">

<div class="form">

<div class="field full">
<label>Lesson Title</label>
<input id="lessonTitle" required>
</div>

<div class="field full">
<label>Description</label>
<textarea id="lessonDescription"></textarea>
</div>

<div class="field full">
<label>Video URL</label>
<input id="videoUrl" type="url">
</div>

<div class="field">
<label>Duration</label>
<input id="lessonDuration">
</div>

<div class="field">
<label>Order</label>
<input id="lessonOrder" type="number" min="1" value="1">
</div>

<div class="field">
<label>Status</label>
<select id="lessonStatus">
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>
</div>

</div>
</div>

<div class="modal-foot">
<button type="button" class="btn secondary" id="cancelLesson">Cancel</button>
<button class="btn primary">Save Lesson</button>
</div>

</form>
</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 doc,
 addDoc,
 updateDoc,
 deleteDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBcOYDfAVK5XbkljsyRgI_0rjodBn678tCc",
 authDomain:"let-s-study-pro-course.firebaseapp.com",
 databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
 projectId:"let-s-study-pro-course",
 storageBucket:"let-s-study-pro-course.firebasestorage.app",
 messagingSenderId:"474928293390",
 appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
 measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let courses=[];
let selectedCourse=null;
let selectedLessons=[];

const $=id=>document.getElementById(id);

function toast(msg,type=""){
 $("toast").textContent=msg;
 $("toast").className="toast show "+type;
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>{
  $("toast").className="toast";
 },3000);
}

function safe(v=""){
 return String(v)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function lessonsOf(course){
 return Array.isArray(course.lessons)
 ? course.lessons : [];
}

function updateStats(){

 $("total").textContent=courses.length;

 $("published").textContent=
 courses.filter(c=>String(c.status||"").toLowerCase()==="published").length;

 $("draft").textContent=
 courses.filter(c=>String(c.status||"").toLowerCase()!=="published").length;

 $("lessons").textContent=
 courses.reduce((n,c)=>n+lessonsOf(c).length,0);
}

function render(){

 const search=$("search").value.trim().toLowerCase();
 const status=$("statusFilter").value;
 const level=$("levelFilter").value;

 const list=courses.filter(c=>{

  const text=[
   c.title,c.description,c.category,c.instructor
  ].join(" ").toLowerCase();

  const s=String(c.status||"draft").toLowerCase();
  const l=String(c.level||"").toLowerCase();

  return (
   (!search||text.includes(search)) &&
   (status==="all"||s===status) &&
   (level==="all"||l===level.toLowerCase())
  );
 });

 if(!list.length){
  $("courses").innerHTML=`
   <div class="empty">
    <i class="fa fa-book"></i>
    <h3>No Courses Found</h3>
    <p>Add a premium course or change your filters.</p>
   </div>`;
  return;
 }

 $("courses").innerHTML=list.map(c=>{

  const image=c.thumbnail||c.image||
   "https://placehold.co/900x500/eaf0f8/155eef?text=Premium+Course";

  const price=Number(c.price||0);

  return `
  <article class="course">

   <div class="course-img">
    <img src="${safe(image)}"
         alt="${safe(c.title||"Course")}"
         onerror="this.src='https://placehold.co/900x500/eaf0f8/155eef?text=Course'">
   </div>

   <div class="course-body">

    <h3>${safe(c.title||"Untitled Course")}</h3>

    <div class="desc">
     ${safe(c.description||"No description available.")}
    </div>

    <div class="tags">
     ${c.category?`<span class="tag">${safe(c.category)}</span>`:""}
     ${c.level?`<span class="tag">${safe(c.level)}</span>`:""}
     <span class="tag">${lessonsOf(c).length} Lessons</span>
    </div>

    <div class="price">
     ${price<=0?"Free":
       new Intl.NumberFormat("en-US").format(price)+" "+safe(c.currency||"TZS")}
    </div>

    <div class="status ${String(c.status||"draft").toLowerCase()==="published"?"published":"draft"}">
     ${String(c.status||"draft").toUpperCase()}
    </div>

    <div class="actions">

     <button onclick="openLessons('${c.id}')" class="secondary">
      <i class="fa fa-book"></i> Lessons
     </button>

     <button onclick="editCourse('${c.id}')" class="secondary">
      <i class="fa fa-pen"></i> Edit
     </button>

     <button onclick="featureCourse('${c.id}')" class="secondary">
      <i class="fa fa-star"></i>
      ${c.featured?"Unfeature":"Feature"}
     </button>

     <button onclick="deleteCourse('${c.id}')" class="danger">
      <i class="fa fa-trash"></i> Delete
     </button>

    </div>

   </div>
  </article>`;
 }).join("");
}

async function loadCourses(){

 $("courses").innerHTML=
 `<div class="loading">
  <i class="fa fa-spinner fa-spin"></i> Loading courses...
 </div>`;

 try{

  const snap=await getDocs(
   collection(db,"courses")
  );

  courses=snap.docs.map(d=>({
   id:d.id,
   ...d.data()
  }));

  courses.sort((a,b)=>{
   const A=a.createdAt?.seconds||0;
   const B=b.createdAt?.seconds||0;
   return B-A;
  });

  updateStats();
  render();

 }catch(error){

  console.error(error);

  $("courses").innerHTML=`
   <div class="empty">
    <h3>Unable to Load Courses</h3>
    <p>${safe(error.message)}</p>
    <br>
    <button class="btn primary" onclick="loadCourses()">
     Try Again
    </button>
   </div>`;

  toast("Unable to load courses.","error");
 }
}

function openCourseModal(id=null){

 $("courseForm").reset();
 $("courseId").value=id||"";

 if(id){

  const c=courses.find(x=>x.id===id);

  if(!c)return;

  $("modalTitle").textContent="Edit Course";

  $("title").value=c.title||"";
  $("description").value=c.description||"";
  $("thumbnail").value=c.thumbnail||c.image||"";
  $("instructor").value=c.instructor||"";
  $("category").value=c.category||"";
  $("level").value=c.level||"Beginner";
  $("duration").value=c.duration||"";
  $("price").value=c.price??0;
  $("currency").value=c.currency||"TZS";
  $("courseStatus").value=c.status||"draft";
  $("featured").value=String(Boolean(c.featured));

 }else{

  $("modalTitle").textContent="Add Premium Course";
  $("courseStatus").value="draft";
  $("level").value="Beginner";
  $("currency").value="TZS";
  $("featured").value="false";

 }

 $("courseModal").classList.add("show");
}

function closeCourse(){
 $("courseModal").classList.remove("show");
}

$("courseForm").addEventListener("submit",async e=>{

 e.preventDefault();

 const id=$("courseId").value;

 const data={
  title:$("title").value.trim(),
  description:$("description").value.trim(),
  thumbnail:$("thumbnail").value.trim(),
  image:$("thumbnail").value.trim(),
  instructor:$("instructor").value.trim(),
  category:$("category").value.trim(),
  level:$("level").value,
  duration:$("duration").value.trim(),
  price:Number($("price").value||0),
  currency:$("currency").value.trim()||"TZS",
  status:$("courseStatus").value,
  featured:$("featured").value==="true",
  updatedAt:serverTimestamp()
 };

 try{

  if(id){

   await updateDoc(
    doc(db,"courses",id),
    data
   );

   toast("Course updated.","success");

  }else{

   await addDoc(
    collection(db,"courses"),
    {
     ...data,
     lessons:[],
     lessonCount:0,
     createdAt:serverTimestamp()
    }
   );

   toast("Course created.","success");
  }

  closeCourse();
  await loadCourses();

 }catch(error){

  console.error(error);
  toast(error.message,"error");
 }
});

function editCourse(id){
 openCourseModal(id);
}

async function deleteCourse(id){

 const c=courses.find(x=>x.id===id);

 if(!c)return;

 if(!confirm(`Delete "${c.title||"this course"}"?`))return;

 try{

  await deleteDoc(
   doc(db,"courses",id)
  );

  toast("Course deleted.","success");
  await loadCourses();

 }catch(error){

  console.error(error);
  toast(error.message,"error");
 }
}

async function featureCourse(id){

 const c=courses.find(x=>x.id===id);

 if(!c)return;

 try{

  await updateDoc(
   doc(db,"courses",id),
   {
    featured:!Boolean(c.featured),
    updatedAt:serverTimestamp()
   }
  );

  toast(
   c.featured
   ?"Course unfeatured."
   :"Course featured.",
   "success"
  );

  await loadCourses();

 }catch(error){

  toast(error.message,"error");
 }
}

/* LESSONS */

async function openLessons(id){

 const c=courses.find(x=>x.id===id);

 if(!c)return;

 selectedCourse=c;
 selectedLessons=lessonsOf(c);

 $("lessonCourse").textContent=c.title||"";
 $("lessonModal").classList.add("show");

 renderLessons();
}

function renderLessons(){

 if(!selectedLessons.length){

  $("lessonList").innerHTML=`
   <div class="empty">
    <h3>No Lessons Yet</h3>
    <p>Add the first lesson.</p>
   </div>`;
  return;
 }

 const list=[...selectedLessons]
 .map((x,i)=>({...x,_i:i}))
 .sort((a,b)=>
  Number(a.order||a.lessonOrder||0)-
  Number(b.order||b.lessonOrder||0)
 );

 $("lessonList").innerHTML=list.map((l,n)=>`

  <div class="lesson">

   <div>
    <div class="lesson-title">
     ${n+1}. ${safe(l.title||"Untitled Lesson")}
    </div>

    <div class="lesson-meta">
     ${safe(l.duration||"No duration")}
     • ${safe(l.status||"draft")}
    </div>
   </div>

   <div class="lesson-actions">

    <button
     class="secondary"
     onclick="editLesson(${l._i})">
     <i class="fa fa-pen"></i>
    </button>

    <button
     class="danger"
     onclick="deleteLesson(${l._i})">
     <i class="fa fa-trash"></i>
    </button>

   </div>

  </div>

 `).join("");
}

function openLessonForm(index=null){

 $("lessonForm").reset();

 $("lessonIndex").value=
  index===null?"":index;

 if(index!==null){

  const l=selectedLessons[index];

  if(!l)return;

  $("lessonTitleModal").textContent="Edit Lesson";
  $("lessonTitle").value=l.title||"";
  $("lessonDescription").value=l.description||"";
  $("videoUrl").value=l.videoUrl||l.contentUrl||"";
  $("lessonDuration").value=l.duration||"";
  $("lessonOrder").value=l.order||l.lessonOrder||index+1;
  $("lessonStatus").value=l.status||"published";

 }else{

  $("lessonTitleModal").textContent="Add Lesson";
  $("lessonOrder").value=selectedLessons.length+1;
  $("lessonStatus").value="published";

 }

 $("lessonFormModal").classList.add("show");
}

$("lessonForm").addEventListener("submit",async e=>{

 e.preventDefault();

 if(!selectedCourse)return;

 const index=
  $("lessonIndex").value===""
  ?null
  :Number($("lessonIndex").value);

 const lesson={
  title:$("lessonTitle").value.trim(),
  description:$("lessonDescription").value.trim(),
  videoUrl:$("videoUrl").value.trim(),
  contentUrl:$("videoUrl").value.trim(),
  duration:$("lessonDuration").value.trim(),
  order:Number($("lessonOrder").value||1),
  lessonOrder:Number($("lessonOrder").value||1),
  status:$("lessonStatus").value
 };

 if(!lesson.title){

  toast("Lesson title is required.","error");
  return;
 }

 try{

  const updated=[...selectedLessons];

  if(index===null)
  updated.push(lesson);
else
  updated[index] = {
    ...updated[index],
    ...lesson
  };

await updateDoc(
  doc(db, "courses", selectedCourse.id),
  {
    lessons: updated,
    lessonCount: updated.length,
    updatedAt: serverTimestamp()
  }
);

selectedLessons = updated;
selectedCourse.lessons = updated;

$("lessonFormModal").classList.remove("show");

renderLessons();
updateStats();

toast(
  index === null
    ? "Lesson added successfully."
    : "Lesson updated successfully.",
  "success"
);

}catch(error){

  console.error("Lesson save error:", error);
  toast(error.message || "Failed to save lesson.", "error");

}

});


/* DELETE LESSON */

async function deleteLesson(index){

  if(!selectedCourse) return;

  const lesson = selectedLessons[index];

  if(!lesson) return;

  const name = lesson.title || "this lesson";

  if(!confirm(`Delete "${name}"?`)) return;

  try{

    const updated = selectedLessons.filter(
      (_, i) => i !== index
    );

    await updateDoc(
      doc(db, "courses", selectedCourse.id),
      {
        lessons: updated,
        lessonCount: updated.length,
        updatedAt: serverTimestamp()
      }
    );

    selectedLessons = updated;
    selectedCourse.lessons = updated;

    renderLessons();
    updateStats();

    toast(
      "Lesson deleted successfully.",
      "success"
    );

  }catch(error){

    console.error("Delete lesson error:", error);

    toast(
      error.message || "Failed to delete lesson.",
      "error"
    );

  }

}


/* CLOSE LESSON FORM */

function closeLessonForm(){

  $("lessonFormModal").classList.remove("show");

}


/* CLOSE LESSONS */

function closeLessons(){

  $("lessonModal").classList.remove("show");

  selectedCourse = null;
  selectedLessons = [];

}

$("addCourse").addEventListener(
  "click",
  () => openCourseModal()
);

$("closeCourse").addEventListener(
  "click",
  closeCourse
);

$("cancelCourse").addEventListener(
  "click",
  closeCourse
);

$("closeLessons").addEventListener(
  "click",
  closeLessons
);

$("addLesson").addEventListener(
  "click",

);

$("closeLessonForm").addEventListener(
  "click",
  closeLessonForm
);

$("cancelLesson").addEventListener(
  "click",
  closeLessonForm
);


/* SEARCH + FILTER */

$("search").addEventListener(
  "input",
  render
);

$("statusFilter").addEventListener(
  "change",
  render
);

$("levelFilter").addEventListener(
  "change",
  render
);

$("refresh").addEventListener(
  "click",
  loadCourses
);


/* CLOSE MODALS WHEN CLICKING OUTSIDE */

$("courseModal").addEventListener(
  "click",
  e => {
    if(e.target === $("courseModal")){
      closeCourse();
    }
  }
);

$("lessonModal").addEventListener(
  "click",
  e => {
    if(e.target === $("lessonModal")){
      closeLessons();
    }
  }
);

$("lessonFormModal").addEventListener(
  "click",
  e => {
    if(e.target === $("lessonFormModal")){
      closeLessonForm();
    }
  }
);


/* ESC KEY */

document.addEventListener(
  "keydown",
  e => {

    if(e.key !== "Escape") return;

    closeCourse();
    closeLessonForm();
    closeLessons();

  }
);


/* GLOBAL FUNCTIONS */

window.openCourseModal = openCourseModal;
window.closeCourse = closeCourse;

window.editCourse = editCourse;
window.deleteCourse = deleteCourse;
window.featureCourse = featureCourse;

window.openLessons = openLessons;
window.editLesson = openLessonForm;
window.deleteLesson = deleteLesson;

window.closeLessons = closeLessons;
window.loadCourses = loadCourses;


/* INITIAL LOAD */

loadCourses();

</script>
