<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   STATE
========================= */

let questions = [];

let courses = [];


/* =========================
   HELPERS
========================= */

const $ =
  id => document.getElementById(id);


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showLoading(){

  $("loading").style.display =
    "flex";

}


function hideLoading(){

  $("loading").style.display =
    "none";

}


function showToast(message){

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  setTimeout(() => {

    toast.style.display =
      "none";

  },3000);

}


/* =========================
   COURSE NAME
========================= */

function getCourseName(courseId){

  const course =
    courses.find(
      item => item.id === courseId
    );

  return course
    ? course.title || "Untitled Course"
    : "Unknown Course";

}


/* =========================
   LOAD COURSES
========================= */

async function loadCourses(){

  const snapshot =
    await getDocs(
      collection(
        db,
        "premiumCourses"
      )
    );


  courses =
    snapshot.docs.map(
      item => ({

        id:item.id,

        ...item.data()

      })
    );


  courses.sort(
    (a,b) =>
      String(a.title || "")
        .localeCompare(
          String(b.title || "")
        )
  );


  renderCourseOptions();

}


/* =========================
   COURSE OPTIONS
========================= */

function renderCourseOptions(){

  $("courseFilter").innerHTML = `
    <option value="">
      All Courses
    </option>
  `;


  $("questionCourse").innerHTML = `
    <option value="">
      Select Course
    </option>
  `;


  courses.forEach(course => {

    const title =
      course.title ||
      "Untitled Course";


    $("courseFilter").innerHTML += `
      <option value="${escapeHTML(course.id)}">
        ${escapeHTML(title)}
      </option>
    `;


    $("questionCourse").innerHTML += `
      <option value="${escapeHTML(course.id)}">
        ${escapeHTML(title)}
      </option>
    `;

  });

}


/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "premiumCourseQuestions"
        )
      );


    questions =
      snapshot.docs.map(
        item => ({

          id:item.id,

          ...item.data()

        })
      );


    questions.sort(
      (a,b) =>
        Number(a.order || 999)
        -
        Number(b.order || 999)
    );


    updateStats();

    renderQuestions();

  }catch(error){

    console.error(
      "Question loading error:",
      error
    );


    $("questionsTable").innerHTML = `
      <tr>
        <td colspan="6">
          <div class="empty">
            Unable to load questions.
          </div>
        </td>
      </tr>
    `;


    showToast(
      "Failed to load questions"
    );

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  $("totalQuestions").textContent =
    questions.length;


  $("publishedQuestions").textContent =
    questions.filter(
      item =>
        String(
          item.status || ""
        ).toLowerCase()
        === "published"
    ).length;


  $("pendingQuestions").textContent =
    questions.filter(
      item =>
        String(
          item.status || ""
        ).toLowerCase()
        === "pending"
    ).length;


  $("draftQuestions").textContent =
    questions.filter(
      item =>
        String(
          item.status || ""
        ).toLowerCase()
        === "draft"
    ).length;

}


/* =========================
   RENDER QUESTIONS
========================= */

function renderQuestions(){

  const search =
    $("searchQuestion")
      .value
      .trim()
      .toLowerCase();


  const courseId =
    $("courseFilter").value;


  const status =
    $("statusFilter")
      .value
      .toLowerCase();


  const filtered =
    questions.filter(item => {

      const question =
        String(
          item.question || ""
        ).toLowerCase();


      const answer =
        String(
          item.answer || ""
        ).toLowerCase();


      const matchesSearch =
        !search ||
        question.includes(search) ||
        answer.includes(search);


      const matchesCourse =
        !courseId ||
        item.courseId === courseId;


      const itemStatus =
        String(
          item.status || "pending"
        ).toLowerCase();


      const matchesStatus =
        !status ||
        itemStatus === status;


      return (
        matchesSearch &&
        matchesCourse &&
        matchesStatus
      );

    });


  if(!filtered.length){

    $("questionsTable").innerHTML = `
      <tr>
        <td colspan="6">
          <div class="empty">
            No questions found.
          </div>
        </td>
      </tr>
    `;

    return;

  }


  $("questionsTable").innerHTML =
    filtered.map(item => {

      const status =
        String(
          item.status || "pending"
        ).toLowerCase();


      const statusClass =
        status === "published"
          ? "published"
          : status === "draft"
            ? "draft"
            : "pending";


      return `

        <tr>

          <td>
            ${escapeHTML(
              getCourseName(
                item.courseId
              )
            )}
          </td>


          <td>

            <div class="question">
              ${escapeHTML(
                item.question
              )}
            </div>

          </td>


          <td>

            <div class="answer">

              ${
                item.answer
                  ? escapeHTML(
                      item.answer
                    )
                  : "<em>No answer yet</em>"
              }

            </div>

          </td>


          <td>

            ${escapeHTML(
              item.studentName ||
              item.userName ||
              "Anonymous"
            )}

            ${
              item.studentEmail ||
              item.userEmail
                ? `
                  <br>
                  <small style="color:#64748b;">
                    ${escapeHTML(
                      item.studentEmail ||
                      item.userEmail
                    )}
                  </small>
                `
                : ""
            }

          </td>


          <td>

            <span
              class="badge ${statusClass}">

              ${escapeHTML(
                status.charAt(0).toUpperCase() +
                status.slice(1)
              )}

            </span>

          </td>


          <td>

            <div class="actions">

              <button
                class="btn btn-light"
                onclick="editQuestion('${escapeHTML(item.id)}')">
                Edit
              </button>


              ${
                status !== "published"
                  ? `
                    <button
                      class="btn btn-success"
                      onclick="publishQuestion('${escapeHTML(item.id)}')">
                      Publish
                    </button>
                  `
                  : ""
              }


              <button
                class="btn btn-danger"
                onclick="deleteQuestion('${escapeHTML(item.id)}')">
                Delete
              </button>

            </div>

          </td>

        </tr>

      `;

    }).join("");

}


/* =========================
   OPEN ADD
========================= */

function openAddModal(){

  $("modalTitle").textContent =
    "Add Question";


  $("questionId").value =
    "";


  $("questionCourse").value =
    "";


  $("studentName").value =
    "";


  $("studentEmail").value =
    "";


  $("questionText").value =
    "";


  $("answerText").value =
    "";


  $("questionStatus").value =
    "pending";


  $("questionOrder").value =
    "1";


  $("questionModal").style.display =
    "flex";

}


/* =========================
   EDIT QUESTION
========================= */

window.editQuestion =
  function(id){

    const item =
      questions.find(
        question =>
          question.id === id
      );


    if(!item){

      showToast(
        "Question not found"
      );

      return;

    }


    $("modalTitle").textContent =
      "Edit Question";


    $("questionId").value =
      item.id;


    $("questionCourse").value =
      item.courseId || "";


    $("studentName").value =
      item.studentName ||
      item.userName ||
      "";


    $("studentEmail").value =
      item.studentEmail ||
      item.userEmail ||
      "";


    $("questionText").value =
      item.question ||
      "";


    $("answerText").value =
      item.answer ||
      "";


    $("questionStatus").value =
      item.status ||
      "pending";


    $("questionOrder").value =
      item.order ||
      1;


    $("questionModal").style.display =
      "flex";

  };


/* =========================
   SAVE QUESTION
========================= */

$("questionForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      showLoading();


      try{

        const id =
          $("questionId")
            .value
            .trim();


        const courseId =
          $("questionCourse")
            .value
            .trim();


        const studentName =
          $("studentName")
            .value
            .trim();


        const studentEmail =
          $("studentEmail")
            .value
            .trim();


        const question =
          $("questionText")
            .value
            .trim();


        const answer =
          $("answerText")
            .value
            .trim();


        const status =
          $("questionStatus")
            .value;

        const order =
          Number(
            $("questionOrder")
              .value || 0
          );

        if(!courseId){
          showToast(
            "Please select a premium course.",
            "error"
          );
          return;
        }

        if(!question){
          showToast(
            "Please enter the question.",
            "error"
          );
          return;
        }

        const data = {
          courseId,
          studentName,
          studentEmail,
          question,
          answer,
          status,
          order,
          updatedAt:
            serverTimestamp()
        };

        try{

          showLoading(true);

          if(id){

            await updateDoc(
              doc(
                db,
                "premiumCourseQuestions",
                id
              ),
              data
            );

            showToast(
              "Question updated successfully."
            );

          }else{

            data.createdAt =
              serverTimestamp();

            await addDoc(
              collection(
                db,
                "premiumCourseQuestions"
              ),
              data
            );

            showToast(
              "Question added successfully."
            );
          }

          closeQuestionModal();

          await loadQuestions();

        }catch(error){

          console.error(
            "Save question error:",
            error
          );

          showToast(
            error.message ||
            "Failed to save question.",
            "error"
          );

        }finally{

          showLoading(false);
        }
      });

      window.editQuestion =
        function(id){

          const item =
            questions.find(
              q => q.id === id
            );

          if(!item) return;

          $("questionModalTitle")
            .textContent =
            "Edit Question";

          $("questionId")
            .value = item.id;

          $("questionCourse")
            .value =
            item.courseId || "";

          $("studentName")
            .value =
            item.studentName || "";

          $("studentEmail")
            .value =
            item.studentEmail || "";

          $("questionText")
            .value =
            item.question || "";

          $("answerText")
            .value =
            item.answer || "";

          $("questionStatus")
            .value =
            item.status || "pending";

          $("questionOrder")
            .value =
            item.order || 0;

          $("questionModal")
            .classList.add("show");
        };

      window.deleteQuestion =
        async function(id){

          const item =
            questions.find(
              q => q.id === id
            );

          if(!item) return;

          const confirmed =
            confirm(
              "Are you sure you want to delete this question?"
            );

          if(!confirmed) return;

          try{

            showLoading(true);

            await deleteDoc(
              doc(
                db,
                "premiumCourseQuestions",
                id
              )
            );

            showToast(
              "Question deleted successfully."
            );

            await loadQuestions();

          }catch(error){

            console.error(
              "Delete question error:",
              error
            );

            showToast(
              error.message ||
              "Failed to delete question.",
              "error"
            );

          }finally{

            showLoading(false);
          }
        };

      window.publishQuestion =
        async function(id){

          try{

            showLoading(true);

            await updateDoc(
              doc(
                db,
                "premiumCourseQuestions",
                id
              ),
              {
                status:
                  "published",
                updatedAt:
                  serverTimestamp()
              }
            );

            showToast(
              "Question published successfully."
            );

            await loadQuestions();

          }catch(error){

            console.error(
              "Publish question error:",
              error
            );

            showToast(
              error.message ||
              "Failed to publish question.",
              "error"
            );

          }finally{

            showLoading(false);
          }
        };

      $("questionSearch")
        .addEventListener(
          "input",
          renderQuestions
        );

      $("courseFilter")
        .addEventListener(
          "change",
          renderQuestions
        );

      $("statusFilter")
        .addEventListener(
          "change",
          renderQuestions
        );

      $("closeQuestionModal")
        .addEventListener(
          "click",
          closeQuestionModal
        );

      $("cancelQuestion")
        .addEventListener(
          "click",
          closeQuestionModal
        );

      $("questionModal")
        .addEventListener(
          "click",
          function(e){

            if(
              e.target ===
              $("questionModal")
            ){
              closeQuestionModal();
            }

          }
        );

      $("addQuestion")
        .addEventListener(
          "click",
          function(){

            $("questionForm")
              .reset();

            $("questionId")
              .value = "";

            $("questionModalTitle")
              .textContent =
              "Add Question";

            $("questionStatus")
              .value =
              "pending";

            $("questionOrder")
              .value = 0;

            $("questionModal")
              .classList.add("show");
          }
        );

      window.logoutAdmin =
        async function(){

          try{

            await signOut(auth);

            window.location.href =
              "login-admin.html";

          }catch(error){

            console.error(
              "Logout error:",
              error
            );

            showToast(
              "Logout failed.",
              "error"
            );
          }
        };

      

    </script>

  </body>
</html>
