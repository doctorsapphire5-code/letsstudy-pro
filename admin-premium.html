<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Premium Management | LetsStudy Pro</title>

<meta name="description"
content="LetsStudy Pro Premium and Membership Management">

<link rel="icon"
href="https://letsstudy.pro/favicon.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #e2e8f0;
}

.nav{
  width:min(1250px,92%);
  min-height:70px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:#0b57d0;
  font-size:20px;
  font-weight:900;
}

.back{
  text-decoration:none;
  color:#475569;
  font-weight:700;
}

.container{
  width:min(1250px,92%);
  margin:35px auto;
}

h1{
  font-size:32px;
  margin-bottom:7px;
}

.subtitle{
  color:#64748b;
  margin-bottom:28px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:22px;
}

.stat strong{
  display:block;
  color:#0b57d0;
  font-size:29px;
  margin-bottom:5px;
}

.stat span{
  color:#64748b;
  font-size:13px;
}

.toolbar{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:18px;

  display:grid;
  grid-template-columns:1fr 220px 130px;
  gap:12px;

  margin-bottom:20px;
}

input,
select{
  width:100%;
  min-height:45px;

  padding:10px 13px;

  border:1px solid #cbd5e1;
  border-radius:10px;

  outline:none;
  background:#fff;
}

input:focus,
select:focus{
  border-color:#0b57d0;
}

.btn{
  min-height:45px;
  padding:0 18px;

  border:0;
  border-radius:10px;

  background:#0b57d0;
  color:#fff;

  font-weight:800;
  cursor:pointer;
}

.table-box{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:17px;
  overflow:auto;
}

table{
  width:100%;
  min-width:1050px;
  border-collapse:collapse;
}

th,
td{
  padding:15px;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:12px;
  text-transform:uppercase;
}

td{
  font-size:14px;
}

.badge{
  display:inline-flex;
  align-items:center;

  padding:5px 10px;
  border-radius:999px;

  font-size:11px;
  font-weight:800;
}

.active{
  background:#dcfce7;
  color:#166534;
}

.expired{
  background:#fee2e2;
  color:#991b1b;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.cancelled{
  background:#e2e8f0;
  color:#475569;
}

.actions{
  display:flex;
  gap:6px;
}

.action{
  border:0;
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
}

.view{
  background:#e0f2fe;
  color:#0369a1;
}

.edit{
  background:#e0e7ff;
  color:#3730a3;
}

.empty{
  text-align:center;
  padding:45px;
  color:#64748b;
}

.modal{
  display:none;

  position:fixed;
  inset:0;
  z-index:9999;

  background:rgba(15,23,42,.65);

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal-box{
  position:relative;

  width:min(600px,100%);
  max-height:90vh;

  overflow:auto;

  background:#fff;
  border-radius:20px;
  padding:26px;
}

.close{
  position:absolute;
  top:15px;
  right:15px;

  width:36px;
  height:36px;

  border:0;
  border-radius:50%;

  background:#f1f5f9;

  cursor:pointer;
  font-size:20px;
}

.detail{
  padding:13px 0;
  border-bottom:1px solid #e2e8f0;
}

.detail strong{
  display:block;
  color:#64748b;
  font-size:12px;
  margin-bottom:4px;
}

.form-group{
  margin-top:18px;
}

.form-group label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin-bottom:7px;
}

.save{
  width:100%;
  margin-top:20px;
}

@media(max-width:850px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr;
  }

}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr;
  }

  h1{
    font-size:27px;
  }

  .nav{
    min-height:64px;
  }

}
</style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      LetsStudy Pro Admin
    </div>

    <a
      href="admin.html"
      class="back">

      ← Admin Dashboard

    </a>

  </div>

</header>


<main class="container">

  <h1>
    Premium / Membership
  </h1>

  <p class="subtitle">
    Manage LetsStudy Pro Premium memberships,
    plans, status and expiry dates.
  </p>


  <!-- =========================
       STATISTICS
  ========================= -->

  <section class="stats">

    <div class="stat">

      <strong id="totalMembers">
        0
      </strong>

      <span>
        Total Members
      </span>

    </div>


    <div class="stat">

      <strong id="activeMembers">
        0
      </strong>

      <span>
        Active
      </span>

    </div>


    <div class="stat">

      <strong id="expiredMembers">
        0
      </strong>

      <span>
        Expired
      </span>

    </div>


    <div class="stat">

      <strong id="pendingMembers">
        0
      </strong>

      <span>
        Pending
      </span>

    </div>

  </section>


  <!-- =========================
       SEARCH
  ========================= -->

  <section class="toolbar">

    <input
      id="searchMember"
      type="search"
      placeholder="Search email, name or user ID...">


    <select id="statusFilter">

      <option value="">
        All Statuses
      </option>

      <option value="active">
        Active
      </option>

      <option value="expired">
        Expired
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="cancelled">
        Cancelled
      </option>

    </select>


    <button
      class="btn"
      onclick="loadMemberships()">

      Refresh

    </button>

  </section>


  <!-- =========================
       TABLE
  ========================= -->

  <section class="table-box">

    <table>

      <thead>

        <tr>

          <th>
            Member
          </th>

          <th>
            Plan
          </th>

          <th>
            Status
          </th>

          <th>
            Start Date
          </th>

          <th>
            Expiry
          </th>

          <th>
            Actions
          </th>

        </tr>

      </thead>


      <tbody id="membersTable">

        <tr>

          <td
            colspan="6"
            class="empty">

            Loading memberships...

          </td>

        </tr>

      </tbody>

    </table>

  </section>

</main>


<!-- =========================
     VIEW MODAL
========================= -->

<div
  id="viewModal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeView()">

      ×

    </button>

    <h2>
      Membership Details
    </h2>

    <div
      id="memberDetails"
      style="margin-top:20px;">

    </div>

  </div>

</div>


<!-- =========================
     EDIT MODAL
========================= -->

<div
  id="editModal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeEdit()">

      ×

    </button>

    <h2>
      Update Membership
    </h2>


    <div class="form-group">

      <label>
        Membership Status
      </label>

      <select id="editStatus">

        <option value="active">
          Active
        </option>

        <option value="expired">
          Expired
        </option>

        <option value="pending">
          Pending
        </option>

        <option value="cancelled">
          Cancelled
        </option>

      </select>

    </div>


    <div class="form-group">

      <label>
        Plan
      </label>

      <input
        id="editPlan"
        type="text"
        placeholder="Premium">

    </div>


    <div class="form-group">

      <label>
        Expiry Date
      </label>

      <input
        id="editExpiry"
        type="date">

    </div>


    <button
      class="btn save"
      onclick="saveMembership()">

      Save Changes

    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro.firebaseapp.com",

  projectId:
    "let-s-study-pro",

  storageBucket:
    "let-s-study-pro.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


let memberships = [];

let selectedMember = null;


/* =====================================================
   LOAD MEMBERSHIPS
===================================================== */

async function loadMemberships(){

  const table =
    document.getElementById(
      "membersTable"
    );


  table.innerHTML = `
    <tr>
      <td colspan="6"
          class="empty">

        Loading memberships...

      </td>
    </tr>
  `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "memberships"
        )
      );


    memberships = [];


    snapshot.forEach(
      item => {

        memberships.push({

          id:
            item.id,

          ...item.data()

        });

      }
    );


    normalizeExpiredMemberships();

    updateStatistics();

    applyFilters();

  }catch(error){

    console.error(
      "Membership error:",
      error
    );


    table.innerHTML = `
      <tr>
        <td colspan="6"
            class="empty">

          Failed to load memberships.

        </td>
      </tr>
    `;

  }

}


/* =====================================================
   AUTOMATIC EXPIRY CHECK
===================================================== */

function normalizeExpiredMemberships(){

  const now =
    new Date();


  memberships =
    memberships.map(
      member => {

        const expiry =
          getExpiryDate(
            member
          );


        if(
          expiry &&
          expiry < now &&
          normalizeStatus(
            member.status
          ) === "active"
        ){

          return {
            ...member,
            status:"expired"
          };

        }


        return member;

      }
    );

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

  const total =
    memberships.length;


  const active =
    memberships.filter(
      x =>
        normalizeStatus(
          x.status
        ) === "active"
    ).length;


  const expired =
    memberships.filter(
      x =>
        normalizeStatus(
          x.status
        ) === "expired"
    ).length;


  const pending =
    memberships.filter(
      x =>
        normalizeStatus(
          x.status
        ) === "pending"
    ).length;


  document.getElementById(
    "totalMembers"
  ).textContent =
    total;


  document.getElementById(
    "activeMembers"
  ).textContent =
    active;


  document.getElementById(
    "expiredMembers"
  ).textContent =
    expired;


  document.getElementById(
    "pendingMembers"
  ).textContent =
    pending;

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(status){

  return String(
    status || "pending"
  )
  .toLowerCase()
  .trim();

}


/* =====================================================
   FILTER
===================================================== */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchMember"
      )
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const filtered =
    memberships.filter(
      member => {

        const name =
          String(
            member.name ||
            member.displayName ||
            ""
          )
          .toLowerCase();


        const email =
          String(
            member.email ||
            member.userEmail ||
            ""
          )
          .toLowerCase();


        const uid =
          String(
            member.uid ||
            member.userId ||
            member.id ||
            ""
          )
          .toLowerCase();


        const currentStatus =
          normalizeStatus(
            member.status
          );


        return (

          (
            !search ||
            name.includes(search) ||
            email.includes(search) ||
            uid.includes(search)
          )

          &&

          (
            !status ||
            currentStatus === status
          )

        );

      }
    );


  renderMemberships(
    filtered
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderMemberships(list){

  const table =
    document.getElementById(
      "membersTable"
    );


  if(!list.length){

    table.innerHTML = `
      <tr>
        <td colspan="6"
            class="empty">

          No memberships found.

        </td>
      </tr>
    `;

    return;

  }


  table.innerHTML =
    list.map(
      member => {

        const name =
          member.name ||
          member.displayName ||
          "Unknown";


        const email =
          member.email ||
          member.userEmail ||
          "No email";


        const plan =
          member.plan ||
          member.membershipPlan ||
          "Premium";


        const status =
          normalizeStatus(
            member.status
          );


        const start =
          getStartDate(
            member
          );


        const expiry =
          getExpiryDate(
            member
          );


        return `

          <tr>

            <td>

              <strong>
                ${escapeHTML(
                  name
                )}
              </strong>

              <br>

              <small style="color:#64748b">

                ${escapeHTML(
                  email
                )}

              </small>

            </td>


            <td>

              ${escapeHTML(
                plan
              )}

            </td>


            <td>

              <span
                class="badge ${status}">

                ${escapeHTML(
                  status
                )}

              </span>

            </td>


            <td>

              ${escapeHTML(
                start
              )}

            </td>


            <td>

              ${escapeHTML(
                expiry
              )}

            </td>


            <td>

              <div class="actions">

                <button
                  class="action view"
                  onclick="viewMember('${member.id}')">

                  View

                </button>


                <button
                  class="action edit"
                  onclick="editMember('${member.id}')">

                  Edit

                </button>

              </div>

            </td>

          </tr>

        `;

      }
    ).join("");

}


/* =====================================================
   VIEW MEMBER
===================================================== */

window.viewMember =
function(id){

  const member =
    memberships.find(
      x => x.id === id
    );


  if(!member) return;


  const name =
    member.name ||
    member.displayName ||
    "Unknown";


  const email =
    member.email ||
    member.userEmail ||
    "—";


  const uid =
    member.uid ||
    member.userId ||
    member.id;


  const plan =
    member.plan ||
    member.membershipPlan ||
    "Premium";


  const status =
    normalizeStatus(
      member.status
    );


  const start =
    getStartDate(
      member
    );


  const expiry =
    getExpiryDate(
      member
    );


  document.getElementById(
    "memberDetails"
  ).innerHTML = `

    <div class="detail">

      <strong>
        Name
      </strong>

      ${escapeHTML(
        name
      )}

    </div>


    <div class="detail">

      <strong>
        Email
      </strong>

      ${escapeHTML(
        email
      )}

    </div>


    <div class="detail">

      <strong>
        User ID
      </strong>

      ${escapeHTML(
        uid
      )}

    </div>


    <div class="detail">

      <strong>
        Plan
      </strong>

      ${escapeHTML(
        plan
      )}

    </div>


    <div class="detail">

      <strong>
        Status
      </strong>

      <span class="badge ${status}">
        ${escapeHTML(
          status
        )}
      </span>

    </div>


    <div class="detail">

      <strong>
        Start Date
      </strong>

      ${escapeHTML(
        start
      )}

    </div>


    <div class="detail">

      <strong>
        Expiry Date
      </strong>

      ${escapeHTML(
        expiry
      )}

    </div>

  `;


  document.getElementById(
    "viewModal"
  ).style.display =
    "flex";

};


/* =====================================================
   EDIT MEMBER
===================================================== */

window.editMember =
function(id){

  const member =
    memberships.find(
      x => x.id === id
    );


  if(!member) return;


  selectedMember =
    member;


  document.getElementById(
    "editStatus"
  ).value =
    normalizeStatus(
      member.status
    );


  document.getElementById(
    "editPlan"
  ).value =
    member.plan ||
    member.membershipPlan ||
    "Premium";


  const expiry =
    getExpiryDateObject(
      member
    );


  document.getElementById(
    "editExpiry"
  ).value =
    expiry
      ? formatDateInput(
          expiry
        )
      : "";


  document.getElementById(
    "editModal"
  ).style.display =
    "flex";

};


/* =====================================================
   SAVE
===================================================== */

window.saveMembership =
async function(){

  if(
    !selectedMember
  ){

    return;

  }


  const status =
    document.getElementById(
      "editStatus"
    ).value;


  const plan =
    document.getElementById(
      "editPlan"
    ).value.trim();


  const expiry =
    document.getElementById(
      "editExpiry"
    ).value;


  try{

    const data = {

      status:status,

      plan:plan,

      expiryDate:
        expiry || null

    };


    await updateDoc(
      doc(
        db,
        "memberships",
        selectedMember.id
      ),
      data
    );


    closeEdit();

    await loadMemberships();


    alert(
      "Membership updated successfully."
    );


  }catch(error){

    console.error(
      error
    );


    alert(
      "Unable to update membership."
    );

  }

};


/* =====================================================
   DATE HELPERS
===================================================== */

function getExpiryDate(member){

  const value =
    member.expiryDate ||
    member.expiresAt ||
    member.endDate ||
    member.expiry;


  if(
    value?.toDate
  ){

    return value
      .toDate()
      .toLocaleDateString();

  }


  if(
    value
  ){

    const date =
      new Date(value);


    if(
      !isNaN(
        date.getTime()
      )
    ){

      return date.toLocaleDateString();

    }

  }


  return "—";

}


function getStartDate(member){

  const value =
    member.startDate ||
    member.startedAt ||
    member.createdAt;

  if(value?.toDate){

    return value
      .toDate()
      .toLocaleDateString();

  }

  if(value){

    const date =
      new Date(value);

    if(!isNaN(date.getTime())){

      return date.toLocaleDateString();

    }

  }

  return "—";
}


function formatDateInput(date){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function normalizeStatus(status){

  return String(
    status || "pending"
  )
  .toLowerCase()
  .trim();

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


window.closeView =
function(){

  document.getElementById(
    "viewModal"
  ).style.display =
    "none";

};


window.closeEdit =
function(){

  document.getElementById(
    "editModal"
  ).style.display =
    "none";

  selectedMember =
    null;

};


document
  .getElementById("searchMember")
  .addEventListener(
    "input",
    applyFilters
  );


document
  .getElementById("statusFilter")
  .addEventListener(
    "change",
    applyFilters
  );


onAuthStateChanged(
  auth,
  user => {

    if(!user){

      window.location.href =
        "login.html";

      return;

    }

    loadMemberships();

  }
);

</script>

</body>
</html>
