<body>

<header>
  <strong>LetsStudy Pro | Admin</strong>
  <a href="admin-dashboard.html">Dashboard</a>
</header>

<main class="container"><h1>Admin Profile</h1>

  <section class="card">
    <div class="profile-top">
      <img id="photoPreview" class="avatar" src="https://placehold.co/120x120?text=Admin" alt="Admin profile photo">

      <h2 id="profileName">Loading profile...</h2>
      <div class="muted" id="profileEmail"></div>
      <p><span class="status" id="profileStatus">Loading</span></p>
      <p class="muted">Admin ID: <strong id="displayAdminId">—</strong></p>
    </div>

    <div id="message" class="message" role="status"></div>

    <form id="profileForm">
      <h2>Personal Information</h2>

      <div class="grid">
        <div class="field">
          <label for="adminId">Admin ID</label>
          <input id="adminId" readonly="">
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input id="username" maxlength="50">
        </div>

        <div class="field">
          <label for="firstName">First Name</label>
          <input id="firstName" maxlength="80" required="">
        </div>

        <div class="field">
          <label for="lastName">Last Name</label>
          <input id="lastName" maxlength="80">
        </div>

        <div class="field">
          <label for="fullName">Full Name</label>
          <input id="fullName" maxlength="160" required="">
        </div>

        <div class="field">
          <label for="displayName">Display Name</label>
          <input id="displayName" maxlength="100">
        </div>

        <div class="field">
          <label for="email">Admin Email</label>
          <input id="email" type="email" readonly="">
        </div>

        <div class="field">
          <label for="phoneNumber">Phone Number</label>
          <input id="phoneNumber" type="tel" maxlength="30">
        </div>

        <div class="field">
          <label for="country">Country</label>
          <input id="country" maxlength="100">
        </div>

        <div class="field">
          <label for="department">Department</label>
          <input id="department" maxlength="100">
        </div>

        <div class="field">
          <label for="language">Language</label>
          <select id="language">
            <option value="English">English</option>
            <option value="Swahili">Swahili</option>
          </select>
        </div>

        <div class="field">
          <label for="timezone">Timezone</label>
          <input id="timezone" value="Africa/Dar_es_Salaam">
        </div>

        <div class="field">
          <label for="photoURL">Profile Photo URL</label>
          <input id="photoURL" type="url" placeholder="https://example.com/photo.jpg">
        </div>

        <div class="field">
          <label for="role">Role</label>
          <input id="role" readonly="">
        </div>

        <div class="field">
          <label for="accessLevel">Access Level</label>
          <input id="accessLevel" readonly="">
        </div>

        <div class="field">
          <label for="adminType">Admin Type</label>
          <input id="adminType" readonly="">
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="primary" id="saveBtn">
          Save Profile
        </button>
        <button type="button" class="secondary" id="reloadBtn">
          Reload
        </button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>Account Information</h2>

    <div class="grid">
      <div class="field">
        <label>Email Verification</label>
        <input id="emailVerified" readonly="">
      </div>

      <div class="field">
        <label>Account Status</label>
        <input id="accountStatus" readonly="">
      </div>

      <div class="field">
        <label>Login Count</label>
        <input id="loginCount" readonly="">
      </div>

      <div class="field">
        <label>Two-Factor Authentication</label>
        <input id="twoFactorEnabled" readonly="">
      </div>

      <div class="field">
        <label>Created At</label>
        <input id="createdAt" readonly="">
      </div>

      <div class="field">
        <label>Last Updated</label>
        <input id="updatedAt" readonly="">
      </div>
    </div>

    <div class="actions">
      <button type="button" class="secondary" id="verifyBtn">
        Verify Email
      </button>
      <button type="button" class="danger" id="logoutBtn">
        Logout
      </button>
    </div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbKXjsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

const $ = id => document.getElementById(id);

let currentUser = null;
let adminRef = null;
let adminData = null;

function showMessage(message, type = "success") {
  $("message").textContent = message;
  $("message").className = "message " + type;
}

function formatDate(value) {
  if (!value) return "Not available";

  const date = value.toDate
    ? value.toDate()
    : new Date(value);

  return isNaN(date.getTime()) ? "Not available" : date.toLocaleString();
}

function setValue(id, value) {
  $(id).value = value ?? "";
}

function displayValue(id, value) {
  $(id).value = value ?? "Not available";
}

function updatePhoto(url) {
  const fallback = "https://placehold.co/120x120?text=Admin";
  $("photoPreview").src = url || fallback;
}

$("photoURL").addEventListener("input", () => {
  updatePhoto($("photoURL").value.trim());
});

$("photoPreview").addEventListener("error", () => {
  $("photoPreview").src = "https://placehold.co/120x120?text=Admin";
});

async function loadProfile(user) {
  currentUser = user;

  if (!user) {
    location.replace("admin-login.html");
    return;
  }

  try {
    const snapshot = await db.collection("admins")
      .where("uid", "==", user.uid)
      .limit(2)
      .get();

    if (snapshot.empty) {
      showMessage("Admin profile was not found.", "error");
      $("profileName").textContent = "Profile not found";
      return;
    }

    if (snapshot.size !== 1) {
      showMessage("Multiple admin records found. Contact administrator.", "error");
      return;
    }

    adminRef = snapshot.docs[0].ref;
    adminData = snapshot.docs[0].data();

    const status = String(adminData.status || "").toLowerCase();
    const role = String(adminData.role || adminData.adminType || "").toLowerCase();

    if (status !== "active") {
      showMessage("Your admin account is not active.", "error");
      await auth.signOut();
      location.replace("admin-login.html");
      return;
    }

    if (!["admin", "superadmin"].includes(role)) {
      showMessage("This account does not have admin access.", "error");
      await auth.signOut();
      location.replace("admin-login.html");
      return;
    }

    if (
      adminData.email &&
      user.email &&
      adminData.email.toLowerCase() !== user.email.toLowerCase()
    ) {
      showMessage("Account email does not match the admin record.", "error");
      return;
    }

    setValue("adminId", adminData.adminId);
    setValue("username", adminData.username);
    setValue("firstName", adminData.firstName);
    setValue("lastName", adminData.lastName);
    setValue("fullName", adminData.fullName || adminData.displayName);
    setValue("displayName", adminData.displayName);
    setValue("email", user.email || adminData.email);
    setValue("phoneNumber", adminData.phoneNumber);
    setValue("country", adminData.country);
    setValue("department", adminData.department);
    setValue("language", adminData.language || "English");
    setValue("timezone", adminData.timezone || "Africa/Dar_es_Salaam");
    setValue("photoURL", adminData.photoURL);
    setValue("role", adminData.role);
    setValue("accessLevel", adminData.accessLevel);
    setValue("adminType", adminData.adminType);

    displayValue("emailVerified", user.emailVerified ? "Verified" : "Not verified");
    displayValue("accountStatus", adminData.status);
    displayValue("loginCount", adminData.loginCount ?? 0);
    displayValue("twoFactorEnabled", adminData.twoFactorEnabled ? "Enabled" : "Disabled");
    displayValue("createdAt", formatDate(adminData.createdAt));
    displayValue("updatedAt", formatDate(adminData.updatedAt));

    $("profileName").textContent =
      adminData.displayName || adminData.fullName || user.email;

    $("profileEmail").textContent = user.email || "";
    $("displayAdminId").textContent = adminData.adminId || "—";
    $("profileStatus").textContent = adminData.status || "Unknown";

    updatePhoto(adminData.photoURL);

    $("verifyBtn").textContent =
      user.emailVerified ? "Email Verified" : "Verify Email";

    $("verifyBtn").disabled = user.emailVerified;

    showMessage("Admin profile loaded successfully.", "success");

  } catch (error) {
    console.error(error);
    showMessage("Failed to load profile: " + error.message, "error");
  }
}

$("profileForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!currentUser || !adminRef || !adminData) {
    showMessage("Admin profile is not ready.", "error");
    return;
  }

  const firstName = $("firstName").value.trim();
  const lastName = $("lastName").value.trim();
  const fullName = $("fullName").value.trim();
  const photoURL = $("photoURL").value.trim();

  if (!firstName || !fullName) {
    showMessage("First name and full name are required.", "error");
    return;
  }

  if (photoURL) {
    try {
      const parsed = new URL(photoURL);
      if (parsed.protocol !== "https:") {
        showMessage("Profile photo URL must use HTTPS.", "error");
        return;
      }
    } catch {
      showMessage("Enter a valid profile photo URL.", "error");
      return;
    }
  }

  const updates = {
    username: $("username").value.trim(),
    firstName,
    lastName,
    fullName,
    displayName: $("displayName").value.trim() || fullName,
    phoneNumber: $("phoneNumber").value.trim(),
    country: $("country").value.trim(),
    department: $("department").value.trim(),
    language: $("language").value,
    timezone: $("timezone").value.trim(),
    photoURL,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  $("saveBtn").disabled = true;
  $("saveBtn").textContent = "Saving...";

  try {
    await adminRef.update(updates);

    adminData = {...adminData, ...updates};

    $("profileName").textContent = updates.displayName;
    updatePhoto(photoURL);

    showMessage("Profile updated successfully.", "success");

  } catch (error) {
    console.error(error);
    showMessage("Could not update profile: " + error.message, "error");
  } finally {
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = "Save Profile";
  }
});

$("reloadBtn").addEventListener("click", async () => {
  if (currentUser) {
    await loadProfile(currentUser);
  }
});

$("verifyBtn").addEventListener("click", async () => {
  if (!currentUser) return;

  try {
    await currentUser.sendEmailVerification();
    showMessage("Verification email sent. Check your inbox.", "success");
  } catch (error) {
    showMessage(error.message, "error");
  }
});

$("logoutBtn").addEventListener("click", async () => {
  try {
    await auth.signOut();
    location.replace("admin-login.html");
  } catch (error) {
    showMessage("Logout failed: " + error.message, "error");
  }
});

auth.onAuthStateChanged(user => {
  if (!user) {
    location.replace("admin-login.html");
    return;
  }

  loadProfile(user);
});
</script>
