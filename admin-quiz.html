<style>

body{

.header{

.nav{

}

.logo{
  color:#059669;
  font-weight:950;
  font-size:20px
}

.nav-right{
  display:flex;

  align-items:center
}

.nav-btn{

  border-radius:8px;
  background:#ecfdf5;
  color:#047857;

}

.container{
  max-width:1250px;
  margin:auto;

}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:20px
}

.hero h1{
  margin:0 0 6px;

}

.hero p{

}

.primary{
  border:0;

}

.secondary{

}

.danger{

.edit{
  border:0;
  background:#eff6ff;

.stats{

}

.stat{

.toolbar{

input,
textarea,

.title{

}

}

.badge{

  padding:5px 8px;

}

.actions{

  gap:5px;

}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;

}

.modal.show{

}

.modal-box{
  width:100%;
  max-width:850px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:22px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}

.modal-head h2{
  margin:0;
  font-size:20px
}

.close{
  border:0;
  background:#f2f4f7;
  width:34px;
  height:34px;
  border-radius:8px;
  font-size:17px
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px
}

.field{
  margin-bottom:12px
}

.field.full{
  grid-column:1/-1
}

label{
  display:block;
  font-size:10px;

}

textarea{

}

  justify-content:flex-end;

/* QUESTIONS */

.question-box{
  border:1px solid #e6e9ef;

}

.question-head{

  justify-content:space-between;

}

.question-text{
  font-size:12px;

}

.options{
  margin-top:10px;
  display:grid;
  gap:5px
}

.option{
  background:#f8fafc;
  padding:8px;
  border-radius:7px;

}

.correct{
  background:#ecfdf5;

}

.question-actions{

.empty{

.toast{

  color:#fff;

  font-size:11px;

  display:none;
  z-index:200
}

.toast.show{
  display:block
}

@media(max-width:800px){

.stats{
  grid-template-columns:repeat(2,1fr)
}

.hero{
  align-items:flex-start;
  flex-direction:column
}

.form-grid{
  grid-template-columns:1fr
}

.field.full{
  grid-column:auto
}

}
</style>

<!-- QUIZ MODAL -->

<div id="quizModal" class="modal">

<div class="modal-box">

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
getDoc,
getDocs,
addDoc,
updateDoc,
deleteDoc,
serverTimestamp,
query,
orderBy
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================
FIREBASE
===================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAXKXbkljsyRgI_0rj0odBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* =====================================
STATE
===================================== */

let currentUser=null;
let quizzes=[];
let courses=[];
let currentQuizId=null;


/* =====================================
HELPER
===================================== */

const $=
id=>document.getElementById(id);

function esc(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function toast(message){

$("toast").textContent=message;
$("toast").classList.add("show");

setTimeout(
()=>
$("toast").classList.remove("show"),
2500
);

}


/* =====================================
ADMIN AUTH
===================================== */



/* =====================================
LOAD COURSES
===================================== */

async function loadCourses(){

const snap=
await getDocs(
collection(db,"courses")
);

courses=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

$("courseSelect").innerHTML=`

<option value="">
Select Course
</option>

${
courses.map(
course=>
`
<option value="${esc(course.id)}">
${esc(course.title||course.id)}
</option>
`
).join("")
}

`;

}


/* =====================================
LOAD QUIZZES
===================================== */

async function loadQuizzes(){

const snap=
await getDocs(
collection(db,"quizzes")
);

quizzes=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

await attachQuestionCounts();

renderQuizzes();

updateStats();

}


/* =====================================
QUESTION COUNTS
===================================== */

async function attachQuestionCounts(){

for(
const quiz of quizzes
){

const snap=
await getDocs(
collection(
db,
"quizzes",
quiz.id,
"questions"
)
);

quiz.questionCount=
snap.size;

}

}


/* =====================================
RENDER
===================================== */

function renderQuizzes(){

const search=
$("searchInput")
.value
.trim()
.toLowerCase();

const status=
$("statusFilter").value;

const filtered=
quizzes.filter(
quiz=>{

const text=
`${quiz.title||""} ${
quiz.description||""
}`
.toLowerCase();

const searchMatch=
!search||
text.includes(search);

const statusMatch=
status==="all"||
(quiz.status||"draft")===status;

return searchMatch&&statusMatch;

}
);


if(!filtered.length){

$("quizTable").innerHTML=`

<tr>
<td colspan="7">

<div class="empty">
No quizzes found.
</div>

</td>
</tr>

`;

return;

}


$("quizTable").innerHTML=
filtered.map(
quiz=>{

const course=
courses.find(
c=>c.id===quiz.courseId
);

const quizStatus=
quiz.status||"draft";

return `

<tr>

<td>

<div class="title">
${esc(quiz.title||"Untitled Quiz")}
</div>

<div class="muted">
${esc(quiz.description||"")}
</div>

</td>

<td>
${esc(
course?.title||
quiz.courseTitle||
"Unknown Course"
)}
</td>

<td>
${quiz.questionCount||0}
</td>

<td>
${Number(quiz.passingScore||70)}%
</td>

<td>
${Number(quiz.timeLimit||0)
?quiz.timeLimit+" min"
:"No limit"}
</td>

<td>

<span class="badge ${
quizStatus==="published"
?"published"
:"draft"
}">

${quizStatus}

</span>

</td>

<td>

<div class="actions">

<button
class="edit"
data-action="edit"
data-id="${quiz.id}">
Edit
</button>

<button
class="secondary"
data-action="questions"
data-id="${quiz.id}">
Questions
</button>

<button
class="danger"
data-action="delete"
data-id="${quiz.id}">
Delete
</button>

</div>

</td>

</tr>

`;

}
).join("");

}


/* =====================================
STATS
===================================== */

function updateStats(){

const published=
quizzes.filter(
q=>q.status==="published"
).length;

const drafts=
quizzes.length-published;

const questions=
quizzes.reduce(
(total,q)=>
total+
Number(q.questionCount||0),
0
);

$("totalQuizzes")
.textContent=
quizzes.length;

$("publishedQuizzes")
.textContent=
published;

$("draftQuizzes")
.textContent=
drafts;

$("totalQuestions")
.textContent=
questions;

}


/* =====================================
SEARCH
===================================== */

$("searchInput")
.addEventListener(
"input",
renderQuizzes
);

$("statusFilter")
.addEventListener(
"change",
renderQuizzes
);


/* =====================================
OPEN QUIZ
===================================== */

$("addQuizBtn")
.onclick=()=>{

resetQuizForm();

$("quizModalTitle")
.textContent=
"Add Quiz";

$("quizModal")
.classList.add("show");

};


$("closeQuizModal")
.onclick=
closeQuizModal;

$("cancelQuiz")
.onclick=
closeQuizModal;


function closeQuizModal(){

$("quizModal")
.classList.remove("show");

}


function resetQuizForm(){

$("quizForm").reset();

$("quizId").value="";

$("passingScore").value=70;

$("timeLimit").value=30;

$("attemptsAllowed").value=3;

$("questionManager")
.style.display="none";

currentQuizId=null;

}


/* =====================================
SAVE QUIZ
===================================== */

$("quizForm")
.addEventListener(
"submit",
async event=>{

event.preventDefault();

const id=
$("quizId").value;

const data={

title:
$("quizTitle").value.trim(),

description:
$("quizDescription").value.trim(),

courseId:
$("courseSelect").value,

lessonId:
$("lessonId").value.trim(),

passingScore:
Number($("passingScore").value||70),

timeLimit:
Number($("timeLimit").value||0),

attemptsAllowed:
Number($("attemptsAllowed").value||1),

status:
$("quizStatus").value,

updatedAt:
serverTimestamp()

};


const selectedCourse=
courses.find(
c=>c.id===data.courseId
);

data.courseTitle=
selectedCourse?.title||
"";


try{

if(id){

await updateDoc(
doc(db,"quizzes",id),
data
);

toast("Quiz updated successfully.");

}else{

data.createdAt=
serverTimestamp();

const ref=
await addDoc(
collection(db,"quizzes"),
data
);

currentQuizId=ref.id;

toast("Quiz created successfully.");

}

await loadQuizzes();

}catch(error){

console.error(error);

toast(
"Unable to save quiz."
);

}

});


/* =====================================
TABLE ACTIONS
===================================== */

$("quizTable")
.addEventListener(
"click",
async event=>{

const button=
event.target.closest("button");

if(!button)return;

const id=
button.dataset.id;

const action=
button.dataset.action;

if(action==="edit"){

openEditQuiz(id);

}

if(action==="questions"){

openQuestions(id);

}

if(action==="delete"){

await deleteQuiz(id);

}

});


/* =====================================
EDIT QUIZ
===================================== */

async function openEditQuiz(id){

const quiz=
quizzes.find(
q=>q.id===id
);

if(!quiz)return;

$("quizId").value=id;

$("quizTitle").value=
quiz.title||"";

$("quizDescription").value=
quiz.description||"";

$("courseSelect").value=
quiz.courseId||"";

$("lessonId").value=
quiz.lessonId||"";

$("passingScore").value=
quiz.passingScore??70;

$("timeLimit").value=
quiz.timeLimit??0;

$("attemptsAllowed").value=
quiz.attemptsAllowed??3;

$("quizStatus").value=
quiz.status||"draft";

$("quizModalTitle")
.textContent=
"Edit Quiz";

currentQuizId=id;

$("questionManager")
.style.display="block";

$("quizModal")
.classList.add("show");

await loadQuestions(id);

}


/* =====================================
DELETE QUIZ
===================================== */

async function deleteQuiz(id){

const quiz=
quizzes.find(
q=>q.id===id
);

if(!quiz)return;

const confirmed=
confirm(
`Delete "${quiz.title||"this quiz"}"? This will also delete its questions.`
);

if(!confirmed)return;


try{

const questionsSnap =
  await getDocs(
    collection(
      db,
      "quizzes",
      id,
      "questions"
    )
  );

for (
  const question of questionsSnap.docs
) {

  await deleteDoc(
    question.ref
  );

}

await deleteDoc(
  doc(
    db,
    "quizzes",
    id
  )
);

toast(
  "Quiz deleted successfully."
);

await loadQuizzes();

renderQuizzes();

updateStats();

} catch (error) {

  console.error(
    "Delete quiz error:",
    error
  );

  toast(
  "Unable to delete quiz."
);

}

}


/* =====================================
QUESTION MANAGEMENT
===================================== */

$("addQuestionBtn").onclick = () => {

  if (!currentQuizId) {

    toast(
      "Save the quiz first."
    );

    return;
  }

  resetQuestionForm();

  $("questionModalTitle").textContent =
    "Add Question";

  $("questionModal").classList.add(
    "show"
  );

};


$("closeQuestionModal").onclick =
  closeQuestionModal;

$("cancelQuestion").onclick =
  closeQuestionModal;


function closeQuestionModal(){

  $("questionModal").classList.remove(
    "show"
  );

}


function resetQuestionForm(){

  $("questionForm").reset();

  $("questionId").value = "";

  $("questionPoints").value = 1;

  $("questionOrder").value =
    $("questionsList").children.length + 1;

}


/* =====================================
OPEN QUESTIONS
===================================== */

async function openQuestions(id){

  currentQuizId = id;

  const quiz =
    quizzes.find(
      q => q.id === id
    );

  if (!quiz) return;

  $("quizId").value = id;

  $("quizModalTitle").textContent =
    quiz.title || "Quiz Questions";

  $("questionManager").style.display =
    "block";

  $("quizModal").classList.add(
    "show"
  );

  await loadQuestions(id);

}


/* =====================================
LOAD QUESTIONS
===================================== */

async function loadQuestions(
  quizId
){

  try {

    const snap =
      await getDocs(
        collection(
          db,
          "quizzes",
          quizId,
          "questions"
        )
      );

    const questions =
      snap.docs
        .map(d => ({
          id: d.id,
          ...d.data()
        }))
        .sort(
          (a,b) =>
            Number(a.order || 0) -
            Number(b.order || 0)
        );


    if (!questions.length){

      $("questionsList").innerHTML = `
        <div class="empty">
          No questions yet.
        </div>
      `;

      return;
    }


    $("questionsList").innerHTML =
      questions.map(
        (q,index) => {

          const options =
            Array.isArray(q.options)
              ? q.options
              : [];


          return `
            <div class="question-box">

              <div class="question-head">

                <div>

                  <div class="muted">
                    Question ${index + 1}
                  </div>

                  <div class="question-text">
                    ${esc(q.question || "")}
                  </div>

                </div>

                <div>
                  ${Number(q.points || 1)} pt
                </div>

              </div>


              <div class="options">

                ${
                  options.map(
                    (option,i) => {

                      const value =
                        typeof option === "object"
                          ? option.value ||
                            String.fromCharCode(65+i)
                          : String.fromCharCode(65+i);

                      const label =
                        typeof option === "object"
                          ? option.label ||
                            option.text ||
                            value
                          : option;


                      const correct =
                        String(value) ===
                        String(q.correctAnswer);


                      return `
                        <div class="option ${
                          correct ? "correct" : ""
                        }">

                          <strong>
                            ${esc(value)}.
                          </strong>

                          ${esc(label)}

                          ${
                            correct
                              ? " ✓ Correct"
                              : ""
                          }

                        </div>
                      `;

                    }
                  ).join("")
                }

              </div>


              <div class="question-actions">

                <button
                  class="edit"
                  data-question-action="edit"
                  data-question-id="${q.id}">
                  Edit
                </button>

                <button
                  class="danger"
                  data-question-action="delete"
                  data-question-id="${q.id}">
                  Delete
                </button>

              </div>

            </div>
          `;

        }
      ).join("");


  } catch(error){

    console.error(
      "Load questions error:",
      error
    );

    toast(
      "Unable to load questions."
    );

  }

}


/* =====================================
QUESTION ACTIONS
===================================== */

$("questionsList")
.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest("button");

    if (!button) return;

    const action =
      button.dataset.questionAction;

    const id =
      button.dataset.questionId;


    if (
      action === "edit"
    ){

      await editQuestion(id);

    }


    if (
      action === "delete"
    ){

      await deleteQuestion(id);

    }

  }
);


/* =====================================
EDIT QUESTION
===================================== */

async function editQuestion(id){

  if (!currentQuizId) return;

  try {

    const snap =
      await getDoc(
        doc(
          db,
          "quizzes",
          currentQuizId,
          "questions",
          id
        )
      );


    if (!snap.exists()){

      toast(
        "Question not found."
      );

      return;
    }


    const q = snap.data();


    $("questionId").value =
      id;

    $("questionText").value =
      q.question || "";

    $("questionType").value =
      q.type || "multiple-choice";


    const options =
      Array.isArray(q.options)
        ? q.options
        : [];


    $("optionA").value =
      getOptionText(
        options[0]
      );

    $("optionB").value =
      getOptionText(
        options[1]
      );

    $("optionC").value =
      getOptionText(
        options[2]
      );

    $("optionD").value =
      getOptionText(
        options[3]
      );


    $("correctAnswer").value =
      q.correctAnswer || "A";

    $("questionPoints").value =
      q.points || 1;

    $("explanation").value =
      q.explanation || "";

    $("questionOrder").value =
      q.order || 1;


    $("questionModalTitle")
      .textContent =
      "Edit Question";


    $("questionModal")
      .classList.add("show");


  } catch(error){

    console.error(
      "Edit question error:",
      error
    );

    toast(
      "Unable to load question."
    );

  }

}


function getOptionText(
  option
){

  if (
    typeof option ===
    "object" &&
    option !== null
  ){

    return (
      option.label ||
      option.text ||
      ""
    );

  }

  return option || "";

}


/* =====================================
SAVE QUESTION
===================================== */

$("questionForm")
.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if (!currentQuizId){

      toast(
        "Select a quiz first."
      );

      return;
    }


    const id =
      $("questionId").value;


    const options = [
      $("optionA").value.trim(),
      $("optionB").value.trim(),
      $("optionC").value.trim(),
      $("optionD").value.trim()
    ].filter(Boolean);


    if (!options.length){

      toast(
        "Add at least one option."
      );

      return;
    }


    const data = {

      question:
        $("questionText")
          .value
          .trim(),

      type:
        $("questionType")
          .value,

      options,

      correctAnswer:
        $("correctAnswer")
          .value,

      points:
        Number(
          $("questionPoints")
            .value || 1
        ),

      explanation:
        $("explanation")
          .value
          .trim(),

      order:
        Number(
          $("questionOrder")
            .value || 1
        ),

      updatedAt:
        serverTimestamp()

    };


    try {

      if (id){

        await updateDoc(
          doc(
            db,
            "quizzes",
            currentQuizId,
            "questions",
            id
          ),
          data
        );

        toast(
          "Question updated."
        );

      }else{

        data.createdAt =
          serverTimestamp();

        await addDoc(
          collection(
            db,
            "quizzes",
            currentQuizId,
            "questions"
          ),
          data
        );

        toast(
          "Question added."
        );

      }


      closeQuestionModal();

      await loadQuestions(
        currentQuizId
      );

      await loadQuizzes();


    } catch(error){

      console.error(
        "Save question error:",
        error
      );

      toast(
        "Unable to save question."
      );

    }

  }
);


/* =====================================
DELETE QUESTION
===================================== */

async function deleteQuestion(
  id
){

  if (!currentQuizId) return;


  const confirmed =
    confirm(
      "Delete this question?"
    );


  if (!confirmed) return;


  try {

    await deleteDoc(
      doc(
        db,
        "quizzes",
        currentQuizId,
        "questions",
        id
      )
    );


    toast(
      "Question deleted."
    );


    await loadQuestions(
      currentQuizId
    );

    await loadQuizzes();


  } catch(error){

    console.error(
      "Delete question error:",
      error
    );

    toast(
      "Unable to delete question."
    );

  }

}
