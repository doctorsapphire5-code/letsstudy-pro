<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Quiz - Lets Study Pro</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span{
  color:#2563eb;
}

nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

nav a{
  text-decoration:none;
  color:#334155;
  padding:9px 12px;
  border-radius:7px;
  font-size:13px;
}

nav a:hover,
nav a.active{
  background:#2563eb;
  color:#fff;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 18px;
}

h1{
  margin-bottom:6px;
}

.subtitle{
  color:#64748b;
  font-size:14px;
  margin-bottom:25px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.stat small{
  color:#64748b;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:8px;
  color:#2563eb;
}

.panel{
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
  margin-bottom:20px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.search{
  flex:1;
  min-width:220px;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
}

select,
input,
textarea{
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

.table-wrap{
  overflow-x:auto;
}

th,
td{
  padding:13px 10px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:13px;
}

th{
  background:#f8fafc;
  color:#64748b;
  font-size:12px;
}

.btn{
  border:0;
  border-radius:7px;
  padding:9px 12px;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.edit{
  background:#f59e0b;
  color:#fff;
}

.delete{
  background:#dc2626;
  color:#fff;
}

.view{
  background:#e2e8f0;
  color:#172033;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  padding:40px;
  color:#64748b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
  overflow:auto;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:650px;
  background:#fff;
  border-radius:15px;
  padding:25px;
  margin:30px auto;
}

.modal-box h2{
  margin-bottom:18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.question-box{
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  background:#f8fafc;
}

.question-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.option{
  margin-bottom:8px;
}

.add-question{
  width:100%;
  padding:12px;
  background:#e2e8f0;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  margin-bottom:15px;
}

.submit{
  width:100%;
  padding:13px;
  background:#2563eb;
  color:#fff;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.cancel{
  width:100%;
  padding:13px;
  background:#e2e8f0;
  color:#172033;
  border:0;
  border-radius:8px;
  cursor:pointer;
  margin-top:8px;
}

.message{
  display:none;
  padding:10px;
  border-radius:8px;
  margin-bottom:12px;
  font-size:13px;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:11px;
  font-weight:bold;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>


<header>

  <div class="logo">
    Lets <span>Study Pro</span>
  </div>

  <nav>

    <a href="admin-dashboard.html">
      Dashboard
    </a>

    <a href="admin-courses.html">
      Courses
    </a>

    <a
      href="admin-quiz.html"
      class="active">
      Quiz
    </a>

    <a href="admin-students.html">
      Students
    </a>

    <a href="admin-settings.html">
      Settings
    </a>

  </nav>

</header>


<main class="container">

  <h1>
    Quiz Management
  </h1>

  <p class="subtitle">
    Create and manage Lets Study Pro quizzes.
  </p>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <small>
        Total Quizzes
      </small>

      <strong id="quizCount">
        0
      </strong>

    </div>


    <div class="stat">

      <small>
        Total Questions
      </small>

      <strong id="questionCount">
        0
      </strong>

    </div>


    <div class="stat">

      <small>
        Published Quizzes
      </small>

      <strong id="publishedCount">
        0
      </strong>

    </div>

  </div>


  <!-- QUIZ LIST -->

  <section class="panel">

    <div class="toolbar">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search quiz..."
      >

      <select id="statusFilter">

        <option value="all">
          All
        </option>

        <option value="published">
          Published
        </option>

        <option value="draft">
          Draft
        </option>

      </select>


      <button
        class="btn primary"
        id="addQuizBtn">

        + Add Quiz

      </button>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Title</th>
            <th>Course</th>
            <th>Questions</th>
            <th>Marks</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="quizList">

          <tr>

            <td
              colspan="7"
              class="empty">

              Loading quizzes...

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>



<!-- QUIZ MODAL -->

<div
  class="modal"
  id="quizModal">

  <div class="modal-box">

    <h2 id="modalTitle">
      Add Quiz
    </h2>


    <div
      id="message"
      class="message">
    </div>


    <div class="form-group">

      <label>
        Quiz Title
      </label>

      <input
        id="quizTitle"
        placeholder="Example: Physics Form 5 Quiz 1"
      >

    </div>


    <div class="form-group">

      <label>
        Course / Subject
      </label>

      <input
        id="quizCourse"
        placeholder="Example: Physics"
      >

    </div>


    <div class="form-group">

      <label>
        Description
      </label>

      <textarea
        id="quizDescription"
        placeholder="Quiz description...">
      </textarea>

    </div>


    <div class="form-group">

      <label>
        Time Limit (minutes)
      </label>

      <input
        id="quizTime"
        type="number"
        min="1"
        value="30"
      >

    </div>


    <div class="form-group">

      <label>
        Status
      </label>

      <select id="quizStatus">

        <option value="draft">
          Draft
        </option>

        <option value="published">
          Published
        </option>

      </select>

    </div>


    <h3 style="margin:20px 0 12px;">
      Questions
    </h3>


    <div id="questions"></div>


    <button
      class="add-question"
      id="addQuestionBtn">

      + Add Question

    </button>


    <button
      class="submit"
      id="saveQuizBtn">

      Save Quiz

    </button>


    <button
      class="cancel"
      id="cancelBtn">

      Cancel

    </button>

  </div>

</div>



<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  push,
  set,
  update,
  remove,
  onValue,
  get
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getDatabase(app);


let currentAdmin =
null;

let quizzes = [];

let editingQuizId =
null;


/* =====================================================
   ADMIN AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      location.href =
        "admin-login.html";

      return;

    }


    const snapshot =
      await get(
        ref(
          db,
          "users/" +
          user.uid
        )
      );


    if(!snapshot.exists()){

      alert(
        "Access denied."
      );

      location.href =
        "dashboard.html";

      return;

    }


    const profile =
      snapshot.val();


    if(
      profile.role !== "admin" &&
      profile.role !== "superadmin"
    ){

      alert(
        "You are not authorized to access this page."
      );

      location.href =
        "dashboard.html";

      return;

    }


    currentAdmin = {

      uid:
        user.uid,

      role:
        profile.role

    };


    loadQuizzes();

  }
);


/* =====================================================
   LOAD QUIZZES
===================================================== */

function loadQuizzes(){

  const quizzesRef =
    ref(
      db,
      "quizzes"
    );


  onValue(
    quizzesRef,
    snapshot => {

      const data =
        snapshot.val();


      quizzes = [];


      if(data){

        Object.entries(
          data
        )
        .forEach(
          ([id,value]) => {

            quizzes.push({

              id,

              ...(value || {})

            });

          }
        );

      }


      quizzes.sort(
        (a,b) =>
          Number(
            b.createdAt || 0
          ) -
          Number(
            a.createdAt || 0
          )
      );


      updateStats();

      renderQuizzes();

    },
    error => {

      console.error(error);

      document.getElementById(
        "quizList"
      ).innerHTML = `

        <tr>

          <td
            colspan="7"
            class="empty">

            Unable to load quizzes.

          </td>

        </tr>

      `;

    }
  );

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const totalQuestions =
    quizzes.reduce(
      (sum,quiz) =>
        sum +
        Object.keys(
          quiz.questions || {}
        ).length,
      0
    );


  const published =
    quizzes.filter(
      quiz =>
        quiz.status ===
        "published"
    ).length;


  document.getElementById(
    "quizCount"
  ).textContent =
    quizzes.length;


  document.getElementById(
    "questionCount"
  ).textContent =
    totalQuestions;


  document.getElementById(
    "publishedCount"
  ).textContent =
    published;

}


/* =====================================================
   RENDER QUIZZES
===================================================== */

function renderQuizzes(){

  const tbody =
    document.getElementById(
      "quizList"
    );


  const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase()
    .trim();


  const filter =
    document.getElementById(
      "statusFilter"
    ).value;


  const list =
    quizzes.filter(
      quiz => {

        const text = [

          quiz.title,

          quiz.course,

          quiz.description

        ]
        .join(" ")
        .toLowerCase();


        return (

          (!search ||
           text.includes(search))

          &&

          (
            filter === "all" ||
            quiz.status === filter
          )

        );

      }
    );


  if(!list.length){

    tbody.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="empty">

          No quizzes found.

        </td>

      </tr>

    `;

    return;

  }


  tbody.innerHTML =
    list.map(
      quizRow
    ).join("");

}


/* =====================================================
   QUIZ ROW
===================================================== */

function quizRow(quiz){

  const questionCount =
    Object.keys(
      quiz.questions || {}
    ).length;


  let marks = 0;


  Object.values(
    quiz.questions || {}
  )
  .forEach(
    question => {

      marks +=
        Number(
          question.marks || 1
        );

    }
  );


  return `

    <tr>

      <td>

        <strong>
          ${escapeHtml(
            quiz.title ||
            "Untitled Quiz"
          )}
        </strong>

      </td>


      <td>
        ${escapeHtml(
          quiz.course ||
          "-"
        )}
      </td>


      <td>
        ${questionCount}
      </td>


      <td>
        ${marks}
      </td>


      <td>

        <span class="badge">

          ${escapeHtml(
            quiz.status ||
            "draft"
          )}

        </span>

      </td>


      <td>
        ${formatDate(
          quiz.createdAt
        )}
      </td>


      <td>

        <div class="actions">

          <button
            class="btn view"
            onclick="viewQuiz('${escapeAttr(quiz.id)}')">

            View

          </button>


          <button
            class="btn edit"
            onclick="editQuiz('${escapeAttr(quiz.id)}')">

            Edit

          </button>


          <button
            class="btn delete"
            onclick="deleteQuiz('${escapeAttr(quiz.id)}')">

            Delete

          </button>

        </div>

      </td>

    </tr>

  `;

}


/* =====================================================
   OPEN ADD QUIZ
===================================================== */

document.getElementById(
  "addQuizBtn"
)
.addEventListener(
  "click",
  () => {

    editingQuizId =
      null;


    document.getElementById(
      "modalTitle"
    ).textContent =
      "Add Quiz";


    clearForm();


    addQuestion();


    document.getElementById(
      "quizModal"
    ).classList.add(
      "show"
    );

  }
);


/* =====================================================
   ADD QUESTION
===================================================== */

document.getElementById(
  "addQuestionBtn"
)
.addEventListener(
  "click",
  addQuestion
);


function addQuestion(data = null){

  const container =
    document.getElementById(
      "questions"
    );


  const index =
    container.children.length;


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "question-box";


  box.innerHTML = `

    <div class="question-header">

      <strong>
        Question ${index + 1}
      </strong>

      <button
        type="button"
        class="btn delete remove-question">

        Remove

      </button>

    </div>


    <div class="form-group">

      <label>
        Question
      </label>

      <textarea
        class="question-text"
        placeholder="Enter question...">${escapeHtml(
          data?.text || ""
        )}</textarea>

    </div>


    <div class="form-group">

      <label>
        Option A
      </label>

      <input
        class="option option-a"
        value="${escapeAttr(
          data?.options?.A || ""
        )}"
        placeholder="Option A">

    </div>


    <div class="form-group">

      <label>
        Option B
      </label>

      <input
        class="option option-b"
        value="${escapeAttr(
          data?.options?.B || ""
        )}"
        placeholder="Option B">

    </div>


    <div class="form-group">

      <label>
        Option C
      </label>

      <input
        class="option option-c"
        value="${escapeAttr(
          data?.options?.C || ""
        )}"
        placeholder="Option C">

    </div>


    <div class="form-group">

      <label>
        Option D
      </label>

      <input
        class="option option-d"
        value="${escapeAttr(
          data?.options?.D || ""
        )}"
        placeholder="Option D">

    </div>


    <div class="form-group">

      <label>
        Correct Answer
      </label>

      <select class="correct-answer">

        <option value="A"
          ${
            data?.correctAnswer === "A"
            ? "selected"
            : ""
          }>
          A
        </option>

        <option value="B"
          ${
            data?.correctAnswer === "B"
            ? "selected"
            : ""
          }>
          B
        </option>

        <option value="C"
          ${
            data?.correctAnswer === "C"
            ? "selected"
            : ""
          }>
          C
        </option>

        <option value="D"
          ${
            data?.correctAnswer === "D"
            ? "selected"
            : ""
          }>
          D
        </option>

      </select>

    </div>


    <div class="form-group">

      <label>
        Marks
      </label>

      <input
        class="question-marks"
        type="number"
        min="1"
        value="${
          Number(
            data?.marks || 1
          )
        }">

    </div>

  `;


  container.appendChild(
    box
  );


  box
    .querySelector(
      ".remove-question"
    )
    .addEventListener(
      "click",
      () => {

        box.remove();

        refreshQuestionNumbers();

      }
    );

}


/* =====================================================
   REFRESH QUESTION NUMBERS
===================================================== */

function refreshQuestionNumbers(){

  document
    .querySelectorAll(
      ".question-box"
    )
    .forEach(
      (box,index) => {

        const title =
          box.querySelector(
            ".question-header strong"
          );


        if(title){

          title.textContent =
            "Question " +
            (index + 1);

        }

      }
    );

}


/* =====================================================
   SAVE QUIZ
===================================================== */

document.getElementById(
  "saveQuizBtn"
)
.addEventListener(
  "click",
  async () => {

    const title =
      document.getElementById(
        "quizTitle"
      ).value.trim();


    const course =
      document.getElementById(
        "quizCourse"
      ).value.trim();


    const description =
      document.getElementById(
        "quizDescription"
      ).value.trim();


    const timeLimit =
      Number(
        document.getElementById(
          "quizTime"
        ).value
      );


    const status =
      document.getElementById(
        "quizStatus"
      ).value;


    if(!title){

      showMessage(
        "Quiz title is required.",
        "error"
      );

      return;

    }


    if(!course){

      showMessage(
        "Course or subject is required.",
        "error"
      );

      return;

    }


    const questionBoxes =
      document.querySelectorAll(
        ".question-box"
      );


    if(
  questionBoxes.length === 0
){

  showMessage(
    "Add at least one question.",
    "error"
  );

  return;

}


const questions = {};

let valid = true;


questionBoxes.forEach(
  (box,index) => {

    const text =
      box.querySelector(
        ".question-text"
      ).value.trim();


    const A =
      box.querySelector(
        ".option-a"
      ).value.trim();


    const B =
      box.querySelector(
        ".option-b"
      ).value.trim();


    const C =
      box.querySelector(
        ".option-c"
      ).value.trim();


    const D =
      box.querySelector(
        ".option-d"
      ).value.trim();


    const correctAnswer =
      box.querySelector(
        ".correct-answer"
      ).value;


    const marks =
      Number(
        box.querySelector(
          ".question-marks"
        ).value
      );


    if(
      !text ||
      !A ||
      !B ||
      !C ||
      !D ||
      !marks
    ){

      valid = false;

      return;

    }


    questions[
      "q" + (index + 1)
    ] = {

      text: text,

      options: {

        A: A,
        B: B,
        C: C,
        D: D

      },

      correctAnswer:
        correctAnswer,

      marks:
        marks

    };

  }
);


if(!valid){

  showMessage(
    "Complete all question fields.",
    "error"
  );

  return;

}


/* =====================================================
   SAVE TO FIREBASE
===================================================== */

try{

  const now =
    Date.now();


  const quizData = {

    title:
      title,

    course:
      course,

    description:
      description,

    timeLimit:
      timeLimit,

    status:
      status,

    questions:
      questions,

    updatedAt:
      now,

    updatedBy:
      currentAdmin.uid

  };


  /* EDIT EXISTING QUIZ */

  if(editingQuizId){

    await update(
      ref(
        db,
        "quizzes/" +
        editingQuizId
      ),
      quizData
    );


    showMessage(
      "Quiz updated successfully.",
      "success"
    );


  }

  /* CREATE NEW QUIZ */

  else{

    const quizRef =
      push(
        ref(
          db,
          "quizzes"
        )
      );


    await set(
      quizRef,
      {

        ...quizData,

        createdAt:
          now,

        createdBy:
          currentAdmin.uid

      }
    );


    showMessage(
      "Quiz created successfully.",
      "success"
    );

  }


  setTimeout(
    () => {

      closeModal();

    },
    900
  );


}catch(error){

  console.error(
    "Quiz save error:",
    error
  );


  showMessage(
    "Unable to save quiz: " +
    error.message,
    "error"
  );

}

});


/* =====================================================
   EDIT QUIZ
===================================================== */

window.editQuiz =
async function(id){

  const quiz =
    quizzes.find(
      item =>
        item.id === id
    );


  if(!quiz){

    alert(
      "Quiz not found."
    );

    return;

  }


  editingQuizId =
    id;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Quiz";


  document.getElementById(
    "quizTitle"
  ).value =
    quiz.title || "";


  document.getElementById(
    "quizCourse"
  ).value =
    quiz.course || "";


  document.getElementById(
    "quizDescription"
  ).value =
    quiz.description || "";


  document.getElementById(
    "quizTime"
  ).value =
    quiz.timeLimit || 30;


  document.getElementById(
    "quizStatus"
  ).value =
    quiz.status || "draft";


  const container =
    document.getElementById(
      "questions"
    );


  container.innerHTML =
    "";


  const questionList =
    Object.values(
      quiz.questions || {}
    );


  if(questionList.length){

    questionList.forEach(
      question => {

        addQuestion(
          question
        );

      }
    );

  }else{

    addQuestion();

  }


  document.getElementById(
    "message"
  ).style.display =
    "none";


  document.getElementById(
    "quizModal"
  ).classList.add(
    "show"
  );

};


/* =====================================================
   VIEW QUIZ
===================================================== */

window.viewQuiz =
function(id){

  const quiz =
    quizzes.find(
      item =>
        item.id === id
    );


  if(!quiz){

    return;

  }


  const questions =
    Object.values(
      quiz.questions || {}
    );


  let output =

    "QUIZ: " +
    (quiz.title || "-") +

    "\n\nCourse: " +
    (quiz.course || "-") +

    "\nStatus: " +
    (quiz.status || "-") +

    "\nTime: " +
    (quiz.timeLimit || 0) +
    " minutes" +

    "\nQuestions: " +
    questions.length;


  questions.forEach(
    (question,index) => {

      output +=

        "\n\nQuestion " +
        (index + 1) +
        ": " +
        question.text +

        "\nA. " +
        question.options.A +

        "\nB. " +
        question.options.B +

        "\nC. " +
        question.options.C +

        "\nD. " +
        question.options.D +

        "\nCorrect: " +
        question.correctAnswer +

        "\nMarks: " +
        question.marks;

    }
  );


  alert(
    output
  );

};


/* =====================================================
   DELETE QUIZ
===================================================== */

window.deleteQuiz =
async function(id){

  const quiz =
    quizzes.find(
      item =>
        item.id === id
    );


  if(!quiz){

    return;

  }


  const confirmed =
    confirm(
      "Are you sure you want to delete this quiz?"
    );


  if(!confirmed){

    return;

  }


  try{

    await remove(
      ref(
        db,
        "quizzes/" +
        id
      )
    );


    alert(
      "Quiz deleted successfully."
    );


  }catch(error){

    console.error(
      "Delete quiz error:",
      error
    );


    alert(
      "Unable to delete quiz."
    );

  }

};

/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value){

    return "-";

  }


  const date =
    new Date(
      Number(value)
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  return date.toLocaleString(
    "en-TZ"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttr(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "\\",
    "\\\\"
  )
  .replaceAll(
    "'",
    "\\'"
  );

}
