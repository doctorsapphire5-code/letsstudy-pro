<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Quiz | LetsStudy Pro</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
margin:0;
}

header{
background:#111827;
color:white;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 5px 20px #0002;

}

input,select{

width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ddd;

}


button{

background:#0b57d0;
color:white;
border:0;
padding:12px 20px;
border-radius:8px;

}

.delete{

background:#dc2626;

}

.quiz{

padding:15px;
border-bottom:1px solid #eee;

}

</style>

</head>


<body>


<header>

<h1>
📝 Admin Quiz Manager
</h1>

</header>



<div class="container">


<div class="card">


<h2>
Add Question
</h2>


<select id="course">

<option>
Loading courses...
</option>

</select>



<input id="question"
placeholder="Question">



<input id="option1"
placeholder="Option 1">


<input id="option2"
placeholder="Option 2">


<input id="option3"
placeholder="Option 3">


<input id="option4"
placeholder="Option 4">


<input id="answer"
placeholder="Correct answer">



<button onclick="addQuiz()">

Save Question

</button>


</div>





<div class="card">


<h2>
All Questions
</h2>


<div id="list">

Loading...

</div>


</div>



</div>







<script type="module">


import {

db

}

from "./assets/js/firebase.js";



import {

collection,
getDocs,
addDoc,
deleteDoc,
doc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";








async function loadCourses(){


const snap =
await getDocs(

collection(
db,
"courses"
)

);



let html="";


snap.forEach(

item=>{


html+=`

<option value="${item.id}">

${item.data().title}

</option>

`;



});



document.getElementById(
"course"
).innerHTML=html;


}







async function addQuiz(){


await addDoc(

collection(
db,
"quizzes"
),

{


courseId:

document.getElementById(
"course"
).value,


question:

document.getElementById(
"question"
).value,


options:[

document.getElementById("option1").value,

document.getElementById("option2").value,

document.getElementById("option3").value,

document.getElementById("option4").value

],


answer:

document.getElementById(
"answer"
).value,


createdAt:

serverTimestamp()


}

);



alert(
"Question Added"
);


loadQuiz();


}







async function loadQuiz(){


const snap=
await getDocs(

collection(
db,
"quizzes"
)

);



let html="";


snap.forEach(

item=>{


const q=item.data();


html+=`

<div class="quiz">

<h3>
${q.question}
</h3>


<p>
${q.options.join(" | ")}
</p>


<button class="delete"

onclick="removeQuiz('${item.id}')">

Delete

</button>


</div>

`;



});



document.getElementById(
"list"
).innerHTML=html;


}







window.removeQuiz=

async function(id){


await deleteDoc(

doc(
db,
"quizzes",
id
)

);


loadQuiz();


}






window.addQuiz=addQuiz;


loadCourses();

loadQuiz();



</script>


</body>

</html>
