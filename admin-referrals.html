<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Referrals | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
button,input,select{font:inherit}
button{border:0;cursor:pointer;border-radius:9px;padding:9px 12px}
header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:10}
header h1{flex:1;font-size:18px;margin:0}
.back{background:#eef2ff;color:#1d4ed8}
.primary{background:#2563eb;color:#fff}
.danger{background:#fee2e2;color:#b91c1c}
main{max-width:1200px;margin:auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat,.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px}
.stat span{font-size:11px;color:#64748b}
.stat b{display:block;font-size:23px;margin-top:5px}
.toolbar{display:flex;gap:8px;margin-bottom:14px}
.toolbar input{max-width:420px}
input,select{width:100%;padding:10px;border:1px solid #dbe1e8;border-radius:9px;outline:none;background:#fff}
.table{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4;white-space:nowrap}
th{font-size:10px;color:#64748b}
.badge{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:bold}
.active{background:#dcfce7;color:#15803d}
.pending{background:#fef3c7;color:#a16207}
.blocked{background:#fee2e2;color:#b91c1c}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:50}
.modal.show{display:flex}
.box{background:#fff;width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:16px;padding:20px}
.head{display:flex;align-items:center;margin-bottom:16px}
.head h2{flex:1;font-size:18px;margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:5px}
.full{grid-column:1/-1}
.help{font-size:10px;color:#64748b;margin-top:5px}
.empty{text-align:center;padding:35px;color:#64748b}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none;font-size:12px;z-index:100}
.toast.show{display:block}
@media(max-width:700px){
.stats{grid-template-columns:1fr 1fr}
.form{grid-template-columns:1fr}
.full{grid-column:auto}
}
</style></head><body><header><button class="back"
onclick="location.href='admin-marketing.html'">
←
</button>

<h1>🤝 Referral & Affiliate</h1><button class="primary"
onclick="openCreate()">

+ Add Referral
  </button>

</header><main><section class="stats"><div class="stat">
<span>Total Referrers</span>
<b id="total">0</b>
</div><div class="stat">
<span>Active</span>
<b id="active">0</b>
</div><div class="stat">
<span>Conversions</span>
<b id="conversions">0</b>
</div><div class="stat">
<span>Total Commission</span>
<b id="commission">TZS 0</b>
</div></section><section class="card"><div class="toolbar"><input
id="search"
placeholder="Search name, UID or referral code..."
oninput="render()"

«»

<select
id="filter"
onchange="render()">

<option value="all">All Status</option>
<option value="active">Active</option>
<option value="pending">Pending</option>
<option value="blocked">Blocked</option></select></div><div class="table"><table><thead><tr>
<th>Referrer</th>
<th>Code</th>
<th>Commission</th>
<th>Conversions</th>
<th>Earnings</th>
<th>Status</th>
<th>Actions</th>
</tr></thead><tbody id="list"></tbody></table></div></section></main><!-- MODAL --><div
id="modal"
class="modal"><div class="box"><div class="head"><h2 id="modalTitle">
Add Referral
</h2><button
onclick="closeModal()">
✕
</button>

</div><form id="form"><div class="form"><div class="field full"><label>User Firebase UID</label>

<input
id="userId"
required
placeholder="Firebase User UID"

«»

<div class="help">
UID ya mtumiaji anayekuwa referral partner.
</div></div><div class="field"><label>Referral Code</label>

<input
id="code"
required
placeholder="LETS10"

«»

</div><div class="field"><label>Commission (%)</label>

<input
id="rate"
type="number"
min="0"
max="100"
value="10"
required

«»

</div><div class="field"><label>Status</label>

<select id="status"><option value="active">
Active
</option><option value="pending">
Pending
</option><option value="blocked">
Blocked
</option></select></div><div class="field"><label>Conversion Target</label>

<input
id="target"
type="number"
min="0"
value="0"

«»

</div><div class="field full"><label>Notes</label>

<input
id="notes"
placeholder="Optional admin notes"

«»

</div></div><br><button
class="primary"
type="submit">

💾 Save Referral

</button></form></div></div><div
id="toast"
class="toast">
Saved
</div><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
doc,
getDoc,
getDocs,
setDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
 FIREBASE
========================================== */

const firebaseConfig={

apiKey:"YOUR_API_KEY",

authDomain:
"YOUR_PROJECT.firebaseapp.com",

projectId:
"YOUR_PROJECT_ID",

storageBucket:
"YOUR_PROJECT.firebasestorage.app",

messagingSenderId:
"YOUR_MESSAGING_SENDER_ID",

appId:
"YOUR_APP_ID"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* ==========================================
 STATE
========================================== */

let referrals=[];
let editingId=null;
let admin=null;


/* ==========================================
 ADMIN AUTH
========================================== */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="login.html";
return;

}

try{

const snap=
await getDoc(
doc(db,"users",user.uid)
);

if(
!snap.exists() ||
snap.data().role!=="admin"
){

alert("Access denied");

location.href=
"dashboard.html";

return;

}

admin=user;

load();

}catch(error){

console.error(error);

alert("Unable to verify admin.");

}

});


/* ==========================================
 LOAD
========================================== */

async function load(){

try{

const snap=
await getDocs(
collection(db,"referrals")
);

referrals=
snap.docs.map(
d=>({

id:d.id,
...d.data()

})
);

updateStats();
render();

}catch(error){

console.error(error);

toast(
"Unable to load referrals."
);

}

}


/* ==========================================
 STATS
========================================== */

function updateStats(){

document.getElementById(
"total"
).textContent=
referrals.length;

document.getElementById(
"active"
).textContent=
referrals.filter(
x=>x.status==="active"
).length;

document.getElementById(
"conversions"
).textContent=
referrals.reduce(
(a,x)=>
a+Number(x.conversions||0),
0
);

document.getElementById(
"commission"
).textContent=
"TZS "+
referrals.reduce(
(a,x)=>
a+Number(x.commission||0),
0
).toLocaleString();

}


/* ==========================================
 RENDER
========================================== */

window.render=function(){

const search=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

const filter=
document.getElementById(
"filter"
).value;


const data=
referrals.filter(x=>{

const text=
`${x.userId||""}
${x.code||""}`
.toLowerCase();

return(
text.includes(search) &&
(
filter==="all" ||
x.status===filter
)
);

});


const list=
document.getElementById("list");


if(!data.length){

list.innerHTML=`

<tr>

<td colspan="7">

<div class="empty">

No referral partners found.

</div>

</td>

</tr>

`;

return;

}


list.innerHTML=
data.map(x=>`

<tr>

<td>

<strong>
${esc(x.name||"Referral Partner")}
</strong>

<br>

<small>
${esc(x.userId||"")}
</small>

</td>


<td>

<strong>
${esc(x.code||"")}
</strong>

</td>


<td>

${Number(x.rate||0)}%

</td>


<td>

${Number(
x.conversions||0
).toLocaleString()}

${x.target?
` / ${Number(x.target).toLocaleString()}`
:""}

</td>


<td>

TZS ${Number(
x.commission||0
).toLocaleString()}

</td>


<td>

<span class="badge ${
esc(x.status||"pending")
}">

${esc(x.status||"pending")}

</span>

</td>


<td>

<button
class="back"
onclick="editReferral('${x.id}')">

Edit

</button>

<button
class="danger"
onclick="deleteReferral('${x.id}')">

Delete

</button>

</td>

</tr>

`).join("");

};


/* ==========================================
 CREATE
========================================== */

window.openCreate=function(){

editingId=null;

document.getElementById(
"modalTitle"
).textContent=
"Add Referral";

document.getElementById(
"form"
).reset();

document.getElementById(
"rate"
).value=10;

document.getElementById(
"modal"
).classList.add("show");

};


/* ==========================================
 EDIT
========================================== */

window.editReferral=function(id){

const x=
referrals.find(
r=>r.id===id
);

if(!x)return;

editingId=id;

document.getElementById(
"modalTitle"
).textContent=
"Edit Referral";


set("userId",x.userId||"");
set("code",x.code||"");
set("rate",x.rate||10);
set("status",x.status||"active");
set("target",x.target||0);
set("notes",x.notes||"");


document.getElementById(
"modal"
).classList.add("show");

};


/* ==========================================
 SAVE
========================================== */

document.getElementById(
"form"
).addEventListener(
"submit",
async e=>{

e.preventDefault();


const code=
get("code")
.toUpperCase()
.replace(/\s+/g,"");


if(!code){

toast(
"Referral code is required."
);

return;

}


const old=
editingId
?
referrals.find(
x=>x.id===editingId
)
:null;


const data={

userId:get("userId"),

code,

rate:Number(
get("rate")||0
),

status:get("status"),

target:Number(
get("target")||0
),

notes:get("notes"),

conversions:
old?.conversions||0,

commission:
old?.commission||0,

updatedAt:
serverTimestamp()

};


try{

await setDoc(
doc(
db,
"referrals",
code
),
{

...data,

createdBy:
admin.uid,

createdAt:
old?.createdAt||
serverTimestamp()

},
{
merge:true
}
);


toast(
editingId
?
"Referral updated."
:
"Referral created."
);

closeModal();

await load();

}catch(error){

console.error(error);

toast(
"Unable to save referral."
);

}

});


/* ==========================================
 DELETE
========================================== */

window.deleteReferral=
async function(id){

const x=
referrals.find(
r=>r.id===id
);

if(!x)return;


if(!confirm(
`Delete referral "${x.code}"?`
))return;


try{

await deleteDoc(
doc(
db,
"referrals",
id
)
);

toast(
"Referral deleted."
);

await load();

}catch(error){

console.error(error);

toast(
"Delete failed."
);

}

};


/* ==========================================
 MODAL
========================================== */

window.closeModal=function(){

document.getElementById(
"modal"
).classList.remove("show");

editingId=null;

};


/* ==========================================
 HELPERS
========================================== */

function get(id){

return document
.getElementById(id)
.value
.trim();

}

function set(id,value){

document
.getElementById(id)
.value=value;

}

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function toast(text){

const el=
document.getElementById(
"toast"
);

el.textContent=text;

el.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
