<div class="container">

  <div class="brand">LetsStudy Pro</div>

  <div class="icon">🔐</div>

  <h1>Reset Admin Password</h1>

  <p class="description">
    Enter your administrator email address.
    We will send you a secure password reset link.
  </p>

  <div id="message" class="message"></div>

  <form id="resetForm">

    <label for="email">Admin Email Address</label>
    <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" required="">

    <button type="submit" id="submitBtn">
      Send Reset Link
    </button>

  </form>

  <div class="links">
    <a href="admin-login.html">Back to Admin Login</a><br>
    <a href="admin-forgot-password.html">Forgot Password?</a>
  </div>

    LetsStudy Pro · Learn. Build. Work. Grow.
  </footer>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbKXjsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const $ = id => document.getElementById(id);

function showMessage(text,type){
  $("message").textContent = text;
  $("message").className = "message " + type;
}

$("resetForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const email = $("email").value.trim().toLowerCase();

  $("submitBtn").disabled = true;
  $("submitBtn").textContent = "Sending...";
  $("message").className = "message";

  try{
    await auth.sendPasswordResetEmail(email);

    showMessage(
      "If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder.",
      "success"
    );

    $("resetForm").reset();

  }catch(error){
    // Avoid exposing whether an email belongs to an account.
    if(
      error.code === "auth/user-not-found" ||
      error.code === "auth/invalid-email"
    ){
      showMessage(
        "If an account exists for this email, a reset link will be sent. Check your email address.",
        "success"
      );
    }else{
      showMessage(
        "Unable to send reset email. Please try again later.",
        "error"
      );
    }
  }finally{
    $("submitBtn").disabled = false;
    $("submitBtn").textContent = "Send Reset Link";
  }
});
</script>
