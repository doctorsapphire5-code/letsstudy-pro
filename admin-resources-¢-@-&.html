<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Resources | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.admin{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#172033;
  color:#fff;
  padding:8px 13px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

h1,h2{margin-top:0}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.full{grid-column:1/-1}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  font-family:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e2e8f0;
  color:#334155;
}

.danger{
  background:#fee2e2;
  color:#dc2626;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.search{
  margin-bottom:15px;
}

.search input{
  max-width:450px;
}

.resource{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.resource-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.resource h3{
  margin:0 0 7px;
}

.resource p{
  color:#64748b;
  font-size:13px;
  line-height:1.6;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.badge{
  background:#f1f5f9;
  color:#475569;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
}

.item-actions{
  display:flex;
  gap:7px;
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-bottom:15px;
  font-size:13px;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  text-align:center;
  padding:40px;
  color:#64748b;
}

@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .resource-top{flex-direction:column}
}
</style>
</head>

<body>

<div class="container">

<div class="admin">
<i class="fa-solid fa-shield-halved"></i>
ADMIN
</div>

<div class="card">

<h1>
<i class="fa-solid fa-folder-open"></i>
Resources Management
</h1>

<p>
Manage course resources.
</p>

</div>

<div id="message" class="message"></div>


<!-- FORM -->

<div class="card">

<h2 id="formTitle">
Add Resource
</h2>

<form id="resourceForm">

<div class="grid">

<div>

<label>Course ID</label>

<input
id="courseId"
required
placeholder="Course ID">

</div>


<div>

<label>Resource Name</label>

<input
id="name"
required
placeholder="Resource name">

</div>


<div>

<label>Type</label>

<select id="type">

<option value="pdf">PDF</option>
<option value="document">Document</option>
<option value="video">Video</option>
<option value="audio">Audio</option>
<option value="link">Link</option>
<option value="image">Image</option>
<option value="other">Other</option>

</select>

</div>


<div>

<label>URL</label>

<input
id="url"
type="url"
required
placeholder="https://...">

</div>


<div class="full">

<label>Description</label>

<textarea
id="description"
placeholder="Resource description"></textarea>

</div>

</div>


<div class="actions">

<button
type="submit"
id="saveBtn"
class="primary">

<i class="fa-solid fa-plus"></i>
Add Resource

</button>

<button
type="button"
id="cancelBtn"
class="secondary"
style="display:none">

Cancel

</button>

</div>

</form>

</div>


<!-- LIST -->

<div class="card">

<h2>
All Resources
</h2>

<div class="search">

<input
id="search"
type="search"
placeholder="Search resources...">

</div>

<div id="resourceList">

<div class="empty">
<i class="fa-solid fa-spinner fa-spin"></i>
<br><br>
Loading...
</div>

</div>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
updateDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const auth=getAuth(app);


const form=
document.getElementById("resourceForm");

const courseId=
document.getElementById("courseId");

const name=
document.getElementById("name");

const type=
document.getElementById("type");

const url=
document.getElementById("url");

const description=
document.getElementById("description");

const list=
document.getElementById("resourceList");

const search=
document.getElementById("search");

const message=
document.getElementById("message");

const saveBtn=
document.getElementById("saveBtn");

const cancelBtn=
document.getElementById("cancelBtn");

const formTitle=
document.getElementById("formTitle");


let resources=[];

let editId=null;

let currentUser=null;


/* ===============================
   MESSAGE
================================ */

function showMessage(text,error=false){

message.textContent=text;

message.className=
"message "+(error?"error":"success");

setTimeout(()=>{
message.className="message";
},3500);

}


/* ===============================
   ESCAPE
================================ */

function esc(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ===============================
   LOAD
================================ */

async function loadResources(){

try{

const snap=
await getDocs(
collection(db,"resources")
);

resources=
snap.docs.map(d=>({

id:d.id,
...d.data()

}));

render();

}catch(error){

console.error(error);

list.innerHTML=`

<div class="empty">

<i class="fa-solid fa-triangle-exclamation"></i>

<br><br>

Failed to load resources.

</div>

`;

}

}


/* ===============================
   RENDER
================================ */

function render(){

const q=
search.value
.trim()
.toLowerCase();


const filtered=
resources.filter(r=>

String(r.name||"")
.toLowerCase()
.includes(q)

||

String(r.courseId||"")
.toLowerCase()
.includes(q)

||

String(r.type||"")
.toLowerCase()
.includes(q)

);


if(!filtered.length){

list.innerHTML=`

<div class="empty">

<i class="fa-solid fa-folder-open"></i>

<br><br>

No resources found.

</div>

`;

return;

}


list.innerHTML=
filtered.map(r=>`

<div class="resource">

<div class="resource-top">

<div>

<h3>
${esc(r.name)}
</h3>

<p>
${esc(r.description||"No description")}
</p>

<div class="badges">

<span class="badge">
Course: ${esc(r.courseId)}
</span>

<span class="badge">
Type: ${esc(r.type||"other")}
</span>

<span class="badge">
ID: ${esc(r.id)}
</span>

</div>

<br>

<a
href="${esc(r.url)}"
target="_blank"
rel="noopener">

Open Resource

</a>

</div>


<div class="item-actions">

<button
class="secondary"
onclick="editResource('${r.id}')">

<i class="fa-solid fa-pen"></i>

</button>

<button
class="danger"
onclick="removeResource('${r.id}')">

<i class="fa-solid fa-trash"></i>

</button>

</div>

</div>

</div>

`).join("");

}


/* ===============================
   ADD / UPDATE
================================ */

form.addEventListener(
"submit",
async e=>{

e.preventDefault();


if(!currentUser){

showMessage(
"Admin login required.",
true
);

return;

}


const data={

courseId:courseId.value.trim(),

name:name.value.trim(),

type:type.value,

url:url.value.trim(),

description:description.value.trim()

};


if(
!data.courseId ||
!data.name ||
!data.url
){

showMessage(
"Course ID, name and URL are required.",
true
);

return;

}


saveBtn.disabled=true;


try{

if(editId){

await updateDoc(

doc(
db,
"resources",
editId
),

{

...data,

updatedAt:
serverTimestamp()

}

);

showMessage(
"Resource updated successfully."
);

}else{


/* FIREBASE AUTOMATIC ID */

const ref=
await addDoc(

collection(
db,
"resources"
),

{

...data,

createdBy:
currentUser.uid,

createdAt:
serverTimestamp()

}

);


console.log(
"Created resource:",
ref.id
);


showMessage(
"Resource added successfully."
);

}


resetForm();

await loadResources();

}catch(error){

console.error(error);

showMessage(
error.message,
true
);

}


saveBtn.disabled=false;

});


/* ===============================
   EDIT
================================ */

window.editResource=function(id){

const r=
resources.find(
x=>x.id===id
);

if(!r)return;


editId=id;

courseId.value=
r.courseId||"";

name.value=
r.name||"";

type.value=
r.type||"other";

url.value=
r.url||"";

description.value=
r.description||"";


formTitle.textContent=
"Edit Resource";


saveBtn.innerHTML=`

<i class="fa-solid fa-save"></i>
Update Resource

`;

cancelBtn.style.display=
"inline-block";


window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* ===============================
   DELETE
================================ */

window.removeResource=
async function(id){

const r=
resources.find(
x=>x.id===id
);

if(!r)return;


if(
!confirm(
`Delete "${r.name}"?`
)
)return;


try{

await deleteDoc(

doc(
db,
"resources",
id
)

);

showMessage(
"Resource deleted."
);

await loadResources();

}catch(error){

showMessage(
error.message,
true
);

}

};


/* ===============================
   RESET
================================ */

function resetForm(){

editId=null;

form.reset();

type.value="pdf";

formTitle.textContent=
"Add Resource";

saveBtn.innerHTML=`

<i class="fa-solid fa-plus"></i>
Add Resource

`;

cancelBtn.style.display=
"none";

}


cancelBtn.addEventListener(
"click",
resetForm
);


search.addEventListener(
"input",
render
);


/* ===============================
   ADMIN AUTH
================================ */

onAuthStateChanged(
auth,
async user=>{

if(!user){

currentUser=null;

list.innerHTML=`

<div class="empty">

<i class="fa-solid fa-lock"></i>

<br><br>

Admin login required.

</div>

`;

return;

}


currentUser=user;

await loadResources();

});

</script>

</body>
</html>
