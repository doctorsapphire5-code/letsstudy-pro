<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Resources | LetsStudy Pro Admin</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Inter,Arial,sans-serif;
background:#f5f7fb;
color:#101828
}

button,
input,
textarea,
select{
font:inherit
}

button{
border:0;
cursor:pointer;
border-radius:10px;
padding:11px 16px;
font-weight:800
}

.primary{
background:#155eef;
color:white
}

.secondary{
background:#eef4ff;
color:#155eef
}

.danger{
background:#fee4e2;
color:#b42318
}

.header{
height:68px;
background:#fff;
border-bottom:1px solid #eaecf0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
position:sticky;
top:0;
z-index:20
}

.logo{
font-size:21px;
font-weight:900;
color:#155eef
}

.admin-label{
font-size:13px;
color:#667085
}

.container{
width:min(1200px,100%);
margin:auto;
padding:25px 18px 60px
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
flex-wrap:wrap;
margin-bottom:22px
}

h1{
font-size:28px
}

.subtitle{
color:#667085;
margin-top:4px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px
}

.stat{
background:#fff;
border:1px solid #eaecf0;
border-radius:15px;
padding:18px
}

.stat span{
font-size:13px;
color:#667085
}

.stat strong{
display:block;
font-size:28px;
margin-top:5px
}

.card{
background:#fff;
border:1px solid #eaecf0;
border-radius:16px;
padding:18px;
margin-bottom:16px
}

.filters{
display:flex;
gap:10px;
flex-wrap:wrap
}

.search{
flex:1;
min-width:220px;
padding:12px 14px;
border:1px solid #d0d5dd;
border-radius:10px;
outline:none
}

.search:focus,
input:focus,
textarea:focus,
select:focus{
border-color:#155eef;
box-shadow:0 0 0 3px #155eef12
}

.resource{
display:flex;
justify-content:space-between;
gap:20px;
align-items:flex-start
}

.resource-info{
flex:1
}

.resource-title{
font-size:18px;
font-weight:850
}

.description{
color:#667085;
font-size:14px;
margin-top:5px
}

.meta{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:12px
}

.badge{
font-size:11px;
font-weight:800;
padding:6px 10px;
border-radius:20px;
background:#f2f4f7;
color:#475467
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}

.empty,
.loading{
text-align:center;
padding:45px 20px;
color:#667085
}

.error{
display:none;
background:#fef3f2;
border:1px solid #fecdca;
color:#b42318;
padding:13px;
border-radius:10px;
margin-bottom:15px
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
align-items:center;
justify-content:center;
padding:15px
}

.modal.show{
display:flex
}

.modal-box{
background:#fff;
width:min(680px,100%);
max-height:94vh;
overflow:auto;
border-radius:18px;
padding:22px
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px
}

.close{
background:#f2f4f7;
font-size:18px;
padding:8px 13px
}

.form-group{
margin-bottom:15px
}

label{
display:block;
font-size:13px;
font-weight:800;
margin-bottom:6px
}

input,
textarea,
select{
width:100%;
padding:12px;
border:1px solid #d0d5dd;
border-radius:10px;
outline:none;
background:#fff
}

textarea{
resize:vertical
}

.footer-actions{
display:flex;
justify-content:flex-end;
gap:9px;
margin-top:20px
}

@media(max-width:700px){

.container{
padding:18px 12px
}

.stats{
grid-template-columns:1fr
}

.resource{
flex-direction:column
}

.actions{
width:100%
}

.actions button{
flex:1
}

}
</style>
</head>

<body>

<header class="header">

<div class="logo">
LetsStudy Pro
</div>

<div class="admin-label">
Admin • Resources
</div>

</header>


<main class="container">

<div class="top">

<div>

<h1>
Resources
</h1>

<p class="subtitle">
Manage course learning resources.
</p>

</div>

<button
class="primary"
onclick="openCreate()">

+ Add Resource

</button>

</div>


<div
id="error"
class="error">
</div>


<div class="stats">

<div class="stat">

<span>
Total Resources
</span>

<strong id="total">
0
</strong>

</div>


<div class="stat">

<span>
Courses
</span>

<strong id="courseCount">
0
</strong>

</div>


<div class="stat">

<span>
Resource Types
</span>

<strong id="typeCount">
0
</strong>

</div>

</div>


<div class="card">

<div class="filters">

<input
id="search"
class="search"
placeholder="Search resources..."
oninput="render()"
>

<input
id="courseFilter"
class="search"
placeholder="Filter by courseId..."
oninput="render()"
>

</div>

</div>


<div id="resourceList">

<div class="loading">
Loading resources...
</div>

</div>

</main>


<!-- MODAL -->

<div
id="modal"
class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
Add Resource
</h2>

<button
class="close"
onclick="closeModal()">

×

</button>

</div>


<form id="resourceForm">


<div class="form-group">

<label>
Course ID *
</label>

<input
id="courseId"
required
placeholder="e.g. web-development-001"
>

</div>


<div class="form-group">

<label>
Resource Name *
</label>

<input
id="name"
required
placeholder="e.g. HTML Course Notes"
>

</div>


<div class="form-group">

<label>
Resource Type
</label>

<select id="type">

<option value="pdf">
PDF
</option>

<option value="document">
Document
</option>

<option value="video">
Video
</option>

<option value="link">
Link
</option>

<option value="image">
Image
</option>

<option value="file">
File
</option>

<option value="other">
Other
</option>

</select>

</div>


<div class="form-group">

<label>
Resource URL *
</label>

<input
id="url"
type="url"
required
placeholder="https://..."
>

</div>


<div class="form-group">

<label>
Description
</label>

<textarea
id="description"
rows="5"
placeholder="Describe this resource..."
></textarea>

</div>


<div class="footer-actions">

<button
type="button"
class="secondary"
onclick="closeModal()">

Cancel

</button>

<button
type="submit"
class="primary">

Save Resource

</button>

</div>


</form>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
query,
where,
addDoc,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/*
========================================
FIREBASE
========================================
*/

const firebaseConfig={

apiKey:
"AIzaSyBcKXbAVXKbXkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


let resources=[];

let editingId=null;


/*
========================================
GET COURSE ID FROM URL
========================================
*/

const params=
new URLSearchParams(
location.search
);

const urlCourseId=
params.get("courseId");


if(urlCourseId){

document
.getElementById("courseFilter")
.value=
urlCourseId;

}


/*
========================================
LOAD
========================================
*/

async function loadResources(){

try{

const snap=
await getDocs(
collection(
db,
"resources"
)
);


resources=
snap.docs.map(
d=>({

id:d.id,
...d.data()

})
);


render();


}catch(error){

showError(
error.message
);

}

}


/*
========================================
RENDER
========================================
*/

window.render=function(){

const search=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const courseFilter=
document
.getElementById("courseFilter")
.value
.toLowerCase()
.trim();


const filtered=
resources.filter(r=>{

const text=`

${r.name||""}
${r.type||""}
${r.description||""}
${r.courseId||""}
${r.url||""}

`.toLowerCase();


return(
text.includes(search)&&
String(r.courseId||"")
.toLowerCase()
.includes(courseFilter)
);

});


/*
STATS
*/

document
.getElementById("total")
.textContent=
resources.length;


const courses=
new Set(
resources
.map(r=>r.courseId)
.filter(Boolean)
);


document
.getElementById("courseCount")
.textContent=
courses.size;


const types=
new Set(
resources
.map(r=>r.type)
.filter(Boolean)
);


document
.getElementById("typeCount")
.textContent=
types.size;


/*
EMPTY
*/

if(!filtered.length){

document
.getElementById("resourceList")
.innerHTML=`

<div class="card empty">

No resources found.

</div>

`;

return;

}


/*
CARDS
*/

document
.getElementById("resourceList")
.innerHTML=

filtered
.map(r=>{

return`

<div class="card resource">

<div class="resource-info">

<div class="resource-title">

${escapeHTML(
r.name||
"Untitled Resource"
)}

</div>


<div class="description">

${escapeHTML(
r.description||
"No description"
)}

</div>


<div class="meta">

<span class="badge">

Course:
${escapeHTML(
r.courseId||
"-"
)}

</span>


<span class="badge">

Type:
${escapeHTML(
r.type||
"other"
)}

</span>


<span class="badge">

ID:
${escapeHTML(
r.id
)}

</span>

</div>

</div>


<div class="actions">

${
r.url
?
`

<button
class="secondary"
onclick="openResource('${encodeURIComponent(r.url)}')">

Open

</button>

`
:""
}


<button
class="secondary"
onclick="editResource('${r.id}')">

Edit

</button>


<button
class="danger"
onclick="removeResource('${r.id}')">

Delete

</button>

</div>

</div>

`;

})
.join("");

};


/*
========================================
OPEN RESOURCE
========================================
*/

window.openResource=
function(encoded){

const url=
decodeURIComponent(
encoded
);

if(!url)return;

window.open(
url,
"_blank",
"noopener,noreferrer"
);

};


/*
========================================
CREATE
========================================
*/

window.openCreate=
function(){

editingId=null;

document
.getElementById("modalTitle")
.textContent=
"Add Resource";


document
.getElementById("resourceForm")
.reset();


if(urlCourseId){

document
.getElementById("courseId")
.value=
urlCourseId;

}


document
.getElementById("modal")
.classList
.add("show");

};


/*
========================================
EDIT
========================================
*/

window.editResource=
function(id){

const resource=
resources.find(
r=>r.id===id
);


if(!resource)return;


editingId=id;


document
.getElementById("modalTitle")
.textContent=
"Edit Resource";


document
.getElementById("courseId")
.value=
resource.courseId||
"";


document
.getElementById("name")
.value=
resource.name||
"";


document
.getElementById("type")
.value=
resource.type||
"other";


document
.getElementById("url")
.value=
resource.url||
"";


document
.getElementById("description")
.value=
resource.description||
"";


document
.getElementById("modal")
.classList
.add("show");

};


/*
========================================
SAVE
========================================
*/

document
.getElementById("resourceForm")
.addEventListener(
"submit",
async e=>{

e.preventDefault();


const data={

courseId:
document
.getElementById("courseId")
.value
.trim(),

name:
document
.getElementById("name")
.value
.trim(),

type:
document
.getElementById("type")
.value,

url:
document
.getElementById("url")
.value
.trim(),

description:
document
.getElementById("description")
.value
.trim()

};


if(
!data.courseId||
!data.name||
!data.url
){

showError(
"Course ID, Resource Name and URL are required."
);

return;

}


try{

if(editingId){

await updateDoc(

doc(
db,
"resources",
editingId
),

{

...data,

updatedAt:
serverTimestamp()

}

);

}else{

await addDoc(

collection(
db,
"resources"
),

{

...data,

createdBy:
"admin",

createdAt:
serverTimestamp()

}

);

}


closeModal();

await loadResources();


}catch(error){

showError(
error.message
);

}

});


/*
========================================
DELETE
========================================
*/

window.removeResource=
async function(id){

const resource=
resources.find(
r=>r.id===id
);


if(
!confirm(
`Delete "${resource?.name||"this resource"}"?`
)
)return;


try{

await deleteDoc(

doc(
db,
"resources",
id
)

);


await loadResources();


}catch(error){

showError(
error.message
);

}

};


/*
========================================
CLOSE MODAL
========================================
*/

window.closeModal=
function(){

document
.getElementById("modal")
.classList
.remove("show");

};


/*
========================================
CLICK OUTSIDE
========================================
*/

document
.getElementById("modal")
.addEventListener(
"click",
e=>{

if(
e.target.id==="modal"
){

closeModal();

}

});


/*
========================================
ESC KEY
========================================
*/

document.addEventListener(
"keydown",
e=>{

if(e.key==="Escape"){

closeModal();

}

});


/*
========================================
ERROR
========================================
*/

function showError(message){

const el=
document
.getElementById("error");


el.textContent=
message;

el.style.display=
"block";


setTimeout(()=>{

el.style.display=
"none";

},6000);

}


/*
========================================
ESCAPE HTML
========================================
*/

function escapeHTML(value){

return String(
value??""
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
========================================
START
========================================
*/

loadResources();

</script>

</body>
</html>
