<style>
*{

body{

button,

header{

.nav{

.logo{

.page-header{

input,

}

.published{

}

.draft{

}

}

.actions{

}

.action{

  padding:8px 10px;

  font-weight:800;
}

.view{

  color:#0369a1;
}

.edit{

}

.publish{

  color:#166534;
}

.delete{

}

.empty{

}

.modal{
  display:none;

  inset:0;
  z-index:9999;

  background:rgba(15,23,42,.65);

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal-box{
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;

  background:#fff;
  border-radius:20px;
  padding:26px;

  position:relative;
}

.close{

  top:14px;
  right:14px;

  width:36px;
  height:36px;

  border:0;
  border-radius:50%;

}

.modal-box h2{

}

.form-group{

}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.form-actions button{
  flex:1;
}

.detail{
  padding:13px 0;
  border-bottom:1px solid #e2e8f0;
}

.detail strong{
  display:block;
  color:#64748b;
  font-size:12px;
  margin-bottom:4px;
}

@media(max-width:900px){

    flex-direction:column;

@media(max-width:500px){

</style>

<body>

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro.firebaseapp.com",

  projectId:
    "let-s-study-pro",

  storageBucket:
    "let-s-study-pro.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   STATE
===================================================== */

let resources = [];

let selectedResource = null;


/* =====================================================
   LOAD RESOURCES
===================================================== */

async function loadResources(){

  const table =
    document.getElementById(
      "resourcesTable"
    );


  table.innerHTML = `

    <tr>

      <td
        colspan="6"
        class="empty">

        Loading resources...

      </td>

    </tr>

  `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "resources"
        )
      );


    resources = [];


    snapshot.forEach(
      item => {

        resources.push({

          id:
            item.id,

          ...item.data()

        });

      }
    );


    updateStatistics();

    applyFilters();

  }catch(error){

    console.error(
      "Resources error:",
      error
    );


    table.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty">

          Failed to load resources.

        </td>

      </tr>

    `;

  }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

  const total =
    resources.length;


  const published =
    resources.filter(
      resource =>
        normalize(
          resource.status
        ) === "published"
    ).length;


  const draft =
    resources.filter(
      resource =>
        normalize(
          resource.status
        ) === "draft"
    ).length;


  const pdf =
    resources.filter(
      resource =>
        normalize(
          resource.type
        ) === "pdf"
    ).length;


  document.getElementById(
    "totalResources"
  ).textContent =
    total;


  document.getElementById(
    "publishedResources"
  ).textContent =
    published;


  document.getElementById(
    "draftResources"
  ).textContent =
    draft;


  document.getElementById(
    "pdfResources"
  ).textContent =
    pdf;

}


/* =====================================================
   FILTERS
===================================================== */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchResource"
      )
      .value
      .trim()
      .toLowerCase();


  const type =
    document
      .getElementById(
        "typeFilter"
      )
      .value;


  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const filtered =
    resources.filter(
      resource => {

        const title =
          String(
            resource.title ||
            ""
          ).toLowerCase();


        const subject =
          String(
            resource.subject ||
            ""
          ).toLowerCase();


        const id =
          String(
            resource.id ||
            ""
          ).toLowerCase();


        const currentType =
          normalize(
            resource.type
          );


        const currentStatus =
          normalize(
            resource.status
          );


        return (

          (
            !search ||
            title.includes(search) ||
            subject.includes(search) ||
            id.includes(search)
          )

          &&

          (
            !type ||
            currentType === type
          )

          &&

          (
            !status ||
            currentStatus === status
          )

        );

      }
    );


  renderResources(
    filtered
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderResources(list){

  const table =
    document.getElementById(
      "resourcesTable"
    );


  if(!list.length){

    table.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty">

          No resources found.

        </td>

      </tr>

    `;

    return;

  }


  table.innerHTML =
    list.map(
      resource => {

        const title =
          resource.title ||
          "Untitled Resource";


        const subject =
          resource.subject ||
          "—";


        const type =
          normalize(
            resource.type
          ) || "document";


        const status =
          normalize(
            resource.status
          ) || "draft";


        const created =
          getDate(
            resource.createdAt
          );


        return `

          <tr>

            <td>

              <strong>
                ${escapeHTML(title)}
              </strong>

            </td>


            <td>
              ${escapeHTML(subject)}
            </td>


            <td>
              ${escapeHTML(type)}
            </td>


            <td>

              <span
                class="badge ${status}">

                ${escapeHTML(status)}

              </span>

            </td>


            <td>
              ${escapeHTML(created)}
            </td>


            <td>

              <div class="actions">

                <button
                  class="action view"
                  onclick="viewResource('${resource.id}')">

                  View

                </button>


                <button
                  class="action edit"
                  onclick="editResource('${resource.id}')">

                  Edit

                </button>


                <button
                  class="action publish"
                  onclick="togglePublish('${resource.id}')">

                  ${
                    status === "published"
                    ? "Unpublish"
                    : "Publish"
                  }

                </button>


                <button
                  class="action delete"
                  onclick="deleteResource('${resource.id}')">

                  Delete

                </button>

              </div>

            </td>

          </tr>

        `;

      }
    ).join("");

}


/* =====================================================
   ADD RESOURCE
===================================================== */

window.openAddModal =
function(){

  selectedResource =
    null;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Add Resource";


  clearForm();


  document.getElementById(
    "resourceModal"
  ).style.display =
    "flex";

};


/* =====================================================
   EDIT RESOURCE
===================================================== */

window.editResource =
function(id){

  const resource =
    resources.find(
      item =>
        item.id === id
    );


  if(!resource){
    return;
  }


  selectedResource =
    resource;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Resource";


  document.getElementById(
    "resourceTitle"
  ).value =
    resource.title || "";


  document.getElementById(
    "resourceSubject"
  ).value =
    resource.subject || "";


  document.getElementById(
    "resourceType"
  ).value =
    normalize(
      resource.type
    ) || "pdf";


  document.getElementById(
    "resourceUrl"
  ).value =
    resource.url || "";


  document.getElementById(
    "resourceDescription"
  ).value =
    resource.description || "";


  document.getElementById(
    "resourceStatus"
  ).value =
    normalize(
      resource.status
    ) || "draft";


  document.getElementById(
    "resourceModal"
  ).style.display =
    "flex";

};


/* =====================================================
   SAVE RESOURCE
===================================================== */

window.saveResource =
async function(){

  const title =
    document
      .getElementById(
        "resourceTitle"
      )
      .value
      .trim();


  const subject =
    document
      .getElementById(
        "resourceSubject"
      )
      .value
      .trim();


  const type =
    document
      .getElementById(
        "resourceType"
      )
      .value;


  const url =
    document
      .getElementById(
        "resourceUrl"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "resourceDescription"
      )
      .value
      .trim();


  const status =
    document
      .getElementById(
        "resourceStatus"
      )
      .value;

    if(!title){

  alert(
    "Please enter resource title."
  );

  return;

}

try{

  const data = {

    title:
      title,

    subject:
      subject,

    type:
      type,

    url:
      url,

    description:
      description,

    status:
      status

  };


  if(selectedResource){

    await updateDoc(

      doc(
        db,
        "resources",
        selectedResource.id
      ),

      data

    );

  }else{

    await addDoc(

      collection(
        db,
        "resources"
      ),

      {

        ...data,

        createdAt:
          serverTimestamp()

      }

    );

  }


  closeResourceModal();

  await loadResources();

  alert(
    "Resource saved successfully."
  );


}catch(error){

  console.error(
    "Save resource error:",
    error
  );

  alert(
    "Failed to save resource."
  );

}

};
