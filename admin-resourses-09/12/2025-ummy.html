<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Resources | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
header{
  background:#111827;
  color:#fff;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10
}
.logo{font-size:20px;font-weight:700}
button{
  border:0;
  cursor:pointer;
  border-radius:8px;
  padding:9px 13px;
  font-weight:600
}
.primary{background:#2563eb;color:white}
.danger{background:#dc2626;color:white}
.secondary{background:#e5e7eb;color:#111827}

main{
  max-width:1250px;
  margin:25px auto;
  padding:0 15px
}

.hero{
  background:white;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 5px 20px #0000000d
}
.hero h1{margin:0 0 8px}
.hero p{margin:0;color:#667085}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:20px
}
.stat{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 5px 20px #0000000d
}
.stat b{
  display:block;
  font-size:24px;
  margin-top:5px
}
.stat span{color:#667085;font-size:13px}

.toolbar{
  background:white;
  padding:15px;
  border-radius:12px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px
}
input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #d0d5dd;
  border-radius:8px;
  font:inherit
}
.search{flex:2;min-width:220px}
.filter{flex:1;min-width:150px}

.table-box{
  background:white;
  border-radius:14px;
  overflow:auto;
  box-shadow:0 5px 20px #0000000d
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:900px
}
th,td{
  padding:13px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:14px
}
th{background:#f8fafc}
.thumb{
  width:55px;
  height:40px;
  object-fit:cover;
  border-radius:6px
}
.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:700
}
.free{background:#dcfce7;color:#166534}
.paid{background:#fee2e2;color:#991b1b}
.pub{background:#dbeafe;color:#1d4ed8}
.draft{background:#f3f4f6;color:#374151}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap
}
.actions button{
  font-size:12px;
  padding:7px 9px
}

.empty{
  text-align:center;
  padding:45px;
  color:#667085
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:50
}
.modal.show{display:flex}
.modal-box{
  background:white;
  width:100%;
  max-width:700px;
  max-height:92vh;
  overflow:auto;
  border-radius:16px;
  padding:22px
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}
.modal-head h2{margin:0}
.close{
  background:#eee;
  font-size:18px
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}
.form-group{margin-bottom:13px}
.form-group.full{grid-column:1/-1}
label{
  display:block;
  font-weight:600;
  margin-bottom:6px;
  font-size:13px
}
.required{color:#dc2626}
.check{
  display:flex;
  gap:8px;
  align-items:center
}
.check input{width:auto}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:15px
}

@media(max-width:800px){
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:550px){
  .stats{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:auto}
}
</style>
</head>

<body>

<header>
  <div class="logo">LetsStudy Pro</div>
  <button class="primary" id="newBtn">+ New Resource</button>
</header>

<main>

<section class="hero">
  <h1>Resources Management</h1>
  <p>Create, manage, publish and organize LetsStudy Pro resources.</p>
</section>

<section class="stats">
  <div class="stat">
    <span>TOTAL</span>
    <b id="total">0</b>
  </div>

  <div class="stat">
    <span>FREE</span>
    <b id="free">0</b>
  </div>

  <div class="stat">
    <span>PAID</span>
    <b id="paid">0</b>
  </div>

  <div class="stat">
    <span>PUBLISHED</span>
    <b id="published">0</b>
  </div>

  <div class="stat">
    <span>FEATURED</span>
    <b id="featured">0</b>
  </div>
</section>

<section class="toolbar">

  <input
    id="search"
    class="search"
    placeholder="Search resources..."
  >

  <select id="category" class="filter">
    <option value="ALL">All Categories</option>
    <option>General</option>
    <option>Biology</option>
    <option>Chemistry</option>
    <option>Physics</option>
    <option>Mathematics</option>
    <option>Geography</option>
    <option>History</option>
    <option>Civics</option>
    <option>English</option>
    <option>Kiswahili</option>
    <option>Business</option>
    <option>Commerce</option>
    <option>Agriculture</option>
    <option>Education</option>
    <option>Computer Science</option>
    <option>Other</option>
  </select>

  <select id="access" class="filter">
    <option value="ALL">All Access</option>
    <option value="FREE">Free</option>
    <option value="PAID">Paid</option>
  </select>

  <select id="status" class="filter">
    <option value="ALL">All Status</option>
    <option value="PUBLISHED">Published</option>

  <button class="secondary" id="reset">Reset</button>

</section>

<section class="table-box">

<table>
<thead>
<tr>
<th>Image</th>
<th>Title</th>
<th>Category</th>
<th>Access</th>
<th>Price</th>
<th>Status</th>
<th>Featured</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="tbody">
<tr>
<td colspan="8" class="empty">
Loading resources...
</td>
</tr>
</tbody>

</table>

</section>

</main>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-head">
<h2 id="modalTitle">New Resource</h2>
<button class="close" id="close">✕</button>
</div>

<form id="form">

<div class="form-grid">

<div class="form-group">
<label>Resource ID <span class="required">*</span></label>
<input id="resourceId" required>
</div>

<div class="form-group">
<label>Title <span class="required">*</span></label>
<input id="title" required>
</div>

<div class="form-group">
<label>Category</label>
<select id="cat">
<option>General</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>Mathematics</option>
<option>Geography</option>
<option>History</option>
<option>Civics</option>
<option>English</option>
<option>Kiswahili</option>
<option>Business</option>
<option>Commerce</option>
<option>Agriculture</option>
<option>Education</option>
<option>Computer Science</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Subject</label>
<input id="subject">
</div>

<div class="form-group">
<label>Level</label>
<select id="level">
<option>Primary</option>
<option>Secondary</option>
<option>Form 1</option>
<option>Form 2</option>
<option>Form 3</option>
<option>Form 4</option>
<option>Form 5</option>

<option>University</option>

<div class="form-group">
<label>Resource Type</label>
<select id="type">
<option>Notes</option>
<option>Past Papers</option>
<option>Solutions</option>
<option>Revision</option>
<option>Book</option>
<option>PDF</option>
<option>Document</option>
<option>Video</option>
<option>Audio</option>
<option>Link</option>
<option>Exam</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Access</label>
<select id="accessInput">
<option value="FREE">Free</option>

<label>Currency</label>
<select id="currency">
<option>TZS</option>

</div>
</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================
   STATE
========================= */

let resources = [];
let editingId = null;


/* =========================
   ELEMENTS
========================= */

const tbody = document.getElementById("tbody");
const modal = document.getElementById("modal");
const form = document.getElementById("form");

const resourceId = document.getElementById("resourceId");
const title = document.getElementById("title");
const cat = document.getElementById("cat");
const subject = document.getElementById("subject");
const level = document.getElementById("level");
const type = document.getElementById("type");
const accessInput = document.getElementById("accessInput");
const price = document.getElementById("price");
const currency = document.getElementById("currency");
const thumbnail = document.getElementById("thumbnail");
const fileUrl = document.getElementById("fileUrl");
const description = document.getElementById("description");
const tags = document.getElementById("tags");
const published = document.getElementById("published");
const isFeatured = document.getElementById("isFeatured");


/* =========================
   LOAD
========================= */

async function loadResources(){

  try{

    const snap =
      await getDocs(
        collection(db,"resources")
      );

    resources = [];

    snap.forEach(docSnap => {

      resources.push({
        id:docSnap.id,
        ...docSnap.data()
      });

    });

    updateStats();
    render();

  }catch(error){

    console.error(error);

    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="empty">
          Unable to load resources.
        </td>
      </tr>
    `;

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  document.getElementById("total").textContent =
    resources.length;

  document.getElementById("free").textContent =
    resources.filter(
      r => String(r.access).toUpperCase() === "FREE"
    ).length;

  document.getElementById("paid").textContent =
    resources.filter(
      r => String(r.access).toUpperCase() === "PAID"
    ).length;

  document.getElementById("published").textContent =
    resources.filter(
      r => r.published === true
    ).length;

  document.getElementById("featured").textContent =
    resources.filter(
      r => r.featured === true
    ).length;

}


/* =========================
   RENDER
========================= */

function render(){

  const q =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const category =
    document.getElementById("category").value;

  const access =
    document.getElementById("access").value;

  const status =
    document.getElementById("status").value;


  const filtered =
    resources.filter(r => {

      const text = `
        ${r.id}
        ${r.title || ""}
        ${r.category || ""}
        ${r.subject || ""}
        ${r.level || ""}
        ${r.resourceType || ""}
        ${r.tags || ""}
      `.toLowerCase();

      if(q && !text.includes(q))
        return false;

      if(
        category !== "ALL" &&
        r.category !== category
      )
        return false;

      if(
        access !== "ALL" &&
        String(r.access).toUpperCase() !== access
      )
        return false;

      if(
        status === "PUBLISHED" &&
        r.published !== true
      )
        return false;

      if(
        status === "DRAFT" &&
        r.published === true
      )
        return false;

      return true;

    });


  if(!filtered.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="empty">
          No resources found.
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML =
    filtered.map(r => {

      const access =
        String(r.access || "FREE").toUpperCase();

      const priceText =
        access === "FREE"
          ? "FREE"
          : `${r.currency || "TZS"} ${Number(r.price || 0).toLocaleString()}`;

      return `

      <tr>

        <td>
          ${
            r.thumbnail
              ? `<img class="thumb"
                   src="${escapeHtml(r.thumbnail)}"
                   alt="">`
              : "—"
          }
        </td>

        <td>
          <strong>${escapeHtml(r.title || r.id)}</strong>
          <br>
          <small>${escapeHtml(r.id)}</small>
        </td>

        <td>
          ${escapeHtml(r.category || "General")}
        </td>

        <td>
          <span class="badge ${access === "FREE" ? "free" : "paid"}">
            ${access}
          </span>
        </td>

        <td>
          ${escapeHtml(priceText)}
        </td>

        <td>
          <span class="badge ${
            r.published ? "pub" : "draft"
          }">
            ${r.published ? "PUBLISHED" : "DRAFT"}
          </span>
        </td>

        <td>
          ${r.featured ? "⭐ Yes" : "No"}
        </td>

        <td>

          <div class="actions">

            <button
              class="secondary"
              data-action="view"
              data-id="${escapeHtml(r.id)}">
              👁 View
            </button>

            <button
              class="primary"
              data-action="edit"
              data-id="${escapeHtml(r.id)}">
              ✏️ Edit
            </button>

            <button
              class="secondary"
              data-action="publish"
              data-id="${escapeHtml(r.id)}">
              ${r.published ? "⏸ Unpublish" : "▶ Publish"}
            </button>

            <button
              class="secondary"
              data-action="featured"
              data-id="${escapeHtml(r.id)}">
              ${r.featured ? "⭐ Unfeature" : "☆ Feature"}
            </button>

            <button
              class="danger"
              data-action="delete"
              data-id="${escapeHtml(r.id)}">
              🗑 Delete
            </button>

          </div>

        </td>

      </tr>

      `;

    }).join("");


  document
    .querySelectorAll("[data-action]")
    .forEach(button => {

      button.addEventListener(
        "click",
        handleAction
      );

    });

}


/* =========================
   ACTIONS
========================= */

async function handleAction(){

  const action =
    this.dataset.action;

  const id =
    this.dataset.id;

  const resource =
    resources.find(
      r => r.id === id
    );

  if(!resource) return;


  if(action === "view"){

    const url =
      resource.fileUrl ||
      resource.url ||
      "";

    if(url)
      window.open(url,"_blank");
    else
      alert("File URL is missing.");

  }


  if(action === "edit"){

    openEdit(resource);

  }


  if(action === "publish"){

    await updateDoc(
      doc(db,"resources",id),
      {
        published:
          !resource.published,
        updatedAt:
          serverTimestamp()
      }
    );

    await loadResources();

  }


  if(action === "featured"){

    await updateDoc(
      doc(db,"resources",id),
      {
        featured:
          !resource.featured,
        updatedAt:
          serverTimestamp()
      }
    );

    await loadResources();

  }


  if(action === "delete"){

    if(
      !confirm(
        `Delete "${resource.title || id}" permanently?`
      )
    ) return;

    await deleteDoc(
      doc(db,"resources",id)
    );

    await loadResources();

  }

}


/* =========================
   NEW
========================= */

function openNew(){

  editingId = null;

  form.reset();

  resourceId.disabled = false;

  published.checked = true;

  isFeatured.checked = false;

  accessInput.value = "FREE";

  price.value = 0;

  currency.value = "TZS";

  document.getElementById("modalTitle")
    .textContent = "Create Resource";

  modal.classList.add("show");

  updatePrice();

}


/* =========================
   EDIT
========================= */

function openEdit(r){

  editingId = r.id;

  resourceId.value =
    r.id;

  resourceId.disabled = true;

  title.value =
    r.title || "";

  cat.value =
    r.category || "General";

  subject.value =
    r.subject || "";

  level.value =
    r.level || "All Levels";

  type.value =
    r.resourceType || "Notes";

  accessInput.value =
    String(r.access || "FREE").toUpperCase();

  price.value =
    r.price || 0;

  currency.value =
    r.currency || "TZS";

  thumbnail.value =
    r.thumbnail || "";

  fileUrl.value =
    r.fileUrl || "";

  description.value =
    r.shortDescription || "";

  tags.value =
    Array.isArray(r.tags)
      ? r.tags.join(", ")
      : (r.tags || "");

  published.checked =
    r.published === true;

  isFeatured.checked =
    r.featured === true;

  document.getElementById("modalTitle")
    .textContent = "Edit Resource";

  modal.classList.add("show");

  updatePrice();

}


/* =========================
   SAVE
========================= */

form.addEventListener(
  "submit",
  async e => {

    e.preventDefault();

    const id =
      resourceId.value.trim();

    if(!id){

      alert("Resource ID is required.");
      return;

    }

    if(!title.value.trim()){

      alert("Title is required.");
      return;

    }

    if(!fileUrl.value.trim()){

      alert("File URL is required.");
      return;

    }


    const access =
      accessInput.value;

    const data = {

      resourceId:id,

      title:title.value.trim(),

      category:
        cat.value,

      subject:
        subject.value.trim(),

      level:
        level.value,

      resourceType:
        type.value,

      access,

      price:
        access === "FREE"
          ? 0
          : Number(price.value || 0),

      currency:
        currency.value,

      thumbnail:
        thumbnail.value.trim(),

      fileUrl:
        fileUrl.value.trim(),

      shortDescription:
        description.value.trim(),

      tags:
        tags.value
          .split(",")
          .map(x => x.trim())
          .filter(Boolean),

      published:
        published.checked,

      featured:
        isFeatured.checked,

            updatedAt:
        serverTimestamp()

    };


    try{

      document.getElementById("save")
        .disabled = true;

      document.getElementById("save")
        .textContent = "Saving...";


      /* =========================
         UPDATE EXISTING RESOURCE
      ========================= */

      if(editingId){

        await updateDoc(
          doc(
            db,
            "resources",
            editingId
          ),
          data
        );

      }


      /* =========================
         CREATE NEW RESOURCE
      ========================= */

      else{

        await setDoc(
          doc(
            db,
            "resources",
            id
          ),
          {
            ...data,

            createdAt:
              serverTimestamp()
          }
        );

      }


      /* =========================
         SUCCESS
      ========================= */

      alert(
        editingId
          ? "Resource updated successfully."
          : "Resource created successfully."
      );


      closeModal();

      await loadResources();


    }catch(error){

      console.error(
        "Save resource error:",
        error
      );

      alert(
        error.message ||
        "Unable to save resource."
      );


    }finally{

      document.getElementById("save")
        .disabled = false;

      document.getElementById("save")
        .textContent = "Save Resource";

    }

  }
);


/* =========================
   PRICE CONTROL
========================= */

function updatePrice(){

  if(accessInput.value === "FREE"){

    price.value = 0;

    price.disabled = true;

  }else{

    price.disabled = false;

  }

}

accessInput.addEventListener(
  "change",
  updatePrice
);


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  modal.classList.remove("show");

  editingId = null;

  form.reset();

  resourceId.disabled = false;

}

document
  .getElementById("close")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("cancel")
  .addEventListener(
    "click",
    closeModal
  );


/* =========================
   NEW RESOURCE
========================= */

document
  .getElementById("newBtn")
  .addEventListener(
    "click",
    openNew
  );


/* =========================
   CLOSE WHEN CLICK OUTSIDE
========================= */

modal.addEventListener(
  "click",
  event => {

    if(event.target === modal){

      closeModal();

    }

  }
);


/* =========================
   SEARCH + FILTERS
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );


document
  .getElementById("category")
  .addEventListener(
    "change",
    render
  );


document
  .getElementById("access")
  .addEventListener(
    "change",
    render
  );


document
  .getElementById("status")
  .addEventListener(
    "change",
    render
  );


/* =========================
   RESET FILTERS
========================= */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    () => {

      document.getElementById("search")
        .value = "";

      document.getElementById("category")
        .value = "ALL";

      document.getElementById("access")
        .value = "ALL";

      document.getElementById("status")
        .value = "ALL";

      render();

    }
  );


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START SYSTEM
========================= */

loadResources();
