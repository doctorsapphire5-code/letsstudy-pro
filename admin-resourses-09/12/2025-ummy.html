<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>
Resources Admin | LetsStudy Pro
</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* ==============================
   HEADER
============================== */

.header{
  height:68px;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.header-btn{
  padding:9px 13px;
  border-radius:8px;
  background:#1f2937;
  color:white;
  border:1px solid #374151;
}

/* ==============================
   LAYOUT
============================== */

.container{
  max-width:1450px;
  margin:auto;
  padding:25px;
}

/* ==============================
   TOP
============================== */

.page-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.page-top h1{
  font-size:28px;
}

.page-top p{
  color:#6b7280;
  font-size:13px;
  margin-top:4px;
}

.primary{
  border:0;
  background:#2563eb;
  color:white;
  padding:11px 17px;
  border-radius:9px;
  font-weight:800;
}

/* ==============================
   STATS
============================== */

.stats{
  display:grid;
  grid-template-columns:
    repeat(5,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:18px;
}

.stat span{
  color:#6b7280;
  font-size:12px;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:5px;
}

/* ==============================
   TOOLBAR
============================== */

.toolbar{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:15px;
  display:grid;
  grid-template-columns:
    2fr 1fr 1fr 1fr auto;
  gap:10px;
  margin-bottom:20px;
}

.toolbar input,
.toolbar select{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
}

.reset{
  border:0;
  background:#f3f4f6;
  border-radius:8px;
  padding:0 15px;
}

/* ==============================
   TABLE
============================== */

.table-wrap{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1000px;
}

th,
td{
  padding:13px;
  border-bottom:1px solid #f0f0f0;
  text-align:left;
  font-size:12px;
}

th{
  background:#f9fafb;
  color:#4b5563;
}

.thumb{
  width:55px;
  height:40px;
  object-fit:cover;
  border-radius:7px;
  background:#e5e7eb;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
}

.free{
  background:#dcfce7;
  color:#166534;
}

.plan{
  background:#ede9fe;
  color:#6d28d9;
}

.paid{
  background:#ffedd5;
  color:#c2410c;
}

.published{
  background:#dcfce7;
  color:#166534;
}

.unpublished{
  background:#fee2e2;
  color:#991b1b;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.action{
  border:0;
  padding:7px 9px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}

.edit{
  background:#dbeafe;
  color:#1d4ed8;
}

.view{
  background:#f3f4f6;
}

.publish{
  background:#dcfce7;
  color:#166534;
}

.delete{
  background:#fee2e2;
  color:#991b1b;
}

/* ==============================
   MODAL
============================== */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:850px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:17px;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  border:0;
  background:#f3f4f6;
  width:34px;
  height:34px;
  border-radius:8px;
}

/* ==============================
   FORM
============================== */

.form-grid{
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:12px;
  font-weight:800;
  color:#374151;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:8px;
  padding:11px;
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.form-footer{
  margin-top:20px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.cancel{
  border:0;
  padding:11px 17px;
  border-radius:8px;
  background:#f3f4f6;
}

.save{
  border:0;
  padding:11px 20px;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:800;
}

/* ==============================
   EMPTY
============================== */

.empty{
  text-align:center;
  padding:50px;
  color:#6b7280;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:1000px){

  .stats{
    grid-template-columns:
      repeat(3,1fr);
  }

  .toolbar{
    grid-template-columns:
      1fr 1fr;
  }

}

@media(max-width:650px){

  .container{
    padding:15px;
  }

  .page-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .stats{
    grid-template-columns:
      1fr 1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<script type="module">

/* ==========================================
   FIREBASE
========================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  deleteDoc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* ==========================================
   CONFIG
========================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


/* ==========================================
   STATE
========================================== */

let resources = [];

let editingId = null;


/* ==========================================
   ELEMENTS
========================================== */

const table =
  document.getElementById(
    "resourceTable"
  );


const modal =
  document.getElementById(
    "modal"
  );


const form =
  document.getElementById(
    "resourceForm"
  );


/* ==========================================
   ESCAPE
========================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ==========================================
   ACCESS
========================================== */

function getAccess(
  resource
){

  if(
    resource.isFree === true ||
    resource.accessType === "free"
  ){

    return "free";

  }


  if(
    resource.accessType === "plan" ||
    resource.planRequired === true
  ){

    return "plan";

  }


  return "paid";

}


/* ==========================================
   LOAD
========================================== */

async function loadResources(){

  try{

    const snap =
      await getDocs(
        collection(
          db,
          "resources"
        )
      );


    resources =
      snap.docs.map(
        item => {

          const data =
            item.data();


          return{

            resourcesId:
              data.resourcesId ||
              item.id,

            ...data

          };

        }
      );


    updateStats();

    buildCategoryFilter();

    render();

  }

  catch(error){

    console.error(
      error
    );


    table.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty"
        >
          Failed to load resources.
        </td>

      </tr>

    `;

  }

}


/* ==========================================
   STATS
========================================== */

function updateStats(){

  document.getElementById(
    "total"
  ).textContent =
    resources.length;


  document.getElementById(
    "free"
  ).textContent =
    resources.filter(
      x =>
        getAccess(x) === "free"
    ).length;


  document.getElementById(
    "plans"
  ).textContent =
    resources.filter(
      x =>
        getAccess(x) === "plan"
    ).length;


  document.getElementById(
    "published"
  ).textContent =
    resources.filter(
      x =>
        x.published !== false
    ).length;


  document.getElementById(
    "featured"
  ).textContent =
    resources.filter(
      x =>
        x.featured === true
    ).length;

}


/* ==========================================
   CATEGORY FILTER
========================================== */

function buildCategoryFilter(){

  const select =
    document.getElementById(
      "category"
    );


  const values =
    [
      ...new Set(
        resources
          .map(
            x =>
              x.category
          )
          .filter(Boolean)
      )
    ];


  select.innerHTML = `

    <option value="">
      All Categories
    </option>

  `;


  values.sort()
    .forEach(
      category => {

        select.innerHTML += `

          <option
            value="${escapeHtml(
              category
            )}"
          >

            ${escapeHtml(
              category
            )}

          </option>

        `;

      }
    );

}


/* ==========================================
   RENDER
========================================== */

function render(){

  const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase();


  const category =
    document.getElementById(
      "category"
    )
    .value;


  const access =
    document.getElementById(
      "access"
    )
    .value;


  const status =
    document.getElementById(
      "status"
    )
    .value;


  const filtered =
    resources.filter(
      resource => {

        const text = `

          ${resource.resourcesId || ""}

          ${resource.title || ""}

          ${resource.description || ""}

          ${resource.category || ""}

          ${resource.subject || ""}

        `.toLowerCase();


        const searchMatch =
          !search ||
          text.includes(
            search
          );


        const categoryMatch =
          !category ||
          resource.category ===
          category;


        const accessMatch =
          !access ||
          getAccess(
            resource
          ) ===
          access;


        const statusMatch =
          !status ||

          (
            status ===
            "published" &&
            resource.published !== false
          )

          ||

          (
            status ===
            "unpublished" &&
            resource.published === false
          );


        return(
          searchMatch &&
          categoryMatch &&
          accessMatch &&
          statusMatch
        );

      }
    );


  if(
    !filtered.length
  ){

    table.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty"
        >
          No resources found.
        </td>

      </tr>

    `;

    return;

  }


  table.innerHTML =
    filtered.map(
      resource => {

        const accessType =
          getAccess(
            resource
          );


        const image =
          resource.thumbnail ||
          "https://via.placeholder.com/100";


        const price =
          accessType === "free"

          ?

          "FREE"

          :

          `${escapeHtml(
            resource.currency ||
            "TZS"
          )}

          ${Number(
            resource.price || 0
          ).toLocaleString()}`;


        return `

          <tr>

            <td>

              <img
                class="thumb"
                src="${escapeHtml(
                  image
                )}"
                alt=""
              >

            </td>


            <td>

              <strong>

                ${escapeHtml(
                  resource.title ||
                  "Untitled"
                )}

              </strong>

              <br>

              <small>

                ${escapeHtml(
                  resource.resourcesId
                )}

              </small>

            </td>


            <td>

              ${escapeHtml(
                resource.category ||
                "General"
              )}

            </td>


            <td>

              <span
                class="
                  badge
                  ${accessType}
                "
              >

                ${accessType.toUpperCase()}

              </span>

            </td>


            <td>

              ${price}

            </td>


            <td>

              <span
  class="
    badge
    ${accessType}
  "
>

  ${accessType.toUpperCase()}

</span>

</td>


<td>

  ${
    accessType === "free"

    ? "FREE"

    : `${escapeHtml(
        resource.currency ||
        "TZS"
      )}

      ${Number(
        resource.price || 0
      ).toLocaleString()}`
  }

</td>


<td>

  <span
    class="
      badge
      ${
        resource.published !== false
        ? "published"
        : "unpublished"
      }
  "
  >

    ${
      resource.published !== false
      ? "PUBLISHED"
      : "UNPUBLISHED"
    }

  </span>

</td>


<td>

  ${
    resource.featured === true
    ? "⭐ Yes"
    : "No"
  }

</td>


<td>

  <div class="actions">


    <!-- VIEW -->

    <button
      type="button"
      class="action view"
      data-action="view"
      data-id="${escapeHtml(
        resource.resourcesId
      )}"
    >

      👁 View

    </button>


    <!-- EDIT -->

    <button
      type="button"
      class="action edit"
      data-action="edit"
      data-id="${escapeHtml(
        resource.resourcesId
      )}"
    >

      ✏️ Edit

    </button>


    <!-- PUBLISH -->

    <button
      type="button"
      class="action publish"
      data-action="publish"
      data-id="${escapeHtml(
        resource.resourcesId
      )}"
    >

      ${
        resource.published !== false
        ? "⏸ Unpublish"
        : "▶ Publish"
      }

    </button>


    <!-- DELETE -->

    <button
      type="button"
      class="action delete"
      data-action="delete"
      data-id="${escapeHtml(
        resource.resourcesId
      )}"
    >

      🗑 Delete

    </button>


  </div>

</td>

</tr>

`;

      }
    )
    .join("");

}

/* ==========================================
   EDIT RESOURCE
========================================== */

function editResource(
  resourcesId
){

  const resource =
    resources.find(
      item =>
        item.resourcesId ===
        resourcesId
    );


  if(
    !resource
  ){

    return;

  }


  editingId =
    resourcesId;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Resource";


  const idInput =
    document.getElementById(
      "resourcesId"
    );


  idInput.value =
    resource.resourcesId ||
    resourcesId;


  idInput.readOnly =
    true;


  document.getElementById(
    "title"
  ).value =
    resource.title ||
    "";


  document.getElementById(
    "categoryInput"
  ).value =
    resource.category ||
    "General";


  document.getElementById(
    "subject"
  ).value =
    resource.subject ||
    "";


  document.getElementById(
    "level"
  ).value =
    resource.level ||
    "";


  document.getElementById(
    "type"
  ).value =
    resource.type ||
    "Notes";


  document.getElementById(
    "accessInput"
  ).value =
    getAccess(
      resource
    );


  document.getElementById(
    "price"
  ).value =
    resource.price ||
    0;


  document.getElementById(
    "currency"
  ).value =
    resource.currency ||
    "TZS";


  document.getElementById(
    "thumbnail"
  ).value =
    resource.thumbnail ||
    "";


  document.getElementById(
    "fileUrl"
  ).value =
    resource.fileUrl ||
    "";


  document.getElementById(
    "shortDescription"
  ).value =
    resource.shortDescription ||
    resource.description ||
    "";


  document.getElementById(
    "tags"
  ).value =

    Array.isArray(
      resource.tags
    )

    ? resource.tags.join(
        ", "
      )

    : resource.tags ||
      "";


  document.getElementById(
    "published"
  ).value =

    resource.published !== false

    ? "true"

    : "false";


  document.getElementById(
    "featuredInput"
  ).value =

    resource.featured === true

    ? "true"

    : "false";


  modal.classList.add(
    "active"
  );

}


/* ==========================================
   SAVE RESOURCE
========================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const resourcesId =
      document.getElementById(
        "resourcesId"
      )
      .value
      .trim();


    const title =
      document.getElementById(
        "title"
      )
      .value
      .trim();


    if(
      !resourcesId
    ){

      alert(
        "Please enter resourcesId."
      );

      return;

    }


    if(
      !title
    ){

      alert(
        "Please enter resource title."
      );

      return;

    }


    const accessType =
      document.getElementById(
        "accessInput"
      ).value;


    const data = {

      resourcesId,

      title,


      category:
        document.getElementById(
          "categoryInput"
        ).value,


      subject:
        document.getElementById(
          "subject"
        ).value.trim(),


      level:
        document.getElementById(
          "level"
        ).value,


      type:
        document.getElementById(
          "type"
        ).value,


      accessType,


      isFree:
        accessType === "free",


      planRequired:
        accessType === "plan",


      price:
        Number(
          document.getElementById(
            "price"
          ).value || 0
        ),


      currency:
        document.getElementById(
          "currency"
        ).value,


      thumbnail:
        document.getElementById(
          "thumbnail"
        ).value.trim(),


      fileUrl:
        document.getElementById(
          "fileUrl"
        ).value.trim(),


      shortDescription:
        document.getElementById(
          "shortDescription"
        ).value.trim(),


      tags:
        document.getElementById(
          "tags"
        ).value
        .split(",")
        .map(
          tag =>
            tag.trim()
        )
        .filter(Boolean),


      published:
        document.getElementById(
          "published"
        ).value === "true",


      featured:
        document.getElementById(
          "featuredInput"
        ).value === "true",


      updatedAt:
        new Date()

    };


    try{

      await setDoc(

        doc(
          db,
          "resources",
          resourcesId
        ),

        data,

        {
          merge: true
        }

      );


      alert(
        "Resource saved successfully."
      );


      closeModal();


      document.getElementById(
        "resourcesId"
      ).readOnly = false;


      await loadResources();

    }

    catch(error){

      console.error(
        error
      );


      alert(
        "Failed to save resource."
      );

    }

  }
);


/* ==========================================
   TABLE ACTIONS
========================================== */

document.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "[data-action]"
      );


    if(
      !button
    ){

      return;

    }


    const action =
      button.dataset.action;


    const resourcesId =
      button.dataset.id;


    if(
      !resourcesId
    ){

      return;

    }


    const resource =
      resources.find(
        item =>
          item.resourcesId ===
          resourcesId
      );


    if(
      !resource
    ){

      return;

    }


    /* ============================
       VIEW
    ============================ */

    if(
      action === "view"
    ){

      window.location.href =
        `resources-details.html?resourcesId=${encodeURIComponent(
          resourcesId
        )}`;

      return;

    }


    /* ============================
       EDIT
    ============================ */

    if(
      action === "edit"
    ){

      editResource(
        resourcesId
      );

      return;

    }


    /* ============================
       PUBLISH / UNPUBLISH
    ============================ */

    if(
      action === "publish"
    ){

      try{

        await updateDoc(

          doc(
            db,
            "resources",
            resourcesId
          ),

          {

            published:
              resource.published ===
              false
              ? true
              : false,

            updatedAt:
              new Date()

          }

        );


        await loadResources();

      }

      catch(error){

        console.error(
          error
        );


        alert(
          "Failed to update resource status."
        );

      }

      return;

    }


    /* ============================
       DELETE
    ============================ */

    if(
      action === "delete"
    ){

      const confirmDelete =
        confirm(
          `Delete "${resource.title || resourcesId}"?`
        );


      if(
        !confirmDelete
      ){

        return;

      }


      try{

        await deleteDoc(

          doc(
            db,
            "resources",
            resourcesId
          )

        );


        await loadResources();

      }

      catch(error){

        console.error(
          error
        );


        alert(
          "Failed to delete resource."
        );

      }

    }

  }
);
