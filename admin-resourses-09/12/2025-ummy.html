<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Resources | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:#111827;
 color:#fff;
 padding:16px 5%;
 font-weight:700
}
main{
 max-width:1100px;
 margin:auto;
 padding:20px
}
.card,.resource{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:16px;
 margin-bottom:15px
}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin-bottom:15px
}
.stat{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:10px;
 padding:15px
}
.num{
 font-size:25px;
 font-weight:700;
 margin-top:5px
}
.form{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.full{grid-column:1/-1}
label{
 display:block;
 font-size:13px;
 font-weight:700;
 margin-bottom:4px
}
input,select,textarea{
 width:100%;
 padding:10px;
 border:1px solid #d1d5db;
 border-radius:7px;
 font-size:14px
}
textarea{min-height:100px}
button{
 border:0;
 border-radius:7px;
 padding:9px 12px;
 cursor:pointer
}
.blue{background:#2563eb;color:#fff}
.green{background:#16a34a;color:#fff}
.red{background:#dc2626;color:#fff}
.orange{background:#f59e0b;color:#fff}
.gray{background:#e5e7eb;color:#111827}
.toolbar{
 display:grid;
 grid-template-columns:2fr 1fr 1fr;
 gap:8px
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}
.resource{
 margin:0
}
.resource img{
 width:100%;
 height:160px;
 object-fit:cover;
 border-radius:8px;
 margin-bottom:10px
}
.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 margin:3px
}
.published{
 background:#dcfce7;
 color:#166534
}
.draft{
 background:#e5e7eb;
 color:#374151
}
.actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin-top:12px
}
a{text-decoration:none}
@media(max-width:750px){
 .stats,.grid{grid-template-columns:1fr 1fr}
 .form,.toolbar{grid-template-columns:1fr}
 .full{grid-column:auto}
}
@media(max-width:450px){
 .stats,.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
📚 LetsStudy Pro — Admin Resources
</header>

<main>

<h1>Resource Management</h1>

<div class="stats">

<div class="stat">
Total Resources
<div class="num" id="total">0</div>
</div>

<div class="stat">
Published
<div class="num" id="published">0</div>
</div>

<div class="stat">
Drafts
<div class="num" id="drafts">0</div>
</div>

<div class="stat">
Downloads
<div class="num" id="downloads">0</div>
</div>

</div>


<!-- ADD / EDIT -->

<div class="card">

<h2>➕ Add / Edit Resource</h2>

<form id="resourceForm">

<input type="hidden" id="resourceId">

<div class="form">

<div class="full">
<label>Resource Title *</label>
<input id="title"
required
placeholder="A-Level Biology Revision Notes">
</div>

<div>
<label>Category *</label>
<select id="category" required>
<option value="">Select Category</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>Mathematics</option>
<option>Geography</option>
<option>History</option>
<option>English</option>
<option>Computer Science</option>
<option>Business</option>
<option>Other</option>
</select>
</div>

<div>
<label>Resource Type *</label>
<select id="type" required>
<option value="pdf">PDF</option>
<option value="video">Video</option>
<option value="document">Document</option>
<option value="past-paper">Past Paper</option>
<option value="notes">Notes</option>
<option value="ebook">E-Book</option>
<option value="link">External Link</option>
</select>
</div>

<div>
<label>Education Level</label>
<select id="level">
<option>O-Level</option>
<option>A-Level</option>
<option>University</option>
<option>Professional</option>
<option>All Levels</option>
</select>
</div>

<div>
<label>Form / Class</label>
<input id="form"
placeholder="Form 4 / Form 6">
</div>

<div>
<label>Subject</label>
<input id="subject"
placeholder="Biology">
</div>

<div>
<label>File Size</label>
<input id="size"
placeholder="5 MB">
</div>

<div>
<label>Status</label>
<select id="status">
<option value="draft">Draft</option>
<option value="published">Published</option>
</select>
</div>

<div class="full">
<label>File / Download URL *</label>
<input id="fileUrl"
type="url"
required
placeholder="https://...">
</div>

<div class="full">
<label>Thumbnail URL</label>
<input id="thumbnail"
type="url"
placeholder="https://...">
</div>

<div class="full">
<label>Description</label>
<textarea id="description"
placeholder="Describe this resource..."></textarea>
</div>

<div class="full">
<label>Tags</label>
<input id="tags"
placeholder="biology, revision, form 6, notes">
</div>

</div>

<br>

<button class="blue">
Save Resource
</button>

<button
type="button"
class="gray"
onclick="clearForm()">
Clear
</button>

</form>

</div>


<!-- SEARCH -->

<div class="card">

<h2>🔎 Resources</h2>

<div class="toolbar">

<input id="search"
placeholder="Search resources...">

<select id="filterCategory">
<option value="">All Categories</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>Mathematics</option>
<option>Geography</option>
<option>History</option>
<option>English</option>
<option>Computer Science</option>
<option>Business</option>
<option>Other</option>
</select>

<select id="filterStatus">
<option value="">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>

</div>

</div>


<div id="resources" class="grid">
Loading...
</div>

</main>


<script type="module">

import{
 initializeApp
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 serverTimestamp
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

let resources=[];
let editing=null;

const $=id=>
document.getElementById(id);


/* SAFE TEXT */

function clean(x){

return String(x??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* LOAD */

async function loadResources(){

const snap=await getDocs(
collection(db,"resources")
);

resources=snap.docs.map(d=>({

id:d.id,
...d.data()

}));

stats();
render();

}


/* STATS */

function stats(){

$("total").textContent=
resources.length;

$("published").textContent=
resources.filter(
r=>r.status==="published"
).length;

$("drafts").textContent=
resources.filter(
r=>r.status!=="published"
).length;

$("downloads").textContent=
resources.reduce(
(sum,r)=>sum+Number(r.downloads||0),
0
);

}


/* RENDER */

function render(){

const q=
$("search").value
.toLowerCase()
.trim();

const category=
$("filterCategory").value;

const status=
$("filterStatus").value;


const data=resources.filter(r=>{

const text=[

r.title,
r.description,
r.category,
r.subject,
r.form,
r.type,
(r.tags||[]).join(" ")

].join(" ").toLowerCase();


return(

(!q||text.includes(q))&&
(!category||r.category===category)&&
(!status||r.status===status)

);

});


if(!data.length){

$("resources").innerHTML=
"<div class='card'>No resources found.</div>";

return;

}


$("resources").innerHTML=
data.map(r=>`

<div class="resource">

${
r.thumbnail
?
`<img
src="${clean(r.thumbnail)}"
onerror="this.style.display='none'">`
:""
}

<h3>
📚 ${clean(r.title)}
</h3>

<p>
<b>Category:</b>
${clean(r.category||"")}
</p>

<p>
<b>Type:</b>
${clean(r.type||"")}
</p>

<p>
<b>Level:</b>
${clean(r.level||"")}
</p>

<p>
<b>Subject:</b>
${clean(r.subject||"")}
</p>

<span class="badge ${
r.status==="published"
?"published"
:"draft"
}">
${clean(r.status||"draft")}
</span>

<p>
${clean(r.description||"")}
</p>

<p>
⬇ Downloads:
<b>${Number(r.downloads||0)}</b>
&nbsp;
👁 Views:
<b>${Number(r.views||0)}</b>
</p>

<div class="actions">

${
r.fileUrl
?
`<a
href="${clean(r.fileUrl)}"
target="_blank">
<button class="green">
📥 Open
</button>
</a>`
:""
}

<button
class="gray"
onclick="editResource('${r.id}')">
✏ Edit
</button>

<button
class="orange"
onclick="togglePublish('${r.id}')">
${r.status==="published"
?"Unpublish"
:"Publish"}
</button>

<button
class="blue"
onclick="addDownload('${r.id}')">
⬇ +1 Download
</button>

<button
class="red"
onclick="deleteResource('${r.id}')">
🗑 Delete
</button>

</div>

</div>

`).join("");

}


/* SAVE */

$("resourceForm").onsubmit=async e=>{

e.preventDefault();

const data={

title:
$("title").value.trim(),

description:
$("description").value.trim(),

category:
$("category").value,

type:
$("type").value,

level:
$("level").value,

form:
$("form").value.trim(),

subject:
$("subject").value.trim(),

fileUrl:
$("fileUrl").value.trim(),

thumbnail:
$("thumbnail").value.trim(),

size:
$("size").value.trim(),

tags:
$("tags").value
.split(",")
.map(x=>x.trim())
.filter(Boolean),

status:
$("status").value,

updatedAt:
serverTimestamp()

};


try{

if(editing){

await updateDoc(
doc(db,"resources",editing),
data
);

alert("Resource updated.");

}else{

await addDoc(
collection(db,"resources"),
{
...data,
downloads:0,
views:0,
createdAt:
serverTimestamp()
}
);

alert("Resource added.");

}

clearForm();

await loadResources();

}catch(error){

alert(error.message);

}

};


/* EDIT */

window.editResource=id=>{

const r=
resources.find(x=>x.id===id);

if(!r)return;

editing=id;

$("resourceId").value=id;

$("title").value=
r.title||"";

$("category").value=
r.category||"";

$("type").value=
r.type||"pdf";

$("level").value=
r.level||"All Levels";

$("form").value=
r.form||"";

$("subject").value=
r.subject||"";

$("fileUrl").value=
r.fileUrl||"";

$("thumbnail").value=
r.thumbnail||"";

$("size").value=
r.size||"";

$("description").value=
r.description||"";

$("tags").value=
(r.tags||[]).join(", ");

$("status").value=
r.status||"draft";

window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* CLEAR */

window.clearForm=()=>{

editing=null;

$("resourceForm").reset();

$("resourceId").value="";

};


/* DELETE */

window.deleteResource=async id=>{

const r=
resources.find(x=>x.id===id);

if(!confirm(
`Delete "${r?.title||"this resource"}"?`
))return;

await deleteDoc(
doc(db,"resources",id)
);

await loadResources();

};


/* PUBLISH */

window.togglePublish=async id=>{

const r=
resources.find(x=>x.id===id);

if(!r)return;

await updateDoc(
doc(db,"resources",id),
{
status:
r.status==="published"
?"draft"
:"published",

updatedAt:
serverTimestamp()
}
);

await loadResources();

};


/* DOWNLOAD COUNTER */

window.addDownload=async id=>{

const r=
resources.find(x=>x.id===id);

if(!r)return;

await updateDoc(
doc(db,"resources",id),
{
downloads:
Number(r.downloads||0)+1,

updatedAt:
serverTimestamp()
}
);

await loadResources();

};


/* FILTERS */

$("search").oninput=render;

$("filterCategory").onchange=render;

$("filterStatus").onchange=render;


/* START */

loadResources();

</script>

</body>
</html>
