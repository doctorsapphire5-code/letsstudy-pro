<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Resources | LetsStudy Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:9px;padding:9px 12px;cursor:pointer}
header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:10}
header h1{flex:1;font-size:18px;margin:0}
main{max-width:1250px;margin:auto;padding:18px}
.back{background:#eef2ff;color:#1d4ed8}.primary{background:#2563eb;color:#fff}
.danger{background:#fee2e2;color:#b91c1c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card,.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px}
.stat span{font-size:11px;color:#64748b}.stat b{display:block;font-size:23px;margin-top:5px}
.toolbar{display:flex;gap:8px;margin-bottom:14px}
.toolbar input{max-width:450px}
input,select,textarea{width:100%;padding:10px;border:1px solid #dbe1e8;border-radius:9px;background:#fff;outline:none}
.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4}
th{font-size:10px;color:#64748b}
.badge{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:bold}
.published{background:#dcfce7;color:#15803d}.draft{background:#e5e7eb;color:#475569}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:50}
.modal.show{display:flex}.box{width:100%;max-width:700px;max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}
.head{display:flex;align-items:center;margin-bottom:16px}.head h2{flex:1;margin:0;font-size:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:5px}
.full{grid-column:1/-1}.check{display:flex;gap:8px;align-items:center;font-size:12px}.check input{width:auto}
.empty{text-align:center;padding:35px;color:#64748b}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:100;font-size:12px}
.toast.show{display:block}
@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-wrap:wrap}}
</style>
</head><body><header>
<button class="back" onclick="location.href='admin-dashboard.html'">←</button>
<h1>📚 Resources Management</h1>
<button class="primary" onclick="openCreate()">+ Add Resource</button>
</header><main><section class="stats">
<div class="stat"><span>Total Resources</span><b id="total">0</b></div>
<div class="stat"><span>Published</span><b id="published">0</b></div>
<div class="stat"><span>PDF / Notes</span><b id="documents">0</b></div>
<div class="stat"><span>Downloads</span><b id="downloads">0</b></div>
</section><section class="card"><div class="toolbar"><input id="search"
placeholder="Search resources..."
oninput="render()">

<select id="typeFilter" onchange="render()">
<option value="all">All Types</option>
<option value="pdf">PDF</option>
<option value="note">Notes</option>
<option value="past-paper">Past Paper</option>
<option value="video">Video</option>
<option value="link">External Link</option>
<option value="document">Document</option>
</select><select id="statusFilter" onchange="render()">
<option value="all">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
</select></div><div class="table">
<table>
<thead>
<tr>
<th>Resource</th>
<th>Type</th>
<th>Subject</th>
<th>Level</th>
<th>Downloads</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="resourceList"></tbody>
</table>
</div></section>
</main><!-- MODAL --><div id="modal" class="modal">
<div class="box"><div class="head">
<h2 id="modalTitle">Add Resource</h2>
<button onclick="closeModal()">✕</button>
</div><form id="resourceForm"><div class="form"><div class="field full">
<label>Resource Title</label>
<input id="title" required placeholder="Physics Form 5 Notes">
</div><div class="field">
<label>Type</label>
<select id="type">
<option value="pdf">PDF</option>
<option value="note">Notes</option>
<option value="past-paper">Past Paper</option>
<option value="video">Video</option>
<option value="link">External Link</option>
<option value="document">Document</option>
</select>
</div><div class="field">
<label>Subject</label>
<select id="subject">
<option>Physics</option>
<option>Chemistry</option>
<option>Mathematics</option>
<option>Biology</option>
<option>Geography</option>
<option>English</option>
<option>Computer Science</option>
<option>Business</option>
<option>Other</option>
</select>
</div><div class="field">
<label>Level</label>
<select id="level">
<option>Form 1</option>
<option>Form 2</option>
<option>Form 3</option>
<option>Form 4</option>
<option>Form 5</option>
<option>Form 6</option>
<option>University</option>
<option>Professional</option>
</select>
</div><div class="field">
<label>Category</label>
<input id="category" placeholder="Revision, NECTA, etc.">
</div><div class="field">
<label>Status</label>
<select id="status">
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>
</div><div class="field full">
<label>Resource URL / Download URL</label>
<input id="url" type="url" required placeholder="https://...">
</div><div class="field">
<label>Thumbnail URL</label>
<input id="thumbnail" type="url" placeholder="https://...">
</div><div class="field">
<label>File Size</label>
<input id="fileSize" placeholder="2.5 MB">
</div><div class="field">
<label>Author / Creator</label>
<input id="author" placeholder="LetsStudy Pro">
</div><div class="field">
<label>Tags</label>
<input id="tags" placeholder="physics, form5, mechanics">
</div><div class="field full">
<label>Description</label>
<textarea id="description" rows="4"
placeholder="Describe this resource..."></textarea>
</div><div class="field">
<label class="check">
<input id="featured" type="checkbox">
Featured Resource
</label>
</div><div class="field">
<label class="check">
<input id="premium" type="checkbox">
Premium Only
</label>
</div></div><br><button class="primary" type="submit">💾 Save Resource</button>

</form>
</div>
</div><div id="toast" class="toast"></div><script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{getAuth,onAuthStateChanged}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
doc,
getDoc,
getDocs,
addDoc,
updateDoc,
deleteDoc,
serverTimestamp
}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE CONFIG
========================================= */

const firebaseConfig={
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_PROJECT.firebasestorage.app",
messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let resources=[];
let editingId=null;
let admin=null;


/* =========================================
 ADMIN AUTH
========================================= */

onAuthStateChanged(auth,async user=>{

if(!user){
location.href="login.html";
return;
}

try{

const snap=await getDoc(
doc(db,"users",user.uid)
);

if(!snap.exists()||snap.data().role!=="admin"){

alert("Access denied");
location.href="dashboard.html";
return;

}

admin=user;
loadResources();

}catch(error){

console.error(error);
alert("Unable to verify admin.");

}

});


/* =========================================
 LOAD
========================================= */

async function loadResources(){

try{

const snap=await getDocs(
collection(db,"resources")
);

resources=snap.docs.map(d=>({
id:d.id,
...d.data()
}));

updateStats();
render();

}catch(error){

console.error(error);
toast("Unable to load resources.");

}

}


/* =========================================
 STATS
========================================= */

function updateStats(){

document.getElementById("total").textContent=
resources.length;

document.getElementById("published").textContent=
resources.filter(x=>x.status==="published").length;

document.getElementById("documents").textContent=
resources.filter(x=>
["pdf","note","past-paper","document"]
.includes(x.type)
).length;

document.getElementById("downloads").textContent=
resources.reduce(
(a,x)=>a+Number(x.downloads||0),0
);

}


/* =========================================
 RENDER
========================================= */

window.render=function(){

const search=document.getElementById("search")
.value.toLowerCase().trim();

const type=document.getElementById("typeFilter").value;
const status=document.getElementById("statusFilter").value;

const data=resources.filter(x=>{

const text=
`${x.title||""} ${x.subject||""} ${x.category||""} ${x.tags||""}`
.toLowerCase();

return(
text.includes(search)&&
(type==="all"||x.type===type)&&
(status==="all"||x.status===status)
);

});

const list=document.getElementById("resourceList");

if(!data.length){

list.innerHTML=`
<tr>
<td colspan="7">
<div class="empty">
No resources found.
</div>
</td>
</tr>`;

return;
}

list.innerHTML=data.map(x=>`

<tr>

<td>
<strong>${esc(x.title||"Untitled")}</strong>
${x.featured?`<br><small>⭐ Featured</small>`:""}
${x.premium?`<br><small>🔒 Premium</small>`:""}
</td>

<td>${esc(x.type||"")}</td>

<td>${esc(x.subject||"-")}</td>

<td>${esc(x.level||"-")}</td>

<td>${Number(x.downloads||0).toLocaleString()}</td>

<td>
<span class="badge ${
x.status==="published"?"published":"draft"
}">
${esc(x.status||"draft")}
</span>
</td>

<td>

<button class="back"
onclick="editResource('${x.id}')">
Edit
</button>

<button class="danger"
onclick="deleteResource('${x.id}')">
Delete
</button>

</td>

</tr>

`).join("");

};


/* =========================================
 CREATE
========================================= */

window.openCreate=function(){

editingId=null;

document.getElementById("modalTitle")
.textContent="Add Resource";

document.getElementById("resourceForm").reset();

document.getElementById("status").value="published";

document.getElementById("modal")
.classList.add("show");

};


/* =========================================
 EDIT
========================================= */

window.editResource=function(id){

const x=resources.find(r=>r.id===id);
if(!x)return;

editingId=id;

document.getElementById("modalTitle")
.textContent="Edit Resource";

set("title",x.title||"");
set("type",x.type||"pdf");
set("subject",x.subject||"Physics");
set("level",x.level||"Form 1");
set("category",x.category||"");
set("status",x.status||"draft");
set("url",x.url||"");
set("thumbnail",x.thumbnail||"");
set("fileSize",x.fileSize||"");
set("author",x.author||"");
set("tags",x.tags||"");
set("description",x.description||"");

document.getElementById("featured").checked=
x.featured===true;

document.getElementById("premium").checked=
x.premium===true;

document.getElementById("modal")
.classList.add("show");

};


/* =========================================
 SAVE
========================================= */

document.getElementById("resourceForm")
.addEventListener("submit",async e=>{

e.preventDefault();

const old=editingId
?resources.find(x=>x.id===editingId)
:null;

const data={

title:get("title"),
type:get("type"),
subject:get("subject"),
level:get("level"),
category:get("category"),
status:get("status"),
url:get("url"),
thumbnail:get("thumbnail"),
fileSize:get("fileSize"),
author:get("author"),
tags:get("tags"),
description:get("description"),

featured:
document.getElementById("featured").checked,

premium:
document.getElementById("premium").checked,

downloads:
old?.downloads||0,

updatedAt:serverTimestamp()

};

try{

if(editingId){

await updateDoc(
doc(db,"resources",editingId),
data
);

toast("Resource updated.");

}else{

await addDoc(
collection(db,"resources"),
{
...data,
createdBy:admin.uid,
createdAt:serverTimestamp()
}
);

toast("Resource created.");

}

closeModal();
await loadResources();

}catch(error){

console.error(error);
toast("Unable to save resource.");

}

});


/* =========================================
 DELETE
========================================= */

window.deleteResource=async function(id){

const x=resources.find(r=>r.id===id);

if(!x)return;

if(!confirm(
`Delete "${x.title}"?`
))return;

try{

await deleteDoc(
doc(db,"resources",id)
);

toast("Resource deleted.");
await loadResources();

}catch(error){

console.error(error);
toast("Delete failed.");

}

};


/* =========================================
 CLOSE
========================================= */

window.closeModal=function(){

document.getElementById("modal")
.classList.remove("show");

editingId=null;

};


/* =========================================
 HELPERS
========================================= */

function get(id){
return document.getElementById(id).value.trim();
}

function set(id,value){
document.getElementById(id).value=value;
}

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function toast(text){

const el=document.getElementById("toast");

el.textContent=text;
el.classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>{
el.classList.remove("show");
},3000);

}

</script></body>
</html>
