<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Resources | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
header{
  background:#111827;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{margin:0;font-size:21px}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px
}
.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 18px #0000000d
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #d9dee8;
  border-radius:9px;
  margin-top:6px;
}
textarea{min-height:100px;resize:vertical}
label{font-weight:600;font-size:13px}
button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:600;
}
.primary{background:#2563eb;color:white}
.danger{background:#dc2626;color:white}
.secondary{background:#e5e7eb;color:#111827}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px
}
.toolbar input{margin:0;flex:1;min-width:220px}
.resource{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}
.resource h3{margin:0 0 7px}
.meta{
  color:#6b7280;
  font-size:13px;
  margin:5px 0
}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#eef2ff;
  color:#3730a3;
  font-size:12px;
}
.empty{
  text-align:center;
  padding:40px;
  color:#6b7280
}
#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:white;
  padding:13px 18px;
  border-radius:10px;
  display:none;
  z-index:99
}
#loading{text-align:center;padding:25px}
</style>
</head>

<body>

<header>
  <h1>📚 LetsStudy Pro — Admin Resources</h1>
  <span id="count">0 Resources</span>
</header>

<div class="container">

  <!-- FORM -->
  <div class="card">
    <h2 id="formTitle">Add Resource</h2>

    <form id="resourceForm">

      <input type="hidden" id="resourceId">

      <div class="grid">

        <div>
          <label>Title</label>
          <input id="title" required>
        </div>

        <div>
          <label>Category</label>
          <select id="category">
            <option>Notes</option>
            <option>Past Papers</option>
            <option>Revision</option>
            <option>Books</option>
            <option>Videos</option>
            <option>Guides</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label>Type</label>
          <select id="type">
            <option>PDF</option>
            <option>Video</option>
            <option>Document</option>
            <option>Link</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label>Thumbnail URL</label>
          <input id="thumbnail">
        </div>

        <div>
          <label>File / Resource URL</label>
          <input id="fileUrl" required>
        </div>

        <div>
          <label>Size</label>
          <input id="size" placeholder="Example: 2.5 MB">
        </div>

      </div>

      <label>Description</label>
      <textarea id="description"></textarea>

      <div class="actions">
        <button class="primary" type="submit">
          Save Resource
        </button>

        <button
          class="secondary"
          type="button"
          onclick="resetForm()">
          Clear
        </button>
      </div>

    </form>
  </div>

  <!-- SEARCH -->
  <div class="card">

    <div class="toolbar">
      <input
        id="search"
        placeholder="Search resources..."
        oninput="renderResources()">

      <select id="filterCategory"
              onchange="renderResources()">
        <option value="">All Categories</option>
        <option>Notes</option>
        <option>Past Papers</option>
        <option>Revision</option>
        <option>Books</option>
        <option>Videos</option>
        <option>Guides</option>
        <option>Other</option>
      </select>
    </div>

    <div id="loading">
      Loading resources...
    </div>

    <div id="resources"></div>

  </div>

</div>

<div id="toast"></div>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================
   FIREBASE
===================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =====================================
   STATE
===================================== */

let resources = [];


/* =====================================
   HELPERS
===================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;
  toast.style.display = "block";

  setTimeout(() => {
    toast.style.display = "none";
  },2500);

}


function resetForm(){

  document.getElementById(
    "resourceForm"
  ).reset();

  document.getElementById(
    "resourceId"
  ).value = "";

  document.getElementById(
    "formTitle"
  ).textContent = "Add Resource";

}


window.resetForm = resetForm;


/* =====================================
   LOAD RESOURCES
===================================== */

async function loadResources(){

  const loading =
    document.getElementById("loading");

  try{

    const snapshot =
      await getDocs(
        collection(db,"resources")
      );

    resources = [];

    snapshot.forEach(item => {

      resources.push({
        id:item.id,
        ...item.data()
      });

    });

    resources.sort((a,b) => {

      const aTime =
        a.createdAt?.seconds || 0;

      const bTime =
        b.createdAt?.seconds || 0;

      return bTime - aTime;

    });

    loading.style.display = "none";

    renderResources();

  }
  catch(error){

    console.error(error);

    loading.innerHTML =
      "Unable to load resources.";

    showToast(
      "Failed to load resources"
    );

  }

}


/* =====================================
   RENDER
===================================== */

window.renderResources =
function(){

  const container =
    document.getElementById(
      "resources"
    );

  const search =
    document.getElementById(
      "search"
    ).value
     .toLowerCase()
     .trim();

  const category =
    document.getElementById(
      "filterCategory"
    ).value;

  const filtered =
    resources.filter(resource => {

      const text =
        (
          resource.title || ""
        ).toLowerCase();

      const matchesSearch =
        !search ||
        text.includes(search);

      const matchesCategory =
        !category ||
        resource.category === category;

      return (
        matchesSearch &&
        matchesCategory
      );

    });

  document.getElementById(
    "count"
  ).textContent =
    `${filtered.length} Resources`;

  if(!filtered.length){

    container.innerHTML = `
      <div class="empty">
        No resources found.
      </div>
    `;

    return;

  }

  container.innerHTML =
    filtered.map(resource => `

      <div class="resource">

        <h3>
          ${escapeHTML(resource.title)}
        </h3>

        <div class="meta">
          ${escapeHTML(resource.description || "No description")}
        </div>

        <p>
          <span class="badge">
            ${escapeHTML(resource.category || "Other")}
          </span>

          <span class="badge">
            ${escapeHTML(resource.type || "File")}
          </span>
        </p>

        <div class="meta">
          Size:
          ${escapeHTML(resource.size || "Unknown")}
        </div>

        <div class="meta">
          Downloads:
          ${Number(resource.downloads || 0)}
        </div>

        <div class="actions">

          <a
            href="${escapeHTML(resource.fileUrl || "#")}"
            target="_blank"
            rel="noopener">
            <button class="primary">
              Open
            </button>
          </a>

          <button
            class="secondary"
            onclick="editResource('${resource.id}')">
            Edit
          </button>

          <button
            class="danger"
            onclick="deleteResource('${resource.id}')">
            Delete
          </button>

        </div>

      </div>

    `).join("");

};


/* =====================================
   ADD / UPDATE
===================================== */

document.getElementById(
  "resourceForm"
).addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const id =
      document.getElementById(
        "resourceId"
      ).value;

    const data = {

      title:
        document.getElementById(
          "title"
        ).value.trim(),

      description:
        document.getElementById(
          "description"
        ).value.trim(),

      category:
        document.getElementById(
          "category"
        ).value,

      type:
        document.getElementById(
          "type"
        ).value,

      fileUrl:
        document.getElementById(
          "fileUrl"
        ).value.trim(),

      thumbnail:
        document.getElementById(
          "thumbnail"
        ).value.trim(),

      size:
        document.getElementById(
          "size"
        ).value.trim(),

      updatedAt:
        serverTimestamp()

    };


    try{

      if(id){

        await updateDoc(
          doc(db,"resources",id),
          data
        );

        showToast(
          "Resource updated"
        );

      }
      else{

        await addDoc(
          collection(db,"resources"),
          {
            ...data,
            downloads:0,
            views:0,
            status:"published",
            createdAt:
              serverTimestamp()
          }
        );

        showToast(
          "Resource created"
        );

      }

      resetForm();

      await loadResources();

    }
    catch(error){

      console.error(error);

      showToast(
        "Unable to save resource"
      );

    }

  }
);


/* =====================================
   EDIT
===================================== */

window.editResource =
function(id){

  const resource =
    resources.find(
      item => item.id === id
    );

  if(!resource) return;

  document.getElementById(
    "resourceId"
  ).value = id;

  document.getElementById(
    "title"
  ).value =
    resource.title || "";

  document.getElementById(
    "description"
  ).value =
    resource.description || "";

  document.getElementById(
    "category"
  ).value =
    resource.category || "Other";

  document.getElementById(
    "type"
  ).value =
    resource.type || "PDF";

  document.getElementById(
    "fileUrl"
  ).value =
    resource.fileUrl || "";

  document.getElementById(
    "thumbnail"
  ).value =
    resource.thumbnail || "";

  document.getElementById(
    "size"
  ).value =
    resource.size || "";

  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Resource";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =====================================
   DELETE
===================================== */

window.deleteResource =
async function(id){

  const resource =
    resources.find(
      item => item.id === id
    );

  if(!resource) return;

  if(!confirm(
    `Delete "${resource.title || "this resource"}"?`
  )) return;

  try{

    await deleteDoc(
      doc(db,"resources",id)
    );

    showToast(
      "Resource deleted"
    );

    await loadResources();

  }
  catch(error){

    console.error(error);

    showToast(
      "Unable to delete resource"
    );

  }

};


/* =====================================
   START
===================================== */

loadResources();

</script>

</body>
</html>
