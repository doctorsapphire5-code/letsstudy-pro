<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Resources | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
header{
  background:#111827;
  color:white;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center
}
main{max-width:1100px;margin:auto;padding:20px}
.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 15px #0000000d
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #d6dbe5;
  border-radius:9px;
  margin-top:6px
}
textarea{min-height:100px;resize:vertical}
label{font-size:13px;font-weight:bold}
button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold
}
.primary{background:#2563eb;color:white}
.danger{background:#dc2626;color:white}
.secondary{background:#e5e7eb}
.success{background:#16a34a;color:white}
.resource{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
  margin-top:12px
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px
}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:12px;
  background:#e5e7eb
}
.published{background:#dcfce7;color:#166534}
.draft{background:#fef3c7;color:#92400e}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px
}
.stat{
  background:white;
  padding:16px;
  border-radius:12px
}
.stat strong{display:block;font-size:24px}
.hidden{display:none}
#toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111827;
  color:white;
  padding:13px 18px;
  border-radius:10px;
  display:none
}
</style>
</head>

<body>

<header>
  <strong>LetsStudy Pro — Resources</strong>
  <button class="secondary" id="logoutBtn">Logout</button>
</header>

<main>

<div id="authMessage" class="card">
  Checking administrator access...
</div>

<section id="adminApp" class="hidden">

<div class="stats">
  <div class="stat">
    <small>Total Resources</small>
    <strong id="totalResources">0</strong>
  </div>

  <div class="stat">
    <small>Published</small>
    <strong id="publishedResources">0</strong>
  </div>

  <div class="stat">
    <small>Total Downloads</small>
    <strong id="totalDownloads">0</strong>
  </div>
</div>

<div class="card">

<h2 id="formTitle">Add Resource</h2>

<form id="resourceForm">

<input type="hidden" id="resourceId">

<div class="grid">

<div>
<label>Title</label>
<input id="title" required>
</div>

<div>
<label>Category</label>
<select id="category">
<option value="Biology">Biology</option>
<option value="Chemistry">Chemistry</option>
<option value="Physics">Physics</option>
<option value="Mathematics">Mathematics</option>
<option value="Geography">Geography</option>
<option value="Technology">Technology</option>
<option value="Business">Business</option>
<option value="Other">Other</option>
</select>
</div>

<div>
<label>Type</label>
<select id="type">
<option value="PDF">PDF</option>
<option value="Document">Document</option>
<option value="Video">Video</option>
<option value="Link">Link</option>
<option value="Past Paper">Past Paper</option>
<option value="Notes">Notes</option>
</select>
</div>

<div>
<label>Status</label>
<select id="status">
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>
</div>

</div>

<label>Description</label>
<textarea id="description"></textarea>

<div class="grid">

<div>
<label>File URL</label>
<input id="fileUrl"
       type="url"
       placeholder="https://example.com/file.pdf"
       required>
</div>

<div>
<label>Thumbnail URL</label>
<input id="thumbnailUrl"
       type="url"
       placeholder="https://example.com/image.jpg">
</div>

</div>

<div class="actions">
<button class="primary" type="submit">
Save Resource
</button>

<button
  class="secondary hidden"
  type="button"
  id="cancelEdit">
Cancel Edit
</button>
</div>

</form>
</div>

<div class="card">

<div class="grid">

<input
 id="search"
 placeholder="Search resources...">

<select id="filterCategory">
<option value="">All Categories</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>Mathematics</option>
<option>Geography</option>
<option>Technology</option>
<option>Business</option>
<option>Other</option>
</select>

</div>

<div id="resourcesList"></div>

</div>

</section>
</main>

<div id="toast"></div>

<script type="module">

import {
 initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 doc,
 updateDoc,
 deleteDoc,
 serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  projectId:
    "let-s-study-pro-course",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


/* =====================================
   FIREBASE
===================================== */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================
   ELEMENTS
===================================== */

const adminApp =
  document.getElementById("adminApp");

const authMessage =
  document.getElementById("authMessage");

const form =
  document.getElementById("resourceForm");

const list =
  document.getElementById("resourcesList");

const search =
  document.getElementById("search");

const filterCategory =
  document.getElementById("filterCategory");

const toast =
  document.getElementById("toast");

let resources = [];


/* =====================================
   TOAST
===================================== */

function showToast(message){

  toast.textContent = message;
  toast.style.display = "block";

  setTimeout(
    () => {
      toast.style.display = "none";
    },
    2500
  );
}


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      authMessage.textContent =
        "Please login first.";

      return;
    }

    /*
      UI access check.

      IMPORTANT:
      Real security must also be
      enforced by Firestore Rules.
    */

    authMessage.classList.add("hidden");
    adminApp.classList.remove("hidden");

    await loadResources();

  }
);


/* =====================================
   LOAD RESOURCES
===================================== */

async function loadResources(){

  try{

    const snap =
      await getDocs(
        collection(
          db,
          "resources"
        )
      );

    resources =
      snap.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );

    renderResources();

  }
  catch(error){

    console.error(error);

    showToast(
      "Failed to load resources"
    );

  }

}


/* =====================================
   RENDER
===================================== */

function renderResources(){

  const term =
    search.value
      .toLowerCase()
      .trim();

  const category =
    filterCategory.value;

  const filtered =
    resources.filter(
      resource => {

        const matchesSearch =
          !term ||
          String(
            resource.title || ""
          )
          .toLowerCase()
          .includes(term) ||

          String(
            resource.description || ""
          )
          .toLowerCase()
          .includes(term);

        const matchesCategory =
          !category ||
          resource.category === category;

        return (
          matchesSearch &&
          matchesCategory
        );

      }
    );


  list.innerHTML = "";


  if(!filtered.length){

    list.innerHTML = `
      <div class="resource">
        No resources found.
      </div>
    `;

    updateStats();

    return;
  }


  filtered.forEach(
    resource => {

      const div =
        document.createElement("div");

      div.className = "resource";


      const statusClass =
        resource.status === "published"
          ? "published"
          : "draft";


      div.innerHTML = `

        ${
          resource.thumbnailUrl
            ? `
              <img
                src="${escapeAttribute(
                  resource.thumbnailUrl
                )}"
                style="
                  width:90px;
                  height:60px;
                  object-fit:cover;
                  border-radius:8px;
                "
              >
            `
            : ""
        }

        <h3>
          ${escapeHTML(
            resource.title || "Untitled"
          )}
        </h3>

        <span class="badge">
          ${escapeHTML(
            resource.category || "Other"
          )}
        </span>

        <span class="badge">
          ${escapeHTML(
            resource.type || "Resource"
          )}
        </span>

        <span class="badge ${statusClass}">
          ${escapeHTML(
            resource.status || "draft"
          )}
        </span>

        <p>
          ${escapeHTML(
            resource.description || ""
          )}
        </p>

        <small>
          Views: ${Number(resource.views || 0)}
          · Downloads:
          ${Number(resource.downloads || 0)}
        </small>

        <div class="actions">

          <a
            href="${escapeAttribute(
              resource.fileUrl || "#"
            )}"
            target="_blank"
            rel="noopener"
          >
            <button class="secondary">
              Open
            </button>
          </a>

          <button
            class="primary"
            onclick="editResource('${resource.id}')"
          >
            Edit
          </button>

          <button
            class="success"
            onclick="togglePublished('${resource.id}')"
          >
            ${
              resource.status === "published"
                ? "Unpublish"
                : "Publish"
            }
          </button>

          <button
            class="danger"
            onclick="deleteResource('${resource.id}')"
          >
            Delete
          </button>

        </div>
      `;


      list.appendChild(div);

    }
  );


  updateStats();

}


/* =====================================
   SAVE / UPDATE
===================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const id =
      document.getElementById(
        "resourceId"
      ).value;


    const data = {

      title:
        document.getElementById(
          "title"
        ).value.trim(),

      description:
        document.getElementById(
          "description"
        ).value.trim(),

      category:
        document.getElementById(
          "category"
        ).value,

      type:
        document.getElementById(
          "type"
        ).value,

      fileUrl:
        document.getElementById(
          "fileUrl"
        ).value.trim(),

      thumbnailUrl:
        document.getElementById(
          "thumbnailUrl"
        ).value.trim(),

      status:
        document.getElementById(
          "status"
        ).value,

      updatedAt:
        serverTimestamp()

    };


    try{

      if(id){

        await updateDoc(
          doc(
            db,
            "resources",
            id
          ),
          data
        );

        showToast(
          "Resource updated"
        );

      }
      else{

        await addDoc(
          collection(
            db,
            "resources"
          ),
          {

            ...data,

            downloads:0,
            views:0,

            uploadedBy:
              auth.currentUser.uid,

            createdAt:
              serverTimestamp()

          }
        );

        showToast(
          "Resource created"
        );

      }


      resetForm();

      await loadResources();

    }
    catch(error){

      console.error(error);

      showToast(
        "Save failed"
      );

    }

  }
);


/* =====================================
   EDIT
===================================== */

window.editResource =
function(id){

  const resource =
    resources.find(
      item => item.id === id
    );

  if(!resource) return;


  document.getElementById(
    "resourceId"
  ).value = id;

  document.getElementById(
    "title"
  ).value =
    resource.title || "";

  document.getElementById(
    "description"
  ).value =
    resource.description || "";

  document.getElementById(
    "category"
  ).value =
    resource.category || "Other";

  document.getElementById(
    "type"
  ).value =
    resource.type || "PDF";

  document.getElementById(
    "fileUrl"
  ).value =
    resource.fileUrl || "";

  document.getElementById(
    "thumbnailUrl"
  ).value =
    resource.thumbnailUrl || "";

  document.getElementById(
    "status"
  ).value =
    resource.status || "draft";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Resource";

  document.getElementById(
    "cancelEdit"
  ).classList.remove(
    "hidden"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =====================================
   DELETE
===================================== */

window.deleteResource =
async function(id){

  if(
    !confirm(
      "Delete this resource?"
    )
  ){
    return;
  }


  try{

    await deleteDoc(
      doc(
        db,
        "resources",
        id
      )
    );

    showToast(
      "Resource deleted"
    );

    await loadResources();

  }
  catch(error){

    console.error(error);

    showToast(
      "Delete failed"
    );

  }

};


/* =====================================
   PUBLISH / UNPUBLISH
===================================== */

window.togglePublished =
async function(id){

  const resource =
    resources.find(
      item => item.id === id
    );

  if(!resource) return;


  const newStatus =
    resource.status === "published"
      ? "draft"
      : "published";


  try{

    await updateDoc(
      doc(
        db,
        "resources",
        id
      ),
      {
        status:newStatus,
        updatedAt:
          serverTimestamp()
      }
    );


    showToast(
      newStatus === "published"
        ? "Resource published"
        : "Resource unpublished"
    );


    await loadResources();

  }
  catch(error){

    console.error(error);

    showToast(
      "Status update failed"
    );

  }

};


/* =====================================
   RESET
===================================== */

function resetForm(){

  form.reset();

  document.getElementById(
    "resourceId"
  ).value = "";

  document.getElementById(
    "formTitle"
  ).textContent =
    "Add Resource";

  document.getElementById(
    "cancelEdit"
  ).classList.add(
    "hidden"
  );

}


document.getElementById(
  "cancelEdit"
).onclick =
resetForm;


/* =====================================
   SEARCH
===================================== */

search.addEventListener(
  "input",
  renderResources
);

filterCategory.addEventListener(
  "change",
  renderResources
);


/* =====================================
   STATISTICS
===================================== */

function updateStats(){

  document.getElementById(
    "totalResources"
  ).textContent =
    resources.length;


  document.getElementById(
    "publishedResources"
  ).textContent =
    resources.filter(
      item =>
        item.status === "published"
    ).length;


  document.getElementById(
    "totalDownloads"
  ).textContent =
    resources.reduce(
      (sum,item) =>
        sum +
        Number(
          item.downloads || 0
        ),
      0
    );

}


/* =====================================
   SAFE HTML
===================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return escapeHTML(value);

}


/* =====================================
   LOGOUT
===================================== */

document.getElementById(
  "logoutBtn"
).onclick =
async function(){

  await signOut(auth);

  location.reload();

};

</script>

</body>
</html>
