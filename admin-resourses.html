<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Resources | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

header h1{
  font-size:22px;
}

header button{
  border:0;
  background:#2563eb;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:25px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat h3{
  color:#64748b;
  font-size:14px;
  margin-bottom:8px;
}

.stat strong{
  font-size:27px;
}

.card{
  background:white;
  border-radius:14px;
  padding:22px;
  margin-bottom:22px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.card h2{
  margin-bottom:18px;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-weight:600;
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #d8dee9;
  border-radius:8px;
  outline:none;
  font-size:14px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

button{
  border:0;
  padding:11px 17px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.btn-success{
  background:#16a34a;
  color:white;
}

.toolbar{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}

.resource-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.resource{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:18px;
  background:#fff;
}

.resource-icon{
  width:50px;
  height:50px;
  border-radius:10px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  margin-bottom:12px;
}

.resource h3{
  margin-bottom:8px;
}

.resource p{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
  margin-bottom:10px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:14px;
}

.badge{
  background:#eef2ff;
  color:#3730a3;
  padding:5px 8px;
  border-radius:6px;
  font-size:12px;
}

.status-active{
  background:#dcfce7;
  color:#166534;
}

.status-draft{
  background:#fef3c7;
  color:#92400e;
}

.resource-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.resource-actions button{
  padding:8px 11px;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:40px;
  color:#64748b;
}

.progress{
  width:100%;
  height:8px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#2563eb;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal-box{
  background:white;
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:25px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  background:#f1f5f9;
  font-size:20px;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:white;
  padding:14px 18px;
  border-radius:9px;
  display:none;
  z-index:2000;
}

.loading{
  text-align:center;
  padding:30px;
}

@media(max-width:900px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .resource-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  .container{
    padding:15px;
  }

  .stats,
  .resource-grid,
  .form-grid,
  .toolbar{
    grid-template-columns:1fr;
  }

  header{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>

  <h1>📚 Resources Management</h1>

  <button onclick="openResourceModal()">
    + Add Resource
  </button>

</header>


<main class="container">

  <!-- STATISTICS -->

  <section class="stats">

    <div class="stat">
      <h3>Total Resources</h3>
      <strong id="totalResources">0</strong>
    </div>

    <div class="stat">
      <h3>Active</h3>
      <strong id="activeResources">0</strong>
    </div>

    <div class="stat">
      <h3>Categories</h3>
      <strong id="totalCategories">0</strong>
    </div>

    <div class="stat">
      <h3>Total Downloads</h3>
      <strong id="totalDownloads">0</strong>
    </div>

  </section>


  <!-- SEARCH -->

  <section class="card">

    <h2>🔎 Resource Library</h2>

    <div class="toolbar">

      <input
        id="searchInput"
        type="search"
        placeholder="Search resources..."
      >

      <select id="categoryFilter">

        <option value="">All Categories</option>

        <option value="Notes">Notes</option>
        <option value="Past Papers">Past Papers</option>
        <option value="Books">Books</option>
        <option value="Assignments">Assignments</option>
        <option value="Research">Research</option>
        <option value="Videos">Videos</option>
        <option value="Other">Other</option>

      </select>

      <select id="statusFilter">

        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="draft">Draft</option>

      </select>

    </div>

  </section>


  <!-- RESOURCES -->

  <section class="card">

    <div id="loading" class="loading">
      Loading resources...
    </div>

    <div
      id="resourceGrid"
      class="resource-grid"
    ></div>

    <div
      id="emptyState"
      class="empty"
      style="display:none"
    >
      No resources found.
    </div>

  </section>

</main>


<!-- RESOURCE MODAL -->

<div
  id="resourceModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="modalTitle">
        Add Resource
      </h2>

      <button
        class="close"
        onclick="closeResourceModal()"
      >
        ×
      </button>

    </div>


    <form id="resourceForm">

      <div class="form-grid">

        <div class="form-group full">

          <label>Resource Title</label>

          <input
            id="resourceTitle"
            required
            placeholder="e.g. Physics Form 5 Notes"
          >

        </div>


        <div class="form-group">

          <label>Category</label>

          <select
            id="resourceCategory"
            required
          >

            <option value="Notes">
              Notes
            </option>

            <option value="Past Papers">
              Past Papers
            </option>

            <option value="Books">
              Books
            </option>

            <option value="Assignments">
              Assignments
            </option>

            <option value="Research">
              Research
            </option>

            <option value="Videos">
              Videos
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <div class="form-group">

          <label>Form / Level</label>

          <input
            id="resourceLevel"
            placeholder="Form 1, Form 5, University..."
          >

        </div>


        <div class="form-group">

          <label>Subject</label>

          <input
            id="resourceSubject"
            placeholder="Physics"
          >

        </div>


        <div class="form-group">

          <label>Status</label>

          <select id="resourceStatus">

            <option value="active">
              Active
            </option>

            <option value="draft">
              Draft
            </option>

          </select>

        </div>


        <div class="form-group full">

          <label>Description</label>

          <textarea
            id="resourceDescription"
            placeholder="Describe this resource..."
          ></textarea>

        </div>


        <div class="form-group full">

          <label>External Download URL (optional)</label>

          <input
            id="resourceUrl"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="form-group full">

          <label>Upload File (optional)</label>

          <input
            id="resourceFile"
            type="file"
          >

          <small id="currentFile">
          </small>

        </div>

      </div>


      <div
        id="uploadProgress"
        style="display:none"
      >

        <small>
          Uploading...
        </small>

        <div class="progress">

          <div
            id="progressBar"
            class="progress-bar"
          ></div>

        </div>

      </div>


      <div class="actions">

        <button
          type="submit"
          class="btn-primary"
          id="saveBtn"
        >
          Save Resource
        </button>

        <button
          type="button"
          class="btn-secondary"
          onclick="closeResourceModal()"
        >
          Cancel
        </button>

      </div>

    </form>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  increment,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
  getStorage,
  ref,
  uploadBytesResumable,
  getDownloadURL,
  deleteObject
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


const storage =
  getStorage(app);


/* =====================================
   STATE
===================================== */

let resources = [];

let editingId = null;

let editingData = null;


/* =====================================
   ELEMENTS
===================================== */

const resourceGrid =
  document.getElementById(
    "resourceGrid"
  );

const loading =
  document.getElementById(
    "loading"
  );

const emptyState =
  document.getElementById(
    "emptyState"
  );

const modal =
  document.getElementById(
    "resourceModal"
  );

const form =
  document.getElementById(
    "resourceForm"
  );


/* =====================================
   TOAST
===================================== */

window.showToast =
function(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.style.display =
    "block";

  setTimeout(
    () => {

      toast.style.display =
        "none";

    },
    3000
  );

};


/* =====================================
   OPEN MODAL
===================================== */

window.openResourceModal =
function(id = null){

  editingId =
    id;

  editingData =
    null;

  form.reset();

  document.getElementById(
    "modalTitle"
  ).textContent =
    id
      ? "Edit Resource"
      : "Add Resource";

  document.getElementById(
    "currentFile"
  ).textContent =
    "";

  if(id){

    const resource =
      resources.find(
        item =>
          item.id === id
      );

    if(!resource){

      showToast(
        "Resource not found"
      );

      return;

    }

    editingData =
      resource;

    document.getElementById(
      "resourceTitle"
    ).value =
      resource.title || "";

    document.getElementById(
      "resourceCategory"
    ).value =
      resource.category ||
      "Other";

    document.getElementById(
      "resourceLevel"
    ).value =
      resource.level ||
      "";

    document.getElementById(
      "resourceSubject"
    ).value =
      resource.subject ||
      "";

    document.getElementById(
      "resourceStatus"
    ).value =
      resource.status ||
      "active";

    document.getElementById(
      "resourceDescription"
    ).value =
      resource.description ||
      "";

    document.getElementById(
      "resourceUrl"
    ).value =
      resource.url ||
      "";

    if(resource.fileName){

      document.getElementById(
        "currentFile"
      ).textContent =
        "Current file: " +
        resource.fileName;

    }

  }

  modal.style.display =
    "flex";

};


/* =====================================
   CLOSE MODAL
===================================== */

window.closeResourceModal =
function(){

  modal.style.display =
    "none";

  editingId =
    null;

  editingData =
    null;

};


/* =====================================
   LOAD RESOURCES
===================================== */

async function loadResources(){

  loading.style.display =
    "block";

  resourceGrid.innerHTML =
    "";

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "resources"
        )
      );

    resources =
      snapshot.docs.map(
        item => ({

          id:
            item.id,

          ...item.data()

        })
      );

    renderResources();

    updateStats();

  }
  catch(error){

    console.error(
      error
    );

    showToast(
      "Failed to load resources"
    );

  }
  finally{

    loading.style.display =
      "none";

  }

}


/* =====================================
   RENDER
===================================== */

function renderResources(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
    .toLowerCase()
    .trim();

  const category =
    document.getElementById(
      "categoryFilter"
    ).value;

  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const filtered =
    resources.filter(
      resource => {

        const text = (

          resource.title ||
          "" +

          " " +

          resource.description ||
          "" +

          " " +

          resource.subject ||
          ""

        ).toLowerCase();


        const matchesSearch =
          !search ||
          text.includes(
            search
          );


        const matchesCategory =
          !category ||
          resource.category ===
          category;


        const matchesStatus =
          !status ||
          resource.status ===
          status;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesStatus
        );

      }
    );


  resourceGrid.innerHTML =
    "";


  if(!filtered.length){

    emptyState.style.display =
      "block";

    return;

  }


  emptyState.style.display =
    "none";


  filtered.forEach(
    resource => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "resource";


      const icon =
        getResourceIcon(
          resource
        );


      card.innerHTML = `

        <div class="resource-icon">
          ${icon}
        </div>

        <h3>
          ${escapeHtml(
            resource.title ||
            "Untitled Resource"
          )}
        </h3>

        <p>
          ${escapeHtml(
            resource.description ||
            "No description available."
          )}
        </p>

        <div class="meta">

          ${
            resource.category
              ? `
                <span class="badge">
                  ${escapeHtml(
                    resource.category
                  )}
                </span>
              `
              : ""
          }

          ${
            resource.level
              ? `
                <span class="badge">
                  ${escapeHtml(
                    resource.level
                  )}
                </span>
              `
              : ""
          }

          ${
            resource.subject
              ? `
                <span class="badge">
                  ${escapeHtml(
                    resource.subject
                  )}
                </span>
              `
              : ""
          }

          <span class="badge ${
            resource.status === "active"
              ? "status-active"
              : "status-draft"
          }">

            ${
              resource.status === "active"
                ? "Active"
                : "Draft"
            }

          </span>

        </div>


        <p>
          📥 Downloads:
          <strong>
            ${Number(
              resource.downloads || 0
            ).toLocaleString()}
          </strong>
        </p>


        <div class="resource-actions">

          ${
            resource.url
              ? `
                <button
                  class="btn-success"
                  onclick="downloadResource('${resource.id}')"
                >
                  Download
                </button>
              `
              : ""
          }

          <button
            class="btn-primary"
            onclick="openResourceModal('${resource.id}')"
          >
            Edit
          </button>

          <button
            class="btn-danger"
            onclick="deleteResource('${resource.id}')"
          >
            Delete
          </button>

        </div>

      `;


      resourceGrid.appendChild(
        card
      );

    }
  );

}


/* =====================================
   ICON
===================================== */

function getResourceIcon(
  resource
){

  const category =
    String(
      resource.category ||
      ""
    ).toLowerCase();


  if(
    category.includes(
      "past"
    )
  )
    return "📝";

  if(
    category.includes(
      "book"
    )
  )
    return "📚";

  if(
    category.includes(
      "video"
    )
  )
    return "🎥";

  if(
    category.includes(
      "research"
    )
  )
    return "🔬";

  if(
    category.includes(
      "assignment"
    )
  )
    return "📋";

  return "📄";

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================
   UPLOAD FILE
===================================== */

async function uploadFile(
  file
){

  const fileName =
    Date.now() +
    "_" +
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );


  const storageRef =
    ref(
      storage,
      "resources/" +
      fileName
    );


  const task =
    uploadBytesResumable(
      storageRef,
      file
    );


  document.getElementById(
    "uploadProgress"
  ).style.display =
    "block";


  return new Promise(
    (
      resolve,
      reject
    ) => {      task.on(

        "state_changed",

        snapshot => {

          const progress =
            (
              snapshot.bytesTransferred /
              snapshot.totalBytes
            ) * 100;


          const progressBar =
            document.getElementById(
              "progressBar"
            );


          if(progressBar){

            progressBar.style.width =
              progress + "%";

          }

        },


        error => {

          document.getElementById(
            "uploadProgress"
          ).style.display =
            "none";


          reject(
            error
          );

        },


        async () => {

          try{

            const downloadURL =
              await getDownloadURL(
                task.snapshot.ref
              );


            document.getElementById(
              "uploadProgress"
            ).style.display =
              "none";


            document.getElementById(
              "progressBar"
            ).style.width =
              "0%";


            resolve({

              url:
                downloadURL,

              fileName:
                file.name,

              storagePath:
                "resources/" +
                fileName

            });

          }
          catch(error){

            document.getElementById(
              "uploadProgress"
            ).style.display =
              "none";


            reject(
              error
            );

          }

        }

      );

    }

  );

}


/* =====================================
   SAVE RESOURCE
===================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const saveBtn =
      document.getElementById(
        "saveBtn"
      );


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "Saving...";


    try{

      const title =
        document.getElementById(
          "resourceTitle"
        ).value.trim();


      const category =
        document.getElementById(
          "resourceCategory"
        ).value;


      const level =
        document.getElementById(
          "resourceLevel"
        ).value.trim();


      const subject =
        document.getElementById(
          "resourceSubject"
        ).value.trim();


      const description =
        document.getElementById(
          "resourceDescription"
        ).value.trim();


      const status =
        document.getElementById(
          "resourceStatus"
        ).value;


      let url =
        document.getElementById(
          "resourceUrl"
        ).value.trim();


      let fileName =
        editingData?.fileName ||
        "";


      let storagePath =
        editingData?.storagePath ||
        "";


      const fileInput =
        document.getElementById(
          "resourceFile"
        );


      const file =
        fileInput?.files?.[0] ||
        null;


      /*
       * Upload new file
       */

      if(file){

        const uploaded =
          await uploadFile(
            file
          );


        url =
          uploaded.url;

        fileName =
          uploaded.fileName;

        storagePath =
          uploaded.storagePath;

      }


      const resourceData = {

        title:
          title,

        category:
          category,

        level:
          level,

        subject:
          subject,

        description:
          description,

        status:
          status,

        url:
          url,

        fileName:
          fileName,

        storagePath:
          storagePath,

        updatedAt:
          serverTimestamp()

      };


      /*
       * EDIT
       */

      if(editingId){

        await updateDoc(

          doc(
            db,
            "resources",
            editingId
          ),

          resourceData

        );


        showToast(
          "Resource updated successfully"
        );

      }


      /*
       * CREATE
       */

      else{

        resourceData.downloads =
          0;

        resourceData.createdAt =
          serverTimestamp();


        await addDoc(

          collection(
            db,
            "resources"
          ),

          resourceData

        );


        showToast(
          "Resource created successfully"
        );

      }


      closeResourceModal();

      await loadResources();

    }
    catch(error){

      console.error(
        "Save resource error:",
        error
      );


      showToast(
        "Failed to save resource"
      );

    }
    finally{

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "Save Resource";

    }

  }
);


/* =====================================
   DELETE RESOURCE
===================================== */

window.deleteResource =
async function(id){

  const resource =
    resources.find(
      item =>
        item.id === id
    );


  if(!resource){

    showToast(
      "Resource not found"
    );

    return;

  }


  const confirmed =
    confirm(
      "Are you sure you want to delete this resource?"
    );


  if(!confirmed)
    return;


  try{

    /*
     * Delete Storage file
     */

    if(
      resource.storagePath
    ){

      try{

        const fileRef =
          ref(
            storage,
            resource.storagePath
          );


        await deleteObject(
          fileRef
        );

      }
      catch(storageError){

        console.warn(
          "Storage file could not be deleted:",
          storageError
        );

      }

    }


    /*
     * Delete Firestore document
     */

    await deleteDoc(

      doc(
        db,
        "resources",
        id
      )

    );


    showToast(
      "Resource deleted successfully"
    );


    await loadResources();

  }
  catch(error){

    console.error(
      "Delete resource error:",
      error
    );


    showToast(
      "Failed to delete resource"
    );

  }

};


/* =====================================
   DOWNLOAD RESOURCE
===================================== */

window.downloadResource =
async function(id){

  const resource =
    resources.find(
      item =>
        item.id === id
    );


  if(
    !resource ||
    !resource.url
  ){

    showToast(
      "Download link unavailable"
    );

    return;

  }


  /*
   * Increase download counter
   */

  try{

    await updateDoc(

      doc(
        db,
        "resources",
        id
      ),

      {

        downloads:
          increment(1)

      }

    );

  }
  catch(error){

    console.warn(
      "Download counter failed:",
      error
    );

  }


  /*
   * Open resource
   */

  window.open(
    resource.url,
    "_blank",
    "noopener,noreferrer"
  );


  /*
   * Refresh statistics
   */

  setTimeout(
    () => {

      loadResources();

    },
    500
  );

};


/* =====================================
   UPDATE STATISTICS
===================================== */

function updateStats(){

  const total =
    resources.length;


  const active =
    resources.filter(
      resource =>
        resource.status ===
        "active"
    ).length;


  const categorySet =
    new Set();


  resources.forEach(
    resource => {

      if(
        resource.category
      ){

        categorySet.add(
          resource.category
        );

      }

    }
  );


  const totalDownloads =
    resources.reduce(
      (
        total,
        resource
      ) => {

        return (
          total +
          Number(
            resource.downloads ||
            0
          )
        );

      },
      0
    );


  document.getElementById(
    "totalResources"
  ).textContent =
    total;


  document.getElementById(
    "activeResources"
  ).textContent =
    active;


  document.getElementById(
    "totalCategories"
  ).textContent =
    categorySet.size;


  document.getElementById(
    "totalDownloads"
  ).textContent =
    totalDownloads.toLocaleString();

}
