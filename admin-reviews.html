nav{

.card{

.card small{

.card strong{

.panel{

.toolbar{

.table-wrap{

th,

  font-size:13px;

}

.stars{

}

.badge{

}

.approved{

.pending{

}

.hidden{

.actions{

.btn{
  border:0;

}

.view{

}

.approve{

.hide{

.delete{

.empty{

}

.modal{
  display:none;
  position:fixed;

.modal.show{

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  update,
  remove,
  onValue
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getDatabase(app);


let currentAdmin =
null;

let reviews = {};


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);


/* =====================================================
   LOAD REVIEWS
===================================================== */

function loadReviews(){

  onValue(
    ref(
      db,
      "reviews"
    ),
    snapshot => {

      reviews =
        snapshot.val() || {};

      updateStats();

      renderReviews();

    },
    error => {

      console.error(
        error
      );

      document.getElementById(
        "reviewList"
      ).innerHTML = `

        <tr>

          <td
            colspan="7"
            class="empty">

            Unable to load reviews.

          </td>

        </tr>

      `;

    }
  );

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const list =
    Object.values(
      reviews
    );


  const total =
    list.length;


  const pending =
    list.filter(
      review =>
        getStatus(
          review
        ) === "pending"
    ).length;


  const approved =
    list.filter(
      review =>
        getStatus(
          review
        ) === "approved"
    ).length;


  let ratingTotal = 0;


  list.forEach(
    review => {

      ratingTotal +=
        Number(
          review.rating || 0
        );

    }
  );


  const average =
    total
      ? ratingTotal / total
      : 0;


  document.getElementById(
    "totalReviews"
  ).textContent =
    total;


  document.getElementById(
    "pendingReviews"
  ).textContent =
    pending;


  document.getElementById(
    "approvedReviews"
  ).textContent =
    approved;


  document.getElementById(
    "averageRating"
  ).textContent =
    average.toFixed(1);

}


/* =====================================================
   RENDER REVIEWS
===================================================== */

function renderReviews(){

  const tbody =
    document.getElementById(
      "reviewList"
    );


  const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase()
    .trim();


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const rating =
    document.getElementById(
      "ratingFilter"
    ).value;


  const list =
    Object.entries(
      reviews
    )
    .filter(
      ([id,review]) => {

        const text = [

          review.name,

          review.email,

          review.course,

          review.courseName,

          review.text,

          review.comment

        ]
        .join(" ")
        .toLowerCase();


        const matchesSearch =
          !search ||
          text.includes(
            search
          );


        const matchesStatus =
          status === "all" ||
          getStatus(
            review
          ) === status;


        const matchesRating =
          rating === "all" ||
          String(
            review.rating || 0
          ) === rating;


        return (
          matchesSearch &&
          matchesStatus &&
          matchesRating
        );

      }
    )
    .sort(
      (a,b) =>
        getDate(
          b[1]
        ) -
        getDate(
          a[1]
        )
    );


  if(!list.length){

    tbody.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="empty">

          No reviews found.

        </td>

      </tr>

    `;

    return;

  }


  tbody.innerHTML =
    list.map(
      ([id,review]) =>
        createRow(
          id,
          review
        )
    )
    .join("");

}


/* =====================================================
   CREATE ROW
===================================================== */

function createRow(
  id,
  review
){

  const rating =
    Number(
      review.rating || 0
    );


  const stars =
    "★".repeat(
      Math.min(
        5,
        Math.max(
          0,
          rating
        )
      )
    ) +
    "☆".repeat(
      Math.max(
        0,
        5 - rating
      )
    );


  const status =
    getStatus(
      review
    );


  const preview =
    String(
      review.text ||
      review.comment ||
      ""
    );


  return `

    <tr>

      <td>

        <strong>

          ${escapeHtml(
            review.name ||
            review.displayName ||
            review.email ||
            review.uid ||
            "Student"
          )}

        </strong>

      </td>


      <td>

        ${escapeHtml(
          review.courseName ||
          review.course ||
          "-"
        )}

      </td>


      <td>

        <span class="stars">
          ${stars}
        </span>

      </td>


      <td>

        ${escapeHtml(
          preview.length > 70
            ? preview.substring(
                0,
                70
              ) + "..."
            : preview
        )}

      </td>


      <td>

        <span class="
          badge
          ${status}
        ">

          ${escapeHtml(
            status
          )}

        </span>

      </td>


      <td>

        ${formatDate(
          getDate(
            review
          )
        )}

      </td>


      <td>

        <div class="actions">

          <button
            class="btn view"
            onclick="viewReview('${escapeAttr(id)}')">

            View

          </button>


          ${
            status !== "approved"
            ? `

              <button
                class="btn approve"
                onclick="approveReview('${escapeAttr(id)}')">

                Publish

              </button>

            `
            : `

              <button
                class="btn hide"
                onclick="hideReview('${escapeAttr(id)}')">

                Hide

              </button>

            `
          }


          <button
            class="btn delete"
            onclick="deleteReview('${escapeAttr(id)}')">

            Delete

          </button>

        </div>

      </td>

    </tr>

  `;

}


/* =====================================================
   VIEW REVIEW
===================================================== */

window.viewReview =
function(id){

  const review =
    reviews[id];


  if(!review){

    return;

  }


  const rating =
    Number(
      review.rating || 0
    );


  const stars =
    "★".repeat(
      rating
    ) +
    "☆".repeat(
      5 - rating
    );


  document.getElementById(
    "reviewDetails"
  ).innerHTML = `

    <p>
      <strong>
        Student:
      </strong>

      ${escapeHtml(
        review.name ||
        review.displayName ||
        review.email ||
        review.uid ||
        "-"
      )}

    </p>


    <p style="margin-top:10px">

      <strong>
        Course:
      </strong>

      ${escapeHtml(
        review.courseName ||
        review.course ||
        "-"
      )}

    </p>


    <p style="margin-top:10px">

      <strong>
        Rating:
      </strong>

      <span class="stars">
        ${stars}
      </span>

    </p>


    <p style="margin-top:10px">

      <strong>
        Status:
      </strong>

      ${escapeHtml(
        getStatus(
          review
        )
      )}

    </p>


    <div class="review-text">

      ${escapeHtml(
        review.text ||
        review.comment ||
        "No review text."
      )}

    </div>


    <p>

      <strong>
        Date:
      </strong>

      ${formatDate(
        getDate(
          review
        )
      )}

    </p>

  `;


  document.getElementById(
    "viewModal"
  ).classList.add(
    "show"
  );

};


/* =====================================================
   APPROVE REVIEW
===================================================== */

window.approveReview =
async function(id){

  if(!reviews[id]){

    return;

  }


  try{

    await update(
      ref(
        db,
        "reviews/" +
        id
      ),
      {

        status:
          "approved",

        approvedAt:
          Date.now(),

        approvedBy:
          currentAdmin.uid

      }
    );


    showToast(
      "Review published successfully.",
      "success"
    );


  }catch(error){

    console.error(
      error
    );

    showToast(
      "Unable to publish review."
    );

  }

};


/* =====================================================
   HIDE REVIEW
===================================================== */

window.hideReview =
async function(id){

  if(!reviews[id]){

    return;

  }


  try{

    await update(
      ref(
        db,
        "reviews/" +
        id
      ),
      {

        status:
          "hidden",

        hiddenAt:
          Date.now(),

        hiddenBy:
          currentAdmin.uid

      }
    );


    showToast(
      "Review hidden.",
      "success"
    );


  }catch(error){

    console.error(
      error
    );

    showToast(
      "Unable to hide review."
    );

  }

};


/* =====================================================
   DELETE REVIEW
===================================================== */

window.deleteReview =
async function(id){

  if(!reviews[id]){

    return;

  }


  const confirmed =
    confirm(
      "Delete this review permanently?"
    );


  if(!confirmed){

    return;

  }


  try{

    await remove(
      ref(
        db,
        "reviews/" +
        id
      )
    );


    showToast(
      "Review deleted.",
      "success"
    );


  }catch(error){

    console.error(
      error
    );

    showToast(
      "Unable to delete review."
    );

  }

};


/* =====================================================
   STATUS
===================================================== */

function getStatus(
  review
){

  const status =
    String(
      review?.status ||
      "pending"
    )
    .toLowerCase();


  if(
    status === "published"
  ){

    return "approved";

  }


  return status;

}


/* =====================================================
   DATE
===================================================== */

function getDate(
  review
){

  return Number(
    review?.createdAt ||
    review?.updatedAt ||
    review?.timestamp ||
    review?.date ||
    0
  );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
  value
){

  if(!value){

    return "-";

  }


  const date =
    new Date(
      Number(value)
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  return date.toLocaleString(
    "en-TZ"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttr(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "\\",
    "\\\\"
  )
  .replaceAll(
    "'",
    "\\'"
  );

}


/* =====================================================
   SEARCH + FILTER
===================================================== */

document.getElementById(
  "search"
).addEventListener(
  "input",
  renderReviews
);


document.getElementById(
  "statusFilter"
).addEventListener(
  "change",
  renderReviews
);


document.getElementById(
  "ratingFilter"
).addEventListener(
  "change",
  renderReviews
);


/* =====================================================
   CLOSE MODAL
===============
/* =====================================================
   CLOSE MODAL
===================================================== */

const closeModalBtn =
  document.getElementById(
    "closeModal"
  );

const viewModal =
  document.getElementById(
    "viewModal"
  );


if(closeModalBtn){

  closeModalBtn.addEventListener(
    "click",
    () => {

      viewModal.classList.remove(
        "show"
      );

    }
  );

}


/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

if(viewModal){

  viewModal.addEventListener(
    "click",
    event => {

      if(
        event.target ===
        viewModal
      ){

        viewModal.classList.remove(
          "show"
        );

      }

    }
  );

}


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      if(viewModal){

        viewModal.classList.remove(
          "show"
        );

      }

    }

  }
);


/* =====================================================
   TOAST
===================================================== */

function showToast(
  message,
  type = "error"
){

  let toast =
    document.getElementById(
      "toast"
    );


  if(!toast){

    toast =
      document.createElement(
        "div"
      );

    toast.id =
      "toast";


    toast.style.position =
      "fixed";

    toast.style.right =
      "20px";

    toast.style.bottom =
      "20px";

    toast.style.zIndex =
      "99999";

    toast.style.padding =
      "14px 18px";

    toast.style.borderRadius =
      "10px";

    toast.style.color =
      "#fff";

    toast.style.fontSize =
      "14px";

    toast.style.fontWeight =
      "600";

    toast.style.boxShadow =
      "0 8px 30px rgba(0,0,0,.2)";

    toast.style.maxWidth =
      "350px";

    toast.style.transition =
      "opacity .3s ease";

    document.body.appendChild(
      toast
    );

  }


  toast.textContent =
    message;


  toast.style.background =
    type === "success"
      ? "#16a34a"
      : type === "warning"
        ? "#d97706"
        : "#dc2626";


  toast.style.opacity =
    "1";

  toast.style.display =
    "block";


  clearTimeout(
    window.reviewToastTimer
  );


  window.reviewToastTimer =
    setTimeout(
      () => {

        toast.style.opacity =
          "0";


        setTimeout(
          () => {

            toast.style.display =
              "none";

          },
          300
        );

      },
      3000
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttr(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "\\",
    "\\\\"
  )
  .replaceAll(
    "'",
    "\\'"
  )
  .replaceAll(
    '"',
    "&quot;"
  );

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(
  value
){

  if(!value){

    return "-";

  }


  const date =
    new Date(
      Number(value)
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  return date.toLocaleString(
    "en-TZ",
    {
      dateStyle:
        "medium",

      timeStyle:
        "short"
    }
  );

}
