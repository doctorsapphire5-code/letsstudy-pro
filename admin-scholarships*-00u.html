<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholarship Management | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

button,input,textarea,select{font:inherit}

.container{
 max-width:1200px;
 margin:auto;
 padding:25px
}

.header{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:15px;
 padding:20px;
 margin-bottom:18px
}

.header h1{
 margin:0 0 5px;
 font-size:24px
}

.muted{
 color:#667085;
 font-size:13px
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin-bottom:18px
}

.stat{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:16px
}

.stat strong{
 display:block;
 font-size:23px;
 margin-top:5px
}

.toolbar{
 display:flex;
 gap:10px;
 margin-bottom:18px
}

.toolbar input{
 flex:1
}

input,textarea,select{
 width:100%;
 padding:11px;
 border:1px solid #d9dee8;
 border-radius:9px;
 outline:0;
 background:#fff
}

textarea{
 min-height:110px;
 resize:vertical
}

button{
 border:0;
 border-radius:9px;
 padding:10px 14px;
 cursor:pointer;
 font-weight:700
}

.primary{
 background:#155eef;
 color:#fff
}

.light{
 background:#eef2f6;
 color:#344054
}

.danger{
 background:#fee4e2;
 color:#b42318
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 overflow:hidden
}

.image{
 height:150px;
 background:#e9eef7;
 position:relative
}

.image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.featured{
 position:absolute;
 top:10px;
 left:10px;
 background:#f59e0b;
 color:#fff;
 padding:5px 8px;
 border-radius:20px;
 font-size:10px;
 font-weight:700
}

.body{
 padding:15px
}

.body h3{
 margin:0 0 5px;
 font-size:17px
}

.university{
 color:#155eef;
 font-size:12px;
 font-weight:700
}

.tags{
 display:flex;
 gap:6px;
 flex-wrap:wrap;
 margin:10px 0
}

.tag{
 background:#f2f4f7;
 padding:5px 8px;
 border-radius:20px;
 font-size:10px
}

.status{
 padding:5px 8px;
 border-radius:20px;
 font-size:10px
}

.published{
 background:#ecfdf3;
 color:#027a48
}

.draft{
 background:#f2f4f7;
 color:#475467
}

.actions{
 display:flex;
 gap:7px;
 margin-top:14px
}

.actions button{
 flex:1
}

.empty{
 grid-column:1/-1;
 text-align:center;
 padding:50px;
 color:#667085;
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:15px
}

.modal.show{
 display:flex
}

.modal-box{
 width:min(850px,100%);
 max-height:92vh;
 overflow:auto;
 background:#fff;
 border-radius:15px;
 padding:20px
}

.close{
 float:right;
 background:#f2f4f7
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.group{
 margin-bottom:12px
}

.group label{
 display:block;
 font-size:12px;
 font-weight:700;
 margin-bottom:5px
}

.full{
 grid-column:1/-1
}

.save{
 width:100%;
 margin-top:5px
}

@media(max-width:900px){
 .stats,.grid{
   grid-template-columns:1fr 1fr
 }
}

@media(max-width:600px){
 .container{padding:15px}
 .stats,.grid,.form-grid{
   grid-template-columns:1fr
 }
 .toolbar{
   flex-direction:column
 }
 .full{
   grid-column:auto
 }
}
</style>
</head>

<body>

<main class="container">

<section class="header">
 <h1>Scholarship Management</h1>
 <p class="muted">
   Manage scholarship opportunities, publishing,
   featured listings and application links.
 </p>
</section>


<section class="stats">

 <div class="stat">
  <span class="muted">Total</span>
  <strong id="total">0</strong>
 </div>

 <div class="stat">
  <span class="muted">Published</span>
  <strong id="published">0</strong>
 </div>

 <div class="stat">
  <span class="muted">Featured</span>
  <strong id="featured">0</strong>
 </div>

 <div class="stat">
  <span class="muted">Applications</span>
  <strong id="views">0</strong>
 </div>

</section>


<section class="toolbar">

 <input
   id="search"
   placeholder="Search scholarships or universities..."
 >

 <select id="statusFilter">
  <option value="">All Status</option>
  <option value="published">Published</option>
  <option value="draft">Draft</option>
 </select>

 <button class="primary" id="addBtn">
   <i class="fa fa-plus"></i>
   Add Scholarship
 </button>

</section>


<section id="list" class="grid">

 <div class="empty">
  Loading scholarships...
 </div>

</section>

</main>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<button class="close" id="close">✕</button>

<h2 id="modalTitle">Add Scholarship</h2>

<form id="form">

<div class="form-grid">


<div class="group">
<label>Title</label>
<input id="title" required>
</div>


<div class="group">
<label>Slug</label>
<input id="slug">
</div>


<div class="group">
<label>University</label>
<input id="university">
</div>


<div class="group">
<label>Country</label>
<input id="country">
</div>


<div class="group">
<label>Location</label>
<input id="location">
</div>


<div class="group">
<label>Level</label>
<select id="level">
 <option value="">Select Level</option>
 <option>Undergraduate</option>
 <option>Master</option>
 <option>PhD</option>
 <option>Diploma</option>
 <option>Certificate</option>
 <option>Postdoctoral</option>
 <option>Other</option>
</select>
</div>


<div class="group">
<label>Funding Type</label>
<select id="fundingType">
 <option value="">Select Funding</option>
 <option>Fully Funded</option>
 <option>Partially Funded</option>
 <option>Tuition Waiver</option>
 <option>Stipend</option>
 <option>Other</option>
</select>
</div>


<div class="group">
<label>Study Area</label>
<input id="studyArea">
</div>


<div class="group">
<label>Category</label>
<input id="category">
</div>


<div class="group">
<label>Amount</label>
<input id="amount" type="number">
</div>


<div class="group">
<label>Currency</label>
<input id="currency" value="USD">
</div>


<div class="group">
<label>Deadline</label>
<input id="deadline" type="date">
</div>


<div class="group">
<label>Status</label>
<select id="status">
 <option value="draft">Draft</option>
 <option value="published">Published</option>
</select>
</div>


<div class="group">
<label>Featured</label>
<select id="featured">
 <option value="false">No</option>
 <option value="true">Yes</option>
</select>
</div>


<div class="group">
<label>Image URL</label>
<input id="imageUrl">
</div>


<div class="group full">
<label>Application URL</label>
<input id="applicationUrl">
</div>


<div class="group full">
<label>Short Description</label>
<textarea id="shortDescription"></textarea>
</div>


<div class="group full">
<label>Description</label>
<textarea id="description"></textarea>
</div>


<div class="group full">
<label>Requirements</label>
<textarea id="requirements"></textarea>
</div>


<div class="group full">
<label>Benefits</label>
<textarea id="benefits"></textarea>
</div>

</div>


<button class="primary save">
 <i class="fa fa-save"></i>
 Save Scholarship
</button>

</form>

</div>
</div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
 FIREBASE
========================= */

const firebaseConfig={
 apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
 authDomain:"let-s-study-pro-course.firebaseapp.com",
 databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
 projectId:"let-s-study-pro-course",
 storageBucket:
  "let-s-study-pro-course.firebasestorage.app",
 messagingSenderId:"474928293390",
 appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
 measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* =========================
 STATE
========================= */

let scholarships=[];
let editingId=null;


/* =========================
 DOM
========================= */

const list=
 document.getElementById("list");

const modal=
 document.getElementById("modal");

const form=
 document.getElementById("form");


/* =========================
 ESCAPE
========================= */

function esc(v=""){

 return String(v)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");

}


/* =========================
 LOAD
========================= */

async function loadScholarships(){

 try{

   const snap=
    await getDocs(
     collection(
      db,
      "scholarships"
     )
    );


   scholarships=[];


   snap.forEach(x=>{

     scholarships.push({
       id:x.id,
       ...x.data()
     });

   });


   updateStats();
   render();

 }catch(error){

   console.error(error);

   list.innerHTML=`
    <div class="empty">
     Failed to load scholarships.
    </div>
   `;

 }

}


/* =========================
 STATS
========================= */

function updateStats(){

 document.getElementById("total")
 .textContent=
 scholarships.length;


 document.getElementById("published")
 .textContent=
 scholarships.filter(
  x=>x.status==="published"
 ).length;


 document.getElementById("featured")
 .textContent=
 scholarships.filter(
  x=>x.featured===true
 ).length;


 document.getElementById("views")
 .textContent=
 scholarships
 .reduce(
  (sum,x)=>sum+Number(x.views||0),
  0
 )
 .toLocaleString();

}


/* =========================
 RENDER
========================= */

function render(){

 const keyword=
  document.getElementById("search")
  .value
  .toLowerCase()
  .trim();


 const filter=
  document.getElementById("statusFilter")
  .value;


 const data=
 scholarships.filter(x=>{

   const text=`
    ${x.title||""}
    ${x.university||""}
    ${x.country||""}
    ${x.category||""}
    ${x.studyArea||""}
   `.toLowerCase();


   return(
     text.includes(keyword)
     &&
     (!filter || x.status===filter)
   );

 });


 if(!data.length){

   list.innerHTML=`
    <div class="empty">
     <i class="fa fa-graduation-cap"></i>
     <p>No scholarships found.</p>
    </div>
   `;

   return;

 }


 data.sort(
  (a,b)=>
   Number(b.featured||false)
   -
   Number(a.featured||false)
 );


 list.innerHTML=
 data.map(x=>`

 <article class="card">

  <div class="image">

   <img
    src="${esc(
     x.imageUrl||
     "https://via.placeholder.com/700x400?text=Scholarship"
    )}"
    alt="${esc(x.title)}"
   >

   ${
    x.featured
    ?
    `<span class="featured">
      ★ Featured
     </span>`
    :
    ""
   }

  </div>


  <div class="body">

   <div class="university">
    ${esc(x.university||"Scholarship")}
   </div>


   <h3>
    ${esc(x.title||"Untitled")}
   </h3>


   <p class="muted">
    ${esc(
     x.shortDescription||
     x.description||
     ""
    )}
   </p>


   <div class="tags">

    ${
     x.country
     ?
     `<span class="tag">
       ${esc(x.country)}
      </span>`
     :
     ""
    }

    ${
     x.level
     ?
     `<span class="tag">
       ${esc(x.level)}
      </span>`
     :
     ""
    }

    ${
     x.fundingType
     ?
     `<span class="tag">
       ${esc(x.fundingType)}
      </span>`
     :
     ""
    }

    <span class="status ${
      x.status==="published"
      ?"published"
      :"draft"
    }">
      ${esc(x.status||"draft")}
    </span>

   </div>


   ${
    x.deadline
    ?
    `<p class="muted">
      <i class="fa fa-calendar"></i>
      Deadline: ${esc(formatDate(x.deadline))}
     </p>`
    :
    ""
   }


   <p class="muted">
    <i class="fa fa-eye"></i>
    ${Number(x.views||0).toLocaleString()}
    views
   </p>


   <div class="actions">

    <button
     class="light"
     onclick="editScholarship('${x.id}')">
     <i class="fa fa-edit"></i>
     Edit
    </button>

    <button
     class="primary"
     onclick="togglePublish('${x.id}')">
     <i class="fa fa-toggle-on"></i>
    </button>

    <button
     class="danger"
     onclick="deleteScholarship('${x.id}')">
     <i class="fa fa-trash"></i>
    </button>

   </div>

  </div>

 </article>

 `).join("");

}


/* =========================
 DATE
========================= */

function formatDate(value){

 if(!value)return"";

 const d=new Date(value);

 if(isNaN(d.getTime()))
  return value;

 return d.toLocaleDateString(
  "en-GB",
  {
   day:"2-digit",
   month:"short",
   year:"numeric"
  }
 );

}


/* =========================
 SEARCH
========================= */

document
 .getElementById("search")
 .addEventListener(
  "input",
  render
 );


document
 .getElementById("statusFilter")
 .addEventListener(
  "change",
  render
 );


/* =========================
 ADD
========================= */

document
 .getElementById("addBtn")
 .onclick=()=>{

   editingId=null;

   form.reset();

   document.getElementById("status")
   .value="draft";

   document.getElementById("featured")
   .value="false";

   document.getElementById("currency")
   .value="USD";

   document.getElementById("modalTitle")
   .textContent=
    "Add Scholarship";

   modal.classList.add("show");

 };


/* =========================
 CLOSE
========================= */

document
 .getElementById("close")
 .onclick=()=>{

   modal.classList.remove("show");

 };


/* =========================
 SAVE
========================= */

form.onsubmit=async e=>{

 e.preventDefault();


 const data={

   title:
    document.getElementById("title")
    .value.trim(),

   slug:
    document.getElementById("slug")
    .value.trim(),

   description:
    document.getElementById("description")
    .value.trim(),

   shortDescription:
    document.getElementById("shortDescription")
    .value.trim(),

   university:
    document.getElementById("university")
    .value.trim(),

   country:
    document.getElementById("country")
    .value.trim(),

   location:
    document.getElementById("location")
    .value.trim(),

   level:
    document.getElementById("level")
    .value,

   fundingType:
    document.getElementById("fundingType")
    .value,

   amount:
    Number(
     document.getElementById("amount")
     .value||0
    ),

   currency:
    document.getElementById("currency")
    .value.trim(),

   deadline:
    document.getElementById("deadline")
    .value,

   studyArea:
    document.getElementById("studyArea")
    .value.trim(),

   category:
    document.getElementById("category")
    .value.trim(),

   requirements:
    document.getElementById("requirements")
    .value.trim(),

   benefits:
    document.getElementById("benefits")
    .value.trim(),

   applicationUrl:
    document.getElementById("applicationUrl")
    .value.trim(),

   imageUrl:
    document.getElementById("imageUrl")
    .value.trim(),

   status:
    document.getElementById("status")
    .value,

   featured:
    document.getElementById("featured")
    .value==="true",

   updatedAt:
    serverTimestamp()

 };


 try{

   if(editingId){

     await updateDoc(
       doc(
        db,
        "scholarships",
        editingId
       ),
       data
     );

   }else{

     data.views=0;

     data.createdAt=
      serverTimestamp();

     data.publishedAt=
      data.status==="published"
      ?serverTimestamp()
      :null;


     await addDoc(
      collection(
       db,
       "scholarships"
      ),
      data
     );

   }


   modal.classList.remove("show");

   await loadScholarships();


 }catch(error){

   console.error(error);

   alert(
    "Unable to save scholarship."
   );

 }

};


/* =========================
 EDIT
========================= */

window.editScholarship=id=>{

 const x=
  scholarships.find(
   item=>item.id===id
  );

 if(!x)return;

 editingId=id;


 const fields=[

  "title",
  "slug",
  "description",
  "shortDescription",
  "university",
  "country",
  "location",
  "level",
  "fundingType",
  "amount",
  "currency",
  "deadline",
  "studyArea",
  "category",
  "requirements",
  "benefits",
  "applicationUrl",
  "imageUrl",
  "status"

 ];


 fields.forEach(key=>{

   const el=
    document.getElementById(key);

   if(el)
    el.value=x[key]??"";

 });


 document.getElementById("featured")
 .value=x.featured
 ?"true"
 :"false";


 document.getElementById("modalTitle")
 .textContent=
  "Edit Scholarship";


 modal.classList.add("show");

};


/* =========================
 PUBLISH / DRAFT
========================= */

window.togglePublish=async id=>{

 const x=
  scholarships.find(
   item=>item.id===id
  );

 if(!x)return;


 const newStatus=
  x.status==="published"
  ?"draft"
  :"published";


 try{

   await updateDoc(
    doc(
     db,
     "scholarships",
     id
    ),
    {
      status:newStatus,

      publishedAt:
       newStatus==="published"
       ?serverTimestamp()
       :x.publishedAt||null,

      updatedAt:
       serverTimestamp()
    }
   );


   await loadScholarships();

 }catch(error){

   console.error(error);

   alert(
    "Unable to update status."
   );

 }

};


/* =========================
 DELETE
========================= */

window.deleteScholarship=async id=>{

 if(!confirm(
  "Delete this scholarship permanently?"
 ))return;


 try{

   await deleteDoc(
    doc(
     db,
     "scholarships",
     id
    )
   );


   await loadScholarships();

 }catch(error){

   console.error(error);

   alert(
    "Unable to delete scholarship."
   );

 }

};


/* =========================
 START
========================= */

loadScholarships();

</script>

</body>
</html>
