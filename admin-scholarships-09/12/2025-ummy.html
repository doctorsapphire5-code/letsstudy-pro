<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Scholarships | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:#fff;
  padding:16px 20px;
}

.header-inner{
  max-width:1500px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:700;
}

.back{
  color:#fff;
  text-decoration:none;
  font-size:14px;
}

main{
  max-width:1500px;
  margin:auto;
  padding:25px 18px 60px;
}

.page-title{
  margin-bottom:22px;
}

.page-title h1{
  margin:0 0 6px;
  font-size:28px;
}

.page-title p{
  margin:0;
  color:#667085;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.stat-label{
  color:#667085;
  font-size:13px;
  margin-bottom:8px;
}

.stat-value{
  font-size:28px;
  font-weight:700;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:22px;
  margin-bottom:22px;
  box-shadow:0 4px 15px rgba(0,0,0,.04);
}

.card-title{
  margin:0 0 20px;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
}

input,
select,
textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid #d0d5dd;
  border-radius:9px;
  outline:none;
  font-size:14px;
  color:#172033;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

textarea{
  min-height:130px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:700;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-secondary{
  background:#eef2f7;
  color:#172033;
}

.btn-warning{
  background:#f59e0b;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}

.btn-success{
  background:#16a34a;
  color:#fff;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.toolbar input{
  flex:1;
  min-width:230px;
}

.toolbar select{
  width:auto;
  min-width:160px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1150px;
}

th,
td{
  padding:13px 12px;
  border-bottom:1px solid #eaecf0;
  text-align:left;
  font-size:13px;
  vertical-align:middle;
}

th{
  background:#f9fafb;
  font-weight:700;
}

.scholarship-cell{
  display:flex;
  align-items:center;
  gap:10px;
  max-width:340px;
}

.scholarship-cell img{
  width:58px;
  height:45px;
  object-fit:cover;
  border-radius:7px;
  flex-shrink:0;
}

.scholarship-name{
  font-weight:700;
}

.scholarship-university{
  color:#667085;
  font-size:11px;
  margin-top:4px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.badge-published{
  background:#dcfce7;
  color:#166534;
}

.badge-draft{
  background:#fef3c7;
  color:#92400e;
}

.badge-featured{
  background:#ede9fe;
  color:#6d28d9;
}

.badge-normal{
  background:#f3f4f6;
  color:#667085;
}

.row-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.row-actions button{
  padding:7px 9px;
  font-size:11px;
}

.alert{
  display:none;
  padding:13px 15px;
  border-radius:9px;
  margin-bottom:18px;
  font-size:14px;
}

.alert-success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.alert-error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.loading{
  text-align:center;
  padding:35px;
  color:#667085;
}

.empty{
  text-align:center;
  padding:35px;
  color:#667085;
}

.hidden{
  display:none!important;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

}

@media(max-width:500px){

  main{
    padding:20px 12px 50px;
  }

  .stats{
    gap:10px;
  }

  .stat{
    padding:15px;
  }

  .stat-value{
    font-size:22px;
  }

  .page-title h1{
    font-size:23px;
  }

}
</style>
</head>

<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,

from

/* =========================================================
   FIREBASE CONFIG
========================================================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* =========================================================
   ELEMENTS
========================================================= */

const form =
  document.getElementById(
    "scholarshipForm"
  );

const saveBtn =
  document.getElementById(
    "saveBtn"
  );

const clearBtn =
  document.getElementById(
    "clearBtn"
  );

const table =
  document.getElementById(
    "scholarshipTable"
  );

const loading =
  document.getElementById(
    "loading"
  );

const empty =
  document.getElementById(
    "empty"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const statusFilter =
  document.getElementById(
    "statusFilter"
  );

const countryFilter =
  document.getElementById(
    "countryFilter"
  );


let scholarships = [];


/* =========================================================
   HELPERS
========================================================= */

function $(id){

  return document.getElementById(id);

}


function slugify(text){

  return text
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");

}


function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showAlert(
  message,
  type="success"
){

  const box =
    $("alertBox");

  box.textContent =
    message;

  box.className =
    type === "success"
      ? "alert alert-success"
      : "alert alert-error";


  setTimeout(() => {

    box.className =
      "alert";

  },5000);

}


/* =========================================================
   AUTO SLUG
========================================================= */

$("title").addEventListener(
  "input",
  () => {

    if(
      !$("editId").value
    ){

      $("slug").value =
        slugify(
          $("title").value
        );

    }

  }
);


/* =========================================================
   SAVE / UPDATE
========================================================= */

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    try{

      saveBtn.disabled =
        true;

      saveBtn.textContent =
        "Saving...";


      const editId =
        $("editId").value;


      let slug =
        $("slug").value.trim();


      if(!slug){

        slug =
          slugify(
            $("title").value
          );

      }


      const status =
        $("status").value;


      const scholarshipData = {

        title:
          $("title").value.trim(),

        slug,

        description:
          $("description").value.trim(),

        shortDescription:
          $("shortDescription").value.trim(),

        university:
          $("university").value.trim(),

        country:
          $("country").value.trim(),

        location:
          $("location").value.trim(),

        level:
          $("level").value,

        fundingType:
          $("fundingType").value,

        amount:
          Number(
            $("amount").value
          ) || 0,

        currency:
          $("currency").value,

        deadline:
          $("deadline").value,

        studyArea:
          $("studyArea").value.trim(),

        category:
          $("category").value,

        requirements:
          $("requirements").value.trim(),

        benefits:
          $("benefits").value.trim(),

        applicationUrl:
          $("applicationUrl").value.trim(),

        imageUrl:
          $("imageUrl").value.trim(),

        status,

        featured:
          $("featured").value === "Yes",

        updatedAt:
          serverTimestamp()

      };


      /* =========================
         CREATE
      ========================== */

      if(!editId){

        scholarshipData.views =
          0;

                scholarshipData.createdAt =
          serverTimestamp();

        scholarshipData.publishedAt =
          status === "Published"
            ? serverTimestamp()
            : null;


        const result =
          await addDoc(
            collection(
              db,
              "scholarships"
            ),
            scholarshipData
          );


        console.log(
          "Scholarship created:",
          result.id
        );


        showAlert(
          "✅ Scholarship saved successfully!"
        );

      }


      /* =========================
         UPDATE EXISTING
      ========================== */

      else{

        const scholarshipRef =
          doc(
            db,
            "scholarships",
            editId
          );


        /*
         * Preserve publishedAt when
         * editing an already published
         * scholarship.
         */

        const updateData = {

          ...scholarshipData,

          updatedAt:
            serverTimestamp()

        };


        if(
          status === "Published"
        ){

          if(
            itemBeingEdited &&
            itemBeingEdited.publishedAt
          ){

            updateData.publishedAt =
              itemBeingEdited.publishedAt;

          }else{

            updateData.publishedAt =
              serverTimestamp();

          }

        }else{

          updateData.publishedAt =
            null;

        }


        await updateDoc(
          scholarshipRef,
          updateData
        );


        showAlert(
          "✅ Scholarship updated successfully!"
        );

      }


      /* =========================
         RESET FORM
      ========================== */

      resetForm();


      /* =========================
         RELOAD DATA
      ========================== */

      await loadScholarships();


    }catch(error){

      console.error(
        "SCHOLARSHIP SAVE ERROR:",
        error
      );


      showAlert(
        "❌ Failed to save scholarship: " +
        error.message,
        "error"
      );

    }finally{

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "Save Scholarship";

    }

  }
);


/* =========================================================
   LOAD SCHOLARSHIPS
========================================================= */

async function loadScholarships(){

  loading.classList.remove(
    "hidden"
  );


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "scholarships"
        )
      );


    scholarships =
      snapshot.docs.map(
        scholarship => ({

          id:
            scholarship.id,

          ...scholarship.data()

        })
      );


    scholarships.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    updateStats();

    updateCountryFilter();

    renderTable();

  }catch(error){

    console.error(
      "LOAD SCHOLARSHIPS ERROR:",
      error
    );


    showAlert(
      "❌ Failed to load scholarships: " +
      error.message,
      "error"
    );

  }finally{

    loading.classList.add(
      "hidden"
    );

  }

}


/* =========================================================
   UPDATE STATISTICS
========================================================= */

function updateStats(){

  const total =
    scholarships.length;


  const published =
    scholarships.filter(
      scholarship =>
        scholarship.status ===
        "Published"
    ).length;


  const drafts =
    scholarships.filter(
      scholarship =>
        scholarship.status ===
        "Draft"
    ).length;


  const featured =
    scholarships.filter(
      scholarship =>
        scholarship.featured === true
    ).length;


  $("totalCount").textContent =
    total;


  $("publishedCount").textContent =
    published;


  $("draftCount").textContent =
    drafts;


  $("featuredCount").textContent =
    featured;

}


/* =========================================================
   COUNTRY FILTER
========================================================= */

function updateCountryFilter(){

  const selected =
    countryFilter.value;


  const countries =
    [
      ...new Set(
        scholarships
          .map(
            scholarship =>
              scholarship.country
          )
          .filter(Boolean)
      )
    ]
    .sort();


  countryFilter.innerHTML =
    `
      <option value="">
        All Countries
      </option>
    `;


  countries.forEach(
    country => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        country;


      option.textContent =
        country;


      countryFilter.appendChild(
        option
      );

    }
  );


  countryFilter.value =
    selected;

}


/* =========================================================
   RENDER SCHOLARSHIP TABLE
========================================================= */

function renderTable(){

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  const selectedStatus =
    statusFilter.value;


  const selectedCountry =
    countryFilter.value;


  const filtered =
    scholarships.filter(
      scholarship => {

        const searchText =
          `
            ${scholarship.title || ""}
            ${scholarship.university || ""}
            ${scholarship.country || ""}
            ${scholarship.category || ""}
            ${scholarship.studyArea || ""}
          `
          .toLowerCase();


        const matchesSearch =
          !search ||
          searchText.includes(
            search
          );


        const matchesStatus =
          !selectedStatus ||
          scholarship.status ===
            selectedStatus;


        const matchesCountry =
          !selectedCountry ||
          scholarship.country ===
            selectedCountry;


        return (
          matchesSearch &&
          matchesStatus &&
          matchesCountry
        );

      }
    );


  table.innerHTML =
    "";


  if(
    filtered.length === 0
  ){

    empty.classList.remove(
      "hidden"
    );

    return;

  }


  empty.classList.add(
    "hidden"
  );


  filtered.forEach(
    scholarship => {

      const row =
        document.createElement(
          "tr"
        );


      const image =
        scholarship.imageUrl
          ? `
            <img
              src="${escapeHTML(
                scholarship.imageUrl
              )}"
              alt="${escapeHTML(
                scholarship.title ||
                "Scholarship"
              )}"
              onerror="
                this.style.display='none'
              "
            >
          `
          : "";


      const statusBadge =
        scholarship.status ===
        "Published"

          ? `
            <span class="
              badge
              badge-published
            ">
              Published
            </span>
          `

          : `
            <span class="
              badge
              badge-draft
            ">
              Draft
            </span>
          `;


      const featuredBadge =
        scholarship.featured === true

          ? `
            <span class="
              badge
              badge-featured
            ">
              Yes
            </span>
          `

          : `
            <span class="
              badge
              badge-normal
            ">
              No
            </span>
          `;


      row.innerHTML = `

        <td>

          <div
            class="scholarship-cell"
          >

            ${image}

            <div>

              <div
                class="scholarship-name"
              >
                ${escapeHTML(
                  scholarship.title ||
                  "Untitled Scholarship"
                )}
              </div>

              <div
                class="scholarship-university"
              >
                ${escapeHTML(
                  scholarship.university ||
                  ""
                )}
              </div>

            </div>

          </div>

        </td>


        <td>
          ${escapeHTML(
            scholarship.country ||
            "—"
          )}
        </td>


        <td>
          ${escapeHTML(
            scholarship.level ||
            "—"
          )}
        </td>


        <td>
          ${escapeHTML(
            scholarship.deadline ||
            "—"
          )}
        </td>


        <td>
          ${statusBadge}
        </td>


        <td>
          ${featuredBadge}
        </td>


        <td>
          ${Number(
            scholarship.views || 0
          ).toLocaleString()}
        </td>


        <td>

          <div
            class="row-actions"
          >

            <button
              class="btn-warning"
              data-action="edit"
              data-id="${scholarship.id}"
            >
              Edit
            </button>


            <button
              class="btn-success"
              data-action="toggle-status"
              data-id="${scholarship.id}"
            >
              ${
                scholarship.status ===
                "Published"
                  ? "Draft"
                  : "Publish"
              }
            </button>


            <button
              class="btn-secondary"
              data-action="toggle-featured"
              data-id="${scholarship.id}"
            >
              ${
                scholarship.featured
                  ? "Unfeature"
                  : "Feature"
              }
            </button>


            <button
              class="btn-danger"
              data-action="delete"
              data-id="${scholarship.id}"
            >
              Delete
            </button>

          </div>

        </td>

      `;


      table.appendChild(
        row
      );

    }
  );

}


/* =========================================================
   TABLE ACTIONS
========================================================= */

table.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "button"
      );


    if(!button)
      return;


    const id =
      button.dataset.id;


    const action =
      button.dataset.action;


    const scholarship =
      scholarships.find(
        item =>
          item.id === id
      );


    if(!scholarship)
      return;


    if(
      action === "edit"
    ){

      editScholarship(
        scholarship
      );

      return;

    }


    if(
      action ===
      "toggle-status"
    ){

      await toggleStatus(
        scholarship
      );

      return;

    }


    if(
      action ===
      "toggle-featured"
    ){

      await toggleFeatured(
        scholarship
      );

      return;

    }


    if(
      action === "delete"
    ){

      await deleteScholarship(
        scholarship
      );

    }

  }
);


/* =========================================================
   EDIT SCHOLARSHIP
========================================================= */

function editScholarship(
  scholarship
){

  itemBeingEdited =
    scholarship;


  $("editId").value =
    scholarship.id;


  $("title").value =
    scholarship.title || "";


  $("slug").value =
    scholarship.slug || "";


  $("university").value =
    scholarship.university || "";


  $("country").value =
    scholarship.country || "";


  $("location").value =
    scholarship.location || "";


  $("deadline").value =
    scholarship.deadline || "";


  $("level").value =
    scholarship.level || "";


  $("fundingType").value =
    scholarship.fundingType || "";


  $("amount").value =
    scholarship.amount ?? "";


  $("currency").value =
    scholarship.currency || "USD";


  $("studyArea").value =
    scholarship.studyArea || "";


  $("category").value =
    scholarship.category ||
    "University Scholarship";


  $("status").value =
    scholarship.status ||
    "Draft";


  $("featured").value =
    scholarship.featured
      ? "Yes"
      : "No";


  $("applicationUrl").value =
    scholarship.applicationUrl ||
    "";


  $("imageUrl").value =
    scholarship.imageUrl ||
    "";


  $("shortDescription").value =
    scholarship.shortDescription ||
    "";


  $("description").value =
    scholarship.description ||
    "";


  $("requirements").value =
    scholarship.requirements ||
    "";


  $("benefits").value =
    scholarship.benefits ||
    "";


  $("formTitle").textContent =
    "✏️ Edit Scholarship";


  saveBtn.textContent =
    "Update Scholarship";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================================================
   TOGGLE STATUS
========================================================= */

async function toggleStatus(
  scholarship
){

  try{

    const newStatus =
      scholarship.status ===
      "Published"

        ? "Draft"

        : "Published";


    const data = {

      status:
        newStatus,

      updatedAt:
        serverTimestamp(),

      publishedAt:
        newStatus ===
        "Published"

          ? (
              scholarship.publishedAt ||
              serverTimestamp()
            )

          : null

    };


    await updateDoc(

      doc(
        db,
        "scholarships",
        scholarship.id
      ),

      data

    );


    showAlert(
      newStatus ===
      "Published"

        ? "✅ Scholarship published successfully."

        : "✅ Scholarship moved to Draft."
    );


    await loadScholarships();

  }catch(error){

    console.error(
      error
    );


    showAlert(
      "❌ " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   TOGGLE FEATURED
========================================================= */

async function toggleFeatured(
  scholarship
){

  try{

    await updateDoc(

      doc(
        db,
        "scholarships",
        scholarship.id
      ),

      {

        featured:
          !scholarship.featured,

        updatedAt:
          serverTimestamp()

      }

    );


    showAlert(

      scholarship.featured

        ? "Scholarship removed from Featured."

        : "⭐ Scholarship added to Featured."

    );


    await loadScholarships();

  }catch(error){

    console.error(
      error
    );


    showAlert(
      "❌ " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   DELETE SCHOLARSHIP
========================================================= */

async function deleteScholarship(
  scholarship
){

  const confirmed =
    confirm(
      "Are you sure you want to delete this scholarship?\n\n" +
      scholarship.title
    );


  if(!confirmed)
    return;


  try{

    await deleteDoc(

      doc(
        db,
        "scholarships",
        scholarship.id
      )

    );


    showAlert(
      "✅ Scholarship deleted successfully."
    );


    await loadScholarships();

  }catch(error){

    console.error(
      error
    );


    showAlert(
      "❌ " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm(){

  form.reset();


  $("editId").value =
    "";


  $("currency").value =
    "USD";


  $("status").value =
    "Draft";


  $("featured").value =
    "No";


  $("formTitle").textContent =
    "➕ Add Scholarship";


  saveBtn.textContent =
    "Save Scholarship";


  itemBeingEdited =
    null;

}


clearBtn.addEventListener(
  "click",
  resetForm
);


/* =========================================================
   SEARCH & FILTER EVENTS
========================================================= */

searchInput.addEventListener(
  "input",
  renderTable
);


statusFilter.addEventListener(
  "change",
  renderTable
);


countryFilter.addEventListener(
  "change",
  renderTable
);


/* =========================================================
   START
========================================================= */

loadScholarships();

</script>

</body>
</html>
