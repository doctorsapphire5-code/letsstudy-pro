<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Scholarships | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:#fff;
  padding:16px 5%;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#38bdf8;
}

.back{
  color:white;
  text-decoration:none;
  font-size:14px;
}

.container{
  width:min(1250px,94%);
  margin:30px auto;
}

.page-title{
  margin-bottom:25px;
}

.page-title h1{
  margin:0 0 7px;
}

.page-title p{
  margin:0;
  color:#64748b;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.stat strong{
  display:block;
  font-size:27px;
  margin-top:5px;
}

.stat span{
  color:#64748b;
  font-size:13px;
}

.panel{
  background:white;
  border-radius:15px;
  padding:22px;
  margin-bottom:25px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.panel h2{
  margin-top:0;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-weight:bold;
  font-size:13px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d8dee8;
  border-radius:9px;
  padding:12px;
  font:inherit;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e2e8f0;
  color:#172033;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.warning{
  background:#fef3c7;
  color:#92400e;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.toolbar{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,
td{
  padding:13px;
  border-bottom:1px solid #edf0f5;
  text-align:left;
  vertical-align:top;
  font-size:13px;
}

th{
  background:#f8fafc;
}

.title-cell{
  font-weight:bold;
  max-width:260px;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.published{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#e2e8f0;
  color:#475569;
}

.featured{
  background:#fef3c7;
  color:#92400e;
}

.not-featured{
  background:#f1f5f9;
  color:#64748b;
}

.row-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.row-actions button{
  padding:7px 9px;
  font-size:11px;
}

.hidden{
  display:none!important;
}

.empty{
  text-align:center;
  padding:45px;
  color:#64748b;
}

.message{
  padding:12px;
  border-radius:9px;
  margin-bottom:15px;
  display:none;
}

.message.success-msg{
  background:#dcfce7;
  color:#166534;
}

.message.error-msg{
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid,
  .toolbar{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      LetsStudy <span>Pro</span>
    </div>

    <a
      class="back"
      href="admin.html"
    >
      ← Back to Admin
    </a>

  </div>
</header>


<main class="container">

  <div class="page-title">
    <h1>🎓 Admin Scholarships</h1>
    <p>
      Create and manage scholarship opportunities.
    </p>
  </div>


  <!-- STATS -->

  <section class="stats">

    <div class="stat">
      <span>Total</span>
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat">
      <span>Published</span>
      <strong id="publishedCount">0</strong>
    </div>

    <div class="stat">
      <span>Drafts</span>
      <strong id="draftCount">0</strong>
    </div>

    <div class="stat">
      <span>Featured</span>
      <strong id="featuredCount">0</strong>
    </div>

  </section>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- FORM -->

  <section class="panel">

    <h2 id="formTitle">
      ➕ Add Scholarship
    </h2>

    <form id="scholarshipForm">

      <input
        type="hidden"
        id="scholarshipId"
      >


      <div class="form-grid">

        <div class="field full">
          <label>

          </label>

          <input
            id="title"
            required
            placeholder="Fully Funded Scholarship 2027"
          >
        </div>


        <div class="field">
          <label>Slug</label>

          <input
            id="slug"
            placeholder="auto-generated"
          >
        </div>


        <div class="field">
          <label>
            University / Provider
          </label>

          <input
            id="university"
            placeholder="University / Government / Organization"
          >
        </div>


        <div class="field">
          <label>Country</label>

          <input
            id="country"
            placeholder="South Korea"
          >
        </div>


        <div class="field">
          <label>Location</label>

          <input
            id="location"
            placeholder="Seoul, South Korea"
          >
        </div>


        <div class="field">
          <label>Deadline</label>

          <input
            id="deadline"
            type="date"
          >
        </div>


        <div class="field">
          <label>Study Level</label>

          <select id="level">

            <option value="">
              Select Level
            </option>

            <option>
              Undergraduate
            </option>

            <option>
              Masters
            </option>

            <option>
              Doctoral
            </option>

            <option>
              Postdoctoral
            </option>

            <option>
              Certificate
            </option>

          </select>
        </div>


        <div class="field">
          <label>Funding Type</label>

          <select id="fundingType">

            <option value="">
              Select Funding
            </option>

            <option>
              Fully Funded
            </option>

            <option>
              Partial Funding
            </option>

            <option>
              Tuition Only
            </option>

            <option>
              Stipend
            </option>

          </select>
        </div>


        <div class="field">
          <label>Amount</label>

          <input
            id="amount"
            placeholder="10000 / Fully Funded"
          >
        </div>


        <div class="field">
          <label>Currency</label>

          <select id="currency">

            <option>
              USD
            </option>

            <option>
              EUR

            <option>
              GBP

            <option>

            <option>
              KRW

              TZS

          </select>

        </div>


        <div class="field">
          <label>Study Area</label>

          <input
            id="studyArea"
            placeholder="Engineering, Medicine, Business..."
          >
        </div>


        <div class="field">
          <label>Category</label>

          <input
            id="category"
            placeholder="Government, University, International..."
          >
        </div>


        <div class="field">
          <label>Status</label>

          <select id="status">

            <option value="draft">
              Draft
            </option>

            <option value="published">
              Published
            </option>

          </select>

        </div>


        <div class="field">
          <label>Featured</label>

          <select id="featured">

            <option value="false">
              No
            </option>

            <option value="true">
              Yes
            </option>

          </select>

        </div>


        <div class="field full">
          <label>
            Scholarship URL
          </label>

          <input
            id="scholarshipUrl"
            type="url"
            placeholder="https://..."
          >
        </div>


        <div class="field full">
          <label>
            Application URL
          </label>

          <input
            id="applicationUrl"
            type="url"
            placeholder="https://..."
          >
        </div>


        <div class="field full">
          <label>
            Image URL
          </label>

          <input
            id="imageUrl"
            type="url"
            placeholder="https://..."
          >
        </div>


        <div class="field full">
          <label>
            Short Description
          </label>

          <textarea
            id="shortDescription"
            placeholder="Short scholarship summary..."
          ></textarea>
        </div>


        <div class="field full">
          <label>
            Description *
          </label>

          <textarea
            id="description"
            required
            placeholder="Full scholarship description..."
          ></textarea>
        </div>


        <div class="field full">
          <label>
            Eligibility / Requirements
          </label>

          <textarea
            id="requirements"
            placeholder="One requirement per line"
          ></textarea>
        </div>


        <div class="field full">
          <label>
            Benefits
          </label>

          <textarea
            id="benefits"
            placeholder="Tuition, accommodation, airfare..."

        </div>

      </div>


      <div class="actions">

        <button
          type="submit"
          class="primary"
          id="saveBtn"
        >
          Save Scholarship
        </button>

        <button
          type="button"
          class="secondary"
          id="clearBtn"
        >
          Clear
        </button>

      </div>

    </form>

  </section>


  <!-- LIST -->

  <section class="panel">

    <h2>🔎 Scholarships</h2>


    <div class="toolbar">

      <input
        id="search"
        placeholder="Search scholarships..."
      >

      <select id="statusFilter">

        <option value="">
          All Status
        </option>

        <option value="published">
          Published
        </option>

        <option value="draft">
          Draft
        </option>

      </select>


      <select id="countryFilter">

        <option value="">
          All Countries
        </option>

      </select>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Scholarship</th>

            <th>Country</th>

            <th>Level</th>

            <th>Deadline</th>

            <th>Status</th>

            <th>Featured</th>

            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="scholarshipTable">

          <tr>

            <td
              colspan="7"
              class="empty"
            >
              Loading scholarships...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "scholarshipForm"
  );

const table =
  document.getElementById(
    "scholarshipTable"
  );

const search =
  document.getElementById(
    "search"
  );

const statusFilter =
  document.getElementById(
    "statusFilter"
  );

const countryFilter =
  document.getElementById(
    "countryFilter"
  );

const message =
  document.getElementById(
    "message"
  );


let scholarships = [];


/* =========================
   HELPERS
========================= */

function value(id){

  return document
    .getElementById(id)
    .value
    .trim();

}


function setValue(
  id,
  value
){

  document
    .getElementById(id)
    .value =
      value ?? "";

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function slugify(text){

  return String(text || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");

}


function showMessage(
  text,
  type="success-msg"
){

  message.textContent =
    text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

  setTimeout(() => {

    message.style.display =
      "none";

  },4000);

}


function formatDate(value){

  if(!value)
    return "—";

  let date;

  if(
    typeof value === "object" &&
    value.toDate
  ){

    date =
      value.toDate();

  }
  else{

    date =
      new Date(value);

  }

  if(
    isNaN(date.getTime())
  ){

    return String(value);

  }

  return date.toLocaleDateString(
    "en-US",
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );

}


/* =========================
   LOAD
========================= */

async function loadScholarships(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "scholarships"
        )
      );


    scholarships = [];


    snapshot.forEach(item => {

      scholarships.push({

        id:item.id,

        ...item.data()

      });

    });


    buildCountryFilter();

    updateStats();

    renderTable();

  }
  catch(error){

    console.error(error);

    table.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Unable to load scholarships.
        </td>
      </tr>
    `;

    showMessage(
      "Failed to load scholarships.",
      "error-msg"
    );

  }

}


/* =========================
   COUNTRY FILTER
========================= */

function buildCountryFilter(){

  const current =
    countryFilter.value;

  countryFilter.innerHTML = `
    <option value="">
      All Countries
    </option>
  `;


  const countries =
    [...new Set(

      scholarships
        .map(item => item.country)
        .filter(Boolean)

    )]
    .sort();


  countries.forEach(country => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      country;

    option.textContent =
      country;

    countryFilter.appendChild(
      option
    );

  });


  countryFilter.value =
    current;

}


/* =========================
   STATS
========================= */

function updateStats(){

  const total =
    scholarships.length;

  const published =
    scholarships.filter(
      item =>
        item.status ===
        "published"
    ).length;

  const drafts =
    scholarships.filter(
      item =>
        item.status ===
        "draft"
    ).length;

  const featured =
    scholarships.filter(
      item =>
        item.featured === true
    ).length;


  document.getElementById(
    "totalCount"
  ).textContent =
    total;

  document.getElementById(
    "publishedCount"
  ).textContent =
    published;

  document.getElementById(
    "draftCount"
  ).textContent =
    drafts;

  document.getElementById(
    "featuredCount"
  ).textContent =
    featured;

}


/* =========================
   RENDER
========================= */

function renderTable(){

  const query =
    search.value
      .toLowerCase()
      .trim();

  const status =
    statusFilter.value;

  const country =
    countryFilter.value;


  const filtered =
    scholarships.filter(item => {

      const text = [

        item.title,
        item.university,
        item.country,
        item.level,
        item.category,
        item.studyArea

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      return (

        (!query ||
          text.includes(query))

        &&

        (!status ||
          item.status === status)

        &&

        (!country ||
          item.country === country)

      );

    });


  if(!filtered.length){

    table.innerHTML = `
      <tr>
        <td
          colspan="7"
          class="empty"
        >
          No scholarships found.
        </td>
      </tr>
    `;

    return;

  }


  table.innerHTML = "";


  filtered.forEach(item => {

    const row =
      document.createElement(
        "tr"
      );


    row.innerHTML = `

      <td class="title-cell">

        ${escapeHtml(
          item.title ||
          "Untitled"
        )}

        ${
          item.university
            ? `
              <br>
              <small>
                ${escapeHtml(
                  item.university
                )}
              </small>
            `
            : ""
        }

      </td>


      <td>
        ${escapeHtml(
          item.country ||
          "—"
        )}
      </td>


      <td>
        ${escapeHtml(
          item.level ||
          "—"
        )}
      </td>


      <td>
        ${formatDate(
          item.deadline
        )}
      </td>


      <td>

        <span
          class="badge ${
            item.status ===
            "published"
              ? "published"
              : "draft"
          }"
        >

          ${
            item.status ===
            "published"
              ? "Published"
              : "Draft"
          }

        </span>

      </td>


      <td>

        <span
          class="badge ${
            item.featured
              ? "featured"
              : "not-featured"
          }"
        >

          ${
            item.featured
              ? "⭐ Featured"
              : "No"
          }

        </span>

      </td>


      <td>

        <div class="row-actions">

          <button
            class="secondary"
            data-action="edit"
            data-id="${item.id}"
          >
            ✏ Edit
          </button>


          <button
            class="${
              item.status ===
              "published"
                ? "warning"
                : "success"
            }"
            data-action="publish"
            data-id="${item.id}"
          >

             ${
  item.status === "published"
    ? "Unpublish"
    : "Publish"
}
</button>

<button
  class="btn btn-feature"
  onclick="toggleFeatured('${item.id}', ${item.featured === true})"
>
  ${
    item.featured === true
      ? "Remove Featured"
      : "⭐ Feature"
  }
</button>

<button
  class="btn btn-danger"
  onclick="deleteScholarship('${item.id}')"
>
  🗑 Delete
</button>

</div>
</div>
`;
}

loading.style.display = "none";

if (!scholarships.length) {
  list.innerHTML = `
    <div class="empty">
      <div class="empty-icon">🎓</div>
      <h3>No scholarships found</h3>
      <p>
        Add your first scholarship or change
        the search filters.
      </p>
    </div>
  `;
  return;
}

list.innerHTML = scholarships
  .map(renderScholarship)
  .join("");

}

/* =========================
   SAVE SCHOLARSHIP
========================= */

saveBtn.addEventListener("click", async (e) => {

  e.preventDefault();

  try {

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    const scholarship = {

      title: titleInput.value.trim(),

      slug: slugInput.value.trim(),

      provider: providerInput.value.trim(),

      country: countryInput.value.trim(),

      location: locationInput.value.trim(),

      deadline: deadlineInput.value,

      studyLevel: studyLevelInput.value,

      fundingType: fundingTypeInput.value,

      amount: Number(amountInput.value) || 0,

      currency: currencyInput.value,

      studyArea: studyAreaInput.value.trim(),

      category: categoryInput.value,

      status: statusInput.value,

      featured: featuredInput.value === "Yes",

      scholarshipUrl: scholarshipUrlInput.value.trim(),

      applicationUrl: applicationUrlInput.value.trim(),

      imageUrl: imageUrlInput.value.trim(),

      shortDescription: shortDescriptionInput.value.trim(),

      description: descriptionInput.value.trim(),

      eligibility: eligibilityInput.value.trim(),

      benefits: benefitsInput.value.trim(),

      createdAt: serverTimestamp(),

      updatedAt: serverTimestamp()

    };

    console.log("Saving scholarship:", scholarship);

    const docRef = await addDoc(
      collection(db, "scholarships"),
      scholarship
    );

    console.log("Scholarship saved:", docRef.id);

    alert("✅ Scholarship saved successfully!");

    form.reset();

    await loadScholarships();

  } catch (error) {

    console.error("❌ Scholarship save error:", error);

    alert(
      "❌ Failed to save scholarship:\n\n" +
      error.code +
      "\n" +
      error.message
    );

  } finally {

    saveBtn.disabled = false;
    saveBtn.textContent = "Save Scholarship";

  }

});


/* =========================
   EDIT
========================= */

window.editScholarship = async function(id) {

  try {

    const snap = await getDoc(
      doc(db, "scholarships", id)
    );

    if (!snap.exists()) {
      alert("Scholarship not found.");
      return;
    }

    const item = {
      id: snap.id,
      ...snap.data()
    };

    document.getElementById(
      "scholarshipId"
    ).value = item.id;

    document.getElementById(
      "title"

    });

  } catch (error) {

    console.error(error);

    );

  }

};


/* =========================
   PUBLISH / UNPUBLISH
========================= */

window.toggleStatus = async function(
  id,
  currentStatus
) {

  const newStatus =
    currentStatus === "published"
      ? "draft"
      : "published";

  const confirmed = confirm(
    newStatus === "published"
      ? "Publish this scholarship?"
      : "Unpublish this scholarship?"
  );

  if (!confirmed) return;

  try {

    const updateData = {
      status: newStatus,
      updatedAt: serverTimestamp()
    };

    if (newStatus === "published") {
      updateData.publishedAt =
        serverTimestamp();
    }

    await updateDoc(
      doc(db, "scholarships", id),
      updateData
    );

    await loadScholarships();

  } catch (error) {

    console.error(error);

    alert(
      "Unable to change scholarship status."
    );

  }

};


/* =========================
   FEATURED
========================= */

window.toggleFeatured = async function(
  id,
  currentFeatured
) {

  try {

    await updateDoc(
      doc(db, "scholarships", id),
      {
        featured: !currentFeatured,
        updatedAt: serverTimestamp()
      }
    );

    await loadScholarships();

  } catch (error) {

    console.error(error);

    alert(
      "Unable to update featured status."
    );

  }

};


/* =========================
   DELETE
========================= */

window.deleteScholarship = async function(id) {

  const confirmed = confirm(
    "Delete this scholarship permanently?"
  );

  if (!confirmed) return;

  try {

    await deleteDoc(
      doc(db, "scholarships", id)
    );

    await loadScholarships();

  } catch (error) {

    console.error(error);

    alert(
      "Unable to delete scholarship."
    );

  }

};


/* =========================
   RESET FORM
========================= */

function resetForm() {

  form.reset();

  document.getElementById(
    "scholarshipId"
  ).value = "";

  document.getElementById(
    "currency"
  ).value = "USD";

  document.getElementById(
    "status"
  ).value = "draft";

  document.getElementById(
    "featured"
  ).value = "false";

  formTitle.textContent =
    "Add / Edit Scholarship";

  cancelBtn.style.display =
    "none";

}


/* =========================

cancelBtn.addEventListener(
