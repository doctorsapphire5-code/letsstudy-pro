<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Scholarships | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:#111827;
 color:#fff;
 padding:16px 5%;
 font-weight:700
}
main{
 max-width:1100px;
 margin:auto;
 padding:20px
}
.card,.item{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:16px;
 margin-bottom:15px
}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px
}
.stat{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:10px;
 padding:15px
}
.num{
 font-size:25px;
 font-weight:700;
 margin-top:5px
}
.form{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.full{grid-column:1/-1}
label{
 display:block;
 font-size:13px;
 font-weight:700;
 margin-bottom:4px
}
input,select,textarea{
 width:100%;
 padding:10px;
 border:1px solid #d1d5db;
 border-radius:7px;
 font-size:14px
}
textarea{min-height:100px}
button{
 border:0;
 border-radius:7px;
 padding:9px 12px;
 cursor:pointer
}
.blue{background:#2563eb;color:#fff}
.green{background:#16a34a;color:#fff}
.red{background:#dc2626;color:#fff}
.orange{background:#f59e0b;color:#fff}
.gray{background:#e5e7eb;color:#111827}
.toolbar{
 display:grid;
 grid-template-columns:2fr 1fr 1fr 1fr;
 gap:8px
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}
.item{margin:0}
.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 margin:3px
}
.published{
 background:#dcfce7;
 color:#166534
}
.draft{
 background:#e5e7eb;
 color:#374151
}
.featured{
 background:#fef3c7;
 color:#92400e
}
.actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin-top:12px
}
@media(max-width:750px){
 .stats,.grid{grid-template-columns:1fr 1fr}
 .form,.toolbar{grid-template-columns:1fr}
 .full{grid-column:auto}
}
@media(max-width:450px){
 .stats,.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
🎓 LetsStudy Pro — Admin Scholarships
</header>

<main>

<h1>Scholarship Management</h1>

<div class="stats">

<div class="stat">
Total
<div class="num" id="total">0</div>
</div>

<div class="stat">
Published
<div class="num" id="published">0</div>
</div>

<div class="stat">
Drafts
<div class="num" id="drafts">0</div>
</div>

<div class="stat">
Featured
<div class="num" id="featured">0</div>
</div>

</div>


<!-- ADD / EDIT -->

<div class="card">

<h2>➕ Add / Edit Scholarship</h2>

<form id="form">

<input type="hidden" id="id">

<div class="form">

<div class="full">
<label>Scholarship Title *</label>
<input id="title" required
placeholder="Fully Funded Scholarship 2026">
</div>

<div>
<label>Slug</label>
<input id="slug"
placeholder="auto-generated">
</div>

<div>
<label>Provider / Organization *</label>
<input id="provider" required
placeholder="University / Government / Organization">
</div>

<div>
<label>Country</label>
<input id="country"
placeholder="Canada">
</div>

<div>
<label>Deadline</label>
<input id="deadline" type="date">
</div>

<div>
<label>Amount</label>
<input id="amount"
placeholder="Fully Funded / 10000">
</div>

<div>
<label>Currency</label>
<select id="currency">
<option>USD</option>
<option>TZS</option>
<option>EUR</option>
<option>GBP</option>
<option>CAD</option>
</select>
</div>

<div>
<label>Study Level</label>
<select id="level">
<option>Undergraduate</option>
<option>Postgraduate</option>
<option>Masters</option>
<option>PhD</option>
<option>Diploma</option>
<option>Certificate</option>
<option>All Levels</option>
</select>
</div>

<div>
<label>Field of Study</label>
<input id="field"
placeholder="Engineering, Medicine, Business...">
</div>

<div>
<label>Study Mode</label>
<select id="mode">
<option>On Campus</option>
<option>Online</option>
<option>Hybrid</option>
<option>Any</option>
</select>
</div>

<div>
<label>Status</label>
<select id="status">
<option value="draft">Draft</option>
<option value="published">Published</option>
<option value="closed">Closed</option>
</select>
</div>

<div>
<label>Featured</label>
<select id="featured">
<option value="false">No</option>
<option value="true">Yes</option>
</select>
</div>

<div class="full">
<label>Scholarship URL</label>
<input id="url" type="url"
placeholder="https://...">
</div>

<div class="full">
<label>Application URL</label>
<input id="applicationUrl"
type="url"
placeholder="https://...">
</div>

<div class="full">
<label>Image URL</label>
<input id="image" type="url"
placeholder="https://...">
</div>

<div class="full">
<label>Short Description</label>
<textarea id="shortDescription"></textarea>
</div>

<div class="full">
<label>Description *</label>
<textarea id="description" required></textarea>
</div>

<div class="full">
<label>Eligibility / Requirements</label>
<textarea id="requirements"
placeholder="One requirement per line"></textarea>
</div>

<div class="full">
<label>Benefits</label>
<textarea id="benefits"
placeholder="Tuition, accommodation, airfare..."></textarea>
</div>

<div class="full">
<label>Tags</label>
<input id="tags"
placeholder="scholarship, fully funded, Canada">
</div>

</div>

<br>

<button class="blue">
Save Scholarship
</button>

<button
type="button"
class="gray"
onclick="clearForm()">
Clear
</button>

</form>

</div>


<!-- SEARCH -->

<div class="card">

<h2>🔎 Scholarships</h2>

<div class="toolbar">

<input id="search"
placeholder="Search scholarships...">

<select id="filterStatus">
<option value="">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
<option value="closed">Closed</option>
</select>

<select id="filterCountry">
<option value="">All Countries</option>
<option>USA</option>
<option>Canada</option>
<option>UK</option>
<option>Australia</option>
<option>Germany</option>
<option>Japan</option>
<option>China</option>
<option>Other</option>
</select>

<select id="filterLevel">
<option value="">All Levels</option>
<option>Undergraduate</option>
<option>Masters</option>
<option>PhD</option>
<option>Postgraduate</option>
<option>Diploma</option>
</select>

</div>

</div>


<div id="list" class="grid">
Loading...
</div>

</main>


<script type="module">

import{
 initializeApp
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 serverTimestamp
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

let scholarships=[];
let editing=null;

const $=id=>
document.getElementById(id);


/* SAFE TEXT */

function clean(x){

return String(x??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* SLUG */

function slugify(text){

return text
.toLowerCase()
.trim()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");

}


/* LOAD */

async function load(){

const snap=await getDocs(
collection(db,"scholarships")
);

scholarships=snap.docs.map(d=>({
id:d.id,
...d.data()
}));

stats();
render();

}


/* STATS */

function stats(){

$("total").textContent=
scholarships.length;

$("published").textContent=
scholarships.filter(
x=>x.status==="published"
).length;

$("drafts").textContent=
scholarships.filter(
x=>x.status==="draft"
).length;

$("featured").textContent=
scholarships.filter(
x=>x.featured===true
).length;

}


/* RENDER */

function render(){

const q=
$("search").value
.toLowerCase()
.trim();

const status=
$("filterStatus").value;

const country=
$("filterCountry").value;

const level=
$("filterLevel").value;


const data=
scholarships.filter(s=>{

const text=[

s.title,
s.provider,
s.country,
s.field,
s.description,
(s.tags||[]).join(" ")

].join(" ").toLowerCase();


return(

(!q||text.includes(q))&&

(!status||s.status===status)&&

(!country||s.country===country)&&

(!level||s.level===level)

);

});


if(!data.length){

$("list").innerHTML=
"<div class='card'>No scholarships found.</div>";

return;

}


$("list").innerHTML=
data.map(s=>`

<div class="item">

${s.image?
`<img
src="${clean(s.image)}"
style="width:100%;height:150px;
object-fit:cover;border-radius:8px"
onerror="this.style.display='none'">`
:""}

<h3>
🎓 ${clean(s.title)}
</h3>

<p>
<b>Provider:</b>
${clean(s.provider||"")}
</p>

<p>
🌍 ${clean(s.country||"")}
 ·
🎓 ${clean(s.level||"")}
</p>

<p>
📅 Deadline:
${clean(s.deadline||"Not specified")}
</p>

<p>
💰 ${clean(s.amount||"")}
${clean(s.currency||"")}
</p>

<span class="badge ${
s.status==="published"
?"published":"draft"
}">
${clean(s.status||"draft")}
</span>

${s.featured?
"<span class='badge featured'>⭐ Featured</span>"
:""}

<p>
${clean(s.shortDescription||
s.description||
"")}
</p>

<div class="actions">

${
s.applicationUrl
?
`<a
href="${clean(s.applicationUrl)}"
target="_blank">
<button class="green">
Apply
</button>
</a>`
:""
}

<button
class="gray"
onclick="editScholarship('${s.id}')">
✏ Edit
</button>

<button
class="orange"
onclick="togglePublish('${s.id}')">
${s.status==="published"
?"Unpublish":"Publish"}
</button>

<button
class="blue"
onclick="toggleFeatured('${s.id}')">
${s.featured
?"Remove Featured":"⭐ Featured"}
</button>

<button
class="red"
onclick="deleteScholarship('${s.id}')">
🗑 Delete
</button>

</div>

</div>

`).join("");

}


/* SAVE */

$("form").onsubmit=async e=>{

e.preventDefault();

const title=
$("title").value.trim();

const data={

title,

slug:
$("slug").value.trim()||
slugify(title),

provider:
$("provider").value.trim(),

country:
$("country").value.trim(),

deadline:
$("deadline").value,

amount:
$("amount").value.trim(),

currency:
$("currency").value,

level:
$("level").value,

field:
$("field").value.trim(),

mode:
$("mode").value,

status:
$("status").value,

featured:
$("featured").value==="true",

url:
$("url").value.trim(),

applicationUrl:
$("applicationUrl").value.trim(),

image:
$("image").value.trim(),

shortDescription:
$("shortDescription").value.trim(),

description:
$("description").value.trim(),

requirements:
$("requirements").value
.split("\n")
.map(x=>x.trim())
.filter(Boolean),

benefits:
$("benefits").value
.split("\n")
.map(x=>x.trim())
.filter(Boolean),

tags:
$("tags").value
.split(",")
.map(x=>x.trim())
.filter(Boolean),

updatedAt:
serverTimestamp()

};


try{

if(editing){

await updateDoc(
doc(db,"scholarships",editing),
data
);

alert("Scholarship updated.");

}else{

await addDoc(
collection(db,"scholarships"),
{
...data,
views:0,
applications:0,
createdAt:
serverTimestamp()
}
);

alert("Scholarship added.");

}

clearForm();

await load();

}catch(error){

alert(error.message);

}

};


/* EDIT */

window.editScholarship=id=>{

const s=
scholarships.find(x=>x.id===id);

if(!s)return;

editing=id;

$("id").value=id;

$("title").value=s.title||"";
$("slug").value=s.slug||"";
$("provider").value=s.provider||"";
$("country").value=s.country||"";
$("deadline").value=s.deadline||"";
$("amount").value=s.amount||"";
$("currency").value=s.currency||"USD";
$("level").value=s.level||"Undergraduate";
$("field").value=s.field||"";
$("mode").value=s.mode||"Any";
$("status").value=s.status||"draft";
$("featured").value=
s.featured?"true":"false";
$("url").value=s.url||"";
$("applicationUrl").value=
s.applicationUrl||"";
$("image").value=s.image||"";
$("shortDescription").value=
s.shortDescription||"";
$("description").value=
s.description||"";
$("requirements").value=
(s.requirements||[]).join("\n");
$("benefits").value=
(s.benefits||[]).join("\n");
$("tags").value=
(s.tags||[]).join(", ");

window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* CLEAR */

window.clearForm=()=>{

editing=null;

$("form").reset();

$("id").value="";

};


/* DELETE */

window.deleteScholarship=async id=>{

const s=
scholarships.find(x=>x.id===id);

if(!confirm(
`Delete "${s?.title||"this scholarship"}"?`
))return;

await deleteDoc(
doc(db,"scholarships",id)
);

await load();

};


/* PUBLISH */

window.togglePublish=async id=>{

const s=
scholarships.find(x=>x.id===id);

if(!s)return;

const published=
s.status!=="published";

await updateDoc(
doc(db,"scholarships",id),
{
status:
published
?"published"
:"draft",

published:

published,

publishedAt:
published
?serverTimestamp()
:null,

updatedAt:
serverTimestamp()

}
);

await load();

};


/* FEATURED */

window.toggleFeatured=async id=>{

const s=
scholarships.find(x=>x.id===id);

if(!s)return;

await updateDoc(
doc(db,"scholarships",id),
{
featured:!s.featured,
updatedAt:
serverTimestamp()
}
);

await load();

};


/* FILTERS */

$("search").oninput=render;

$("filterStatus").onchange=render;

$("filterCountry").onchange=render;

$("filterLevel").onchange=render;


/* START */

load();

</script>

</body>
</html>
