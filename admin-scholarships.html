<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Scholarship Management | LetsStudy Pro</title>

<link rel="icon"
      type="image/png"
      href="https://letsstudy.pro/favicon.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #e2e8f0;
}

.nav{
  width:min(1250px,92%);
  min-height:70px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:900;
  color:#0b57d0;
}

.back{
  color:#475569;
  font-weight:700;
}

.container{
  width:min(1250px,92%);
  margin:35px auto;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:28px;
}

.page-header h1{
  font-size:32px;
  margin-bottom:5px;
}

.page-header p{
  color:#64748b;
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  font-weight:800;
}

.primary{
  background:#0b57d0;
  color:#fff;
}

.secondary{
  background:#f1f5f9;
  color:#334155;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:22px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:21px;
}

.stat strong{
  display:block;

  color:#0b57d0;
}

.stat span{
  color:#64748b;
  font-size:13px;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr 200px 180px;
  gap:12px;
  background:#fff;
  border:1px solid #e2e8f0;
  padding:17px;

  margin-bottom:20px;
}

input,
select,
textarea{
  width:100%;
  padding:11px 13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#0b57d0;
}

.table-box{
  overflow:auto;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:17px;
}

table{
  width:100%;
  min-width:1150px;
  border-collapse:collapse;
}

th,
td{
  padding:15px;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:12px;
  text-transform:uppercase;
}

td{
  font-size:14px;
}

.badge{
  display:inline-flex;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.published{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#fef3c7;
  color:#92400e;
}

.closed{
  background:#fee2e2;
  color:#991b1b;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.action{
  border:0;
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  font-weight:800;
}

.view{
  background:#e0f2fe;
  color:#0369a1;
}

.edit{
  background:#e0e7ff;
  color:#3730a3;
}

.publish{
  background:#dcfce7;
  color:#166534;
}

.delete{
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  text-align:center;
  padding:45px;
  color:#64748b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(15,23,42,.65);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:min(700px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:26px;
  position:relative;
}

.close{
  position:absolute;
  top:14px;
  right:14px;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#f1f5f9;
  font-size:20px;
}

.modal-box h2{
  margin-bottom:20px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.form-actions button{
  flex:1;
}

.detail{
  padding:13px 0;
  border-bottom:1px solid #e2e8f0;
}

.detail strong{
  display:block;
  color:#64748b;
  font-size:12px;
  margin-bottom:4px;
}

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .page-header{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr;
  }

  .page-header h1{
    font-size:27px;
  }

  .form-actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      LetsStudy Pro Admin
    </div>

    <a
      href="admin.html"
      class="back">

      ← Admin Dashboard

    </a>

  </div>

</header>


<main class="container">

  <div class="page-header">

    <div>

      <h1>
        Scholarship Management
      </h1>

      <p>
        Manage scholarships and education
        opportunities for students.
      </p>

    </div>

    <button
      class="btn primary"
      onclick="openAddModal()">

      + Add Scholarship

    </button>

  </div>


  <!-- STATISTICS -->

  <section class="stats">

    <div class="stat">

      <strong id="totalScholarships">
        0
      </strong>

      <span>
        Total Scholarships
      </span>

    </div>

    <div class="stat">

      <strong id="publishedScholarships">
        0
      </strong>

      <span>
        Published
      </span>

    </div>

    <div class="stat">

      <strong id="draftScholarships">
        0
      </strong>

      <span>
        Drafts
      </span>

    </div>

    <div class="stat">

      <strong id="closedScholarships">
        0
      </strong>

      <span>
        Closed
      </span>

    </div>

  </section>


  <!-- SEARCH -->

  <section class="toolbar">

    <input
      id="searchScholarship"
      type="search"

    <select id="statusFilter">

      <option value="">

      </option>

      <option value="published">

    <select id="countryFilter">

  <!-- TABLE -->

  <section class="table-box">

    <table>

      <thead>

          <th>

          <th>
            Provider
          </th>

          <th>
            Country
          </th>

          <th>

</main>


<!-- ADD / EDIT -->

<div
  id="scholarshipModal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal()">

      ×

    </button>

    <h2 id="modalTitle">
      Add Scholarship
    </h2>


    <div class="form-group">

      <label>

      </label>

      <input
        id="title"

    </div>


    <div class="form-group">

      <label>
        Provider
      </label>

      <input
        id="provider"
        placeholder="University / Government / Organization">

    </div>


    <div class="form-group">

      <label>
        Country

      <input
        id="country"
        placeholder="Canada">

    </div>


    <div class="form-group">

      <label>

      </label>

      <input
        id="deadline"

    </div>


    <div class="form-group">

      <label>
        Scholarship URL
      </label>

      <input
        id="url"
        type="url"
        placeholder="https://...">

    </div>


    <div class="form-group">

      <label>
        Description
      </label>

      <textarea
        id="description"
        rows="5"
        placeholder="Scholarship details..."></textarea>

    </div>


    <div class="form-group">

      <label>
        Status
      </label>

      <select id="status">

        <option value="published">
          Published

        <option value="draft">

    <div class="form-actions">

      <button

</div>


<!-- VIEW -->

<div
  id="viewModal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeView()">

      ×

    </button>

    <h2>
      Scholarship Details
    </h2>

    <div
      id="details"
      style="margin-top:18px;">

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro.firebaseapp.com",

  projectId:
    "let-s-study-pro",

  storageBucket:
    "let-s-study-pro.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


const app =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================================
   STATE
===================================================== */

let scholarships = [];

let selectedScholarship = null;


/* =====================================================
   LOAD
===================================================== */

async function loadScholarships(){

  const table =
    document.getElementById(
      "scholarshipsTable"
    );

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "scholarships"
        )
      );

    scholarships = [];

    snapshot.forEach(
      item => {

        scholarships.push({

          id:
            item.id,

          ...item.data()

        });

      }
    );

    updateStats();

    updateCountryFilter();

    applyFilters();

  }catch(error){

    console.error(
      error
    );

    table.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty">

          Failed to load scholarships.

        </td>

      </tr>

    `;

  }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  document.getElementById(
    "totalScholarships"
  ).textContent =
    scholarships.length;


  document.getElementById(
    "publishedScholarships"
  ).textContent =

    scholarships.filter(
      item =>
        normalize(
          item.status
        ) === "published"
    ).length;


  document.getElementById(
    "draftScholarships"
  ).textContent =

    scholarships.filter(
      item =>
        normalize(
          item.status
        ) === "draft"
    ).length;


  document.getElementById(
    "closedScholarships"
  ).textContent =

    scholarships.filter(
      item =>
        normalize(
          item.status
        ) === "closed"
    ).length;

}


/* =====================================================
   COUNTRY FILTER
===================================================== */

function updateCountryFilter(){

  const select =
    document.getElementById(
      "countryFilter"
    );

  const countries =
    [
      ...new Set(
        scholarships
          .map(
            item =>
              item.country
          )
          .filter(Boolean)
      )
    ]
    .sort();


  select.innerHTML = `

    <option value="">
      All Countries
    </option>

  `;


  countries.forEach(
    country => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        country;

      option.textContent =
        country;

      select.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   FILTER
===================================================== */

function applyFilters(){

  const search =
    document.getElementById(
      "searchScholarship"
    )
    .value
    .trim()
    .toLowerCase();


  const status =
    document.getElementById(
      "statusFilter"
    )
    .value;


  const country =
    document.getElementById(
      "countryFilter"
    )
    .value;


  const filtered =
    scholarships.filter(
      item => {

        const title =
          String(
            item.title || ""
          ).toLowerCase();


        const provider =
          String(
            item.provider || ""
          ).toLowerCase();


        const itemCountry =
          String(
            item.country || ""
          ).toLowerCase();


        return (

          (
            !search ||
            title.includes(search) ||
            provider.includes(search) ||
            itemCountry.includes(search)
          )

          &&

          (
            !status ||
            normalize(
              item.status
            ) === status
          )

          &&

          (
            !country ||
            item.country === country
          )

        );

      }
    );


  renderScholarships(
    filtered
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderScholarships(list){

  const table =
    document.getElementById(
      "scholarshipsTable"
    );


  if(!list.length){

    table.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty">

          No scholarships found.

        </td>

      </tr>

    `;

    return;

  }


  table.innerHTML =
    list.map(
      item => {

        const status =
          normalize(
            item.status
          ) || "draft";


        return `

          <tr>

            <td>

              <strong>

                ${escapeHTML(
                  item.title ||
                  "Untitled Scholarship"
                )}

              </strong>

            </td>


            <td>
              ${escapeHTML(
                item.provider || "—"
              )}
            </td>


            <td>
              ${escapeHTML(
                item.country || "—"
              )}
            </td>


            <td>
              ${escapeHTML(
                item.deadline || "—"
              )}
            </td>


            <td>

              <span
                class="badge ${status}">

                ${escapeHTML(status)}

              </span>

            </td>


            <td>

              <div class="actions">

                <button
                  class="action view"
                  onclick="viewScholarship('${item.id}')">

                  View

                </button>


                <button
                  class="action edit"
                  onclick="editScholarship('${item.id}')">

                  Edit

                </button>


                <button
                  class="action publish"
                  onclick="toggleStatus('${item.id}')">

                  ${
                    status === "published"
                    ? "Unpublish"
                    : "Publish"
                  }

                </button>


                <button
                  class="action delete"
                  onclick="deleteScholarship('${item.id}')">

                  Delete

                </button>

              </div>

            </td>

          </tr>

        `;

      }
    ).join("");

}


/* =====================================================
   ADD
===================================================== */

window.openAddModal =
function(){

  selectedScholarship =
    null;

  document.getElementById(
    "modalTitle"
  ).textContent =
    "Add Scholarship";

  clearForm();

  document.getElementById(
    "scholarshipModal"
  ).style.display =
    "flex";

};


/* =====================================================
   EDIT
===================================================== */

window.editScholarship =
function(id){

  const item =
    scholarships.find(
      scholarship =>
        scholarship.id === id
    );


  if(!item){
    return;
  }


  selectedScholarship =
    item;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Scholarship";


  document.getElementById(
    "title"
  ).value =
    item.title || "";


  document.getElementById(
    "provider"
  ).value =
    item.provider || "";


  document.getElementById(
    "country"
  ).value =
    item.country || "";


  document.getElementById(
    "deadline"
  ).value =
    item.deadline || "";


  document.getElementById(
    "url"
  ).value =
    item.url || "";


  document.getElementById(
    "description"
  ).value =
    item.description || "";


  document.getElementById(
    "status"
  ).value =
    normalize(
      item.status
    ) || "draft";


  document.getElementById(
    "scholarshipModal"
  ).style.display =
    "flex";

};


/* =====================================================
   SAVE
===================================================== */

window.saveScholarship =
async function(){

  const title =
    document.getElementById(
      "title"
    ).value.trim();


  const provider =
    document.getElementById(
      "provider"
    ).value.trim();


  const country =
    document.getElementById(
      "country"
    ).value.trim();


  const deadline =
    document.getElementById(
      "deadline"
    ).value;


  const url =
    document.getElementById(
      "url"
    ).value.trim();


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  const status =
    document.getElementById(
      "status"
    ).value;


  if(!title){

    alert(
      "Please enter scholarship title."
    );

    return;

  }


  try{

    const data = {

      title:
        title,

      provider:
        provider,

      country:
        country,

      deadline:
        deadline,

      url:
        url,

      description:
        description,

      status:
        status

    };


    if(selectedScholarship){

      await updateDoc(

        doc(
          db,
          "scholarships",
          selectedScholarship.id
        ),

        data

      );

    }else{

      await addDoc(

        collection(
          db,
          "scholarships"
        ),

        {

          ...data,

          createdAt:
            serverTimestamp()

        }

      );

    }


    closeModal();

    await loadScholarships();

    alert(
      "Scholarship saved successfully."
    );


  }catch(error){

    console.error(
      error
    );

    alert(
      "Failed to save scholarship."
    );

  }

};


/* =====================================================
   STATUS
===================================================== */

window.toggleStatus =
async function(id){

  const item =
  scholarships.find(
    scholarship =>
      scholarship.id === id
  );

if(!item){

  alert(
    "Scholarship not found."
  );

  return;

}
