<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Scholarships | LetsStudy Pro Admin
  </title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(
        1500px,
        calc(100% - 30px)
      );

      margin: auto;
      padding: 28px 0 60px;
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .header p {
      color: #697386;
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

        .btn-secondary {
      background: white;
      color: #263247;
      border: 1px solid #dce2ea;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-success {
      background: #dcfce7;
      color: #166534;
    }

    /* =========================
       STATS
    ========================== */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(5, 1fr);

      gap: 15px;
      margin-bottom: 22px;
    }

    .stat {
      background: white;
      border: 1px solid #e5e9f0;
      border-radius: 15px;
      padding: 19px;
    }

    .stat-label {
      color: #717b8d;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 800;
    }

    .green {
      color: #15803d;
    }

    .orange {
      color: #b45309;
    }

    .red {
      color: #dc2626;
    }

    /* =========================
       TOOLBAR
    ========================== */

    .toolbar {
      background: white;
      border: 1px solid #e5e9f0;
      border-radius: 15px;
      padding: 15px;

      display: flex;
      gap: 10px;
      flex-wrap: wrap;

      margin-bottom: 18px;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .input,
    .select,
    textarea {
      width: 100%;

      padding: 11px 13px;

      border: 1px solid #dce2ea;
      border-radius: 9px;

      background: white;
      color: #172033;

      outline: none;
    }

    .input:focus,
    .select:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    .select {
      width: 180px;
    }

    /* =========================
       TABLE CARD
    ========================== */

    .card {
      background: white;
      border: 1px solid #e5e9f0;
      border-radius: 15px;

      overflow: hidden;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1200px;

      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px;

      text-align: left;

      border-bottom:
        1px solid #edf0f4;

      vertical-align: middle;
    }

    th {
      background: #f9fafc;

      color: #70798a;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .5px;

      white-space: nowrap;
    }

    td {
      font-size: 13px;
    }

    .title {
      font-weight: 800;
      color: #172033;
    }

    .muted {
      display: block;

      color: #7a8495;

      font-size: 11px;

      margin-top: 4px;
    }

    .amount {
      font-weight: 800;
      white-space: nowrap;
    }

    /* =========================
       BADGES
    ========================== */

    .badge {
      display: inline-flex;

      align-items: center;

      padding: 6px 10px;

      border-radius: 30px;

      font-size: 11px;

      font-weight: 800;

      white-space: nowrap;
    }

    .badge-published {
      background: #dcfce7;
      color: #166534;
    }

    .badge-draft {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-expired {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-open {
      background: #dbeafe;
      color: #1d4ed8;
    }

    /* =========================
       ACTIONS
    ========================== */

    .actions {
      display: flex;

      gap: 7px;

      flex-wrap: wrap;
    }

    .action-btn {
      border:
        1px solid #dce2ea;

      background: white;

      color: #263247;

      border-radius: 8px;

      padding: 7px 10px;

      font-size: 11px;

      font-weight: 700;
    }

    .action-btn:hover {
      background: #f8fafc;
    }

    .action-btn.danger {
      color: #b91c1c;

      background: #fff7f7;

      border-color: #fecaca;
    }

    /* =========================
       MESSAGE
    ========================== */

    .message {
      padding: 65px 20px;

      text-align: center;

      color: #70798a;
    }

    .message.error {
      color: #b91c1c;
    }

    /* =========================
       MODAL
    ========================== */

    .modal {
      position: fixed;

      inset: 0;

      background:
        rgba(15, 23, 42, .62);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: min(
        850px,
        100%
      );

      max-height: 92vh;

      overflow-y: auto;

      background: white;

      border-radius: 18px;

      padding: 25px;
    }

    .modal-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 22px;
    }

    .modal-header h2 {
      font-size: 22px;
    }

    .close-btn {
      width: 38px;

      height: 38px;

      border: 0;

      border-radius: 50%;

      background: #f1f5f9;

      color: #334155;

      font-size: 21px;
    }

    .close-btn:hover {
      background: #e2e8f0;
    }

    /* =========================
       FORM
    ========================== */

    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 15px;
    }

    .form-group {
      display: flex;

      flex-direction: column;

      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 12px;

      font-weight: 800;

      color: #475569;
    }

    textarea {
      min-height: 100px;

      resize: vertical;
    }

    .checkbox-row {
      display: flex;

      align-items: center;

      gap: 9px;

      min-height: 45px;
    }

    .checkbox-row input {
      width: 17px;

      height: 17px;
    }

    .checkbox-row label {
      font-size: 13px;

      font-weight: 700;

      color: #475569;
    }

    .modal-footer {
      margin-top: 22px;

      padding-top: 18px;

      border-top:
        1px solid #edf0f4;

      display: flex;

      justify-content: flex-end;

      gap: 10px;
    }

    /* =========================
       LOADING
    ========================== */

    .loading {
      display: inline-flex;

      align-items: center;

      gap: 8px;
    }

    .spinner {
      width: 16px;

      height: 16px;

      border: 2px solid #dbeafe;

      border-top-color: #2563eb;

      border-radius: 50%;

      animation:
        spin .7s linear infinite;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 1100px) {

      .stats {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }

    @media (max-width: 700px) {

      .page {
        width:
          calc(100% - 20px);
      }

      .header {
        align-items: flex-start;

        flex-direction: column;
      }

      .header-actions {
        width: 100%;
      }

      .header-actions .btn {
        flex: 1;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .select {
        width: 100%;
      }

    }

    @media (max-width: 450px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .modal-content {
        padding: 18px;
      }

    }

  </style>

</head>

<body>

<main class="page">

  <header class="header">

    <div>

      <h1>
        Scholarships
      </h1>

      <p>
        Manage scholarship opportunities
        available to students.
      </p>

    </div>

    <div class="header-actions">

      <button
        class="btn btn-secondary"
        id="refreshBtn"
        type="button"
      >
        ↻ Refresh
      </button>

      <button
        class="btn btn-primary"
        id="addScholarshipBtn"
        type="button"
      >
        + Add Scholarship
      </button>

    </div>

  </header>


  <section class="stats">

    <div class="stat">

      <div class="stat-label">
        Total
      </div>

      <div
        class="stat-value"
        id="totalScholarships"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Published
      </div>

      <div
        class="stat-value green"
        id="publishedScholarships"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Drafts
      </div>

      <div
        class="stat-value orange"
        id="draftScholarships"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Open
      </div>

      <div
        class="stat-value green"
        id="openScholarships"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Expired
      </div>

      <div
        class="stat-value red"
        id="expiredScholarships"
      >
        0
      </div>

    </div>

  </section>


  <section class="toolbar">

    <div class="search-box">

      <input
        class="input"
        id="searchInput"
        type="search"

    </div>


    <select
      class="select"
      id="statusFilter"
    >

      <option value="all">
        All Status
      </option>

      <option value="published">
        Published
      </option>

      <option value="draft">
        Draft
      </option>

      <option value="expired">
        Expired
      </option>

      <option value="open">
        Open
      </option>

    </select>


    <select
      class="select"
      id="levelFilter"
    >

      <option value="all">
        All Levels
      </option>

      <option value="secondary">
        Secondary
      </option>

      <option value="certificate">
        Certificate
      </option>

      <option value="diploma">
        Diploma
      </option>

      <option value="undergraduate">
        Undergraduate
      </option>

      <option value="masters">
        Masters
      </option>

      <option value="phd">
        PhD
      </option>

    </select>

  </section>


  <section class="card">

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              Scholarship
            </th>

            <th>
              Provider
            </th>

            <th>
              Country
            </th>

            <th>
              Level
            </th>

            <th>
              Amount
            </th>

            <th>
              Deadline
            </th>

            <th>
              Status
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>

        <tbody id="scholarshipsBody">

          <tr>

            <td
              colspan="8"
              class="message"
            >

              <span class="loading">

                <span class="spinner"></span>

                Loading scholarships...

              </span>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<!-- =========================
     SCHOLARSHIP MODAL
========================== -->

<div
  class="modal"
  id="scholarshipModal"
>

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="modalTitle">
        Add Scholarship
      </h2>

      <button
        class="close-btn"
        id="closeModal"
        type="button"
      >
        ×
      </button>

    </div>


    <form id="scholarshipForm">

      <div class="form-grid">

        <div class="form-group">

          <label for="provider">

          <input

            id="provider"
            required
            placeholder="Organization / university"
          >

        </div>


        <div class="form-group">

          <label for="country">
            Country
          </label>

          <input
            class="input"
            id="country"
            placeholder="Country"
          >

        </div>


        <div class="form-group">

          <label for="level">
            Study Level
          </label>

          <select
            class="select"
            id="level"
          >

            <option value="secondary">
              Secondary
            </option>

            <option value="certificate">
              Certificate
            </option>

            <option value="diploma">
              Diploma
            </option>

            <option value="undergraduate">
              Undergraduate
            </option>

            <option value="masters">
              Masters
            </option>

            <option value="phd">
              PhD
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="amount">
            Amount
          </label>

          <input
            class="input"
            id="amount"
            placeholder="Full tuition / 5000"

        </div>


        <div class="form-group">

          <label for="currency">

        <div class="form-group full">

          <label for="description">

          </label>

          <textarea

          ></textarea>

        </div>


        <div class="form-group full">

          <label for="eligibility">
            Eligibility

          <textarea

        </div>


        <div class="form-group full">

          <label for="requirements">
            Requirements
          </label>

          <textarea
            id="requirements"
            placeholder="Documents and requirements..."
          ></textarea>

        </div>


        <div class="form-group">

          <label for="applicationUrl">
            Application URL
          </label>

          <input
            class="input"
            id="applicationUrl"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="form-group">

          <label for="officialUrl">
            Official URL
          </label>

          <input
            class="input"
            id="officialUrl"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="form-group">

          <label for="imageUrl">
            Image URL
          </label>

          <input
            class="input"
            id="imageUrl"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="form-group">

          <label for="displayOrder">
            Display Order
          </label>

          <input
            class="input"
            id="displayOrder"
            type="number"
            value="0"
          >

        </div>


        <div class="checkbox-row">

          <input
            id="published"
            type="checkbox"
          >

          <label for="published">
            Publish scholarship
          </label>

        </div>


        <div class="checkbox-row">

          <input
            id="featured"
            type="checkbox"
          >

          <label for="featured">
            Featured scholarship
          </label>

        </div>

      </div>


      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-secondary"
          id="cancelBtn"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          id="saveBtn"
        >
          Save Scholarship
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

  /* =========================
     FIREBASE
  ========================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    getDatabase,
    ref,
    get,
    set,
    update,
    remove,
    push
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  /* =========================
     FIREBASE CONFIG
  ========================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

  };


  const app =
    initializeApp(
      firebaseConfig
    );


  const auth =
    getAuth(app);


  const db =
    getDatabase(app);


  let scholarships = {};


  const body =
    document.getElementById(
      "scholarshipsBody"
    );


  const modal =
    document.getElementById(
      "scholarshipModal"
    );


  const form =
    document.getElementById(
      "scholarshipForm"
    );


  /* =========================
     HELPERS
  ========================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }


    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "-";

    }


    return date.toLocaleDateString(
      undefined,
      {
        year: "numeric",
        month: "short",
        day: "numeric"
      }
    );

  }


  function isExpired(
    deadline
  ) {

    if (!deadline) {
      return false;
    }


    return new Date(
      deadline + "T23:59:59"
    ) < new Date();

  }


  function getStatus(
    scholarship
  ) {

    if (
      scholarship.published !== true
    ) {

      return "draft";

    }


    if (
      isExpired(
        scholarship.deadline
      )
    ) {

      return "expired";

    }


    return "published";

  }


  function statusBadge(
    scholarship
  ) {

    const status =
      getStatus(
        scholarship
      );


    if (
      status === "published"
    ) {

      return `
        <span class="badge badge-published">
          Published
        </span>
      `;

    }


    if (
      status === "expired"
    ) {

          return `
      <span class="badge badge-expired">
        Expired
      </span>
    `;

  }


  /* =========================
     LOAD SCHOLARSHIPS
  ========================== */

  async function loadScholarships() {

    body.innerHTML = `

      <tr>
        <td colspan="8" class="message">
          Loading scholarships...
        </td>
      </tr>

    `;

    try {

      const snapshot = await get(
        ref(db, "scholarships")
      );

      scholarships =
        snapshot.val() || {};

      updateStats();
      renderScholarships();

    } catch (error) {

      console.error(
        "Load scholarships error:",
        error
      );

      body.innerHTML = `

        <tr>
          <td
            colspan="8"
            class="message error"
          >
            Failed to load scholarships.
          </td>
        </tr>

      `;

    }

  }


  /* =========================
     UPDATE STATISTICS
  ========================== */

  function updateStats() {

    const list =
      Object.values(
        scholarships
      );

    let published = 0;
    let drafts = 0;
    let open = 0;
    let expired = 0;

    list.forEach(
      scholarship => {

        const status =
          getStatus(
            scholarship
          );

        if (
          status === "published"
        ) {
          published++;
        }

        if (
          status === "draft"
        ) {
          drafts++;
        }

        if (
          status === "expired"
        ) {
          expired++;
        }

        if (
          status === "published" &&
          getDeadlineStatus(
            scholarship.deadline
          ) === "open"
        ) {
          open++;
        }

      }
    );

    document.getElementById(
      "totalScholarships"
    ).textContent =
      list.length;

    document.getElementById(
      "publishedScholarships"
    ).textContent =
      published;

    document.getElementById(
      "draftScholarships"
    ).textContent =
      drafts;

    document.getElementById(
      "openScholarships"
    ).textContent =
      open;

    document.getElementById(
      "expiredScholarships"
    ).textContent =
      expired;

  }


  /* =========================
     RENDER SCHOLARSHIPS
  ========================== */

  function renderScholarships() {

    const search =
      document.getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();

    const statusFilter =
      document.getElementById(
        "statusFilter"
      )
      .value;

    const levelFilter =
      document.getElementById(
        "levelFilter"
      )
      .value;


    let entries =
      Object.entries(
        scholarships
      );


    entries =
      entries.filter(
        ([id, scholarship]) => {

          const searchable = [

            id,

            scholarship.title,

            scholarship.provider,

            scholarship.country,

            scholarship.level,

            scholarship.description,

            scholarship.eligibility

          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


          if (
            search &&
            !searchable.includes(
              search
            )
          ) {

            return false;

          }


          const status =
            getStatus(
              scholarship
            );


          if (
            statusFilter !== "all"
          ) {

            if (
              statusFilter === "open"
            ) {

              if (
                status !== "published" ||
                getDeadlineStatus(
                  scholarship.deadline
                ) !== "open"
              ) {

                return false;

              }

            } else if (
              status !== statusFilter
            ) {

              return false;

            }

          }


          if (
            levelFilter !== "all" &&
            scholarship.level !==
              levelFilter
          ) {

            return false;

          }


          return true;

        }
      );


    entries.sort(
      ([, a], [, b]) => {

        const orderA =
          Number(
            a.displayOrder || 0
          );

        const orderB =
          Number(
            b.displayOrder || 0
          );

        return orderA - orderB;

      }
    );


    if (!entries.length) {

      body.innerHTML = `

        <tr>
          <td
            colspan="8"
            class="message"
          >
            No scholarships found.
          </td>
        </tr>

      `;

      return;

    }


    body.innerHTML =
      entries
        .map(
          ([id, scholarship]) => {

            const amount =
              scholarship.amount ||
              "Not specified";

            const currency =
              scholarship.currency ||
              "";


            return `

              <tr>

                <td>

                  <div class="title">

                    ${escapeHtml(
                      scholarship.title ||
                      "Untitled Scholarship"
                    )}

                  </div>

                  <span class="muted">

                    ID:
                    ${escapeHtml(id)}

                  </span>

                </td>


                <td>

                  ${escapeHtml(
                    scholarship.provider ||
                    "-"
                  )}

                </td>


                <td>

                  ${escapeHtml(
                    scholarship.country ||
                    "-"
                  )}

                </td>


                <td>

                  ${escapeHtml(
                    scholarship.level ||
                    "-"
                  )}

                </td>


                <td>

                  <span class="amount">

                    ${escapeHtml(
                      amount
                    )}

                    ${
                      currency
                        ? " " +
                          escapeHtml(
                            currency
                          )
                        : ""
                    }

                  </span>

                </td>


                <td>

                  ${escapeHtml(
                    formatDate(
                      scholarship.deadline
                    )
                  )}

                </td>


                <td>

                  ${statusBadge(
                    scholarship
                  )}

                </td>


                <td>

                  <div class="actions">

                    <button
                      type="button"
                      class="action-btn"
                      data-action="edit"
                      data-id="${escapeHtml(id)}"
                    >
                      Edit
                    </button>


                    <button
                      type="button"
                      class="action-btn"
                      data-action="toggle"
                      data-id="${escapeHtml(id)}"
                    >

                      ${
                        scholarship.published === true
                          ? "Unpublish"
                          : "Publish"
                      }

                    </button>


                    <button
                      type="button"
                      class="action-btn danger"
                      data-action="delete"
                      data-id="${escapeHtml(id)}"
                    >
                      Delete
                    </button>

                  </div>

                </td>

              </tr>

            `;

          }
        )
        .join("");

  }


  /* =========================
     OPEN MODAL
  ========================== */

  function openModal(
    id = null
  ) {

    form.reset();

    document.getElementById(
      "scholarshipId"
    ).value = "";

    document.getElementById(
      "currency"
    ).value = "USD";

    document.getElementById(
      "displayOrder"
    ).value = "0";


    if (
      id &&
      scholarships[id]
    ) {

      const scholarship =
        scholarships[id];


      document.getElementById(
        "modalTitle"
      ).textContent =
        "Edit Scholarship";


      document.getElementById(
        "scholarshipId"
      ).value =
        id;


      document.getElementById(
        "title"
      ).value =
        scholarship.title || "";


      document.getElementById(
        "provider"
      ).value =
        scholarship.provider || "";


      document.getElementById(
        "country"
      ).value =
        scholarship.country || "";


      document.getElementById(
        "level"
      ).value =
        scholarship.level ||
        "undergraduate";


      document.getElementById(
        "amount"
      ).value =
        scholarship.amount || "";


      document.getElementById(
        "currency"
      ).value =
        scholarship.currency ||
        "USD";


      document.getElementById(
        "deadline"
      ).value =
        scholarship.deadline || "";


      document.getElementById(
        "startDate"
      ).value =
        scholarship.startDate || "";


      document.getElementById(
        "description"
      ).value =
        scholarship.description || "";


      document.getElementById(
        "eligibility"
      ).value =
        scholarship.eligibility || "";


      document.getElementById(
        "requirements"
      ).value =
        scholarship.requirements || "";


      document.getElementById(
        "applicationUrl"
      ).value =
        scholarship.applicationUrl || "";


      document.getElementById(
        "officialUrl"
      ).value =
        scholarship.officialUrl || "";


      document.getElementById(
        "imageUrl"
      ).value =
        scholarship.imageUrl || "";


      document.getElementById(
        "displayOrder"
      ).value =
        scholarship.displayOrder || 0;


      document.getElementById(
        "published"
      ).checked =
        scholarship.published === true;


      document.getElementById(
        "featured"
      ).checked =
        scholarship.featured === true;

    } else {

      document.getElementById(
        "modalTitle"
      ).textContent =
        "Add Scholarship";

    }


    modal.classList.add(
      "show"
    );

  }


  /* =========================
     CLOSE MODAL
  ========================== */

  function closeModal() {

    modal.classList.remove(
      "show"
    );

  }


  /* =========================
     SAVE SCHOLARSHIP
  ========================== */

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const id =
        document.getElementById(
          "scholarshipId"
        )
        .value
        .trim();


      const title =
        document.getElementById(
          "title"
        )
        .value
        .trim();


      const provider =
        document.getElementById(
          "provider"
        )
        .value
        .trim();


      if (
        !title ||
        !provider
      ) {

        alert(
          "Title and provider are required."
        );

        return;

      }


      const now =
        Date.now();


      const data = {

        title,

        provider,

        country:
          document.getElementById(
            "country"
          )
          .value
          .trim(),

        level:
          document.getElementById(
            "level"
          )
          .value,

        amount:
          document.getElementById(
            "amount"
          )
          .value
          .trim(),

        currency:
          document.getElementById(
            "currency"
          )
          .value
          .trim()
          .toUpperCase() ||
          "USD",

        deadline:
          document.getElementById(
            "deadline"
          )
          .value,

        startDate:
          document.getElementById(
            "startDate"
          )
          .value,

        description:
          document.getElementById(
            "description"
          )
          .value
          .trim(),

        eligibility:
          document.getElementById(
            "eligibility"
          )
          .value
          .trim(),

        requirements:
          document.getElementById(
            "requirements"
          )
          .value
          .trim(),

        applicationUrl:
          document.getElementById(
            "applicationUrl"
          )
          .value
          .trim(),

        officialUrl:
          document.getElementById(
            "officialUrl"
          )
          .value
          .trim(),

        imageUrl:
          document.getElementById(
            "imageUrl"
          )
          .value
          .trim(),

        displayOrder:
          Number(
            document.getElementById(
              "displayOrder"
            )
            .value || 0
          ),

        published:
          document.getElementById(
            "published"
          ).checked,

        featured:
          document.getElementById(
            "featured"
          ).checked,

        updatedAt:
          now

      };


      try {

        if (id) {

          await update(
            ref(
              db,
              `scholarships/${id}`
            ),
            data
          );

        } else {

          data.createdAt =
            now;


          const newScholarship =
            push(
              ref(
                db,
                "scholarships"
              )
            );


          await set(
            newScholarship,
            data
          );

        }


        closeModal();

        await loadScholarships();

      } catch (error) {

        console.error(
          "Save error:",
          error
        );

        alert(
          "Failed to save scholarship."
        );

      }

    }
  );


  /* =========================
     TABLE ACTIONS
  ========================== */

  body.addEventListener(
    "click",
    async event => {

      const button =
        event.target.closest(
          "[data-action]"
        );


      if (!button) {

        return;

      }


      const action =
        button.dataset.action;


      const id =
        button.dataset.id;


      if (
        !id ||
        !scholarships[id]
      ) {

        return;

      }


      if (
        action === "edit"
      ) {

        openModal(id);

        return;

      }


      if (
        action === "toggle"
      ) {

        const current =
          scholarships[id]
            .published === true;


        try {

          await update(
            ref(
              db,
              `scholarships/${id}`
            ),
            {

              published:
                !current,

              updatedAt:
                Date.now()

            }
          );


          await loadScholarships();

        } catch (error) {

          console.error(
            error
          );

          alert(
            "Failed to update status."
          );

        }

        return;

      }


      if (
        action === "delete"
      ) {

        const title =
          scholarships[id]
            .title ||
          "this scholarship";


        const confirmed =
          confirm(
            `Delete "${title}"?`
          );


        if (!confirmed) {

          return;

        }


        try {

          await remove(
            ref(
              db,
              `scholarships/${id}`
            )
          );


          await loadScholarships();

        } catch (error) {

          console.error(
            error
          );

          alert(
            "Failed to delete scholarship."
          );

        }

      }

    }
  );


  /* =========================
     BUTTON EVENTS
  ========================== */

  document
    .getElementById(
      "addScholarshipBtn"
    )
    .addEventListener(
      "click",
      () => {

        openModal();

      }
    );


  document
    .getElementById(
      "refreshBtn"
    )
    .addEventListener(
      "click",
      loadScholarships
    );


  document
    .getElementById(
      "closeModal"
    )
    .addEventListener(
      "click",
      closeModal
    );


  document
    .getElementById(
      "cancelBtn"
    )
    .addEventListener(
      "click",
      closeModal
    );


  /* =========================
     FILTER EVENTS
  ========================== */

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      renderScholarships
    );


  document
    .getElementById(
      "statusFilter"
    )
    .addEventListener(
      "change",
      renderScholarships
    );


  document
    .getElementById(
      "levelFilter"
    )
    .addEventListener(
      "change",
      renderScholarships
    );


  /* =========================
     MODAL OUTSIDE CLICK
  ========================== */

  modal.addEventListener(
    "click",
    event => {

      if (
        event.target === modal
      ) {

        closeModal();

      }

    }
  );


  /* =========================
     ESC KEY
  ========================== */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      ) {

        closeModal();

      }

    }
  );


  /* =========================
     AUTHENTICATION
  ========================== */

  onAuthStateChanged(
    auth,
    user => {

      if (!user) {

                window.location.href =
          "login.html";

        return;

      }


      /*
       * User is authenticated.
       * Load real scholarship data
       * from Firebase Realtime Database.
       */

      await loadScholarships();

    }
  );


  /* =========================
     INITIAL PAGE STATE
  ========================== */

  function initializePage() {

    document
      .getElementById(
        "searchInput"
      )
      .value = "";


    document
      .getElementById(
        "statusFilter"
      )
      .value = "all";


    document
      .getElementById(
        "levelFilter"
      )
      .value = "all";


    document
      .getElementById(
        "currency"
      )
      .value = "USD";


    document
      .getElementById(
        "displayOrder"
      )
      .value = "0";

  }


  /* =========================
     START PAGE
  ========================== */

  initializePage();

</script>
