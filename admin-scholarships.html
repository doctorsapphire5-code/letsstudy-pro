<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Scholarships Admin | LetsStudy Pro</title>

<meta
  name="description"
  content="LetsStudy Pro Scholarship Management System"
/>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    Inter,
    Arial,
    sans-serif;
  background:#f4f7fb;
  color:#172033;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  background:#111827;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#38bdf8;
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.admin-badge{
  background:#1e293b;
  border:1px solid #334155;
  padding:8px 13px;
  border-radius:20px;
  font-size:13px;
}

.container{
  max-width:1450px;
  margin:auto;
  padding:25px;
}

.page-title{
  margin-bottom:22px;
}

.page-title h1{
  font-size:30px;
  margin-bottom:6px;
}

.page-title p{
  color:#64748b;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:16px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:
    0 5px 20px
    rgba(15,23,42,.06);
}

.stat-icon{
  font-size:25px;
  margin-bottom:10px;
}

.stat-label{
  color:#64748b;
  font-size:13px;
}

.stat-value{
  font-size:28px;
  font-weight:800;
  margin-top:4px;
}

/* GRID */

.main-grid{
  display:grid;
  grid-template-columns:
    390px 1fr;
  gap:22px;
  align-items:start;
}

.panel{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:
    0 5px 20px
    rgba(15,23,42,.06);
}

.panel h2{
  font-size:19px;
  margin-bottom:18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
  background:white;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.08);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:10px;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
  margin:12px 0;
  font-size:14px;
}

.checkbox input{
  width:auto;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:700;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-secondary{
  background:#e2e8f0;
  color:#172033;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.btn-success{
  background:#dcfce7;
  color:#166534;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.form-actions button{
  flex:1;
}

/* TOOLBAR */

.toolbar{
  display:grid;
  grid-template-columns:
    1fr 160px 160px;
  gap:10px;
  margin-bottom:18px;
}

.scholarships-list{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.scholarship-card{
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:17px;
  transition:.2s;
}

.scholarship-card:hover{
  box-shadow:
    0 6px 20px
    rgba(15,23,42,.07);
}

.scholarship-main{
  display:flex;
  gap:14px;
}

.scholarship-icon{
  width:48px;
  height:48px;
  border-radius:12px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  flex-shrink:0;
}

.scholarship-main h3{
  font-size:17px;
  margin-bottom:4px;
}

.scholarship-main p{
  color:#64748b;
  font-size:14px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.meta span{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  padding:5px 8px;
  border-radius:7px;
  font-size:12px;
  color:#475569;
}

.scholarship-status{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.status,
.featured{
  display:inline-block;
  padding:5px 9px;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
}

.status.published{
  background:#dcfce7;
  color:#166534;
}

.status.draft{
  background:#f1f5f9;
  color:#475569;
}

.featured{
  background:#fef3c7;
  color:#92400e;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.actions button{
  border:0;
  padding:8px 11px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  background:#eef2ff;
  color:#3730a3;
}

.actions button:nth-child(2){
  background:#ecfdf5;
  color:#047857;
}

.actions .danger{
  background:#fef2f2;
  color:#b91c1c;
}

.empty,
.loading{
  text-align:center;
  padding:45px 15px;
  color:#64748b;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  padding:13px 17px;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  opacity:0;
  transform:translateY(15px);
  pointer-events:none;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

.toast.error{
  background:#dc2626;
}

.hidden{
  display:none!important;
}

@media(max-width:1000px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .main-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:650px){

  .container{
    padding:15px;
  }

  .header{
    padding:15px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .row{
    grid-template-columns:1fr;
  }

  .page-title h1{
    font-size:24px;
  }

}

</style>

</head>

<body>

<header class="header">

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <div class="header-right">

    <div class="admin-badge">
      🎓 Scholarship Admin
    </div>

  </div>

</header>


<main class="container">

  <section class="page-title">

    <h1>
      Scholarship Management
    </h1>

    <p>
      Create, manage, publish and organize scholarship opportunities.
    </p>

  </section>


  <!-- STATISTICS -->

  <section class="stats">

    <div class="stat">

      <div class="stat-icon">
        🎓
      </div>

      <div class="stat-label">
        Total Scholarships
      </div>

      <div
        class="stat-value"
        id="totalScholarships"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🌐
      </div>

      <div class="stat-label">
        Published
      </div>

      <div
        class="stat-value"
        id="publishedScholarships"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        ⭐
      </div>

      <div class="stat-label">
        Featured
      </div>

      <div
        class="stat-value"
        id="featuredScholarships"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        📝
      </div>

      <div class="stat-label">
        Drafts
      </div>

      <div
        class="stat-value"
        id="draftScholarships"
      >
        0
      </div>

    </div>

  </section>


  <section class="main-grid">


    <!-- FORM -->

    <div class="panel">

      <h2 id="formTitle">
        Add Scholarship
      </h2>


      <form
        id="scholarshipForm"
        onsubmit="event.preventDefault(); saveScholarship();"
      >

        <div class="form-group">

          <label>
            Scholarship Title
          </label>

          <input
            id="scholarshipTitle"
            type="text"
            placeholder="e.g. Mastercard Foundation Scholarship"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Provider / Organization
          </label>

          <input
            id="scholarshipProvider"
            type="text"
            placeholder="University or organization"
            required
          >

        </div>


        <div class="row">

          <div class="form-group">

            <label>
              Country
            </label>

            <input
              id="scholarshipCountry"
              type="text"
              placeholder="Canada"
              required
            >

          </div>


          <div class="form-group">

            <label>
              Deadline
            </label>

            <input
              id="scholarshipDeadline"
              type="date"
              required
            >

          </div>

        </div>


        <div class="row">

          <div class="form-group">

            <label>
              Category
            </label>

            <select id="scholarshipCategory">

              <option value="Fully Funded">
                Fully Funded
              </option>

              <option value="Partial Funding">
                Partial Funding
              </option>

              <option value="Government">
                Government
              </option>

              <option value="University">
                University
              </option>

              <option value="International">
                International
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>
              Study Level
            </label>

            <select id="scholarshipLevel">

              <option value="Bachelor">
                Bachelor
              </option>

              <option value="Master">
                Master
              </option>

              <option value="PhD">
                PhD
              </option>

              <option value="Diploma">
                Diploma
              </option>

              <option value="All Levels">
                All Levels
              </option>

            </select>

          </div>

        </div>


        <div class="form-group">

          <label>
            Funding / Amount
          </label>

          <input
            id="scholarshipAmount"
            type="text"
            placeholder="Fully funded"
          >

        </div>


        <div class="form-group">

          <label>
            Description
          </label>

          <textarea
            id="scholarshipDescription"
            placeholder="Scholarship description..."
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Requirements
          </label>

          <textarea
            id="scholarshipRequirements"
            placeholder="Eligibility and requirements..."
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Application URL
          </label>

          <input
            id="scholarshipUrl"
            type="url"
            placeholder="https://..."
          >

        </div>


        <label class="checkbox">

          <input
            id="scholarshipFeatured"
            type="checkbox"
          >

          Featured Scholarship

        </label>


        <label class="checkbox">

          <input
            id="scholarshipPublished"
            type="checkbox"
            checked
          >

          Publish immediately

        </label>


        <div class="form-actions">

          <button
            type="submit"
            id="saveButton"
            class="btn btn-primary"
          >
            Save Scholarship
          </button>


          <button
            type="button"
            class="btn btn-secondary"
            onclick="resetScholarshipForm()"
          >
            Clear
          </button>

        </div>

      </form>

    </div>


    <!-- LIST -->

    <div class="panel">

      <h2>
        Scholarships
      </h2>


      <div class="toolbar">

        <input
          id="scholarshipSearch"
          type="search"
          placeholder="🔎 Search scholarships..."
        >


        <select id="scholarshipFilter">

          <option value="all">
            All Status
          </option>

          <option value="published">
            Published
          </option>

          <option value="draft">
            Draft
          </option>

        </select>


        <select id="categoryFilter">

          <option value="all">
            All Categories
          </option>

          <option value="Fully Funded">
            Fully Funded
          </option>

          <option value="Partial Funding">
            Partial Funding
          </option>

          <option value="Government">
            Government
          </option>

          <option value="University">
            University
          </option>

          <option value="International">
            International
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <div
        id="scholarshipsList"
        class="scholarships-list"
      >

        <div class="loading">
          Loading scholarships...
        </div>

      </div>

    </div>

  </section>

</main>


<div
  id="toast"
  class="toast"
></div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  addDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   FIREBASE
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


/* =====================================
   STATE
===================================== */

let scholarships = [];

let editingScholarshipId =
  null;

let currentAdmin = {

  uid:
    null,

  role:
    "administrator"

};


/* =====================================
   SAVE
===================================== */

window.saveScholarship =
async function(){

  const title =
    document.getElementById(
      "scholarshipTitle"
    ).value.trim();


  const provider =
    document.getElementById(
      "scholarshipProvider"
    ).value.trim();


  const country =
    document.getElementById(
      "scholarshipCountry"
    ).value.trim();


  const deadline =
    document.getElementById(
      "scholarshipDeadline"
    ).value;


  const category =
    document.getElementById(
      "scholarshipCategory"
    ).value;


  const level =
    document.getElementById(
      "scholarshipLevel"
    ).value;


  const amount =
    document.getElementById(
      "scholarshipAmount"
    ).value.trim();


  const description =
    document.getElementById(
      "scholarshipDescription"
    ).value.trim();


  const requirements =
    document.getElementById(
      "scholarshipRequirements"
    ).value.trim();


  const applicationUrl =
    document.getElementById(
      "scholarshipUrl"
    ).value.trim();


  const featured =
    document.getElementById(
      "scholarshipFeatured"
    ).checked;


  const published =
    document.getElementById(
      "scholarshipPublished"
    ).checked;


  if(!title){

    showToast(
      "Scholarship title is required.",
      "error"
    );

    return;

  }


  if(!provider){

    showToast(
      "Provider is required.",
      "error"
    );

    return;

  }


  try{

    setLoading(true);


    const data = {

      title,

      provider,

      country,

      deadline,

      category,

      level,

      amount,

      description,

      requirements,

      applicationUrl,

      featured,

      published,

      searchTitle:
        title.toLowerCase(),

      searchCountry:
        country.toLowerCase(),

      updatedAt:
        serverTimestamp()

    };


    if(
      editingScholarshipId
    ){

      await updateDoc(

        doc(
          db,
          "scholarships",
          editingScholarshipId
        ),

        data

      );


      showToast(
        "Scholarship updated successfully."
      );

    }
    else{

      data.createdAt =
        serverTimestamp();


      data.createdBy =
        currentAdmin.uid ||
        "administrator";


      await addDoc(

        collection(
          db,
          "scholarships"
        ),

        data

      );


      showToast(
        "Scholarship created successfully."
      );

    }


    resetScholarshipForm();

    await loadScholarships();

  }
  catch(error){

    console.error(
      "Save scholarship error:",
      error
    );


    showToast(
      error.message ||
      "Unable to save scholarship.",
      "error"
    );

  }
  finally{

    setLoading(false);

  }

};


/* =====================================
   LOAD
===================================== */

async function loadScholarships(){

  const container =
    document.getElementById(
      "scholarshipsList"
    );


  container.innerHTML = `
    <div class="loading">
      Loading scholarships...
    </div>
  `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "scholarships"
        )
      );


    scholarships = [];


    snapshot.forEach(
      item => {

        scholarships.push({

          id:
            item.id,

          ...item.data()

        });

      }
    );


    scholarships.sort(
      (a,b) => {

        const da =
          a.createdAt?.seconds ||
          0;

        const dbTime =
          b.createdAt?.seconds ||
          0;

        return dbTime - da;

      }
    );


    renderScholarships();

    updateStatistics();

  }
  catch(error){

    console.error(
      error
    );


    container.innerHTML = `
      <div class="empty">
        Unable to load scholarships.
      </div>
    `;

  }

}


/* =====================================
   RENDER
===================================== */

function renderScholarships(){

  const container =
    document.getElementById(
      "scholarshipsList"
    );


  const search =
    (
      document.getElementById(
        "scholarshipSearch"
      ).value ||
      ""
    )
    .toLowerCase()
    .trim();


  const status =
    document.getElementById(
      "scholarshipFilter"
    ).value;


  const category =
    document.getElementById(
      "categoryFilter"
    ).value;


  const filtered =
    scholarships.filter(
      item => {

        const text =
          (
            item.title ||
            ""
          )
          .toLowerCase();


        const provider =
          (
            item.provider ||
            ""
          )
          .toLowerCase();


        const country =
          (
            item.country ||
            ""
          )
          .toLowerCase();


        const matchesSearch =
          !search ||
          text.includes(search) ||
          provider.includes(search) ||
          country.includes(search);


        const matchesStatus =
          status === "all" ||

          (
            status === "published" &&
            item.published === true
          ) ||

          (
            status === "draft" &&
            item.published !== true
          );


        const matchesCategory =
          category === "all" ||
          item.category === category;


        return (
          matchesSearch &&
          matchesStatus &&
          matchesCategory
        );

      }
    );


  if(!filtered.length){

    container.innerHTML = `
      <div class="empty">

                <div style="font-size:48px;margin-bottom:12px;">
          🎓
        </div>

        <h3>No scholarships found</h3>

        <p>
          No scholarship matches your current search or filter.
        </p>

      </div>
    `;

    return;
  }


  container.innerHTML =
    filtered.map(
      scholarship => {

        const id =
          scholarship.id || "";

        const title =
          escapeHtml(
            scholarship.title || "Untitled Scholarship"
          );

        const provider =
          escapeHtml(
            scholarship.provider || "Unknown Provider"
          );

        const country =
          escapeHtml(
            scholarship.country || "International"
          );

        const deadline =
          scholarship.deadline
            ? formatDate(scholarship.deadline)
            : "No deadline";

        const amount =
          escapeHtml(
            scholarship.amount || "Not specified"
          );

        const category =
          escapeHtml(
            scholarship.category || "General"
          );

        const status =
          scholarship.status || "active";

        return `
          <div class="scholarship-card">

            <div class="card-top">

              <div class="scholarship-icon">
                🎓
              </div>

              <div class="card-actions">

                <button
                  class="btn-edit"
                  onclick="editScholarship('${escapeAttribute(id)}')"
                >
                  ✏️
                </button>

                <button
                  class="btn-delete"
                  onclick="deleteScholarship('${escapeAttribute(id)}')"
                >
                  🗑️
                </button>

              </div>

            </div>


            <h3>
              ${title}
            </h3>


            <p class="provider">
              🏛️ ${provider}
            </p>


            <div class="meta">

              <span>
                🌍 ${country}
              </span>

              <span>
                📚 ${category}
              </span>

              <span>
                💰 ${amount}
              </span>

              <span>
                ⏰ ${deadline}
              </span>

            </div>


            <div class="card-footer">

              <span class="status ${status}">
                ${
                  status === "active"
                    ? "● Active"
                    : status === "closed"
                      ? "● Closed"
                      : "● Draft"
                }
              </span>

              <button
                class="view-btn"
                onclick="viewScholarship('${escapeAttribute(id)}')"
              >
                View
              </button>

            </div>

          </div>
        `;
      }
    )
    .join("");

}


/* =====================================
   EDIT SCHOLARSHIP
===================================== */

window.editScholarship =
async function(id){

  const scholarship =
    scholarships.find(
      item =>
        item.id === id
    );

  if(!scholarship){

    showToast(

/* =====================================
   VIEW SCHOLARSHIP
===================================== */

window.viewScholarship =
function(id){

  const scholarship =
    scholarships.find(
      item =>
        item.id === id
    );

  if(!scholarship){

    showToast(
      "Scholarship not found",
      "error"
    );

    return;

  }


  const title =
    escapeHtml(
      scholarship.title ||
      "Scholarship"
    );

  const provider =
    escapeHtml(
      scholarship.provider ||
      "Unknown"
    );

  const description =
    escapeHtml(
      scholarship.description ||
      "No description available."
    );

  const link =
    scholarship.link || "";


  document.getElementById(
    "viewModal"
  ).innerHTML = `

    <div class="modal-content">

      <button
        class="modal-close"
        onclick="closeViewModal()"
      >
        ×
      </button>

      <div class="modal-icon">
        🎓
      </div>

      <h2>
        ${title}
      </h2>

      <p class="provider">
        ${provider}
      </p>

      <div class="view-description">
        ${description}
      </div>

      ${
        link
          ? `
            <a
              href="${escapeAttribute(link)}"
              target="_blank"
              rel="noopener noreferrer"
              class="apply-link"
            >
              🔗 Open Scholarship
            </a>
          `
          : ""
      }

    </div>
  `;


  document.getElementById(
    "viewModal"
  ).classList.add(
    "show"
  );

};


/* =====================================
   CLOSE VIEW MODAL
===================================== */

window.closeViewModal =
function(){

  const modal =
    document.getElementById(
      "viewModal"
    );

  if(modal){

    modal.classList.remove(
      "show"
    );

  }

};


/* =====================================
   DELETE SCHOLARSHIP
===================================== */

window.deleteScholarship =
async function(id){

  const scholarship =
    scholarships.find(
      item =>
        item.id === id
    );

  if(!scholarship){

    showToast(
      "Scholarship not found",
      "error"
    );

    return;

  }


  const confirmed =
    confirm(
      `Delete "${scholarship.title || "this scholarship"}"?`
    );

  if(!confirmed){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "scholarships",
        id
      )
    );


    showToast(
      "Scholarship deleted successfully",
      "success"
    );


    await loadScholarships();

  }
  catch(error){

    console.error(
      "Delete scholarship error:",
      error
    );


    showToast(
      "Failed to delete scholarship",
      "error"
    );

  }

};

/* =====================================
   SCHOLARSHIP FORM SUBMIT
===================================== */

document.getElementById(
  "scholarshipForm"
).addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const id =
      document.getElementById(
        "scholarshipId"
      ).value.trim();


    const title =
      document.getElementById(
        "scholarshipTitle"
      ).value.trim();


    const provider =
      document.getElementById(
        "scholarshipProvider"
      ).value.trim();


    const country =
      document.getElementById(
        "scholarshipCountry"
      ).value.trim();


    const category =
      document.getElementById(
        "scholarshipCategory"
      ).value.trim();


    const amount =
      document.getElementById(
        "scholarshipAmount"
      ).value.trim();


    const deadline =
      document.getElementById(
        "scholarshipDeadline"
      ).value;


    const description =
      document.getElementById(
        "scholarshipDescription"
      ).value.trim();


    const link =
      document.getElementById(
        "scholarshipLink"
      ).value.trim();


    const status =
      document.getElementById(
        "scholarshipStatus"
      ).value;


    if(!title){

      showToast(
        "Scholarship title is required",
        "error"
      );

      return;

    }


    const data = {

      title,

      provider,

      country,

      category,

      amount,

      deadline,

      description,

      link,

      status,

      updatedAt:
        serverTimestamp()

    };


    const button =
      document.getElementById(
        "submitBtn"
      );


    button.disabled =
      true;


    button.textContent =
      id
        ? "Updating..."
        : "Saving...";


    try{

      if(id){

        await updateDoc(
          doc(
            db,
            "scholarships",
            id
          ),
          data
        );


        showToast(
          "Scholarship updated successfully",
          "success"
        );

      }
      else{

        await addDoc(
          collection(
            db,
            "scholarships"
          ),
          {

            ...data,

            createdAt:
              serverTimestamp()

          }
        );


        showToast(
          "Scholarship added successfully",
          "success"
        );

      }


      resetScholarshipForm();

      await loadScholarships();

    }
    catch(error){

      console.error(
        "Save scholarship error:",
        error
      );


      showToast(
        "Unable to save scholarship",
        "error"
      );

    }
    finally{

      button.disabled =
        false;

      button.textContent =
        "Add Scholarship";

    }

  }
);
