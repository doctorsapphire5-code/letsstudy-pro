<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin SEO | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer}
header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
header h1{margin:0;flex:1;font-size:18px}
main{max-width:1200px;margin:auto;padding:18px}
.back{background:#eef2ff;color:#1d4ed8}
.primary{background:#2563eb;color:#fff}
.success{background:#dcfce7;color:#15803d}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat span{font-size:11px;color:#64748b}
.stat b{display:block;font-size:24px;margin-top:6px}
.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}
.field{margin-bottom:13px}
label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}
input,textarea,select{width:100%;padding:10px;border:1px solid #dbe1e8;border-radius:9px;background:#fff;outline:none}
textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:12px}
.check input{width:auto}
.score{width:150px;height:150px;border-radius:50%;border:12px solid #e5e7eb;display:flex;align-items:center;justify-content:center;margin:10px auto 20px}
.score b{font-size:32px}
.progress{height:9px;background:#e5e7eb;border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;background:#2563eb}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f4;font-size:12px}
.ok{color:#15803d}.bad{color:#dc2626}
.preview{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-top:10px}
.preview h3{color:#1a0dab;font-size:17px;margin:0 0 5px}
.preview p{font-size:12px;color:#444;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:white;padding:12px 15px;border-radius:9px;display:none;z-index:100;font-size:12px}
.toast.show{display:block}
@media(max-width:800px){
.stats{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr}
.row{grid-template-columns:1fr}
}
</style></head><body><header><button class="back"
onclick="location.href='admin-dashboard.html'">
←
</button>

<h1>🔎 SEO Management</h1><button class="primary"
onclick="saveSEO()">
💾 Save SEO
</button>

</header><main><section class="stats"><div class="card stat">
<span>SEO Score</span>
<b id="score">0%</b>
</div><div class="card stat">
<span>Pages Configured</span>
<b id="pages">0</b>
</div><div class="card stat">
<span>Indexable</span>
<b id="indexable">0</b>
</div><div class="card stat">
<span>Issues</span>
<b id="issues">0</b>
</div></section><div class="grid"><!-- SEO SETTINGS --><section class="card"><h2>Global SEO Settings</h2><div class="field"><label>Site Name</label>

<input
id="siteName"
value="LetsStudy Pro"
placeholder="Your website name">

</div><div class="field"><label>Meta Title</label>

<input
id="metaTitle"
maxlength="60"
placeholder="LetsStudy Pro | Online Learning Platform"
oninput="updatePreview()">

<small>
<span id="titleCount">0</span>/60 characters
</small></div><div class="field"><label>Meta Description</label>

<textarea
id="metaDescription"
maxlength="160"
rows="4"
placeholder="Learn online with courses, notes, past papers and scholarships."
oninput="updatePreview()"></textarea><small>
<span id="descriptionCount">0</span>/160 characters
</small></div><div class="field"><label>Keywords</label>

<input
id="keywords"
placeholder="education, courses, notes, scholarships">

</div><div class="row"><div class="field"><label>Canonical URL</label>

<input
id="canonical"
placeholder="https://www.letsstudy.pro/">

</div><div class="field"><label>Robots</label>

<select id="robots"><option value="index,follow">
index, follow
</option><option value="noindex,follow">
noindex, follow
</option><option value="index,nofollow">
index, nofollow
</option><option value="noindex,nofollow">
noindex, nofollow
</option></select></div></div><h3>Social SEO</h3><div class="field"><label>Open Graph Image</label>

<input
id="ogImage"
type="url"
placeholder="https://...">

</div><div class="field"><label>Twitter/X Card</label>

<select id="twitterCard"><option value="summary_large_image">
summary_large_image
</option><option value="summary">
summary
</option></select></div><div class="field"><label>Google Verification</label>

<input
id="googleVerification"
placeholder="Google Search Console verification">

</div><div class="field"><label>Bing Verification</label>

<input
id="bingVerification"
placeholder="Bing Webmaster verification">

</div><h3>Indexing Controls</h3><div class="field"><label class="check"><input
id="sitemapEnabled"
type="checkbox"
checked>

Enable Sitemap

</label></div><div class="field"><label class="check"><input
id="schemaEnabled"
type="checkbox"
checked>

Enable Structured Data

</label></div><div class="field"><label class="check"><input
id="breadcrumbs"
type="checkbox"
checked>

Enable Breadcrumb Schema

</label></div><div class="actions"><button
class="primary"
onclick="saveSEO()">
Save Changes
</button>

<button
class="back"
onclick="generateSitemap()">
Generate Sitemap
</button>

</div></section><!-- SEO AUDIT --><section class="card"><h2>SEO Audit</h2><div class="score"><b id="scoreCircle">0</b>

</div><div class="progress"><i id="scoreBar"
style="width:0%">
</i>

</div><div id="audit"><div class="empty">
Run SEO audit...
</div></div><h3>Google Preview</h3><div class="preview"><h3 id="previewTitle">
LetsStudy Pro
</h3><p id="previewUrl">
www.letsstudy.pro
</p><p id="previewDescription">
Learn online with LetsStudy Pro.
</p></div></section></div></main><div
id="toast"
class="toast">
Saved
</div><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
doc,
getDoc,
setDoc,
collection,
getDocs,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE
========================================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
 ADMIN AUTH
========================================= */

onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);

/* =========================================
 LOAD SEO
========================================= */

async function loadSEO(){

try{

const snap=
await getDoc(
doc(db,"settings","seo")
);

if(snap.exists()){

const x=snap.data();

set("siteName",x.siteName||"LetsStudy Pro");
set("metaTitle",x.metaTitle||"");
set("metaDescription",x.metaDescription||"");
set("keywords",x.keywords||"");
set("canonical",x.canonical||"");
set("robots",x.robots||"index,follow");
set("ogImage",x.ogImage||"");
set("twitterCard",x.twitterCard||"summary_large_image");
set("googleVerification",x.googleVerification||"");
set("bingVerification",x.bingVerification||"");

document.getElementById(
"sitemapEnabled"
).checked=x.sitemapEnabled!==false;

document.getElementById(
"schemaEnabled"
).checked=x.schemaEnabled!==false;

document.getElementById(
"breadcrumbs"
).checked=x.breadcrumbs!==false;

}

updatePreview();
runAudit();
loadPageStats();

}catch(error){

console.error(error);

toast("Unable to load SEO settings.");

}

}


/* =========================================
 SAVE
========================================= */

window.saveSEO=async function(){

const data={

siteName:get("siteName"),

metaTitle:get("metaTitle"),

metaDescription:get("metaDescription"),

keywords:get("keywords"),

canonical:get("canonical"),

robots:get("robots"),

ogImage:get("ogImage"),

twitterCard:get("twitterCard"),

googleVerification:get("googleVerification"),

bingVerification:get("bingVerification"),

sitemapEnabled:
document.getElementById(
"sitemapEnabled"
).checked,

schemaEnabled:
document.getElementById(
"schemaEnabled"
).checked,

breadcrumbs:
document.getElementById(
"breadcrumbs"
).checked,

updatedAt:serverTimestamp()

};

try{

await setDoc(
doc(db,"settings","seo"),
data,
{merge:true}
);

toast("SEO settings saved.");

runAudit();

}catch(error){

console.error(error);

toast("Unable to save SEO.");

}

};


/* =========================================
 AUDIT
========================================= */

function runAudit(){

const title=get("metaTitle");
const description=get("metaDescription");
const canonical=get("canonical");
const image=get("ogImage");

let checks=[];

checks.push({
name:"Meta title",
ok:title.length>=30 &&
title.length<=60
});

checks.push({
name:"Meta description",
ok:description.length>=70 &&
description.length<=160
});

checks.push({
name:"Canonical URL",
ok:canonical.startsWith("https://")
});

checks.push({
name:"Open Graph image",
ok:image.startsWith("https://")
});

checks.push({
name:"Robots enabled",
ok:get("robots").includes("index")
});

checks.push({
name:"Structured data",
ok:document.getElementById(
"schemaEnabled"
).checked
});

checks.push({
name:"Sitemap",
ok:document.getElementById(
"sitemapEnabled"
).checked
});

const passed=
checks.filter(x=>x.ok).length;

const score=
Math.round(
passed/checks.length*100
);


document.getElementById(
"score"
).textContent=
score+"%";

document.getElementById(
"scoreCircle"
).textContent=
score;

document.getElementById(
"scoreBar"
).style.width=
score+"%";


document.getElementById(
"issues"
).textContent=
checks.length-passed;


document.getElementById(
"audit"
).innerHTML=
checks.map(x=>`

<div class="item">

<span>
${x.name}
</span>

<strong class="${
x.ok?"ok":"bad"
}">

${x.ok?"✓ Good":"✕ Fix"}

</strong>

</div>

`).join("");

}


/* =========================================
 PAGE STATS
========================================= */

async function loadPageStats(){

try{

const snap=
await getDocs(
collection(db,"pages")
);

let indexable=0;

snap.forEach(d=>{

const x=d.data();

if(x.indexable!==false)
indexable++;

});

document.getElementById(
"pages"
).textContent=
snap.size;

document.getElementById(
"indexable"
).textContent=
indexable;

}catch(error){

console.log(error);

}

}


/* =========================================
 SITEMAP
========================================= */

window.generateSitemap=function(){

const canonical=
get("canonical");

if(!canonical){

toast(
"Add canonical URL first."
);

return;

}

toast(
"Sitemap settings saved. Generate sitemap.xml from your hosting deployment."
);

};


/* =========================================
 PREVIEW
========================================= */

window.updatePreview=function(){

const title=
get("metaTitle") ||
get("siteName") ||
"LetsStudy Pro";

const description=
get("metaDescription") ||
"Learn online with LetsStudy Pro.";

document.getElementById(
"previewTitle"
).textContent=
title;

document.getElementById(
"previewDescription"
).textContent=
description;

document.getElementById(
"titleCount"
).textContent=
get("metaTitle").length;

document.getElementById(
"descriptionCount"
).textContent=
get("metaDescription").length;

runAudit();

};


/* =========================================
 HELPERS
========================================= */

function get(id){

return document
.getElementById(id)
.value
.trim();

}

function set(id,value){

document.getElementById(id)
.value=value;

}

function toast(text){

const el=
document.getElementById("toast");

el.textContent=text;

el.classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
