<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Services Management | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

.container{
 max-width:1200px;
 margin:auto;
 padding:24px
}

.header,.stat,.toolbar,.card,.empty{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px
}

.header{
 padding:20px;
 margin-bottom:16px
}

h1,h2,h3,p{margin-top:0}

.muted{
 color:#667085;
 font-size:13px
}

.stats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:12px;
 margin-bottom:16px
}

.stat{
 padding:15px
}

.stat span{
 color:#667085;
 font-size:11px
}

.stat strong{
 display:block;
 margin-top:6px;
 font-size:22px
}

.toolbar{
 padding:12px;
 display:grid;
 grid-template-columns:2fr 1fr 1fr auto;
 gap:9px;
 margin-bottom:16px
}

input,select,textarea{
 width:100%;
 padding:11px;
 border:1px solid #d9dee8;
 border-radius:9px;
 background:#fff;
 outline:none
}

textarea{
 min-height:100px;
 resize:vertical
}

button{
 border:0;
 border-radius:9px;
 padding:10px 14px;
 cursor:pointer;
 font-weight:700
}

.primary{
 background:#155eef;
 color:#fff
}

.light{
 background:#eef2f6;
 color:#344054
}

.danger{
 background:#fee4e2;
 color:#b42318
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px
}

.card{
 overflow:hidden
}

.image{
 height:175px;
 background:#eef2f6;
 position:relative
}

.image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.badge{
 position:absolute;
 top:10px;
 left:10px;
 padding:5px 9px;
 border-radius:20px;
 font-size:10px;
 font-weight:800
}

.featured{
 background:#f59e0b;
 color:#fff
}

.status{
 position:absolute;
 right:10px;
 top:10px
}

.published{
 background:#ecfdf3;
 color:#027a48
}

.draft{
 background:#f2f4f7;
 color:#475467
}

.body{
 padding:15px
}

.category{
 color:#155eef;
 font-size:10px;
 font-weight:800;
 text-transform:uppercase
}

.body h3{
 margin:5px 0;
 font-size:17px
}

.description{
 color:#667085;
 font-size:12px;
 line-height:1.6
}

.freelancer{
 font-size:12px;
 font-weight:700;
 margin:9px 0
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px
}

.tag{
 background:#f2f4f7;
 padding:5px 8px;
 border-radius:20px;
 font-size:10px
}

.info{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
 margin-top:10px
}

.info div{
 background:#f8fafc;
 padding:8px;
 border-radius:7px;
 font-size:10px;
 color:#667085
}

.info b{
 display:block;
 color:#172033;
 font-size:12px;
 margin-top:3px
}

.rating{
 color:#f59e0b;
 font-size:12px;
 margin-top:9px
}

.actions{
 display:flex;
 gap:7px;
 margin-top:12px
}

.actions button{
 flex:1;
 font-size:11px
}

.empty{
 grid-column:1/-1;
 padding:55px;
 text-align:center;
 color:#667085
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:15px
}

.modal.show{
 display:flex
}

.modal-box{
 background:#fff;
 width:min(900px,100%);
 max-height:92vh;
 overflow:auto;
 padding:20px;
 border-radius:15px
}

.close{
 float:right;
 background:#f2f4f7
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.group label{
 display:block;
 font-size:12px;
 font-weight:700;
 margin-bottom:5px
}

.full{
 grid-column:1/-1
}

.save{
 width:100%;
 margin-top:12px
}

@media(max-width:900px){
 .stats{
  grid-template-columns:repeat(2,1fr)
 }
 .grid{
  grid-template-columns:repeat(2,1fr)
 }
 .toolbar{
  grid-template-columns:1fr 1fr
 }
}

@media(max-width:600px){
 .container{padding:15px}
 .stats,.grid,.toolbar,.form-grid{
  grid-template-columns:1fr
 }
 .full{grid-column:auto}
}
</style>
</head>

<body>

<main class="container">

<section class="header">

<h1>
<i class="fa-solid fa-briefcase"></i>
Services Management
</h1>

<p class="muted">
Manage freelancer services, pricing, packages,
publishing, verification and service performance.
</p>

</section>


<section class="stats">

<div class="stat">
<span>Total Services</span>
<strong id="total">0</strong>
</div>

<div class="stat">
<span>Published</span>
<strong id="published">0</strong>
</div>

<div class="stat">
<span>Drafts</span>
<strong id="drafts">0</strong>
</div>

<div class="stat">
<span>Featured</span>
<strong id="featured">0</strong>
</div>

<div class="stat">
<span>Orders</span>
<strong id="orders">0</strong>
</div>

</section>


<section class="toolbar">

<input
id="search"
placeholder="Search services or freelancers...">

<select id="statusFilter">
<option value="">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>

<select id="categoryFilter">
<option value="">All Categories</option>
</select>

<button
id="addBtn"
class="primary">

<i class="fa fa-plus"></i>
Add Service

</button>

</section>


<section
id="services"
class="grid">

<div class="empty">
Loading services...
</div>

</section>

</main>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="modal-box">

<button id="close" class="close">
<i class="fa fa-xmark"></i>
</button>

<h2 id="modalTitle">
Add Service
</h2>

<form id="form">

<div class="form-grid">


<div class="group">
<label>Freelancer ID</label>
<input id="freelancerId">
</div>


<div class="group">
<label>User ID</label>
<input id="userId">
</div>


<div class="group">
<label>Freelancer Name</label>
<input id="freelancerName">
</div>


<div class="group">
<label>Service Title</label>
<input id="title" required>
</div>


<div class="group">
<label>Slug</label>
<input id="slug">
</div>


<div class="group">
<label>Category</label>
<input id="category">
</div>


<div class="group">
<label>Subcategory</label>
<input id="subcategory">
</div>


<div class="group">
<label>Pricing Type</label>

<select id="pricingType">

<option value="fixed">
Fixed
</option>

<option value="hourly">
Hourly
</option>

<option value="package">
Package
</option>

</select>

</div>


<div class="group">
<label>Price</label>
<input id="price" type="number" min="0">
</div>


<div class="group">
<label>Currency</label>
<input id="currency" value="TZS">
</div>


<div class="group">
<label>Delivery Time</label>
<input id="deliveryTime" placeholder="3 days">
</div>


<div class="group">
<label>Revisions</label>
<input id="revisions" type="number" min="0">
</div>


<div class="group">
<label>Status</label>

<select id="status">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>

</div>


<div class="group">
<label>Featured</label>

<select id="featured">

<option value="false">
No
</option>

<option value="true">
Yes
</option>

</select>

</div>


<div class="group">
<label>Verified</label>

<select id="verified">

<option value="false">
No
</option>

<option value="true">
Yes
</option>

</select>

</div>


<div class="group">
<label>Thumbnail</label>
<input id="thumbnail">
</div>


<div class="group">
<label>Video URL</label>
<input id="video">
</div>


<div class="group full">
<label>Gallery URLs</label>

<input
id="gallery"
placeholder="url1,url2,url3">

</div>


<div class="group full">
<label>Skills</label>

<input
id="skills"
placeholder="Design, Photoshop, Branding">

</div>


<div class="group full">
<label>Tags</label>

<input
id="tags"
placeholder="logo, design, business">

</div>


<div class="group full">
<label>Short Description</label>

<textarea id="shortDescription"></textarea>

</div>


<div class="group full">
<label>Description</label>

<textarea id="description"></textarea>

</div>


<div class="group full">
<label>Requirements</label>

<textarea
id="requirements"
placeholder="What the client must provide..."></textarea>

</div>


<div class="group full">
<label>Packages JSON</label>

<textarea
id="packages"
placeholder='[{"name":"Basic","price":10000,"deliveryTime":"3 days"}]'></textarea>

</div>

</div>


<button
class="primary save">

<i class="fa fa-save"></i>
Save Service

</button>

</form>

</div>

</div>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


let services=[];
let editingId=null;


const list=
document.getElementById("services");

const modal=
document.getElementById("modal");

const form=
document.getElementById("form");


function esc(value=""){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
 LOAD
========================= */

async function loadServices(){

try{

const snap=
await getDocs(
collection(db,"services")
);

services=[];

snap.forEach(item=>{

services.push({
id:item.id,
...item.data()
});

});

updateStats();
buildCategories();
render();

}catch(error){

console.error(error);

list.innerHTML=`

<div class="empty">

<i class="fa fa-triangle-exclamation"></i>

<h3>
Unable to load services
</h3>

</div>

`;

}

}


/* =========================
 STATS
========================= */

function updateStats(){

document.getElementById("total")
.textContent=services.length;

document.getElementById("published")
.textContent=
services.filter(
s=>s.status==="published"
).length;

document.getElementById("drafts")
.textContent=
services.filter(
s=>s.status==="draft"
).length;

document.getElementById("featured")
.textContent=
services.filter(
s=>s.featured===true
).length;

document.getElementById("orders")
.textContent=
services.reduce(
(a,s)=>a+Number(s.ordersCount||0),
0
).toLocaleString();

}


/* =========================
 CATEGORIES
========================= */

function buildCategories(){

const categories=
[
...new Set(
services
.map(s=>s.category)
.filter(Boolean)
)
].sort();

document.getElementById(
"categoryFilter"
).innerHTML=

`<option value="">
All Categories
</option>`+

categories.map(
c=>`

<option value="${esc(c)}">
${esc(c)}
</option>

`
).join("");

}


/* =========================
 RENDER
========================= */

function render(){

const keyword=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const status=
document.getElementById("statusFilter")
.value;

const category=
document.getElementById("categoryFilter")
.value;


const data=
services.filter(s=>{

const text=`

${s.title||""}
${s.freelancerName||""}
${s.category||""}
${s.subcategory||""}
${s.description||""}
${Array.isArray(s.skills)
?s.skills.join(" ")
:s.skills||""}

`.toLowerCase();

return(

text.includes(keyword)

&&
(!status||s.status===status)

&&
(!category||s.category===category)

);

});


if(!data.length){

list.innerHTML=`

<div class="empty">

<i class="fa fa-briefcase"></i>

<h3>
No services found
</h3>

</div>

`;

return;

}


data.sort(
(a,b)=>
Number(b.featured||false)-
Number(a.featured||false)
);


list.innerHTML=
data.map(card).join("");

}


/* =========================
 CARD
========================= */

function card(s){

let skills=[];

if(Array.isArray(s.skills))
skills=s.skills;

else if(typeof s.skills==="string")
skills=s.skills.split(",");


return`

<article class="card">

<div class="image">

<img
src="${esc(
s.thumbnail||
"https://via.placeholder.com/700x400?text=Service"
)}"
alt="${esc(s.title)}">


${
s.featured
?
`<span class="badge featured">
★ Featured
</span>`
:""
}


<span
class="badge status ${
s.status==="published"
?"published"
:"draft"
}">

${esc(
s.status||"draft"
)}

</span>

</div>


<div class="body">

<div class="category">
${esc(
s.category||
"Service"
)}
</div>


<h3>
${esc(
s.title||
"Untitled Service"
)}
</h3>


<p class="description">
${esc(
s.shortDescription||
s.description||
""
)}
</p>


<div class="freelancer">

<i class="fa fa-user"></i>

${esc(
s.freelancerName||
"Freelancer"
)}

${
s.verified
?
`<i
class="fa fa-circle-check"
style="color:#12b76a">
</i>`
:""
}

</div>


<div class="tags">

${skills
.slice(0,4)
.map(
x=>
`<span class="tag">
${esc(String(x).trim())}
</span>`
)
.join("")}

</div>


<div class="rating">

★
${Number(
s.rating||0
).toFixed(1)}

<span style="color:#667085">

(${Number(
s.ratingCount||0
)})

</span>

</div>


<div class="info">

<div>
Price
<b>
${esc(s.currency||"TZS")}
${Number(
s.price||0
).toLocaleString()
}</b>
</div>

<div>
Delivery
<b>
${esc(
s.deliveryTime||"-"
)}
</b>
</div>

<div>
Orders
<b>
${Number(
s.ordersCount||0
).toLocaleString()
}</b>
</div>

<div>
Views
<b>
${Number(
s.views||0
).toLocaleString()
}</b>
</div>

</div>


<div class="actions">

<button
class="light"
onclick="editService('${s.id}')">

<i class="fa fa-edit"></i>
Edit

</button>


<button
class="primary"
onclick="toggleService('${s.id}')">

<i class="fa fa-toggle-on"></i>

</button>


<button
class="danger"
onclick="deleteService('${s.id}')">

<i class="fa fa-trash"></i>

</button>

</div>

</div>

</article>

`;

}


/* =========================
 FILTERS
========================= */

document
.getElementById("search")
.addEventListener(
"input",
render
);

document
.getElementById("statusFilter")
.addEventListener(
"change",
render
);

document
.getElementById("categoryFilter")
.addEventListener(
"change",
render
);


/* =========================
 ADD
========================= */

document
.getElementById("addBtn")
.onclick=()=>{

editingId=null;

form.reset();

document.getElementById(
"currency"
).value="TZS";

document.getElementById(
"status"
).value="draft";

document.getElementById(
"featured"
).value="false";

document.getElementById(
"verified"
).value="false";

document.getElementById(
"modalTitle"
).textContent=
"Add Service";

modal.classList.add("show");

};


/* =========================
 CLOSE
========================= */

document
.getElementById("close")
.onclick=()=>{

modal.classList.remove("show");

};


/* =========================
 SAVE
========================= */

form.onsubmit=
async e=>{

e.preventDefault();


let packages=[];

try{

const raw=
document.getElementById(
"packages"
).value.trim();

if(raw)
packages=JSON.parse(raw);

}catch(error){

alert(
"Packages must contain valid JSON."
);

return;

}


const data={

freelancerId:
document.getElementById(
"freelancerId"
).value.trim(),

userId:
document.getElementById(
"userId"
).value.trim(),

freelancerName:
document.getElementById(
"freelancerName"
).value.trim(),

title:
document.getElementById(
"title"
).value.trim(),

slug:
document.getElementById(
"slug"
).value.trim(),

description:
document.getElementById(
"description"
).value.trim(),

shortDescription:
document.getElementById(
"shortDescription"
).value.trim(),

category:
document.getElementById(
"category"
).value.trim(),

subcategory:
document.getElementById(
"subcategory"
).value.trim(),

skills:
document.getElementById(
"skills"
).value
.split(",")
.map(x=>x.trim())
.filter(Boolean),

thumbnail:
document.getElementById(
"thumbnail"
).value.trim(),

gallery:
document.getElementById(
"gallery"
).value
.split(",")
.map(x=>x.trim())
.filter(Boolean),

video:
document.getElementById(
"video"
).value.trim(),

pricingType:
document.getElementById(
"pricingType"
).value,

price:
Number(
document.getElementById(
"price"
).value||0
),

currency:
document.getElementById(
"currency"
).value.trim()||"TZS",

deliveryTime:
document.getElementById(
"deliveryTime"
).value.trim(),

revisions:
Number(
document.getElementById(
"revisions"
).value||0
),

packages:packages,

requirements:
document.getElementById(
"requirements"
).value.trim(),

tags:
document.getElementById(
"tags"
).value
.split(",")
.map(x=>x.trim())
.filter(Boolean),

featured:
document.getElementById(
"featured"
).value==="true",

verified:
document.getElementById(
"verified"
).value==="true",

status:
document.getElementById(
"status"
).value,

updatedAt:
serverTimestamp()

};


try{

if(editingId){

await updateDoc(

doc(
db,
"services",
editingId
),

data

);

}else{

data.ordersCount=0;
data.views=0;
data.likes=0;
data.rating=0;
data.ratingCount=0;

data.createdAt=
serverTimestamp();

data.publishedAt=
data.status==="published"
?serverTimestamp()
:null;


await addDoc(
collection(db,"services"),
data
);

}


modal.classList.remove(
"show"
);

await loadServices();

}catch(error){

console.error(error);

alert(
"Unable to save service."
);

}

};


/* =========================
 EDIT
========================= */

window.editService=
id=>{

const s=
services.find(
x=>x.id===id
);

if(!s)return;

editingId=id;


const fields=[

"freelancerId",
"userId",
"freelancerName",
"title",
"slug",
"description",
"shortDescription",
"category",
"subcategory",
"video",
"price",
"currency",
"deliveryTime",
"revisions",
"requirements"

];


fields.forEach(key=>{

const el=
document.getElementById(key);

if(el)
el.value=s[key]??"";

});


document.getElementById(
"pricingType"
).value=
s.pricingType||"fixed";


document.getElementById(
"thumbnail"
).value=
s.thumbnail||"";


document.getElementById(
"skills"
).value=
Array.isArray(s.skills)
?s.skills.join(", ")
:s.skills||"";


document.getElementById(
"tags"
).value=
Array.isArray(s.tags)
?s.tags.join(", ")
:s.tags||"";


document.getElementById(
"gallery"
).value=
Array.isArray(s.gallery)
?s.gallery.join(", ")
:s.gallery||"";


document.getElementById(
"packages"
).value=
s.packages
?JSON.stringify(
s.packages,
null,
2
)
:"";


document.getElementById(
"featured"
).value=
s.featured?"true":"false";


document.getElementById(
"verified"
).value=
s.verified?"true":"false";


document.getElementById(
"status"
).value=
s.status||"draft";


document.getElementById(
"modalTitle"
).textContent=
"Edit Service";


modal.classList.add("show");

};


/* =========================
 PUBLISH
========================= */

window.toggleService=
async id=>{

const s=
services.find(
x=>x.id===id
);

if(!s)return;


const status=
s.status==="published"
?"draft"
:"published";


try{

await updateDoc(

doc(
db,
"services",
id
),

{

status:status,

publishedAt:
status==="published"
?serverTimestamp()
:s.publishedAt||null,

updatedAt:
serverTimestamp()

}

);

await loadServices();

}catch(error){

console.error(error);

alert(
"Unable to update status."
);

}

};


/* =========================
 DELETE
========================= */

window.deleteService=
async id=>{

if(
!confirm(
"Delete this service permanently?"
)
)return;


try{

await deleteDoc(

doc(
db,
"services",
id
)

);

await loadServices();

}catch(error){

console.error(error);

alert(
"Unable to delete service."
);

}

};


/* =========================
 START
========================= */

loadServices();

</script>

</body>
</html>
