<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Services Management | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f6f8fb;
color:#172033;
font-family:Inter,Arial,sans-serif
}

.container{
max-width:1200px;
margin:auto;
padding:24px
}

.header,.stat,.toolbar,.card,.empty{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px
}

.header{
padding:20px;
margin-bottom:16px
}

h1,h2,h3,p{margin-top:0}

.muted{
color:#667085;
font-size:13px
}

.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
margin-bottom:16px
}

.stat{
padding:15px
}

.stat span{
color:#667085;
font-size:11px
}

.stat strong{
display:block;
margin-top:6px;
font-size:22px
}

.toolbar{
padding:12px;
display:grid;
grid-template-columns:2fr 1fr 1fr auto;
gap:9px;
margin-bottom:16px
}

input,select,textarea{
width:100%;
padding:11px;
border:1px solid #d9dee8;
border-radius:9px;
background:#fff;
outline:none
}

textarea{
min-height:100px;
resize:vertical
}

button{
border:0;
border-radius:9px;
padding:10px 14px;
cursor:pointer;
font-weight:700
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.primary{
background:#155eef;
color:#fff
}

.light{
background:#eef2f6;
color:#344054
}

.danger{
background:#fee4e2;
color:#b42318
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}

.card{
overflow:hidden
}

.image{
height:175px;
background:#eef2f6;
position:relative
}

.image img{
width:100%;
height:100%;
object-fit:cover
}

.badge{
position:absolute;
top:10px;
left:10px;
padding:5px 9px;
border-radius:20px;
font-size:10px;
font-weight:800
}

.featured{
background:#f59e0b;
color:#fff
}

.status{
position:absolute;
right:10px;
top:10px
}

.published{
background:#ecfdf3;
color:#027a48
}

.draft{
background:#f2f4f7;
color:#475467
}

.body{
padding:15px
}

.category{
color:#155eef;
font-size:10px;
font-weight:800;
text-transform:uppercase
}

.body h3{
margin:5px 0;
font-size:17px
}

.description{
color:#667085;
font-size:12px;
line-height:1.6
}

.freelancer{
font-size:12px;
font-weight:700;
margin:9px 0
}

.tags{
display:flex;
flex-wrap:wrap;
gap:5px
}

.tag{
background:#f2f4f7;
padding:5px 8px;
border-radius:20px;
font-size:10px
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-top:10px
}

.info div{
background:#f8fafc;
padding:8px;
border-radius:7px;
font-size:10px;
color:#667085
}

.info b{
display:block;
color:#172033;
font-size:12px;
margin-top:3px
}

.rating{
color:#f59e0b;
font-size:12px;
margin-top:9px
}

.actions{
display:flex;
gap:7px;
margin-top:12px
}

.actions button{
flex:1;
font-size:11px
}

.empty{
grid-column:1/-1;
padding:55px;
text-align:center;
color:#667085
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
align-items:center;
justify-content:center;
padding:15px
}

.modal.show{
display:flex
}

.modal-box{
background:#fff;
width:min(900px,100%);
max-height:92vh;
overflow:auto;
padding:20px;
border-radius:15px
}

.close{
float:right;
background:#f2f4f7
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.group label{
display:block;
font-size:12px;
font-weight:700;
margin-bottom:5px
}

.full{
grid-column:1/-1
}

.save{
width:100%;
margin-top:12px
}

@media(max-width:900px){

.stats{
grid-template-columns:repeat(2,1fr)
}

.grid{
grid-template-columns:repeat(2,1fr)
}

.toolbar{
grid-template-columns:1fr 1fr
}

}

@media(max-width:600px){

.container{
padding:15px
}

.stats,
.grid,
.toolbar,
.form-grid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

}
</style>
</head>

<body>

<main class="container">

<section class="header">

<h1>
<i class="fa-solid fa-briefcase"></i>
Services Management
</h1>

<p class="muted">
Manage freelancer services, pricing, packages,
publishing, verification and service performance.
</p>

</section>


<section class="stats">

<div class="stat">
<span>Total Services</span>
<strong id="total">0</strong>
</div>

<div class="stat">
<span>Published</span>
<strong id="published">0</strong>
</div>

<div class="stat">
<span>Drafts</span>
<strong id="drafts">0</strong>
</div>

<div class="stat">
<span>Featured</span>
<strong id="featured">0</strong>
</div>

<div class="stat">
<span>Orders</span>
<strong id="orders">0</strong>
</div>

</section>


<section class="toolbar">

<input
id="search"
placeholder="Search services or freelancers...">

<select id="statusFilter">

<option value="">
All Status
</option>

<option value="published">
Published
</option>

<option value="draft">
Draft
</option>

</select>


<select id="categoryFilter">

<option value="">
All Categories
</option>

</select>


<button id="addBtn" class="primary">

<i class="fa fa-plus"></i>
Add Service

</button>

</section>


<section id="services" class="grid">

<div class="empty">

<i class="fa fa-spinner fa-spin"></i>

<p>
Loading services...
</p>

</div>

</section>

</main>


<!-- =========================================
MODAL
========================================= -->

<div id="modal" class="modal">

<div class="modal-box">

<button id="close" class="close">

<i class="fa fa-xmark"></i>

</button>


<h2 id="modalTitle">
Add Service
</h2>


<form id="form">

<div class="form-grid">


<div class="group">

<label>
Freelancer ID
</label>

<input id="freelancerId">

</div>


<div class="group">

<label>
User ID
</label>

<input id="userId">

</div>


<div class="group">

<label>
Freelancer Name
</label>

<input id="freelancerName">

</div>


<div class="group">

<label>
Service Title
</label>

<input id="title" required>

</div>


<div class="group">

<label>
Slug
</label>

<input id="slug">

</div>


<div class="group">

<label>
Category
</label>

<input id="category">

</div>


<div class="group">

<label>
Subcategory
</label>

<input id="subcategory">

</div>


<div class="group">

<label>
Pricing Type
</label>

<select id="pricingType">

<option value="fixed">
Fixed
</option>

<option value="hourly">
Hourly
</option>

<option value="package">
Package
</option>

</select>

</div>


<div class="group">

<label>
Price
</label>

<input
id="price"
type="number"
min="0"
step="0.01">

</div>


<div class="group">

<label>
Currency
</label>

<input
id="currency"
value="TZS">

</div>


<div class="group">

<label>
Delivery Time
</label>

<input
id="deliveryTime"
placeholder="3 days">

</div>


<div class="group">

<label>
Revisions
</label>

<input
id="revisions"
type="number"
min="0">

</div>


<div class="group">

<label>
Status
</label>

<select id="status">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>

</div>


<div class="group">

<label>
Featured
</label>

<select id="featured">

<option value="false">
No
</option>

<option value="true">
Yes
</option>

</select>

</div>


<div class="group">

<label>
Verified
</label>

<select id="verified">

<option value="false">
No
</option>

<option value="true">
Yes
</option>

</select>

</div>


<div class="group">

<label>
Thumbnail
</label>

<input
id="thumbnail"
type="url">

</div>


<div class="group">

<label>
Video URL
</label>

<input
id="video"
type="url">

</div>


<div class="group full">

<label>
Gallery URLs
</label>

<input
id="gallery"
placeholder="url1,url2,url3">

</div>


<div class="group full">

<label>
Skills
</label>

<input
id="skills"
placeholder="Design, Photoshop, Branding">

</div>


<div class="group full">

<label>
Tags
</label>

<input
id="tags"
placeholder="logo, design, business">

</div>


<div class="group full">

<label>
Short Description
</label>

<textarea id="shortDescription"></textarea>

</div>


<div class="group full">

<label>
Description
</label>

<textarea id="description"></textarea>

</div>


<div class="group full">

<label>
Requirements
</label>

<textarea
id="requirements"
placeholder="What the client must provide..."></textarea>

</div>


<div class="group full">

<label>
Packages JSON
</label>

<textarea
id="packages"
placeholder='[{"name":"Basic","price":10000,"deliveryTime":"3 days"}]'></textarea>

</div>


</div>


<button
id="saveBtn"
class="primary save">

<i class="fa fa-save"></i>
Save Service

</button>

</form>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rj0rodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


let services=[];

let editingId=null;


const list=
document.getElementById("services");

const modal=
document.getElementById("modal");

const form=
document.getElementById("form");

const saveBtn=
document.getElementById("saveBtn");


/* =========================================
 LOAD SERVICES
========================================= */

async function loadServices(){

list.innerHTML=`

<div class="empty">

<i class="fa fa-spinner fa-spin"></i>

<p>
Loading services...
</p>

</div>

`;


try{

const snap=
await getDocs(
collection(db,"services")
);


services=
snap.docs.map(item=>({

id:item.id,
...item.data()

}));


updateStats();

buildCategories();

render();


}catch(error){

console.error(
"Services load error:",
error
);


services=[];

updateStats();


list.innerHTML=`

<div class="empty">

<i class="fa fa-triangle-exclamation"></i>

<h3>
Unable to load services
</h3>

<p>
${esc(error.message||"Please try again.")}
</p>

</div>

`;

}

}


/* =========================================
 STATS
========================================= */

function updateStats(){

document.getElementById("total")
.textContent=services.length;


document.getElementById("published")
.textContent=
services.filter(
s=>
String(s.status||"draft")
.toLowerCase()==="published"
).length;


document.getElementById("drafts")
.textContent=
services.filter(
s=>
String(s.status||"draft")
.toLowerCase()==="draft"
).length;


document.getElementById("featured")
.textContent=
services.filter(
s=>s.featured===true
).length;


document.getElementById("orders")
.textContent=
services.reduce(
(total,s)=>
total+Number(s.ordersCount||0),
0
).toLocaleString();

}


/* =========================================
 CATEGORIES
========================================= */

function buildCategories(){

const categories=[

...new Set(

services

.map(
s=>String(s.category||"").trim()
)

.filter(Boolean)

)

].sort(
(a,b)=>a.localeCompare(b)
);


document.getElementById(
"categoryFilter"
).innerHTML=

`<option value="">
All Categories
</option>`+

categories.map(c=>

`<option value="${escAttr(c)}">
${esc(c)}
</option>`

).join("");

}


/* =========================================
 RENDER
========================================= */

function render(){

const keyword=
document.getElementById("search")
.value
.toLowerCase()
.trim();


const status=
document.getElementById("statusFilter")
.value;


const category=
document.getElementById("categoryFilter")
.value;


const data=
services.filter(s=>{

const skills=
Array.isArray(s.skills)
?s.skills.join(" ")
:String(s.skills||"");


const tags=
Array.isArray(s.tags)
?s.tags.join(" ")
:String(s.tags||"");


const text=`

${s.title||""}

${s.freelancerName||""}

${s.category||""}

${s.subcategory||""}

${s.description||""}

${s.shortDescription||""}

${skills}

${tags}

`

.toLowerCase();


const serviceStatus=
String(s.status||"draft")
.toLowerCase();


return(

text.includes(keyword)&&

(!status||
serviceStatus===status)&&

(!category||
String(s.category||"")===category)

);

});


data.sort(
(a,b)=>
Number(b.featured===true)-
Number(a.featured===true)
);


if(!data.length){

list.innerHTML=`

<div class="empty">

<i class="fa fa-briefcase"></i>

<h3>
No services found
</h3>

<p>
Try changing your search or filters.
</p>

</div>

`;

return;

}


list.innerHTML=
data.map(card).join("");

}


/* =========================================
 CARD
========================================= */

function card(s){

let skills=[];


if(Array.isArray(s.skills)){

skills=s.skills;

}else if(
typeof s.skills==="string"
){

skills=
s.skills
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}


const status=
String(s.status||"draft")
.toLowerCase();


const price=
Number(s.price||0);


const image=
s.thumbnail||
"https://via.placeholder.com/700x400?text=Service";


return`

<article class="card">


<div class="image">

<img
src="${escAttr(image)}"
alt="${escAttr(s.title||"Service")}"
onerror="this.src='https://via.placeholder.com/700x400?text=Service'">


${
s.featured===true
?
`

<span class="badge featured">
★ Featured
</span>

`
:""
}


<span
class="badge status ${
status==="published"
?"published"
:"draft"
}">

${esc(status)}

</span>

</div>


<div class="body">


<div class="category">

${esc(s.category||"Service")}

</div>


<h3>

${esc(s.title||"Untitled Service")}

</h3>


<p class="description">

${esc(
s.shortDescription||
s.description||
"No description available."
)}

</p>


<div class="freelancer">

<i class="fa fa-user"></i>

${esc(
s.freelancerName||
"Freelancer"
)}


${
s.verified===true
?

`
<i
class="fa fa-circle-check"
style="color:#12b76a">
</i>
`

:""

}

</div>


<div class="tags">

${skills

.slice(0,4)

.map(x=>

`
<span class="tag">
${esc(x)}
</span>
`

)

.join("")}

</div>


<div class="rating">

★

${Number(
s.rating||0
).toFixed(1)}

<span
style="color:#667085">

(${Number(
s.ratingCount||0
)})

</span>

</div>


<div class="info">


<div>

Price

<b>

${esc(
s.currency||"TZS"
)}

${price.toLocaleString()}

</b>

</div>


<div>

Delivery

<b>

${esc(
s.deliveryTime||"-"
)}

</b>

</div>


<div>

Orders

<b>

${Number(
s.ordersCount||0
).toLocaleString()}

</b>

</div>


<div>

Views

<b>

${Number(
s.views||0
).toLocaleString()}

</b>

</div>


</div>


<div class="actions">


<button
class="light"
data-id="${escAttr(s.id)}"
onclick="editService(this.dataset.id)">

<i class="fa fa-edit"></i>

Edit

</button>


<button
class="primary"
data-id="${escAttr(s.id)}"
onclick="toggleService(this.dataset.id)"
title="${
status==="published"
?"Unpublish"
:"Publish"
}">

<i class="fa fa-toggle-on"></i>

</button>


<button
class="danger"
data-id="${escAttr(s.id)}"
onclick="deleteService(this.dataset.id)">

<i class="fa fa-trash"></i>

</button>


</div>


</div>

</article>

`;

}


/* =========================================
 FILTERS
========================================= */

document.getElementById("search")
.addEventListener(
"input",
render
);


document.getElementById("statusFilter")
.addEventListener(
"change",
render
);


document.getElementById("categoryFilter")
.addEventListener(
"change",
render
);


/* =========================================
 ADD
========================================= */

document.getElementById("addBtn")
.onclick=()=>{

editingId=null;

form.reset();


document.getElementById("currency")
.value="TZS";


document.getElementById("status")
.value="draft";


document.getElementById("featured")
.value="false";


document.getElementById("verified")
.value="false";


document.getElementById("pricingType")
.value="fixed";


document.getElementById("modalTitle")
.textContent=
"Add Service";


modal.classList.add("show");

};


/* =========================================
 CLOSE
========================================= */

document.getElementById("close")
.onclick=
closeModal;


function closeModal(){

modal.classList.remove("show");

editingId=null;

}


/* =========================================
 BACKDROP / ESC
========================================= */

modal.addEventListener(
"click",
e=>{

if(e.target===modal){

closeModal();

}

});


document.addEventListener(
"keydown",
e=>{

if(e.key==="Escape"){

closeModal();

}

});


/* =========================================
 AUTO SLUG
========================================= */

document.getElementById("title")
.addEventListener(
"input",
()=>{

const slugInput=
document.getElementById("slug");


if(
!editingId &&
!slugInput.value.trim()
){

slugInput.value=
slugify(
document.getElementById("title")
.value
);

}

});


/* =========================================
 SAVE
========================================= */

form.onsubmit=
async e=>{

e.preventDefault();


const title=
getValue("title");


if(!title){

alert(
"Service title is required."
);

return;

}


let packages=[];


const packagesRaw=
getValue("packages");


if(packagesRaw){

try{

packages=
JSON.parse(packagesRaw);


if(!Array.isArray(packages)){

throw new Error(
"Packages must be an array."
);

}

}catch(error){

alert(
"Packages JSON is invalid."
);

return;

}

}


const slug=
getValue("slug")||
slugify(title);


const currentUser=
auth.currentUser;


const data={

freelancerId:
getValue("freelancerId"),

userId:
getValue("userId"),

freelancerName:
getValue("freelancerName"),

title:title,

slug:slug,

description:
getValue("description"),

shortDescription:
getValue("shortDescription"),

category:
getValue("category"),

subcategory:
getValue("subcategory"),

pricingType:
getValue("pricingType")||
"fixed",

price:
Math.max(
0,
Number(
getValue("price")||0
)
),

currency:
getValue("currency")||
"TZS",

deliveryTime:
getValue("deliveryTime"),

revisions:
Math.max(
0,
Number(
getValue("revisions")||0
)
),

status:
getValue("status")||
"draft",

featured:
getValue("featured")==="true",

verified:
getValue("verified")==="true",

thumbnail:
getValue("thumbnail"),

video:
getValue("video"),

gallery:
csvArray("gallery"),

skills:
csvArray("skills"),

tags:
csvArray("tags"),

requirements:
getValue("requirements"),

packages:packages,

updatedAt:
serverTimestamp()

};


/*
ADMIN OWNERSHIP

If logged-in admin:
adminId = current admin UID

If not logged-in:
no adminId is forced.
*/


if(
currentUser
){

data.userId=
getValue("userId")||
currentUser.uid;

}


/* =========================================
 SAVE
========================================= */

saveBtn.disabled=true;

saveBtn.innerHTML=
`
<i class="fa fa-spinner fa-spin"></i>
Saving...
`;


try{


if(editingId){

await updateDoc(

doc(
db,
"services",
editingId
),

data

);


}else{


data.ordersCount=0;

data.views=0;

data.likes=0;

data.rating=0;

data.ratingCount=0;


/*
Only authenticated creator gets adminId.
*/

if(currentUser){

data.adminId=
currentUser.uid;

data.createdBy=
currentUser.uid;

}


data.createdAt=
serverTimestamp();


data.publishedAt=
data.status==="published"
?serverTimestamp()
:null;


await addDoc(

collection(
db,
"services"
),

data

);

}


closeModal();

await loadServices();


}catch(error){

console.error(
"Save service error:",
error
);


alert(
error.code==="permission-denied"
?
"Permission denied. Check Firestore rules."
:
(
error.message||
"Unable to save service."
)
);


}finally{

saveBtn.disabled=false;

saveBtn.innerHTML=
`
<i class="fa fa-save"></i>
Save Service
`;

}

};


/* =========================================
 EDIT
========================================= */

window.editService=
function(id){

const s=
services.find(
x=>x.id===id
);


if(!s)return;


editingId=id;


const fields=[

"freelancerId",
"userId",
"freelancerName",
"title",
"slug",
"description",
"shortDescription",
"category",
"subcategory",
"pricingType",
"price",
"currency",
"deliveryTime",
"revisions",
"status",
"featured",
"verified",
"thumbnail",
"video",
"gallery",
"skills",
"tags",
"requirements",
"packages",
"adminId",
"userId",
"createdAt",
"updatedAt"
];

const service = {};
fields.forEach(field => {
  const el = document.getElementById(field);
  if (el) {
    if (el.type === "checkbox") {
      service[field] = el.checked;
    } else if (field === "gallery" || field === "skills" || field === "tags") {
      service[field] = el.value
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);
    } else if (field === "price" || field === "revisions") {
      service[field] = Number(el.value) || 0;
    } else if (field === "packages") {
      try {
        service[field] = el.value.trim()
          ? JSON.parse(el.value)
          : [];
      } catch {
        service[field] = [];
      }
    } else {
      service[field] = el.value.trim();
    }
  }
});

if (!service.title) {
  alert("Service title is required.");
  return;
}

service.slug = service.slug || slugify(service.title);
service.updatedAt = serverTimestamp();

try {
  if (editingId) {
    await updateDoc(
      doc(db, "services", editingId),
      service
    );
  } else {
    const user = auth.currentUser;

    if (user) {
      service.userId = service.userId || user.uid;
      service.adminId = user.uid;
    }

    service.createdAt = serverTimestamp();

    await addDoc(
      collection(db, "services"),
      service
    );
  }

  closeModal();
  resetForm();
  await loadServices();

} catch (error) {
  console.error(error);
  alert("Failed to save service: " + error.message);
}
}

function editService(id) {
  const service = services.find(x => x.id === id);
  if (!service) return;

  editingId = id;

  document.getElementById("modalTitle").textContent = "Edit Service";

  Object.keys(service).forEach(key => {
    const el = document.getElementById(key);
    if (!el) return;

    if (el.type === "checkbox") {
      el.checked = !!service[key];
    } else if (Array.isArray(service[key])) {
      el.value = service[key].join(", ");
    } else if (key === "packages") {
      el.value = JSON.stringify(service[key] || [], null, 2);
    } else if (
      key !== "createdAt" &&
      key !== "updatedAt"
    ) {
      el.value = service[key] ?? "";
    }
  });

  document.getElementById("serviceModal").classList.add("show");
}

async function togglePublish(id) {
  const service = services.find(x => x.id === id);
  if (!service) return;

  try {
    await updateDoc(
      doc(db, "services", id),
      {
        status:
          service.status === "published"
            ? "draft"
            : "published",
        updatedAt: serverTimestamp()
      }
    );

    await loadServices();
  } catch (error) {
    console.error(error);
    alert("Unable to update status.");
  }
}

async function deleteService(id) {
  if (!confirm("Delete this service?")) return;

  try {
    await deleteDoc(
      doc(db, "services", id)
    );

    await loadServices();
  } catch (error) {
    console.error(error);
    alert("Unable to delete service.");
  }
}

function filterServices() {
  const search =
    document.getElementById("searchInput")?.value
      .toLowerCase()
      .trim() || "";

  const status =
    document.getElementById("statusFilter")?.value || "all";

  const category =
    document.getElementById("categoryFilter")?.value || "all";

  filteredServices = services.filter(service => {
    const text = [
      service.title,
      service.category,
      service.subcategory,
      service.freelancerName,
      service.shortDescription,
      service.description,
      ...(service.skills || []),
      ...(service.tags || [])
    ]
      .join(" ")
      .toLowerCase();

    const matchesSearch =
      !search || text.includes(search);

    const matchesStatus =
      status === "all" ||
      service.status === status;

    const matchesCategory =
      category === "all" ||
      service.category === category;

    return (
      matchesSearch &&
      matchesStatus &&
      matchesCategory
    );
  });

  renderServices(filteredServices);
}

function updateStats() {
  const total = services.length;

  const published = services.filter(
    s => s.status === "published"
  ).length;

  const drafts = services.filter(
    s => s.status === "draft"
  ).length;

  const featured = services.filter(
    s => s.featured === true
  ).length;

  const orders = services.reduce(
    (sum, s) =>
      sum + Number(s.orders || s.orderCount || 0),
    0
  );

  document.getElementById("totalServices").textContent = total;
  document.getElementById("publishedServices").textContent = published;
  document.getElementById("draftServices").textContent = drafts;
  document.getElementById("featuredServices").textContent = featured;
  document.getElementById("totalOrders").textContent = orders;
}

function updateCategories() {
  const select =
    document.getElementById("categoryFilter");

  if (!select) return;

  const current = select.value;

  const categories = [
    ...new Set(
      services
        .map(s => s.category)
        .filter(Boolean)
    )
  ].sort();

  select.innerHTML =
    `<option value="all">All Categories</option>` +
    categories
      .map(
        c =>
          `<option value="${escAttr(c)}">${esc(c)}</option>`
      )
      .join("");

  select.value =
    categories.includes(current)
      ? current
      : "all";
}

function renderServices(list = services) {
  const container =
    document.getElementById("servicesList");

  if (!container) return;

  if (!list.length) {
    container.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-briefcase"></i>
        <h3>No services found</h3>
        <p>Add your first professional service.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = list.map(service => {
    const price =
      service.pricingType === "free"
        ? "Free"
        : `${service.currency || "USD"} ${Number(service.price || 0).toLocaleString()}`;

    const image =
      service.thumbnail ||
      "https://via.placeholder.com/600x350?text=LetsStudy+Pro";

    const status =
      service.status || "draft";

    return `
      <div class="service-card">

        <div class="service-image">
          <img
            src="${escAttr(image)}"
            alt="${escAttr(service.title || "Service")}"
            onerror="this.src='https://via.placeholder.com/600x350?text=LetsStudy+Pro'"
          >

          <span class="status ${status}">
            ${esc(status)}
          </span>

          ${
            service.featured
              ? `<span class="featured">
                  <i class="fa-solid fa-star"></i>
                  Featured
                </span>`
              : ""
          }
        </div>

        <div class="service-body">

          <div class="category">
            ${esc(service.category || "General")}
          </div>

          <h3>${esc(service.title || "Untitled Service")}</h3>

          <p class="description">
            ${esc(
              service.shortDescription ||
              service.description ||
              "Professional service available on LetsStudy Pro."
            )}
          </p>

          <div class="service-meta">
            <span>
              <i class="fa-solid fa-user"></i>
              ${esc(service.freelancerName || "Provider")}
            </span>

            <span>
              <i class="fa-solid fa-clock"></i>
              ${esc(service.deliveryTime || "Flexible")}
            </span>
          </div>

          <div class="price">
            ${esc(price)}
          </div>

          <div class="actions">

            <button
              class="btn edit"
              onclick="editService('${service.id}')"
            >
              <i class="fa-solid fa-pen"></i>
              Edit
            </button>

            <button
              class="btn publish"
              onclick="togglePublish('${service.id}')"
            >
              <i class="fa-solid fa-power-off"></i>
              ${
                status === "published"
                  ? "Unpublish"
                  : "Publish"
              }
            </button>

            <button
              class="btn delete"
              onclick="deleteService('${service.id}')"
            >
              <i class="fa-solid fa-trash"></i>
              Delete
            </button>

          </div>

        </div>
      </div>
    `;
  }).join("");
}

function openModal() {
  editingId = null;

  const form =
    document.getElementById("serviceForm");

  if (form) form.reset();

  document.getElementById("modalTitle").textContent =
    "Add Service";

  document
    .getElementById("serviceModal")
    .classList.add("show");
}

function closeModal() {
  document
    .getElementById("serviceModal")
    .classList.remove("show");

  editingId = null;
}

function resetForm() {
  const form =
    document.getElementById("serviceForm");

  if (form) form.reset();
}

function getValue(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function csvArray(value) {
  return String(value || "")
    .split(",")
    .map(x => x.trim())
    .filter(Boolean);
}

function slugify(value) {
  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escAttr(value) {
  return esc(value);
}

document
  .getElementById("searchInput")
  ?.addEventListener("input", filterServices);

document
  .getElementById("statusFilter")
  ?.addEventListener("change", filterServices);

document
  .getElementById("categoryFilter")
  ?.addEventListener("change", filterServices);

document
  .getElementById("addServiceBtn")
  ?.addEventListener("click", openModal);

document
  .getElementById("closeModal")
  ?.addEventListener("click", closeModal);

document
  .getElementById("cancelBtn")
  ?.addEventListener("click", closeModal);

document
  .getElementById("serviceForm")
  ?.addEventListener("submit", saveService);

document
  .getElementById("serviceModal")
  ?.addEventListener("click", e => {
    if (e.target.id === "serviceModal") {
      closeModal();
    }
  });

loadServices();

</script>
