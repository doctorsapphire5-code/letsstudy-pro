<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Students | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
button,input,select{font:inherit}
button{border:0;border-radius:9px;padding:9px 12px;cursor:pointer}
header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
header h1{flex:1;font-size:18px;margin:0}
main{max-width:1250px;margin:auto;padding:18px}
.back{background:#eef2ff;color:#1d4ed8}
.primary{background:#2563eb;color:#fff}
.success{background:#dcfce7;color:#15803d}
.danger{background:#fee2e2;color:#b91c1c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card,.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px}
.stat span{font-size:11px;color:#64748b}
.stat b{display:block;font-size:23px;margin-top:5px}
.toolbar{display:flex;gap:8px;margin-bottom:14px}
.toolbar input{max-width:450px}
input,select{width:100%;padding:10px;border:1px solid #dbe1e8;border-radius:9px;background:#fff;outline:none}
.table{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4;white-space:nowrap}
th{font-size:10px;color:#64748b}
.badge{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:bold}
.active{background:#dcfce7;color:#15803d}
.blocked{background:#fee2e2;color:#b91c1c}
.pending{background:#fef3c7;color:#a16207}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:50}
.modal.show{display:flex}
.box{background:#fff;width:100%;max-width:700px;max-height:90vh;overflow:auto;border-radius:16px;padding:20px}
.head{display:flex;align-items:center;margin-bottom:16px}
.head h2{flex:1;font-size:18px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info{padding:12px;background:#f8fafc;border-radius:10px;margin-bottom:8px}
.info small{display:block;color:#64748b;font-size:10px}
.info strong{display:block;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:35px;color:#64748b}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:100;font-size:12px}
.toast.show{display:block}
@media(max-width:750px){
.stats{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr}
.toolbar{flex-wrap:wrap}
}
</style></head><body><header><button class="back"
onclick="location.href='admin-dashboard.html'">
←
</button>

<h1>👨‍🎓 Students</h1><button class="primary"
onclick="exportStudents()">
⬇ Export
</button>

</header><main><section class="stats"><div class="stat">
<span>Total Students</span>
<b id="total">0</b>
</div><div class="stat">
<span>Active</span>
<b id="active">0</b>
</div><div class="stat">
<span>Blocked</span>
<b id="blocked">0</b>
</div><div class="stat">
<span>Premium</span>
<b id="premium">0</b>
</div></section><section class="card"><div class="toolbar"><input
id="search"
placeholder="Search name, email or UID..."
oninput="render()">

<select
id="status"
onchange="render()">

<option value="all">All Status</option>
<option value="active">Active</option>
<option value="blocked">Blocked</option>
<option value="pending">Pending</option></select><select
id="form"
onchange="render()">

<option value="all">All Forms</option>
<option>Form 1</option>
<option>Form 2</option>
<option>Form 3</option>
<option>Form 4</option>
<option>Form 5</option>
<option>Form 6</option>
<option>University</option></select></div><div class="table"><table><thead><tr>
<th>Student</th>
<th>Email</th>
<th>Form</th>
<th>Role</th>
<th>Status</th>
<th>Premium</th>
<th>Actions</th>
</tr></thead><tbody id="studentList"></tbody></table></div></section></main><!-- PROFILE MODAL --><div id="modal" class="modal"><div class="box"><div class="head"><h2>Student Profile</h2><button onclick="closeModal()">✕</button>

</div><div class="grid"><div class="info">
<small>Name</small>
<strong id="pName">-</strong>
</div><div class="info">
<small>Email</small>
<strong id="pEmail">-</strong>
</div><div class="info">
<small>Firebase UID</small>
<strong id="pUid">-</strong>
</div><div class="info">
<small>Role</small>
<strong id="pRole">-</strong>
</div><div class="info">
<small>Form</small>
<strong id="pForm">-</strong>
</div><div class="info">
<small>Status</small>
<strong id="pStatus">-</strong>
</div><div class="info">
<small>Referral Code</small>
<strong id="pReferral">-</strong>
</div><div class="info">
<small>Wallet Balance</small>
<strong id="pWallet">TZS 0</strong>
</div><div class="info">
<small>Orders</small>
<strong id="pOrders">0</strong>
</div><div class="info">
<small>Premium</small>
<strong id="pPremium">No</strong>
</div></div><div class="actions"><button
class="primary"
onclick="editStudent()">
Edit
</button>

<button
class="success"
onclick="setStatus('active')">
Activate
</button>

<button
class="danger"
onclick="setStatus('blocked')">
Block
</button>

<button
class="danger"
onclick="deleteStudent()">
Delete
</button>

</div></div></div><div id="toast" class="toast"></div><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
doc,
getDoc,
getDocs,
updateDoc,
deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE CONFIG
========================================= */

const firebaseConfig={

apiKey:"YOUR_API_KEY",

authDomain:
"YOUR_PROJECT.firebaseapp.com",

projectId:
"YOUR_PROJECT_ID",

storageBucket:
"YOUR_PROJECT.firebasestorage.app",

messagingSenderId:
"YOUR_MESSAGING_SENDER_ID",

appId:
"YOUR_APP_ID"

};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let students=[];
let selectedStudent=null;
let admin=null;


/* =========================================
 ADMIN CHECK
========================================= */

onAuthStateChanged(auth,async user=>{

if(!user){

location.href="login.html";
return;

}

try{

const snap=await getDoc(
doc(db,"users",user.uid)
);

if(
!snap.exists() ||
snap.data().role!=="admin"
){

alert("Access denied");
location.href="dashboard.html";
return;

}

admin=user;
loadStudents();

}catch(error){

console.error(error);
alert("Unable to verify admin.");

}

});


/* =========================================
 LOAD STUDENTS
========================================= */

async function loadStudents(){

try{

const snap=await getDocs(
collection(db,"users")
);

students=snap.docs
.map(d=>({
id:d.id,
...d.data()
}))
.filter(
x=>x.role==="student"
);

updateStats();
render();

}catch(error){

console.error(error);
toast("Unable to load students.");

}

}


/* =========================================
 STATS
========================================= */

function updateStats(){

document.getElementById("total")
.textContent=students.length;

document.getElementById("active")
.textContent=
students.filter(
x=>x.status==="active" ||
!x.status
).length;

document.getElementById("blocked")
.textContent=
students.filter(
x=>x.status==="blocked"
).length;

document.getElementById("premium")
.textContent=
students.filter(
x=>x.premium===true ||
x.membership==="premium"
).length;

}


/* =========================================
 RENDER
========================================= */

window.render=function(){

const search=
document.getElementById("search")
.value.toLowerCase().trim();

const status=
document.getElementById("status").value;

const form=
document.getElementById("form").value;


const data=students.filter(x=>{

const text=
`${x.name||""}
${x.displayName||""}
${x.email||""}
${x.id||""}`
.toLowerCase();

const studentStatus=
x.status||"active";

return(
text.includes(search) &&
(status==="all"||studentStatus===status) &&
(form==="all"||x.form===form)
);

});


const list=
document.getElementById(
"studentList"
);


if(!data.length){

list.innerHTML=`

<tr>

<td colspan="7">

<div class="empty">
No students found.
</div>

</td>

</tr>

`;

return;

}


list.innerHTML=data.map(x=>`

<tr>

<td>

<strong>
${esc(
x.name||
x.displayName||
"Student"
)}
</strong>

<br>

<small>
${esc(x.id)}
</small>

</td>


<td>
${esc(x.email||"-")}
</td>


<td>
${esc(x.form||"-")}
</td>


<td>
${esc(x.role||"student")}
</td>


<td>

<span class="badge ${
(x.status||"active")==="blocked"
?"blocked":
(x.status||"active")==="pending"
?"pending":
"active"
}">

${esc(x.status||"active")}

</span>

</td>


<td>
${x.premium===true||
x.membership==="premium"
?"Yes":"No"}
</td>


<td>

<button
class="back"
onclick="viewStudent('${x.id}')">

View

</button>

</td>

</tr>

`).join("");

};


/* =========================================
 VIEW
========================================= */

window.viewStudent=async function(id){

const student=
students.find(x=>x.id===id);

if(!student)return;

selectedStudent=student;


document.getElementById("pName")
.textContent=
student.name||
student.displayName||
"Student";

document.getElementById("pEmail")
.textContent=
student.email||"-";

document.getElementById("pUid")
.textContent=
student.id;

document.getElementById("pRole")
.textContent=
student.role||"student";

document.getElementById("pForm")
.textContent=
student.form||"-";

document.getElementById("pStatus")
.textContent=
student.status||"active";

document.getElementById("pReferral")
.textContent=
student.referralCode||"-";

document.getElementById("pWallet")
.textContent=
"TZS "+
Number(
student.walletBalance||0
).toLocaleString();

document.getElementById("pOrders")
.textContent=
Number(
student.ordersCount||0
);

document.getElementById("pPremium")
.textContent=
student.premium===true||
student.membership==="premium"
?"Yes":"No";


document.getElementById("modal")
.classList.add("show");

};


/* =========================================
 STATUS
========================================= */

window.setStatus=async function(status){

if(!selectedStudent)return;

try{

await updateDoc(
doc(
db,
"users",
selectedStudent.id
),
{
status
}
);

toast(
status==="active"
?"Student activated."
:"Student blocked."
);

closeModal();
await loadStudents();

}catch(error){

console.error(error);
toast("Unable to update student.");

}

};


/* =========================================
 EDIT
========================================= */

window.editStudent=function(){

if(!selectedStudent)return;

const form=prompt(
"Enter student form:",
selectedStudent.form||""
);

if(form===null)return;

updateStudent({
form
});

};


async function updateStudent(data){

try{

await updateDoc(
doc(
db,
"users",
selectedStudent.id
),
data
);

toast("Student updated.");

closeModal();
await loadStudents();

}catch(error){

console.error(error);
toast("Update failed.");

}

}


/* =========================================
 DELETE
========================================= */

window.deleteStudent=async function(){

if(!selectedStudent)return;

if(!confirm(
`Delete student ${selectedStudent.email||selectedStudent.id}?`
))return;

try{

await deleteDoc(
doc(
db,
"users",
selectedStudent.id
)
);

toast("Student deleted.");

closeModal();
await loadStudents();

}catch(error){

console.error(error);
toast("Delete failed.");

}

};


/* =========================================
 EXPORT
========================================= */

window.exportStudents=function(){

const rows=[
[
"UID",
"Name",
"Email",
"Form",
"Status",
"Premium",
"Referral"
]
];


students.forEach(x=>{

rows.push([

x.id,

x.name||
x.displayName||
"",

x.email||"",

x.form||"",

x.status||
"active",

x.premium===true||
x.membership==="premium"
?"Yes":"No",

x.referralCode||""

]);

});


const csv=
rows.map(row=>
row.map(cell=>
`"${String(cell??"")
.replace(/"/g,'""')}"`
).join(",")
).join("\n");


const blob=
new Blob(
[csv],
{
type:"text/csv;charset=utf-8"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"letsstudy-students.csv";

a.click();

URL.revokeObjectURL(url);

};


/* =========================================
 MODAL
========================================= */

window.closeModal=function(){

document.getElementById(
"modal"
).classList.remove("show");

selectedStudent=null;

};


/* =========================================
 HELPERS
========================================= */

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function toast(text){

const el=
document.getElementById("toast");

el.textContent=text;

el.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
