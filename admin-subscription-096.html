<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin | Subscription Management</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:50;
}

.header-inner{
  max-width:1250px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#2563eb;
}

.logo span{
  color:#111827;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:25px 15px;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.page-head h1{
  margin:0;
  font-size:28px;
}

.page-head p{
  margin:6px 0 0;
  color:#64748b;
}

.btn{
  padding:10px 15px;
  border-radius:9px;
  font-weight:700;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-primary:hover{
  background:#1d4ed8;
}

.btn-light{
  background:#f1f5f9;
  color:#334155;
}

.btn-success{
  background:#dcfce7;
  color:#15803d;
}

.btn-warning{
  background:#fef3c7;
  color:#92400e;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:18px;
}

.stat-label{
  display:block;
  color:#64748b;
  font-size:13px;
}

.stat-value{
  display:block;
  margin-top:6px;
  font-size:26px;
  font-weight:800;
}

.toolbar{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:15px;
  display:grid;
  grid-template-columns:1fr 180px 180px 180px;
  gap:10px;
  margin-bottom:20px;
}

input,
select{
  width:100%;
  padding:11px 13px;
  border:1px solid #dbe1e8;
  border-radius:9px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus{
  border-color:#2563eb;
}

.table-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:hidden;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:1050px;
  border-collapse:collapse;
}

th,td{
  padding:14px;
  text-align:left;
  border-bottom:1px solid #edf0f3;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:13px;
}

.user{
  display:flex;
  align-items:center;
  gap:10px;
}

.user-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.user-name{
  font-weight:700;
}

.muted{
  color:#64748b;
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  text-transform:capitalize;
}

.badge-green{
  background:#dcfce7;
  color:#15803d;
}

.badge-blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge-yellow{
  background:#fef3c7;
  color:#92400e;
}

.badge-red{
  background:#fee2e2;
  color:#b91c1c;
}

.badge-gray{
  background:#e5e7eb;
  color:#475569;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.action{
  padding:7px 9px;
  background:#f1f5f9;
  border-radius:7px;
  font-size:12px;
}

.action:hover{
  background:#e2e8f0;
}

.empty,
.loading{
  text-align:center;
  padding:45px 20px;
  color:#64748b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.62);
  z-index:100;
  overflow:auto;
  padding:20px;
}

.modal-box{
  max-width:750px;
  margin:30px auto;
  background:#fff;
  border-radius:17px;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
}

.close{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#f1f5f9;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.detail{
  background:#f8fafc;
  border-radius:10px;
  padding:13px;
}

.detail small{
  display:block;
  color:#64748b;
  margin-bottom:5px;
}

.detail strong{
  word-break:break-word;
}

.detail.full{
  grid-column:1/-1;
}

@media(max-width:950px){

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .toolbar{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .page-head{
    flex-direction:column;
    align-items:flex-start;
  }

  .form-grid,
  .details{
    grid-template-columns:1fr;
  }

  .full,
  .detail.full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <div class="logo">
      LetsStudy <span>Pro Admin</span>
    </div>

    <div>
      <strong id="adminName">
        Admin
      </strong>
    </div>

  </div>

</header>


<main class="container">

  <!-- PAGE HEADER -->

  <div class="page-head">

    <div>

      <h1>
        Subscription Management
      </h1>

      <p>
        Manage subscriptions, plans,
        payments and expiry dates.
      </p>

    </div>

    <button
      class="btn btn-primary"
      onclick="openAddModal()">

      + Add Subscription

    </button>

  </div>


  <!-- STATS -->

  <section class="stats">

    <div class="stat">

      <span class="stat-label">
        Total Subscriptions
      </span>

      <strong
        id="totalCount"
        class="stat-value">
        0
      </strong>

    </div>


    <div class="stat">

      <span class="stat-label">
        Active
      </span>

      <strong
        id="activeCount"
        class="stat-value">
        0
      </strong>

    </div>


    <div class="stat">

      <span class="stat-label">
        Pending
      </span>

      <strong
        id="pendingCount"
        class="stat-value">
        0
      </strong>

    </div>


    <div class="stat">

      <span class="stat-label">
        Expired
      </span>

      <strong
        id="expiredCount"
        class="stat-value">
        0
      </strong>

    </div>


    <div class="stat">

      <span class="stat-label">
        Revenue
      </span>

      <strong
        id="revenueCount"
        class="stat-value">
        0 TZS
      </strong>

    </div>

  </section>


  <!-- FILTERS -->

  <section class="toolbar">

    <input
      id="search"
      placeholder="🔍 Search user, plan, transaction...">


    <select id="statusFilter">

      <option value="">
        All Status
      </option>

      <option value="active">
        Active
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="expired">
        Expired
      </option>

      <option value="cancelled">
        Cancelled
      </option>

      <option value="suspended">
        Suspended
      </option>

    </select>


    <select id="planFilter">

      <option value="">
        All Plans
      </option>

    </select>


    <select id="billingFilter">

      <option value="">
        All Billing
      </option>

      <option value="monthly">
        Monthly
      </option>

      <option value="yearly">
        Yearly
      </option>

      <option value="weekly">
        Weekly
      </option>

      <option value="lifetime">
        Lifetime
      </option>

    </select>

  </section>


  <!-- TABLE -->

  <section class="table-card">

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              User
            </th>

            <th>
              Plan
            </th>

            <th>
              Price
            </th>

            <th>
              Billing
            </th>

            <th>
              Payment
            </th>

            <th>
              Status
            </th>

            <th>
              Expires
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>

        <tbody id="subscriptionTable">

          <tr>

            <td
              colspan="8"
              class="loading">

              Loading subscriptions...

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<!-- ======================================
     ADD / EDIT MODAL
====================================== -->

<div
  id="formModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="formTitle">
        Add Subscription
      </h2>

      <button
        class="close"
        onclick="closeModal('formModal')">

        ×

      </button>

    </div>


    <form id="subscriptionForm">

      <input
        type="hidden"
        id="editId">


      <div class="form-grid">


        <div>

          <label>
            User ID *
          </label>

          <input
            id="userId"
            required>

        </div>


        <div>

          <label>
            Plan ID *
          </label>

          <input
            id="planId"
            required>

        </div>


        <div>

          <label>
            Plan Name *
          </label>

          <input
            id="planName"
            required>

        </div>


        <div>

          <label>
            Price *
          </label>

          <input
            id="price"
            type="number"
            min="0"
            required>

        </div>


        <div>

          <label>
            Currency
          </label>

          <input
            id="currency"
            value="TZS">

        </div>


        <div>

          <label>
            Billing Cycle
          </label>

          <select id="billingCycle">

            <option value="monthly">
              Monthly
            </option>

            <option value="yearly">
              Yearly
            </option>

            <option value="weekly">
              Weekly
            </option>

            <option value="lifetime">
              Lifetime
            </option>

          </select>

        </div>


        <div>

          <label>
            Status
          </label>

          <select id="status">

            <option value="active">
              Active
            </option>

            <option value="pending">
              Pending
            </option>

            <option value="expired">
              Expired
            </option>

            <option value="cancelled">
              Cancelled
            </option>

            <option value="suspended">
              Suspended
            </option>

          </select>

        </div>


        <div>

          <label>
            Payment Method
          </label>

          <select id="paymentMethod">

            <option value="mobile_money">
              Mobile Money
            </option>

            <option value="card">
              Card
            </option>

            <option value="bank">
              Bank
            </option>

            <option value="pesapal">
              Pesapal
            </option>

            <option value="manual">
              Manual
            </option>

          </select>

        </div>


        <div class="full">

          <label>
            Transaction ID
          </label>

          <input
            id="transactionId">

        </div>


        <div>

          <label>
            Started At
          </label>

          <input
            id="startedAt"
            type="datetime-local">

        </div>


        <div>

          <label>
            Expires At
          </label>

          <input
            id="expiresAt"
            type="datetime-local">

        </div>


        <div>

          <label>
            Auto Renew
          </label>

          <select id="autoRenew">

            <option value="true">
              Yes
            </option>

            <option value="false">
              No
            </option>

          </select>

        </div>


      </div>


      <div class="form-actions">

        <button
          type="button"
          class="btn btn-light"
          onclick="closeModal('formModal')">

          Cancel

        </button>


        <button
          type="submit"
          class="btn btn-primary"
          id="saveBtn">

          Save Subscription

        </button>

      </div>

    </form>

  </div>

</div>


<!-- ======================================
     VIEW MODAL
====================================== -->

<div
  id="viewModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Subscription Details
      </h2>

      <button
        class="close"
        onclick="closeModal('viewModal')">

        ×

      </button>

    </div>


    <div
      id="subscriptionDetails"
      class="details">

    </div>

  </div>

</div>


<script type="module">

/* ======================================
   FIREBASE
====================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ======================================
   CONFIG
====================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ======================================
   STATE
====================================== */

let subscriptions = [];

let currentAdmin = null;


/* ======================================
   AUTH
====================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      document.getElementById(
        "adminName"
      ).textContent =
        "Admin";

      return;

    }

    currentAdmin = user;

    document.getElementById(
      "adminName"
    ).textContent =
      user.displayName ||
      user.email ||
      "Admin";

    await loadSubscriptions();

  }
);


/* ======================================
   LOAD
====================================== */

async function loadSubscriptions(){

  const table =
    document.getElementById(
      "subscriptionTable"
    );


  table.innerHTML = `
    <tr>
      <td
        colspan="8"
        class="loading">

        Loading subscriptions...

      </td>
    </tr>
  `;


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "subscriptions"
        )
      );


    subscriptions = [];


    snap.forEach(item => {

      subscriptions.push({

        id:
          item.id,

        ...item.data()

      });

    });


    updateStats();

    updatePlanFilter();

    renderSubscriptions();


  }catch(error){

    console.error(error);

    table.innerHTML = `
      <tr>
        <td
          colspan="8"
          class="empty">

          Unable to load subscriptions.

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </td>
      </tr>
    `;

  }

}


/* ======================================
   STATS
====================================== */

function updateStats(){

  const total =
    subscriptions.length;


  const active =
    subscriptions.filter(
      x => x.status === "active"
    ).length;


  const pending =
    subscriptions.filter(
      x => x.status === "pending"
    ).length;


  const expired =
    subscriptions.filter(
      x => x.status === "expired"
    ).length;


  const revenue =
    subscriptions.reduce(
      (sum,x) =>
        sum +
        Number(
          x.price || 0
        ),
      0
    );


  document.getElementById(
    "totalCount"
  ).textContent =
    total;


  document.getElementById(
    "activeCount"
  ).textContent =
    active;


  document.getElementById(
    "pendingCount"
  ).textContent =
    pending;


  document.getElementById(
    "expiredCount"
  ).textContent =
    expired;


  document.getElementById(
    "revenueCount"
  ).textContent =
    formatNumber(revenue) +
    " TZS";

}


/* ======================================
   PLAN FILTER
====================================== */

function updatePlanFilter(){

  const select =
    document.getElementById(
      "planFilter"
    );


  const current =
    select.value;


  const plans =
    [
      ...new Set(
        subscriptions
          .map(
            x => x.planName
          )
          .filter(Boolean)
      )
    ]
    .sort();


  select.innerHTML = `
    <option value="">
      All Plans
    </option>
  `;


  plans.forEach(plan => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      plan;

    option.textContent =
      plan;

    select.appendChild(
      option
    );

  });


  select.value =
    current;

}


/* ======================================
   RENDER
====================================== */

function renderSubscriptions(){

  const table =
    document.getElementById(
      "subscriptionTable"
    );


  const search =
    document.getElementById(
      "search"
    ).value
    .trim()
    .toLowerCase();


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const plan =
    document.getElementById(
      "planFilter"
    ).value;


  const billing =
    document.getElementById(
      "billingFilter"
    ).value;


  const filtered =
    subscriptions.filter(s => {

      const text =
        [
          s.userId,
          s.planId,
          s.planName,
          s.paymentMethod,
          s.transactionId
        ]
        .join(" ")
        .toLowerCase();


      if(
        search &&
        !text.includes(search)
      ){

        return false;

      }


      if(
        status &&
        s.status !== status
      ){

        return false;

      }


      if(
        plan &&
        s.planName !== plan
      ){

        return false;

      }


      if(
        billing &&
        s.billingCycle !== billing
      ){

        return false;

      }


      return true;

    });


  if(!filtered.length){

    table.innerHTML = `
      <tr>
        <td
          colspan="8"
          class="empty">

          No subscriptions found.

        </td>
      </tr>
    `;

    return;

  }


  table.innerHTML =
    filtered
      .map(subscriptionRow)
      .join("");

}


/* ======================================
   ROW
====================================== */

function subscriptionRow(s){

  const userId =
    s.userId ||
    "Unknown User";


  const plan =
    s.planName ||
    "Unknown Plan";


  const price =
    formatNumber(
      s.price || 0
    ) +
    " " +
    (
      s.currency ||
      "TZS"
    );


  const expires =
    formatDate(
      s.expiresAt
    );


  const payment =
    formatPayment(
      s.paymentMethod
    );


  return `

    <tr>

      <td>

        <div class="user">

          <img
            class="user-avatar"
src="https://ui-avatars.com/api/?name=${encodeURIComponent(userId)}&background=2563eb&color=fff"
alt="User">

<div>

  <div class="user-name">
    ${escapeHtml(userId)}
  </div>

  <div class="muted">
    User ID
  </div>

</div>

</div>

</td>


<td>

  <strong>
    ${escapeHtml(plan)}
  </strong>

  <div class="muted">
    ${escapeHtml(s.planId || "")}
  </div>

</td>


<td>
  ${escapeHtml(price)}
</td>


<td>
  ${escapeHtml(
    s.billingCycle || "—"
  )}
</td>


<td>

  ${escapeHtml(payment)}

  <div class="muted">
    ${escapeHtml(
      s.transactionId || ""
    )}
  </div>

</td>


<td>

  ${statusBadge(s.status)}

</td>


<td>
  ${escapeHtml(expires)}
</td>


<td>

  <div class="actions">

    <button
      class="action"
      onclick="viewSubscription('${s.id}')">
      View
    </button>

    <button
      class="action"
      onclick="editSubscription('${s.id}')">
      Edit
    </button>

    <button
      class="action"
      onclick="extendSubscription('${s.id}')">
      Extend
    </button>

    ${
      s.status === "active"
      ?
      `
      <button
        class="action"
        onclick="cancelSubscription('${s.id}')">
        Cancel
      </button>
      `
      :
      `
      <button
        class="action"
        onclick="activateSubscription('${s.id}')">
        Activate
      </button>
      `
    }

    <button
      class="action"
      onclick="deleteSubscription('${s.id}')">
      Delete
    </button>

  </div>

</td>

</tr>

`;

}


/* ======================================
   STATUS BADGE
====================================== */

function statusBadge(status){

  const classes = {

    active: "badge-green",
    pending: "badge-yellow",
    expired: "badge-red",
    cancelled: "badge-gray",
    suspended: "badge-red"

  };

  return `
    <span class="badge ${
      classes[status] || "badge-blue"
    }">

      ${escapeHtml(
        status || "unknown"
      )}

    </span>
  `;

}

/* ======================================
   SAVE SUBSCRIPTION
====================================== */

document.getElementById(
  "subscriptionForm"
).addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    const btn =
      document.getElementById(
        "saveBtn"
      );

    btn.disabled = true;
    btn.textContent = "Saving...";

    try{

      const editId =
        getValue("editId");

      const data = {

        userId:
          getValue("userId"),

        planId:
          getValue("planId"),

        planName:
          getValue("planName"),

        price:
          Number(
            getValue("price")
          ) || 0,

        currency:
          getValue("currency") ||
          "TZS",

        billingCycle:
          getValue("billingCycle"),

        status:
          getValue("status"),

        paymentMethod:
          getValue("paymentMethod"),

        transactionId:
          getValue("transactionId"),

        startedAt:
          parseDateInput(
            getValue("startedAt")
          ),

        expiresAt:
          parseDateInput(
            getValue("expiresAt")
          ),

        autoRenew:
          getValue("autoRenew") ===
          "true",

        updatedAt:
          serverTimestamp()

      };


      if(!data.userId){

        alert(
          "User ID is required."
        );

        return;

      }

      if(!data.planId){

        alert(
          "Plan ID is required."
        );

        return;

      }

      if(!data.planName){

        alert(
          "Plan name is required."
        );

        return;

      }


      if(editId){

        await updateDoc(
          doc(
            db,
            "subscriptions",
            editId
          ),
          data
        );

        alert(
          "Subscription updated successfully."
        );

      }else{

        data.createdAt =
          serverTimestamp();

        await addDoc(
          collection(
            db,
            "subscriptions"
          ),
          data
        );

        alert(
          "Subscription added successfully."
        );

      }

      closeModal(
        "formModal"
      );

      await loadSubscriptions();

    }catch(error){

      console.error(error);

      alert(
        "Save failed: " +
        error.message
      );

    }finally{

      btn.disabled = false;
      btn.textContent =
        "Save Subscription";

    }

  }
);

/* ======================================
   EXTEND SUBSCRIPTION
====================================== */

window.extendSubscription =
async function(id){

  const s =
    subscriptions.find(
      x => x.id === id
    );

  if(!s) return;


  const days =
    prompt(
      "Enter number of days to extend:",
      "30"
    );


  if(!days) return;


  const numberDays =
    Number(days);


  if(
    !Number.isFinite(
      numberDays
    ) ||
    numberDays <= 0
  ){

    alert(
      "Enter a valid number of days."
    );

    return;

  }


  try{

    let currentDate =
      timestampToDate(
        s.expiresAt
      );


    if(
      !currentDate ||
      currentDate < new Date()
    ){

      currentDate =
        new Date();

    }


    currentDate.setDate(
      currentDate.getDate() +
      numberDays
    );


    await updateDoc(
      doc(
        db,
        "subscriptions",
        id
      ),
      {

        expiresAt:
          currentDate,

        status:
          "active",

        updatedAt:
          serverTimestamp()

      }
    );


    alert(
      "Subscription extended by " +
      numberDays +
      " days."
    );


    await loadSubscriptions();

  }catch(error){

    console.error(error);

    alert(
      "Extension failed: " +
      error.message
    );

  }

};

/* ======================================
   HELPERS
====================================== */

function getValue(id){

  const element =
    document.getElementById(id);

  return element
    ? element.value.trim()
    : "";

}


function setValue(id,value){

  const element =
    document.getElementById(id);

  if(element){

    element.value =
      value ?? "";

  }

}


function detail(label,value){

  return `

    <div class="detail">

      <small>
        ${escapeHtml(label)}
      </small>

      <strong>

        ${
          value === null ||
          value === undefined ||
          value === ""
            ? "—"
            : escapeHtml(value)
        }

      </strong>

    </div>

  `;

}


function formatPayment(value){

  const names = {

    mobile_money:
      "Mobile Money",

    card:
      "Card",

    bank:
      "Bank",

    pesapal:
      "Pesapal",

    manual:
      "Manual"

  };

  return (
    names[value] ||
    value ||
    "—"
  );

}


function formatNumber(value){

  return Number(
    value || 0
  ).toLocaleString();

}


function timestampToDate(value){

  if(!value)
    return null;


  if(
    value instanceof Date
  ){

    return value;

  }


  if(
    typeof value.toDate ===
    "function"
  ){

    return value.toDate();

  }


  if(
    typeof value === "string"
  ){

    const d =
      new Date(value);

    return isNaN(
      d.getTime()
    )
      ? null
      : d;

  }


  if(
    typeof value === "number"
  ){

    return new Date(value);

  }


  return null;

}


function formatDate(value){

  const date =
    timestampToDate(
      value
    );

  if(!date)
    return "—";


  return date.toLocaleString(
    "en-GB",
    {
      dateStyle:
        "medium",

      timeStyle:
        "short"
    }
  );

}


function toDateTimeLocal(value){

  const date =
    timestampToDate(
      value
    );

  if(!date)
    return "";


  const offset =
    date.getTimezoneOffset();


  const local =
    new Date(
      date.getTime() -
      offset * 60000
    );


  return local
    .toISOString()
    .slice(0,16);

}


function parseDateInput(value){

  if(!value)
    return null;


  const date =
    new Date(value);


  return isNaN(
    date.getTime()
  )
    ? null
    : date;

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}
