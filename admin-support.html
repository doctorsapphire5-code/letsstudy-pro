<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Support | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:9px;padding:9px 12px;cursor:pointer}
header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
header h1{flex:1;font-size:18px;margin:0}
main{max-width:1250px;margin:auto;padding:18px}
.back{background:#eef2ff;color:#1d4ed8}
.primary{background:#2563eb;color:#fff}
.success{background:#dcfce7;color:#15803d}
.danger{background:#fee2e2;color:#b91c1c}
.warning{background:#fef3c7;color:#a16207}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card,.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px}
.stat span{font-size:11px;color:#64748b}
.stat b{display:block;font-size:23px;margin-top:5px}
.toolbar{display:flex;gap:8px;margin-bottom:14px}
.toolbar input{max-width:420px}
input,select,textarea{width:100%;padding:10px;border:1px solid #dbe1e8;border-radius:9px;background:#fff;outline:none}
.table{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4;white-space:nowrap}
th{font-size:10px;color:#64748b}
.badge{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:bold}
.open{background:#fee2e2;color:#b91c1c}
.progress{background:#fef3c7;color:#a16207}
.resolved{background:#dcfce7;color:#15803d}
.closed{background:#e5e7eb;color:#475569}
.low{background:#e5e7eb;color:#475569}
.medium{background:#dbeafe;color:#1d4ed8}
.high{background:#fef3c7;color:#a16207}
.urgent{background:#fee2e2;color:#b91c1c}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:50}
.modal.show{display:flex}
.box{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px;padding:20px}
.head{display:flex;align-items:center;margin-bottom:15px}
.head h2{flex:1;margin:0;font-size:18px}
.info{padding:11px;background:#f8fafc;border-radius:9px;margin-bottom:10px;font-size:12px}
.info small{display:block;color:#64748b;font-size:10px;margin-bottom:4px}
.message{padding:12px;border-radius:10px;background:#f8fafc;margin:8px 0;font-size:12px}
.message.admin{background:#eef2ff}
.message strong{display:block;margin-bottom:5px}
.reply{margin-top:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:100;font-size:12px}
.toast.show{display:block}
.empty{text-align:center;padding:35px;color:#64748b}
@media(max-width:800px){
.stats{grid-template-columns:1fr 1fr}
.toolbar{flex-wrap:wrap}
}
</style></head><body><header><button class="back"
onclick="location.href='admin-dashboard.html'">
←
</button>

<h1>🎧 Support Center</h1><button class="primary"
onclick="openCreate()">

+ New Ticket
  </button>

</header><main><section class="stats"><div class="stat">
<span>Total Tickets</span>
<b id="total">0</b>
</div><div class="stat">
<span>Open</span>
<b id="open">0</b>
</div><div class="stat">
<span>In Progress</span>
<b id="progress">0</b>
</div><div class="stat">
<span>Resolved</span>
<b id="resolved">0</b>
</div></section><section class="card"><div class="toolbar"><input
id="search"
placeholder="Search ticket, email or subject..."
oninput="render()">

<select id="statusFilter"
onchange="render()">

<option value="all">All Status</option>
<option value="open">Open</option>
<option value="in-progress">In Progress</option>
<option value="resolved">Resolved</option>
<option value="closed">Closed</option></select><select id="priorityFilter"
onchange="render()">

<option value="all">All Priority</option>
<option value="urgent">Urgent</option>
<option value="high">High</option>
<option value="medium">Medium</option>
<option value="low">Low</option></select></div><div class="table"><table><thead><tr>
<th>Ticket</th>
<th>User</th>
<th>Subject</th>
<th>Priority</th>
<th>Status</th>
<th>Assigned</th>
<th>Action</th>
</tr></thead><tbody id="ticketList"></tbody></table></div></section></main><!-- TICKET MODAL --><div id="modal" class="modal"><div class="box"><div class="head"><h2 id="modalTitle">
Support Ticket
</h2><button onclick="closeModal()">✕</button>

</div><div id="ticketDetails"></div><div class="reply"><label>Reply to User</label>

<textarea
id="replyText"
rows="5"
placeholder="Write your response..."></textarea><br><br>

<button
class="primary"
onclick="sendReply()">

📤 Send Reply

</button></div><br><div class="actions"><select
id="ticketStatus">

<option value="open">Open</option>
<option value="in-progress">In Progress</option>
<option value="resolved">Resolved</option>
<option value="closed">Closed</option></select><select
id="ticketPriority">

<option value="low">Low</option>
<option value="medium">Medium</option>
<option value="high">High</option>
<option value="urgent">Urgent</option></select><input
id="assignedTo"
placeholder="Assign admin UID">

<button
class="success"
onclick="updateTicket()">

Save Ticket

</button></div></div></div><!-- CREATE --><div id="createModal" class="modal"><div class="box"><div class="head"><h2>Create Support Ticket</h2><button onclick="closeCreate()">✕</button>

</div><form id="createForm"><label>User ID / Email</label>
<input id="newUser" required>

<br><br>

<label>Subject</label>
<input id="newSubject" required>

<br><br>

<label>Priority</label>

<select id="newPriority"><option value="low">Low</option>
<option value="medium" selected>Medium</option>
<option value="high">High</option>
<option value="urgent">Urgent</option></select><br><br>

<label>Message</label>

<textarea
id="newMessage"
rows="5"
required></textarea><br><br>

<button class="primary">
Create Ticket
</button></form></div></div><div id="toast" class="toast"></div><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
doc,
getDoc,
getDocs,
addDoc,
updateDoc,
arrayUnion,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE
========================================= */

const firebaseConfig={

apiKey:"YOUR_API_KEY",

authDomain:
"YOUR_PROJECT.firebaseapp.com",

projectId:
"YOUR_PROJECT_ID",

storageBucket:
"YOUR_PROJECT.firebasestorage.app",

messagingSenderId:
"YOUR_MESSAGING_SENDER_ID",

appId:"YOUR_APP_ID"

};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let tickets=[];
let selected=null;
let admin=null;


/* =========================================
 ADMIN CHECK
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="login.html";
return;

}

const snap=await getDoc(
doc(db,"users",user.uid)
);

if(
!snap.exists() ||
snap.data().role!=="admin"
){

alert("Access denied");
location.href="dashboard.html";
return;

}

admin=user;
loadTickets();

});


/* =========================================
 LOAD
========================================= */

async function loadTickets(){

try{

const snap=await getDocs(
collection(db,"supportTickets")
);

tickets=snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

updateStats();
render();

}catch(error){

console.error(error);
toast("Unable to load tickets.");

}

}


/* =========================================
 STATS
========================================= */

function updateStats(){

document.getElementById("total")
.textContent=tickets.length;

document.getElementById("open")
.textContent=tickets.filter(
x=>x.status==="open"
).length;

document.getElementById("progress")
.textContent=tickets.filter(
x=>x.status==="in-progress"
).length;

document.getElementById("resolved")
.textContent=tickets.filter(
x=>x.status==="resolved"
).length;

}


/* =========================================
 RENDER
========================================= */

window.render=function(){

const search=
document.getElementById("search")
.value.toLowerCase().trim();

const status=
document.getElementById("statusFilter").value;

const priority=
document.getElementById("priorityFilter").value;


const data=tickets.filter(x=>{

const text=
`${x.ticketNumber||""}
${x.email||""}
${x.userId||""}
${x.subject||""}`
.toLowerCase();

return(
text.includes(search) &&
(status==="all"||x.status===status) &&
(priority==="all"||x.priority===priority)
);

});


const list=
document.getElementById("ticketList");


if(!data.length){

list.innerHTML=`
<tr>
<td colspan="7">
<div class="empty">
No support tickets found.
</div>
</td>
</tr>`;

return;

}


list.innerHTML=data.map(x=>`

<tr>

<td>
<strong>
${esc(
x.ticketNumber||
x.id
)}
</strong>
</td>

<td>
${esc(
x.email||
x.userId||
"-"
)}
</td>

<td>
${esc(x.subject||"No subject")}
</td>

<td>

<span class="badge ${
esc(x.priority||"medium")
}">

${esc(
x.priority||"medium"
)}

</span>

</td>

<td>

<span class="badge ${
esc(x.status||"open")
}">

${esc(
x.status||"open"
)}

</span>

</td>

<td>
${esc(
x.assignedTo||
"Unassigned"
)}
</td>

<td>

<button
class="back"
onclick="viewTicket('${x.id}')">

View

</button>

</td>

</tr>

`).join("");

};


/* =========================================
 VIEW
========================================= */

window.viewTicket=async function(id){

const x=tickets.find(
t=>t.id===id
);

if(!x)return;

selected=x;

document.getElementById(
"ticketStatus"
).value=
x.status||"open";

document.getElementById(
"ticketPriority"
).value=
x.priority||"medium";

document.getElementById(
"assignedTo"
).value=
x.assignedTo||"";

let messages="";

if(Array.isArray(x.messages)){

messages=x.messages.map(m=>`

<div class="message ${
m.senderRole==="admin"
?"admin":""
}">

<strong>
${esc(
m.senderRole==="admin"
?"Admin":
m.email||"User"
)}
</strong>

${esc(m.text||"")}

</div>

`).join("");

}


document.getElementById(
"ticketDetails"
).innerHTML=`

<div class="info">

<small>Ticket</small>

<strong>
${esc(
x.ticketNumber||x.id
)}
</strong>

</div>


<div class="info">

<small>User</small>

<strong>
${esc(
x.email||x.userId||"-"
)}
</strong>

</div>


<div class="info">

<small>Subject</small>

<strong>
${esc(x.subject||"-")}
</strong>

</div>


<div class="info">

<small>Conversation</small>

${messages||
"<div class='empty'>No messages yet.</div>"}

</div>

`;

document.getElementById(
"modal"
).classList.add("show");

};


/* =========================================
 SEND REPLY
========================================= */

window.sendReply=async function(){

if(!selected)return;

const text=
document.getElementById(
"replyText"
).value.trim();

if(!text)return;

try{

await updateDoc(
doc(
db,
"supportTickets",
selected.id
),
{

messages:arrayUnion({

text,

senderId:admin.uid,

senderRole:"admin",

createdAt:
new Date().toISOString()

}),

status:"in-progress",

updatedAt:
serverTimestamp()

}
);

document.getElementById(
"replyText"
).value="";

toast("Reply sent.");

await loadTickets();

viewTicket(selected.id);

}catch(error){

console.error(error);
toast("Unable to send reply.");

}

};


/* =========================================
 UPDATE
========================================= */

window.updateTicket=async function(){

if(!selected)return;

try{

await updateDoc(
doc(
db,
"supportTickets",
selected.id
),
{

status:
document.getElementById(
"ticketStatus"
).value,

priority:
document.getElementById(
"ticketPriority"
).value,

assignedTo:
document.getElementById(
"assignedTo"
).value.trim(),

updatedAt:
serverTimestamp()

}
);

toast("Ticket updated.");

closeModal();

await loadTickets();

}catch(error){

console.error(error);
toast("Unable to update ticket.");

}

};


/* =========================================
 CREATE
========================================= */

document.getElementById(
"createForm"
).addEventListener(
"submit",
async e=>{

e.preventDefault();

const ticketNumber=
"LS-"+Date.now();

const data={

ticketNumber,

userId:
document.getElementById(
"newUser"
).value.trim(),

subject:
document.getElementById(
"newSubject"
).value.trim(),

priority:
document.getElementById(
"newPriority"
).value,

status:"open",

messages:[{

text:
document.getElementById(
"newMessage"
).value.trim(),

senderId:admin.uid,

senderRole:"admin",

createdAt:
new Date().toISOString()

}],

assignedTo:"",

createdBy:admin.uid,

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

};


try{

await addDoc(
collection(db,"supportTickets"),
data
);

toast("Ticket created.");

closeCreate();

document.getElementById(
"createForm"
).reset();

await loadTickets();

}catch(error){

console.error(error);
toast("Unable to create ticket.");

}

});


/* =========================================
 MODALS
========================================= */

window.closeModal=function(){

document.getElementById(
"modal"
).classList.remove("show");

selected=null;

};

window.openCreate=function(){

document.getElementById(
"createModal"
).classList.add("show");

};

window.closeCreate=function(){

document.getElementById(
"createModal"
).classList.remove("show");

};


/* =========================================
 HELPERS
========================================= */

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function toast(text){

const el=
document.getElementById("toast");

el.textContent=text;
el.classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
