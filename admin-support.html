<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Support & Tickets | LetsStudy Pro Admin</title>

<link rel="icon"
      type="image/png"
      href="https://letsstudy.pro/favicon.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #e2e8f0;
}

.nav{
  width:min(1250px,92%);
  min-height:70px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#0b57d0;
  font-size:20px;
  font-weight:900;
}

.back{
  color:#475569;
  font-weight:700;
}

.container{
  width:min(1250px,92%);
  margin:35px auto;
}

.page-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
}

.page-header h1{
  font-size:32px;
  margin-bottom:5px;
}

.page-header p{
  color:#64748b;
}

.stats{
  display:grid;
  grid-template-columns:
    repeat(5,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:20px;
}

.stat strong{
  display:block;
  font-size:28px;
  color:#0b57d0;
}

.stat span{
  color:#64748b;
  font-size:13px;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr 180px 180px;
  gap:12px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:11px 13px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#0b57d0;
}

.table-box{
  overflow:auto;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:17px;
}

table{
  width:100%;
  min-width:1100px;
  border-collapse:collapse;
}

th,
td{
  padding:15px;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
}

th{
  background:#f8fafc;
  font-size:12px;
  color:#475569;
  text-transform:uppercase;
}

td{
  font-size:14px;
}

.badge{
  display:inline-flex;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.open{
  background:#dbeafe;
  color:#1d4ed8;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.resolved{
  background:#dcfce7;
  color:#166534;
}

.closed{
  background:#e2e8f0;
  color:#475569;
}

.high{
  background:#fee2e2;
  color:#991b1b;
}

.medium{
  background:#fef3c7;
  color:#92400e;
}

.low{
  background:#dcfce7;
  color:#166534;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.action{
  border:0;
  padding:8px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
}

.view{
  background:#e0f2fe;
  color:#0369a1;
}

.reply{
  background:#e0e7ff;
  color:#3730a3;
}

.status{
  background:#dcfce7;
  color:#166534;
}

.delete{
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  text-align:center;
  padding:45px;
  color:#64748b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(15,23,42,.65);
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:min(700px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:26px;
  position:relative;
}

.close{
  position:absolute;
  top:13px;
  right:13px;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#f1f5f9;
  font-size:20px;
}

.modal-box h2{
  margin-bottom:20px;
}

.detail{
  padding:13px 0;
  border-bottom:1px solid #e2e8f0;
}

.detail strong{
  display:block;
  color:#64748b;
  font-size:12px;
  margin-bottom:4px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.form-actions button{
  flex:1;
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  font-weight:800;
}

.primary{
  background:#0b57d0;
  color:#fff;
}

.secondary{
  background:#f1f5f9;
  color:#334155;
}

@media(max-width:950px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .page-header{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr;
  }

  .page-header h1{
    font-size:27px;
  }

  .form-actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      LetsStudy Pro Admin
    </div>

    <a
      href="admin.html"
      class="back">

      ← Admin Dashboard

    </a>

  </div>

</header>


<main class="container">

  <div class="page-header">

    <div>

      <h1>
        Support & Tickets
      </h1>

      <p>
        Manage student support requests,
        questions and reported problems.
      </p>

    </div>

  </div>


  <!-- STATISTICS -->

  <section class="stats">

    <div class="stat">

      <strong id="totalTickets">
        0
      </strong>

      <span>
        Total Tickets
      </span>

    </div>

    <div class="stat">

      <strong id="openTickets">
        0
      </strong>

      <span>
        Open
      </span>

    </div>

    <div class="stat">

      <strong id="pendingTickets">
        0
      </strong>

      <span>
        Pending
      </span>

    </div>

    <div class="stat">

      <strong id="resolvedTickets">
        0
      </strong>

      <span>
        Resolved
      </span>

    </div>

    <div class="stat">

      <strong id="highTickets">
        0
      </strong>

      <span>
        High Priority
      </span>

    </div>

  </section>


  <!-- FILTER -->

  <section class="toolbar">

    <input
      id="searchTicket"
      type="search"
      placeholder="Search ticket, subject or student...">

    <select id="statusFilter">

      <option value="">
        All Status
      </option>

      <option value="open">
        Open
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="resolved">
        Resolved
      </option>

      <option value="closed">
        Closed
      </option>

    </select>

    <select id="priorityFilter">

      <option value="">
        All Priority
      </option>

      <option value="high">
        High

      </option>

      <option value="low">

  </section>


  <!-- TABLE -->

  <section class="table-box">

    <table>

      <thead>

        <tr>

          <th>
            Ticket
          </th>

          <th>
            Student
          </th>

          <th>
            Subject
          </th>

          <th>
            Priority
          </th>

          <th>
            Status
          </th>

          <th>
            Date
          </th>

          <th>
            Actions
          </th>

        </tr>

      </thead>

      <tbody id="ticketsTable">

        <tr>

          <td
            colspan="7"
            class="empty">

            Loading tickets...

          </td>

        </tr>

      </tbody>

    </table>

  </section>

</main>


<!-- VIEW / REPLY MODAL -->

<div
  id="ticketModal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal()">

      ×

    </button>

    <h2 id="modalTitle">
      Ticket
    </h2>

    <div id="ticketDetails"></div>

    <div
      id="replyArea"
      style="display:none;margin-top:22px;">

      <div class="form-group">

        <label>
          Reply to Student
        </label>

        <textarea
          id="replyMessage"
          rows="6"
          placeholder="Write your response..."></textarea>

      </div>

      <div class="form-actions">

        <button
          class="btn secondary"
          onclick="closeModal()">

          Cancel

        </button>

        <button
          class="btn primary"
          onclick="sendReply()">

          Send Reply

        </button>

      </div>

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  updateDoc,
  deleteDoc,
  addDoc,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro.firebaseapp.com",

  projectId:
    "let-s-study-pro",

  storageBucket:
    "let-s-study-pro.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


const app =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================================
   STATE
===================================================== */

let tickets = [];

let selectedTicket = null;


/* =====================================================
   LOAD TICKETS
===================================================== */

async function loadTickets(){

  const table =
    document.getElementById(
      "ticketsTable"
    );

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "supportTickets"
        )
      );

    tickets = [];

    snapshot.forEach(
      item => {

        tickets.push({

          id:
            item.id,

          ...item.data()

        });

      }
    );


    updateStats();

    applyFilters();

  }catch(error){

    console.error(
      "Load tickets error:",
      error
    );

    table.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="empty">

          Failed to load tickets.

        </td>

      </tr>

    `;

  }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStats(){

  document.getElementById(
    "totalTickets"
  ).textContent =
    tickets.length;


  document.getElementById(
    "openTickets"
  ).textContent =

    tickets.filter(
      item =>
        normalize(
          item.status
        ) === "open"
    ).length;


  document.getElementById(
    "pendingTickets"
  ).textContent =

    tickets.filter(
      item =>
        normalize(
          item.status
        ) === "pending"
    ).length;


  document.getElementById(
    "resolvedTickets"
  ).textContent =

    tickets.filter(
      item =>
        normalize(
          item.status
        ) === "resolved"
    ).length;


  document.getElementById(
    "highTickets"
  ).textContent =

    tickets.filter(
      item =>
        normalize(
          item.priority
        ) === "high"
    ).length;

}


/* =====================================================
   FILTER
===================================================== */

function applyFilters(){

  const search =
    document.getElementById(
      "searchTicket"
    )
    .value
    .trim()
    .toLowerCase();


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const priority =
    document.getElementById(
      "priorityFilter"
    ).value;


  const filtered =
    tickets.filter(
      item => {

        const subject =
          String(
            item.subject || ""
          ).toLowerCase();


        const message =
          String(
            item.message || ""
          ).toLowerCase();


        const student =
          String(
            item.studentName ||
            item.email ||
            item.userEmail ||
            ""
          ).toLowerCase();


        const ticketId =
          String(
            item.id || ""
          ).toLowerCase();


        return (

          (
            !search ||
            subject.includes(search) ||
            message.includes(search) ||
            student.includes(search) ||
            ticketId.includes(search)
          )

          &&

          (
            !status ||
            normalize(
              item.status
            ) === status
          )

          &&

          (
            !priority ||
            normalize(
              item.priority
            ) === priority
          )

        );

      }
    );


  renderTickets(
    filtered
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderTickets(list){

  const table =
    document.getElementById(
      "ticketsTable"
    );


  if(!list.length){

    table.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="empty">

          No support tickets found.

        </td>

      </tr>

    `;

    return;

  }


  table.innerHTML =
    list.map(
      item => {

        const status =
          normalize(
            item.status
          ) || "open";


        const priority =
          normalize(
            item.priority
          ) || "medium";


        return `

          <tr>

            <td>

              <strong>

                #${escapeHTML(
                  item.id.slice(
                    0,
                    8
                  )
                )}

              </strong>

            </td>


            <td>

              ${escapeHTML(
                item.studentName ||
                item.name ||
                item.email ||
                item.userEmail ||
                "Unknown Student"
              )}

            </td>


            <td>

              ${escapeHTML(
                item.subject ||
                "No subject"
              )}

            </td>


            <td>

              <span
                class="badge ${priority}">

                ${escapeHTML(
                  priority
                )}

              </span>

            </td>


            <td>

              <span
                class="badge ${status}">

                ${escapeHTML(
                  status
                )}

              </span>

            </td>


            <td>

              ${formatDate(
                item.createdAt
              )}

            </td>


            <td>

              <div class="actions">

                <button
                  class="action view"
                  onclick="viewTicket('${item.id}')">

                  View

                </button>


                <button
                  class="action reply"
                  onclick="replyTicket('${item.id}')">

                  Reply

                </button>


                <button
                  class="action status"
                  onclick="resolveTicket('${item.id}')">

                  Resolve

                </button>


                <button
                  class="action delete"
                  onclick="deleteTicket('${item.id}')">

                  Delete

                </button>

              </div>

            </td>

          </tr>

        `;

      }
    ).join("");

}


/* =====================================================
   VIEW TICKET
===================================================== */

window.viewTicket =
function(id){

  const item =
    tickets.find(
      ticket =>
        ticket.id === id
    );


  if(!item){

    alert(
      "Ticket not found."
    );

    return;

  }


  selectedTicket =
    item;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Support Ticket";


  document.getElementById(
    "replyArea"
  ).style.display =
    "none";


  document.getElementById(
    "ticketDetails"
  ).innerHTML = `

    <div class="detail">

      <strong>
        Student
      </strong>

      ${escapeHTML(
        item.studentName ||
        item.name ||
        item.email ||
        item.userEmail ||
        "Unknown"
      )}

    </div>


    <div class="detail">

      <strong>
        Email
      </strong>

      ${escapeHTML(
        item.email ||
        item.userEmail ||
        "—"
      )}

    </div>


    <div class="detail">

      <strong>
        Subject
      </strong>

      ${escapeHTML(
        item.subject ||
        "—"
      )}

    </div>


    <div class="detail">

      <strong>
        Priority
      </strong>

      ${escapeHTML(
        item.priority ||
        "medium"
      )}

    </div>


    <div class="detail">

      <strong>
        Status
      </strong>

      ${escapeHTML(
        item.status ||
        "open"
      )}

    </div>


    <div class="detail">

      <strong>
        Message
      </strong>

      ${escapeHTML(
        item.message ||
        item.description ||
        "No message."
      )}

    </div>


    <div class="detail">

      <strong>
        Created
      </strong>

      ${formatDate(
        item.createdAt
      )}

    </div>

  `;


  document.getElementById(
    "ticketModal"
  ).style.display =
    "flex";

};


/* =====================================================
   REPLY
===================================================== */

window.replyTicket =
function(id){

  const item =
    tickets.find(
      ticket =>
        ticket.id === id
    );


  if(!item){

    alert(
      "Ticket not found."
    );

    return;

  }


  selectedTicket =
    item;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Reply to Student";


  document.getElementById(
    "ticketDetails"
  ).innerHTML = `

    <div class="detail">

      <strong>
        Subject
      </strong>

      ${escapeHTML(
        item.subject ||
        "Support Request"
      )}

    </div>


    <div class="detail">

      <strong>
        Student Message
      </strong>

      ${escapeHTML(
        item.message ||
        item.description ||
        "No message."
      )}

    </div>

  `;


  document.getElementById(
    "replyMessage"
  ).value = "";


  document.getElementById(
    "replyArea"
  ).style.display =
    "block";


  document.getElementById(
    "ticketModal"
  ).style.display =
    "flex";

};


/* =====================================================
   SEND REPLY
===================================================== */

window.sendReply =
async function(){

  if(!selectedTicket){

    return;

  }


  const message =
    document.getElementById(
      "replyMessage"
    ).value.trim();


  if(!message){

    alert(
      "Please enter a reply."
    );

    return;

  }


  try{

    await addDoc(

      collection(
        db,
        "supportReplies"
      ),

      {

        ticketId:
          selectedTicket.id,

        studentId:
          selectedTicket.userId ||
          selectedTicket.uid ||
          "",

        studentEmail:
          selectedTicket.email ||
          selectedTicket.userEmail ||
          "",

        message:
          message,

        sender:
          "admin",

        createdAt:
          serverTimestamp()

      }

    );


    await updateDoc(

      doc(
        db,
        "supportTickets",
        selectedTicket.id
      ),

      {

        status:
          "pending",

        lastReplyAt:
          serverTimestamp()

      }

    );


    alert(
      "Reply sent successfully."
    );


    closeModal();

    await loadTickets();

  }catch(error){

    console.error(
      "Reply error:",
      error
    );

    alert(
      "Unable to send reply."
    );

  }

};


/* =====================================================
   RESOLVE
===================================================
/* =====================================================
   RESOLVE
===================================================== */

window.resolveTicket =
async function(id){

  const item =
    tickets.find(
      ticket =>
        ticket.id === id
    );

  if(!item){

    alert(
      "Ticket not found."
    );

    return;

  }

  const confirmed =
    confirm(
      "Mark this ticket as resolved?"
    );

  if(!confirmed){
    return;
  }

  try{

    await updateDoc(

      doc(
        db,
        "supportTickets",
        id
      ),

      {
        status:
          "resolved",

        resolvedAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()
      }

    );

    alert(
      "Ticket resolved successfully."
    );

    await loadTickets();

  }catch(error){

    console.error(
      "Resolve ticket error:",
      error
    );

    alert(
      "Unable to resolve ticket."
    );

  }

};
