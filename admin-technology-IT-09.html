
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin • Technology & IT</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f5f7fb;color:#172033;
 font-family:Inter,Arial,sans-serif
}
header{
 background:#111827;color:#fff;padding:18px 5%;
 display:flex;justify-content:space-between;align-items:center
}
.container{max-width:1200px;margin:auto;padding:25px 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input,select,textarea{
 width:100%;padding:11px;border:1px solid #d9dfeb;
 border-radius:9px
}
.search{flex:1;min-width:220px}
button{
 border:0;border-radius:9px;padding:11px 15px;
 font-weight:700;cursor:pointer
}
.primary{background:#2563eb;color:#fff}
.danger{background:#fee2e2;color:#b91c1c}
.gray{background:#e5e7eb}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);gap:15px
}
.card{
 background:#fff;padding:20px;border-radius:16px;
 box-shadow:0 5px 20px #0000000a
}
.card b{font-size:27px;display:block;margin-top:7px}
.table{
 background:#fff;border-radius:16px;overflow:auto
}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{padding:13px;border-bottom:1px solid #eee;text-align:left}
.thumb{
 width:55px;height:42px;object-fit:cover;border-radius:8px
}
.course{display:flex;align-items:center;gap:10px}
.badge{
 padding:5px 9px;border-radius:20px;
 font-size:11px;font-weight:800
}
.free{background:#dcfce7;color:#15803d}
.paid{background:#dbeafe;color:#1d4ed8}
.modal{
 display:none;position:fixed;inset:0;background:#0008;
 align-items:center;justify-content:center;padding:15px
}
.modal.show{display:flex}
.box{
 background:#fff;padding:22px;border-radius:18px;
 width:650px;max-width:100%;max-height:90vh;overflow:auto
}
.grid{
 display:grid;grid-template-columns:1fr 1fr;gap:12px
}
.full{grid-column:1/-1}
label{font-size:13px;font-weight:700}
label input,label select,label textarea{margin-top:5px}
textarea{min-height:90px}
.footer{
 display:flex;justify-content:flex-end;gap:10px;margin-top:18px
}
.toast{
 position:fixed;right:20px;bottom:20px;
 background:#111827;color:#fff;padding:13px 18px;
 border-radius:10px;display:none
}
.toast.show{display:block}
@media(max-width:650px){
 .stats{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
 .full{grid-column:auto}
}
</style>
</head>

<body>

<header>
 <strong>LetsStudy Pro • Admin</strong>
 <button id="logout" class="gray">Logout</button>
</header>

<main class="container">

<h1>Technology & IT</h1>
<p>Manage Technology, Programming, AI, Cybersecurity and IT courses.</p>

<div class="stats">
 <div class="card">
  Total Courses
  <b id="total">0</b>
 </div>
 <div class="card">
  Published
  <b id="published">0</b>
 </div>
 <div class="card">
  Free
  <b id="free">0</b>
 </div>
</div>

<div class="toolbar">
 <input id="search" class="search"
        placeholder="Search Technology & IT...">

 <select id="filter">
  <option value="">All</option>
  <option value="free">Free</option>
  <option value="paid">Paid</option>
  <option value="published">Published</option>
  <option value="draft">Draft</option>
 </select>

 <button id="add" class="primary">
  + Add Course
 </button>
</div>

<div class="table">
<table>
<thead>
<tr>
<th>Course</th>
<th>Category</th>
<th>Price</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

</main>


<div class="modal" id="modal">
<div class="box">

<h2 id="modalTitle">Add Technology & IT Course</h2>

<form id="form">

<input type="hidden" id="id">

<div class="grid">

<div class="full">
<label>
 Course Title
 <input id="title" required>
</label>
</div>

<div>
<label>
 Category
 <select id="category">
  <option>Technology & IT</option>
  <option>Programming</option>
  <option>Artificial Intelligence</option>
  <option>Cybersecurity</option>
  <option>Data Science</option>
  <option>Cloud Computing</option>
  <option>Networking</option>
  <option>Software Development</option>
 </select>
</label>
</div>

<div>
<label>
 Level
 <select id="level">
  <option>Beginner</option>
  <option>Intermediate</option>
  <option>Advanced</option>
  <option>Professional</option>
 </select>
</label>
</div>

<div>
<label>
 Price (TZS)
 <input id="price" type="number" min="0" value="0">
</label>
</div>

<div>
<label>
 Discount Price
 <input id="discount" type="number" min="0">
</label>
</div>

<div class="full">
<label>
 Thumbnail URL
 <input id="thumbnail" type="url">
</label>
</div>

<div class="full">
<label>
 Short Description
 <textarea id="short"></textarea>
</label>
</div>

<div class="full">
<label>
 Description
 <textarea id="description"></textarea>
</label>
</div>

<div>
<label>
 Instructor
 <input id="instructor" value="LetsStudy Pro">
</label>
</div>

<div>
<label>
 Status
 <select id="status">
  <option value="draft">Draft</option>
  <option value="published">Published</option>
 </select>
</label>
</div>

</div>

<div class="footer">
 <button type="button" id="cancel" class="gray">
  Cancel
 </button>
 <button class="primary">
  Save Course
 </button>
</div>

</form>
</div>
</div>

<div id="toast" class="toast"></div>


<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import{
 getAuth,onAuthStateChanged,signOut
}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import{
 getFirestore,collection,getDocs,
 getDoc,doc,addDoc,updateDoc,deleteDoc,
 serverTimestamp
}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig={
 apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",
 authDomain:"let-s-study-pro-course.firebaseapp.com",
 projectId:"let-s-study-pro-course",
 storageBucket:"let-s-study-pro-course.firebasestorage.app",
 messagingSenderId:"474928293390",
 appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=x=>document.getElementById(x);

let courses=[];
let editing=null;


/* AUTH */




/* LOAD */

async function load(){

 const snap=await getDocs(
  collection(db,"courses")
 );

 courses=snap.docs
 .map(d=>({id:d.id,...d.data()}))
 .filter(c=>{

  const category=
   String(c.categoryName||"")
   .toLowerCase();

  return(
   category.includes("technology")||
   category.includes("programming")||
   category.includes("artificial")||
   category.includes("cyber")||
   category.includes("data")||
   category.includes("cloud")||
   category.includes("network")||
   category.includes("software")||
   category.includes("information technology")
  );

 });

 render();

}


/* RENDER */

function render(){

 const q=$("search").value.toLowerCase();
 const f=$("filter").value;

 const data=courses.filter(c=>{

  const text=(
   c.title+" "+
   c.categoryName+" "+
   c.level
  ).toLowerCase();

  const free=
   c.isFree===true||
   Number(c.price||0)===0;

  return(
   (!q||text.includes(q))&&
   (!f||
    (f==="free"&&free)||
    (f==="paid"&&!free)||
    (f==="published"&&c.status==="published")||
    (f==="draft"&&c.status==="draft"))
  );

 });


 $("total").textContent=courses.length;

 $("published").textContent=
  courses.filter(c=>c.status==="published").length;

 $("free").textContent=
  courses.filter(c=>
   c.isFree===true||
   Number(c.price||0)===0
  ).length;


 $("list").innerHTML=data.map(c=>{

  const free=
   c.isFree===true||
   Number(c.price||0)===0;

  return`
  <tr>

   <td>
    <div class="course">

     <img class="thumb"
      src="${c.thumbnail||
      'https://images.unsplash.com/photo-1518770660439-4636190af475?w=300'}">

     <div>
      <b>${esc(c.title)}</b><br>
      <small>${esc(c.level||"Beginner")}</small>
     </div>

    </div>
   </td>

   <td>${esc(c.categoryName)}</td>

   <td>
    <span class="badge ${free?'free':'paid'}">
     ${free?"FREE":
      `${c.currency||"TZS"} ${Number(
       c.discountPrice??c.price
      ).toLocaleString()}`}
    </span>
   </td>

   <td>${esc(c.status||"draft")}</td>

   <td>
    <button class="gray"
     onclick="editCourse('${c.id}')">
     Edit
    </button>

    <button class="danger"
     onclick="deleteCourse('${c.id}')">
     Delete
    </button>
   </td>

  </tr>`;

 }).join("");

}


function esc(v){
 return String(v||"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;");
}


/* ADD */

$("add").onclick=()=>{

 editing=null;
 $("form").reset();

 $("price").value=0;
 $("instructor").value="LetsStudy Pro";
 $("modalTitle").textContent=
  "Add Technology & IT Course";

 $("modal").classList.add("show");

};


/* EDIT */

window.editCourse=id=>{

 const c=courses.find(x=>x.id===id);

 if(!c)return;

 editing=id;

 $("title").value=c.title||"";
 $("category").value=
  c.categoryName||"Technology & IT";
 $("level").value=
  c.level||"Beginner";
 $("price").value=
  c.price||0;
 $("discount").value=
  c.discountPrice??"";
 $("thumbnail").value=
  c.thumbnail||"";
 $("short").value=
  c.shortDescription||"";
 $("description").value=
  c.description||"";
 $("instructor").value=
  c.instructorName||"LetsStudy Pro";
 $("status").value=
  c.status||"draft";

 $("modalTitle").textContent=
  "Edit Technology & IT Course";

 $("modal").classList.add("show");

};


/* SAVE */

$("form").onsubmit=async e=>{

 e.preventDefault();

 const price=
  Number($("price").value||0);

 const data={

  title:$("title").value.trim(),

  slug:$("title").value
   .toLowerCase()
   .trim()
   .replace(/[^a-z0-9]+/g,"-"),

  categoryName:$("category").value,

  categoryId:$("category").value
   .toLowerCase()
   .replace(/\s+/g,"-"),

  level:$("level").value,

  price,

  currency:"TZS",

  discountPrice:
   $("discount").value?
   Number($("discount").value):null,

  isFree:price===0,

  thumbnail:
   $("thumbnail").value.trim(),

  shortDescription:
   $("short").value.trim(),

  description:
   $("description").value.trim(),

  instructorName:
   $("instructor").value.trim(),

  status:$("status").value,

  published:
   $("status").value==="published",

  updatedAt:serverTimestamp()

 };


 try{

  if(editing){

   await updateDoc(
    doc(db,"courses",editing),
    data
   );

   toast("Course updated");

  }else{

   data.createdAt=serverTimestamp();
   data.enrollmentCount=0;
   data.rating=0;
   data.ratingCount=0;

   await addDoc(
    collection(db,"courses"),
    data
   );

   toast("Course added");

  }

  close();
  load();

 }catch(error){

  console.error(error);
  toast("Operation failed");

 }

};


/* DELETE */

window.deleteCourse=async id=>{

 const c=courses.find(x=>x.id===id);

 if(!c)return;

 if(!confirm(
  `Delete "${c.title}"?`
 ))return;

 await deleteDoc(
  doc(db,"courses",id)
 );

 toast("Course deleted");

 load();

};


/* CLOSE */

function close(){
 $("modal").classList.remove("show");
 editing=null;
}

$("cancel").onclick=close;


/* SEARCH */

$("search").oninput=render;
$("filter").onchange=render;


/* LOGOUT */

$("logout").onclick=async()=>{
 await signOut(auth);
 location.href="login.html";
};


/* TOAST */

function toast(text){

 $("toast").textContent=text;
 $("toast").classList.add("show");

 setTimeout(()=>
  $("toast").classList.remove("show"),
 2500
 );

}

</script>

</body>
</html>
