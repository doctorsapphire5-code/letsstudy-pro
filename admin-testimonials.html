<!DOCTYPE html>
<html lang="en">
<head>

  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9557927842145806"
  crossorigin="anonymous"></script>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Testimonials - LetsStudy Pro</title>
<link rel="icon" href="https://letsstudy.pro/favicon.ico">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e5e9f0;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:21px;font-weight:800;color:#1769ff;text-decoration:none}
nav a{margin-left:14px;color:#455064;text-decoration:none;font-size:13px}
main{max-width:1200px;margin:auto;padding:30px 5%}
h1{margin:0 0 8px}
.sub{color:#6d7788;margin-bottom:25px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
.stat{background:#fff;padding:20px;border:1px solid #e5e9f0;border-radius:14px}
.stat b{display:block;font-size:26px;margin-top:5px}
.panel{background:#fff;border:1px solid #e5e9f0;border-radius:16px;padding:22px;margin-bottom:25px}
form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.full{grid-column:1/-1}
label{font-size:13px;font-weight:700}
input,textarea,select{width:100%;padding:12px;margin-top:6px;border:1px solid #d9dfe8;border-radius:9px;background:#fff;font:inherit}
textarea{min-height:110px;resize:vertical}
button{border:0;padding:11px 16px;border-radius:9px;cursor:pointer;font-weight:700}
.save{background:#1769ff;color:#fff}
.cancel{background:#edf1f7;color:#344054}
.danger{background:#ffe8e8;color:#c62828}
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px;border-bottom:1px solid #edf0f4;font-size:13px}
th{background:#fafbfc}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#edf1f7}
.stars{color:#e5a400}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.edit{background:#edf5ff;color:#1769ff}
.view{background:#eef8f0;color:#218838}
.status{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}
.published{background:#e7f7ed;color:#198754}
.draft{background:#fff3cd;color:#997404}
.message{padding:12px;border-radius:9px;margin-bottom:15px;display:none}
.ok{background:#e8f7ed;color:#176b3a}
.err{background:#ffe8e8;color:#a61b1b}
.empty{text-align:center;padding:40px;color:#697386}
@media(max-width:700px){
.stats{grid-template-columns:1fr}
form{grid-template-columns:1fr}
.full{grid-column:auto}
nav a{display:none}
}
</style>
</head>

<body>

<header>
<a class="logo" href="index.html">LetsStudy Pro</a>

<nav>
<a href="admin-blog.html">Blog</a>
<a href="admin-courses.html">Courses</a>
<a href="admin-testimonials.html">Testimonials</a>
<a href="testimonials.html">Public Page</a>
</nav>
</header>

<main>

<h1>Testimonials</h1>
<div class="sub">Create and manage community testimonials.</div>

<div id="message" class="message"></div>

<div class="stats">
<div class="stat">
Total
<b id="total">0</b>
</div>

<div class="stat">
Published
<b id="published">0</b>
</div>

<div class="stat">
Draft
<b id="draft">0</b>
</div>
</div>

<section class="panel">

<h2 id="formTitle">Add Testimonial</h2>

<form id="form">

<input type="hidden" id="editId">

<div>
<label>Name</label>
<input id="name" required placeholder="John Doe">
</div>

<div>
<label>Role / Position</label>
<input id="role" placeholder="Student">
</div>

<div>
<label>Category</label>
<input id="category" placeholder="Learning">
</div>

<div>
<label>Rating</label>
<select id="rating">
<option value="5">5 Stars</option>
<option value="4">4 Stars</option>
<option value="3">3 Stars</option>
<option value="2">2 Stars</option>
<option value="1">1 Star</option>
</select>
</div>

<div>
<label>Course</label>
<input id="course" placeholder="Optional">
</div>

<div>
<label>Service</label>
<input id="service" placeholder="Optional">
</div>

<div>
<label>Location</label>
<input id="location" placeholder="Optional">
</div>

<div>
<label>Image URL</label>
<input id="image" placeholder="https://...">
</div>

<div class="full">
<label>Testimonial</label>
<textarea id="testimonial" required placeholder="Write the customer's experience..."></textarea>
</div>

<div>
<label>Status</label>
<select id="status">
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>
</div>

<div class="full">
<button class="save" type="submit" id="saveBtn">
Save Testimonial
</button>

<button class="cancel" type="button" id="cancelBtn" style="display:none">
Cancel Edit
</button>
</div>

</form>

</section>


<section class="panel">

<h2>All Testimonials</h2>

<div class="tableWrap">

<table>

<thead>
<tr>
<th>Person</th>
<th>Testimonial</th>
<th>Rating</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="list">
<tr>
<td colspan="5" class="empty">
Loading...
</td>
</tr>
</tbody>

</table>

</div>

</section>

</main>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
addDoc,
updateDoc,
deleteDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


const form=document.getElementById("form");
const list=document.getElementById("list");
const message=document.getElementById("message");

const total=document.getElementById("total");
const published=document.getElementById("published");
const draft=document.getElementById("draft");

const editId=document.getElementById("editId");
const formTitle=document.getElementById("formTitle");
const saveBtn=document.getElementById("saveBtn");
const cancelBtn=document.getElementById("cancelBtn");


const fields=[
"name",
"role",
"category",
"rating",
"course",
"service",
"location",
"image",
"testimonial",
"status"
];


let testimonials=[];


function showMessage(text,error=false){

message.textContent=text;
message.className=
"message "+(error?"err":"ok");
message.style.display="block";

setTimeout(()=>{
message.style.display="none";
},3500);

}


function stars(r){

r=Number(r)||0;

return "★".repeat(r)+"☆".repeat(5-r);

}


async function load(){

try{

const snap=await getDocs(
collection(db,"testimonials")
);

testimonials=snap.docs.map(d=>({
id:d.id,
...d.data()
}));


total.textContent=testimonials.length;

published.textContent=
testimonials.filter(x=>
x.status==="published" ||
x.published===true
).length;

draft.textContent=
testimonials.filter(x=>
x.status==="draft" ||
x.published===false
).length;


if(!testimonials.length){

list.innerHTML=`
<tr>
<td colspan="5" class="empty">
No testimonials yet.
</td>
</tr>
`;

return;

}


list.innerHTML=testimonials.map(t=>{

const name=
t.name||
t.userName||
t.fullName||
"Community Member";

const text=
t.testimonial||
t.quote||
t.review||
"";

const image=
t.image||
t.avatar||
t.photo||
"";

const status=
t.status||
(t.published===true?"published":"draft");

return `
<tr>

<td>

${
image
?`<img class="avatar"
src="${image}"
alt="${name}"
onerror="this.style.visibility='hidden'">`
:""
}

<strong>${name}</strong>

${t.role
?`<br><small>${t.role}</small>`
:""}

</td>

<td>
${text.substring(0,100)}
${text.length>100?"...":""}
</td>

<td class="stars">
${stars(t.rating||t.stars)}
</td>

<td>
<span class="status ${status}">
${status}
</span>
</td>

<td>

<div class="actions">

<button class="edit"
onclick="editTestimonial('${t.id}')">
Edit
</button>

<button class="danger"
onclick="removeTestimonial('${t.id}')">
Delete
</button>

<button class="view"
onclick="viewTestimonial('${t.id}')">
View
</button>

</div>

</td>

</tr>
`;

}).join("");

}catch(error){

console.error(error);

list.innerHTML=`
<tr>
<td colspan="5" class="empty">
Unable to load testimonials.
</td>
</tr>
`;

showMessage(
"Unable to load testimonials.",
true
);

}

}


form.addEventListener("submit",async e=>{

e.preventDefault();

saveBtn.disabled=true;
saveBtn.textContent="Saving...";

try{

const data={

name:document.getElementById("name").value.trim(),

role:document.getElementById("role").value.trim(),

category:document.getElementById("category").value.trim(),

rating:Number(
document.getElementById("rating").value
),

course:document.getElementById("course").value.trim(),

service:document.getElementById("service").value.trim(),

location:document.getElementById("location").value.trim(),

image:document.getElementById("image").value.trim(),

testimonial:document.getElementById("testimonial").value.trim(),

status:document.getElementById("status").value,

published:
document.getElementById("status").value==="published",

updatedAt:serverTimestamp()

};


if(editId.value){

await updateDoc(
doc(db,"testimonials",editId.value),
data
);

showMessage("Testimonial updated successfully.");

}else{

data.createdAt=serverTimestamp();

await addDoc(
collection(db,"testimonials"),
data
);

showMessage("Testimonial added successfully.");

}


resetForm();
await load();

}catch(error){

console.error(error);

showMessage(
"Failed to save testimonial.",
true
);

}finally{

saveBtn.disabled=false;
saveBtn.textContent="Save Testimonial";

}

});


window.editTestimonial=function(id){

const t=testimonials.find(x=>x.id===id);

if(!t)return;

editId.value=id;

document.getElementById("name").value=
t.name||"";

document.getElementById("role").value=
t.role||"";

document.getElementById("category").value=
t.category||"";

document.getElementById("rating").value=
t.rating||t.stars||5;

document.getElementById("course").value=
t.course||t.courseName||"";

document.getElementById("service").value=
t.service||t.serviceName||"";

document.getElementById("location").value=
t.location||"";

document.getElementById("image").value=
t.image||t.avatar||"";

document.getElementById("testimonial").value=
t.testimonial||t.quote||t.review||"";

document.getElementById("status").value=
t.status||
(t.published===true?"published":"draft");

formTitle.textContent="Edit Testimonial";

saveBtn.textContent="Update Testimonial";

cancelBtn.style.display="inline-block";

window.scrollTo({
top:0,
behavior:"smooth"
});

};


window.removeTestimonial=async function(id){

const t=testimonials.find(x=>x.id===id);

if(!t)return;

if(!confirm(
`Delete testimonial from "${t.name||"this user"}"?`
))return;

try{

await deleteDoc(
doc(db,"testimonials",id)
);

showMessage("Testimonial deleted.");

await load();

}catch(error){

console.error(error);

showMessage(
"Failed to delete testimonial.",
true
);

}

};


window.viewTestimonial=function(id){

window.location.href=
`testimonial-details.html?id=${encodeURIComponent(id)}`;

};


function resetForm(){

form.reset();

editId.value="";

document.getElementById("rating").value="5";
document.getElementById("status").value="published";

formTitle.textContent="Add Testimonial";

saveBtn.textContent="Save Testimonial";

cancelBtn.style.display="none";

}


cancelBtn.addEventListener(
"click",
resetForm
);


load();

</script>

</body>
</html>
