<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Videos | LetsStudy Pro</title>

<link rel="icon"
href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgQHmJO8e8twONhRhp3I6pP4NFDh-LPcqVtAmQ9R9XjOGaVMKShfSLmxeK0fVzJsybBBOXKbA8LIhjgTgko83C-UPVhwgXeLtvTfjtVv6aVGgQgniOF-gMC28bY78HryXZ-5OqCwdBpKGqjEfTta5jLjT1mpvtBi2DQKyu35rkxsZNoVvl0nhvxUUn1gDP0/s1600/Untitled%20design_20260717_144337_0000.jpg">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

button,input,select,textarea{font:inherit}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 5%;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 color:#155eef;
 font-size:20px;
 font-weight:900
}

.admin{
 background:#eef4ff;
 color:#155eef;
 padding:8px 12px;
 border-radius:20px;
 font-size:11px;
 font-weight:800
}

.container{
 max-width:1200px;
 margin:30px auto;
 padding:0 20px
}

.header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:22px
}

h1{
 margin:0;
 font-size:28px
}

.subtitle{
 color:#667085;
 font-size:13px;
 margin-top:6px
}

.tools{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}

.search,
select{
 padding:11px 13px;
 border:1px solid #d0d5dd;
 border-radius:9px;
 background:#fff;
 outline:none
}

.add{
 border:0;
 background:#155eef;
 color:#fff;
 padding:11px 15px;
 border-radius:9px;
 cursor:pointer;
 font-size:12px;
 font-weight:800
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin-bottom:22px
}

.stat{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:13px;
 padding:18px
}

.stat i{
 color:#155eef;
 margin-bottom:10px
}

.stat strong{
 display:block;
 font-size:22px
}

.stat span{
 color:#667085;
 font-size:11px
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:16px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:15px;
 overflow:hidden
}

.thumb{
 height:170px;
 background:#eef2f6;
 position:relative
}

.thumb img{
 width:100%;
 height:100%;
 object-fit:cover
}

.status{
 position:absolute;
 top:10px;
 left:10px;
 padding:5px 9px;
 border-radius:20px;
 font-size:9px;
 font-weight:800
}

.published{
 background:#ecfdf3;
 color:#027a48
}

.draft{
 background:#f2f4f7;
 color:#475467
}

.featured{
 position:absolute;
 top:10px;
 right:10px;
 background:#fff;
 color:#f59e0b;
 padding:6px 8px;
 border-radius:20px;
 font-size:10px
}

.body{
 padding:15px
}

.title{
 font-size:15px;
 font-weight:800;
 margin-bottom:7px
}

.description{
 color:#667085;
 font-size:11px;
 line-height:1.5;
 min-height:34px
}

.meta{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin:12px 0
}

.meta span{
 background:#f8fafc;
 border:1px solid #eaecf0;
 padding:5px 8px;
 border-radius:7px;
 color:#667085;
 font-size:9px
}

.actions{
 display:flex;
 gap:6px;
 flex-wrap:wrap
}

.btn{
 border:1px solid #d0d5dd;
 background:#fff;
 padding:7px 9px;
 border-radius:7px;
 cursor:pointer;
 font-size:10px;
 font-weight:700
}

.btn:hover{
 border-color:#155eef;
 color:#155eef
}

.danger:hover{
 border-color:#d92d20;
 color:#d92d20
}

.empty{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:15px;
 padding:60px;
 text-align:center;
 color:#667085
}

/* MODAL */

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(15,23,42,.65);
 z-index:100;
 padding:20px;
 overflow:auto
}

.modal-box{
 max-width:800px;
 margin:20px auto;
 background:#fff;
 border-radius:18px;
 overflow:hidden
}

.modal-head{
 display:flex;
 justify-content:space-between;
 padding:20px 24px;
 border-bottom:1px solid #eaecf0
}

.modal-head h2{
 margin:0
}

.close{
 border:0;
 background:#f2f4f7;
 width:34px;
 height:34px;
 border-radius:50%;
 cursor:pointer;
 font-size:20px
}

.form{
 padding:24px
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:14px
}

.field label{
 display:block;
 font-size:11px;
 font-weight:800;
 margin-bottom:6px
}

.field input,
.field select,
.field textarea{
 width:100%;
 padding:11px;
 border:1px solid #d0d5dd;
 border-radius:9px;
 outline:none
}

.field textarea{
 min-height:100px;
 resize:vertical
}

.full{
 grid-column:1/-1
}

.form-actions{
 display:flex;
 justify-content:flex-end;
 gap:8px;
 margin-top:20px;
 padding-top:18px;
 border-top:1px solid #eaecf0
}

.cancel{
 border:1px solid #d0d5dd;
 background:#fff;
 padding:11px 16px;
 border-radius:9px;
 cursor:pointer;
 font-weight:800
}

.save{
 border:0;
 background:#155eef;
 color:#fff;
 padding:11px 17px;
 border-radius:9px;
 cursor:pointer;
 font-weight:800
}

@media(max-width:900px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .header{flex-direction:column;align-items:flex-start}
}

@media(max-width:600px){
 .grid{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(2,1fr)}
 .form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .tools{width:100%}
 .search,select,.add{width:100%}
}
</style>
</head>

<body>

<header class="top">

<div class="logo">
LetsStudy Pro
</div>

<div class="admin">
<i class="fa fa-shield-halved"></i>
ADMIN
</div>

</header>


<main class="container">

<div class="header">

<div>
<h1>Video Management</h1>

<div class="subtitle">
Create, manage, publish and control LetsStudy Pro videos.
</div>
</div>

<div class="tools">

<input
id="search"
class="search"
placeholder="Search videos...">

<select id="filter">

<option value="">All Status</option>
<option value="published">Published</option>
<option value="draft">Draft</option>

</select>

<button
class="add"
onclick="openAdd()">

<i class="fa fa-plus"></i>
Add Video

</button>

</div>

</div>


<section class="stats">

<div class="stat">
<i class="fa fa-video"></i>
<strong id="total">0</strong>
<span>Total Videos</span>
</div>

<div class="stat">
<i class="fa fa-circle-check"></i>
<strong id="publishedCount">0</strong>
<span>Published</span>
</div>

<div class="stat">
<i class="fa fa-star"></i>
<strong id="featuredCount">0</strong>
<span>Featured</span>
</div>

<div class="stat">
<i class="fa fa-eye"></i>
<strong id="views">0</strong>
<span>Total Views</span>
</div>

</section>


<div id="videoGrid" class="grid"></div>

</main>


<!-- ADD / EDIT -->

<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">

<div>
<h2 id="modalTitle">Add Video</h2>
</div>

<button
class="close"
onclick="closeModal()">
×
</button>

</div>


<form id="videoForm" class="form">

<div class="form-grid">

<div class="field full">

<label>Video Title *</label>

<input
id="title"
required
placeholder="Enter video title">

</div>


<div class="field full">

<label>Description</label>

<textarea
id="description"
placeholder="Describe this video..."></textarea>

</div>


<div class="field">

<label>Video URL *</label>

<input
id="videoUrl"
required
placeholder="https://youtube.com/...">

</div>


<div class="field">

<label>Video Type</label>

<select id="videoType">

<option value="youtube">YouTube</option>
<option value="vimeo">Vimeo</option>
<option value="firebase">Firebase Storage</option>
<option value="external">External</option>

</select>

</div>


<div class="field">

<label>Thumbnail URL</label>

<input
id="thumbnail"
placeholder="https://...">

</div>


<div class="field">

<label>Duration</label>

<input
id="duration"
placeholder="25:40">

</div>


<div class="field">

<label>Category</label>

<input
id="category"
placeholder="Technology">

</div>


<div class="field">

<label>Tags</label>

<input
id="tags"
placeholder="HTML, CSS, JavaScript">

</div>


<div class="field">

<label>Creator Name</label>

<input
id="creatorName"
placeholder="LetsStudy Pro">

</div>


<div class="field">

<label>Creator ID</label>

<input
id="creatorId"
placeholder="User ID">

</div>


<div class="field">

<label>Price</label>

<input
id="price"
type="number"
min="0"
value="0">

</div>


<div class="field">

<label>Currency</label>

<select id="currency">

<option value="TZS">TZS</option>
<option value="USD">USD</option>
<option value="EUR">EUR</option>

</select>

</div>


<div class="field">

<label>Status</label>

<select id="status">

<option value="draft">Draft</option>
<option value="published">Published</option>

</select>

</div>


<div class="field">

<label>Free Video</label>

<select id="isFree">

<option value="true">Yes</option>
<option value="false">No</option>

</select>

</div>


</div>


<div class="form-actions">

<button
type="button"
class="cancel"
onclick="closeModal()">

Cancel

</button>

<button
type="submit"
class="save"
id="saveBtn">

<i class="fa fa-save"></i>
Save Video

</button>

</div>

</form>

</div>

</div>


<script type="module">

import {
 initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 addDoc,
 doc,
 updateDoc,
 deleteDoc,
 serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsYrgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let videos=[];
let editingId=null;

const $=id=>document.getElementById(id);


function esc(value=""){
 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}


/* LOAD */

async function load(){

 try{

  const snap=
  await getDocs(
   collection(db,"videos")
  );

  /*
   IMPORTANT:
   Firestore document ID
   ndiyo video ID.
  */

  videos=
  snap.docs.map(d=>({
   id:d.id,
   ...d.data()
  }));

  render();

 }catch(error){

  console.error(error);

  $("videoGrid").innerHTML=`
  <div class="empty">
  Unable to load videos.
  </div>`;

 }
}


/* RENDER */

function render(){

 const q=
 $("search").value
 .toLowerCase()
 .trim();

 const filter=
 $("filter").value;

 const data=
 videos.filter(v=>{

  const text=`
   ${v.title||""}
   ${v.description||""}
   ${v.category||""}
   ${v.creatorName||""}
   ${
    Array.isArray(v.tags)
    ?v.tags.join(" ")
    :""
   }
  `.toLowerCase();

  return(
   (!q||text.includes(q)) &&
   (!filter||v.status===filter)
  );

 });


 $("total").textContent=
 videos.length.toLocaleString();

 $("publishedCount").textContent=
 videos.filter(
  v=>v.status==="published"
 ).length;

 $("featuredCount").textContent=
 videos.filter(
  v=>v.featured
 ).length;

 $("views").textContent=
 videos.reduce(
  (sum,v)=>sum+Number(v.views||0),
  0
 ).toLocaleString();


 if(!data.length){

  $("videoGrid").innerHTML=`
  <div class="empty">
  <i class="fa fa-video fa-2x"></i>
  <h3>No videos found</h3>
  </div>`;

  return;
 }


 $("videoGrid").innerHTML=
 data.map(card).join("");

}


/* CARD */

function card(v){

 const image=
 v.thumbnail||
 "https://via.placeholder.com/800x450?text=Video";


 return`

 <article class="card">

 <div class="thumb">

 <img
 src="${esc(image)}"
 alt="${esc(v.title||"Video")}">

 <span class="status ${
  v.status==="published"
  ?"published"
  :"draft"
 }">

 ${esc(v.status||"draft")}

 </span>

 ${
  v.featured
  ?
  `<span class="featured">
   <i class="fa fa-star"></i>
   Featured
   </span>`
  :""
 }

 </div>


 <div class="body">

 <div class="title">
 ${esc(v.title||"Untitled Video")}
 </div>

 <div class="description">
 ${esc(v.description||"No description")}
 </div>


 <div class="meta">

 <span>
 <i class="fa fa-folder"></i>
 ${esc(v.category||"General")}
 </span>

 <span>
 <i class="fa fa-clock"></i>
 ${esc(v.duration||"-")}
 </span>

 <span>
 <i class="fa fa-eye"></i>
 ${Number(v.views||0).toLocaleString()}
 </span>

 </div>


 <div class="actions">

 <button
 class="btn"
 onclick="previewVideo('${v.id}')">

 <i class="fa fa-play"></i>
 Preview

 </button>


 <button
 class="btn"
 onclick="editVideo('${v.id}')">

 <i class="fa fa-pen"></i>
 Edit

 </button>


 <button
 class="btn"
 onclick="togglePublish('${v.id}','${v.status||"draft"}')">

 ${
  v.status==="published"
  ?"Unpublish"
  :"Publish"
 }

 </button>


 <button
 class="btn"
 onclick="toggleFeatured('${v.id}',${!!v.featured})">

 ${
  v.featured
  ?"Unfeature"
  :"Feature"
 }

 </button>


 <button
 class="btn danger"
 onclick="removeVideo('${v.id}')">

 <i class="fa fa-trash"></i>
 Delete

 </button>

 </div>

 </div>

 </article>

 `;

}


/* OPEN ADD */

window.openAdd=()=>{

 editingId=null;

 $("modalTitle").textContent=
 "Add Video";

 $("videoForm").reset();

 $("price").value=0;

 $("modal").style.display=
 "block";

 document.body.style.overflow=
 "hidden";

};


/* CLOSE */

window.closeModal=()=>{

 $("modal").style.display=
 "none";

 document.body.style.overflow=
 "";

};


/* EDIT */

window.editVideo=id=>{

 const v=
 videos.find(x=>x.id===id);

 if(!v)return;

 editingId=id;

 $("modalTitle").textContent=
 "Edit Video";


 $("title").value=
 v.title||"";

 $("description").value=
 v.description||"";

 $("videoUrl").value=
 v.videoUrl||"";

 $("videoType").value=
 v.videoType||"youtube";

 $("thumbnail").value=
 v.thumbnail||"";

 $("duration").value=
 v.duration||"";

 $("category").value=
 v.category||"";

 $("tags").value=
 Array.isArray(v.tags)
 ?v.tags.join(", ")
 :"";

 $("creatorName").value=
 v.creatorName||"";

 $("creatorId").value=
 v.creatorId||"";

 $("price").value=
 Number(v.price||0);

 $("currency").value=
 v.currency||"TZS";

 $("status").value=
 v.status||"draft";

 $("isFree").value=
 v.isFree===false
 ?"false"
 :"true";


 $("modal").style.display=
 "block";

 document.body.style.overflow=
 "hidden";

};


/* SAVE */

$("videoForm").addEventListener(
 "submit",
 async e=>{

  e.preventDefault();

  const btn=
  $("saveBtn");

  btn.disabled=true;

  try{

   const title=
   $("title").value.trim();

   const tags=
   $("tags").value
   .split(",")
   .map(x=>x.trim())
   .filter(Boolean);


   const data={

    title:title,

    slug:
    title
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,""),

    description:
    $("description").value.trim(),

    thumbnail:
    $("thumbnail").value.trim(),

    videoUrl:
    $("videoUrl").value.trim(),

    videoType:
    $("videoType").value,

    duration:
    $("duration").value.trim(),

    category:
    $("category").value.trim(),

    tags:tags,

    creatorId:
    $("creatorId").value.trim(),

    creatorName:
    $("creatorName").value.trim(),

    creatorImage:"",

    isFree:
    $("isFree").value==="true",

    price:
    Number($("price").value||0),

    currency:
    $("currency").value,

    status:
    $("status").value,

    updatedAt:
    serverTimestamp()

   };


   if(editingId){

    await updateDoc(
     doc(
      db,
      "videos",
      editingId
     ),
     data
    );

   }else{

    data.featured=false;

    data.verified=false;

    data.views=0;

    data.likes=0;

    data.commentsCount=0;

    data.shares=0;

    data.createdAt=
    serverTimestamp();

    data.publishedAt=
    data.status==="published"
    ?serverTimestamp()
    :null;


    /*
     addDoc creates the
     Firestore document ID.
    */

    await addDoc(
     collection(db,"videos"),
     data
    );

   }


   closeModal();

   await load();

  }catch(error){

   console.error(error);

   alert(
    "Save failed: "+
    error.message
   );

  }finally{

   btn.disabled=false;

  }

 });


/* PREVIEW */

window.previewVideo=id=>{

 const v=
 videos.find(x=>x.id===id);

 if(!v)return;

 if(v.videoUrl){

  window.open(
   v.videoUrl,
   "_blank"
  );

 }else{

  alert("Video URL is missing.");

 }

};


/* PUBLISH */

window.togglePublish=
async(id,status)=>{

 try{

  await updateDoc(

   doc(
    db,
    "videos",
    id
   ),

   {
    status:
    status==="published"
    ?"draft"
    :"published",

    publishedAt:
    status==="published"
    ?null
    :serverTimestamp(),

    updatedAt:
    serverTimestamp()
   }

  );

  await load();

 }catch(e){

  alert(e.message);

 }

};


/* FEATURE */

window.toggleFeatured=
async(id,current)=>{

 try{

  await updateDoc(

   doc(
    db,
    "videos",
    id
   ),

   {
    featured:!current,

    updatedAt:
    serverTimestamp()
   }

  );

  await load();

 }catch(e){

  alert(e.message);

 }

};


/* DELETE */

window.removeVideo=
async id=>{

 if(
 !confirm(
 "Delete this video permanently?"
 )
 )return;


 try{

  await deleteDoc(

   doc(
    db,
    "videos",
    id
   )

  );

  await load();

 }catch(e){

  alert(e.message);

 }

};


/* SEARCH */

$("search").addEventListener(
 "input",
 render
);

$("filter").addEventListener(
 "change",
 render
);


/* MODAL BACKDROP */

$("modal").addEventListener(
 "click",
 e=>{

  if(e.target.id==="modal"){
   closeModal();
  }

 });


/* START */

load();

</script>

</body>
</html>
