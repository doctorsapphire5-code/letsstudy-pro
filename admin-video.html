<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Videos - LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.topbar{height:65px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.brand{font-size:20px;font-weight:800}.brand span{color:#2563eb}
.actions{display:flex;gap:8px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700}
.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb}.danger{background:#dc2626;color:#fff}.success{background:#16a34a;color:#fff}
.main{width:min(1450px,96%);margin:auto;padding:25px 0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h1{margin:0}.header p{color:#6b7280}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.stat,.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px}
.stat{padding:18px}.label{font-size:12px;color:#6b7280}.value{font-size:25px;font-weight:800;margin-top:5px}
.card{overflow:hidden}.cardhead{padding:16px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.filters{display:grid;grid-template-columns:1fr 160px 160px auto;gap:8px;padding:14px;border-bottom:1px solid #eee}
.input,.select,.textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;outline:0}
.textarea{min-height:90px;resize:vertical}
.table{overflow:auto}table{width:100%;min-width:1000px;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
th{background:#f9fafb;color:#6b7280;font-size:11px}
.video{display:flex;gap:9px;align-items:center}.thumb{width:75px;height:45px;object-fit:cover;border-radius:6px;background:#ddd}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.free,.published{background:#dcfce7;color:#166534}.plan{background:#fef3c7;color:#92400e}
.draft,.no{background:#f3f4f6;color:#6b7280}.featured{background:#ede9fe;color:#6d28d9}.verified{background:#dbeafe;color:#1d4ed8}
.rowactions{display:flex;gap:5px;flex-wrap:wrap}.small{padding:6px 8px;font-size:11px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}
.modal.show{display:flex}.modalbox{background:#fff;width:min(850px,100%);max-height:94vh;overflow:auto;border-radius:14px}
.modalhead,.modalfoot{padding:16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.modalfoot{border-top:1px solid #eee;border-bottom:0;justify-content:flex-end;gap:8px}
.modalbody{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.group label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}
.full{grid-column:1/-1}.checks{display:flex;gap:20px;flex-wrap:wrap}
.close{border:0;background:none;font-size:25px}.center{text-align:center;padding:35px;color:#6b7280}
.toast{position:fixed;right:15px;bottom:15px;background:#111827;color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:50}
.toast.show{display:block}.toast.ok{background:#166534}.toast.err{background:#991b1b}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.header{display:block}.header .actions{margin-top:12px}}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">Let'sStudy <span>Pro</span></div>
  <div class="actions">
    <button class="btn secondary" id="refresh">🔄 Refresh</button>
    <button class="btn primary" id="add">＋ Add Video</button>
  </div>
</header>

<main class="main">

<div class="header">
  <div>
    <h1>Video Management</h1>
    <p>Manage videos, creators, access, publishing and statistics.</p>
  </div>
</div>

<section class="stats">
  <div class="stat"><div class="label">Total Videos</div><div class="value" id="total">0</div></div>
  <div class="stat"><div class="label">Published</div><div class="value" id="pub">0</div></div>
  <div class="stat"><div class="label">Free</div><div class="value" id="free">0</div></div>
  <div class="stat"><div class="label">Plan</div><div class="value" id="plan">0</div></div>
  <div class="stat"><div class="label">Featured</div><div class="value" id="featuredCount">0</div></div>
</section>

<section class="card">

<div class="cardhead">
  <b>Video Library</b>
  <span id="count">0 videos</span>
</div>

<div class="filters">
  <input class="input" id="search" placeholder="Search title, category, creator...">

  <select class="select" id="access">
    <option value="all">All Access</option>
    <option value="free">Free</option>
    <option value="plan">Plan</option>
  </select>

  <select class="select" id="statusFilter">
    <option value="all">All Status</option>
    <option value="published">Published</option>
    <option value="draft">Draft</option>
  </select>

  <button class="btn secondary" id="clear">Clear</button>
</div>

<div class="table">
<table>
<thead>
<tr>
<th>Video</th>
<th>Category</th>
<th>Creator</th>
<th>Access</th>
<th>Status</th>
<th>Stats</th>
<th>Featured</th>
<th>Verified</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="tbody">
<tr><td colspan="9" class="center">Loading...</td></tr>
</tbody>
</table>
</div>

</section>
</main>


<!-- MODAL -->

<div class="modal" id="modal">
<div class="modalbox">

<div class="modalhead">
<h2 id="modalTitle">Add Video</h2>
<button class="close" id="close">×</button>
</div>

<form id="form">

<div class="modalbody">
<div class="grid">

<div class="group">
<label>Title *</label>
<input class="input" id="title" required>
</div>

<div class="group">
<label>Slug</label>
<input class="input" id="slug">
</div>

<div class="group">
<label>Category</label>
<input class="input" id="category">
</div>

<div class="group">
<label>Video Type</label>
<select class="select" id="videoType">
<option value="mp4">MP4</option>
<option value="webm">WebM</option>
<option value="youtube">YouTube</option>
<option value="vimeo">Vimeo</option>
<option value="hls">HLS</option>
</select>
</div>

<div class="group full">
<label>Video URL</label>
<input class="input" type="url" id="videoUrl">
</div>

<div class="group full">
<label>Thumbnail URL</label>
<input class="input" type="url" id="thumbnail">
</div>

<div class="group full">
<label>Description</label>
<textarea class="textarea" id="description"></textarea>
</div>

<div class="group">
<label>Duration</label>
<input class="input" id="duration" placeholder="10:30">
</div>

<div class="group">
<label>Tags</label>
<input class="input" id="tags" placeholder="html, css, javascript">
</div>

<div class="group">
<label>Creator ID</label>
<input class="input" id="creatorId">
</div>

<div class="group">
<label>Creator Name</label>
<input class="input" id="creatorName">
</div>

<div class="group full">
<label>Creator Image URL</label>
<input class="input" type="url" id="creatorImage">
</div>

<div class="group">
<label>Price</label>
<input class="input" type="number" min="0" step="any" id="price" value="0">
</div>

<div class="group">
<label>Currency</label>
<input class="input" id="currency" value="TZS">
</div>

<div class="group">
<label>Status</label>
<select class="select" id="status">
<option value="draft">Draft</option>
<option value="published">Published</option>
</select>
</div>

<div class="group">
<label>Access & Flags</label>
<div class="checks">
<label><input type="checkbox" id="isFree"> Free</label>
<label><input type="checkbox" id="isFeatured"> Featured</label>
<label><input type="checkbox" id="isVerified"> Verified</label>
</div>
</div>

</div>
</div>

<div class="modalfoot">
<button type="button" class="btn secondary" id="cancel">Cancel</button>
<button class="btn primary" id="save">Save Video</button>
</div>

</form>
</div>
</div>

<div class="toast" id="toast"></div>


<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rj0rodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let videos=[];
let editId=null;

const $=id=>document.getElementById(id);

function val(id){return $(id).value.trim()}
function check(id){return $(id).checked}

function set(id,v=""){ $(id).value=v??"" }
function setCheck(id,v){$(id).checked=!!v}

function esc(v=""){
return String(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function toast(msg,type=""){
$("toast").textContent=msg;
$("toast").className="toast show "+type;
clearTimeout(window.toastTimer);
window.toastTimer=setTimeout(()=>$("toast").className="toast",3000);
}

function slugify(v){
return v.toLowerCase().trim()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");
}


/* LOAD */

async function load(){

$("tbody").innerHTML=
`<tr><td colspan="9" class="center">Loading videos...</td></tr>`;

try{

const snap=await getDocs(collection(db,"videos"));

videos=snap.docs.map(d=>({id:d.id,...d.data()}));

stats();
render();

}catch(e){

console.error(e);

$("tbody").innerHTML=
`<tr><td colspan="9" class="center">Unable to load videos.<br>${esc(e.message)}</td></tr>`;

toast("Unable to load videos","err");

}

}


/* STATS */

function stats(){

$("total").textContent=videos.length;

$("pub").textContent=
videos.filter(v=>v.status==="published").length;

$("free").textContent=
videos.filter(v=>v.isFree===true||v.access==="free").length;

$("plan").textContent=
videos.filter(v=>!(v.isFree===true||v.access==="free")).length;

$("featuredCount").textContent=
videos.filter(v=>v.featured===true).length;

}


/* RENDER */

function render(){

const q=val("search").toLowerCase();
const access=$("access").value;
const status=$("statusFilter").value;

const list=videos.filter(v=>{

const text=[
v.title,v.category,v.creatorName,v.creatorId,v.slug,v.description
].join(" ").toLowerCase();

const free=v.isFree===true||v.access==="free";

return(
(!q||text.includes(q)) &&
(access==="all"||(access==="free"&&free)||(access==="plan"&&!free)) &&
(status==="all"||(v.status||"draft")===status)
);

});

$("count").textContent=`${list.length} videos`;

if(!list.length){

$("tbody").innerHTML=
`<tr><td colspan="9" class="center">No videos found.</td></tr>`;

return;
}

$("tbody").innerHTML=list.map(v=>{

const free=v.isFree===true||v.access==="free";
const published=v.status==="published";

return`

<tr>

<td>
<div class="video">
${
v.thumbnail
?`<img class="thumb" src="${esc(v.thumbnail)}" onerror="this.style.display='none'">`
:`<div class="thumb"></div>`
}
<div>
<b>${esc(v.title||"Untitled")}</b>
<div style="font-size:10px;color:#999">${esc(v.id)}</div>
</div>
</div>
</td>

<td>${esc(v.category||"—")}</td>

<td>${esc(v.creatorName||"—")}</td>

<td>
<span class="badge ${free?"free":"plan"}">
${free?"Free":"Plan"}
</span>
</td>

<td>
<span class="badge ${published?"published":"draft"}">
${published?"Published":"Draft"}
</span>
</td>

<td>
👁 ${Number(v.views||0).toLocaleString()}<br>
❤️ ${Number(v.likes||0).toLocaleString()}
</td>

<td>
<span class="badge ${v.featured?"featured":"no"}">
${v.featured?"Yes":"No"}
</span>
</td>

<td>
<span class="badge ${v.verified?"verified":"no"}">
${v.verified?"Yes":"No"}
</span>
</td>

<td>
<div class="rowactions">

<button class="btn secondary small" data-a="edit" data-id="${v.id}">
Edit
</button>

<button class="btn ${published?"secondary":"success"} small"
data-a="status" data-id="${v.id}">
${published?"Draft":"Publish"}
</button>

<button class="btn secondary small"
data-a="featured" data-id="${v.id}">
${v.featured?"Unfeature":"Feature"}
</button>

<button class="btn danger small"
data-a="delete" data-id="${v.id}">
Delete
</button>

</div>
</td>

</tr>`;

}).join("");

}


/* OPEN ADD */

function openAdd(){

editId=null;

$("modalTitle").textContent="Add Video";
$("save").textContent="Save Video";

$("form").reset();

set("price","0");
set("currency","TZS");
set("videoType","mp4");
set("status","draft");

$("modal").classList.add("show");

}


/* EDIT */

function edit(id){

const v=videos.find(x=>x.id===id);

if(!v)return;

editId=id;

$("modalTitle").textContent="Edit Video";
$("save").textContent="Update Video";

set("title",v.title);
set("slug",v.slug);
set("category",v.category);
set("videoType",v.videoType||"mp4");
set("videoUrl",v.videoUrl||v.url);
set("thumbnail",v.thumbnail);
set("description",v.description);
set("duration",v.duration);
set("tags",Array.isArray(v.tags)?v.tags.join(", "):v.tags);
set("creatorId",v.creatorId);
set("creatorName",v.creatorName);
set("creatorImage",v.creatorImage);
set("price",v.price??0);
set("currency",v.currency||"TZS");
set("status",v.status||"draft");

setCheck("isFree",v.isFree===true||v.access==="free");
setCheck("isFeatured",v.featured);
setCheck("isVerified",v.verified);

$("modal").classList.add("show");

}


/* SAVE */

$("form").addEventListener("submit",async e=>{

e.preventDefault();

const title=val("title");

if(!title){
toast("Title is required","err");
return;
}

const free=check("isFree");

const data={

title,

slug:val("slug")||slugify(title),

category:val("category"),

videoType:val("videoType"),

videoUrl:val("videoUrl"),

thumbnail:val("thumbnail"),

description:val("description"),

duration:val("duration"),

tags:val("tags")
.split(",")
.map(x=>x.trim())
.filter(Boolean),

creatorId:val("creatorId"),

creatorName:val("creatorName"),

creatorImage:val("creatorImage"),

price:Number($("price").value)||0,

currency:val("currency")||"TZS",

status:val("status")||"draft",

isFree:free,

access:free?"free":"plan",

featured:check("isFeatured"),

verified:check("isVerified"),

updatedAt:serverTimestamp()

};

$("save").disabled=true;

try{

if(editId){

await updateDoc(
doc(db,"videos",editId),
data
);

toast("Video updated","ok");

}else{

data.views=0;
data.likes=0;
data.comments=0;
data.createdAt=serverTimestamp();

if(data.status==="published")
data.publishedAt=serverTimestamp();

await addDoc(
collection(db,"videos"),
data
);

toast("Video added","ok");

}

close();
await load();

}catch(e){

console.error(e);
toast(e.message,"err");

}finally{

$("save").disabled=false;

}

});


/* STATUS */

async function changeStatus(id){

const v=videos.find(x=>x.id===id);

if(!v)return;

const next=v.status==="published"?"draft":"published";

try{

await updateDoc(
doc(db,"videos",id),
{
status:next,
updatedAt:serverTimestamp(),
...(next==="published"?{publishedAt:serverTimestamp()}:{})
}
);

toast(next==="published"?"Video published":"Video moved to draft","ok");

await load();

}catch(e){
toast(e.message,"err");
}

}


/* FEATURED */

async function feature(id){

const v=videos.find(x=>x.id===id);

if(!v)return;

try{

await updateDoc(
doc(db,"videos",id),
{
featured:!v.featured,
updatedAt:serverTimestamp()
}
);

toast(v.featured?"Removed from featured":"Marked as featured","ok");

await load();

}catch(e){
toast(e.message,"err");
}

}


/* DELETE */

async function remove(id){

const v=videos.find(x=>x.id===id);

if(!v)return;

if(!confirm(`Delete "${v.title||"this video"}"?`))return;

try{

await deleteDoc(
doc(db,"videos",id)
);

toast("Video deleted","ok");

await load();

}catch(e){
toast(e.message,"err");
}

}


/* EVENTS */

$("tbody").addEventListener("click",e=>{

const b=e.target.closest("[data-a]");

if(!b)return;

const id=b.dataset.id;
const action=b.dataset.a;

if(action==="edit")edit(id);
if(action==="status")changeStatus(id);
if(action==="featured")feature(id);
if(action==="delete")remove(id);

});

$("add").onclick=openAdd;

$("refresh").onclick=load;

$("search").oninput=render;

$("access").onchange=render;

$("statusFilter").onchange=render;

$("clear").onclick=()=>{
$("search").value="";
$("access").value="all";
$("statusFilter").value="all";
render();
};


/* MODAL */

function close(){

$("modal").classList.remove("show");
editId=null;

}

$("close").onclick=close;
$("cancel").onclick=close;

$("modal").onclick=e=>{
if(e.target===$("modal"))close();
};

document.addEventListener("keydown",e=>{
if(e.key==="Escape")close();
});


/* START */

load();

</script>
</body>
</html>
