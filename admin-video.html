<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Videos | Let'sStudy Pro</title>

<link rel="icon" href="/favicon.ico">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo i{
  color:#2563eb;
  margin-right:7px;
}

.user{
  font-size:13px;
  color:#64748b;
}

.container{
  max-width:1450px;
  margin:auto;
  padding:24px 20px 60px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.top h1{
  font-size:27px;
}

.top p{
  color:#64748b;
  margin-top:5px;
  font-size:13px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:700;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#fff;
  border:1px solid #dbe2ea;
  color:#334155;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:17px;
}

.stat small{
  color:#64748b;
  font-size:11px;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:7px;
}

.filters{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px;
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:15px;
}

.filters input,
.filters select{
  border:1px solid #dbe2ea;
  border-radius:8px;
  padding:10px 12px;
  background:#fff;
  outline:none;
}

.filters input{
  flex:1;
  min-width:220px;
}

.table-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

th{
  background:#f8fafc;
  color:#64748b;
  text-align:left;
  font-size:11px;
  padding:13px;
  border-bottom:1px solid #e5e7eb;
}

td{
  padding:12px;
  border-bottom:1px solid #eef2f7;
  font-size:12px;
  vertical-align:middle;
}

.thumb{
  width:90px;
  height:52px;
  object-fit:cover;
  border-radius:7px;
  background:#e2e8f0;
}

.title{
  font-weight:800;
  color:#111827;
  max-width:250px;
}

.id{
  color:#64748b;
  font-family:monospace;
  font-size:10px;
  margin-top:4px;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  font-size:10px;
  font-weight:800;
}

.free{
  background:#dcfce7;
  color:#166534;
}

.plan{
  background:#fef3c7;
  color:#92400e;
}

.published{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#e2e8f0;
  color:#475569;
}

.featured{
  background:#dbeafe;
  color:#1d4ed8;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.icon-btn{
  width:32px;
  height:32px;
  border:0;
  border-radius:7px;
  background:#f1f5f9;
  color:#334155;
}

.icon-btn:hover{
  background:#dbeafe;
  color:#2563eb;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:#64748b;
}

.loading{
  text-align:center;
  padding:60px;
  color:#64748b;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #e2e8f0;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal{
  width:100%;
  max-width:800px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:14px;
  padding:22px;
}

.modal h2{
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:11px;
  font-weight:800;
  color:#475569;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:8px;
  padding:10px;
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.checks{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  margin-top:5px;
}

.checks label{
  display:flex;
  gap:7px;
  align-items:center;
  font-size:12px;
  font-weight:700;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

.close{
  float:right;
  border:0;
  background:#f1f5f9;
  width:34px;
  height:34px;
  border-radius:50%;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:#fff;
  padding:12px 16px;
  border-radius:8px;
  display:none;
  z-index:2000;
  font-size:13px;
}

@media(max-width:1000px){
  .stats{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .container{
    padding:15px 10px 40px;
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    <i class="fa-solid fa-circle-play"></i>
    Let'sStudy Pro
  </div>

  <div class="user">
    Admin Video Management
  </div>

</header>


<main class="container">

  <div class="top">

    <div>
      <h1>Video Management</h1>
      <p>
        Manage videos, creators, views, likes, status and publishing.
      </p>
    </div>

    <button
      class="btn primary"
      id="addBtn"
    >
      <i class="fa-solid fa-plus"></i>
      Add Video
    </button>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <small>Total Videos</small>
      <strong id="totalVideos">0</strong>
    </div>

    <div class="stat">
      <small>Published</small>
      <strong id="publishedVideos">0</strong>
    </div>

    <div class="stat">
      <small>Drafts</small>
      <strong id="draftVideos">0</strong>
    </div>

    <div class="stat">
      <small>Featured</small>
      <strong id="featuredVideos">0</strong>
    </div>

    <div class="stat">
      <small>Total Views</small>
      <strong id="totalViews">0</strong>
    </div>

  </div>


  <!-- FILTERS -->

  <div class="filters">

    <input
      id="search"
      type="search"
      placeholder="Search title, slug, creator or ID..."
    >

    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="published">Published</option>
      <option value="draft">Draft</option>
    </select>

    <select id="categoryFilter">
      <option value="">All Categories</option>
    </select>

    <button
      class="btn secondary"
      id="refreshBtn"
    >
      <i class="fa-solid fa-rotate"></i>
      Refresh
    </button>

    <button
      class="btn secondary"
      id="clearBtn"
    >
      Clear
    </button>

  </div>


  <!-- TABLE -->

  <div class="table-card">

    <div
      id="loading"
      class="loading"
    >
      <div class="spinner"></div>
      Loading videos...
    </div>

    <div
      id="empty"
      class="empty"
      style="display:none"
    >
      <i class="fa-solid fa-video-slash"
         style="font-size:35px;margin-bottom:10px">
      </i>

      <p>No videos found.</p>
    </div>

    <div
      id="tableWrap"
      class="table-wrap"
      style="display:none"
    >

      <table>

        <thead>

          <tr>
            <th>Video</th>
            <th>Creator</th>
            <th>Category</th>
            <th>Access</th>
            <th>Status</th>
            <th>Views</th>
            <th>Likes</th>
            <th>Featured</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="videoTable"></tbody>

      </table>

    </div>

  </div>

</main>


<!-- MODAL -->

<div
  id="modal"
  class="overlay"
>

  <div class="modal">

    <button
      id="closeModal"
      class="close"
    >
      ×
    </button>

    <h2 id="modalTitle">
      Add Video
    </h2>


    <form id="videoForm">

      <input
        type="hidden"
        id="editId"
      >


      <div class="form-grid">

        <div class="field">
          <label>Title</label>
          <input
            id="title"
            required
          >
        </div>


        <div class="field">
          <label>Slug (SEO only)</label>
          <input id="slug">
        </div>


        <div class="field full">
          <label>Description</label>
          <textarea id="description"></textarea>
        </div>


        <div class="field">
          <label>Thumbnail URL</label>
          <input id="thumbnail">
        </div>


        <div class="field">
          <label>Video URL</label>
          <input
            id="videoUrl"
            required
          >
        </div>


        <div class="field">
          <label>Video Type</label>

          <select id="videoType">

            <option value="youtube">
              YouTube
            </option>

            <option value="vimeo">
              Vimeo
            </option>

            <option value="mp4">
              MP4
            </option>

            <option value="webm">
              WebM
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <div class="field">
          <label>Duration</label>
          <input
            id="duration"
            placeholder="18:15"
          >
        </div>


        <div class="field">
          <label>Category</label>
          <input id="category">
        </div>


        <div class="field">
          <label>Tags</label>
          <input
            id="tags"
            placeholder="#Education,#Technology"
          >
        </div>


        <div class="field">
          <label>Creator ID</label>
          <input id="creatorId">
        </div>


        <div class="field">
          <label>Creator Name</label>
          <input id="creatorName">
        </div>


        <div class="field">
          <label>Creator Image</label>
          <input id="creatorImage">
        </div>


        <div class="field">
          <label>Price</label>
          <input
            id="price"
            type="number"
            min="0"
          >
        </div>


        <div class="field">
          <label>Currency</label>
          <input
            id="currency"
            value="TZS"
          >
        </div>


        <div class="field">
          <label>Status</label>

          <select id="status">

            <option value="draft">
              Draft
            </option>

            <option value="published">
              Published
            </option>

          </select>

        </div>


        <div class="field full">

          <div class="checks">

            <label>
              <input
                type="checkbox"
                id="isFree"
              >
              Free Video
            </label>

            <label>
              <input
                type="checkbox"
                id="featured"
              >
              Featured
            </label>

            <label>
              <input
                type="checkbox"
                id="verified"
              >
              Verified
            </label>

          </div>

        </div>

      </div>


      <div class="modal-actions">

        <button
          type="button"
          class="btn secondary"
          id="cancelBtn"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn primary"
        >
          <i class="fa-solid fa-save"></i>
          Save Video
        </button>

      </div>

    </form>

  </div>

</div>


<div id="toast" class="toast"></div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp,
  increment
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================================
   STATE
========================================= */

let videos = [];

let filteredVideos = [];


/* =========================================
   HELPERS
========================================= */

const $ = id =>
  document.getElementById(id);


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return escapeHTML(value);

}


function number(value){

  return Number(value || 0)
    .toLocaleString();

}


function showToast(message){

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  setTimeout(() => {

    toast.style.display =
      "none";

  },2500);

}


/* =========================================
   LOAD VIDEOS
========================================= */

async function loadVideos(){

  $("loading").style.display =
    "block";

  $("tableWrap").style.display =
    "none";

  $("empty").style.display =
    "none";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "videos"
        )
      );


    videos = [];


    snapshot.forEach(videoDoc => {

      /*
       * IMPORTANT:
       * Firestore document ID is the
       * ONLY videoId used by the system.
       */

      videos.push({

        videoId:
          videoDoc.id,

        ...videoDoc.data()

      });

    });


    updateStats();

    buildCategories();

    applyFilters();


  }catch(error){

    console.error(
      "Load videos error:",
      error
    );

    showToast(
      "Failed to load videos."
    );

  }finally{

    $("loading").style.display =
      "none";

  }

}


/* =========================================
   STATS
========================================= */

function updateStats(){

  const published =
    videos.filter(v =>
      String(v.status || "")
        .toLowerCase()
        === "published"
    ).length;


  const drafts =
    videos.filter(v =>
      String(v.status || "")
        .toLowerCase()
        === "draft"
    ).length;


  const featured =
    videos.filter(v =>
      v.featured === true
    ).length;


  const views =
    videos.reduce(
      (sum,v) =>
        sum + Number(v.views || 0),
      0
    );


  $("totalVideos").textContent =
    number(videos.length);

  $("publishedVideos").textContent =
    number(published);

  $("draftVideos").textContent =
    number(drafts);

  $("featuredVideos").textContent =
    number(featured);

  $("totalViews").textContent =
    number(views);

}


/* =========================================
   CATEGORIES
========================================= */

function buildCategories(){

  const select =
    $("categoryFilter");

  const current =
    select.value;


  const categories =
    [...new Set(
      videos
        .map(v => v.category)
        .filter(Boolean)
    )]
    .sort();


  select.innerHTML =
    `<option value="">All Categories</option>`;


  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value =
      category;

    option.textContent =
      category;

    select.appendChild(option);

  });


  select.value =
    current;

}


/* =========================================
   FILTER
========================================= */

function applyFilters(){

  const query =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const status =
    $("statusFilter").value
      .toLowerCase();


  const category =
    $("categoryFilter").value;


  filteredVideos =
    videos.filter(v => {

      const matchesQuery =
        !query ||

        String(v.title || "")
          .toLowerCase()
          .includes(query) ||

        String(v.slug || "")
          .toLowerCase()
          .includes(query) ||

        String(v.creatorName || "")
          .toLowerCase()
          .includes(query) ||

        String(v.videoId || "")
          .toLowerCase()
          .includes(query);


      const matchesStatus =
        !status ||
        String(v.status || "")
          .toLowerCase()
          === status;


      const matchesCategory =
        !category ||
        String(v.category || "")
          === category;


      return (
        matchesQuery &&
        matchesStatus &&
        matchesCategory
      );

    });


  renderVideos();

}


/* =========================================
   RENDER
========================================= */

function renderVideos(){

  const tbody =
    $("videoTable");

  tbody.innerHTML = "";


  if(!filteredVideos.length){

    $("tableWrap").style.display =
      "none";

    $("empty").style.display =
      "block";

    return;

  }


  $("empty").style.display =
    "none";

  $("tableWrap").style.display =
    "block";


  filteredVideos.forEach(video => {

    const row =
      document.createElement("tr");


    const access =
      video.isFree === true
        ? `
          <span class="badge free">
            FREE
          </span>
        `
        : `
          <span class="badge plan">
            PLAN
          </span>
        `;


    const status =
      String(video.status || "")
        .toLowerCase()
        === "published"

        ? `
          <span class="badge published">
            Published
          </span>
        `

        : `
          <span class="badge draft">
            Draft
          </span>
        `;


    const featured =
      video.featured === true

        ? `
          <span class="badge featured">
            Featured
          </span>
        `

        : "—";


    row.innerHTML = `

      <td>

        <div style="display:flex;gap:10px">

          <img
            class="thumb"
            src="${
              escapeAttribute(
                video.thumbnail ||
                "https://via.placeholder.com/160x90"
              )
            }"
            alt=""
          >

          <div>

            <div class="title">
              ${escapeHTML(
                video.title ||
                "Untitled Video"
              )}
            </div>

            <div class="id">
              ID: ${escapeHTML(
                video.videoId
              )}
            </div>

            <div class="id">
              Slug: ${escapeHTML(
                video.slug || "—"
              )}
            </div>

          </div>

        </div>

      </td>


      <td>
        ${escapeHTML(
          video.creatorName ||
          "—"
        )}
      </td>


              </td>

        <td>
          ${escapeHTML(
            video.videoType ||
            "—"
          )}
        </td>

        <td>
          ${escapeHTML(
            video.duration ||
            "—"
          )}
        </td>

        <td>
          ${video.isFree === true
            ? `<span class="badge free">Free</span>`
            : `<span class="badge paid">
                ${escapeHTML(
                  video.price || "Plan"
                )}
                ${escapeHTML(
                  video.currency || ""
                )}
              </span>`
          }
        </td>

        <td>
          ${escapeHTML(
            video.status ||
            "—"
          )}
        </td>

        <td>
          ${video.featured === true
            ? `<span class="badge featured">
                Featured
              </span>`
            : "—"
          }
        </td>

        <td>
          ${video.verified === true
            ? `<span class="badge verified">
                Verified
              </span>`
            : "—"
          }
        </td>

        <td>
          ${formatNumber(
            video.views
          )}
        </td>

        <td>
          ${formatNumber(
            video.likes
          )}
        </td>

        <td>
          ${formatNumber(
            video.commentsCount
          )}
        </td>

        <td>
          ${formatNumber(
            video.shares
          )}
        </td>

        <td>
          ${escapeHTML(
            video.creatorName ||
            "—"
          )}
        </td>

        <td>
          <code>
            ${escapeHTML(
              video.videoId
            )}
          </code>
        </td>

        <td>
          ${formatDate(
            video.publishedAt
          )}
        </td>

        <td>
          ${formatDate(
            video.createdAt
          )}
        </td>

        <td>
          ${formatDate(
            video.updatedAt
          )}
        </td>

        <td>

          <div class="row-actions">

            <button
              class="action-btn view-btn"
              data-id="${escapeAttribute(
                video.videoId
              )}"
              title="View"
            >
              <i class="fa-solid fa-eye"></i>
            </button>

            <button
              class="action-btn edit-btn"
              data-id="${escapeAttribute(
                video.videoId
              )}"
              title="Edit"
            >
              <i class="fa-solid fa-pen"></i>
            </button>

            <button
              class="action-btn toggle-btn"
              data-id="${escapeAttribute(
                video.videoId
              )}"
              title="${
                String(video.status || "")
                  .toLowerCase() === "published"
                  ? "Unpublish"
                  : "Publish"
              }"
            >
              <i class="fa-solid ${
                String(video.status || "")
                  .toLowerCase() === "published"
                  ? "fa-eye-slash"
                  : "fa-upload"
              }"></i>
            </button>

            <button
              class="action-btn delete-btn danger"
              data-id="${escapeAttribute(
                video.videoId
              )}"
              title="Delete"
            >
              <i class="fa-solid fa-trash"></i>
            </button>

          </div>

        </td>

      </tr>
    `);

  });


  if(!filteredVideos.length){

    tbody.innerHTML = `
      <tr>
        <td
          colspan="18"
          class="empty"
        >
          <i class="fa-solid fa-video-slash"></i>

          <h3>
            No videos found
          </h3>

          <p>
            No video matches your current
            search or filters.
          </p>
        </td>
      </tr>
    `;

    return;

  }


  /* =========================
     VIEW VIDEO
  ========================= */

  document
    .querySelectorAll(".view-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.id;

          /*
           * IMPORTANT:
           * Firestore document ID only.
           * slug is NOT used for lookup.
           */

          location.href =
            `letsstudyvideo.html?id=${
              encodeURIComponent(id)
            }`;

        }
      );

    });


  /* =========================
     EDIT VIDEO
  ========================= */

  document
    .querySelectorAll(".edit-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.id;

          location.href =
            `admin-video-edit.html?id=${
              encodeURIComponent(id)
            }`;

        }
      );

    });


  /* =========================
     PUBLISH / UNPUBLISH
  ========================= */

  document
    .querySelectorAll(".toggle-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          const id =
            button.dataset.id;

          const video =
            videos.find(
              item =>
                item.videoId === id
            );

          if(!video){
            return;
          }

          const isPublished =
            String(
              video.status || ""
            ).toLowerCase() ===
            "published";

          const newStatus =
            isPublished
              ? "draft"
              : "published";

          const confirmed =
            confirm(
              isPublished
                ? "Unpublish this video?"
                : "Publish this video?"
            );

          if(!confirmed){
            return;
          }

          button.disabled = true;

          try{

            const updateData = {
              status:newStatus,
              updatedAt:new Date()
            };

            if(
              newStatus ===
              "published"
            ){

              updateData.publishedAt =
                new Date();

            }

            await updateDoc(
              doc(
                db,
                "videos",
                id
              ),
              updateData
            );

            video.status =
              newStatus;

            if(
              newStatus ===
              "published"
            ){

              video.publishedAt =
                new Date();

            }

            renderVideos();

            updateStats();

            showToast(
              newStatus === "published"
                ? "Video published successfully."
                : "Video unpublished successfully.",
              "success"
            );

          }catch(err){

            console.error(err);

            showToast(
              "Unable to update video status.",
              "error"
            );

            button.disabled = false;

          }

        }
      );

    });


  /* =========================
     DELETE
  ========================= */

  document
    .querySelectorAll(".delete-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          const id =
            button.dataset.id;

          const video =
            videos.find(
              item =>
                item.videoId === id
            );

          if(!video){
            return;
          }

          const confirmed =
            confirm(
              `Delete "${video.title || "this video"}"?\n\nThis will permanently delete the Firestore document.`
            );

          if(!confirmed){
            return;
          }

          button.disabled = true;

          try{

            await deleteDoc(
              doc(
                db,
                "videos",
                id
              )
            );

            videos =
              videos.filter(
                item =>
                  item.videoId !== id
              );

            renderVideos();

            updateStats();

            showToast(
              "Video deleted successfully.",
              "success"
            );

          }catch(err){

            console.error(err);

            showToast(
              "Unable to delete video.",
              "error"
            );

            button.disabled = false;

          }

        }
      );

    });

}


/* =========================
   STATS
========================= */

function updateStats(){

  const total =
    videos.length;

  const published =
    videos.filter(
      v =>
        String(
          v.status || ""
        ).toLowerCase() ===
        "published"
    ).length;

  const drafts =
    videos.filter(
      v =>
        String(
          v.status || ""
        ).toLowerCase() ===
        "draft"
    ).length;

  const featured =
    videos.filter(
      v =>
        v.featured === true
    ).length;

  const views =
    videos.reduce(
      (sum,v) =>
        sum +
        Number(v.views || 0),
      0
    );


  $("totalVideos").textContent =
    formatNumber(total);

  $("publishedVideos").textContent =
    formatNumber(published);

  $("draftVideos").textContent =
    formatNumber(drafts);

  $("featuredVideos").textContent =
    formatNumber(featured);

  $("totalViews").textContent =
    formatNumber(views);

}


/* =========================
   SEARCH + FILTER
========================= */

$("searchInput")
  ?.addEventListener(
    "input",
    renderVideos
  );


$("statusFilter")
  ?.addEventListener(
    "change",
    renderVideos
  );


$("categoryFilter")
  ?.addEventListener(
    "change",
    renderVideos
  );


$("clearFilters")
  ?.addEventListener(
    "click",
    () => {

      $("searchInput").value =
        "";

      $("statusFilter").value =
        "";

      $("categoryFilter").value =
        "";

      renderVideos();

    }
  );


/* =========================
   REFRESH
========================= */

$("refreshBtn")
  ?.addEventListener(
    "click",
    loadVideos
  );


/* =========================
   ADD VIDEO
========================= */

$("addVideoBtn")
  ?.addEventListener(
    "click",
    () => {

      location.href =
        "admin-video-add.html";

    }
  );


/* =========================
   NAVIGATION
========================= */

$("homeBtn")
  ?.addEventListener(
    "click",
    () => {

      location.href =
        "admin.html";

    }
  );


/* =========================
   TOAST
========================= */

function showToast(
  message,
  type="info"
){

  const toast =
    document.createElement("div");

  toast.className =
    `toast ${type}`;

  toast.innerHTML = `
    <i class="fa-solid ${
      type === "success"
        ? "fa-circle-check"
        : type === "error"
          ? "fa-circle-xmark"
          : "fa-circle-info"
    }"></i>

    <span>
      ${escapeHTML(message)}
    </span>
  `;

  document.body.appendChild(
    toast
  );

  setTimeout(
    () => toast.remove(),
    3500
  );

}


/* =========================
   START
========================= */

loadVideos();

</script>
