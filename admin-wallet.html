<script type="module">


import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
 getAuth,
 onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
 getFirestore,
 collection,
 doc,
 getDoc,
 getDocs,
 runTransaction,
 updateDoc,
 serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE
========================================= */

const firebaseConfig = {

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0rodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

 measurementId:
 "G-85B7V5H5J0"

};


const app =
 initializeApp(firebaseConfig);


const auth =
 getAuth(app);


const db =
 getFirestore(app);


/* =========================================
 STATE
========================================= */

let transactions = [];

let selected = null;

let admin = null;

let loading = false;


/* =========================================
 ADMIN CHECK
========================================= */

onAuthStateChanged(
 auth,
 async user => {

  if(!user){

   admin = null;

   document.getElementById(
    "transactionList"
   ).innerHTML = `

    <tr>

     <td colspan="7">

      <div class="empty">

       Please login as administrator.

      </div>

     </td>

    </tr>

   `;

   return;

  }


  try{

   const adminRef =
    doc(
     db,
     "admins",
     user.uid
    );


   const adminSnap =
    await getDoc(adminRef);


   if(!adminSnap.exists()){

    admin = null;

    document.getElementById(
     "transactionList"
    ).innerHTML = `

     <tr>

      <td colspan="7">

       <div class="empty">

        Access denied. Administrator account required.

       </div>

      </td>

     </tr>

    `;

    return;

   }


   admin = {

    uid:user.uid,

    ...adminSnap.data()

   };


   await loadWallet();


  }catch(error){

   console.error(
    "Admin check error:",
    error
   );

   toast(
    "Unable to verify administrator."
   );

  }

 });


/* =========================================
 LOAD WALLET
========================================= */

async function loadWallet(){

 if(!admin)return;

 if(loading)return;

 loading = true;


 try{


  /* =========================
     WALLET TRANSACTIONS
  ========================= */

  const walletSnap =
   await getDocs(
    collection(
     db,
     "walletTransactions"
    )
   );


  const walletTransactions =
   walletSnap.docs.map(
    d => ({

     id:d.id,

     source:"walletTransactions",

     ...d.data()

    })
   );


  /* =========================
     WITHDRAWAL REQUESTS
  ========================= */

  const withdrawalSnap =
   await getDocs(
    collection(
     db,
     "withdrawals"
    )
   );


  const withdrawalTransactions =
   withdrawalSnap.docs.map(
    d => {

     const x =
      d.data();


     return {

      id:d.id,

      source:"withdrawals",

      userId:
       x.userId || "",

      email:
       x.userEmail ||
       x.email ||
       "",

      type:
       "withdrawal",

      amount:
       Number(
        x.grossAmount ??
        x.amount ??
        0
       ),

      netAmount:
       Number(
        x.netAmount ??
        0
       ),

      commissionAmount:
       Number(
        x.commissionAmount ??
        0
       ),

      method:
       x.paymentMethod ||
       x.method ||
       "Wallet",

      accountName:
       x.accountName ||
       "",

      accountNumber:
       x.accountNumber ||
       "",

      status:
       x.status ||
       "pending",

      reference:
       x.transactionReference ||
       x.reference ||
       d.id,

      description:
       x.note ||
       x.description ||
       "Withdrawal request",

      requestedAt:
       x.requestedAt ||

       null,

      createdAt:
       x.createdAt ||

       null,

      ...x

     };

    }

   );


  transactions = [

   ...walletTransactions,

   ...withdrawalTransactions

  ];


  updateStats();

  render();


 }catch(error){

  console.error(
   "Wallet load error:",
   error
  );

  toast(
   "Unable to load wallet."
  );


 }finally{

  loading = false;

 }

}


/* =========================================
 STATS
========================================= */

async function updateStats(){

 try{


  const users =
   await getDocs(
    collection(
     db,
     "users"
    )
   );


  let balance = 0;


  users.forEach(
   d => {

    const x =
     d.data();


    balance +=
     Number(
      x.walletBalance || 0
     );

   }
  );


  const deposits =
   transactions

    .filter(
     x =>
      x.type === "deposit" &&
      x.status === "completed"
    )

    .reduce(
     (total,x) =>
      total +
      Number(
       x.amount || 0
      ),
     0
    );


  const withdrawals =
   transactions

    .filter(
     x =>
      x.type === "withdrawal" &&
      x.status === "completed"
    )

    .reduce(
     (total,x) =>
      total +
      Number(
       x.amount || 0
      ),
     0
    );


  const pending =
   transactions

    .filter(
     x =>
      x.type === "withdrawal" &&
      x.status === "pending"
    )

    .reduce(
     (total,x) =>
      total +
      Number(
       x.amount || 0
      ),
     0
    );


  document.getElementById(
   "totalBalance"
  ).textContent =
   money(balance);


  document.getElementById(
   "totalDeposits"
  ).textContent =
   money(deposits);


  document.getElementById(
   "totalWithdrawals"
  ).textContent =
   money(withdrawals);


  document.getElementById(
   "pendingWithdrawals"
  ).textContent =
   money(pending);


 }catch(error){

  console.error(
   "Stats error:",
   error
  );

 }

}


/* =========================================
 RENDER
========================================= */

window.render = function(){

 const search =
  document.getElementById(
   "search"
  )
  .value
  .toLowerCase()
  .trim();


 const type =
  document.getElementById(
   "typeFilter"
  ).value;


 const status =
  document.getElementById(
   "statusFilter"
  ).value;


 const data =
  transactions.filter(
   x => {

    const text =

     `${x.id}
      ${x.userId || ""}
      ${x.email || ""}
      ${x.reference || ""}
      ${x.accountNumber || ""}`

     .toLowerCase();


    return (

     text.includes(search)

     &&

     (
      type === "all" ||
      x.type === type
     )

     &&

     (
      status === "all" ||
      x.status === status
     )

    );

   }
  );


 const list =
  document.getElementById(
   "transactionList"
  );


 if(!data.length){

  list.innerHTML = `

   <tr>

    <td colspan="7">

     <div class="empty">

      No wallet transactions found.

     </div>

    </td>

   </tr>

  `;

  return;

 }


 list.innerHTML =
  data.map(
   x => `

    <tr>

     <td>

      <strong>

       ${esc(
        x.reference ||
        x.id
       )}

      </strong>

     </td>


     <td>

      ${esc(
       x.email ||
       x.userId ||
       "-"
      )}

     </td>


     <td
      class="${
       x.type === "deposit"
        ? "deposit"
        : "withdrawal"
      }">

      ${
       x.type === "deposit"
        ? "↑ Deposit"
        : "↓ Withdrawal"
      }

     </td>


     <td>

      <strong>

       ${money(
        x.amount
       )}

      </strong>

     </td>


     <td>

      ${esc(
       x.method ||
       "Wallet"
      )}

     </td>


     <td>

      <span
       class="badge ${
        esc(
         x.status ||
         "pending"
        )
       }">

       ${esc(
        x.status ||
        "pending"
       )}

      </span>

     </td>


     <td>

      <button
       class="back"
       onclick="viewTransaction('${x.id}')">

       View

      </button>

     </td>

    </tr>

   `
  )
  .join("");

};


/* =========================================
 VIEW TRANSACTION
========================================= */

window.viewTransaction =
function(id){

 selected =
  transactions.find(
   x =>
    x.id === id
  );


 if(!selected)return;


 const isWithdrawal =
  selected.type ===
  "withdrawal";


 document.getElementById(
  "details"
 ).innerHTML = `


  <div class="info">

   <small>
    Transaction ID
   </small>

   <strong>
    ${esc(selected.id)}
   </strong>

  </div>


  <div class="info">

   <small>
    Reference
   </small>

   <strong>
    ${esc(
     selected.reference ||
     "-"
    )}
   </strong>

  </div>


  <div class="info">

   <small>
    User
   </small>

   <strong>
    ${esc(
     selected.email ||
     selected.userId ||
     "-"
    )}
   </strong>

  </div>


  <div class="info">

   <small>
    Type
   </small>

   <strong>
    ${esc(
     selected.type ||
     "-"
    )}
   </strong>

  </div>


  <div class="info">

   <small>
    Gross Amount
   </small>

   <strong>
    ${money(
     selected.amount
    )}
   </strong>

  </div>


  ${
   isWithdrawal
    ? `

     <div class="info">

      <small>
       Platform Commission
      </small>

      <strong>
       ${money(
        selected.commissionAmount
       )}
      </strong>

     </div>


     <div class="info">

      <small>
       User Receives
      </small>

      <strong>
       ${money(
        selected.netAmount
       )}
      </strong>

     </div>


     <div class="info">

      <small>
       Account Name
      </small>

      <strong>
       ${esc(
        selected.accountName ||
        "-"
       )}
      </strong>

     </div>


     <div class="info">

      <small>
       Account Number
      </small>

      <strong>
       ${esc(
        selected.accountNumber ||
        "-"
       )}
      </strong>

     </div>

    `
    : ""
  }


  <div class="info">

   <small>
    Method
   </small>

   <strong>
    ${esc(
     selected.method ||
     "-"
    )}
   </strong>

  </div>


  <div class="info">

   <small>
    Status
   </small>

   <strong>
    ${esc(
     selected.status ||
     "-"
    )}
   </strong>

  </div>


  <div class="info">

   <small>
    Description
   </small>

   <strong>
    ${esc(
     selected.description ||
     "-"
    )}
   </strong>

  </div>


 `;


 const pending =
  selected.status ===
  "pending";


 document.getElementById(
  "approveBtn"
 ).style.display =
  pending
   ? "inline-block"
   : "none";


 document.getElementById(
  "rejectBtn"
 ).style.display =
  pending
   ? "inline-block"
   : "none";


 document.getElementById(
  "modal"
 ).classList.add("show");

};


/* =========================================
 APPROVE / REJECT
========================================= */

window.changeTransactionStatus =
async function(status){

 if(!selected)return;


 if(!admin){

  toast(
   "Administrator access required."
  );

  return;

 }


 if(
  selected.status !==
  "pending"
 ){

  toast(
   "Transaction is not pending."
  );

  return;

 }


 const actionText =
  status === "completed"
   ? "approve"
   : "reject";


 if(
  !confirm(
   `Are you sure you want to ${actionText} this transaction?`
  )
 ){

  return;

 }


 try{


  if(
   selected.type ===
   "withdrawal"
  ){

   await processWithdrawal(
    selected,
    status
   );


  }else{


   await updateDoc(

    doc(
     db,
     "walletTransactions",
     selected.id
    ),

    {

     status:

      status,

     processedBy:
      admin.uid,

     processedAt:
      serverTimestamp(),

     updatedAt:
      serverTimestamp()

    }

   );

  }


  toast(
   status === "completed"
    ? "Transaction approved."
    : "Transaction rejected."
  );


  closeModal();

  await loadWallet();


 }catch(error){

  console.error(
   "Transaction status error:",
   error
  );


  toast(
   error?.message ||
   "Unable to process transaction."
  );

 }

};


/* =========================================
 PROCESS WITHDRAWAL
========================================= */

async function processWithdrawal(
 tx,
 status
){

 const withdrawalRef =
  doc(
   db,
   "withdrawals",
   tx.id
  );


 /*
  REJECT
  No wallet deduction.
 */

 if(
  status === "rejected"
 ){

  await updateDoc(

   withdrawalRef,

   {

    status:"rejected",

    processedBy:
     admin.uid,

    processedAt:
     serverTimestamp(),

    updatedAt:
     serverTimestamp(),

    rejectionReason:
     "Rejected by administrator."

   }

  );

  return;

 }


 /*
  APPROVE
  Deduct gross withdrawal amount
  from user's wallet.
 */

 await runTransaction(

  db,

  async transaction => {

   const userRef =
    doc(
     db,
     "users",
     tx.userId
    );


   const userSnap =
    await transaction.get(
     userRef
    );


   if(
    !userSnap.exists()
   ){

    throw new Error(
     "User account not found."
    );

   }


   const user =
    userSnap.data();


   const balance =
    Number(
     user.walletBalance ||
     0
    );


   const amount =
    Number(
     tx.amount ||
     tx.grossAmount ||
     0
    );


   if(
    amount <= 0
   ){

    throw new Error(
     "Invalid withdrawal amount."
    );

   }


   if(
    balance < amount
   ){

    throw new Error(
     `Insufficient wallet balance. Available: ${money(balance)}`
    );

   }


   transaction.update(

    userRef,

    {

     walletBalance:
      balance -
      amount

    }

   );


   transaction.update(

    withdrawalRef,

    {

     status:
      "completed",

     processedBy:
      admin.uid,

     processedAt:
      serverTimestamp(),

     updatedAt:
      serverTimestamp(),

     adminNote:
      "Withdrawal approved and wallet balance deducted."

    }

   );

  }

 );

}


/* =========================================
 ADD BALANCE
========================================= */

window.addBalance =
async function(){

 if(!admin){

  toast(
   "Administrator access required."
  );

  return;

 }


 const userId =
  document.getElementById(
   "depositUser"
  )
  .value
  .trim();


 const amount =
  Number(
   document.getElementById(
    "depositAmount"
   ).value
  );


 const description =
  document.getElementById(
   "depositDescription"
  )
  .value
  .trim();


 if(
  !userId ||
  !Number.isFinite(amount) ||
  amount <= 0
 ){

  toast(
   "Enter a valid user and amount."
  );

  return;

 }


 const button =
  document.getElementById(
   "addBalanceBtn"
  );


 try{

  button.disabled = true;

  button.textContent =
   "Adding...";


  await runTransaction(

   db,

   async transaction => {

    const userRef =
     doc(
      db,
      "users",
      userId
     );


    const userSnap =
     await transaction.get(
      userRef
     );


    if(
     !userSnap.exists()
    ){

     throw new Error(
      "Student not found."
     );

    }


    const user =
     userSnap.data();


    const balance =
     Number(
      user.walletBalance ||
      0
     );


    transaction.update(

     userRef,

     {

      walletBalance:
       balance +
       amount

     }

    );


    const txRef =
     doc(
      collection(
       db,
       "walletTransactions"
      )
     );


    transaction.set(

     txRef,

     {

      userId:
       userId,

      email:
       user.email ||
       "",

      type:
       "deposit",

      amount:
       amount,

      method:
       "admin",

      status:
       "completed",

      reference:
       "ADMIN-" +
       Date.now(),

      description:
       description ||
       "Admin wallet deposit",

      createdBy:
       admin.uid,

      createdAt:
       serverTimestamp(),

      updatedAt:
       serverTimestamp()

     }

    );

   }

  );


  toast(
   "Balance added successfully."
  );


  document.getElementById(
   "depositUser"
  ).value = "";


  document.getElementById(
   "depositAmount"
  ).value = "";


  document.getElementById(
   "depositDescription"
  ).value = "";


  closeDeposit();


  await loadWallet();


 }catch(error){

  console.error(
   "Add balance error:",
   error
  );


  toast(
   error?.message ||
   "Unable to add balance."
  );


 }finally{

  button.disabled = false;

  button.textContent =
   "Add Balance";

 }

};


/* =========================================
 MODALS
========================================= */

window.openDeposit =
function(){

 document.getElementById(
  "depositModal"
 ).classList.add("show");

};


window.closeDeposit =
function(){

 document.getElementById(
  "depositModal"
 ).classList.remove("show");

};


window.closeModal =
function(){

 document.getElementById(
  "modal"
 ).classList.remove("show");

 selected = null;

};


/* =========================================
 CLOSE MODALS OUTSIDE
========================================= */

document.getElementById(
 "modal"
).addEventListener(
 "click",
 event => {

  if(
   event.target.id ===
   "modal"
  ){

   closeModal();

  }

 }
);


document.getElementById(
 "depositModal"
).addEventListener(
 "click",
 event => {

  if(
   event.target.id ===
   "depositModal"
  ){

   closeDeposit();

  }

 }
);


/* =========================================
 HELPERS
========================================= */

function money(value){

 return "TZS " +
  Number(
   value || 0
  )
  .toLocaleString();

}


function esc(value){

 return String(
  value ?? ""
 )

 .replace(
  /&/g,
  "&amp;"
 )

 .replace(
  /</g,
  "&lt;"
 )

 .replace(
  />/g,
  "&gt;"
 )

 .replace(
  /"/g,
  "&quot;"
 )

 .replace(
  /'/g,
  "&#039;"
 );

}


function toast(text){

 const el =
  document.getElementById(
   "toast"
  );


 el.textContent =
  text;


 el.classList.add(
  "show"
 );


 clearTimeout(
  window.toastTimer
 );


 window.toastTimer =
  setTimeout(
   () => {

    el.classList.remove(
     "show"
    );

   },
   3500
  );

}
