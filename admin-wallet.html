<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Wallet | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:9px;padding:9px 12px;cursor:pointer}
header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
header h1{flex:1;font-size:18px;margin:0}
main{max-width:1250px;margin:auto;padding:18px}
.back{background:#eef2ff;color:#1d4ed8}
.primary{background:#2563eb;color:#fff}
.success{background:#dcfce7;color:#15803d}
.danger{background:#fee2e2;color:#b91c1c}
.warning{background:#fef3c7;color:#a16207}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px}
.stat span{font-size:11px;color:#64748b}
.stat b{display:block;font-size:21px;margin-top:5px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{max-width:420px}
input,select{width:100%;padding:10px;border:1px solid #dbe1e8;border-radius:9px;background:#fff;outline:none}
.table{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4;white-space:nowrap}
th{font-size:10px;color:#64748b}
.badge{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:bold}
.completed{background:#dcfce7;color:#15803d}
.pending{background:#fef3c7;color:#a16207}
.failed,.rejected{background:#fee2e2;color:#b91c1c}
.deposit{color:#15803d}
.withdrawal{color:#dc2626}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:50}
.modal.show{display:flex}
.box{background:#fff;width:100%;max-width:650px;max-height:90vh;overflow:auto;border-radius:16px;padding:20px}
.head{display:flex;align-items:center;margin-bottom:15px}
.head h2{flex:1;margin:0;font-size:18px}
.info{padding:11px;background:#f8fafc;border-radius:9px;margin-bottom:8px;font-size:12px}
.info small{display:block;color:#64748b;font-size:10px;margin-bottom:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.empty{text-align:center;padding:35px;color:#64748b}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:100;font-size:12px}
.toast.show{display:block}
@media(max-width:800px){
.stats{grid-template-columns:1fr 1fr}
}
</style></head><body><header><button class="back"
onclick="location.href='admin-dashboard.html'">
←
</button>

<h1>💰 Wallet Management</h1><button class="primary"
onclick="openDeposit()">

+ Add Balance
  </button>

</header><main><section class="stats"><div class="stat">
<span>Total Wallet Balance</span>
<b id="totalBalance">TZS 0</b>
</div><div class="stat">
<span>Pending Withdrawals</span>
<b id="pendingWithdrawals">TZS 0</b>
</div><div class="stat">
<span>Total Deposits</span>
<b id="totalDeposits">TZS 0</b>
</div><div class="stat">
<span>Total Withdrawals</span>
<b id="totalWithdrawals">TZS 0</b>
</div></section><section class="card"><div class="toolbar"><input
id="search"
placeholder="Search user, email or transaction..."
oninput="render()">

<select id="typeFilter"
onchange="render()">

<option value="all">All Transactions</option>
<option value="deposit">Deposits</option>
<option value="withdrawal">Withdrawals</option></select><select id="statusFilter"
onchange="render()">

<option value="all">All Status</option>
<option value="completed">Completed</option>
<option value="pending">Pending</option>
<option value="rejected">Rejected</option>
<option value="failed">Failed</option></select></div><div class="table"><table><thead><tr>
<th>Transaction</th>
<th>User</th>
<th>Type</th>
<th>Amount</th>
<th>Method</th>
<th>Status</th>
<th>Action</th>
</tr></thead><tbody id="transactionList"></tbody></table></div></section></main><!-- TRANSACTION MODAL --><div id="modal" class="modal"><div class="box"><div class="head"><h2>Transaction Details</h2><button onclick="closeModal()">✕</button>

</div><div id="details"></div><div class="actions"><button
id="approveBtn"
class="success"
onclick="changeTransactionStatus('completed')">

✓ Approve

</button><button
id="rejectBtn"
class="danger"
onclick="changeTransactionStatus('rejected')">

✕ Reject

</button><button
class="back"
onclick="closeModal()">

Close

</button></div></div></div><!-- ADD BALANCE --><div id="depositModal" class="modal"><div class="box"><div class="head"><h2>Add Wallet Balance</h2><button onclick="closeDeposit()">✕</button>

</div><label>Student UID</label>

<input
id="depositUser"
placeholder="Firebase User UID">

<br><br>

<label>Amount (TZS)</label>

<input
id="depositAmount"
type="number"
min="1"
placeholder="10000">

<br><br>

<label>Description</label>

<input
id="depositDescription"
placeholder="Admin wallet adjustment">

<div class="actions"><button
class="primary"
onclick="addBalance()">

Add Balance

</button></div></div></div><div id="toast" class="toast"></div><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
doc,
getDoc,
getDocs,
runTransaction,
addDoc,
updateDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE
========================================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let transactions=[];
let selected=null;
let admin=null;


/* =========================================
 ADMIN CHECK
========================================= */

onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);

/* =========================================
 LOAD
========================================= */

async function loadWallet(){

try{

const snap=await getDocs(
collection(db,"walletTransactions")
);

transactions=snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

updateStats();
render();

}catch(error){

console.error(error);
toast("Unable to load wallet.");

}

}


/* =========================================
 STATS
========================================= */

async function updateStats(){

try{

const users=
await getDocs(
collection(db,"users")
);

let balance=0;

users.forEach(d=>{

const x=d.data();

balance+=Number(
x.walletBalance||0
);

});


const deposits=
transactions.filter(
x=>x.type==="deposit" &&
x.status==="completed"
)
.reduce(
(a,x)=>a+Number(x.amount||0),
0
);

const withdrawals=
transactions.filter(
x=>x.type==="withdrawal" &&
x.status==="completed"
)
.reduce(
(a,x)=>a+Number(x.amount||0),
0
);

const pending=
transactions.filter(
x=>x.type==="withdrawal" &&
x.status==="pending"
)
.reduce(
(a,x)=>a+Number(x.amount||0),
0
);


document.getElementById(
"totalBalance"
).textContent=
money(balance);

document.getElementById(
"totalDeposits"
).textContent=
money(deposits);

document.getElementById(
"totalWithdrawals"
).textContent=
money(withdrawals);

document.getElementById(
"pendingWithdrawals"
).textContent=
money(pending);

}catch(error){

console.error(error);

}

}


/* =========================================
 RENDER
========================================= */

window.render=function(){

const search=
document.getElementById("search")
.value.toLowerCase().trim();

const type=
document.getElementById("typeFilter").value;

const status=
document.getElementById("statusFilter").value;


const data=transactions.filter(x=>{

const text=
`${x.id}
${x.userId||""}
${x.email||""}
${x.reference||""}`
.toLowerCase();

return(
text.includes(search) &&
(type==="all"||x.type===type) &&
(status==="all"||x.status===status)
);

});


const list=
document.getElementById(
"transactionList"
);


if(!data.length){

list.innerHTML=`

<tr>
<td colspan="7">

<div class="empty">
No wallet transactions found.
</div>

</td>
</tr>

`;

return;

}


list.innerHTML=data.map(x=>`

<tr>

<td>
<strong>
${esc(
x.reference||
x.id
)}
</strong>
</td>

<td>
${esc(
x.email||
x.userId||
"-"
)}
</td>

<td class="${x.type==="deposit"
?"deposit":"withdrawal"}">

${x.type==="deposit"
?"↑ Deposit"
:"↓ Withdrawal"}

</td>

<td>
<strong>
${money(x.amount)}
</strong>
</td>

<td>
${esc(x.method||"Wallet")}
</td>

<td>

<span class="badge ${
x.status||"pending"
}">

${esc(
x.status||"pending"
)}

</span>

</td>

<td>

<button
class="back"
onclick="viewTransaction('${x.id}')">

View

</button>

</td>

</tr>

`).join("");

};


/* =========================================
 VIEW
========================================= */

window.viewTransaction=function(id){

selected=
transactions.find(
x=>x.id===id
);

if(!selected)return;

document.getElementById(
"details"
).innerHTML=`

<div class="info">
<small>Transaction ID</small>
<strong>${esc(selected.id)}</strong>
</div>

<div class="info">
<small>Reference</small>
<strong>${esc(selected.reference||"-")}</strong>
</div>

<div class="info">
<small>User</small>
<strong>${esc(selected.email||selected.userId||"-")}</strong>
</div>

<div class="info">
<small>Type</small>
<strong>${esc(selected.type||"-")}</strong>
</div>

<div class="info">
<small>Amount</small>
<strong>${money(selected.amount)}</strong>
</div>

<div class="info">
<small>Method</small>
<strong>${esc(selected.method||"-")}</strong>
</div>

<div class="info">
<small>Status</small>
<strong>${esc(selected.status||"-")}</strong>
</div>

<div class="info">
<small>Description</small>
<strong>${esc(selected.description||"-")}</strong>
</div>

`;

const pending=
selected.status==="pending";

document.getElementById(
"approveBtn"
).style.display=
pending?"inline-block":"none";

document.getElementById(
"rejectBtn"
).style.display=
pending?"inline-block":"none";

document.getElementById(
"modal"
).classList.add("show");

};


/* =========================================
 APPROVE / REJECT
========================================= */

window.changeTransactionStatus=
async function(status){

if(!selected)return;

if(
selected.status!=="pending"
){

toast("Transaction is not pending.");
return;

}

try{

if(
selected.type==="withdrawal" &&
status==="completed"
){

await processWithdrawal(selected);

}else{

await updateDoc(
doc(
db,
"walletTransactions",
selected.id
),
{

status,

processedBy:admin.uid,

processedAt:
serverTimestamp()

}
);

}

toast(
status==="completed"
?"Transaction approved."
:"Transaction rejected."
);

closeModal();

await loadWallet();

}catch(error){

console.error(error);

toast(
"Unable to process transaction."
);

}

};


/* =========================================
 WITHDRAWAL
========================================= */

async function processWithdrawal(tx){

await runTransaction(
db,
async transaction=>{

const userRef=
doc(db,"users",tx.userId);

const userSnap=
await transaction.get(userRef);

if(!userSnap.exists())
throw new Error(
"User not found"
);

const user=
userSnap.data();

const balance=
Number(
user.walletBalance||0
);

const amount=
Number(tx.amount||0);

if(balance<amount)
throw new Error(
"Insufficient wallet balance"
);

transaction.update(
userRef,
{
walletBalance:
balance-amount
}
);

transaction.update(
doc(
db,
"walletTransactions",
tx.id
),
{

status:"completed",

processedBy:admin.uid,

processedAt:
serverTimestamp()

}
);

});

}


/* =========================================
 ADD BALANCE
========================================= */

window.addBalance=async function(){

const userId=
document.getElementById(
"depositUser"
).value.trim();

const amount=
Number(
document.getElementById(
"depositAmount"
).value
);

const description=
document.getElementById(
"depositDescription"
).value.trim();


if(!userId||amount<=0){

toast(
"Enter valid user and amount."
);

return;

}


try{

await runTransaction(
db,
async transaction=>{

const userRef=
doc(db,"users",userId);

const userSnap=
await transaction.get(userRef);

if(!userSnap.exists())
throw new Error(
"Student not found"
);

const user=
userSnap.data();

const balance=
Number(
user.walletBalance||0
);

transaction.update(
userRef,
{
walletBalance:
balance+amount
}
);

const txRef=
doc(
collection(db,"walletTransactions")
);

transaction.set(
txRef,
{

userId,

email:
user.email||"",

type:"deposit",

amount,

method:"admin",

status:"completed",

reference:
"ADMIN-"+Date.now(),

description:
description||
"Admin wallet deposit",

createdBy:
admin.uid,

createdAt:
serverTimestamp()

}
);

});


toast("Balance added.");

closeDeposit();

await loadWallet();

}catch(error){

console.error(error);

toast(
error.message||
"Unable to add balance."
);

}

};


/* =========================================
 MODALS
========================================= */

window.openDeposit=function(){

document.getElementById(
"depositModal"
).classList.add("show");

};

window.closeDeposit=function(){

document.getElementById(
"depositModal"
).classList.remove("show");

};

window.closeModal=function(){

document.getElementById(
"modal"
).classList.remove("show");

selected=null;

};


/* =========================================
 HELPERS
========================================= */

function money(value){

return "TZS "+
Number(value||0)
.toLocaleString();

}

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function toast(text){

const el=
document.getElementById("toast");

el.textContent=text;
el.classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
