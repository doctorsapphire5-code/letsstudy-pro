<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin Websites | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,input,textarea,select{font:inherit}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:250px;
  height:100vh;
  background:#111827;
  color:white;
  padding:22px 15px;
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:800;
  padding:0 12px 25px;
}

.logo span{color:#60a5fa}

.nav a{
  display:block;
  color:#cbd5e1;
  text-decoration:none;
  padding:13px 14px;
  border-radius:10px;
  margin-bottom:5px;
}

.nav a:hover,
.nav a.active{
  background:#2563eb;
  color:white;
}

.main{
  margin-left:250px;
  padding:25px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.topbar h1{
  font-size:28px;
}

.topbar p{
  color:#64748b;
  margin-top:5px;
}

.primary{
  border:0;
  background:#2563eb;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

.primary:hover{background:#1d4ed8}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:20px;
}

.stat small{
  color:#64748b;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.toolbar{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:15px;
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.toolbar input,
.toolbar select{
  border:1px solid #dbe1ea;
  border-radius:9px;
  padding:11px;
  outline:none;
}

.toolbar input{
  flex:1;
}

.table-box{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:15px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,td{
  padding:14px;
  border-bottom:1px solid #edf0f4;
  text-align:left;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:13px;
}

.website{
  display:flex;
  align-items:center;
  gap:12px;
}

.website img{
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:10px;
  background:#e5e7eb;
}

.website-title{
  font-weight:700;
}

.website-domain{
  font-size:12px;
  color:#64748b;
  margin-top:3px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.pending{background:#fef3c7;color:#92400e}
.approved{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.action{
  border:0;
  border-radius:7px;
  padding:7px 10px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}

.view{background:#e0f2fe;color:#0369a1}
.edit{background:#ede9fe;color:#6d28d9}
.approve{background:#dcfce7;color:#166534}
.reject{background:#fee2e2;color:#991b1b}
.delete{background:#111827;color:white}

.empty{
  text-align:center;
  padding:45px;
  color:#64748b;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:2000;
}

.modal.show{display:flex}

.modal-box{
  background:white;
  width:min(850px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:18px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#f1f5f9;
  width:38px;
  height:38px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{grid-column:1/-1}

.field label{
  font-size:13px;
  font-weight:700;
  color:#475569;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #dbe1ea;
  border-radius:9px;
  padding:11px;
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.cancel{
  border:1px solid #dbe1ea;
  background:white;
  padding:11px 17px;
  border-radius:9px;
  cursor:pointer;
}

.mobile-menu{
  display:none;
}

@media(max-width:900px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    padding:18px;
  }

  .mobile-menu{
    display:block;
    border:0;
    background:#111827;
    color:white;
    padding:10px 13px;
    border-radius:8px;
    margin-bottom:15px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

}

@media(max-width:600px){

  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .toolbar{
    flex-direction:column;
  }

}
</style>
</head>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  addDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0rodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const websitesRef =
  collection(
    db,
    "indexedWebsites"
  );


let websites = [];


/* =========================
   ELEMENTS
========================= */

const table =
  document.getElementById(
    "websiteTable"
  );

const emptyState =
  document.getElementById(
    "emptyState"
  );

const modal =
  document.getElementById(
    "websiteModal"
  );

const form =
  document.getElementById(
    "websiteForm"
  );

const sidebar =
  document.getElementById(
    "sidebar"
  );


/* =========================
   HELPERS
========================= */

function value(id){

  const element =
    document.getElementById(id);

  return element
    ? element.value.trim()
    : "";

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function capitalize(value){

  value =
    String(value || "");

  return value.charAt(0)
    .toUpperCase()
    + value.slice(1);

}


function formatDate(value){

  if(!value)
    return "—";


  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value
        .toDate()
        .toLocaleDateString();

    }


    const date =
      new Date(value);


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "—";

    }


    return date.toLocaleDateString();

  }catch{

    return "—";

  }

}


function getStatus(site){

  return String(
    site.status || "pending"
  )
    .toLowerCase()
    .trim();

}


/* =========================
   LOAD WEBSITES
========================= */

async function loadWebsites(){

  try{

    const snapshot =
      await getDocs(
        websitesRef
      );


    websites = [];


    snapshot.forEach(item => {

      websites.push({

        id: item.id,

        ...item.data()

      });

    });


    updateStats();

    createCategoryFilter();

    render();


  }catch(error){

    console.error(
      "Website loading error:",
      error
    );


    table.innerHTML = "";


    emptyState.style.display =
      "block";


    emptyState.innerHTML = `

      <strong>
        Unable to load websites.
      </strong>

      <br>

      <small>
        ${escapeHTML(
          error?.message ||
          "Firestore request failed."
        )}
      </small>

    `;

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  document.getElementById(
    "totalCount"
  ).textContent =
    websites.length;


  document.getElementById(
    "pendingCount"
  ).textContent =
    websites.filter(
      site =>
        getStatus(site) ===
        "pending"
    ).length;


  document.getElementById(
    "approvedCount"
  ).textContent =
    websites.filter(
      site =>
        getStatus(site) ===
        "approved"
    ).length;


  document.getElementById(
    "rejectedCount"
  ).textContent =
    websites.filter(
      site =>
        getStatus(site) ===
        "rejected"
    ).length;

}


/* =========================
   CATEGORY FILTER
========================= */

function createCategoryFilter(){

  const select =
    document.getElementById(
      "categoryFilter"
    );


  const current =
    select.value;


  const categories =
    [
      ...new Set(
        websites
          .map(
            site =>
              String(
                site.category || ""
              ).trim()
          )
          .filter(Boolean)
      )
    ].sort(
      (a,b) =>
        a.localeCompare(b)
    );


  select.innerHTML = `

    <option value="all">
      All Categories
    </option>

  `;


  categories.forEach(category => {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      category;


    option.textContent =
      category;


    select.appendChild(
      option
    );

  });


  if(
    categories.includes(current)
  ){

    select.value =
      current;

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .toLowerCase()
      .trim();


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const category =
    document.getElementById(
      "categoryFilter"
    ).value;


  const filtered =
    websites.filter(site => {

      const text = [

        site.title,
        site.description,
        site.url,
        site.domain,
        site.keywords,
        site.category,
        site.ownerId

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      const siteStatus =
        getStatus(site);


      return (

        (
          !search ||
          text.includes(search)
        )

        &&

        (
          status === "all" ||
          siteStatus === status
        )

        &&

        (
          category === "all" ||
          site.category === category
        )

      );

    });


  table.innerHTML = "";


  emptyState.style.display =
    filtered.length
      ? "none"
      : "block";


  filtered.forEach(site => {

    const tr =
      document.createElement("tr");


    const statusValue =
      getStatus(site);


    const image =
      site.image ||
      site.imageUrl ||
      "https://via.placeholder.com/80";


    const indexed =
      formatDate(
        site.indexedAt
      );


    const websiteUrl =
      site.url || "#";


    tr.innerHTML = `

      <td>

        <div class="website">

          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(
              site.title ||
              "Website"
            )}"
          >

          <div>

            <div class="website-title">

              ${escapeHTML(
                site.title ||
                "Untitled Website"
              )}

            </div>

            <div class="website-domain">

              ${escapeHTML(
                site.domain ||
                site.url ||
                ""
              )}

            </div>

          </div>

        </div>

      </td>


      <td>

        ${escapeHTML(
          site.category ||
          "General"
        )}

      </td>


      <td>

        <span
          class="badge ${escapeHTML(
            statusValue
          )}"
        >

          ${escapeHTML(
            capitalize(
              statusValue
            )
          )}

        </span>

      </td>


      <td>

        ${escapeHTML(
          site.ownerId ||
          "—"
        )}

      </td>


      <td>

        ${indexed}

      </td>


      <td>

        <div class="actions">

          <button
            class="action view"
            data-action="view"
            data-id="${escapeHTML(
              site.id
            )}"
          >
            View
          </button>


          <button
            class="action edit"
            data-action="edit"
            data-id="${escapeHTML(
              site.id
            )}"
          >
            Edit
          </button>


          ${
            statusValue !==
            "approved"

              ? `

                <button
  class="action approve"
  data-action="approve"
  data-id="${escapeHTML(
    site.id
  )}"
>
  Approve
</button>
`
: ""
}


${
  statusValue !== "rejected"
    ? `
      <button
        class="action reject"
        data-action="reject"
        data-id="${escapeHTML(
          site.id
        )}"
      >
        Reject
      </button>
    `
    : ""
}


<button
  class="action delete"
  data-action="delete"
  data-id="${escapeHTML(
    site.id
  )}"
>
  Delete
</button>

        </div>

      </td>

    `;

    table.appendChild(tr);

  });

}


/* =========================
   OPEN ADD
========================= */

function openAdd(){

  form.reset();

  document.getElementById(
    "documentId"
  ).value = "";

  document.getElementById(
    "modalTitle"
  ).textContent =
    "Add Website";

  document.getElementById(
    "status"
  ).value = "pending";

  modal.classList.add("show");

}


/* =========================
   EDIT WEBSITE
========================= */

function editWebsite(id){

  const website =
    websites.find(
      site => site.id === id
    );

  if(!website) return;

  const fields = [
    "url",
    "title",
    "description",
    "keywords",
    "category",
    "domain",
    "image",
    "facebook",
    "instagram",
    "youtube",
    "tiktok",
    "linkedin",
    "x",
    "pinterest",
    "telegram",
    "whatsapp",
    "ownerId",
    "status"
  ];

  fields.forEach(field => {

    const element =
      document.getElementById(field);

    if(element){

      element.value =
        website[field] || "";

    }

  });

  document.getElementById(
    "documentId"
  ).value = id;

  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Website";

  modal.classList.add("show");

}


/* =========================
   VIEW WEBSITE
========================= */

function viewWebsite(id){

  const website =
    websites.find(
      site => site.id === id
    );

  if(!website) return;

  if(!website.url){

    alert(
      "This website does not have a URL."
    );

    return;

  }

  window.open(
    website.url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================
   CHANGE STATUS
========================= */

async function changeStatus(
  id,
  newStatus
){

  const website =
    websites.find(
      site => site.id === id
    );

  if(!website) return;

  const action =
    newStatus === "approved"
      ? "approve"
      : "reject";

  if(
    !confirm(
      `Are you sure you want to ${action} this website?`
    )
  ){

    return;

  }

  try{

    const updateData = {

      status: newStatus,

      updatedAt:
        serverTimestamp()

    };

    if(
      newStatus === "approved"
    ){

      updateData.approvedAt =
        serverTimestamp();

    }

    if(
      newStatus === "rejected"
    ){

      updateData.rejectedAt =
        serverTimestamp();

    }

    await updateDoc(

      doc(
        db,
        "indexedWebsites",
        id
      ),

      updateData

    );

    await loadWebsites();

  }catch(error){

    console.error(
      "Status update error:",
      error
    );

    alert(
      "Unable to update website status.\n\n" +
      (
        error?.message ||
        "Please try again."
      )
    );

  }

}


/* =========================
   DELETE WEBSITE
========================= */

async function removeWebsite(id){

  const website =
    websites.find(
      site => site.id === id
    );

  if(!website) return;

  const confirmed =
    confirm(
      `Delete "${website.title || "this website"}"?\n\nThis action cannot be undone.`
    );

  if(!confirmed) return;

  try{

    await deleteDoc(

      doc(
        db,
        "indexedWebsites",
        id
      )

    );

    await loadWebsites();

  }catch(error){

    console.error(
      "Delete website error:",
      error
    );

    alert(
      "Unable to delete website.\n\n" +
      (
        error?.message ||
        "Please try again."
      )
    );

  }

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  modal.classList.remove(
    "show"
  );

  form.reset();

  document.getElementById(
    "documentId"
  ).value = "";

}


/* =========================
   FORM VALUE
========================= */

function value(id){

  const element =
    document.getElementById(id);

  return element
    ? element.value.trim()
    : "";

}


/* =========================
   SAVE WEBSITE
========================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const id =
      value("documentId");

    const data = {

      url:
        value("url"),

      title:
        value("title"),

      description:
        value("description"),

      keywords:
        value("keywords"),

      category:
        value("category"),

      domain:
        value("domain"),

      image:
        value("image"),

      facebook:
        value("facebook"),

      instagram:
        value("instagram"),

      youtube:
        value("youtube"),

      tiktok:
        value("tiktok"),

      linkedin:
        value("linkedin"),

      x:
        value("x"),

      pinterest:
        value("pinterest"),

      telegram:
        value("telegram"),

      whatsapp:
        value("whatsapp"),

      ownerId:
        value("ownerId"),

      status:
        value("status") ||
        "pending"

    };


    try{

      if(id){

        await updateDoc(

          doc(
            db,
            "indexedWebsites",
            id
          ),

          {

            ...data,

            updatedAt:
              serverTimestamp()

          }

        );

      }else{

        await addDoc(

          websitesRef,

          {

            ...data,

            indexed: false,

            indexedAt: null,

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp(),

            approvedAt:
              data.status === "approved"
                ? serverTimestamp()
                : null,

            rejectedAt:
              data.status === "rejected"
                ? serverTimestamp()
                : null

          }

        );

      }

      closeModal();

      await loadWebsites();

    }catch(error){

      console.error(
        "Save website error:",
        error
      );

      alert(
        "Unable to save website.\n\n" +
        (
          error?.message ||
          "Please try again."
        )
      );

    }

  }
);

/* =========================
   TABLE ACTIONS
========================= */

table.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );

    if(!button) return;

    const id =
      button.dataset.id;

    const action =
      button.dataset.action;


    if(action === "view"){

      viewWebsite(id);

    }

    else if(action === "edit"){

      editWebsite(id);

    }

    else if(action === "approve"){

      changeStatus(
        id,
        "approved"
      );

    }

    else if(action === "reject"){

      changeStatus(
        id,
        "rejected"
      );

    }

    else if(action === "delete"){

      removeWebsite(id);

    }

  }
);
