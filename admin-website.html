<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin Websites | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,input,textarea,select{font:inherit}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:250px;
  height:100vh;
  background:#111827;
  color:white;
  padding:22px 15px;
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:800;
  padding:0 12px 25px;
}

.logo span{color:#60a5fa}

.nav a{
  display:block;
  color:#cbd5e1;
  text-decoration:none;
  padding:13px 14px;
  border-radius:10px;
  margin-bottom:5px;
}

.nav a:hover,
.nav a.active{
  background:#2563eb;
  color:white;
}

.main{
  margin-left:250px;
  padding:25px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.topbar h1{
  font-size:28px;
}

.topbar p{
  color:#64748b;
  margin-top:5px;
}

.primary{
  border:0;
  background:#2563eb;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

.primary:hover{background:#1d4ed8}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:20px;
}

.stat small{
  color:#64748b;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.toolbar{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:15px;
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.toolbar input,
.toolbar select{
  border:1px solid #dbe1ea;
  border-radius:9px;
  padding:11px;
  outline:none;
}

.toolbar input{
  flex:1;
}

.table-box{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:15px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,td{
  padding:14px;
  border-bottom:1px solid #edf0f4;
  text-align:left;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:13px;
}

.website{
  display:flex;
  align-items:center;
  gap:12px;
}

.website img{
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:10px;
  background:#e5e7eb;
}

.website-title{
  font-weight:700;
}

.website-domain{
  font-size:12px;
  color:#64748b;
  margin-top:3px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.pending{background:#fef3c7;color:#92400e}
.approved{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.action{
  border:0;
  border-radius:7px;
  padding:7px 10px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}

.view{background:#e0f2fe;color:#0369a1}
.edit{background:#ede9fe;color:#6d28d9}
.approve{background:#dcfce7;color:#166534}
.reject{background:#fee2e2;color:#991b1b}
.delete{background:#111827;color:white}

.empty{
  text-align:center;
  padding:45px;
  color:#64748b;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:2000;
}

.modal.show{display:flex}

.modal-box{
  background:white;
  width:min(850px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:18px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#f1f5f9;
  width:38px;
  height:38px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{grid-column:1/-1}

.field label{
  font-size:13px;
  font-weight:700;
  color:#475569;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #dbe1ea;
  border-radius:9px;
  padding:11px;
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.cancel{
  border:1px solid #dbe1ea;
  background:white;
  padding:11px 17px;
  border-radius:9px;
  cursor:pointer;
}

.mobile-menu{
  display:none;
}

@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    padding:18px;
  }

  .mobile-menu{
    display:block;
    border:0;
    background:#111827;
    color:white;
    padding:10px 13px;
    border-radius:8px;
    margin-bottom:15px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }
}

@media(max-width:600px){
  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .toolbar{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <nav class="nav">

    <a href="admin-dashboard.html">
      Dashboard
    </a>

    <a href="admin-website.html" class="active">
      Websites
    </a>

    <a href="admin-course.html">
      Courses
    </a>

    <a href="admin-career.html">
      Careers
    </a>

    <a href="admin-resources.html">
      Resources
    </a>

    <a href="admin-marketplace.html">
      Marketplace
    </a>

    <a href="admin-sponsor.html">
      Sponsors
    </a>

    <a href="admin-ads.html">
      Ads
    </a>

  </nav>

</aside>

<main class="main">

  <button class="mobile-menu" id="mobileMenu">
    ☰ Menu
  </button>

  <div class="topbar">

    <div>
      <h1>Website Management</h1>
      <p>Manage indexed websites across LetsStudy Pro.</p>
    </div>

    <button class="primary" id="addBtn">
      + Add Website
    </button>

  </div>

  <section class="stats">

    <div class="stat">
      <small>Total Websites</small>
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat">
      <small>Pending</small>
      <strong id="pendingCount">0</strong>
    </div>

    <div class="stat">
      <small>Approved</small>
      <strong id="approvedCount">0</strong>
    </div>

    <div class="stat">
      <small>Rejected</small>
      <strong id="rejectedCount">0</strong>
    </div>

  </section>

  <section class="toolbar">

    <input
      type="search"
      id="searchInput"
      placeholder="Search websites..."
    >

    <select id="statusFilter">
      <option value="all">All Status</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>

    <select id="categoryFilter">
      <option value="all">All Categories</option>
    </select>

  </section>

  <section class="table-box">

    <table>

      <thead>
        <tr>
          <th>Website</th>
          <th>Category</th>
          <th>Status</th>
          <th>Owner ID</th>
          <th>Indexed</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="websiteTable"></tbody>

    </table>

    <div class="empty" id="emptyState">
      No websites found.
    </div>

  </section>

</main>


<!-- MODAL -->

<div class="modal" id="websiteModal">

  <div class="modal-box">

    <div class="modal-head">

      <div>
        <h2 id="modalTitle">Add Website</h2>
      </div>

      <button class="close" id="closeModal">
        ×
      </button>

    </div>

    <form id="websiteForm">

      <input type="hidden" id="documentId">

      <div class="form-grid">

        <div class="field full">
          <label>Website URL</label>
          <input id="url" type="url" required>
        </div>

        <div class="field">
          <label>Title</label>
          <input id="title" required>
        </div>

        <div class="field">
          <label>Domain</label>
          <input id="domain">
        </div>

        <div class="field full">
          <label>Description</label>
          <textarea id="description"></textarea>
        </div>

        <div class="field">
          <label>Keywords</label>
          <input id="keywords">
        </div>

        <div class="field">
          <label>Category</label>
          <input id="category">
        </div>

        <div class="field full">
          <label>Image URL</label>
          <input id="image" type="url">
        </div>

        <div class="field">
          <label>Facebook</label>
          <input id="facebook" type="url">
        </div>

        <div class="field">
          <label>Instagram</label>
          <input id="instagram" type="url">
        </div>

        <div class="field">
          <label>YouTube</label>
          <input id="youtube" type="url">
        </div>

        <div class="field">
          <label>TikTok</label>
          <input id="tiktok" type="url">
        </div>

        <div class="field">
          <label>LinkedIn</label>
          <input id="linkedin" type="url">
        </div>

        <div class="field">
          <label>X</label>
          <input id="x" type="url">
        </div>

        <div class="field">
          <label>Pinterest</label>
          <input id="pinterest" type="url">
        </div>

        <div class="field">
          <label>Telegram</label>
          <input id="telegram" type="url">
        </div>

        <div class="field">
          <label>WhatsApp</label>
          <input id="whatsapp" type="url">
        </div>

        <div class="field">
          <label>Owner ID</label>
          <input id="ownerId">
        </div>

        <div class="field">
          <label>Status</label>

          <select id="status">

            <option value="pending">
              Pending
            </option>

            <option value="approved">
              Approved
            </option>

            <option value="rejected">
              Rejected
            </option>

          </select>

        </div>

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="cancel"
          id="cancelBtn"
        >
          Cancel

        <button

          class="primary"

          Save Website
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  addDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const websitesRef =
  collection(db,"indexedWebsites");


let websites = [];


const table =
  document.getElementById("websiteTable");

const emptyState =
  document.getElementById("emptyState");

const modal =
  document.getElementById("websiteModal");

const form =
  document.getElementById("websiteForm");


async function loadWebsites(){

  try{

    const snapshot =
      await getDocs(websitesRef);

    websites = [];

    snapshot.forEach(item => {

      websites.push({

        id:item.id,

        ...item.data()

      });

    });

    updateStats();

    createCategoryFilter();

    render();

  }catch(error){

    console.error(
      "Website loading error:",
      error
    );

    alert(
      "Unable to load websites."
    );

  }

}


function updateStats(){

  document.getElementById(
    "totalCount"
  ).textContent = websites.length;

  document.getElementById(
    "pendingCount"
  ).textContent =
    websites.filter(
      x => String(x.status || "pending")
        .toLowerCase() === "pending"
    ).length;

  document.getElementById(
    "approvedCount"
  ).textContent =
    websites.filter(
      x => String(x.status || "")
        .toLowerCase() === "approved"
    ).length;

  document.getElementById(
    "rejectedCount"
  ).textContent =
    websites.filter(
      x => String(x.status || "")
        .toLowerCase() === "rejected"
    ).length;

}


function createCategoryFilter(){

  const select =
    document.getElementById(
      "categoryFilter"
    );

  const categories =
    [...new Set(
      websites
        .map(x => x.category)
        .filter(Boolean)
    )].sort();

  select.innerHTML =
    `<option value="all">
      All Categories
    </option>`;

  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value = category;

    option.textContent = category;

    select.appendChild(option);

  });

}


function render(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .toLowerCase()
      .trim();

  const status =
    document.getElementById(
      "statusFilter"
    ).value;

  const category =
    document.getElementById(
      "categoryFilter"
    ).value;


  const filtered =
    websites.filter(site => {

      const text = [

        site.title,
        site.description,
        site.url,
        site.domain,
        site.keywords,
        site.category

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      const siteStatus =
        String(
          site.status || "pending"
        ).toLowerCase();


      return (

        (!search ||
          text.includes(search))

        &&

        (status === "all" ||
          siteStatus === status)

        &&

        (category === "all" ||
          site.category === category)

      );

    });


  table.innerHTML = "";

  emptyState.style.display =
    filtered.length
      ? "none"
      : "block";


  filtered.forEach(site => {

    const tr =
      document.createElement("tr");


    const statusValue =
      String(
        site.status || "pending"
      ).toLowerCase();


    const image =
      site.image ||
      "https://via.placeholder.com/80";


    const indexed =
      formatDate(site.indexedAt);


    tr.innerHTML = `

      <td>

        <div class="website">

          <img
            src="${escapeHTML(image)}"
            onerror="this.src='https://via.placeholder.com/80'"
          >

          <div>

            <div class="website-title">
              ${escapeHTML(
                site.title || "Untitled Website"
              )}
            </div>

            <div class="website-domain">
              ${escapeHTML(
                site.domain ||
                site.url ||
                ""
              )}
            </div>

          </div>

        </div>

      </td>


      <td>
        ${escapeHTML(
          site.category || "General"
        )}
      </td>


      <td>

        <span class="badge ${statusValue}">
          ${escapeHTML(
            capitalize(statusValue)
          )}
        </span>

      </td>


      <td>
        ${escapeHTML(
          site.ownerId || "—"
        )}
      </td>


      <td>
        ${indexed}
      </td>


      <td>

        <div class="actions">

          <button
            class="action view"
            onclick="viewWebsite('${site.id}')"
          >
            View
          </button>

          <button
            class="action edit"
            onclick="editWebsite('${site.id}')"
          >
            Edit
          </button>

          ${
            statusValue !== "approved"
            ? `
              <button
                class="action approve"
                onclick="changeStatus('${site.id}','approved')"
              >
                Approve
              </button>
            `
            : ""
          }

          ${
            statusValue !== "rejected"
            ? `
              <button
                class="action reject"
                onclick="changeStatus('${site.id}','rejected')"
              >
                Reject
              </button>
            `
            : ""
          }

          <button
            class="action delete"
            onclick="removeWebsite('${site.id}')"
          >
            Delete
          </button>

        </div>

      </td>

    `;


    table.appendChild(tr);

  });

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function capitalize(value){

  return value.charAt(0).toUpperCase()
    + value.slice(1);

}


function formatDate(value){

  if(!value)
    return "—";

  try{

    if(
      typeof value.toDate === "function"
    ){

      return value
        .toDate()
        .toLocaleDateString();

    }

    return new Date(value)
      .toLocaleDateString();

  }catch{

    return "—";

  }

}


function openAdd(){

  form.reset();

  document.getElementById(
    "documentId"
  ).value = "";

  document.getElementById(
    "modalTitle"
  ).textContent =
    "Add Website";

  document.getElementById(
    "status"
  ).value = "pending";

  modal.classList.add("show");

}


window.editWebsite = async function(id){

  const website =
    websites.find(x => x.id === id);

  if(!website)
    return;


  document.getElementById(
    "documentId"
  ).value = id;

  const fields = [

    "url",
    "title",
    "description",
    "keywords",
    "category",
    "domain",
    "image",
    "facebook",
    "instagram",
    "youtube",
    "tiktok",
    "linkedin",
    "x",
    "pinterest",
    "telegram",
    "whatsapp",
    "ownerId",
    "status"

  ];


  fields.forEach(field => {

    const element =
      document.getElementById(field);

    if(element){

      element.value =
        website[field] || "";

    }

  });


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Website";


  modal.classList.add("show");

};


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const id =
      document.getElementById(
        "documentId"
      ).value;


    const data = {

      url: value("url"),

      title: value("title"),

      description:
        value("description"),

      keywords:
        value("keywords"),

      category:
        value("category"),

      domain:
        value("domain"),

      image:
        value("image"),

      facebook:
        value("facebook"),

      instagram:
        value("instagram"),

      youtube:
        value("youtube"),

      tiktok:
        value("tiktok"),

      linkedin:
        value("linkedin"),

      x:
        value("x"),

      pinterest:
        value("pinterest"),

      telegram:
        value("telegram"),

      whatsapp:
        value("whatsapp"),

      ownerId:
        value("ownerId"),

      status:
        value("status") || "pending"

    };


    try{

      if(id){

        await updateDoc(
          doc(
            db,
            "indexedWebsites",
            id
          ),
          data
        );

      }else{

        await addDoc(
          websitesRef,
          {

            ...data,

            indexedAt:
              serverTimestamp()

          }
        );

      }


      closeModal();

      await loadWebsites();


        }catch(error){

      console.error(
        "Save website error:",
        error
      );

      alert(
        "Unable to save website. Please try again."
      );

    }

  }
);


/* =========================
   CHANGE STATUS
========================= */

window.changeStatus =
  async function(id,status){

    try{

      await updateDoc(
        doc(
          db,
          "indexedWebsites",
          id
        ),
        {
          status: status
        }
      );

      await loadWebsites();

    }catch(error){

      console.error(
        "Status update error:",
        error
      );

      alert(
        "Unable to update website status."
      );

    }

  };


/* =========================
   DELETE WEBSITE
========================= */

window.removeWebsite =
  async function(id){

    const website =
      websites.find(
        item => item.id === id
      );

    const title =
      website?.title ||
      "this website";

    const confirmed =
      confirm(
        `Delete "${title}"? This action cannot be undone.`
      );

    if(!confirmed)
      return;


    try{

      await deleteDoc(
        doc(
          db,
          "indexedWebsites",
          id
        )
      );

      await loadWebsites();

    }catch(error){

      console.error(
        "Delete website error:",
        error
      );

      alert(
        "Unable to delete website."
      );

    }

  };


/* =========================
   VIEW WEBSITE
========================= */

window.viewWebsite =
  function(id){

    const website =
      websites.find(
        item => item.id === id
      );

    if(!website){

      alert(
        "Website not found."
      );

      return;

    }


    const url =
      website.url ||
      website.website ||
      website.link;


    if(!url){

      alert(
        "This website does not have a valid URL."
      );

      return;

    }


    let finalUrl = url;

    if(
      !/^https?:\/\//i.test(finalUrl)
    ){

      finalUrl =
        "https://" + finalUrl;

    }


    window.open(
      finalUrl,
      "_blank",
      "noopener,noreferrer"
    );

  };


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  modal.classList.remove("show");

}

  "addBtn"
).onclick =
  openAdd;


document.getElementById(
  "closeModal"
).onclick =
  closeModal;


document.getElementById(
  "cancelBtn"
).onclick =
  closeModal;


/* Close when clicking outside */

modal.addEventListener(
  "click",
  function(event){

    if(
      event.target === modal
    ){

      closeModal();

    }

  }
);
