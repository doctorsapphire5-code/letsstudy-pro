<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Index Management | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:white;padding:18px}
header h2{margin:0 0 5px}
main{max-width:1200px;margin:auto;padding:20px}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.primary{background:#2563eb;color:white}
.danger{background:#dc2626;color:white}
.success{background:#16a34a;color:white}
.warning{background:#f59e0b;color:white}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0000000d}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat strong{display:block;font-size:25px;margin-top:5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;font:inherit}
textarea{min-height:100px;resize:vertical}
.toolbar input{max-width:400px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
.badge{padding:5px 9px;border-radius:20px;font-size:12px}
.pending{background:#fef3c7;color:#92400e}
.approved{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}
.indexed{color:#15803d;font-weight:bold}
.unindexed{color:#6b7280}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:10}
.modal.show{display:flex}
.modal-box{background:white;width:760px;max-width:100%;max-height:92vh;overflow:auto;border-radius:14px}
.modal-head,.modal-foot{padding:16px;border-bottom:1px solid #eee}
.modal-foot{border:0;display:flex;justify-content:flex-end;gap:8px}
.modal-body{padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.seo{padding:12px;background:#f0f6ff;border-radius:10px}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:13px 18px;border-radius:9px;display:none;z-index:30}
.toast.show{display:block}
.empty{text-align:center;padding:35px;color:#6b7280}
@media(max-width:700px){
.stats{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
table{font-size:13px}
}
</style>
</head>

<body>

<header>
  <h2>LetsStudy Pro</h2>
  <div>Web Index Management</div>
</header>

<main>

<div class="card">
  <button class="primary" onclick="openForm()">
    + Add Website
  </button>
</div>

<div class="stats">
  <div class="card stat">Total<strong id="total">0</strong></div>
  <div class="card stat">Pending<strong id="pending">0</strong></div>
  <div class="card stat">Approved<strong id="approved">0</strong></div>
  <div class="card stat">Rejected<strong id="rejected">0</strong></div>
  <div class="card stat">Indexed<strong id="indexed">0</strong></div>
</div>

<div class="card">

  <div class="toolbar">
    <input
      id="search"
      placeholder="Search websites..."
      oninput="render()"
    >

    <select id="filterStatus" onchange="render()">
      <option value="">All Status</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>

    <select id="filterIndex" onchange="render()">
      <option value="">All Index</option>
      <option value="true">Indexed</option>
      <option value="false">Unindexed</option>
    </select>
  </div>

</div>

<div class="card">

<table>
<thead>
<tr>
<th>Website</th>
<th>Status</th>
<th>SEO</th>
<th>Index</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="rows"></tbody>
</table>

</div>

</main>


<!-- FORM MODAL -->
<div class="modal" id="formModal">

<div class="modal-box">

<div class="modal-head">
  <h3 id="formTitle">Add Website</h3>
</div>

<form id="form">

<div class="modal-body">

<div class="grid">

<div>
<label>Website URL *</label>
<input id="url" type="url" required>
</div>

<div>
<label>Domain</label>
<input id="domain">
</div>

<div class="full">
<label>SEO Title *</label>
<input id="title" maxlength="60" required>
<small id="titleCount">0/60</small>
</div>

<div class="full">
<label>Meta Description *</label>
<textarea id="description" maxlength="160" required></textarea>
<small id="descriptionCount">0/160</small>
</div>

<div>
<label>Keywords</label>
<input id="keywords">
</div>

<div>
<label>Category</label>
<input id="category" value="Websites">
</div>

<div>
<label>Status</label>
<select id="status">
<option value="pending">Pending</option>
<option value="approved">Approved</option>
<option value="rejected">Rejected</option>
</select>
</div>

<div>
<label>Owner ID</label>
<input id="ownerId">
</div>

<div class="full">
<label>Image URL</label>
<input id="image" type="url">
</div>

<div>
<label>Facebook</label>
<input id="facebook" type="url">
</div>

<div>
<label>Instagram</label>
<input id="instagram" type="url">
</div>

<div>
<label>YouTube</label>
<input id="youtube" type="url">
</div>

<div>
<label>TikTok</label>
<input id="tiktok" type="url">
</div>

<div>
<label>LinkedIn</label>
<input id="linkedin" type="url">
</div>

<div>
<label>X</label>
<input id="x" type="url">
</div>

<div>
<label>Telegram</label>
<input id="telegram" type="url">
</div>

<div>
<label>WhatsApp</label>
<input id="whatsapp" type="url">
</div>

<div class="full seo">
<b>SEO Score: <span id="seoScore">0</span>/100</b>
<p id="seoMessage">Enter title and description.</p>
</div>

</div>

</div>

<div class="modal-foot">
<button type="button" onclick="closeForm()">Cancel</button>
<button class="primary" type="submit">Save Website</button>
</div>

</form>

</div>
</div>


<!-- VIEW MODAL -->
<div class="modal" id="viewModal">

<div class="modal-box">

<div class="modal-head">
<h3>Website Details</h3>
</div>

<div class="modal-body" id="view"></div>

<div class="modal-foot">
<button onclick="closeView()">Close</button>
</div>

</div>
</div>


<div class="toast" id="toast"></div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rj0rodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const ref=collection(db,"indexedWebsites");

let data=[];
let editing=null;


const $=id=>document.getElementById(id);


function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}


function domain(url){
  try{
    return new URL(url).hostname;
  }catch{
    return "";
  }
}


function seo(title,description){

  const t=(title||"").trim().length;
  const d=(description||"").trim().length;

  let ts=0;
  let ds=0;

  if(t>=30 && t<=60) ts=50;
  else if(t>=20) ts=35;
  else if(t>0) ts=20;

  if(d>=120 && d<=160) ds=50;
  else if(d>=80) ds=35;
  else if(d>0) ds=20;

  return {
    t,
    d,
    score:ts+ds
  };
}


function toast(message){

  $("toast").textContent=message;
  $("toast").classList.add("show");

  setTimeout(
    ()=>$("toast").classList.remove("show"),
    3000
  );
}


async function load(){

  try{

    const snap=await getDocs(ref);

    data=[];

    snap.forEach(d=>{

      const x=d.data();

      data.push({
        ...x,
        id:d.id,
        documentId:d.id,
        searchId:d.id,
        type:"website",
        collection:"indexedWebsites"
      });

    });

    render();

  }catch(e){

    console.error(e);
    toast(e.message);

  }
}


function render(){

  const q=$("search").value.toLowerCase();
  const sf=$("filterStatus").value;
  const ix=$("filterIndex").value;

  const list=data.filter(x=>{

    const text=
      `${x.title||""} ${x.url||""} ${x.domain||""} ${x.keywords||""}`
      .toLowerCase();

    return (
      (!q || text.includes(q)) &&
      (!sf || x.status===sf) &&
      (!ix || String(!!x.indexed)===ix)
    );

  });

  $("total").textContent=data.length;

  $("pending").textContent=
    data.filter(x=>x.status==="pending").length;

  $("approved").textContent=
    data.filter(x=>x.status==="approved").length;

  $("rejected").textContent=
    data.filter(x=>x.status==="rejected").length;

  $("indexed").textContent=
    data.filter(x=>x.indexed===true).length;


  $("rows").innerHTML=list.length
    ? list.map(x=>{

      const s=seo(
        x.title,
        x.description
      );

      return `
      <tr>

        <td>
          <b>${esc(x.title||"Untitled")}</b><br>
          <small>${esc(x.domain||domain(x.url))}</small>
        </td>

        <td>
          <span class="badge ${esc(x.status||"pending")}">
            ${esc(x.status||"pending")}
          </span>
        </td>

        <td>
          <b>${s.score}/100</b>
        </td>

        <td>
          <span class="${x.indexed?"indexed":"unindexed"}">
            ${x.indexed?"Indexed":"Unindexed"}
          </span>
        </td>

        <td>
          <div class="actions">

            <button onclick="viewSite('${x.id}')">
              View
            </button>

            <button onclick="editSite('${x.id}')">
              Edit
            </button>

            ${
              x.status!=="approved"
              ? `<button class="success"
                   onclick="approve('${x.id}')">
                   Approve
                 </button>`
              : ""
            }

            ${
              x.status!=="rejected"
              ? `<button class="warning"
                   onclick="reject('${x.id}')">
                   Reject
                 </button>`
              : ""
            }

            <button onclick="toggleIndex('${x.id}')">
              ${x.indexed?"Unindex":"Index"}
            </button>

            <button class="danger"
              onclick="removeSite('${x.id}')">
              Delete
            </button>

          </div>
        </td>

      </tr>`;

    }).join("")
    : `
      <tr>
        <td colspan="5">
          <div class="empty">
            No websites found.
          </div>
        </td>
      </tr>
    `;
}


function openForm(id=null){

  editing=id;

  $("formTitle").textContent=
    id?"Edit Website":"Add Website";

  $("form").reset();

  $("category").value="Websites";
  $("status").value="pending";

  if(id){

    const x=data.find(v=>v.id===id);

    if(!x)return;

    [
      "url",
      "domain",
      "title",
      "description",
      "keywords",
      "category",
      "status",
      "ownerId",
      "image",
      "facebook",
      "instagram",
      "youtube",
      "tiktok",
      "linkedin",
      "x",
      "telegram",
      "whatsapp"
    ].forEach(k=>{
      if($(k))
        $(k).value=x[k]||"";
    });

  }

  updateSEO();

  $("formModal").classList.add("show");
}


function closeForm(){

  $("formModal").classList.remove("show");
  editing=null;

}


window.openForm=openForm;
window.closeForm=closeForm;


$("form").addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    const s=seo(
      $("title").value,
      $("description").value
    );

    if(s.t>60){
      toast("SEO Title cannot exceed 60 characters.");
      return;
    }

    if(s.d>160){
      toast("Meta Description cannot exceed 160 characters.");
      return;
    }

    const website={

      url:$("url").value.trim(),

      domain:
        $("domain").value.trim() ||
        domain($("url").value),

      title:$("title").value.trim(),

      description:
        $("description").value.trim(),

      keywords:$("keywords").value.trim(),

      category:
        $("category").value.trim() ||
        "Websites",

      status:$("status").value,

      indexed:
        $("status").value==="approved",

      ownerId:
        $("ownerId").value.trim(),

      image:$("image").value.trim(),

      facebook:$("facebook").value.trim(),

      instagram:$("instagram").value.trim(),

      youtube:$("youtube").value.trim(),

      tiktok:$("tiktok").value.trim(),

      linkedin:$("linkedin").value.trim(),

      x:$("x").value.trim(),

      telegram:$("telegram").value.trim(),

      whatsapp:$("whatsapp").value.trim(),

      type:"website",

      collection:"indexedWebsites",

      updatedAt:serverTimestamp()

    };


    try{

      if(editing){

        await updateDoc(
          doc(
            db,
            "indexedWebsites",
            editing
          ),
          website
        );

        toast("Website updated.");

      }else{

        website.createdAt=
          serverTimestamp();

        const d=
          await addDoc(
            ref,
            website
          );

        await updateDoc(
          doc(
            db,
            "indexedWebsites",
            d.id
          ),
          {
            searchId:d.id,
            documentId:d.id
          }
        );

        toast("Website added.");

      }

      closeForm();
      await load();

    }catch(e){

      console.error(e);
      toast(e.message);

    }

  }
);


window.editSite=id=>openForm(id);


window.approve=async id=>{

  try{

    const x=data.find(v=>v.id===id);

    const s=seo(
      x.title,
      x.description
    );

    if(s.t>60 || s.d>160){

      toast("Fix SEO length before approval.");
      return;

    }

    await updateDoc(
      doc(db,"indexedWebsites",id),
      {
        status:"approved",
        indexed:true,
        indexedAt:serverTimestamp(),
        approvedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      }
    );

    toast("Website approved and indexed.");
    load();

  }catch(e){

    toast(e.message);

  }

};


window.reject=async id=>{

  try{

    await updateDoc(
      doc(db,"indexedWebsites",id),
      {
        status:"rejected",
        indexed:false,
        indexedAt:null,
        rejectedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      }
    );

    toast("Website rejected.");
    load();

  }catch(e){

    toast(e.message);

  }

};


window.toggleIndex=async id=>{

  const x=data.find(v=>v.id===id);

  if(!x)return;

  if(!x.indexed &&
     x.status!=="approved"){

    toast("Only approved websites can be indexed.");
    return;

  }

  try{

    await updateDoc(
      doc(db,"indexedWebsites",id),
      {
        indexed:!x.indexed,
        indexedAt:
          !x.indexed
          ?serverTimestamp()
          :null,
        updatedAt:serverTimestamp()
      }
    );

    toast(
      x.indexed
      ?"Website unindexed."
      :"Website indexed."
    );

    load();

  }catch(e){

    toast(e.message);

  }

};


window.removeSite=async id=>{

  if(!confirm("Delete this website?"))
    return;

  try{

    await deleteDoc(
      doc(
        db,
        "indexedWebsites",
        id
      )
    );

    toast("Website deleted.");
    load();

  }catch(e){

    toast(e.message);

  }

};


window.viewSite=id=>{

  const x=data.find(v=>v.id===id);

  if(!x)return;

  const s=seo(
    x.title,
    x.description
  );

  $("view").innerHTML=`

    <h3>${esc(x.title)}</h3>

    <p>
      <a href="${esc(x.url)}"
         target="_blank">
        ${esc(x.url)}
      </a>
    </p>

    <p>
      <b>Status:</b>
      ${esc(x.status)}
    </p>

    <p>
      <b>Category:</b>
      ${esc(x.category)}
    </p>

    <p>
      <b>SEO:</b>
      ${s.score}/100
    </p>

    <p>
      <b>Indexed:</b>
      ${x.indexed?"Yes":"No"}
    </p>

    <hr>

    <b>Description</b>

    <p>
      ${esc(x.description)}
    </p>

    <b>Keywords</b>

    <p>
      ${esc(x.keywords)}
    </p>

  `;

  $("viewModal").classList.add("show");

};


window.closeView=()=>{
  $("viewModal").classList.remove("show");
};


function updateSEO(){

  const s=seo(
    $("title").value,
    $("description").value
  );

  $("titleCount").textContent=
    `${s.t}/60`;

  $("descriptionCount").textContent=
    `${s.d}/160`;

  $("seoScore").textContent=
    s.score;

  $("seoMessage").textContent=
    s.score>=90
      ?"Excellent SEO"
      :s.score>=70
        ?"Good SEO"
        :"SEO needs improvement";

}


$("title").addEventListener(
  "input",
  updateSEO
);

$("description").addEventListener(
  "input",
  updateSEO
);


$("formModal").addEventListener(
  "click",
  e=>{
    if(e.target===$("formModal"))
      closeForm();
  }
);


$("viewModal").addEventListener(
  "click",
  e=>{
    if(e.target===$("viewModal"))
      closeView();
  }
);


load();

</script>

</body>
</html>
