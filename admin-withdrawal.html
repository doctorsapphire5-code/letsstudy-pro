<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Withdrawals | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:#111827;
 color:#fff;
 padding:18px;
 display:flex;
 justify-content:space-between;
 align-items:center
}
.container{
 max-width:1150px;
 margin:auto;
 padding:20px
}
.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px
}
.card{
 background:#fff;
 padding:18px;
 border-radius:14px;
 box-shadow:0 3px 15px #0001;
 margin-bottom:18px
}
.stat{
 font-size:26px;
 font-weight:bold;
 margin-top:7px
}
input,select{
 width:100%;
 padding:12px;
 border:1px solid #ddd;
 border-radius:9px;
 margin-bottom:10px
}
button{
 border:0;
 border-radius:8px;
 padding:10px 15px;
 cursor:pointer;
 font-weight:bold
}
.primary{background:#2563eb;color:#fff}
.success{background:#16a34a;color:#fff}
.danger{background:#dc2626;color:#fff}
.gray{background:#e5e7eb}
.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap
}
.request{
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:15px;
 margin-bottom:10px
}
.badge{
 padding:4px 8px;
 border-radius:20px;
 font-size:12px;
 background:#eef2ff
}
.toolbar{
 display:grid;
 grid-template-columns:2fr 1fr;
 gap:10px
}
.hidden{display:none}
#loading{text-align:center;padding:50px}
@media(max-width:750px){
 .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
 .grid{grid-template-columns:1fr}
 .toolbar{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
 <strong>💰 LetsStudy Pro — Withdrawals</strong>
 <button class="gray" onclick="logout()">Logout</button>
</header>

<div id="loading">
 Loading...
</div>

<main id="app" class="container hidden">

 <div class="grid">

  <div class="card">
   <div>Platform Balance</div>
   <div id="balance" class="stat">TZS 0</div>
  </div>

  <div class="card">
   <div>Pending</div>
   <div id="pending" class="stat">TZS 0</div>
  </div>

  <div class="card">
   <div>Paid</div>
   <div id="paid" class="stat">TZS 0</div>
  </div>

  <div class="card">
   <div>Requests</div>
   <div id="requests" class="stat">0</div>
  </div>

 </div>


 <!-- ADMIN PAYOUT -->

 <section class="card">

  <h2>💸 Make Admin Payout</h2>

  <input
   id="recipient"
   placeholder="Recipient User ID"
  >

  <input
   id="amount"
   type="number"
   min="1"
   placeholder="Amount TZS"
  >

  <select id="method">

   <option value="mobile_money">
    Mobile Money
   </option>

   <option value="bank">
    Bank
   </option>

  </select>

  <input
   id="account"
   placeholder="Phone number / Bank account"
  >

  <input
   id="reference"
   placeholder="Payment reference"
  >

  <button
   class="primary"
   onclick="createPayout()"
  >
   Create Payout
  </button>

 </section>


 <!-- REQUESTS -->

 <section class="card">

  <h2>Withdrawal Requests</h2>

  <div class="toolbar">

   <input
    id="search"
    placeholder="Search user..."
   >

   <select id="filter">

    <option value="all">
     All
    </option>

    <option value="pending">
     Pending
    </option>

    <option value="approved">
     Approved
    </option>

    <option value="paid">
     Paid
    </option>

    <option value="rejected">
     Rejected
    </option>

   </select>

  </div>

  <div id="list"></div>

 </section>

</main>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 collection,
 getDocs,
 addDoc,
 updateDoc,
 doc,
 serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   FIREBASE
===================================== */

const firebaseConfig = {
 apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
 authDomain:"let-s-study-pro-course.firebaseapp.com",
 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
 projectId:"let-s-study-pro-course",
 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",
 messagingSenderId:"474928293390",
 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
 measurementId:"G-85B7V5H5J0"
};

const firebaseApp =
 initializeApp(firebaseConfig);

const auth =
 getAuth(firebaseApp);

const db =
 getFirestore(firebaseApp);


/* =====================================
   STATE
===================================== */

let withdrawals = [];

let currentUser = null;


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
 auth,
 async user => {

  currentUser = user;

  document
   .getElementById("loading")
   .classList.add("hidden");

  document
   .getElementById("app")
   .classList.remove("hidden");

  await loadWithdrawals();

 }
);


/* =====================================
   LOAD
===================================== */

async function loadWithdrawals(){

 try{

  const snap =
   await getDocs(
    collection(
     db,
     "withdrawals"
    )
   );

  withdrawals =
   snap.docs.map(
    d => ({
     id:d.id,
     ...d.data()
    })
   );

  render();
  stats();

 }
 catch(error){

  console.error(error);

  document
   .getElementById("list")
   .innerHTML =
   "<p>Failed to load withdrawals.</p>";

 }

}


/* =====================================
   STATS
===================================== */

function stats(){

 let pending = 0;
 let paid = 0;

 withdrawals.forEach(
  w => {

   const amount =
    Number(w.amount || 0);

   if(
    w.status === "pending"
   )
    pending += amount;

   if(
    w.status === "paid"
   )
    paid += amount;

  }
 );


 document.getElementById(
  "balance"
 ).textContent =
  "TZS " +
  paid.toLocaleString();

 document.getElementById(
  "pending"
 ).textContent =
  "TZS " +
  pending.toLocaleString();

 document.getElementById(
  "paid"
 ).textContent =
  "TZS " +
  paid.toLocaleString();

 document.getElementById(
  "requests"
 ).textContent =
  withdrawals.length;

}


/* =====================================
   RENDER
===================================== */

function render(){

 const search =
  document.getElementById(
   "search"
  ).value
   .toLowerCase()
   .trim();

 const filter =
  document.getElementById(
   "filter"
  ).value;


 const data =
  withdrawals.filter(
   w => {

    const text =
     (
      w.userId || ""
     ).toLowerCase();

    const searchOK =
     !search ||
     text.includes(search);

    const filterOK =
     filter === "all" ||
     w.status === filter;

    return searchOK && filterOK;

   }
  );


 const list =
  document.getElementById(
   "list"
  );


 if(!data.length){

  list.innerHTML =
   "<p>No withdrawal requests.</p>";

  return;

 }


 list.innerHTML =
  data.map(
   w => `

   <div class="request">

    <strong>
     User:
     ${escapeHTML(
      w.userId || "-"
     )}
    </strong>

    <p>
     Amount:
     <strong>
      TZS ${Number(
       w.amount || 0
      ).toLocaleString()}
     </strong>
    </p>

    <p>
     Method:
     ${escapeHTML(
      w.method || "-"
     )}
    </p>

    <p>
     Account:
     ${escapeHTML(
      w.account || "-"
     )}
    </p>

    <p>
     Reference:
     ${escapeHTML(
      w.reference || "-"
     )}
    </p>

    <span class="badge">
     ${escapeHTML(
      w.status || "pending"
     )}
    </span>

    <br><br>

    <div class="actions">

     ${
      w.status === "pending"
      ? `
       <button
        class="success"
        onclick="approve('${w.id}')"
       >
        Approve
       </button>

       <button
        class="danger"
        onclick="reject('${w.id}')"
       >
        Reject
       </button>
      `
      : ""
     }

     ${
      w.status === "approved"
      ? `
       <button
        class="primary"
        onclick="markPaid('${w.id}')"
       >
        Mark Paid
       </button>
      `
      : ""
     }

    </div>

   </div>

  `
  ).join("");

}


/* =====================================
   CREATE PAYOUT
===================================== */

window.createPayout =
 async function(){

  const recipient =
   document.getElementById(
    "recipient"
   ).value.trim();

  const amount =
   Number(
    document.getElementById(
     "amount"
    ).value
   );

  const method =
   document.getElementById(
    "method"
   ).value;

  const account =
   document.getElementById(
    "account"
   ).value.trim();

  const reference =
   document.getElementById(
    "reference"
   ).value.trim();


  if(
   !recipient ||
   !amount ||
   !account
  ){

   alert(
    "Fill all required fields."
   );

   return;

  }


  if(
   !confirm(
    "Create this payout?"
   )
  )
   return;


  try{

   await addDoc(
    collection(
     db,
     "withdrawals"
    ),
    {

     userId:recipient,

     amount,

     method,

     account,

     reference,

     status:"approved",

     type:"admin_payout",

     createdBy:
      currentUser?.uid ||
      "admin",

     createdAt:
      serverTimestamp(),

     updatedAt:
      serverTimestamp()

    }
   );


   alert(
    "Payout created."
   );


   document.getElementById(
    "recipient"
   ).value = "";

   document.getElementById(
    "amount"
   ).value = "";

   document.getElementById(
    "account"
   ).value = "";

   document.getElementById(
    "reference"
   ).value = "";


   await loadWithdrawals();

  }
  catch(error){

   console.error(error);

   alert(
    "Payout failed: " +
    error.message
   );

  }

};


/* =====================================
   APPROVE
===================================== */

window.approve =
 async function(id){

  if(
   !confirm(
    "Approve this withdrawal?"
   )
  )
   return;


  await updateStatus(
   id,
   "approved"
  );

 };


/* =====================================
   REJECT
===================================== */

window.reject =
 async function(id){

  if(
   !confirm(
    "Reject this withdrawal?"
   )
  )
   return;


  await updateStatus(
   id,
   "rejected"
  );

 };


/* =====================================
   MARK PAID
===================================== */

window.markPaid =
 async function(id){

  if(
   !confirm(
    "Confirm that the money has actually been paid?"
   )
  )
   return;


  await updateStatus(
   id,
   "paid"
  );

 };


/* =====================================
   STATUS
===================================== */

async function updateStatus(
 id,
 status
){

 try{

  await updateDoc(
   doc(
    db,
    "withdrawals",
    id
   ),
   {

    status,

    updatedAt:
     serverTimestamp(),

    processedBy:
     currentUser?.uid ||
     "admin"

   }
  );

  await loadWithdrawals();

 }
 catch(error){

  console.error(error);

  alert(
   "Update failed."
  );

 }

}


/* =====================================
   ESCAPE
===================================== */

function escapeHTML(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =====================================
   SEARCH
===================================== */

document.getElementById(
 "search"
).addEventListener(
 "input",
 render
);

document.getElementById(
 "filter"
).addEventListener(
 "change",
 render
);


/* =====================================
   LOGOUT
===================================== */

window.logout =
 async function(){

  await signOut(auth);

  location.href =
   "login.html";

};

</script>

</body>
</html>
