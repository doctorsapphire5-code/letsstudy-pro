  let currentShareTitle =
    "Admission Opportunity";


  /* =====================================
     LOAD ADMISSIONS
  ===================================== */

  async function loadAdmissions(){

  try{

    const snapshot =
      await getDocs(

          db,

        )
      );

    admissions =
      snapshot.docs.map(

}


/* =====================================
   POPULATE FILTERS
===================================== */

function populateFilters(){

  const countries =
    [
      ...new Set(
        admissions
          .map(
            admission =>
              admission.country
          )
          .filter(Boolean)
      )
    ].sort();


  const levels =
    [
      ...new Set(
        admissions
          .map(
            admission =>
              admission.studyLevel ||
              admission.level
          )
          .filter(Boolean)
      )
    ].sort();


  const fields =
    [
      ...new Set(
        admissions
          .map(
            admission =>
              admission.field
          )
          .filter(Boolean)
      )
    ].sort();


  fillSelect(
    countryFilter,
    countries,
    "All Countries"
  );


  fillSelect(
    levelFilter,
    levels,
    "All Study Levels"
  );


  fillSelect(
    fieldFilter,
    fields,
    "All Fields"
  );

}


/* =====================================
   FILL SELECT
===================================== */

function fillSelect(
  select,
  values,
  placeholder
){

  if(!select){
    return;
  }

  select.innerHTML = `

    <option value="">
      ${escapeHTML(
        placeholder
      )}
    </option>

  `;


  values.forEach(
    value => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        value;

      option.textContent =
        value;

      select.appendChild(
        option
      );

    }
  );

}


/* =====================================
   UPDATE STATISTICS
===================================== */

function updateStats(){

  const total =
    admissions.length;


  const countries =
    new Set(
      admissions
        .map(
          admission =>
            admission.country
        )
        .filter(Boolean)
    );


  const openAdmissions =
    admissions.filter(
      admission =>
        getStatus(
          admission
        ) === "open"
    );


  const featuredAdmissions =
    admissions.filter(
      admission =>
        admission.featured === true
    );


  const totalElement =
    document.getElementById(
      "totalCount"
    );

  const countryElement =
    document.getElementById(
      "countryCount"
    );

  const openElement =
    document.getElementById(
      "openCount"
    );

  const featuredElement =
    document.getElementById(
      "featuredCount"
    );


  if(totalElement){

    totalElement.textContent =
      total;

  }


  if(countryElement){

    countryElement.textContent =
      countries.size;

  }


  if(openElement){

    openElement.textContent =
      openAdmissions.length;

  }


  if(featuredElement){

    featuredElement.textContent =
      featuredAdmissions.length;

  }

}


/* =====================================
   GET ADMISSION STATUS
===================================== */

function getStatus(
  admission
){

  const rawStatus =
    String(
      admission.status || ""
    )
    .trim()
    .toLowerCase();


  if(
    rawStatus === "closed"
  ){

    return "closed";

  }


  if(
    rawStatus === "upcoming"
  ){

    return "upcoming";

  }


  if(
    rawStatus === "open"
  ){

    return "open";

  }


  if(admission.deadline){

    const deadline =
      getDate(
        admission.deadline
      );


    if(
      deadline &&
      deadline.getTime() <
      Date.now()
    ){

      return "closed";

    }

  }


  return "open";

}


/* =====================================
   GET DATE
===================================== */

function getDate(
  value
){

  if(!value){

    return null;

  }


  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value.toDate();

    }


    const date =
      new Date(value);


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return null;

    }


    return date;

  }
  catch(error){

    return null;

  }

}

function applyFilters(){

  const query =
    search
      ? search.value
          .trim()
          .toLowerCase()
      : "";


  let filtered =
    admissions.filter(
      admission => {

        const searchableText = [

          admission.title,

          admission.name,

          admission.institution,

          admission.university,

          admission.college,

          admission.program,

          admission.field,

          admission.country,

          admission.city,

          admission.location,

          admission.studyLevel,

          admission.level,

          admission.intake

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        const matchesSearch =
          !query ||
          searchableText.includes(
            query
          );


        const matchesCountry =
          !countryFilter ||
          !countryFilter.value ||
          admission.country ===
            countryFilter.value;


        const matchesLevel =
          !levelFilter ||
          !levelFilter.value ||
          (
            admission.studyLevel ||
            admission.level
          ) ===
            levelFilter.value;


        const matchesField =
          !fieldFilter ||
          !fieldFilter.value ||
          admission.field ===
            fieldFilter.value;


        const matchesStatus =
          !statusFilter ||
          !statusFilter.value ||
          getStatus(
            admission
          ) ===
            statusFilter.value;


        return (
          matchesSearch &&
          matchesCountry &&
          matchesLevel &&
          matchesField &&
          matchesStatus
        );

      }
    );


  filtered =
    sortAdmissions(
      filtered
    );


  renderAdmissions(
    filtered
  );

}


/* =====================================
   SORT ADMISSIONS
===================================== */

function sortAdmissions(
  list
){

  const sorted =
    [...list];


  const sortValue =
    sortFilter
      ? sortFilter.value
      : "newest";


  sorted.sort(
    (a,b) => {

      if(
        sortValue ===
        "name"
      ){

        return String(
          a.title ||
          a.name ||
          ""
        ).localeCompare(
          String(
            b.title ||
            b.name ||
            ""
          )
        );

      }


      if(
        sortValue ===
        "country"
      ){

        return String(
          a.country || ""
        ).localeCompare(
          String(
            b.country || ""
          )
        );

      }


      if(
        sortValue ===
        "deadline"
      ){

        return getTime(
          a.deadline,
          Infinity
        )
        -
        getTime(
          b.deadline,
          Infinity
        );

      }


      return (
        getTime(
          b.createdAt,
          0
        )
        -
        getTime(
          a.createdAt,
          0
        )
      );

    }
  );


  return sorted;

}


/* =====================================
   GET TIME
===================================== */

function getTime(
  value,
  fallback = 0
){

  const date =
    getDate(value);


  return date
    ? date.getTime()
    : fallback;

}


/* =====================================
   RENDER ADMISSIONS
===================================== */

function renderAdmissions(
  results
){

  if(!grid){

    return;

  }


  const resultCount =
    document.getElementById(
      "resultCount"
    );


  if(resultCount){

    resultCount.innerHTML = `

      Showing

      <strong>
        ${results.length}
      </strong>

      ${
        results.length === 1
          ? "admission"
          : "admissions"
      }

    `;

  }


  if(!results.length){

    grid.innerHTML = `

      <div class="empty">

        <i
          class="
            fa-solid
            fa-magnifying-glass
          "
        ></i>

        <h3>
          No Admissions Found
        </h3>

        <p>
          No admission opportunities
          match your current filters.
        </p>

        <button
          type="button"
          class="retry-btn"
          id="clearAdmissionFilters"
        >

          <i
            class="
              fa-solid
              fa-filter-circle-xmark
            "
          ></i>

          Clear Filters

        </button>

      </div>

    `;


    const clearButton =
      document.getElementById(
        "clearAdmissionFilters"
      );


    if(clearButton){

      clearButton.addEventListener(
        "click",
        clearFilters
      );

    }


    return;

  }


  grid.innerHTML =
    results
      .map(
        admission =>
          createAdmissionCard(
            admission
          )
      )
      .join("");

}


/* =====================================
   CREATE ADMISSION CARD
===================================== */

function createAdmissionCard(
  admission
){

  const id =
    encodeURIComponent(
      admission.id || ""
    );


  const title =
    escapeHTML(
      admission.title ||
      admission.name ||
      "Admission Opportunity"
    );


  const institution =
    escapeHTML(
      admission.institution ||
      admission.university ||
      admission.college ||
      "Institution not specified"
    );


  const country =
    escapeHTML(
      admission.country ||
      "International"
    );


  const level =
    escapeHTML(
      admission.studyLevel ||
      admission.level ||
      "Study Programme"
    );


  const field =
    escapeHTML(
      admission.field ||
      admission.program ||
      "Various Fields"
    );


  const status =
    getStatus(
      admission
    );


  const image =
    admission.imageUrl ||
    admission.image ||
    admission.logo ||
    "";


  const description =
    escapeHTML(
      admission.shortDescription ||
      admission.description ||
      "Explore this admission opportunity and discover the available study options."
    );


  return `

    <article
      class="admission-card"
      data-id="${id}"
    >

      <div class="card-image">

        ${
          image

            ? `

              <img
                src="${escapeHTML(
                  image
                )}"
                alt="${institution}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >

              <div
                class="image-placeholder"
                style="display:none"
              >

                <i
                  class="
                    fa-solid
                    fa-building-columns
                  "
                ></i>

              </div>

            `

            : `

              <div
                class="image-placeholder"
              >

                <i
                  class="
                    fa-solid
                    fa-building-columns
                  "
                ></i>

              </div>

            `
        }


        ${
          admission.featured === true

            ? `

              <span class="featured">

                <i
                  class="
                    fa-solid
                    fa-star
                  "
                ></i>

                Featured

              </span>

            `

            : ""

        }


        <span
          class="
            status-badge
            status-${escapeHTML(
              status
            )}
          "
        >

          ${escapeHTML(
            status
          )}

        </span>

      </div>


      <div class="card-body">

        <div class="institution">

          <i
            class="
              fa-solid
              fa-building-columns
            "
          ></i>

          ${institution}

        </div>


        <h3>
          ${title}
        </h3>


        <p class="description">
          ${description}
        </p>


        <div class="meta">

          <span>

            <i
              class="
                fa-solid
                fa-earth-africa
              "
            ></i>

            ${country}

          </span>


          <span>

            <i
              class="
                fa-solid
                fa-graduation-cap
              "
            ></i>

            ${level}

          </span>


          <span>

            <i
              class="
                fa-solid
                fa-book-open
              "
            ></i>

            ${field}

          </span>

        </div>


        <div class="
          deadline
          ${
            status === "closed"
              ? "expired"
              : "open"
          }
        ">

          <i
            class="
              fa-solid
              fa-calendar-days
            "
          ></i>

          Deadline:

          <strong>
            ${formatDate(
              admission.deadline
            )}
          </strong>

        </div>


        <div class="card-footer">

          <a
            href="
              admission-details.html?id=${id}
            "
            class="view-btn"
          >

            View Details

            <i
              class="
                fa-solid
                fa-arrow-right
              "
            ></i>

          </a>


          <button
            type="button"
            class="share-btn"
            data-id="${id}"
            data-title="${title}"
            aria-label="
              Share ${title}
            "
          >

            <i
              class="
                fa-solid
                fa-share-nodes
              "
            ></i>

          </button>

        </div>

      </div>

    </article>

  `;

}


/* =====================================
   FORMAT DATE
===================================== */

function formatDate(
  value
){

  const date =
    getDate(value);


  if(!date){

    return "Not specified";

  }


  return date.toLocaleDateString(
    "en-US",
    {
      year: "numeric",
      month: "short",
      day: "numeric"
    }
  );

}


/* =====================================
   CLEAR FILTERS
===================================== */

function clearFilters(){

  if(search){

    search.value = "";

  }


  if(countryFilter){

    countryFilter.value = "";

  }


  if(levelFilter){

    levelFilter.value = "";

  }


  if(fieldFilter){

    fieldFilter.value = "";

  }


  if(statusFilter){

    statusFilter.value = "";

  }


  if(sortFilter){

    sortFilter.value = "newest";

  }


  applyFilters();

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================
   INITIALIZE PAGE
===================================== */

loadAdmissions();

<!-- =========================================
     FOOTER / BACK TO TOP SCRIPT
========================================= -->

<script>

  const footerYear =
    document.getElementById(
      "footerYear"
    );

  if(footerYear){

    footerYear.textContent =
      new Date().getFullYear();

  }


  const backToTop =
    document.getElementById(
      "backToTop"
    );


  window.addEventListener(
    "scroll",
    function(){

      if(
        window.scrollY > 400
      ){

        backToTop.classList.add(
          "show"
        );

      }
      else{

        backToTop.classList.remove(
          "show"
        );

      }

    }
  );


  backToTop.addEventListener(
    "click",
    function(){

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }
  );

</script>
