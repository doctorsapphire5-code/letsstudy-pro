<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ad | LetsStudy Pro</title>

<meta name="description" content="Advertisement details on LetsStudy Pro.">
<meta name="theme-color" content="#2563eb">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.6;
}

.header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  color:#111827;
  text-decoration:none;
  font-size:21px;
  font-weight:800;
}

.back{
  color:#2563eb;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.container{
  max-width:1050px;
  margin:35px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(15,23,42,.06);
}

.ad-label{
  padding:10px 18px;
  border-bottom:1px solid #edf0f4;
  color:#64748b;
  font-size:11px;
  font-weight:800;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.image-wrap{
  width:100%;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.ad-image{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:cover;
}

.image-placeholder{
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:64px;
}

.content{
  padding:32px;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:#eff6ff;
  color:#2563eb;
  font-size:12px;
  font-weight:800;
  margin-bottom:10px;
}

h1{
  font-size:32px;
  line-height:1.2;
  margin-bottom:10px;
}

.subtitle{
  color:#64748b;
  font-size:15px;
  margin-bottom:22px;
}

.description{
  color:#475569;
  white-space:pre-line;
  margin-bottom:25px;
}

.cta{
  display:inline-block;
  padding:12px 20px;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
  transition:.2s;
}

.cta:hover{
  opacity:.9;
  transform:translateY(-1px);
}

.info-section{
  margin-top:32px;
  padding-top:25px;
  border-top:1px solid #edf0f4;
}

.info-section h2{
  font-size:19px;
  margin-bottom:15px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.info{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
}

.info-label{
  color:#64748b;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:4px;
}

.info-value{
  font-size:14px;
  font-weight:700;
  word-break:break-word;
}

.loading{
  min-height:350px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

.error{
  padding:50px 25px;
  text-align:center;
}

.error h2{
  margin-bottom:8px;
}

.error p{
  color:#64748b;
}

.footer{
  text-align:center;
  padding:30px 15px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){

  .header{
    padding:0 15px;
  }

  .container{
    margin:20px auto;
  }

  .content{
    padding:23px;
  }

  h1{
    font-size:26px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .ad-image{
    max-height:350px;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    LetsStudy Pro
  </a>

  <a href="search.html" class="back">
    ← Back to Search
  </a>

</header>


<main class="container">

  <article class="card" id="adCard">

    <div class="loading">
      Loading advertisement...
    </div>

  </article>

</main>


<footer class="footer">
  © LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const card =
  document.getElementById("adCard");


const params =
  new URLSearchParams(
    window.location.search
  );

const adId =
  params.get("id");


function first(data,fields){

  for(const field of fields){

    const value = data[field];

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value);

    }

  }

  return "";

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeURL(value){

  if(!value) return "";

  try{

    const url =
      new URL(
        value,
        window.location.href
      );

    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return url.href;

    }

  }catch(error){}

  return "";

}


function renderAd(data){

  const title =
    first(data,[
      "title",
      "name",
      "adTitle",
      "headline"
    ]) ||
    "Advertisement";


  const description =
    first(data,[
      "description",
      "content",
      "details",
      "body",
      "message"
    ]) ||
    "Discover more information about this advertisement.";


  const subtitle =
    first(data,[
      "subtitle",
      "tagline",
      "shortDescription"
    ]);


  const image =
    first(data,[
      "image",
      "imageUrl",
      "banner",
      "bannerUrl",
      "thumbnail",
      "photo"
    ]);


  const targetURL =
    safeURL(
      first(data,[
        "targetUrl",
        "destinationUrl",
        "website",
        "websiteUrl",
        "url",
        "link",
        "ctaUrl"
      ])
    );


  const ctaText =
    first(data,[
      "ctaText",
      "buttonText",
      "callToAction"
    ]) ||
    "Learn More →";


  const advertiser =
    first(data,[
      "advertiser",
      "advertiserName",
      "company",
      "business",
      "sponsor"
    ]);


  const category =
    first(data,[
      "category",
      "type",
      "industry"
    ]);


  const location =
    first(data,[
      "location",
      "country",
      "address"
    ]);


  const contact =
    first(data,[
      "email",
      "contactEmail",
      "phone",
      "contact"
    ]);


  const imageHTML = image

    ? `
      <img
        class="ad-image"
        src="${escapeHTML(image)}"
        alt="${escapeHTML(title)}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="image-placeholder"
        style="display:none;"
      >
        📢
      </div>
    `

    : `
      <div class="image-placeholder">
        📢
      </div>
    `;


  let infoHTML = "";


  if(advertiser){

    infoHTML += `
      <div class="info">

        <div class="info-label">
          Advertiser
        </div>

        <div class="info-value">
          ${escapeHTML(advertiser)}
        </div>

      </div>
    `;

  }


  if(category){

    infoHTML += `
      <div class="info">

        <div class="info-label">
          Category
        </div>

        <div class="info-value">
          ${escapeHTML(category)}
        </div>

      </div>
    `;

  }


  if(location){

    infoHTML += `
      <div class="info">

        <div class="info-label">
          Location
        </div>

        <div class="info-value">
          ${escapeHTML(location)}
        </div>

      </div>
    `;

  }


  if(contact){

    infoHTML += `
      <div class="info">

        <div class="info-label">
          Contact
        </div>

        <div class="info-value">
          ${escapeHTML(contact)}
        </div>

      </div>
    `;

  }


  card.innerHTML = `

    <div class="ad-label">
      Advertisement
    </div>


    <div class="image-wrap">
      ${imageHTML}
    </div>


    <div class="content">

      <span class="badge">
        SPONSORED
      </span>

      <h1>
        ${escapeHTML(title)}
      </h1>


      ${
        subtitle
        ? `
          <div class="subtitle">
            ${escapeHTML(subtitle)}
          </div>
        `
        : ""
      }


      <div class="description">
        ${escapeHTML(description)}
      </div>


      ${
        targetURL
        ? `
          <a
            class="cta"
            href="${escapeHTML(targetURL)}"
            target="_blank"
            rel="noopener noreferrer sponsored"
            id="adCTA"
          >
            ${escapeHTML(ctaText)}
          </a>
        `
        : ""
      }


      ${
        infoHTML
        ? `
          <section class="info-section">

            <h2>
              Advertisement Information
            </h2>

            <div class="info-grid">
              ${infoHTML}
            </div>

          </section>
        `
        : ""
      }

    </div>

  `;


  document.title =
    title + " | LetsStudy Pro";


  const cta =
    document.getElementById("adCTA");


  if(cta){

    cta.addEventListener(
      "click",
      function(){

        console.log(
          "Ad clicked:",
          adId
        );

      }
    );

  }

}


async function loadAd(){

  if(!adId){

    card.innerHTML = `

      <div class="error">

        <h2>
          Advertisement not found
        </h2>

        <p>
          No advertisement ID was provided.
        </p>

      </div>

    `;

    return;

  }


  try{

    const adRef =
      doc(
        db,
        "ads",
        adId
      );


    const snapshot =
      await getDoc(adRef);


    if(!snapshot.exists()){

      card.innerHTML = `

        <div class="error">

          <h2>
            Advertisement not found
          </h2>

          <p>
            The requested advertisement
            could not be found.
          </p>

        </div>

      `;

      return;

    }


    renderAd(
      snapshot.data()
    );


  }catch(error){

    console.error(
      "Advertisement loading error:",
      error
    );


    card.innerHTML = `

      <div class="error">

        <h2>
          Unable to load advertisement
        </h2>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


loadAd();

</script>

</body>
</html>
