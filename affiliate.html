<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <title>Redirecting — LetsStudy Pro</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;

      display:flex;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:#f5f7fb;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color:#172033;

      text-align:center;
    }

    .card{
      width:100%;
      max-width:500px;

      background:#fff;

      border:
        1px solid #e5e7eb;

      border-radius:18px;

      padding:35px 25px;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,.08);
    }

    .logo{
      font-size:25px;
      font-weight:900;

      color:#2563eb;

      margin-bottom:25px;
    }

    .icon{
      width:70px;
      height:70px;

      margin:
        0 auto 20px;

      border-radius:50%;

      background:#eff6ff;

      display:flex;

      align-items:center;
      justify-content:center;

      font-size:32px;
    }

    h1{
      font-size:23px;

      color:#111827;

      margin-bottom:10px;
    }

    p{
      color:#64748b;

      font-size:14px;

      line-height:1.6;

      margin-bottom:22px;
    }

    .button{
      display:inline-block;

      padding:
        12px 20px;

      border-radius:9px;

      background:#2563eb;

      color:#fff;

      text-decoration:none;

      font-weight:700;

      border:0;

      cursor:pointer;
    }

    .button:hover{
      background:#1d4ed8;
    }

    .hidden{
      display:none;
    }

  </style>

</head>


<body>


<div class="card">

  <div class="logo">
    LetsStudy Pro
  </div>


  <div
    id="icon"
    class="icon"
  >
    🔗
  </div>


  <h1 id="title">
    Redirecting...
  </h1>


  <p id="message">
    Please wait while we connect you to the destination.
  </p>


  <a
    id="continueButton"
    class="button hidden"
    href="#"
  >
    Continue
  </a>

</div>


<script type="module">


import {
  initializeApp
}
from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment
}
from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* =========================================
   ELEMENTS
========================================= */

const title =
  document.getElementById(
    "title"
  );

const message =
  document.getElementById(
    "message"
  );

const button =
  document.getElementById(
    "continueButton"
  );

const icon =
  document.getElementById(
    "icon"
  );


/* =========================================
   GET ID
========================================= */

const params =
  new URLSearchParams(
    location.search
  );


const affiliateId =
  params.get("id");


/* =========================================
   VALIDATE URL
========================================= */

function validHttpUrl(
  value
){

  try{

    const url =
      new URL(
        value
      );


    return (
      url.protocol ===
        "https:" ||

      url.protocol ===
        "http:"
    );

  }
  catch(error){

    return false;

  }

}


/* =========================================
   REDIRECT
========================================= */

async function redirectAffiliate(){

  if(
    !affiliateId
  ){

    icon.textContent =
      "⚠️";

    title.textContent =
      "Invalid Affiliate Link";

    message.textContent =
      "The affiliate link is missing its ID.";

    return;

  }


  try{

    const affiliateRef =
      doc(
        db,
        "affiliateLinks",
        affiliateId
      );


    const affiliateSnap =
      await getDoc(
        affiliateRef
      );


    if(
      !affiliateSnap.exists()
    ){

      icon.textContent =
        "❌";

      title.textContent =
        "Link Not Found";

      message.textContent =
        "This affiliate link does not exist.";

      return;

    }


    const data =
      affiliateSnap.data();


    const destination =
      String(
        data.url || ""
      ).trim();


    /* =====================================
       ACTIVE CHECK
    ===================================== */

    if(
      data.active !== true
    ){

      icon.textContent =
        "⛔";

      title.textContent =
        "Offer Unavailable";

      message.textContent =
        "This affiliate offer is currently unavailable.";

      return;

    }


    /* =====================================
       EXPIRY CHECK
    ===================================== */

    if(
      data.expiryDate
    ){

      const today =
        new Date();


      today.setHours(
        0,
        0,
        0,
        0
      );


      const expiry =
        new Date(
          data.expiryDate +
          "T23:59:59"
        );


      if(
        today >
        expiry
      ){

        icon.textContent =
          "⏰";

        title.textContent =
          "Offer Expired";

        message.textContent =
          "This affiliate offer has expired.";

        return;

      }

    }


    /* =====================================
       URL CHECK
    ===================================== */

    if(
      !validHttpUrl(
        destination
      )
    ){

      icon.textContent =
        "❌";

      title.textContent =
        "Invalid Destination";

      message.textContent =
        "The destination URL is not valid.";

      return;

    }


    /* =====================================
       COUNT CLICK
    ===================================== */

    try{

      await updateDoc(

        affiliateRef,

        {

          clicks:
            increment(1)

        }

      );

    }
    catch(
      trackingError
    ){

      console.warn(
        "Click tracking failed:",
        trackingError
      );

    }


    /* =====================================
       UI
    ===================================== */

    title.textContent =
      data.name ||
      "Affiliate Offer";


    message.textContent =
      "You are being redirected. Please wait...";


    button.href =
      destination;


    button.textContent =
      data.cta ||
      "Continue";


    button.classList.remove(
      "hidden"
    );


    icon.textContent =
      "🚀";


    /* =====================================
       REDIRECT
    ===================================== */

    setTimeout(
      () => {

        window.location.replace(
          destination
        );

      },
      900
    );


  }
  catch(error){

    console.error(
      error
    );


    icon.textContent =
      "⚠️";


    title.textContent =
      "Something Went Wrong";


    message.textContent =
      "We could not process this affiliate link. Please try again.";

  }

}


redirectAffiliate();


</script>

</body>

</html>
