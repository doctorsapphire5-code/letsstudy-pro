<style>
:root{--blue:#2563eb;--blue-d:#1d4ed8;--ink:#172033;--mute:#64748b;--line:#e5e7eb;--bg:#f5f7fb}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.nav{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:21px;font-weight:900;color:var(--blue);text-decoration:none;letter-spacing:-.02em}
.back{text-decoration:none;color:#475569;font-weight:700;padding:8px 14px;border-radius:999px}
.back:hover{background:#eff6ff;color:var(--blue-d)}

main{max-width:1200px;margin:28px auto 70px;padding:0 20px}
h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.02em}
.sub{color:var(--mute);margin:4px 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tabs a{text-decoration:none;font-weight:800;font-size:14px;padding:9px 16px;border-radius:999px;background:#fff;border:1px solid #cbd5e1;color:#475569}
.tabs a[aria-current="page"]{background:var(--blue);border-color:var(--blue);color:#fff}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.bar input,.bar select{font:inherit;font-size:14px;padding:11px 14px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}
.bar input{flex:1;min-width:200px}
.btn{font:inherit;font-size:14px;font-weight:800;padding:11px 18px;border:0;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:#334155;border:1px solid #cbd5e1}
.btn.ghost:hover{background:#f1f5f9}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.red{background:#fff;color:#b91c1c;border:1px solid #fecaca}
.btn.red:hover{background:#fef2f2}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat,.card{background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(15,23,42,.06)}
.stat{padding:18px}
.stat span{font-size:13px;color:var(--mute);font-weight:700}
.stat b{display:block;font-size:26px;font-weight:900;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card{padding:22px;margin-bottom:20px}

.tbl{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
th{text-align:left;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top;overflow-wrap:anywhere}
.pill{display:inline-block;background:#eff6ff;color:var(--blue-d);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.ok{background:#dcfce7;color:#15803d}
.pill.wait{background:#fef3c7;color:#b45309}
.pill.bad{background:#fee2e2;color:#b91c1c}
.pill.off{background:#f1f5f9;color:#475569}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.sm{font-size:12px;color:var(--mute)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.more{text-align:center;margin-top:16px}

.state{background:#fff;padding:48px 20px;border-radius:20px;text-align:center;box-shadow:0 6px 24px rgba(15,23,42,.06)}
.state h2{margin-bottom:6px}
.state p{color:var(--mute);margin-bottom:16px}
.sk{height:84px;border-radius:18px;background:linear-gradient(90deg,#eceff4 25%,#f6f8fb 37%,#eceff4 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:999}

@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}main{margin-top:18px}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body>

<header>
  <nav class="nav" aria-label="Main">
    <a class="brand" href="index-auth.html">LetsStudy Pro</a>
    <a class="back" href="admin-dashboard.html">← Dashboard</a>
  </nav>
</header>

<main>
  <h1>Affiliates</h1>
  <p class="sub">Everyone promoting LetsStudy Pro, their referral links and what they have earned.</p>
  <nav class="tabs" aria-label="Affiliate pages">
    <a href="affiliates.html" aria-current="page">Affiliates</a>
    <a href="affiliateclicks.html">Clicks</a>
    <a href="affiliatereferral.html">Referrals</a>
    <a href="affiliatetransactions.html">Transactions</a>
    <a href="affiliatepayments.html">Payments</a>
  </nav>

  <div id="state" class="state" hidden="">
    <h2 id="stateTitle"></h2>
    <p id="stateText"></p>
    <a id="stateBtn" class="btn" href="login.html" hidden="">Sign in</a>
    <button id="retryBtn" class="btn" type="button" hidden="">Try again</button>
  </div>

  <div id="skel" class="stats" aria-hidden="true"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>

  <div id="app" hidden="">

    <div class="bar">
      <select id="status" aria-label="Status"><option value="">All statuses</option></select>
      <select id="sort" aria-label="Sort affiliates">
        <option value="earnings">Top earnings</option>
        <option value="conversions">Most conversions</option>
        <option value="sales">Most sales</option>
        <option value="newest">Newest</option>
        <option value="name">Name A to Z</option>
      </select>
      <input id="q" type="search" placeholder="Search by name, email, phone or referral code..." aria-label="Search affiliates">
      <button id="csvBtn" class="btn ghost" type="button">Export CSV</button>
      <button id="refreshBtn" class="btn" type="button">Refresh</button>
    </div>

    <div class="stats">
      <div class="stat"><span>Affiliates</span><b id="sCount">0</b></div>
      <div class="stat"><span>Active</span><b id="sActive">0</b></div>
      <div class="stat"><span>Total earnings</span><b id="sTotal">0</b></div>
      <div class="stat"><span>Available to pay out</span><b id="sAvail">0</b></div>
    </div>

    <section class="card">
      <div class="tbl">
        <table>
          <thead><tr><th>Affiliate</th><th>Referral link</th><th>Rate</th><th>Sales</th><th>Earnings</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
          <tbody id="list"></tbody>
        </table>
      </div>
      <div class="more"><button id="moreBtn" class="btn ghost" type="button" hidden="">Show more</button></div>
    </section>

  </div>
</main>

<div id="toast" class="toast" role="status" hidden=""></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, query, limit, getDocs, doc, updateDoc }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

const COLLECTION = "affiliates";
const CURRENCY = "TZS";                              // the affiliates documents have no currency field
const LIMIT = 1000, PAGE = 25;
const LINK_BASE = location.origin + "/index.html";
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });

let rows = [], view = [], shown = PAGE;

/* ---------- helpers ---------- */
const num = v => parseFloat(String(v ?? "").replace(/[^\d.\-]/g, "")) || 0;
const money = v => CURRENCY + " " + nf.format(num(v));
const joined = r => { const v = r.createdAt; const d = v?.toDate ? v.toDate() : new Date(v); return isNaN(d) ? null : d; };
const fmtDate = d => d ? d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "-";
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const linkOf = r => r.referralCode ? LINK_BASE + "?ref=" + encodeURIComponent(r.referralCode) : "";

function rateOf(r){
  const s = String(r.commissionRate ?? "");
  const v = parseFloat(s.replace(/[^\d.]/g, ""));
  if (!isFinite(v)) return "-";
  return nf.format(s.includes("%") || v >= 1 ? v : v * 100) + "%";
}

function pillClass(s){
  s = String(s || "").toLowerCase();
  if (/(activ|approv|verified)/.test(s)) return "ok";
  if (/(pend|review|new|wait)/.test(s)) return "wait";
  if (/(suspend|block|ban|reject|disabl|inactive|terminat)/.test(s)) return "bad";
  return "off";
}
const isActive = r => pillClass(r.status) === "ok";

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 2200);
}

function setState(title, text, { signin = false, retry = false } = {}){
  $("skel").hidden = true; $("app").hidden = true; $("state").hidden = false;
  $("stateTitle").textContent = title; $("stateText").textContent = text;
  $("stateBtn").hidden = !signin; $("retryBtn").hidden = !retry;
}

/* ---------- load ---------- */
async function load(){
  $("state").hidden = true; $("app").hidden = true; $("skel").hidden = false;
  try{
    const snap = await getDocs(query(collection(db, COLLECTION), limit(LIMIT)));
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    const keep = $("status").value;
    const statuses = [...new Set(rows.map(r => String(r.status || "").trim()).filter(Boolean))].sort();
    $("status").innerHTML = `<option value="">All statuses</option>` + statuses.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
    if (statuses.includes(keep)) $("status").value = keep;

    $("skel").hidden = true; $("app").hidden = false;
    draw(true);
  }catch(err){
    console.error(err);
    if (err?.code === "permission-denied")
      setState("Access denied", "Your account is not allowed to view affiliates. Ask an admin for access.");
    else
      setState("Unable to load affiliates", "Check your connection and try again.", { retry: true });
  }
}

/* ---------- draw ---------- */
function draw(reset){
  if (reset) shown = PAGE;
  const q = $("q").value.toLowerCase().trim();
  const st = $("status").value;
  view = rows.filter(r =>
    (!st || String(r.status || "").trim() === st) &&
    (!q || [r.name, r.email, r.phone, r.referralCode, r.userId, r.id].join(" ").toLowerCase().includes(q)));

  const sorts = {
    earnings:    (a, b) => num(b.totalEarnings) - num(a.totalEarnings),
    conversions: (a, b) => num(b.conversions) - num(a.conversions),
    sales:       (a, b) => num(b.totalSales) - num(a.totalSales),
    newest:      (a, b) => (joined(b)?.getTime() || 0) - (joined(a)?.getTime() || 0),
    name:        (a, b) => String(a.name || "").localeCompare(String(b.name || ""))
  };
  view.sort(sorts[$("sort").value]);

  $("sCount").textContent = view.length.toLocaleString();
  $("sActive").textContent = view.filter(isActive).length.toLocaleString();
  $("sTotal").textContent = money(view.reduce((s, r) => s + num(r.totalEarnings), 0));
  $("sAvail").textContent = money(view.reduce((s, r) => s + num(r.availableBalance), 0));

  $("list").innerHTML = view.length ? view.slice(0, shown).map(r => `
    <tr data-id="${esc(r.id)}">
      <td><b>${esc(r.name || "(no name)")}</b>
        <div class="sm">${esc(r.email || "")}</div>
        <div class="sm">${esc(r.phone || "")}</div></td>
      <td>${r.referralCode ? `<span class="pill">${esc(r.referralCode)}</span>
        <div><button class="btn ghost sm" type="button" data-copy="${esc(linkOf(r))}">Copy link</button></div>` : `<span class="sm">No code</span>`}</td>
      <td>${esc(rateOf(r))}</td>
      <td>${nf.format(num(r.totalSales))}<div class="sm">${nf.format(num(r.conversions))} conversion${num(r.conversions) === 1 ? "" : "s"}</div></td>
      <td><b>${esc(money(r.totalEarnings))}</b>
        <div class="sm">Paid ${esc(money(r.paidEarnings))}</div>
        <div class="sm">Pending ${esc(money(r.pendingEarnings))}</div>
        <div class="sm">Available ${esc(money(r.availableBalance))}</div></td>
      <td><span class="pill ${pillClass(r.status)}">${esc(r.status || "unknown")}</span></td>
      <td>${esc(fmtDate(joined(r)))}</td>
      <td><div class="acts">
        ${isActive(r)
          ? `<button class="btn red sm" type="button" data-set="suspended">Suspend</button>`
          : `<button class="btn sm" type="button" data-set="active">Approve</button>`}
        <a class="btn ghost sm" href="affiliatetransactions.html?affiliate=${encodeURIComponent(r.userId || r.id)}">Sales</a>
      </div></td>
    </tr>`).join("") : `<tr><td colspan="8">No affiliates match your filters.</td></tr>`;
  $("moreBtn").hidden = view.length <= shown;
}

/* ---------- actions ---------- */
async function setStatus(id, status){
  const r = rows.find(x => x.id === id);
  if (!r) return;
  const name = r.name || "this affiliate";
  if (!confirm((status === "active" ? "Approve " : "Suspend ") + name + "?")) return;
  try{
    const updatedAt = new Date().toISOString();
    await updateDoc(doc(db, COLLECTION, id), { status, updatedAt });
    r.status = status; r.updatedAt = updatedAt;
    toast(status === "active" ? "Affiliate approved" : "Affiliate suspended");
    const keep = $("status").value;
    if (keep && keep !== status) $("status").value = "";
    draw(false);
  }catch(err){
    console.error(err);
    toast(err?.code === "permission-denied" ? "You don't have permission to change this" : "Couldn't update. Try again.");
  }
}

function exportCSV(){
  const cols = ["id", "name", "email", "phone", "referralCode", "commissionRate", "status", "conversions", "totalSales",
    "totalEarnings", "paidEarnings", "pendingEarnings", "availableBalance", "userId", "createdAt", "updatedAt"];
  const val = (r, c) => c === "createdAt" ? (joined(r)?.toISOString() || "") : r[c];
  const cell = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const csv = [cols.join(","), ...view.map(r => cols.map(c => cell(val(r, c))).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = "affiliates-" + dayKey(new Date()) + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- events ---------- */
let t;
$("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => draw(true), 200); });
$("status").addEventListener("change", () => draw(true));
$("sort").addEventListener("change", () => draw(true));
$("refreshBtn").addEventListener("click", load);
$("retryBtn").addEventListener("click", load);
$("csvBtn").addEventListener("click", exportCSV);
$("moreBtn").addEventListener("click", () => { shown += PAGE; draw(false); });

$("list").addEventListener("click", async e => {
  const copy = e.target.closest("[data-copy]");
  if (copy){
    try{ await navigator.clipboard.writeText(copy.dataset.copy); toast("Referral link copied"); }
    catch{ toast("Couldn't copy the link"); }
    return;
  }
  const set = e.target.closest("[data-set]");
  if (set) setStatus(set.closest("tr").dataset.id, set.dataset.set);
});

const off = onAuthStateChanged(auth, user => {
  off();
  if (!user) return setState("Sign in required", "Only signed-in admins can manage affiliates.", { signin: true });
  load();
});

</script>
