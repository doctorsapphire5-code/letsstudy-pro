<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI History</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --primary:#7c3aed;
    --primary-dark:#6d28d9;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;
    --danger:#dc2626;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.header h1{
    margin:0;
    font-size:19px;
}

.header-actions{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    cursor:pointer;
    font-size:10px;
    font-weight:800;
}

.primary{
    background:var(--primary);
    color:#fff;
}

.primary:hover{
    background:var(--primary-dark);
}

.secondary{
    background:#e2e8f0;
    color:#334155;
}

.danger{
    background:#fee2e2;
    color:#b91c1c;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:24px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.search{
    flex:1;
    padding:11px 12px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
    font-size:10px;
}

.search:focus{
    border-color:var(--primary);
}

.filter{
    min-width:150px;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:#fff;
    outline:none;
}

.stats{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
}

.stat{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
}

.stat strong{
    display:block;
    font-size:16px;
}

.stat span{
    display:block;
    color:var(--muted);
    font-size:8px;
    margin-top:4px;
}

.history{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.history-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
}

.history-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
}

.title{
    font-size:12px;
    font-weight:900;
}

.date{
    color:var(--muted);
    font-size:8px;
    margin-top:5px;
}

.category{
    display:inline-block;
    margin-top:8px;
    padding:4px 7px;
    border-radius:20px;
    background:#ede9fe;
    color:#5b21b6;
    font-size:8px;
    font-weight:800;
}

.prompt{
    margin-top:12px;
    padding:10px;
    background:#f8fafc;
    border-radius:7px;
    color:#475569;
    font-size:9px;
    line-height:1.6;
}

.actions{
    display:flex;
    gap:6px;
    margin-top:12px;
}

.empty{
    display:none;
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
}

.empty h2{
    color:var(--text);
    margin-bottom:6px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(520px,100%);
    background:#fff;
    border-radius:12px;
    padding:22px;
}

.modal-card h2{
    margin:0 0 18px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    color:var(--muted);
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
    font:inherit;
    font-size:10px;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--primary);
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
}

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#172033;
    color:#fff;
    padding:11px 14px;
    border-radius:8px;
    font-size:9px;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:700px){

    .header{
        padding:0 12px;
    }

    .container{
        padding:12px;
    }

    .toolbar{
        flex-direction:column;
    }

    .filter{
        width:100%;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .history-top{
        flex-direction:column;
    }

    .header-actions button{
        padding:8px;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>
        AI History
    </h1>

    <div class="header-actions">

        <button
            class="secondary"
            onclick="openAddModal()">
            + Add
        </button>

        <button
            class="danger"
            onclick="clearHistory()">
            Clear
        </button>

    </div>

</header>


<main class="container">

    <div class="stats">

        <div class="stat">

            <strong
                id="totalCount">
                0
            </strong>

            <span>
                Total Conversations
            </span>

        </div>


        <div class="stat">

            <strong
                id="todayCount">
                0
            </strong>

            <span>
                Today
            </span>

        </div>


        <div class="stat">

            <strong
                id="categoryCount">
                0
            </strong>

            <span>
                Categories
            </span>

        </div>

    </div>


    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search AI history..."
            oninput="renderHistory()">


        <select
            id="filter"
            class="filter"
            onchange="renderHistory()">

            <option value="all">
                All Categories
            </option>

            <option value="coding">
                Coding
            </option>

            <option value="writing">
                Writing
            </option>

            <option value="research">
                Research
            </option>

            <option value="general">
                General
            </option>

        </select>

    </div>


    <section
        id="history"
        class="history">
    </section>


    <div
        id="empty"
        class="empty">

        <h2>
            No AI history found
        </h2>

        <p>
            Try another search or add a conversation.
        </p>

    </div>

</main>


<!-- ADD HISTORY MODAL -->

<div
    id="modal"
    class="modal">

    <div class="modal-card">

        <h2>
            Add AI Conversation
        </h2>

        <form
            id="historyForm"
            onsubmit="addHistory(event)">

            <div class="form-group">

                <label for="historyTitle">
                    Title
                </label>

                <input
                    id="historyTitle"
                    type="text"
                    placeholder="Website design ideas"
                    required>

            </div>


            <div class="form-group">

                <label for="historyCategory">
                    Category
                </label>

                <select
                    id="historyCategory"
                    required>

                    <option value="coding">
                        Coding
                    </option>

                    <option value="writing">
                        Writing
                    </option>

                    <option value="research">
                        Research
                    </option>

                    <option value="general">
                        General
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="historyPrompt">
                    Prompt
                </label>

                <textarea
                    id="historyPrompt"
                    placeholder="Enter the conversation prompt..."
                    required></textarea>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary"
                    onclick="closeModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary">
                    Save
                </button>

            </div>

        </form>

    </div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

const STORAGE_KEY =
    "ai-history-data";

let historyData = [];


/* =========================
   LOAD HISTORY
========================= */

function loadHistory(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if(saved){

        try{

            const parsed =
                JSON.parse(saved);

            historyData =
                Array.isArray(parsed)
                    ? parsed
                    : [];

        }catch(error){

            historyData = [];

        }

        return;

    }


    historyData = [

        {
            id:1,
            title:"Build a spreadsheet editor",
            category:"coding",
            prompt:"Create a complete HTML spreadsheet editor with formulas, tabs, and local storage.",
            createdAt:"2026-08-13T09:20:00"
        },

        {
            id:2,
            title:"Presentation editor",
            category:"coding",
            prompt:"Create a presentation editor page with slides, text formatting, and presentation controls.",
            createdAt:"2026-08-12T15:40:00"
        },

        {
            id:3,
            title:"Form Builder",
            category:"coding",
            prompt:"Build a form builder interface with draggable fields and response management.",
            createdAt:"2026-08-11T12:30:00"
        },

        {
            id:4,
            title:"Live Discussion",
            category:"general",
            prompt:"Create a live discussion page with participants, messages, reactions, and chat controls.",
            createdAt:"2026-08-10T18:10:00"
        }

    ];


    saveHistory();

}


/* =========================
   SAVE
========================= */

function saveHistory(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            historyData
        )
    );

}


/* =========================
   RENDER
========================= */

function renderHistory(){

    const container =
        document.getElementById(
            "history"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const query =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();

    const filter =
        document.getElementById(
            "filter"
        ).value;


    let filtered =
        historyData.filter(
            item => {

                const content =
                    (
                        item.title +
                        " " +
                        item.category +
                        " " +
                        item.prompt
                    )
                    .toLowerCase();


                if(
                    !content.includes(
                        query
                    )
                ){

                    return false;

                }


                if(
                    filter !== "all" &&
                    item.category !== filter
                ){

                    return false;

                }


                return true;

            }
        );


    filtered.sort(
        (a,b) =>
            new Date(b.createdAt) -
            new Date(a.createdAt)
    );


    container.innerHTML =
        "";


    updateStats();


    if(!filtered.length){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        item => {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "history-card";


            card.innerHTML = `

                <div class="history-top">

                    <div>

                        <div class="title">
                            ${escapeHTML(
                                item.title
                            )}
                        </div>

                        <div class="date">
                            ${formatDate(
                                item.createdAt
                            )}
                        </div>

                        <span class="category">
                            ${escapeHTML(
                                item.category
                            )}
                        </span>

                    </div>

                </div>


                <div class="prompt">
                    ${escapeHTML(
                        item.prompt
                    )}
                </div>


                <div class="actions">

                    <button
                        class="primary"
                        onclick="openConversation(
                            ${item.id}
                        )">
                        Open
                    </button>

                    <button
                        class="secondary"
                        onclick="copyPrompt(
                            ${item.id}
                        )">
                        Copy Prompt
                    </button>

                    <button
                        class="danger"
                        onclick="deleteHistory(
                            ${item.id}
                        )">
                        Delete
                    </button>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================
   STATS
========================= */

function updateStats(){

    document.getElementById(
        "totalCount"
    ).textContent =
        historyData.length;


    const today =
        new Date()
        .toDateString();


    const todayTotal =
        historyData.filter(
            item =>
                new Date(
                    item.createdAt
                ).toDateString() === today
        ).length;


    document.getElementById(
        "todayCount"
    ).textContent =
        todayTotal;


    const categories =
        new Set(
            historyData.map(
                item =>
                    item.category
            )
        );


    document.getElementById(
        "categoryCount"
    ).textContent =
        categories.size;

}


/* =========================
   ADD HISTORY
========================= */

function openAddModal(){

    document.getElementById(
        "historyForm"
    ).reset();

    document.getElementById(
        "modal"
    ).classList.add(
        "show"
    );

}


function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove(
        "show"
    );

}


function addHistory(event){

    event.preventDefault();


    const title =
        document.getElementById(
            "historyTitle"
        ).value.trim();


    const category =
        document.getElementById(
            "historyCategory"
        ).value;


    const prompt =
        document.getElementById(
            "historyPrompt"
        ).value.trim();


    if(
        !title ||
        !prompt
    ){

        return;

    }


    historyData.unshift({

        id:
            Date.now(),

        title,

        category,

        prompt,

        createdAt:
            new Date()
            .toISOString()

    });


    saveHistory();

    closeModal();

    renderHistory();

    showToast(
        "Conversation added."
    );

}


/* =========================
   OPEN CONVERSATION
========================= */

function openConversation(id){

    const item =
        historyData.find(
            history =>
                history.id === id
        );


    if(!item){
        return;
    }


    showToast(
        "Opening: " +
        item.title
    );

}


/* =========================
   COPY PROMPT
========================= */

async function copyPrompt(id){

    const item =
        historyData.find(
            history =>
                history.id === id
        );


    if(!item){
        return;
    }


    try{

        await navigator.clipboard.writeText(
            item.prompt
        );

        showToast(
            "Prompt copied."
        );

    }catch(error){

        showToast(
            "Unable to copy prompt."
        );

    }

}


/* =========================
   DELETE
========================= */

function deleteHistory(id){

    const item =
        historyData.find(
            history =>
                history.id === id
        );


    if(!item){
        return;
    }


    if(
        !confirm(
            "Delete this AI conversation?"
        )
    ){

        return;

    }


    historyData =
        historyData.filter(
            history =>
                history.id !== id
        );


    saveHistory();

    renderHistory();

    showToast(
        "Conversation deleted."
    );

}


/* =========================
   CLEAR ALL
========================= */

function clearHistory(){

    if(
        !historyData.length
    ){

        showToast(
            "History is already empty."
        );

        return;

    }


    if(
        !confirm(
            "Delete all AI history?"
        )
    ){

        return;

    }


    historyData = [];

    saveHistory();

    renderHistory();

    showToast(
        "AI history cleared."
    );

}


/* =========================
   DATE
========================= */

function formatDate(
    value
){

    const date =
        new Date(value);


    return date.toLocaleString(
        [],
        {
            year:"numeric",
            month:"short",
            day:"numeric",
            hour:"numeric",
            minute:"2-digit"
        }
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   TOAST
========================= */

let toastTimer = null;

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================
   MODAL EVENTS
========================= */

document.getElementById(
    "modal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closeModal();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event){

    if(
        event.key === "Escape"
    ){

        closeModal();

    }

});


/* =========================
   START PAGE
========================= */

loadHistory();

renderHistory();

</script>

</body>
</html>
