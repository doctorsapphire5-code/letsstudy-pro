<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Skills | Let's Study Pro</title>

  <meta
    name="description"
    content="Explore AI skills, learning paths, skill levels, progress tracking and career opportunities."
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #8b5cf6;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #ef4444;
      --dark: #0f172a;
      --text: #334155;
      --muted: #64748b;
      --light: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow:
        0 12px 35px rgba(15, 23, 42, .08);
      --radius: 18px;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: var(--light);
      line-height: 1.6;
    }


    button,
    input,
    select {
      font: inherit;
    }


    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    /* ================================
       NAVIGATION
    ================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }


    .nav {
      max-width: 1180px;
      margin: auto;
      min-height: 70px;
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 18px;
      font-weight: 800;
      color: var(--dark);
    }


    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;

      display: grid;
      place-items: center;

      color: white;
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--secondary)
        );
    }


    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .nav-links a {
      padding: 9px 13px;
      border-radius: 9px;

      font-size: 14px;
      font-weight: 600;
      color: var(--muted);

      transition: .2s ease;
    }


    .nav-links a:hover {
      color: var(--primary);
      background: #eef2ff;
    }


    .menu-btn {
      display: none;

      border: 0;
      background: transparent;

      width: 42px;
      height: 42px;

      border-radius: 10px;

      color: var(--dark);
      cursor: pointer;
    }


    /* ================================
       HERO
    ================================= */

    .hero {
      color: white;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(255,255,255,.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 70%,
          rgba(255,255,255,.12),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #312e81,
          #6366f1 55%,
          #8b5cf6
        );

      padding: 80px 20px 105px;
    }


    .hero-inner {
      max-width: 1180px;
      margin: auto;

      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 55px;
      align-items: center;
    }


    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 7px 12px;

      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;

      background: rgba(255,255,255,.1);

      font-size: 12px;
      font-weight: 800;
      letter-spacing: .7px;
    }


    .hero h1 {
      margin-top: 18px;

      font-size:
        clamp(
          38px,
          6vw,
          64px
        );

      line-height: 1.03;
      letter-spacing: -2px;
    }


    .hero p {
      max-width: 650px;
      margin-top: 20px;

      color: rgba(255,255,255,.86);
      font-size: 17px;
    }


    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }


    .btn {
      border: 0;
      cursor: pointer;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      min-height: 44px;
      padding: 10px 17px;

      border-radius: 11px;

      font-size: 13px;
      font-weight: 700;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }


    .btn:hover {
      transform: translateY(-1px);
    }


    .btn-primary {
      color: white;
      background: var(--primary);
      box-shadow:
        0 8px 20px
        rgba(99,102,241,.22);
    }


    .btn-primary:hover {
      background: var(--primary-dark);
    }


    .btn-light {
      color: var(--dark);
      background: white;
    }


    .btn-secondary {
      color: var(--dark);
      background: #f1f5f9;
    }


    .hero-card {
      min-height: 310px;

      padding: 25px;

      border:
        1px solid
        rgba(255,255,255,.18);

      border-radius: 25px;

      background:
        rgba(255,255,255,.11);

      backdrop-filter: blur(15px);

      box-shadow:
        0 25px 70px
        rgba(15,23,42,.16);
    }


    .brain-icon {
      width: 80px;
      height: 80px;

      display: grid;
      place-items: center;

      margin-bottom: 20px;

      border-radius: 22px;

      color: white;
      background:
        rgba(255,255,255,.15);

      font-size: 38px;
    }


    .hero-card h2 {
      color: white;
      font-size: 22px;
    }


    .hero-card p {
      font-size: 14px;
    }


    .hero-mini-stats {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;
      margin-top: 20px;
    }


    .hero-mini-stat {
      padding: 12px;

      border-radius: 12px;

      background:
        rgba(255,255,255,.1);
    }


    .hero-mini-stat strong {
      display: block;
      color: white;
      font-size: 20px;
    }


    .hero-mini-stat span {
      color:
        rgba(255,255,255,.7);
      font-size: 10px;
    }


    /* ================================
       MAIN
    ================================= */

    .section {
      max-width: 1180px;
      margin: auto;
      padding: 70px 20px;
    }


    .section-heading {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 32px;
    }


    .section-heading h2 {
      color: var(--dark);
      font-size:
        clamp(
          28px,
          4vw,
          38px
        );
      line-height: 1.15;
    }


    .section-heading p {
      margin-top: 10px;
      color: var(--muted);
    }


    /* ================================
       STATS
    ================================= */

    .stats {
      margin-top: -38px;

      position: relative;
      z-index: 5;

      display: grid;
      grid-template-columns:
        repeat(4, 1fr);

      gap: 14px;
    }


    .stat-card {
      padding: 20px;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: 16px;

      box-shadow: var(--shadow);
    }


    .stat-card i {
      color: var(--primary);
      font-size: 20px;
    }


    .stat-card strong {
      display: block;

      margin-top: 5px;

      color: var(--dark);
      font-size: 24px;
    }


    .stat-card span {
      color: var(--muted);
      font-size: 12px;
    }


    /* ================================
       CONTROLS
    ================================= */

    .controls {
      padding: 20px;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      margin-bottom: 25px;
    }


    .search-box {
      position: relative;
    }


    .search-box i {
      position: absolute;

      left: 15px;
      top: 50%;

      transform:
        translateY(-50%);

      color: var(--muted);
    }


    .search-box input {
      width: 100%;

      min-height: 48px;

      padding:
        0 16px 0 43px;

      border:
        1px solid
        var(--border);

      border-radius: 11px;

      outline: none;

      color: var(--dark);

      transition: .2s ease;
    }


    .search-box input:focus {
      border-color:
        var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(99,102,241,.1);
    }


    .filters {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      margin-top: 12px;
    }


    select {
      width: 100%;

      min-height: 44px;

      padding: 0 12px;

      border:
        1px solid
        var(--border);

      border-radius: 10px;

      outline: none;

      color: var(--text);
      background: white;

      cursor: pointer;
    }


    select:focus {
      border-color:
        var(--primary);
    }


    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 18px;
    }


    .results-count {
      color: var(--muted);
      font-size: 13px;
    }


    .results-count strong {
      color: var(--dark);
    }


    .sort-select {
      width: auto;
      min-width: 170px;
    }


    /* ================================
       SKILLS GRID
    ================================= */

    .skills-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;
    }


    .skill-card {
      overflow: hidden;

      display: flex;
      flex-direction: column;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: var(--radius);

      box-shadow:
        0 7px 25px
        rgba(15,23,42,.05);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }


    .skill-card:hover {
      transform:
        translateY(-4px);

      box-shadow:
        var(--shadow);
    }


    .skill-top {
      position: relative;

      min-height: 130px;

      padding: 22px;

      display: flex;
      align-items: center;
      gap: 15px;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f5f3ff
        );
    }


    .skill-icon {
      width: 58px;
      height: 58px;

      flex: 0 0 58px;

      display: grid;
      place-items: center;

      border-radius: 16px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--secondary)
        );

      font-size: 24px;
    }


    .skill-title-wrap {
      padding-right: 35px;
    }


    .skill-title-wrap h3 {
      color: var(--dark);
      font-size: 17px;
      line-height: 1.25;
    }


    .category {
      display: inline-block;

      margin-top: 5px;

      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
    }


    .bookmark {
      position: absolute;

      top: 17px;
      right: 17px;

      width: 35px;
      height: 35px;

      display: grid;
      place-items: center;

      border: 0;
      border-radius: 9px;

      color: var(--muted);
      background: white;

      cursor: pointer;
    }


    .bookmark.saved {
      color: var(--primary);
      background: #eef2ff;
    }


    .skill-body {
      padding: 20px;
      flex: 1;
    }


    .skill-description {
      color: var(--muted);
      font-size: 13px;
    }


    .skill-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      margin-top: 14px;
    }


    .badge {
      padding: 5px 8px;

      border-radius: 7px;

      background: #f1f5f9;

      color: var(--muted);

      font-size: 10px;
      font-weight: 700;
    }


    .badge.beginner {
      color: #166534;
      background: #dcfce7;
    }


    .badge.intermediate {
      color: #92400e;
      background: #fef3c7;
    }


    .badge.advanced {
      color: #991b1b;
      background: #fee2e2;
    }


    .progress-area {
      margin-top: 18px;
    }


    .progress-header {
      display: flex;
      justify-content: space-between;

      margin-bottom: 6px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 600;
    }


    .progress {
      height: 7px;

      overflow: hidden;

      border-radius: 999px;

      background: #e2e8f0;
    }


    .progress-bar {
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          var(--secondary)
        );

      transition:
        width .3s ease;
    }


    .skill-footer {
      display: flex;
      gap: 8px;

      padding-top: 17px;
    }


    .skill-footer .btn:first-child {
      flex: 1;
    }


    .btn-small {
      min-height: 38px;
      padding: 7px 11px;

      font-size: 11px;
    }


    /* ================================
       EMPTY STATE
    ================================= */

    .empty {
      display: none;

      padding: 60px 20px;

      text-align: center;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: var(--radius);
    }


    .empty.show {
      display: block;
    }


    .empty-icon {
      width: 70px;
      height: 70px;

      display: grid;
      place-items: center;

      margin: auto;

      border-radius: 20px;

      color: var(--primary);
      background: #eef2ff;

      font-size: 28px;
    }


    .empty h3 {
      margin-top: 15px;
      color: var(--dark);
    }


    .empty p {
      margin: 6px 0 18px;
      color: var(--muted);
      font-size: 13px;
    }


    /* ================================
       LEARNING PATHS
    ================================= */

    .paths {
      background: white;
    }


    .path-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;
    }


    .path-card {
      padding: 25px;

      border:
        1px solid
        var(--border);

      border-radius: 17px;

      background: var(--light);
    }


    .path-card i {
      color: var(--primary);
      font-size: 26px;
    }


    .path-card h3 {
      margin-top: 13px;
      color: var(--dark);
    }


    .path-card p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }


    .path-card ul {
      margin-top: 15px;
      padding-left: 18px;

      color: var(--muted);
      font-size: 12px;
    }


    /* ================================
       MODAL
    ================================= */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 2000;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(15,23,42,.65);

      backdrop-filter: blur(5px);
    }


    .modal.show {
      display: flex;
    }


    .modal-box {
      width: min(
        720px,
        100%
      );

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 20px;

      box-shadow:
        0 30px 80px
        rgba(15,23,42,.25);
    }


    .modal-header {
      position: relative;

      padding: 27px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #3730a3,
          #7c3aed
        );
    }


    .modal-header h2 {
      padding-right: 40px;
      font-size: 25px;
    }


    .modal-header p {
      margin-top: 8px;

      color:
        rgba(255,255,255,.8);

      font-size: 13px;
    }


    .close-modal {
      position: absolute;

      top: 18px;
      right: 18px;

      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border: 0;
      border-radius: 10px;

      color: white;
      background:
        rgba(255,255,255,.13);

      cursor: pointer;
    }


    .modal-body {
      padding: 27px;
    }


    .modal-stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;
    }


    .modal-stat {
      padding: 13px;

      border:
        1px solid
        var(--border);

      border-radius: 11px;

      background: var(--light);
    }


    .modal-stat small {
      display: block;

      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }


    .modal-stat strong {
      display: block;

      margin-top: 3px;

      color: var(--dark);
      font-size: 13px;
    }


    .modal-section {
      margin-top: 24px;
    }


    .modal-section h3 {
      color: var(--dark);
      font-size: 17px;
    }


    .modal-section p {
      margin-top: 7px;

      color: var(--muted);
      font-size: 13px;
    }


    .topic-list {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px;

      margin-top: 12px;

      list-style: none;
    }


    .topic-list li {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 9px;

      border-radius: 9px;

      background: #f8fafc;

      color: var(--text);

      font-size: 12px;
    }


    .topic-list i {
      color: var(--success);
    }


    .career-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      margin-top: 12px;
    }


    .career-tag {
      padding: 6px 9px;

      border-radius: 8px;

      color: var(--primary);
      background: #eef2ff;

      font-size: 10px;
      font-weight: 700;
    }


    .modal-actions {
      display: flex;
      gap: 10px;

      margin-top: 25px;
    }


    .modal-actions .btn:first-child {
      flex: 1;
    }


    /* ================================
       TOAST
    ================================= */

    .toast {
      position: fixed;

      z-index: 4000;

      right: 20px;
      bottom: 20px;

      max-width: 350px;

      padding: 13px 16px;

      border-radius: 11px;

      color: white;
      background: #0f172a;

      box-shadow:
        0 15px 40px
        rgba(15,23,42,.25);

      transform:
        translateY(90px);

      opacity: 0;

      pointer-events: none;

      transition: .25s ease;

      font-size: 12px;
    }


    .toast.show {
      transform:
        translateY(0);

      opacity: 1;
    }


    /* ================================
       FOOTER
    ================================= */

    footer {
      padding: 35px 20px;

      text-align: center;

      color: var(--muted);

      background: #f1f5f9;

      border-top:
        1px solid
        var(--border);

      font-size: 12px;
    }


    /* ================================
       RESPONSIVE
    ================================= */

    @media (max-width: 1000px) {

      .skills-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .hero-inner {
        grid-template-columns: 1fr;
      }

      .hero-card {
        display: none;
      }

      .filters {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .path-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 760px) {

      .menu-btn {
        display: block;
      }


      .nav-links {
        position: absolute;

        display: none;

        top: 70px;
        left: 15px;
        right: 15px;

        flex-direction: column;
        align-items: stretch;

        padding: 8px;

        background: white;

        border:
          1px solid
          var(--border);

        border-radius: 14px;

              box-shadow: var(--shadow);
    }

    .course-card:hover {
      transform: translateY(-4px);
    }

    .course-cover {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
    }

    .course-content {
      padding: 20px;
    }

    .course-content h3 {
      margin: 0 0 10px;
      color: var(--text);
    }

    .course-content p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .course-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 20px;
      background: #eef2ff;
      color: #4338ca;
      font-size: .8rem;
      font-weight: 600;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      transition: .2s;
    }

    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: var(--card);
      border-radius: 16px;
      padding: 25px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .close {
      position: absolute;
      right: 18px;
      top: 15px;
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      color: var(--muted);
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .modal-box li {
      margin: 10px 0;
      color: var(--muted);
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      header {
        padding: 40px 18px;
      }

      header h1 {
        font-size: 2rem;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .course-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <div class="eyebrow">
        <i class="fa-solid fa-robot"></i>
        Career Skills
      </div>

      <h1>AI Skills</h1>

      <p>
        Build practical Artificial Intelligence skills for modern
        careers, from beginner concepts to advanced AI development.
      </p>

  </header>

  <main class="container">

    <!-- FILTERS -->
    <section class="filters">

      <div class="filter-group">
        <label for="search">Search</label>
        <div class="input-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="search"
            id="search"
            placeholder="Search AI skills..."
          >
        </div>
      </div>

      <div class="filter-group">
        <label for="level">Level</label>
        <select id="level">
          <option value="all">All Levels</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="all">All Categories</option>
          <option value="AI Fundamentals">AI Fundamentals</option>
          <option value="Machine Learning">Machine Learning</option>
          <option value="Deep Learning">Deep Learning</option>
          <option value="Generative AI">Generative AI</option>
          <option value="AI Development">AI Development</option>
          <option value="AI Ethics">AI Ethics</option>
        </select>
      </div>

    </section>

    <div class="result-bar">
      <strong id="resultCount">0 skills</strong>

      <select id="sort">
        <option value="popularity">Most Popular</option>
        <option value="az">A-Z</option>
        <option value="level">Level</option>
      </select>
    </div>

    <!-- AI SKILLS -->
    <section class="course-grid" id="courseGrid"></section>

  </main>

  <!-- DETAILS MODAL -->
  <div class="modal" id="detailsModal">

    <div class="modal-box">

      <button
        type="button"
        class="close"
        id="closeModal"
        aria-label="Close"
      >
        &times;
      </button>

      <div id="modalContent"></div>

    </div>

  </div>

  <footer>
    <p>
      © 2026 AI Skills Learning Platform
    </p>
  </footer>


  <script>
    /* =========================================
       AI SKILLS DATA
    ========================================= */

    const aiSkills = [

      {
        id: 1,
        title: "AI Fundamentals",
        category: "AI Fundamentals",
        level: "Beginner",
        duration: "4 weeks",
        popularity: 98,
        icon: "fa-solid fa-brain",
        cover: "ai",
        description:
          "Learn the core concepts behind Artificial Intelligence, intelligent systems, data, and automation.",
        skills: [

      {

        ]
      },

      {

        category: "Generative AI",

        popularity: 100,

        skills: [

        ]

      {

        cover: "vision",

        skills: [

        ]
      },

      {

        popularity: 94,
        icon: "fa-solid fa-language",
        cover: "nlp",

          "Learn how computers process, understand, and generate human language.",
        skills: [

        ]
      },

      {

        popularity: 93,
        icon: "fa-solid fa-robot",
        cover: "automation",
        description:
          "Use AI to automate repetitive tasks and create intelligent business workflows.",
        skills: [
          "Workflow automation",

        ]
      },

      {
        id: 10,

        category: "AI Ethics",
        level: "Beginner",
        duration: "3 weeks",
        popularity: 88,
        icon: "fa-solid fa-scale-balanced",
        cover: "ethics",
        description:
          "Understand responsible AI development, fairness, privacy, transparency, and safety.",
        skills: [
          "Responsible AI",
          "Bias and fairness",
          "Privacy",

          "AI governance"
        ]
      },

      {
        id: 11,
        title: "AI Agents",
        category: "AI Development",
        level: "Advanced",
        duration: "8 weeks",
        popularity: 99,
        icon: "fa-solid fa-diagram-project",
        cover: "agents",
        description:
          "Learn how autonomous AI agents reason, use tools, and complete multi-step tasks.",
        skills: [
          "Agent architecture",
          "Tool calling",
          "Memory",
          "Planning",
          "Multi-agent systems"
        ]
      },

      {
        id: 12,
        title: "Data Science for AI",
        category: "Machine Learning",
        level: "Intermediate",
        duration: "8 weeks",
        popularity: 91,
        icon: "fa-solid fa-chart-line",
        cover: "data",
        description:
          "Build the data analysis and visualization skills required for AI projects.",
        skills: [
          "Data analysis",
          "Data cleaning",
          "Statistics",
          "Data visualization",
          "Feature engineering"
        ]
      }

    ];


    /* =========================================
       DOM ELEMENTS
    ========================================= */

    const grid =
      document.getElementById("courseGrid");

    const searchInput =
      document.getElementById("search");

    const levelSelect =
      document.getElementById("level");

    const categorySelect =
      document.getElementById("category");

    const sortSelect =
      document.getElementById("sort");

    const resultCount =
      document.getElementById("resultCount");

    const modal =
      document.getElementById("detailsModal");

    const modalContent =
      document.getElementById("modalContent");

    const closeModal =
      document.getElementById("closeModal");


    /* =========================================
       RENDER CARDS
    ========================================= */

    function renderSkills(list) {

      if (!list.length) {

        grid.innerHTML = `
          <div class="empty">
            <i
              class="fa-solid fa-magnifying-glass"
              style="font-size:3rem;margin-bottom:15px;"
            ></i>

            <h2>No AI skills found</h2>

            <p>
              Try another search term or change your filters.
            </p>
          </div>
        `;

        resultCount.textContent = "0 skills";

        return;
      }


      grid.innerHTML = list.map(skill => `

        <article class="course-card">

          <div class="course-cover cover-${skill.cover}">
            <i class="${skill.icon}"></i>
          </div>

          <div class="course-content">

            <div class="course-meta">

              <span class="badge">
                ${escapeHTML(skill.level)}
              </span>

              <span class="badge">
                ${escapeHTML(skill.category)}
              </span>

            </div>

            <h3>
              ${escapeHTML(skill.title)}
            </h3>

            <p>
              ${escapeHTML(skill.description)}
            </p>

            <div class="course-meta">

              <span class="badge">
                <i class="fa-regular fa-clock"></i>
                ${escapeHTML(skill.duration)}
              </span>

              <span class="badge">
                <i class="fa-solid fa-fire"></i>
                ${skill.popularity}%
              </span>

            </div>

            <button
              type="button"
              class="btn btn-primary"
              onclick="showDetails(${skill.id})"
            >
              View Details
            </button>

          </div>

        </article>

      `).join("");

      resultCount.textContent =
        `${list.length} skill${list.length === 1 ? "" : "s"}`;
    }


    /* =========================================
       FILTER + SEARCH
    ========================================= */

    function filterSkills() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();

      const level =
        levelSelect.value;

      const category =
        categorySelect.value;


      let filtered =
        aiSkills.filter(skill => {

          const searchableText = [
            skill.title,
            skill.category,
            skill.level,
            skill.description,
            ...skill.skills
          ]
            .join(" ")
            .toLowerCase();


          const matchesSearch =
            !search ||
            searchableText.includes(search);


          const matchesLevel =
            level === "all" ||
            skill.level === level;


          const matchesCategory =
            category === "all" ||
            skill.category === category;


          return (
            matchesSearch &&
            matchesLevel &&
            matchesCategory
          );

        });


      /* SORT */

      switch (sortSelect.value) {

        case "az":

          filtered.sort((a, b) =>
            a.title.localeCompare(b.title)
          );

          break;


        case "level":

          const order = {
            Beginner: 1,
            Intermediate: 2,
            Advanced: 3
          };

          filtered.sort((a, b) =>
            order[a.level] - order[b.level]
          );

          break;


        case "popularity":
        default:

          filtered.sort((a, b) =>
            b.popularity - a.popularity
          );

          break;
      }


      renderSkills(filtered);
    }


    /* =========================================
       DETAILS
    ========================================= */

    function showDetails(id) {

      const skill =
        aiSkills.find(item => item.id === id);

      if (!skill) return;


      modalContent.innerHTML = `

        <div class="course-cover cover-${skill.cover}"
             style="border-radius:12px;margin-bottom:20px;">
          <i class="${skill.icon}"></i>
        </div>

        <span class="badge">
          ${escapeHTML(skill.category)}
        </span>

        <h2>
          ${escapeHTML(skill.title)}
        </h2>

        <p>
          ${escapeHTML(skill.description)}
        </p>

        <p>
          <strong>Level:</strong>
          ${escapeHTML(skill.level)}
        </p>

        <p>
          <strong>Duration:</strong>
          ${escapeHTML(skill.duration)}
        </p>

        <h3>Skills you will learn</h3>

        <ul>
          ${skill.skills.map(item => `
            <li>
              ${escapeHTML(item)}
            </li>
          `).join("")}
        </ul>

        <button
          type="button"
          class="btn btn-primary"
          onclick="startLearning(${skill.id})"
        >
          Start Learning
        </button>

      `;

      modal.classList.add("active");

      document.body.style.overflow = "hidden";
    }


    /* =========================================
       START LEARNING
    ========================================= */

    function startLearning(id) {

      const skill =
        aiSkills.find(item => item.id === id);

      if (!skill) return;

      alert(
        `You selected "${skill.title}". Learning content can be connected here.`
      );
    }


    /* =========================================
       CLOSE MODAL
    ========================================= */

    closeModal.addEventListener(
      "click",
      closeDetails
    );


    modal.addEventListener(
      "click",
      event => {

        if (event.target === modal) {
          closeDetails();
        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (event.key === "Escape") {
          closeDetails();
        }

      }
    );


    function closeDetails() {

      modal.classList.remove("active");

      document.body.style.overflow = "";

    }


    /* =========================================
       SECURITY
       Prevent HTML injection when displaying
       dynamic text.
    ========================================= */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================
       EVENTS
    ========================================= */

    searchInput.addEventListener(
      "input",
      filterSkills
    );

    levelSelect.addEventListener(
      "change",
      filterSkills
    );

    categorySelect.addEventListener(
      "change",
      filterSkills
    );

    sortSelect.addEventListener(
      "change",
      filterSkills
    );


    /* =========================================
       INITIAL LOAD
    ========================================= */

    renderSkills(
      [...aiSkills].sort(
        (a, b) => b.popularity - a.popularity
      )
    );

  </script>

</body>
</html>
