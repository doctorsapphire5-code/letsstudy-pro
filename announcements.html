<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course Announcements | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f6f8fc;
  color:#101828;
  line-height:1.6
}

.header{
  background:#fff;
  border-bottom:1px solid #eaecf0;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:10
}

.header-inner{
  width:min(1100px,100%);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.logo{
  color:#155eef;
  font-size:21px;
  font-weight:900
}

.back{
  text-decoration:none;
  color:#475467;
  font-weight:700;
  font-size:14px
}

.container{
  width:min(1100px,100%);
  margin:auto;
  padding:30px 16px 60px
}

.hero{
  margin-bottom:25px
}

.hero h1{
  font-size:32px;
  line-height:1.2;
  margin-bottom:7px
}

.hero p{
  color:#667085
}

.course-id{
  display:inline-block;
  margin-top:12px;
  padding:6px 11px;
  border-radius:20px;
  background:#eef4ff;
  color:#155eef;
  font-size:12px;
  font-weight:800
}

.toolbar{
  background:#fff;
  border:1px solid #eaecf0;
  border-radius:15px;
  padding:15px;
  margin-bottom:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.search{
  flex:1;
  min-width:220px;
  padding:12px 14px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  outline:none
}

select{
  padding:12px 14px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  background:#fff;
  outline:none
}

.search:focus,
select:focus{
  border-color:#155eef;
  box-shadow:0 0 0 3px #155eef12
}

.list{
  display:grid;
  gap:15px
}

.announcement{
  background:#fff;
  border:1px solid #eaecf0;
  border-radius:17px;
  padding:21px;
  transition:.2s
}

.announcement:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px #1018280d
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px
}

.title{
  font-size:19px;
  font-weight:850
}

.priority{
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap
}

.priority.high{
  background:#fee4e2;
  color:#b42318
}

.priority.medium{
  background:#fff4e5;
  color:#b54708
}

.priority.low{
  background:#ecfdf3;
  color:#027a48
}

.message{
  margin-top:12px;
  color:#475467;
  white-space:pre-wrap
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:17px;
  padding-top:14px;
  border-top:1px solid #f2f4f7
}

.meta span{
  font-size:12px;
  color:#667085
}

.loading,
.empty,
.error{
  background:#fff;
  border:1px solid #eaecf0;
  border-radius:16px;
  padding:40px 20px;
  text-align:center
}

.loading{
  color:#667085
}

.empty h3{
  margin-bottom:5px
}

.empty p{
  color:#667085
}

.error{
  background:#fef3f2;
  border-color:#fecdca;
  color:#b42318;
  display:none
}

.footer{
  text-align:center;
  color:#98a2b3;
  font-size:13px;
  margin-top:40px
}

@media(max-width:600px){

.hero h1{
  font-size:27px
}

.top{
  flex-direction:column
}

.priority{
  align-self:flex-start
}

.toolbar{
  flex-direction:column
}

.search,
select{
  width:100%
}

}
</style>
</head>

<body>

<header class="header">

<div class="header-inner">

<div class="logo">
LetsStudy Pro
</div>

<a
href="javascript:history.back()"
class="back">

← Back

</a>

</div>

</header>


<main class="container">

<section class="hero">

<h1>
Course Announcements
</h1>

<p>
Stay updated with the latest announcements, news and important course information.
</p>

<span
id="courseIdBadge"
class="course-id">

Loading course...

</span>

</section>


<div
id="error"
class="error">
</div>


<div class="toolbar">

<input
id="search"
class="search"
type="search"
placeholder="Search announcements..."
>

<select id="priority">

<option value="">
All priorities
</option>

<option value="high">
High Priority
</option>

<option value="medium">
Medium Priority
</option>

<option value="low">
Low Priority
</option>

</select>

</div>


<section id="announcementList" class="list">

<div class="loading">
Loading announcements...
</div>

</section>


<div class="footer">
© LetsStudy Pro • Course Learning Platform
</div>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================
FIREBASE
===================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBcXKAVXKbXkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =====================================
COURSE ID
===================================== */

const params =
new URLSearchParams(
window.location.search
);

const courseId =
params.get("courseId");


const list =
document.getElementById(
"announcementList"
);


const error =
document.getElementById(
"error"
);


document.getElementById(
"courseIdBadge"
).textContent =
courseId
? `Course ID: ${courseId}`
: "All Course Announcements";


/* =====================================
DATA
===================================== */

let announcements = [];


/* =====================================
LOAD FIRESTORE
===================================== */

async function loadAnnouncements(){

try{

const snapshot =
await getDocs(
collection(
db,
"announcements"
)
);


announcements =
snapshot.docs
.map(doc => ({

id:doc.id,
...doc.data()

}))
.filter(item => {

if(!courseId)
return true;

return String(
item.courseId || ""
).trim() === String(
courseId
).trim();

});


/*
Sort newest/publish date first
*/

announcements.sort(
(a,b) =>
getTime(b.publishDate) -
getTime(a.publishDate)
);


render();


}catch(err){

console.error(err);

error.textContent =
"Unable to load announcements: " +
err.message;

error.style.display =
"block";

list.innerHTML = "";

}

}


/* =====================================
RENDER
===================================== */

function render(){

const search =
document.getElementById(
"search"
).value
.toLowerCase()
.trim();


const selectedPriority =
document.getElementById(
"priority"
).value
.toLowerCase();


const filtered =
announcements.filter(item => {

const title =
String(
item.title || ""
).toLowerCase();

const message =
String(
item.message || ""
).toLowerCase();

const priority =
String(
item.priority || ""
).toLowerCase();


const matchesSearch =
!search ||
title.includes(search) ||
message.includes(search);


const matchesPriority =
!selectedPriority ||
priority === selectedPriority;


return (
matchesSearch &&
matchesPriority
);

});


if(!filtered.length){

list.innerHTML = `

<div class="empty">

<h3>
No announcements found
</h3>

<p>
There are currently no announcements matching your search.
</p>

</div>

`;

return;

}


list.innerHTML =
filtered
.map(createAnnouncement)
.join("");

}


/* =====================================
ANNOUNCEMENT CARD
===================================== */

function createAnnouncement(item){

const priority =
String(
item.priority || "medium"
).toLowerCase();


const safePriority =
["high","medium","low"]
.includes(priority)
? priority
: "medium";


return `

<article class="announcement">

<div class="top">

<h2 class="title">

${escapeHTML(
item.title ||
"Untitled Announcement"
)}

</h2>


<span class="priority ${safePriority}">

${escapeHTML(
safePriority
)}

</span>

</div>


<div class="message">

${escapeHTML(
item.message ||
"No message available."
)}

</div>


<div class="meta">

<span>
📅 ${formatDate(item.publishDate)}
</span>

<span>
• Course: ${escapeHTML(
item.courseId || "-"
)}
</span>

</div>

</article>

`;

}


/* =====================================
SEARCH
===================================== */

document
.getElementById("search")
.addEventListener(
"input",
render
);


document
.getElementById("priority")
.addEventListener(
"change",
render
);


/* =====================================
DATE
===================================== */

function getTime(value){

if(!value)
return 0;

if(typeof value.toDate === "function")
return value.toDate().getTime();

if(value.seconds)
return value.seconds * 1000;

const date =
new Date(value);

return isNaN(
date.getTime()
)
? 0
: date.getTime();

}


function formatDate(value){

const time =
getTime(value);

if(!time)
return "Date not specified";

return new Date(time)
.toLocaleString(
undefined,
{
dateStyle:"medium",
timeStyle:"short"
}
);

}


/* =====================================
ESCAPE HTML
===================================== */

function escapeHTML(value){

return String(
value ?? ""
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================
START
===================================== */

loadAnnouncements();

</script>

</body>
</html>
