<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointments</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#172033;
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.header h1{
    margin:0;
    font-size:19px;
}

.container{
    max-width:1150px;
    margin:auto;
    padding:24px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.primary{
    background:#7c3aed;
    color:#fff;
}

.secondary{
    background:#e2e8f0;
    color:#334155;
}

.danger{
    background:#fee2e2;
    color:#b91c1c;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search{
    flex:1;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
}

select{
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:#fff;
}

.appointment-list{
    display:grid;
    gap:12px;
}

.appointment{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:17px;
    display:grid;
    grid-template-columns:85px 1fr auto;
    gap:18px;
    align-items:center;
}

.date-box{
    text-align:center;
    border-right:1px solid #e2e8f0;
    padding-right:16px;
}

.day{
    font-size:26px;
    font-weight:900;
}

.month{
    color:#7c3aed;
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
}

.appointment h2{
    margin:0 0 7px;
    font-size:15px;
}

.meta{
    color:#64748b;
    font-size:10px;
    line-height:1.8;
}

.status{
    display:inline-block;
    margin-top:7px;
    padding:4px 8px;
    border-radius:20px;
    font-size:9px;
    font-weight:900;
}

.scheduled{
    background:#dbeafe;
    color:#1d4ed8;
}

.confirmed{
    background:#dcfce7;
    color:#166534;
}

.completed{
    background:#e2e8f0;
    color:#475569;
}

.cancelled{
    background:#fee2e2;
    color:#b91c1c;
}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.empty{
    text-align:center;
    padding:70px;
    color:#64748b;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:12px;
    padding:22px;
}

.modal-card h2{
    margin-top:0;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    color:#64748b;
    font-size:9px;
    font-weight:900;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

@media(max-width:700px){
    .header{padding:0 12px}
    .container{padding:12px}

    .appointment{
        grid-template-columns:1fr;
    }

    .date-box{
        text-align:left;
        border-right:0;
        border-bottom:1px solid #e2e8f0;
        padding:0 0 10px;
    }

    .form-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>Appointments</h1>

    <button
        class="primary"
        onclick="openAppointmentModal()">
        + New Appointment
    </button>

</header>


<main class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search appointments..."
            oninput="renderAppointments()">

        <select
            id="filter"
            onchange="renderAppointments()">

            <option value="all">All</option>
            <option value="scheduled">Scheduled</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>

        </select>

    </div>


    <section
        id="appointmentList"
        class="appointment-list">
    </section>


    <div
        id="empty"
        class="empty"
        style="display:none">

        No appointments found.

    </div>

</main>


<div
    id="appointmentModal"
    class="modal">

    <div class="modal-card">

        <h2>New Appointment</h2>


        <div class="form-group">

            <label>CLIENT NAME</label>

            <input
                id="clientName"
                placeholder="Client name">

        </div>


        <div class="form-group">

            <label>EMAIL</label>

            <input
                id="clientEmail"
                type="email"
                placeholder="client@example.com">

        </div>


        <div class="form-group">

            <label>APPOINTMENT TITLE</label>

            <input
                id="appointmentTitle"
                placeholder="Consultation">

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>DATE</label>

                <input
                    id="appointmentDate"
                    type="date">

            </div>


            <div class="form-group">

                <label>TIME</label>

                <input
                    id="appointmentTime"
                    type="time">

            </div>

        </div>


        <div class="form-group">

            <label>STATUS</label>

            <select id="appointmentStatus">

                <option value="scheduled">
                    Scheduled
                </option>

                <option value="confirmed">
                    Confirmed
                </option>

                <option value="completed">
                    Completed
                </option>

                <option value="cancelled">
                    Cancelled
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>NOTES</label>

            <textarea
                id="appointmentNotes"
                rows="4"
                placeholder="Appointment notes..."></textarea>

        </div>


        <div class="modal-actions">

            <button
                class="secondary"
                onclick="closeAppointmentModal()">
                Cancel
            </button>

            <button
                class="primary"
                onclick="createAppointment()">
                Create Appointment
            </button>

        </div>

    </div>

</div>


<script>

const STORAGE_KEY =
    "appointments-data";

let appointments = [];


/* =========================
   LOAD
========================= */

function loadAppointments(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if(saved){

        try{
            appointments =
                JSON.parse(saved);
        }catch(error){
            appointments = [];
        }

    }

    if(!Array.isArray(appointments)){
        appointments = [];
    }

}


/* =========================
   SAVE
========================= */

function saveAppointments(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            appointments
        )
    );

}


/* =========================
   RENDER
========================= */

function renderAppointments(){

    const list =
        document.getElementById(
            "appointmentList"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const query =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();

    const filter =
        document.getElementById(
            "filter"
        ).value;


    list.innerHTML = "";


    const filtered =
        appointments
        .filter(
            appointment => {

                const text =
                    (
                        appointment.clientName +
                        " " +
                        appointment.clientEmail +
                        " " +
                        appointment.title +
                        " " +
                        appointment.notes
                    )
                    .toLowerCase();


                if(
                    !text.includes(
                        query
                    )
                ){
                    return false;
                }


                if(
                    filter !== "all" &&
                    appointment.status !== filter
                ){
                    return false;
                }


                return true;

            }
        )
        .sort(
            (a,b) =>
                new Date(
                    a.date +
                    "T" +
                    a.time
                ) -
                new Date(
                    b.date +
                    "T" +
                    b.time
                )
        );


    if(!filtered.length){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        appointment => {

            const date =
                new Date(
                    appointment.date +
                    "T" +
                    appointment.time
                );


            const article =
                document.createElement(
                    "article"
                );

            article.className =
                "appointment";


            article.innerHTML = `

                <div class="date-box">

                    <div class="day">
                        ${date.getDate()}
                    </div>

                    <div class="month">
                        ${date.toLocaleString(
                            "en",
                            {month:"short"}
                        )}
                    </div>

                </div>


                <div>

                    <h2>
                        ${escapeHTML(
                            appointment.title
                        )}
                    </h2>

                    <div class="meta">

                        <strong>
                            ${escapeHTML(
                                appointment.clientName
                            )}
                        </strong>

                        <br>

                        ${escapeHTML(
                            appointment.clientEmail
                        )}

                        <br>

                        ${escapeHTML(
                            appointment.time
                        )}

                        ${
                            appointment.notes
                                ? `
                                    <br>
                                    ${escapeHTML(
                                        appointment.notes
                                    )}
                                  `
                                : ""
                        }

                    </div>


                    <span
                        class="status ${appointment.status}">

                        ${escapeHTML(
                            appointment.status
                                .toUpperCase()
                        )}

                    </span>

                </div>


                <div class="actions">

                    ${
                        appointment.status === "scheduled"
                            ? `
                                <button
                                    class="primary"
                                    onclick="confirmAppointment(${appointment.id})">
                                    Confirm
                                </button>
                              `
                            : ""
                    }

                    ${
                        appointment.status !== "cancelled" &&
                        appointment.status !== "completed"
                            ? `
                                <button
                                    class="secondary"
                                    onclick="completeAppointment(${appointment.id})">
                                    Complete
                                </button>
                              `
                            : ""
                    }

                    ${
                        appointment.status !== "cancelled"
                            ? `
                                <button
                                    class="secondary"
                                    onclick="cancelAppointment(${appointment.id})">
                                    Cancel
                                </button>
                              `
                            : ""
                    }

                    <button
                        class="danger"
                        onclick="deleteAppointment(${appointment.id})">
                        Delete
                    </button>

                </div>

            `;


            list.appendChild(
                article
            );

        }
    );

}


/* =========================
   MODAL
========================= */

function openAppointmentModal(){

    document.getElementById(
        "appointmentModal"
    ).classList.add(
        "show"
    );


    document.getElementById(
        "appointmentDate"
    ).value =
        new Date()
        .toISOString()
        .split("T")[0];

}


function closeAppointmentModal(){

    document.getElementById(
        "appointmentModal"
    ).classList.remove(
        "show"
    );

}


/* =========================
   CREATE
========================= */

function createAppointment(){

    const clientName =
        document.getElementById(
            "clientName"
        ).value.trim();

    const clientEmail =
        document.getElementById(
            "clientEmail"
        ).value.trim();

    const title =
        document.getElementById(
            "appointmentTitle"
        ).value.trim();

    const date =
        document.getElementById(
            "appointmentDate"
        ).value;

    const time =
        document.getElementById(
            "appointmentTime"
        ).value;

    const status =
        document.getElementById(
            "appointmentStatus"
        ).value;

    const notes =
        document.getElementById(
            "appointmentNotes"
        ).value.trim();


    if(
        !clientName ||
        !title ||
        !date ||
        !time
    ){

        alert(
            "Please complete the client, title, date and time fields."
        );

        return;

    }


    appointments.push({

        id:
            Date.now(),

        clientName,

        clientEmail,

        title,

        date,

        time,

        status,

        notes

    });


    saveAppointments();

    clearForm();

    closeAppointmentModal();

    renderAppointments();

}


/* =========================
   ACTIONS
========================= */

function confirmAppointment(id){

    updateStatus(
        id,
        "confirmed"
    );

}


function completeAppointment(id){

    updateStatus(
        id,
        "completed"
    );

}


function cancelAppointment(id){

    if(
        !confirm(
            "Cancel this appointment?"
        )
    ){
        return;
    }


    updateStatus(
        id,
        "cancelled"
    );

}


function updateStatus(
    id,
    status
){

    const appointment =
        appointments.find(
            item =>
                item.id === id
        );


    if(!appointment){
        return;
    }


    appointment.status =
        status;


    saveAppointments();

    renderAppointments();

}


/* =========================
   DELETE
========================= */

function deleteAppointment(id){

    if(
        !confirm(
            "Delete this appointment?"
        )
    ){
        return;
    }


    appointments =
        appointments.filter(
            appointment =>
                appointment.id !== id
        );


    saveAppointments();

    renderAppointments();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

    document.getElementById(
        "clientName"
    ).value = "";

    document.getElementById(
        "clientEmail"
    ).value = "";

    document.getElementById(
        "appointmentTitle"
    ).value = "";

    document.getElementById(
        "appointmentTime"
    ).value = "";

    document.getElementById(
        "appointmentNotes"
    ).value = "";

    document.getElementById(
        "appointmentStatus"
    ).value =
        "scheduled";

}


/* =========================
   DATE
========================= */

function formatDate(
    value
){

    if(!value){
        return "No date";
    }


    return new Date(
        value + "T00:00:00"
    ).toLocaleDateString(
        undefined,
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    );

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   START
========================= */

loadAppointments();

renderAppointments();

</script>

</body>
</html>
