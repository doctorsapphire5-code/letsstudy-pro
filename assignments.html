<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assignments | LetsStudy Pro</title>

<meta name="description"
content="Explore and access assignments on LetsStudy Pro.">

<link rel="icon" href="/favicon.ico">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#eff6ff,#fff);
  padding:45px 6%;
}

.hero h1{
  font-size:36px;
  margin-bottom:10px;
}

.hero p{
  color:#64748b;
  max-width:700px;
  line-height:1.6;
}

.container{
  width:88%;
  max-width:1250px;
  margin:30px auto;
}

.filters{
  background:#fff;
  padding:18px;
  border-radius:15px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:12px;
  margin-bottom:25px;
  box-shadow:0 5px 20px #0000000a;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #dce1e8;
  border-radius:9px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus{
  border-color:#2563eb;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 5px 20px #0000000b;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.icon{
  width:52px;
  height:52px;
  border-radius:12px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  margin-bottom:15px;
}

.title{
  font-size:19px;
  font-weight:750;
  margin-bottom:8px;
}

.description{
  color:#64748b;
  line-height:1.5;
  font-size:14px;
  min-height:45px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:14px 0;
}

.badge{
  font-size:11px;
  padding:5px 8px;
  border-radius:20px;
  background:#eef2ff;
  color:#4338ca;
}

.badge.free{
  background:#dcfce7;
  color:#15803d;
}

.badge.premium{
  background:#fef3c7;
  color:#b45309;
}

.footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:15px;
}

.muted{
  color:#64748b;
  font-size:13px;
}

.btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:7px;
}

.btn.secondary{
  background:#eef2ff;
  color:#2563eb;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#64748b;
}

.empty i{
  font-size:42px;
  margin-bottom:15px;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:750px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  background:#eee;
}

.detail-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:12px;
}

.detail-section{
  margin-top:22px;
}

.detail-section h3{
  margin-bottom:8px;
}

.detail-section p{
  color:#475569;
  line-height:1.7;
  white-space:pre-wrap;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.loading{
  text-align:center;
  padding:60px;
  color:#64748b;
}

@media(max-width:800px){
  .filters{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:29px;
  }

  .container{
    width:92%;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <div class="header-actions">
    <button
      class="header-btn"
      onclick="location.href='index.html'"
    >
      <i class="fa-solid fa-house"></i>
      Home
    </button>
  </div>

</header>


<section class="hero">

  <h1>Assignments</h1>

  <p>
    Explore assignments available on LetsStudy Pro.
    Open an assignment to view its details and access
    the available resource.
  </p>

</section>


<main class="container">

  <div class="filters">

    <input
      id="search"
      type="search"
      placeholder="Search assignments..."
    >

    <select id="level">
      <option value="">All Levels</option>
    </select>

    <select id="subject">
      <option value="">All Subjects</option>
    </select>

  </div>


  <div
    id="assignmentGrid"
    class="grid"
  >

    <div class="loading">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <p>Loading assignments...</p>
    </div>

  </div>

</main>


<!-- DETAIL MODAL -->

<div
  id="modal"
  class="modal"
  onclick="closeOutside(event)"
>

  <div
    class="modal-box"
    id="modalContent"
  ></div>

</div>


<script>

/* =====================================================
   LETSSTUDY PRO PUBLIC API
   ===================================================== */

const API_BASE = "/api/data";

let assignments = [];


/* =====================================================
   DOM
   ===================================================== */

const grid =
  document.getElementById("assignmentGrid");

const search =
  document.getElementById("search");

const level =
  document.getElementById("level");

const subject =
  document.getElementById("subject");


/* =====================================================
   LOAD ASSIGNMENTS
   ===================================================== */

async function loadAssignments(){

  try{

    const response =
      await fetch(
        API_BASE +
        "?collection=assignments&limit=100"
      );

    if(!response.ok){

      throw new Error(
        "API request failed: " +
        response.status
      );

    }

    const json =
      await response.json();

    if(!json.success){

      throw new Error(
        json.error ||
        "Unable to load assignments"
      );

    }

    assignments =
      Array.isArray(json.results)
      ? json.results
      : [];

    buildFilters();

    render();

    openAssignmentFromURL();

  }catch(error){

    console.error(
      "Assignments API:",
      error
    );

    grid.innerHTML = `

      <div class="empty">

        <i class="
          fa-solid
          fa-triangle-exclamation
        "></i>

        <h3>
          Unable to load assignments
        </h3>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


/* =====================================================
   FILTERS
   ===================================================== */

function buildFilters(){

  const levels =
    [...new Set(
      assignments
        .map(a => a.level)
        .filter(Boolean)
    )].sort();

  const subjects =
    [...new Set(
      assignments
        .map(a => a.subject)
        .filter(Boolean)
    )].sort();


  level.innerHTML =
    `<option value="">
      All Levels
    </option>`;

  levels.forEach(value => {

    level.innerHTML += `

      <option value="${escapeAttr(value)}">
        ${escapeHTML(value)}
      </option>

    `;

  });


  subject.innerHTML =
    `<option value="">
      All Subjects
    </option>`;

  subjects.forEach(value => {

    subject.innerHTML += `

      <option value="${escapeAttr(value)}">
        ${escapeHTML(value)}
      </option>

    `;

  });

}


/* =====================================================
   RENDER
   ===================================================== */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const selectedLevel =
    level.value;

  const selectedSubject =
    subject.value;


  const result =
    assignments.filter(item => {

      const text = [

        item.title,
        item.name,
        item.description,
        item.subject,
        item.level,
        item.category,
        item.courseTitle,
        item.moduleTitle

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      return (

        text.includes(keyword) &&

        (
          !selectedLevel ||
          item.level === selectedLevel
        ) &&

        (
          !selectedSubject ||
          item.subject === selectedSubject
        )

      );

    });


  if(!result.length){

    grid.innerHTML = `

      <div class="empty">

        <i class="
          fa-solid
          fa-clipboard-list
        "></i>

        <h3>
          No assignments found
        </h3>

        <p>
          Try another search or filter.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    result
      .map(createCard)
      .join("");

}


/* =====================================================
   CARD
   ===================================================== */

function createCard(item){

  const id =
    item.id ||
    item.documentId;


  const title =
    item.title ||
    item.name ||
    "Untitled Assignment";


  const description =
    item.description ||
    item.shortDescription ||
    "No description available.";


  const access =
    String(
      item.access ||
      item.plan ||
      "free"
    ).toLowerCase();


  return `

    <article class="card">

      <div class="icon">

        <i class="
          fa-solid
          fa-clipboard-check
        "></i>

      </div>


      <div class="title">

        ${escapeHTML(title)}

      </div>


      <div class="description">

        ${escapeHTML(
          truncate(description,140)
        )}

      </div>


      <div class="meta">

        ${
          item.subject
          ? `
            <span class="badge">
              ${escapeHTML(item.subject)}
            </span>
          `
          : ""
        }


        ${
          item.level
          ? `
            <span class="badge">
              ${escapeHTML(item.level)}
            </span>
          `
          : ""
        }


        ${
          access === "premium"
          ? `
            <span class="badge premium">
              <i class="fa-solid fa-crown"></i>
              Premium
            </span>
          `
          : `
            <span class="badge free">
              <i class="fa-solid fa-unlock"></i>
              Free
            </span>
          `
        }

      </div>


      <div class="footer">

        <span class="muted">

          ${
            item.duration
            ? `
              <i class="fa-regular fa-clock"></i>
              ${escapeHTML(item.duration)}
            `
            : `
              <i class="fa-solid fa-file"></i>
              Assignment
            `
          }

        </span>


        <button
          class="btn"
          onclick="openAssignment('${escapeAttr(id)}')"
        >

          View

          <i class="fa-solid fa-arrow-right"></i>

        </button>

      </div>

    </article>

  `;

}


/* =====================================================
   OPEN ASSIGNMENT
   ===================================================== */

window.openAssignment =
function(id){

  const item =
    assignments.find(
      assignment =>
        String(
          assignment.id ||
          assignment.documentId
        ) === String(id)
    );


  if(!item){

    return;

  }


  const title =
    item.title ||
    item.name ||
    "Assignment";


  const access =
    String(
      item.access ||
      item.plan ||
      "free"
    ).toLowerCase();


  const fileURL =
    item.fileUrl ||
    item.downloadUrl ||
    item.downloadURL ||
    item.pdfUrl ||
    item.url ||
    "";


  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <div class="modal-head">

      <h2>
        Assignment Details
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>


    <div class="detail-title">

      ${escapeHTML(title)}

    </div>


    <div class="meta">

      ${
        item.subject
        ? `
          <span class="badge">
            ${escapeHTML(item.subject)}
          </span>
        `
        : ""
      }


      ${
        item.level
        ? `
          <span class="badge">
            ${escapeHTML(item.level)}
          </span>
        `
        : ""
      }


      ${
        access === "premium"
        ? `
          <span class="badge premium">
            <i class="fa-solid fa-crown"></i>
            Premium
          </span>
        `
        : `
          <span class="badge free">
            <i class="fa-solid fa-unlock"></i>
            Free
          </span>
        `
      }

    </div>


    <div class="detail-section">

      <h3>
        Description
      </h3>

      <p>
        ${escapeHTML(
          item.description ||
          item.shortDescription ||
          "No description available."
        )}
      </p>

    </div>


    ${
      item.instructions
      ? `
        <div class="detail-section">

          <h3>
            Instructions
          </h3>

          <p>
            ${escapeHTML(item.instructions)}
          </p>

        </div>
      `
      : ""
    }


    ${
      item.courseTitle
      ? `
        <div class="detail-section">

          <h3>
            Course
          </h3>

          <p>
            ${escapeHTML(item.courseTitle)}
          </p>

        </div>
      `
      : ""
    }


    ${
      item.moduleTitle
      ? `
        <div class="detail-section">

          <h3>
            Module
          </h3>

          <p>
            ${escapeHTML(item.moduleTitle)}
          </p>

        </div>
      `
      : ""
    }


    <div class="actions">

      ${
        fileURL
        ? `
          <a
            class="btn"
            href="${safeURL(fileURL)}"
            target="_blank"
            rel="noopener noreferrer"
          >

            <i class="fa-solid fa-download"></i>

            Open / Download

          </a>
        `
        : `
          <span class="muted">
            No assignment file available.
          </span>
        `
      }

    </div>

  `;


  document
    .getElementById("modal")
    .classList.add("show");

};


/* =====================================================
   URL ROUTING
   ===================================================== */

function openAssignmentFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id") ||
    params.get("assignmentId") ||
    params.get("documentId");


  if(id){

    openAssignment(id);

  }

}


/* =====================================================
   CLOSE MODAL
   ===================================================== */

window.closeModal =
function(){

  document
    .getElementById("modal")
    .classList.remove("show");

};


window.closeOutside =
function(event){

  if(
    event.target ===
    document.getElementById("modal")
  ){

    closeModal();

  }

};


/* =====================================================
   HELPERS
   ===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value);

}


function safeURL(value){

  try{

    const url =
      new URL(
        String(value),
        window.location.origin
      );


    if(
      url.protocol === "https:" ||
      url.protocol === "http:"
    ){

      return url.href;

    }

  }catch(error){

    console.warn(
      "Invalid URL",
      value
    );

  }

  return "#";

}


function truncate(value,max){

  const text =
    String(value ?? "");

  if(text.length <= max){

    return text;

  }

  return text.substring(0,max) + "...";

}


/* =====================================================
   EVENTS
   ===================================================== */

search.addEventListener(
  "input",
  render
);

level.addEventListener(
  "change",
  render
);

subject.addEventListener(
  "change",
  render
);


/* =====================================================
   START
   ===================================================== */

loadAssignments();

</script>

</body>
</html>
