<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assignment | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:#2563eb;
  font-size:13px;
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:27px;
  line-height:1.3;
}

.description{
  color:#64748b;
  line-height:1.7;
  margin-top:10px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

.badge{
  padding:7px 11px;
  border-radius:20px;
  background:#f1f5f9;
  color:#475569;
  font-size:12px;
}

.badge.points{
  background:#eff6ff;
  color:#2563eb;
}

.badge.deadline{
  background:#fff7ed;
  color:#c2410c;
}

.instructions{
  white-space:pre-line;
  line-height:1.8;
  color:#334155;
  font-size:14px;
}

.upload-box{
  border:2px dashed #cbd5e1;
  border-radius:14px;
  padding:25px;
  text-align:center;
}

.upload-box i{
  font-size:40px;
  color:#2563eb;
  margin-bottom:12px;
}

input[type="file"]{
  width:100%;
  margin-top:15px;
}

textarea{
  width:100%;
  min-height:150px;
  padding:12px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  resize:vertical;
  font-family:inherit;
  outline:none;
}

textarea:focus{
  border-color:#2563eb;
}

.btn{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
  font-size:13px;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#e2e8f0;
  color:#334155;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  font-size:13px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.warning{
  background:#fef3c7;
  color:#92400e;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

.loading,
.error{
  text-align:center;
  padding:60px 20px;
  color:#64748b;
}

.error{
  color:#991b1b;
}

.loading i,
.error i{
  font-size:38px;
  margin-bottom:15px;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .card{
    padding:16px;
  }

  h1{
    font-size:22px;
  }

}

</style>

</head>

<body>

<div class="container">


<!-- LOADING -->

<div
id="loading"
class="card loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Loading assignment...

</div>


<!-- ERROR -->

<div
id="error"
class="card error hidden">

<i class="fa-solid fa-triangle-exclamation"></i>

<h3>
Unable to load assignment
</h3>

<p id="errorText"></p>

</div>


<!-- ASSIGNMENT -->

<div
id="assignmentPage"
class="hidden">


<!-- HEADER -->

<div class="card">

<a
href="javascript:history.back()"
class="back">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>


<h1 id="assignmentTitle">
Assignment
</h1>


<div
id="assignmentDescription"
class="description">
</div>


<div
id="assignmentMeta"
class="meta">
</div>

</div>


<!-- INSTRUCTIONS -->

<div class="card">

<h3>

<i class="fa-solid fa-list-check"></i>

Instructions

</h3>


<div
id="instructions"
class="instructions">

No instructions available.

</div>

</div>


<!-- SUBMISSION -->

<div
id="submissionCard"
class="card">

<h3>

<i class="fa-solid fa-paper-plane"></i>

Submit Assignment

</h3>


<div
id="submissionTypeInfo"
class="status warning">

</div>


<!-- TEXT -->

<div
id="textSubmission"
class="hidden">

<label>

Your Answer

</label>

<br><br>

<textarea
id="answer"
placeholder="Write your answer here...">
</textarea>

</div>


<!-- FILE -->

<div
id="fileSubmission"
class="hidden">

<div class="upload-box">

<i class="fa-solid fa-cloud-arrow-up"></i>

<h3>
Upload Your Assignment
</h3>

<p>
Select the file you want to submit.
</p>

<input
id="fileInput"
type="file">

</div>

</div>


<br>


<button
id="submitBtn"
class="btn primary">

<i class="fa-solid fa-paper-plane"></i>

Submit Assignment

</button>


<div
id="submitMessage"
class="status hidden">
</div>

</div>


<!-- DEADLINE -->

<div class="card">

<h3>

<i class="fa-regular fa-clock"></i>

Deadline

</h3>


<div
id="deadlineInfo"
class="status">
</div>

</div>


</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );

const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const errorText =
  document.getElementById(
    "errorText"
  );

const assignmentPage =
  document.getElementById(
    "assignmentPage"
  );

const assignmentTitle =
  document.getElementById(
    "assignmentTitle"
  );

const assignmentDescription =
  document.getElementById(
    "assignmentDescription"
  );

const assignmentMeta =
  document.getElementById(
    "assignmentMeta"
  );

const instructions =
  document.getElementById(
    "instructions"
  );

const submissionTypeInfo =
  document.getElementById(
    "submissionTypeInfo"
  );

const textSubmission =
  document.getElementById(
    "textSubmission"
  );

const fileSubmission =
  document.getElementById(
    "fileSubmission"
  );

const answer =
  document.getElementById(
    "answer"
  );

const fileInput =
  document.getElementById(
    "fileInput"
  );

const submitBtn =
  document.getElementById(
    "submitBtn"
  );

const submitMessage =
  document.getElementById(
    "submitMessage"
  );

const deadlineInfo =
  document.getElementById(
    "deadlineInfo"
  );


/* =====================================================
   ASSIGNMENT ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const assignmentId =
  params.get("id");


let assignment = null;


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

  loading.classList.add(
    "hidden"
  );

  assignmentPage.classList.add(
    "hidden"
  );

  errorBox.classList.remove(
    "hidden"
  );

  errorText.textContent =
    text;

}


/* =====================================================
   FORMAT DEADLINE
===================================================== */

function formatDate(value){

  if(!value)
    return "No deadline";


  let date;


  if(
    typeof value.toDate ===
    "function"
  ){

    date =
      value.toDate();

  }
  else{

    date =
      new Date(value);

  }


  if(
    isNaN(date.getTime())
  ){

    return String(value);

  }


  return date.toLocaleString(
    "en-US",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* =====================================================
   CHECK DEADLINE
===================================================== */

function getDeadlineDate(value){

  if(!value)
    return null;


  if(
    typeof value.toDate ===
    "function"
  ){

    return value.toDate();

  }


  const date =
    new Date(value);


  return isNaN(
    date.getTime()
  )
  ?
  null
  :
  date;

}


/* =====================================================
   SUBMISSION TYPE
===================================================== */

function setupSubmissionType(){

  const type =
    String(
      assignment.submissionType ||
      "text"
    )
    .toLowerCase()
    .trim();


  textSubmission.classList.add(
    "hidden"
  );

  fileSubmission.classList.add(
    "hidden"
  );


  if(
    type === "file" ||
    type === "pdf" ||
    type === "document" ||
    type === "upload"
  ){

    fileSubmission.classList.remove(
      "hidden"
    );


    submissionTypeInfo.className =
      "status warning";


    submissionTypeInfo.textContent =
      "Submit your assignment as a file.";

  }

  else if(
    type === "text"
  ){

    textSubmission.classList.remove(
      "hidden"
    );


    submissionTypeInfo.className =
      "status warning";


    submissionTypeInfo.textContent =
      "Submit your assignment by writing your answer below.";

  }

  else if(
    type === "both"
  ){

    textSubmission.classList.remove(
      "hidden"
    );

    fileSubmission.classList.remove(
      "hidden"
    );


    submissionTypeInfo.className =
      "status warning";


    submissionTypeInfo.textContent =
      "You may submit text, a file, or both.";

  }

  else{

    textSubmission.classList.remove(
      "hidden"
    );


    submissionTypeInfo.className =
      "status warning";


    submissionTypeInfo.textContent =
      `Submission type: ${
        assignment.submissionType ||
        "Text"
      }`;

  }

}


/* =====================================================
   LOAD ASSIGNMENT
===================================================== */

async function loadAssignment(){

  if(!assignmentId){

    showError(
      "No signal"
    );

    return;

  }


  try{

    const assignmentRef =
      doc(
        db,
        "assignments",
        assignmentId
      );


    const snapshot =
      await getDoc(
        assignmentRef
      );


    if(!snapshot.exists()){

      showError(
        "Assignment not found."
      );

      return;

    }


    assignment = {

      id:snapshot.id,

      ...snapshot.data()

    };


    /* TITLE */

    assignmentTitle.textContent =
      assignment.title ||
      "Untitled Assignment";


    document.title =
      `${
        assignment.title ||
        "Assignment"
      } | LetsStudy Pro`;


    /* DESCRIPTION */

    assignmentDescription.textContent =
      assignment.description ||
      "Complete this assignment according to the instructions.";


    /* INSTRUCTIONS */

    instructions.textContent =
      assignment.instructions ||
      "No instructions available.";


    /* META */

    assignmentMeta.innerHTML = `

      <span class="badge points">

        <i class="fa-solid fa-star"></i>

        ${
          Number(
            assignment.points || 0
          )
        } Points

      </span>


      <span class="badge">

        <i class="fa-solid fa-file-arrow-up"></i>

        ${escapeHTML(
          assignment.submissionType ||
          "Text"
        )}

      </span>


      ${
        assignment.deadline
        ?
        `
        <span class="badge deadline">

          <i class="fa-regular fa-clock"></i>

          ${formatDate(
            assignment.deadline
          )}

        </span>
        `
        :
        ""
      }

    `;


    /* DEADLINE */

    const deadlineDate =
      getDeadlineDate(
        assignment.deadline
      );


    if(deadlineDate){

      const now =
        new Date();


      if(
        deadlineDate < now
      ){

        deadlineInfo.className =
          "status danger";


        deadlineInfo.innerHTML = `

          <i class="fa-solid fa-circle-xmark"></i>

          Assignment deadline has passed.

          <br><br>

          <strong>
            ${formatDate(
              assignment.deadline
            )}
          </strong>

        `;


        submitBtn.disabled =
          true;

      }
      else{

        deadlineInfo.className =
          "status warning";


        deadlineInfo.innerHTML = `

          <i class="fa-regular fa-clock"></i>

          Submission deadline:

          <strong>
            ${formatDate(
              assignment.deadline
            )}
          </strong>

        `;

      }

    }
    else{

      deadlineInfo.className =
        "status success";


      deadlineInfo.innerHTML = `

        <i class="fa-solid fa-infinity"></i>

        No deadline has been set.

      `;

    }


    setupSubmissionType();


    loading.classList.add(
      "hidden"
    );

    assignmentPage.classList.remove(
      "hidden"
    );

  }
  catch(error){

    console.error(
      "Assignment error:",
      error
    );


    showError(
      error.message ||
      "Failed to load assignment."
    );

  }

}


/* =====================================================
   SUBMIT
===================================================== */

submitBtn.addEventListener(
  "click",
  async () => {

    const type =
      String(
        assignment.submissionType ||
        "text"
      )
      .toLowerCase();


    const text =
      answer.value.trim();


    const file =
      fileInput.files[0];


    if(
      type === "file" ||
      type === "pdf" ||
      type === "document" ||
      type === "upload"
    ){

      if(!file){

        showSubmitMessage(
          "Please select a file.",
          "danger"
        );

        return;

      }

    }


    if(
      type === "text" &&
      !text
    ){

      showSubmitMessage(
        "Please write your answer.",
        "danger"
      );

      return;

    }


    if(
      type === "both" &&
      !text &&
      !file
    ){

      showSubmitMessage(
        "Please provide an answer or select a file.",
        "danger"
      );

      return;

    }


    /*
      This page currently prepares
      the submission.

      Connect your submission collection
      / Storage here when you are ready.
    */

    showSubmitMessage(
      "Your submission is ready. Connect Firebase Storage/Firestore submission system to save it.",
      "success"
    );

  }
);


/* =====================================================
   MESSAGE
===================================================== */

function showSubmitMessage(
  text,
  type
){

  submitMessage.className =
    "status " + type;

  submitMessage.textContent =
    text;

  submitMessage.classList.remove(
    "hidden"
  );

}


/* =====================================================
   START
===================================================== */

loadAssignment();

</script>

</body>
</html>
