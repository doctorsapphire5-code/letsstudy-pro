<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Admin Authentication | Let'sStudy Pro</title>

  <meta name="robots" content="noindex,nofollow">

  <meta
    name="description"
    content="Secure administrator authentication for Let'sStudy Pro."
  >

  <meta name="theme-color" content="#2563eb">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding: 18px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f4f7fb;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 430px;

      padding: 30px 25px;

      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 20px;

      box-shadow:
        0 18px 50px rgba(15, 23, 42, .09);

      text-align: center;
    }

    .logo {
      width: 62px;
      height: 62px;

      margin: 0 auto 17px;

      display: grid;
      place-items: center;

      border-radius: 17px;

      background: #2563eb;
      color: #ffffff;

      font-size: 25px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -.4px;
    }

    .subtitle {
      margin: 0 0 23px;

      color: #667085;

      font-size: 13px;
      line-height: 1.55;
    }

    .status {
      display: none;

      margin-bottom: 16px;

      padding: 12px 13px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .status.info {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .status.success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .loader {
      width: 34px;
      height: 34px;

      margin: 5px auto 18px;

      border: 3px solid #dbeafe;
      border-top-color: #2563eb;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .account {
      display: none;

      margin-bottom: 17px;

      padding: 12px;

      background: #f8fafc;

      border: 1px solid #e5e7eb;

      border-radius: 10px;

      color: #344054;

      font-size: 12px;

      overflow-wrap: anywhere;
    }

    .actions {
      display: none;
    }

    button,
    a {
      min-height: 47px;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;

      border-radius: 10px;

      font-size: 13px;
      font-weight: 750;

      text-decoration: none;
    }

    button {
      border: 0;

      background: #2563eb;
      color: #ffffff;

      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary {
      margin-top: 10px;

      border: 1px solid #d8dee8;

      background: #ffffff;
      color: #344054;
    }

    .secondary:hover {
      background: #f8fafc;
    }

    .footer {
      margin-top: 20px;

      color: #98a2b3;

      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 25px 17px;
        border-radius: 17px;
      }

      h1 {
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .loader {
        animation: none;
      }
    }
  </style>
</head>


<body>

  <main
    class="card"
    aria-live="polite"
  >

    <div
      class="logo"
      aria-hidden="true"
    >
      L
    </div>

    <h1>
      Admin Authentication
    </h1>

    <p class="subtitle">
      Securing your Let'sStudy Pro administrator session.
    </p>


    <div
      id="loader"
      class="loader"
      aria-label="Loading"
    ></div>


    <div
      id="status"
      class="status"
      role="alert"
    >
      Checking administrator account...
    </div>


    <div
      id="account"
      class="account"
    ></div>


    <div
      id="actions"
      class="actions"
    >

      <button
        id="continueButton"
        type="button"
      >
        Continue to Admin Profile
      </button>

      <button
        id="loginButton"
        class="secondary"
        type="button"
      >
        Go to Admin Login
      </button>

    </div>


    <div class="footer">
      🔒 Protected by Firebase Authentication
    </div>

  </main>


<script type="module">

  /* =========================================
     FIREBASE SDK
  ========================================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    reload
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"
  };


  /* =========================================
     INITIALIZE
  ========================================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);


  /* =========================================
     ELEMENTS
  ========================================== */

  const loader =
    document.getElementById(
      "loader"
    );

  const status =
    document.getElementById(
      "status"
    );

  const account =
    document.getElementById(
      "account"
    );

  const actions =
    document.getElementById(
      "actions"
    );

  const continueButton =
    document.getElementById(
      "continueButton"
    );

  const loginButton =
    document.getElementById(
      "loginButton"
    );


  /* =========================================
     STATUS
  ========================================== */

  function showStatus(
    message,
    type = "info"
  ) {

    status.textContent =
      message;

    status.className =
      `status show ${type}`;
  }


  /* =========================================
     ADMIN AUTH CHECK
  ========================================== */

  onAuthStateChanged(
    auth,
    async user => {

      /*
       * No authenticated account.
       */

      if (!user) {

        showStatus(
          "No administrator session found. Redirecting to login...",
          "info"
        );

        setTimeout(
          () => {

            window.location.replace(
              "login-admin.html"
            );

          },
          700
        );

        return;
      }


      /*
       * Display current account.
       */

      account.style.display =
        "block";

      account.textContent =
        user.email ||
        user.phoneNumber ||
        "Authenticated administrator";


      try {

        /*
         * Refresh Firebase user state.
         */

        await reload(user);


        const currentUser =
          auth.currentUser;


        if (!currentUser) {

          window.location.replace(
            "login-admin.html"
          );

          return;
        }


        /*
         * Email account must be verified.
         */

        if (
          currentUser.providerData.some(
            provider =>
              provider.providerId ===
              "password"
          ) &&
          !currentUser.emailVerified
        ) {

          showStatus(
            "Your administrator email is not verified. Redirecting...",
            "info"
          );


          setTimeout(
            () => {

              window.location.replace(
                "verify-email-admin.html"
              );

            },
            700
          );


          return;
        }


        /*
         * Authentication successful.
         */

        loader.style.display =
          "none";


        showStatus(
          "Administrator authentication successful.",
          "success"
        );


        actions.style.display =
          "block";


        continueButton.focus();


        /*
         * Continue automatically.
         */

        setTimeout(
          () => {

            window.location.replace(
              "profile-admin.html"
            );

          },
          1000
        );


      } catch (error) {

        console.error(
          "Admin authentication error:",
          error
        );


        loader.style.display =
          "none";


        showStatus(
          "Authentication check failed. Please login again.",
          "error"
        );


        actions.style.display =
          "block";

      }

    }
  );


  /* =========================================
     BUTTONS
  ========================================== */

  continueButton.addEventListener(
    "click",
    () => {

      window.location.replace(
        "profile-admin.html"
      );

    }
  );


  loginButton.addEventListener(
    "click",
    () => {

      window.location.replace(
        "login-admin.html"
      );

    }
  );


  /* =========================================
     PAGE VISIBILITY
  ========================================== */

  document.addEventListener(
    "visibilitychange",
    () => {

      if (
        document.visibilityState ===
        "visible" &&
        auth.currentUser
      ) {

        reload(
          auth.currentUser
        ).catch(() => {});

      }

    }
  );

</script>

</body>
</html>
