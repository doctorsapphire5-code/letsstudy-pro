<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Admin Authentication | Let'sStudy Pro</title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <meta
    name="description"
    content="Secure administrator authentication for Let'sStudy Pro."
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;

      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding: 18px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #eef4ff
        );

      color: #111827;
    }


    /* =========================================
       CARD
    ========================================== */

    .card {

      width: 100%;
      max-width: 430px;

      padding: 30px 25px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 20px;

      box-shadow:
        0 18px 50px
        rgba(15, 23, 42, .09);

      text-align: center;
    }


    /* =========================================
       LOGO
    ========================================== */

    .logo {

      width: 62px;
      height: 62px;

      margin:
        0 auto 17px;

      display: grid;
      place-items: center;

      border-radius: 17px;

      background: #2563eb;

      color: #ffffff;

      font-size: 25px;
      font-weight: 900;

      box-shadow:
        0 8px 22px
        rgba(37, 99, 235, .25);
    }


    /* =========================================
       TITLE
    ========================================== */

    h1 {

      margin:
        0 0 8px;

      font-size: 25px;

      line-height: 1.2;

      letter-spacing: -.4px;
    }


    .subtitle {

      margin:
        0 0 23px;

      color: #667085;

      font-size: 13px;

      line-height: 1.55;
    }


    /* =========================================
       STATUS
    ========================================== */

    .status {

      display: none;

      margin-bottom: 16px;

      padding: 12px 13px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.5;
    }


    .status.show {
      display: block;
    }


    .status.error {

      background: #fef2f2;

      color: #b91c1c;

      border:
        1px solid #fecaca;
    }


    .status.info {

      background: #eff6ff;

      color: #1d4ed8;

      border:
        1px solid #bfdbfe;
    }


    .status.success {

      background: #f0fdf4;

      color: #15803d;

      border:
        1px solid #bbf7d0;
    }


    /* =========================================
       LOADER
    ========================================== */

    .loader {

      width: 34px;
      height: 34px;

      margin:
        5px auto 18px;

      border:
        3px solid #dbeafe;

      border-top-color:
        #2563eb;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


    /* =========================================
       ACCOUNT
    ========================================== */

    .account {

      display: none;

      margin-bottom: 17px;

      padding: 12px;

      background: #f8fafc;

      border:
        1px solid #e5e7eb;

      border-radius: 10px;

      color: #344054;

      font-size: 12px;

      overflow-wrap: anywhere;
    }


    /* =========================================
       ACTIONS
    ========================================== */

    .actions {

      display: none;

      gap: 10px;

      flex-direction: column;
    }


    button {

      width: 100%;

      min-height: 47px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      border-radius: 10px;

      font-size: 13px;

      font-weight: 750;

      cursor: pointer;

      transition:
        background .2s ease,
        transform .1s ease;
    }


    button:active {

      transform:
        scale(.98);
    }


    #continueButton {

      border: 0;

      background: #2563eb;

      color: #ffffff;
    }


    #continueButton:hover {

      background: #1d4ed8;
    }


    #loginButton {

      border:
        1px solid #d8dee8;

      background: #ffffff;

      color: #344054;
    }


    #loginButton:hover {

      background: #f8fafc;
    }


    button:disabled {

      opacity: .6;

      cursor: not-allowed;
    }


    /* =========================================
       FOOTER
    ========================================== */

    .footer {

      margin-top: 20px;

      color: #98a2b3;

      font-size: 11px;

      line-height: 1.5;
    }


    /* =========================================
       MOBILE
    ========================================== */

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {

        padding:
          25px 17px;

        border-radius: 17px;
      }

      h1 {
        font-size: 23px;
      }

    }


    /* =========================================
       REDUCED MOTION
    ========================================== */

    @media (prefers-reduced-motion: reduce) {

      .loader {
        animation: none;
      }

      button {
        transition: none;
      }
    }

  </style>

</head>


<body>


  <main
    class="card"
    aria-live="polite"
  >


    <!-- LOGO -->

    <div
      class="logo"
      aria-hidden="true"
    >
      L
    </div>


    <!-- TITLE -->

    <h1>
      Admin Authentication
    </h1>


    <p class="subtitle">
      Verify your Let'sStudy Pro administrator session before continuing.
    </p>


    <!-- LOADER -->

    <div
      id="loader"
      class="loader"
      aria-label="Checking authentication"
    ></div>


    <!-- STATUS -->

    <div
      id="status"
      class="status"
      role="status"
    ></div>


    <!-- ACCOUNT -->

    <div
      id="account"
      class="account"
    ></div>


    <!-- ACTIONS -->

    <div
      id="actions"
      class="actions"
    >

      <button
        id="continueButton"
        type="button"
      >
        Continue to Admin Profile
      </button>


      <button
        id="loginButton"
        type="button"
      >
        Go to Admin Login
      </button>

    </div>


    <!-- FOOTER -->

    <div class="footer">
      🔒 Protected by Firebase Authentication
    </div>


  </main>



  <!-- =========================================
       FIREBASE
  ========================================== -->

  <script type="module">


    /* =========================================
       FIREBASE APP
    ========================================== */

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    /* =========================================
       FIREBASE AUTH
    ========================================== */

    import {
      getAuth,
      onAuthStateChanged,
      reload,
      signOut
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================================
       FIRESTORE
    ========================================== */

    import {
      getFirestore,
      doc,
      getDoc
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================================
       FIREBASE CONFIG
    ========================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

      measurementId:
        "G-85B7V5H5J0"
    };


    /* =========================================
       INITIALIZE
    ========================================== */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /* =========================================
       ELEMENTS
    ========================================== */

    const loader =
      document.getElementById(
        "loader"
      );


    const status =
      document.getElementById(
        "status"
      );


    const account =
      document.getElementById(
        "account"
      );


    const actions =
      document.getElementById(
        "actions"
      );


    const continueButton =
      document.getElementById(
        "continueButton"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    /* =========================================
       STATUS FUNCTION
    ========================================== */

    function showStatus(
      message,
      type = "info"
    ) {

      status.textContent =
        message;

      status.className =
        `status show ${type}`;
    }


    /* =========================================
       INITIAL STATE
    ========================================== */

    showStatus(
      "Checking your authentication status...",
      "info"
    );


    /* =========================================
       AUTH STATE
       
       IMPORTANT:
       NO AUTOMATIC REDIRECT
    ========================================== */

    onAuthStateChanged(
      auth,
      async (user) => {


        /* -------------------------------------
           HIDE LOADER
        ------------------------------------- */

        loader.style.display =
          "none";


        actions.style.display =
          "flex";


        /* -------------------------------------
           USER NOT SIGNED IN
        ------------------------------------- */

        if (!user) {

          account.style.display =
            "none";


          showStatus(
            "You are not currently signed in as an administrator.",
            "info"
          );


          continueButton.style.display =
            "none";


          loginButton.style.display =
            "flex";


          return;
        }


        /* -------------------------------------
           SHOW ACCOUNT
        ------------------------------------- */

        account.textContent =
          `Signed in as: ${
            user.email || "Administrator"
          }`;


        account.style.display =
          "block";


        showStatus(
          "Checking administrator permissions...",
          "info"
        );


        try {


          /* -----------------------------------
             ADMIN DOCUMENT
          ----------------------------------- */

          const adminRef =
            doc(
              db,
              "admins",
              user.uid
            );


          const adminSnap =
            await getDoc(
              adminRef
            );


          /* -----------------------------------
             NOT ADMIN
          ----------------------------------- */

          if (!adminSnap.exists()) {


            showStatus(
              "Access denied. This account is not registered as an administrator.",
              "error"
            );


            continueButton.style.display =
              "none";


            loginButton.style.display =
              "flex";


            return;
          }


          /* -----------------------------------
             ADMIN DATA
          ----------------------------------- */

          const adminData =
            adminSnap.data();


          /* -----------------------------------
             ROLE CHECK
          ----------------------------------- */

          if (
            adminData.role &&
            String(
              adminData.role
            ).toLowerCase() !== "admin"
          ) {


            showStatus(
              "Access denied. This account does not have administrator privileges.",
              "error"
            );


            continueButton.style.display =
              "none";


            loginButton.style.display =
              "flex";


            return;
          }


          /* -----------------------------------
             VERIFIED
          ----------------------------------- */

          showStatus(
            "Administrator verified successfully. You may continue.",
            "success"
          );


          continueButton.style.display =
            "flex";


          loginButton.style.display =
            "none";


        } catch (error) {


          console.error(
            "Admin verification error:",
            error
          );


          showStatus(
            "Unable to verify administrator access. Please try again.",
            "error"
          );


          continueButton.style.display =
            "none";


          loginButton.style.display =
            "flex";
        }

      }
    );


    /* =========================================
       CONTINUE BUTTON
       
       MANUAL NAVIGATION ONLY
    ========================================== */

    continueButton.addEventListener(
      "click",
      () => {


        continueButton.disabled =
          true;


        continueButton.textContent =
          "Opening Admin Profile...";


        window.location.href =
          "profile-admin.html";

      }
    );


    /* =========================================
       LOGIN BUTTON
       
       MANUAL NAVIGATION ONLY
    ========================================== */

    loginButton.addEventListener(
      "click",
      async () => {


        loginButton.disabled =
          true;


        loginButton.textContent =
          "Opening Admin Login...";


        /*
         * We do NOT automatically redirect.
         * The redirect happens only because
         * the user clicked this button.
         */

        window.location.href =
          "login-admin.html";

      }
    );


    /* =========================================
       REFRESH AUTH SESSION
    ========================================== */

    document.addEventListener(
      "visibilitychange",
      async () => {


        if (
          document.visibilityState ===
          "visible"
          &&
          auth.currentUser
        ) {


          try {

            await reload(
              auth.currentUser
            );

          } catch (error) {

            console.warn(
              "Authentication refresh failed:",
              error
            );

          }

        }

      }
    );


  </script>


</body>
</html>
