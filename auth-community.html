<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Community Authentication | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Sign in or create your Let'sStudy Pro Community account."
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <link
    rel="icon"
    href="/favicon.ico"
  >

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #eef2ff
        );
      color:#0f172a;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .auth-wrapper{
      width:100%;
      max-width:460px;
    }

    .brand{
      text-align:center;
      margin-bottom:28px;
    }

    .brand-icon{
      width:64px;
      height:64px;
      margin:0 auto 14px;
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#111827;
      color:#fff;
      font-size:28px;
      box-shadow:
        0 12px 30px rgba(15,23,42,.15);
    }

    .brand h1{
      font-size:28px;
      font-weight:800;
      letter-spacing:-.6px;
    }

    .brand p{
      margin-top:7px;
      color:#64748b;
      font-size:14px;
    }

    .card{
      background:#fff;
      border:1px solid #e2e8f0;
      border-radius:24px;
      padding:30px;
      box-shadow:
        0 20px 60px rgba(15,23,42,.08);
    }

    .card h2{
      font-size:23px;
      margin-bottom:8px;
    }

    .intro{
      color:#64748b;
      font-size:14px;
      line-height:1.6;
      margin-bottom:24px;
    }

    .form-group{
      margin-bottom:17px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin-bottom:7px;
    }

    input{
      width:100%;
      height:48px;
      padding:0 14px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      outline:none;
      font-size:15px;
      transition:.2s;
    }

    input:focus{
      border-color:#6366f1;
      box-shadow:
        0 0 0 4px rgba(99,102,241,.10);
    }

    .btn{
      width:100%;
      min-height:48px;
      border:0;
      border-radius:12px;
      font-size:15px;
      font-weight:750;
      cursor:pointer;
      transition:.2s;
    }

    .btn-primary{
      background:#111827;
      color:#fff;
    }

    .btn-primary:hover{
      transform:translateY(-1px);
      opacity:.94;
    }

    .btn-secondary{
      background:#f1f5f9;
      color:#0f172a;
      margin-top:10px;
    }

    .message{
      display:none;
      padding:12px 14px;
      border-radius:10px;
      font-size:13px;
      line-height:1.5;
      margin-bottom:17px;
    }

    .message.show{
      display:block;
    }

    .message.error{
      background:#fef2f2;
      color:#991b1b;
      border:1px solid #fecaca;
    }

    .message.success{
      background:#f0fdf4;
      color:#166534;
      border:1px solid #bbf7d0;
    }

    .loading{
      display:none;
      text-align:center;
      padding:12px;
      color:#64748b;
      font-size:13px;
    }

    .loading.show{
      display:block;
    }

    .footer{
      text-align:center;
      margin-top:20px;
      color:#94a3b8;
      font-size:12px;
    }

    @media(max-width:480px){

      body{
        padding:16px;
      }

      .card{
        padding:23px;
        border-radius:20px;
      }

      .brand h1{
        font-size:24px;
      }

    }

  </style>

</head>

<body>

  <main class="auth-wrapper">

    <div class="brand">

      <div
        class="brand-icon"
        aria-hidden="true"
      >
        👥
      </div>

      <h1>
        Let'sStudy Pro
      </h1>

      <p>
        Community
      </p>

    </div>


    <section class="card">

      <h2>
        Welcome to the Community
      </h2>

      <p class="intro">
        Sign in to join discussions, connect with people,
        create posts and participate in community groups.
      </p>


      <div
        id="message"
        class="message"
        role="alert"
      ></div>


      <!-- LOGIN -->

      <form
        id="loginForm"
        autocomplete="on"
      >

        <div class="form-group">

          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          id="loginBtn"
          class="btn btn-primary"
          type="submit"
        >
          Sign In
        </button>

      </form>


      <button
        id="registerBtn"
        class="btn btn-secondary"
        type="button"
      >
        Create Community Account
      </button>


      <div
        id="loading"
        class="loading"
        aria-live="polite"
      >
        Checking your account...
      </div>

    </section>


    <div class="footer">

      © <span id="year"></span>
      Let'sStudy Pro Community

    </div>

  </main>


  <!-- Firebase -->

  <script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js">
  </script>

  <script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js">
  </script>

  <script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js">
  </script>


  <script>

    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

      measurementId:
        "G-85B7V5H5J0"

    };


    firebase.initializeApp(
      firebaseConfig
    );


    const auth =
      firebase.auth();

    const db =
      firebase.firestore();


    /* =========================
       ELEMENTS
    ========================= */

    const loginForm =
      document.getElementById(
        "loginForm"
      );

    const registerBtn =
      document.getElementById(
        "registerBtn"
      );

    const loginBtn =
      document.getElementById(
        "loginBtn"
      );

    const message =
      document.getElementById(
        "message"
      );

    const loading =
      document.getElementById(
        "loading"
      );


    /* =========================
       HELPERS
    ========================= */

    function showMessage(
      text,
      type = "error"
    ){

      message.textContent =
        text;

      message.className =
        `message show ${type}`;

    }


    function clearMessage(){

      message.textContent =
        "";

      message.className =
        "message";

    }


    function setLoading(
      state
    ){

      loading.classList.toggle(
        "show",
        state
      );

      loginBtn.disabled =
        state;

      registerBtn.disabled =
        state;

    }


    /* =========================
       AUTH STATE
    ========================= */

    auth.onAuthStateChanged(
      async user => {

        if(!user){

          setLoading(false);

          return;

        }


        /*
         * Already logged in.
         * Continue directly to Community.
         */

        window.location.replace(
          "/community.html"
        );

      }
    );


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        clearMessage();

        const email =
          document
            .getElementById(
              "loginEmail"
            )
            .value
            .trim();

        const password =
          document
            .getElementById(
              "loginPassword"
            )
            .value;


        if(!email || !password){

          showMessage(
            "Please enter your email and password."
          );

          return;

        }


        setLoading(true);


        try{

          await auth.signInWithEmailAndPassword(
            email,
            password
          );


          showMessage(
            "Login successful. Opening Community...",
            "success"
          );


          setTimeout(
            () => {

              window.location.replace(
                "/community.html"
              );

            },
            400
          );


        }
        catch(error){

          console.error(
            "Community login error:",
            error
          );


          let text =
            "Unable to sign in. Please try again.";


          switch(
            error.code
          ){

            case
              "auth/invalid-credential":

              text =
                "Incorrect email or password.";

              break;


            case
              "auth/user-not-found":

              text =
                "No account was found with this email.";

              break;


            case
              "auth/wrong-password":

              text =
                "Incorrect password.";

              break;


            case
              "auth/too-many-requests":

              text =
                "Too many attempts. Please try again later.";

              break;


            case
              "auth/network-request-failed":

              text =
                "Network error. Check your internet connection.";

              break;

          }


          showMessage(
            text
          );

          setLoading(false);

        }

      }
    );


    /* =========================
       REGISTER
    ========================= */

    registerBtn.addEventListener(
      "click",
      () => {

        window.location.href =
          "/register-community.html";

      }
    );


    /* =========================
       YEAR
    ========================= */

    document.getElementById(
      "year"
    ).textContent =
      new Date()
        .getFullYear();

  </script>

</body>
</html>
