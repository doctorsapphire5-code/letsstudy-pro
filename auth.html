<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Authentication | LetsStudy Pro</title>
<meta name="description" content="Secure LetsStudy Pro account authentication.">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:32px 26px;
  box-shadow:0 12px 40px rgba(15,23,42,.10);
}

.logo{
  text-align:center;
  margin-bottom:28px;
}

.logo-icon{
  width:60px;
  height:60px;
  margin:auto;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#2563eb;
  color:#fff;
  font-size:28px;
  font-weight:800;
}

.logo h1{
  margin:12px 0 5px;
  font-size:24px;
}

.logo p{
  margin:0;
  color:#64748b;
  font-size:14px;
}

h2{
  margin:0 0 8px;
  font-size:22px;
}

.description{
  color:#64748b;
  font-size:14px;
  line-height:1.6;
  margin-bottom:24px;
}

.auth-links{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.auth-link{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  border-radius:13px;
  text-decoration:none;
  font-size:15px;
  font-weight:700;
  transition:.2s;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.primary:hover{
  background:#1d4ed8;
}

.secondary{
  background:#eef4ff;
  color:#1d4ed8;
}

.secondary:hover{
  background:#e0ebff;
}

.reset{
  background:#f8fafc;
  color:#475569;
  border:1px solid #e2e8f0;
}

.reset:hover{
  background:#f1f5f9;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:24px 0;
  color:#94a3b8;
  font-size:12px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#e2e8f0;
}

.back{
  text-align:center;
  font-size:14px;
}

.back a{
  color:#2563eb;
  text-decoration:none;
  font-weight:600;
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#94a3b8;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      <div class="logo-icon">L</div>

      <h1>LetsStudy Pro</h1>

      <p>
        Learn. Grow. Succeed.
      </p>
    </div>


    <h2>Welcome</h2>

    <p class="description">
      Access your LetsStudy Pro account, continue learning,
      manage your courses and explore your learning dashboard.
    </p>


    <div class="auth-links">

      <a
        class="auth-link primary"
        href="login.html"
      >
        🔐 Login
      </a>


      <a
        class="auth-link secondary"
        href="register.html"
      >
        ✨ Create Account
      </a>


      <a
        class="auth-link reset"
        href="reset-password.html"
      >
        🔑 Forgot Password
      </a>

    </div>


    <div class="divider">
      LetsStudy Pro Account
    </div>


    <div class="back">
      <a href="index.html">
        ← Back to Website
      </a>
    </div>

  </div>


  <div class="footer">
    © 2026 LetsStudy Pro. All rights reserved.
  </div>

</div>

</body>
</html>
