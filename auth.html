<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="LetsStudy Pro secure authentication."
  >

  <title>Authentication | LetsStudy Pro</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f4f7ff,
          #eef3ff,
          #ffffff
        );

      color:#172033;
    }

    .page{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:20px;
    }

    .card{
      width:100%;
      max-width:500px;

      padding:40px 30px;

      background:#fff;

      border:1px solid #e6eaf2;

      border-radius:24px;

      box-shadow:
        0 25px 70px
        rgba(34,49,88,.10);

      text-align:center;
    }

    .logo{
      width:70px;
      height:70px;

      margin:0 auto 20px;

      border-radius:20px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#315efb;

      color:#fff;

      font-size:30px;
      font-weight:900;

      box-shadow:
        0 12px 30px
        rgba(49,94,251,.25);
    }

    h1{
      font-size:28px;
      margin-bottom:10px;
    }

    .subtitle{
      color:#69748a;
      font-size:14px;
      line-height:1.7;
      margin-bottom:28px;
    }

    .auth-options{
      display:grid;
      gap:12px;
    }

    .auth-btn{
      min-height:54px;

      padding:13px 18px;

      border-radius:14px;

      border:1px solid #dfe5ef;

      background:#fff;

      color:#26334d;

      font-size:15px;
      font-weight:700;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:10px;

      cursor:pointer;

      transition:
        .2s ease;
    }

    .auth-btn:hover{
      border-color:#315efb;

      background:#f8faff;

      transform:translateY(-1px);
    }

    .primary{
      background:#315efb;
      border-color:#315efb;
      color:#fff;
    }

    .primary:hover{
      background:#264edb;
      color:#fff;

      box-shadow:
        0 10px 25px
        rgba(49,94,251,.22);
    }

    .icon{
      font-size:19px;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:12px;

      margin:24px 0;

      color:#98a1b2;

      font-size:12px;
    }

    .divider::before,
    .divider::after{
      content:"";

      flex:1;

      height:1px;

      background:#edf0f5;
    }

    .secure{
      margin-top:25px;

      padding:14px;

      background:#f8fafc;

      border:1px solid #edf0f5;

      border-radius:14px;

      color:#69748a;

      font-size:12px;

      line-height:1.6;
    }

    .footer{
      margin-top:25px;

      color:#8993a5;

      font-size:12px;
    }

    @media(max-width:500px){

      .card{
        padding:32px 20px;
      }

      h1{
        font-size:25px;
      }

    }

  </style>

</head>


<body>

<div class="page">

  <main class="card">

    <div class="logo">
      L
    </div>


    <h1>
      LetsStudy Pro
    </h1>


    <p class="subtitle">
      Secure authentication for your
      learning journey. Choose an option
      below to continue.
    </p>


    <!-- =========================
         AUTH OPTIONS
    ========================= -->

    <div class="auth-options">


      <button
        class="auth-btn primary"
        id="loginBtn"
      >

        <span class="icon">
          🔐
        </span>

        Login to Account

      </button>


      <button
        class="auth-btn"
        id="registerBtn"
      >

        <span class="icon">
          ✨
        </span>

        Create New Account

      </button>


      <button
        class="auth-btn"
        id="forgotBtn"
      >

        <span class="icon">
          🔑
        </span>

        Forgot Password

      </button>


      <button
        class="auth-btn"
        id="verifyBtn"
      >

        <span class="icon">
          ✉️
        </span>

        Verify Email

      </button>


    </div>


    <div class="divider">
      Secure authentication
    </div>


    <div class="secure">

      🔒 Your account is protected by
      Firebase Authentication.

      <br>

      Never share your password with anyone.

    </div>


    <div class="footer">

      © 2026 LetsStudy Pro

    </div>

  </main>

</div>


<script type="module">

  /*
   * ============================================
   * LETSSTUDY PRO AUTH ROUTER
   * ============================================
   */


  const params =
    new URLSearchParams(
      window.location.search
    );


  let redirect =
    params.get("redirect");


  /*
   * Prevent external redirects.
   */

  if(
    !redirect ||
    redirect.startsWith("http://") ||
    redirect.startsWith("https://") ||
    redirect.startsWith("//")
  ){

    redirect =
      "dashboard.html";

  }


  const redirectQuery =
    "?redirect=" +
    encodeURIComponent(
      redirect
    );


  /*
   * LOGIN
   */

  document
    .getElementById("loginBtn")
    .addEventListener(
      "click",
      () => {

        window.location.href =
          "login.html" +
          redirectQuery;

      }
    );


  /*
   * REGISTER
   */

  document
    .getElementById("registerBtn")
    .addEventListener(
      "click",
      () => {

        window.location.href =
          "register.html" +
          redirectQuery;

      }
    );


  /*
   * FORGOT PASSWORD
   */

  document
    .getElementById("forgotBtn")
    .addEventListener(
      "click",
      () => {

        window.location.href =
          "forgot-password.html";

      }
    );


  /*
   * EMAIL VERIFICATION
   */

  document
    .getElementById("verifyBtn")
    .addEventListener(
      "click",
      () => {

        window.location.href =
          "email-verification.html" +
          redirectQuery;

      }
    );


  /*
   * If auth.html receives:
   *
   * auth.html?redirect=checkout.html
   *
   * the selected authentication page
   * will preserve checkout.html.
   */


  console.log(
    "LetsStudy Pro Auth Router initialized."
  );

</script>

</body>

</html>
