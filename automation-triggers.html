<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automation Triggers | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}
header{background:#111827;color:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-weight:900}.logo span{color:#fbbf24}
nav{display:flex;gap:12px;flex-wrap:wrap}
nav a{color:#d1d5db;text-decoration:none;font-size:11px}
main{width:min(1050px,92%);margin:25px auto}
.hero,.card,.stat{background:#fff;border:1px solid #e5e7eb;border-radius:16px}
.hero{background:#111827;color:#fff;padding:20px;margin-bottom:16px}
.hero h1{margin:5px 0}.hero p{color:#cbd5e1;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{padding:15px;font-size:11px}.stat b{display:block;font-size:23px;margin-top:5px}
.card{padding:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
input,select,button{font:inherit}
input,select{padding:10px;border:1px solid #ddd;border-radius:8px}
.search{flex:1;min-width:200px}
button{border:0;padding:10px 13px;border-radius:8px;font-size:10px;font-weight:800;cursor:pointer}
.primary{background:#2563eb;color:#fff}.success{background:#dcfce7;color:#166534}
.warning{background:#fef3c7;color:#92400e}.danger{background:#fee2e2;color:#991b1b}
.dark{background:#111827;color:#fff}
.wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:11px}
th{font-size:9px;color:#667085;text-transform:uppercase}
.badge{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:900}
.on{background:#dcfce7;color:#166534}.off{background:#f3f4f6;color:#6b7280}
.empty{text-align:center;padding:35px;color:#667085}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modal-box{width:min(500px,100%);background:#fff;border-radius:16px;padding:20px}
.form{display:grid;gap:10px}.form label{font-size:10px;font-weight:800}
.form input,.form select{width:100%}
.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 17px;border-radius:8px;font-size:11px}
.toast.show{display:block}
@media(max-width:650px){.stats{grid-template-columns:1fr}nav{display:none}}
</style>
</head>

<body>

<header>
  <div class="logo">LetsStudy <span>Pro</span></div>

  <nav>
    <a href="marketing.html">Marketing</a>
    <a href="automation-actions.html">Actions</a>
    <a href="automation-schedules.html">Schedules</a>
    <a href="automation-integrations.html">Integrations</a>
    <a href="automation-logs.html">Logs</a>
  </nav>

  <small id="userEmail">Loading...</small>
</header>

<main>

<section class="hero">
  <small>AUTOMATION SYSTEM</small>
  <h1>Automation Triggers</h1>
  <p>
    Create events that start your LetsStudy Pro automations.
  </p>

  <button class="primary" id="newBtn">
    + New Trigger
  </button>
</section>

<section class="stats">

  <div class="stat">
    Total Triggers
    <b id="total">0</b>
  </div>

  <div class="stat">
    Active
    <b id="active">0</b>
  </div>

  <div class="stat">
    Disabled
    <b id="disabled">0</b>
  </div>

</section>

<section class="card">

  <div class="toolbar">

    <input
      class="search"
      id="search"
      placeholder="Search triggers..."
    >

    <select id="eventFilter">
      <option value="all">All Events</option>
      <option value="user.created">User Created</option>
      <option value="user.login">User Login</option>
      <option value="course.enrolled">Course Enrolled</option>
      <option value="payment.completed">Payment Completed</option>
      <option value="order.created">Order Created</option>
      <option value="custom">Custom</option>
    </select>

    <select id="statusFilter">
      <option value="all">All Status</option>
      <option value="active">Active</option>
      <option value="disabled">Disabled</option>
    </select>

    <button class="dark" id="refreshBtn">
      Refresh
    </button>

  </div>

  <div class="wrap">

    <table>

      <thead>
        <tr>
          <th>Name</th>
          <th>Event</th>
          <th>Status</th>
          <th>Executions</th>
          <th>Updated</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="list">
        <tr>
          <td colspan="6" class="empty">
            Loading...
          </td>
        </tr>
      </tbody>

    </table>

  </div>

</section>

</main>


<div class="modal" id="modal">

  <div class="modal-box">

    <h2 id="modalTitle">
      New Trigger
    </h2>

    <form class="form" id="form">

      <input type="hidden" id="editId">

      <label>Trigger Name</label>

      <input
        id="name"
        required
        placeholder="New user registration"
      >

      <label>Event</label>

      <select id="event" required>
        <option value="user.created">User Created</option>
        <option value="user.login">User Login</option>
        <option value="course.enrolled">Course Enrolled</option>
        <option value="payment.completed">Payment Completed</option>
        <option value="order.created">Order Created</option>
        <option value="custom">Custom</option>
      </select>

      <label>Condition</label>

      <input
        id="condition"
        placeholder="Optional condition"
      >

      <label>Description</label>

      <input
        id="description"
        placeholder="What starts this trigger?"
      >

      <div class="actions">

        <button
          type="submit"
          class="primary"
        >
          Save Trigger
        </button>

        <button
          type="button"
          id="closeBtn"
        >
          Cancel
        </button>

      </div>

    </form>

  </div>

</div>


<div class="toast" id="toast">
  Done
</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId:"G-85B7V5H5J0"
};

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


let user = null;
let triggers = [];


const $ =
  id =>
  document.getElementById(id);


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function toast(message){

  const el = $("toast");

  el.textContent = message;

  el.classList.add("show");

  setTimeout(
    () =>
      el.classList.remove("show"),
    1800
  );

}


function dateValue(value){

  try{

    if(
      value &&
      typeof value.toDate === "function"
    ){

      return value.toDate()
        .toLocaleString();

    }

    if(value){

      return new Date(value)
        .toLocaleString();

    }

  }catch(e){}

  return "—";

}


/* AUTH */

onAuthStateChanged(
  auth,
  currentUser => {

    user = currentUser;

    $("userEmail").textContent =
      user?.email || "Guest";

    loadTriggers();

  }
);


/* LOAD */

async function loadTriggers(){

  try{

    const snap =
      await getDocs(
        collection(
          db,
          "automationTriggers"
        )
      );

    triggers =
      snap.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );

    render();

  }catch(error){

    console.error(
      "Trigger load error:",
      error
    );

    triggers = [];

    render();

    toast(
      "Unable to load triggers"
    );

  }

}


/* RENDER */

function render(){

  const search =
    $("search")
      .value
      .toLowerCase()
      .trim();

  const event =
    $("eventFilter").value;

  const status =
    $("statusFilter").value;


  const list =
    triggers.filter(
      trigger => {

        const text =
          [
            trigger.name,
            trigger.event,
            trigger.description,
            trigger.condition
          ]
          .join(" ")
          .toLowerCase();

        const active =
          trigger.active !== false;

        return (
          (!search ||
            text.includes(search)) &&

          (
            event === "all" ||
            trigger.event === event
          ) &&

          (
            status === "all" ||
            (
              status === "active" &&
              active
            ) ||
            (
              status === "disabled" &&
              !active
            )
          )
        );

      }
    );


  $("total").textContent =
    triggers.length;

  $("active").textContent =
    triggers.filter(
      t => t.active !== false
    ).length;

  $("disabled").textContent =
    triggers.filter(
      t => t.active === false
    ).length;


  if(!list.length){

    $("list").innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          No triggers found.
        </td>
      </tr>
    `;

    return;

  }


  $("list").innerHTML =
    list.map(
      trigger => {

        const active =
          trigger.active !== false;

        return `
          <tr>

            <td>
              <b>
                ${escapeHTML(
                  trigger.name ||
                  "Untitled"
                )}
              </b>

              ${
                trigger.description
                  ? `
                    <div style="
                      color:#667085;
                      font-size:9px;
                      margin-top:3px
                    ">
                      ${escapeHTML(
                        trigger.description
                      )}
                    </div>
                  `
                  : ""
              }
            </td>

            <td>
              ${escapeHTML(
                trigger.event ||
                "custom"
              )}
            </td>

            <td>
              <span class="
                badge
                ${
                  active
                    ? "on"
                    : "off"
                }
              ">
                ${
                  active
                    ? "ACTIVE"
                    : "DISABLED"
                }
              </span>
            </td>

            <td>
              ${Number(
                trigger.executions || 0
              )}
            </td>

            <td>
              ${escapeHTML(
                dateValue(
                  trigger.updatedAt
                )
              )}
            </td>

            <td>

              <div class="actions">

                <button
                  class="primary"
                  data-edit="${trigger.id}"
                >
                  Edit
                </button>

                <button
                  class="success"
                  data-test="${trigger.id}"
                >
                  Test
                </button>

                <button
                  class="warning"
                  data-toggle="${trigger.id}"
                >
                  ${
                    active
                      ? "Disable"
                      : "Enable"
                  }
                </button>

                <button
                  class="danger"
                  data-delete="${trigger.id}"
                >
                  Delete
                </button>

              </div>

            </td>

          </tr>
        `;

      }
    )
    .join("");


  bindButtons();

}


/* BUTTONS */

function bindButtons(){

  document
    .querySelectorAll("[data-edit]")
    .forEach(
      button => {

        button.onclick =
          () =>
            editTrigger(
              button.dataset.edit
            );

      }
    );


  document
    .querySelectorAll("[data-toggle]")
    .forEach(
      button => {

        button.onclick =
          () =>
            toggleTrigger(
              button.dataset.toggle
            );

      }
    );


  document
    .querySelectorAll("[data-test]")
    .forEach(
      button => {

        button.onclick =
          () =>
            testTrigger(
              button.dataset.test
            );

      }
    );


  document
    .querySelectorAll("[data-delete]")
    .forEach(
      button => {

        button.onclick =
          () =>
            deleteTrigger(
              button.dataset.delete
            );

      }
    );

}


/* MODAL */

function openModal(){

  $("modal")
    .classList.add("show");

}


function closeModal(){

  $("modal")
    .classList.remove("show");

}


$("newBtn").onclick =
  () => {

    $("form").reset();

    $("editId").value = "";

    $("modalTitle")
      .textContent =
      "New Trigger";

    openModal();

  };


$("closeBtn").onclick =
  closeModal;


/* EDIT */

function editTrigger(id){

  const trigger =
    triggers.find(
      item =>
        item.id === id
    );

  if(!trigger) return;

  $("editId").value =
    id;

  $("name").value =
    trigger.name || "";

  $("event").value =
    trigger.event || "custom";

  $("condition").value =
    trigger.condition || "";

  $("description").value =
    trigger.description || "";

  $("modalTitle")
    .textContent =
    "Edit Trigger";

  openModal();

}


/* SAVE */

$("form")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();

      if(!user){

        toast(
          "Please login first"
        );

        return;

      }

      const id =
        $("editId").value;

      const data = {

        name:
          $("name").value.trim(),

        event:
          $("event").value,

        condition:
          $("condition")
            .value
            .trim(),

        description:
          $("description")
            .value
            .trim(),

        ownerId:
          user.uid,

        ownerEmail:
          user.email || "",

        active:true,

        updatedAt:
          serverTimestamp()

      };


      try{

        if(id){

          await updateDoc(
            doc(
              db,
              "automationTriggers",
              id
            ),
            data
          );

          toast(
            "Trigger updated"
          );

        }else{

          data.executions = 0;

          data.createdAt =
            serverTimestamp();

          await addDoc(
            collection(
              db,
              "automationTriggers"
            ),
            data
          );

          toast(
            "Trigger created"
          );

        }

        closeModal();

        await loadTriggers();

      }catch(error){

        console.error(
          "Save trigger error:",
          error
        );

        toast(
          "Unable to save trigger"
        );

      }

    }
  );


/* TOGGLE */

async function toggleTrigger(id){

  const trigger =
    triggers.find(
      item =>
        item.id === id
    );

  if(!trigger) return;

  try{

    await updateDoc(
      doc(
        db,
        "automationTriggers",
        id
      ),
      {
        active:
          trigger.active === false,
        updatedAt:
          serverTimestamp()
      }
    );

    toast(
      trigger.active === false
        ? "Trigger enabled"
        : "Trigger disabled"
    );

    await loadTriggers();

  }catch(error){

    console.error(error);

    toast(
      "Unable to update trigger"
    );

  }

}


/* TEST */

async function testTrigger(id){

  const trigger =
    triggers.find(
      item =>
        item.id === id
    );

  if(!trigger) return;

  try{

    await updateDoc(
      doc(
        db,
        "automationTriggers",
        id
      ),
      {
        executions:
          Number(
            trigger.executions || 0
          ) + 1,

        lastTestAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()
      }
    );

    toast(
      "Trigger test executed"
    );

    await loadTriggers();

  }catch(error){

    console.error(error);

    toast(
      "Test failed"
    );

  }

}


/* DELETE */

async function deleteTrigger(id){

  const trigger =
    triggers.find(
      item =>
        item.id === id
    );

  if(!trigger) return;

  if(
    !confirm(
      `Delete "${trigger.name || "this trigger"}"?`
    )
  ){

    return;

  }

  try{

    await deleteDoc(
      doc(
        db,
        "automationTriggers",
        id
      )
    );

    toast(
      "Trigger deleted"
    );

    await loadTriggers();

  }catch(error){

    console.error(error);

    toast(
      "Unable to delete trigger"
    );

  }

}


/* FILTER */

$("search")
  .addEventListener(
    "input",
    render
  );

$("eventFilter")
  .addEventListener(
    "change",
    render
  );

$("statusFilter")
  .addEventListener(
    "change",
    render
  );

$("refreshBtn")
  .addEventListener(
    "click",
    async () => {

      await loadTriggers();

      toast(
        "Triggers refreshed"
      );

    }
  );


/* CLOSE */

$("modal")
  .addEventListener(
    "click",
    e => {

      if(
        e.target ===
        $("modal")
      ){

        closeModal();

      }

    }
  );


document.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Escape"
    ){

      closeModal();

    }

  }
);


/* GLOBAL API */

window.refreshAutomationTriggers =
  loadTriggers;

window.getAutomationTriggers =
  () => [...triggers];

window.deleteAutomationTrigger =
  deleteTrigger;


console.log(
  "LetsStudy Pro Automation Triggers ready."
);

</script>

</body>
</html>
