<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(1000px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 12px}
.lead{font-size:18px;color:var(--muted);margin:0 0 28px;max-width:620px}
.hint{margin:-14px 0 22px;font-size:14px;color:var(--muted)}
.tools{display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px}
.search:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
#count{color:var(--muted);font-size:14px;margin:18px 0 14px;min-height:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.c{display:flex;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
.ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:26px}
.bd{min-width:0;flex:1}
.c h2{font-size:18px;line-height:1.3;margin:0 0 4px;color:var(--ink);letter-spacing:-.01em;overflow-wrap:anywhere}
.ds{margin:0;color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.b{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.b.ok{background:color-mix(in srgb,#16a34a 16%,transparent);color:#15803d}
.b.warn{background:color-mix(in srgb,#d97706 16%,transparent);color:#b45309}
.b.you{background:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.b.ok{color:#4ade80}.b.warn{color:#fbbf24}.b.you{color:#0b1220}}
.up{margin-top:10px;font-size:12px;color:var(--muted)}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.retry{margin-top:14px;border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.c{padding:16px}}

<main class="wrap">
  <h1>Automation Integrations</h1>
  <p class="lead">Payment, messaging and automation tools connected to LetsStudy Pro.</p>
  <p class="hint" id="hint"></p>

  <div class="tools">
    <input id="search" class="search" type="search" placeholder="Search integrations" aria-label="Search integrations">
    <div class="chips" id="chips" hidden=""></div>
  </div>

  <div id="count" role="status"></div>
  <section id="grid" class="grid"></section>
</main>

<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const grid=$("#grid"),count=$("#count"),chipBox=$("#chips"),hint=$("#hint");
let all=[],cat="",user=null;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const HIDDEN=/^(draft|disabled|inactive|rejected|archived|deleted|pending|suspended)$/i;
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}

const visible=n=>n.mine||(n.active===true&&!HIDDEN.test(n.status||""));

async function fetchAll(){
  const col=collection(db,"automationIntegrations");
  const qs=[query(col,where("active","==",true))];
  if(user)qs.push(query(col,where("ownerId","==",user.uid)));
  const res=await Promise.allSettled(qs.map(q=>getDocs(q)));
  const ok=res.filter(r=>r.status==="fulfilled");
  if(!ok.length)throw res[0].reason;
  const map=new Map();
  ok.forEach(r=>r.value.docs.forEach(d=>{
    const n={id:d.id,...d.data()};
    n.mine=!!user&&n.ownerId===user.uid;
    map.set(d.id,n);
  }));
  return [...map.values()];
}

function card(n){
  const st=String(n.status||""),x=toD(n.updatedAt||n.createdAt);
  const tone=/^(active|live|connected|approved|published|enabled)$/i.test(st)?"ok":/beta|soon|review/i.test(st)?"warn":"";
  return `<article class="c">
    <div class="ic" aria-hidden="true">${esc(n.icon||"🔌")}</div>
    <div class="bd">
      <h2>${esc(n.name||"Integration")}</h2>
      ${n.description?`<p class="ds">${esc(n.description)}</p>`:""}
      <div class="badges">
        ${n.mine?`<span class="b you">Yours</span>`:""}
        ${n.active!==true?`<span class="b">Inactive</span>`:""}
        ${n.category?`<span class="b">${esc(cap(n.category))}</span>`:""}
        ${st?`<span class="b ${tone}">${esc(cap(st))}</span>`:""}
      </div>
      ${x?`<div class="up" title="${esc(x.toLocaleString())}">Updated ${esc(ago(x))}</div>`:""}
    </div>
  </article>`;
}

function render(items){
  count.textContent=items.length===1?"1 integration":`${items.length} integrations`;
  grid.innerHTML=items.length?items.map(card).join(""):
    `<div class="state"><h2>No integrations found</h2><p>${all.length?"Try a different search or category.":"No integrations are available yet. Check back soon."}</p></div>`;
}

function apply(){
  const q=$("#search").value.toLowerCase().trim();
  render(all.filter(n=>(!cat||n.category===cat)&&
    (!q||[n.name,n.description,n.category,n.integrationKey,n.status].join(" ").toLowerCase().includes(q))));
}

function buildChips(){
  const cats=[...new Set(all.map(n=>n.category).filter(Boolean))].sort();
  if(cats.length<2){chipBox.hidden=true;return}
  chipBox.innerHTML=["",...cats].map(c=>`<button class="chip" type="button" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c?cap(c):"All")}</button>`).join("");
  chipBox.hidden=false;
}

chipBox.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  cat=b.dataset.c;
  chipBox.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  apply();
});
$("#search").addEventListener("input",apply);

function fail(err){
  console.error(err);
  count.textContent="";
  grid.innerHTML=`<div class="state err"><h2>Unable to load integrations</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="retry" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",load);
}

async function load(){
  hint.innerHTML=user?"":`<a href="login.html">Sign in</a> to also see integrations you own.`;
  try{
    all=(await fetchAll()).filter(visible)
      .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
  }catch(e){return fail(e)}
  cat="";
  buildChips();
  apply();
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,u=>{user=u;load()});
</script>
