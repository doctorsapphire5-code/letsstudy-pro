<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(780px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 12px}
.lead{font-size:18px;color:var(--muted);margin:0 0 28px;max-width:600px}
.tools{display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px}
.search:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
#count{color:var(--muted);font-size:14px;margin:18px 0 10px;min-height:21px}
.day{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.ev{--c:#64748b;position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px 10px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.ev::before{content:"";position:absolute;left:-30px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--c);border:3px solid var(--bg)}
.k-created,.k-resumed,.k-completed,.k-success{--c:#16a34a}
.k-updated,.k-edited{--c:#2563eb}
.k-deleted,.k-failed,.k-error{--c:#dc2626}
.k-paused,.k-skipped{--c:#d97706}
@media(prefers-color-scheme:dark){.k-created,.k-resumed,.k-completed,.k-success{--c:#4ade80}.k-updated,.k-edited{--c:#60a5fa}.k-deleted,.k-failed,.k-error{--c:#f87171}.k-paused,.k-skipped{--c:#fbbf24}}
.ev h2{font-size:16px;line-height:1.4;margin:0;color:var(--ink);overflow-wrap:anywhere}
.ev .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.ev time{font-size:13px;color:var(--muted);white-space:nowrap}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.more{display:block;margin:20px auto 0;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 20px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
.more:hover{border-color:var(--p)}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.btn{display:inline-block;margin-top:14px;border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.ev{flex-direction:column;align-items:flex-start;gap:8px}.ev .meta{flex-direction:row;align-items:center;gap:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="automationIntegrations.html">Integrations</a>
    <a href="automationScheduleActivity.html" aria-current="page">Activity</a>
  </nav>
</div></header>

<main class="wrap">
  <h1>Schedule Activity</h1>
  <p class="lead">A history of changes to your automation schedules, newest first.</p>

  <div class="tools" id="tools" hidden="">
    <input id="search" class="search" type="search" placeholder="Search activity" aria-label="Search activity">
    <div class="chips" id="chips" hidden=""></div>
  </div>

  <div id="count" role="status"></div>
  <section id="out"></section>
</main>

<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const out=$("#out"),count=$("#count"),chipBox=$("#chips"),tools=$("#tools");
const PAGE=50;
let all=[],cat="",shown=PAGE,user=null;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const kind=t=>String(t||"event").toLowerCase().replace(/[^a-z0-9]/g,"")||"event";
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const day0=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();

function dayLabel(x){
  const diff=Math.round((day0(new Date())-day0(x))/864e5);
  if(diff===0)return "Today";
  if(diff===1)return "Yesterday";
  return x.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}

function item(n){
  const k=kind(n.type),x=n.d;
  return `<li class="ev k-${k}">
    <h2>${esc(n.title||"Schedule activity")}</h2>
    <div class="meta"><span class="b">${esc(cap(k))}</span>${x?`<time datetime="${x.toISOString()}">${esc(x.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}))}</time>`:""}</div>
  </li>`;
}

function render(){
  const q=$("#search").value.toLowerCase().trim();
  const items=all.filter(n=>(!cat||kind(n.type)===cat)&&(!q||[n.title,n.type].join(" ").toLowerCase().includes(q)));
  count.textContent=items.length===1?"1 activity":`${items.length} activities`;
  if(!items.length){
    out.innerHTML=`<div class="state"><h2>No activity found</h2><p>${all.length?"Try a different search or type.":"Changes to your schedules will appear here."}</p></div>`;
    return;
  }
  const page=items.slice(0,shown);
  let html="",last="";
  for(const n of page){
    const label=n.d?dayLabel(n.d):"Earlier";
    if(label!==last){html+=(last?"</ul>":"")+`<h3 class="day">${esc(label)}</h3><ul class="tl">`;last=label}
    html+=item(n);
  }
  html+="</ul>";
  if(items.length>shown)html+=`<button class="more" id="more" type="button">Show more (${items.length-shown})</button>`;
  out.innerHTML=html;
}

function buildChips(){
  const types=[...new Set(all.map(n=>kind(n.type)))].sort();
  if(types.length<2){chipBox.hidden=true;return}
  chipBox.innerHTML=["",...types].map(c=>`<button class="chip" type="button" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c?cap(c):"All")}</button>`).join("");
  chipBox.hidden=false;
}

chipBox.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  cat=b.dataset.c;shown=PAGE;
  chipBox.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
});
out.addEventListener("click",e=>{if(e.target.closest("#more")){shown+=PAGE;render()}});
$("#search").addEventListener("input",()=>{shown=PAGE;render()});

function signedOut(){
  tools.hidden=true;count.textContent="";
  out.innerHTML=`<div class="state"><h2>Sign in to view your activity</h2><p>Schedule activity is private to your account.</p><a class="btn" href="login.html">Sign in</a></div>`;
}

function fail(err){
  console.error(err);
  count.textContent="";
  out.innerHTML=`<div class="state err"><h2>Unable to load activity</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",load);
}

async function load(){
  try{
    const snap=await getDocs(query(collection(db,"automationScheduleActivity"),where("ownerId","==",user.uid)));
    all=snap.docs.map(d=>{const n={id:d.id,...d.data()};n.d=toD(n.createdAt);return n})
      .sort((a,b)=>(b.d?b.d.getTime():0)-(a.d?a.d.getTime():0));
  }catch(e){return fail(e)}
  cat="";shown=PAGE;
  tools.hidden=false;
  buildChips();
  render();
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,u=>{user=u;u?load():signedOut()});
</script>
