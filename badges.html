<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

a{
  text-decoration:none;
}

.navbar{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
}

.nav-container{
  max-width:1100px;
  min-height:68px;
  margin:auto;
  padding:0 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;

  font-size:18px;

}

.logo-icon{

  display:flex;

}

.nav-links{

}

.nav-links a{

  font-size:12px;

}

.menu-btn{
  display:none;
  border:0;
  background:none;
  font-size:25px;
}

main{
  max-width:1000px;

  padding:35px 20px 60px;
}

.hero{
  text-align:center;
  margin-bottom:27px;
}

.hero-icon{
  width:65px;
  height:65px;

  margin:0 auto 13px;

  border-radius:18px;

  background:#eff6ff;

  display:flex;
  align-items:center;
  justify-content:center;

}

.hero h1{
  font-size:27px;
  margin-bottom:7px;
}

.hero p{
  color:#64748b;
  font-size:11px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;

}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:17px;
  text-align:center;
}

.stat strong{
  display:block;
  color:#2563eb;
  font-size:21px;
  margin-bottom:4px;
}

.stat span{
  color:#94a3b8;
  font-size:8px;
  font-weight:700;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-head h2{
  font-size:15px;
}

.section-head span{
  color:#94a3b8;
  font-size:8px;
}

.badges-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
}

.badge-card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:17px 13px;
  text-align:center;
  position:relative;
}

.badge-card.earned{
  border-color:#bfdbfe;
}

.badge-card.locked{
  opacity:.55;
}

.badge-icon{
  width:65px;
  height:65px;

  margin:0 auto 12px;

  border-radius:50%;

  background:#eff6ff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:30px;

  border:4px solid #dbeafe;
}

.locked .badge-icon{
  background:#f1f5f9;
  border-color:#e2e8f0;
  filter:grayscale(1);
}

.badge-card h3{
  font-size:11px;
  margin-bottom:5px;
}

.badge-card p{
  color:#64748b;
  font-size:8px;
  line-height:1.5;
  min-height:25px;
  margin-bottom:9px;
}

.status{
  font-size:7px;
  font-weight:900;
  margin-bottom:8px;
}

.earned .status{
  color:#16a34a;
}

.locked .status{
  color:#94a3b8;
}

.progress{
  width:100%;
  height:5px;
  background:#e2e8f0;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:#2563eb;
  border-radius:20px;
}

.progress-text{
  color:#94a3b8;
  font-size:7px;
  margin-top:5px;
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:50px 20px;
  text-align:center;
  color:#94a3b8;
  font-size:10px;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:55px;
  color:#64748b;
  font-size:10px;
}

.message{
  display:none;
  padding:11px;
  border-radius:8px;
  margin-bottom:18px;
  font-size:9px;
}

.message.show{
  display:block;
}

.message.error{
  background:#fee2e2;
  color:#991b1b;
}

footer{
  text-align:center;
  padding:30px;
  color:#94a3b8;
  font-size:9px;
}

@media(max-width:850px){

  .badges-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:650px){

  .nav-links{
    display:none;
  }

  .menu-btn{
    display:block;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .badges-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:400px){

  .badges-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header class="navbar">

<div class="nav-container">

<a href="/" class="logo">

<div class="logo-icon">
LS
</div>

LetsStudy Pro

</a>


<nav class="nav-links">

<a href="/">Home</a>
<a href="/achievements.html">Achievements</a>

<a href="/profile.html">Profile</a>

</nav>


<button
id="menuBtn"
class="menu-btn">

<main>


<section class="hero">

<div class="hero-icon">
🏅

<h1>
Badges
</h1>

<p>
Collect badges as you learn, complete courses and reach milestones.
</p>

id="message"
class="message">

<section class="stats">

<div class="stat">

<strong id="earnedCount">
0

<span>
Badges Earned

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const badgesContainer =
document.getElementById(
  "badges"
);

const earnedCount =
document.getElementById(
  "earnedCount"
);

const totalCount =
document.getElementById(
  "totalCount"
);

const xpElement =
document.getElementById(
  "xp"
);

const completion =
document.getElementById(
  "completion"
);

const message =
document.getElementById(
  "message"
);


/* =========================
   BADGE DEFINITIONS
========================= */

const badges = [

  {
    id:"welcome",
    icon:"👋",
    name:"Welcome Learner",
    description:"Create your LetsStudy Pro account.",
    field:"accountCreated",
    target:1
  },

  {
    id:"first_course",
    icon:"🎓",
    name:"First Course",
    description:"Enroll in your first course.",
    field:"coursesEnrolled",
    target:1
  },

  {
    id:"course_finisher",
    icon:"🏆",
    name:"Course Finisher",
    description:"Complete your first course.",
    field:"coursesCompleted",
    target:1
  },

  {
    id:"course_master",
    icon:"👑",
    name:"Course Master",
    description:"Complete 5 courses.",
    field:"coursesCompleted",
    target:5
  },

  {
    id:"quiz_beginner",
    icon:"📝",
    name:"Quiz Beginner",
    description:"Complete your first quiz.",
    field:"quizzesCompleted",
    target:1
  },

  {
    id:"quiz_master",
    icon:"🧠",
    name:"Quiz Master",
    description:"Complete 20 quizzes.",
    field:"quizzesCompleted",
    target:20
  },

  {
    id:"perfect_score",
    icon:"💯",
    name:"Perfect Score",
    description:"Get a perfect quiz result.",
    field:"perfectQuizzes",
    target:1
  },

  {
    id:"bookworm",
    icon:"📚",
    name:"Bookworm",
    description:"Download 10 learning resources.",
    field:"resourcesDownloaded",
    target:10
  },

  {
    id:"resource_master",
    icon:"📖",
    name:"Resource Master",
    description:"Download 50 learning resources.",
    field:"resourcesDownloaded",
    target:50
  },

  {
    id:"streak_7",
    icon:"🔥",
    name:"7 Day Streak",
    description:"Study for 7 consecutive days.",
    field:"streak",
    target:7
  },

  {
    id:"streak_30",
    icon:"⚡",
    name:"30 Day Streak",
    description:"Study for 30 consecutive days.",
    field:"streak",
    target:30
  },

  {
    id:"certificate",
    icon:"📜",
    name:"Certified Learner",
    description:"Earn your first certificate.",
    field:"certificates",
    target:1
  },

  {
    id:"top_10",
    icon:"⭐",
    name:"Top 10",
    description:"Reach the top 10 leaderboard.",
    field:"leaderboardRank",
    target:10
  },

  {
    id:"xp_1000",
    icon:"💎",
    name:"1K XP",
    description:"Earn 1,000 learning XP.",
    field:"points",
    target:1000
  }

];


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      showLogin();

      return;

    }


    loadBadges(
      user.uid
    );

  }
);


/* =========================
   LOAD USER
========================= */

async function loadBadges(
uid
){

  try{

    const snapshot =
    await get(
      ref(
        db,
        "users/" +
        uid
      )
    );


    if(
      !snapshot.exists()
    ){

      renderBadges(
        {}
      );

      return;

    }


    const user =
    snapshot.val();


    const userData = {

      ...user,

      points:
      Number(
        user.points ??
        user.xp ??
        0
      )

    };


    xpElement.textContent =
    Number(
      userData.points
    ).toLocaleString();


    const results =
    badges.map(
      badge =>
      calculateBadge(
        badge,
        userData
      )
    );


    const earned =
    results.filter(
      badge =>
      badge.earned
    );


    earnedCount.textContent =
    earned.length;


    totalCount.textContent =
    results.length;


    const percent =
    results.length
    ? Math.round(
        (
          earned.length /
          results.length
        ) * 100
      )
    : 0;


    completion.textContent =
    percent +
    "% Complete";


    renderBadges(
      results
    );


  }catch(error){

    console.error(
      "Badges error:",
      error
    );


    showError();

  }

}


/* =========================
   CALCULATE BADGE
========================= */

function calculateBadge(
badge,
user
){

  let current =
  Number(
    user[
      badge.field
    ] || 0
  );


  /*
   * Account-created badge
   */

  if(
    badge.field ===
    "accountCreated"
  ){

    current =
    user.createdAt
    ? 1
    : 0;

  }


  const target =
  Number(
    badge.target ||
    1
  );


  const percent =
  Math.min(
    100,
    Math.round(
      (
        current /
        target
      ) * 100
    )
  );


  return {

    ...badge,

    current,

    target,

    percent,

    earned:
    current >= target

  };

}


/* =========================
   RENDER
========================= */

function renderBadges(
items
){

  badgesContainer.innerHTML =
  "";


  if(
    !items.length
  ){

    badgesContainer.innerHTML = `

      <div class="empty">

        No badges available.

      </div>

    `;

    return;

  }


  items.forEach(
    badge => {

      const card =
      document.createElement(
        "article"
      );


      card.className =
      "badge-card " +
      (
        badge.earned
        ? "earned"
        : "locked"
      );


      card.innerHTML = `

        <div class="badge-icon">

          ${escapeHTML(
            badge.icon
          )}

        </div>


        <h3>

          ${escapeHTML(
            badge.name
          )}

        </h3>


        <p>

          ${escapeHTML(
            badge.description
          )}

        </p>


        <div class="status">

          ${
            badge.earned
            ? "✓ EARNED"
            : "🔒 LOCKED"
          }

        </div>


        <div class="progress">

          <div
            class="progress-bar"
            style="width:${badge.percent}%">
          </div>

        </div>


        <div class="progress-text">

          ${badge.current}
          /
          ${badge.target}

          ${
            badge.earned
            ? " — Complete"
            : ""
          }

        </div>

      `;


      badgesContainer.appendChild(
        card
      );

    }
  );

}


/* =========================
   LOGIN
========================= */

function showLogin(){

  badgesContainer.innerHTML = `

    <div class="empty">

      <div style="font-size:30px;margin-bottom:10px;">
        🔐
      </div>

      <p style="margin-bottom:15px;">
        Login to view your badges.
      </p>

      <a
        href="/login.html"
        style="
          display:inline-block;
          background:#2563eb;
          color:#fff;
          padding:10px 18px;
          border-radius:8px;
          font-size:9px;
          font-weight:800;
        ">

        Login

      </a>

    </div>

  `;

}


/* =========================
   ERROR
========================= */

function showError(){

  message.textContent =
  "Unable to load badges. Please try again.";

  message.className =
  "message show error";


  badgesContainer.innerHTML = `

    <div class="empty">

      Unable to load badges.

    </div>

  `;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   MOBILE MENU
========================= */

document
.getElementById(
"menuBtn"
)
.addEventListener(
"click",
function(){

  document
  .querySelector(
    ".nav-links"
  )
  .classList.toggle(
    "active"
  );

});

</script>

</body>

</html>
