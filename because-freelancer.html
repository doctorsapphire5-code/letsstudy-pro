<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Become a Freelancer | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
background:#07111f;
color:white;
padding:15px 5%;
position:sticky;
top:0;
z-index:10
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:22px;
font-weight:900;
color:white;
text-decoration:none
}

.logo span{color:#22d3ee}

.nav a{
color:white;
text-decoration:none
}

.hero{
background:linear-gradient(135deg,#07111f,#164e63);
color:white;
padding:60px 5%
}

.wrap{
max-width:900px;
margin:auto
}

.hero h1{
font-size:42px;
margin:0 0 12px
}

.hero p{
color:#cbd5e1;
line-height:1.7
}

.form-card{
background:white;
margin:-30px auto 50px;
padding:30px;
border-radius:18px;
box-shadow:0 15px 45px #0002
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px
}

.full{grid-column:1/-1}

label{
display:block;
font-weight:bold;
font-size:14px;
margin-bottom:7px
}

input,textarea,select{
width:100%;
padding:13px;
border:1px solid #dbe1ea;
border-radius:9px;
outline:none;
font:inherit
}

textarea{
min-height:120px;
resize:vertical
}

input:focus,textarea:focus,select:focus{
border-color:#2563eb
}

button{
width:100%;
border:0;
padding:14px;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer
}

button:hover{background:#1d4ed8}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.status{
display:none;
padding:13px;
border-radius:9px;
margin-bottom:20px
}

.success{
display:block;
background:#dcfce7;
color:#166534
}

.error{
display:block;
background:#fee2e2;
color:#991b1b
}

footer{
background:#07111f;
color:#94a3b8;
padding:40px 5%
}

@media(max-width:650px){
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
.hero h1{font-size:32px}
.form-card{padding:20px}
}
</style>
</head>

<body>

<header>
<div class="nav">

<a class="logo" href="index.html">
LetsStudy <span>Pro</span>
</a>

<a href="freelancers.html">
<i class="fa fa-users"></i> Freelancers
</a>

</div>
</header>

<section class="hero">

<div class="wrap">

<h1>Become a Freelancer</h1>

<p>
Turn your skills into opportunities. Create your LetsStudy Pro
freelancer profile and start offering your services to clients.
</p>

</div>

</section>

<main class="wrap">

<div class="form-card">

<div id="status" class="status"></div>

<form id="freelancerForm">

<div class="grid">

<div>
<label>Name</label>
<input id="name" required placeholder="Your full name">
</div>

<div>
<label>Username</label>
<input id="username" required placeholder="username">
</div>

<div class="full">
<label>Headline</label>
<input id="headline"
placeholder="e.g. Digital Marketer & SEO Specialist">
</div>

<div class="full">
<label>Bio</label>
<textarea id="bio"
placeholder="Tell clients about yourself..."></textarea>
</div>

<div>
<label>Profile Image URL</label>
<input id="profileImage"
placeholder="https://...">
</div>

<div>
<label>Cover Image URL</label>
<input id="coverImage"
placeholder="https://...">
</div>

<div>
<label>Country</label>
<input id="country" placeholder="Tanzania">
</div>

<div>
<label>Region</label>
<input id="region" placeholder="Dar es Salaam">
</div>

<div>
<label>City</label>
<input id="city" placeholder="Dar es Salaam">
</div>

<div>
<label>Timezone</label>
<input id="timezone" placeholder="Africa/Dar_es_Salaam">
</div>

<div>
<label>Languages</label>
<input id="languages"
placeholder="English, Swahili">
</div>

<div>
<label>Skills</label>
<input id="skills"
placeholder="SEO, Marketing, Design">
</div>

<div>
<label>Categories</label>
<input id="categories"
placeholder="Marketing, Technology">
</div>

<div>
<label>Experience Level</label>

<select id="experienceLevel">

<option value="Beginner">Beginner</option>
<option value="Intermediate">Intermediate</option>
<option value="Expert">Expert</option>

</select>

</div>

<div>
<label>Hourly Rate</label>
<input id="hourlyRate"
type="number"
min="0"
placeholder="0">
</div>

<div>
<label>Currency</label>

<select id="currency">

<option value="TZS">TZS</option>
<option value="USD">USD</option>
<option value="EUR">EUR</option>

</select>

</div>

<div>
<label>Availability</label>
<input id="availability"
placeholder="Available">
</div>

<div>
<label>Response Time</label>
<input id="responseTime"
placeholder="Within 1 hour">
</div>

<div class="full">

<button id="submitBtn" type="submit">

<i class="fa fa-user-plus"></i>
Create Freelancer Profile

</button>

</div>

</div>

</form>

</div>

</main>

<footer>

<div class="wrap">

<h2 style="color:white">LetsStudy Pro</h2>

<p>Learn. Build. Grow.</p>

<p>
Professional learning, careers and business ecosystem.
</p>

</div>

</footer>

<script type="module">

import {
initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

let currentUser=null;


/* ================= AUTH ================= */

onAuthStateChanged(auth,user=>{

currentUser=user;

});


/* ================= FORM ================= */

document
.getElementById("freelancerForm")
.addEventListener("submit",async e=>{

e.preventDefault();

const status=
document.getElementById("status");

const btn=
document.getElementById("submitBtn");

if(!currentUser){

status.className="status error";

status.innerHTML=
'<i class="fa fa-lock"></i> Please login before becoming a freelancer.';

return;

}

btn.disabled=true;

btn.innerHTML=
'<i class="fa fa-spinner fa-spin"></i> Creating profile...';

try{

const data={

userId:currentUser.uid,

name:value("name"),

username:value("username"),

headline:value("headline"),

bio:value("bio"),

profileImage:value("profileImage"),

coverImage:value("coverImage"),

country:value("country"),

region:value("region"),

city:value("city"),

timezone:value("timezone"),

languages:arrayValue("languages"),

skills:arrayValue("skills"),

categories:arrayValue("categories"),

experienceLevel:value("experienceLevel"),

hourlyRate:Number(
document.getElementById("hourlyRate").value || 0
),

currency:value("currency"),

availability:value("availability"),

responseTime:value("responseTime"),

totalJobs:0,

completedJobs:0,

activeJobs:0,

rating:0,

ratingCount:0,

totalEarnings:0,

portfolioCount:0,

verified:false,

featured:false,

status:"pending",

createdAt:serverTimestamp(),

updatedAt:serverTimestamp(),

publishedAt:null

};


const ref=await addDoc(
collection(db,"freelancers"),
data
);


status.className="status success";

status.innerHTML=`
<i class="fa fa-circle-check"></i>
Freelancer profile created successfully.
`;

document
.getElementById("freelancerForm")
.reset();

setTimeout(()=>{

location.href=
"freelancer.html?id="+
encodeURIComponent(ref.id);

},1200);


}catch(error){

console.error(error);

status.className="status error";

status.innerHTML=
'<i class="fa fa-circle-exclamation"></i> '+
error.message;

btn.disabled=false;

btn.innerHTML=
'<i class="fa fa-user-plus"></i> Create Freelancer Profile';

}

});


/* ================= HELPERS ================= */

function value(id){

return document
.getElementById(id)
.value
.trim();

}

function arrayValue(id){

return value(id)
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}

</script>

</body>
</html>
