<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Blocked Members | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="Manage blocked members in Let'sStudy Pro Community."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
  --danger:#b91c1c;
  --danger-bg:#fef2f2;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);

  color:var(--text);
}


/* =========================
   HEADER
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:50;

  min-height:64px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  background:
    rgba(255,255,255,.97);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;

  gap:9px;

  font-size:13px;
  font-weight:850;
}

.brand-icon{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:var(--primary);

  color:#fff;
}

.back-btn{
  border:0;

  padding:9px 12px;

  border-radius:9px;

  background:var(--soft);

  color:var(--text);

  font-family:inherit;

  font-size:10px;
  font-weight:800;

  cursor:pointer;
}


/* =========================
   MAIN
========================= */

.container{
  width:100%;
  max-width:700px;

  margin:auto;

  padding:
    28px 15px
    70px;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:24px;

  font-weight:850;
}

.heading p{
  margin-top:5px;

  color:var(--muted);

  font-size:11px;

  line-height:1.5;
}


/* =========================
   SEARCH
========================= */

.search{
  width:100%;

  margin-bottom:14px;

  padding:11px 13px;

  border:
    1px solid var(--border);

  border-radius:10px;

  outline:none;

  background:#fff;

  color:var(--text);

  font-family:inherit;

  font-size:11px;
}

.search:focus{
  border-color:#64748b;
}


/* =========================
   LIST
========================= */

.list{
  display:flex;

  flex-direction:column;

  gap:9px;
}

.blocked-user{
  display:flex;

  align-items:center;

  gap:12px;

  padding:13px;

  border:
    1px solid var(--border);

  border-radius:13px;

  background:var(--card);
}

.avatar{
  width:45px;
  height:45px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  border-radius:50%;

  background:var(--soft);

  font-size:12px;
  font-weight:850;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.user-info{
  min-width:0;

  flex:1;
}

.name{
  font-size:12px;

  font-weight:850;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.username{
  margin-top:2px;

  color:var(--muted);

  font-size:9px;
}

.block-date{
  margin-top:5px;

  color:var(--muted);

  font-size:8px;
}

.unblock-btn{
  flex-shrink:0;

  padding:8px 10px;

  border:
    1px solid #fecaca;

  border-radius:8px;

  background:var(--danger-bg);

  color:var(--danger);

  font-family:inherit;

  font-size:9px;
  font-weight:850;

  cursor:pointer;
}

.unblock-btn:disabled{
  opacity:.5;

  cursor:not-allowed;
}


/* =========================
   EMPTY
========================= */

.empty{
  display:none;

  padding:55px 20px;

  border:
    1px solid var(--border);

  border-radius:15px;

  background:#fff;

  text-align:center;
}

.empty-icon{
  font-size:42px;

  margin-bottom:10px;
}

.empty h2{
  font-size:16px;
}

.empty p{
  margin-top:5px;

  color:var(--muted);

  font-size:10px;
}


/* =========================
   LOADING
========================= */

.loading{
  min-height:55vh;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:var(--muted);

  font-size:11px;
}

.spinner{
  width:30px;
  height:30px;

  margin:
    0 auto
    10px;

  border:
    3px solid var(--border);

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   ERROR
========================= */

.error{
  display:none;

  margin-bottom:14px;

  padding:11px 13px;

  border:
    1px solid #fecaca;

  border-radius:10px;

  background:var(--danger-bg);

  color:var(--danger);

  font-size:10px;
}

.error.show{
  display:block;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{
    padding:0 10px;
  }

  .container{
    padding:
      22px 10px
      55px;
  }

  .heading h1{
    font-size:21px;
  }

  .blocked-user{
    padding:11px;
  }

  .avatar{
    width:42px;
    height:42px;
  }

  .unblock-btn{
    padding:7px 8px;
  }

}

</style>

</head>


<body>


<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      🚫
    </div>

    <span>
      Let'sStudy Pro Community
    </span>

  </div>


  <button
    class="back-btn"
    type="button"
    onclick="goBack()"
  >
    ← Back
  </button>

</header>


<main class="container">


  <section class="heading">

    <h1>
      Blocked Members
    </h1>

    <p>
      Manage members you have blocked from interacting with you.
    </p>

  </section>


  <div
    id="error"
    class="error"
  ></div>


  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search blocked members..."
    autocomplete="off"
  >


  <div
    id="loading"
    class="loading"
  >

    <div>

      <div class="spinner"></div>

      <p>
        Loading blocked members...
      </p>

    </div>

  </div>


  <section
    id="list"
    class="list"
  ></section>


  <section
    id="empty"
    class="empty"
  >

    <div class="empty-icon">
      👥
    </div>

    <h2>
      No blocked members
    </h2>

    <p>
      Members you block will appear here.
    </p>

  </section>


</main>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();

const auth =
  firebase.auth();


/* =========================
   STATE
========================= */

let currentUser =
  null;

let blockedUsers =
  [];

let unsubscribeBlocks =
  null;


/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function getInitials(
  name
){

  return String(
    name ||
    "Member"
  )
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(
    word =>
      word
        .charAt(0)
        .toUpperCase()
  )
  .join("");

}


function formatDate(
  timestamp
){

  if(!timestamp){

    return "Recently";

  }


  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);


    return date.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

  }

  catch{

    return "Recently";

  }

}


function showError(
  message
){

  const error =
    document.getElementById(
      "error"
    );

  error.textContent =
    message;

  error.classList.add(
    "show"
  );

}


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
  user => {

    currentUser =
      user;


    if(!user){

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      showError(
        "Please sign in to manage blocked members."
      );

      return;

    }


    listenForBlocks();

  }
);


/* =========================
   LOAD BLOCKS
========================= */

function listenForBlocks(){

  if(
    unsubscribeBlocks
  ){

    unsubscribeBlocks();

  }


  unsubscribeBlocks =
    db
      .collection(
        "blocks"
      )
      .where(
        "blockerId",
        "==",
        currentUser.uid
      )
      .orderBy(
        "createdAt",
        "desc"
      )
      .onSnapshot(

        async snapshot => {

          const blocks =
            snapshot.docs.map(
              doc => ({

                id:
                  doc.id,

                ...doc.data()

              })
            );


          await loadBlockedUsers(
            blocks
          );


          document.getElementById(
            "loading"
          ).style.display =
            "none";


          renderBlockedUsers();

        },

        error => {

          console.error(
            "Blocks listener error:",
            error
          );


          document.getElementById(
            "loading"
          ).style.display =
            "none";


          showError(
            "Unable to load blocked members."
          );

        }

      );

}


/* =========================
   LOAD USER PROFILES
========================= */

async function loadBlockedUsers(
  blocks
){

  blockedUsers =
    [];


  for(
    const block of blocks
  ){

    try{

      const snapshot =
        await db
          .collection(
            "users"
          )
          .doc(
            block.blockedId
          )
          .get();


      if(
        snapshot.exists
      ){

        blockedUsers.push({

          blockId:
            block.id,

          blockedId:
            block.blockedId,

          createdAt:
            block.createdAt,

          user:
            snapshot.data()

        });

      }

      else{

        blockedUsers.push({

          blockId:
            block.id,

          blockedId:
            block.blockedId,

          createdAt:
            block.createdAt,

          user:{

            displayName:
              "Community Member",

            username:
              "",

            photoURL:
              "",

            bio:
              ""

          }

        });

      }

    }

    catch(error){

      console.error(
        "User loading error:",
        error
      );

    }

  }

}


/* =========================
   RENDER
========================= */

function renderBlockedUsers(){

  const container =
    document.getElementById(
      "list"
    );

  const empty =
    document.getElementById(
      "empty"
    );


  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  container.innerHTML =
    "";


  const filtered =
    blockedUsers.filter(
      item => {

        const user =
          item.user ||
          {};


        const name =
          (
            user.displayName ||
            ""
          ).toLowerCase();


        const username =
          (
            user.username ||
            ""
          ).toLowerCase();


        return (
          !search ||
          name.includes(search) ||
          username.includes(search)
        );

      }
    );


  if(
    !filtered.length
  ){

    empty.style.display =
      "block";

    empty.querySelector(
      "h2"
    ).textContent =
      search
        ? "No members found"
        : "No blocked members";

    empty.querySelector(
      "p"
    ).textContent =
      search
        ? "Try another search."
        : "Members you block will appear here.";

    return;

  }


  empty.style.display =
    "none";


  filtered.forEach(
    item => {

      renderBlockedUser(
        item
      );

    }
  );

}


/* =========================
   USER CARD
========================= */

function renderBlockedUser(
  item
){

  const container =
    document.getElementById(
      "list"
    );


  const user =
    item.user ||
    {};


  const name =
    user.displayName ||
    user.username ||
    "Community Member";


  const username =
    user.username
      ? `@${user.username}`
      : "";


  const photo =
    user.photoURL ||
    "";


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "blocked-user";


  const avatar =
    photo

      ? `
        <img
          src="${escapeHTML(
            photo
          )}"
          alt="${escapeHTML(
            name
          )}"
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      `

      : escapeHTML(
          getInitials(
            name
          )
        );


  card.innerHTML =
    `

      <div class="avatar">

        ${avatar}

      </div>


      <div class="user-info">

        <div class="name">

          ${escapeHTML(
            name
          )}

        </div>


        <div class="username">

          ${escapeHTML(
            username
          )}

        </div>


        <div class="block-date">

          Blocked ${escapeHTML(
            formatDate(
              item.createdAt
            )
          )}

        </div>

      </div>


      <button
        class="unblock-btn"
        type="button"
        data-block-id="${escapeHTML(
          item.blockId
        )}"
        data-user-id="${escapeHTML(
          item.blockedId
        )}"
      >
        Unblock
      </button>

    `;


  card
    .querySelector(
      ".unblock-btn"
    )
    .addEventListener(
      "click",
      () => {

        unblockUser(
          item.blockId,
          item.blockedId
        );

      }
    );


  container.appendChild(
    card
  );

}


/* =========================
   UNBLOCK
========================= */

async function unblockUser(
  blockId,
  blockedId
){

  if(!currentUser){

    return;

  }


  const confirmed =
    window.confirm(
      "Unblock this member?"
    );


  if(!confirmed){

    return;

  }


  try{

    await db
      .collection(
        "blocks"
      )
      .doc(
        blockId
      )
      .delete();


    /*
      If the block document was created
      using blockerId_blockedId as ID,
      this same delete works directly.
    */


  }

  catch(error){

    console.error(
      "Unblock error:",
      error
    );


    showError(
      "Unable to unblock this member."
    );

  }

}


/* =========================
   SEARCH
========================= */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    renderBlockedUsers
  );


/* =========================
   BACK
========================= */

function goBack(){

  if(
    unsubscribeBlocks
  ){

    unsubscribeBlocks();

  }


  if(
    document.referrer &&
    document.referrer.startsWith(
      window.location.origin
    )
  ){

    window.history.back();

  }

  else{

    window.location.href =
      "community.html";

  }

}


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(
      unsubscribeBlocks
    ){

      unsubscribeBlocks();

    }

  }
);


/* =========================
   GLOBAL ERROR
========================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled Community error:",
      event.reason
    );

  }
);

</script>

</body>

</html>
