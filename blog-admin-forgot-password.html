<body>

  <main class="container">

    <div class="brand">
      <div class="brand-icon">V</div>
      <h1>Vorix Blog</h1>
      <p>Administrator Portal</p>
    </div>

    <h2>Forgot Password?</h2>

    <p class="description">
      Enter the email address associated with your administrator account.
      We will send you a password reset link.
    </p>

    <div id="message" class="message" role="alert"></div>

    <form id="resetForm">

      <label for="email">Administrator Email</label>

      <input type="email" id="email" placeholder="Enter your admin email" autocomplete="email" required="">

      <button type="submit" id="submitBtn">
        Send Reset Link
      </button>

    </form>

    <div class="links">
      <a href="blog-admin-login.html">Back to Admin Login</a>
      <br>
      <a href="blog-admin-register.html">Create Admin Account</a>
    </div>

    <div class="footer">
      © <span id="year"></span> Vorix Blog. All rights reserved.
    </div>

  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCYsJv9qChj1Wc1Xz78aZhgn4tHyGF1Grg",
      authDomain: "vorix-blog.firebaseapp.com",
      projectId: "vorix-blog",
      storageBucket: "vorix-blog.firebasestorage.app",
      messagingSenderId: "111344561738",
      appId: "1:111344561738:web:8f7e64709698c7f58f80b3",
      measurementId: "G-34BPPH3F77"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    const $ = id => document.getElementById(id);

    $("year").textContent = new Date().getFullYear();

    function showMessage(text, type) {
      const message = $("message");
      message.textContent = text;
      message.className = "message " + type;
    }

    // Password reset form
    $("resetForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = $("email").value.trim().toLowerCase();
      const button = $("submitBtn");

      if (!email) {
        showMessage("Please enter your administrator email.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Sending...";

      try {
        // Send Firebase password reset email
        await auth.sendPasswordResetEmail(email, {
          url: window.location.origin + "/blog-admin-login.html",
          handleCodeInApp: false
        });

        showMessage(
          "If an account exists for this email, a password reset link has been sent. Please check your inbox and spam folder.",
          "success"
        );

        $("email").value = "";

      } catch (error) {
        console.error("Password reset error:", error);

        // Avoid revealing whether an email is registered.
        if (
          error.code === "auth/invalid-email" ||
          error.code === "auth/missing-email"
        ) {
          showMessage("Please enter a valid email address.", "error");
        } else if (
          error.code === "auth/too-many-requests"
        ) {
          showMessage(
            "Too many attempts. Please wait before trying again.",
            "error"
          );
        } else {
          showMessage(
            "Unable to process your request right now. Please try again later.",
            "error"
          );
        }

      } finally {
        button.disabled = false;
        button.textContent = "Send Reset Link";
      }
    });

  </script>
