<body>

  <main class="container">

    <div class="brand">
      <div class="brand-icon">V</div>
      <h1>Vorix Blog</h1>
      <p>Administrator Portal</p>
    </div>

    <section id="resetSection">

      <h2>Reset Your Password</h2>

      <p class="description">
        Create a new password for your administrator account.
        Choose a strong password that you have not used before.
      </p>

      <div id="emailBox" class="email-box hidden">
        <strong>Account email:</strong>
        <span id="accountEmail"></span>
      </div>

      <div id="message" class="message" role="alert"></div>

      <form id="resetForm" class="hidden">

        <label for="password">New Password</label>

        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter new password" autocomplete="new-password" minlength="8" required="">
          <button type="button" class="toggle" data-target="password">Show</button>
        </div>

        <p class="hint">Use at least 8 characters.</p>

        <label for="confirmPassword">Confirm New Password</label>

        <div class="input-wrap">
          <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required="">
          <button type="button" class="toggle" data-target="confirmPassword">Show</button>
        </div>

        <button type="submit" class="submit" id="submitBtn">
          Update Password
        </button>

      </form>

    </section>

    <div class="links">
      <a href="blog-admin-login.html">Back to Admin Login</a>
    </div>

    <div class="footer">
      © <span id="year"></span> Vorix Blog. All rights reserved.
    </div>

  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCYsJv9qChj1Wc1Xz78aZhgn4tHyGF1Grg",
      authDomain: "vorix-blog.firebaseapp.com",
      projectId: "vorix-blog",
      storageBucket: "vorix-blog.firebasestorage.app",
      messagingSenderId: "111344561738",
      appId: "1:111344561738:web:8f7e64709698c7f58f80b3",
      measurementId: "G-34BPPH3F77"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();

    const $ = id => document.getElementById(id);

    $("year").textContent = new Date().getFullYear();

    const params = new URLSearchParams(window.location.search);

    const mode = params.get("mode");
    const actionCode = params.get("oobCode");

    let verifiedEmail = "";

    function showMessage(text, type) {
      const message = $("message");
      message.textContent = text;
      message.className = "message " + type;
    }

    function getErrorMessage(error) {
      switch (error.code) {
        case "auth/expired-action-code":
          return "This password reset link has expired. Request a new reset link.";

        case "auth/invalid-action-code":
          return "This password reset link is invalid or has already been used.";

        case "auth/user-disabled":
          return "This administrator account has been disabled.";

        case "auth/user-not-found":
          return "The account associated with this link could not be found.";

        case "auth/weak-password":
          return "Your password is too weak. Please choose a stronger password.";

        default:
          return "Something went wrong. Please request a new password reset link.";
      }
    }

    async function verifyResetCode() {
      if (mode !== "resetPassword" || !actionCode) {
        showMessage(
          "Invalid reset link. Please request a new password reset email.",
          "error"
        );
        return;
      }

      try {
        verifiedEmail = await auth.verifyPasswordResetCode(actionCode);

        $("accountEmail").textContent = verifiedEmail;
        $("emailBox").classList.remove("hidden");
        $("resetForm").classList.remove("hidden");

      } catch (error) {
        console.error("Reset code verification:", error);

        showMessage(getErrorMessage(error), "error");
      }
    }

    // Show or hide passwords
    document.querySelectorAll(".toggle").forEach(button => {
      button.addEventListener("click", function() {
        const target = $(this.dataset.target);

        if (target.type === "password") {
          target.type = "text";
          this.textContent = "Hide";
        } else {
          target.type = "password";
          this.textContent = "Show";
        }
      });
    });

    // Submit new password
    $("resetForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const password = $("password").value;
      const confirmPassword = $("confirmPassword").value;
      const button = $("submitBtn");

      if (password.length < 8) {
        showMessage(
          "Password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match. Please try again.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";

      try {
        // Confirm the action code and update Firebase Auth password
        await auth.confirmPasswordReset(actionCode, password);

        $("resetForm").classList.add("hidden");
        $("emailBox").classList.add("hidden");

        showMessage(
          "Your password has been updated successfully. You can now sign in using your new password.",
          "success"
        );

      } catch (error) {
        console.error("Password update error:", error);

        showMessage(getErrorMessage(error), "error");

      } finally {
        button.disabled = false;
        button.textContent = "Update Password";
      }
    });

    // Verify reset link on page load
    verifyResetCode();
  </script>
