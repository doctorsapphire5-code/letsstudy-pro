<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Author | LetsStudy Pro</title>
<meta name="description" content="Author profile and published articles on LetsStudy Pro.">
<meta name="robots" content="index,follow">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 20px;
  position:sticky;
  top:0;
  z-index:10
}

.header{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px
}

.logo{
  color:#2563eb;
  font-size:21px;
  font-weight:800
}

.back{
  text-decoration:none;
  color:#475569;
  font-weight:700
}

.container{
  max-width:1150px;
  margin:28px auto;
  padding:0 16px
}

.profile{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:25px
}

.cover{
  height:190px;
  background:linear-gradient(
    135deg,
    #2563eb,
    #7c3aed
  );
  background-size:cover;
  background-position:center
}

.profile-body{
  padding:0 25px 25px;
  position:relative
}

.avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  border:5px solid #fff;
  background:#e2e8f0;
  object-fit:cover;
  margin-top:-52px
}

.name{
  font-size:29px;
  margin:10px 0 5px
}

.bio{
  color:#64748b;
  line-height:1.6;
  max-width:750px
}

.socials{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px
}

.socials a{
  text-decoration:none;
  background:#f1f5f9;
  color:#334155;
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
  font-weight:700
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:22px
}

.stat{
  background:#f8fafc;
  border-radius:11px;
  padding:15px
}

.stat strong{
  display:block;
  font-size:22px;
  margin-bottom:4px
}

.stat span{
  color:#64748b;
  font-size:12px
}

.grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px
}

.card h2{
  margin:0 0 6px;
  font-size:20px
}

.desc{
  color:#64748b;
  font-size:13px;
  margin-bottom:18px
}

.posts{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px
}

.post{
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;
  background:#fff
}

.post-image{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#e2e8f0
}

.post-body{
  padding:15px
}

.category{
  color:#2563eb;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase
}

.post-title{
  font-size:17px;
  line-height:1.4;
  margin:6px 0
}

.post-title a{
  color:#172033;
  text-decoration:none
}

.excerpt{
  color:#64748b;
  font-size:13px;
  line-height:1.5
}

.meta{
  margin-top:12px;
  color:#94a3b8;
  font-size:11px;
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.blog-item{
  border-bottom:1px solid #eef0f4;
  padding:13px 0
}

.blog-item:last-child{
  border-bottom:0
}

.blog-item a{
  text-decoration:none;
  color:#172033;
  font-weight:700
}

.blog-description{
  color:#64748b;
  font-size:13px;
  margin-top:5px
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#64748b
}

.loading{
  text-align:center;
  padding:50px;
  color:#64748b
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:15px;
  border-radius:10px
}

@media(max-width:850px){
  .grid{
    grid-template-columns:1fr
  }

  .stats{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:600px){
  .cover{
    height:140px
  }

  .profile-body{
    padding:0 18px 20px
  }

  .name{
    font-size:25px
  }

  .posts{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">
      LetsStudy Pro
    </div>

    <a id="backBtn"
       class="back"
       href="blog.html">
      ← Back to Blog
    </a>

  </div>
</header>


<main class="container">

  <div id="loading" class="loading">
    Loading author profile...
  </div>

  <div id="error" class="error" style="display:none"></div>


  <section id="content" style="display:none">

    <div class="profile">

      <div id="cover"
           class="cover">
      </div>

      <div class="profile-body">

        <img
          id="avatar"
          class="avatar"
          src=""
          alt="Author">

        <h1 id="name" class="name">
          Author
        </h1>

        <div id="bio" class="bio">
        </div>

        <div id="socials"
             class="socials">
        </div>


        <div class="stats">

          <div class="stat">
            <strong id="postCount">0</strong>
            <span>Published Posts</span>
          </div>

          <div class="stat">
            <strong id="views">0</strong>
            <span>Total Views</span>
          </div>

          <div class="stat">
            <strong id="blogCount">0</strong>
            <span>Blogs</span>
          </div>

          <div class="stat">
            <strong id="commentCount">0</strong>
            <span>Comments</span>
          </div>

        </div>

      </div>

    </div>


    <div class="grid">

      <section>

        <div class="card">

          <h2>📝 Published Articles</h2>

          <div class="desc">
            Latest articles published by this author.
          </div>

          <div id="posts"
               class="posts">
          </div>

        </div>

      </section>


      <aside>

        <div class="card">

          <h2>🌐 Author Blogs</h2>

          <div class="desc">
            Blogs created by this author.
          </div>

          <div id="blogs">
          </div>

        </div>


        <div class="card">

          <h2>👤 About Author</h2>

          <div id="about"
               class="desc"
               style="line-height:1.6">
          </div>

        </div>

      </aside>

    </div>

  </section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey:"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId:"G-85B7V5H5J0"
};


const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


const params=
  new URLSearchParams(location.search);

const userId=
  params.get("userId") ||
  params.get("authorId") ||
  params.get("ownerId");


let author=null;
let posts=[];
let blogs=[];
let comments=[];


const $=id=>
  document.getElementById(id);


function escapeHtml(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function safeUrl(url){

  if(!url)return "";

  try{

    const u=new URL(
      url,
      location.origin
    );

    if(
      u.protocol==="http:" ||
      u.protocol==="https:"
    ){
      return u.href;
    }

  }catch(e){}

  return "";
}


function dateValue(value){

  if(!value)return 0;

  if(value.toMillis){
    return value.toMillis();
  }

  if(value.toDate){
    return value.toDate().getTime();
  }

  const d=new Date(value);

  return isNaN(d.getTime())
    ? 0
    : d.getTime();
}


function formatDate(value){

  const time=dateValue(value);

  if(!time)return "";

  return new Date(time)
    .toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );
}


function number(value){

  return Number(value||0)
    .toLocaleString();
}


function isPublished(item){

  return (
    item.published===true ||
    item.status==="published"
  );
}


function getExcerpt(post){

  if(post.excerpt){
    return post.excerpt;
  }

  const text=String(
    post.content||""
  )
  .replace(/<[^>]*>/g," ")
  .replace(/\s+/g," ")
  .trim();

  return text.length>130
    ? text.slice(0,130)+"..."
    : text;
}


async function loadAuthor(){

  if(!userId){

    throw new Error(
      "No author selected. Use ?userId=AUTHOR_ID"
    );
  }


  const ref=
    doc(db,"users",userId);

  const snap=
    await getDoc(ref);


  if(!snap.exists()){

    throw new Error(
      "Author profile not found."
    );
  }


  author=snap.data();
}


async function loadBlogs(){

  const q=query(
    collection(db,"blogs"),
    where("ownerId","==",userId)
  );

  const snap=
    await getDocs(q);

  blogs=[];

  snap.forEach(item=>{

    blogs.push({
      id:item.id,
      ...item.data()
    });

  });
}


async function loadPosts(){

  const q=query(
    collection(db,"posts"),
    where("ownerId","==",userId)
  );

  const snap=
    await getDocs(q);

  posts=[];

  snap.forEach(item=>{

    const data=item.data();

    if(isPublished(data)){

      posts.push({
        id:item.id,
        ...data
      });

    }

  });


  /*
   * Fallback for posts where ownerId
   * was not stored but blogId exists.
   */

  if(
    !posts.length &&
    blogs.length
  ){

    const blogIds=
      blogs.map(blog=>blog.id);

    for(
      const blogId of blogIds
    ){

      const q2=query(
        collection(db,"posts"),
        where("blogId","==",blogId)
      );

      const snap2=
        await getDocs(q2);

      snap2.forEach(item=>{

        const data=item.data();

        if(
          isPublished(data) &&
          !posts.some(
            p=>p.id===item.id
          )
        ){

          posts.push({
            id:item.id,
            ...data
          });

        }

      });

    }

  }


  posts.sort(
    (a,b)=>
      dateValue(
        b.publishedAt||
        b.createdAt||
        b.updatedAt
      ) -
      dateValue(
        a.publishedAt||
        a.createdAt||
        a.updatedAt
      )
  );
}


async function loadComments(){

  try{

    const q=query(
      collection(db,"comments"),
      where("userId","==",userId)
    );

    const snap=
      await getDocs(q);

    comments=[];

    snap.forEach(item=>{

      comments.push({
        id:item.id,
        ...item.data()
      });

    });

  }catch(error){

    console.warn(
      "Comments unavailable:",
      error
    );

    comments=[];
  }
}


function renderProfile(){

  const displayName=
    author.displayName ||
    author.name ||
    author.fullName ||
    author.username ||
    "Author";


  const bio=
    author.bio ||
    author.description ||
    "Welcome to my LetsStudy Pro author profile.";


  const avatar=
    safeUrl(
      author.photoURL ||
      author.avatar ||
      author.photo ||
      author.profileImage
    );


  const cover=
    safeUrl(
      author.coverUrl ||
      author.coverImage ||
      author.banner
    );


  $("name").textContent=
    displayName;

  $("bio").textContent=
    bio;

  $("about").textContent=
    author.about ||
    bio;


  if(avatar){

    $("avatar").src=avatar;

  }else{

    $("avatar").style.display="none";

  }


  if(cover){

    $("cover").style.backgroundImage=
      `url("${cover}")`;

  }


  document.title=
    displayName+
    " | LetsStudy Pro";


  const totalViews=
    posts.reduce(
      (sum,p)=>
        sum+
        Number(p.views||0),
      0
    );


  $("postCount").textContent=
    number(posts.length);

  $("views").textContent=
    number(totalViews);

  $("blogCount").textContent=
    number(blogs.length);

  $("commentCount").textContent=
    number(comments.length);


  renderSocials();

}


function renderSocials(){

  const socialMap={

    Facebook:
      author.facebook ||
      author.facebookUrl,

    Instagram:
      author.instagram ||
      author.instagramUrl,

    "X / Twitter":
      author.twitter ||
      author.x ||
      author.twitterUrl,

    YouTube:
      author.youtube ||
      author.youtubeUrl,

    LinkedIn:
      author.linkedin ||
      author.linkedinUrl,

    TikTok:
      author.tiktok ||
      author.tiktokUrl,

    WhatsApp:
      author.whatsapp ||
      author.whatsappUrl,

    Telegram:
      author.telegram ||
      author.telegramUrl

  };


  const html=
    Object.entries(
      socialMap
    )
    .filter(
      ([name,url])=>
        safeUrl(url)
    )
    .map(
      ([name,url])=>`

        <a
          href="${escapeHtml(
            safeUrl(url)
          )}"
          target="_blank"
          rel="noopener noreferrer">
          ${escapeHtml(name)}
        </a>

      `
    ).join("");


  $("socials").innerHTML=
    html;
}


function renderPosts(){

  const box=$("posts");

  if(!posts.length){

    box.innerHTML=`
      <div class="empty"
           style="grid-column:1/-1">
        This author has no published articles yet.
      </div>
    `;

    return;
  }


  box.innerHTML=
    posts
    .slice(0,12)
    .map(post=>{

      const image=
        safeUrl(
          post.imageUrl ||
          post.image ||
          post.thumbnail ||
          post.coverImage
        );


      const title=
        escapeHtml(
          post.title||
          "Untitled Post"
        );


      const excerpt=
        escapeHtml(
          getExcerpt(post)
        );


      const category=
        escapeHtml(
          post.category||
          "Article"
        );


      const views=
        Number(
          post.views||0
        );


      const date=
        formatDate(
          post.publishedAt||
          post.createdAt||
          post.updatedAt
        );


      return `

        <article class="post">

          ${
            image
            ? `
              <img
                class="post-image"
                src="${escapeHtml(image)}"
                alt="${title}"
                loading="lazy">
            `
            : `
              <div class="post-image"></div>
            `
          }

          <div class="post-body">

            <div class="category">
              ${category}
            </div>

            <h3 class="post-title">

              <a
                href="post.html?postId=${encodeURIComponent(post.id)}">
                ${title}
              </a>

            </h3>

            <div class="excerpt">
              ${excerpt}
            </div>

            <div class="meta">

              ${date
                ? `<span>${date}</span>`
                : ""
              }

              <span>
                ${number(views)} views
              </span>

            </div>

          </div>

        </article>

      `;

    }).join("");
}


function renderBlogs(){

  const box=$("blogs");

  if(!blogs.length){

    box.innerHTML=`
      <div class="empty">
        No blogs found.
      </div>
    `;

    return;
  }


  box.innerHTML=
    blogs.map(blog=>`

      <div class="blog-item">

        <a
          href="blog.html?blogId=${encodeURIComponent(blog.id)}">

          ${escapeHtml(
            blog.title||
            "Untitled Blog"
          )}

        </a>

        <div class="blog-description">

          ${escapeHtml(
            blog.description||
            "No description available."
          )}

        </div>

      </div>

    `).join("");
}


async function init(){

  try{

    await loadAuthor();

    await loadBlogs();

    await loadPosts();

    await loadComments();

    renderProfile();

    renderPosts();

    renderBlogs();


    if(blogs.length){

      $("backBtn").href=
        "blog.html?blogId="+
        encodeURIComponent(
          blogs[0].id
        );

    }


    $("loading").style.display=
      "none";

    $("content").style.display=
      "block";


  }catch(error){

    console.error(error);

    $("loading").style.display=
      "none";

    $("error").style.display=
      "block";

    $("error").textContent=
      error.message||
      "Unable to load author profile.";

  }

}


init();

</script>

</body>
</html>
