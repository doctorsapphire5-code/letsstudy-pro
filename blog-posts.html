<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Blog Posts - LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:#fff;
  padding:18px 22px;
}

header h1{
  margin:0;
  font-size:22px;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.top h2{
  margin:0 0 5px;
}

small{
  color:#667085;
}

button{
  border:0;
  padding:10px 14px;
  border-radius:9px;
  cursor:pointer;
  color:#fff;
  background:#111827;
}

.primary{background:#2563eb}
.green{background:#16a34a}
.orange{background:#d97706}
.red{background:#dc2626}
.gray{background:#64748b}

.cards{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(170px,1fr));
  gap:15px;
  margin:20px 0;
}

.card{
  background:#fff;
  padding:18px;
  border-radius:14px;
  box-shadow:0 2px 10px #0000000d;
}

.card small{
  display:block;
}

.card strong{
  display:block;
  font-size:28px;
  margin-top:7px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:20px 0;
}

input,select{
  padding:11px 13px;
  border:1px solid #d0d5dd;
  border-radius:9px;
  background:#fff;
}

.search{
  flex:1;
  min-width:230px;
}

.table-wrap{
  overflow-x:auto;
  background:#fff;
  border-radius:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:13px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:14px;
  vertical-align:middle;
}

th{
  background:#f9fafb;
}

.title{
  min-width:250px;
}

.title strong{
  display:block;
  margin-bottom:5px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
}

.published{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#fef3c7;
  color:#92400e;
}

.featured{
  background:#ede9fe;
  color:#6d28d9;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.actions button{
  padding:7px 10px;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:35px;
}

.pagination{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:25px 0;
}

.pagination button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

@media(max-width:700px){
  table{
    white-space:nowrap;
  }
}
</style>
</head>

<body>

<header>
  <h1>📝 LetsStudy Pro — Blog Posts</h1>
</header>

<div class="container">

  <div class="top">

    <div>
      <h2>Posts</h2>
      <small>
        Create, manage and publish your blog content.
      </small>
    </div>

    <button
      class="primary"
      onclick="newPost()">
      + New Post
    </button>

  </div>


  <!-- STATS -->

  <div class="cards">

    <div class="card">
      <small>Total Posts</small>
      <strong id="totalPosts">0</strong>
    </div>

    <div class="card">
      <small>Published</small>
      <strong id="publishedPosts">0</strong>
    </div>

    <div class="card">
      <small>Drafts</small>
      <strong id="draftPosts">0</strong>
    </div>

    <div class="card">
      <small>Featured</small>
      <strong id="featuredPosts">0</strong>
    </div>

    <div class="card">
      <small>Total Views</small>
      <strong id="totalViews">0</strong>
    </div>

    <div class="card">
      <small>Comments</small>
      <strong id="totalComments">0</strong>
    </div>

  </div>


  <!-- FILTERS -->

  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="🔎 Search posts..."
    >

    <select id="statusFilter">

      <option value="all">
        All Status
      </option>

      <option value="published">
        Published
      </option>

      <option value="draft">
        Draft
      </option>

    </select>


    <select id="featureFilter">

      <option value="all">
        All Posts
      </option>

      <option value="featured">
        Featured
      </option>

      <option value="normal">
        Normal
      </option>

    </select>


    <select id="sortFilter">

      <option value="newest">
        Newest
      </option>

      <option value="oldest">
        Oldest
      </option>

      <option value="views">
        Most Views
      </option>

      <option value="title">
        Title A-Z
      </option>

    </select>

    <button
      class="gray"
      onclick="loadPosts()">
      ↻ Refresh
    </button>

  </div>


  <!-- TABLE -->

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>Post</th>

          <th>Category</th>

          <th>Status</th>

          <th>Views</th>

          <th>Comments</th>

          <th>Updated</th>

          <th>Actions</th>

        </tr>

      </thead>


      <tbody id="postTable">

        <tr>
          <td
            colspan="7"
            class="empty">
            Loading posts...
          </td>
        </tr>

      </tbody>

    </table>

  </div>


  <!-- PAGINATION -->

  <div class="pagination">

    <button
      id="prevBtn"
      onclick="previousPage()">
      ← Previous
    </button>

    <button
      id="nextBtn"
      onclick="nextPage()">
      Next →
    </button>

  </div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig={
  apiKey:"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* =========================
   URL
========================= */

const params=
  new URLSearchParams(location.search);

const blogId=
  params.get("blogId");


let currentUser=null;

let posts=[];
let comments=[];

let filteredPosts=[];

let currentPage=1;

const perPage=10;


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async user=>{

    if(!user){

      location.href="login.html";
      return;

    }

    currentUser=user;

    if(!blogId){

      alert(
        "Blog ID missing."
      );

      return;

    }

    await loadPosts();

  }
);


/* =========================
   LOAD POSTS
========================= */

window.loadPosts=async function(){

  try{

    const postSnap=
      await getDocs(
        query(
          collection(db,"posts"),
          where("blogId","==",blogId)
        )
      );


    posts=[];

    postSnap.forEach(d=>{

      posts.push({
        id:d.id,
        ...d.data()
      });

    });


    /* COMMENTS */

    const commentSnap=
      await getDocs(
        query(
          collection(db,"comments"),
          where("blogId","==",blogId)
        )
      );


    comments=[];

    commentSnap.forEach(d=>{

      comments.push({
        id:d.id,
        ...d.data()
      });

    });


    filteredPosts=[...posts];

    currentPage=1;

    updateStats();

    renderPosts();

  }catch(error){

    console.error(error);

    document.getElementById(
      "postTable"
    ).innerHTML=`

      <tr>

        <td
          colspan="7"
          class="empty">

          Failed to load posts.

        </td>

      </tr>

    `;

  }

};


/* =========================
   STATS
========================= */

function updateStats(){

  const published=
    posts.filter(p=>
      p.published===true ||
      p.status==="published"
    ).length;


  const drafts=
    posts.filter(p=>
      p.published===false ||
      p.status==="draft" ||
      (!p.status && !p.published)
    ).length;


  const featured=
    posts.filter(p=>
      p.featured===true
    ).length;


  const views=
    posts.reduce(
      (sum,p)=>
        sum+Number(p.views||0),
      0
    );


  document.getElementById(
    "totalPosts"
  ).textContent=posts.length;


  document.getElementById(
    "publishedPosts"
  ).textContent=published;


  document.getElementById(
    "draftPosts"
  ).textContent=drafts;


  document.getElementById(
    "featuredPosts"
  ).textContent=featured;


  document.getElementById(
    "totalViews"
  ).textContent=
    views.toLocaleString();


  document.getElementById(
    "totalComments"
  ).textContent=
    comments.length.toLocaleString();

}


/* =========================
   COMMENT COUNT
========================= */

function commentCount(postId){

  return comments.filter(
    c=>c.postId===postId
  ).length;

}


/* =========================
   STATUS
========================= */

function isPublished(post){

  return post.published===true ||
         post.status==="published";

}


/* =========================
   RENDER
========================= */

function renderPosts(){

  const search=
    document.getElementById(
      "search"
    ).value
    .toLowerCase()
    .trim();


  const status=
    document.getElementById(
      "statusFilter"
    ).value;


  const feature=
    document.getElementById(
      "featureFilter"
    ).value;


  const sort=
    document.getElementById(
      "sortFilter"
    ).value;


  filteredPosts=
    posts.filter(post=>{

      const text=`

        ${post.title||""}

        ${post.excerpt||""}

        ${post.content||""}

        ${post.category||""}

        ${post.categorySlug||""}

        ${post.tags||""}

      `.toLowerCase();


      if(
        search &&
        !text.includes(search)
      ){

        return false;

      }


      if(
        status==="published" &&
        !isPublished(post)
      ){

        return false;

      }


      if(
        status==="draft" &&
        isPublished(post)
      ){

        return false;

      }


      if(
        feature==="featured" &&
        post.featured!==true
      ){

        return false;

      }


      if(
        feature==="normal" &&
        post.featured===true
      ){

        return false;

      }


      return true;

    });


  /* SORT */

  if(sort==="newest"){

    filteredPosts.sort(
      (a,b)=>
        dateValue(
          b.updatedAt ||
          b.createdAt
        ) -
        dateValue(
          a.updatedAt ||
          a.createdAt
        )
    );

  }


  if(sort==="oldest"){

    filteredPosts.sort(
      (a,b)=>
        dateValue(
          a.updatedAt ||
          a.createdAt
        ) -
        dateValue(
          b.updatedAt ||
          b.createdAt
        )
    );

  }


  if(sort==="views"){

    filteredPosts.sort(
      (a,b)=>
        Number(b.views||0) -
        Number(a.views||0)
    );

  }


  if(sort==="title"){

    filteredPosts.sort(
      (a,b)=>
        String(a.title||"")
        .localeCompare(
          String(b.title||"")
        )
    );

  }


  renderPage();

}


/* =========================
   RENDER PAGE
========================= */

function renderPage(){

  const table=
    document.getElementById(
      "postTable"
    );


  if(!filteredPosts.length){

    table.innerHTML=`

      <tr>

        <td
          colspan="7"
          class="empty">

          No posts found.

        </td>

      </tr>

    `;

    updatePagination(0);

    return;

  }


  const start=
    (currentPage-1)*perPage;

  const end=
    start+perPage;

  const pagePosts=
    filteredPosts.slice(
      start,
      end
    );


  table.innerHTML=
    pagePosts.map(post=>{

      const published=
        isPublished(post);

      const featured=
        post.featured===true;


      return `

        <tr>

          <td class="title">

            <strong>

              ${escapeHtml(
                post.title ||
                "Untitled Post"
              )}

            </strong>

            <small>

              /${escapeHtml(
                post.slug || ""
              )}

            </small>

          </td>


          <td>

            ${escapeHtml(
              post.category ||
              post.categorySlug ||
              "Uncategorized"
            )}

          </td>


          <td>

            <span class="badge ${
              published
                ? "published"
                : "draft"
            }">

              ${
                published
                  ? "Published"
                  : "Draft"
              }

            </span>

            ${
              featured
              ?
              `<br>
               <span class="badge featured">
                 ⭐ Featured
               </span>`
              :
              ""
            }

          </td>


          <td>

            ${Number(
              post.views||0
            ).toLocaleString()}

          </td>


          <td>

            ${commentCount(
              post.id
            )}

          </td>


          <td>

            ${formatDate(
              post.updatedAt ||
              post.createdAt
            )}

          </td>


          <td>

            <div class="actions">

              <button
                class="primary"
                onclick="editPost(
                  '${post.id}'
                )">

                Edit

              </button>


              <button
                class="${
                  published
                    ? "orange"
                    : "green"
                }"
                onclick="togglePublish(
                  '${post.id}',
                  ${published}
                )">

                ${
                  published
                    ? "Draft"
                    : "Publish"
                }

              </button>


              <button
                class="gray"
                onclick="toggleFeatured(
                  '${post.id}',
                  ${featured}
                )">

                ${
                  featured
                    ? "Unfeature"
                    : "Feature"
                }

              </button>


              <button
                class="red"
                onclick="deletePost(
                  '${post.id}'
                )">

                Delete

              </button>

            </div>

          </td>

        </tr>

      `;

    }).join("");


  updatePagination(
    filteredPosts.length
  );

}


/* =========================
   NEW POST
========================= */

window.newPost=function(){

  location.href=
    `new-post.html?blogId=${
      encodeURIComponent(blogId)
    }`;

};


/* =========================
   EDIT
========================= */

window.editPost=function(id){

  location.href=
    `edit-post.html?postId=${
      encodeURIComponent(id)
    }`;

};


/* =========================
   PUBLISH / DRAFT
========================= */

window.togglePublish=
async function(id,current){

  const post=
    posts.find(p=>p.id===id);

  if(!post)return;


  try{

    const newPublished=
      !current;


    await updateDoc(
      doc(db,"posts",id),
      {
        published:newPublished,

        status:
          newPublished
            ? "published"
            : "draft",

        updatedAt:new Date()
      }
    );


    await loadPosts();

  }catch(error){

    console.error(error);

    alert(
      "Failed to update post."
    );

  }

};


/* =========================
   FEATURED
========================= */

window.toggleFeatured=
async function(id,current){

  try{

    await updateDoc(
      doc(db,"posts",id),
      {
        featured:!current,
        updatedAt:new Date()
      }
    );


    await loadPosts();

  }catch(error){

    console.error(error);

    alert(
      "Failed to update featured status."
    );

  }

};


/* =========================
   DELETE
========================= */

window.deletePost=
async function(id){

  const post=
    posts.find(p=>p.id===id);

  if(!post)return;


  if(!confirm(
    `Delete "${post.title || "this post"}"?\n\n`+
    `This action cannot be undone.`
  )){

    return;

  }


  try{

    await deleteDoc(
      doc(db,"posts",id)
    );


    await loadPosts();

  }catch(error){

    console.error(error);

    alert(
      "Failed to delete post."
    );

  }

};


/* =========================
   PAGINATION
========================= */

function updatePagination(total){

  const pages=
    Math.ceil(
      total/perPage
    );


  document.getElementById(
    "prevBtn"
  ).disabled=
    currentPage<=1;


  document.getElementById(
    "nextBtn"
  ).disabled=
    currentPage>=pages;

}


window.previousPage=function(){

  if(currentPage>1){

    currentPage--;

    renderPage();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

};


window.nextPage=function(){

  const pages=
    Math.ceil(
      filteredPosts.length/
      perPage
    );


  if(currentPage<pages){

    currentPage++;

    renderPage();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

};


/* =========================
   HELPERS
========================= */

function dateValue(value){

  if(!value)return 0;


  if(
    typeof value.toDate==="function"
  ){

    return value
      .toDate()
      .getTime();

  }


  const date=
    new Date(value);


  return isNaN(date)
    ? 0
    : date.getTime();

}


function formatDate(value){

  const time=
    dateValue(value);


  if(!time)return "—";


  return new Date(time)
    .toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

}


function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   EVENTS
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    ()=>{
      currentPage=1;
      renderPosts();
    }
  );


document
  .getElementById("statusFilter")
  .addEventListener(
    "change",
    ()=>{
      currentPage=1;
      renderPosts();
    }
  );


document
  .getElementById("featureFilter")
  .addEventListener(
    "change",
    ()=>{
      currentPage=1;
      renderPosts();
    }
  );


document
  .getElementById("sortFilter")
  .addEventListener(
    "change",
    ()=>{
      currentPage=1;
      renderPosts();
    }
  );

</script>

</body>
</html>
