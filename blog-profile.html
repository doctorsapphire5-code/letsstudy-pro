<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Blog Profile — LetsStudy Pro</title>
<meta name="description" id="metaDescription"
content="Blogger profile on LetsStudy Pro.">

<meta name="robots" content="index,follow">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

a{
  text-decoration:none;
  color:inherit;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:1150px;
  margin:auto;
  min-height:65px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#2563eb;
  font-size:21px;
  font-weight:900;
}

.nav{
  display:flex;
  gap:18px;
}

.nav a{
  font-size:14px;
  font-weight:700;
  color:#374151;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:25px 18px;
}

/* PROFILE */

.profile-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
}

.cover{
  height:230px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  background-size:cover;
  background-position:center;
}

.profile{
  padding:0 30px 30px;
  position:relative;
}

.avatar{
  width:125px;
  height:125px;
  border-radius:50%;
  object-fit:cover;
  background:#eef2ff;
  border:6px solid #fff;
  margin-top:-62px;
  display:block;
}

.name{
  font-size:30px;
  margin:15px 0 5px;
}

.username{
  color:#6b7280;
  margin-bottom:15px;
}

.bio{
  max-width:750px;
  color:#4b5563;
  line-height:1.7;
}

.social{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:18px;
}

.social a{
  padding:9px 13px;
  border-radius:9px;
  background:#eef2ff;
  color:#3730a3;
  font-size:13px;
  font-weight:700;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin:22px 0;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:20px;
}

.stat strong{
  display:block;
  font-size:26px;
  margin-bottom:5px;
}

.stat span{
  color:#6b7280;
  font-size:13px;
}

/* CONTENT */

.content{
  display:grid;
  grid-template-columns:1fr 310px;
  gap:22px;
}

.section{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:22px;
  margin-bottom:20px;
}

.section h2{
  margin-top:0;
}

/* POSTS */

.posts{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.post{
  border:1px solid #e5e7eb;
  border-radius:13px;
  overflow:hidden;
  background:#fff;
}

.post img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.post-body{
  padding:15px;
}

.post h3{
  margin:7px 0;
  font-size:18px;
}

.post p{
  color:#6b7280;
  font-size:13px;
  line-height:1.5;
}

.read{
  color:#2563eb;
  font-weight:800;
  font-size:13px;
}

/* BLOGS */

.blog-item{
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.blog-item:last-child{
  border-bottom:0;
}

.blog-item strong{
  display:block;
  margin-bottom:5px;
}

.blog-item span{
  color:#6b7280;
  font-size:13px;
}

/* BUTTON */

.btn{
  display:inline-block;
  padding:10px 15px;
  border-radius:9px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  font-size:13px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:35px;
  color:#6b7280;
}

/* MOBILE */

@media(max-width:800px){

  .nav{
    display:none;
  }

  .content{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .posts{
    grid-template-columns:1fr;
  }

  .cover{
    height:180px;
  }

  .profile{
    padding:0 20px 25px;
  }

  .name{
    font-size:25px;
  }

}
</style>
</head>

<body>

<header>
  <div class="header">

    <a href="index.html" class="logo">
      LetsStudy Pro
    </a>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="blog.html" id="blogLink">Blog</a>
      <a href="blog-dashboard.html">Dashboard</a>
    </nav>

  </div>
</header>


<main class="container">

  <!-- PROFILE -->

  <div class="profile-card">

    <div id="cover" class="cover"></div>

    <div class="profile">

      <img
        id="avatar"
        class="avatar"
        src=""
        alt="Blogger">

      <h1 id="name" class="name">
        Loading...
      </h1>

      <div id="username" class="username">
        @blogger
      </div>

      <div id="bio" class="bio">
        Loading blogger profile...
      </div>

      <div id="social" class="social"></div>

    </div>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <strong id="postsCount">0</strong>
      <span>Published Posts</span>
    </div>

    <div class="stat">
      <strong id="viewsCount">0</strong>
      <span>Total Views</span>
    </div>

    <div class="stat">
      <strong id="blogsCount">0</strong>
      <span>Blogs</span>
    </div>

    <div class="stat">
      <strong id="commentsCount">0</strong>
      <span>Comments</span>
    </div>

  </div>


  <!-- CONTENT -->

  <div class="content">

    <section class="section">

      <h2>Latest Posts</h2>

      <div id="posts" class="posts">
        <div class="empty">
          Loading posts...
        </div>
      </div>

    </section>


    <aside>

      <section class="section">

        <h2>About</h2>

        <p id="about" style="color:#6b7280;line-height:1.7">
          Loading...
        </p>

      </section>


      <section class="section">

        <h2>My Blogs</h2>

        <div id="blogs">
          <div class="empty">
            Loading...
          </div>
        </div>

      </section>

    </aside>

  </div>

</main>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"
};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


const params =
  new URLSearchParams(location.search);


/*
  Profile can be opened with:

  blog-profile.html?userId=USER_ID

  OR

  blog-profile.html?ownerId=USER_ID
*/

const userId =
  params.get("userId") ||
  params.get("ownerId");


if(!userId){

  document.getElementById("name")
    .textContent =
    "Profile not found";

  throw new Error(
    "Missing userId"
  );
}


/* DATA */

let userData = {};
let blogs = [];
let posts = [];
let comments = [];


/* LOAD USER */

async function loadUser(){

  const q =
    query(
      collection(db,"users"),
      where("__name__","==",userId)
    );

  const snap =
    await getDocs(q);


  if(snap.empty){

    document.getElementById("name")
      .textContent =
      "Blogger";

    return;

  }


  const item =
    snap.docs[0];

  userData = {
    id:item.id,
    ...item.data()
  };


  const name =
    userData.displayName ||
    userData.name ||
    userData.username ||
    "Blogger";


  document.getElementById("name")
    .textContent = name;


  document.getElementById("username")
    .textContent =
    userData.username
      ? `@${userData.username}`
      : userData.email
        ? userData.email
        : "";


  document.getElementById("bio")
    .textContent =
    userData.bio ||
    userData.description ||
    "Blogger and creator on LetsStudy Pro.";


  document.getElementById("about")
    .textContent =
    userData.bio ||
    userData.description ||
    "Welcome to my LetsStudy Pro profile.";


  /* AVATAR */

  const avatar =
    userData.photoURL ||
    userData.avatar ||
    userData.avatarUrl;


  if(avatar){

    document.getElementById("avatar")
      .src = safeUrl(avatar);

  }else{

    document.getElementById("avatar")
      .src =
      "https://ui-avatars.com/api/?name=" +
      encodeURIComponent(name);

  }


  /* COVER */

  const cover =
    userData.coverUrl ||
    userData.coverImage;


  if(cover){

    document.getElementById("cover")
      .style.backgroundImage =
      `url("${safeUrl(cover)}")`;

  }


  renderSocial();

}


/* SOCIAL */

function renderSocial(){

  const social =
    document.getElementById("social");

  const links = [

    ["Facebook",userData.facebook],

    ["Instagram",userData.instagram],

    ["X",userData.twitter || userData.x],

    ["YouTube",userData.youtube],

    ["LinkedIn",userData.linkedin],

    ["TikTok",userData.tiktok],

    ["WhatsApp",userData.whatsapp],

    ["Telegram",userData.telegram]

  ];


  social.innerHTML =
    links
      .filter(item => item[1])
      .map(item => `

        <a
          href="${safeUrl(item[1])}"
          target="_blank"
          rel="noopener">

          ${escapeHtml(item[0])}

        </a>

      `)
      .join("");

}


/* LOAD BLOGS */

async function loadBlogs(){

  const q =
    query(
      collection(db,"blogs"),
      where("ownerId","==",userId)
    );


  const snap =
    await getDocs(q);


  blogs = [];


  snap.forEach(item => {

    blogs.push({
      id:item.id,
      ...item.data()
    });

  });


  document.getElementById("blogsCount")
    .textContent =
    blogs.length;


  renderBlogs();

}


/* BLOG LIST */

function renderBlogs(){

  const box =
    document.getElementById("blogs");


  if(!blogs.length){

    box.innerHTML = `
      <div class="empty">
        No blogs yet.
      </div>
    `;

    return;

  }


  box.innerHTML =
    blogs.map(blog => `

      <div class="blog-item">

        <strong>
          ${escapeHtml(
            blog.title || "Untitled Blog"
          )}
        </strong>

        <span>
          ${escapeHtml(
            blog.description || ""
          )}
        </span>

        <br><br>

        <a
          class="btn"
          href="blog.html?blogId=${encodeURIComponent(blog.id)}">

          Visit Blog

        </a>

      </div>

    `).join("");

}


/* LOAD POSTS */

async function loadPosts(){

  const q =
    query(
      collection(db,"posts"),
      where("ownerId","==",userId)
    );


  const snap =
    await getDocs(q);


  posts = [];


  snap.forEach(item => {

    const data = item.data();

    const published =
      data.published === true ||
      data.status === "published";


    if(published){

      posts.push({
        id:item.id,
        ...data
      });

    }

  });


  posts.sort((a,b) =>
    getTime(
      b.updatedAt ||
      b.createdAt
    )
    -
    getTime(
      a.updatedAt ||
      a.createdAt
    )
  );


  document.getElementById("postsCount")
    .textContent =
    posts.length;


  const views =
    posts.reduce(
      (sum,p) =>
      sum + Number(p.views || 0),
      0
    );


  document.getElementById("viewsCount")
    .textContent =
    views.toLocaleString();


  renderPosts();

}


/* POSTS */

function renderPosts(){

  const box =
    document.getElementById("posts");


  const latest =
    posts.slice(0,8);


  if(!latest.length){

    box.innerHTML = `
      <div class="empty">
        No published posts yet.
      </div>
    `;

    return;

  }


  box.innerHTML =
    latest.map(post => `

      <article class="post">

        ${
          post.imageUrl
          ?
          `<img
            src="${safeUrl(post.imageUrl)}"
            alt="${escapeHtml(post.title || "")}"
            loading="lazy">`
          :
          ""
        }

        <div class="post-body">

          <div style="
            color:#6b7280;
            font-size:12px">

            ${formatDate(
              post.publishedAt ||
              post.updatedAt ||
              post.createdAt
            )}

            ·

            ${Number(post.views || 0)
              .toLocaleString()}
            views

          </div>

          <h3>
            ${escapeHtml(
              post.title || "Untitled Post"
            )}
          </h3>

          <p>
            ${escapeHtml(
              post.excerpt ||
              makeExcerpt(post.content)
            )}
          </p>

          <a
            class="read"
            href="post.html?postId=${encodeURIComponent(post.id)}">

            Read Article →

          </a>

        </div>

      </article>

    `).join("");

}


/* COMMENTS */

async function loadComments(){

  try{

    const q =
      query(
        collection(db,"comments"),
        where("userId","==",userId)
      );


    const snap =
      await getDocs(q);


    comments = snap.docs;

    document.getElementById("commentsCount")
      .textContent =
      comments.length;

  }catch(error){

    console.log(
      "Comments unavailable",
      error
    );

  }

}


/* HELPERS */

function getTime(value){

  if(!value) return 0;

  if(
    typeof value.toDate ===
    "function"
  ){

    return value.toDate().getTime();

  }

  const date =
    new Date(value);

  return isNaN(date.getTime())
    ? 0
    : date.getTime();

}


function formatDate(value){

  const time =
    getTime(value);

  if(!time) return "Recently";

  return new Date(time)
    .toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

}


function makeExcerpt(content){

  if(!content) return "";

  const text =
    String(content)
      .replace(/<[^>]*>/g," ")
      .replace(/\s+/g," ")
      .trim();

  return text.length > 120
    ? text.substring(0,120) + "..."
    : text;

}


function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeUrl(value){

  const url =
    String(value || "").trim();

  if(
    url.startsWith("https://") ||
    url.startsWith("http://")
  ){

    return url;

  }

  return "";

}


/* START */

(async function(){

  try{

    await loadUser();

    await loadBlogs();

    await loadPosts();

    await loadComments();

    document.title =
      `${userData.displayName ||
        userData.name ||
        "Blogger"} — LetsStudy Pro`;

  }catch(error){

    console.error(
      "Profile error:",
      error
    );

  }

})();

</script>

</body>
</html>
