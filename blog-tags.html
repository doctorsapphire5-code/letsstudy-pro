<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tags Management | LetsStudy Pro</title>

<meta name="description"
content="Manage blog tags, organize content and improve navigation with LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#2563eb;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.back{
  text-decoration:none;
  color:#475569;
  font-size:14px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 18px 50px;
}

.hero{
  margin-bottom:22px;
}

.hero h1{
  font-size:30px;
  margin-bottom:7px;
}

.hero p{
  color:#64748b;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:20px;
}

.stat span{
  display:block;
  color:#64748b;
  font-size:13px;
  margin-bottom:9px;
}

.stat strong{
  font-size:28px;
}

.grid{
  display:grid;
  grid-template-columns:340px 1fr;
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:20px;
}

.card h2{
  font-size:19px;
  margin-bottom:16px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:13px 0 7px;
}

input,
textarea{
  width:100%;
  border:1px solid #d7dce5;
  border-radius:9px;
  padding:12px;
  font-size:14px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#2563eb;
}

textarea{
  resize:vertical;
  min-height:90px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2ff;
  color:#3730a3;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:17px;
}

.search-row{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.search-row input{
  flex:1;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,
td{
  padding:13px 10px;
  border-bottom:1px solid #edf0f4;
  text-align:left;
  font-size:14px;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:12px;
  text-transform:uppercase;
}

.tag-name{
  font-weight:800;
}

.slug{
  color:#64748b;
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#eff6ff;
  color:#1d4ed8;
  font-size:12px;
  font-weight:700;
}

.empty{
  text-align:center;
  padding:40px 20px;
  color:#64748b;
}

.status{
  margin-bottom:15px;
  padding:11px 13px;
  border-radius:9px;
  background:#f1f5f9;
  color:#475569;
  display:none;
  font-size:14px;
}

.pagination{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:18px;
}

.pagination button{
  background:#f1f5f9;
}

.pagination button.active{
  background:#2563eb;
  color:#fff;
}

@media(max-width:850px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .hero h1{
    font-size:25px;
  }

  .form-actions{
    flex-direction:column;
  }

  .form-actions button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">LetsStudy Pro</div>

  <div class="header-right">
    <a class="back" id="backBtn" href="blog-dashboard.html">
      ← Dashboard
    </a>
  </div>
</header>

<div class="container">

  <div class="hero">
    <h1>Tag Management</h1>
    <p>Create, organize and manage tags used across your blog posts.</p>
  </div>

  <div id="statusBox" class="status"></div>

  <section class="stats">

    <div class="stat">
      <span>Total Tags</span>
      <strong id="totalTags">0</strong>
    </div>

    <div class="stat">
      <span>Used Tags</span>
      <strong id="usedTags">0</strong>
    </div>

    <div class="stat">
      <span>Unused Tags</span>
      <strong id="unusedTags">0</strong>
    </div>

    <div class="stat">
      <span>Total Posts</span>
      <strong id="totalPosts">0</strong>
    </div>

  </section>

  <div class="grid">

    <!-- CREATE / EDIT -->
    <div class="card">

      <h2 id="formTitle">Create New Tag</h2>

      <input type="hidden" id="tagId">

      <label for="tagName">Tag Name</label>
      <input
        id="tagName"
        type="text"
        placeholder="Example: Physics"
      >

      <label for="tagSlug">Slug</label>
      <input
        id="tagSlug"
        type="text"
        placeholder="physics"
      >

      <label for="tagDescription">Description</label>
      <textarea
        id="tagDescription"
        placeholder="Short description about this tag..."
      ></textarea>

      <div class="form-actions">
        <button class="primary" id="saveBtn">
          Create Tag
        </button>

        <button class="secondary" id="cancelBtn">
          Clear
        </button>
      </div>

    </div>

    <!-- TAG LIST -->
    <div class="card">

      <h2>Your Tags</h2>

      <div class="search-row">
        <input
          id="searchInput"
          type="search"
          placeholder="Search tags..."
        >
      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Tag</th>
              <th>Slug</th>
              <th>Posts</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="tagTable"></tbody>

        </table>

      </div>

      <div id="emptyBox" class="empty" style="display:none;">
        No tags found.
      </div>

      <div id="pagination" class="pagination"></div>

    </div>

  </div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey:"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId:"G-85B7V5H5J0"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const blogId = params.get("blogId");

let user = null;
let tags = [];
let posts = [];
let editingId = null;

let currentPage = 1;
const perPage = 10;


const $ = id => document.getElementById(id);


function escapeHtml(value=""){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function slugify(text=""){
  return text
    .toString()
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9\s-]/g,"")
    .replace(/\s+/g,"-")
    .replace(/-+/g,"-");
}


function formatDate(value){

  if(!value) return "—";

  try{

    const date =
      value?.toDate
      ? value.toDate()
      : new Date(value);

    if(isNaN(date.getTime())) return "—";

    return date.toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

  }catch{
    return "—";
  }
}


function showStatus(message,type="info"){

  const box = $("statusBox");

  box.style.display = "block";
  box.textContent = message;

  if(type==="success"){
    box.style.background="#dcfce7";
    box.style.color="#166534";
  }

  else if(type==="error"){
    box.style.background="#fee2e2";
    box.style.color="#991b1b";
  }

  else{
    box.style.background="#f1f5f9";
    box.style.color="#475569";
  }
}


function getPostTags(post){

  const raw = post.tags;

  if(Array.isArray(raw)){

    return raw
      .map(item=>{
        if(typeof item==="string") return item;

        if(item && typeof item==="object"){
          return item.name || item.slug || "";
        }

        return "";
      })
      .filter(Boolean)
      .map(x=>x.trim().toLowerCase());

  }

  if(typeof raw==="string"){

    return raw
      .split(",")
      .map(x=>x.trim().toLowerCase())
      .filter(Boolean);

  }

  return [];
}


function countPostsForTag(tag){

  const name =
    String(tag.name || "")
      .trim()
      .toLowerCase();

  const slug =
    String(tag.slug || "")
      .trim()
      .toLowerCase();

  return posts.filter(post=>{

    const postTags = getPostTags(post);

    return postTags.includes(name)
      || postTags.includes(slug);

  }).length;
}


function resetForm(){

  editingId = null;

  $("tagId").value = "";
  $("tagName").value = "";
  $("tagSlug").value = "";
  $("tagDescription").value = "";

  $("formTitle").textContent = "Create New Tag";
  $("saveBtn").textContent = "Create Tag";
}


async function verifyBlog(){

  if(!blogId){

    showStatus(
      "No blog selected. Please open this page with a blogId.",
      "error"
    );

    return false;
  }

  const snap =
    await getDoc(
      doc(db,"blogs",blogId)
    );

  if(!snap.exists()){

    showStatus(
      "Blog not found.",
      "error"
    );

    return false;
  }

  const data = snap.data();

  if(
    data.ownerId &&
    data.ownerId !== user.uid
  ){

    showStatus(
      "You do not have permission to manage this blog.",
      "error"
    );

    return false;
  }

  $("backBtn").href =
    "blog-dashboard.html?blogId="
    + encodeURIComponent(blogId);

  return true;
}


async function loadPosts(){

  posts = [];

  try{

    const q = query(
      collection(db,"posts"),
      where("blogId","==",blogId)
    );

    const snap = await getDocs(q);

    snap.forEach(item=>{

      posts.push({
        id:item.id,
        ...item.data()
      });

    });

  }catch(error){

    console.error(error);

  }

}


async function loadTags(){

  tags = [];

  try{

    const q = query(
      collection(db,"tags"),
      where("blogId","==",blogId)
    );

    const snap = await getDocs(q);

    snap.forEach(item=>{

      tags.push({
        id:item.id,
        ...item.data()
      });

    });

    tags.sort((a,b)=>{

      const ta =
        a.createdAt?.toMillis
        ? a.createdAt.toMillis()
        : 0;

      const tb =
        b.createdAt?.toMillis
        ? b.createdAt.toMillis()
        : 0;

      return tb-ta;

    });

    render();

  }catch(error){

    console.error(error);

    showStatus(
      error.message || "Unable to load tags.",
      "error"
    );

  }
}


function updateStats(){

  const used =
    tags.filter(
      tag=>countPostsForTag(tag)>0
    ).length;

  $("totalTags").textContent =
    tags.length;

  $("usedTags").textContent =
    used;

  $("unusedTags").textContent =
    tags.length-used;

  $("totalPosts").textContent =
    posts.length;
}


function render(){

  updateStats();

  const search =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();

  const filtered =
    tags.filter(tag=>{

      const name =
        String(tag.name||"")
          .toLowerCase();

      const slug =
        String(tag.slug||"")
          .toLowerCase();

      const description =
        String(tag.description||"")
          .toLowerCase();

      return name.includes(search)
        || slug.includes(search)
        || description.includes(search);

    });

  const totalPages =
    Math.max(
      1,
      Math.ceil(filtered.length/perPage)
    );

  if(currentPage>totalPages){
    currentPage=totalPages;
  }

  const start =
    (currentPage-1)*perPage;

  const pageItems =
    filtered.slice(
      start,
      start+perPage
    );

  const tbody = $("tagTable");

  tbody.innerHTML = "";

  $("emptyBox").style.display =
    pageItems.length
    ? "none"
    : "block";

  pageItems.forEach(tag=>{

    const usage =
      countPostsForTag(tag);

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>
        <div class="tag-name">
          ${escapeHtml(tag.name || "Untitled")}
        </div>

        ${
          tag.description
          ? `<div class="slug">
              ${escapeHtml(tag.description)}
             </div>`
          : ""
        }
      </td>

      <td>
        <span class="slug">
          ${escapeHtml(tag.slug || "—")}
        </span>
      </td>

      <td>
        <span class="badge">
          ${usage}
        </span>
      </td>

      <td>
        ${formatDate(tag.createdAt)}
      </td>

      <td>

        <div class="actions">

          <button
            class="secondary"
            data-action="edit"
            data-id="${tag.id}">
            Edit
          </button>

          <button
            class="danger"
            data-action="delete"
            data-id="${tag.id}">
            Delete
          </button>

        </div>

      </td>

    `;

    tbody.appendChild(tr);

  });

  renderPagination(filtered.length);

}


function renderPagination(total){

  const box = $("pagination");

  box.innerHTML = "";

  const pagesCount =
    Math.ceil(total/perPage);

  if(pagesCount<=1) return;

  for(
    let i=1;
    i<=pagesCount;
    i++
  ){

    const button =
      document.createElement("button");

    button.textContent = i;

    if(i===currentPage){
      button.classList.add("active");
    }

    button.onclick = ()=>{

      currentPage=i;
      render();

    };

    box.appendChild(button);

  }

}


async function saveTag(){

  const name =
    $("tagName")
      .value
      .trim();

  let slug =
    $("tagSlug")
      .value
      .trim();

  const description =
    $("tagDescription")
      .value
      .trim();

  if(!name){

    alert("Tag name is required.");
    return;

  }

  if(!slug){
    slug=slugify(name);
  }

  slug=slugify(slug);

  if(!slug){

    alert("Please enter a valid slug.");
    return;

  }

  // Prevent duplicate slug
  const duplicate =
    tags.find(tag=>
      tag.slug === slug &&
      tag.id !== editingId
    );

  if(duplicate){

    alert(
      "A tag with this slug already exists."
    );

    return;

  }

  const button = $("saveBtn");

  button.disabled=true;
  button.textContent =
    editingId
    ? "Saving..."
    : "Creating...";

  try{

    if(editingId){

      await updateDoc(
        doc(db,"tags",editingId),
        {
          name,
          slug,
          description,
          updatedAt:serverTimestamp()
        }
      );

      showStatus(
        "Tag updated successfully.",
        "success"
      );

    }else{

      await addDoc(
        collection(db,"tags"),
        {
          name,
          slug,
          description,
          blogId,
          ownerId:user.uid,
          createdAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        }
      );

      showStatus(
        "Tag created successfully.",
        "success"
      );

    }

    resetForm();

    await loadTags();

  }catch(error){

    console.error(error);

    showStatus(
      error.message || "Unable to save tag.",
      "error"
    );

  }finally{

    button.disabled=false;

    if(!editingId){
      button.textContent="Create Tag";
    }

  }

}


function editTag(id){

  const tag =
    tags.find(item=>item.id===id);

  if(!tag) return;

  editingId=id;

  $("tagId").value=id;

  $("tagName").value =
    tag.name || "";

  $("tagSlug").value =
    tag.slug || "";

  $("tagDescription").value =
    tag.description || "";

  $("formTitle").textContent =
    "Edit Tag";

  $("saveBtn").textContent =
    "Save Changes";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


async function removeTag(id){

  const tag =
    tags.find(item=>item.id===id);

  if(!tag) return;

  const usage =
    countPostsForTag(tag);

  const message =
    usage>0
    ? `This tag is used by ${usage} post(s). Delete it anyway?`
    : "Delete this tag?";

  if(!confirm(message)){
    return;
  }

  try{

    await deleteDoc(
      doc(db,"tags",id)
    );

    showStatus(
      "Tag deleted successfully.",
      "success"
    );

    if(editingId===id){
      resetForm();
    }

    await loadTags();

  }catch(error){

    console.error(error);

    showStatus(
      error.message || "Unable to delete tag.",
      "error"
    );

  }

}


$("tagName").addEventListener(
  "input",
  ()=>{

    if(!editingId){

      $("tagSlug").value =
        slugify($("tagName").value);

    }

  }
);


$("saveBtn").addEventListener(
  "click",
  saveTag
);


$("cancelBtn").addEventListener(
  "click",
  resetForm
);


$("searchInput").addEventListener(
  "input",
  ()=>{

    currentPage=1;
    render();

  }
);


$("tagTable").addEventListener(
  "click",
  event=>{

    const button =
      event.target.closest("button");

    if(!button) return;

    const id =
      button.dataset.id;

    const action =
      button.dataset.action;

    if(action==="edit"){
      editTag(id);
    }

    if(action==="delete"){
      removeTag(id);
    }

  }
);


onAuthStateChanged(
  auth,
  async currentUser=>{

    if(!currentUser){

      location.href="login.html";
      return;

    }

    user=currentUser;

    const valid =
      await verifyBlog();

    if(!valid) return;

    await loadPosts();
    await loadTags();

  }
);

</script>

</body>
</html>
