<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#172033;
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.header h1{
    margin:0;
    font-size:19px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search{
    flex:1;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
}

.filter{
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:#fff;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.primary{
    background:#7c3aed;
    color:#fff;
}

.secondary{
    background:#e2e8f0;
    color:#334155;
}

.danger{
    background:#fee2e2;
    color:#b91c1c;
}

.booking-list{
    display:grid;
    gap:12px;
}

.booking{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:17px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:15px;
}

.booking h2{
    margin:0 0 8px;
    font-size:15px;
}

.meta{
    color:#64748b;
    font-size:10px;
    line-height:1.8;
}

.status{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    font-size:9px;
    font-weight:900;
}

.confirmed{
    background:#dcfce7;
    color:#166534;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.cancelled{
    background:#fee2e2;
    color:#b91c1c;
}

.completed{
    background:#e2e8f0;
    color:#475569;
}

.actions{
    display:flex;
    gap:7px;
    align-items:center;
}

.empty{
    text-align:center;
    padding:70px;
    color:#64748b;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:12px;
    padding:22px;
}

.modal-card h2{
    margin-top:0;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    color:#64748b;
    font-size:9px;
    font-weight:900;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

@media(max-width:650px){

    .header{
        padding:0 12px;
    }

    .container{
        padding:12px;
    }

    .booking{
        grid-template-columns:1fr;
    }

    .actions{
        justify-content:flex-start;
        flex-wrap:wrap;
    }

    .form-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>Bookings</h1>

    <button
        class="primary"
        onclick="openBookingModal()">
        + New Booking
    </button>

</header>


<main class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search bookings..."
            oninput="renderBookings()">

        <select
            id="filter"
            class="filter"
            onchange="renderBookings()">

            <option value="all">
                All
            </option>

            <option value="confirmed">
                Confirmed
            </option>

            <option value="pending">
                Pending
            </option>

            <option value="cancelled">
                Cancelled
            </option>

            <option value="completed">
                Completed
            </option>

        </select>

    </div>


    <section
        id="bookingList"
        class="booking-list">
    </section>


    <div
        id="empty"
        class="empty"
        style="display:none">

        No bookings found.

    </div>

</main>


<!-- =========================
     BOOKING MODAL
========================= -->

<div
    id="bookingModal"
    class="modal">

    <div class="modal-card">

        <h2>
            New Booking
        </h2>


        <div class="form-group">

            <label>
                CUSTOMER NAME
            </label>

            <input
                id="customerName"
                placeholder="Customer name">

        </div>


        <div class="form-group">

            <label>
                EMAIL
            </label>

            <input
                id="customerEmail"
                type="email"
                placeholder="customer@example.com">

        </div>


        <div class="form-group">

            <label>
                SERVICE
            </label>

            <input
                id="service"
                placeholder="Service or appointment">

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>
                    DATE
                </label>

                <input
                    id="bookingDate"
                    type="date">

            </div>


            <div class="form-group">

                <label>
                    TIME
                </label>

                <input
                    id="bookingTime"
                    type="time">

            </div>

        </div>


        <div class="form-group">

            <label>
                STATUS
            </label>

            <select id="bookingStatus">

                <option value="confirmed">
                    Confirmed
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="cancelled">
                    Cancelled
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                NOTES
            </label>

            <textarea
                id="bookingNotes"
                rows="4"
                placeholder="Booking notes..."></textarea>

        </div>


        <div class="modal-actions">

            <button
                class="secondary"
                onclick="closeBookingModal()">
                Cancel
            </button>

            <button
                class="primary"
                onclick="createBooking()">
                Create Booking
            </button>

        </div>

    </div>

</div>


<script>

const STORAGE_KEY =
    "booking-data";

let bookings = [];


/* =========================
   LOAD
========================= */

function loadBookings(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if(saved){

        try{

            bookings =
                JSON.parse(saved);

        }catch(error){

            bookings = [];

        }

    }

    if(!Array.isArray(bookings)){
        bookings = [];
    }

}


/* =========================
   SAVE
========================= */

function saveBookings(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(bookings)
    );

}


/* =========================
   RENDER
========================= */

function renderBookings(){

    const list =
        document.getElementById(
            "bookingList"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const query =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();

    const filter =
        document.getElementById(
            "filter"
        ).value;


    list.innerHTML = "";


    const filtered =
        bookings
            .filter(
                booking => {

                    const text =
                        (
                            booking.customerName +
                            " " +
                            booking.customerEmail +
                            " " +
                            booking.service
                        )
                        .toLowerCase();


                    if(
                        !text.includes(
                            query
                        )
                    ){

                        return false;

                    }


                    if(
                        filter !== "all" &&
                        booking.status !== filter
                    ){

                        return false;

                    }


                    return true;

                }
            )
            .sort(
                (a,b) =>
                    new Date(
                        a.date +
                        "T" +
                        a.time
                    ) -
                    new Date(
                        b.date +
                        "T" +
                        b.time
                    )
            );


    if(!filtered.length){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        booking => {

            const article =
                document.createElement(
                    "article"
                );

            article.className =
                "booking";


            article.innerHTML = `

                <div>

                    <h2>
                        ${escapeHTML(
                            booking.service
                        )}
                    </h2>

                    <div class="meta">

                        <strong>
                            ${escapeHTML(
                                booking.customerName
                            )}
                        </strong>

                        <br>

                        ${escapeHTML(
                            booking.customerEmail
                        )}

                        <br>

                        ${formatDate(
                            booking.date
                        )}

                        ·

                        ${escapeHTML(
                            booking.time
                        )}

                        ${
                            booking.notes
                                ? `
                                    <br>
                                    ${escapeHTML(
                                        booking.notes
                                    )}
                                  `
                                : ""
                        }

                        <br><br>

                        <span
                            class="status ${booking.status}">

                            ${escapeHTML(
                                booking.status
                                    .toUpperCase()
                            )}

                        </span>

                    </div>

                </div>


                <div class="actions">

                    ${
                        booking.status === "pending"
                            ? `
                                <button
                                    class="primary"
                                    onclick="confirmBooking(${booking.id})">
                                    Confirm
                                </button>
                              `
                            : ""
                    }

                    ${
                        booking.status !== "cancelled"
                            ? `
                                <button
                                    class="secondary"
                                    onclick="cancelBooking(${booking.id})">
                                    Cancel
                                </button>
                              `
                            : ""
                    }

                    <button
                        class="danger"
                        onclick="deleteBooking(${booking.id})">
                        Delete
                    </button>

                </div>

            `;


            list.appendChild(
                article
            );

        }
    );

}


/* =========================
   MODAL
========================= */

function openBookingModal(){

    document.getElementById(
        "bookingModal"
    ).classList.add(
        "show"
    );


    document.getElementById(
        "bookingDate"
    ).value =
        new Date()
            .toISOString()
            .split("T")[0];

}


function closeBookingModal(){

    document.getElementById(
        "bookingModal"
    ).classList.remove(
        "show"
    );

}


/* =========================
   CREATE
========================= */

function createBooking(){

    const customerName =
        document.getElementById(
            "customerName"
        ).value.trim();

    const customerEmail =
        document.getElementById(
            "customerEmail"
        ).value.trim();

    const service =
        document.getElementById(
            "service"
        ).value.trim();

    const date =
        document.getElementById(
            "bookingDate"
        ).value;

    const time =
        document.getElementById(
            "bookingTime"
        ).value;

    const status =
        document.getElementById(
            "bookingStatus"
        ).value;

    const notes =
        document.getElementById(
            "bookingNotes"
        ).value.trim();


    if(
        !customerName ||
        !service ||
        !date ||
        !time
    ){

        alert(
            "Please complete the customer, service, date and time fields."
        );

        return;

    }


    bookings.push({

        id:
            Date.now(),

        customerName,

        customerEmail,

        service,

        date,

        time,

        status,

        notes

    });


    saveBookings();

    clearBookingForm();

    closeBookingModal();

    renderBookings();

}


/* =========================
   CONFIRM
========================= */

function confirmBooking(id){

    const booking =
        bookings.find(
            item =>
                item.id === id
        );


    if(!booking){
        return;
    }


    booking.status =
        "confirmed";


    saveBookings();

    renderBookings();

}


/* =========================
   CANCEL
========================= */

function cancelBooking(id){

    const booking =
        bookings.find(
            item =>
                item.id === id
        );


    if(!booking){
        return;
    }


    if(
        !confirm(
            "Cancel this booking?"
        )
    ){

        return;

    }


    booking.status =
        "cancelled";


    saveBookings();

    renderBookings();

}


/* =========================
   DELETE
========================= */

function deleteBooking(id){

    if(
        !confirm(
            "Delete this booking?"
        )
    ){

        return;

    }


    bookings =
        bookings.filter(
            booking =>
                booking.id !== id
        );


    saveBookings();

    renderBookings();

}


/* =========================
   CLEAR FORM
========================= */

function clearBookingForm(){

    document.getElementById(
        "customerName"
    ).value = "";

    document.getElementById(
        "customerEmail"
    ).value = "";

    document.getElementById(
        "service"
    ).value = "";

    document.getElementById(
        "bookingTime"
    ).value = "";

    document.getElementById(
        "bookingNotes"
    ).value = "";

    document.getElementById(
        "bookingStatus"
    ).value =
        "confirmed";

}


/* =========================
   DATE
========================= */

function formatDate(
    value
){

    if(!value){
        return "No date";
    }


    const date =
        new Date(
            value +
            "T00:00:00"
        );


    return date.toLocaleDateString(
        undefined,
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
    value
){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   START
========================= */

loadBookings();

renderBookings();

</script>

</body>
</html>
