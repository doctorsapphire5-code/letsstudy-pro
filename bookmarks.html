<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Bookmarks | LetsStudy Pro</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a
}

a{
text-decoration:none
}

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:14px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb
}

nav{
display:flex;
gap:7px;
flex-wrap:wrap
}

nav a{
font-size:9px;
font-weight:900;
color:#334155;
background:#f1f5f9;
padding:8px 10px;
border-radius:8px
}

.container{
max-width:1050px;
margin:auto;
padding:22px 15px
}

.hero{
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:#fff;
padding:25px;
border-radius:20px;
margin-bottom:16px
}

.hero small{
font-size:9px;
font-weight:900
}

.hero h1{
font-size:27px;
margin:8px 0
}

.hero p{
font-size:11px;
line-height:1.7;
opacity:.9
}

.toolbar{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:13px;
margin-bottom:16px;
display:flex;
gap:8px;
flex-wrap:wrap
}

input,
select{
padding:10px;
border:1px solid #cbd5e1;
border-radius:9px;
font-size:10px;
outline:none
}

input{
flex:1;
min-width:180px
}

.tabs{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-bottom:16px
}

.tab{
border:0;
background:#e2e8f0;
padding:10px 14px;
border-radius:9px;
font-size:9px;
font-weight:900;
cursor:pointer
}

.tab.active{
background:#2563eb;
color:#fff
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:16px;
overflow:hidden
}

.cover{
height:120px;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
background:linear-gradient(135deg,#dbeafe,#ede9fe);
background-size:cover;
background-position:center
}

.content{
padding:15px
}

.type{
font-size:8px;
font-weight:900;
color:#2563eb;
margin-bottom:7px
}

.title{
font-size:14px;
font-weight:900;
line-height:1.4;
margin-bottom:7px
}

.description{
font-size:10px;
color:#64748b;
line-height:1.6
}

.meta{
font-size:8px;
color:#94a3b8;
margin-top:8px
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:12px
}

.btn{
border:0;
padding:9px 11px;
border-radius:8px;
font-size:8px;
font-weight:900;
cursor:pointer;
display:inline-flex;
align-items:center;
justify-content:center
}

.primary{
background:#2563eb;
color:#fff
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.danger{
background:#fee2e2;
color:#991b1b
}

.loading,
.empty{
grid-column:1/-1;
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:50px 20px;
text-align:center;
font-size:11px;
color:#64748b
}

.message{
display:none;
padding:10px;
border-radius:9px;
font-size:10px;
font-weight:900;
margin-bottom:12px
}

.success{
background:#dcfce7;
color:#166534
}

.error{
background:#fee2e2;
color:#991b1b
}

footer{
text-align:center;
padding:30px;
font-size:10px;
color:#64748b
}

@media(max-width:800px){
.grid{
grid-template-columns:repeat(2,1fr)
}
}

@media(max-width:550px){

header{
flex-direction:column;
align-items:flex-start
}

nav{
width:100%
}

nav a{
flex:1;
text-align:center
}

.grid{
grid-template-columns:1fr
}

}
</style>
</head>


<body>

<header>

<a href="dashboard.html" class="logo">
LetsStudy Pro
</a>

<nav>

<a href="resources.html">
Resources
</a>

<a href="courses.html">
Courses
</a>

<a href="dashboard.html">
Dashboard
</a>

</nav>

</header>


<main class="container">

<section class="hero">

<small>
YOUR LIBRARY
</small>

<h1>
Bookmarks
</h1>

<p>
Quickly access your saved courses and learning resources.
</p>

</section>


<div id="message" class="message"></div>


<div class="tabs">

<button
class="tab active"
data-type="all">

All

</button>

<button
class="tab"
data-type="resource">

Resources

</button>

<button
class="tab"
data-type="course">

Courses

</button>

</div>


<section class="toolbar">

<input
id="search"
type="search"
placeholder="Search bookmarks...">

<select id="sort">

<option value="newest">
Newest
</option>

<option value="oldest">
Oldest
</option>

<option value="title">
Title A-Z
</option>

</select>

</section>


<section
id="grid"
class="grid">

<div class="loading">
Loading bookmarks...
</div>

</section>

</main>


<footer>

© <span id="year"></span> LetsStudy Pro

</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const grid=
document.getElementById("grid");

const search=
document.getElementById("search");

const sort=
document.getElementById("sort");

const message=
document.getElementById("message");

const tabs=
document.querySelectorAll(".tab");


let user=null;
let bookmarks=[];
let activeType="all";


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
auth,
async currentUser=>{

if(!currentUser){

location.href=
"login.html?redirect="+
encodeURIComponent(
"bookmarks.html"
);

return;

}

user=currentUser;

await loadBookmarks();

render();

}
);


/* =========================================
LOAD BOOKMARKS
========================================= */

async function loadBookmarks(){

grid.innerHTML=`

<div class="loading">
Loading bookmarks...
</div>

`;

try{

const snap=
await getDocs(
collection(
db,
"users",
user.uid,
"bookmarks"
)
);


if(snap.empty){

bookmarks=[];

return;

}


const loaded=[];


for(
const bookmarkDoc
of snap.docs
){

const bookmark=
bookmarkDoc.data();

const resourceId=
bookmark.resourceId||
bookmarkDoc.id;

let data=null;
let type=
bookmark.type||
"resource";


/*
Try resources first.
*/

try{

const resourceSnap=
await getDoc(
doc(
db,
"resources",
resourceId
)
);

if(resourceSnap.exists()){

data={
id:resourceSnap.id,
...resourceSnap.data()
};

type="resource";

}

}catch(e){}


/*
If not a resource,
try courses.
*/

if(!data){

try{

const courseSnap=
await getDoc(
doc(
db,
"courses",
resourceId
)
);

if(courseSnap.exists()){

data={
id:courseSnap.id,
...courseSnap.data()
};

type="course";

}

}catch(e){}

}


/*
Fallback to bookmark snapshot.
*/

if(!data){

data={
id:resourceId,
title:
bookmark.title||
"Saved Item",
description:
bookmark.description||
"",
image:
bookmark.image||
"",
createdAt:
bookmark.createdAt||
null
};

}


loaded.push({

id:resourceId,

type,

data,

bookmarkData:bookmark

});

}


bookmarks=loaded;

}catch(error){

console.error(error);

grid.innerHTML=`

<div class="empty">

Unable to load bookmarks.

</div>

`;

}

}


/* =========================================
RENDER
========================================= */

function render(){

let list=
[...bookmarks];


const keyword=
search.value
.trim()
.toLowerCase();


if(activeType!=="all"){

list=
list.filter(
item=>
item.type===activeType
);

}


if(keyword){

list=
list.filter(
item=>{

const title=
String(
item.data.title||
""
).toLowerCase();

const description=
String(
item.data.description||
""
).toLowerCase();

return(
title.includes(keyword)||
description.includes(keyword)
);

}
);

}


/* SORT */

if(sort.value==="title"){

list.sort(
(a,b)=>
String(
a.data.title||""
).localeCompare(
String(
b.data.title||""
)
)
);

}

else if(sort.value==="oldest"){

list.sort(
(a,b)=>
getTime(a.bookmarkData?.createdAt)-
getTime(b.bookmarkData?.createdAt)
);

}

else{

list.sort(
(a,b)=>
getTime(b.bookmarkData?.createdAt)-
getTime(a.bookmarkData?.createdAt)
);

}


grid.innerHTML="";


if(!list.length){

grid.innerHTML=`

<div class="empty">

🔖<br><br>

No bookmarks found.

<br><br>

<a
href="resources.html"
class="btn primary">

Explore Resources

</a>

</div>

`;

return;

}


list.forEach(
item=>{

const data=item.data;

const title=
escapeHTML(
data.title||
"Saved Item"
);

const description=
escapeHTML(
data.description||
"Saved content from LetsStudy Pro."
);

const image=
data.image||
data.thumbnail||
"";

const isCourse=
item.type==="course";

const details=
isCourse
?
"item.html?id="+
encodeURIComponent(item.id)
:
"resources-details.html?id="+
encodeURIComponent(item.id);

const download=
"download.html?id="+
encodeURIComponent(item.id);


const card=
document.createElement("article");

card.className="card";


card.innerHTML=`

<div
class="cover"
${
image
?
`style="background-image:url('${escapeAttribute(image)}')"`
:
""
}>

${image?"":isCourse?"🎓":"📚"}

</div>


<div class="content">

<div class="type">

${isCourse?
"COURSE":
"RESOURCE"}

</div>


<div class="title">

${title}

</div>


<div class="description">

${description.substring(0,120)}
${description.length>120?"...":""}

</div>


<div class="meta">

Saved item

</div>


<div class="actions">

<a
href="${details}"
class="btn primary">

Open

</a>

<a
href="${download}"
class="btn secondary">

Download

</a>

<button
class="btn danger"
data-remove="${escapeAttribute(item.id)}">

Remove

</button>

</div>

</div>

`;


grid.appendChild(card);

}
);


/* REMOVE */

document
.querySelectorAll(
"[data-remove]"
)
.forEach(
button=>{

button.addEventListener(
"click",
()=>removeBookmark(
button.dataset.remove
)
);

}
);

}


/* =========================================
REMOVE BOOKMARK
========================================= */

async function removeBookmark(id){

try{

await deleteDoc(
doc(
db,
"users",
user.uid,
"bookmarks",
id
)
);

bookmarks=
bookmarks.filter(
item=>item.id!==id
);

showMessage(
"Bookmark removed.",
"success"
);

render();

}catch(error){

console.error(error);

showMessage(
"Unable to remove bookmark.",
"error"
);

}

}


/* =========================================
TABS
========================================= */

tabs.forEach(
tab=>{

tab.addEventListener(
"click",
()=>{

tabs.forEach(
x=>
x.classList.remove(
"active"
)
);

tab.classList.add("active");

activeType=
tab.dataset.type;

render();

}
);

});


/* =========================================
FILTERS
========================================= */

search.addEventListener(
"input",
render
);

sort.addEventListener(
"change",
render
);


/* =========================================
DATE
========================================= */

function getTime(value){

if(!value)return 0;

if(
typeof value.toMillis==="function"
){

return value.toMillis();

}

if(
value.seconds
){

return value.seconds*1000;

}

const time=
new Date(value).getTime();

return Number.isNaN(time)
?0
:time;

}


/* =========================================
MESSAGE
========================================= */

function showMessage(text,type){

message.textContent=text;

message.className=
"message "+
type;

message.style.display="block";

setTimeout(
()=>{
message.style.display="none";
},
2500
);

}


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function escapeAttribute(value){

return String(value)
.replaceAll("'","%27")
.replaceAll('"',"%22");

}


/* =========================================
YEAR
========================================= */

document.getElementById("year")
.textContent=
new Date().getFullYear();

</script>

</body>
</html>
