<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Brand Name Generator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:18px 0;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#2563eb;
  font-size:20px;
  font-weight:900;
}

nav a{
  text-decoration:none;
  color:#64748b;
  margin-left:18px;
  font-size:14px;
  font-weight:700;
}

main{
  padding:40px 0 60px;
}

.hero{
  text-align:center;
  margin-bottom:30px;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  color:#64748b;
}

.builder{
  max-width:700px;
  margin:auto;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:25px;
  box-shadow:0 10px 30px #00000008;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.group{
  margin-bottom:15px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  font:inherit;
  background:#fff;
}

input:focus,
select:focus{
  border-color:#2563eb;
}

button{
  border:0;
  border-radius:9px;
  padding:13px 18px;
  cursor:pointer;
  font-weight:800;
}

.primary{
  width:100%;
  background:#2563eb;
  color:#fff;
}

.primary:hover{
  background:#1d4ed8;
}

.results{
  margin-top:25px;
}

.results h2{
  margin-bottom:15px;
}

.names{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.name-card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.name{
  font-size:17px;
  font-weight:900;
}

.copy{
  padding:8px 11px;
  background:#eff6ff;
  color:#2563eb;
  font-size:11px;
}

.copy:hover{
  background:#dbeafe;
}

.saved{
  margin-top:25px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:20px;
}

.saved h2{
  margin-bottom:12px;
}

.saved-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.saved-item{
  padding:8px 11px;
  border-radius:20px;
  background:#f1f5f9;
  font-size:12px;
  font-weight:700;
}

.empty{
  color:#64748b;
  font-size:13px;
}

footer{
  background:#0f172a;
  color:#fff;
  padding:25px 0;
}

footer p{
  color:#94a3b8;
  margin-top:5px;
  font-size:13px;
}

@media(max-width:650px){
  nav{
    display:none;
  }

  .grid,
  .names{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">
✨ Brand Generator
</div>

<nav>
<a href="#generator">Generator</a>
<a href="#saved">Saved Names</a>
</nav>

</div>
</header>


<main class="container">

<section class="hero">
<h1>Brand Name Generator</h1>
<p>
Create memorable brand names for your next business.
</p>
</section>


<section
class="builder"
id="generator">

<div class="grid">

<div class="group">

<label>Business / Industry</label>

<input
id="industry"
placeholder="e.g. Technology">

</div>


<div class="group">

<label>Keyword</label>

<input
id="keyword"
placeholder="e.g. smart">

</div>


<div class="group">

<label>Brand Style</label>

<select id="style">

<option value="modern">
Modern
</option>

<option value="premium">
Premium
</option>

<option value="creative">
Creative
</option>

<option value="simple">
Simple
</option>

<option value="tech">
Tech
</option>

</select>

</div>


<div class="group">

<label>Name Length</label>

<select id="length">

<option value="short">
Short
</option>

<option value="medium">
Medium
</option>

<option value="long">
Long
</option>

</select>

</div>


<div class="group full">

<button
class="primary"
id="generate">

✨ Generate Brand Names

</button>

</div>

</div>

</section>


<section class="results">

<h2>Generated Names</h2>

<div
class="names"
id="names">

<div class="empty">
Enter your details and generate brand names.
</div>

</div>

</section>


<section
class="saved"
id="saved">

<h2>❤️ Saved Names</h2>

<div
class="saved-list"
id="savedList">

<span class="empty">
No saved names yet.
</span>

</div>

</section>

</main>


<footer>
<div class="container">

<strong>
✨ Brand Name Generator
</strong>

<p>
© <span id="year"></span> Brand Generator
</p>

</div>
</footer>


<script>

const prefixes = [
"Nova",
"Bright",
"Prime",
"Smart",
"Next",
"Blue",
"Pure",
"Urban",
"Swift",
"Elevate",
"Vision",
"Peak",
"Core",
"Fresh",
"Quantum"
];


const suffixes = [
"ly",
"ify",
"ora",
"hub",
"lab",
"flow",
"works",
"base",
"pro",
"nest",
"wave",
"zone",
"tech",
"space",
"co"
];


const premiumWords = [
"Elite",
"Lux",
"Vantage",
"Prestige",
"Vertex",
"Monarch",
"Imperial",
"Opal"
];


const techWords = [
"Byte",
"Cloud",
"Pixel",
"Logic",
"Code",
"Data",
"Net",
"Cyber",
"Sync",
"Digital"
];


const creativeWords = [
"Spark",
"Canvas",
"Bloom",
"Craft",
"Imagine",
"Fusion",
"Vibe",
"Create"
];


let savedNames =
JSON.parse(
localStorage.getItem(
"savedBrandNames"
) || "[]"
);


function clean(value){

return value
.trim()
.replace(/\s+/g," ");

}


function capitalize(value){

if(!value) return "";

return value.charAt(0)
.toUpperCase() +
value.slice(1);

}


function generateName(
keyword,
industry,
style,
length
){

const key =
capitalize(keyword);

const ind =
capitalize(industry);


let name;


if(style === "premium"){

const word =
premiumWords[
Math.floor(
Math.random() *
premiumWords.length
)
];

name =
key
? word + " " + key
: word + ind;

}


else if(style === "tech"){

const word =
techWords[
Math.floor(
Math.random() *
techWords.length
)
];

name =
key
? key + word
: word + ind;

}


else if(style === "creative"){

const word =
creativeWords[
Math.floor(
Math.random() *
creativeWords.length
)
];

name =
key
? word + key
: word + ind;

}


else if(style === "simple"){

const word =
prefixes[
Math.floor(
Math.random() *
prefixes.length
)
];

name =
key
? word + " " + key
: word + " " + ind;

}


else{

const prefix =
prefixes[
Math.floor(
Math.random() *
prefixes.length
)
];

const suffix =
suffixes[
Math.floor(
Math.random() *
suffixes.length
)
];

name =
key
? prefix + key + suffix
: prefix + ind + suffix;

}


if(length === "short"){

name =
name
.replace(/\s+/g,"")
.slice(0,12);

}


if(length === "medium"){

name =
name.slice(0,18);

}


return name;

}


function generate(){

const keyword =
clean(
document.getElementById(
"keyword"
).value
);

const industry =
clean(
document.getElementById(
"industry"
).value
);

const style =
document.getElementById(
"style"
).value;

const length =
document.getElementById(
"length"
).value;


if(!keyword && !industry){

alert(
"Enter a keyword or industry first."
);

return;

}


const names = new Set();


while(names.size < 10){

names.add(
generateName(
keyword,
industry,
style,
length
)
);

}


document.getElementById(
"names"
).innerHTML =
[...names]
.map(
name => `

<div class="name-card">

<span class="name">
${escapeHTML(name)}
</span>

<div>

<button
class="copy"
data-name="${escapeHTML(name)}">
Copy
</button>

<button
class="copy"
data-save="${escapeHTML(name)}">
Save
</button>

</div>

</div>

`
).join("");


attachButtons();

}


function attachButtons(){

document
.querySelectorAll(
"[data-name]"
)
.forEach(button => {

button.addEventListener(
"click",
async () => {

const name =
button.dataset.name;

try{

await navigator.clipboard
.writeText(name);

button.textContent =
"Copied!";

setTimeout(
() => {
button.textContent =
"Copy";
},
1200
);

}catch{

alert(
"Copy failed. Name: " +
name
);

}

});

});


document
.querySelectorAll(
"[data-save]"
)
.forEach(button => {

button.addEventListener(
"click",
() => {

const name =
button.dataset.save;

if(!savedNames.includes(name)){

savedNames.push(name);

localStorage.setItem(
"savedBrandNames",
JSON.stringify(
savedNames
)
);

renderSaved();

button.textContent =
"Saved";

}

});

});

}


function renderSaved(){

const container =
document.getElementById(
"savedList"
);

if(!savedNames.length){

container.innerHTML =
`<span class="empty">
No saved names yet.
</span>`;

return;

}


container.innerHTML =
savedNames
.map(
name =>
`<span class="saved-item">
${escapeHTML(name)}
</span>`
)
.join("");

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


document.getElementById(
"generate"
).addEventListener(
"click",
generate
);


document.getElementById(
"year"
).textContent =
new Date().getFullYear();


renderSaved();

</script>

</body>
</html>
