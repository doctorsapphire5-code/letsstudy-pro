<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Business Ideas</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:18px 0;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:900;
  color:#2563eb;
}

nav a{
  text-decoration:none;
  color:#64748b;
  margin-left:18px;
  font-size:14px;
  font-weight:700;
}

main{
  padding:35px 0 60px;
}

.hero{
  margin-bottom:25px;
}

.hero h1{
  font-size:36px;
  margin-bottom:8px;
}

.hero p{
  color:#64748b;
}

.toolbar{
  display:flex;
  gap:12px;
  margin-bottom:22px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #e2e8f0;
  border-radius:9px;
  outline:none;
  font:inherit;
  background:#fff;
}

.toolbar input{
  flex:1;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  background:#2563eb;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:20px;
}

.stat span{
  color:#64748b;
  font-size:13px;
}

.stat strong{
  display:block;
  margin-top:7px;
  font-size:27px;
}

.ideas{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.idea{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:21px;
}

.idea-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.idea h2{
  font-size:18px;
}

.badge{
  background:#eff6ff;
  color:#2563eb;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  height:max-content;
}

.idea p{
  color:#64748b;
  font-size:13px;
  line-height:1.6;
  margin:12px 0;
}

.meta{
  display:flex;
  justify-content:space-between;
  color:#64748b;
  font-size:12px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  background:#fff;
  border:1px dashed #cbd5e1;
  border-radius:15px;
  color:#64748b;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:min(480px,100%);
  background:#fff;
  border-radius:15px;
  padding:25px;
}

.modal-box h2{
  margin-bottom:18px;
}

.group{
  margin-bottom:14px;
}

.group label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.cancel{
  background:#e2e8f0;
  color:#172033;
}

footer{
  background:#0f172a;
  color:#fff;
  padding:25px 0;
}

footer p{
  color:#94a3b8;
  font-size:13px;
  margin-top:5px;
}

@media(max-width:700px){
  nav{display:none}

  .toolbar{
    flex-direction:column;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .ideas{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:29px;
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">💡 Business Ideas</div>

<nav>
<a href="#ideas">Ideas</a>
<a href="#categories">Categories</a>
<a href="#saved">Saved</a>
</nav>

</div>
</header>


<main class="container">

<section class="hero">
<h1>Business Ideas</h1>
<p>
Discover, organize and evaluate your next business opportunity.
</p>
</section>


<section class="toolbar">

<input
id="search"
type="search"
placeholder="Search business ideas...">

<select id="filter">
<option value="all">All Categories</option>
<option value="Technology">Technology</option>
<option value="Retail">Retail</option>
<option value="Services">Services</option>
<option value="Education">Education</option>
<option value="Food">Food</option>
</select>

<button id="addBtn">
+ Add Idea
</button>

</section>


<section class="stats">

<div class="stat">
<span>Total Ideas</span>
<strong id="total">0</strong>
</div>

<div class="stat">
<span>High Potential</span>
<strong id="high">0</strong>
</div>

<div class="stat">
<span>Categories</span>
<strong id="categories">0</strong>
</div>

</section>


<section
class="ideas"
id="ideas">
</section>

</main>


<!-- MODAL -->

<div
class="modal"
id="modal">

<div class="modal-box">

<h2>Add Business Idea</h2>

<div class="group">
<label>Business Name</label>
<input
id="name"
placeholder="e.g. Online Grocery Store">
</div>

<div class="group">
<label>Category</label>
<select id="category">

<option>Technology</option>
<option>Retail</option>
<option>Services</option>
<option>Education</option>
<option>Food</option>

</select>
</div>

<div class="group">
<label>Description</label>
<textarea
id="description"
rows="4"
placeholder="Describe your business idea..."></textarea>
</div>

<div class="group">
<label>Potential</label>
<select id="potential">
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>
</div>

<div class="actions">

<button id="save">
Save Idea
</button>

<button
class="cancel"
id="close">
Cancel
</button>

</div>

</div>
</div>


<footer>
<div class="container">

<strong>💡 Business Ideas</strong>

<p>
© <span id="year"></span> Business Ideas
</p>

</div>
</footer>


<script>

const ideas = [

{
name:"AI Marketing Agency",
category:"Technology",
description:"Help businesses create automated marketing campaigns using AI.",
potential:"High"
},

{
name:"Online Skills Academy",
category:"Education",
description:"Create affordable online courses for practical business and technology skills.",
potential:"High"
},

{
name:"Local Food Delivery",
category:"Food",
description:"Connect local restaurants with customers through a simple delivery platform.",
potential:"Medium"
},

{
name:"Business Consulting",
category:"Services",
description:"Provide strategy, financial and operational support to small businesses.",
potential:"Medium"
}

];


const container =
document.getElementById("ideas");

const search =
document.getElementById("search");

const filter =
document.getElementById("filter");

const modal =
document.getElementById("modal");


function render(){

const query =
search.value.toLowerCase();

const selected =
filter.value;


const filtered =
ideas.filter(idea => {

const matchesSearch =
idea.name
.toLowerCase()
.includes(query) ||
idea.description
.toLowerCase()
.includes(query);

const matchesCategory =
selected === "all" ||
idea.category === selected;

return matchesSearch &&
matchesCategory;

});


if(!filtered.length){

container.innerHTML =
`<div class="empty">
No business ideas found.
</div>`;

updateStats(filtered);
return;

}


container.innerHTML =
filtered.map(idea => `

<article class="idea">

<div class="idea-top">

<h2>
${escapeHTML(idea.name)}
</h2>

<span class="badge">
${escapeHTML(idea.potential)}
</span>

</div>

<p>
${escapeHTML(idea.description)}
</p>

<div class="meta">

<span>
📁 ${escapeHTML(idea.category)}
</span>

<span>
💡 ${escapeHTML(idea.potential)} Potential
</span>

</div>

</article>

`).join("");


updateStats(filtered);

}


function updateStats(list){

document.getElementById(
"total"
).textContent =
list.length;


document.getElementById(
"high"
).textContent =
list.filter(
idea => idea.potential === "High"
).length;


document.getElementById(
"categories"
).textContent =
new Set(
list.map(
idea => idea.category
)
).size;

}


search.addEventListener(
"input",
render
);

filter.addEventListener(
"change",
render
);


document.getElementById(
"addBtn"
).addEventListener(
"click",
() => {
modal.classList.add("active");
}
);


document.getElementById(
"close"
).addEventListener(
"click",
() => {
modal.classList.remove("active");
}
);


document.getElementById(
"save"
).addEventListener(
"click",
() => {

const name =
document.getElementById(
"name"
).value.trim();

const category =
document.getElementById(
"category"
).value;

const description =
document.getElementById(
"description"
).value.trim();

const potential =
document.getElementById(
"potential"
).value;


if(!name || !description){

alert(
"Please enter the business name and description."
);

return;

}


ideas.push({
name,
category,
description,
potential
});


document.getElementById(
"name"
).value = "";

document.getElementById(
"description"
).value = "";

modal.classList.remove(
"active"
);

render();

}
);


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


document.getElementById(
"year"
).textContent =
new Date().getFullYear();


render();

</script>

</body>
</html>
