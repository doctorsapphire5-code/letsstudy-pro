<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Business Register</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
.container{
  width:min(1000px,92%);
  margin:auto;
}
header{
  background:#2563eb;
  color:#fff;
  padding:20px 0;
}
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-size:20px;font-weight:800}
nav a{color:#fff;text-decoration:none;margin-left:18px}
main{padding:35px 0}
.hero{margin-bottom:25px}
.hero h1{font-size:32px;margin-bottom:8px}
.hero p{color:#64748b}
.card{
  background:#fff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 8px 30px #0000000d;
  margin-bottom:25px;
}
h2{margin-bottom:18px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
.group{display:flex;flex-direction:column;gap:6px}
.full{grid-column:1/-1}
label{font-weight:700;font-size:14px}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:#2563eb;
}
textarea{min-height:100px;resize:vertical}
.buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}
button{
  border:0;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}
.primary{background:#2563eb;color:#fff}
.secondary{background:#e8eef7;color:#172033}
.danger{background:#fee2e2;color:#b91c1c}
.status{
  padding:12px;
  border-radius:9px;
  margin-bottom:20px;
  background:#eff6ff;
  color:#1d4ed8;
}
.search{
  margin-bottom:18px;
}
.business{
  border:1px solid #e2e8f0;
  padding:17px;
  border-radius:12px;
  margin-bottom:12px;
}
.business h3{margin-bottom:5px}
.business p{color:#64748b;font-size:14px}
.actions{
  margin-top:10px;
  display:flex;
  gap:8px;
}
.actions button{
  padding:8px 12px;
  font-size:13px;
}
.empty{
  color:#64748b;
  text-align:center;
  padding:20px;
}
footer{
  text-align:center;
  color:#64748b;
  padding:30px;
}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  nav a{display:none}
  .hero h1{font-size:26px}
}
</style>
</head>

<body>

<header>
<div class="container">
<nav>
<div class="logo">💼 Business Register</div>
<div>
<a href="#register">Register</a>
<a href="#businesses">Businesses</a>
</div>
</nav>
</div>
</header>

<main class="container">

<section class="hero">
<h1>Register Your Business</h1>
<p>Create and manage your business profile securely.</p>
</section>

<div id="status" class="status">
Connecting to Firebase...
</div>

<section class="card" id="register">

<h2>Business Information</h2>

<form id="businessForm">

<div class="grid">

<div class="group">
<label>Business Name *</label>
<input id="name" required placeholder="Example: Bright Solutions">
</div>

<div class="group">
<label>Industry *</label>
<select id="industry" required>
<option value="">Select industry</option>
<option>Technology</option>
<option>Retail</option>
<option>Education</option>
<option>Finance</option>
<option>Healthcare</option>
<option>Consulting</option>
<option>Agriculture</option>
<option>Construction</option>
<option>Hospitality</option>
<option>Other</option>
</select>
</div>

<div class="group">
<label>Owner / Director</label>
<input id="owner" placeholder="John Doe">
</div>

<div class="group">
<label>Phone</label>
<input id="phone" type="tel" placeholder="+255 700 000 000">
</div>

<div class="group">
<label>Email</label>
<input id="email" type="email" placeholder="business@example.com">
</div>

<div class="group">
<label>Location</label>
<input id="location" placeholder="Dar es Salaam, Tanzania">
</div>

<div class="group">
<label>Website</label>
<input id="website" type="url" placeholder="https://example.com">
</div>

<div class="group">
<label>Employees</label>
<input id="employees" type="number" min="0" placeholder="10">
</div>

<div class="group full">
<label>Business Description</label>
<textarea id="description"
placeholder="Describe your business..."></textarea>
</div>

</div>

<div class="buttons">
<button class="primary" id="saveBtn" type="submit">
💾 Register Business
</button>

<button class="secondary" type="reset">
Reset
</button>
</div>

</form>
</section>


<section class="card" id="businesses">

<h2>Registered Businesses</h2>

<input
class="search"
id="search"
placeholder="🔎 Search business..."
>

<div id="businessList">
<div class="empty">Loading businesses...</div>
</div>

</section>

</main>

<footer>
© <span id="year"></span> Business Register
</footer>


<script type="module">

import {
initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};


/* FIREBASE */

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const businessesRef=collection(db,"businesses");


/* ELEMENTS */

const form=document.getElementById("businessForm");
const list=document.getElementById("businessList");
const status=document.getElementById("status");
const search=document.getElementById("search");
const saveBtn=document.getElementById("saveBtn");


let businesses=[];


/* STATUS */

function setStatus(text,error=false){
status.textContent=text;
status.style.background=error?"#fee2e2":"#eff6ff";
status.style.color=error?"#b91c1c":"#1d4ed8";
}


/* GET FORM DATA */

function getData(){

return{
name:document.getElementById("name").value.trim(),
industry:document.getElementById("industry").value,
owner:document.getElementById("owner").value.trim(),
phone:document.getElementById("phone").value.trim(),
email:document.getElementById("email").value.trim(),
location:document.getElementById("location").value.trim(),
website:document.getElementById("website").value.trim(),
employees:document.getElementById("employees").value,
description:document.getElementById("description").value.trim(),
createdAt:serverTimestamp()
};

}


/* REGISTER */

form.addEventListener("submit",async e=>{

e.preventDefault();

const data=getData();

if(!data.name||!data.industry){

setStatus(
"Business name and industry are required.",
true
);

return;

}

try{

saveBtn.disabled=true;
saveBtn.textContent="Saving...";

await addDoc(
businessesRef,
data
);

form.reset();

setStatus(
"Business registered successfully."
);

await loadBusinesses();

}catch(error){

console.error(error);

setStatus(
"Could not register business: "+error.message,
true
);

}finally{

saveBtn.disabled=false;
saveBtn.textContent="💾 Register Business";

}

});


/* LOAD */

async function loadBusinesses(){

try{

const snapshot=await getDocs(
businessesRef
);

businesses=[];

snapshot.forEach(item=>{

businesses.push({
id:item.id,
...item.data()
});

});

renderBusinesses();

setStatus(
`${businesses.length} business(es) registered.`
);

}catch(error){

console.error(error);

setStatus(
"Could not load businesses: "+error.message,
true
);

}

}


/* RENDER */

function renderBusinesses(){

const query=
search.value.trim().toLowerCase();

const filtered=
businesses.filter(b=>
(b.name||"").toLowerCase().includes(query)||
(b.industry||"").toLowerCase().includes(query)||
(b.location||"").toLowerCase().includes(query)
);


if(!filtered.length){

list.innerHTML=
`<div class="empty">
No businesses found.
</div>`;

return;

}


list.innerHTML=filtered.map(b=>`

<div class="business">

<h3>${escapeHTML(b.name||"Unnamed Business")}</h3>

<p>
<strong>Industry:</strong>
${escapeHTML(b.industry||"—")}
</p>

<p>
<strong>Owner:</strong>
${escapeHTML(b.owner||"—")}
</p>

<p>
<strong>Location:</strong>
${escapeHTML(b.location||"—")}
</p>

<p>
<strong>Phone:</strong>
${escapeHTML(b.phone||"—")}
</p>

<div class="actions">

<button
class="danger"
data-id="${b.id}"
>
🗑️ Delete
</button>

</div>

</div>

`).join("");


document.querySelectorAll(
"[data-id]"
).forEach(button=>{

button.addEventListener(
"click",
()=>deleteBusiness(button.dataset.id)
);

});

}


/* DELETE */

async function deleteBusiness(id){

if(!confirm(
"Delete this business?"
))return;

try{

await deleteDoc(
doc(db,"businesses",id)
);

setStatus(
"Business deleted successfully."
);

await loadBusinesses();

}catch(error){

console.error(error);

setStatus(
"Delete failed: "+error.message,
true
);

}

}


/* SEARCH */

search.addEventListener(
"input",
renderBusinesses
);


/* SAFE HTML */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* YEAR */

document.getElementById("year")
.textContent=
new Date().getFullYear();


/* START */

loadBusinesses();

</script>

</body>
</html>
