<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business | LetsStudy Pro</title>
<meta name="description" content="Discover businesses, products and services on LetsStudy Pro.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,Arial,sans-serif}
a{text-decoration:none;color:inherit}
.top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 6%;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:21px;font-weight:800;color:#155eef}
.top a{font-size:13px;font-weight:600}
.hero{background:#fff}
.cover{height:260px;background:#e9eef7;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.profile{max-width:1100px;margin:auto;padding:0 20px}
.profile-head{display:flex;align-items:end;gap:18px;position:relative;margin-top:-45px}
.logo-img{width:100px;height:100px;background:#fff;border:5px solid #fff;border-radius:18px;object-fit:contain;box-shadow:0 5px 20px #0002}
.name h1{margin:0;font-size:29px}
.name p{margin:4px 0;color:#667085}
.verified{color:#087443;font-size:13px}
.actions{margin-left:auto;display:flex;gap:8px}
button{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:700}
.primary{background:#155eef;color:#fff}
.whatsapp{background:#16a34a;color:#fff}
.light{background:#eef2f6;color:#344054}
.tabs{display:flex;gap:25px;margin-top:25px;border-bottom:1px solid #e5e7eb}
.tabs a{padding:13px 3px;font-size:13px;font-weight:700;color:#667085}
.tabs a.active{color:#155eef;border-bottom:2px solid #155eef}
.container{max-width:1100px;margin:25px auto;padding:0 20px;display:grid;grid-template-columns:1fr 320px;gap:22px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin-bottom:18px}
.card h2{margin:0 0 15px;font-size:18px}
.desc{color:#596579;line-height:1.7;white-space:pre-line}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.badge{padding:6px 9px;background:#eef2f6;border-radius:20px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.info{padding:13px;background:#f8fafc;border-radius:9px}
.info small{display:block;color:#667085;font-size:11px;margin-bottom:3px}
.info strong{font-size:13px}
.list{display:grid;gap:10px}
.item{padding:13px;border:1px solid #eaecf0;border-radius:10px}
.item strong{font-size:14px}
.item p{font-size:12px;color:#667085;margin:5px 0}
.socials{display:flex;gap:9px;flex-wrap:wrap}
.socials a{padding:9px 12px;background:#f2f4f7;border-radius:8px;font-size:13px}
.side{position:sticky;top:20px}
.rating{font-size:25px;font-weight:800}
.stars{color:#f59e0b}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
.loading{text-align:center;padding:80px 20px}
.error{text-align:center;padding:70px 20px}
@media(max-width:800px){
 .profile-head{align-items:flex-start;flex-direction:column}
 .actions{margin-left:0;width:100%}
 .actions button{flex:1}
 .container{grid-template-columns:1fr}
 .side{position:static}
 .grid{grid-template-columns:1fr}
 .cover{height:190px}
}
</style>
</head>

<body>

<header class="top">
  <a href="index.html" class="logo">LetsStudy Pro</a>
  <a href="businesses.html">
    <i class="fa fa-building"></i> Businesses
  </a>
</header>

<div id="app">
  <div class="loading">
    <i class="fa fa-spinner fa-spin"></i>
    <p>Loading business...</p>
  </div>
</div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 doc,
 getDoc,
 updateDoc,
 increment,
 collection,
 getDocs,
 query,
 where
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
 getAuth,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* FIREBASE */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);


/* STATE */

const id=
 new URLSearchParams(location.search)
 .get("businessId") ||
 new URLSearchParams(location.search)
 .get("id");

const appEl=document.getElementById("app");

let business=null;
let user=null;


/* HELPERS */

const esc=v=>String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

const array=v=>{
 if(Array.isArray(v))return v;
 return String(v||"")
 .split(",")
 .map(x=>x.trim())
 .filter(Boolean);
};


/* AUTH */

onAuthStateChanged(auth,u=>{
 user=u;
});


/* LOAD */

async function loadBusiness(){

 if(!id){

   appEl.innerHTML=`
    <div class="error">
      <h2>Business not found</h2>
      <p>Business ID is missing.</p>
    </div>`;
   return;
 }

 try{

   const snap=
     await getDoc(
       doc(db,"businesses",id)
     );

   if(!snap.exists()){

     appEl.innerHTML=`
      <div class="error">
       <h2>Business not found</h2>
       <p>This business may have been removed.</p>
      </div>`;
     return;
   }

   business={
     id:snap.id,
     ...snap.data()
   };

   await updateDoc(
     doc(db,"businesses",id),
     {views:increment(1)}
   ).catch(()=>{});

   render();

 }catch(error){

   console.error(error);

   appEl.innerHTML=`
    <div class="error">
      <h2>Unable to load business</h2>
      <p>Please try again later.</p>
    </div>`;
 }
}


/* RENDER */

async function render(){

 const b=business;

 const cover=
   b.coverImage ||
   "https://via.placeholder.com/1200x400?text=Business";

 const logo=
   b.logo ||
   "https://via.placeholder.com/150?text=Business";

 const services=array(b.services);
 const products=array(b.products);


 appEl.innerHTML=`

 <!-- HERO -->

 <section class="hero">

   <div class="cover">
     <img src="${esc(cover)}" alt="">
   </div>

   <div class="profile">

     <div class="profile-head">

       <img
         class="logo-img"
         src="${esc(logo)}"
         alt="${esc(b.name)}"
       >

       <div class="name">

         <h1>
           ${esc(b.name||"Business")}

           ${
             b.verified
             ? `<span class="verified">
                 <i class="fa fa-check-circle"></i>
                </span>`
             : ""
           }
         </h1>

         <p>
           ${esc(b.category||"Business")}
           ${b.city ? ` · ${esc(b.city)}` : ""}
         </p>

         <div class="badges">

           ${
             b.verified
             ? `<span class="badge">✓ Verified</span>`
             : ""
           }

           ${
             b.featured
             ? `<span class="badge">★ Featured</span>`
             : ""
           }

           ${
             b.businessType
             ? `<span class="badge">
                 ${esc(b.businessType)}
                </span>`
             : ""
           }

         </div>

       </div>

       <div class="actions">

         ${
           b.whatsapp
           ? `<button
               class="whatsapp"
               onclick="contactWhatsApp()">
               <i class="fab fa-whatsapp"></i>
               WhatsApp
              </button>`
           : ""
         }

         ${
           b.website
           ? `<button
               class="primary"
               onclick="openWebsite()">
               <i class="fa fa-globe"></i>
               Website
              </button>`
           : ""
         }

         <button
           class="light"
           onclick="followBusiness()">
           <i class="fa fa-user-plus"></i>
           Follow
         </button>

       </div>

     </div>

     <div class="tabs">
       <a class="active" href="#about">About</a>
       <a href="#services">Services</a>
       <a href="#products">Products</a>
       <a href="#contact">Contact</a>
     </div>

   </div>

 </section>


 <!-- CONTENT -->

 <main class="container">

   <div>

     <!-- ABOUT -->

     <section class="card" id="about">

       <h2>About ${esc(b.name||"Business")}</h2>

       ${
         b.shortDescription
         ? `<p class="desc">
             ${esc(b.shortDescription)}
            </p>`
         : ""
       }

       <p class="desc">
         ${esc(b.description||"No description available.")}
       </p>

       <div class="badges">

         ${
           b.industry
           ? `<span class="badge">
               ${esc(b.industry)}
              </span>`
           : ""
         }

         ${
           b.subcategory
           ? `<span class="badge">
               ${esc(b.subcategory)}
              </span>`
           : ""
         }

         ${
           b.priceRange
           ? `<span class="badge">
               Price ${esc(b.priceRange)}
              </span>`
           : ""
         }

       </div>

     </section>


     <!-- SERVICES -->

     <section class="card" id="services">

       <h2>Services</h2>

       <div class="list">

       ${
         services.length
         ? services.map(x=>`
             <div class="item">
               <strong>
                 <i class="fa fa-briefcase"></i>
                 ${esc(x)}
               </strong>
             </div>
           `).join("")
         : `<p class="desc">No services listed.</p>`
       }

       </div>

     </section>


     <!-- PRODUCTS -->

     <section class="card" id="products">

       <h2>Products</h2>

       <div class="list">

       ${
         products.length
         ? products.map(x=>`
             <div class="item">
               <strong>
                 <i class="fa fa-box"></i>
                 ${esc(x)}
               </strong>
             </div>
           `).join("")
         : `<p class="desc">No products listed.</p>`
       }

       </div>

     </section>


     <!-- LOCATION -->

     <section class="card">

       <h2>Location</h2>

       <div class="grid">

         <div class="info">
           <small>Country</small>
           <strong>${esc(b.country||"-")}</strong>
         </div>

         <div class="info">
           <small>Region</small>
           <strong>${esc(b.region||"-")}</strong>
         </div>

         <div class="info">
           <small>City</small>
           <strong>${esc(b.city||"-")}</strong>
         </div>

         <div class="info">
           <small>Address</small>
           <strong>${esc(b.address||"-")}</strong>
         </div>

       </div>

       ${
         b.latitude && b.longitude
         ? `<br>
            <a
             class="primary"
             style="display:inline-block"
             target="_blank"
             href="https://www.google.com/maps?q=${encodeURIComponent(b.latitude+","+b.longitude)}">
             <i class="fa fa-map-marker-alt"></i>
             View Location
            </a>`
         : ""
       }

     </section>


     <!-- CONTACT -->

     <section class="card" id="contact">

       <h2>Contact</h2>

       <div class="grid">

         <div class="info">
           <small>Email</small>
           <strong>${esc(b.email||"-")}</strong>
         </div>

         <div class="info">
           <small>Phone</small>
           <strong>${esc(b.phone||"-")}</strong>
         </div>

         <div class="info">
           <small>WhatsApp</small>
           <strong>${esc(b.whatsapp||"-")}</strong>
         </div>

         <div class="info">
           <small>Website</small>
           <strong>${esc(b.website||"-")}</strong>
         </div>

       </div>

     </section>


     <!-- SOCIAL -->

     <section class="card">

       <h2>Social Media</h2>

       <div class="socials">

       ${
         typeof b.socialLinks==="object"
         ? Object.entries(b.socialLinks)
             .map(([name,url])=>`
               <a
                 href="${esc(url)}"
                 target="_blank">
                 <i class="fa fa-link"></i>
                 ${esc(name)}
               </a>
             `).join("")
         : `<span class="desc">No social links.</span>`
       }

       </div>

     </section>

   </div>


   <!-- SIDEBAR -->

   <aside class="side">

     <section class="card">

       <h2>Business Rating</h2>

       <div class="rating">
         ${Number(b.rating||0).toFixed(1)}
         <span class="stars">
           ★★★★★
         </span>
       </div>

       <p class="muted">
         ${Number(b.ratingCount||0).toLocaleString()}
         reviews
       </p>

     </section>


     <section class="card">

       <h2>Business Stats</h2>

       <div class="stat">
         <span>Views</span>
         <strong>
           ${Number(b.views||0).toLocaleString()}
         </strong>
       </div>

       <div class="stat">
         <span>Likes</span>
         <strong>
           ${Number(b.likes||0).toLocaleString()}
         </strong>
       </div>

       <div class="stat">
         <span>Followers</span>
         <strong>
           ${Number(b.followersCount||0).toLocaleString()}
         </strong>
       </div>

       <div class="stat">
         <span>Products</span>
         <strong>
           ${Number(b.productsCount||products.length)}
         </strong>
       </div>

       <div class="stat">
         <span>Services</span>
         <strong>
           ${Number(b.servicesCount||services.length)}
         </strong>
       </div>

       <div class="stat">
         <span>Jobs</span>
         <strong>
           ${Number(b.jobsCount||0)}
         </strong>
       </div>

     </section>


     <section class="card">

       <h2>Opening Hours</h2>

       <p class="desc">
         ${esc(
           b.openingHours||
           "Opening hours not provided."
         )}
       </p>

     </section>

   </aside>

 </main>
 `;

}


/* WHATSAPP */

window.contactWhatsApp=()=>{

 if(!business.whatsapp)return;

 const number=
   String(business.whatsapp)
   .replace(/[^\d]/g,"");

 const text=
   `Hello ${business.name}, I found your business on LetsStudy Pro.`;

 window.open(
   `https://wa.me/${number}?text=${encodeURIComponent(text)}`,
   "_blank"
 );

};


/* WEBSITE */

window.openWebsite=()=>{

 if(!business.website)return;

 let url=business.website;

 if(!/^https?:\/\//i.test(url))
   url="https://"+url;

 window.open(url,"_blank");

};


/* FOLLOW */

window.followBusiness=async()=>{

 if(!user){

   location.href=
    "login.html?redirect="+
    encodeURIComponent(location.href);

   return;
 }

 try{

   /*
    Recommended production structure:

    businessFollowers/{userId_businessId}
   */

   alert(
     "Follow system can now be connected to businessFollowers."
   );

 }catch(error){

   console.error(error);

 }

};


/* START */

loadBusiness();

</script>

</body>
</html>
