<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}
body{

 font-family:Arial,sans-serif;
 background:#f5f7fb;

}
header{

 padding:15px 5%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:20
}
.logo{
 font-size:21px;

 color:#2563eb
}
header a{

}
.container{

.hero{

.card{

}
.cover{

}
.cardbody{

}
.logo{

}
.businessLogo{

.badges{

.verified{

.featuredBadge{

}
.status{

.card h3{

.muted{

.meta{

}

}
.actions{

 gap:7px;

}
.btn{

 padding:9px 12px;
 border:0;
 border-radius:8px;
 text-decoration:none;
 cursor:pointer;
 font-weight:600;
 font-size:13px
}
.primary{
 background:#2563eb;
 color:#fff
}
.gray{
 background:#e2e8f0;
 color:#172033
}
.green{

 color:#fff
}
.empty{
 grid-column:1/-1;
 text-align:center;
 padding:50px;

}

/* MODAL */
.modal{

 position:fixed;
 inset:0;
 background:#0008;

 padding:20px;

}
.modalbox{

 margin:20px auto;

}

 border:0;
 width:36px;
 height:36px;

}

}
.text{

}
.tags span{

 padding:6px 9px;
 background:#eef2ff;
 color:#3730a3;
 border-radius:6px;
 margin:3px;
 font-size:12px
}
.contact{
 display:flex;
 flex-wrap:wrap;
 gap:8px;

}

@media(max-width:600px){
 .hero h1{font-size:24px}

  width:100%
 }

</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<div>
<a href="index.html">Home</a>
<a href="career.html">Careers</a>
</div>

</header>


<main class="container">

<section class="hero">

<h1>
Discover Businesses
</h1>

<p>
Find businesses, services and products from different locations.
</p>

<input
id="search"
class="search"
placeholder="Search business, service, product, category..."
>

</section>


<div class="filters">

<select id="category">

<option value="">

</select>

<option value="">

</select>


<select id="country">

<option value="">

</select>


<select id="verified">

<option value="">

</option>

</option>

</select>

id="businesses"

</div>

<!-- DETAILS MODAL -->

<div
class="modal"
id="modal">

<div class="modalbox">

<button
class="close"
onclick="closeModal()">
×
</button>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
increment
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =================================
 FIREBASE
================================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =================================
 VARIABLES
================================= */

let businesses=[];

const container=
document.getElementById("businesses");

const search=
document.getElementById("search");

const category=
document.getElementById("category");

const businessType=
document.getElementById("businessType");

const country=
document.getElementById("country");

const verified=
document.getElementById("verified");


/* =================================
 LOAD BUSINESSES
================================= */

async function loadBusinesses(){

try{

const snap=
await getDocs(
collection(db,"businesses")
);

businesses=[];

snap.forEach(d=>{

const b=d.data();

if(
b.status==="published" ||
b.status==="active"
){

businesses.push({
id:d.id,
...b
});

}

});

setupFilters();

renderBusinesses();

}catch(error){

console.error(error);

container.innerHTML=`

<div class="empty">

<h3>
Unable to load businesses
</h3>

<p>
Please try again later.
</p>

</div>

`;

}

}


/* =================================
 FILTER OPTIONS
================================= */

function setupFilters(){

fillSelect(
category,
"category"
);

fillSelect(
businessType,
"businessType"
);

fillSelect(
country,
"country"
);

}


function fillSelect(select,field){

const values=[

...new Set(

businesses
.map(b=>b[field])
.filter(Boolean)

)

];

values.sort();

values.forEach(value=>{

const option=
document.createElement("option");

option.value=value;

option.textContent=value;

select.appendChild(option);

});

}


/* =================================
 RENDER
================================= */

function renderBusinesses(){

const q=
search.value
.toLowerCase()
.trim();


const list=
businesses.filter(b=>{

const searchable=`

${b.name||""}
${b.description||""}
${b.shortDescription||""}
${b.category||""}
${b.subcategory||""}
${b.businessType||""}
${b.industry||""}
${Array.isArray(b.services)
?b.services.join(" ")
:b.services||""}
${Array.isArray(b.products)
?b.products.join(" ")
:b.products||""}
${b.city||""}
${b.region||""}
${b.country||""}

`.toLowerCase();


const matchSearch=
searchable.includes(q);


const matchCategory=
!category.value ||
b.category===category.value;


const matchType=
!businessType.value ||
b.businessType===businessType.value;


const matchCountry=
!country.value ||
b.country===country.value;


let matchSpecial=true;

if(verified.value==="verified"){

matchSpecial=
b.verified===true;

}

if(verified.value==="featured"){

matchSpecial=
b.featured===true;

}


return(
matchSearch &&
matchCategory &&
matchType &&
matchCountry &&
matchSpecial
);

});


if(!list.length){

container.innerHTML=`

<div class="empty">

<h3>
No businesses found
</h3>

<p>
Try another search or filter.
</p>

</div>

`;

return;

}


/* Featured first */

list.sort(
(a,b)=>
Number(b.featured===true)-
Number(a.featured===true)
);


container.innerHTML=
list.map(b=>{

const services=
Array.isArray(b.services)
?b.services
:String(b.services||"")
.split(",")
.filter(Boolean);


return`

<article
class="card ${b.featured?"featured":""}">


<img
class="cover"
src="${safeURL(b.coverImage)}"
onerror="
this.src='https://via.placeholder.com/800x300'
"
>


<div class="cardbody">


<img
class="businessLogo"
src="${safeURL(b.logo)}"
onerror="
this.src='https://via.placeholder.com/100'
"
>


<div class="badges">


${
b.verified
?

`<span class="badge verified">
✓ VERIFIED
</span>`

:""
}


${
b.featured
?

`<span class="badge featuredBadge">
★ FEATURED
</span>`

:""
}


${
b.businessType
?

`<span class="badge status">
${escapeHTML(b.businessType)}
</span>`

:""
}

</div>


<h3>

${escapeHTML(
b.name||"Unnamed Business"
)}

</h3>


<div class="muted">

${escapeHTML(
b.category||"Business"
)}

${
b.subcategory
?
" · "+escapeHTML(b.subcategory)
:""
}

</div>


<p class="description">

${escapeHTML(
b.shortDescription||
b.description||
""
).substring(0,150)}

${
(
b.shortDescription||
b.description||
""
).length>150
?"..."
:""
}

</p>


<div class="meta">

<span>
📍
${escapeHTML(b.city||"-")}
</span>

<span>
🌍
${escapeHTML(b.country||"-")}
</span>

<span>
👁
${Number(b.views)||0}
</span>

</div>


<div class="rating">

⭐
${Number(b.rating||0).toFixed(1)}

<span
style="color:#94a3b8">

(${Number(b.ratingCount)||0})

</span>

</div>


<div class="meta">

<span>
👥 ${Number(b.followersCount)||0}
followers
</span>

<span>
🛍 ${Number(b.productsCount)||0}
products
</span>

<span>
🧰 ${Number(b.servicesCount)||0}
services
</span>

</div>


<div class="actions">

<button
class="btn gray"
onclick="
viewBusiness('${b.id}')
">

View Details

</button>


${
b.website
?

`<a
class="btn primary"
href="${safeURL(b.website)}"
target="_blank">

Website

</a>`

:""
}


${
b.whatsapp
?

`<a
class="btn green"
href="${whatsappURL(b.whatsapp)}"
target="_blank">

WhatsApp

</a>`

:""
}

</div>


</div>

</article>

`;

}).join("");

}


/* =================================
 VIEW BUSINESS
================================= */

window.viewBusiness=
async function(id){

const b=
businesses.find(x=>x.id===id);

if(!b)return;


/* Increase views */

await updateDoc(

doc(
db,
"businesses",
id
),

{
views:increment(1)
}

).catch(()=>{});


const services=
arrayValue(b.services);

const products=
arrayValue(b.products);


const social=
b.socialLinks || {};


document.getElementById(
"details"
).innerHTML=`

<img
class="detailCover"
src="${safeURL(b.coverImage)}"
onerror="
this.src='https://via.placeholder.com/800x300'
"
>


<img
class="detailLogo"
src="${safeURL(b.logo)}"
onerror="
this.src='https://via.placeholder.com/100'
"
>


<div class="badges">

${
b.verified
?

`<span class="badge verified">
✓ VERIFIED
</span>`

:""
}


${
b.featured
?

`<span class="badge featuredBadge">
★ FEATURED
</span>`

:""
}

</div>


<h1>

${escapeHTML(
b.name||"Business"
)}

</h1>


<p class="muted">

${escapeHTML(b.category||"")}

${
b.subcategory
?
" · "+escapeHTML(b.subcategory)
:""
}

${
b.industry
?
" · "+escapeHTML(b.industry)
:""
}

</p>


<div class="rating">

⭐
${Number(b.rating||0).toFixed(1)}

<span style="color:#94a3b8">

(${Number(b.ratingCount)||0}
reviews)

</span>

</div>


<div class="section">

<h3>
About
</h3>

<div class="text">

${escapeHTML(
b.description||""
)}

</div>

</div>


<div class="section">

<h3>
Location
</h3>

<div class="text">

📍 ${escapeHTML(b.address||"")}

<br>

${escapeHTML(b.city||"")},
${escapeHTML(b.region||"")},
${escapeHTML(b.country||"")}

${
b.latitude &&
b.longitude

?

`

<br><br>

<a
class="btn primary"
target="_blank"
href="https://www.google.com/maps?q=${encodeURIComponent(
b.latitude+","+b.longitude
)}">

Open Map

</a>

`

:""
}

</div>

</div>


<div class="section">

<h3>
Services
</h3>

<div class="tags">

${
services.length

?

services.map(x=>
`<span>
${escapeHTML(x)}
</span>`
).join("")

:"No services listed."

}

</div>

</div>


<div class="section">

<h3>
Products
</h3>

<div class="tags">

${
products.length

?

products.map(x=>
`<span>
${escapeHTML(x)}
</span>`
).join("")

:"No products listed."

}

</div>

</div>


<div class="section">

<h3>
Business Information
</h3>

<div class="text">

Business Type:
${escapeHTML(b.businessType||"-")}

<br>

Industry:
${escapeHTML(b.industry||"-")}

<br>

Price Range:
${escapeHTML(b.priceRange||"-")}

<br>

Currency:
${escapeHTML(b.currency||"-")}

<br>

Followers:
${Number(b.followersCount)||0}

<br>

Products:
${Number(b.productsCount)||0}

<br>

Services:
${Number(b.servicesCount)||0}

<br>

Jobs:
${Number(b.jobsCount)||0}

</div>

</div>


<div class="section">

<h3>
Opening Hours
</h3>

<div class="text">

${formatObject(b.openingHours)}

</div>

</div>


<div class="section">

<h3>
Contact
</h3>


<div class="contact">

${
b.phone
?

`<a
class="btn primary"
href="tel:${encodeURIComponent(b.phone)}">

📞 Call

</a>`

:""
}


${
b.email
?

`<a
class="btn gray"
href="mailto:${encodeURIComponent(b.email)}">

✉ Email

</a>`

:""
}


${
b.whatsapp
?

`<a
class="btn green"
target="_blank"
href="${whatsappURL(b.whatsapp)}">

WhatsApp

</a>`

:""
}


${
b.website
?

`<a
class="btn primary"
target="_blank"
href="${safeURL(b.website)}">

Website

</a>`

:""
}

</div>

</div>


<div class="section">

<h3>
Social Media
</h3>

<div class="contact">

${
social.facebook
?

`<a
class="btn gray"
target="_blank"
href="${safeURL(social.facebook)}">

Facebook

</a>`

:""
}


${
social.instagram
?

`<a
class="btn gray"
target="_blank"
href="${safeURL(social.instagram)}">

Instagram

</a>`

:""
}


${
social.linkedin
?

`<a
class="btn gray"
target="_blank"
href="${safeURL(social.linkedin)}">

LinkedIn

</a>`

:""
}


${
social.tiktok
?

`<a
class="btn gray"
target="_blank"
href="${safeURL(social.tiktok)}">

TikTok

</a>`

:""
}

</div>

</div>

`;


document.getElementById(
"modal"
).style.display="block";

};


/* =================================
 CLOSE
================================= */

window.closeModal=function(){

document.getElementById(
"modal"
).style.display="none";

};


document.getElementById(
"modal"
).addEventListener(
"click",
e=>{

if(
e.target.id==="modal"
){

closeModal();

}

});


/* =================================
 SEARCH EVENTS
================================= */

search.addEventListener(
"input",
renderBusinesses
);

category.addEventListener(
"change",
renderBusinesses
);

businessType.addEventListener(
"change",
renderBusinesses
);

country.addEventListener(
"change",
renderBusinesses
);

verified.addEventListener(
"change",
renderBusinesses
);


/* =================================
 HELPERS
================================= */

function arrayValue(value){

if(Array.isArray(value))
return value;

if(!value)
return [];

return String(value)
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}


function formatObject(obj){

if(!obj)
return "Not provided.";

if(typeof obj==="string")
return escapeHTML(obj);

if(typeof obj!=="object")
return escapeHTML(obj);

return Object.entries(obj)

.map(
([key,value])=>
`${escapeHTML(key)}:
${escapeHTML(value)}`
)

.join("\n");

}


function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function safeURL(url){

if(!url)
return "https://via.placeholder.com/800x300";

try{

const u=new URL(url);

if(
u.protocol==="http:" ||
u.protocol==="https:"
){

return u.href;

}

}catch(e){}

return "https://via.placeholder.com/800x300";

}


function whatsappURL(number){

if(!number)
return "#";

let n=
String(number)
.replace(/\D/g,"");


/*
 Tanzania numbers such as
 0712345678 -> 255712345678
*/

if(
n.startsWith("0")
){

n="255"+n.substring(1);

}

return "https://wa.me/"+n;

}


/* =================================
 START
================================= */

loadBusinesses();

</script>

</body>
</html>
