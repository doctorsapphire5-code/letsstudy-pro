<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Businesses | LetsStudy Pro
  </title>

  <meta
    name="description"
    content="Discover verified businesses, services, products, opportunities and professional organizations on LetsStudy Pro."
  >

  <meta
    name="keywords"
    content="businesses, companies, services, products, entrepreneurs, Tanzania, LetsStudy Pro"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <link
    rel="icon"
    href="favicon.ico"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >


  <style>

    /* =====================================================
       RESET
    ====================================================== */

    * {
      box-sizing:
        border-box;

      margin:
        0;

      padding:
        0;
    }


    :root {

      --primary:
        #2563eb;

      --primary-dark:
        #1d4ed8;

      --dark:
        #111827;

      --text:
        #172033;

      --muted:
        #667085;

      --border:
        #e5e7eb;

      --bg:
        #f5f7fb;

      --white:
        #ffffff;

      --success:
        #16a34a;

      --warning:
        #d97706;

      --danger:
        #dc2626;

      --radius:
        16px;

      --shadow:
        0 10px 35px
        rgba(
          15,
          23,
          42,
          .07
        );

    }


    body {

      font-family:
        "Inter",
        sans-serif;

      background:
        var(--bg);

      color:
        var(--text);

      line-height:
        1.6;

    }


    body.modal-open {

      overflow:
        hidden;

    }


    a {

      text-decoration:
        none;

      color:
        inherit;

    }


    button,
    input,
    select {

      font:
        inherit;

    }


    button {

      cursor:
        pointer;

    }


    /* =====================================================
       NAVBAR
    ====================================================== */

    .navbar {

      position:
        sticky;

      top:
        0;

      z-index:
        1000;

      background:
        rgba(
          255,
          255,
          255,
          .96
        );

      backdrop-filter:
        blur(12px);

      border-bottom:
        1px solid var(--border);

    }


    .nav-container {

      max-width:
        1250px;

      margin:
        auto;

      padding:
        15px 20px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

    }


    .brand {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      font-size:
        20px;

      font-weight:
        800;

      white-space:
        nowrap;

    }


    .brand-icon {

      width:
        40px;

      height:
        40px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        11px;

      background:
        var(--primary);

      color:
        white;

    }


    .nav-links {

      display:
        flex;

      align-items:
        center;

      gap:
        20px;

    }


    .nav-links a {

      font-size:
        13px;

      font-weight:
        700;

      color:
        #4b5563;

    }


    .nav-links a:hover {

      color:
        var(--primary);

    }


    .nav-actions {

      display:
        flex;

      align-items:
        center;

      gap:
        9px;

    }


    .nav-btn {

      border:
        1px solid var(--border);

      background:
        white;

      padding:
        9px 13px;

      border-radius:
        9px;

      font-weight:
        700;

      color:
        #374151;

    }


    .nav-btn.primary {

      border-color:
        var(--primary);

      background:
        var(--primary);

      color:
        white;

    }


    .mobile-menu-btn {

      display:
        none;

      width:
        40px;

      height:
        40px;

      border:
        1px solid var(--border);

      background:
        white;

      border-radius:
        9px;

    }


    /* =====================================================
       HERO
    ====================================================== */

    .hero {

      position:
        relative;

      overflow:
        hidden;

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #1d4ed8
        );

      color:
        white;

      padding:
        70px 20px 85px;

    }


    .hero::before {

      content:
        "";

      position:
        absolute;

      width:
        320px;

      height:
        320px;

      border-radius:
        50%;

      background:
        rgba(
          255,
          255,
          255,
          .06
        );

      top:
        -150px;

      right:
        5%;

    }


    .hero-container {

      position:
        relative;

      max-width:
        1100px;

      margin:
        auto;

      text-align:
        center;

    }


    .hero-badge {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        8px;

      padding:
        7px 12px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          .18
        );

      background:
        rgba(
          255,
          255,
          255,
          .08
        );

      border-radius:
        999px;

      font-size:
        12px;

      font-weight:
        800;

      margin-bottom:
        18px;

    }


    .hero h1 {

      font-size:
        clamp(
          32px,
          5vw,
          52px
        );

      line-height:
        1.1;

      margin-bottom:
        16px;

      font-weight:
        800;

    }


    .hero p {

      max-width:
        700px;

      margin:
        0 auto 28px;

      color:
        rgba(
          255,
          255,
          255,
          .82
        );

      font-size:
        15px;

    }


    .hero-search {

      max-width:
        850px;

      margin:
        auto;

      background:
        white;

      border-radius:
        14px;

      padding:
        7px;

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      box-shadow:
        0 20px 50px
        rgba(
          0,
          0,
          0,
          .18
        );

    }


    .hero-search i {

      color:
        #64748b;

      margin-left:
        12px;

    }


    .hero-search input {

      flex:
        1;

      border:
        0;

      outline:
        0;

      padding:
        13px 8px;

      color:
        var(--text);

      min-width:
        0;

    }


    .hero-search button {

      border:
        0;

      background:
        var(--primary);

      color:
        white;

      padding:
        12px 20px;

      border-radius:
        9px;

      font-weight:
        800;

    }


    /* =====================================================
       MAIN
    ====================================================== */

    .container {

      max-width:
        1250px;

      margin:
        auto;

      padding:
        35px 20px 70px;

    }


    /* =====================================================
       STATS
    ====================================================== */

    .stats-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          4,
          1fr
        );

      gap:
        15px;

      margin-top:
        -45px;

      position:
        relative;

      z-index:
        5;

    }


    .stat-card {

      background:
        white;

      border:
        1px solid var(--border);

      border-radius:
        15px;

      padding:
        20px;

      box-shadow:
        var(--shadow);

    }


    .stat-card-top {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin-bottom:
        10px;

    }


    .stat-icon {

      width:
        40px;

      height:
        40px;

      border-radius:
        11px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        #eff6ff;

      color:
        var(--primary);

    }


    .stat-card strong {

      display:
        block;

      font-size:
        25px;

    }


    .stat-card span {

      color:
        var(--muted);

      font-size:
        12px;

    }


    /* =====================================================
       SECTION HEADER
    ====================================================== */

    .section-header {

      display:
        flex;

      align-items:
        flex-end;

      justify-content:
        space-between;

      gap:
        20px;

      margin:
        45px 0 20px;

    }


    .section-header h2 {

      font-size:
        24px;

      margin-bottom:
        4px;

    }


    .section-header p {

      color:
        var(--muted);

      font-size:
        13px;

    }


    /* =====================================================
       FILTERS
    ====================================================== */

    .filters {

      background:
        white;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      padding:
        17px;

      display:
        grid;

      grid-template-columns:
        1.5fr
        1fr
        1fr
        1fr
        auto;

      gap:
        10px;

      box-shadow:
        var(--shadow);

    }


    .filter-field {

      position:
        relative;

    }


    .filter-field i {

      position:
        absolute;

      left:
        12px;

      top:
        50%;

      transform:
        translateY(-50%);

      color:
        #94a3b8;

      pointer-events:
        none;

    }


    .filter-field input,
    .filter-field select {

      width:
        100%;

      border:
        1px solid var(--border);

      border-radius:
        10px;

      padding:
        11px 12px 11px 36px;

      outline:
        0;

      background:
        white;

      color:
        var(--text);

    }


    .filter-field select {

      padding-left:
        36px;

    }


    .reset-btn {

      border:
        1px solid var(--border);

      background:
        white;

      border-radius:
        10px;

      padding:
        0 14px;

      font-weight:
        700;

      color:
        #475569;

    }


    .filter-checks {

      display:
        flex;

      align-items:
        center;

      gap:
        12px;

      margin-top:
        12px;

    }


    .check-label {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        6px;

      font-size:
        12px;

      font-weight:
        700;

      color:
        #475569;

    }


    /* =====================================================
       BUSINESS GRID
    ====================================================== */

    .business-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          3,
          1fr
        );

      gap:
        20px;

    }


    .business-card {

      background:
        white;

      border:
        1px solid var(--border);

      border-radius:
        17px;

      overflow:
        hidden;

      box-shadow:
        var(--shadow);

      transition:
        transform .2s ease,
        box-shadow .2s ease;

    }


    .business-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 18px 45px
        rgba(
          15,
          23,
          42,
          .11
        );

    }


    .business-cover {

      height:
        125px;

      background:
        linear-gradient(
          135deg,
          #dbeafe,
          #bfdbfe
        );

      background-size:
        cover;

      background-position:
        center;

      position:
        relative;

    }


    .featured-badge {

      position:
        absolute;

      top:
        12px;

      left:
        12px;

      background:
        #111827;

      color:
        white;

      padding:
        5px 9px;

      border-radius:
        999px;

      font-size:
        10px;

      font-weight:
        800;

    }


    .verified-badge {

      position:
        absolute;

      top:
        12px;

      right:
        12px;

      width:
        29px;

      height:
        29px;

      border-radius:
        50%;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        #2563eb;

      color:
        white;

      font-size:
        12px;

    }


    .business-logo {

      position:
        absolute;

      bottom:
        -28px;

      left:
        18px;

      width:
        62px;

      height:
        62px;

      border:
        4px solid white;

      border-radius:
        15px;

      background:
        white;

      object-fit:
        cover;

      box-shadow:
        0 5px 15px
        rgba(
          0,
          0,
          0,
          .1
        );

    }


    .logo-placeholder {

      position:
        absolute;

      bottom:
        -28px;

      left:
        18px;

      width:
        62px;

      height:
        62px;

      border:
        4px solid white;

      border-radius:
        15px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        #eff6ff;

      color:
        var(--primary);

      font-size:
        23px;

    }


    .business-body {

      padding:
        42px 18px 18px;

    }


    .business-name-row {

      display:
        flex;

      align-items:
        flex-start;

      justify-content:
        space-between;

      gap:
        10px;

    }


    .business-name {

      font-size:
        17px;

      font-weight:
        800;

      line-height:
        1.3;

    }


    .business-category {

      color:
        var(--primary);

      font-size:
        11px;

      font-weight:
        800;

      margin-top:
        4px;

    }


    .business-description {

      color:
        var(--muted);

      font-size:
        12px;

      margin:
        12px 0;

      display:
        -webkit-box;

      -webkit-line-clamp:
        2;

      -webkit-box-orient:
        vertical;

      overflow:
        hidden;

    }


    .business-meta {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        7px;

      margin-bottom:
        15px;

    }


    .meta-item {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        5px;

      padding:
        5px 8px;

      background:
        #f8fafc;

      border-radius:
        7px;

      color:
        #64748b;

      font-size:
        10px;

      font-weight:
        600;

    }


    .business-footer {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      border-top:
        1px solid #eef0f3;

      padding-top:
        14px;

    }


    .rating {

      display:
        flex;

      align-items:
        center;

      gap:
        5px;

      font-size:
        12px;

      font-weight:
        800;

    }


    .rating i {

      color:
        #f59e0b;

    }


    .view-btn {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        7px;

      border:
        0;

      background:
        var(--primary);

      color:
        white;

      padding:
        9px 12px;

      border-radius:
        8px;

      font-size:
        11px;

      font-weight:
        800;

    }


    /* =====================================================
       EMPTY / LOADING
    ====================================================== */

    .state {

      background:
        white;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      padding:
        60px 20px;

      text-align:
        center;

      grid-column:
        1 / -1;

    }


    .state i {

      font-size:
        34px;

      color:
        var(--primary);

      margin-bottom:
        15px;

    }


    .state h3 {

      margin-bottom:
        6px;

    }


    .state p {

      color:
        var(--muted);

      font-size:
        13px;

    }


    /* =====================================================
       PAGINATION
    ====================================================== */

    .pagination {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        7px;

      margin-top:
        28px;

    }


    .page-btn {

      min-width:
        38px;

      height:
        38px;

      padding:
        0 10px;

      border:
        1px solid var(--border);

      background:
        white;

      border-radius:
        8px;

      font-weight:
        700;

      color:
        #475569;

    }


    .page-btn.active {

      background:
        var(--primary);

      color:
        white;

      border-color:
        var(--primary);

    }


    .page-btn:disabled {

      opacity:
        .45;

      cursor:
        not-allowed;

    }


    /* =====================================================
       MODAL
    ====================================================== */

    .modal {

      position:
        fixed;

      inset:
        0;

      background:
        rgba(
          15,
          23,
          42,
          .65
        );

      display:
        none;

      align-items:
        center;

      justify-content:
        center;

      padding:
        20px;

      z-index:
        3000;

      backdrop-filter:
        blur(5px);

    }


    .modal.show {

      display:
        flex;

    }


    .modal-content {

      width:
        min(
          100%,
          800px
        );

      max-height:
        90vh;

      overflow:
        auto;

      background:
        white;

      border-radius:
        20px;

      box-shadow:
        0 30px 80px
        rgba(
          0,
          0,
          0,
          .25
        );

    }


    .modal-cover {

      height:
        190px;

      background:
        #dbeafe;

      background-size:
        cover;

      background-position:
        center;

      position:
        relative;

    }


    .modal-close {

      position:
        absolute;

      top:
        13px;

      right:
        13px;

      width:
        38px;

      height:
        38px;

      border:
        0;

      border-radius:
        50%;

      background:
        rgba(
          0,
          0,
          0,
          .5
        );

      color:
        white;

      font-size:
        17px;

    }


    .modal-body {

      padding:
        25px;

    }


    .modal-title-row {

      display:
        flex;

      justify-content:
        space-between;

      gap:
        15px;

      align-items:
        flex-start;

      margin-bottom:
        15px;

    }


    .modal-title {

      font-size:
        25px;

      font-weight:
        800;

    }


    .modal-category {

      color:
        var(--primary);

      font-size:
        12px;

      font-weight:
        800;

    }


    .modal-description {

      color:
        #596579;

      font-size:
        14px;

      white-space:
        pre-line;

      margin-bottom:
        20px;

    }


    .detail-grid {

      display:
        grid;

      grid-template-columns:
  repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
}

/* =========================
   BUSINESS CARD
========================= */

.business-card {
  background: var(--card-bg, #fff);
  border: 1px solid var(--border, #e5e7eb);
  border-radius: 18px;
  overflow: hidden;
  transition: .25s ease;
  box-shadow: 0 8px 25px rgba(0,0,0,.06);
}

.business-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 16px 35px rgba(0,0,0,.10);
}

.business-cover {
  height: 150px;
  position: relative;
  background: #f1f5f9;
  overflow: hidden;
}

.business-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.business-logo {
  width: 76px;
  height: 76px;
  border-radius: 16px;
  background: #fff;
  border: 4px solid #fff;
  position: absolute;
  bottom: -28px;
  left: 20px;
  object-fit: cover;
  box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

.business-content {
  padding: 42px 20px 20px;
}

.business-title {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 6px;
}

.business-title h3 {
  margin: 0;
  font-size: 18px;
  color: var(--text, #111827);
}

.verified-badge {
  color: #2563eb;
  font-size: 15px;
}

.business-category {
  color: #64748b;
  font-size: 13px;
  margin-bottom: 12px;
}

.business-description {
  color: #64748b;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 16px;
}

.business-location {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #64748b;
  font-size: 13px;
  margin-bottom: 15px;
}

.business-stats {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  padding: 13px 0;
  border-top: 1px solid var(--border, #e5e7eb);
  border-bottom: 1px solid var(--border, #e5e7eb);
  margin-bottom: 15px;
}

.business-stat {
  font-size: 12px;
  color: #64748b;
}

.business-stat strong {
  display: block;
  color: #111827;
  font-size: 14px;
  margin-bottom: 2px;
}

.business-actions {
  display: flex;
  gap: 9px;
}

.business-actions a,
.business-actions button {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 11px 13px;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  font-weight: 600;
  font-size: 13px;
}

.btn-view {
  background: #2563eb;
  color: #fff;
}

.btn-contact {
  background: #f1f5f9;
  color: #334155;
}

/* =========================
   EMPTY / ERROR STATES
========================= */

.empty-state,
.error-state,
.login-required {
  text-align: center;
  padding: 55px 20px;
  background: #fff;
  border: 1px dashed #cbd5e1;
  border-radius: 18px;
}

.empty-state i,
.error-state i,

};

const app =

/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) return "";

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatNumber(value) {

  return Number(value || 0)
    .toLocaleString();

}


function getImage(url, fallback) {

  return url ||
    fallback ||
    "https://via.placeholder.com/900x500?text=Business";

}


/* =====================================================
   LOAD BUSINESSES
===================================================== */

async function loadBusinesses() {

  try {

    grid.innerHTML = `
      <div class="loading-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>Loading businesses...</p>
      </div>
    `;

    const q = query(
      collection(db, "businesses"),
      where("status", "==", "published")
    );

    const snapshot =
      await getDocs(q);

    businesses = [];

    snapshot.forEach(doc => {

      businesses.push({

        id: doc.id,

        ...doc.data()

      });

    });


    filteredBusinesses =
      [...businesses];


    renderBusinesses();

    renderFeatured();


  } catch(error) {

    console.error(
      "Business loading error:",
      error
    );

    grid.innerHTML = `
      <div class="error-state">

        <i class="fa-solid fa-triangle-exclamation"></i>

        <h3>
          Unable to load businesses
        </h3>

        <p>
          Please check your connection
          and try again.
        </p>

        <button
          class="btn-primary"
          id="retryBusinesses"
        >
          Try Again
        </button>

      </div>
    `;

    document
      .getElementById("retryBusinesses")
      ?.addEventListener(
        "click",
        loadBusinesses
      );

  }

}


/* =====================================================
   FILTER
===================================================== */

function filterBusinesses() {

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const category =
    categoryFilter.value;


  filteredBusinesses =
    businesses.filter(business => {

      const searchable = [

        business.name,
        business.description,
        business.shortDescription,
        business.category,
        business.subcategory,
        business.industry,
        ...(business.services || []),
        ...(business.products || []),
        ...(business.tags || [])

      ]
      .flat()
      .join(" ")
      .toLowerCase();


      const matchesSearch =
        !search ||
        searchable.includes(search);


      const matchesCategory =
        category === "all" ||
        String(
          business.category || ""
        ).toLowerCase() ===
        category.toLowerCase();


      return (
        matchesSearch &&
        matchesCategory
      );

    });


  renderBusinesses();

}

/* =====================================================
   RENDER BUSINESSES
===================================================== */

function renderBusinesses() {

  businessCount.textContent =
    `${filteredBusinesses.length} businesses`;


  if (!filteredBusinesses.length) {

    grid.innerHTML = `

      <div class="empty-state">

        <i class="fa-solid fa-building"></i>

        <h3>
          No businesses found
        </h3>

        <p>
          Try another search term
          or category.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filteredBusinesses
      .map(businessCard)
      .join("");


  attachCardEvents();

}


/* =====================================================
   FEATURED BUSINESSES
===================================================== */

function renderFeatured() {

  const featured =
    businesses
      .filter(
        business =>
          business.featured === true
      )
      .slice(0, 6);


  if (!featured.length) {

    featuredGrid.innerHTML = `

      <div class="empty-state">

        <i class="fa-solid fa-star"></i>

        <h3>
          No featured businesses yet
        </h3>

        <p>
          Featured businesses will
          appear here.
        </p>

      </div>

    `;

    return;

  }


  featuredGrid.innerHTML =
    featured
      .map(businessCard)
      .join("");


  attachCardEvents();

}


/* =====================================================
   CARD EVENTS
===================================================== */

function attachCardEvents() {

  document
    .querySelectorAll(
      "[data-view-business]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const business =
            businesses.find(
              item =>
                item.id ===
                button.dataset.viewBusiness
            );

          if (business) {

            openBusiness(
              business
            );

          }

        }
      );

    });


  document
    .querySelectorAll(
      "[data-contact-business]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const business =
            businesses.find(
              item =>
                item.id ===
                button.dataset.contactBusiness
            );

          if (business) {

            contactBusiness(
              business
            );

          }

        }
      );

    });

}

            >
              <i class="fa-solid fa-globe"></i>
              Website
            </a>
          `
          : ""
      }

    </div>


    <!-- SOCIAL LINKS -->
    ${
      business.socialLinks &&
      typeof business.socialLinks === "object"
        ? `

          <div
            style="
              display:flex;
              gap:10px;
              flex-wrap:wrap;
              margin-top:20px;
            "
          >

            ${
              business.socialLinks.facebook
                ? `
                  <a
                    href="${escapeHTML(
                      business.socialLinks.facebook
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn-contact"
                  >
                    <i class="fa-brands fa-facebook"></i>
                    Facebook
                  </a>
                `
                : ""
            }

            ${
              business.socialLinks.instagram
                ? `
                  <a
                    href="${escapeHTML(
                      business.socialLinks.instagram
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn-contact"
                  >
                    <i class="fa-brands fa-instagram"></i>
                    Instagram
                  </a>
                `
                : ""
            }

            ${
              business.socialLinks.linkedin
                ? `
                  <a
                    href="${escapeHTML(
                      business.socialLinks.linkedin
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn-contact"
                  >
                    <i class="fa-brands fa-linkedin"></i>
                    LinkedIn
                  </a>
                `
                : ""
            }

          </div>

        `
        : ""
    }

  `;


  modal.classList.add(
    "active"
  );

  document.body.style.overflow =
    "hidden";

}


/* =====================================================
   CLOSE BUSINESS MODAL
===================================================== */

function closeBusinessModal() {

  modal.classList.remove(
    "active"
  );

  document.body.style.overflow =
    "";

}


closeModal.addEventListener(
  "click",
  closeBusinessModal
);


modal.addEventListener(
  "click",
  event => {

    if (
      event.target === modal
    ) {

      closeBusinessModal();

    }

  }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      modal.classList.contains("active")
    ) {

      closeBusinessModal();

    }

  }
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  filterBusinesses
);


/* =====================================================
   CATEGORY FILTER
===================================================== */

categoryFilter.addEventListener(
  "change",
  filterBusinesses
);


/* =====================================================
   INITIALIZE BUSINESS PAGE
===================================================== */

loadBusinesses();


/* =====================================================
   END BUSINESS DATA SYSTEM
===================================================== */

</script>

</body>

</html>
