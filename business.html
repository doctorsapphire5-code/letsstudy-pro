<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Businesses | LetsStudy Pro</title>

<meta name="description"
content="Discover businesses, services and products on LetsStudy Pro.">

<link rel="icon" href="/favicon.ico">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.header-btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 16px;
  border-radius:9px;
  cursor:pointer;
}

.hero{
  padding:48px 6%;
  background:linear-gradient(135deg,#eff6ff,#fff);
}

.hero h1{
  font-size:36px;
  margin-bottom:10px;
}

.hero p{
  color:#64748b;
  max-width:720px;
  line-height:1.6;
}

.container{
  width:88%;
  max-width:1250px;
  margin:30px auto;
}

.filters{
  background:#fff;
  padding:18px;
  border-radius:15px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:12px;
  margin-bottom:25px;
  box-shadow:0 5px 20px #0000000a;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #dce1e8;
  border-radius:9px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus{
  border-color:#2563eb;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 20px #0000000b;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
}

.cover{
  height:135px;
  background:#e5e7eb;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.logo-wrap{
  margin:-38px 18px 0;
  position:relative;
}

.business-logo{
  width:76px;
  height:76px;
  border-radius:50%;
  object-fit:cover;
  background:#fff;
  border:4px solid #fff;
}

.content{
  padding:10px 18px 20px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:7px 0;
}

.badge{
  font-size:11px;
  padding:5px 8px;
  border-radius:20px;
  background:#eef2ff;
  color:#4338ca;
}

.badge.verified{
  background:#dcfce7;
  color:#15803d;
}

.badge.featured{
  background:#fef3c7;
  color:#b45309;
}

.title{
  font-size:19px;
  font-weight:750;
  margin:7px 0;
}

.muted{
  color:#64748b;
  font-size:13px;
  line-height:1.5;
  margin:5px 0;
}

.rating{
  color:#f59e0b;
  margin-top:9px;
}

.rating span{
  color:#64748b;
  margin-left:5px;
  font-size:13px;
}

.card-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:15px;
}

.view-btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#64748b;
}

.empty i{
  font-size:42px;
  margin-bottom:15px;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:750px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#eee;
  cursor:pointer;
}

.detail-cover{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:12px;
}

.detail-logo{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #fff;
  margin:-45px 0 0 20px;
  position:relative;
  background:#fff;
}

.detail-title{
  font-size:27px;
  font-weight:800;
  margin-top:8px;
}

.detail-section{
  margin-top:22px;
}

.detail-section h3{
  margin-bottom:8px;
}

.detail-section p{
  color:#475569;
  line-height:1.7;
  white-space:pre-wrap;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:24px;
}

.action{
  border:0;
  padding:11px 15px;
  border-radius:9px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:7px;
}

.action.whatsapp{
  background:#16a34a;
}

.action.email{
  background:#475569;
}

.action.phone{
  background:#7c3aed;
}

@media(max-width:850px){
  .filters{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){
  .filters{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:29px;
  }

  .container{
    width:92%;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="header-btn"
    onclick="location.href='index.html'"
  >
    <i class="fa-solid fa-house"></i>
    Home
  </button>

</header>


<section class="hero">

  <h1>Discover Businesses</h1>

  <p>
    Discover businesses, services and products
    available through the LetsStudy Pro ecosystem.
  </p>

</section>


<main class="container">

  <div class="filters">

    <input
      id="search"
      type="search"
      placeholder="Search businesses..."
    >

    <select id="category">
      <option value="">All Categories</option>
    </select>

    <select id="country">
      <option value="">All Countries</option>
    </select>

    <select id="sort">

      <option value="newest">
        Newest
      </option>

      <option value="featured">
        Featured
      </option>

      <option value="rating">
        Top Rated
      </option>

      <option value="views">
        Most Viewed
      </option>

    </select>

  </div>


  <div
    id="businessGrid"
    class="grid"
  >

    <div class="empty">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>
        Loading businesses...
      </p>

    </div>

  </div>

</main>


<!-- DETAIL MODAL -->

<div
  id="modal"
  class="modal"
  onclick="closeOutside(event)"
>

  <div
    id="modalContent"
    class="modal-box"
  ></div>

</div>


<script>

/* =====================================================
   PUBLIC API
   ===================================================== */

const API_URL =
  "/api/data?collection=businesses&limit=100";


let businesses = [];


/* =====================================================
   DOM
   ===================================================== */

const grid =
  document.getElementById("businessGrid");

const search =
  document.getElementById("search");

const category =
  document.getElementById("category");

const country =
  document.getElementById("country");

const sort =
  document.getElementById("sort");


/* =====================================================
   LOAD
   ===================================================== */

async function loadBusinesses(){

  try{

    const response =
      await fetch(API_URL, {
        headers:{
          "Accept":"application/json"
        }
      });


    if(!response.ok){

      throw new Error(
        "API error " +
        response.status
      );

    }


    const json =
      await response.json();


    if(!json.success){

      throw new Error(
        json.error ||
        "API returned an error"
      );

    }


    businesses =
      Array.isArray(json.results)
      ? json.results
      : [];


    buildFilters();

    render();


    openBusinessFromURL();


  }catch(error){

    console.error(
      "BUSINESSES API ERROR:",
      error
    );


    grid.innerHTML = `

      <div class="empty">

        <i class="
          fa-solid
          fa-triangle-exclamation
        "></i>

        <h3>
          Unable to load businesses
        </h3>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


/* =====================================================
   FILTER OPTIONS
   ===================================================== */

function buildFilters(){

  const categories =
    [
      ...new Set(
        businesses
          .map(b => b.category)
          .filter(Boolean)
      )
    ].sort();


  const countries =
    [
      ...new Set(
        businesses
          .map(b => b.country)
          .filter(Boolean)
      )
    ].sort();


  category.innerHTML =
    `<option value="">
      All Categories
    </option>`;


  categories.forEach(value => {

    category.innerHTML += `

      <option value="${escapeAttr(value)}">
        ${escapeHTML(value)}
      </option>

    `;

  });


  country.innerHTML =
    `<option value="">
      All Countries
    </option>`;


  countries.forEach(value => {

    country.innerHTML += `

      <option value="${escapeAttr(value)}">
        ${escapeHTML(value)}
      </option>

    `;

  });

}


/* =====================================================
   RENDER
   ===================================================== */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  let result =
    businesses.filter(business => {

      const text = [

        business.name,
        business.description,
        business.shortDescription,
        business.category,
        business.subcategory,
        business.industry,
        business.services,
        business.products,
        business.city,
        business.region,
        business.country

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      return (

        text.includes(keyword) &&

        (
          !category.value ||
          business.category === category.value
        ) &&

        (
          !country.value ||
          business.country === country.value
        )

      );

    });


  /* SORT */

  if(sort.value === "featured"){

    result.sort(
      (a,b) =>
        Number(b.featured === true) -
        Number(a.featured === true)
    );

  }


  if(sort.value === "rating"){

    result.sort(
      (a,b) =>
        Number(b.rating || 0) -
        Number(a.rating || 0)
    );

  }


  if(sort.value === "views"){

    result.sort(
      (a,b) =>
        Number(b.views || 0) -
        Number(a.views || 0)
    );

  }


  if(sort.value === "newest"){

    result.sort(
      (a,b) =>
        getTime(b.createdAt) -
        getTime(a.createdAt)
    );

  }


  if(!result.length){

    grid.innerHTML = `

      <div class="empty">

        <i class="
          fa-solid
          fa-store
        "></i>

        <h3>
          No businesses found
        </h3>

        <p>
          Try another search or filter.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    result
      .map(createCard)
      .join("");

}


/* =====================================================
   CARD
   ===================================================== */

function createCard(business){

  const id =
    business.id ||
    business.documentId;


  const rating =
    Number(
      business.rating || 0
    );


  const location = [

    business.city,
    business.region,
    business.country

  ]
  .filter(Boolean)
  .join(", ");


  return `

    <article class="card">

      <div class="cover">

        <img
          src="${safeImage(
            business.coverImage
          )}"
          alt=""
          loading="lazy"
          onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22800%22 height=%22300%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23e5e7eb%22/%3E%3C/svg%3E'"
        >

      </div>


      <div class="logo-wrap">

        <img
          class="business-logo"
          src="${safeImage(
            business.logo
          )}"
          alt="${escapeAttr(
            business.name || "Business"
          )}"
          loading="lazy"
          onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23e5e7eb%22/%3E%3C/svg%3E'"
        >

      </div>


      <div class="content">

        <div class="badges">

          ${
            business.verified === true
            ? `
              <span class="badge verified">
                <i class="fa-solid fa-circle-check"></i>
                Verified
              </span>
            `
            : ""
          }


          ${
            business.featured === true
            ? `
              <span class="badge featured">
                <i class="fa-solid fa-star"></i>
                Featured
              </span>
            `
            : ""
          }

        </div>


        <div class="title">

          ${escapeHTML(
            business.name ||
            "Unnamed Business"
          )}

        </div>


        <div class="muted">

          <i class="fa-solid fa-location-dot"></i>

          ${escapeHTML(
            location ||
            "Location not specified"
          )}

        </div>


        <div class="muted">

          ${escapeHTML(
            business.category ||
            "Business"
          )}

          ${
            business.industry
            ? `
              •
              ${escapeHTML(
                business.industry
              )}
            `
            : ""
          }

        </div>


        <div class="rating">

          ${stars(rating)}

          <span>

            ${rating.toFixed(1)}

            (${Number(
              business.ratingCount || 0
            )})

          </span>

        </div>


        <div class="card-footer">

          <span class="muted">

            <i class="fa-solid fa-eye"></i>

            ${Number(
              business.views || 0
            ).toLocaleString()}

          </span>


          <button
            class="view-btn"
            onclick="openBusiness('${escapeAttr(id)}')"
          >

            View Business

            <i class="fa-solid fa-arrow-right"></i>

          </button>

        </div>

      </div>

    </article>

  `;

}


/* =====================================================
   DETAILS
   ===================================================== */

window.openBusiness =
function(id){

  const business =
    businesses.find(
      b =>
        String(
          b.id ||
          b.documentId
        ) === String(id)
    );


  if(!business){

    return;

  }


  const phone =
    business.phone || "";


  const whatsapp =
    business.whatsapp ||
    phone;


  const whatsappNumber =
    String(whatsapp)
      .replace(/[^0-9]/g,"");


  const website =
    safeURL(
      business.website
    );


  const email =
    business.email || "";


  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <div class="modal-head">

      <h2>
        Business Details
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>


    <img
      class="detail-cover"
      src="${safeImage(
        business.coverImage
      )}"
      alt=""
      onerror="this.style.display='none'"
    >


    <img
      class="detail-logo"
      src="${safeImage(
        business.logo
      )}"
      alt=""
      onerror="this.style.display='none'"
    >


    <div class="detail-title">

      ${escapeHTML(
        business.name ||
        "Business"
      )}

    </div>


    <div class="badges">

      ${
        business.verified === true
        ? `
          <span class="badge verified">
            <i class="fa-solid fa-circle-check"></i>
            Verified
          </span>
        `
        : ""
      }


      ${
        business.featured === true
        ? `
          <span class="badge featured">
            <i class="fa-solid fa-star"></i>
            Featured
          </span>
        `
        : ""
      }

    </div>


    <div class="muted">

      <i class="fa-solid fa-location-dot"></i>

      ${escapeHTML(
        [
          business.address,
          business.city,
          business.region,
          business.country
        ]
        .filter(Boolean)
        .join(", ") ||
        "Location not specified"
      )}

    </div>


    ${
      business.rating
      ? `
        <div class="rating">

          ${stars(
            Number(business.rating)
          )}

          <span>
            ${Number(
              business.rating
            ).toFixed(1)}
          </span>

        </div>
      `
      : ""
    }


    <div class="detail-section">

      <h3>
        About
      </h3>

      <p>
        ${escapeHTML(
          business.description ||
          business.shortDescription ||
          "No description available."
        )}
      </p>

    </div>


    ${
      business.services
      ? `
        <div class="detail-section">

          <h3>
            Services
          </h3>

          <p>
            ${formatList(
              business.services
            )}
          </p>

        </div>
      `
      : ""
    }


    ${
      business.products
      ? `
        <div class="detail-section">

          <h3>
            Products
          </h3>

          <p>
            ${formatList(
              business.products
            )}
          </p>

        </div>
      `
      : ""
    }


    <div class="detail-section">

      <h3>
        Business Information
      </h3>

      <p>

        <strong>Category:</strong>
        ${escapeHTML(
          business.category || "-"
        )}

        <br>

        <strong>Industry:</strong>
        ${escapeHTML(
          business.industry || "-"
        )}

        <br>

        <strong>Business Type:</strong>
        ${escapeHTML(
          business.businessType || "-"
        )}

        <br>

        <strong>Price Range:</strong>
        ${escapeHTML(
          business.priceRange || "-"
        )}
        ${escapeHTML(
          business.currency || ""
        )}

      </p>

    </div>


    <div class="actions">

      ${
        website !== "#"
        ? `
          <a
            class="action"
            href="${website}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fa-solid fa-globe"></i>
            Website
          </a>
        `
        : ""
      }


      ${
        whatsappNumber
        ? `
          <a
            class="action whatsapp"
            href="https://wa.me/${escapeAttr(
              whatsappNumber
            )}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fa-brands fa-whatsapp"></i>
            WhatsApp
          </a>
        `
        : ""
      }


      ${
        email
        ? `
          <a
            class="action email"
            href="mailto:${escapeAttr(
              email
            )}"
          >
            <i class="fa-solid fa-envelope"></i>
            Email
          </a>
        `
        : ""
      }


      ${
        phone
        ? `
          <a
            class="action phone"
            href="tel:${escapeAttr(
              phone
            )}"
          >
            <i class="fa-solid fa-phone"></i>
            Call
          </a>
        `
        : ""
      }

    </div>

  `;


  document
    .getElementById("modal")
    .classList.add("show");


  history.replaceState(
    null,
    "",
    "business.html?id=" +
    encodeURIComponent(id)
  );

};


/* =====================================================
   URL DETAIL
   ===================================================== */

function openBusinessFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id") ||
    params.get("businessId") ||
    params.get("documentId");


  if(id){

    openBusiness(id);

  }

}


/* ================================
   LOAD BUSINESS FROM API
================================ */

async function loadBusinessFromAPI(id){

  try{

    const response = await fetch(
      `/api/data?collection=businesses&id=${encodeURIComponent(id)}`
    );

    if(!response.ok){
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const result =
      await response.json();

    if(
      !result.success ||
      !result.data
    ){

      throw new Error(
        "Business not found"
      );

    }

    const data = result.data;

    /*
      Replace local Firebase data
      with API data.
    */

    const index =
      businesses.findIndex(
        business =>
          business.id === id ||
          business.documentId === id
      );

    if(index >= 0){

      businesses[index] = {
        ...businesses[index],
        ...data,
        id: data.id || id,
        documentId:
          data.documentId || id
      };

    }else{

      businesses.push({
        ...data,
        id: data.id || id,
        documentId:
          data.documentId || id
      });

    }

    openBusiness(
      data.id || id
    );

  }catch(error){

    console.error(
      "BUSINESS API ERROR:",
      error
    );

    document.getElementById(
      "modalContent"
    ).innerHTML = `

      <div class="modal-head">

        <h2>
          Business
        </h2>

        <button
          class="close"
          onclick="closeModal()"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>

      <div class="empty">

        <i
          class="
            fa-solid
            fa-triangle-exclamation
          "
          style="font-size:40px"
        ></i>

        <h3>
          Unable to load business
        </h3>

        <p>
          Please try again later.
        </p>

      </div>

    `;

    document
      .getElementById("modal")
      .classList.add("show");

  }

}


/* ================================
   API URL HELPER
================================ */

function apiURL(
  collectionName,
  id = null
){

  let url =
    `/api/data?collection=${encodeURIComponent(
      collectionName
    )}`;

  if(id){

    url +=
      `&id=${encodeURIComponent(id)}`;

  }

  return url;

}


/* ================================
   SAFE API FETCH
================================ */

async function apiFetch(
  collectionName,
  id = null
){

  const response =
    await fetch(
      apiURL(
        collectionName,
        id
      ),
      {
        method: "GET",
        headers: {
          "Accept":
            "application/json"
        }
      }
    );

  const data =
    await response.json();

  if(!response.ok){

    throw new Error(
      data.error ||
      `API error ${response.status}`
    );

  }

  return data;

}

/* ================================
   STARS
================================ */

function stars(
  rating
){

  const value =
    Math.max(
      0,
      Math.min(
        5,
        Number(rating) || 0
      )
    );

  let output = "";

  for(
    let i = 1;
    i <= 5;
    i++
  ){

    if(value >= i){

      output +=
        `<i class="fa-solid fa-star"></i>`;

    }else if(
      value >= i - 0.5
    ){

      output +=
        `<i class="fa-solid fa-star-half-stroke"></i>`;

    }else{

      output +=
        `<i class="fa-regular fa-star"></i>`;

    }

  }

  return output;

}


/* ================================
   FORMAT LIST
================================ */

function formatList(
  value
){

  if(!value){

    return "Not specified.";

  }

  if(Array.isArray(value)){

    return value
      .map(
        item =>
          escapeHTML(
            String(item)
          )
      )
      .join(", ");

  }

  if(
    typeof value ===
    "object"
  ){

    return Object.values(value)
      .map(
        item =>
          escapeHTML(
            String(item)
          )
      )
      .join(", ");

  }

  return escapeHTML(
    String(value)
  );

}


/* ================================
   DATE / TIMESTAMP
================================ */

function getTime(
  value
){

  if(!value){
    return 0;
  }

  if(
    typeof value.toDate ===
    "function"
  ){

    return value
      .toDate()
      .getTime();

  }

  if(
    value instanceof Date
  ){

    return value.getTime();

  }

  if(
    typeof value ===
    "object" &&
    value.seconds
  ){

    return Number(
      value.seconds
    ) * 1000;

  }

  const time =
    new Date(value)
      .getTime();

  return Number.isNaN(time)
    ? 0
    : time;

}


/* ================================
   IMAGE
================================ */

function safeImage(
  url
){

  if(
    typeof url !==
    "string"
  ){

    return "https://via.placeholder.com/800x300?text=Business";

  }

  const value =
    url.trim();

  if(!value){

    return "https://via.placeholder.com/800x300?text=Business";

  }

  if(
    value.startsWith("https://") ||
    value.startsWith("http://")
  ){

    return value;

  }

  if(
    value.startsWith("/")
  ){

    return value;

  }

  return "https://via.placeholder.com/800x300?text=Business";

}


/* ================================
   SAFE LINK
================================ */

function safeLink(
  url
){

  if(
    typeof url !==
    "string"
  ){

    return "#";

  }

  const value =
    url.trim();

  if(
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "http://"
    )
  ){

    return value;

  }

  return "#";

}


/* ================================
   HTML SECURITY
================================ */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* ================================
   ATTRIBUTE SECURITY
================================ */

function escapeAttr(
  value
){

  return escapeHTML(
    value
  );

}
