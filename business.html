<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Businesses | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.header-btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}

.hero{
  padding:45px 6%;
  background:linear-gradient(135deg,#eff6ff,#fff);
}

.hero h1{
  font-size:36px;
  margin-bottom:10px;
}

.hero p{
  color:#64748b;
}

.container{
  width:88%;
  max-width:1250px;
  margin:30px auto;
}

.filters{
  background:#fff;
  padding:18px;
  border-radius:14px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:12px;
  margin-bottom:25px;
  box-shadow:0 4px 18px #00000008;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #dce1e8;
  border-radius:8px;
  outline:none;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 20px #0000000b;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
}

.cover{
  height:130px;
  background:#e5e7eb;
  position:relative;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.logo-wrap{
  position:relative;
  margin:-38px 18px 0;
}

.logo-img{
  width:76px;
  height:76px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #fff;
  background:#fff;
}

.content{
  padding:10px 18px 20px;
}

.title{
  font-size:19px;
  font-weight:700;
  margin:5px 0;
}

.muted{
  color:#64748b;
  font-size:14px;
  margin:5px 0;
}

.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:10px 0;
}

.badge{
  font-size:11px;
  padding:5px 8px;
  border-radius:20px;
  background:#eef2ff;
  color:#4338ca;
}

.verified{
  background:#dcfce7;
  color:#15803d;
}

.featured{
  background:#fef3c7;
  color:#b45309;
}

.rating{
  color:#f59e0b;
  font-size:14px;
}

.card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:15px;
}

.view-btn{
  border:0;
  background:#2563eb;
  color:white;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:70px 20px;
  color:#64748b;
  grid-column:1/-1;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:18px;
}

.close{
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
}

.detail-cover{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:12px;
}

.detail-logo{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid white;
  margin-top:-45px;
  margin-left:20px;
  background:white;
}

.detail-title{
  font-size:26px;
  font-weight:800;
  margin-top:10px;
}

.detail-section{
  margin-top:22px;
}

.detail-section h3{
  margin-bottom:8px;
}

.detail-section p{
  color:#475569;
  line-height:1.6;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

.action{
  padding:11px 15px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  text-decoration:none;
  background:#2563eb;
  color:white;
}

.action.whatsapp{
  background:#16a34a;
}

@media(max-width:800px){
  .filters{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:28px;
  }

  .container{
    width:92%;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="header-btn"
    onclick="location.href='index.html'"
  >
    <i class="fa-solid fa-house"></i>
    Home
  </button>

</header>


<section class="hero">

  <h1>Discover Businesses</h1>

  <p>
    Explore businesses, services and products
    available on LetsStudy Pro.
  </p>

</section>


<main class="container">

  <div class="filters">

    <input
      id="search"
      type="search"
      placeholder="Search businesses..."
    >

    <select id="category">
      <option value="">All Categories</option>
    </select>

    <select id="country">
      <option value="">All Countries</option>
    </select>

    <select id="sort">
      <option value="newest">
        Newest
      </option>

      <option value="featured">
        Featured
      </option>

      <option value="rating">
        Top Rated
      </option>

      <option value="views">
        Most Viewed
      </option>
    </select>

  </div>


  <div id="businessGrid" class="grid">

    <div class="empty">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>Loading businesses...</p>

    </div>

  </div>

</main>


<!-- ================= DETAIL MODAL ================= -->

<div
  id="modal"
  class="modal"
  onclick="closeOutside(event)"
>

  <div
    class="modal-box"
    id="modalContent"
  ></div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= FIREBASE ================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* ================= STATE ================= */

let businesses = [];


/* ================= DOM ================= */

const grid =
  document.getElementById(
    "businessGrid"
  );

const search =
  document.getElementById(
    "search"
  );

const category =
  document.getElementById(
    "category"
  );

const country =
  document.getElementById(
    "country"
  );

const sort =
  document.getElementById(
    "sort"
  );


/* ================= LOAD ================= */

async function loadBusinesses(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "businesses"
        )
      );


    businesses = [];


    snapshot.forEach(
      item => {

        const data =
          item.data();


        /*
          Public page:
          only show published businesses
        */

        if(
          data.status ===
            "published" ||

          data.status ===
            "active" ||

          data.status ===
            undefined
        ){

          businesses.push({

            id:
              item.id,

            ...data

          });

        }

      }
    );


    buildFilters();

    render();


  }catch(error){

    console.error(
      error
    );


    grid.innerHTML = `

      <div class="empty">

        <i
          class="
            fa-solid
            fa-triangle-exclamation
          "
        ></i>

        <p>
          Failed to load businesses.
        </p>

      </div>

    `;

  }

}


/* ================= FILTER OPTIONS ================= */

function buildFilters(){

  const categories =
    [
      ...new Set(

        businesses
          .map(
            b => b.category
          )
          .filter(Boolean)

      )
    ]
    .sort();


  const countries =
    [
      ...new Set(

        businesses
          .map(
            b => b.country
          )
          .filter(Boolean)

      )
    ]
    .sort();


  category.innerHTML =
    `<option value="">
      All Categories
    </option>`;


  categories.forEach(
    item => {

      category.innerHTML += `

        <option
          value="${escapeAttr(item)}"
        >
          ${escapeHTML(item)}
        </option>

      `;

    }
  );


  country.innerHTML =
    `<option value="">
      All Countries
    </option>`;


  countries.forEach(
    item => {

      country.innerHTML += `

        <option
          value="${escapeAttr(item)}"
        >
          ${escapeHTML(item)}
        </option>

      `;

    }
  );

}


/* ================= RENDER ================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  let result =
    businesses.filter(
      business => {

        const text = `

          ${business.name || ""}

          ${business.description || ""}

          ${business.shortDescription || ""}

          ${business.category || ""}

          ${business.subcategory || ""}

          ${business.industry || ""}

          ${business.services || ""}

          ${business.products || ""}

          ${business.city || ""}

          ${business.region || ""}

          ${business.country || ""}

        `
        .toLowerCase();


        return (

          text.includes(
            keyword
          ) &&

          (
            !category.value ||
            business.category ===
              category.value
          ) &&

          (
            !country.value ||
            business.country ===
              country.value
          )

        );

      }
    );


  /* ================= SORT ================= */

  if(
    sort.value ===
    "featured"
  ){

    result.sort(
      (a,b) =>
        Number(b.featured === true) -
        Number(a.featured === true)
    );

  }


  if(
    sort.value ===
    "rating"
  ){

    result.sort(
      (a,b) =>
        Number(b.rating || 0) -
        Number(a.rating || 0)
    );

  }


  if(
    sort.value ===
    "views"
  ){

    result.sort(
      (a,b) =>
        Number(b.views || 0) -
        Number(a.views || 0)
    );

  }


  if(
    sort.value ===
    "newest"
  ){

    result.sort(
      (a,b) =>
        getTime(b.createdAt) -
        getTime(a.createdAt)
    );

  }


  if(
    result.length ===
    0
  ){

    grid.innerHTML = `

      <div class="empty">

        <i
          class="
            fa-solid
            fa-store
          "
          style="font-size:40px"
        ></i>

        <h3>
          No businesses found
        </h3>

        <p>
          Try another search or filter.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    result
      .map(
        createCard
      )
      .join("");

}


/* ================= CARD ================= */

function createCard(
  business
){

  const rating =
    Number(
      business.rating || 0
    );


  return `

    <article class="card">

      <div class="cover">

        <img

          src="${safeImage(
            business.coverImage
          )}"

          alt=""

          onerror="
            this.src='https://via.placeholder.com/800x300?text=Business';
          "
        >

      </div>


      <div class="logo-wrap">

        <img

          class="logo-img"

          src="${safeImage(
            business.logo
          )}"

          alt="${escapeAttr(
            business.name ||
            "Business"
          )}"

          onerror="
            this.src='https://via.placeholder.com/100';
          "
        >

      </div>


      <div class="content">

        <div class="badges">

          ${
            business.verified === true
            ? `
              <span class="badge verified">

                <i
                  class="
                    fa-solid
                    fa-circle-check
                  "
                ></i>

                Verified

              </span>
            `
            : ""
          }


          ${
            business.featured === true
            ? `
              <span class="badge featured">

                <i
                  class="
                    fa-solid
                    fa-star
                  "
                ></i>

                Featured

              </span>
            `
            : ""
          }

        </div>


        <div class="title">

          ${escapeHTML(
            business.name ||
            "Unnamed Business"
          )}

        </div>


        <div class="muted">

          <i
            class="
              fa-solid
              fa-location-dot
            "
          ></i>

          ${escapeHTML(
            [
              business.city,
              business.region,
              business.country
            ]
            .filter(Boolean)
            .join(", ") ||
            "Location not specified"
          )}

        </div>


        <div class="muted">

          ${escapeHTML(
            business.category ||
            "Business"
          )}

          ${
            business.industry
              ? " • " +
                escapeHTML(
                  business.industry
                )
              : ""
          }

        </div>


        <div class="rating">

          ${stars(rating)}

          <span
            style="
              color:#64748b;
              margin-left:5px;
            "
          >

            ${rating.toFixed(1)}

            (${Number(
              business.ratingCount || 0
            )})

          </span>

        </div>


        <div class="card-footer">

          <span class="muted">

            <i
              class="
                fa-solid
                fa-eye
              "
            ></i>

            ${Number(
              business.views || 0
            ).toLocaleString()}

          </span>


          <button
            class="view-btn"

            onclick="
              openBusiness(
                '${escapeAttr(
                  business.id
                )}'
              )
            "
          >

            View Business

            <i
              class="
                fa-solid
                fa-arrow-right
              "
            ></i>

          </button>

        </div>

      </div>

    </article>

  `;

}


/* ================= DETAILS ================= */

window.openBusiness =
function(id){

  const business =
    businesses.find(
      b =>
        b.id === id
    );


  if(
    !business
  ){

    return;

  }


  const phone =
    business.phone ||
    "";


  const whatsapp =
    business.whatsapp ||
    phone;


  const whatsappNumber =
    whatsapp.replace(
      /[^0-9]/g,
      ""
    );


  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <div class="modal-head">

      <h2>
        Business Details
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        <i
          class="fa-solid fa-xmark"
        ></i>
      </button>

    </div>


    <img

      class="detail-cover"

      src="${safeImage(
        business.coverImage
      )}"

      alt=""

      onerror="
        this.src='https://via.placeholder.com/800x300';
      "
    >


    <img

      class="detail-logo"

      src="${safeImage(
        business.logo
      )}"

      alt=""

      onerror="
        this.src='https://via.placeholder.com/100';
      "
    >


    <div class="detail-title">

      ${escapeHTML(
        business.name ||
        "Business"
      )}

    </div>


    <div class="badges">

      ${
        business.verified === true
        ? `
          <span class="badge verified">
            ✓ Verified
          </span>
        `
        : ""
      }


      ${
        business.featured === true
        ? `
          <span class="badge featured">
            ★ Featured
          </span>
        `
        : ""
      }

    </div>


    <div class="muted">

      <i
        class="
          fa-solid
          fa-location-dot
        "
      ></i>

      ${escapeHTML(
        [
          business.address,
          business.city,
          business.region,
          business.country
        ]
        .filter(Boolean)
        .join(", ")
      )}

    </div>


    <div class="rating">

      ${stars(
        Number(
          business.rating || 0
        )
      )}

      ${Number(
        business.rating || 0
      ).toFixed(1)}

    </div>


    <div class="detail-section">

      <h3>
        About Business
      </h3>

      <p>

        ${escapeHTML(
          business.description ||
          business.shortDescription ||
          "No description available."
        )}

      </p>

    </div>


    <div class="detail-section">

      <h3>
        Services
      </h3>

      <p>

        ${formatList(
          business.services
        )}

      </p>

    </div>


    <div class="detail-section">

      <h3>
        Products
      </h3>

      <p>

        ${formatList(
          business.products
        )}

      </p>

    </div>


    <div class="detail-section">

      <h3>
        Business Information
      </h3>

      <p>

        <strong>Category:</strong>
        ${escapeHTML(
          business.category || "-"
        )}

        <br>

        <strong>Industry:</strong>
        ${escapeHTML(
          business.industry || "-"
        )}

        <br>

        <strong>Business Type:</strong>
        ${escapeHTML(
          business.businessType || "-"
        )}

        <br>

        <strong>Price Range:</strong>
        ${escapeHTML(
          business.priceRange || "-"
        )}
        ${escapeHTML(
          business.currency || ""
        )}

      </p>

    </div>


    <div class="actions">

      ${
        business.website
        ? `
          <a
            class="action"
            href="${safeLink(
              business.website
            )}"
            target="_blank"
            rel="noopener"
          >

            <i
              class="
                fa-solid
                fa-globe
              "
            ></i>

            Website

          </a>
        `
        : ""
      }


      ${
        whatsappNumber
        ? `
          <a
            class="
              action
              whatsapp
            "
            href="https://wa.me/${whatsappNumber}"
            target="_blank"
            rel="noopener"
          >

            <i
              class="
                fa-brands
                fa-whatsapp
              "
            ></i>

            WhatsApp

          </a>
        `
        : ""
      }


      ${
        business.email
        ? `
          <a
            class="action"
            href="mailto:${escapeAttr(
              business.email
            )}"
          >

            <i
              class="
                fa-solid
                fa-envelope
              "
            ></i>

            Email

          </a>
        `
        : ""
      }


      ${
        business.phone
        ? `
          <a
            class="action"
            href="tel:${escapeAttr(
              business.phone
            )}"
          >

            <i
              class="
                fa-solid
                fa-phone
              "
            ></i>

            Call

          </a>
        `
        : ""
      }

    </div>

  `;


  document
    .getElementById(
      "modal"
    )
    .classList.add(
      "show"
    );

};


/* ================= CLOSE ================= */

window.closeModal =
function(){

  document
    .getElementById(
      "modal"
    )
    .classList.remove(
      "show"
    );

};


window.closeOutside =
function(event){

  if(
    event.target.id ===
    "modal"
  ){

    closeModal();

  }

};


/* ================= EVENTS ================= */

search.addEventListener(
  "input",
  () => {
    render();
  }
);


category.addEventListener(
  "change",
  () => {
    render();
  }
);


country.addEventListener(
  "change",
  () => {
    render();
  }
);


sort.addEventListener(
  "change",
  () => {
    render();
  }
);


/* ================= MODAL EVENTS ================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      closeModal();

    }

  }
);


document
  .getElementById("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


/* ================= CLOSE MODAL ================= */

window.closeModal =
function(){

  const modal =
    document.getElementById(
      "modal"
    );

  if(
    modal
  ){

    modal.classList.remove(
      "show"
    );

  }

};


/* ================= OPEN BUSINESS ================= */

window.openBusiness =
function(id){

  const business =
    businesses.find(
      item =>
        item.id === id
    );


  if(
    !business
  ){

    return;

  }


  const modal =
    document.getElementById(
      "modal"
    );


  const modalContent =
    document.getElementById(
      "modalContent"
    );


  const rating =
    Number(
      business.rating || 0
    );


  const phone =
    business.phone || "";


  const whatsapp =
    business.whatsapp ||
    phone;


  const whatsappNumber =
    whatsapp.replace(
      /[^0-9]/g,
      ""
    );


  modalContent.innerHTML = `

    <div class="modal-head">

      <h2>
        Business Details
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >

        <i
          class="
            fa-solid
            fa-xmark
          "
        ></i>

      </button>

    </div>


    <img
      class="detail-cover"

      src="${safeImage(
        business.coverImage
      )}"

      alt=""

      onerror="
        this.src='https://via.placeholder.com/800x300?text=Business';
      "
    >


    <img
      class="detail-logo"

      src="${safeImage(
        business.logo
      )}"

      alt=""

      onerror="
        this.src='https://via.placeholder.com/100';
      "
    >

/* ================= STARS ================= */

function stars(
  rating
){

  let html = "";


  for(
    let i = 1;
    i <= 5;
    i++
  ){

    html +=
      i <= Math.round(
        rating
      )

      ? "★"

      : "☆";

  }


  return html;

}


/* ================= FORMAT LIST ================= */

function formatList(
  value
){

  if(
    Array.isArray(value)
  ){

    if(
      value.length === 0
    ){

      return "Not specified";

    }


    return value
      .map(
        item =>
          escapeHTML(
            item
          )
      )
      .join(", ");

  }


  if(
    typeof value ===
    "string"
  ){

    return escapeHTML(
      value
    );

  }


  return "Not specified";

}


/* ================= SAFE IMAGE ================= */

function safeImage(
  url
){

  const fallback =
    "https://via.placeholder.com/100";


  if(
    !url
  ){

    return fallback;

  }


  try{

    const parsed =
      new URL(url);


    if(
      parsed.protocol ===
        "https:" ||

      parsed.protocol ===
        "http:"
    ){

      return parsed.href;

    }

  }catch(error){

    console.warn(
      "Invalid image URL:",
      url
    );

  }


  return fallback;

}


/* ================= SAFE LINK ================= */

function safeLink(
  url
){

  if(
    !url
  ){

    return "#";

  }


  try{

    const parsed =
      new URL(url);


    if(
      parsed.protocol ===
        "https:" ||

      parsed.protocol ===
        "http:"
    ){

      return parsed.href;

    }

  }catch(error){

    console.warn(
      "Invalid website URL:",
      url
    );

  }


  return "#";

}


/* ================= ESCAPE HTML ================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ================= ESCAPE ATTRIBUTE ================= */

function escapeAttr(
  value
){

  return escapeHTML(
    value
  );

}


/* ================= DATE HELPER ================= */

function getTime(
  value
){

  if(
    !value
  ){

    return 0;

  }


  if(
    typeof value.toMillis ===
    "function"
  ){

    return value.toMillis();

  }


  if(
    typeof value.toDate ===
    "function"
  ){

    return value
      .toDate()
      .getTime();

  }


  const time =
    new Date(
      value
    ).getTime();


  return Number.isNaN(
    time
  )
    ? 0
    : time;

}
