  display:grid;

}

}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 28px rgba(0,0,0,.08);
}

.card-image{
  width:100%;
  height:190px;
  background:#eef2f7;
  overflow:hidden;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.card-body{
  padding:20px;
}

.category{
  display:inline-block;
  font-size:12px;
  font-weight:700;
  color:#2563eb;
  background:#eff6ff;
  padding:6px 9px;
  border-radius:20px;
  margin-bottom:10px;
}

.card h3{
  font-size:19px;
  margin-bottom:9px;
}

.description{
  color:#6b7280;
  font-size:14px;
  line-height:1.6;
  min-height:45px;
}

.location{
  margin-top:13px;
  font-size:13px;
  color:#4b5563;
}

.card-footer{
  margin-top:18px;
  display:flex;
  gap:9px;
}

.btn{
  flex:1;
  text-align:center;
  padding:11px;
  border-radius:9px;
  font-size:13px;
  font-weight:700;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-secondary{
  background:#f3f4f6;
  color:#374151;
}

.loading,
.empty,
.error{
  text-align:center;
  padding:60px 20px;
  color:#6b7280;
  grid-column:1/-1;
}

.error{
  color:#dc2626;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.footer{
  margin-top:50px;
  background:#111827;
  color:#9ca3af;
  padding:35px 20px;
  text-align:center;
  font-size:13px;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  .nav{
    padding:14px 15px;
  }

  .nav-links{
    display:none;
  }

  .hero{
    padding:45px 20px;
  }

  .hero h1{
    font-size:32px;
  }

  .hero p{
    font-size:15px;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box button{
    height:48px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .top-row{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style></head><body><header class="header">
  <nav class="nav"><a href="index.html" class="logo">
  LetsStudy <span>Pro</span>
</a>

<div class="nav-links">
  <a href="search.html">Search</a>
  <a href="courses.html">Courses</a>
  <a href="resources.html">Resources</a>
  <a href="businesses.html">Businesses</a>
  <a href="community.html">Community</a>
</div>

  </nav>
</header><section class="hero">
  <div class="hero-inner">
    <h1>Discover Businesses</h1>
    <p>
      Explore businesses, organizations and service providers
      available across the LetsStudy Pro ecosystem.
    </p>
  </div>
</section><div class="search-area">
  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="Search businesses..."
      autocomplete="off"
    >
    <button id="searchButton">Search</button>
  </div>
</div><main class="container">  <div class="top-row">
    <div>
      <h2>Explore Businesses</h2>
      <div class="count" id="resultCount">Loading businesses...</div>
    </div>
  </div>  <div class="filters"><select id="categoryFilter">
  <option value="">All Categories</option>
</select>

<select id="locationFilter">
  <option value="">All Locations</option>
</select>

  </div>  <section class="grid" id="businessGrid"><div class="loading">
  <div class="spinner"></div>
  Loading businesses...
</div>

  </section></main><footer class="footer">
  © 2026 LetsStudy Pro. All rights reserved.
</footer><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const grid =
  document.getElementById("businessGrid");

const searchInput =
  document.getElementById("searchInput");

const searchButton =
  document.getElementById("searchButton");

const categoryFilter =
  document.getElementById("categoryFilter");

const locationFilter =
  document.getElementById("locationFilter");

const resultCount =
  document.getElementById("resultCount");


let businesses = [];


function first(data, fields){

  for(const field of fields){

    if(
      data[field] !== undefined &&
      data[field] !== null &&
      String(data[field]).trim()
    ){

      return String(data[field]).trim();

    }

  }

  return "";

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function cleanUrl(url){

  if(!url) return "";

  url = String(url).trim();

  if(
    !url.startsWith("http://") &&
    !url.startsWith("https://")
  ){

    return "https://" + url;

  }

  return url;

}


function getBusinessData(data,id){

  return {

    id,

    name:first(data,[
      "name",
      "businessName",
      "title"
    ]) || "Business",

    category:first(data,[
      "category",
      "type",
      "industry",
      "sector"
    ]) || "Business",

    description:first(data,[
      "description",
      "about",
      "details",
      "content"
    ]) || "Discover this business on LetsStudy Pro.",

    image:first(data,[
      "image",
      "imageUrl",
      "logo",
      "photo",
      "thumbnail"
    ]),

    location:first(data,[
      "location",
      "address",
      "city",
      "country"
    ]),

    website:first(data,[
      "website",
      "websiteUrl",
      "url",
      "link"
    ]),

    email:first(data,[
      "email",
      "emailAddress",
      "contactEmail"
    ]),

    phone:first(data,[
      "phone",
      "phoneNumber",
      "contactPhone",
      "mobile"
    ])

  };

}


async function loadBusinesses(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"businesses")
      );

    businesses = [];

    snapshot.forEach(docSnap => {

      businesses.push(
        getBusinessData(
          docSnap.data() || {},
          docSnap.id
        )
      );

    });

    createFilters();

    renderBusinesses();

  }catch(error){

    console.error(
      "Businesses loading error:",
      error
    );

    grid.innerHTML = `
      <div class="error">
        Unable to load businesses.
        Please try again later.
      </div>
    `;

    resultCount.textContent =
      "Unable to load businesses";

  }

}


function createFilters(){

  const categories =
    [...new Set(
      businesses
        .map(item => item.category)
        .filter(Boolean)
    )]
    .sort();

  const locations =
    [...new Set(
      businesses
        .map(item => item.location)
        .filter(Boolean)
    )]
    .sort();


  categoryFilter.innerHTML =
    `<option value="">All Categories</option>` +
    categories.map(category =>
      `<option value="${escapeHTML(category)}">
        ${escapeHTML(category)}
      </option>`
    ).join("");


  locationFilter.innerHTML =
    `<option value="">All Locations</option>` +
    locations.map(location =>
      `<option value="${escapeHTML(location)}">
        ${escapeHTML(location)}
      </option>`
    ).join("");

}


function renderBusinesses(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  const category =
    categoryFilter.value;

  const location =
    locationFilter.value;


  const filtered =
    businesses.filter(item => {

      const searchable = [
        item.name,
        item.category,
        item.description,
        item.location,
        item.website
      ]
      .join(" ")
      .toLowerCase();


      const matchesSearch =
        !query ||
        searchable.includes(query);

      const matchesCategory =
        !category ||
        item.category === category;

      const matchesLocation =
        !location ||
        item.location === location;


      return (
        matchesSearch &&
        matchesCategory &&
        matchesLocation
      );

    });


  resultCount.textContent =
    `${filtered.length} ${
      filtered.length === 1
        ? "business"
        : "businesses"
    } found`;


  if(!filtered.length){

    grid.innerHTML = `
      <div class="empty">
        <h3>No businesses found</h3>
        <p style="margin-top:8px;">
          Try another search or filter.
        </p>
      </div>
    `;

    return;

  }


  grid.innerHTML =
    filtered.map(item => {

      const image =
        item.image ||
        "https://via.placeholder.com/800x500?text=Business";


      const description =
        item.description.length > 130
          ? item.description.slice(0,130) + "..."
          : item.description;


      return `

        <article class="card">

          <div class="card-image">

            <img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(item.name)}"
              loading="lazy"
              onerror="this.src='https://via.placeholder.com/800x500?text=Business'"
            >

          </div>


          <div class="card-body">

            <span class="category">
              ${escapeHTML(item.category)}
            </span>


            <h3>
              ${escapeHTML(item.name)}
            </h3>


            <p class="description">
              ${escapeHTML(description)}
            </p>


            ${
              item.location
                ? `
                  <div class="location">
                    📍 ${escapeHTML(item.location)}
                  </div>
                `
                : ""
            }


            <div class="card-footer">

              <a
                class="btn btn-primary"
                href="business-details.html?id=${encodeURIComponent(item.id)}"
              >
                View Business
              </a>


              <a
                class="btn btn-secondary"
                href="business-contact.html?id=${encodeURIComponent(item.id)}"
              >
                Contact
              </a>

            </div>

          </div>

        </article>

      `;

    }).join("");

}


searchButton.addEventListener(
  "click",
  renderBusinesses
);


searchInput.addEventListener(
  "input",
  renderBusinesses
);


categoryFilter.addEventListener(
  "change",
  renderBusinesses
);


locationFilter.addEventListener(
  "change",
  renderBusinesses
);


loadBusinesses();

</script></body>
</html>
