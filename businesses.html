<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Businesses | LetsStudy Pro</title>

<meta name="description"
content="Discover businesses, services, products and opportunities on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#2563eb
}

nav{
  display:flex;
  gap:15px;
  align-items:center
}

nav a{
  text-decoration:none;
  color:#475569;
  font-weight:600
}

.container{
  max-width:1250px;
  margin:auto;
  padding:25px 18px
}

.hero{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;
  padding:35px;
  border-radius:20px;
  margin-bottom:22px
}

.hero h1{
  font-size:34px;
  margin-bottom:10px
}

.hero p{
  opacity:.92;
  max-width:700px;
  line-height:1.6
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:22px
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:18px
}

.stat strong{
  display:block;
  font-size:25px;
  margin-bottom:5px
}

.stat span{
  color:#64748b;
  font-size:13px
}

.filters{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:18px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:22px
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #dbe1ea;
  border-radius:9px;
  outline:none;
  background:#fff
}

input:focus,
select:focus{
  border-color:#2563eb
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.business{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 5px 20px #00000008
}

.cover{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#e2e8f0
}

.businessBody{
  padding:18px
}

.businessTop{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:12px
}

.logoBox{
  width:60px;
  height:60px;
  border-radius:12px;
  object-fit:cover;
  background:#e2e8f0;
  border:3px solid #fff;
  box-shadow:0 2px 8px #0002;
  margin-top:-38px
}

.businessName{
  font-size:19px;
  font-weight:800;
  margin-bottom:4px
}

.muted{
  color:#64748b;
  font-size:13px
}

.description{
  color:#475569;
  font-size:14px;
  line-height:1.55;
  margin:12px 0
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:15px
}

.tag{
  background:#eff6ff;
  color:#1d4ed8;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold
}

.verified{
  background:#dcfce7;
  color:#15803d
}

.featured{
  background:#fef3c7;
  color:#92400e
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 12px;
  cursor:pointer;
  font-weight:bold;
  text-decoration:none;
  font-size:13px;
  display:inline-block
}

.primary{
  background:#2563eb;
  color:#fff
}

.contact{
  background:#16a34a;
  color:#fff
}

.preview{
  background:#e2e8f0;
  color:#172033
}

.danger{
  background:#fee2e2;
  color:#b91c1c
}

.dark{
  background:#172033;
  color:#fff
}

.empty{
  background:#fff;
  border:1px solid #e5e7eb;
  padding:45px;
  text-align:center;
  border-radius:15px;
  color:#64748b
}

.loading{
  text-align:center;
  padding:50px;
  color:#64748b
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:500;
  padding:20px;
  overflow:auto
}

.modalBox{
  max-width:750px;
  margin:50px auto;
  background:#fff;
  border-radius:18px;
  padding:25px
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px
}

.close{
  border:0;
  background:#fee2e2;
  color:#b91c1c;
  width:38px;
  height:38px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px
}

.detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:20px
}

.detailItem{
  background:#f8fafc;
  padding:13px;
  border-radius:10px
}

.detailItem strong{
  display:block;
  font-size:12px;
  color:#64748b;
  margin-bottom:5px
}

@media(max-width:950px){

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .stats{
    grid-template-columns:repeat(3,1fr)
  }

  .filters{
    grid-template-columns:1fr 1fr
  }

}

@media(max-width:650px){

  header{
    padding:13px 15px
  }

  nav a{
    display:none
  }

  .container{
    padding:18px 12px
  }

  .hero{
    padding:25px 20px
  }

  .hero h1{
    font-size:27px
  }

  .stats{
    grid-template-columns:1fr 1fr
  }

  .filters{
    grid-template-columns:1fr
  }

  .grid{
    grid-template-columns:1fr
  }

  .detail{
    grid-template-columns:1fr
  }

  .actions .btn{
    flex:1;
    text-align:center
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy Pro
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="businesses.html">Businesses</a>
    <a href="business-contact.html">Contact</a>
  </nav>

</header>


<main class="container">

  <section class="hero">

    <h1>Discover Businesses</h1>

    <p>
      Explore businesses, services, products and opportunities
      from around the world on LetsStudy Pro.
    </p>

  </section>


  <section class="stats">

    <div class="stat">
      <strong id="totalCount">0</strong>
      <span>Total Businesses</span>
    </div>

    <div class="stat">
      <strong id="publishedCount">0</strong>
      <span>Published</span>
    </div>

    <div class="stat">
      <strong id="verifiedCount">0</strong>
      <span>Verified</span>
    </div>

    <div class="stat">
      <strong id="featuredCount">0</strong>
      <span>Featured</span>
    </div>

    <div class="stat">
      <strong id="countryCount">0</strong>
      <span>Countries</span>
    </div>

  </section>


  <section class="filters">

    <input
      id="search"
      type="search"
      placeholder="Search business, service or product...">

    <select id="category">
      <option value="">All Categories</option>
    </select>

    <select id="country">
      <option value="">All Countries</option>
    </select>

    <select id="businessType">
      <option value="">All Business Types</option>
    </select>

    <select id="sort">
      <option value="newest">Newest</option>
      <option value="name">Name A-Z</option>
      <option value="views">Most Viewed</option>
      <option value="rating">Highest Rated</option>
    </select>

  </section>


  <section id="businessGrid" class="grid">

    <div class="loading">
      Loading businesses...
    </div>

  </section>

</main>


<!-- PREVIEW MODAL -->

<div
  id="previewModal"
  class="modal">

  <div class="modalBox">

    <div class="modalHeader">

      <div>
        <h2 id="modalName">
          Business
        </h2>

        <p
          id="modalCategory"
          class="muted">
        </p>
      </div>

      <button
        class="close"
        onclick="closePreview()">
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXKbljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =========================
   VARIABLES
========================= */

let businesses = [];

const grid =
document.getElementById("businessGrid");


/* =========================
   SECURITY HELPERS
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeURL(value){

  if(!value) return "";

  try{

    const url =
    new URL(String(value));

    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return url.href;

    }

  }catch(e){}

  return "";

}


/* =========================
   LOAD BUSINESSES
========================= */

async function loadBusinesses(){

  try{

    const snapshot =
    await getDocs(
      collection(db,"businesses")
    );

    businesses =
    snapshot.docs.map(doc => ({

      id:doc.id,
      ...doc.data()

    }));


    updateStats();

    buildFilters();

    renderBusinesses();


  }catch(error){

    console.error(error);

    grid.innerHTML = `

      <div class="empty">

        <h2>
          Unable to Load Businesses
        </h2>

        <p style="margin-top:10px">
          ${escapeHTML(error.message)}
        </p>

      </div>

    `;

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  const published =
  businesses.filter(
    b => b.status === "published"
  );

  const verified =
  businesses.filter(
    b => b.verified === true
  );

  const featured =
  businesses.filter(
    b => b.featured === true
  );

  const countries =
  new Set(
    businesses
      .map(b => b.country)
      .filter(Boolean)
  );


  document.getElementById(
    "totalCount"
  ).textContent =
  businesses.length;


  document.getElementById(
    "publishedCount"
  ).textContent =
  published.length;


  document.getElementById(
    "verifiedCount"
  ).textContent =
  verified.length;


  document.getElementById(
    "featuredCount"
  ).textContent =
  featured.length;


  document.getElementById(
    "countryCount"
  ).textContent =
  countries.size;

}


/* =========================
   FILTER OPTIONS
========================= */

function buildFilters(){

  const categorySet =
  new Set();

  const countrySet =
  new Set();

  const typeSet =
  new Set();


  businesses.forEach(b => {

    if(b.category)
      categorySet.add(b.category);

    if(b.country)
      countrySet.add(b.country);

    if(b.businessType)
      typeSet.add(b.businessType);

  });


  fillSelect(
    "category",
    [...categorySet].sort()
  );

  fillSelect(
    "country",
    [...countrySet].sort()
  );

  fillSelect(
    "businessType",
    [...typeSet].sort()
  );

}


function fillSelect(id,values){

  const select =
  document.getElementById(id);

  const first =
  select.options[0].textContent;

  select.innerHTML =
  `<option value="">${first}</option>`;


  values.forEach(value => {

    const option =
    document.createElement("option");

    option.value = value;
    option.textContent = value;

    select.appendChild(option);

  });

}


/* =========================
   RENDER
========================= */

function renderBusinesses(){

  const search =
  document.getElementById(
    "search"
  )
  .value
  .toLowerCase()
  .trim();


  const category =
  document.getElementById(
    "category"
  ).value;


  const country =
  document.getElementById(
    "country"
  ).value;


  const type =
  document.getElementById(
    "businessType"
  ).value;


  const sort =
  document.getElementById(
    "sort"
  ).value;


  let results =
  businesses.filter(b => {

    /*
      Only show published businesses
    */
    if(
      b.status &&
      b.status !== "published"
    ){
      return false;
    }


    const searchable = [

      b.name,
      b.description,
      b.shortDescription,
      b.category,
      b.subcategory,
      b.industry,
      b.city,
      b.country,
      b.services,
      b.products

    ]
    .join(" ")
    .toLowerCase();


    if(
      search &&
      !searchable.includes(search)
    ){
      return false;
    }


    if(
      category &&
      b.category !== category
    ){
      return false;
    }


    if(
      country &&
      b.country !== country
    ){
      return false;
    }


    if(
      type &&
      b.businessType !== type
    ){
      return false;
    }


    return true;

  });


  /* SORT */

  if(sort === "name"){

    results.sort(
      (a,b) =>
      String(a.name||"")
      .localeCompare(
        String(b.name||"")
      )
    );

  }


  if(sort === "views"){

    results.sort(
      (a,b) =>
      Number(b.views||0) -
      Number(a.views||0)
    );

  }


  if(sort === "rating"){

    results.sort(
      (a,b) =>
      Number(b.rating||0) -
      Number(a.rating||0)
    );

  }


  if(sort === "newest"){

    results.sort(
      (a,b) => {

        const aTime =
        a.createdAt?.seconds ||
        0;

        const bTime =
        b.createdAt?.seconds ||
        0;

        return bTime-aTime;

      }
    );

  }


  if(!results.length){

    grid.innerHTML = `

      <div class="empty"
           style="grid-column:1/-1">

        <h2>
          No Businesses Found
        </h2>

        <p style="margin-top:8px">
          Try changing your search or filters.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
  results.map(
    businessCard
  ).join("");

}


/* =========================
   BUSINESS CARD
========================= */

function businessCard(b){

  const logo =
  safeURL(b.logo);

  const cover =
  safeURL(b.coverImage);


  const description =
  b.shortDescription ||
  b.description ||
  "No description available.";


  const location = [

    b.city,
    b.region,
    b.country

  ]
  .filter(Boolean)
  .join(", ");


  return `

    <article class="business">

      ${
        cover
        ?`

          <img
            class="cover"
            src="${cover}"
            alt="${escapeHTML(b.name||"Business")}"
            loading="lazy"
            onerror="this.style.display='none'">

        `
        :`

          <div
            class="cover">
          </div>

        `
      }


      <div class="businessBody">

        <div class="businessTop">

          ${
            logo
            ?`

              <img
                class="logoBox"
                src="${logo}"
                alt="${escapeHTML(b.name||"Business")}"
                onerror="this.style.display='none'">

            `
            :`

              <div class="logoBox"></div>

            `
          }


          <div>

            <div class="businessName">

              ${escapeHTML(
                b.name || "Business"
              )}

            </div>

            <div class="muted">

              ${escapeHTML(
                b.category || "Business"
              )}

            </div>

          </div>

        </div>


        <div class="tags">

          ${
            b.verified
            ?`

              <span class="tag verified">
                ✓ Verified
              </span>

            `
            :""
          }


          ${
            b.featured
            ?`

              <span class="tag featured">
                ⭐ Featured
              </span>

            `
            :""
          }


          ${
            b.businessType
            ?`

              <span class="tag">
                ${escapeHTML(
                  b.businessType
                )}
              </span>

            `
            :""
          }

        </div>


        ${
          location
          ?`

            <div class="muted">
              📍 ${escapeHTML(location)}
            </div>

          `
          :""
        }


        <p class="description">

          ${escapeHTML(
            description.length > 150
            ? description.substring(0,150)+"..."
            : description
          )}

        </p>


        <div class="muted">

          ${
            Number(b.rating||0) > 0
            ?`

              ⭐ ${escapeHTML(b.rating)}
              ${
                b.ratingCount
                ?` (${escapeHTML(b.ratingCount)} reviews)`
                :""
              }

            `
            :""
          }

          ${
            Number(b.views||0) > 0
            ?`

              &nbsp; • &nbsp;
              👁 ${escapeHTML(b.views)}

            `
            :""
          }

        </div>


        <div class="actions">

          <!-- REQUIRED CONTACT BUTTON -->

          <button
            class="btn contact"
            onclick="contactBusiness('${escapeHTML(b.id)}')">

            💬 Contact Business

          </button>


          <button
            class="btn preview"
            onclick="previewBusiness('${escapeHTML(b.id)}')">

            👁 Preview

          </button>


          ${
            safeURL(b.website)
            ?`

              <a
                class="btn primary"
                href="${safeURL(b.website)}"
                target="_blank"
                rel="noopener noreferrer">

                🌐 Website

              </a>

            `
            :""
          }

        </div>

      </div>

    </article>

  `;

}


/* =========================
   CONTACT BUSINESS
========================= */

window.contactBusiness =
function(id){

  if(!id) return;

  window.location.href =
    "business-contact.html?businessId=" +
    encodeURIComponent(id);

};


/* =========================
   PREVIEW
========================= */

window.previewBusiness =
function(id){

  const b =
  businesses.find(
    business =>
    business.id === id
  );


  if(!b) return;


  document.getElementById(
    "modalName"
  ).textContent =
  b.name || "Business";


  document.getElementById(
    "modalCategory"
  ).textContent =
  [
    b.category,
    b.subcategory
  ]
  .filter(Boolean)
  .join(" • ");


  const website =
  safeURL(b.website);


  document.getElementById(
    "modalContent"
  ).innerHTML = `

    ${
      b.description
      ?`

        <p style="
          line-height:1.7;
          color:#475569">

          ${escapeHTML(
            b.description
          )}

        </p>

      `
      :""
    }


    <div class="detail">

      <div class="detailItem">

        <strong>
          Location
        </strong>

        ${escapeHTML(
          [
            b.address,
            b.city,
            b.region,
            b.country
          ]
          .filter(Boolean)
          .join(", ")
        ) || "Not provided"}

      </div>


      <div class="detailItem">

        <strong>
          Industry
        </strong>

        ${escapeHTML(
          b.industry || "Not provided"
        )}

      </div>


      <div class="detailItem">

        <strong>
          Business Type
        </strong>

        ${escapeHTML(
          b.businessType || "Not provided"
        )}

      </div>


      <div class="detailItem">

        <strong>
          Services
        </strong>

        ${escapeHTML(
          Array.isArray(b.services)
          ? b.services.join(", ")
          : b.services || "Not provided"
        )}

      </div>


      <div class="detailItem">

        <strong>
          Products
        </strong>

        ${escapeHTML(
          Array.isArray(b.products)
          ? b.products.join(", ")
          : b.products || "Not provided"
        )}

      </div>


      <div class="detailItem">

        <strong>
          Rating
        </strong>

        ${
          b.rating
          ?`⭐ ${escapeHTML(b.rating)}`
          :"Not rated"
        }

      </div>

    </div>


    <div class="actions"
     style="margin-top:20px">

  <!-- CONTACT BUSINESS -->
  <button
    class="btn contact"
    onclick="contactBusiness('${escapeHTML(b.id)}')">

    💬 Contact Business

  </button>


  <!-- WEBSITE -->
  ${
    website
    ?`

      <a
        class="btn primary"
        href="${website}"
        target="_blank"
        rel="noopener noreferrer">

        🌐 Visit Website

      </a>

    `
    :""
  }

</div>

`;


  document.getElementById(
    "previewModal"
  ).style.display = "block";

};


/* =========================
   CLOSE PREVIEW
========================= */

window.closePreview = function(){

  document.getElementById(
    "previewModal"
  ).style.display = "none";

};


/* =========================
   CLOSE MODAL WHEN CLICKING
   OUTSIDE THE MODAL BOX
========================= */

document.getElementById(
  "previewModal"
).addEventListener(
  "click",
  function(event){

    if(event.target === this){

      closePreview();

    }

  }
);


/* =========================
   FILTER EVENTS
========================= */

document.getElementById(
  "search"
).addEventListener(
  "input",
  renderBusinesses
);


document.getElementById(
  "category"
).addEventListener(
  "change",
  renderBusinesses
);


document.getElementById(
  "country"
).addEventListener(
  "change",
  renderBusinesses
);


document.getElementById(
  "businessType"
).addEventListener(
  "change",
  renderBusinesses
);


document.getElementById(
  "sort"
).addEventListener(
  "change",
  renderBusinesses
);


/* =========================
   ESC KEY CLOSES MODAL
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closePreview();

    }

  }
