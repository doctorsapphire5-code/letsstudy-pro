<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Calendar | LetsStudy Pro</title>

<meta
  name="description"
  content="LetsStudy Pro Calendar - manage study schedules, events, deadlines and reminders."
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#f5f7fb;
  color:#172033;
}

/* =========================
   HEADER
========================= */

.header{
  height:68px;

  background:#111827;
  color:white;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 24px;

  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.header-right{
  display:flex;
  gap:8px;
}

.header-btn{
  border:1px solid #374151;
  background:#1f2937;
  color:white;

  padding:9px 13px;

  border-radius:8px;

  font-size:12px;
  font-weight:700;
}

/* =========================
   CONTAINER
========================= */

.container{
  max-width:1450px;
  margin:auto;
  padding:24px;
}

/* =========================
   TOP
========================= */

.page-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  margin-bottom:20px;
}

.page-top h1{
  font-size:28px;
  font-weight:900;
}

.page-top p{
  color:#64748b;
  font-size:13px;
  margin-top:4px;
}

.primary{
  border:0;
  background:#2563eb;
  color:white;

  padding:11px 17px;

  border-radius:9px;

  font-weight:800;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:14px;

  margin-bottom:20px;
}

.stat{
  background:white;

  border:1px solid #e5e7eb;

  border-radius:14px;

  padding:17px;
}

.stat span{
  color:#64748b;
  font-size:11px;
  font-weight:700;
}

.stat strong{
  display:block;

  font-size:25px;

  margin-top:5px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  background:white;

  border:1px solid #e5e7eb;

  border-radius:14px;

  padding:13px;

  display:flex;

  gap:10px;

  margin-bottom:18px;

  flex-wrap:wrap;
}

.toolbar input,
.toolbar select{
  height:42px;

  border:1px solid #d1d5db;

  border-radius:8px;

  padding:0 11px;

  outline:none;
}

.search{
  flex:1;
  min-width:200px;
}

/* =========================
   CALENDAR
========================= */

.calendar-card{
  background:white;

  border:1px solid #e5e7eb;

  border-radius:16px;

  overflow:hidden;
}

.calendar-head{
  padding:16px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  border-bottom:1px solid #e5e7eb;

  gap:10px;
}

.month-title{
  font-size:18px;
  font-weight:900;
}

.calendar-controls{
  display:flex;
  gap:6px;
}

.calendar-controls button{
  border:1px solid #d1d5db;

  background:white;

  padding:8px 11px;

  border-radius:8px;

  font-weight:700;
}

.calendar-grid{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);
}

.day-name{
  background:#f8fafc;

  padding:11px;

  text-align:center;

  color:#64748b;

  font-size:11px;

  font-weight:800;

  border-bottom:1px solid #e5e7eb;
}

.day{
  min-height:125px;

  border-right:1px solid #eef0f3;

  border-bottom:1px solid #eef0f3;

  padding:8px;

  cursor:pointer;

  transition:.15s;
}

.day:hover{
  background:#f8fbff;
}

.day.other{
  background:#fafafa;
  color:#cbd5e1;
}

.day.today{
  background:#eff6ff;
}

.day-number{
  font-size:12px;
  font-weight:850;

  margin-bottom:6px;
}

.today .day-number{
  display:inline-flex;

  width:26px;
  height:26px;

  align-items:center;
  justify-content:center;

  background:#2563eb;
  color:white;

  border-radius:50%;
}

/* =========================
   EVENTS
========================= */

.event{
  display:block;

  padding:5px 6px;

  margin-bottom:4px;

  border-radius:6px;

  background:#dbeafe;

  color:#1d4ed8;

  font-size:10px;

  font-weight:750;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.event.exam{
  background:#fee2e2;
  color:#b91c1c;
}

.event.study{
  background:#dcfce7;
  color:#166534;
}

.event.deadline{
  background:#ffedd5;
  color:#c2410c;
}

.event.meeting{
  background:#ede9fe;
  color:#6d28d9;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  background:rgba(15,23,42,.55);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  z-index:100;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:100%;

  max-width:600px;

  max-height:92vh;

  overflow:auto;

  background:white;

  border-radius:18px;

  padding:22px;
}

.modal-head{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:18px;
}

.close{
  border:0;

  background:#f1f5f9;

  width:35px;
  height:35px;

  border-radius:8px;
}

.form-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:13px;
}

.field{
  display:flex;

  flex-direction:column;

  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:12px;

  font-weight:800;

  color:#334155;
}

.field input,
.field select,
.field textarea{
  width:100%;

  border:1px solid #cbd5e1;

  border-radius:8px;

  padding:10px;

  outline:none;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.form-footer{
  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:20px;
}

.cancel{
  border:0;

  background:#f1f5f9;

  padding:11px 16px;

  border-radius:8px;
}

.save{
  border:0;

  background:#2563eb;

  color:white;

  padding:11px 18px;

  border-radius:8px;

  font-weight:800;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .day{
    min-height:100px;
  }

}

@media(max-width:600px){

  .container{
    padding:14px;
  }

  .page-top{
    flex-direction:column;
    align-items:flex-start;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .header-btn{
    display:none;
  }

  .day{
    min-height:75px;
    padding:5px;
  }

  .day-name{
    padding:8px 2px;
    font-size:9px;
  }

  .event{
    font-size:8px;
    padding:4px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="logo">
    LetsStudy Pro
  </div>

  <div class="header-right">

    <a
      href="index.html"
      class="header-btn"
    >
      Home
    </a>

    <a
      href="admin-dashboard.html"
      class="header-btn"
    >
      Dashboard
    </a>

  </div>

</header>


<main class="container">


<section class="page-top">

  <div>

    <h1>
      Calendar
    </h1>

    <p>
      Organize your study schedule, events,
      deadlines and important activities.
    </p>

  </div>

  <button
    id="newEvent"
    class="primary"
  >
    + New Event
  </button>

</section>


<!-- STATS -->

<section class="stats">

  <div class="stat">

    <span>
      TOTAL EVENTS
    </span>

    <strong id="totalEvents">
      0
    </strong>

  </div>

  <div class="stat">

    <span>
      TODAY
    </span>

    <strong id="todayEvents">
      0
    </strong>

  </div>

  <div class="stat">

    <span>
      EXAMS
    </span>

    <strong id="examEvents">
      0
    </strong>

  </div>

  <div class="stat">

    <span>
      DEADLINES
    </span>

    <strong id="deadlineEvents">
      0
    </strong>

  </div>

</section>


<!-- TOOLBAR -->

<section class="toolbar">

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search events..."
  >

  <select id="filterType">

    <option value="">
      All Types
    </option>

    <option value="study">
      Study
    </option>

    <option value="exam">
      Exam
    </option>

    <option value="deadline">
      Deadline
    </option>

    <option value="meeting">
      Meeting
    </option>

    <option value="other">
      Other
    </option>

  </select>

  <button
    id="todayBtn"
    class="calendar-controls"
  >
    Today
  </button>

</section>


<!-- CALENDAR -->

<section class="calendar-card">

  <div class="calendar-head">

    <button
      id="prevMonth"
      class="calendar-controls"
    >
      ←
    </button>

    <div
      id="monthTitle"
      class="month-title"
    >
      Loading...
    </div>

    <button
      id="nextMonth"
      class="calendar-controls"
    >
      →
    </button>

  </div>


  <div
    id="calendarGrid"
    class="calendar-grid"
  ></div>

</section>


</main>


<!-- MODAL -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        New Event
      </h2>

      <button
        id="closeModal"
        class="close"
      >
        ✕
      </button>

    </div>


    <form id="eventForm">

      <div class="form-grid">


        <div class="field full">

          <label>
            Event Title *
          </label>

          <input
            id="eventTitle"
            required
            placeholder="e.g. Physics Revision"
          >

        </div>


        <div class="field">

          <label>
            Date *
          </label>

          <input
            id="eventDate"
            type="date"
            required
          >

        </div>


        <div class="field">

          <label>
            Time
          </label>

          <input
            id="eventTime"
            type="time"
          >

        </div>


        <div class="field">

          <label>
            Type
          </label>

          <select id="eventType">

            <option value="study">
              Study
            </option>

            <option value="exam">
              Exam
            </option>

            <option value="deadline">
              Deadline
            </option>

            <option value="meeting">
              Meeting
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Reminder
          </label>

          <select id="reminder">

            <option value="none">
              No reminder
            </option>

            <option value="15">
              15 minutes before
            </option>

            <option value="30">
              30 minutes before
            </option>

            <option value="60">
              1 hour before
            </option>

            <option value="1440">
              1 day before
            </option>

          </select>

        </div>


        <div class="field full">

          <label>
            Description
          </label>

          <textarea
            id="eventDescription"
            placeholder="Event details..."
          ></textarea>

        </div>


      </div>


      <div class="form-footer">

        <button
          type="button"
          id="cancel"
          class="cancel"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="save"
        >
          Save Event
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* =========================================
   STATE
========================================= */

let events = [];

let currentDate =
  new Date();

let editingId = null;


/* =========================================
   ELEMENTS
========================================= */

const grid =
  document.getElementById(
    "calendarGrid"
  );

const modal =
  document.getElementById(
    "modal"
  );

const form =
  document.getElementById(
    "eventForm"
  );


/* =========================================
   HELPERS
========================================= */

function pad(value){

  return String(value)
    .padStart(2,"0");

}


function dateKey(date){

  return `${date.getFullYear()}-${
    pad(date.getMonth()+1)
  }-${
    pad(date.getDate())
  }`;

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================
   LOAD EVENTS
========================================= */

async function loadEvents(){

  try{

    const snap =
      await getDocs(
        collection(
          db,
          "calendar"
        )
      );


    events =
      snap.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );


    updateStats();

    renderCalendar();

  }

  catch(error){

    console.error(error);

    grid.innerHTML = `
      <div
        style="
          grid-column:1/-1;
          padding:50px;
          text-align:center;
          color:#b91c1c;
        "
      >
        Failed to load calendar events.
      </div>
    `;

  }

}


/* =========================================
   STATS
========================================= */

function updateStats(){

  const today =
    dateKey(
      new Date()
    );


  document.getElementById(
    "totalEvents"
  ).textContent =
    events.length;


  document.getElementById(
    "todayEvents"
  ).textContent =
    events.filter(
      e =>
        e.date === today
    ).length;


  document.getElementById(
    "examEvents"
  ).textContent =
    events.filter(
      e =>
        e.type === "exam"
    ).length;


  document.getElementById(
    "deadlineEvents"
  ).textContent =
    events.filter(
      e =>
        e.type === "deadline"
    ).length;

}


/* =========================================
   FILTER
========================================= */

function getFilteredEvents(){

  const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase();


  const type =
    document.getElementById(
      "filterType"
    ).value;


  return events.filter(
    event => {

      const text =
        `${event.title || ""}
         ${event.description || ""}`
        .toLowerCase();


      return (
        (!search ||
          text.includes(search)) &&

        (!type ||
          event.type === type)
      );

    }
  );

}


/* =========================================
   CALENDAR
========================================= */

function renderCalendar(){

  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth();


  const monthName =
    currentDate.toLocaleString(
      "en-US",
      {
        month:"long",
        year:"numeric"
      }
    );


  document.getElementById(
    "monthTitle"
  ).textContent =
    monthName;


  grid.innerHTML = "";


  const names =
    [
      "Sun",
      "Mon",
      "Tue",
      "Wed",
      "Thu",
      "Fri",
      "Sat"
    ];


  names.forEach(
    name => {

      const el =
        document.createElement(
          "div"
        );

      el.className =
        "day-name";

      el.textContent =
        name;

      grid.appendChild(el);

    }
  );


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const days =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const previousDays =
    new Date(
      year,
      month,
      0
    ).getDate();


  const filtered =
    getFilteredEvents();


  for(
    let i = 0;
    i < 42;
    i++
  ){

    const cell =
      document.createElement(
        "div"
      );

    cell.className =
      "day";


    let dayNumber;

    let date;


    if(
      i < firstDay
    ){

      dayNumber =
        previousDays -
        firstDay +
        i +
        1;


      date =
        new Date(
          year,
          month - 1,
          dayNumber
        );


      cell.classList.add(
        "other"
      );

    }

    else if(
      i >=
      firstDay + days
    ){

      dayNumber =
        i -
        firstDay -
        days +
        1;


      date =
        new Date(
          year,
          month + 1,
          dayNumber
        );


      cell.classList.add(
        "other"
      );

    }

    else{

      dayNumber =
        i -
        firstDay +
        1;


      date =
        new Date(
          year,
          month,
          dayNumber
        );

    }


    const key =
      dateKey(date);


    if(
      key ===
      dateKey(
        new Date()
      )
    ){

      cell.classList.add(
        "today"
      );

    }


    const number =
      document.createElement(
        "div"
      );

    number.className =
      "day-number";

    number.textContent =
      dayNumber;

    cell.appendChild(
      number
    );


    filtered
      .filter(
        event =>
          event.date === key
      )
      .slice(0,4)
      .forEach(
        event => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            `event ${
              event.type || ""
            }`;


          item.textContent =
            event.time
              ? `${event.time} ${event.title}`
              : event.title;


          item.title =
            event.title;


          item.addEventListener(
            "click",
            e => {

              e.stopPropagation();

              editEvent(event);

            }
          );


          cell.appendChild(
            item
          );

        }
      );


    cell.addEventListener(
      "click",
      () => {

        openNewEvent(
          key
        );

      }
    );


    grid.appendChild(
      cell
    );

  }

}


/* =========================================
   MODAL
========================================= */

function openNewEvent(
  date = ""
){

  editingId =
    null;

  document.getElementById(
    "modalTitle"
  ).textContent =
    "New Event";


  form.reset();


  document.getElementById(
    "eventDate"
  ).value =
    date;


  modal.classList.add(
    "active"
  );

}


function editEvent(event){

  editingId =
    event.id;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Event";


  document.getElementById(
    "eventTitle"
  ).value =
    event.title || "";


  document.getElementById(
    "eventDate"
  ).value =
    event.date || "";


  document.getElementById(
    "eventTime"
  ).value =
    event.time || "";


  document.getElementById(
    "eventType"
  ).value =
    event.type || "other";


  document.getElementById(
    "reminder"
  ).value =
    event.reminder || "none";


  document.getElementById(
    "eventDescription"
  ).value =
    event.description || "";


  modal.classList.add(
    "active"
  );

}


function closeModal(){

  modal.classList.remove(
    "active"
  );

  editingId = null;

  document.getElementById("modalTitle").textContent =
    "New Event";

  form.reset();

  if (date) {
    document.getElementById("eventDate").value = date;
  }

  modal.classList.add("active");

}


/* =========================================
   EDIT EVENT
========================================= */

function editEvent(event) {

  editingId = event.id;

  document.getElementById("modalTitle").textContent =
    "Edit Event";

  document.getElementById("eventTitle").value =
    event.title || "";

  document.getElementById("eventDate").value =
    event.date || "";

  document.getElementById("eventTime").value =
    event.time || "";

  document.getElementById("eventType").value =
    event.type || "other";

  document.getElementById("reminder").value =
    event.reminder || "none";

  document.getElementById("eventDescription").value =
    event.description || "";

  modal.classList.add("active");

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal() {

  modal.classList.remove("active");

  editingId = null;

}


/* =========================================
   SAVE EVENT
========================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const saveButton =
      form.querySelector(".save");

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    const data = {

      title:
        document
          .getElementById("eventTitle")
          .value
          .trim(),

      date:
        document
          .getElementById("eventDate")
          .value,

      time:
        document
          .getElementById("eventTime")
          .value,

      type:
        document
          .getElementById("eventType")
          .value,

      reminder:
        document
          .getElementById("reminder")
          .value,

      description:
        document
          .getElementById("eventDescription")
          .value
          .trim(),

      updatedAt:
        serverTimestamp()

    };


    try {

      /* UPDATE */

      if (editingId) {

        await updateDoc(
          doc(
            db,
            "calendar",
            editingId
          ),
          data
        );

      }


      /* CREATE */

      else {

        await addDoc(
          collection(
            db,
            "calendar"
          ),
          {
            ...data,
            createdAt: serverTimestamp()
          }
        );

      }


      closeModal();

      await loadEvents();

    }

    catch (error) {

      console.error(
        "Save event error:",
        error
      );

      alert(
        "Failed to save event. Please try again."
      );

    }

    finally {

      saveButton.disabled = false;

      saveButton.textContent =
        "Save Event";

    }

  }
);


/* =========================================
   DELETE EVENT
========================================= */

async function deleteEvent(id) {

  if (!id) {
    return;
  }


  const confirmed =
    confirm(
      "Are you sure you want to delete this event?"
    );


  if (!confirmed) {
    return;
  }


  try {

    await deleteDoc(
      doc(
        db,
        "calendar",
        id
      )
    );


    closeModal();

    await loadEvents();

  }

  catch (error) {

    console.error(
      "Delete event error:",
      error
    );

    alert(
      "Failed to delete event."
    );

  }

}

========================================= */

document

  .addEventListener(
    "click",

      currentDate.setMonth(
        currentDate.getMonth() - 1
      );

      renderCalendar();

    }
  );

   NEXT MONTH
========================================= */

document
  .getElementById("nextMonth")
  .addEventListener(
    "click",
    () => {

      currentDate.setMonth(
        currentDate.getMonth() + 1
      );

      renderCalendar();

    }
  );


/* =========================================
   TODAY
========================================= */

document
  .getElementById("todayBtn")
  .addEventListener(
    "click",
    () => {

      currentDate = new Date();

      renderCalendar();

    }
  );

   SEARCH
========================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderCalendar
  );

   FILTER
========================================= */

document
  .getElementById("filterType")
  .addEventListener(
    "change",
    renderCalendar
  );


/* =========================================
   CLOSE MODAL OUTSIDE
========================================= */

modal.addEventListener(
  "click",
  event => {

    if (
      event.target === modal
    ) {

      closeModal();

    }

  }
);


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      modal.classList.contains("active")
    ) {

      closeModal();

    }

  }
);


/* =========================================
   START CALENDAR
========================================= */

loadEvents();

</script>
