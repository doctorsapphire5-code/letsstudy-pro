<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(1000px,92%);margin:0 auto;padding:40px 0 70px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
.cal{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-size:20px;color:var(--ink);letter-spacing:-.01em}
.nav{display:flex;gap:6px}
.ib{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 13px;font:inherit;font-weight:700;cursor:pointer}
.ib:hover{border-color:var(--p)}
.g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wd{padding:8px 4px;text-align:center;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line)}
.cell{min-height:96px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);padding:6px;text-align:left;cursor:pointer;font:inherit;color:var(--text);display:flex;flex-direction:column;gap:3px;overflow:hidden}
.g>:nth-child(7n){border-right:0}
.cell.out{background:var(--bg);color:var(--muted)}
.cell.sel{outline:2px solid var(--p);outline-offset:-2px}
.dn{font-size:13px;font-weight:700;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.today .dn{background:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.today .dn{color:#0b1220}}
.pill,.dot,.ev{--c:#64748b}
.p-high{--c:#dc2626}.p-medium{--c:#b45309}.p-low{--c:#16a34a}
@media(prefers-color-scheme:dark){.p-high{--c:#f87171}.p-medium{--c:#fbbf24}.p-low{--c:#4ade80}}
.pill{display:block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.x,.ev.x h3{text-decoration:line-through;opacity:.7}
.more{font-size:11px;color:var(--muted);font-weight:700}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
h2.day{font-size:20px;color:var(--ink);margin:30px 0 14px;letter-spacing:-.01em}
.ev{display:flex;gap:16px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font:inherit;color:var(--text)}
.ev:hover{border-color:var(--c)}
.tm{flex:none;width:104px;font-size:13px;font-weight:700;color:var(--muted)}
.ev h3{margin:0;font-size:16px;color:var(--ink);line-height:1.35;overflow-wrap:anywhere}
.ev p{margin:2px 0 0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.b{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);margin:8px 6px 0 0}
.b.c{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.btn{display:inline-block;margin-top:14px;border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,92vw);background:var(--paper);color:var(--text);box-shadow:0 25px 60px rgba(2,6,23,.4)}
dialog::backdrop{background:rgba(2,6,23,.6)}
.dg{padding:24px}
.dg h2{margin:0 0 4px;font-size:22px;color:var(--ink);line-height:1.3;overflow-wrap:anywhere}
.dg dl{margin:16px 0 0;display:grid;grid-template-columns:96px 1fr;gap:8px 14px;font-size:15px}
.dg dt{color:var(--muted);font-weight:700}
.dg dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.dg .row{display:flex;gap:10px;margin-top:22px}
.btn.alt{background:var(--soft);color:var(--ink);margin-top:0}
.btn.go{margin-top:0}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:700px){.cell{min-height:58px;align-items:center}.pill,.more{display:none}.dots{display:flex;justify-content:center}.tm{width:84px}.hd nav a{margin-left:12px}.wrap{padding-top:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="notifications.html">Notifications</a>
    <a href="calendarEvents.html" aria-current="page">Calendar</a>
  </nav>
</div></header>

<main class="wrap">
  <h1>Calendar</h1>
  <div class="chips" id="chips" hidden=""></div>
  <div id="app" hidden="">
    <section class="cal">
      <div class="ch">
        <h2 id="mt"></h2>
        <div class="nav">
          <button class="ib" id="prev" type="button" aria-label="Previous month">‹</button>
          <button class="ib" id="today" type="button">Today</button>
          <button class="ib" id="next" type="button" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="g" id="grid"></div>
    </section>
    <h2 class="day" id="dayTitle"></h2>
    <section id="dayList"></section>
  </div>
  <div id="msg"></div>
</main>

<dialog id="dlg"><div class="dg" id="dlgBody"></div></dialog>

<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const same=(a,b)=>a.getTime()===b.getTime();
const parse=s=>{
  const m=String(s||"").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const x=new Date(s);return s&&!isNaN(x)?sod(x):null;
};
const isAllDay=e=>String(e.allDay).toLowerCase()==="true";
const pc=e=>"p-"+String(e.priority||"").toLowerCase();

let events=[],cat="",user=null;
let sel=sod(new Date()),view=new Date(sel.getFullYear(),sel.getMonth(),1);

function occurs(e,t){
  const b=e.base;if(t<b)return false;
  const r=String(e.repeat||"none").toLowerCase();
  if(r==="daily")return true;
  if(r==="weekly")return Math.round((t-b)/864e5)%7===0;
  if(r==="monthly")return t.getDate()===b.getDate();
  if(r==="yearly")return t.getMonth()===b.getMonth()&&t.getDate()===b.getDate();
  return same(t,b);
}
function dayEvents(t){
  return events.filter(e=>(!cat||e.category===cat)&&occurs(e,t))
    .sort((a,b)=>(isAllDay(b)-isAllDay(a))||String(a.startTime||"").localeCompare(String(b.startTime||"")));
}
const timeText=e=>isAllDay(e)?"All day":[e.startTime,e.endTime].filter(Boolean).join(" – ")||"No time";

const WD=[...Array(7)].map((_,i)=>`<div class="wd">${esc(new Date(2024,0,1+i).toLocaleDateString(undefined,{weekday:"short"}))}</div>`).join("");

function renderGrid(){
  $("#mt").textContent=view.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const off=(view.getDay()+6)%7,today=sod(new Date());
  let h=WD;
  for(let i=0;i<42;i++){
    const d=new Date(view.getFullYear(),view.getMonth(),1-off+i),ev=dayEvents(d);
    h+=`<button class="cell${d.getMonth()!==view.getMonth()?" out":""}${same(d,today)?" today":""}${same(d,sel)?" sel":""}" type="button" data-t="${d.getTime()}" aria-label="${esc(d.toDateString())}, ${ev.length} events">
      <span class="dn">${d.getDate()}</span>
      ${ev.slice(0,2).map(e=>`<span class="pill ${pc(e)}${/cancel/i.test(e.status||"")?" x":""}">${esc(e.title||"Event")}</span>`).join("")}
      ${ev.length>2?`<span class="more">+${ev.length-2} more</span>`:""}
      ${ev.length?`<span class="dots">${ev.slice(0,3).map(e=>`<i class="dot ${pc(e)}"></i>`).join("")}</span>`:""}
    </button>`;
  }
  $("#grid").innerHTML=h;
}

function renderDay(){
  $("#dayTitle").textContent=sel.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  const ev=dayEvents(sel);
  $("#dayList").innerHTML=ev.length?ev.map(e=>`<button class="ev ${pc(e)}${/cancel/i.test(e.status||"")?" x":""}" type="button" data-id="${esc(e.id)}">
      <div class="tm">${esc(timeText(e))}</div>
      <div><h3>${esc(e.title||"Event")}</h3>
      ${e.location?`<p>${esc(e.location)}</p>`:""}
      ${e.category?`<span class="b">${esc(cap(e.category))}</span>`:""}
      ${e.priority?`<span class="b c">${esc(cap(e.priority))}</span>`:""}</div>
    </button>`).join(""):`<div class="state"><h2>No events</h2><p>Nothing scheduled for this day.</p></div>`;
}
const draw=()=>{renderGrid();renderDay()};

function buildChips(){
  const cats=[...new Set(events.map(e=>e.category).filter(Boolean))].sort();
  const box=$("#chips");
  if(cats.length<2){box.hidden=true;return}
  box.innerHTML=["",...cats].map(c=>`<button class="chip" type="button" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c?cap(c):"All")}</button>`).join("");
  box.hidden=false;
}
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  cat=b.dataset.c;
  $("#chips").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  draw();
});

$("#grid").addEventListener("click",e=>{
  const c=e.target.closest(".cell");if(!c)return;
  sel=sod(new Date(+c.dataset.t));
  if(sel.getMonth()!==view.getMonth())view=new Date(sel.getFullYear(),sel.getMonth(),1);
  draw();
});
$("#prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderGrid()};
$("#next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderGrid()};
$("#today").onclick=()=>{sel=sod(new Date());view=new Date(sel.getFullYear(),sel.getMonth(),1);draw()};

const dlg=$("#dlg");
$("#dayList").addEventListener("click",e=>{
  const b=e.target.closest(".ev");if(!b)return;
  const ev=events.find(x=>x.id===b.dataset.id);if(!ev)return;
  const link=safe(ev.meetingUrl),rep=String(ev.repeat||"none").toLowerCase();
  const rows=[
    ["When",`${sel.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}\n${timeText(ev)}${ev.timezone?` (${ev.timezone})`:""}`],
    ["Where",ev.location],["Category",cap(ev.category||"")],["Priority",cap(ev.priority||"")],
    ["Status",cap(ev.status||"")],["Repeats",rep!=="none"?cap(rep):""],
    ["Reminder",ev.remender||ev.reminder],["Details",ev.description]
  ].filter(r=>r[1]);
  $("#dlgBody").innerHTML=`<h2>${esc(ev.title||"Event")}</h2>
    <dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
    <div class="row">${link?`<a class="btn go" href="${esc(link)}" target="_blank" rel="noopener">Join meeting</a>`:""}<button class="btn alt" type="button" id="close">Close</button></div>`;
  dlg.showModal();
});
dlg.addEventListener("click",e=>{if(e.target===dlg||e.target.id==="close")dlg.close()});

function signedOut(){
  $("#app").hidden=true;$("#chips").hidden=true;
  $("#msg").innerHTML=`<div class="state"><h2>Sign in to view your calendar</h2><p>Your events are private to your account.</p><a class="btn" href="login.html">Sign in</a></div>`;
}
function fail(err){
  console.error(err);
  $("#app").hidden=true;
  $("#msg").innerHTML=`<div class="state err"><h2>Unable to load events</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",load);
}

async function load(){
  try{
    const snap=await getDocs(query(collection(db,"calendarEvents"),where("userId","==",user.uid)));
    events=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(e=>!/^(deleted|archived)$/i.test(e.status||""))
      .map(e=>({...e,base:parse(e.date)})).filter(e=>e.base);
  }catch(e){return fail(e)}
  $("#msg").innerHTML="";
  $("#app").hidden=false;
  buildChips();
  draw();
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,u=>{user=u;u?load():signedOut()});
</script>


</body></html>
