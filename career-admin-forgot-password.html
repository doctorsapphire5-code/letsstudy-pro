<body>

<div class="container">

  <div class="brand">
    <div class="brand-logo">V</div>
    <h1>VORIX CAREER</h1>
    <p>Administrator Account Recovery</p>
  </div>

  <div class="card">

    <div class="icon">🔒</div>

    <h2>Forgot Password?</h2>

    <p class="description">
      Enter the email address associated with your administrator account.
      We will send you a secure password reset link.
    </p>

    <div id="message" class="message" role="alert" aria-live="polite"></div>

    <form id="forgotPasswordForm">

      <div>
        <label for="email">Administrator Email Address</label>

        <input type="email" id="email" placeholder="Enter your admin email" autocomplete="email" required="">
      </div>

      <button type="submit" id="submitBtn">
        Send Reset Link
      </button>

    </form>

    <a href="career-admin-login.html" class="back">
      Back to Admin Login
    </a>

  </div>

  <div class="footer">
    Secure administrator authentication powered by Firebase.
  </div>

</div>

<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    sendPasswordResetEmail
  } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  // FIREBASE CONFIGURATION

  const firebaseConfig = {
    apiKey: "AIzaSyBhEY3Igjv0oWcQ3cAQQy6KU8d0StydJdY",
    authDomain: "vorix-career.firebaseapp.com",
    projectId: "vorix-career",
    storageBucket: "vorix-career.firebasestorage.app",
    messagingSenderId: "601220299726",
    appId: "1:601220299726:web:21888081707f5d35c9899f"
  };


  // INITIALIZE FIREBASE

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);


  // ELEMENTS

  const form = document.getElementById("forgotPasswordForm");
  const emailInput = document.getElementById("email");
  const submitBtn = document.getElementById("submitBtn");
  const messageBox = document.getElementById("message");


  // DISPLAY MESSAGE

  function showMessage(message, type) {
    messageBox.textContent = message;
    messageBox.className = "message " + type;
    messageBox.style.display = "block";
  }


  // HIDE MESSAGE

  function hideMessage() {
    messageBox.style.display = "none";
  }


  // PASSWORD RESET

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    hideMessage();

    const email = emailInput.value.trim().toLowerCase();

    if (!email) {
      showMessage("Please enter your email address.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    try {

      await sendPasswordResetEmail(auth, email, {
        url: new URL(
          "career-admin-login.html",
          window.location.href
        ).href,
        handleCodeInApp: false
      });

      showMessage(
        "If an account is registered with this email, a password reset link will be sent. Please check your inbox and spam folder.",
        "success"
      );

      form.reset();

    } catch (error) {

      console.error("Password reset error:", error);

      // Avoid revealing whether an email is registered.
      if (
        error.code === "auth/invalid-email" ||
        error.code === "auth/missing-email"
      ) {
        showMessage(
          "Please enter a valid email address.",
          "error"
        );
      } else if (
        error.code === "auth/too-many-requests"
      ) {
        showMessage(
          "Too many attempts. Please wait and try again later.",
          "error"
        );
      } else if (
        error.code === "auth/network-request-failed"
      ) {
        showMessage(
          "Network error. Check your internet connection and try again.",
          "error"
        );
      } else if (
        error.code === "auth/operation-not-allowed"
      ) {
        showMessage(
          "Password reset is not enabled. Enable Email/Password authentication in Firebase Console.",
          "error"
        );
      } else if (
        error.code === "auth/unauthorized-continue-uri"
      ) {
        showMessage(
          "This website domain is not authorized in Firebase Authentication. Add your domain under Authentication Settings.",
          "error"
        );
      } else {
        showMessage(
          "Unable to process your request. Please try again later.",
          "error"
        );
      }

    } finally {

      submitBtn.disabled = false;
      submitBtn.textContent = "Send Reset Link";

    }

  });

</script>
