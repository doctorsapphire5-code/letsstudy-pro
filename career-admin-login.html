<body>

  <main class="login-container">

    <div class="brand">
      <div class="brand-icon">V</div>
      <h1>Admin Login</h1>
      <p>Sign in to manage Vorix Career.</p>
    </div>

    <div id="message" class="message" role="alert" aria-live="polite"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your admin email" autocomplete="username" required="">
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required="">

          <button type="button" class="toggle-password" id="togglePassword">SHOW</button>
        </div>
      </div>

      <a href="career-admin-forgot-password.html" class="forgot">
        Forgot password?
      </a>

      <button type="submit" class="submit-btn" id="loginButton">
        Sign In
      </button>

    </form>

    <div class="register-link">
      Don't have an admin account?
      <a href="career-admin-register.html">Create Account</a>
    </div>

    <div class="security-note">
      Secure Admin Access · Vorix Career
    </div>

  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      updateDoc,
      increment,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    // VORIX CAREER FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyBhEY3Igjv0oWc3QcAQQy6KU8d0StydJY",
      authDomain: "vorix-career.firebaseapp.com",
      projectId: "vorix-career",
      storageBucket: "vorix-career.firebasestorage.app",
      messagingSenderId: "601220299726",
      appId: "1:601220299726:web:21888081707f5d35c9899f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");

    function showMessage(message, type = "error") {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function setLoading(loading) {
      loginButton.disabled = loading;
      loginButton.textContent = loading ? "Signing In..." : "Sign In";
    }

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "HIDE" : "SHOW";
    });

    // Prevent an already authenticated non-admin from remaining on this page.
    // The same admin verification is performed again during every login.
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      try {
        const adminQuery = query(
          collection(db, "admins"),
          where("uid", "==", user.uid)
        );

        const result = await getDocs(adminQuery);

        if (result.size === 1) {
          const adminData = result.docs[0].data();

          if (
            adminData.role === "admin" &&
            adminData.status === "active"
          ) {
            window.location.replace("career-admin-dashboard.html");
            return;
          }
        }

        await signOut(auth);

      } catch (error) {
        console.error("Admin session verification:", error);
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
      }

      setLoading(true);

      try {
        // STEP 1: Firebase Authentication
        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        const user = credential.user;

        // STEP 2: Find admin using the Firebase Auth UID field.
        // The Firestore document ID is adminId, not the UID.
        const adminQuery = query(
          collection(db, "admins"),
          where("uid", "==", user.uid)
        );

        const adminResults = await getDocs(adminQuery);

        if (adminResults.empty) {
          await signOut(auth);
          throw new Error(
            "Access denied. This account is not registered as an admin. Check the uid field in admins."
          );
        }

        if (adminResults.size !== 1) {
          await signOut(auth);
          throw new Error(
            "Multiple admin records were found. Contact your system administrator."
          );
        }

        const adminDocument = adminResults.docs[0];
        const adminData = adminDocument.data();

        // STEP 3: Validate role
        if (adminData.role !== "admin") {
          await signOut(auth);
          throw new Error("Access denied. Invalid administrator role.");
        }

        // STEP 4: Validate account status
        if (adminData.status !== "active") {
          await signOut(auth);
          throw new Error(
            "Your administrator account is not active. Contact your administrator."
          );
        }

        // STEP 5: Check that the admin record belongs to this email
        if (
          String(adminData.email || "").trim().toLowerCase() !== email
        ) {
          await signOut(auth);
          throw new Error(
            "The login email does not match the registered admin record."
          );
        }

        // STEP 6: Update login information
        await updateDoc(adminDocument.ref, {
          lastLoginAt: serverTimestamp(),
          loginCount: increment(1),
          updatedAt: serverTimestamp()
        });

        showMessage("Login successful. Redirecting...", "success");

        // STEP 7: Open admin dashboard
        window.location.replace("career-admin-dashboard.html");

      } catch (error) {
        console.error("Admin login error:", error);

        let errorMessage = error.message;

        if (error.code === "auth/invalid-credential") {
          errorMessage = "Incorrect email or password.";
        } else if (error.code === "auth/user-not-found") {
          errorMessage = "No account exists with this email.";
        } else if (error.code === "auth/wrong-password") {
          errorMessage = "Incorrect password.";
        } else if (error.code === "auth/too-many-requests") {
          errorMessage = "Too many attempts. Please try again later.";
        } else if (error.code === "auth/network-request-failed") {
          errorMessage = "Network error. Check your internet connection.";
        } else if (error.code === "permission-denied") {
          errorMessage =
            "Firestore permission denied. Check your Firestore Security Rules.";
        }

        showMessage(errorMessage, "error");

      } finally {
        setLoading(false);
      }
    });
  </script>


</body></html>
