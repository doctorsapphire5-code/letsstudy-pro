<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;padding:20px;
display:grid;place-items:center;
background:#f3f6fb;color:#172033;
font-family:Arial,Helvetica,sans-serif
}
.card{
width:100%;max-width:470px;background:#fff;
padding:30px;border:1px solid #e5eaf2;
border-radius:18px;box-shadow:0 15px 45px #10182812
}
.brand{text-align:center;margin-bottom:25px}
.logo{
width:55px;height:55px;border-radius:15px;
display:grid;place-items:center;margin:0 auto 13px;
background:#175cd3;color:white;font-size:25px;font-weight:bold
}
h1{font-size:25px;margin:0 0 8px}
.subtitle{font-size:14px;color:#667085;line-height:1.6}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
input{
width:100%;padding:13px;border:1px solid #d0d5dd;
border-radius:9px;font-size:15px;outline:none
}
input:focus{border-color:#175cd3;box-shadow:0 0 0 3px #175cd31a}
button{
width:100%;padding:14px;margin-top:22px;
border:0;border-radius:9px;background:#175cd3;
color:white;font-weight:700;font-size:15px;cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
.message{
display:none;margin-top:16px;padding:12px;
border-radius:8px;font-size:13px;line-height:1.5
}
.error{display:block;background:#fef3f2;color:#b42318}
.success{display:block;background:#ecfdf3;color:#027a48}
.info{
margin-top:17px;padding:12px;background:#eff8ff;
color:#175cd3;border-radius:8px;font-size:12px;line-height:1.6
}
.links{text-align:center;margin-top:20px;font-size:13px}
a{color:#175cd3;text-decoration:none}
.footer{text-align:center;margin-top:24px;color:#98a2b3;font-size:12px}
</style>
<meta name="description" content="Create Admin Account. Explore career opportunities, career guidance, skills and professional growth on LetsStudy Pro."></head>

<body>
<div class="card">

<div class="brand">
<div class="logo">V</div>
<h1>Create Admin Account</h1>
<div class="subtitle">
Register your Vorix Career administrator account.
</div>
</div>

<form id="registerForm">

<label for="adminId">Admin ID</label>
<input id="adminId" type="text" placeholder="Enter Admin ID" required="">

<label for="fullName">Full Name</label>
<input id="fullName" type="text" placeholder="Enter full name" autocomplete="name" required="">

<label for="email">Admin Email</label>
<input id="email" type="email" placeholder="admin@example.com" autocomplete="email" required="">

<label for="phoneNumber">Phone Number</label>
<input id="phoneNumber" type="tel" placeholder="+255..." autocomplete="tel">

<label for="password">Password</label>
<input id="password" type="password" placeholder="Minimum 8 characters" minlength="8" required="">

<label for="confirmPassword">Confirm Password</label>
<input id="confirmPassword" type="password" placeholder="Confirm password" minlength="8" required="">

<button id="registerButton" type="submit">
Create Admin Account
</button>

<div id="message" class="message" role="alert"></div>
</form>

<div class="info">
<strong>Admin Account Creation</strong><br>
Your account will be created in Firebase Authentication and your administrator profile will be saved in Firestore.
</div>

<div class="links">
Already have an account?
<a href="career-admin-login.html">Admin Login</a>
</div>

<div class="footer">
Vorix Career · Administrator Registration
</div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
updateProfile,
signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBhEY3Igjv0oWcQ3cAQQy6KU8d0StydJdY",
authDomain: "vorix-career.firebaseapp.com",
projectId: "vorix-career",
storageBucket: "vorix-career.firebasestorage.app",
messagingSenderId: "601220299726",
appId: "1:601220299726:web:21888081707f5d35c9899f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("registerForm");
const button = document.getElementById("registerButton");
const message = document.getElementById("message");

function showMessage(text,type="error"){
message.textContent=text;
message.className="message "+type;
}

function friendlyError(error){
const errors={
"auth/email-already-in-use":"This email is already registered.",
"auth/invalid-email":"Enter a valid email address.",
"auth/weak-password":"Choose a stronger password.",
"auth/network-request-failed":"Network error. Check your internet.",
"permission-denied":"Firestore permission denied. Check Security Rules."
};
return errors[error.code] || error.message || "Account creation failed.";
}

form.addEventListener("submit",async(event)=>{
event.preventDefault();

const adminId=document.getElementById("adminId").value.trim();
const fullName=document.getElementById("fullName").value.trim();
const email=document.getElementById("email").value.trim().toLowerCase();
const phoneNumber=document.getElementById("phoneNumber").value.trim();
const password=document.getElementById("password").value;
const confirmPassword=document.getElementById("confirmPassword").value;

if(password.length<8){
showMessage("Password must contain at least 8 characters.");
return;
}

if(password!==confirmPassword){
showMessage("Passwords do not match.");
return;
}

button.disabled=true;
button.textContent="Creating account...";
message.className="message";

let createdUser=null;

try{

// Create Firebase Authentication account.
const credential=await createUserWithEmailAndPassword(
auth,email,password
);

createdUser=credential.user;

// Update Auth profile.
await updateProfile(createdUser,{
displayName:fullName
});

// Create a new Firestore admin document.
// Document ID is the Firebase Authentication UID.
await setDoc(doc(db,"admins",createdUser.uid),{

uid:createdUser.uid,
adminId:adminId,

fullName:fullName,
displayName:fullName,
email:email,
phoneNumber:phoneNumber,
photoURL:createdUser.photoURL || "",

role:"admin",
adminType:"admin",
status:"active",
accessLevel:"admin",

permissions:{},

emailVerified:createdUser.emailVerified,
phoneVerified:false,
twoFactorEnabled:false,

loginCount:0,

language:"en",
timezone:"Africa/Dar_es_Salaam",

createdAt:serverTimestamp(),
updatedAt:serverTimestamp(),
lastLoginAt:null

});

// Sign out after registration.
await signOut(auth);
createdUser=null;

form.reset();

showMessage(
"Admin account created successfully! Redirecting to login...",
"success"
);

setTimeout(()=>{
window.location.href="career-admin-login.html";
},2000);

}catch(error){

console.error("Admin account creation error:",error);

if(createdUser && auth.currentUser){
try{
await signOut(auth);
}catch(signOutError){
console.error(signOutError);
}
}

showMessage(friendlyError(error));

}finally{
button.disabled=false;
button.textContent="Create Admin Account";
}

});
</script>


</body></html>
