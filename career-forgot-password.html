<body>

<header>
  <div class="header-inner">
    <a href="login.html">VORIX CAREER</a>
    <a href="login.html">Login</a>
  </div>
</header>

<main>

  <section class="card">

    <div class="icon" aria-hidden="true">↻</div>

    <h1>Forgot Password?</h1>

    <p class="description">
      Enter the email address associated with your account.
      We will send you instructions to reset your password.
    </p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="forgotPasswordForm">

      <label for="email">Email Address</label>

      <input type="email" id="email" name="email" placeholder="Enter your registered email" autocomplete="email" required="">

      <button type="submit" id="submitButton">
        Send Reset Link
      </button>

    </form>

    <div class="links">
      Remember your password?
      <a href="login.html">Back to Login</a>
    </div>

  </section>

</main>

<footer>
  © <span id="year"></span> Vorix Career. All rights reserved.
</footer>


<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

  import {
    getAuth,
    sendPasswordResetEmail
  } from
    "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";


  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBhEY3Igjv0oWcQ3cAQQy6KU8d0StydJdY",
    authDomain: "vorix-career.firebaseapp.com",
    projectId: "vorix-career",
    storageBucket: "vorix-career.firebasestorage.app",
    messagingSenderId: "601220299726",
    appId: "1:601220299726:web:21888081707f5d35c9899f"
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("forgotPasswordForm");
  const emailInput = document.getElementById("email");
  const submitButton = document.getElementById("submitButton");
  const messageBox = document.getElementById("message");


  document.getElementById("year").textContent =
    new Date().getFullYear();


  function showMessage(message, type) {
    messageBox.textContent = message;
    messageBox.className = "message " + type;
  }


  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email = emailInput.value.trim().toLowerCase();

    if (!email) {
      showMessage("Please enter your email address.", "error");
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Sending...";

    try {

      await sendPasswordResetEmail(auth, email, {
        url: window.location.origin + "/login.html",
        handleCodeInApp: false
      });

      // Generic confirmation avoids revealing whether an email is registered.
      showMessage(
        "If an account exists for this email, a password reset link has been sent. Please check your inbox and spam folder.",
        "success"
      );

      form.reset();

    } catch (error) {

      console.error("Password reset error:", error);

      if (error.code === "auth/invalid-email") {
        showMessage("Please enter a valid email address.", "error");

      } else if (error.code === "auth/too-many-requests") {
        showMessage("Too many attempts. Please try again later.", "error");

      } else {
        showMessage(
          "Unable to process your request right now. Please try again later.",
          "error"
        );
      }

    } finally {

      submitButton.disabled = false;
      submitButton.textContent = "Send Reset Link";

    }

  });

</script>
