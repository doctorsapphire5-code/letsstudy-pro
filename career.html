<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Careers | LetsStudy Pro</title>

<meta
  name="description"
  content="Explore careers, skills, education requirements, industries and professional opportunities on LetsStudy Pro."
>

<meta
  name="robots"
  content="index,follow"
>

<link
  rel="icon"
  href="/favicon.ico"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#f5f7fb;
  color:#172033;
  line-height:1.5;
}


/* ================= HEADER ================= */

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 6%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.header-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.header-btn{
  border:0;
  background:#2563eb;
  color:#fff;

  padding:10px 16px;
  border-radius:9px;

  cursor:pointer;
  font-weight:600;
}

.header-btn:hover{
  background:#1d4ed8;
}


/* ================= HERO ================= */

.hero{
  padding:65px 6%;

  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #ffffff
    );

  border-bottom:1px solid #e5e7eb;
}

.hero-inner{
  max-width:1250px;
  margin:auto;
}

.hero h1{
  font-size:42px;
  margin-bottom:12px;
}

.hero p{
  max-width:750px;
  color:#64748b;
  font-size:17px;
}


/* ================= CONTAINER ================= */

.container{
  width:88%;
  max-width:1250px;
  margin:30px auto 60px;
}


/* ================= FILTERS ================= */

.filters{
  background:#fff;

  padding:18px;

  border-radius:15px;

  display:grid;

  grid-template-columns:
    2fr
    1fr
    1fr
    1fr;

  gap:12px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.06);

  margin-bottom:25px;
}

.search-box{
  position:relative;
}

.search-box i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
}

input,
select{

  width:100%;

  padding:12px 13px;

  border:
    1px solid
    #dbe1e8;

  border-radius:9px;

  background:#fff;

  outline:none;

  font-size:14px;
}

.search-box input{
  padding-left:40px;
}

input:focus,
select:focus{
  border-color:#2563eb;
  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.1);
}


/* ================= RESULT INFO ================= */

.result-info{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:18px;

  color:#64748b;
  font-size:14px;
}


/* ================= GRID ================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(280px,1fr)
    );

  gap:20px;
}


/* ================= CARD ================= */

.card{
  background:#fff;

  border-radius:16px;

  overflow:hidden;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.07);

  transition:
    transform .2s,
    box-shadow .2s;
}

.card:hover{
  transform:translateY(-4px);

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.1);
}

.cover{
  height:160px;

  background:
    linear-gradient(
      135deg,
      #dbeafe,
      #eef2ff
    );

  overflow:hidden;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.content{
  padding:18px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:10px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;

  padding:5px 9px;

  border-radius:20px;

  background:#eef2ff;
  color:#4338ca;

  font-size:11px;
  font-weight:700;
}

.badge.featured{
  background:#fef3c7;
  color:#b45309;
}

.badge.verified{
  background:#dcfce7;
  color:#15803d;
}

.title{
  font-size:20px;
  font-weight:800;
  margin-bottom:7px;
}

.muted{
  color:#64748b;
  font-size:14px;
  margin:6px 0;
}

.description{
  color:#475569;
  font-size:14px;

  margin-top:12px;

  display:
    -webkit-box;

  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;

  overflow:hidden;
}

.card-footer{
  display:flex;

  justify-content:
    space-between;

  align-items:center;

  margin-top:18px;
}

.view-btn{
  border:0;

  background:#2563eb;
  color:#fff;

  padding:10px 14px;

  border-radius:9px;

  cursor:pointer;

  font-weight:600;
}

.view-btn:hover{
  background:#1d4ed8;
}


/* ================= EMPTY ================= */

.empty{
  grid-column:1/-1;

  text-align:center;

  padding:80px 20px;

  color:#64748b;
}

.empty i{
  margin-bottom:15px;
}

.empty h3{
  color:#172033;
  margin-bottom:7px;
}


/* ================= MODAL ================= */

.modal{
  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.65);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:750px;

  max-height:90vh;

  overflow:auto;

  background:#fff;

  border-radius:18px;

  padding:25px;

  position:relative;
}

.modal-head{
  display:flex;

  justify-content:
    space-between;

  align-items:center;

  margin-bottom:18px;
}

.modal-head h2{
  font-size:22px;
}

.close{
  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:#f1f5f9;

  cursor:pointer;

  font-size:18px;
}

.close:hover{
  background:#e2e8f0;
}


/* ================= DETAILS ================= */

.detail-cover{
  width:100%;
  height:220px;

  object-fit:cover;

  border-radius:13px;
}

.detail-title{
  font-size:30px;
  font-weight:800;

  margin-top:18px;
}

.detail-section{
  margin-top:25px;
}

.detail-section h3{
  font-size:18px;
  margin-bottom:8px;
}

.detail-section p{
  color:#475569;
  line-height:1.7;
}

.info-list{
  display:grid;
  gap:10px;
}

.info-row{
  display:flex;
  gap:8px;
}

.info-row strong{
  min-width:130px;
}

.actions{
  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:25px;
}

.action{
  display:inline-flex;

  align-items:center;

  gap:7px;

  text-decoration:none;

  padding:11px 15px;

  border-radius:9px;

  background:#2563eb;

  color:#fff;

  font-weight:600;
}

.action:hover{
  background:#1d4ed8;
}


/* ================= FOOTER ================= */

footer{
  background:#fff;

  border-top:
    1px solid
    #e5e7eb;

  padding:30px 6%;

  text-align:center;

  color:#64748b;

  font-size:14px;
}


/* ================= RESPONSIVE ================= */

@media(max-width:900px){

  .filters{
    grid-template-columns:
      1fr 1fr;
  }

}

@media(max-width:650px){

  header{
    padding:14px 5%;
  }

  .hero{
    padding:45px 5%;
  }

  .hero h1{
    font-size:31px;
  }

  .container{
    width:92%;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .result-info{
    align-items:flex-start;
    gap:10px;
    flex-direction:column;
  }

  .detail-title{
    font-size:25px;
  }

  .detail-cover{
    height:170px;
  }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <div class="header-actions">

    <button
      class="header-btn"
      onclick="location.href='index.html'"
    >

      <i class="fa-solid fa-house"></i>

      Home

    </button>

  </div>

</header>



<!-- ================= HERO ================= -->

<section class="hero">

  <div class="hero-inner">

    <h1>
      Explore Careers
    </h1>

    <p>
      Discover career paths, skills,
      education requirements, industries
      and professional opportunities.
    </p>

  </div>

</section>



<!-- ================= MAIN ================= -->

<main class="container">


  <!-- FILTERS -->

  <div class="filters">


    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        id="search"
        type="search"
        placeholder="Search careers..."
        autocomplete="off"
      >

    </div>


    <select id="category">

      <option value="">
        All Categories
      </option>

    </select>


    <select id="field">

      <option value="">
        All Fields
      </option>

    </select>


    <select id="industry">

      <option value="">
        All Industries
      </option>

    </select>


  </div>


  <!-- RESULT COUNT -->

  <div class="result-info">

    <span id="resultCount">
      Loading careers...
    </span>

  </div>


  <!-- CAREER GRID -->

  <div
    id="careerGrid"
    class="grid"
  >

    <div class="empty">

      <i
        class="
          fa-solid
          fa-spinner
          fa-spin
        "
        style="font-size:40px"
      ></i>

      <p>
        Loading careers...
      </p>

    </div>

  </div>


</main>



<!-- ================= MODAL ================= -->

<div
  id="modal"
  class="modal"
>

  <div
    id="modalContent"
    class="modal-box"
  ></div>

</div>



<!-- ================= FOOTER ================= -->

<footer>

  <p>
    © 2026 LetsStudy Pro.
    Explore knowledge, skills and opportunities.
  </p>

</footer>



<script>

/* =========================================================
   LETSSTUDY PRO
   PUBLIC CAREER API ENGINE
========================================================= */


const API_BASE =
  "/api/data";

const COLLECTION =
  "careers";


let careers = [];

let filteredCareers = [];



/* =========================================================
   DOM
========================================================= */

const grid =
  document.getElementById(
    "careerGrid"
  );

const search =
  document.getElementById(
    "search"
  );

const category =
  document.getElementById(
    "category"
  );

const field =
  document.getElementById(
    "field"
  );

const industry =
  document.getElementById(
    "industry"
  );

const resultCount =
  document.getElementById(
    "resultCount"
  );

const modal =
  document.getElementById(
    "modal"
  );

const modalContent =
  document.getElementById(
    "modalContent"
  );



/* =========================================================
   LOAD CAREERS FROM API
========================================================= */

async function loadCareers(){

  try{

    showLoading();


    const response =
      await fetch(
        `${API_BASE}?collection=${COLLECTION}&limit=100`,
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const result =
      await response.json();


    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "API request failed"
      );

    }


    careers =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    /*
      Public visibility.
    */

    careers =
      careers.filter(
        career => {

          if(
            career.status ===
              undefined ||
            career.status ===
              null ||
            career.status ===
              ""
          ){

            return true;

          }


          return (
            career.status ===
              "published" ||

            career.status ===
              "active"
          );

        }
      );


    filteredCareers =
      [...careers];


    buildFilters();

    renderCareers();


  }catch(error){

    console.error(
      "CAREER API ERROR:",
      error
    );


    showError();

  }

}



/* =========================================================
   LOADING
========================================================= */

function showLoading(){

  grid.innerHTML = `

    <div class="empty">

      <i
        class="
          fa-solid
          fa-spinner
          fa-spin
        "
        style="font-size:40px"
      ></i>

      <p>
        Loading careers...
      </p>

    </div>

  `;


  resultCount.textContent =
    "Loading careers...";

}



/* =========================================================
   ERROR
========================================================= */

function showError(){

  grid.innerHTML = `

    <div class="empty">

      <i
        class="
          fa-solid
          fa-triangle-exclamation
        "
        style="font-size:40px"
      ></i>

      <h3>
        Unable to load careers
      </h3>

      <p>
        Please try again later.
      </p>

      <button
        class="view-btn"
        style="margin-top:15px"
        onclick="loadCareers()"
      >

        <i class="fa-solid fa-rotate"></i>

        Try Again

      </button>

    </div>

  `;


  resultCount.textContent =
    "Unable to load careers.";

}



/* =========================================================
   BUILD FILTERS
========================================================= */

function buildFilters(){

  const categories =
    uniqueValues(
      careers,
      "category"
    );


  const fields =
    uniqueValues(
      careers,
      "field",
      "studyField",
      "subject"
    );


  const industries =
    uniqueValues(
      careers,
      "industry"
    );


  fillSelect(
    category,
    categories,
    "All Categories"
  );


  fillSelect(
    field,
    fields,
    "All Fields"
  );


  fillSelect(
    industry,
    industries,
    "All Industries"
  );

}



/* =========================================================
   UNIQUE VALUES
========================================================= */

function uniqueValues(
  list,
  ...keys
){

  const values = [];


  list.forEach(
    item => {

      keys.forEach(
        key => {

          const value =
            item[key];


          if(
            value &&
            !Array.isArray(value) &&
            typeof value !==
              "object"
          ){

            values.push(
              String(value)
            );

          }

        }
      );

    }
  );


  return [
    ...new Set(values)
  ].sort(
    (a,b) =>
      a.localeCompare(b)
  );

}



/* =========================================================
   FILL SELECT
========================================================= */

function fillSelect(
  select,
  values,
  firstLabel
){

  if(!select){
    return;
  }


  select.innerHTML =
    `
      <option value="">
        ${escapeHTML(firstLabel)}
      </option>
    `;


  values.forEach(
    value => {

      select.innerHTML += `

        <option
          value="${escapeAttr(value)}"
        >

          ${escapeHTML(value)}

        </option>

      `;

    }
  );

}



/* =========================================================
   FILTER
========================================================= */

function filterCareers(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const categoryValue =
    category.value;


  const fieldValue =
    field.value;


  const industryValue =
    industry.value;


  filteredCareers =
    careers.filter(
      career => {


        const text = [

          career.title,

          career.name,

          career.description,

          career.shortDescription,

          career.category,

          career.field,

          career.studyField,

          career.subject,

          career.industry,

          career.skills,

          career.education,

          career.requirements,

          career.salary,

          career.location

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        const matchesSearch =
          !keyword ||
          text.includes(
            keyword
          );


        const careerField =
          career.field ||
          career.studyField ||
          career.subject ||
          "";


        const matchesCategory =
          !categoryValue ||
          career.category ===
            categoryValue;


        const matchesField =
          !fieldValue ||
          careerField ===
            fieldValue;


        const matchesIndustry =
          !industryValue ||
          career.industry ===
            industryValue;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesField &&
          matchesIndustry
        );

      }
    );


  renderCareers();

}



/* =========================================================
   RENDER
========================================================= */

function renderCareers(){

  if(
    !filteredCareers.length
  ){

    grid.innerHTML = `

      <div class="empty">

        <i
          class="
            fa-solid
            fa-briefcase
          "
          style="font-size:40px"
        ></i>

        <h3>
          No careers found
        </h3>

        <p>
          Try another search or filter.
        </p>

      </div>

    `;


    resultCount.textContent =
      "0 careers found";


    return;

  }


  grid.innerHTML =
    filteredCareers
      .map(
        createCareerCard
      )
      .join("");


  resultCount.textContent =
    `${filteredCareers.length} career${
      filteredCareers.length === 1
        ? ""
        : "s"
    } found`;

}



/* =========================================================
   CAREER CARD
========================================================= */

function createCareerCard(
  career
){

  const id =
    career.id ||
    career.documentId ||
    "";


  const title =
    career.title ||
    career.name ||
    "Career";


  const description =
    career.shortDescription ||
    career.description ||
    "Explore this career path.";


  const image =
    safeImage(
      career.image ||
      career.coverImage ||
      career.thumbnail
    );


  const category =
    career.category ||
    "Career";


  const careerField =
    career.field ||
    career.studyField ||
    career.subject ||
    "";


  const industry =
    career.industry ||
    "";


  return `

    <article
      class="card"
      data-id="${escapeAttr(id)}"
    >

      <div class="cover">

        <img
          src="${image}"
          alt="${escapeAttr(title)}"
          loading="lazy"
          onerror="
            this.src='https://via.placeholder.com/800x400?text=Career';
          "
        >

      </div>


      <div class="content">


        <div class="badges">

          ${
            career.featured === true
              ? `
                <span class="badge featured">

                  <i
                    class="fa-solid fa-star"
                  ></i>

                  Featured

                </span>
              `
              : ""
          }


          ${
            career.verified === true
              ? `
                <span class="badge verified">

                  <i
                    class="fa-solid fa-circle-check"
                  ></i>

                  Verified

                </span>
              `
              : ""
          }

        </div>


        <h2 class="title">

          ${escapeHTML(title)}

        </h2>


        <div class="muted">

          <i
            class="fa-solid fa-layer-group"
          ></i>

          ${escapeHTML(category)}

        </div>


        ${
          careerField
            ? `

              <div class="muted">

                <i
                  class="fa-solid fa-graduation-cap"
                ></i>

                ${escapeHTML(
                  careerField
                )}

              </div>

            `
            : ""
        }


        ${
          industry
            ? `

              <div class="muted">

                <i
                  class="fa-solid fa-industry"
                ></i>

                ${escapeHTML(
                  industry
                )}

              </div>

            `
            : ""
        }


        <p class="description">

                    ${escapeHTML(
            description
          )}

        </p>


        <div class="card-footer">

          <span class="muted">

            ${
              category
                ? escapeHTML(category)
                : "Career"
            }

          </span>


          <button
            class="view-btn"
            onclick="openCareer('${escapeAttr(
              career.id
            )}')"
          >

            View Career

            <i class="fa-solid fa-arrow-right"></i>

          </button>

        </div>

      </div>

    </article>

  `;

}


/* ================================
   OPEN CAREER
================================ */

window.openCareer = function(id){

  const career =
    careers.find(
      item => item.id === id
    );

  if(!career){

    return;

  }


  const title =
    career.title ||
    career.name ||
    "Career";


  const description =
    career.description ||
    career.shortDescription ||
    "No description available.";


  const category =
    career.category ||
    career.field ||
    "Career";


  const education =
    career.education ||
    career.requiredEducation ||
    "";


  const skills =
    career.skills ||
    career.requiredSkills ||
    "";


  const salary =
    career.salary ||
    career.salaryRange ||
    "";


  const website =
    career.website ||
    career.link ||
    "";


  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <div class="modal-head">

      <h2>
        Career Details
      </h2>

      <button
        class="close"
        onclick="closeModal()"
        aria-label="Close"
      >

        <i class="fa-solid fa-xmark"></i>

      </button>

    </div>


    ${
      career.image
      ? `
        <img
          class="detail-image"
          src="${safeImage(
            career.image
          )}"
          alt="${escapeAttr(title)}"
          onerror="this.style.display='none'"
        >
      `
      : ""
    }


    <h2 class="detail-title">

      ${escapeHTML(title)}

    </h2>


    <div class="badges">

      <span class="badge">

        ${escapeHTML(category)}

      </span>

    </div>


    <div class="detail-section">

      <h3>
        About This Career
      </h3>

      <p>

        ${escapeHTML(description)}

      </p>

    </div>


    ${
      education
      ? `
        <div class="detail-section">

          <h3>
            Education
          </h3>

          <p>

            ${escapeHTML(
              education
            )}

          </p>

        </div>
      `
      : ""
    }


    ${
      skills
      ? `
        <div class="detail-section">

          <h3>
            Required Skills
          </h3>

          <p>

            ${formatList(
              skills
            )}

          </p>

        </div>
      `
      : ""
    }


    ${
      salary
      ? `
        <div class="detail-section">

          <h3>
            Salary
          </h3>

          <p>

            ${escapeHTML(
              salary
            )}

          </p>

        </div>
      `
      : ""
    }


    <div class="actions">

      ${
        website
        ? `
          <a
            class="action"
            href="${safeLink(
              website
            )}"
            target="_blank"
            rel="noopener noreferrer"
          >

            <i class="fa-solid fa-globe"></i>

            Learn More

          </a>
        `
        : ""
      }

    </div>

  `;


  document
    .getElementById("modal")
    .classList.add("show");

};


/* ================================
   CLOSE MODAL
================================ */

window.closeModal = function(){

  document
    .getElementById("modal")
    .classList.remove("show");

};


/* ================================
   CLOSE OUTSIDE
================================ */

window.closeOutside = function(event){

  if(
    event.target ===
    document.getElementById("modal")
  ){

    closeModal();

  }

};


/* ================================
   HELPERS
================================ */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(value){

  return escapeHTML(value);

}


function safeImage(url){

  if(
    !url ||
    typeof url !== "string"
  ){

    return "";

  }

  return url;

}


function safeLink(url){

  if(
    !url ||
    typeof url !== "string"
  ){

    return "#";

  }


  if(
    url.startsWith("https://") ||
    url.startsWith("http://")
  ){

    return url;

  }


  return "#";

}


function formatList(value){

  if(
    Array.isArray(value)
  ){

    return value
      .map(
        item =>
          escapeHTML(item)
      )
      .join(", ");

  }


  if(
    typeof value === "string"
  ){

    return escapeHTML(value);

  }


  return "Not specified.";

}


/* ================================
   API
================================ */

async function loadCareers(){

  try{

    grid.innerHTML = `

      <div class="empty">

        <i class="
          fa-solid
          fa-spinner
          fa-spin
        "></i>

        <p>
          Loading careers...
        </p>

      </div>

    `;


    const response =
      await fetch(
        "/api/data?collection=careers&limit=100",
        {
          method: "GET",
          headers: {
            "Accept":
              "application/json"
          },
          cache: "no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        `API error: ${response.status}`
      );

    }


    const json =
      await response.json();


    if(
      !json.success
    ){

      throw new Error(
        json.error ||
        "Unable to load careers"
      );

    }


    careers =
      Array.isArray(
        json.results
      )
      ? json.results
      : [];


    buildFilters();

    render();


  }catch(error){

    console.error(
      "CAREERS API ERROR:",
      error
    );


    grid.innerHTML = `

      <div class="empty">

        <i class="
          fa-solid
          fa-triangle-exclamation
        "></i>

        <h3>
          Unable to load careers
        </h3>

        <p>
          Please try again later.
        </p>

        <button
          class="view-btn"
          onclick="loadCareers()"
          style="margin-top:15px"
        >

          Try Again

        </button>

      </div>

    `;

  }

}

/* ================================

================================ */

const params =
  new URLSearchParams(
    window.location.search
  );


const documentId =
  params.get(
    "documentId"
  );


const id =
  params.get("id");


if(
  documentId ||
  id
){

  const careerId =
    documentId ||
    id;


  /*
   * Wait for API data before
   * opening the selected career.
   */

  const originalLoad =
    loadCareers;


  loadCareers =
  async function(){

    await originalLoad();


    if(
      careerId
    ){

      openCareer(
        careerId
      );

    }

  };

}

loadCareers();
