<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Career Opportunity | LetsStudy Pro</title>
  <meta name="description" content="Explore career opportunities on LetsStudy Pro.">
  <meta name="robots" content="index, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, sans-serif;
      background: #f6f8fb;
      color: #172033;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .navbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid #e8ebf0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      color: #155eef;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      font-size: 14px;
      font-weight: 600;
      color: #536078;
    }

    .nav-links a:hover {
      color: #155eef;
    }

    .hero {
      background: linear-gradient(135deg, #155eef, #0b4acb);
      color: white;
      padding: 42px 6%;
    }

    .hero-inner {
      max-width: 1150px;
      margin: auto;
    }

    .breadcrumb {
      font-size: 13px;
      opacity: .85;
      margin-bottom: 25px;
    }

    .career-head {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .company-logo {
      width: 82px;
      height: 82px;
      border-radius: 16px;
      background: white;
      object-fit: contain;
      padding: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
    }

    .career-head h1 {
      font-size: 32px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .company {
      font-size: 15px;
      opacity: .92;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .badge {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.2);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .container {
      max-width: 1150px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 25px;
    }

    .card {
      background: white;
      border: 1px solid #e8ebf0;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(16,24,40,.04);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #111827;
    }

    .short-description {
      color: #5c667a;
      margin-bottom: 20px;
    }

    .description {
      white-space: pre-line;
      color: #4c566b;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .info {
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
    }

    .info small {
      display: block;
      color: #7b8496;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .info strong {
      font-size: 14px;
    }

    ul {
      padding-left: 20px;
      color: #4c566b;
    }

    li {
      margin-bottom: 8px;
    }

    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill {
      background: #eef4ff;
      color: #155eef;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .apply-card {
      position: sticky;
      top: 90px;
    }

    .salary {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      margin: 10px 0 20px;
    }

    .apply-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #155eef;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .apply-btn:hover {
      background: #0b4acb;
      transform: translateY(-1px);
    }

    .save-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: white;
      border: 1px solid #d9dee8;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .deadline {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #fff7ed;
      color: #c2410c;
      font-size: 13px;
      font-weight: 600;
    }

    .company-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .company-box img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid #eee;
    }

    .loading,
    .error {
      max-width: 700px;
      margin: 80px auto;
      text-align: center;
      padding: 30px;
    }

    .loading i {
      font-size: 30px;
      color: #155eef;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #7b8496;
      font-size: 13px;
    }

    @media(max-width: 800px) {
      .nav-links {
        display: none;
      }

      .container {
        grid-template-columns: 1fr;
      }

      .apply-card {
        position: static;
      }

      .career-head {
        align-items: flex-start;
      }

      .career-head h1 {
        font-size: 25px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="logo">
      LetsStudy Pro
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="careers.html">Careers</a>
      <a href="scholarships.html">Scholarships</a>
    </div>
  </nav>


  <!-- CONTENT -->
  <div id="page">

    <div class="loading">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <p>Loading career...</p>
    </div>

  </div>


  <footer>
    © 2026 LetsStudy Pro. All rights reserved.
  </footer>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc,
      updateDoc,
      increment
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    /* =========================
       GET CAREER ID
    ========================= */

    const params = new URLSearchParams(location.search);

    const careerId =
      params.get("careerId") ||
      params.get("id");


    const page = document.getElementById("page");


    if (!careerId) {

      page.innerHTML = `
        <div class="error">
          <h2>Career Not Found</h2>
          <p>The career ID is missing from the URL.</p>
          <br>
          <a href="careers.html">
            ← Back to Careers
          </a>
        </div>
      `;

      throw new Error("Missing careerId");
    }


    /* =========================
       HELPERS
    ========================= */

    function escapeHTML(value = "") {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function listHTML(items) {

      if (!Array.isArray(items) || !items.length) {

        return `<p class="description">
          No information provided.
        </p>`;
      }

      return `
        <ul>
          ${items.map(item =>
            `<li>${escapeHTML(item)}</li>`
          ).join("")}
        </ul>
      `;
    }


    function skillsHTML(skills) {

      if (!Array.isArray(skills) || !skills.length) {
        return `<span class="description">Not specified</span>`;
      }

      return `
        <div class="skill-list">
          ${skills.map(skill =>
            `<span class="skill">${escapeHTML(skill)}</span>`
          ).join("")}
        </div>
      `;
    }


    function formatDate(value) {

      if (!value) return "Not specified";

      let date;

      if (value?.toDate) {
        date = value.toDate();
      } else {
        date = new Date(value);
      }

      if (isNaN(date)) return escapeHTML(value);

      return date.toLocaleDateString(
        "en-US",
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );
    }


    function salaryText(career) {

      const min = career.salaryMin;
      const max = career.salaryMax;
      const currency = career.currency || "TZS";

      if (!min && !max) {
        return "Salary not disclosed";
      }

      if (min && max) {
        return `${currency} ${Number(min).toLocaleString()} - ${Number(max).toLocaleString()}`;
      }

      return `${currency} ${Number(min || max).toLocaleString()}`;
    }


    /* =========================
       LOAD CAREER
    ========================= */

    async function loadCareer() {

      try {

        const careerRef =
          doc(db, "careers", careerId);

        const snapshot =
          await getDoc(careerRef);


        if (!snapshot.exists()) {

          page.innerHTML = `
            <div class="error">
              <h2>Career Not Found</h2>
              <p>This opportunity may have been removed.</p>
              <br>
              <a href="careers.html">
                ← Back to Careers
              </a>
            </div>
          `;

          return;
        }


        const career = snapshot.data();


        /* Increment views */

        updateDoc(careerRef, {
          views: increment(1)
        }).catch(() => {});


        renderCareer(career);


      } catch (error) {

        console.error(error);

        page.innerHTML = `
          <div class="error">
            <h2>Unable to Load Career</h2>
            <p>Please try again later.</p>
          </div>
        `;
      }
    }


    /* =========================
       RENDER CAREER
    ========================= */

    function renderCareer(career) {

      const logo =
        career.companyLogo ||
        "https://via.placeholder.com/100?text=Company";


      page.innerHTML = `

        <!-- HERO -->

        <section class="hero">

          <div class="hero-inner">

            <div class="breadcrumb">
              <a href="careers.html">Careers</a>
              /
              ${escapeHTML(career.category || "Opportunity")}
            </div>

            <div class="career-head">

              <img
                class="company-logo"
                src="${escapeHTML(logo)}"
                alt="${escapeHTML(career.companyName || "Company")}"
              >

              <div>

                <h1>
                  ${escapeHTML(career.title || "Career Opportunity")}
                </h1>

                <div class="company">
                  ${escapeHTML(
                    career.companyName ||
                    "Company"
                  )}
                </div>

                <div class="badges">

                  ${career.type ? `
                    <span class="badge">
                      <i class="fa-solid fa-briefcase"></i>
                      ${escapeHTML(career.type)}
                    </span>
                  ` : ""}

                  ${career.workMode ? `
                    <span class="badge">
                      <i class="fa-solid fa-location-dot"></i>
                      ${escapeHTML(career.workMode)}
                    </span>
                  ` : ""}

                  ${career.experienceLevel ? `
                    <span class="badge">
                      ${escapeHTML(career.experienceLevel)}
                    </span>
                  ` : ""}

                </div>

              </div>

            </div>

          </div>

        </section>


        <!-- MAIN -->

        <main class="container">

          <div>

            <!-- OVERVIEW -->

            <section class="card">

              <h2>Job Overview</h2>

              <p class="short-description">
                ${escapeHTML(
                  career.shortDescription || ""
                )}
              </p>

              <div class="description">
                ${escapeHTML(
                  career.description || ""
                )}
              </div>

            </section>


            <!-- JOB DETAILS -->

            <section class="card">

              <h2>Job Details</h2>

              <div class="info-grid">

                <div class="info">
                  <small>Location</small>
                  <strong>
                    ${escapeHTML(career.location || "Not specified")}
                  </strong>
                </div>

                <div class="info">
                  <small>Country</small>
                  <strong>
                    ${escapeHTML(career.country || "Not specified")}
                  </strong>
                </div>

                <div class="info">
                  <small>Industry</small>
                  <strong>
                    ${escapeHTML(career.industry || "Not specified")}
                  </strong>
                </div>

                <div class="info">
                  <small>Experience</small>
                  <strong>
                    ${escapeHTML(career.experienceLevel || "Not specified")}
                  </strong>
                </div>

                <div class="info">
                  <small>Education</small>
                  <strong>
                    ${escapeHTML(career.educationLevel || "Not specified")}
                  </strong>
                </div>

                <div class="info">
                  <small>Work Mode</small>
                  <strong>
                    ${escapeHTML(career.workMode || "Not specified")}
                  </strong>
                </div>

              </div>

            </section>


            <!-- SKILLS -->

            <section class="card">

              <h2>Required Skills</h2>

              ${skillsHTML(career.skills)}

            </section>


            <!-- REQUIREMENTS -->

            <section class="card">

              <h2>Requirements</h2>

              ${listHTML(career.requirements)}

            </section>


            <!-- RESPONSIBILITIES -->

            <section class="card">

              <h2>Responsibilities</h2>

              ${listHTML(career.responsibilities)}

            </section>


            <!-- BENEFITS -->

            <section class="card">

              <h2>Benefits</h2>

              ${listHTML(career.benefits)}

            </section>


            <!-- COMPANY -->

            <section class="card">

              <h2>About the Company</h2>

              <div class="company-box">

                <img
                  src="${escapeHTML(logo)}"
                  alt="Company Logo"
                >

                <div>

                  <strong>
                    ${escapeHTML(
                      career.companyName ||
                      "Company"
                    )}
                  </strong>

                  <p>
                    ${escapeHTML(
                      career.industry ||
                      "Industry"
                    )}
                  </p>

                </div>

              </div>

            </section>

          </div>


          <!-- SIDEBAR -->

          <aside>

            <div class="card apply-card">

              <h2>Apply for this Job</h2>

              <div class="salary">
                ${salaryText(career)}
              </div>

              <button
                class="apply-btn"
                onclick="applyNow()"
              >
                <i class="fa-solid fa-paper-plane"></i>
                Apply Now
              </button>

              <button
                class="save-btn"
                onclick="saveCareer()"
              >
                <i class="fa-regular fa-bookmark"></i>
                Save Job
              </button>

              <div class="deadline">

                <i class="fa-regular fa-clock"></i>

                Deadline:
                ${formatDate(career.deadline)}

              </div>

            </div>


            <div class="card">

              <h2>Quick Information</h2>

              <div class="info-grid">

                <div class="info">
                  <small>Category</small>
                  <strong>
                    ${escapeHTML(career.category || "-")}
                  </strong>
                </div>

                <div class="info">
                  <small>Applications</small>
                  <strong>
                    ${Number(
                      career.applicationsCount || 0
                    ).toLocaleString()}
                  </strong>
                </div>

              </div>

            </div>

          </aside>

        </main>
      `;
    }


    /* =========================
       APPLY
    ========================= */

    window.applyNow = function () {

      const careerRef =
        doc(db, "careers", careerId);


      getDoc(careerRef).then(snapshot => {

        if (!snapshot.exists()) return;

        const career = snapshot.data();

        if (!career.applicationUrl) {

          alert(
            "Application link is not available for this opportunity."
          );

          return;
        }


        updateDoc(careerRef, {
          applicationsCount: increment(1)
        }).catch(() => {});


        window.open(
          career.applicationUrl,
          "_blank",
          "noopener,noreferrer"
        );

      });

    };


    /* =========================
       SAVE CAREER
    ========================= */

    window.saveCareer = function () {

      const saved =
        JSON.parse(
          localStorage.getItem("savedCareers") || "[]"
        );


      if (!saved.includes(careerId)) {

        saved.push(careerId);

        localStorage.setItem(
          "savedCareers",
          JSON.stringify(saved)
        );

        alert("Career saved successfully.");

      } else {

        alert("This career is already saved.");

      }

    };


    /* =========================
       START
    ========================= */

    loadCareer();

  </script>

</body>
</html>
