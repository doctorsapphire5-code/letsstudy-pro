<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Careers | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;padding:18px 5%;position:sticky;top:0;z-index:10;
display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.logo{font-size:22px;font-weight:bold;color:#2563eb}
.container{max-width:1100px;margin:auto;padding:25px 15px}
.hero{background:#2563eb;color:white;padding:35px 25px;border-radius:18px;margin-bottom:20px}
.hero h1{margin:0 0 8px}
.search{width:100%;padding:15px;border:0;border-radius:10px;font-size:16px;margin-top:15px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
select{padding:11px;border:1px solid #ddd;border-radius:8px;background:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:#fff;border-radius:15px;padding:18px;box-shadow:0 3px 15px #0000000d}
.logoImg{width:55px;height:55px;object-fit:contain;border-radius:10px;background:#f1f5f9}
.card h3{margin:12px 0 6px}
.meta{color:#64748b;font-size:14px;line-height:1.7}
.tags span{display:inline-block;background:#eef2ff;color:#3730a3;
padding:5px 8px;border-radius:5px;margin:3px;font-size:12px}
.btn{display:inline-block;border:0;background:#2563eb;color:white;
padding:10px 15px;border-radius:8px;text-decoration:none;cursor:pointer;margin-top:10px}
.btn.secondary{background:#e2e8f0;color:#172033}
.featured{border:2px solid #f59e0b}
.badge{background:#f59e0b;color:white;padding:4px 8px;border-radius:5px;font-size:11px}
.empty{text-align:center;padding:50px;color:#64748b}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;
padding:20px;overflow:auto}
.modalBox{background:white;max-width:750px;margin:30px auto;padding:25px;border-radius:15px}
.close{float:right;font-size:25px;cursor:pointer}
.detail p{line-height:1.7}
.detail h3{margin-top:25px}
</style>
</head>

<body>

<header>
  <div class="logo">LetsStudy Pro</div>
  <a href="index.html">Home</a>
</header>

<main class="container">

<section class="hero">
  <h1>Find Your Next Career</h1>
  <p>Discover jobs, internships and career opportunities.</p>
  <input id="search" class="search"
    placeholder="Search job title, company, skills or location...">
</section>

<div class="filters">
  <select id="category">
    <option value="">All Categories</option>
  </select>

  <select id="type">
    <option value="">All Types</option>
  </select>

  <select id="workMode">
    <option value="">All Work Modes</option>
  </select>

  <select id="country">
    <option value="">All Countries</option>
  </select>
</div>

<div id="careers" class="grid"></div>

</main>

<!-- DETAILS MODAL -->
<div id="modal" class="modal">
  <div class="modalBox">
    <span class="close" onclick="closeModal()">×</span>
    <div id="details"></div>
  </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  increment
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================
   VARIABLES
========================= */

let careers = [];

const container = document.getElementById("careers");
const search = document.getElementById("search");
const category = document.getElementById("category");
const type = document.getElementById("type");
const workMode = document.getElementById("workMode");
const country = document.getElementById("country");


/* =========================
   LOAD CAREERS
========================= */

async function loadCareers(){

  try{

    const snap = await getDocs(collection(db,"careers"));

    careers = [];

    snap.forEach(d=>{

      const data = d.data();

      if(data.status === "published"){
        careers.push({
          id:d.id,
          ...data
        });
      }

    });

    setupFilters();
    render();

  }catch(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Failed to load careers.
      </div>
    `;

  }

}


/* =========================
   FILTER OPTIONS
========================= */

function setupFilters(){

  fillSelect(category,"category");
  fillSelect(type,"type");
  fillSelect(workMode,"workMode");
  fillSelect(country,"country");

}


function fillSelect(select,field){

  const values = [
    ...new Set(
      careers
      .map(c=>c[field])
      .filter(Boolean)
    )
  ];

  values.sort();

  values.forEach(value=>{

    const option=document.createElement("option");

    option.value=value;
    option.textContent=value;

    select.appendChild(option);

  });

}


/* =========================
   RENDER
========================= */

function render(){

  const q = search.value.toLowerCase();

  const filtered = careers.filter(c=>{

    const text = `
      ${c.title||""}
      ${c.companyName||""}
      ${c.location||""}
      ${c.skills||""}
      ${c.description||""}
    `.toLowerCase();

    return (

      text.includes(q) &&

      (!category.value ||
       c.category === category.value) &&

      (!type.value ||
       c.type === type.value) &&

      (!workMode.value ||
       c.workMode === workMode.value) &&

      (!country.value ||
       c.country === country.value)

    );

  });


  if(!filtered.length){

    container.innerHTML=`
      <div class="empty">
        <h3>No careers found</h3>
        <p>Try another search or filter.</p>
      </div>
    `;

    return;

  }


  container.innerHTML = filtered.map(c=>{

    const skills = Array.isArray(c.skills)
      ? c.skills
      : String(c.skills||"").split(",").filter(Boolean);

    return `

      <article class="card ${c.featured ? "featured":""}">

        ${c.featured ? `<span class="badge">FEATURED</span>`:""}

        <div style="margin-top:10px">

          <img
            class="logoImg"
            src="${c.companyLogo || "https://via.placeholder.com/100"}"
            onerror="this.src='https://via.placeholder.com/100'"
          >

        </div>

        <h3>${escapeHTML(c.title || "Untitled Career")}</h3>

        <strong>${escapeHTML(c.companyName || "")}</strong>

        <div class="meta">

          📍 ${escapeHTML(c.location || "Remote")}<br>

          🌍 ${escapeHTML(c.country || "")}<br>

          💼 ${escapeHTML(c.type || "")}<br>

          🏠 ${escapeHTML(c.workMode || "")}<br>

          🎓 ${escapeHTML(c.experienceLevel || "")}

        </div>

        <p>
          ${escapeHTML(
            c.shortDescription ||
            c.description ||
            ""
          ).substring(0,160)}...
        </p>

        <div class="tags">

          ${skills.slice(0,4).map(s=>
            `<span>${escapeHTML(s)}</span>`
          ).join("")}

        </div>

        <button
          class="btn secondary"
          onclick="viewCareer('${c.id}')">
          View Details
        </button>

        ${
          c.applicationUrl
          ?
          `<a
            class="btn"
            href="${c.applicationUrl}"
            target="_blank"
            onclick="applyCareer('${c.id}')">
            Apply Now
          </a>`
          :
          ""
        }

      </article>

    `;

  }).join("");

}


/* =========================
   VIEW CAREER
========================= */

window.viewCareer = async function(id){

  const career = careers.find(c=>c.id===id);

  if(!career)return;


  await updateDoc(
    doc(db,"careers",id),
    {
      views:increment(1)
    }
  ).catch(()=>{});


  const skills = Array.isArray(career.skills)
    ? career.skills
    : String(career.skills||"")
      .split(",")
      .filter(Boolean);


  document.getElementById("details").innerHTML = `

    <div class="detail">

      <img
        class="logoImg"
        src="${career.companyLogo || "https://via.placeholder.com/100"}">

      <h2>${escapeHTML(career.title||"")}</h2>

      <strong>${escapeHTML(career.companyName||"")}</strong>

      <p class="meta">

        📍 ${escapeHTML(career.location||"")}<br>
        🌍 ${escapeHTML(career.country||"")}<br>
        💼 ${escapeHTML(career.type||"")}<br>
        🏠 ${escapeHTML(career.workMode||"")}<br>
        📊 ${escapeHTML(career.experienceLevel||"")}<br>
        🎓 ${escapeHTML(career.educationLevel||"")}<br>

        💰 ${
          career.salaryMin
          ?
          `${career.currency||""}
           ${career.salaryMin} -
           ${career.salaryMax||""}`
          :
          "Salary not specified"
        }

      </p>

      <h3>About This Opportunity</h3>
      <p>${nl2br(career.description||"")}</p>

      <h3>Requirements</h3>
      <p>${nl2br(career.requirements||"")}</p>

      <h3>Responsibilities</h3>
      <p>${nl2br(career.responsibilities||"")}</p>

      <h3>Skills</h3>

      <div class="tags">

        ${skills.map(s=>
          `<span>${escapeHTML(s)}</span>`
        ).join("")}

      </div>

      <h3>Benefits</h3>
      <p>${nl2br(career.benefits||"")}</p>

      <h3>Application Deadline</h3>
      <p>${escapeHTML(career.deadline||"Not specified")}</p>

      ${
        career.applicationUrl
        ?
        `<a
          class="btn"
          href="${career.applicationUrl}"
          target="_blank"
          onclick="applyCareer('${career.id}')">
          Apply for this Position
        </a>`
        :
        `<p>No application link available.</p>`
      }

    </div>

  `;

  document.getElementById("modal").style.display="block";

};


/* =========================
   APPLICATION COUNT
========================= */

window.applyCareer = async function(id){

  await updateDoc(
    doc(db,"careers",id),
    {
      applicationsCount:increment(1)
    }
  ).catch(()=>{});

};


/* =========================
   CLOSE MODAL
========================= */

window.closeModal=function(){

  document.getElementById("modal").style.display="none";

};


document.getElementById("modal")
.addEventListener("click",e=>{

  if(e.target.id==="modal"){
    closeModal();
  }

});


/* =========================
   SEARCH + FILTER
========================= */

search.addEventListener("input",render);

category.addEventListener("change",render);

type.addEventListener("change",render);

workMode.addEventListener("change",render);

country.addEventListener("change",render);


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nl2br(value){

  return escapeHTML(value)
    .replace(/\n/g,"<br>");

}


/* =========================
   START
========================= */

loadCareers();

</script>

</body>
</html>
