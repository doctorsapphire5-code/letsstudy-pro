<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Career Opportunities | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
header h1{flex:1;margin:0;font-size:18px}
button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:600}
.back{background:#eef2ff;color:#1d4ed8}
.primary{background:#2563eb;color:#fff}
main{max-width:1150px;margin:auto;padding:18px}
.hero{background:linear-gradient(135deg,#172554,#2563eb);color:#fff;border-radius:18px;padding:28px;margin-bottom:16px}
.hero h2{margin:0 0 8px;font-size:28px}
.hero p{margin:0;color:#dbeafe;font-size:13px}
.search{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:16px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px}
input,select{width:100%;padding:11px;border:1px solid #dbe1e8;border-radius:9px;background:#fff;outline:none}
.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.job{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:16px;transition:.2s}
.job:hover{transform:translateY(-2px);box-shadow:0 8px 25px #0000000d}
.logo{width:48px;height:48px;border-radius:12px;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.job h3{margin:0 0 6px;font-size:16px}
.company{font-size:12px;color:#475569;margin-bottom:10px}
.info{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{background:#f1f5f9;color:#475569;padding:5px 8px;border-radius:20px;font-size:9px}
.deadline{font-size:10px;color:#64748b;margin:10px 0}
.empty{text-align:center;padding:55px;color:#64748b;background:#fff;border-radius:15px;border:1px solid #e5e7eb}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:100}
.modal.show{display:flex}
.box{background:#fff;width:100%;max-width:650px;max-height:92vh;overflow:auto;border-radius:17px;padding:20px}
.head{display:flex;gap:10px;align-items:center;margin-bottom:15px}
.head h2{flex:1;margin:0;font-size:20px}
.description{font-size:13px;line-height:1.7;color:#475569;white-space:pre-wrap}
.section{margin-top:18px}
.section h4{margin:0 0 7px;font-size:13px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.actions{display:flex;gap:8px;margin-top:18px}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:200;font-size:12px}
.toast.show{display:block}
@media(max-width:900px){.jobs{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.jobs,.search{grid-template-columns:1fr}}
</style></head><body><header><button class="back" onclick="history.back()">←</button>

<h1>💼 Career</h1><button class="back" onclick="location.href='dashboard.html'">
Dashboard
</button></header><main><section class="hero"><h2>Build Your Future 🚀</h2><p>
Discover jobs, internships, remote opportunities and career opportunities.
</p></section><section class="search"><input
id="search"
placeholder="Search jobs, company or location..."
oninput="render()">

<select id="type" onchange="render()"><option value="all">All Job Types</option>
<option value="full-time">Full Time</option>
<option value="part-time">Part Time</option>
<option value="internship">Internship</option>
<option value="contract">Contract</option>
<option value="remote">Remote</option></select><select id="category" onchange="render()"><option value="all">All Categories</option>
<option value="Technology">Technology</option>
<option value="Education">Education</option>
<option value="Business">Business</option>
<option value="Marketing">Marketing</option>
<option value="Finance">Finance</option>
<option value="Engineering">Engineering</option></select></section><div id="jobs" class="jobs"><div class="empty">
Loading career opportunities...
</div></div></main><!-- JOB DETAILS --><div id="modal" class="modal"><div class="box"><div class="head"><h2 id="modalTitle">Job</h2><button class="back" onclick="closeJob()">✕</button>

</div><div id="modalCompany"></div><div id="modalMeta" class="meta"></div><div class="section"><h4>Description</h4><div id="modalDescription" class="description"></div></div><div class="section"><h4>Requirements</h4><div id="modalRequirements" class="description"></div></div><div class="section"><h4>Salary</h4><div id="modalSalary" class="description"></div></div><div class="section"><h4>Application Deadline</h4><div id="modalDeadline" class="description"></div></div><div class="actions"><button
id="applyBtn"
class="primary">
Apply Now
</button>

<button
class="back"
onclick="closeJob()">
Close
</button>

</div></div></div><div id="toast" class="toast"></div><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getFirestore,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

let jobs=[];


/* =========================================
 LOAD
========================================= */

loadJobs();


async function loadJobs(){

const container=
document.getElementById("jobs");

try{

const snap=
await getDocs(
collection(db,"careers")
);

jobs=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);


/* Only active jobs */

jobs=
jobs.filter(
x=>x.status==="active"
);


/* Newest first */

jobs.sort(
(a,b)=>
getTime(b.createdAt)-
getTime(a.createdAt)
);

render();

}catch(error){

console.error(error);

container.innerHTML=`

<div class="empty">

<div style="font-size:40px">
⚠️
</div>

Unable to load career opportunities.

<br><br>

<button
class="primary"
onclick="location.reload()">

Try Again

</button>

</div>

`;

}

}


/* =========================================
 RENDER
========================================= */

window.render=function(){

const search=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const type=
document.getElementById("type")
.value;

const category=
document.getElementById("category")
.value;


const data=
jobs.filter(job=>{

const text=
`${job.title||""}
${job.company||""}
${job.location||""}
${job.category||""}`
.toLowerCase();

return(

text.includes(search) &&

(type==="all"||
job.type===type) &&

(category==="all"||
job.category===category)

);

});


const container=
document.getElementById("jobs");


if(!data.length){

container.innerHTML=`

<div class="empty"
style="grid-column:1/-1">

<div style="font-size:40px">
🔎
</div>

<strong>
No opportunities found
</strong>

<br>

Try another search or filter.

</div>

`;

return;

}


container.innerHTML=
data.map(job=>`

<article class="job">

<div class="logo">

${
job.logo
?
`<img
src="${safe(job.logo)}"
alt=""
onerror="this.style.display='none'">`
:
"💼"
}

</div>

<h3>
${esc(job.title||"Untitled Job")}
</h3>

<div class="company">
🏢 ${esc(job.company||"Company")}
</div>

<div class="info">

<span class="tag">
📍 ${esc(job.location||"Location not specified")}
</span>

<span class="tag">
💼 ${esc(job.type||"Job")}
</span>

${
job.category
?
`<span class="tag">
📚 ${esc(job.category)}
</span>`
:
""
}

</div>

<div class="deadline">

⏰ Deadline:
${esc(job.deadline||"Not specified")}

</div>

<button
class="primary"
onclick="openJob('${job.id}')">

View Opportunity

</button>

</article>

`).join("");

};


/* =========================================
 OPEN JOB
========================================= */

window.openJob=function(id){

const job=
jobs.find(
x=>x.id===id
);

if(!job)return;


document.getElementById(
"modalTitle"
).textContent=
job.title||"Career Opportunity";


document.getElementById(
"modalCompany"
).innerHTML=
`<strong>
🏢 ${esc(job.company||"")}
</strong>`;


document.getElementById(
"modalMeta"
).innerHTML=`

<span class="tag">
📍 ${esc(job.location||"Not specified")}
</span>

<span class="tag">
💼 ${esc(job.type||"Not specified")}
</span>

<span class="tag">
📚 ${esc(job.category||"General")}
</span>

`;


document.getElementById(
"modalDescription"
).textContent=
job.description||
"No description provided.";


document.getElementById(
"modalRequirements"
).textContent=
job.requirements||
"No specific requirements provided.";


document.getElementById(
"modalSalary"
).textContent=
job.salary||
"Not specified";


document.getElementById(
"modalDeadline"
).textContent=
job.deadline||
"Not specified";


const apply=
document.getElementById(
"applyBtn"
);


if(job.applyUrl){

apply.style.display=
"inline-block";

apply.onclick=()=>{

window.open(
job.applyUrl,
"_blank"
);

};

}else{

apply.style.display=
"none";

}


document.getElementById(
"modal"
).classList.add("show");

};


/* =========================================
 CLOSE
========================================= */

window.closeJob=function(){

document.getElementById(
"modal"
).classList.remove("show");

};


/* =========================================
 HELPERS
========================================= */

function getTime(timestamp){

if(!timestamp)
return 0;

try{

if(
typeof timestamp.toDate===
"function"
){

return timestamp
.toDate()
.getTime();

}

return new Date(timestamp)
.getTime();

}catch{

return 0;

}

}


function esc(value){

return String(
value??""
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function safe(value){

return String(value||"")
.replace(/"/g,"%22")
.replace(/'/g,"%27");

}

</script></body>
</html>
