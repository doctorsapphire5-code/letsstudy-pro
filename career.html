<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Career | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
height:65px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5%
}

.logo{
font-size:21px;
font-weight:800;
color:#2563eb
}

header a{
text-decoration:none;
color:#475569
}

.hero{
background:#111827;
color:#fff;
padding:45px 5%
}

.hero-inner{
max-width:1150px;
margin:auto;
display:grid;
grid-template-columns:1fr 330px;
gap:30px;
align-items:center
}

.company{
display:flex;
gap:15px;
align-items:center;
margin-bottom:20px
}

.company img{
width:65px;
height:65px;
border-radius:12px;
object-fit:cover;
background:#fff
}

.company-name{
font-weight:700
}

.hero h1{
font-size:38px;
line-height:1.2;
margin:0 0 15px
}

.short{
color:#cbd5e1;
line-height:1.7
}

.meta{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:20px
}

.meta span{
background:#ffffff12;
border:1px solid #ffffff1c;
padding:8px 10px;
border-radius:7px;
font-size:12px;
color:#e2e8f0
}

.apply-card{
background:#fff;
color:#172033;
padding:22px;
border-radius:14px;
box-shadow:0 12px 35px #0005
}

.salary{
font-size:24px;
font-weight:800;
margin-bottom:15px
}

.apply{
width:100%;
padding:14px;
border:0;
border-radius:8px;
background:#2563eb;
color:#fff;
font-weight:800;
cursor:pointer
}

.share{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #d8dee8;
border-radius:8px;
background:#fff;
cursor:pointer;
font-weight:700
}

main{
max-width:1150px;
margin:30px auto;
padding:0 15px
}

.layout{
display:grid;
grid-template-columns:2fr 1fr;
gap:22px
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:22px;
margin-bottom:20px
}

.card h2{
font-size:19px;
margin:0 0 18px
}

.description{
line-height:1.8;
color:#475569;
white-space:pre-line
}

.item{
padding:9px 0;
border-bottom:1px solid #eee;
line-height:1.7;
color:#475569
}

.item:last-child{
border-bottom:0
}

.item i{
color:#2563eb;
margin-right:8px
}

.skills{
display:flex;
flex-wrap:wrap;
gap:8px
}

.skill{
background:#eff6ff;
color:#1d4ed8;
padding:7px 10px;
border-radius:20px;
font-size:12px;
font-weight:700
}

.side-row{
display:flex;
justify-content:space-between;
gap:10px;
padding:11px 0;
border-bottom:1px solid #eee;
font-size:13px
}

.side-row span{
color:#64748b
}

.side-row strong{
text-align:right
}

.loading{
text-align:center;
padding:70px 20px;
color:#64748b
}

.error{
text-align:center;
padding:80px 20px
}

.featured{
display:inline-block;
background:#f59e0b;
color:#fff;
padding:6px 10px;
border-radius:20px;
font-size:11px;
font-weight:700;
margin-bottom:12px
}

@media(max-width:800px){

.hero-inner,
.layout{
grid-template-columns:1fr
}

.hero h1{
font-size:29px
}

}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<a href="careers.html">
<i class="fa fa-arrow-left"></i>
 Careers
</a>

</header>


<div id="app">

<div class="loading">
<i class="fa fa-spinner fa-spin"></i>
 Loading career...
</div>

</div>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getFirestore,
doc,
getDoc,
updateDoc,
increment
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */


// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* CAREER ID */

const params=
new URLSearchParams(location.search);

const careerId=
params.get("id");

const appBox=
document.getElementById("app");


/* ESCAPE */

function safe(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ARRAY / TEXT */

function listItems(value){

if(Array.isArray(value))
return value.filter(Boolean);

if(typeof value==="string"){

return value
.split("\n")
.map(x=>x.trim())
.filter(Boolean);

}

return [];

}


/* SALARY */

function salaryText(c){

const min=Number(c.salaryMin||0);
const max=Number(c.salaryMax||0);
const currency=c.currency||"TZS";

if(!min&&!max)
return "Salary not specified";

if(min&&max)
return `${currency} ${min.toLocaleString()} - ${max.toLocaleString()}`;

if(min)
return `${currency} ${min.toLocaleString()}+`;

return `${currency} ${max.toLocaleString()}`;

}


/* LOAD */

async function loadCareer(){

if(!careerId){

appBox.innerHTML=`
<div class="error">

<h2>Career Not Found</h2>

<p>No career ID was provided.</p>

<a href="careers.html">
Back to Careers
</a>

</div>`;

return;

}


try{

const ref=
doc(db,"careers",careerId);

const snap=
await getDoc(ref);


if(!snap.exists()){

appBox.innerHTML=`
<div class="error">

<h2>Career Not Found</h2>

<p>This job opportunity does not exist.</p>

</div>`;

return;

}


const c=snap.data();


/* STATUS */

if(c.status==="draft"){

appBox.innerHTML=`
<div class="error">

<h2>Position Unavailable</h2>

<p>This career opportunity has not been published.</p>

</div>`;

return;

}


/* DATA */

const logo=
c.companyLogo||
"https://via.placeholder.com/100?text=Company";


const skills=
listItems(c.skills);

const requirements=
listItems(c.requirements);

const responsibilities=
listItems(c.responsibilities);

const benefits=
listItems(c.benefits);


/* RENDER */

appBox.innerHTML=`

<section class="hero">

<div class="hero-inner">

<div>

${c.featured?`
<div class="featured">
<i class="fa fa-star"></i>
Featured Opportunity
</div>
`:``}


<div class="company">

<img
src="${safe(logo)}"
alt="${safe(c.companyName||"Company")}"
onerror="
this.src='https://via.placeholder.com/100?text=Company'
">


<div>

<div class="company-name">
${safe(c.companyName||"Company")}
</div>

<div style="
color:#94a3b8;
font-size:12px;
margin-top:5px">

${safe(c.industry||"Industry")}

</div>

</div>

</div>


<h1>
${safe(c.title||"Job Opportunity")}
</h1>


<p class="short">

${safe(
c.shortDescription||
"Explore this career opportunity."
)}

</p>


<div class="meta">

<span>
<i class="fa fa-location-dot"></i>
${safe(c.location||"Location not specified")}
</span>

<span>
<i class="fa fa-globe"></i>
${safe(c.country||"")}
</span>

<span>
<i class="fa fa-briefcase"></i>
${safe(c.type||"Job")}
</span>

<span>
<i class="fa fa-house"></i>
${safe(c.workMode||"On-site")}
</span>

<span>
<i class="fa fa-chart-line"></i>
${safe(c.experienceLevel||"Any Level")}
</span>

</div>

</div>


<div class="apply-card">

<div class="salary">
${salaryText(c)}
</div>

<div style="
font-size:13px;
color:#64748b;
margin-bottom:15px">

${c.deadline
?`Deadline: ${safe(formatDate(c.deadline))}`
:"No deadline specified"}

</div>


<button
class="apply"
onclick="applyNow()">

<i class="fa fa-paper-plane"></i>
Apply Now

</button>


<button
class="share"
onclick="shareCareer()">

<i class="fa fa-share-nodes"></i>
Share Opportunity

</button>

</div>

</div>

</section>


<main>

<div class="layout">


<div>

<div class="card">

<h2>
<i class="fa fa-file-lines"></i>
Job Description
</h2>

<div class="description">
${safe(c.description||"No description available.")}
</div>

</div>


<div class="card">

<h2>
<i class="fa fa-list-check"></i>
Responsibilities
</h2>

${responsibilities.length
?responsibilities.map(x=>`

<div class="item">

<i class="fa fa-check"></i>
${safe(x)}

</div>

`).join("")
:`
<p class="description">
Responsibilities have not been specified.
</p>
`}

</div>


<div class="card">

<h2>
<i class="fa fa-graduation-cap"></i>
Requirements
</h2>

${requirements.length
?requirements.map(x=>`

<div class="item">

<i class="fa fa-check-circle"></i>
${safe(x)}

</div>

`).join("")
:`
<p class="description">
Requirements have not been specified.
</p>
`}

</div>


<div class="card">

<h2>
<i class="fa fa-gift"></i>
Benefits
</h2>

${benefits.length
?benefits.map(x=>`

<div class="item">

<i class="fa fa-circle-check"></i>
${safe(x)}

</div>

`).join("")
:`
<p class="description">
Benefits have not been specified.
</p>
`}

</div>


<div class="card">

<h2>
<i class="fa fa-code"></i>
Skills
</h2>

<div class="skills">

${skills.length
?skills.map(x=>`

<span class="skill">
${safe(x)}
</span>

`).join("")
:`
<span class="skill">
Not specified
</span>
`}

</div>

</div>

</div>


<div>


<div class="card">

<h2>
Career Information
</h2>


<div class="side-row">
<span>Category</span>
<strong>${safe(c.category||"-")}</strong>
</div>


<div class="side-row">
<span>Industry</span>
<strong>${safe(c.industry||"-")}</strong>
</div>


<div class="side-row">
<span>Type</span>
<strong>${safe(c.type||"-")}</strong>
</div>


<div class="side-row">
<span>Work Mode</span>
<strong>${safe(c.workMode||"-")}</strong>
</div>


<div class="side-row">
<span>Experience</span>
<strong>${safe(c.experienceLevel||"-")}</strong>
</div>


<div class="side-row">
<span>Education</span>
<strong>${safe(c.educationLevel||"-")}</strong>
</div>


<div class="side-row">
<span>Location</span>
<strong>${safe(c.location||"-")}</strong>
</div>


<div class="side-row">
<span>Country</span>
<strong>${safe(c.country||"-")}</strong>
</div>


<div class="side-row">
<span>Views</span>
<strong>${Number(c.views||0).toLocaleString()}</strong>
</div>


<div class="side-row">
<span>Applications</span>
<strong>${Number(c.applicationsCount||0).toLocaleString()}</strong>
</div>

</div>


<div class="card">

<h2>
Application
</h2>

<p class="description">

${c.deadline
?`Applications close on <strong>${safe(formatDate(c.deadline))}</strong>.`
:"No application deadline has been specified."}

</p>


<button
class="apply"
onclick="applyNow()">

Apply Now

</button>

</div>


</div>

</div>

</main>

`;


/* COUNT VIEW */

try{

await updateDoc(
ref,
{
views:increment(1)
}
);

}catch(e){

console.log(
"View count unavailable"
);

}

}catch(error){

console.error(error);

appBox.innerHTML=`
<div class="error">

<h2>Something went wrong</h2>

<p>
Unable to load this career.
</p>

</div>`;

}

}


/* DATE */

function formatDate(value){

if(!value)return "";

try{

if(
typeof value==="object" &&
value.toDate
){

return value
.toDate()
.toLocaleDateString();

}

const d=new Date(value);

if(!isNaN(d))
return d.toLocaleDateString();

return String(value);

}catch{

return String(value);

}

}


/* APPLY */

window.applyNow=
function(){

if(!careerId)return;


/* applicationUrl */

const url=
window.__applicationUrl;


if(url){

window.open(
url,
"_blank",
"noopener,noreferrer"
);

return;

}

};


/* SHARE */

window.shareCareer=
async function(){

const url=
window.location.href;

try{

if(navigator.share){

await navigator.share({

title:
document.title,

url

});

}else{

await navigator.clipboard.writeText(url);

alert(
"Career link copied."
);

}

}catch(error){

console.log(error);

}

};


/* START */

loadCareer();

</script>

</body>
</html>
