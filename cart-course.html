<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Course Cart | LetsStudy Pro</title>

<link rel="icon" href="/favicon.ico">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.header-actions{
  display:flex;
  gap:10px;
}

.header-btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:90%;
  max-width:1200px;
  margin:35px auto;
}

.page-title{
  margin-bottom:25px;
}

.page-title h1{
  font-size:32px;
  margin-bottom:7px;
}

.page-title p{
  color:#64748b;
}

.layout{
  display:grid;
  grid-template-columns:1fr 350px;
  gap:25px;
  align-items:start;
}

.cart{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.cart-item{
  background:#fff;
  border-radius:14px;
  padding:18px;
  display:flex;
  gap:18px;
  box-shadow:0 4px 18px #00000008;
}

.thumb{
  width:150px;
  height:100px;
  border-radius:10px;
  overflow:hidden;
  background:#e5e7eb;
  flex-shrink:0;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.item-info{
  flex:1;
}

.item-title{
  font-size:19px;
  font-weight:700;
  margin-bottom:7px;
}

.item-description{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
  margin-bottom:10px;
}

.meta{
  color:#64748b;
  font-size:13px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.item-side{
  text-align:right;
  min-width:120px;
}

.price{
  font-size:19px;
  font-weight:800;
  margin-bottom:12px;
}

.remove{
  border:0;
  background:#fee2e2;
  color:#b91c1c;
  padding:8px 11px;
  border-radius:7px;
  cursor:pointer;
}

.view{
  display:inline-block;
  margin-top:8px;
  color:#2563eb;
  text-decoration:none;
  font-size:13px;
}

.summary{
  background:#fff;
  border-radius:14px;
  padding:22px;
  box-shadow:0 4px 18px #00000008;
  position:sticky;
  top:90px;
}

.summary h2{
  font-size:21px;
  margin-bottom:20px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:13px 0;
  color:#475569;
}

.total{
  border-top:1px solid #e5e7eb;
  padding-top:17px;
  margin-top:17px;
  font-size:21px;
  font-weight:800;
  color:#172033;
}

.checkout{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.checkout:disabled{
  background:#94a3b8;
  cursor:not-allowed;
}

.clear{
  width:100%;
  margin-top:10px;
  padding:11px;
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:9px;
  cursor:pointer;
}

.empty{
  background:#fff;
  border-radius:14px;
  padding:70px 20px;
  text-align:center;
  color:#64748b;
  box-shadow:0 4px 18px #00000008;
}

.empty i{
  font-size:45px;
  margin-bottom:15px;
}

.empty h2{
  color:#172033;
  margin-bottom:8px;
}

.empty button{
  margin-top:18px;
  padding:11px 18px;
  border:0;
  background:#2563eb;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
}

.loading{
  background:#fff;
  border-radius:14px;
  padding:60px;
  text-align:center;
  color:#64748b;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  border-radius:10px;
  padding:15px;
}

@media(max-width:850px){

  .layout{
    grid-template-columns:1fr;
  }

  .summary{
    position:static;
  }

}

@media(max-width:600px){

  .cart-item{
    flex-direction:column;
  }

  .thumb{
    width:100%;
    height:170px;
  }

  .item-side{
    text-align:left;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <div class="header-actions">

    <button
      class="header-btn"
      onclick="location.href='courses.html'"
    >
      <i class="fa-solid fa-book"></i>
      Courses
    </button>

  </div>

</header>


<main class="container">

  <section class="page-title">

    <h1>
      Course Cart
    </h1>

    <p>
      Review your selected courses before checkout.
    </p>

  </section>


  <div class="layout">

    <section id="cartItems" class="cart">

      <div class="loading">

        <i class="fa-solid fa-spinner fa-spin"></i>

        <p>
          Loading your cart...
        </p>

      </div>

    </section>


    <aside class="summary">

      <h2>
        Order Summary
      </h2>

      <div class="summary-row">

        <span>
          Courses
        </span>

        <strong id="itemCount">
          0
        </strong>

      </div>


      <div class="summary-row">

        <span>
          Subtotal
        </span>

        <strong id="subtotal">
          0
        </strong>

      </div>


      <div class="summary-row">

        <span>
          Discount
        </span>

        <strong id="discount">
          0
        </strong>

      </div>


      <div class="summary-row total">

        <span>
          Total
        </span>

        <strong id="total">
          0
        </strong>

      </div>


      <button
        id="checkoutButton"
        class="checkout"
        onclick="goCheckout()"
        disabled
      >
        Proceed to Checkout
      </button>


      <button
        class="clear"
        onclick="clearCart()"
      >
        <i class="fa-solid fa-trash"></i>
        Clear Cart
      </button>

    </aside>

  </div>

</main>


<script>

/* =========================================
   API
========================================= */

const API_BASE =
  "/api/data";


/* =========================================
   CART STORAGE
========================================= */

const CART_KEY =
  "letsstudy_course_cart";


let cartIds =
  readCart();


let courses = [];


/* =========================================
   READ CART
========================================= */

function readCart(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          CART_KEY
        ) || "[]"
      );

    if(!Array.isArray(data)){
      return [];
    }

    return [
      ...new Set(
        data.map(
          String
        )
      )
    ];

  }catch(error){

    console.error(
      "Cart storage error:",
      error
    );

    return [];

  }

}


/* =========================================
   SAVE CART
========================================= */

function saveCart(){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(
      cartIds
    )
  );

}


/* =========================================
   API REQUEST
========================================= */

async function apiGet(
  collection
){

  const url =
    new URL(
      API_BASE,
      location.origin
    );

  url.searchParams.set(
    "collection",
    collection
  );

  url.searchParams.set(
    "limit",
    "100"
  );


  const response =
    await fetch(
      url.toString(),
      {
        method:"GET",

        headers:{
          "Accept":
            "application/json"
        },

        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      `API error ${response.status}`
    );

  }


  const data =
    await response.json();


  if(!data.success){

    throw new Error(
      data.error ||
      "Unable to load courses"
    );

  }


  return data;

}


/* =========================================
   LOAD COURSES
========================================= */

async function loadCart(){

  const container =
    document.getElementById(
      "cartItems"
    );


  if(!cartIds.length){

    renderEmpty();

    return;

  }


  try{

    const result =
      await apiGet(
        "courses"
      );


    const allCourses =
      result.results || [];


    courses =
      cartIds
        .map(
          id =>
            allCourses.find(
              course =>
                String(
                  course.id
                ) === String(id)
            )
        )
        .filter(Boolean);


    /*
      Remove IDs that no longer
      exist in the public API.
    */

    const validIds =
      courses.map(
        course =>
          String(course.id)
      );


    cartIds =
      cartIds.filter(
        id =>
          validIds.includes(
            String(id)
          )
      );


    saveCart();


    if(!courses.length){

      renderEmpty();

      updateSummary();

      return;

    }


    renderCart();

    updateSummary();


  }catch(error){

    console.error(
      "COURSE CART ERROR:",
      error
    );


    container.innerHTML = `

      <div class="error">

        <strong>
          Unable to load your course cart.
        </strong>

        <p style="margin-top:6px">
          Please try again.
        </p>

      </div>

    `;

  }

}


/* =========================================
   RENDER CART
========================================= */

function renderCart(){

  const container =
    document.getElementById(
      "cartItems"
    );


  container.innerHTML =
    courses
      .map(
        course =>
          createCartItem(
            course
          )
      )
      .join("");

}


/* =========================================
   CART ITEM
========================================= */

function createCartItem(
  course
){

  const id =
    String(
      course.id
    );


  const title =
    course.title ||
    course.name ||
    "Untitled Course";


  const description =
    course.shortDescription ||
    course.description ||
    "Course description unavailable.";


  const price =
    Number(
      course.price || 0
    );


  const image =
    course.thumbnail ||
    course.image ||
    course.coverImage ||
    "/favicon.png";


  const currency =
    course.currency ||
    "TZS";


  const lessons =
    Number(
      course.lessonCount ||
      course.lessonsCount ||
      0
    );


  return `

    <article
      class="cart-item"
    >

      <div class="thumb">

        <img
          src="${safeImage(image)}"
          alt="${escapeAttr(title)}"

          onerror="
            this.src='/favicon.png';
          "
        >

      </div>


      <div class="item-info">

        <div class="item-title">

          ${escapeHTML(title)}

        </div>


        <div class="item-description">

          ${escapeHTML(
            truncate(
              description,
              150
            )
          )}

        </div>


        <div class="meta">

          ${
            course.category
            ? `
              <span>
                <i class="fa-solid fa-tag"></i>
                ${escapeHTML(
                  course.category
                )}
              </span>
            `
            : ""
          }


          ${
            lessons
            ? `
              <span>
                <i class="fa-solid fa-play"></i>
                ${lessons} lessons
              </span>
            `
            : ""
          }


          ${
            course.level
            ? `
              <span>
                <i class="fa-solid fa-signal"></i>
                ${escapeHTML(
                  course.level
                )}
              </span>
            `
            : ""
          }

        </div>


        <a
          class="view"
          href="course.html?courseId=${encodeURIComponent(id)}"
        >

          View Course

          <i class="fa-solid fa-arrow-right"></i>

        </a>

      </div>


      <div class="item-side">

        <div class="price">

          ${
            price > 0
            ? `${price.toLocaleString()} ${escapeHTML(currency)}`
            : "Free"
          }

        </div>


        <button
          class="remove"
          onclick="
            removeCourse(
              '${escapeAttr(id)}'
            )
          "
        >

          <i class="fa-solid fa-trash"></i>

          Remove

        </button>

      </div>

    </article>

  `;

}


/* =========================================
   SUMMARY
========================================= */

function updateSummary(){

  const count =
    courses.length;


  const subtotal =
    courses.reduce(
      (
        total,
        course
      ) =>
        total +
        Number(
          course.price || 0
        ),
      0
    );


  const discount =
    courses.reduce(
      (
        total,
        course
      ) =>
        total +
        Number(
          course.discount || 0
        ),
      0
    );


  const total =
    Math.max(
      0,
      subtotal - discount
    );


  document.getElementById(
    "itemCount"
  ).textContent =
    count;


  document.getElementById(
    "subtotal"
  ).textContent =
    formatMoney(
      subtotal
    );


  document.getElementById(
    "discount"
  ).textContent =
    formatMoney(
      discount
    );


  document.getElementById(
    "total"
  ).textContent =
    formatMoney(
      total
    );


  document.getElementById(
    "checkoutButton"
  ).disabled =
    count === 0;

}


/* =========================================
   REMOVE
========================================= */

window.removeCourse =
function(id){

  cartIds =
    cartIds.filter(
      item =>
        String(item) !==
        String(id)
    );


  saveCart();


  courses =
    courses.filter(
      course =>
        String(course.id) !==
        String(id)
    );


  if(!courses.length){

    renderEmpty();

  }else{

    renderCart();

  }


  updateSummary();

};


/* =========================================
   CLEAR
========================================= */

window.clearCart =
function(){

  if(!cartIds.length){
    return;
  }


  const confirmed =
    confirm(
      "Clear all courses from your cart?"
    );


  if(!confirmed){
    return;
  }


  cartIds = [];

  courses = [];

  saveCart();

  renderEmpty();

  updateSummary();

};


/* =========================================
   CHECKOUT
========================================= */

window.goCheckout =
function(){

  if(!cartIds.length){
    return;
  }


  const ids =
    cartIds
      .map(
        id =>
          encodeURIComponent(id)
      )
      .join(",");


  location.href =
    `checkout-course.html?courseIds=${ids}`;

};


/* =========================================
   EMPTY
========================================= */

function renderEmpty(){

  document.getElementById(
    "cartItems"
  ).innerHTML = `

    <div class="empty">

      <i
        class="fa-solid fa-cart-shopping"
      ></i>

      <h2>
        Your course cart is empty
      </h2>

      <p>
        Add a course to your cart to continue.
      </p>

      <button
        onclick="
          location.href='courses.html'
        "
      >

        Browse Courses

      </button>

    </div>

  `;

}


/* =========================================
   FORMAT MONEY
========================================= */

function formatMoney(
  amount
){

  return Number(
    amount || 0
  ).toLocaleString();

}


/* =========================================
   TEXT HELPERS
========================================= */

function truncate(
  value,
  length
){

  const text =
    String(
      value || ""
    );


  return text.length > length
    ? text.slice(
        0,
        length
      ) + "..."
    : text;

}


function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  );

}


function safeImage(
  value
){

  const url =
    String(
      value || ""
    ).trim();


  if(
    url.startsWith(
      "https://"
    ) ||
    url.startsWith(
      "http://"
    ) ||
    url.startsWith(
      "/"
    )
  ){

    return escapeAttr(
      url
    );

  }


  return "/favicon.png";

}


/* =========================================
   START
========================================= */

loadCart();

</script>

</body>
</html>
