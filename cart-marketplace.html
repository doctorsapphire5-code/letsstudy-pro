<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Your Cart | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f6f8fb;
color:#172033;
}

a{
text-decoration:none;
color:inherit;
}

.top{
height:64px;
background:#fff;
border-bottom:1px solid #e5e7eb;
padding:0 6%;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:50;
}

.logo{
font-size:21px;
font-weight:800;
color:#155eef;
}

.back{
font-size:13px;
font-weight:700;
color:#475467;
}

.hero{
background:linear-gradient(135deg,#155eef,#073bba);
color:#fff;
padding:42px 20px;
}

.hero-inner{
max-width:1100px;
margin:auto;
}

.hero h1{
margin:0 0 8px;
font-size:34px;
}

.hero p{
margin:0;
color:#dbe7ff;
}

.container{
max-width:1100px;
margin:28px auto;
padding:0 20px;
}

.layout{
display:grid;
grid-template-columns:1fr 350px;
gap:20px;
}

.cart-box,
.summary{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
}

.cart-box{
padding:20px;
}

.summary{
padding:20px;
height:max-content;
position:sticky;
top:85px;
}

.item{
display:grid;
grid-template-columns:120px 1fr auto;
gap:15px;
padding:15px 0;
border-bottom:1px solid #edf0f4;
}

.item:first-child{
padding-top:0;
}

.item:last-child{
border-bottom:0;
}

.image{
width:120px;
height:80px;
border-radius:9px;
overflow:hidden;
background:#eef2f6;
}

.image img{
width:100%;
height:100%;
object-fit:cover;
}

.type{
font-size:10px;
font-weight:800;
color:#155eef;
text-transform:uppercase;
margin-bottom:5px;
}

.title{
font-size:16px;
font-weight:800;
margin-bottom:7px;
}

.description{
font-size:12px;
color:#667085;
line-height:1.5;
}

.price{
font-weight:800;
font-size:15px;
white-space:nowrap;
}

.old{
font-size:11px;
color:#98a2b3;
text-decoration:line-through;
display:block;
margin-bottom:3px;
}

.quantity{
display:flex;
align-items:center;
gap:7px;
margin-top:10px;
}

.quantity button{
width:28px;
height:28px;
padding:0;
border:1px solid #d9dee8;
background:#fff;
color:#172033;
border-radius:6px;
cursor:pointer;
}

.quantity span{
font-size:12px;
font-weight:700;
min-width:20px;
text-align:center;
}

.remove{
margin-top:8px;
border:0;
background:none;
color:#d92d20;
font-size:11px;
cursor:pointer;
padding:0;
}

.summary h2{
margin:0 0 20px;
font-size:20px;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
margin:13px 0;
font-size:13px;
color:#667085;
}

.total{
border-top:1px solid #e5e7eb;
margin-top:18px;
padding-top:18px;
font-size:19px;
font-weight:900;
color:#172033;
}

.checkout{
display:block;
width:100%;
margin-top:20px;
padding:13px;
border-radius:9px;
background:#155eef;
color:#fff;
text-align:center;
font-weight:800;
border:0;
cursor:pointer;
}

.checkout:hover{
background:#073bba;
}

.continue{
display:block;
text-align:center;
margin-top:12px;
font-size:12px;
color:#155eef;
font-weight:700;
}

.empty{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:70px 20px;
text-align:center;
color:#667085;
}

.empty i{
font-size:45px;
margin-bottom:15px;
}

.empty h2{
color:#172033;
}

.empty a{
display:inline-block;
margin-top:15px;
background:#155eef;
color:#fff;
padding:11px 18px;
border-radius:8px;
font-weight:700;
}

.loading{
text-align:center;
padding:70px;
color:#667085;
}

.error{
color:#d92d20;
font-size:12px;
}

@media(max-width:800px){

.layout{
grid-template-columns:1fr;
}

.summary{
position:static;
}

}

@media(max-width:600px){

.item{
grid-template-columns:80px 1fr;
}

.image{
width:80px;
height:65px;
}

.price{
grid-column:2;
}

.hero h1{
font-size:28px;
}

.container{
padding:0 15px;
}

}

</style>
</head>

<body>


<header class="top">

<a href="marketplace.html" class="logo">
LetsStudy Pro
</a>

<a href="marketplace.html" class="back">
<i class="fa fa-arrow-left"></i>
Continue Shopping
</a>

</header>


<section class="hero">

<div class="hero-inner">

<h1>
Your Cart
</h1>

<p>
Review your selected products before checkout.
</p>

</div>

</section>


<main class="container">

<div id="loading" class="loading">

<i class="fa fa-spinner fa-spin fa-2x"></i>

<p>
Loading cart...
</p>

</div>


<div
id="empty"
class="empty"
style="display:none">

<i class="fa fa-cart-shopping"></i>

<h2>
Your cart is empty
</h2>

<p>
Choose a product from the marketplace to continue.
</p>

<a href="marketplace.html">
Browse Marketplace
</a>

</div>


<div
id="layout"
class="layout"
style="display:none">


<section class="cart-box">

<h2>
Cart Items
</h2>

<div id="items"></div>

</section>


<aside class="summary">

<h2>
Order Summary
</h2>


<div class="row">

<span>
Items
</span>

<strong id="itemCount">
0
</strong>

</div>


<div class="row">

<span>
Subtotal
</span>

<strong id="subtotal">
TZS 0
</strong>

</div>


<div class="row">

<span>
Discount
</span>

<strong id="discount">
TZS 0
</strong>

</div>


<div class="row total">

<span>
Total
</span>

<strong id="total">
TZS 0
</strong>

</div>


<button
id="checkoutBtn"
class="checkout">

<i class="fa fa-credit-card"></i>

Proceed to Checkout

</button>


<a
href="marketplace.html"
class="continue">

Continue Shopping

</a>

</aside>

</div>

</main>


<script type="module">


/* =========================================
FIREBASE
========================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =========================================
STATE
========================================= */

let cart=[];

let products=[];


/* =========================================
DOM
========================================= */

const loading=
document.getElementById("loading");

const empty=
document.getElementById("empty");

const layout=
document.getElementById("layout");

const items=
document.getElementById("items");

const itemCount=
document.getElementById("itemCount");

const subtotalEl=
document.getElementById("subtotal");

const discountEl=
document.getElementById("discount");

const totalEl=
document.getElementById("total");


/* =========================================
ESCAPE
========================================= */

function esc(value=""){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
GET CART
========================================= */

function getCart(){

try{

return JSON.parse(

localStorage.getItem(
"letsStudyCart"
)

||"[]"

);

}catch{

return [];

}

}


/* =========================================
SAVE CART
========================================= */

function saveCart(){

localStorage.setItem(

"letsStudyCart",

JSON.stringify(cart)

);

}


/* =========================================
LOAD MARKETPLACE
========================================= */

async function loadCart(){

try{

cart=getCart();


if(!cart.length){

showEmpty();

return;

}


const snapshot=

await getDocs(

collection(
db,
"marketplace"
)

);


products=[];


snapshot.forEach(docSnap=>{

products.push({

id:docSnap.id,

...docSnap.data()

});

});


renderCart();


}catch(error){

console.error(error);

loading.innerHTML=`

<div class="error">

<i class="fa fa-circle-exclamation"></i>

Unable to load cart.

</div>

`;

}

}


/* =========================================
RENDER CART
========================================= */

function renderCart(){

const validCart=[];


const html=cart.map(

cartItem=>{

const product=

products.find(

item=>

item.id===
cartItem.productId

);


if(!product){

return "";

}


validCart.push(cartItem);


const quantity=

Number(
cartItem.quantity||1
);


const price=

Number(
product.price||0
);


const discountPrice=

Number(
product.discountPrice||0
);


const hasDiscount=

discountPrice>0

&&

discountPrice<price;


const finalPrice=

hasDiscount

?discountPrice

:price;


const currency=

product.currency||"TZS";


return `

<div class="item">


<div class="image">

<img
src="${esc(
product.thumbnail||
product.imageUrl||
"https://via.placeholder.com/700x400?text=Product"
)}"
alt="${esc(
product.title||
"Product"
)}">

</div>


<div>

<div class="type">

${esc(
product.type||
"Product"
)}

</div>


<div class="title">

${esc(
product.title||
"Untitled Product"
)}

</div>


<div class="description">

${esc(
product.shortDescription||
product.description||
""
)}

</div>


<div class="quantity">

<button
onclick="changeQuantity('${esc(product.id)}',-1)">

−

</button>

<span>

${quantity}

</span>

<button
onclick="changeQuantity('${esc(product.id)}',1)">

+

</button>

</div>


<button
class="remove"
onclick="removeItem('${esc(product.id)}')">

<i class="fa fa-trash"></i>

Remove

</button>

</div>


<div class="price">

${
hasDiscount

?

`

<span class="old">

${esc(currency)}
${price.toLocaleString()}

</span>

`

:""

}

${esc(currency)}
${finalPrice.toLocaleString()}

</div>


</div>

`;

}).join("");


cart=validCart;

saveCart();


if(!cart.length){

showEmpty();

return;

}


items.innerHTML=html;


calculateTotals();


loading.style.display="none";

empty.style.display="none";

layout.style.display="grid";

}


/* =========================================
CALCULATE TOTALS
========================================= */

function calculateTotals(){

let subtotal=0;

let originalTotal=0;

let count=0;


cart.forEach(cartItem=>{

const product=

products.find(

item=>

item.id===
cartItem.productId

);


if(!product)return;


const quantity=

Number(
cartItem.quantity||1
);


const price=

Number(
product.price||0
);


const discountPrice=

Number(
product.discountPrice||0
);


const finalPrice=

discountPrice>0

&&

discountPrice<price

?

discountPrice

:

price;


originalTotal +=
price*quantity;


subtotal +=
finalPrice*quantity;


count +=
quantity;

});


const discount=

originalTotal-subtotal;


itemCount.textContent=
count;


subtotalEl.textContent=
"TZS "+
subtotal.toLocaleString();


discountEl.textContent=
"TZS "+
discount.toLocaleString();


totalEl.textContent=
"TZS "+
subtotal.toLocaleString();


/*
Save checkout information.
*/

const checkoutData={

items:cart,

subtotal:subtotal,

discount:discount,

total:subtotal,

itemCount:count,

createdAt:Date.now()

};


localStorage.setItem(

"letsStudyCheckout",

JSON.stringify(
checkoutData
)

);

}


/* =========================================
CHANGE QUANTITY
========================================= */

window.changeQuantity=

function(productId,change){

const item=

cart.find(

item=>

item.productId===
productId

);


if(!item)return;


item.quantity=

Number(
item.quantity||1
)+change;


if(item.quantity<=0){

cart=

cart.filter(

item=>

item.productId!==
productId

);

}


saveCart();

renderCart();

};


/* =========================================
REMOVE ITEM
========================================= */

window.removeItem=

function(productId){

cart=

cart.filter(

item=>

item.productId!==
productId

);


saveCart();

renderCart();

};


/* =========================================
EMPTY
========================================= */

function showEmpty(){

loading.style.display="none";

layout.style.display="none";

empty.style.display="block";

}


/* =========================================
CHECKOUT
========================================= */

document
.getElementById("checkoutBtn")
.addEventListener(
"click",
()=>{

if(!cart.length){

alert(
"Your cart is empty."
);

return;

}


calculateTotals();


window.location.href=
"checkout.html";

}
);


/* =========================================
START
========================================= */

loadCart();

</script>

</body>
</html>
