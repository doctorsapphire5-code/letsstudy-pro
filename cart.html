<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>
  Cart | LetsStudy Pro
</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    Arial,
    sans-serif;
  background:#f6f8fc;
  color:#111827;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:18px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#111827;
  text-decoration:none;
  font-size:22px;
  font-weight:900;
}

.logo span{
  color:#2563eb;
}

.back{
  color:#2563eb;
  text-decoration:none;
  font-weight:700;
}

.container{
  max-width:1150px;
  margin:35px auto;
  padding:0 20px;
}

.title{
  margin-bottom:25px;
}

.title h1{
  font-size:32px;
}

.title p{
  margin-top:7px;
  color:#6b7280;
}

.cart-layout{
  display:grid;
  grid-template-columns:1fr 340px;
  gap:24px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  box-shadow:
    0 8px 25px
    rgba(0,0,0,.04);
}

.cart-card{
  padding:20px;
}

.cart-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding-bottom:18px;
  margin-bottom:18px;
  border-bottom:1px solid #e5e7eb;
}

.cart-info{
  font-size:14px;
  font-weight:700;
}

.sync-status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#6b7280;
  font-size:12px;
}

.sync-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#f59e0b;
}

.cart-items{
  display:grid;
  gap:15px;
}

.item{
  display:flex;
  gap:16px;
  padding:16px;
  border:1px solid #e5e7eb;
  border-radius:15px;
}

.item-image{
  width:105px;
  height:95px;
  flex-shrink:0;
  overflow:hidden;
  border-radius:12px;
  background:#eef2ff;
}

.item-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.item-content{
  flex:1;
  min-width:0;
}

.item-type{
  display:inline-block;
  margin-bottom:6px;
  padding:4px 8px;
  border-radius:20px;
  background:#eff6ff;
  color:#2563eb;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
}

.item-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.item-header h3{
  font-size:17px;
  margin-bottom:6px;
}

.item-description{
  color:#6b7280;
  font-size:13px;
  margin-bottom:13px;
}

.item-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:9px;
}

.quantity button{
  width:29px;
  height:29px;
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:7px;
  cursor:pointer;
}

.quantity strong{
  min-width:20px;
  text-align:center;
}

.remove{
  border:0;
  background:transparent;
  color:#dc2626;
  cursor:pointer;
  font-size:12px;
}

.item-price{
  font-size:18px;
  font-weight:900;
  white-space:nowrap;
}

.loading{
  padding:50px 20px;
  text-align:center;
  color:#6b7280;
}

.spinner{
  width:30px;
  height:30px;
  margin:0 auto 12px;
  border:3px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.empty{
  padding:55px 20px;
  text-align:center;
}

.empty h2{
  margin-bottom:8px;
}

.empty p{
  color:#6b7280;
}

.empty a{
  display:inline-block;
  margin-top:18px;
  padding:11px 18px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  border-radius:9px;
  font-weight:700;
}

.summary{
  padding:22px;
  height:max-content;
  position:sticky;
  top:20px;
}

.summary h2{
  margin-bottom:20px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
  color:#4b5563;
}

.summary-total{
  display:flex;
  justify-content:space-between;
  padding-top:17px;
  margin-top:17px;
  border-top:1px solid #e5e7eb;
  font-size:20px;
  font-weight:900;
  color:#111827;
}

.checkout{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#2563eb;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.checkout:hover{
  background:#1d4ed8;
}

.clear{
  width:100%;
  margin-top:10px;
  padding:11px;
  border:1px solid #fecaca;
  border-radius:10px;
  background:#fff;
  color:#dc2626;
  cursor:pointer;
}

@media(max-width:800px){

  .cart-layout{
    grid-template-columns:1fr;
  }

  .summary{
    position:static;
  }

}

@media(max-width:550px){

  .cart-toolbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .item{
    flex-direction:column;
  }

  .item-image{
    width:100%;
    height:170px;
  }

  .item-bottom{
    align-items:flex-start;
    flex-direction:column;
  }

}

</style>

</head>


<body>


<header>

  <a
    class="logo"
    href="index.html"
  >
    LetsStudy <span>Pro</span>
  </a>

  <a
    class="back"
    href="pricing.html"
  >
    Continue Shopping
  </a>

</header>


<main class="container">


  <div class="title">

    <h1>
      Your Cart
    </h1>

    <p>
      Review your pricing plans,
      courses, resources and products.
    </p>

  </div>


  <div class="cart-layout">


    <!-- =================================
         CART
    ================================== -->

    <section
      class="card cart-card"
    >


      <div class="cart-toolbar">


        <div
          id="selectedInfo"
          class="cart-info"
        >
          Loading cart...
        </div>


        <div
          id="syncStatus"
          class="sync-status"
        >

          <span
            id="syncDot"
            class="sync-dot"
          ></span>

          <span id="syncText">
            Checking cart...
          </span>

        </div>


      </div>


      <div
        id="cartItems"
        class="cart-items"
      >

        <div class="loading">

          <div
            class="spinner"
          ></div>

          Loading your cart...

        </div>

      </div>


    </section>


    <!-- =================================
         SUMMARY
    ================================== -->

    <aside
      class="card summary"
    >

      <h2>
        Order Summary
      </h2>


      <div class="summary-row">

        <span>
          Items
        </span>

        <span id="itemCount">
          0
        </span>

      </div>


      <div class="summary-row">

        <span>
          Subtotal
        </span>

        <span id="subtotal">
          0 TZS
        </span>

      </div>


      <div class="summary-row">

        <span>
          Discount
        </span>

        <span id="discount">
          0 TZS
        </span>

      </div>


      <div class="summary-total">

        <span>
          Total
        </span>

        <span id="total">
          0 TZS
        </span>

      </div>


      <button
        id="checkoutBtn"
        class="checkout"
        type="button"
      >
        Proceed to Checkout
      </button>


      <button
        id="clearCartBtn"
        class="clear"
        type="button"
      >
        Clear Cart
      </button>


    </aside>


  </div>

</main>



<script>

/* =========================================
   CART STORAGE
========================================= */

const CART_KEY =
  "letsStudyCart";


function getCart(){

  try{

    const data =
      localStorage.getItem(
        CART_KEY
      );


    if(!data){

      return [];

    }


    const cart =
      JSON.parse(data);


    return Array.isArray(cart)
      ? cart
      : [];

  }

  catch(error){

    console.error(
      "Cart read error:",
      error
    );

    return [];

  }

}


function saveCart(cart){

  try{

    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );

  }

  catch(error){

    console.error(
      "Cart save error:",
      error
    );

  }

}


/* =========================================
   MONEY
========================================= */

function formatMoney(value){

  return Number(
    value || 0
  ).toLocaleString(
    "en-TZ"
  ) + " TZS";

}


/* =========================================
   RENDER CART
========================================= */

function renderCart(){

  const cart =
    getCart();


  const container =
    document.getElementById(
      "cartItems"
    );


  const info =
    document.getElementById(
      "selectedInfo"
    );


  const syncText =
    document.getElementById(
      "syncText"
    );


  const syncDot =
    document.getElementById(
      "syncDot"
    );


  if(!container){

    return;

  }


  if(!cart.length){

    container.innerHTML = `

      <div class="empty">

        <h2>
          Your cart is empty
        </h2>

        <p>
          Add a pricing plan,
          course, ebook, resource
          or marketplace product.
        </p>

        <a href="pricing.html">
          Explore Plans
        </a>

      </div>

    `;


    if(info){

      info.textContent =
        "0 items";

    }


    if(syncText){

      syncText.textContent =
        "Cart ready";

    }


    if(syncDot){

      syncDot.style.background =
        "#16a34a";

    }


    updateSummary(
      []
    );


    return;

  }


  container.innerHTML =
    cart.map(
      (
        item,
        index
      ) => {


        const quantity =
          Number(
            item.quantity || 1
          );


        const price =
          Number(
            item.price ||
            item.amount ||
            0
          );


        const itemTotal =
          price *
          quantity;


        return `

          <article
            class="item"
          >


            <div
              class="item-image"
            >

              <img
                src="${
                  item.image ||
                  "assets/images/product-placeholder.png"
                }"
                alt="${
                  item.name ||
                  item.title ||
                  "Cart item"
                }"
                onerror="
                  this.style.display='none'
                "
              >

            </div>


            <div
              class="item-content"
            >


              <div
                class="item-header"
              >

                <div>

                  <span
                    class="item-type"
                  >
                    ${
                      item.type ||
                      "product"
                    }
                  </span>


                  <h3>

                    ${
                      item.name ||
                      item.planName ||
                      item.title ||
                      "Unnamed item"
                    }

                  </h3>

                </div>

              </div>


              <p
                class="item-description"
              >

                ${
                  item.description ||
                  (
                    item.type ===
                    "subscription"

                      ? (
                        "LetsStudy Pro " +
                        (
                          item.billing ||
                          "monthly"
                        ) +
                        " subscription"
                      )

                      : "LetsStudy Pro item"
                  )
                }

              </p>


              <div
                class="item-bottom"
              >


                <div
                  class="quantity"
                >

                  <button
                    type="button"
                    onclick="
                      changeQuantity(
                        ${index},
                        -1
                      )
                    "
                  >
                    −
                  </button>


                  <strong>
                    ${quantity}
                  </strong>


                  <button
                    type="button"
                    onclick="
                      changeQuantity(
                        ${index},
                        1
                      )
                    "
                  >
                    +
                  </button>


                  <button
                    type="button"
                    class="remove"
                    onclick="
                      removeItem(
                        ${index}
                      )
                    "
                  >
                    Remove
                  </button>

                </div>


                <div
                  class="item-price"
                >

                  ${formatMoney(
                    itemTotal
                  )}

                </div>


              </div>


            </div>


          </article>

        `;

      }
    ).join("");


  if(info){

    const totalItems =
      cart.reduce(
        (
          sum,
          item
        ) =>
          sum +
          Number(
            item.quantity || 1
          ),
        0
      );


    info.textContent =
      totalItems +
      (
        totalItems === 1
          ? " item"
          : " items"
      );

  }


  if(syncText){

    syncText.textContent =
      "Cart synced";

  }


  if(syncDot){

    syncDot.style.background =
      "#16a34a";

  }


  updateSummary(
    cart
  );

}


/* =========================================
   SUMMARY
========================================= */

function updateSummary(
  cart
){

  let count = 0;

  let subtotal = 0;


  cart.forEach(
    item => {

      const quantity =
        Number(
          item.quantity || 1
        );


      const price =
        Number(
          item.price ||
          item.amount ||
          0
        );


      count +=
        quantity;


      subtotal +=
        price *
        quantity;

    }
  );


  const discount =
    0;


  const total =
    subtotal -
    discount;


  document.getElementById(
    "itemCount"
  ).textContent =
    count;


  document.getElementById(
    "subtotal"
  ).textContent =
    formatMoney(
      subtotal
    );


  document.getElementById(
    "discount"
  ).textContent =
    formatMoney(
      discount
    );


  document.getElementById(
    "total"
  ).textContent =
    formatMoney(
      total
    );

}


/* =========================================
   CHANGE QUANTITY
========================================= */

function changeQuantity(
  index,
  change
){

  const cart =
    getCart();


  if(!cart[index]){

    return;

  }


  const quantity =
    Number(
      cart[index].quantity || 1
    );


  cart[index].quantity =
    Math.max(
      1,
      quantity + change
    );


  saveCart(
    cart
  );


  renderCart();

}


/* =========================================
   REMOVE
========================================= */

function removeItem(
  index
){

  const cart =
    getCart();


  if(!cart[index]){

    return;

  }


  cart.splice(
    index,
    1
  );


  saveCart(
    cart
  );


  renderCart();

}


/* =========================================
   CLEAR CART
========================================= */

document
  .getElementById(
    "clearCartBtn"
  )
  .addEventListener(
    "click",
    () => {

      const cart =
        getCart();


      if(!cart.length){

        return;

      }


      const confirmed =
        confirm(
          "Clear all items from your cart?"
        );


      if(!confirmed){

        return;

      }


      localStorage.removeItem(
        CART_KEY
      );


      renderCart();

    }
  );


/* =========================================
   CHECKOUT
========================================= */

document
  .getElementById(
    "checkoutBtn"
  )
  .addEventListener(
    "click",
    () => {

      const cart =
        getCart();


      if(!cart.length){

        alert(
          "Your cart is empty."
        );

        return;

      }


      /*
       * Checkout page will receive
       * the complete cart from
       * letsStudyCart.
       */

      window.location.href =
        "checkout.html";

    }
  );


/* =========================================
   INITIALIZE
========================================= */

renderCart();


/*
 * Update when another tab changes
 * the cart.
 */

window.addEventListener(
  "storage",
  event => {

    if(
      event.key ===
      CART_KEY
    ){

      renderCart();

    }

  }
);

</script>


</body>
</html>
