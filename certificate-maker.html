<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Certificate Marker | Let'sStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
}

.container{
max-width:650px;
margin:auto;
padding:25px 15px;
}

.card{
background:#fff;
border-radius:18px;
padding:25px;
box-shadow:0 6px 25px rgba(0,0,0,.08);
text-align:center;
}

.icon{
font-size:55px;
margin-bottom:15px;
}

h1{
margin:0 0 8px;
}

p{
color:#64748b;
font-size:14px;
}

input{
width:100%;
padding:14px;
border:1px solid #dbe2ea;
border-radius:10px;
margin:15px 0;
outline:none;
}

button{
width:100%;
padding:13px;
border:0;
border-radius:10px;
background:#172033;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:20px;
}

.verified{
background:#ecfdf5;
border:1px solid #a7f3d0;
color:#166534;
padding:20px;
border-radius:14px;
}

.invalid{
background:#fef2f2;
border:1px solid #fecaca;
color:#991b1b;
padding:20px;
border-radius:14px;
}

.marker{
display:inline-block;
margin-top:15px;
padding:9px 15px;
border-radius:30px;
background:#dcfce7;
color:#166534;
font-weight:bold;
font-size:13px;
}

.details{
margin-top:15px;
background:#fff;
border-radius:10px;
padding:12px;
text-align:left;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:9px 0;
border-bottom:1px solid #eef2f7;
font-size:13px;
}

.row:last-child{
border-bottom:0;
}

.value{
font-weight:bold;
text-align:right;
word-break:break-word;
}

@media(max-width:600px){
.row{
flex-direction:column;
gap:3px;
}

.value{
text-align:left;
}
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="icon">
🏆
</div>

<h1>
Certificate Marker
</h1>

<p>
Verify the authenticity of a Let'sStudy Pro certificate.
</p>


<form id="form">

<input
id="certificateNumber"
type="text"
placeholder="Enter Certificate Number"
required
autocomplete="off">

<button type="submit">
Verify Certificate
</button>

</form>


<div
id="result"
class="result">
</div>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* ==========================================
FIREBASE
========================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ==========================================
ELEMENTS
========================================== */

const form=
document.getElementById("form");

const input=
document.getElementById(
"certificateNumber"
);

const result=
document.getElementById("result");


/* ==========================================
ESCAPE
========================================== */

function esc(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==========================================
VERIFY
========================================== */

form.addEventListener(
"submit",
async e=>{

e.preventDefault();

const number=
input.value.trim();

if(!number)return;


result.innerHTML=`

<p>
Verifying certificate...
</p>

`;


try{

const snap=
await getDocs(
collection(
db,
"certificates"
)
);


const found=
snap.docs.find(doc=>{

const data=
doc.data();

return String(
data.certificateNumber || ""
)
.trim()
.toLowerCase()
===
number.toLowerCase();

});


if(!found){

result.innerHTML=`

<div class="invalid">

<strong>
❌ Certificate Not Found
</strong>

<p>
No certificate matches this certificate number.
</p>

</div>

`;

return;

}


const data=
found.data();


if(data.status==="revoked"){

result.innerHTML=`

<div class="invalid">

<strong>
⚠ Certificate Revoked
</strong>

<p>
This certificate is no longer valid.
</p>

<div class="details">

<div class="row">
<span>Certificate Number</span>
<span class="value">
${esc(data.certificateNumber)}
</span>
</div>

<div class="row">
<span>Student</span>
<span class="value">
${esc(data.studentName)}
</span>
</div>

</div>

</div>

`;

return;

}


/* ==========================================
VERIFIED MARKER
========================================== */

result.innerHTML=`

<div class="verified">

<div style="font-size:45px">
✓
</div>

<strong>
CERTIFICATE VERIFIED
</strong>

<div class="marker">
✓ AUTHENTIC CERTIFICATE
</div>


<div class="details">

<div class="row">
<span>Certificate Number</span>
<span class="value">
${esc(data.certificateNumber)}
</span>
</div>


<div class="row">
<span>Student Name</span>
<span class="value">
${esc(data.studentName)}
</span>
</div>


<div class="row">
<span>Student Email</span>
<span class="value">
${esc(data.studentEmail)}
</span>
</div>


<div class="row">
<span>Course ID</span>
<span class="value">
${esc(data.courseId)}
</span>
</div>


<div class="row">
<span>Completion Date</span>
<span class="value">
${esc(data.completionDate)}
</span>
</div>


<div class="row">
<span>Status</span>
<span class="value">
${esc(data.status || "active")}
</span>
</div>

</div>

</div>

`;

}catch(error){

console.error(error);

result.innerHTML=`

<div class="invalid">

<strong>
Verification Error
</strong>

<p>
Unable to verify the certificate.
</p>

</div>

`;

}

});

</script>

</body>
</html>
