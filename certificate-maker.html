<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate Maker | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}
header{
  background:#fff;
  padding:16px 6%;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-size:21px;font-weight:800}
.logo span{color:#2563eb}
.btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}
.container{
  width:92%;
  max-width:1100px;
  margin:30px auto;
}
.layout{
  display:grid;
  grid-template-columns:330px 1fr;
  gap:25px;
}
.panel,.preview{
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 5px 20px #0000000b;
}
label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:15px 0 6px;
}
input,select{
  width:100%;
  padding:11px;
  border:1px solid #dce1e8;
  border-radius:8px;
}
.preview-wrap{
  overflow:auto;
}
.certificate{
  min-width:700px;
  aspect-ratio:1.414;
  border:12px solid #2563eb;
  padding:45px;
  text-align:center;
  position:relative;
  background:#fff;
}
.certificate:before{
  content:"";
  position:absolute;
  inset:12px;
  border:2px solid #2563eb;
  pointer-events:none;
}
.cert-content{
  position:relative;
  z-index:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.cert-title{
  font-size:40px;
  font-weight:800;
  margin-bottom:15px;
}
.presented{
  color:#64748b;
  margin-bottom:10px;
}
.student{
  font-size:34px;
  font-weight:800;
  margin:15px 0;
}
.course{
  font-size:22px;
  font-weight:700;
}
.date{
  margin-top:25px;
  color:#475569;
}
.signature{
  margin-top:35px;
  border-top:1px solid #172033;
  padding-top:7px;
  width:180px;
}
.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
  flex-wrap:wrap;
}
.loading{
  text-align:center;
  color:#64748b;
  padding:20px;
}
@media(max-width:800px){
  .layout{grid-template-columns:1fr}
}
@media print{
  header,.panel,.actions,h1,.intro{
    display:none!important;
  }
  body{background:#fff}
  .container{
    width:100%;
    max-width:none;
    margin:0;
  }
  .preview{
    box-shadow:none;
    padding:0;
  }
  .preview-wrap{overflow:visible}
  .certificate{
    width:100%;
    min-width:0;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="btn"
    onclick="location.href='certificate.html'"
  >
    Certificates
  </button>
</header>

<main class="container">

  <h1>Certificate Maker</h1>
  <p class="intro" style="color:#64748b;margin:8px 0 25px">
    Create and print a professional LetsStudy Pro certificate.
  </p>

  <div class="layout">

    <section class="panel">

      <h2>Certificate Details</h2>

      <label>Student Name</label>
      <input
        id="student"
        placeholder="Enter student name"
      >

      <label>Course</label>
      <input
        id="course"
        placeholder="Course name"
      >

      <label>Certificate Title</label>
      <input
        id="title"
        value="Certificate of Completion"
      >

      <label>Completion Date</label>
      <input
        id="date"
        type="date"
      >

      <label>Template</label>
      <select id="template">
        <option value="classic">Classic</option>
      </select>

      <div class="actions">

        <button
          class="btn"
          onclick="updateCertificate()"
        >
          Update
        </button>

        <button
          class="btn"
          onclick="window.print()"
        >
          Print / PDF
        </button>

      </div>

    </section>


    <section class="preview">

      <h2 style="margin-bottom:15px">
        Preview
      </h2>

      <div class="preview-wrap">

        <div class="certificate">

          <div class="cert-content">

            <div
              id="certTitle"
              class="cert-title"
            >
              Certificate of Completion
            </div>

            <div class="presented">
              This certificate is proudly presented to
            </div>

            <div
              id="certStudent"
              class="student"
            >
              Student Name
            </div>

            <div>
              for successfully completing
            </div>

            <div
              id="certCourse"
              class="course"
            >
              Course Name
            </div>

            <div
              id="certDate"
              class="date"
            >
              Date
            </div>

            <div class="signature">
              LetsStudy Pro
            </div>

          </div>

        </div>

      </div>

    </section>

  </div>

</main>

<script>

const API =
  "/api/data?collection=certificates&limit=100";


/* =========================
   API
========================= */

async function loadCertificateData(){

  try{

    const response =
      await fetch(API);

    if(!response.ok)
      throw new Error("API failed");

    const data =
      await response.json();

    /*
      API is optional here.
      Certificate creation itself
      works independently.
    */

    console.log(
      "Certificate API:",
      data
    );

  }catch(error){

    console.warn(
      "Certificate API unavailable:",
      error
    );

  }

}


/* =========================
   UPDATE
========================= */

function updateCertificate(){

  const student =
    document.getElementById(
      "student"
    ).value.trim();

  const course =
    document.getElementById(
      "course"
    ).value.trim();

  const title =
    document.getElementById(
      "title"
    ).value.trim();

  const date =
    document.getElementById(
      "date"
    ).value;


  document.getElementById(
    "certStudent"
  ).textContent =
    student ||
    "Student Name";


  document.getElementById(
    "certCourse"
  ).textContent =
    course ||
    "Course Name";


  document.getElementById(
    "certTitle"
  ).textContent =
    title ||
    "Certificate of Completion";


  document.getElementById(
    "certDate"
  ).textContent =
    date
      ? new Date(
          date + "T00:00:00"
        ).toLocaleDateString()
      : "Date";


  localStorage.setItem(
    "certificateDraft",
    JSON.stringify({
      student,
      course,
      title,
      date
    })
  );

}


/* =========================
   RESTORE
========================= */

function restore(){

  const saved =
    JSON.parse(
      localStorage.getItem(
        "certificateDraft"
      ) || "null"
    );

  if(!saved)
    return;

  document.getElementById(
    "student"
  ).value =
    saved.student || "";

  document.getElementById(
    "course"
  ).value =
    saved.course || "";

  document.getElementById(
    "title"
  ).value =
    saved.title ||
    "Certificate of Completion";

  document.getElementById(
    "date"
  ).value =
    saved.date || "";

  updateCertificate();

}


/* =========================
   AUTO UPDATE
========================= */

[
  "student",
  "course",
  "title",
  "date"
].forEach(id=>{

  document
    .getElementById(id)
    .addEventListener(
      "input",
      updateCertificate
    );

});


restore();
loadCertificateData();

</script>

</body>
</html>
