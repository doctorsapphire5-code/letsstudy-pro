<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Verify Certificate | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  padding:16px 6%;
  border-bottom:1px solid #eee;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.container{
  width:92%;
  max-width:700px;
  margin:55px auto;
}

.box{
  background:#fff;
  border-radius:18px;
  padding:35px;
  box-shadow:0 8px 30px #0000000b;
}

h1{
  font-size:30px;
  margin-bottom:10px;
}

.subtitle{
  color:#64748b;
  line-height:1.6;
  margin-bottom:25px;
}

.form{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:14px;
  border:1px solid #dce1e8;
  border-radius:9px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#2563eb;
}

button{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:14px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:600;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.result{
  margin-top:25px;
}

.success{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  color:#166534;
  padding:20px;
  border-radius:12px;
}

.invalid{
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
  padding:20px;
  border-radius:12px;
}

.loading{
  background:#eff6ff;
  color:#1d4ed8;
  padding:20px;
  border-radius:12px;
}

.details{
  margin-top:15px;
  color:#334155;
  line-height:1.8;
}

.view{
  display:inline-block;
  margin-top:18px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:10px 14px;
  border-radius:8px;
}

@media(max-width:600px){
  .box{
    padding:25px 18px;
  }

  .form{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>
</header>


<main class="container">

  <section class="box">

    <h1>
      Verify Certificate
    </h1>

    <p class="subtitle">
      Enter the certificate ID to verify
      whether a LetsStudy Pro certificate
      is authentic.
    </p>


    <form
      id="verifyForm"
      class="form"
    >

      <input
        id="certificateId"
        type="text"
        placeholder="Enter Certificate ID"
        autocomplete="off"
        required
      >

      <button
        id="verifyButton"
        type="submit"
      >
        Verify
      </button>

    </form>


    <div
      id="result"
      class="result"
    ></div>

  </section>

</main>


<script>

const API = "/api/data";

const form =
  document.getElementById(
    "verifyForm"
  );

const input =
  document.getElementById(
    "certificateId"
  );

const result =
  document.getElementById(
    "result"
  );

const button =
  document.getElementById(
    "verifyButton"
  );


/* =========================
   VERIFY
========================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const id =
      input.value.trim();


    if(!id){

      showInvalid(
        "Please enter a certificate ID."
      );

      return;

    }


    button.disabled = true;

    button.textContent =
      "Verifying...";


    result.innerHTML = `

      <div class="loading">
        Checking certificate...
      </div>

    `;


    try{

      const url =
        API +
        "?collection=certificates&id=" +
        encodeURIComponent(id);


      const response =
        await fetch(url);


      if(response.status === 404){

        showInvalid(
          "Certificate not found. Please check the Certificate ID and try again."
        );

        return;

      }


      if(!response.ok){

        throw new Error(
          "Verification request failed"
        );

      }


      const data =
        await response.json();


      if(
        !data.success ||
        !data.data
      ){

        showInvalid(
          "Certificate could not be verified."
        );

        return;

      }


      showValid(
        data.data
      );


    }catch(error){

      console.error(
        "CERTIFICATE VERIFY:",
        error
      );


      result.innerHTML = `

        <div class="invalid">

          <strong>
            Verification failed
          </strong>

          <div class="details">
            Please try again later.
          </div>

        </div>

      `;

    }finally{

      button.disabled = false;

      button.textContent =
        "Verify";

    }

  }
);


/* =========================
   VALID
========================= */

function showValid(data){

  const id =
    data.id ||
    data.documentId ||
    input.value.trim();


  const student =
    data.studentName ||
    data.student ||
    data.recipientName ||
    "Not specified";


  const course =
    data.courseName ||
    data.courseTitle ||
    data.course ||
    "Not specified";


  const date =
    formatDate(
      data.completedAt ||
      data.completionDate ||
      data.date ||
      data.createdAt
    );


  result.innerHTML = `

    <div class="success">

      <strong>
        ✓ Certificate Verified
      </strong>

      <div class="details">

        <div>
          <strong>
            Certificate ID:
          </strong>
          ${escapeHTML(id)}
        </div>

        <div>
          <strong>
            Student:
          </strong>
          ${escapeHTML(student)}
        </div>

        <div>
          <strong>
            Course:
          </strong>
          ${escapeHTML(course)}
        </div>

        <div>
          <strong>
            Completion Date:
          </strong>
          ${escapeHTML(date)}
        </div>

      </div>


      <a
        class="view"
        href="certificate-view.html?id=${encodeURIComponent(id)}"
      >
        View Certificate
      </a>

    </div>

  `;

}


/* =========================
   INVALID
========================= */

function showInvalid(message){

  result.innerHTML = `

    <div class="invalid">

      <strong>
        ✕ Certificate Not Verified
      </strong>

      <div class="details">
        ${escapeHTML(message)}
      </div>

    </div>

  `;

}


/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value)
    return "Not specified";


  const date =
    new Date(value);


  if(
    isNaN(date.getTime())
  ){

    return String(value);

  }


  return date.toLocaleDateString(
    undefined,
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   AUTO VERIFY FROM URL
========================= */

const params =
  new URLSearchParams(
    location.search
  );


const urlId =
  params.get("id") ||
  params.get("certificateId") ||
  params.get("documentId");


if(urlId){

  input.value = urlId;

  form.requestSubmit();

}

</script>

</body>
</html>
