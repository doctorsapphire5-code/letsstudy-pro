<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Verify Certificate | Let'sStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
}

.container{
max-width:700px;
margin:auto;
padding:30px 15px;
}

.header{
text-align:center;
margin-bottom:25px;
}

.header i{
font-size:45px;
margin-bottom:12px;
}

.header h1{
margin:0 0 8px;
}

.header p{
margin:0;
color:#64748b;
font-size:14px;
}

.card{
background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 6px 25px rgba(0,0,0,.07);
}

label{
display:block;
font-weight:bold;
font-size:13px;
margin-bottom:8px;
}

.input-row{
display:flex;
gap:10px;
}

input{
flex:1;
padding:14px;
border:1px solid #dbe2ea;
border-radius:10px;
outline:none;
font-family:inherit;
}

input:focus{
border-color:#2563eb;
}

button{
border:0;
padding:13px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:#172033;
color:white;
}

.result{
margin-top:20px;
}

.verified{
background:#ecfdf5;
border:1px solid #a7f3d0;
color:#065f46;
padding:18px;
border-radius:14px;
}

.revoked{
background:#fef2f2;
border:1px solid #fecaca;
color:#991b1b;
padding:18px;
border-radius:14px;
}

.not-found{
background:#fff7ed;
border:1px solid #fed7aa;
color:#9a3412;
padding:18px;
border-radius:14px;
}

.status{
font-weight:bold;
margin-bottom:12px;
}

.details{
margin-top:15px;
background:#fff;
border-radius:10px;
padding:15px;
color:#334155;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:9px 0;
border-bottom:1px solid #eef2f7;
font-size:13px;
}

.row:last-child{
border-bottom:0;
}

.value{
font-weight:bold;
text-align:right;
word-break:break-word;
}

.loading{
text-align:center;
padding:20px;
color:#64748b;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color:#94a3b8;
}

@media(max-width:600px){

.input-row{
flex-direction:column;
}

button{
width:100%;
}

.row{
flex-direction:column;
gap:4px;
}

.value{
text-align:left;
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">

<i class="fa-solid fa-certificate"></i>

<h1>
Verify Certificate
</h1>

<p>
Verify the authenticity of a Let'sStudy Pro certificate.
</p>

</div>


<div class="card">

<form id="verifyForm">

<label>
Certificate Number
</label>

<div class="input-row">

<input
id="certificateNumber"
type="text"
placeholder="Enter certificate number"
autocomplete="off"
required>

<button type="submit">

<i class="fa-solid fa-shield-check"></i>

Verify

</button>

</div>

</form>


<div
id="result"
class="result">
</div>

</div>


<div class="footer">

Let'sStudy Pro Certificate Verification

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* ==========================================
   FIREBASE
========================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ==========================================
   ELEMENTS
========================================== */

const form=
document.getElementById(
"verifyForm"
);

const input=
document.getElementById(
"certificateNumber"
);

const result=
document.getElementById(
"result"
);


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==========================================
   VERIFY
========================================== */

form.addEventListener(
"submit",
async event=>{

event.preventDefault();


const number=
input.value.trim();


if(!number){

return;

}


result.innerHTML=`

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

&nbsp;

Verifying certificate...

</div>

`;


try{

const snapshot=
await getDocs(
collection(
db,
"certificates"
)
);


const found=
snapshot.docs.find(
document=>{

const data=
document.data();

return String(
data.certificateNumber || ""
)
.toLowerCase()
.trim()
===
number.toLowerCase();

}
);


if(!found){

result.innerHTML=`

<div class="not-found">

<div class="status">

<i class="fa-solid fa-circle-xmark"></i>

Certificate Not Found

</div>

<p>
We could not find a certificate with this certificate number.
</p>

</div>

`;

return;

}


const data=
found.data();


/* ==========================================
   REVOKED
========================================== */

if(
data.status === "revoked"
){

result.innerHTML=`

<div class="revoked">

<div class="status">

<i class="fa-solid fa-ban"></i>

Certificate Revoked

</div>

<p>
This certificate is no longer valid.
</p>


<div class="details">

<div class="row">

<span>
Certificate Number
</span>

<span class="value">
${escapeHTML(
data.certificateNumber
)}
</span>

</div>


<div class="row">

<span>
Student
</span>

<span class="value">
${escapeHTML(
data.studentName
)}
</span>

</div>


<div class="row">

<span>
Completion Date
</span>

<span class="value">
${escapeHTML(
data.completionDate
)}
</span>

</div>

</div>

</div>

`;

return;

}


/* ==========================================
   VERIFIED
========================================== */

result.innerHTML=`

<div class="verified">

<div class="status">

<i class="fa-solid fa-circle-check"></i>

Certificate Verified

</div>

<p>
This certificate has been successfully verified as an authentic Let'sStudy Pro certificate.
</p>


<div class="details">

<div class="row">

<span>
Certificate Number
</span>

<span class="value">
${escapeHTML(
data.certificateNumber
)}
</span>

</div>


<div class="row">

<span>
Student Name
</span>

<span class="value">
${escapeHTML(
data.studentName
)}
</span>

</div>


<div class="row">

<span>
Student Email
</span>

<span class="value">
${escapeHTML(
data.studentEmail
)}
</span>

</div>


<div class="row">

<span>
Course ID
</span>

<span class="value">
${escapeHTML(
data.courseId
)}
</span>

</div>


<div class="row">

<span>
Completion Date
</span>

<span class="value">
${escapeHTML(
data.completionDate
)}
</span>

</div>


<div class="row">

<span>
Status
</span>

<span class="value">
${escapeHTML(
data.status || "active"
)}
</span>

</div>

</div>

</div>

`;

}catch(error){

console.error(error);

result.innerHTML=`

<div class="not-found">

<div class="status">

<i class="fa-solid fa-triangle-exclamation"></i>

Verification Error

</div>

<p>
Unable to verify this certificate right now.
</p>

</div>

`;

}

});

</script>

</body>
</html>
