<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>View Certificate | Let'sStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#eef2f7;
color:#172033;
}

.page{
max-width:1100px;
margin:auto;
padding:20px;
}

.loading,
.error{
background:#fff;
padding:50px 20px;
border-radius:16px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.error{color:#991b1b}

.certificate{
position:relative;
overflow:hidden;
background:#fff;
border:10px solid #172033;
padding:12px;
box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.inner{
position:relative;
min-height:620px;
border:2px solid #c9a227;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:50px 35px;
overflow:hidden;
}

.background{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
opacity:.16;
z-index:0;
}

.content{
position:relative;
z-index:2;
width:100%;
}

.logo{
max-width:130px;
max-height:85px;
object-fit:contain;
margin-bottom:20px;
}

.issuer{
font-size:14px;
font-weight:bold;
letter-spacing:2px;
text-transform:uppercase;
}

.title{
font-family:Georgia,serif;
font-size:48px;
margin:20px 0 10px;
}

.presented{
color:#64748b;
margin-top:15px;
}

.student{
font-family:Georgia,serif;
font-size:36px;
font-weight:bold;
margin:18px 0;
padding:0 20px 10px;
border-bottom:1px solid #c9a227;
display:inline-block;
}

.course{
font-size:20px;
font-weight:bold;
margin-top:20px;
}

.description{
max-width:700px;
margin:15px auto;
color:#64748b;
line-height:1.6;
}

.details{
display:flex;
justify-content:center;
gap:35px;
flex-wrap:wrap;
margin-top:30px;
font-size:12px;
color:#64748b;
}

.detail strong{
display:block;
color:#172033;
margin-top:5px;
}

.status{
display:inline-block;
margin-top:25px;
padding:7px 15px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.active{
background:#dcfce7;
color:#166534;
}

.revoked{
background:#fee2e2;
color:#991b1b;
}

.actions{
display:flex;
justify-content:center;
gap:10px;
margin-top:20px;
flex-wrap:wrap;
}

button{
border:0;
padding:12px 18px;
border-radius:9px;
cursor:pointer;
font-weight:bold;
}

.print{
background:#172033;
color:#fff;
}

.back{
background:#e2e8f0;
color:#334155;
}

@media(max-width:700px){

.page{
padding:10px;
}

.certificate{
border-width:6px;
}

.inner{
padding:35px 15px;
min-height:520px;
}

.title{
font-size:34px;
}

.student{
font-size:25px;
}

.course{
font-size:17px;
}

}

@media print{

body{
background:#fff;
}

.page{
padding:0;
}

.actions{
display:none;
}

.certificate{
box-shadow:none;
}

}
</style>
</head>

<body>

<div class="page">

<div id="loading" class="loading">
Loading certificate...
</div>

<div id="error"
class="error"
style="display:none">

<div id="errorText">
Certificate not found.
</div>

</div>


<div id="certificate"
class="certificate"
style="display:none">

<div id="inner" class="inner">

<img
id="background"
class="background"
style="display:none"
alt="Certificate Background">

<div class="content">

<img
id="logo"
class="logo"
style="display:none"
alt="Let'sStudy Pro Logo">


<div id="issuer"
class="issuer">
Let'sStudy Pro
</div>


<h1 class="title">
Certificate of Completion
</h1>


<div class="presented">
This certificate is proudly presented to
</div>


<div
id="student"
class="student">
Student Name
</div>


<div class="presented">
for successfully completing
</div>


<div
id="course"
class="course">
Course
</div>


<div
id="description"
class="description">
</div>


<div
id="status"
class="status">
VERIFIED
</div>


<div class="details">

<div class="detail">
Certificate Number
<strong id="number">-</strong>
</div>

<div class="detail">
Completion Date
<strong id="date">-</strong>
</div>

<div class="detail">
Issued By
<strong id="issuerTitle">-</strong>
</div>

</div>

</div>

</div>

</div>


<div class="actions">

<button
class="print"
onclick="window.print()">

Print / Save PDF

</button>

<button
class="back"
onclick="history.back()">

Back

</button>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ==========================================
   ELEMENTS
========================================== */

const loading=
document.getElementById("loading");

const errorBox=
document.getElementById("error");

const errorText=
document.getElementById("errorText");

const certificate=
document.getElementById("certificate");

const inner=
document.getElementById("inner");

const background=
document.getElementById("background");

const logo=
document.getElementById("logo");

const issuer=
document.getElementById("issuer");

const issuerTitle=
document.getElementById("issuerTitle");

const student=
document.getElementById("student");

const course=
document.getElementById("course");

const description=
document.getElementById("description");

const number=
document.getElementById("number");

const date=
document.getElementById("date");

const status=
document.getElementById("status");


/* ==========================================
   GET CERTIFICATE ID
========================================== */

const params=
new URLSearchParams(
window.location.search
);

const certificateId=
params.get("certificateId");


/* ==========================================
   LOAD
========================================== */

async function loadCertificate(){

if(!certificateId){

showError(
"No certificate ID provided."
);

return;

}

try{

/* CERTIFICATE */

const certificateRef=
doc(
db,
"certificates",
certificateId
);

const certificateSnap=
await getDoc(
certificateRef
);


if(!certificateSnap.exists()){

showError(
"Certificate not found."
);

return;

}


const certificateData=
certificateSnap.data();


/* ========================================
   CERTIFICATE DATA
======================================== */

student.textContent=
certificateData.studentName || "-";

number.textContent=
certificateData.certificateNumber || "-";

date.textContent=
certificateData.completionDate || "-";


course.textContent=
certificateData.courseId
?
"Course ID: "+
certificateData.courseId
:
"";


/* ========================================
   STATUS
======================================== */

const currentStatus=
certificateData.status || "active";

status.textContent=
currentStatus.toUpperCase();

if(currentStatus==="revoked"){

status.className=
"status revoked";

}else{

status.className=
"status active";

}


/* ========================================
   TEMPLATE
======================================== */

if(certificateData.templateId){

const templateRef=
doc(
db,
"certificateTemplates",
certificateData.templateId
);

const templateSnap=
await getDoc(
templateRef
);


if(templateSnap.exists()){

const template=
templateSnap.data();


issuer.textContent=
template.issuerName ||
"Let'sStudy Pro";

issuerTitle.textContent=
template.issuerTitle ||
"-";

description.textContent=
template.description ||
"";


/* LOGO */

if(template.logo){

logo.src=
template.logo;

logo.style.display=
"block";

logo.onerror=()=>{

logo.style.display=
"none";

};

}


/* BACKGROUND */

if(template.background){

background.src=
template.background;

background.style.display=
"block";

background.onerror=()=>{

background.style.display=
"none";

};

}


/* ORIENTATION */

if(
template.orientation==="portrait"
){

certificate.style.maxWidth=
"760px";

certificate.style.margin=
"auto";

inner.style.minHeight=
"850px";

}else{

certificate.style.maxWidth=
"1100px";

inner.style.minHeight=
"620px";

}

}

}


/* ========================================
   SHOW
======================================== */

loading.style.display=
"none";

certificate.style.display=
"block";


}catch(error){

console.error(error);

showError(
"Unable to load certificate."
);

}

}


/* ==========================================
   ERROR
========================================== */

function showError(text){

loading.style.display=
"none";

certificate.style.display=
"none";

errorBox.style.display=
"block";

errorText.textContent=
text;

}


loadCertificate();

</script>

</body>
</html>
