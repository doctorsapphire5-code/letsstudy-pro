<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate | LetsStudy Pro</title>

<meta
  name="description"
  content="View your LetsStudy Pro certificate."
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
  cursor:pointer;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;

  padding:14px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:20px;
  font-weight:900;
  color:#2563eb;
}

.logo span{
  color:#7c3aed;
}

nav{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

nav a{
  background:#f1f5f9;
  padding:8px 11px;
  border-radius:8px;

  font-size:8px;
  font-weight:900;
}

nav a:hover{
  background:#dbeafe;
  color:#2563eb;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:28px 15px 60px;
}

.breadcrumb{
  display:flex;
  gap:7px;
  flex-wrap:wrap;

  font-size:8px;
  color:#64748b;

  margin-bottom:18px;
}

.breadcrumb a{
  color:#2563eb;
  font-weight:900;
}

.page-title{
  text-align:center;
  margin-bottom:22px;
}

.page-title h1{
  font-size:27px;
  margin-bottom:7px;
}

.page-title p{
  font-size:8px;
  color:#64748b;
}


/* =====================================
   CERTIFICATE
===================================== */

.certificate-wrapper{
  background:#fff;

  border:1px solid #e2e8f0;

  border-radius:18px;

  padding:15px;

  box-shadow:
    0 15px 40px
    rgba(15,23,42,.08);
}

.certificate{

  position:relative;

  min-height:620px;

  border:
    8px solid
    #1d4ed8;

  padding:45px 35px;

  text-align:center;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f8fbff
    );

  overflow:hidden;
}

.certificate::before{

  content:"";

  position:absolute;

  inset:15px;

  border:
    2px solid
    #93c5fd;

  pointer-events:none;

}

.certificate::after{

  content:"";

  position:absolute;

  width:300px;
  height:300px;

  border-radius:50%;

  border:
    1px solid
    rgba(37,99,235,.08);

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

.cert-content{
  position:relative;
  z-index:2;
}

.brand{
  font-size:12px;
  font-weight:900;
  letter-spacing:3px;

  color:#2563eb;

  margin-bottom:30px;
}

.logo-icon{
  font-size:55px;
  margin-bottom:8px;
}

.cert-heading{
  font-family:Georgia,serif;

  font-size:30px;

  color:#172554;

  margin-bottom:10px;
}

.subtitle{
  font-size:9px;

  color:#64748b;

  letter-spacing:1px;

  margin-bottom:25px;
}

.student-label{
  font-size:7px;

  color:#64748b;

  margin-bottom:8px;
}

.student-name{
  font-family:Georgia,serif;

  font-size:30px;

  color:#0f172a;

  font-weight:bold;

  margin-bottom:12px;
}

.completed{
  font-size:8px;

  color:#475569;

  margin-bottom:10px;
}

.course-name{

  font-family:Georgia,serif;

  font-size:22px;

  color:#2563eb;

  font-weight:bold;

  max-width:750px;

  margin:
    0 auto
    25px;

}

.details{

  display:flex;

  justify-content:
    center;

  gap:60px;

  margin-top:25px;

  flex-wrap:wrap;

}

.detail{
  min-width:120px;
}

.detail-label{
  display:block;

  font-size:6px;

  color:#64748b;

  text-transform:uppercase;

  letter-spacing:1px;

  margin-bottom:5px;
}

.detail-value{
  font-size:8px;

  font-weight:900;

  color:#334155;
}

.signature-area{

  display:flex;

  justify-content:
    space-around;

  gap:40px;

  margin-top:45px;

  flex-wrap:wrap;
}

.signature{
  min-width:170px;
}

.signature-line{
  width:170px;

  border-top:
    1px solid
    #64748b;

  margin:
    0 auto
    6px;
}

.signature small{
  font-size:6px;
  color:#64748b;
}

.seal{

  width:75px;
  height:75px;

  border-radius:50%;

  border:
    3px solid
    #2563eb;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  margin:0 auto;
}

.seal strong{
  font-size:16px;
  color:#2563eb;
}

.seal span{
  font-size:5px;
  font-weight:900;
  color:#64748b;
}

.certificate-id{

  margin-top:30px;

  font-size:6px;

  color:#64748b;

  word-break:break-all;
}


/* =====================================
   STATUS
===================================== */

.status{

  margin-top:18px;

  display:flex;

  justify-content:center;
}

.status span{

  display:inline-flex;

  align-items:center;

  gap:6px;

  padding:
    7px
    12px;

  border-radius:20px;

  font-size:7px;

  font-weight:900;
}

.status.verified span{
  background:#dcfce7;
  color:#15803d;
}

.status.pending span{
  background:#fef3c7;
  color:#a16207;
}


/* =====================================
   ACTIONS
===================================== */

.actions{

  display:flex;

  justify-content:center;

  gap:9px;

  flex-wrap:wrap;

  margin-top:20px;
}

.action{

  padding:
    10px
    14px;

  border-radius:9px;

  background:#fff;

  border:
    1px solid
    #cbd5e1;

  font-size:7px;

  font-weight:900;

  color:#334155;
}

.action.primary{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.action.verify{
  background:#f0fdf4;
  color:#15803d;
  border-color:#bbf7d0;
}

.action:hover{
  transform:translateY(-1px);
}


/* =====================================
   INFO
===================================== */

.info-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;

  margin-top:22px;
}

.info-card{

  background:#fff;

  border:
    1px solid
    #e2e8f0;

  border-radius:13px;

  padding:15px;

  text-align:center;
}

.info-icon{
  font-size:25px;
  margin-bottom:7px;
}

.info-card h3{
  font-size:9px;
  margin-bottom:5px;
}

.info-card p{
  font-size:6px;
  color:#64748b;
  line-height:1.6;
}


/* =====================================
   LOADING
===================================== */

.loading{

  background:#fff;

  border-radius:18px;

  padding:70px 20px;

  text-align:center;

  color:#64748b;

  font-size:8px;
}

.spinner{

  width:38px;
  height:38px;

  border:
    4px solid
    #e2e8f0;

  border-top-color:
    #2563eb;

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin:
    0 auto
    14px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =====================================
   ERROR
===================================== */

.error{

  background:#fff;

  border:
    1px solid
    #fecaca;

  border-radius:18px;

  padding:60px 20px;

  text-align:center;
}

.error-icon{
  font-size:45px;
  margin-bottom:10px;
}

.error h2{
  font-size:16px;
  margin-bottom:7px;
}

.error p{
  font-size:8px;
  color:#64748b;
  line-height:1.6;
}

.error a{

  display:inline-block;

  margin-top:15px;

  padding:
    10px
    14px;

  background:#2563eb;

  color:#fff;

  border-radius:8px;

  font-size:7px;

  font-weight:900;
}


/* =====================================
   FOOTER
===================================== */

footer{

  text-align:center;

  padding:
    30px
    15px;

  font-size:8px;

  color:#64748b;
}

.footer-links{

  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:13px;

  margin-bottom:10px;
}

.footer-links a{
  font-weight:900;
}


/* =====================================
   RESPONSIVE
===================================== */

@media(max-width:700px){

  .certificate{
    min-height:auto;
    padding:35px 20px;
    border-width:5px;
  }

  .cert-heading{
    font-size:23px;
  }

  .student-name{
    font-size:24px;
  }

  .course-name{
    font-size:18px;
  }

  .details{
    gap:25px;
  }

  .signature-area{
    margin-top:30px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{
    flex-direction:column;
    align-items:flex-start;
  }

  nav{
    width:100%;
  }

  nav a{
    flex:1;
    text-align:center;
  }

}

</style>

</head>


<body>


<header>

<a
  href="dashboard.html"
  class="logo"
>
  LetsStudy <span>Pro</span>
</a>


<nav>

<a href="student-certificate.html">
  My Certificates
</a>

<a href="certificate-verify.html">
  Verify
</a>

<a href="download.html">
  Downloads
</a>

</nav>

</header>


<main class="container">


<div class="breadcrumb">

<a href="student-certificate.html">
  My Certificates
</a>

<span>›</span>

<span>
  Certificate View
</span>

</div>


<div
  id="content"
>


<div class="loading">

<div class="spinner"></div>

Loading certificate...

</div>


</div>


</main>


<footer>

<div class="footer-links">

<a href="student-certificate.html">
  My Certificates
</a>

<a href="certificate-verify.html">
  Verify
</a>

<a href="download.html">
  Downloads
</a>

<a href="dashboard.html">
  Dashboard
</a>

</div>

©
<span id="year"></span>
LetsStudy Pro

</footer>


<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXKXjsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


const auth =
  getAuth(
    app
  );


const content =
  document.getElementById(
    "content"
  );


/* =========================================
   GET URL ID
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const certificateId =
  params.get(
    "id"
  );


/* =========================================
   CHECK ID
========================================= */

if(!certificateId){

  showError(
    "Certificate ID Missing",
    "The certificate you are trying to view could not be identified."
  );

}


/* =========================================
   AUTH
========================================= */

if(certificateId){

  onAuthStateChanged(
    auth,
    async user => {

      if(!user){

        showError(
          "Login Required",
          "Please login to view this certificate."
        );

        return;

      }


      await loadCertificate(
        user,
        certificateId
      );

    }
  );

}


/* =========================================
   LOAD CERTIFICATE
========================================= */

async function loadCertificate(
  user,
  id
){

  try{

    const certificateRef =
      doc(
        db,
        "certificates",
        id
      );


    const snapshot =
      await getDoc(
        certificateRef
      );


    if(!snapshot.exists()){

      showError(
        "Certificate Not Found",
        "This certificate does not exist or may have been removed."
      );

      return;

    }


    const data =
      snapshot.data();


    /* ================================
       SECURITY CHECK
    ================================= */

    if(
      data.userId &&
      data.userId !== user.uid
    ){

      showError(
        "Access Denied",
        "This certificate does not belong to the signed-in account."
      );

      return;

    }


    renderCertificate(
      id,
      data
    );


  }catch(error){

    console.error(
      "Certificate view error:",
      error
    );


    showError(
      "Unable to Load Certificate",
      "Something went wrong while loading the certificate."
    );

  }

}


/* =========================================
   RENDER CERTIFICATE
========================================= */

function renderCertificate(
  id,
  data
){

  const certificateId =
    data.certificateId ||
    id;


  const studentName =
    data.studentName ||
    data.userName ||
    data.name ||
    auth.currentUser?.displayName ||
    "Certificate Holder";


  const courseName =
    data.courseTitle ||
    data.courseName ||
    "Completed Course";


  const issuedDate =
    formatDate(
      data.issuedAt ||
      data.createdAt
    );


  const expiryDate =
    data.expiryDate
    ?
    formatDate(
      data.expiryDate
    )
    :
    "No Expiry";


  const verified =
    data.verified !== false;


  const certificateNumber =
    data.certificateNumber ||
    certificateId;


  content.innerHTML = `

    <div class="page-title">

      <h1>
        Certificate of Completion
      </h1>

      <p>
        Official LetsStudy Pro learning certificate
      </p>

    </div>


    <div class="certificate-wrapper">


      <div class="certificate">


        <div class="cert-content">


          <div class="brand">
            LETSSTUDY PRO
          </div>


          <div class="logo-icon">
            🎓
          </div>


          <div class="cert-heading">
            Certificate of Completion
          </div>


          <div class="subtitle">
            THIS CERTIFICATE IS PROUDLY PRESENTED TO
          </div>


          <div class="student-label">
            AWARDED TO
          </div>


          <div class="student-name">
            ${escapeHTML(studentName)}
          </div>


          <div class="completed">
            For successfully completing the course
          </div>


          <div class="course-name">
            ${escapeHTML(courseName)}
          </div>


          <div class="details">


            <div class="detail">

              <span class="detail-label">
                Issue Date
              </span>

              <span class="detail-value">
                ${issuedDate}
              </span>

            </div>


            <div class="detail">

              <span class="detail-label">
                Certificate No.
              </span>

              <span class="detail-value">
                ${escapeHTML(certificateNumber)}
              </span>

            </div>


            <div class="detail">

              <span class="detail-label">
                Expiry
              </span>

              <span class="detail-value">
                ${expiryDate}
              </span>

            </div>


          </div>


          <div class="signature-area">


            <div class="signature">

              <div class="signature-line"></div>

              <small>
                LetsStudy Pro
              </small>

            </div>


            <div class="seal">

              <strong>
                ✓
              </strong>

              <span>
                VERIFIED
              </span>

            </div>


            <div class="signature">

              <div class="signature-line"></div>

              <small>
                Certificate Authority
              </small>

            </div>


          </div>


          <div class="certificate-id">

            Certificate ID:
            ${escapeHTML(certificateId)}

          </div>


        </div>

      </div>


      <div
        class="status ${
          verified
          ?
          "verified"
          :
          "pending"
        }"
      >

        <span>

          ${
            verified
            ?
            "✓ Verified Certificate"
            :
            "⏳ Pending Verification"
          }

        </span>

      </div>


    </div>


    <div class="actions">


      <a
        class="action"
        href="student-certificate.html"
      >
        ← My Certificates
      </a>


      <a
        class="action verify"
        href="certificate-verify.html?id=${encodeURIComponent(
          certificateId
        )}"
      >
        ✓ Verify Certificate
      </a>


      <a
        class="action primary"
        href="download.html?certificateId=${encodeURIComponent(
          id
        )}"
      >
        ⬇ Download Certificate
      </a>


    </div>


    <div class="info-grid">


      <div class="info-card">

        <div class="info-icon">
          🔐
        </div>

        <h3>
          Secure
        </h3>

        <p>
          Your certificate is linked to your LetsStudy Pro account.
        </p>

      </div>


      <div class="info-card">

        <div class="info-icon">
          ✓
        </div>

        <h3>
          Verifiable
        </h3>

        <p>
          Anyone can verify the certificate using its unique ID.
        </p>

      </div>


      <div class="info-card">

        <div class="info-icon">
          📥
        </div>

        <h3>
          Downloadable
        </h3>

        <p>
          Download or save your certificate for your records.
        </p>

      </div>


    </div>

  `;

}


/* =========================================
   ERROR
========================================= */

function showError(
  title,
  message
){

  content.innerHTML = `

    <div class="error">

      <div class="error-icon">
        ⚠️
      </div>

      <h2>
        ${escapeHTML(title)}
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>


      <a
        href="student-certificate.html"
      >
        ← My Certificates
      </a>

    </div>

  `;

}


/* =========================================
   DATE FORMAT
========================================= */

function formatDate(
  value
){

  if(!value){

    return "—";

  }


  if(
    typeof value.toDate ===
    "function"
  ){

    return value
      .toDate()
      .toLocaleDateString(
        "en-US",
        {
          year:"numeric",
          month:"long",
          day:"numeric"
        }
      );

  }


  const date =
    new Date(
      value
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "—";

  }


  return date.toLocaleDateString(
    "en-US",
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   YEAR
========================================= */

document.getElementById(
  "year"
).textContent =
  new Date()
    .getFullYear();

</script>

</body>
</html>
