<!DOCTYPE html>
<html>

<head>

<title>Certificate | LetsStudy Pro</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
}

.container{
max-width:900px;
margin:40px auto;
padding:20px;
}

.certificate{

background:white;
border:8px solid #0b57d0;
padding:50px;
text-align:center;
border-radius:20px;

}


h1{
color:#0b57d0;
}


.id{
font-weight:bold;
}


button{

background:#0b57d0;
color:white;
padding:12px 20px;
border:0;
border-radius:8px;

}

</style>


</head>


<body>


<div class="container">


<div id="certificate"
class="certificate">

Loading Certificate...


</div>


</div>





<script type="module">


import {

db

}

from "./assets/js/firebase.js";


import {

doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const params =
new URLSearchParams(
location.search
);



const id =
params.get("id");




async function loadCertificate(){


const snap =

await getDoc(

doc(
db,
"certificates",
id
)

);



if(!snap.exists()){


document.getElementById(
"certificate"
).innerHTML=

"Certificate not found";


return;


}



const c =
snap.data();



document.getElementById(
"certificate"
).innerHTML=

`

<h1>
🎓 Certificate of Completion
</h1>


<h2>
LetsStudy Pro
</h2>


<p>
This certifies that
</p>


<h2>
${c.studentName}
</h2>


<p>
has successfully completed
</p>


<h2>
${c.courseName}
</h2>


<br>


<p class="id">

Certificate ID:
${c.certificateId}

</p>


<p>

Issued:
${c.issuedAt?.toDate
?
c.issuedAt.toDate().toDateString()
:
""}

</p>


<button onclick="window.print()">

Download / Print

</button>


`;

}


loadCertificate();


</script>


</body>

</html>
