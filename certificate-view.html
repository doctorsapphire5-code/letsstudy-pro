<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  padding:16px 6%;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:94%;
  max-width:1100px;
  margin:30px auto;
}

.status{
  background:#fff;
  border-radius:14px;
  padding:40px 20px;
  text-align:center;
  color:#64748b;
}

.certificate{
  display:none;
  background:#fff;
  border:12px solid #2563eb;
  padding:55px;
  min-height:650px;
  position:relative;
  text-align:center;
}

.certificate:before{
  content:"";
  position:absolute;
  inset:15px;
  border:2px solid #2563eb;
  pointer-events:none;
}

.content{
  position:relative;
  z-index:1;
  min-height:520px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.title{
  font-size:42px;
  font-weight:800;
  margin-bottom:20px;
}

.presented{
  color:#64748b;
  margin-bottom:10px;
}

.student{
  font-size:38px;
  font-weight:800;
  margin:15px 0;
}

.course{
  font-size:24px;
  font-weight:700;
  margin-top:8px;
}

.date{
  margin-top:25px;
  color:#475569;
}

.id{
  margin-top:12px;
  color:#64748b;
  font-size:13px;
}

.signature{
  margin-top:40px;
  border-top:1px solid #172033;
  padding-top:7px;
  width:190px;
}

.actions{
  display:none;
  gap:10px;
  justify-content:center;
  margin-top:20px;
  flex-wrap:wrap;
}

.verify{
  color:#15803d;
  background:#dcfce7;
  padding:7px 12px;
  border-radius:20px;
  margin-top:15px;
  font-size:13px;
}

@media(max-width:700px){
  .certificate{
    padding:35px 20px;
  }

  .title{
    font-size:30px;
  }

  .student{
    font-size:27px;
  }

  .course{
    font-size:19px;
  }
}

@media print{
  header,
  .actions{
    display:none!important;
  }

  body{
    background:#fff;
  }

  .container{
    width:100%;
    max-width:none;
    margin:0;
  }

  .certificate{
    display:block!important;
    border-width:10px;
    min-height:100vh;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="btn"
    onclick="location.href='certificate.html'"
  >
    Certificates
  </button>

</header>

<main class="container">

  <div
    id="status"
    class="status"
  >
    Loading certificate...
  </div>


  <section
    id="certificate"
    class="certificate"
  >

    <div class="content">

      <div
        id="title"
        class="title"
      >
        Certificate of Completion
      </div>

      <div class="presented">
        This certificate is proudly presented to
      </div>

      <div
        id="student"
        class="student"
      >
        Student
      </div>

      <div>
        for successfully completing
      </div>

      <div
        id="course"
        class="course"
      >
        Course
      </div>

      <div
        id="date"
        class="date"
      >
        Date
      </div>

      <div
        id="verify"
        class="verify"
      >
        ✓ Certificate Verified
      </div>

      <div
        id="certificateId"
        class="id"
      ></div>

      <div class="signature">
        LetsStudy Pro
      </div>

    </div>

  </section>


  <div
    id="actions"
    class="actions"
  >

    <button
      class="btn"
      onclick="window.print()"
    >
      Print / Save PDF
    </button>

    <button
      class="btn"
      onclick="location.reload()"
    >
      Refresh
    </button>

  </div>

</main>

<script>

const API = "/api/data";

const params =
  new URLSearchParams(
    location.search
  );

const certificateId =
  params.get("id") ||
  params.get("documentId") ||
  params.get("certificateId");


/* =========================
   LOAD CERTIFICATE
========================= */

async function loadCertificate(){

  const status =
    document.getElementById(
      "status"
    );

  try{

    if(!certificateId){

      throw new Error(
        "Certificate ID missing"
      );

    }


    const url =
      API +
      "?collection=certificates&id=" +
      encodeURIComponent(
        certificateId
      );


    const response =
      await fetch(url);


    if(!response.ok){

      if(response.status === 404){

        throw new Error(
          "Certificate not found"
        );

      }

      throw new Error(
        "Unable to load certificate"
      );

    }


    const result =
      await response.json();


    if(
      !result.success ||
      !result.data
    ){

      throw new Error(
        "Invalid certificate data"
      );

    }


    renderCertificate(
      result.data
    );


  }catch(error){

    console.error(
      "CERTIFICATE VIEW:",
      error
    );


    status.innerHTML = `

      <h2>
        Certificate Not Found
      </h2>

      <p style="margin-top:10px">
        This certificate could not be found
        or is no longer available.
      </p>

    `;

  }

}


/* =========================
   RENDER
========================= */

function renderCertificate(data){

  document.getElementById(
    "status"
  ).style.display = "none";


  document.getElementById(
    "certificate"
  ).style.display = "block";


  document.getElementById(
    "actions"
  ).style.display = "flex";


  document.getElementById(
    "title"
  ).textContent =
    data.title ||
    data.certificateTitle ||
    "Certificate of Completion";


  document.getElementById(
    "student"
  ).textContent =
    data.studentName ||
    data.student ||
    data.recipientName ||
    "Student";


  document.getElementById(
    "course"
  ).textContent =
    data.courseName ||
    data.courseTitle ||
    data.course ||
    "Course";


  document.getElementById(
    "date"
  ).textContent =
    formatDate(
      data.completedAt ||
      data.completionDate ||
      data.date ||
      data.createdAt
    );


  document.getElementById(
    "certificateId"
  ).textContent =
    "Certificate ID: " +
    (
      data.id ||
      certificateId
    );

}


/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value)
    return "Date";


  try{

    const date =
      new Date(value);


    if(
      isNaN(date.getTime())
    ){

      return String(value);

    }


    return date.toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

  }catch{

    return String(value);

  }

}


/* =========================
   START
========================= */

loadCertificate();

</script>

</body>
</html>
