<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Certificates | LetsStudy Pro</title>
<meta name="description" content="Explore and verify LetsStudy Pro certificates.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.header-btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.hero{
  padding:50px 6%;
  background:linear-gradient(135deg,#eff6ff,#fff);
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  color:#64748b;
  line-height:1.6;
  max-width:700px;
}

.container{
  width:92%;
  max-width:1200px;
  margin:30px auto;
}

.tools{
  background:#fff;
  padding:18px;
  border-radius:14px;
  box-shadow:0 5px 20px #0000000b;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #dce1e8;
  border-radius:9px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#2563eb;
}

.verify-btn{
  border:0;
  background:#16a34a;
  color:#fff;
  padding:13px 18px;
  border-radius:9px;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:22px;
  box-shadow:0 5px 20px #0000000b;
  border:1px solid #eef0f4;
}

.icon{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  margin-bottom:15px;
}

.card h2{
  font-size:20px;
  margin-bottom:8px;
}

.muted{
  color:#64748b;
  font-size:14px;
  line-height:1.6;
}

.badge{
  display:inline-block;
  margin-top:12px;
  padding:5px 9px;
  border-radius:20px;
  background:#dcfce7;
  color:#15803d;
  font-size:12px;
  font-weight:600;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:18px;
}

.action{
  text-decoration:none;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}

.action.verify{
  background:#16a34a;
}

.empty{
  grid-column:1/-1;
  background:#fff;
  padding:60px 20px;
  text-align:center;
  border-radius:15px;
  color:#64748b;
}

.loading{
  text-align:center;
  padding:60px;
  color:#64748b;
}

.error{
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

@media(max-width:650px){

  .hero h1{
    font-size:29px;
  }

  .tools{
    grid-template-columns:1fr;
  }

  .header-btn{
    padding:9px 11px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="header-btn"
    onclick="location.href='certificate-verify.html'"
  >
    Verify Certificate
  </button>

</header>


<section class="hero">

  <h1>
    LetsStudy Pro Certificates
  </h1>

  <p>
    View certificates issued through LetsStudy Pro
    and verify certificate authenticity using a
    unique certificate ID.
  </p>

</section>


<main class="container">

  <div class="tools">

    <input
      id="search"
      type="search"
      placeholder="Search by student, course or certificate ID..."
      autocomplete="off"
    >

    <button
      class="verify-btn"
      onclick="verifyCertificate()"
    >
      Verify Certificate
    </button>

  </div>


  <div
    id="certificateGrid"
    class="grid"
  >

    <div class="loading">
      Loading certificates...
    </div>

  </div>

</main>


<script>

const API = "/api/data";

let certificates = [];


const grid =
  document.getElementById(
    "certificateGrid"
  );

const search =
  document.getElementById(
    "search"
  );


/* =========================
   LOAD
========================= */

async function loadCertificates(){

  try{

    const response =
      await fetch(
        API +
        "?collection=certificates&limit=100"
      );


    if(!response.ok){

      throw new Error(
        "Failed to load certificates"
      );

    }


    const result =
      await response.json();


    if(
      !result.success ||
      !Array.isArray(result.results)
    ){

      throw new Error(
        "Invalid API response"
      );

    }


    certificates =
      result.results.filter(
        certificate => {

          const status =
            String(
              certificate.status || ""
            ).toLowerCase();

          /*
           * Public certificates only.
           * If status is missing, allow it
           * for compatibility with existing data.
           */

          return (
            status === "published" ||
            status === "active" ||
            status === "issued" ||
            status === "verified" ||
            status === ""
          );

        }
      );


    render();

  }catch(error){

    console.error(
      "CERTIFICATES API:",
      error
    );


    grid.innerHTML = `

      <div class="error">

        <strong>
          Unable to load certificates
        </strong>

        <p style="margin-top:8px">
          Please try again later.
        </p>

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const results =
    certificates.filter(
      certificate => {

        const id =
          certificate.id ||
          certificate.documentId ||
          "";


        const student =
          certificate.studentName ||
          certificate.student ||
          certificate.recipientName ||
          "";


        const course =
          certificate.courseName ||
          certificate.courseTitle ||
          certificate.course ||
          "";


        const text =
          (
            id +
            " " +
            student +
            " " +
            course
          ).toLowerCase();


        return text.includes(
          keyword
        );

      }
    );


  if(!results.length){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No certificates found
        </h3>

        <p style="margin-top:8px">
          Try another search.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    results
      .map(createCard)
      .join("");

}


/* =========================
   CARD
========================= */

function createCard(certificate){

  const id =
    certificate.id ||
    certificate.documentId ||
    "";


  const student =
    certificate.studentName ||
    certificate.student ||
    certificate.recipientName ||
    "Student";


  const course =
    certificate.courseName ||
    certificate.courseTitle ||
    certificate.course ||
    "Course";


  const date =
    formatDate(
      certificate.completedAt ||
      certificate.completionDate ||
      certificate.date ||
      certificate.createdAt
    );


  return `

    <article class="card">

      <div class="icon">
        ✓
      </div>

      <h2>
        ${escapeHTML(course)}
      </h2>

      <p class="muted">

        Awarded to:
        <strong>
          ${escapeHTML(student)}
        </strong>

      </p>

      <p class="muted">

        Completion:
        ${escapeHTML(date)}

      </p>

      <span class="badge">
        Verified Certificate
      </span>

      <div class="actions">

        <a
          class="action"
          href="certificate-view.html?id=${encodeURIComponent(id)}"
        >
          View Certificate
        </a>

        <a
          class="action verify"
          href="certificate-verify.html?id=${encodeURIComponent(id)}"
        >
          Verify
        </a>

      </div>

    </article>

  `;

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  render
);


/* =========================
   VERIFY BUTTON
========================= */

function verifyCertificate(){

  const id =
    search.value.trim();


  if(id){

    location.href =
      "certificate-verify.html?id=" +
      encodeURIComponent(id);

  }else{

    location.href =
      "certificate-verify.html";

  }

}


/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value)
    return "Not specified";


  const date =
    new Date(value);


  if(
    isNaN(date.getTime())
  ){

    return String(value);

  }


  return date.toLocaleDateString(
    undefined,
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadCertificates();

</script>

</body>
</html>
