<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Certificate | LetsStudy Pro</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f3f5f9;
      color: #172033;
      min-height: 100vh;
    }

    .page {
      max-width: 1250px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .topbar h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .topbar p {
      color: #6b7485;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: white;
      color: #172033;
      border: 1px solid #dfe4ec;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .certificate-wrapper {
      display: flex;
      justify-content: center;
    }

    .certificate {
      width: 100%;
      max-width: 1100px;
      min-height: 720px;
      background: #fff;
      border: 12px solid #172033;
      padding: 14px;
      position: relative;
      box-shadow:
        0 20px 50px rgba(15, 23, 42, .12);
    }

    .certificate-inner {
      min-height: 660px;
      border: 2px solid #c8a951;
      padding: 55px 50px;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      font-size: 18px;
      letter-spacing: 4px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .certificate-title {
      margin-top: 25px;
      font-size: 52px;
      letter-spacing: 5px;
      text-transform: uppercase;
      font-family: Georgia, serif;
    }

    .presented {
      margin-top: 15px;
      color: #687386;
      font-size: 16px;
    }

    .student-name {
      margin-top: 18px;
      font-size: 42px;
      font-family: Georgia, serif;
      font-weight: 700;
      border-bottom: 1px solid #d8dde6;
      display: inline-block;
      padding: 0 30px 10px;
    }

    .achievement {
      margin: 20px auto 0;
      max-width: 750px;
      color: #505a6b;
      font-size: 16px;
      line-height: 1.7;
    }

    .course-name {
      margin-top: 15px;
      font-size: 28px;
      font-weight: 800;
      color: #172033;
    }

    .details {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 20px;
      margin-top: 35px;
    }

    .detail {
      padding-top: 12px;
      border-top: 1px solid #d8dde6;
    }

    .detail small {
      display: block;
      color: #737d8e;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .detail strong {
      font-size: 14px;
      word-break: break-word;
    }

    .footer {
      display: grid;
      grid-template-columns:
        1fr 1fr 1fr;
      gap: 35px;
      align-items: end;
      margin-top: 40px;
    }

    .signature {
      border-top: 1px solid #333;
      padding-top: 8px;
      font-size: 12px;
    }

    .seal {
      width: 85px;
      height: 85px;
      border: 3px solid #c8a951;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #a78632;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .verify-box {
      margin-top: 25px;
      text-align: center;
      color: #687386;
      font-size: 12px;
    }

    .loading,
    .error,
    .not-found {
      background: white;
      border-radius: 18px;
      padding: 70px 25px;
      text-align: center;
      max-width: 700px;
      margin: 40px auto;
      border: 1px solid #e5e9f0;
    }

    .error {
      color: #b91c1c;
    }

    .not-found {
      color: #687386;
    }

    @media (max-width: 800px) {

      .certificate {
        border-width: 7px;
      }

      .certificate-inner {
        padding: 35px 20px;
      }

      .certificate-title {
        font-size: 35px;
      }

      .student-name {
        font-size: 30px;
        padding: 0 10px 8px;
      }

      .details,
      .footer {
        grid-template-columns: 1fr;
      }

    }

    @media print {

      @page {
        size: landscape;
        margin: 0;
      }

      body {
        background: white;
      }

      .page {
        padding: 0;
        max-width: none;
      }

      .topbar,
      .actions {
        display: none !important;
      }

      .certificate-wrapper {
        display: block;
      }

      .certificate {
        max-width: none;
        width: 100%;
        min-height: 100vh;
        border-width: 10px;
        box-shadow: none;
      }

    }

  </style>

</head>

<body>

<main class="page">


  <!-- =========================
       HEADER
  ========================== -->

  <header class="topbar">

    <div>

      <h1>
        Certificate
      </h1>

      <p>
        Your LetsStudy Pro achievement certificate.
      </p>

    </div>


    <div class="actions">

      <a
        href="dashboard.html"
        class="btn secondary"
      >
        ← Dashboard
      </a>

      <button
        class="btn primary"
        id="printBtn"
      >
        🖨 Print Certificate
      </button>

    </div>

  </header>


  <!-- =========================
       CERTIFICATE
  ========================== -->

  <div id="certificateContainer">

    <div class="loading">

      Loading certificate...

    </div>

  </div>


</main>


<script type="module">

  /* =========================
     FIREBASE
  ========================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    getDatabase,
    ref,
    onValue
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  /* =========================
     FIREBASE CONFIG
  ========================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"

  };


  /* =========================
     INITIALIZE FIREBASE
  ========================== */

  const app =
    initializeApp(
      firebaseConfig
    );

  const auth =
    getAuth(app);

  const database =
    getDatabase(app);


  /* =========================
     ELEMENTS
  ========================== */

  const container =
    document.getElementById(
      "certificateContainer"
    );


  /* =========================
     HELPERS
  ========================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return "-";
    }

    return date.toLocaleDateString(
      undefined,
      {
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );

  }


  /* =========================
     CERTIFICATE ID
  ========================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const certificateId =
    params.get(
      "id"
    ) ||
    params.get(
      "certificateId"
    );


  /* =========================
     RENDER CERTIFICATE
  ========================== */

  function renderCertificate(
    id,
    certificate
  ) {

    if (!certificate) {

      container.innerHTML = `

        <div class="not-found">

          <h2>
            Certificate Not Found
          </h2>

          <p style="margin-top:10px;">
            The requested certificate
            could not be found.
          </p>

        </div>

      `;

      return;

    }


    /*
     * Certificate may be stored
     * using different field names.
     */

    const studentName =
      certificate.studentName ||
      certificate.userName ||
      certificate.name ||
      certificate.student ||
      "Student";


    const courseName =
      certificate.courseName ||
      certificate.courseTitle ||
      certificate.course ||
      "Course";


    const instructor =
      certificate.instructorName ||
      certificate.instructor ||
      certificate.teacher ||
      "LetsStudy Pro";


    const issueDate =
      certificate.issueDate ||
      certificate.completedAt ||
      certificate.completionDate ||
      certificate.createdAt;


    const certificateNumber =
      certificate.certificateNumber ||
      certificate.certificateId ||
      id;


    const status =
      String(
        certificate.status ||
        "verified"
      ).toLowerCase();


    const isVerified =
      certificate.verified === true ||
      status === "verified" ||
      status === "approved";


    container.innerHTML = `

      <div class="certificate-wrapper">

        <article
          class="certificate"
          id="certificate"
        >

          <div class="certificate-inner">


            <!-- BRAND -->

            <div>

              <div class="brand">
                LetsStudy Pro
              </div>


              <div
                class="certificate-title"
              >
                Certificate
              </div>


              <div class="presented">
                This certificate is proudly
                presented to
              </div>


              <div
                class="student-name"
              >
                ${escapeHtml(
                  studentName
                )}
              </div>


              <div class="achievement">

                For successfully completing
                the learning requirements and
                demonstrating achievement in

                <div
                  class="course-name"
                >
                  ${escapeHtml(
                    courseName
                  )}
                </div>

              </div>

            </div>


            <!-- DETAILS -->

            <div>

              <div class="details">


                <div class="detail">

                  <small>
                    Certificate ID
                  </small>

                  <strong>
                    ${escapeHtml(
                      certificateNumber
                    )}
                  </strong>

                </div>


                <div class="detail">

                  <small>
                    Date Issued
                  </small>

                  <strong>
                    ${formatDate(
                      issueDate
                    )}
                  </strong>

                </div>


                <div class="detail">

                  <small>
                    Instructor
                  </small>

                  <strong>
                    ${escapeHtml(
                      instructor
                    )}
                  </strong>

                </div>


              </div>


              <!-- FOOTER -->

              <div class="footer">


                <div
                  class="signature"
                >

                  ${escapeHtml(
                    instructor
                  )}

                  <br>

                  Instructor

                </div>


                <div>

                  <div class="seal">

                    LETSSTUDY<br>
                    PRO<br>
                    VERIFIED

                  </div>

                </div>


                <div
                  class="signature"
                >

                  LetsStudy Pro

                  <br>

                  Authorized Certificate

                </div>


              </div>


              <div
                class="verify-box"
              >

                ${
                  isVerified
                    ? `
                      ✓ Verified Certificate
                    `
                    : `
                      Certificate status:
                      ${escapeHtml(
                        status
                      )}
                    `
                }

                <br>

                Verification ID:
                ${escapeHtml(
                  certificateNumber
                )}

              </div>

            </div>


          </div>

        </article>

      </div>

    `;

  }


  /* =========================
     LOAD CERTIFICATE
  ========================== */

  function loadCertificate(
    user
  ) {

    if (!certificateId) {

      container.innerHTML = `

        <div class="not-found">

          <h2>
            No Certificate Selected
          </h2>

          <p style="margin-top:10px;">
            Open this page using:
          </p>

          <p
            style="
              margin-top:8px;
              font-weight:700;
            "
          >
            certificate.html?id=CERTIFICATE_ID
          </p>

        </div>

      `;

      return;

    }


    const certificateRef =
      ref(
        database,
        `certificates/${certificateId}`
      );


    onValue(
      certificateRef,
      snapshot => {

        const certificate =
          snapshot.val();


        if (!certificate) {

          renderCertificate(
            certificateId,
            null
          );

          return;

        }


        /*
         * If certificate has a userId,
         * make sure it belongs to
         * the logged-in user.
         */

        if (
          certificate.userId &&
          certificate.userId !== user.uid
        ) {

          container.innerHTML = `

            <div class="error">

              <h2>
                Access Denied
              </h2>

              <p
                style="margin-top:10px;"
              >
                This certificate does not
                belong to your account.
              </p>

            </div>

          `;

          return;

        }


        renderCertificate(
          certificateId,
          certificate
        );

      },

      error => {

        console.error(
          "Certificate Firebase error:",
          error
        );

        container.innerHTML = `

          <div class="error">

            Failed to load certificate.

          </div>

        `;

      }

    );

  }


  /* =========================
     PRINT
  ========================== */

  document
    .getElementById(
      "printBtn"
    )
    .addEventListener(
      "click",
      () => {

        window.print();

      }
    );


  /* =========================
     AUTHENTICATION
  ========================== */

  onAuthStateChanged(
    auth,
    user => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }


      loadCertificate(
        user
      );

    }
  );

</script>

</body>
</html>
