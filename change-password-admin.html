<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Change Password | Admin | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Change your Let'sStudy Pro administrator password securely."
  >

  <meta name="robots" content="noindex,nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(15,23,42,.08);
    }

    .logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 22px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      margin: 8px 0 24px;
      text-align: center;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }

    .status {
      display: none;
      margin-bottom: 16px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .info {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }

    .password-box {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 0 70px 0 13px;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      outline: none;
      font: inherit;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    .show-password {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      min-height: auto;
      margin: 0;
      padding: 7px;
      border: 0;
      background: transparent;
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .show-password:hover {
      background: transparent;
      color: #1d4ed8;
    }

    .primary {
      width: 100%;
      min-height: 50px;
      margin-top: 2px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 750;
      cursor: pointer;
    }

    .primary:hover {
      background: #1d4ed8;
    }

    .primary:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .back {
      display: block;
      margin-top: 17px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .back:hover {
      text-decoration: underline;
    }

    .admin-info {
      margin-bottom: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 10px;
      color: #667085;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }

    .admin-info.ready {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .success-actions {
      display: none;
      margin-top: 16px;
    }

    .success-actions.show {
      display: block;
    }

    .dashboard-btn,
    .profile-btn {
      display: block;
      width: 100%;
      min-height: 46px;
      margin-top: 9px;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .dashboard-btn {
      background: #2563eb;
      color: white;
    }

    .profile-btn {
      background: #eef2ff;
      color: #1d4ed8;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 21px 17px;
      }
    }
  </style>
</head>

<body>

<main class="card">

  <div class="logo">
    L
  </div>

  <h1>
    Change Password
  </h1>

  <p class="subtitle">
    Update your Let'sStudy Pro administrator password securely.
  </p>


  <div
    id="status"
    class="status"
    role="alert"
    aria-live="polite"
  ></div>


  <div
    id="adminInfo"
    class="admin-info"
  >
    Checking administrator session...
  </div>


  <form id="changePasswordForm">

    <div class="field">

      <label for="currentPassword">
        Current Password
      </label>

      <div class="password-box">

        <input
          id="currentPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Current password"
          required
        >

        <button
          type="button"
          class="show-password"
          data-target="currentPassword"
        >
          Show
        </button>

      </div>

    </div>


    <div class="field">

      <label for="newPassword">
        New Password
      </label>

      <div class="password-box">

        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          placeholder="New password"
          required
        >

        <button
          type="button"
          class="show-password"
          data-target="newPassword"
        >
          Show
        </button>

      </div>

    </div>


    <div class="field">

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <div class="password-box">

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          placeholder="Confirm new password"
          required
        >

        <button
          type="button"
          class="show-password"
          data-target="confirmPassword"
        >
          Show
        </button>

      </div>

    </div>


    <button
      id="changeButton"
      class="primary"
      type="submit"
      disabled
    >
      Change Password
    </button>

  </form>


  <div
    id="successActions"
    class="success-actions"
  >

    <a
      href="profile-admin.html"
      class="profile-btn"
    >
      ← Back to Admin Profile
    </a>

    <a
      href="admin-dashboard.html"
      class="dashboard-btn"
    >
      Open Admin Dashboard
    </a>

  </div>


  <a
    href="profile-admin.html"
    class="back"
  >
    ← Back to Admin Profile
  </a>

</main>


<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    EmailAuthProvider,
    reauthenticateWithCredential,
    updatePassword
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    getDoc
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"
  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================================
     ELEMENTS
  ========================================== */

  const form =
    document.getElementById(
      "changePasswordForm"
    );

  const status =
    document.getElementById(
      "status"
    );

  const adminInfo =
    document.getElementById(
      "adminInfo"
    );

  const button =
    document.getElementById(
      "changeButton"
    );

  const successActions =
    document.getElementById(
      "successActions"
    );


  let currentUser = null;

  let verifiedAdmin = false;


  /* =========================================
     STATUS
  ========================================== */

  function showStatus(
    message,
    type = "error"
  ) {

    status.textContent =
      message;

    status.className =
      `status show ${type}`;
  }


  /* =========================================
     SHOW / HIDE PASSWORD
  ========================================== */

  document
    .querySelectorAll(
      ".show-password"
    )
    .forEach(toggle => {

      toggle.addEventListener(
        "click",
        () => {

          const input =
            document.getElementById(
              toggle.dataset.target
            );

          if (!input) return;


          if (
            input.type ===
            "password"
          ) {

            input.type =
              "text";

            toggle.textContent =
              "Hide";

          } else {

            input.type =
              "password";

            toggle.textContent =
              "Show";
          }

        }
      );

    });


  /* =========================================
     VERIFY ADMIN SESSION
  ========================================== */

  onAuthStateChanged(
    auth,
    async user => {

      currentUser =
        user || null;

      verifiedAdmin =
        false;

      button.disabled =
        true;


      if (!user) {

        adminInfo.textContent =
          "No administrator session is currently active.";

        adminInfo.className =
          "admin-info";

        showStatus(
          "Please sign in to your administrator account before changing the password.",
          "error"
        );

        return;
      }


      try {

        adminInfo.textContent =
          "Verifying administrator access...";


        const adminRef =
          doc(
            db,
            "admins",
            user.uid
          );


        const adminSnap =
          await getDoc(
            adminRef
          );


        if (
          !adminSnap.exists()
        ) {

          adminInfo.textContent =
            "Administrator record not found.";

          showStatus(
            "Access denied. This account is not registered as an administrator.",
            "error"
          );

          return;
        }


        const adminData =
          adminSnap.data();


        if (
          adminData.role !==
          "admin"
        ) {

          adminInfo.textContent =
            "Administrator privileges are missing.";

          showStatus(
            "Access denied. Administrator privileges are required.",
            "error"
          );

          return;
        }


        if (
          adminData.status &&
          adminData.status !==
          "active"
        ) {

          adminInfo.textContent =
            "Administrator account is inactive.";

          showStatus(
            "Your administrator account is currently inactive.",
            "error"
          );

          return;
        }


        verifiedAdmin =
          true;


        adminInfo.className =
          "admin-info ready";


        adminInfo.textContent =
          `Administrator: ${
            adminData.name ||
            user.displayName ||
            user.email ||
            "Administrator"
          }`;


        button.disabled =
          false;


        status.className =
          "status";


      } catch (error) {

        console.error(
          "Admin verification error:",
          error
        );


        adminInfo.textContent =
          "Unable to verify administrator access.";

        showStatus(
          "Unable to verify your administrator account. Please try again.",
          "error"
        );
      }

    }
  );


  /* =========================================
     CHANGE PASSWORD
  ========================================== */

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if (
        !currentUser ||
        !verifiedAdmin
      ) {

        showStatus(
          "Administrator session is not verified."
        );

        return;
      }


      /*
       * This password-change method requires
       * an email/password Firebase account.
       */

      if (
        !currentUser.email
      ) {

        showStatus(
          "This administrator account does not have an email/password credential. Use the appropriate account recovery method."
        );

        return;
      }


      const currentPassword =
        document
          .getElementById(
            "currentPassword"
          )
          .value;


      const newPassword =
        document
          .getElementById(
            "newPassword"
          )
          .value;


      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;


      if (
        !currentPassword
      ) {

        showStatus(
          "Enter your current password."
        );

        return;
      }


      if (
        newPassword.length <
        6
      ) {

        showStatus(
          "New password must contain at least 6 characters."
        );

        return;
      }


      if (
        newPassword !==
        confirmPassword
      ) {

        showStatus(
          "New passwords do not match."
        );

        return;
      }


      if (
        currentPassword ===
        newPassword
      ) {

        showStatus(
          "New password must be different from the current password."
        );

        return;
      }


      button.disabled =
        true;

      button.textContent =
        "Updating...";


      try {

        /*
         * Re-authenticate administrator
         */

        const credential =
          EmailAuthProvider.credential(
            currentUser.email,
            currentPassword
          );


        await reauthenticateWithCredential(
          currentUser,
          credential
        );


        /*
         * Update Firebase Authentication password
         */

        await updatePassword(
          currentUser,
          newPassword
        );


        showStatus(
          "Password changed successfully. Your new password is now active.",
          "success"
        );


        form.reset();


        /*
         * Show manual navigation options.
         * No automatic redirect.
         */

        successActions.className =
          "success-actions show";


      } catch (error) {

        console.error(
          "Change password error:",
          error
        );


        let message =
          "Unable to change password.";


        switch (
          error.code
        ) {

          case "auth/wrong-password":
          case "auth/invalid-credential":

            message =
              "Current password is incorrect.";

            break;


          case "auth/weak-password":

            message =
              "The new password is too weak. Choose a stronger password.";

            break;


          case "auth/password-does-not-meet-requirements":

            message =
              "The new password does not meet the required password rules.";

            break;


          case "auth/requires-recent-login":

            message =
              "For security, please sign in again before changing your password.";

            break;


          case "auth/user-token-expired":

            message =
              "Your administrator session has expired. Please sign in again.";

            break;


          case "auth/network-request-failed":

            message =
              "Network error. Check your internet connection and try again.";

            break;


          case "auth/too-many-requests":

            message =
              "Too many attempts. Please wait and try again later.";

            break;
        }


        showStatus(
          message,
          "error"
        );


      } finally {

        if (!successActions.classList.contains("show")) {

          button.disabled =
            !verifiedAdmin;

          button.textContent =
            "Change Password";
        }

      }

    }
  );

</script>

</body>
</html>
