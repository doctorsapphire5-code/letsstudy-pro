<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Change Password | Admin | Let'sStudy Pro</title>

  <meta name="robots" content="noindex,nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(15,23,42,.08);
    }

    .logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 22px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      margin: 8px 0 24px;
      text-align: center;
      color: #667085;
      font-size: 13px;
    }

    .status {
      display: none;
      margin-bottom: 16px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }

    .password-box {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 0 70px 0 13px;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      outline: none;
      font: inherit;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    .show-password {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 750;
      cursor: pointer;
    }

    .primary:hover {
      background: #1d4ed8;
    }

    .primary:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .back {
      display: block;
      margin-top: 17px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .admin-info {
      margin-bottom: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 10px;
      color: #667085;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 21px 17px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">L</div>

    <h1>Change Password</h1>

    <p class="subtitle">
      Update your Let'sStudy Pro administrator password.
    </p>

    <div
      id="status"
      class="status"
      role="alert"
      aria-live="polite"
    ></div>

    <div
      id="adminInfo"
      class="admin-info"
    >
      Checking administrator session...
    </div>

    <form id="changePasswordForm">

      <div class="field">

        <label for="currentPassword">
          Current Password
        </label>

        <div class="password-box">

          <input
            id="currentPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Current password"
            required
          >

          <button
            type="button"
            class="show-password"
            data-target="currentPassword"
          >
            Show
          </button>

        </div>

      </div>


      <div class="field">

        <label for="newPassword">
          New Password
        </label>

        <div class="password-box">

          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="New password"
            required
          >

          <button
            type="button"
            class="show-password"
            data-target="newPassword"
          >
            Show
          </button>

        </div>

      </div>


      <div class="field">

        <label for="confirmPassword">
          Confirm New Password
        </label>

        <div class="password-box">

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="Confirm new password"
            required
          >

          <button
            type="button"
            class="show-password"
            data-target="confirmPassword"
          >
            Show
          </button>

        </div>

      </div>


      <button
        id="changeButton"
        class="primary"
        type="submit"
      >
        Change Password
      </button>

    </form>


    <a
      href="profile-admin.html"
      class="back"
    >
      ← Back to Admin Profile
    </a>

  </main>


<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    EmailAuthProvider,
    reauthenticateWithCredential,
    updatePassword
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"
  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);


  const form =
    document.getElementById(
      "changePasswordForm"
    );

  const status =
    document.getElementById(
      "status"
    );

  const adminInfo =
    document.getElementById(
      "adminInfo"
    );

  const button =
    document.getElementById(
      "changeButton"
    );


  let currentUser = null;


  function showStatus(
    message,
    type = "error"
  ) {

    status.textContent =
      message;

    status.className =
      `status show ${type}`;
  }


  /* =========================================
     SHOW / HIDE PASSWORD
  ========================================== */

  document
    .querySelectorAll(".show-password")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const input =
            document.getElementById(
              button.dataset.target
            );

          if (
            input.type === "password"
          ) {

            input.type = "text";
            button.textContent = "Hide";

          } else {

            input.type = "password";
            button.textContent = "Show";

          }

        }
      );

    });


  /* =========================================
     CHECK LOGIN
  ========================================== */

  onAuthStateChanged(
    auth,
    user => {

      if (!user) {

        window.location.replace(
          "login-admin.html"
        );

        return;
      }


      currentUser = user;


      adminInfo.textContent =
        user.email ||
        user.phoneNumber ||
        "Administrator account";

    }
  );


  /* =========================================
     CHANGE PASSWORD
  ========================================== */

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if (!currentUser) {

        showStatus(
          "Administrator session not found."
        );

        return;
      }


      const currentPassword =
        document
          .getElementById(
            "currentPassword"
          )
          .value;

      const newPassword =
        document
          .getElementById(
            "newPassword"
          )
          .value;

      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;


      if (!currentPassword) {

        showStatus(
          "Enter your current password."
        );

        return;
      }


      if (newPassword.length < 6) {

        showStatus(
          "New password must contain at least 6 characters."
        );

        return;
      }


      if (
        newPassword !==
        confirmPassword
      ) {

        showStatus(
          "New passwords do not match."
        );

        return;
      }


      if (
        currentPassword ===
        newPassword
      ) {

        showStatus(
          "New password must be different from the current password."
        );

        return;
      }


      button.disabled = true;

      button.textContent =
        "Updating...";


      try {

        const credential =
          EmailAuthProvider.credential(
            currentUser.email,
            currentPassword
          );


        await reauthenticateWithCredential(
          currentUser,
          credential
        );


        await updatePassword(
          currentUser,
          newPassword
        );


        showStatus(
          "Password changed successfully.",
          "success"
        );


        form.reset();


        setTimeout(
          () => {

            window.location.replace(
              "profile-admin.html"
            );

          },
          1200
        );


      } catch (error) {

        console.error(
          "Change password error:",
          error
        );


        let message =
          "Unable to change password.";


        switch (error.code) {

          case "auth/wrong-password":
          case "auth/invalid-credential":

            message =
              "Current password is incorrect.";

            break;


          case "auth/weak-password":

            message =
              "Choose a stronger password.";

            break;


          case "auth/requires-recent-login":

            message =
              "Please log in again before changing your password.";

            break;


          case "auth/user-token-expired":

            message =
              "Your session has expired. Please log in again.";

            break;


          case "auth/network-request-failed":

            message =
              "Network error. Check your internet connection.";

            break;

        }


        showStatus(message);

      } finally {

        button.disabled = false;

        button.textContent =
          "Change Password";

      }

    }
  );

</script>

</body>
</html>
