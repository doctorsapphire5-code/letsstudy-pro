<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password | LetsStudy Pro</title>
<meta name="description" content="Change your LetsStudy Pro account password securely.">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:#fff;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.back{
  color:#fff;
  text-decoration:none;
  font-size:14px;
}

main{
  max-width:520px;
  margin:45px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:28px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.icon{
  width:58px;
  height:58px;
  border-radius:16px;
  background:#eef2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  margin-bottom:18px;
}

h1{
  margin:0 0 8px;
  font-size:27px;
}

.subtitle{
  color:#667085;
  line-height:1.6;
  margin-bottom:25px;
}

.field{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
  font-size:14px;
}

.input-wrap{
  position:relative;
}

input{
  width:100%;
  padding:13px 45px 13px 14px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#4f46e5;
  box-shadow:0 0 0 3px rgba(79,70,229,.1);
}

.toggle{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:17px;
}

.hint{
  font-size:12px;
  color:#667085;
  margin-top:6px;
}

.requirements{
  background:#f8fafc;
  border-radius:12px;
  padding:13px;
  margin:8px 0 20px;
  font-size:13px;
}

.requirements div{
  margin:5px 0;
  color:#667085;
}

.requirements .valid{
  color:#15803d;
}

button.submit{
  width:100%;
  border:0;
  padding:14px;
  border-radius:11px;
  background:#4f46e5;
  color:#fff;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}

button.submit:hover{
  background:#4338ca;
}

button.submit:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.alert{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:18px;
  font-size:14px;
}

.alert.success{
  display:block;
  background:#ecfdf3;
  color:#027a48;
}

.alert.error{
  display:block;
  background:#fef3f2;
  color:#b42318;
}

.links{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
  gap:10px;
}

.links a{
  color:#4f46e5;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
}

footer{
  text-align:center;
  color:#667085;
  font-size:12px;
  padding:20px;
}

@media(max-width:600px){
  main{
    margin:25px auto;
  }

  .card{
    padding:22px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">LetsStudy Pro</div>

  <a
    href="account-security.html"
    class="back"
  >
    ← Back
  </a>
</header>

<main>

  <section class="card">

    <div class="icon">🔐</div>

    <h1>Change Password</h1>

    <p class="subtitle">
      Create a new password to keep your
      LetsStudy Pro account secure.
    </p>

    <div
      id="alertBox"
      class="alert"
    ></div>

    <form id="passwordForm">

      <div class="field">

        <label for="currentPassword">
          Current Password
        </label>

        <div class="input-wrap">

          <input
            type="password"
            id="currentPassword"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="toggle"
            data-target="currentPassword"
          >
            👁
          </button>

        </div>

      </div>

      <div class="field">

        <label for="newPassword">
          New Password
        </label>

        <div class="input-wrap">

          <input
            type="password"
            id="newPassword"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <button
            type="button"
            class="toggle"
            data-target="newPassword"
          >
            👁
          </button>

        </div>

        <div class="hint">
          Use at least 8 characters.
        </div>

      </div>

      <div class="requirements">

        <div id="lengthRule">
          ○ At least 8 characters
        </div>

        <div id="letterRule">
          ○ Contains a letter
        </div>

        <div id="numberRule">
          ○ Contains a number
        </div>

      </div>

      <div class="field">

        <label for="confirmPassword">
          Confirm New Password
        </label>

        <div class="input-wrap">

          <input
            type="password"
            id="confirmPassword"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle"
            data-target="confirmPassword"
          >
            👁
          </button>

        </div>

      </div>

      <button
        type="submit"
        class="submit"
        id="submitBtn"
      >
        Change Password
      </button>

    </form>

    <div class="links">

      <a href="account-security.html">
        Security
      </a>

      <a href="settings.html">
        Settings
      </a>

      <a href="dashboard.html">
        Dashboard
      </a>

    </div>

  </section>

</main>

<footer>
  © 2026 LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

/* =========================
   FIREBASE
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  EmailAuthProvider,
  reauthenticateWithCredential,
  updatePassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================
   CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =========================
   INIT
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "passwordForm"
  );

const currentPassword =
  document.getElementById(
    "currentPassword"
  );

const newPassword =
  document.getElementById(
    "newPassword"
  );

const confirmPassword =
  document.getElementById(
    "confirmPassword"
  );

const submitBtn =
  document.getElementById(
    "submitBtn"
  );

const alertBox =
  document.getElementById(
    "alertBox"
  );

const lengthRule =
  document.getElementById(
    "lengthRule"
  );

const letterRule =
  document.getElementById(
    "letterRule"
  );

const numberRule =
  document.getElementById(
    "numberRule"
  );


let currentUser = null;


/* =========================
   ALERT
========================= */

function showAlert(
  message,
  type
){

  alertBox.textContent =
    message;

  alertBox.className =
    "alert " + type;

}


/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      window.location.href =
        "login.html?redirect=change-password.html";

      return;

    }

    currentUser = user;

  }
);


/* =========================
   PASSWORD VISIBILITY
========================= */

document
  .querySelectorAll(".toggle")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const input =
          document.getElementById(
            button.dataset.target
          );

        if(
          input.type ===
          "password"
        ){

          input.type =
            "text";

          button.textContent =
            "🙈";

        }else{

          input.type =
            "password";

          button.textContent =
            "👁";

        }

      }
    );

  });


/* =========================
   PASSWORD RULES
========================= */

function updateRules(){

  const value =
    newPassword.value;

  const hasLength =
    value.length >= 8;

  const hasLetter =
    /[A-Za-z]/.test(value);

  const hasNumber =
    /[0-9]/.test(value);

  lengthRule.className =
    hasLength ? "valid" : "";

  letterRule.className =
    hasLetter ? "valid" : "";

  numberRule.className =
    hasNumber ? "valid" : "";

  lengthRule.textContent =
    hasLength
      ? "✓ At least 8 characters"
      : "○ At least 8 characters";

  letterRule.textContent =
    hasLetter
      ? "✓ Contains a letter"
      : "○ Contains a letter";

  numberRule.textContent =
    hasNumber
      ? "✓ Contains a number"
      : "○ Contains a number";

}


newPassword.addEventListener(
  "input",
  updateRules
);


/* =========================
   CHANGE PASSWORD
========================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    if(!currentUser){

      showAlert(
        "Your session is not ready. Please try again.",
        "error"
      );

      return;

    }

    const current =
      currentPassword.value;

    const newPass =
      newPassword.value;

    const confirm =
      confirmPassword.value;


    if(
      newPass.length < 8
    ){

      showAlert(
        "New password must contain at least 8 characters.",
        "error"
      );

      return;

    }


    if(
      !/[A-Za-z]/.test(newPass)
    ){

      showAlert(
        "New password must contain at least one letter.",
        "error"
      );

      return;

    }


    if(
      !/[0-9]/.test(newPass)
    ){

      showAlert(
        "New password must contain at least one number.",
        "error"
      );

      return;

    }


    if(
      newPass !== confirm
    ){

      showAlert(
        "New passwords do not match.",
        "error"
      );

      return;

    }


    if(
      current === newPass
    ){

      showAlert(
        "New password must be different from your current password.",
        "error"
      );

      return;

    }


    submitBtn.disabled =
      true;

    submitBtn.textContent =
      "Updating Password...";


    try{

      /*
       * Firebase requires recent
       * authentication before a
       * sensitive account operation.
       */

      const credential =
        EmailAuthProvider.credential(
          currentUser.email,
          current
        );


      await reauthenticateWithCredential(
        currentUser,
        credential
      );


      await updatePassword(
        currentUser,
        newPass
      );


      showAlert(
        "Password changed successfully.",
        "success"
      );


      form.reset();

      updateRules();


      setTimeout(
        () => {

          window.location.href =
            "account-security.html";

        },
        1800
      );


    }catch(error){

      console.error(
        "Change password error:",
        error
      );


      let message =
        "Unable to change password. Please try again.";


      if(
        error.code ===
        "auth/invalid-credential" ||
        error.code ===
        "auth/wrong-password"
      ){

        message =
          "Current password is incorrect.";

      }

      else if(
        error.code ===
        "auth/too-many-requests"
      ){

        message =
          "Too many attempts. Please try again later.";

      }

      else if(
        error.code ===
        "auth/requires-recent-login"
      ){

        message =
          "Please sign in again before changing your password.";

      }

      else if(
        error.code ===
        "auth/weak-password"
      ){

        message =
          "The new password is too weak.";

      }

      else if(
        error.code ===
        "auth/network-request-failed"
      ){

        message =
          "Network error. Check your internet connection.";

      }


      showAlert(
        message,
        "error"
      );


    }finally{

      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "Change Password";

    }

  }
);

</script>

</body>
</html>
