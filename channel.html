<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Channel | LetsStudy Pro</title>
<meta name="description" content="Explore a LetsStudy Pro channel and its published content.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.header-btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1100px;
  margin:30px auto;
}

.channel{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 6px 25px #0000000b;
}

.cover{
  height:220px;
  background:#dbeafe;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.channel-info{
  padding:0 25px 25px;
}

.channel-logo{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:50%;
  border:5px solid #fff;
  margin-top:-50px;
  background:#fff;
}

.channel-name{
  font-size:30px;
  font-weight:800;
  margin-top:10px;
}

.description{
  color:#64748b;
  line-height:1.6;
  margin-top:8px;
  max-width:800px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  margin-top:15px;
  color:#64748b;
  font-size:14px;
}

.badge{
  display:inline-block;
  margin-top:12px;
  padding:6px 10px;
  border-radius:20px;
  background:#dcfce7;
  color:#15803d;
  font-size:12px;
  font-weight:600;
}

.section{
  margin-top:30px;
}

.section h2{
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}

.card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 20px #0000000b;
}

.thumbnail{
  width:100%;
  height:145px;
  object-fit:cover;
  background:#e5e7eb;
}

.card-content{
  padding:16px;
}

.card-title{
  font-size:17px;
  font-weight:700;
  margin-bottom:7px;
}

.muted{
  color:#64748b;
  font-size:13px;
  line-height:1.5;
}

.card-btn{
  display:inline-block;
  margin-top:12px;
  padding:9px 12px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-size:13px;
}

.loading,
.empty,
.error{
  background:#fff;
  padding:50px 20px;
  text-align:center;
  border-radius:14px;
  color:#64748b;
}

.error{
  color:#991b1b;
  background:#fef2f2;
}

@media(max-width:650px){

  .cover{
    height:160px;
  }

  .channel-name{
    font-size:24px;
  }

  .channel-logo{
    width:82px;
    height:82px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="header-btn"
    onclick="location.href='create-channel.html'"
  >
    Create Channel
  </button>

</header>


<main class="container">

  <div
    id="page"
    class="loading"
  >
    Loading channel...
  </div>

</main>


<script>

const API = "/api/data";

const params =
  new URLSearchParams(
    location.search
  );

const channelId =
  params.get("id") ||
  params.get("channelId") ||
  params.get("documentId");


/* =========================
   ELEMENT
========================= */

const page =
  document.getElementById(
    "page"
  );


/* =========================
   LOAD CHANNEL
========================= */

async function loadChannel(){

  if(!channelId){

    showError(
      "Channel ID is missing."
    );

    return;

  }


  try{

    const response =
      await fetch(
        API +
        "?collection=channels&id=" +
        encodeURIComponent(
          channelId
        )
      );


    if(response.status === 404){

      showError(
        "Channel not found."
      );

      return;

    }


    if(!response.ok){

      throw new Error(
        "Channel API failed"
      );

    }


    const result =
      await response.json();


    if(
      !result.success ||
      !result.data
    ){

      throw new Error(
        "Invalid channel response"
      );

    }


    const channel =
      result.data;


    /*
     * Try common content collection
     * names used by the platform.
     */

    const posts =
      await loadContent(
        "posts"
      );


    render(
      channel,
      posts
    );


  }catch(error){

    console.error(
      "CHANNEL:",
      error
    );


    showError(
      "Unable to load this channel."
    );

  }

}


/* =========================
   CONTENT
========================= */

async function loadContent(collectionName){

  try{

    const response =
      await fetch(
        API +
        "?collection=" +
        encodeURIComponent(
          collectionName
        ) +
        "&limit=100"
      );


    if(!response.ok)
      return [];


    const result =
      await response.json();


    if(
      !result.success ||
      !Array.isArray(
        result.results
      )
    ){

      return [];

    }


    return result.results.filter(
      item => {

        const owner =
          item.channelId ||
          item.channel ||
          item.channelID;


        /*
         * If content has a channel
         * reference, match it.
         */

        if(owner){

          return String(owner) ===
            String(channelId);

        }


        return false;

      }
    );

  }catch{

    return [];

  }

}


/* =========================
   RENDER
========================= */

function render(
  channel,
  posts
){

  const name =
    channel.name ||
    channel.channelName ||
    "Channel";


  const description =
    channel.description ||
    channel.bio ||
    channel.shortDescription ||
    "Welcome to this LetsStudy Pro channel.";


  const logo =
    channel.logo ||
    channel.logoUrl ||
    channel.image ||
    "";


  const cover =
    channel.coverImage ||
    channel.cover ||
    channel.banner ||
    channel.bannerImage ||
    "";


  const verified =
    channel.verified === true;


  const followers =
    Number(
      channel.followers ||
      channel.subscribers ||
      0
    );


  page.className = "";


  page.innerHTML = `

    <section class="channel">

      <div class="cover">

        <img
          src="${safeImage(cover)}"
          alt=""
          onerror="
            this.style.display='none'
          "
        >

      </div>


      <div class="channel-info">

        <img
          class="channel-logo"
          src="${safeImage(logo)}"
          alt="${escapeHTML(name)}"
          onerror="
            this.src='https://via.placeholder.com/100'
          "
        >


        <div class="channel-name">

          ${escapeHTML(name)}

        </div>


        ${
          verified
          ? `
            <span class="badge">
              ✓ Verified Channel
            </span>
          `
          : ""
        }


        <p class="description">

          ${escapeHTML(description)}

        </p>


        <div class="meta">

          <span>
            ${followers.toLocaleString()}
            followers
          </span>

          <span>
            ${posts.length}
            published posts
          </span>

        </div>

      </div>

    </section>


    <section class="section">

      <h2>
        Channel Content
      </h2>


      <div
        id="contentGrid"
        class="grid"
      ></div>

    </section>

  `;


  renderPosts(
    posts
  );

}


/* =========================
   POSTS
========================= */

function renderPosts(posts){

  const grid =
    document.getElementById(
      "contentGrid"
    );


  if(!posts.length){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No published content
        </h3>

        <p style="margin-top:8px">
          This channel has no public
          content yet.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    posts
      .map(createPost)
      .join("");

}


/* =========================
   POST CARD
========================= */

function createPost(post){

  const id =
    post.id ||
    post.documentId ||
    "";


  const title =
    post.title ||
    post.name ||
    "Untitled Content";


  const description =
    post.description ||
    post.shortDescription ||
    "";


  const image =
    post.thumbnail ||
    post.thumbnailUrl ||
    post.image ||
    post.coverImage ||
    "";


  /*
   * Use post-details only when
   * a valid ID exists.
   */

  const href =
    id
    ? "post-details.html?id=" +
      encodeURIComponent(id)
    : "#";


  return `

    <article class="card">

      <img
        class="thumbnail"
        src="${safeImage(image)}"
        alt=""
        onerror="
          this.style.display='none'
        "
      >


      <div class="card-content">

        <div class="card-title">

          ${escapeHTML(title)}

        </div>


        <p class="muted">

          ${escapeHTML(
            description
          )}

        </p>


        ${
          id
          ? `
            <a
              class="card-btn"
              href="${href}"
            >
              View Content
            </a>
          `
          : ""
        }

      </div>

    </article>

  `;

}


/* =========================
   ERROR
========================= */

function showError(message){

  page.className = "error";

  page.innerHTML = `

    <h2>
      Channel unavailable
    </h2>

    <p style="margin-top:10px">
      ${escapeHTML(message)}
    </p>

  `;

}


/* =========================
   SAFE IMAGE
========================= */

function safeImage(url){

  if(!url)
    return "https://via.placeholder.com/800x300?text=Channel";


  const value =
    String(url).trim();


  if(
    value.startsWith("https://") ||
    value.startsWith("http://")
  ){

    return escapeHTML(value);

  }


  return "https://via.placeholder.com/800x300?text=Channel";

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadChannel();

</script>

</body>
</html>
