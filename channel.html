<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Channel | Let'sStudy Pro</title>
<meta name="description" content="Educational channel on Let'sStudy Pro.">

<link rel="icon" href="/favicon.ico">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button{
  font:inherit;
  cursor:pointer;
}

.header{
  height:62px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  font-size:19px;
}

.logo i{
  color:#2563eb;
}

.header-btn{
  border:0;
  background:#f1f5f9;
  width:40px;
  height:40px;
  border-radius:9px;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:20px;
}

.back{
  border:0;
  background:#fff;
  padding:10px 14px;
  border-radius:8px;
  font-weight:700;
  margin-bottom:16px;
}

.channel-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:hidden;
}

.banner{
  height:260px;
  background:#dbeafe;
  position:relative;
  overflow:hidden;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.channel-info{
  padding:0 24px 24px;
  position:relative;
}

.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  border:5px solid #fff;
  object-fit:cover;
  background:#e2e8f0;
  margin-top:-55px;
  position:relative;
}

.channel-top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
}

.channel-name{
  margin-top:10px;
  font-size:28px;
  font-weight:800;
}

.handle{
  color:#64748b;
  margin-top:5px;
}

.verified{
  color:#2563eb;
  margin-left:5px;
}

.description{
  margin-top:14px;
  color:#64748b;
  line-height:1.7;
  max-width:800px;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.stat{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  padding:10px 14px;
  border-radius:8px;
}

.stat strong{
  display:block;
  font-size:16px;
}

.stat small{
  color:#64748b;
  font-size:11px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:18px;
  flex-wrap:wrap;
}

.action{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:10px 15px;
  border-radius:8px;
  font-weight:700;
}

.action.primary{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.action:hover{
  opacity:.9;
}

.website{
  margin-top:15px;
}

.website a{
  color:#2563eb;
  text-decoration:none;
  font-size:13px;
  overflow-wrap:anywhere;
}

.social{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

.social a{
  width:35px;
  height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#f1f5f9;
  color:#334155;
  text-decoration:none;
}

.section{
  margin-top:22px;
}

.section-title{
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.section-title h2{
  font-size:21px;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.video{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:11px;
  overflow:hidden;
  cursor:pointer;
}

.video:hover{
  border-color:#93c5fd;
  transform:translateY(-2px);
}

.thumb{
  position:relative;
  aspect-ratio:16/9;
  background:#e2e8f0;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.duration{
  position:absolute;
  bottom:7px;
  right:7px;
  background:rgba(0,0,0,.8);
  color:#fff;
  padding:3px 6px;
  border-radius:4px;
  font-size:10px;
}

.video-info{
  padding:11px;
}

.video-title{
  font-size:14px;
  font-weight:700;
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.video-meta{
  color:#64748b;
  font-size:11px;
  margin-top:7px;
}

.price{
  margin-top:7px;
  font-weight:800;
  font-size:12px;
}

.free{
  color:#16a34a;
}

.paid{
  color:#d97706;
}

.loading{
  text-align:center;
  padding:100px 20px;
  color:#64748b;
}

.spinner{
  width:38px;
  height:38px;
  border:4px solid #e2e8f0;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error{
  background:#fff;
  border:1px solid #fecaca;
  color:#b91c1c;
  padding:35px;
  text-align:center;
  border-radius:12px;
}

.empty{
  background:#fff;
  border:1px solid #e5e7eb;
  padding:45px;
  text-align:center;
  color:#64748b;
  border-radius:12px;
}

.hidden{
  display:none!important;
}

footer{
  text-align:center;
  color:#64748b;
  font-size:12px;
  padding:30px 15px;
}

@media(max-width:1000px){
  .video-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:700px){
  .video-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .banner{
    height:180px;
  }

  .channel-info{
    padding:0 15px 20px;
  }

  .channel-name{
    font-size:23px;
  }

  .avatar{
    width:90px;
    height:90px;
    margin-top:-45px;
  }
}

@media(max-width:450px){
  .container{
    padding:10px 0;
  }

  .channel-card{
    border-radius:0;
    border-left:0;
    border-right:0;
  }

  .video-grid{
    grid-template-columns:1fr;
  }

  .video{
    border-radius:8px;
  }

  .section{
    padding:0 10px;
  }

  .header{
    padding:0 10px;
  }
}
</style>
</head>

<body>

<header class="header">

  <button class="header-btn" id="homeBtn">
    <i class="fa-solid fa-house"></i>
  </button>

  <div class="logo">
    <i class="fa-solid fa-circle-play"></i>
    Let'sStudy Pro
  </div>

  <button class="header-btn" id="searchBtn">
    <i class="fa-solid fa-magnifying-glass"></i>
  </button>

<main class="container">

<button class="back" id="backBtn">
  <i class="fa-solid fa-arrow-left"></i>
  Back
</button>

<div id="loading" class="loading">

  <div class="spinner"></div>

  <h3>Loading channel...</h3>

  <p>Loading channel from Firestore.</p>

</div>

<div id="error" class="error hidden"></div>

<div id="content" class="hidden">

  <!-- CHANNEL -->

  <section class="channel-card">

    <div class="banner">

      <img id="banner"
           alt="Channel banner">

    </div>

    <div class="channel-info">

      <div class="channel-top">

        <div>

          <img
            id="avatar"
            class="avatar"
            alt="Channel avatar"
          >

          <h1 class="channel-name">

            <span id="name">
              —
            </span>

            <i
              id="verified"
              class="fa-solid fa-circle-check verified hidden"
              title="Verified"
            ></i>

          </h1>

          <div
            id="handle"
            class="handle"
          >
            —
          </div>

        </div>

      </div>


      <p
        id="description"
        class="description"
      >
        —
      </p>


      <div class="stats">

        <div class="stat">
          <strong id="subscribers">0</strong>
          <small>Subscribers</small>
        </div>

        <div class="stat">
          <strong id="videosCount">0</strong>
          <small>Videos</small>
        </div>

        <div class="stat">
          <strong id="totalViews">0</strong>
          <small>Total Views</small>
        </div>

        <div class="stat">

          <small>Category</small>

        <button

        <button

      <div

        <i class="fa-solid fa-globe"></i>

        <a

      <div

  <!-- VIDEOS -->

  <section class="section">

    ></div>

  </section>

</div>

</main>

<footer>
© 2026 Let'sStudy Pro. All rights reserved.
</footer>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  where
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   DOM
========================= */

const $ = id =>
  document.getElementById(id);

const loading = $("loading");
const error = $("error");
const content = $("content");
const videoGrid = $("videoGrid");


/* =========================
   CHANNEL ID
========================= */

const params =
  new URLSearchParams(
    location.search
  );

const channelId =
  params.get("id") ||
  params.get("channelId");


/* =========================
   STATE
========================= */

let channel = null;
let channelVideos = [];


/* =========================
   HELPERS
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return escapeHTML(value);

}


function number(value){

  const n =
    Number(value || 0);

  return new Intl.NumberFormat(
    "en-US"
  ).format(n);

}


function showError(message){

  loading.classList.add("hidden");

  error.innerHTML = `
    <i class="fa-solid fa-circle-exclamation"
       style="font-size:38px;margin-bottom:12px"></i>

    <h3>${escapeHTML(message)}</h3>

    <p style="margin-top:8px;color:#64748b">
      Check the channel ID and try again.
    </p>
  `;

  error.classList.remove("hidden");

}


/* =========================
   LOAD CHANNEL
========================= */

async function loadChannel(){

  if(!channelId){

    showError(
      "No channel ID was provided."
    );

    return;

  }


  try{

    /*
      channels
        ↓
      document ID
        ↓
      getDoc()
        ↓
      all document data
    */

    const snap =
      await getDoc(
        doc(
          db,
          "channels",
          channelId
        )
      );


    if(!snap.exists()){

      showError(
        "Channel not found."
      );

      return;

    }


    channel = {

      channelId:snap.id,

      ...snap.data()

    };


    if(
      channel.status &&
      String(channel.status).toLowerCase()
      !== "published"
    ){

      showError(
        "This channel is not published."
      );

      return;

    }


    renderChannel();

    await loadChannelVideos();


    loading.classList.add("hidden");

    content.classList.remove("hidden");


  }catch(err){

    console.error(
      "Channel error:",
      err
    );

    showError(
      "Unable to load channel from Firestore."
    );

  }

}


/* =========================
   RENDER CHANNEL
========================= */

function renderChannel(){

  $("name").textContent =
    channel.name ||
    "Unnamed Channel";


  $("handle").textContent =
    channel.handle
      ? "@" +
        String(
          channel.handle
        ).replace(/^@/,"")
      : "";


  $("description").textContent =
    channel.description ||
    "No channel description available.";


  $("category").textContent =
    channel.category ||
    "Education";


  $("subscribers").textContent =
    number(
      channel.subscribers
    );


  $("videosCount").textContent =
    number(
      channel.videosCount
    );


  $("totalViews").textContent =
    number(
      channel.totalViews
    );


  $("avatar").src =
    channel.avatar ||
    `https://ui-avatars.com/api/?name=${
      encodeURIComponent(
        channel.name ||
        "Let'sStudy Pro"
      )
    }&background=2563eb&color=fff`;


  $("banner").src =
    channel.banner ||
    "https://via.placeholder.com/1200x300?text=Let'sStudy+Pro";


  if(
    channel.verified === true
  ){

    $("verified")
      .classList.remove("hidden");

  }


  /* Website */

  if(channel.website){

    $("website").href =
      channel.website;

    $("website").textContent =
      channel.website;

    $("websiteBox")
      .classList.remove("hidden");

  }


  renderSocialLinks();

}


/* =========================
   SOCIAL LINKS
========================= */

function renderSocialLinks(){

  const box =
    $("social");

  box.innerHTML = "";

  const links =
    channel.socialLinks || {};


  if(
    typeof links !== "object"
  ){
    return;
  }


  Object.entries(
    links
  ).forEach(
    ([name,url]) => {

      if(!url){
        return;
      }


      let icon =
        "fa-solid fa-link";


      const key =
        name.toLowerCase();


      if(
        key.includes("facebook")
      ){

        icon =
          "fa-brands fa-facebook";

      }else if(
        key.includes("instagram")
      ){

        icon =
          "fa-brands fa-instagram";

      }else if(
        key.includes("youtube")
      ){

        icon =
          "fa-brands fa-youtube";

      }else if(
        key.includes("twitter") ||
        key.includes("x")
      ){

        icon =
          "fa-brands fa-x-twitter";

      }else if(
        key.includes("linkedin")
      ){

        icon =
          "fa-brands fa-linkedin";

      }else if(
        key.includes("tiktok")
      ){

        icon =
          "fa-brands fa-tiktok";

      }


      const a =
        document.createElement("a");

      a.href =
        String(url);

      a.target =
        "_blank";

      a.rel =
        "noopener noreferrer";

      a.title =
        name;

      a.innerHTML =
        `<i class="${icon}"></i>`;

      box.appendChild(a);

    }
  );

}


/* =========================
   LOAD VIDEOS
========================= */

async function loadChannelVideos(){

  channelVideos = [];


  /*
    videos
      ↓
    where channelId == channel document ID
  */

  const q =
    query(
      collection(
        db,
        "videos"
      ),
      where(
        "channelId",
        "==",
        channelId
      )
    );


  const snap =
    await getDocs(q);


  snap.forEach(
    item => {

      const data =
        item.data();


      /*
        Only published videos
      */

      if(
        data.status &&
        String(data.status).toLowerCase()
        !== "published"
      ){

        return;

      }


      channelVideos.push({

        videoId:item.id,

        ...data

      });

    }
  );


  /*
    Newest first
  */

  channelVideos.sort(
    (a,b) => {

      const aTime =
        a.publishedAt?.toMillis
          ? a.publishedAt.toMillis()
          : new Date(
              a.publishedAt || 0
            ).getTime();

      const bTime =
        b.publishedAt?.toMillis
          ? b.publishedAt.toMillis()
          : new Date(
              b.publishedAt || 0
            ).getTime();

      return bTime - aTime;

    }
  );


  renderVideos();

}


/* =========================
   RENDER VIDEOS
========================= */

function renderVideos(){

  videoGrid.innerHTML = "";


  if(
    channelVideos.length === 0
  ){

    videoGrid.innerHTML = `
      <div class="empty"
           style="grid-column:1/-1">

        <i class="fa-solid fa-video-slash"
           style="font-size:35px;margin-bottom:12px"></i>

        <h3>No videos yet</h3>

        <p style="margin-top:7px">
          This channel has no published videos.
        </p>

      </div>
    `;

    return;

  }


  channelVideos.forEach(
    v => {

      const card =
        document.createElement("article");

      card.className =
        "video";


      const thumbnail =
        v.thumbnail ||
        "https://via.placeholder.com/640x360?text=Video";


      const access =
        v.isFree === true
          ? "FREE"
          : `PLAN ${
              v.price || ""
            } ${
              v.currency || ""
            }`;


      card.innerHTML = `

        <div class="thumb">

          <img
            src="${escapeAttribute(thumbnail)}"
            alt="${escapeAttribute(
              v.title || "Video"
            )}"
            loading="lazy"
          >

          ${
            v.duration
              ? `<span class="duration">
                   ${escapeHTML(v.duration)}
                 </span>`
              : ""
          }

        </div>

        <div class="video-info">

          <div class="video-title">
            ${escapeHTML(
              v.title ||
              "Untitled Video"
            )}
          </div>

          <div class="video-meta">

            ${number(v.views)} views

            ${
              v.category
                ? ` • ${escapeHTML(v.category)}`
                : ""
            }

          </div>

          <div class="price ${
            v.isFree
              ? "free"
              : "paid"
          }">

            ${
              v.isFree
                ? "FREE"
                : escapeHTML(access)
            }

          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        () => {

          /*
            FREE
              → watch.html

            PLAN
              → video-order.html
          */

          if(
            v.isFree === true
          ){

            location.href =
              `watch.html?id=${
                encodeURIComponent(
                  v.videoId
                )
              }`;

          }else{

            location.href =
              `video-order.html?id=${
                encodeURIComponent(
                  v.videoId
                )
              }`;

          }

        }
      );


      videoGrid.appendChild(card);

    }
  );

}


/* =========================
   SUBSCRIBE
========================= */

$("subscribeBtn").onclick =
() => {

  const key =
    `subscribed-${channelId}`;


  const subscribed =
    localStorage.getItem(key);


  if(subscribed){

    localStorage.removeItem(key);

    $("subscribeBtn").innerHTML =
      `<i class="fa-solid fa-bell"></i>
       Subscribe`;

  }else{

    localStorage.setItem(
      key,
      "1"
    );

    $("subscribeBtn").innerHTML =
      `<i class="fa-solid fa-check"></i>
       Subscribed`;

  }

};


/* =========================
   RESTORE SUBSCRIBE
========================= */

function restoreSubscribe(){

  if(
    localStorage.getItem(
      `subscribed-${channelId}`
    )
  ){

    $("subscribeBtn").innerHTML =
      `<i class="fa-solid fa-check"></i>
       Subscribed`;

  }

}


/* =========================
   SHARE
========================= */

$("shareBtn").onclick =
async () => {

  const url =
    location.href;


  try{

    if(
      navigator.share
    ){

      await navigator.share({

                title:
          channel.name ||
          "Let'sStudy Pro",

        text:
          channel.description ||
          "Check out this educational channel on Let'sStudy Pro.",

        url:
          url

      });

    }else{

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Channel link copied successfully."
      );

    }

  }catch(err){

    console.warn(
      "Share cancelled or failed:",
      err
    );

  }

};


/* =========================
   SUBSCRIBE STATE
========================= */

function restoreSubscribe(){

  const key =
    `subscribed-${channelId}`;

  if(
    localStorage.getItem(key)
  ){

    $("subscribeBtn").innerHTML =
      `
        <i class="fa-solid fa-check"></i>
        Subscribed
      `;

  }

}


/* =========================
   NAVIGATION
========================= */

$("homeBtn").addEventListener(
  "click",
  () => {

    location.href =
      "videos.html";

  }
);


$("backBtn").addEventListener(
  "click",
  () => {

    if(
      history.length > 1
    ){

      history.back();

    }else{

      location.href =
        "videos.html";

    }

  }
);


$("searchBtn").addEventListener(
  "click",
  () => {

    location.href =
      "videos.html";

  }
);


/* =========================
   START APPLICATION
========================= */
