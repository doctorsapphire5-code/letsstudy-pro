<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Channel | Let'sStudy Pro</title>
<meta name="description" content="Let'sStudy Pro video channel">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#f5f7fb;color:#111827
}
button,input{font:inherit}
button{cursor:pointer}
.header{
    height:64px;background:#fff;border-bottom:1px solid #e5e7eb;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;position:sticky;top:0;z-index:20
}
.logo{font-size:20px;font-weight:800}
.search{
    width:min(420px,45%);height:40px;border:1px solid #ddd;
    border-radius:22px;padding:0 16px;outline:none
}
.user{display:flex;gap:8px;align-items:center}
.avatar{
    width:36px;height:36px;border-radius:50%;background:#2563eb;
    color:white;display:grid;place-items:center;font-weight:700
}
.container{max-width:1200px;margin:auto}
.channel-banner{
    height:260px;background:#dbeafe center/cover no-repeat;
    position:relative
}
.channel-info{
    background:white;padding:20px 24px;
    display:flex;gap:18px;align-items:center
}
.channel-avatar{
    width:110px;height:110px;border-radius:50%;
    object-fit:cover;border:5px solid white;margin-top:-65px;
    background:#eee
}
.channel-main{flex:1}
.channel-main h1{font-size:27px}
.handle{color:#6b7280;margin:4px 0 10px}
.description{color:#4b5563;line-height:1.6;max-width:750px}
.actions{display:flex;gap:8px}
.btn{
    border:1px solid #ddd;background:white;border-radius:9px;
    padding:10px 15px;font-weight:700
}
.subscribe{background:#111827;color:white;border-color:#111827}
.tabs{
    background:white;border-top:1px solid #eee;
    display:flex;gap:25px;padding:0 24px
}
.tab{
    border:0;background:none;padding:16px 4px;
    font-weight:700;color:#6b7280
}
.tab.active{color:#2563eb;border-bottom:3px solid #2563eb}
.content{padding:25px 20px}
.stats{
    display:flex;gap:25px;flex-wrap:wrap;margin-bottom:25px
}
.stat strong{font-size:18px}.stat span{color:#6b7280;font-size:13px}
.video-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:18px
}
.video{cursor:pointer}
.thumb{
    width:100%;aspect-ratio:16/9;object-fit:cover;
    border-radius:10px;background:#ddd
}
.video h3{
    font-size:14px;margin-top:8px;line-height:1.4
}
.meta{font-size:12px;color:#6b7280;margin-top:4px}
.loading,.empty{text-align:center;padding:60px;color:#6b7280}
.toast{
    position:fixed;right:20px;bottom:20px;background:#111827;color:white;
    padding:12px 16px;border-radius:9px;display:none;z-index:100
}
.toast.show{display:block}

@media(max-width:900px){
    .video-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
    .search{display:none}
    .channel-banner{height:180px}
    .channel-info{align-items:flex-start;flex-direction:column}
    .channel-avatar{width:85px;height:85px}
    .actions{width:100%}
    .actions .btn{flex:1}
    .video-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:420px){
    .video-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">Let'sStudy Pro</div>

    <input
        class="search"
        id="searchInput"
        placeholder="Search videos..."
        oninput="searchVideos()">

    <div class="user">
        <div class="avatar" id="userAvatar">?</div>
        <span id="userName">Guest</span>
    </div>
</header>

<main class="container">

    <section class="channel-banner" id="channelBanner"></section>

    <section class="channel-info">

        <img
            id="channelAvatar"
            class="channel-avatar"
            src="/favicon.ico"
            alt="Channel">

        <div class="channel-main">

            <h1 id="channelName">Loading...</h1>

            <div class="handle" id="channelHandle"></div>

            <p class="description" id="channelDescription"></p>

            <div style="margin-top:12px;color:#6b7280;font-size:13px">
                <span id="channelCategory"></span>
                <span id="channelWebsite"></span>
            </div>

        </div>

        <div class="actions">

            <button
                class="btn subscribe"
                id="subscribeBtn"
                onclick="toggleSubscribe()">
                Subscribe
            </button>

            <button
                class="btn"
                onclick="shareChannel()">
                Share
            </button>

        </div>

    </section>

    <nav class="tabs">

        <button class="tab active" onclick="showTab('videos',this)">
            Videos
        </button>

        <button class="tab" onclick="showTab('about',this)">
            About
        </button>

    </nav>

    <section class="content">

        <div class="stats">

            <div class="stat">
                <strong id="subscriberCount">0</strong><br>
                <span>Subscribers</span>
            </div>

            <div class="stat">
                <strong id="videoCount">0</strong><br>
                <span>Videos</span>
            </div>

            <div class="stat">
                <strong id="viewCount">0</strong><br>
                <span>Total Views</span>
            </div>

            <div class="stat">
                <strong id="verifiedStatus">—</strong><br>
                <span>Status</span>
            </div>

        </div>

        <div id="videosSection">

            <div id="videoGrid" class="video-grid">
                <div class="loading">Loading videos...</div>
            </div>

        </div>

        <div id="aboutSection" style="display:none">

            <div style="
                background:white;border:1px solid #e5e7eb;
                border-radius:14px;padding:22px;line-height:1.8">

                <h2>About this channel</h2>

                <p id="aboutDescription" style="margin-top:10px;color:#4b5563"></p>

                <p style="margin-top:15px">
                    <strong>Channel ID:</strong>
                    <span id="aboutChannelId"></span>
                </p>

                <p>
                    <strong>Owner ID:</strong>
                    <span id="aboutOwnerId"></span>
                </p>

                <p>
                    <strong>Owner Email:</strong>
                    <span id="aboutOwnerEmail"></span>
                </p>

                <p>
                    <strong>Created:</strong>
                    <span id="aboutCreated"></span>
                </p>

                <p>
                    <strong>Website:</strong>
                    <span id="aboutWebsite"></span>
                </p>

            </div>

        </div>

    </section>

</main>

<div class="toast" id="toast"></div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    increment,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {
    apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
    authDomain:"let-s-study-pro-course.firebaseapp.com",
    databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId:"let-s-study-pro-course",
    storageBucket:"let-s-study-pro-course.firebasestorage.app",
    messagingSenderId:"474928293390",
    appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId:"G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


/* ==============================
   STATE
============================== */

let currentUser = null;
let channel = null;
let videos = [];
let channelId = null;
let subscribed = false;


/* ==============================
   GET CHANNEL ID
============================== */

function getChannelId(){

    const params =
        new URLSearchParams(location.search);

    const fromUrl =
        params.get("channelId") ||
        params.get("id");

    if(fromUrl)
        return fromUrl;

    const parts =
        location.pathname.split("/").filter(Boolean);

    return parts.length
        ? parts[parts.length - 1]
        : null;
}


/* ==============================
   AUTH
============================== */

onAuthStateChanged(auth, user => {

    currentUser = user || null;

    if(user){

        const name =
            user.displayName ||
            user.email?.split("@")[0] ||
            "User";

        document.getElementById("userName")
            .textContent = name;

        document.getElementById("userAvatar")
            .textContent =
            name.charAt(0).toUpperCase();

    }

    loadChannel();

});


/* ==============================
   LOAD CHANNEL
============================== */

async function loadChannel(){

    channelId = getChannelId();

    if(!channelId){

        showError("Channel ID is missing.");
        return;

    }

    try{

        const snap = await getDoc(
            doc(db,"channels",channelId)
        );

        if(!snap.exists()){

            showError("Channel not found.");
            return;

        }

        channel = {
            id:snap.id,
            ...snap.data()
        };

        renderChannel();

        await Promise.all([
            loadVideos(),
            checkSubscription()
        ]);

    }catch(error){

        console.error(
            "Channel loading error:",
            error
        );

        showError(
            "Unable to load channel."
        );

    }

}


/* ==============================
   RENDER CHANNEL
============================== */

function renderChannel(){

    document.title =
        `${channel.name || "Channel"} | Let'sStudy Pro`;

    document.getElementById("channelName")
        .textContent =
        channel.name || "Unnamed Channel";

    document.getElementById("channelHandle")
        .textContent =
        channel.handle
            ? `@${channel.handle.replace("@","")}`
            : "";

    document.getElementById("channelDescription")
        .textContent =
        channel.description || "";

    document.getElementById("aboutDescription")
        .textContent =
        channel.description || "No description.";

    document.getElementById("channelCategory")
        .textContent =
        channel.category
            ? `Category: ${channel.category}`
            : "";

    const website =
        channel.website || "";

    document.getElementById("channelWebsite")
        .textContent =
        website ? ` • ${website}` : "";

    document.getElementById("channelAvatar")
        .src =
        channel.avatar ||
        "/favicon.ico";

    if(channel.banner){

        document.getElementById("channelBanner")
            .style.backgroundImage =
            `url("${channel.banner}")`;

    }

    document.getElementById("subscriberCount")
        .textContent =
        formatNumber(channel.subscribers || 0);

    document.getElementById("videoCount")
        .textContent =
        formatNumber(channel.videosCount || 0);

    document.getElementById("viewCount")
        .textContent =
        formatNumber(channel.totalViews || 0);

    document.getElementById("verifiedStatus")
        .textContent =
        channel.verified
            ? "✓ Verified"
            : "Public";

    document.getElementById("aboutChannelId")
        .textContent = channel.id;

    document.getElementById("aboutOwnerId")
        .textContent =
        channel.ownerId || "—";

    document.getElementById("aboutOwnerEmail")
        .textContent =
        channel.ownerEmail || "—";

    document.getElementById("aboutCreated")
        .textContent =
        getDate(channel.createdAt);

    document.getElementById("aboutWebsite")
        .textContent =
        channel.website || "—";

}


/* ==============================
   LOAD VIDEOS
============================== */

async function loadVideos(){

    const grid =
        document.getElementById("videoGrid");

    try{

        const q = query(
            collection(db,"videos"),
            where("channelId","==",channelId)
        );

        const snap = await getDocs(q);

        videos = snap.docs
            .map(d => ({
                id:d.id,
                ...d.data()
            }))
            .filter(v =>
                v.status === "published" ||
                v.status === undefined
            )
            .sort((a,b) =>
                getMillis(b.publishedAt || b.createdAt) -
                getMillis(a.publishedAt || a.createdAt)
            );

        renderVideos(videos);

    }catch(error){

        console.error(
            "Video loading error:",
            error
        );

        grid.innerHTML = `
            <div class="empty">
                Unable to load channel videos.
            </div>
        `;

    }

}


/* ==============================
   RENDER VIDEOS
============================== */

function renderVideos(list){

    const grid =
        document.getElementById("videoGrid");

    if(!list.length){

        grid.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                <div style="font-size:40px">🎬</div>
                <h3>No videos yet</h3>
                <p>This channel has not published any videos.</p>
            </div>
        `;

        return;

    }

    grid.innerHTML =
        list.map(video => `

            <article
                class="video"
                onclick="openVideo('${escapeAttr(video.id)}')">

                <img
                    class="thumb"
                    src="${escapeAttr(
                        video.thumbnail ||
                        "/favicon.ico"
                    )}"
                    alt="${escapeAttr(
                        video.title || "Video"
                    )}"
                    loading="lazy"
                    onerror="this.src='/favicon.ico'">

                <h3>
                    ${escapeHTML(
                        video.title ||
                        "Untitled video"
                    )}
                </h3>

                <div class="meta">
                    ${formatNumber(video.views || 0)} views
                    •
                    ${getDate(
                        video.publishedAt ||
                        video.createdAt
                    )}
                </div>

            </article>

        `).join("");

}


/* ==============================
   SEARCH
============================== */

window.searchVideos = function(){

    const term =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if(!term){

        renderVideos(videos);
        return;

    }

    const filtered =
        videos.filter(video => {

            const text = [
                video.title,
                video.description,
                video.category,
                ...(Array.isArray(video.tags)
                    ? video.tags
                    : [])
            ]
            .join(" ")
            .toLowerCase();

            return text.includes(term);

        });

    renderVideos(filtered);

};


/* ==============================
   SUBSCRIPTION
============================== */

async function checkSubscription(){

    if(!currentUser || !channel)
        return;

    try{

        const q = query(
            collection(db,"subscriptions"),
            where("userId","==",currentUser.uid),
            where("channelId","==",channel.id)
        );

        const snap = await getDocs(q);

        subscribed = !snap.empty;

        updateSubscribeButton();

    }catch(error){

        console.warn(
            "Subscription check failed:",
            error
        );

    }

}


function updateSubscribeButton(){

    const btn =
        document.getElementById("subscribeBtn");

    btn.textContent =
        subscribed
            ? "Subscribed"
            : "Subscribe";

    btn.style.background =
        subscribed ? "#e5e7eb" : "#111827";

    btn.style.color =
        subscribed ? "#111827" : "#fff";

}


window.toggleSubscribe = async function(){

    if(!currentUser){

        alert("Please sign in to subscribe.");
        return;

    }

    if(!channel)
        return;

    const btn =
        document.getElementById("subscribeBtn");

    btn.disabled = true;

    try{

        const q = query(
            collection(db,"subscriptions"),
            where("userId","==",currentUser.uid),
            where("channelId","==",channel.id)
        );

        const snap = await getDocs(q);

        if(snap.empty){

            await addDoc(
                collection(db,"subscriptions"),
                {
                    userId:currentUser.uid,
                    channelId:channel.id,
                    channelName:channel.name || "",
                    createdAt:serverTimestamp()
                }
            );

            await updateDoc(
                doc(db,"channels",channel.id),
                {
                    subscribers:increment(1)
                }
            );

            subscribed = true;

            channel.subscribers =
                Number(channel.subscribers || 0) + 1;

        }else{

            await Promise.all(
                snap.docs.map(d =>
                    import("https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js")
                    .then(({deleteDoc}) =>
                        deleteDoc(d.ref)
                    )
                )
            );

            await updateDoc(
                doc(db,"channels",channel.id),
                {
                    subscribers:increment(-1)
                }
            );

            subscribed = false;

            channel.subscribers =
                Math.max(
                    0,
                    Number(channel.subscribers || 0) - 1
                );

        }

        document.getElementById("subscriberCount")
            .textContent =
            formatNumber(channel.subscribers);

        updateSubscribeButton();

        showToast(
            subscribed
                ? "Subscribed"
                : "Unsubscribed"
        );

    }catch(error){

        console.error(
            "Subscription error:",
            error
        );

        showToast(
            "Subscription failed"
        );

    }finally{

        btn.disabled = false;

    }

};


/* ==============================
   SHARE
============================== */

window.shareChannel = async function(){

    const url = location.href;

    try{

        if(navigator.share){

            await navigator.share({
                title:channel?.name || "Let'sStudy Pro Channel",
                text:channel?.description || "",
                url
            });

        }else{

            await navigator.clipboard.writeText(url);

            showToast("Channel link copied");

        }

    }catch(error){

        console.warn(error);

    }

};


/* ==============================
   OPEN VIDEO
============================== */

window.openVideo = function(id){

    location.href =
        `video.html?id=${encodeURIComponent(id)}`;

};


/* ==============================
   TABS
============================== */

window.showTab = function(tab,button){

    document.querySelectorAll(".tab")
        .forEach(el =>
            el.classList.remove("active")
        );

    button.classList.add("active");

    document.getElementById("videosSection")
        .style.display =
        tab === "videos" ? "block" : "none";

    document.getElementById("channelName")
    .textContent = channel.name || "Unnamed Channel";

document.getElementById("channelHandle")
    .textContent = channel.handle
        ? `@${String(channel.handle).replace("@", "")}`
        : "";

document.getElementById("channelDescription")
    .textContent = channel.description || "No channel description available.";

document.getElementById("channelCategory")
    .textContent = channel.category
        ? `Category: ${channel.category}`
        : "";

document.getElementById("channelWebsite")
    .textContent = channel.website
        ? ` • ${channel.website}`
        : "";

document.getElementById("channelAvatar")
    .src = channel.avatar || "/favicon.ico";

if (channel.banner) {
    document.getElementById("channelBanner")
        .style.backgroundImage =
        `url("${escapeAttr(channel.banner)}")`;
}

document.getElementById("subscriberCount")
    .textContent =
    formatNumber(channel.subscribers || 0);

document.getElementById("videoCount")
    .textContent =
    formatNumber(channel.videosCount || 0);

document.getElementById("viewCount")
    .textContent =
    formatNumber(channel.totalViews || 0);

document.getElementById("verifiedStatus")
    .textContent =
    channel.verified ? "✓ Verified" : "Public";

document.getElementById("aboutDescription")
    .textContent =
    channel.description || "No description.";

document.getElementById("aboutChannelId")
    .textContent =
    channel.id || "—";

document.getElementById("aboutOwnerId")
    .textContent =
    channel.ownerId || "—";

document.getElementById("aboutOwnerEmail")
    .textContent =
    channel.ownerEmail || "—";

document.getElementById("aboutCreated")
    .textContent =
    getDate(channel.createdAt);

document.getElementById("aboutWebsite")
    .textContent =
    channel.website || "—";


/* ==============================
   LOAD CHANNEL VIDEOS
============================== */

async function loadVideos(){

    const grid =
        document.getElementById("videoGrid");

    grid.innerHTML = `
        <div class="loading" style="grid-column:1/-1">
            Loading videos...
        </div>
    `;

    try{

        const q = query(
            collection(db, "videos"),
            where("channelId", "==", channelId)
        );

        const snapshot =
            await getDocs(q);

        videos = snapshot.docs
            .map(item => ({
                id: item.id,
                ...item.data()
            }))
            .filter(video =>
                video.status === "published" ||
                video.status === undefined ||
                video.status === "active"
            )
            .sort((a,b) =>
                getMillis(
                    b.publishedAt || b.createdAt
                ) -
                getMillis(
                    a.publishedAt || a.createdAt
                )
            );

        renderVideos(videos);

    }catch(error){

        console.error(
            "Unable to load videos:",
            error
        );

        grid.innerHTML = `
            <div class="empty"
                 style="grid-column:1/-1">
                <div class="empty-icon">⚠️</div>
                <h3>Unable to load videos</h3>
                <p>Please try again later.</p>
            </div>
        `;

    }

}


/* ==============================
   RENDER VIDEOS
============================== */

function renderVideos(list){

    const grid =
        document.getElementById("videoGrid");

    if(!list.length){

        grid.innerHTML = `
            <div class="empty"
                 style="grid-column:1/-1">

                <div class="empty-icon">
                    🎬
                </div>

                <h3>No videos yet</h3>

                <p>
                    This channel has not published
                    any videos.
                </p>

            </div>
        `;

        return;
    }

    grid.innerHTML = list.map(video => {

        const title =
            escapeHTML(
                video.title ||
                "Untitled Video"
            );

        const thumbnail =
            escapeAttr(
                video.thumbnail ||
                "/favicon.ico"
            );

        const id =
            encodeURIComponent(video.id);

        return `
            <article
                class="video"
                onclick="openVideo('${id}')">

                <img
                    class="thumb"
                    src="${thumbnail}"
                    alt="${title}"
                    loading="lazy"
                    onerror="this.src='/favicon.ico'">

                <h3>${title}</h3>

                <div class="meta">
                    ${formatNumber(video.views || 0)}
                    views
                    •
                    ${getDate(
                        video.publishedAt ||
                        video.createdAt
                    )}
                </div>

            </article>
        `;

    }).join("");

}


/* ==============================
   VIDEO SEARCH
============================== */

window.searchVideos = function(){

    const input =
        document.getElementById("searchInput");

    const term =
        input.value
            .trim()
            .toLowerCase();

    if(!term){

        renderVideos(videos);

        return;
    }

    const result =
        videos.filter(video => {

            const tags =
                Array.isArray(video.tags)
                    ? video.tags.join(" ")
                    : String(video.tags || "");

            const text = [
                video.title,
                video.description,
                video.category,
                video.creatorName,
                tags
            ]
            .join(" ")
            .toLowerCase();

            return text.includes(term);

        });

    renderVideos(result);

};


/* ==============================
   OPEN VIDEO
============================== */

window.openVideo = function(id){

    const decoded =
        decodeURIComponent(id);

    location.href =
        `video.html?id=${encodeURIComponent(decoded)}`;

};


/* ==============================
   SUBSCRIPTION CHECK
============================== */

async function checkSubscription(){

    if(!currentUser || !channelId){

        updateSubscribeButton(false);

        return;
    }

    try{

        const q = query(
            collection(db, "subscriptions"),
            where("userId", "==", currentUser.uid),
            where("channelId", "==", channelId)
        );

        const snapshot =
            await getDocs(q);

        subscribed =
            !snapshot.empty;

        updateSubscribeButton(
            subscribed
        );

    }catch(error){

        console.warn(
            "Subscription check failed:",
            error
        );

        updateSubscribeButton(false);

    }

}


/* ==============================
   SUBSCRIBE BUTTON
============================== */

function updateSubscribeButton(value){

    const button =
        document.getElementById(
            "subscribeBtn"
        );

    if(!button)
        return;

    button.textContent =
        value
            ? "Subscribed"
            : "Subscribe";

    button.style.background =
        value
            ? "#e5e7eb"
            : "#111827";

    button.style.color =
        value
            ? "#111827"
            : "#fff";

}


/* ==============================
   SUBSCRIBE / UNSUBSCRIBE
============================== */

window.toggleSubscribe = async function(){

    if(!currentUser){

        showToast(
            "Please sign in first."
        );

        return;

    }

    if(!channelId)
        return;

    const button =
        document.getElementById(
            "subscribeBtn"
        );

    button.disabled = true;

    try{

        const q = query(
            collection(db, "subscriptions"),
            where("userId", "==", currentUser.uid),
            where("channelId", "==", channelId)
        );

        const snapshot =
            await getDocs(q);

        if(snapshot.empty){

            await addDoc(
                collection(db, "subscriptions"),
                {
                    userId:
                        currentUser.uid,

                    channelId:
                        channelId,

                    channelName:
                        channel.name || "",

                    createdAt:
                        serverTimestamp()
                }
            );

            await updateDoc(
                doc(
                    db,
                    "channels",
                    channelId
                ),
                {
                    subscribers:
                        increment(1)
                }
            );

            subscribed = true;

            channel.subscribers =
                Number(channel.subscribers || 0) + 1;

            showToast(
                "Subscribed successfully"
            );

        }else{

            for(const item of snapshot.docs){

                await deleteDoc(item.ref);

            }

            await updateDoc(
                doc(
                    db,
                    "channels",
                    channelId
                ),
                {
                    subscribers:
                        increment(-1)
                }
            );

            subscribed = false;

            channel.subscribers =
                Math.max(
                    0,
                    Number(channel.subscribers || 0) - 1
                );

            showToast(
                "Unsubscribed"
            );

        }

        document.getElementById(
            "subscriberCount"
        ).textContent =
            formatNumber(
                channel.subscribers
            );

        updateSubscribeButton(
            subscribed
        );

    }catch(error){

        console.error(
            "Subscription error:",
            error
        );

        showToast(
            "Subscription failed"
        );

    }finally{

        button.disabled = false;

    }

};


/* ==============================
   SHARE CHANNEL
============================== */

window.shareChannel = async function(){

    const url =
        window.location.href;

    const title =
        channel?.name ||
        "Let'sStudy Pro Channel";

    try{

        if(navigator.share){

            await navigator.share({
                title,
                text:
                    channel?.description || "",
                url
            });

        }else{

            await navigator.clipboard
                .writeText(url);

            showToast(
                "Channel link copied"
            );

        }

    }catch(error){

        console.warn(
            "Share cancelled:",
            error
        );

    }

};

window.showTab = function(
    tab,
    button
){

    document
        .querySelectorAll(".tab")
        .forEach(item =>
            item.classList.remove("active")
        );

    button.classList.add("active");

    document.getElementById(
        "videosSection"
    ).style.display =
        tab === "videos"
            ? "block"
            : "none";

    document.getElementById(
        "aboutSection"
    ).style.display =
        tab === "about"
            ? "block"
            : "none";

};


/* ==============================
   HELPERS
============================== */

function formatNumber(value){

    const number =
        Number(value || 0);

    if(number >= 1000000000)
        return (
            number / 1000000000
        ).toFixed(1) + "B";

    if(number >= 1000000)
        return (
            number / 1000000
        ).toFixed(1) + "M";

    if(number >= 1000)
        return (
            number / 1000
        ).toFixed(1) + "K";

    return number.toLocaleString();

}


function getMillis(value){

    if(!value)
        return 0;

    if(
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }

    if(value.seconds){

        return Number(
            value.seconds
        ) * 1000;

    }

    const date =
        new Date(value);

    return isNaN(
        date.getTime()
    )
        ? 0
        : date.getTime();

}


function getDate(value){

    const milliseconds =
        getMillis(value);

    if(!milliseconds)
        return "—";

    return new Date(
        milliseconds
    ).toLocaleDateString(
        undefined,
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    );

}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttr(value){

    return escapeHTML(value);

}


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },2200);

}
