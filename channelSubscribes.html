<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(780px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 12px}
.lead{font-size:18px;color:var(--muted);margin:0 0 26px;max-width:600px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.st{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.st b{display:block;font-size:26px;line-height:1.1;color:var(--ink)}
.st span{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1;min-width:0;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px}
.search:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
.ib{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
.ib:hover{border-color:var(--p)}
#count{color:var(--muted);font-size:14px;margin:6px 0 12px;min-height:21px}
.row{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800}
.bd{min-width:0;flex:1}
.bd h2{margin:0;font-size:16px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.bd a,.bd p{font-size:14px;color:var(--muted);margin:0;overflow-wrap:anywhere;text-decoration:none}
.bd a:hover{color:var(--p);text-decoration:underline}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side time{font-size:12px;color:var(--muted);white-space:nowrap}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.btn{display:inline-block;margin-top:14px;border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.row{flex-wrap:wrap}.side{flex-direction:row;align-items:center;width:100%;justify-content:space-between;text-align:left}.stats{gap:8px}.st{padding:12px}.st b{font-size:22px}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy Pro</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="notifications.html">Notifications</a>
    <a href="channelSubscribes.html" aria-current="page">Subscribers</a>
  </nav>
</div></header>

<main class="wrap">
  <h1>Subscribers</h1>
  <p class="lead">People following your channels, and the channels you follow.</p>

  <div id="app" hidden="">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-subs" data-tab="subs" aria-selected="true">My subscribers</button>
      <button class="tab" role="tab" id="t-mine" data-tab="mine" aria-selected="false">My subscriptions</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input id="search" class="search" type="search" placeholder="Search" aria-label="Search">
      <button class="ib" id="csv" type="button">Export CSV</button>
    </div>
    <div class="chips" id="chips" hidden=""></div>
    <div id="count" role="status"></div>
    <section id="list"></section>
  </div>
  <div id="msg"></div>
</main>

<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,getDoc,doc,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}

let user=null,tab="subs",subs=[],mine=[],names={},ch="";
const chName=id=>names[id]||"Channel";
const initial=s=>(String(s||"?").trim()[0]||"?").toUpperCase();
const byNew=(a,b)=>(b.d?b.d.getTime():0)-(a.d?a.d.getTime():0);

function stats(){
  const month=Date.now()-30*864e5;
  const t=tab==="subs"?[
    [subs.length,"Subscribers"],
    [new Set(subs.map(s=>s.channelId)).size,"Channels"],
    [subs.filter(s=>s.d&&s.d.getTime()>month).length,"Last 30 days"]
  ]:[
    [mine.length,"Subscriptions"],
    [mine.filter(s=>s.d&&s.d.getTime()>month).length,"Last 30 days"],
    [new Set(mine.map(s=>s.channelOwnerId)).size,"Owners"]
  ];
  $("#stats").innerHTML=t.map(x=>`<div class="st"><b>${x[0].toLocaleString()}</b><span>${x[1]}</span></div>`).join("");
}

function row(s){
  const x=s.d,time=x?`<time datetime="${x.toISOString()}" title="${esc(x.toLocaleString())}">${esc(ago(x))}</time>`:"";
  if(tab==="subs"){
    return `<div class="row"><div class="av" aria-hidden="true">${esc(initial(s.subscribeName||s.subscribeEmail))}</div>
      <div class="bd"><h2>${esc(s.subscribeName||"Subscriber")}</h2>${s.subscribeEmail?`<a href="mailto:${esc(s.subscribeEmail)}">${esc(s.subscribeEmail)}</a>`:""}</div>
      <div class="side"><span class="b" title="${esc(chName(s.channelId))}">${esc(chName(s.channelId))}</span>${time}</div></div>`;
  }
  return `<div class="row"><div class="av" aria-hidden="true">${esc(initial(chName(s.channelId)))}</div>
    <div class="bd"><h2>${esc(chName(s.channelId))}</h2><p>Subscribed</p></div>
    <div class="side">${time}</div></div>`;
}

function render(){
  const data=tab==="subs"?subs:mine,q=$("#search").value.toLowerCase().trim();
  const items=data.filter(s=>(!ch||s.channelId===ch)&&
    (!q||[s.subscribeName,s.subscribeEmail,chName(s.channelId)].join(" ").toLowerCase().includes(q)));
  $("#count").textContent=items.length===1?"1 result":`${items.length} results`;
  $("#list").innerHTML=items.length?items.map(row).join(""):
    `<div class="state"><h2>${data.length?"No matches":tab==="subs"?"No subscribers yet":"No subscriptions yet"}</h2><p>${data.length?"Try a different search or channel.":tab==="subs"?"When people subscribe to your channels, they will appear here.":"Channels you subscribe to will appear here."}</p></div>`;
  $("#csv").hidden=tab!=="subs";
  stats();
}

function chips(){
  const ids=tab==="subs"?[...new Set(subs.map(s=>s.channelId))]:[];
  const box=$("#chips");
  if(ids.length<2){box.hidden=true;ch="";return}
  box.innerHTML=["",...ids].map(id=>`<button class="chip" type="button" data-c="${esc(id)}" aria-pressed="${id===ch}">${esc(id?chName(id):"All channels")}</button>`).join("");
  box.hidden=false;
}

$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  ch=b.dataset.c;
  $("#chips").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  tab=b.dataset.tab;ch="";
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  chips();render();
}));
$("#search").addEventListener("input",render);

/* CSV export (guards against spreadsheet formula injection) */
$("#csv").addEventListener("click",()=>{
  const cell=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const rows=[["Name","Email","Channel","Subscribed"],...subs.filter(s=>!ch||s.channelId===ch)
    .map(s=>[s.subscribeName,s.subscribeEmail,chName(s.channelId),s.d?s.d.toISOString():""])];
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download="subscribers.csv";a.click();URL.revokeObjectURL(a.href);
});

function signedOut(){
  $("#app").hidden=true;
  $("#msg").innerHTML=`<div class="state"><h2>Sign in to view subscribers</h2><p>This page is private to your account.</p><a class="btn" href="login.html">Sign in</a></div>`;
}
function fail(err){
  console.error(err);
  $("#app").hidden=true;
  $("#msg").innerHTML=`<div class="state err"><h2>Unable to load subscribers</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",load);
}

async function load(){
  const col=collection(db,"channelSubscribes");
  const res=await Promise.allSettled([
    getDocs(query(col,where("channelOwnerId","==",user.uid))),
    getDocs(query(col,where("subscribeId","==",user.uid)))
  ]);
  if(res.every(r=>r.status==="rejected"))return fail(res[0].reason);
  const mk=r=>r.status==="fulfilled"?r.value.docs.map(d=>{const s={id:d.id,...d.data()};s.d=toD(s.createdAt);return s}).sort(byNew):[];
  subs=mk(res[0]);mine=mk(res[1]);

  const ids=[...new Set([...subs,...mine].map(s=>s.channelId).filter(Boolean))];
  await Promise.all(ids.map(async id=>{
    try{const s=await getDoc(doc(db,"channels",id));if(s.exists()){const c=s.data();names[id]=c.name||c.title||c.channelName||id}}
    catch{}
    names[id]=names[id]||id;
  }));

  $("#msg").innerHTML="";
  $("#app").hidden=false;
  chips();render();
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,u=>{user=u;u?load():signedOut()});
</script>


</body></html>
