<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(1000px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 12px}
.lead{font-size:18px;color:var(--muted);margin:0 0 28px;max-width:620px}
.tools{display:flex;gap:10px;margin-bottom:12px}
.search,.sort{padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px}
.search{flex:1;min-width:0}
.search:focus,.sort:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
#count{color:var(--muted);font-size:14px;margin:18px 0 14px;min-height:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.c{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.bn{position:relative;height:92px;background:var(--soft)}
.bn img{width:100%;height:100%;object-fit:cover;display:block}
.ft{position:absolute;top:10px;right:10px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.in{padding:0 18px 18px;display:flex;flex-direction:column;flex:1}
.av{width:64px;height:64px;border-radius:50%;border:4px solid var(--paper);background:var(--soft);margin-top:-32px;position:relative;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--p);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.nm{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:18px;line-height:1.3;color:var(--ink);letter-spacing:-.01em;font-weight:800;text-decoration:none;overflow-wrap:anywhere}
.nm:hover{color:var(--p)}
.vf{flex:none;width:18px;height:18px;color:var(--p)}
.hn{color:var(--muted);font-size:14px}
.ds{margin:10px 0 0;color:var(--text);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tag{align-self:flex-start;margin-top:12px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.stats{display:flex;gap:16px;margin:14px 0 16px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-size:15px;margin-right:3px}
.act{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;text-align:center;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--p)}
.btn.on{background:var(--p);border-color:var(--p);color:#fff}
.btn.on.done{background:var(--soft);border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn.on{color:#0b1220}.btn.on.done{color:var(--ink)}}
.state{grid-column:1/-1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.retry{margin-top:14px;border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){.retry{color:#0b1220}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.tools{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="channels.html" aria-current="page">Channels</a>
    <a href="blog.html">Blog</a>
  </nav>
</div></header>

<main class="wrap">
  <h1>Channels</h1>
  <p class="lead">Discover creators, educators and communities. Follow the channels that help you learn, build and grow.</p>

  <div class="tools">
    <input id="search" class="search" type="search" placeholder="Search channels" aria-label="Search channels">
    <select id="sort" class="sort" aria-label="Sort channels">
      <option value="featured">Featured</option>
      <option value="popular">Most subscribers</option>
      <option value="views">Most viewed</option>
      <option value="newest">Newest</option>
    </select>
  </div>
  <div class="chips" id="chips" hidden=""></div>

  <div id="count" role="status"></div>
  <section id="grid" class="grid"></section>
</main>

<div class="toast" id="toast" role="status"></div>
<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,setDoc,deleteDoc,updateDoc,increment,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const grid=$("#grid"),count=$("#count"),chipBox=$("#chips");
const N=new Intl.NumberFormat(undefined,{notation:"compact",maximumFractionDigits:1});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const num=v=>Number(v)||0;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}

let all=[],cat="",user=null,loaded=false;
const subs=new Map(); /* channelId -> subscription doc id */

const VERIFIED=`<svg class="vf" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Verified"><title>Verified</title><path d="M12 2l2.4 2 3.1-.3 1 2.9 2.7 1.6-.9 3 .9 3-2.7 1.6-1 2.9-3.1-.3L12 22l-2.4-2-3.1.3-1-2.9L2.8 15.8l.9-3-.9-3 2.7-1.6 1-2.9 3.1.3zm-1.3 13.2l5-5-1.4-1.4-3.6 3.6-1.6-1.6-1.4 1.4z"/></svg>`;

const SORTS={
  featured:(a,b)=>(b.featured===true)-(a.featured===true)||num(b.subscribers)-num(a.subscribers),
  popular:(a,b)=>num(b.subscribers)-num(a.subscribers),
  views:(a,b)=>num(b.totalViews)-num(a.totalViews),
  newest:(a,b)=>(toD(b.publishedAt||b.createdAt)||0)-(toD(a.publishedAt||a.createdAt)||0)
};

function card(c){
  const href=`channel-details.html?id=${encodeURIComponent(c.id)}`;
  const av=safe(c.avatar),bn=safe(c.banner),own=!!user&&c.ownerId===user.uid,on=subs.has(c.id);
  return `<article class="c">
    <div class="bn">${bn?`<img src="${esc(bn)}" alt="" loading="lazy">`:""}${c.featured?`<span class="ft">Featured</span>`:""}</div>
    <div class="in">
      <div class="av">${av?`<img src="${esc(av)}" alt="" loading="lazy">`:esc((c.name||"?")[0].toUpperCase())}</div>
      <a class="nm" href="${href}">${esc(c.name||"Channel")}${c.verified?VERIFIED:""}</a>
      ${c.handle?`<div class="hn">@${esc(String(c.handle).replace(/^@/,""))}</div>`:""}
      ${c.description?`<p class="ds">${esc(c.description)}</p>`:""}
      ${c.category?`<span class="tag">${esc(cap(c.category))}</span>`:""}
      <div class="stats"><span><b>${N.format(num(c.subscribers))}</b>subscribers</span><span><b>${N.format(num(c.videosCount))}</b>videos</span><span><b>${N.format(num(c.totalViews))}</b>views</span></div>
      <div class="act">
        <a class="btn" href="${href}">View</a>
        ${own?`<span class="btn" style="cursor:default;color:var(--muted)">Your channel</span>`
          :`<button class="btn on${on?" done":""}" type="button" data-id="${esc(c.id)}">${on?"Subscribed":"Subscribe"}</button>`}
      </div>
    </div>
  </article>`;
}

function render(){
  const q=$("#search").value.toLowerCase().trim();
  const items=all.filter(c=>(!cat||c.category===cat)&&
    (!q||[c.name,c.handle,c.description,c.category].join(" ").toLowerCase().includes(q))).sort(SORTS[$("#sort").value]);
  count.textContent=items.length===1?"1 channel":`${items.length} channels`;
  grid.innerHTML=items.length?items.map(card).join(""):
    `<div class="state"><h2>No channels found</h2><p>${all.length?"Try a different search or category.":"No channels have been published yet. Check back soon."}</p></div>`;
}

function chips(){
  const cats=[...new Set(all.map(c=>c.category).filter(Boolean))].sort();
  if(cats.length<2){chipBox.hidden=true;return}
  chipBox.innerHTML=["",...cats].map(c=>`<button class="chip" type="button" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c?cap(c):"All")}</button>`).join("");
  chipBox.hidden=false;
}
chipBox.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  cat=b.dataset.c;
  chipBox.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
});
$("#search").addEventListener("input",render);
$("#sort").addEventListener("change",render);

/* Broken images fall back to the initial / empty banner */
grid.addEventListener("error",e=>{
  const i=e.target;if(i.tagName!=="IMG")return;
  if(i.closest(".av"))i.replaceWith(document.createTextNode(i.closest(".in").querySelector(".nm").textContent.trim()[0]||"?"));
  else i.remove();
},true);

/* Subscribe / unsubscribe (writes to channelSubscribes) */
grid.addEventListener("click",async e=>{
  const b=e.target.closest("button.on");if(!b)return;
  if(!user){location.href="login.html";return}
  const c=all.find(x=>x.id===b.dataset.id);if(!c)return;
  b.disabled=true;
  const bump=async n=>{try{await updateDoc(doc(db,"channels",c.id),{subscribers:increment(n)});c.subscribers=Math.max(0,num(c.subscribers)+n)}catch{}};
  try{
    if(subs.has(c.id)){
      await deleteDoc(doc(db,"channelSubscribes",subs.get(c.id)));
      subs.delete(c.id);await bump(-1);
    }else{
      const id=`${c.id}_${user.uid}`;
      await setDoc(doc(db,"channelSubscribes",id),{
        subscriptionId:id,channelId:c.id,channelOwnerId:c.ownerId||"",
        subscribeId:user.uid,subscribeEmail:user.email||"",
        subscribeName:user.displayName||(user.email||"").split("@")[0]||"Subscriber",
        createdAt:new Date().toISOString()
      });
      subs.set(c.id,id);await bump(1);
      toast("Subscribed to "+(c.name||"channel"));
    }
  }catch(err){console.error(err);toast("Could not update subscription")}
  render();
});

function fail(err){
  console.error(err);
  count.textContent="";
  grid.innerHTML=`<div class="state err"><h2>Unable to load channels</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="retry" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",loadChannels);
}

async function loadChannels(){
  try{
    const s=await getDocs(query(collection(db,"channels"),where("status","in",["published","active","approved"])));
    all=s.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){return fail(e)}
  loaded=true;
  chips();render();
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,async u=>{
  user=u;subs.clear();
  if(u){
    try{(await getDocs(query(collection(db,"channelSubscribes"),where("subscribeId","==",u.uid))))
      .docs.forEach(d=>subs.set(d.data().channelId,d.id))}catch(e){console.warn(e)}
  }
  loaded?render():loadChannels();
});
</script>


</body></html>
