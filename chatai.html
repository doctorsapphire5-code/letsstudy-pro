<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LetsStudy AI | LetsStudy Pro</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 font-family:Inter,Arial,sans-serif;
 background:#f5f7fb;
 color:#172033;
}

.top{
 height:68px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 padding:0 5%;
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:900;
}

.container{
 max-width:1100px;
 margin:35px auto;
 padding:0 18px;
}

.header{
 text-align:center;
 margin-bottom:25px;
}

.header h1{
 font-size:32px;
 margin-bottom:8px;
}

.header p{
 color:#667085;
 font-size:14px;
}

.actions{
 display:flex;
 justify-content:center;
 gap:12px;
 flex-wrap:wrap;
 margin-bottom:25px;
}

.btn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:9px;
 padding:13px 20px;
 border-radius:12px;
 text-decoration:none;
 font-size:14px;
 font-weight:800;
 transition:.2s;
}

.btn-primary{
 background:#155eef;
 color:#fff;
}

.btn-primary:hover{
 background:#004ecc;
 transform:translateY(-2px);
}

.btn-secondary{
 background:#fff;
 color:#155eef;
 border:1px solid #d0d5dd;
}

.btn-secondary:hover{
 background:#eef4ff;
}

.ai-box{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:20px;
 padding:15px;
 box-shadow:0 8px 30px rgba(16,24,40,.07);
}

.ai-box iframe{
 width:100%;
 height:650px;
 border:0;
 border-radius:14px;
 display:block;
}

.footer{
 text-align:center;
 padding:25px;
 margin-top:35px;
 background:#fff;
 border-top:1px solid #e5e7eb;
 color:#667085;
 font-size:12px;
}

@media(max-width:600px){

 .header h1{
  font-size:27px;
 }

 .actions{
  flex-direction:column;
 }

 .btn{
  width:100%;
 }

 .ai-box iframe{
  height:650px;
 }

}

</style>

</head>

<body>


<header class="top">

<div class="logo">
LetsStudy Pro
</div>

</header>


<main class="container">


<section class="header">

<h1>
<i class="fa-solid fa-robot"></i>
LetsStudy AI
</h1>

<p>
Your intelligent learning assistant for students.
</p>

</section>


<!-- BUTTONS -->

<div class="actions">


<!-- OPEN AI STUDIO -->

<a
href="https://letsstudy-ai.ai.studio"
target="_blank"
rel="noopener noreferrer"
class="btn btn-primary"
>

<i class="fa-solid fa-robot"></i>

Open LetsStudy AI

<i class="fa-solid fa-arrow-up-right-from-square"></i>

</a>


<!-- OPEN FASTBOTS -->

<a
href="https://app.fastbots.ai/embed/cmt4up3ji01vkqo1oely6ge1n"
target="_blank"
rel="noopener noreferrer"
class="btn btn-secondary"
>

<i class="fa-solid fa-comments"></i>

Open AI Chat

<i class="fa-solid fa-arrow-up-right-from-square"></i>

</a>


</div>


<!-- FASTBOTS -->

<section class="ai-box">

<iframe
src="https://app.fastbots.ai/embed/cmt4up3ji01vkqo1oely6ge1n"
title="LetsStudy AI Chat"
loading="lazy"
allow="microphone">
</iframe>

</section>


</main>


<footer class="footer">

<strong>
LetsStudy Pro
</strong>

<br>

AI-powered learning assistant

<br><br>

© <span id="year"></span>
LetsStudy Pro. All rights reserved.

</footer>


<script>

document.getElementById("year").textContent =
new Date().getFullYear();

</script>

</body>
</html>
