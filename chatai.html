<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatAI | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

/* AI APP IN BACKGROUND */
.ai-background{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  z-index:1;
}

/* TOP OVERLAY */
.chat-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:64px;
  z-index:10;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);

  border-bottom:1px solid #e5e7eb;
}

.logo{
  font-size:19px;
  font-weight:900;
  color:#155eef;
}

.help{
  background:#155eef;
  color:#fff;
  border:0;
  border-radius:22px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:700;
}

/* BOTTOM BUTTON */
.back-btn{
  position:fixed;
  bottom:20px;
  left:20px;

  z-index:20;

  background:#fff;
  color:#155eef;

  border:1px solid #d0d5dd;
  border-radius:25px;

  padding:11px 17px;

  font-weight:700;
  cursor:pointer;

  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.back-btn:hover{
  background:#155eef;
  color:#fff;
}
</style>
</head>

<body>

<!-- LETSSTUDY AI BACKGROUND -->
<iframe
  class="ai-background"
  src="https://letsstudy-ai.ai.studio"
  title="LetsStudy AI"
  allow="clipboard-write; microphone; camera"
  loading="eager">
</iframe>

<header class="chat-header">

  <div class="logo">
    LetsStudy Pro AI
  </div>

  <button
    class="help"
    onclick="window.location.href='index.html'">
    <i>←</i> Home
  </button>

</header>

<button
  class="back-btn"
  onclick="window.location.href='index.html'">
  ← Back to LetsStudy Pro
</button>

</body>
</html>
