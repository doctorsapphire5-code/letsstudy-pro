<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Course Checkout | LetsStudy Pro</title>
<meta name="description" content="Complete your LetsStudy Pro course enrollment.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 6%;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.container{
  width:92%;
  max-width:1000px;
  margin:35px auto;
}

.layout{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:25px;
}

.box{
  background:#fff;
  border-radius:16px;
  padding:25px;
  box-shadow:0 5px 22px #0000000b;
}

h1{
  font-size:28px;
  margin-bottom:8px;
}

.muted{
  color:#64748b;
  line-height:1.6;
  font-size:14px;
}

.course{
  margin-bottom:20px;
}

.course-image{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
  background:#e5e7eb;
}

.course-title{
  font-size:24px;
  font-weight:800;
  margin-top:18px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:10px;
  color:#64748b;
  font-size:13px;
}

.price{
  font-size:30px;
  font-weight:800;
  margin:18px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #eef0f4;
}

.total{
  font-size:20px;
  font-weight:800;
  border-bottom:0;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-size:14px;
  font-weight:600;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #dce1e8;
  border-radius:8px;
  outline:none;
}

input:focus,select:focus{
  border-color:#2563eb;
}

.pay-btn{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:14px;
  border-radius:9px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  margin-top:20px;
}

.pay-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
  font-size:14px;
}

.message.error{
  display:block;
  background:#fef2f2;
  color:#991b1b;
}

.message.success{
  display:block;
  background:#f0fdf4;
  color:#166534;
}

.loading{
  padding:50px;
  text-align:center;
  color:#64748b;
}

@media(max-width:750px){
  .layout{
    grid-template-columns:1fr;
  }

  .course-image{
    height:180px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>
</header>


<main class="container">

  <div
    id="loading"
    class="box loading"
  >
    Loading course...
  </div>


  <div
    id="checkout"
    class="layout"
    style="display:none"
  >

    <!-- COURSE -->

    <section class="box">

      <h1>
        Course Checkout
      </h1>

      <p class="muted">
        Review your course before continuing.
      </p>

      <div class="course">

        <img
          id="courseImage"
          class="course-image"
          alt=""
        >

        <div
          id="courseTitle"
          class="course-title"
        ></div>

        <div
          id="courseDescription"
          class="muted"
          style="margin-top:8px"
        ></div>

        <div
          id="courseMeta"
          class="meta"
        ></div>

      </div>

    </section>


    <!-- PAYMENT -->

    <section class="box">

      <h2>
        Order Summary
      </h2>

      <div class="row">

        <span>
          Course
        </span>

        <strong id="summaryTitle">
          -
        </strong>

      </div>

      <div class="row">

        <span>
          Price
        </span>

        <strong id="summaryPrice">
          -
        </strong>

      </div>

      <div class="row total">

        <span>
          Total
        </span>

        <strong id="total">
          -
        </strong>

      </div>


      <form id="checkoutForm">

        <label for="name">
          Full Name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Your full name"
          required
        >


        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="Your email"
          required
        >


        <label for="method">
          Payment Method
        </label>

        <select
          id="method"
          required
        >

          <option value="">
            Select payment method
          </option>

          <option value="mobile_money">
            Mobile Money
          </option>

          <option value="card">
            Card
          </option>

          <option value="bank">
            Bank Transfer
          </option>

        </select>


        <button
          id="payButton"
          class="pay-btn"
          type="submit"
        >
          Continue to Payment
        </button>

      </form>


      <div
        id="message"
        class="message"
      ></div>

    </section>

  </div>

</main>


<script>

const API = "/api/data";

const params =
  new URLSearchParams(
    location.search
  );

const courseId =
  params.get("courseId") ||
  params.get("id") ||
  params.get("documentId");


let course = null;


/* =========================
   ELEMENTS
========================= */

const loading =
  document.getElementById(
    "loading"
  );

const checkout =
  document.getElementById(
    "checkout"
  );

const message =
  document.getElementById(
    "message"
  );


/* =========================
   LOAD COURSE
========================= */

async function loadCourse(){

  if(!courseId){

    showError(
      "Course ID is missing."
    );

    return;

  }


  try{

    const response =
      await fetch(
        API +
        "?collection=courses&id=" +
        encodeURIComponent(
          courseId
        )
      );


    if(response.status === 404){

      throw new Error(
        "Course not found."
      );

    }


    if(!response.ok){

      throw new Error(
        "Unable to load course."
      );

    }


    const result =
      await response.json();


    if(
      !result.success ||
      !result.data
    ){

      throw new Error(
        "Invalid course response."
      );

    }


    course =
      result.data;


    renderCourse();


  }catch(error){

    console.error(
      "COURSE CHECKOUT:",
      error
    );


    showError(
      error.message ||
      "Unable to load course."
    );

  }

}


/* =========================
   RENDER COURSE
========================= */

function renderCourse(){

  loading.style.display =
    "none";

  checkout.style.display =
    "grid";


  const title =
    course.title ||
    course.name ||
    "Course";


  const description =
    course.description ||
    course.shortDescription ||
    "Course enrollment";


  const image =
    course.thumbnail ||
    course.thumbnailUrl ||
    course.coverImage ||
    course.image ||
    "";


  const price =
    getPrice(course);


  document.getElementById(
    "courseTitle"
  ).textContent =
    title;


  document.getElementById(
    "courseDescription"
  ).textContent =
    description;


  const imageElement =
    document.getElementById(
      "courseImage"
    );


  if(image){

    imageElement.src =
      safeImage(image);

  }else{

    imageElement.style.display =
      "none";

  }


  const level =
    course.level ||
    course.difficulty ||
    "";


  const duration =
    course.duration ||
    "";


  const lessons =
    course.lessonsCount ||
    course.lessonCount ||
    "";


  document.getElementById(
    "courseMeta"
  ).innerHTML = `

    ${
      level
      ? `<span>${escapeHTML(level)}</span>`
      : ""
    }

    ${
      duration
      ? `<span>${escapeHTML(duration)}</span>`
      : ""
    }

    ${
      lessons
      ? `<span>${escapeHTML(lessons)} lessons</span>`
      : ""
    }

  `;


  document.getElementById(
    "summaryTitle"
  ).textContent =
    title;


  document.getElementById(
    "summaryPrice"
  ).textContent =
    formatMoney(price);


  document.getElementById(
    "total"
  ).textContent =
    formatMoney(price);


  if(course.free === true){

    document.getElementById(
      "summaryPrice"
    ).textContent =
      "Free";


    document.getElementById(
      "total"
    ).textContent =
      "Free";

  }

}


/* =========================
   PRICE
========================= */

function getPrice(data){

  if(data.free === true)
    return 0;


  const value =
    data.price ??
    data.salePrice ??
    data.amount ??
    data.cost ??
    0;


  const number =
    Number(value);


  return Number.isFinite(number)
    ? number
    : 0;

}


function formatMoney(amount){

  if(!amount)
    return "Free";


  const currency =
    course?.currency ||
    "TZS";


  return (
    Number(amount)
      .toLocaleString(
        undefined,
        {
          maximumFractionDigits:2
        }
      )
    + " " +
    currency
  );

}


/* =========================
   CHECKOUT
========================= */

document
  .getElementById(
    "checkoutForm"
  )
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();


      if(!course){

        showMessage(
          "Course information is unavailable.",
          "error"
        );

        return;

      }


      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const email =
        document.getElementById(
          "email"
        ).value.trim();


      const method =
        document.getElementById(
          "method"
        ).value;


      if(
        !name ||
        !email ||
        !method
      ){

        showMessage(
          "Please complete all required fields.",
          "error"
        );

        return;

      }


      const price =
        getPrice(course);


      /*
       * Public checkout page.
       *
       * Do not create orders directly
       * from this page. Send the customer
       * to the existing payment flow.
       */

      const query =
        new URLSearchParams({

          courseId:
            course.id ||
            course.documentId ||
            courseId,

          name,

          email,

          method,

          amount:
            String(price),

          currency:
            course.currency ||
            "TZS"

        });


      /*
       * Existing payment page.
       */

      location.href =
        "payment.html?" +
        query.toString();

    }
  );


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
){

  message.className =
    "message " +
    type;

  message.textContent =
    text;

}


/* =========================
   ERROR
========================= */

function showError(text){

  loading.className =
    "box message error";

  loading.style.display =
    "block";

  loading.innerHTML = `

    <strong>
      Unable to continue
    </strong>

    <p style="margin-top:8px">
      ${escapeHTML(text)}
    </p>

  `;

}


/* =========================
   IMAGE
========================= */

function safeImage(url){

  const value =
    String(url || "").trim();


  if(
    value.startsWith("https://") ||
    value.startsWith("http://")
  ){

    return value;

  }


  return "";
}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadCourse();

</script>

</body>
</html>
