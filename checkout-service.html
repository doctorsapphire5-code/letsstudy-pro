<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Service Checkout | LetsStudy Pro</title>
<meta name="description" content="Checkout for LetsStudy Pro services.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 6%;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.container{
  width:92%;
  max-width:1050px;
  margin:35px auto;
}

.layout{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:25px;
}

.box{
  background:#fff;
  border-radius:16px;
  padding:25px;
  box-shadow:0 5px 22px #0000000b;
}

h1{
  font-size:28px;
  margin-bottom:8px;
}

h2{
  margin-bottom:15px;
}

.muted{
  color:#64748b;
  font-size:14px;
  line-height:1.6;
}

.service{
  margin-top:22px;
}

.cover{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
  background:#e5e7eb;
}

.title{
  font-size:25px;
  font-weight:800;
  margin-top:18px;
}

.description{
  margin-top:8px;
}

.meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.badge{
  padding:6px 10px;
  border-radius:20px;
  background:#eef2ff;
  color:#4338ca;
  font-size:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #edf0f4;
}

.total{
  font-size:20px;
  font-weight:800;
  border-bottom:0;
}

label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin:15px 0 6px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #dce1e8;
  border-radius:8px;
  outline:none;
  font-family:inherit;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

.btn{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  font-size:14px;
}

.message.error{
  display:block;
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  text-align:center;
  padding:60px 20px;
}

@media(max-width:750px){
  .layout{
    grid-template-columns:1fr;
  }

  .cover{
    height:180px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>
</header>


<main class="container">

  <div
    id="loading"
    class="box loading"
  >
    Loading service...
  </div>


  <div
    id="checkout"
    class="layout"
    style="display:none"
  >

    <!-- SERVICE DETAILS -->

    <section class="box">

      <h1>
        Service Checkout
      </h1>

      <p class="muted">
        Review the service and provide your requirements.
      </p>


      <div class="service">

        <img
          id="cover"
          class="cover"
          alt=""
        >


        <div
          id="title"
          class="title"
        ></div>


        <p
          id="description"
          class="muted description"
        ></p>


        <div
          id="meta"
          class="meta"
        ></div>

      </div>

    </section>


    <!-- CHECKOUT -->

    <section class="box">

      <h2>
        Order Summary
      </h2>


      <div class="row">

        <span>
          Service
        </span>

        <strong id="summaryTitle">
          -
        </strong>

      </div>


      <div class="row">

        <span>
          Price
        </span>

        <strong id="summaryPrice">
          -
        </strong>

      </div>


      <div class="row total">

        <span>
          Total
        </span>

        <strong id="total">
          -
        </strong>

      </div>


      <form id="checkoutForm">

        <label for="name">
          Full Name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Your full name"
          required
        >


        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        >


        <label for="phone">
          Phone
        </label>

        <input
          id="phone"
          type="tel"
          placeholder="Phone number"
          required
        >


        <label for="requirements">
          Service Requirements
        </label>

        <textarea
          id="requirements"
          placeholder="Tell us what you need..."
        ></textarea>


        <label for="method">
          Payment Method
        </label>

        <select
          id="method"
          required
        >

          <option value="">
            Select payment method
          </option>

          <option value="mobile_money">
            Mobile Money
          </option>

          <option value="card">
            Card
          </option>

          <option value="bank">
            Bank Transfer
          </option>

        </select>


        <button
          id="submitBtn"
          class="btn"
          type="submit"
        >
          Continue to Payment
        </button>

      </form>


      <div
        id="message"
        class="message"
      ></div>

    </section>

  </div>

</main>


<script>

const API =
  "/api/data";


const params =
  new URLSearchParams(
    location.search
  );


const serviceId =
  params.get("serviceId") ||
  params.get("id") ||
  params.get("documentId");


let service = null;


/* =========================
   LOAD SERVICE
========================= */

async function loadService(){

  if(!serviceId){

    showError(
      "Service ID is missing."
    );

    return;

  }


  try{

    const url =
      API +
      "?collection=services&id=" +
      encodeURIComponent(
        serviceId
      );


    const response =
      await fetch(url);


    if(response.status === 404){

      throw new Error(
        "Service not found."
      );

    }


    if(!response.ok){

      throw new Error(
        "Unable to load service."
      );

    }


    const result =
      await response.json();


    if(
      !result.success ||
      !result.data
    ){

      throw new Error(
        "Invalid service response."
      );

    }


    service =
      result.data;


    renderService();


  }catch(error){

    console.error(
      "SERVICE CHECKOUT ERROR:",
      error
    );


    showError(
      error.message ||
      "Unable to load service."
    );

  }

}


/* =========================
   RENDER SERVICE
========================= */

function renderService(){

  document
    .getElementById(
      "loading"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "checkout"
    )
    .style.display =
    "grid";


  const title =
    service.title ||
    service.name ||
    service.serviceName ||
    "Service";


  const description =
    service.description ||
    service.shortDescription ||
    "Professional service.";


  const image =
    service.coverImage ||
    service.thumbnail ||
    service.thumbnailUrl ||
    service.image ||
    service.imageUrl ||
    "";


  const price =
    getPrice(service);


  document.getElementById(
    "title"
  ).textContent =
    title;


  document.getElementById(
    "description"
  ).textContent =
    description;


  const cover =
    document.getElementById(
      "cover"
    );


  if(image){

    cover.src =
      safeImage(image);

  }else{

    cover.style.display =
      "none";

  }


  document.getElementById(
    "summaryTitle"
  ).textContent =
    title;


  document.getElementById(
    "summaryPrice"
  ).textContent =
    formatMoney(price);


  document.getElementById(
    "total"
  ).textContent =
    formatMoney(price);


  document.getElementById(
    "meta"
  ).innerHTML = `

    ${
      service.category
      ? `
        <span class="badge">
          ${escapeHTML(
            service.category
          )}
        </span>
      `
      : ""
    }

    ${
      service.subcategory
      ? `
        <span class="badge">
          ${escapeHTML(
            service.subcategory
          )}
        </span>
      `
      : ""
    }

    ${
      service.deliveryTime
      ? `
        <span class="badge">
          Delivery:
          ${escapeHTML(
            service.deliveryTime
          )}
        </span>
      `
      : ""
    }

    ${
      service.providerName
      ? `
        <span class="badge">
          ${escapeHTML(
            service.providerName
          )}
        </span>
      `
      : ""
    }

  `;

}


/* =========================
   PRICE
========================= */

function getPrice(data){

  const value =
    data.price ??
    data.salePrice ??
    data.amount ??
    data.cost ??
    0;


  const number =
    Number(value);


  return Number.isFinite(number)
    ? number
    : 0;

}


function formatMoney(amount){

  if(!amount){

    return "Free";

  }


  return (
    Number(amount)
      .toLocaleString(
        undefined,
        {
          maximumFractionDigits:2
        }
      )
    + " " +
    (
      service?.currency ||
      "TZS"
    )
  );

}


/* =========================
   SUBMIT CHECKOUT
========================= */

document
  .getElementById(
    "checkoutForm"
  )
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();


      if(!service){

        showMessage(
          "Service information is unavailable.",
          "error"
        );

        return;

      }


      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const email =
        document.getElementById(
          "email"
        ).value.trim();


      const phone =
        document.getElementById(
          "phone"
        ).value.trim();


      const requirements =
        document.getElementById(
          "requirements"
        ).value.trim();


      const method =
        document.getElementById(
          "method"
        ).value;


      if(
        !name ||
        !email ||
        !phone ||
        !method
      ){

        showMessage(
          "Please complete all required fields.",
          "error"
        );

        return;

      }


      const id =
        service.id ||
        service.documentId ||
        serviceId;


      const amount =
        getPrice(service);


      /*
       * Public page does not write to Firebase.
       *
       * It passes checkout information
       * to the existing payment flow.
       */

      const query =
        new URLSearchParams({

          serviceId:
            id,

          type:
            "service",

          name,

          email,

          phone,

          requirements,

          method,

          amount:
            String(amount),

          currency:
            service.currency ||
            "TZS"

        });


      location.href =
        "payment.html?" +
        query.toString();

    }
  );


/* =========================
   ERROR
========================= */

function showError(text){

  const loading =
    document.getElementById(
      "loading"
    );


  loading.style.display =
    "block";


  loading.innerHTML = `

    <strong>
      Unable to continue
    </strong>

    <p
      class="muted"
      style="margin-top:8px"
    >
      ${escapeHTML(text)}
    </p>

  `;

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "message"
    );


  message.className =
    "message " +
    type;


  message.textContent =
    text;

}


/* =========================
   SAFE IMAGE
========================= */

function safeImage(url){

  const value =
    String(url || "").trim();


  if(
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "http://"
    )
  ){

    return value;

  }


  return "";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   START
========================= */

loadService();

</script>

</body>
</html>
