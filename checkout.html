<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | LetsStudy Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #1769ff;
    }

    .logo span {
      color: #111827;
    }

    .back {
      color: #1769ff;
      text-decoration: none;
      font-weight: 600;
    }

    .container {
      max-width: 1050px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .title {
      margin-bottom: 25px;
    }

    .title h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .title p {
      color: #667085;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 25px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 6px 25px rgba(0,0,0,.06);
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8dee9;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1769ff;
    }

    input[readonly] {
      background: #f8fafc;
    }

    .pay-btn {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 15px;
      background: #1769ff;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .pay-btn:hover {
      background: #0e55d7;
    }

    .pay-btn:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .total {
      font-size: 20px;
      font-weight: 800;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .error {
      background: #fff1f1;
      color: #b42318;
    }

    .success {
      background: #ecfdf3;
      color: #027a48;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667085;
      margin-top: 12px;
    }

    .secure {
      text-align: center;
      color: #667085;
      font-size: 13px;
      margin-top: 14px;
    }

    #pesapalFrame {
      display: none;
      width: 100%;
      height: 800px;
      border: 0;
      border-radius: 15px;
      margin-top: 25px;
      background: white;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .title h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      LetsStudy <span>Pro</span>
    </div>

    <a href="dashboard.html" class="back">
      ← Back
    </a>

  </div>
</header>


<div class="container">

  <div class="title">
    <h1>Secure Checkout</h1>
    <p>Complete your payment securely with Pesapal.</p>
  </div>


  <div id="errorBox" class="message error"></div>

  <div id="successBox" class="message success"></div>


  <div class="grid">

    <!-- CUSTOMER DETAILS -->

    <div class="card">

      <h2>Customer Information</h2>

      <div class="form-group">

        <label for="fullName">
          Full Name
        </label>

        <input
          id="fullName"
          type="text"
          placeholder="Enter your full name"
          autocomplete="name"
        >

      </div>


      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
        >

      </div>


      <div class="form-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          id="phone"
          type="tel"
          placeholder="2557XXXXXXXX"
          autocomplete="tel"
        >

      </div>


      <div class="form-group">

        <label>
          Course
        </label>

        <input
          id="productName"
          type="text"
          readonly
        >

      </div>


      <button
        id="payBtn"
        class="pay-btn"
        type="button"
      >
        Pay with Pesapal
      </button>


      <div id="loading" class="loading">
        Creating secure payment...
      </div>


      <div class="secure">
        🔒 Secure payment powered by Pesapal
      </div>

    </div>


    <!-- ORDER SUMMARY -->

    <div class="card">

      <h2>Order Summary</h2>

      <div class="summary-row">

        <span>Product</span>

        <strong id="summaryProduct">
          LetsStudy Pro Course
        </strong>

      </div>


      <div class="summary-row">

        <span>Currency</span>

        <strong>TZS</strong>

      </div>


      <div class="summary-row">

        <span>Amount</span>

        <strong id="summaryAmount">
          TZS 50,000
        </strong>

      </div>


      <div class="summary-row total">

        <span>Total</span>

        <strong id="totalAmount">
          TZS 50,000
        </strong>

      </div>

    </div>

  </div>


  <!-- PESAPAL CHECKOUT -->

  <iframe
    id="pesapalFrame"
    title="Pesapal Checkout"
    allow="payment"
  ></iframe>

</div>


<script type="module">

  /*
  ======================================================
  FIREBASE AUTH
  ======================================================
  */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  /*
  ======================================================
  FIREBASE CONFIG
  ======================================================
  */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYVKXKbljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"
  };


  const firebaseApp =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(firebaseApp);


  /*
  ======================================================
  PAYMENT API

  CHANGE THIS TO YOUR REAL NODE SERVER URL.
  ======================================================
  */

  const PAYMENT_API =
    "https://cybqa.pesapal.com/pesapaliframe/PesapalIframe3/Index?OrderTrackingId=290ef6b6-57a4-42b5-8bb8-da1078ee3ba6";


  /*
  ======================================================
  CURRENT PRODUCT

  IMPORTANT:
  The server also validates this product and price.
  ======================================================
  */

  const PRODUCT = {

    id:
      "letsstudy-pro-course",

    name:
      "LetsStudy Pro Course",

    currency:
      "TZS"

  };


  let currentUser = null;


  /*
  ======================================================
  AUTH STATE
  ======================================================
  */

  onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      location.href = "login.html";
      return;

    }

    admin = user;

    loadJobs();

  }
);


  /*
  ======================================================
  DISPLAY PRODUCT
  ======================================================
  */

  document.getElementById("productName").value =
    PRODUCT.name;

  document.getElementById("summaryProduct").textContent =
    PRODUCT.name;


  /*
  ======================================================
  MESSAGES
  ======================================================
  */

  function showError(message) {

    const errorBox =
      document.getElementById("errorBox");

    errorBox.textContent =
      message;

    errorBox.style.display =
      "block";

    document.getElementById("successBox")
      .style.display =
      "none";
  }


  function showSuccess(message) {

    const successBox =
      document.getElementById("successBox");

    successBox.textContent =
      message;

    successBox.style.display =
      "block";

    document.getElementById("errorBox")
      .style.display =
      "none";
  }


  /*
  ======================================================
  START PAYMENT
  ======================================================
  */

  async function startPayment() {

    const fullName =
      document.getElementById("fullName")
        .value.trim();

    const email =
      document.getElementById("email")
        .value.trim();

    const phone =
      document.getElementById("phone")
        .value.trim();


    if (!fullName) {

      showError(
        "Please enter your full name."
      );

      return;
    }


    if (!email) {

      showError(
        "Please enter your email address."
      );

      return;
    }


    if (!phone) {

      showError(
        "Please enter your phone number."
      );

      return;
    }


    const payBtn =
      document.getElementById("payBtn");

    const loading =
      document.getElementById("loading");


    payBtn.disabled = true;

    loading.style.display = "block";


    try {

      const response =
        await fetch(
          `${PAYMENT_API}/create-payment`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              userId:
                currentUser
                  ? currentUser.uid
                  : null,

              fullName:
                fullName,

              email:
                email,

              phone:
                phone,

              productId:
                PRODUCT.id

            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.message ||
          "Unable to create payment."
        );
      }


      if (
        !data.success ||
        !data.redirectUrl
      ) {

        throw new Error(
          "Pesapal checkout URL was not returned."
        );
      }


      /*
      ==================================================
      OPEN PESAPAL
      ==================================================
      */

      const frame =
        document.getElementById(
          "pesapalFrame"
        );


      frame.src =
        data.redirectUrl;

      frame.style.display =
        "block";


      frame.scrollIntoView({
        behavior: "smooth"
      });


      showSuccess(
        "Payment created. Complete your payment below."
      );


    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        "Unable to create payment."
      );

    } finally {

      payBtn.disabled =
        false;

      loading.style.display =
        "none";
    }
  }


  document
    .getElementById("payBtn")
    .addEventListener(
      "click",
      startPayment
    );

</script>

</body>
</html>
