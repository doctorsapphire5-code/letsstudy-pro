<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | LetsStudy Pro</title>
<meta name="description" content="Secure LetsStudy Pro checkout">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f8fc;color:#111827}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 20px}
.logo{font-size:22px;font-weight:900;text-decoration:none;color:#111827}
.logo span{color:#2563eb}
main{max-width:1050px;margin:auto;padding:40px 20px}
h1{margin:0 0 8px;font-size:38px}
.sub{color:#6b7280;margin-bottom:25px}
.layout{display:grid;grid-template-columns:1fr 350px;gap:22px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:25px}
h2{font-size:19px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;outline:none}
input:focus,select:focus{border-color:#2563eb}
.methods{display:grid;gap:10px;margin-bottom:22px}
.method{padding:14px;border:1px solid #d1d5db;border-radius:10px}
.method input{width:auto}
.notice{background:#eff6ff;color:#1e40af;padding:13px;border-radius:10px;font-size:13px;line-height:1.5}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:900;font-size:15px;cursor:pointer;margin-top:20px}
button:disabled{background:#9ca3af}
.item{padding:13px 0;border-bottom:1px solid #eee;font-size:13px}
.item strong{display:block;margin-bottom:5px}
.item div{display:flex;justify-content:space-between}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin-top:20px}
.empty{text-align:center;padding:50px;background:#fff;border-radius:18px}
.empty a{display:inline-block;margin-top:15px;padding:12px 18px;background:#2563eb;color:#fff;text-decoration:none;border-radius:9px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<a class="logo" href="index.html">LetsStudy <span>Pro</span></a>
</header>

<main>

<h1>Checkout</h1>
<p class="sub">Complete your information and proceed to secure payment.</p>

<div id="empty" class="empty" style="display:none">
<h2>Your cart is empty</h2>
<p>Add a product before checkout.</p>
<a href="index.html">Continue Shopping</a>
</div>

<div id="checkout" class="layout">

<section class="card">

<form id="form">

<h2>Customer Information</h2>

<div class="grid">

<div class="field">
<label>Full Name</label>
<input id="name" required autocomplete="name" placeholder="Your full name">
</div>

<div class="field">
<label>Email</label>
<input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
</div>

<div class="field">
<label>Phone</label>
<input id="phone" type="tel" required autocomplete="tel" placeholder="+255700000000">
</div>

<div class="field">
<label>Country</label>
<select id="country" required>
<option value="">Select country</option>
<option>Tanzania</option>
<option>Kenya</option>
<option>Uganda</option>
<option>Rwanda</option>
<option>Nigeria</option>
<option>Ghana</option>
<option>South Africa</option>
<option>Other</option>
</select>
</div>

</div>

<h2>Payment Method</h2>

<div class="methods">

<label class="method">
<input type="radio" name="method" value="mobile_money" checked>
Mobile Money
</label>

<label class="method">
<input type="radio" name="method" value="card">
Bank Card
</label>

<label class="method">
<input type="radio" name="method" value="bank">
Bank Payment
</label>

</div>

<div class="notice">
<strong>Secure Payment:</strong>
Payment is processed securely through Pesapal.
</div>

<label style="margin-top:18px">
<input id="terms" type="checkbox" required style="width:auto">
 I agree to the LetsStudy Pro terms.
</label>

<button id="pay" type="submit">Pay Now</button>

</form>

</section>

<aside class="card">

<h2>Order Summary</h2>

<div id="items"></div>

<div class="total">
<span>Total</span>
<span id="total">0 TZS</span>
</div>

</aside>

</div>

</main>

<script>

const API="https://api.letsstudy.pro";
const CART_KEY="letsStudyCart";

const $=id=>document.getElementById(id);

function price(v){
  const n=Number(String(v??"").replace(/[^\d.-]/g,""));
  return Number.isFinite(n)?n:0;
}

function money(v){
  return price(v).toLocaleString("en-TZ")+" TZS";
}

function cart(){
  try{
    const x=JSON.parse(localStorage.getItem(CART_KEY)||"[]");
    return Array.isArray(x)?x:[];
  }catch{
    return [];
  }
}

function qty(x){
  return Math.max(1,Math.floor(price(x.quantity||1)));
}

function total(c){
  return c.reduce((s,x)=>s+price(x.price)*qty(x),0);
}

function safe(x){
  return String(x??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[m]));
}

function render(){

  const c=cart();

  if(!c.length){
    $("checkout").style.display="none";
    $("empty").style.display="block";
    return;
  }

  $("items").innerHTML=c.map(x=>{

    const q=qty(x);
    const p=price(x.price);

    return `
      <div class="item">
        <strong>${safe(x.title||x.name||"Product")}</strong>
        <div>
          <span>${q} × ${money(p)}</span>
          <b>${money(p*q)}</b>
        </div>
      </div>
    `;

  }).join("");

  $("total").textContent=money(total(c));
}

$("form").addEventListener("submit",async e=>{

  e.preventDefault();

  const c=cart();
  const amount=total(c);

  if(!c.length||amount<=0){
    alert("Invalid cart.");
    return;
  }

  const fullName=$("name").value.trim();
  const parts=fullName.split(/\s+/).filter(Boolean);

  const orderId=
    "LSP-"+Date.now()+"-"+
    Math.random().toString(36).slice(2,8).toUpperCase();

  const payload={

    orderId,

    amount,
    currency:"TZS",

    description:"LetsStudy Pro Order "+orderId,

    email:$("email").value.trim(),

    firstName:parts.shift()||"Customer",

    lastName:parts.join(" "),

    phoneNumber:$("phone").value.trim(),

    country:$("country").value,

    paymentMethod:
      document.querySelector(
        'input[name="method"]:checked'
      )?.value||"mobile_money",

    items:c.map(x=>({
      productId:
        x.id||x.productId||x.courseId||x.resourceId||"",
      productType:
        x.type||x.productType||"product",
      title:
        x.title||x.name||"LetsStudy Pro Product",
      quantity:qty(x),
      price:price(x.price)
    }))

  };

  const btn=$("pay");

  btn.disabled=true;
  btn.textContent="Creating Payment...";

  try{

    const r=await fetch(
      API+"/api/pesapal/create-order",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(payload)
      }
    );

    const data=await r.json();

    if(!r.ok||!data.success)
      throw new Error(
        data.message||"Payment creation failed."
      );

    if(!data.redirectUrl)
      throw new Error("Pesapal payment URL missing.");

    localStorage.setItem(
      "letsStudyLastOrderTrackingId",
      data.orderTrackingId||""
    );

    const url=new URL("payment.html",location.href);

    url.searchParams.set(
      "orderId",
      data.orderId||orderId
    );

    url.searchParams.set(
      "orderTrackingId",
      data.orderTrackingId||""
    );

    url.searchParams.set(
      "merchantReference",
      data.merchantReference||orderId
    );

    url.searchParams.set(
      "redirectUrl",
      data.redirectUrl
    );

    location.href=url.href;

  }catch(err){

    console.error(err);
    alert(err.message||"Unable to start payment.");

    btn.disabled=false;
    btn.textContent="Pay Now";
  }

});

render();

</script>

</body>
</html>
