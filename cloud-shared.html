<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cloud Shared</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033
}

.container{
  width:min(1150px,94%);
  margin:auto
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:15px 0
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.logo{
  color:#2563eb;
  font-size:18px;
  font-weight:900
}

.back{
  color:#64748b;
  text-decoration:none;
  font-size:9px;
  font-weight:900
}

main{
  padding:28px 0 60px
}

h1{
  font-size:28px;
  margin-bottom:6px
}

.subtitle{
  color:#64748b;
  font-size:10px;
  margin-bottom:22px
}

.layout{
  display:grid;
  grid-template-columns:1fr 300px;
  gap:16px
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:18px
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px
}

.title{
  font-size:13px;
  font-weight:900
}

.description{
  color:#64748b;
  font-size:8px;
  line-height:1.5;
  margin:6px 0 16px
}

.search{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:8px;
  padding:10px;
  outline:none;
  font-size:8px;
  margin-bottom:12px
}

.search:focus{
  border-color:#2563eb
}

.shared{
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:10px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eef2f7
}

.shared:last-child{
  border-bottom:0
}

.file-icon{
  width:40px;
  height:40px;
  border-radius:9px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px
}

.info strong{
  display:block;
  font-size:8px;
  margin-bottom:4px
}

.info span{
  display:block;
  color:#64748b;
  font-size:6px;
  margin-bottom:5px
}

.meta{
  color:#94a3b8;
  font-size:6px
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end
}

.btn{
  border:0;
  border-radius:8px;
  padding:9px 11px;
  font-size:7px;
  font-weight:900;
  cursor:pointer
}

.primary{
  background:#2563eb;
  color:#fff
}

.gray{
  background:#f1f5f9;
  color:#334155
}

.red{
  background:#fee2e2;
  color:#991b1b
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:6px;
  font-weight:900
}

.viewer{
  background:#f1f5f9;
  color:#475569
}

.editor{
  background:#dbeafe;
  color:#1d4ed8
}

.admin{
  background:#ede9fe;
  color:#6d28d9
}

.active{
  background:#dcfce7;
  color:#166534
}

.expired{
  background:#fee2e2;
  color:#991b1b
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#64748b;
  font-size:8px
}

/* SIDEBAR */

.stat{
  display:flex;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid #eef2f7;
  font-size:7px
}

.stat:last-child{
  border-bottom:0
}

.stat span{
  color:#64748b
}

.stat strong{
  font-size:8px
}

.activity{
  display:flex;
  flex-direction:column;
  gap:11px;
  margin-top:12px
}

.activity-item{
  display:flex;
  gap:8px
}

.activity-icon{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#eff6ff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:8px;
  flex:none
}

.activity-item strong{
  display:block;
  font-size:7px
}

.activity-item span{
  display:block;
  color:#64748b;
  font-size:6px;
  margin-top:3px
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100
}

.modal.show{
  display:flex
}

.modal-box{
  width:min(460px,100%);
  background:#fff;
  border-radius:13px;
  padding:20px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}

.modal-head h2{
  font-size:14px
}

.close{
  width:28px;
  height:28px;
  border:0;
  border-radius:6px;
  background:#f1f5f9;
  cursor:pointer
}

.modal-text{
  color:#64748b;
  font-size:8px;
  line-height:1.7
}

.link-box{
  display:flex;
  gap:6px;
  margin-top:12px
}

.link-box input{
  flex:1;
  border:1px solid #dbe2ea;
  border-radius:8px;
  padding:9px;
  font-size:7px;
  outline:none
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#172033;
  color:#fff;
  padding:11px 15px;
  border-radius:8px;
  font-size:8px;
  font-weight:900;
  display:none;
  z-index:200
}

.toast.show{
  display:block
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr
  }
}

@media(max-width:600px){
  .toolbar{
    align-items:flex-start;
    flex-direction:column
  }

  .shared{
    grid-template-columns:40px 1fr
  }

  .actions{
    grid-column:2;
    justify-content:flex-start
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">
☁️ Cloud Shared
</div>

<a
href="cloud-settings.html"
class="back">
← Cloud Settings
</a>

</div>
</header>


<main class="container">

<h1>Cloud Shared</h1>

<p class="subtitle">
Manage files shared with you and files you have shared with others.
</p>


<div class="layout">

<section class="card">

<div class="toolbar">

<div class="title">
Shared Files
</div>

<button
class="btn primary"
onclick="openShare()">
+ Share
</button>

</div>


<input
id="search"
class="search"
type="search"
placeholder="Search shared files...">


<div id="sharedList"></div>

</section>


<aside>

<div class="card">

<div class="title">
Sharing Overview
</div>

<p class="description">
A quick summary of your shared cloud resources.
</p>

<div class="stat">
<span>Total shared</span>
<strong id="totalShared">0</strong>
</div>

<div class="stat">
<span>Active</span>
<strong id="activeShared">0</strong>
</div>

<div class="stat">
<span>Editors</span>
<strong id="editors">0</strong>
</div>

<div class="stat">
<span>Viewers</span>
<strong id="viewers">0</strong>
</div>

</div>


<div class="card" style="margin-top:15px">

<div class="title">
Recent Activity
</div>

<div
id="activity"
class="activity">
</div>

</div>

</aside>

</div>

</main>


<!-- SHARE MODAL -->

<div
id="shareModal"
class="modal">

<div class="modal-box">

<div class="modal-head">

<h2>
Share Resource
</h2>

<button
class="close"
onclick="closeShare()">
×
</button>

</div>


<div class="field">

<label style="display:block;font-size:8px;font-weight:900;margin-bottom:6px">
RESOURCE
</label>

<select
id="resource"
style="width:100%;padding:10px;border:1px solid #dbe2ea;border-radius:8px;font-size:8px;margin-bottom:12px">

<option>Business Report.pdf</option>
<option>Inventory.xlsx</option>
<option>Company Logo.png</option>
<option>Analytics Dashboard</option>
<option>Business Data</option>

</select>

</div>


<div class="field">

<label style="display:block;font-size:8px;font-weight:900;margin-bottom:6px">
EMAIL
</label>

<input
id="email"
type="email"
placeholder="team@example.com"
style="width:100%;padding:10px;border:1px solid #dbe2ea;border-radius:8px;font-size:8px;margin-bottom:12px">

</div>


<div class="field">

<label style="display:block;font-size:8px;font-weight:900;margin-bottom:6px">
PERMISSION
</label>

<select
id="permission"
style="width:100%;padding:10px;border:1px solid #dbe2ea;border-radius:8px;font-size:8px">

<option value="Viewer">Viewer</option>
<option value="Editor">Editor</option>
<option value="Admin">Admin</option>

</select>

</div>


<div class="actions" style="margin-top:15px">

<button
class="btn gray"
onclick="closeShare()">
Cancel
</button>

<button
class="btn primary"
onclick="createShare()">
Share
</button>

</div>

</div>

</div>


<!-- DETAILS MODAL -->

<div
id="detailsModal"
class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="detailsTitle">
Shared Resource
</h2>

<button
class="close"
onclick="closeDetails()">
×
</button>

</div>

<div
id="detailsText"
class="modal-text">
</div>

<div class="link-box">

<input
id="shareLink"
readonly>

<button
class="btn primary"
onclick="copyLink()">
Copy
</button>

</div>

<div class="actions" style="margin-top:15px">

<button
class="btn gray"
onclick="closeDetails()">
Close
</button>

</div>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

/*
  CLOUD SHARED

  Demo uses localStorage.

  Production:
  - Firebase Authentication
  - Firestore sharedResources collection
  - Firebase Storage for files
  - Security Rules for permissions
  - Cloud Functions for notifications/expiry
*/


const demoShared = [

{
 id:"shared_1",
 resource:"Business Report.pdf",
 email:"manager@example.com",
 permission:"Editor",
 status:"Active",
 size:"1.24 GB",
 direction:"You shared",
 createdAt:new Date(Date.now()-86400000).toISOString()
},

{
 id:"shared_2",
 resource:"Company Logo.png",
 email:"designer@example.com",
 permission:"Viewer",
 status:"Active",
 size:"0.8 GB",
 direction:"You shared",
 createdAt:new Date(Date.now()-2*86400000).toISOString()
},

{
 id:"shared_3",
 resource:"Inventory.xlsx",
 email:"you@example.com",
 permission:"Viewer",
 status:"Active",
 size:"0.3 GB",
 direction:"Shared with you",
 createdAt:new Date(Date.now()-3*86400000).toISOString()
}

];


function getShared(){

let data =
JSON.parse(
localStorage.getItem("cloudShared") || "null"
);

if(!Array.isArray(data)){

data=demoShared;

saveShared(data);

}

return data;

}


function saveShared(data){

localStorage.setItem(
"cloudShared",
JSON.stringify(data)
);

}


function renderShared(){

const query =
document.getElementById("search")
.value
.toLowerCase()
.trim();

const data =
getShared()
.filter(item =>
item.resource
.toLowerCase()
.includes(query) ||
item.email
.toLowerCase()
.includes(query)
);

const list =
document.getElementById("sharedList");

list.innerHTML="";


if(!data.length){

list.innerHTML=`
<div class="empty">
☁️
<br><br>
No shared resources found.
</div>
`;

updateStats();
return;

}


data.forEach(item=>{

const row =
document.createElement("div");

row.className="shared";


const permissionClass =
item.permission.toLowerCase();


const statusClass =
item.status.toLowerCase();


row.innerHTML=`

<div class="file-icon">
${getIcon(item.resource)}
</div>


<div class="info">

<strong>
${escapeHTML(item.resource)}
</strong>

<span>
${escapeHTML(item.direction)}
· ${escapeHTML(item.email)}
</span>

<div class="meta">

${escapeHTML(item.size)}
· ${formatDate(item.createdAt)}

</div>

</div>


<div class="actions">

<span class="badge ${permissionClass}">
${escapeHTML(item.permission)}
</span>

<span class="badge ${statusClass}">
${escapeHTML(item.status)}
</span>

<button
class="btn gray"
onclick="viewShared('${safe(item.id)}')">
Details
</button>

<button
class="btn red"
onclick="removeShared('${safe(item.id)}')">
Remove
</button>

</div>

`;

list.appendChild(row);

});

updateStats();

}


function updateStats(){

const data =
getShared();

const active =
data.filter(
x=>x.status==="Active"
);

const editors =
data.filter(
x=>x.permission==="Editor"
);

const viewers =
data.filter(
x=>x.permission==="Viewer"
);


document.getElementById(
"totalShared"
).textContent =
data.length;


document.getElementById(
"activeShared"
).textContent =
active.length;


document.getElementById(
"editors"
).textContent =
editors.length;


document.getElementById(
"viewers"
).textContent =
viewers.length;

}


function openShare(){

document.getElementById(
"shareModal"
).classList.add("show");

}


function closeShare(){

document.getElementById(
"shareModal"
).classList.remove("show");

}


function createShare(){

const resource =
document.getElementById(
"resource"
).value;

const email =
document.getElementById(
"email"
).value
.trim();

const permission =
document.getElementById(
"permission"
).value;


if(!email){

showToast(
"Enter an email address."
);

return;

}


if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){

showToast(
"Enter a valid email."
);

return;

}


const data =
getShared();


data.unshift({

id:"shared_"+Date.now(),

resource:resource,

email:email,

permission:permission,

status:"Active",

size:"—",

direction:"You shared",

createdAt:
new Date().toISOString()

});


saveShared(data);

addActivity(
"Shared "+resource,
email
);

renderShared();

document.getElementById(
"email"
).value="";

closeShare();

showToast(
"Resource shared successfully."
);

}


function viewShared(id){

const item =
getShared().find(
x=>x.id===id
);

if(!item)
return;


document.getElementById(
"detailsTitle"
).textContent =
item.resource;


document.getElementById(
"detailsText"
).innerHTML=`

<strong>Shared with:</strong>
${escapeHTML(item.email)}
<br>

<strong>Permission:</strong>
${escapeHTML(item.permission)}
<br>

<strong>Status:</strong>
${escapeHTML(item.status)}
<br>

<strong>Direction:</strong>
${escapeHTML(item.direction)}
<br>

<strong>Size:</strong>
${escapeHTML(item.size)}
<br>

<strong>Created:</strong>
${formatDate(item.createdAt)}

`;


const token =
btoa(
item.id+":"+Date.now()
)
.replace(/=/g,"");


document.getElementById(
"shareLink"
).value =
window.location.origin+
"/shared.html?token="+
encodeURIComponent(token);


document.getElementById(
"detailsModal"
).classList.add("show");

}


function closeDetails(){

document.getElementById(
"detailsModal"
).classList.remove("show");

}


async function copyLink(){

const input =
document.getElementById(
"shareLink"
);

try{

await navigator.clipboard.writeText(
input.value
);

showToast(
"Share link copied."
);

}catch{

input.select();

document.execCommand("copy");

showToast(
"Share link copied."
);

}

}


function removeShared(id){

const data =
getShared();

const item =
data.find(
x=>x.id===id
);

if(!item)
return;


if(!confirm(
"Remove sharing access for "+
item.email+
"?"))
return;


saveShared(
data.filter(
x=>x.id!==id
)
);


addActivity(
"Removed shared access",
item.email
);

renderShared();

showToast(
"Sharing access removed."
);

}


function addActivity(action,detail){

const activities =
JSON.parse(
localStorage.getItem(
"cloudSharedActivity"
)||"[]"
);

activities.unshift({

action:action,

detail:detail,

createdAt:
new Date().toISOString()

});


localStorage.setItem(
"cloudSharedActivity",
JSON.stringify(
activities.slice(0,10)
)
);

renderActivity();

}


function renderActivity(){

const container =
document.getElementById("activity");

const activities =
JSON.parse(
localStorage.getItem(
"cloudSharedActivity"
)||"[]"
);


if(!activities.length){

container.innerHTML=`

<div class="activity-item">

<div class="activity-icon">
✓
</div>

<div>
<strong>
No recent activity
</strong>

<span>
Sharing activity will appear here.
</span>
</div>

</div>

`;

return;

}


container.innerHTML =
activities
.slice(0,5)
.map(item=>`

<div class="activity-item">

<div class="activity-icon">
✓
</div>

<div>

<strong>
${escapeHTML(item.action)}
</strong>

<span>
${escapeHTML(item.detail)}
· ${formatDate(item.createdAt)}
</span>

</div>

</div>

`)
.join("");

}


function getIcon(name){

const ext =
name
.split(".")
.pop()
.toLowerCase();

if(["png","jpg","jpeg","gif","webp","svg"]
.includes(ext))
return "🖼️";

if(["xlsx","xls","csv"]
.includes(ext))
return "📊";

if(["pdf","doc","docx"]
.includes(ext))
return "📄";

if(["mp4","mov","avi"]
.includes(ext))
return "🎬";

return "☁️";

}


function formatDate(value){

return new Date(value)
.toLocaleDateString(
"en-US",
{
month:"short",
day:"numeric",
year:"numeric"
}
);

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function safe(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


function showToast(message){

const toast =
document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2400);

}


document.getElementById(
"search"
).addEventListener(
"input",
renderShared
);


document.getElementById(
"shareModal"
).addEventListener(
"click",
event=>{
if(event.target.id==="shareModal"){
closeShare();
}
}
);


document.getElementById(
"detailsModal"
).addEventListener(
"click",
event=>{
if(event.target.id==="detailsModal"){
closeDetails();
}
}
);


renderShared();
renderActivity();

</script>

</body>
</html>
