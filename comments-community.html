<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Comments | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="View and participate in community discussions on Let'sStudy Pro."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
  --danger:#dc2626;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
}


/* =========================
   HEADER
========================= */

.topbar{

  height:64px;

  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);

}

.brand{

  display:flex;
  align-items:center;
  gap:10px;

  font-weight:800;

}

.brand-icon{

  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--primary);
  color:#fff;

}

.back-btn{

  border:0;

  padding:9px 13px;

  border-radius:10px;

  background:var(--soft);

  color:var(--text);

  font-weight:700;

  cursor:pointer;

}


/* =========================
   MAIN
========================= */

.container{

  width:100%;
  max-width:760px;

  margin:auto;

  padding:25px 15px 70px;

}

.page-title{

  margin-bottom:18px;

}

.page-title h1{

  font-size:27px;

  font-weight:850;

}

.page-title p{

  margin-top:5px;

  color:var(--muted);

  font-size:13px;

}


/* =========================
   POST PREVIEW
========================= */

.post-preview{

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:16px;

  padding:17px;

  margin-bottom:17px;

}

.post-author{

  display:flex;

  align-items:center;

  gap:10px;

}

.avatar{

  width:42px;
  height:42px;

  border-radius:50%;

  overflow:hidden;

  background:var(--soft);

  display:flex;

  align-items:center;
  justify-content:center;

  font-weight:800;

  font-size:13px;

  flex-shrink:0;

}

.avatar img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.author-name{

  font-size:13px;
  font-weight:800;

}

.post-date{

  margin-top:3px;

  color:var(--muted);

  font-size:10px;

}

.post-text{

  margin-top:13px;

  font-size:14px;

  line-height:1.6;

  color:#334155;

  white-space:pre-wrap;

}


/* =========================
   COMMENT FORM
========================= */

.comment-box{

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:16px;

  padding:15px;

  margin-bottom:17px;

}

.comment-form{

  display:flex;

  align-items:flex-end;

  gap:10px;

}

.comment-input{

  flex:1;

}

textarea{

  width:100%;

  min-height:48px;
  max-height:160px;

  resize:vertical;

  padding:11px 12px;

  border:
    1px solid var(--border);

  border-radius:11px;

  outline:none;

  font-family:inherit;

  font-size:13px;

  color:var(--text);

}

textarea:focus{

  border-color:#64748b;

}

.send-btn{

  border:0;

  border-radius:10px;

  padding:11px 16px;

  background:var(--primary);

  color:#fff;

  font-weight:750;

  cursor:pointer;

  white-space:nowrap;

}

.send-btn:disabled{

  opacity:.5;

  cursor:not-allowed;

}


/* =========================
   COMMENTS
========================= */

.comments-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:12px;

}

.comments-header h2{

  font-size:16px;

  font-weight:800;

}

.comment-count{

  color:var(--muted);

  font-size:12px;

}

.comment{

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:15px;

  padding:14px;

  margin-bottom:10px;

}

.comment.reply{

  margin-left:42px;

  background:#fafbfc;

}

.comment-head{

  display:flex;

  align-items:center;

  gap:9px;

}

.comment-author{

  font-size:12px;

  font-weight:800;

}

.comment-time{

  color:var(--muted);

  font-size:10px;

}

.comment-text{

  margin:

    10px
    0
    8px
    51px;

  font-size:13px;

  line-height:1.55;

  color:#334155;

  white-space:pre-wrap;

  overflow-wrap:anywhere;

}

.comment-actions{

  margin-left:51px;

  display:flex;

  gap:4px;

}

.action-btn{

  border:0;

  background:transparent;

  color:var(--muted);

  padding:6px 8px;

  border-radius:7px;

  font-size:11px;

  font-weight:700;

  cursor:pointer;

}

.action-btn:hover{

  background:var(--soft);

  color:var(--text);

}


/* =========================
   REPLY FORM
========================= */

.reply-form{

  display:none;

  margin:
    10px
    0
    0
    51px;

}

.reply-form.show{

  display:flex;

  gap:7px;

}

.reply-form textarea{

  min-height:40px;

}

.reply-send{

  border:0;

  background:var(--primary);

  color:#fff;

  border-radius:8px;

  padding:8px 11px;

  font-size:11px;

  font-weight:700;

  cursor:pointer;

}


/* =========================
   EMPTY
========================= */

.empty{

  text-align:center;

  padding:45px 15px;

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:15px;

  color:var(--muted);

}

.empty-icon{

  font-size:35px;

  margin-bottom:9px;

}

.empty h3{

  color:var(--text);

  margin-bottom:5px;

}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  padding:35px;

  color:var(--muted);

}

.spinner{

  width:30px;
  height:30px;

  margin:
    0 auto
    10px;

  border:
    3px solid var(--border);

  border-top-color:var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   ERROR
========================= */

.error{

  display:none;

  margin-bottom:14px;

  padding:12px;

  border-radius:10px;

  background:#fef2f2;

  border:
    1px solid #fecaca;

  color:#b91c1c;

  font-size:12px;

}

.error.show{

  display:block;

}


/* =========================
   LOAD MORE
========================= */

.load-more{

  display:block;

  margin:17px auto;

  border:0;

  border-radius:10px;

  padding:10px 18px;

  background:var(--primary);

  color:#fff;

  font-size:12px;

  font-weight:750;

  cursor:pointer;

}

.load-more:disabled{

  opacity:.5;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{

    padding:
      0 12px;

  }

  .brand{

    font-size:13px;

  }

  .container{

    padding:
      20px 11px 60px;

  }

  .page-title h1{

    font-size:24px;

  }

  .comment.reply{

    margin-left:20px;

  }

  .comment-text,
  .comment-actions{

    margin-left:51px;

  }

  .reply-form{

    margin-left:20px;

  }

  .comment-form{

    align-items:stretch;

  }

  .send-btn{

    padding:
      10px 13px;

  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      💬
    </div>

    <span>
      Let'sStudy Pro Community
    </span>

  </div>


  <button
    class="back-btn"
    type="button"
    onclick="goBack()"
  >
    ← Back
  </button>

</header>


<main class="container">


  <!-- TITLE -->

  <section class="page-title">

    <h1>
      Comments
    </h1>

    <p>
      Join the conversation and share
      your thoughts with the community.
    </p>

  </section>


  <!-- ERROR -->

  <div
    id="errorBox"
    class="error"
  ></div>


  <!-- POST -->

  <section
    id="postPreview"
    class="post-preview"
    style="display:none"
  >

    <div class="post-author">

      <div
        id="postAvatar"
        class="avatar"
      >
        👤
      </div>


      <div>

        <div
          id="postAuthor"
          class="author-name"
        >
          Community Member
        </div>

        <div
          id="postDate"
          class="post-date"
        >
          Recently
        </div>

      </div>

    </div>


    <div
      id="postText"
      class="post-text"
    ></div>

  </section>


  <!-- COMMENT FORM -->

  <section class="comment-box">

    <form id="commentForm">

      <div class="comment-form">

        <div class="comment-input">

          <textarea
            id="commentInput"
            maxlength="2000"
            placeholder="Write a comment..."
            required
          ></textarea>

        </div>


        <button
          id="sendButton"
          class="send-btn"
          type="submit"
        >
          Comment
        </button>

      </div>

  <div class="comments-header">

  <div

    <p>

  <section id="comments"></section>

  <div
    id="empty"

  >

    <div class="empty-icon">
      💬

      No comments yet
    </h3>

    <p>
      Be the first person to start
      the conversation.
    </p>

  </div>

  <button

</main>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const auth =
  firebase.auth();


const db =
  firebase.firestore();


/* =========================
   URL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const postId =
  params.get("postId") ||
  params.get("id");


/* =========================
   STATE
========================= */

let currentUser =
  null;

let lastDocument =
  null;

const PAGE_SIZE =
  25;


/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function getInitials(
  name
){

  return String(
    name ||
    "Member"
  )
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(
    word =>
      word
        .charAt(0)
        .toUpperCase()
  )
  .join("");

}


function formatTime(
  timestamp
){

  if(!timestamp){

    return "Recently";

  }


  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);


    return date.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

  }

  catch{

    return "Recently";

  }

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent =
    message;


  box.classList.add(
    "show"
  );

}


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
  async user => {

    currentUser =
      user ||
      null;


    if(!postId){

      showError(
        "No post ID was provided."
      );

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      return;

    }


    await loadPost();

    await loadComments();

  }
);


/* =========================
   LOAD POST
========================= */

async function loadPost(){

  try{

    const snapshot =
      await db
        .collection("posts")
        .doc(postId)
        .get();


    if(!snapshot.exists){

      showError(
        "The post could not be found."
      );

      return;

    }


    const data =
      snapshot.data();


    document.getElementById(
      "postPreview"
    ).style.display =
      "block";


    document.getElementById(
      "postAuthor"
    ).textContent =
      data.authorName ||
      "Community Member";


    document.getElementById(
      "postDate"
    ).textContent =
      formatTime(
        data.createdAt
      );


    document.getElementById(
      "postText"
    ).textContent =
      data.text ||
      "";


    const avatar =
      document.getElementById(
        "postAvatar"
      );


    if(data.authorPhoto){

      avatar.innerHTML =
        `
          <img
            src="${escapeHTML(
              data.authorPhoto
            )}"
            alt="${escapeHTML(
              data.authorName ||
              "Community Member"
            )}"
            referrerpolicy="no-referrer"
          >
        `;

    }

    else{

      avatar.textContent =
        getInitials(
          data.authorName
        );

    }

  }

  catch(error){

    console.error(
      "Load post error:",
      error
    );

    showError(
      "Unable to load the post."
    );

  }

}


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(
  append = false
){

  const loading =
    document.getElementById(
      "loading"
    );


  try{

    if(!append){

      loading.style.display =
        "block";

    }


    let query =
      db
        .collection("comments")
        .where(
          "postId",
          "==",
          postId
        )
        .where(
          "status",
          "==",
          "published"
        )
        .orderBy(
          "createdAt",
          "asc"
        )
        .limit(
          PAGE_SIZE
        );


    if(
      append &&
      lastDocument
    ){

      query =
        query.startAfter(
          lastDocument
        );

    }


    const snapshot =
      await query.get();


    loading.style.display =
      "none";


    if(
      snapshot.empty &&
      !append
    ){

      document.getElementById(
        "empty"
      ).style.display =
        "block";

      updateCommentCount(
        0
      );

      return;

    }


    if(
      !snapshot.empty
    ){

      lastDocument =
        snapshot.docs[
          snapshot.docs.length - 1
        ];

    }


    snapshot.forEach(
      doc => {

        renderComment(
          doc.id,
          doc.data()
        );

      }
    );


    updateCommentCount(
      document.querySelectorAll(
        ".comment"
      ).length
    );


    if(
      snapshot.size <
      PAGE_SIZE
    ){

      document.getElementById(
        "loadMore"
      ).style.display =
        "none";

    }

    else{

      document.getElementById(
        "loadMore"
      ).style.display =
        "block";

    }

  }

  catch(error){

    console.error(
      "Load comments error:",
      error
    );


    loading.style.display =
      "none";


    showError(
      "Unable to load comments. Your Firestore query may require a composite index."
    );

  }

}


/* =========================
   RENDER COMMENT
========================= */

function renderComment(
  commentId,
  data
){

  const comments =
    document.getElementById(
      "comments"
    );


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "comment";


  if(data.parentId){

    card.classList.add(
      "reply"
    );

  }


  const authorName =
    data.authorName ||
    "Community Member";


  const avatar =
    data.authorPhoto

      ? `
        <img
          src="${escapeHTML(
            data.authorPhoto
          )}"
          alt="${escapeHTML(
            authorName
          )}"
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      `

      : getInitials(
          authorName
        );


  card.innerHTML =
    `
      <div class="comment-head">

        <div class="avatar">

          ${avatar}

        </div>


        <div>

          <div class="comment-author">

            ${escapeHTML(
              authorName
            )}

          </div>

          <div class="comment-time">

            ${formatTime(
              data.createdAt
            )}

          </div>

        </div>

      </div>


      <div class="comment-text">

        ${escapeHTML(
          data.text ||
          ""
        )}

      </div>


      <div class="comment-actions">

        <button
          class="action-btn"
          type="button"
          onclick="likeComment('${commentId}')"
        >
          ❤️ ${Number(
            data.likeCount || 0
          )}
        </button>


        <button
          class="action-btn"
          type="button"
          onclick="toggleReply('${commentId}')"
        >
          ↩ Reply
        </button>

      </div>


      <div
        id="reply-${commentId}"
        class="reply-form"
      >

        <textarea
          id="reply-input-${commentId}"
          maxlength="2000"
          placeholder="Write a reply..."
        ></textarea>


        <button
          class="reply-send"
          type="button"
          onclick="submitReply('${commentId}')"
        >
          Reply
        </button>

      </div>
    `;


  comments.appendChild(
    card
  );

}


/* =========================
   CREATE COMMENT
========================= */

document
  .getElementById(
    "commentForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if(!currentUser){

        showError(
          "Please sign in to comment."
        );

        return;

      }


      if(!postId){

        return;

      }


      const input =
        document.getElementById(
          "commentInput"
        );


      const button =
        document.getElementById(
          "sendButton"
        );


      const text =
        input.value.trim();


      if(!text){

        return;

      }


      try{

        button.disabled =
          true;

        button.textContent =
          "Posting...";


        await db
          .collection("comments")
          .add({

            postId:
              postId,

            authorId:
              currentUser.uid,

            authorName:
              currentUser.displayName ||
              "Community Member",

            authorPhoto:
              currentUser.photoURL ||
              "",

            text:
              text,

            parentId:
              null,

            likeCount:
              0,

            status:
              "published",

            createdAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp(),

            updatedAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          });


                input.value =
          "";


        document.getElementById(
          "comments"
        ).innerHTML =
          "";


        document.getElementById(
          "empty"
        ).style.display =
          "none";


        lastDocument =
          null;


        await loadComments();


      }

      catch(error){

        console.error(
          "Comment error:",
          error
        );

        showError(
          "Unable to publish your comment. Please try again."
        );

      }

      finally{

        button.disabled =
          false;

        button.textContent =
          "Comment";

      }

    }
  );


/* =========================
   REPLY FORM
========================= */

function toggleReply(
  commentId
){

  const form =
    document.getElementById(
      "reply-" + commentId
    );

  if(!form){

    return;

  }

  form.classList.toggle(
    "show"
  );

}


/* =========================
   SUBMIT REPLY
========================= */

async function submitReply(
  parentId
){

  if(!currentUser){

    showError(
      "Please sign in to reply."
    );

    return;

  }


  const input =
    document.getElementById(
      "reply-input-" + parentId
    );


  if(!input){

    return;

  }


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  try{

    const button =
      input
        .parentElement
        .querySelector(
          ".reply-send"
        );


    if(button){

      button.disabled =
        true;

      button.textContent =
        "Posting...";

    }


    await db
      .collection("comments")
      .add({

        postId:
          postId,

        authorId:
          currentUser.uid,

        authorName:
          currentUser.displayName ||
          "Community Member",

        authorPhoto:
          currentUser.photoURL ||
          "",

        text:
          text,

        parentId:
          parentId,

        likeCount:
          0,

        status:
          "published",

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp(),

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });


    input.value =
      "";


    const form =
      document.getElementById(
        "reply-" + parentId
      );


    if(form){

      form.classList.remove(
        "show"
      );

    }


    document.getElementById(
      "comments"
    ).innerHTML =
      "";


    lastDocument =
      null;


    document.getElementById(
      "empty"
    ).style.display =
      "none";


    await loadComments();

  }

  catch(error){

    console.error(
      "Reply error:",
      error
    );

    showError(
      "Unable to publish your reply."
    );

  }

  finally{

    const button =
      input
        .parentElement
        .querySelector(
          ".reply-send"
        );


    if(button){

      button.disabled =
        false;

      button.textContent =
        "Reply";

    }

  }

}


/* =========================
   LIKE COMMENT
========================= */

async function likeComment(
  commentId
){

  if(!currentUser){

    showError(
      "Please sign in to like comments."
    );

    return;

  }


  try{

    await db
      .collection("comments")
      .doc(commentId)
      .update({

        likeCount:
          firebase.firestore
            .FieldValue
            .increment(1),

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });

  }

  catch(error){

    console.error(
      "Like comment error:",
      error
    );

    showError(
      "Unable to like this comment."
    );

  }

}


/* =========================
   COMMENT COUNT
========================= */

function updateCommentCount(
  count
){

  const element =
    document.getElementById(
      "commentCount"
    );


  if(!element){

    return;

  }


  element.textContent =
    `${count} ${
      count === 1
        ? "comment"
        : "comments"
    }`;

}


/* =========================
   LOAD MORE
========================= */

document
  .getElementById(
    "loadMore"
  )
  .addEventListener(
    "click",
    async () => {

      const button =
        document.getElementById(
          "loadMore"
        );


      button.disabled =

      button.textContent =

          true
        );

      }

      catch(error){

        console.error(
          "Load more error:",

        );

      }

      finally{

        button.disabled =
          false;

        button.textContent =
          "Load More";

      }

    }
  );


/* =========================
   BACK BUTTON
========================= */

function goBack(){

  if(
    document.referrer &&
    document.referrer
      .startsWith(
        window.location.origin
      )
  ){

    window.history.back();

  }

  else{

    window.location.href =
      "/community.html";

  }

}


/* =========================
   TEXTAREA AUTO RESIZE
========================= */

function autoResize(
  textarea
){

  textarea.style.height =
    "auto";


  textarea.style.height =
    Math.min(
      textarea.scrollHeight,
      160
    ) + "px";

}


document.addEventListener(
  "input",
  event => {

    if(
      event.target &&
      event.target.tagName ===
      "TEXTAREA"
    ){

      autoResize(
        event.target
      );

    }

  }
);


/* =========================
   ENTER SHORTCUT
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.target &&
      event.target.tagName ===
      "TEXTAREA" &&
      event.key === "Enter" &&
      !event.shiftKey
    ){

      /*
       * Keep Shift + Enter for
       * a new line.
       */

      event.preventDefault();


      const form =
        event.target
          .closest("form");


      if(form){

        form.requestSubmit();

      }

    }

  }
);


/* =========================
   INITIAL CHECK
========================= */

if(!postId){

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  showError(
    "Missing post ID. Open this page using comments-community.html?postId=POST_ID"
  );

}


/* =========================
   GLOBAL ERROR HANDLER
========================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled community error:",
      event.reason
    );

  }
);


/* =========================
   FINAL
========================= */

console.log(
  "Let'sStudy Pro Community Comments initialized."
);
