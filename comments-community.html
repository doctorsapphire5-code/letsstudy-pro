<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Comments | LetsStudy Pro</title>
<meta name="description" content="View community comments on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.home{
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:9px 14px;
  border-radius:8px;
  font-size:14px;
}

.container{
  width:92%;
  max-width:850px;
  margin:30px auto;
}

.box{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 5px 20px #0000000b;
}

h1{
  font-size:28px;
  margin-bottom:7px;
}

.muted{
  color:#64748b;
  font-size:14px;
  line-height:1.6;
}

.post{
  margin-bottom:20px;
}

.post-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:8px;
}

.comments{
  margin-top:20px;
}

.comment{
  display:flex;
  gap:12px;
  padding:16px 0;
  border-bottom:1px solid #edf0f4;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#e5e7eb;
  flex:none;
}

.comment-body{
  flex:1;
}

.author{
  font-weight:700;
  margin-bottom:4px;
}

.text{
  color:#334155;
  line-height:1.6;
  font-size:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.date{
  margin-top:6px;
  color:#94a3b8;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#64748b;
}

.error{
  color:#991b1b;
  background:#fef2f2;
  padding:14px;
  border-radius:8px;
}

.spinner{
  text-align:center;
  padding:50px;
  color:#64748b;
}

@media(max-width:600px){
  .container{
    width:94%;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <a
    class="home"
    href="community.html"
  >
    Community
  </a>

</header>


<main class="container">

  <section class="box">

    <h1>
      Comments
    </h1>

    <p class="muted">
      Community discussion and comments.
    </p>


    <div
      id="postInfo"
      class="post"
      style="display:none"
    >

      <div
        id="postTitle"
        class="post-title"
      ></div>

      <div
        id="postDescription"
        class="muted"
      ></div>

    </div>


    <div
      id="comments"
      class="comments"
    >

      <div class="spinner">
        Loading comments...
      </div>

    </div>

  </section>

</main>


<script>

/* =========================
   API
========================= */

const API =
  "/api/data";


/* =========================
   URL PARAMETERS
========================= */

const params =
  new URLSearchParams(
    location.search
  );


const postId =
  params.get("postId") ||
  params.get("post") ||
  params.get("id");


/* =========================
   STATE
========================= */

let comments = [];


/* =========================
   ELEMENT
========================= */

const container =
  document.getElementById(
    "comments"
  );


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

  try{

    /*
     * Public comments API.
     */

    let url =
      API +
      "?collection=comments&limit=100";


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "Unable to load comments."
      );

    }


    const result =
      await response.json();


    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "Invalid API response."
      );

    }


    comments =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    /*
     * If a post ID was supplied,
     * only display comments belonging
     * to that post.
     */

    if(postId){

      comments =
        comments.filter(
          comment => {

            const target =
              comment.postId ||
              comment.postID ||
              comment.post ||
              comment.contentId ||
              comment.parentId;


            return String(
              target || ""
            ) === String(
              postId
            );

          }
        );

    }


    sortComments();

    renderComments();

    loadPost();


  }catch(error){

    console.error(
      "COMMENTS API:",
      error
    );


    container.innerHTML = `

      <div class="error">

        ${escapeHTML(
          error.message ||
          "Failed to load comments."
        )}

      </div>

    `;

  }

}


/* =========================
   LOAD POST
========================= */

async function loadPost(){

  if(!postId)
    return;


  try{

    const response =
      await fetch(
        API +
        "?collection=posts&id=" +
        encodeURIComponent(
          postId
        )
      );


    if(!response.ok)
      return;


    const result =
      await response.json();


    if(
      !result.success ||
      !result.data
    )
      return;


    const post =
      result.data;


    document.getElementById(
      "postInfo"
    ).style.display =
      "block";


    document.getElementById(
      "postTitle"
    ).textContent =
      post.title ||
      post.name ||
      "Post";


    document.getElementById(
      "postDescription"
    ).textContent =
      post.description ||
      post.content ||
      post.text ||
      "";

  }catch(error){

    console.warn(
      "POST API:",
      error
    );

  }

}


/* =========================
   SORT
========================= */

function sortComments(){

  comments.sort(
    (a,b) =>
      getTime(b.createdAt) -
      getTime(a.createdAt)
  );

}


/* =========================
   RENDER
========================= */

function renderComments(){

  if(
    comments.length === 0
  ){

    container.innerHTML = `

      <div class="empty">

        <div
          style="font-size:40px"
        >
          💬
        </div>

        <h3>
          No comments yet
        </h3>

        <p>
          There are no public comments for this post.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    comments
      .map(
        createComment
      )
      .join("");

}


/* =========================
   COMMENT CARD
========================= */

function createComment(
  comment
){

  const name =
    comment.userName ||
    comment.username ||
    comment.authorName ||
    comment.name ||
    "Community Member";


  const text =
    comment.text ||
    comment.comment ||
    comment.content ||
    comment.message ||
    "";


  const avatar =
    comment.avatar ||
    comment.avatarUrl ||
    comment.photoURL ||
    comment.photo ||
    "";


  const date =
    formatDate(
      comment.createdAt ||
      comment.updatedAt
    );


  return `

    <article class="comment">

      <img
        class="avatar"
        src="${safeImage(
          avatar
        )}"
        alt=""
        onerror="
          this.style.display='none';
        "
      >

      <div class="comment-body">

        <div class="author">
          ${escapeHTML(
            name
          )}
        </div>

        <div class="text">
          ${escapeHTML(
            text
          )}
        </div>

        ${
          date
          ? `
            <div class="date">
              ${escapeHTML(
                date
              )}
            </div>
          `
          : ""
        }

      </div>

    </article>

  `;

}


/* =========================
   DATE
========================= */

function getTime(value){

  if(!value)
    return 0;


  if(
    typeof value ===
    "number"
  ){

    return value;

  }


  const time =
    new Date(
      value
    ).getTime();


  return Number.isFinite(time)
    ? time
    : 0;

}


function formatDate(value){

  const time =
    getTime(value);


  if(!time)
    return "";


  return new Date(
    time
  ).toLocaleString(
    undefined,
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* =========================
   SAFE IMAGE
========================= */

function safeImage(url){

  const value =
    String(
      url || ""
    ).trim();


  if(
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "http://"
    )
  ){

    return value;

  }


  return "";

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   START
========================= */

loadComments();

</script>

</body>
</html>
