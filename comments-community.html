<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <a class="home" href="community.html">
    Community
  </a>

</header>


<main class="container">

  <section class="box">

    <h1>
      Comments
    </h1>

    <p class="muted">
      Community discussion and comments.
    </p>


    <div id="postInfo" class="post" style="display:none">

      <div id="postTitle" class="post-title"></div>

      <div id="postDescription" class="muted"></div>

    </div>


    <div id="comments" class="comments">

      <div class="spinner">
        Loading comments...
      </div>

    </div>

  </section>

</main>


<script>

/* =========================
   API
========================= */

const API =
  "/api/data";


/* =========================
   URL PARAMETERS
========================= */

const params =
  new URLSearchParams(
    location.search
  );


const postId =
  params.get("postId") ||
  params.get("post") ||
  params.get("id");


/* =========================
   STATE
========================= */

let comments = [];


/* =========================
   ELEMENT
========================= */

const container =
  document.getElementById(
    "comments"
  );


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

  try{

    /*
     * Public comments API.
     */

    let url =
      API +
      "?collection=comments&limit=100";


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "Unable to load comments."
      );

    }


    const result =
      await response.json();


    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "Invalid API response."
      );

    }


    comments =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    /*
     * If a post ID was supplied,
     * only display comments belonging
     * to that post.
     */

    if(postId){

      comments =
        comments.filter(
          comment => {

            const target =
              comment.postId ||
              comment.postID ||
              comment.post ||
              comment.contentId ||
              comment.parentId;


            return String(
              target || ""
            ) === String(
              postId
            );

          }
        );

    }


    sortComments();

    renderComments();

    loadPost();


  }catch(error){

    console.error(
      "COMMENTS API:",
      error
    );


    container.innerHTML = `

      <div class="error">

        ${escapeHTML(
          error.message ||
          "Failed to load comments."
        )}

      </div>

    `;

  }

}


/* =========================
   LOAD POST
========================= */

async function loadPost(){

  if(!postId)
    return;


  try{

    const response =
      await fetch(
        API +
        "?collection=posts&id=" +
        encodeURIComponent(
          postId
        )
      );


    if(!response.ok)
      return;


    const result =
      await response.json();


    if(
      !result.success ||
      !result.data
    )
      return;


    const post =
      result.data;


    document.getElementById(
      "postInfo"
    ).style.display =
      "block";


    document.getElementById(
      "postTitle"
    ).textContent =
      post.title ||
      post.name ||
      "Post";


    document.getElementById(
      "postDescription"
    ).textContent =
      post.description ||
      post.content ||
      post.text ||
      "";

  }catch(error){

    console.warn(
      "POST API:",
      error
    );

  }

}


/* =========================
   SORT
========================= */

function sortComments(){

  comments.sort(
    (a,b) =>
      getTime(b.createdAt) -
      getTime(a.createdAt)
  );

}


/* =========================
   RENDER
========================= */

function renderComments(){

  if(
    comments.length === 0
  ){

    container.innerHTML = `

      <div class="empty">

        <div
          style="font-size:40px"
        >
          💬
        </div>

        <h3>
          No comments yet
        </h3>

        <p>
          There are no public comments for this post.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    comments
      .map(
        createComment
      )
      .join("");

}


/* =========================
   COMMENT CARD
========================= */

function createComment(
  comment
){

  const name =
    comment.userName ||
    comment.username ||
    comment.authorName ||
    comment.name ||
    "Community Member";


  const text =
    comment.text ||
    comment.comment ||
    comment.content ||
    comment.message ||
    "";


  const avatar =
    comment.avatar ||
    comment.avatarUrl ||
    comment.photoURL ||
    comment.photo ||
    "";


  const date =
    formatDate(
      comment.createdAt ||
      comment.updatedAt
    );


  return `

    <article class="comment">

      <img
        class="avatar"
        src="${safeImage(
          avatar
        )}"
        alt=""
        onerror="
          this.style.display='none';
        "
      >

      <div class="comment-body">

        <div class="author">
          ${escapeHTML(
            name
          )}
        </div>

        <div class="text">
          ${escapeHTML(
            text
          )}
        </div>

        ${
          date
          ? `
            <div class="date">
              ${escapeHTML(
                date
              )}
            </div>
          `
          : ""
        }

      </div>

    </article>

  `;

}


/* =========================
   DATE
========================= */

function getTime(value){

  if(!value)
    return 0;


  if(
    typeof value ===
    "number"
  ){

    return value;

  }


  const time =
    new Date(
      value
    ).getTime();


  return Number.isFinite(time)
    ? time
    : 0;

}


function formatDate(value){

  const time =
    getTime(value);


  if(!time)
    return "";


  return new Date(
    time
  ).toLocaleString(
    undefined,
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* =========================
   SAFE IMAGE
========================= */

function safeImage(url){

  const value =
    String(
      url || ""
    ).trim();


  if(
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "http://"
    )
  ){

    return value;

  }


  return "";

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   START
========================= */

loadComments();

</script>


</body></html>
