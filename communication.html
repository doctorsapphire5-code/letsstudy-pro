<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Communication Skills</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #7c3aed;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    /* =========================================
       HERO
    ========================================= */

    header {
      padding: 70px 0;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          #0f172a,
          #2563eb,
          #7c3aed
        );
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 30px;
      background: rgba(255,255,255,.12);
      font-size: .85rem;
      font-weight: 700;
    }

    header h1 {
      margin: 0 0 15px;
      font-size: clamp(2.3rem, 6vw, 4rem);
      line-height: 1.05;
    }

    header p {
      max-width: 780px;
      margin: 0;
      color: #e0e7ff;
      line-height: 1.75;
      font-size: 1.05rem;
    }

    /* =========================================
       MAIN
    ========================================= */

    main {
      padding: 40px 0;
    }

    /* =========================================
       FILTERS
    ========================================= */

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
      padding: 20px;
      margin-bottom: 25px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .filter-group label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: var(--muted);
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    .input-wrap input {
      padding-left: 40px;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
    }

    /* =========================================
       RESULT BAR
    ========================================= */

    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .result-count {
      color: var(--muted);
    }

    .result-count strong {
      color: var(--text);
    }

    .result-bar select {
      width: auto;
      min-width: 190px;
    }

    /* =========================================
       SKILLS GRID
    ========================================= */

    .skills-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .skill-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .skill-card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 16px 40px rgba(15, 23, 42, .13);
    }

    .skill-cover {
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 4rem;
    }

    .cover-fundamentals {
      background:
        linear-gradient(135deg, #1e3a8a, #2563eb);
    }

    .cover-speaking {
      background:
        linear-gradient(135deg, #7c3aed, #4c1d95);
    }

    .cover-writing {
      background:
        linear-gradient(135deg, #0891b2, #164e63);
    }

    .cover-listening {
      background:
        linear-gradient(135deg, #059669, #065f46);
    }

    .cover-presentation {
      background:
        linear-gradient(135deg, #ea580c, #9a3412);
    }

    .cover-negotiation {
      background:
        linear-gradient(135deg, #dc2626, #7f1d1d);
    }

    .cover-team {
      background:
        linear-gradient(135deg, #2563eb, #1e40af);
    }

    .cover-professional {
      background:
        linear-gradient(135deg, #475569, #0f172a);
    }

    .skill-content {
      padding: 20px;
    }

    .skill-content h3 {
      margin: 10px 0;
      line-height: 1.35;
    }

    .skill-content p {
      min-height: 76px;
      margin: 0 0 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: .77rem;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      transition: background .2s ease;
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    /* =========================================
       EMPTY STATE
    ========================================= */

    .empty {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--muted);
    }

    .empty i {
      margin-bottom: 15px;
      font-size: 3rem;
    }

    .empty h2 {
      color: var(--text);
    }

    /* =========================================
       MODAL
    ========================================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, .75);
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      position: relative;
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 25px 60px rgba(0,0,0,.2);
    }

    .close {
      position: absolute;
      top: 12px;
      right: 16px;
      z-index: 2;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 30px;
      cursor: pointer;
    }

    .modal-box h2 {
      margin-top: 12px;
    }

    .modal-box p {
      color: var(--muted);
      line-height: 1.7;
    }

    .modal-box li {
      margin: 10px 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .modal-box li i {
      color: var(--success);
      margin-right: 7px;
    }

    .learning-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #eff6ff;
      color: #1e40af;
    }

    /* =========================================
       FOOTER
    ========================================= */

    footer {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
    }

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 750px) {

      .filters {
        grid-template-columns: 1fr;
      }

      .result-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .result-bar select {
        width: 100%;
      }

      .skill-content p {
        min-height: auto;
      }

      header {
        padding: 55px 0;
      }

    }
  </style>
</head>

<body>

  <!-- =========================================
       HERO
  ========================================= -->

  <header>

    <div class="container">

      <div class="eyebrow">
        <i class="fa-solid fa-comments"></i>
        Career Skills
      </div>

      <h1>
        Communication Skills
      </h1>

      <p>
        Develop the ability to communicate ideas clearly,
        listen actively, present confidently, write professionally,
        negotiate effectively, and build stronger relationships
        in the workplace.
      </p>

    </div>

  </header>


  <main class="container">

    <!-- =========================================
         FILTERS
    ========================================= -->

    <section class="filters">

      <div class="filter-group">

        <label for="search">
          Search Skills
        </label>

        <div class="input-wrap">

          <i class="fa-solid fa-magnifying-glass"></i>

          <input
            type="search"
            id="search"
            placeholder="Search communication skills..."
          >

        </div>

      </div>


      <div class="filter-group">

        <label for="level">
          Level
        </label>

        <select id="level">

          <option value="all">
            All Levels
          </option>

          <option value="Beginner">
            Beginner
          </option>

          <option value="Intermediate">
            Intermediate
          </option>

          <option value="Advanced">
            Advanced
          </option>

        </select>

      </div>


      <div class="filter-group">

        <label for="category">
          Category
        </label>

        <select id="category">

          <option value="all">
            All Categories
          </option>

          <option value="Communication">
            Communication
          </option>

          <option value="Speaking">
            Speaking
          </option>

          <option value="Writing">
            Writing
          </option>

          <option value="Listening">
            Listening
          </option>

          <option value="Presentation">
            Presentation
          </option>

          <option value="Negotiation">
            Negotiation
          </option>

          <option value="Team Communication">
            Team Communication
          </option>

          <option value="Professional Communication">
            Professional Communication
          </option>

        </select>

      </div>

    </section>


    <!-- =========================================
         RESULT BAR
    ========================================= -->

    <div class="result-bar">

      <div class="result-count">

        Showing
        <strong id="resultCount">0</strong>
        communication skills

      </div>


      <select id="sort">

        <option value="popularity">
          Most Popular
        </option>

        <option value="az">
          A-Z
        </option>

        <option value="level">
          Level
        </option>

      </select>

    </div>


    <!-- =========================================
         SKILLS
    ========================================= -->

    <section
      class="skills-grid"
      id="skillsGrid"
    ></section>

  </main>


  <!-- =========================================
       DETAILS MODAL
  ========================================= -->

  <div
    class="modal"
    id="detailsModal"
    aria-hidden="true"
  >

    <div
      class="modal-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <button
        type="button"
        class="close"
        id="closeModal"
        aria-label="Close"
      >
        &times;
      </button>

      <div id="modalContent"></div>

    </div>

  </div>


  <footer>

    <p>
      © 2026 Communication Skills Platform
    </p>

  </footer>


  <script>

    /* =========================================
       COMMUNICATION SKILLS DATA
    ========================================= */

    const communicationSkills = [

      {
        id: 1,
        title: "Communication Fundamentals",
        category: "Communication",
        level: "Beginner",
        duration: "4 weeks",
        popularity: 100,
        icon: "fa-solid fa-comments",
        cover: "fundamentals",
        description:
          "Learn the core principles of clear, respectful, and effective communication in everyday and professional situations.",
        skills: [
          "Clear communication",
          "Choosing the right words",
          "Non-verbal communication",
          "Communication barriers",
          "Giving and receiving feedback"
        ]
      },


      {
        id: 2,
        title: "Public Speaking",
        category: "Speaking",
        level: "Intermediate",
        duration: "6 weeks",
        popularity: 98,
        icon: "fa-solid fa-microphone",
        cover: "speaking",
        description:
          "Build confidence and deliver engaging speeches, meetings, talks, and professional conversations.",
        skills: [
          "Speaking confidence",
          "Voice control",
          "Audience engagement",
          "Speech structure",
          "Handling nervousness"
        ]
      },


      {
        id: 3,
        title: "Professional Writing",
        category: "Writing",
        level: "Intermediate",
        duration: "5 weeks",
        popularity: 96,
        icon: "fa-solid fa-pen-nib",
        cover: "writing",
        description:
          "Learn to communicate professionally through emails, reports, proposals, messages, and other written content.",
        skills: [
          "Professional emails",
          "Business writing",
          "Report writing",
          "Concise writing",
          "Proofreading"
        ]
      },


      {
        id: 4,
        title: "Active Listening",
        category: "Listening",
        level: "Beginner",
        duration: "3 weeks",
        popularity: 94,
        icon: "fa-solid fa-ear-listen",
        cover: "listening",
        description:
          "Develop active listening skills that help you understand people, ask better questions, and respond effectively.",
        skills: [
          "Active listening",
          "Asking questions",
          "Paraphrasing",
          "Understanding emotions",
          "Constructive responses"
        ]
      },


      {
        id: 5,
        title: "Presentation Skills",
        category: "Presentation",
        level: "Intermediate",
        duration: "6 weeks",
        popularity: 99,
        icon: "fa-solid fa-person-chalkboard",
        cover: "presentation",
        description:
          "Create and deliver clear, persuasive, and professional presentations for different audiences.",
        skills: [
          "Presentation structure",
          "Slide communication",
          "Storytelling",
          "Audience interaction",
          "Q&A techniques"
        ]
      },


      {
        id: 6,
        title: "Negotiation & Persuasion",
        category: "Negotiation",
        level: "Advanced",
        duration: "7 weeks",
        popularity: 92,
        icon: "fa-solid fa-handshake",
        cover: "negotiation",
        description:
          "Develop persuasive communication and negotiation techniques for workplace and business situations.",
        skills: [
          "Persuasive communication",
          "Negotiation strategies",
          "Conflict management",
          "Building agreements",
          "Influencing ethically"
        ]
      },


      {
        id: 7,
        title: "Team Communication",
        category: "Team Communication",
        level: "Intermediate",
        duration: "5 weeks",
        popularity: 97,
        icon: "fa-solid fa-people-group",
        cover: "team",
        description:
          "Improve communication within teams through collaboration, feedback, meetings, and conflict resolution.",
        skills: [
          "Team discussions",
          "Giving feedback",
          "Receiving feedback",
          "Meeting communication",
          "Conflict resolution"
        ]
      },


      {
        id: 8,
        title: "Professional Communication",
        category: "Professional Communication",
        level: "Advanced",
        duration: "8 weeks",
        popularity: 95,
        icon: "fa-solid fa-briefcase",
        cover: "professional",
        description:
          "Master advanced communication skills for leadership, workplace relationships, clients, and professional environments.",
        skills: [
          "Executive communication",
          "Client communication",
          "Leadership communication",
          "Difficult conversations",
          "Professional networking"
        ]
      }

    ];


    /* =========================================
       DOM ELEMENTS
    ========================================= */

    const skillsGrid =
      document.getElementById("skillsGrid");

    const searchInput =
      document.getElementById("search");

    const levelSelect =
      document.getElementById("level");

    const categorySelect =
      document.getElementById("category");

    const sortSelect =
      document.getElementById("sort");

    const resultCount =
      document.getElementById("resultCount");

    const modal =
      document.getElementById("detailsModal");

    const modalContent =
      document.getElementById("modalContent");

    const closeModal =
      document.getElementById("closeModal");


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================
       RENDER SKILLS
    ========================================= */

    function renderSkills(list) {

      if (!list.length) {

        skillsGrid.innerHTML = `

          <div class="empty">

            <i class="fa-solid fa-comments"></i>

            <h2>
              No skills found
            </h2>

            <p>
              Try another search term or change
              your filters.
            </p>

          </div>

        `;

        resultCount.textContent = "0";

        return;
      }


      skillsGrid.innerHTML =
        list.map(skill => `

          <article class="skill-card">

            <div
              class="skill-cover cover-${skill.cover}"
            >

              <i class="${skill.icon}"></i>

            </div>


            <div class="skill-content">

              <div class="meta">

                <span class="badge">
                  ${escapeHTML(skill.level)}
                </span>

                <span class="badge">
                  ${escapeHTML(skill.category)}
                </span>

              </div>


              <h3>
                ${escapeHTML(skill.title)}
              </h3>


              <p>
                ${escapeHTML(skill.description)}
              </p>


              <div class="meta">

                <span class="badge">

                  <i class="fa-regular fa-clock"></i>

                  ${escapeHTML(skill.title)}
              </h3>

              <p>
                ${escapeHTML(skill.description)}
              </p>

              <div class="meta">

                <span class="badge">
                  <i class="fa-regular fa-clock"></i>
                  ${escapeHTML(skill.duration)}
                </span>

                <span class="badge">
                  <i class="fa-solid fa-fire"></i>
                  ${skill.popularity}%
                </span>

              </div>

              <button
                type="button"
                class="btn btn-primary"
                onclick="showDetails(${skill.id})"
              >
                View Details
              </button>

            </div>

          </article>

        `).join("");

      resultCount.textContent = list.length;

    }


    /* =========================================
       FILTER SKILLS
    ========================================= */

    function filterSkills() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();

      const level =
        levelSelect.value;

      const category =
        categorySelect.value;


      let filtered =
        communicationSkills.filter(skill => {

          const searchableText = [

            skill.title,
            skill.category,
            skill.level,
            skill.description,
            skill.duration,
            ...skill.skills

          ]
            .join(" ")
            .toLowerCase();


          const matchesSearch =
            !search ||
            searchableText.includes(search);


          const matchesLevel =
            level === "all" ||
            skill.level === level;


          const matchesCategory =
            category === "all" ||
            skill.category === category;


          return (
            matchesSearch &&
            matchesLevel &&
            matchesCategory
          );

        });


      /* =====================================
         SORT
      ===================================== */

      if (sortSelect.value === "az") {

        filtered.sort(
          (a, b) =>
            a.title.localeCompare(b.title)
        );

      }

      else if (sortSelect.value === "level") {

        const levelOrder = {
          Beginner: 1,
          Intermediate: 2,
          Advanced: 3
        };

        filtered.sort(
          (a, b) =>
            levelOrder[a.level] -
            levelOrder[b.level]
        );

      }

      else {

        filtered.sort(
          (a, b) =>
            b.popularity -
            a.popularity
        );

      }


      renderSkills(filtered);

    }


    /* =========================================
       SHOW DETAILS
    ========================================= */

    function showDetails(id) {

      const skill =
        communicationSkills.find(
          item => item.id === id
        );

      if (!skill) {
        return;
      }


      modalContent.innerHTML = `

        <div
          class="skill-cover cover-${skill.cover}"
          style="
            border-radius:12px;
            margin-bottom:20px;
          "
        >

          <i class="${skill.icon}"></i>

        </div>


        <span class="badge">
          ${escapeHTML(skill.category)}
        </span>


        <h2 id="modalTitle">
          ${escapeHTML(skill.title)}
        </h2>


        <p>
          ${escapeHTML(skill.description)}
        </p>


        <p>
          <strong>Level:</strong>
          ${escapeHTML(skill.level)}
        </p>


        <p>
          <strong>Duration:</strong>
          ${escapeHTML(skill.duration)}
        </p>


        <h3>
          Key Skills
        </h3>


        <ul>

          ${skill.skills.map(item => `

            <li>

              <i class="fa-solid fa-check"></i>

              ${escapeHTML(item)}

            </li>

          `).join("")}

        </ul>


        <button
          type="button"
          class="btn btn-primary"
          onclick="startLearning(${skill.id})"
        >
          Start Learning
        </button>

      `;


      modal.classList.add("active");

      modal.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.style.overflow =
        "hidden";

    }


    /* =========================================
       START LEARNING
    ========================================= */

    function startLearning(id) {

      const skill =
        communicationSkills.find(
          item => item.id === id
        );

      if (!skill) {
        return;
      }


      modalContent.innerHTML = `

        <div
          class="skill-cover cover-${skill.cover}"
          style="
            border-radius:12px;
            margin-bottom:20px;
          "
        >

          <i class="${skill.icon}"></i>

        </div>


        <span class="badge">
          ${escapeHTML(skill.category)}
        </span>


        <h2 id="modalTitle">
          Start Learning:
          ${escapeHTML(skill.title)}
        </h2>


        <p>
          Follow this learning path to develop
          practical communication skills.
        </p>


        <h3>
          Learning Path
        </h3>


        <ol>

          ${skill.skills.map((item, index) => `

            <li>

              <strong>
                Step ${index + 1}:
              </strong>

              ${escapeHTML(item)}

            </li>

          `).join("")}

        </ol>


        <div class="learning-box">

          <strong>
            Recommended Level:
          </strong>

          ${escapeHTML(skill.level)}

          <br><br>

          <strong>
            Estimated Duration:
          </strong>

          ${escapeHTML(skill.duration)}

        </div>


        <button
          type="button"
          class="btn btn-primary"
          style="margin-top:20px;"
          onclick="completeLearning(${skill.id})"
        >
          <i class="fa-solid fa-play"></i>
          Begin Course
        </button>

      `;

    }


    /* =========================================
       BEGIN COURSE
    ========================================= */

    function completeLearning(id) {

      const skill =
        communicationSkills.find(
          item => item.id === id
        );

      if (!skill) {
        return;
      }


      modalContent.innerHTML = `

        <div
          style="
            text-align:center;
            padding:20px 0;
          "
        >

          <div
            style="
              width:80px;
              height:80px;
              margin:0 auto 20px;
              display:flex;
              align-items:center;
              justify-content:center;
              border-radius:50%;
              background:#dcfce7;
              color:#16a34a;
              font-size:2rem;
            "
          >

            <i class="fa-solid fa-check"></i>

          </div>


          <h2>
            Course Ready!
          </h2>


          <p>
            You are ready to begin
            <strong>
              ${escapeHTML(skill.title)}
            </strong>.
          </p>


          <button
            type="button"
            class="btn btn-primary"
            onclick="closeDetails()"
          >
            Continue
          </button>

        </div>

      `;

    }


    /* =========================================
       CLOSE MODAL
    ========================================= */

    function closeDetails() {

      modal.classList.remove("active");

      modal.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.style.overflow = "";

    }


    closeModal.addEventListener(
      "click",
      closeDetails
    );


    modal.addEventListener(
      "click",
      function(event) {

        if (event.target === modal) {
          closeDetails();
        }

      }
    );


    /* =========================================
       ESC KEY
    ========================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {
          closeDetails();
        }

      }
    );


    /* =========================================
       EVENTS
    ========================================= */

    searchInput.addEventListener(
      "input",
      filterSkills
    );

    levelSelect.addEventListener(
      "change",
      filterSkills
    );

    categorySelect.addEventListener(
      "change",
      filterSkills
    );

    sortSelect.addEventListener(
      "change",
      filterSkills
    );


    /* =========================================
       KEYBOARD SEARCH
    ========================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "/" &&
          document.activeElement.tagName !== "INPUT" &&
          document.activeElement.tagName !== "SELECT" &&
          !modal.classList.contains("active")
        ) {

          event.preventDefault();

          searchInput.focus();

        }

      }
    );


    /* =========================================
       RESET FILTERS
    ========================================= */

    function resetFilters() {

      searchInput.value = "";
      levelSelect.value = "all";
      categorySelect.value = "all";
      sortSelect.value = "popularity";

      filterSkills();

    }


    /* =========================================
       INITIAL LOAD
    ========================================= */

    renderSkills(
      [...communicationSkills].sort(
        (a, b) =>
          b.popularity -
          a.popularity
      )
    );

  </script>

</body>
</html>
