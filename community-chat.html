<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Community Chat | LetsStudy Pro</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#eef2f7;
  height:100vh;
  overflow:hidden;
  color:#172033;
}

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 14px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10;
}

.back{
  border:0;
  background:#f1f5f9;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  font-size:18px;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:bold;
}

.group-info{
  flex:1;
}

.group-info h1{
  font-size:16px;
}

.group-info p{
  color:#16a34a;
  font-size:11px;
  margin-top:3px;
}

.header-btn{
  border:0;
  background:#f1f5f9;
  padding:9px;
  border-radius:9px;
  cursor:pointer;
}

#messages{
  position:absolute;
  top:64px;
  bottom:72px;
  left:0;
  right:0;
  overflow-y:auto;
  padding:15px;
}

.message{
  display:flex;
  margin-bottom:10px;
  max-width:85%;
}

.message.mine{
  margin-left:auto;
  justify-content:flex-end;
}

.bubble{
  background:#fff;
  border-radius:14px;
  padding:9px 12px;
  box-shadow:0 1px 2px #0000000d;
}

.mine .bubble{
  background:#2563eb;
  color:#fff;
}

.sender{
  font-size:11px;
  font-weight:bold;
  margin-bottom:4px;
  color:#2563eb;
}

.mine .sender{
  color:#dbeafe;
}

.text{
  font-size:14px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
}

.time{
  font-size:9px;
  opacity:.65;
  text-align:right;
  margin-top:4px;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:40px 15px;
}

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #e5e7eb;
  padding:9px;
  display:flex;
  gap:7px;
  z-index:10;
}

.composer button{
  border:0;
  cursor:pointer;
}

.emoji{
  width:42px;
  border-radius:10px;
  background:#f1f5f9;
  font-size:19px;
}

#messageInput{
  flex:1;
  border:1px solid #dbe1e8;
  border-radius:12px;
  padding:10px 12px;
  outline:none;
  font-size:14px;
}

.send{
  width:48px;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:18px;
}

.typing{
  position:fixed;
  bottom:75px;
  left:15px;
  color:#64748b;
  font-size:11px;
  display:none;
}

.menu{
  position:fixed;
  top:58px;
  right:10px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:7px;
  box-shadow:0 8px 25px #0002;
  display:none;
  z-index:20;
}

.menu button{
  display:block;
  width:100%;
  border:0;
  background:#fff;
  text-align:left;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.menu button:hover{
  background:#f1f5f9;
}
</style></head><body><header><button class="back" onclick="history.back()">←</button>

<div class="avatar" id="groupAvatar">G</div><div class="group-info">
<h1 id="groupName">Loading...</h1>
<p id="onlineStatus">● Online</p>
</div><button class="header-btn" onclick="toggleMenu()">⋮</button>

</header><div id="menu" class="menu"><button onclick="viewGroup()">
👥 View Group
</button><button onclick="copyGroupLink()">
🔗 Copy Group Link
</button></div><main id="messages"><div class="empty" id="loading">
Loading messages...
</div></main><div class="typing" id="typing">
Someone is typing...
</div><div class="composer"><button class="emoji" onclick="addEmoji('😊')">
😊
</button><input
id="messageInput"
type="text"
placeholder="Type a message..."
autocomplete="off"

«»

<button class="send" onclick="sendMessage()">
➤
</button></div><script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
orderBy,
limit,
addDoc,
deleteDoc,
serverTimestamp,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ============================================
   FIREBASE
============================================ */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ============================================
   GROUP
============================================ */

const params =
new URLSearchParams(
location.search
);

const groupId =
params.get("group") ||
params.get("id") ||
localStorage.getItem(
"communityGroupId"
);


let currentUser = null;

let unsubscribeMessages = null;


/* ============================================
   AUTH
============================================ */

onAuthStateChanged(
auth,
async user => {

if(!user){

location.href =
"login.html";

return;

}

currentUser =
user;


if(!groupId){

document.getElementById(
"loading"
).textContent =
"Group not found.";

return;

}


await loadGroup();

listenMessages();

}
);


/* ============================================
   LOAD GROUP
============================================ */

async function loadGroup(){

try{

const snap =
await getDoc(
doc(
db,
"groups",
groupId
)
);


if(!snap.exists()){

document.getElementById(
"groupName"
).textContent =
"Unknown Group";

return;

}


const data =
snap.data();


const name =
data.name ||
"Study Group";


document.getElementById(
"groupName"
).textContent =
name;


document.getElementById(
"groupAvatar"
).textContent =
name
.charAt(0)
.toUpperCase();


}catch(error){

console.error(
"Group error:",
error
);

}

}


/* ============================================
   REAL-TIME MESSAGES
============================================ */

function listenMessages(){

const messagesRef =
collection(
db,
"groupMessages"
);


const q =
query(

messagesRef,

where(
"groupId",
"==",
groupId
),

orderBy(
"createdAt",
"asc"
),

limit(200)

);


unsubscribeMessages =
onSnapshot(
q,
snapshot => {

const container =
document.getElementById(
"messages"
);


container.innerHTML =
"";


if(snapshot.empty){

container.innerHTML = `

<div class="empty">

<h3>
No messages yet
</h3>

<p>
Start the conversation 👋
</p>

</div>

`;

return;

}


snapshot.docs.forEach(
messageDoc => {

renderMessage(
container,
messageDoc
);

});


scrollBottom();

},
error => {

console.error(
"Messages listener:",
error
);

document.getElementById(
"messages"
).innerHTML = `

<div class="empty">

Unable to load messages.

<br><br>

Check your Firestore rules.

</div>

`;

}

);

}


/* ============================================
   RENDER MESSAGE
============================================ */

function renderMessage(
container,
messageDoc
){

const data =
messageDoc.data();


const mine =
data.senderId ===
currentUser.uid;


const wrapper =
document.createElement(
"div"
);


wrapper.className =
"message" +
(
mine
? " mine"
: ""
);


const bubble =
document.createElement(
"div"
);


bubble.className =
"bubble";


const sender =
document.createElement(
"div"
);


sender.className =
"sender";


sender.textContent =
mine
? "You"
: (
data.senderName ||
"Member"
);


const text =
document.createElement(
"div"
);


text.className =
"text";


text.textContent =
data.text ||
"";


const time =
document.createElement(
"div"
);


time.className =
"time";


time.textContent =
formatTime(
data.createdAt
);


bubble.appendChild(
sender
);

bubble.appendChild(
text
);

bubble.appendChild(
time
);


if(mine){

bubble.title =
"Long press / right click to delete";


bubble.addEventListener(
"contextmenu",
event => {

event.preventDefault();

deleteMessage(
messageDoc.id
);

}
);

}


wrapper.appendChild(
bubble
);

container.appendChild(
wrapper
);

}


/* ============================================
   SEND
============================================ */

window.sendMessage =
async function(){

const input =
document.getElementById(
"messageInput"
);


const text =
input.value.trim();


if(!text)
return;


const button =
document.querySelector(
".send"
);


button.disabled =
true;


try{

await addDoc(
collection(
db,
"groupMessages"
),
{

groupId:

groupId,

senderId:

currentUser.uid,

senderName:

currentUser.displayName ||
currentUser.email ||
"Member",

text:

text,

createdAt:

serverTimestamp()

}
);


input.value =
"";


scrollBottom();


}catch(error){

console.error(
"Send message:",
error
);

alert(
"Unable to send message."
);

}finally{

button.disabled =
false;

input.focus();

}

};


/* ============================================
   ENTER TO SEND
============================================ */

document
.getElementById(
"messageInput"
)
.addEventListener(
"keydown",
event => {

if(
event.key ===
"Enter"
){

event.preventDefault();

sendMessage();

}

}
);


/* ============================================
   DELETE MESSAGE
============================================ */

async function deleteMessage(
messageId
){

if(
!confirm(
"Delete this message?"
)
)
return;


try{

await deleteDoc(
doc(
db,
"groupMessages",
messageId
)
);

}catch(error){

console.error(
"Delete message:",
error
);

alert(
"Unable to delete message."
);

}

}


/* ============================================
   EMOJI
============================================ */

window.addEmoji =
function(emoji){

const input =
document.getElementById(
"messageInput"
);


input.value +=
emoji;

input.focus();

};


/* ============================================
   MENU
============================================ */

window.toggleMenu =
function(){

const menu =
document.getElementById(
"menu"
);


menu.style.display =
menu.style.display ===
"block"
? "none"
: "block";

};


window.viewGroup =
function(){

location.href =
"community-group.html?id=" +
encodeURIComponent(
groupId
);

};


window.copyGroupLink =
async function(){

const url =
location.origin +
"/community-group.html?id=" +
encodeURIComponent(
groupId
);


try{

await navigator.clipboard.writeText(
url
);

alert(
"Group link copied."
);

}catch{

prompt(
"Copy group link:",
url
);

}

};


/* ============================================
   SCROLL
============================================ */

function scrollBottom(){

const container =
document.getElementById(
"messages"
);


setTimeout(
() => {

container.scrollTop =
container.scrollHeight;

},
100
);

}


/* ============================================
   TIME
============================================ */

function formatTime(
timestamp
){

if(!timestamp)
return "Sending...";


try{

const date =
timestamp.toDate
? timestamp.toDate()
: new Date(timestamp);


return date.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}


/* ============================================
   CLEANUP
============================================ */

window.addEventListener(
"beforeunload",
() => {

if(
unsubscribeMessages
){

unsubscribeMessages();

}

}
);

</script></body>
</html>
