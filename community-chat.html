<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Community Chat | LetsStudy Pro</title>
  <meta name="description" content="LetsStudy Pro Community Chat — connect, learn, discuss and collaborate with students and creators.">
  <meta name="theme-color" content="#0f172a">

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #0f172a;
      --muted: #64748b;
      --bubble: #f1f5f9;
      --danger: #ef4444;
      --success: #22c55e;
    }

    body.dark {
      --bg: #0b1120;
      --surface: #111827;
      --border: #1f2937;
      --text: #f8fafc;
      --muted: #94a3b8;
      --bubble: #1e293b;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    /* ================================
       APP
    ================================= */

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================================
       TOPBAR
    ================================= */

    .topbar {
      height: 64px;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 18px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      min-width: 220px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--primary);
      color: white;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .brand span {
      font-size: 17px;
    }

    .search {
      flex: 1;
      max-width: 620px;
      position: relative;
    }

    .search i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 15px 11px 42px;
      outline: none;
    }

    .search input:focus {
      border-color: var(--primary);
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      display: grid;
      place-items: center;
    }

    .icon-btn:hover {
      background: var(--bubble);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--primary);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    /* ================================
       MAIN
    ================================= */

    .main {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    /* ================================
       SIDEBAR
    ================================= */

    .sidebar {
      width: 330px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h2 {
      font-size: 20px;
    }

    .new-chat {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--primary);
      color: white;
    }

    .filters {
      padding: 0 14px 12px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .filter {
      padding: 7px 12px;
      border-radius: 20px;
      background: var(--bubble);
      color: var(--muted);
      white-space: nowrap;
    }

    .filter.active {
      background: var(--primary);
      color: white;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
    }

    .conversation {
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-left: 3px solid transparent;
    }

    .conversation:hover {
      background: var(--bubble);
    }

    .conversation.active {
      background: rgba(37, 99, 235, .08);
      border-left-color: var(--primary);
    }

    .conversation-info {
      flex: 1;
      min-width: 0;
    }

    .conversation-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .conversation-name {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-time {
      color: var(--muted);
      font-size: 11px;
    }

    .conversation-preview {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread {
      min-width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
    }

    /* ================================
       CHAT
    ================================= */

    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .chat-header {
      min-height: 70px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 12px 18px;
      gap: 12px;
    }

    .back-btn {
      display: none;
    }

    .chat-user {
      flex: 1;
    }

    .chat-user strong {
      display: block;
    }

    .online-status {
      font-size: 12px;
      color: var(--success);
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .date-divider {
      text-align: center;
      margin: 8px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 75%;
    }

    .message-row.me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: grid;
      place-items: center;
      font-size: 11px;
      flex-shrink: 0;
    }

    .message {
      padding: 10px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px 14px 14px 4px;
    }

    .message-row.me .message {
      background: var(--primary);
      color: white;
      border: 0;
      border-radius: 14px 14px 4px 14px;
    }

    .message-author {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .message-text {
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-meta {
      margin-top: 5px;
      font-size: 10px;
      opacity: .65;
      text-align: right;
    }

    /* ================================
       COMPOSER
    ================================= */

    .composer {
      padding: 12px 18px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 7px;
    }

    .composer textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      min-height: 42px;
      max-height: 130px;
      padding: 10px;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: var(--primary);
      color: white;
    }

    .attach-btn {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
    }

    /* ================================
       EMPTY STATE
    ================================= */

    .empty-chat {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
    }

    .empty-chat-icon {
      width: 74px;
      height: 74px;
      margin: auto auto 15px;
      border-radius: 22px;
      background: rgba(37, 99, 235, .1);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    .empty-chat h2 {
      margin-bottom: 8px;
    }

    .empty-chat p {
      color: var(--muted);
      max-width: 400px;
    }

    /* ================================
       TOAST
    ================================= */

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 13px 17px;
      border-radius: 10px;
      background: var(--text);
      color: var(--surface);
      opacity: 0;
      pointer-events: none;
      transform: translateY(15px);
      transition: .25s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ================================
       MOBILE
    ================================= */

    @media(max-width: 800px) {

      .brand {
        min-width: auto;
      }

      .brand span {
        display: none;
      }

      .search {
        display: none;
      }

      .sidebar {
        width: 100%;
      }

      .chat {
        display: none;
      }

      .mobile-chat-open .sidebar {
        display: none;
      }

      .mobile-chat-open .chat {
        display: flex;
      }

      .back-btn {
        display: grid;
      }

      .message-row {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================================
       TOPBAR
  ========================================== -->

  <header class="topbar">

    <div class="brand">
      <div class="brand-icon">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <span>LetsStudy Pro</span>
    </div>

    <div class="search">
      <i class="fa-solid fa-search"></i>
      <input
        id="searchInput"
        type="search"
        placeholder="Search conversations..."
        autocomplete="off"
      >
    </div>

    <div class="top-actions">

      <button
        class="icon-btn"
        id="themeBtn"
        title="Toggle theme"
      >
        <i class="fa-solid fa-moon"></i>
      </button>

      <button
        class="icon-btn"
        id="notificationBtn"
        title="Notifications"
      >
        <i class="fa-regular fa-bell"></i>
      </button>

      <div
        class="avatar"
        id="topAvatar"
      >
        LS
      </div>

    </div>

  </header>


  <!-- =========================================
       MAIN
  ========================================== -->

  <main class="main">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-header">

        <h2>Messages</h2>

        <button
          class="new-chat"
          id="newChatBtn"
          title="New conversation"
        >
          <i class="fa-solid fa-plus"></i>
        </button>

      </div>

      <div class="filters">

        <button
          class="filter active"
          data-filter="all"
        >
          All
        </button>

        <button
          class="filter"
          data-filter="direct"
        >
          Direct
        </button>

        <button
          class="filter"
          data-filter="groups"
        >
          Groups
        </button>

        <button
          class="filter"
          data-filter="unread"
        >
          Unread
        </button>

      </div>

      <div
        class="conversation-list"
        id="conversationList"
      >
      </div>

    </aside>


    <!-- CHAT -->

    <section class="chat">

      <header class="chat-header">

        <button
          class="icon-btn back-btn"
          id="backBtn"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div
          class="avatar"
          id="chatAvatar"
        >
          LS
        </div>

        <div class="chat-user">

          <strong id="chatName">
            LetsStudy Pro Community
          </strong>

          <span
            class="online-status"
            id="chatStatus"
          >
            Online
          </span>

        </div>

        <button
          class="icon-btn"
          id="chatSearchBtn"
          title="Search messages"
        >
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <button
          class="icon-btn"
          id="chatMoreBtn"
          title="More"
        >
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>

      </header>


      <div
        class="messages"
        id="messages"
      >

        <div class="empty-chat">

          <div>

            <div class="empty-chat-icon">
              <i class="fa-regular fa-comments"></i>
            </div>

            <h2>Welcome to Community Chat</h2>

            <p>
              Connect with learners, instructors and creators
              across the LetsStudy Pro ecosystem.
            </p>

          </div>

        </div>

      </div>


      <div class="composer">

        <div class="composer-inner">

          <button
            class="attach-btn"
            id="attachBtn"
            title="Attach file"
          >
            <i class="fa-solid fa-paperclip"></i>
          </button>

          <textarea
            id="messageInput"
            placeholder="Write a message..."
            rows="1"
          ></textarea>

          <button
            class="send-btn"
            id="sendBtn"
            title="Send message"
          >
            <i class="fa-solid fa-paper-plane"></i>
          </button>

        </div>

      </div>

    </section>

  </main>

</div>

<input
  type="file"
  id="fileInput"
  hidden
>

<div
  class="toast"
  id="toast"
></div>


<!-- =========================================
     FIREBASE
========================================== -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    orderBy,
    limit,
    onSnapshot,
    addDoc,
    updateDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================== */

  const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "YOUR_MESSAGING_SENDER_ID",

    appId:
      "YOUR_APP_ID"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================================
     STATE
  ========================================== */

  let currentUser = null;

  let activeConversationId = null;

  let unsubscribeMessages = null;

  let unsubscribeConversations = null;


  /* =========================================
     ELEMENTS
  ========================================== */

  const conversationList =
    document.getElementById(
      "conversationList"
    );

  const messages =
    document.getElementById(
      "messages"
    );

  const messageInput =
    document.getElementById(
      "messageInput"
    );

  const sendBtn =
    document.getElementById(
      "sendBtn"
    );

  const toast =
    document.getElementById(
      "toast"
    );


  /* =========================================
     TOAST
  ========================================== */

  function showToast(message){

    toast.textContent =
      message;

    toast.classList.add("show");

    setTimeout(()=>{
      toast.classList.remove("show");
    },3000);

  }


  /* =========================================
     AUTH
  ========================================== */

  onAuthStateChanged(
    auth,
    user => {

      if(!user){

        window.location.href =
          "login.html?redirect=" +
          encodeURIComponent(
            location.pathname +
            location.search
          );

        return;

      }

      currentUser =
        user;

      document
        .getElementById("topAvatar")
        .textContent =
        (
          user.displayName ||
          user.email ||
          "LS"
        )
        .charAt(0)
        .toUpperCase();

      loadConversations();

    }
  );


  /* =========================================
     LOAD CONVERSATIONS
  ========================================== */

  function loadConversations(){

    if(unsubscribeConversations){
      unsubscribeConversations();
    }

    const conversationsQuery =
      query(
        collection(
          db,
          "conversations"
        ),
        where(
          "memberIds",
          "array-contains",
          currentUser.uid
        ),
        orderBy(
          "updatedAt",
          "desc"
        ),
        limit(50)
      );

    unsubscribeConversations =
      onSnapshot(
        conversationsQuery,
        snapshot => {

          conversationList.innerHTML = "";

          if(snapshot.empty){

            conversationList.innerHTML = `
              <div style="
                padding:30px 20px;
                text-align:center;
                color:var(--muted);
              ">
                <i class="fa-regular fa-comments"
                   style="font-size:30px;margin-bottom:12px;">
                </i>

                <p>No conversations yet.</p>
              </div>
            `;

            return;

          }

          snapshot.forEach(
            conversation => {

              renderConversation(
                conversation.id,
                conversation.data()
              );

            }
          );

        },
        error => {

          console.error(
            error
          );

          showToast(
            "Unable to load conversations."
          );

        }
      );

  }


  /* =========================================
     RENDER CONVERSATION
  ========================================== */

  function renderConversation(
    id,
    data
  ){

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "conversation";

    if(
      id ===
      activeConversationId
    ){

      item.classList.add(
        "active"
      );

    }

    const name =
      data.name ||
      "Conversation";

    const lastMessage =
      data.lastMessage ||
      "No messages yet.";

    item.innerHTML = `

      <div class="avatar">
        ${(name.charAt(0) || "C").toUpperCase()}
      </div>

      <div class="conversation"
     data-conversation-id=""
     role="button"
     tabindex="0">

  <div class="avatar conversation-avatar">
    <span class="conversation-avatar-text">LS</span>
    <span class="online-dot"></span>
  </div>

  <div class="conversation-info">

    <div class="conversation-top">

      <span class="conversation-name">
        LetsStudy Pro Community
      </span>

      <span class="conversation-time">
        Now
      </span>

    </div>

    <div class="conversation-bottom">

      <span class="conversation-preview">
        Start a new conversation
      </span>

      <span class="unread" hidden>
        0
      </span>

    </div>

  </div>

</div>

</div>

</aside>


<!-- =========================================
     CHAT AREA
========================================== -->

<section class="chat">

  <header class="chat-header">

    <button
      type="button"
      class="icon-btn back-btn"
      id="backBtn"
      aria-label="Back to conversations"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div
      class="avatar"
      id="chatAvatar"
    >
      LS
    </div>

    <div class="chat-user">

      <strong id="chatName">
        LetsStudy Pro Community
      </strong>

      <span
        class="online-status"
        id="chatStatus"
      >
        Online
      </span>

    </div>

    <button
      type="button"
      class="icon-btn"
      id="chatSearchBtn"
      title="Search messages"
      aria-label="Search messages"
    >
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>

    <button
      type="button"
      class="icon-btn"
      id="chatMoreBtn"
      title="More options"
      aria-label="More options"
    >
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </button>

  </header>


  <!-- =======================================
       MESSAGES
  ======================================== -->

  <div
    class="messages"
    id="messages"
    aria-live="polite"
  >

    <div class="empty-chat">

      <div>

        <div class="empty-chat-icon">
          <i class="fa-regular fa-comments"></i>
        </div>

        <h2>
          Welcome to Community Chat
        </h2>

        <p>
          Connect with learners, instructors
          and creators across the LetsStudy Pro
          ecosystem.
        </p>

      </div>

    </div>

  </div>


  <!-- =======================================
       TYPING INDICATOR
  ======================================== -->

  <div
    id="typingIndicator"
    class="typing-indicator"
    hidden
  >
    <span></span>
    <span></span>
    <span></span>
    <em>Someone is typing...</em>
  </div>


  <!-- =======================================
       COMPOSER
  ======================================== -->

  <div class="composer">

    <div
      class="reply-preview"
      id="replyPreview"
      hidden
    >

      <div class="reply-icon">
        <i class="fa-solid fa-reply"></i>
      </div>

      <div class="reply-content">

        <strong>
          Replying to
        </strong>

        <span id="replyText">
          Message
        </span>

      </div>

      <button
        type="button"
        class="icon-btn"
        id="cancelReplyBtn"
        aria-label="Cancel reply"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>


    <div class="composer-inner">

      <button
        type="button"
        class="attach-btn"
        id="attachBtn"
        title="Attach file"
        aria-label="Attach file"
      >
        <i class="fa-solid fa-paperclip"></i>
      </button>

      <button
        type="button"
        class="attach-btn"
        id="emojiBtn"
        title="Emoji"
        aria-label="Emoji"
      >
        <i class="fa-regular fa-face-smile"></i>
      </button>

      <textarea
        id="messageInput"
        rows="1"
        maxlength="5000"
        placeholder="Write a message..."
        autocomplete="off"
      ></textarea>

      <button
        type="button"
        class="send-btn"
        id="sendBtn"
        title="Send message"
        aria-label="Send message"
      >
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </div>

    <div class="composer-hint">
      Press <strong>Enter</strong> to send ·
      <strong>Shift + Enter</strong> for a new line
    </div>

  </div>

</section>

</main>

</div>


<!-- =========================================
     FILE INPUT
========================================== -->

<input
  type="file"
  id="fileInput"
  hidden
  accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.txt,.zip"
>


<!-- =========================================
     TOAST
========================================== -->

<div
  class="toast"
  id="toast"
  role="status"
  aria-live="polite"
></div>


<!-- =========================================
     FIREBASE
========================================== -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    orderBy,
    limit,
    onSnapshot,
    addDoc,
    updateDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================== */

  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

  const app =
    initializeApp(
      firebaseConfig
    );

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================================
     STATE
  ========================================== */

  let currentUser = null;

  let activeConversationId = null;

  let unsubscribeMessages = null;

  let unsubscribeConversations = null;

  let replyToMessage = null;


  /* =========================================
     ELEMENTS
  ========================================== */

  const conversationList =
    document.getElementById(
      "conversationList"
    );

  const messages =
    document.getElementById(
      "messages"
    );

  const messageInput =
    document.getElementById(
      "messageInput"
    );

  const sendBtn =
    document.getElementById(
      "sendBtn"
    );

  const toast =
    document.getElementById(
      "toast"
    );

  const fileInput =
    document.getElementById(
      "fileInput"
    );


  /* =========================================
     TOAST
  ========================================== */

  function showToast(
    message
  ){

    toast.textContent =
      message;

    toast.classList.add(
      "show"
    );

    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3000
    );

  }


  /* =========================================
     AUTH
  ========================================== */

  onAuthStateChanged(
    auth,
    user => {

      if(!user){

        location.href =
          "login.html?redirect=" +
          encodeURIComponent(
            location.pathname +
            location.search
          );

        return;

      }

      currentUser =
        user;

      const name =
        user.displayName ||
        user.email ||
        "User";

      const topAvatar =
        document.getElementById(
          "topAvatar"
        );

      if(topAvatar){

        topAvatar.textContent =
          name
            .charAt(0)
            .toUpperCase();

      }

      loadConversations();

    }
  );


  /* =========================================
     LOAD CONVERSATIONS
  ========================================== */

  function loadConversations(){

    if(
      unsubscribeConversations
    ){

      unsubscribeConversations();

    }

    const conversationsQuery =
      query(

        collection(
          db,
          "conversations"
        ),

        where(
          "memberIds",
          "array-contains",
          currentUser.uid
        ),

        orderBy(
          "updatedAt",
          "desc"
        ),

        limit(50)

      );


    unsubscribeConversations =
      onSnapshot(

        conversationsQuery,

        snapshot => {

          conversationList.innerHTML =
            "";

          if(
            snapshot.empty
          ){

            conversationList.innerHTML = `

              <div style="
                padding:40px 20px;
                text-align:center;
                color:var(--muted);
              ">

                <i
                  class="fa-regular fa-comments"
                  style="
                    font-size:32px;
                    margin-bottom:14px;
                  "
                ></i>

                <p>
                  No conversations yet.
                </p>

              </div>

            `;

            return;

          }


          snapshot.forEach(
            conversation => {

              renderConversation(
                conversation.id,
                conversation.data()
              );

            }
          );

        },

        error => {

          console.error(
            "Conversation error:",
            error
          );

          showToast(
            "Unable to load conversations."
          );

        }

      );

  }


  /* =========================================
     RENDER CONVERSATION
  ========================================== */

  function renderConversation(
    id,
    data
  ){

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "conversation";

    if(
      id ===
      activeConversationId
    ){

      item.classList.add(
        "active"
      );

    }


    const name =
      data.name ||
      "Conversation";


    const lastMessage =
      data.lastMessage ||
      "No messages yet.";


    item.innerHTML = `

      <div class="avatar conversation-avatar">

        ${escapeHtml(
          name
            .charAt(0)
            .toUpperCase()
        )}

      </div>

      <div class="conversation-info">

        <div class="conversation-top">

          <span class="conversation-name">

            ${escapeHtml(
              name
            )}

          </span>

          <span class="conversation-time">

            ${formatTime(
              data.updatedAt
            )}

          </span>

        </div>

        <div class="conversation-bottom">

          <span class="conversation-preview">

            ${escapeHtml(
              lastMessage
            )}

          </span>

        </div>

      </div>

    `;


    item.addEventListener(
      "click",
      () => {

        openConversation(
          id,
          data
        );

      }
    );


    item.addEventListener(
      "keydown",
      event => {

        if(
          event.key ===
          "Enter"
        ){

          openConversation(
            id,
            data
          );

        }

      }
    );


    conversationList.appendChild(
      item
    );

  }


  /* =========================================
     OPEN CONVERSATION
  ========================================== */

  function openConversation(
    conversationId,
    data
  ){

    activeConversationId =
      conversationId;

    document.body.classList.add(
      "mobile-chat-open"
    );


    const chatName =
      document.getElementById(
        "chatName"
      );

    const chatAvatar =
      document.getElementById(
        "chatAvatar"
      );


    if(chatName){

      chatName.textContent =
        data.name ||
        "Conversation";

    }


    if(chatAvatar){

      chatAvatar.textContent =
        (
          data.name ||
          "C"
        )
        .charAt(0)
        .toUpperCase();

    }


    loadMessages(
      conversationId
    );

  }


  /* =========================================
     LOAD MESSAGES
  ========================================== */

  function loadMessages(
    conversationId
  ){

    if(
      unsubscribeMessages
    ){

      unsubscribeMessages();

    }


    const messagesQuery =
      query(

        collection(
          db,
          "messages"
        ),

        where(
          "conversationId",
          "==",
          conversationId
        ),

        orderBy(
          "createdAt",
          "asc"
        ),

        limit(200)

      );


    unsubscribeMessages =
      onSnapshot(

        messagesQuery,

        snapshot => {

          messages.innerHTML =
            "";

          if(
            snapshot.empty
          ){

            messages.innerHTML = `

              <div class="empty-chat">

                <div>

                  <div class="empty-chat-icon">

                    <i class="
                      fa-regular
                      fa-comments
                    "></i>

                  </div>

                  <h2>
                    Start the conversation
                  </h2>

                  <p>
                    Send the first message
                    to this conversation.
                  </p>

                </div>

              </div>

            `;

            return;

          }


          snapshot.forEach(
            message => {

              renderMessage(
                message.id,
                message.data()
              );

            }
          );


          messages.scrollTop =
            messages.scrollHeight;

        },

        error => {

          console.error(
            "Messages error:",
            error
          );

          showToast(
            "Unable to load messages."
          );

        }

      );

  }


  /* =========================================
     RENDER MESSAGE
  ========================================== */

  function renderMessage(
    messageId,
    data
  ){

    const mine =
      data.senderId ===
      currentUser.uid;


    const row =
      document.createElement(
        "div"
      );

    row.className =
      "message-row" +
      (
        mine
          ? " me"
          : ""
      );


    const senderName =
      data.senderName ||
      "User";


    row.innerHTML = `

      <div class="message-avatar">

        ${escapeHtml(
          senderName
            .charAt(0)
            .toUpperCase()
        )}

      </div>


      <div class="message">

        ${
          !mine
            ? `

              <div class="message-author">

                ${escapeHtml(
                  senderName
                )}

              </div>

            `
            : ""
        }


        <div class="message-text">

          ${escapeHtml(
            data.text ||
            ""
          )}

        </div>


        <div class="message-meta">

          ${formatTime(
            data.createdAt
          )}

        </div>

      </div>

    `;


    messages.appendChild(
      row
    );

  }


  /* =========================================
     SEND MESSAGE
  ========================================== */

  async function sendMessage(){

    const text =
      messageInput.value.trim();


    if(!text){

      return;

    }


    if(
      !activeConversationId
    ){

      showToast(
        "Select a conversation first."
      );

      return;

    }


    sendBtn.disabled =
      true;


    try{

      await addDoc(

        collection(
          db,
          "messages"
        ),

        {

          conversationId:
            activeConversationId,

          senderId:
            currentUser.uid,

          senderName:
            currentUser.displayName ||
            currentUser.email ||
            "User",

          text:
            text,

          replyTo:
            replyToMessage
              ? replyToMessage.id
              : null,

          createdAt:
            serverTimestamp()

        }

      );


      await updateDoc(

        doc(
          db,
          "conversations",
          activeConversationId
        ),

        {

          lastMessage:
            text,

          updatedAt:
            serverTimestamp()

        }

      );


      messageInput.value =
        "";

      messageInput.style.height =
        "auto";


      cancelReply();

    }

    catch(error){

      console.error(
        error
      );

      showToast(
        "Message could not be sent."
      );

    }

    finally{

      sendBtn.disabled =
        false;

    }

  }


  /* =========================================
     SEND EVENTS
  ========================================== */

  sendBtn.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


  messageInput.addEventListener(
    "input",
    () => {

      messageInput.style.height =
        "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          130
        ) + "px";

    }
  );


  /* =========================================
     ATTACHMENT
  ========================================== */

  document
    .getElementById(
      "attachBtn"
    )
    .addEventListener(
      "click",
      () => {

        fileInput.click();

      }
    );


  fileInput.addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];

      if(!file){

        return;

      }

      showToast(
        "Selected: " +
        file.name
      );

    }
  );


  /* =========================================
     REPLY
  ========================================== */

  function cancelReply(){

    replyToMessage =
      null;

    const preview =
      document.getElementById(
        "replyPreview"
      );

    if(preview){

      preview.hidden =
        true;

    }

  }


  const cancelReplyBtn =
    document.getElementById(
      "cancelReplyBtn"
    );


  if(cancelReplyBtn){

    cancelReplyBtn.addEventListener(
      "click",
      cancelReply
    );

  }


  /* =========================================
     BACK
  ========================================== */

  document
    .getElementById(
      "backBtn"
    )
    .addEventListener(
      "click",
      () => {

        document.body.classList.remove(
          "mobile-chat-open"
        );

      }
    );


  /* =========================================
     THEME
  ========================================== */

  document
    .getElementById(
      "themeBtn"
    )
    .addEventListener(
      "click",
      () => {

        document.body.classList.toggle(
          "dark"
        );


        const icon =
          document.querySelector(
            "#themeBtn i"
          );


        if(icon){

          icon.className =
            document.body.classList.contains(
              "dark"
            )
              ? "fa-solid fa-sun"
              : "fa-solid fa-moon";

        }

      }
    );


  /* =========================================
     SEARCH CONVERSATIONS
  ========================================== */

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      event => {

        const term =
          event.target.value
            .toLowerCase()
            .trim();


        document
          .querySelectorAll(
            ".conversation"
          )
          .forEach(
            item => {

                  item.style.display =
  item.textContent
    .toLowerCase()
    .includes(term)
      ? "flex"
      : "none";

            }
          );

      }
    );


  /* =========================================
     NEW CHAT
  ========================================== */

  const newChatBtn =
    document.getElementById(
      "newChatBtn"
    );

  if(newChatBtn){

    newChatBtn.addEventListener(
      "click",
      () => {

        showToast(
          "New conversation is ready."
        );

      }
    );

  }


  /* =========================================
     NOTIFICATIONS
  ========================================== */

  const notificationBtn =
    document.getElementById(
      "notificationBtn"
    );

  if(notificationBtn){

    notificationBtn.addEventListener(
      "click",
      () => {

        showToast(
          "Notifications are currently available in the community system."
        );

      }
    );

  }


  /* =========================================
     CHAT SEARCH
  ========================================== */

  const chatSearchBtn =
    document.getElementById(
      "chatSearchBtn"
    );

  if(chatSearchBtn){

    chatSearchBtn.addEventListener(
      "click",
      () => {

        const searchInput =
          document.getElementById(
            "searchInput"
          );

        if(searchInput){

          searchInput.focus();

        }

      }
    );

  }


  /* =========================================
     CHAT MORE MENU
  ========================================== */

  const chatMoreBtn =
    document.getElementById(
      "chatMoreBtn"
    );

  if(chatMoreBtn){

    chatMoreBtn.addEventListener(
      "click",
      () => {

        showToast(
          "Conversation options."
        );

      }
    );

  }


  /* =========================================
     EMOJI BUTTON
  ========================================== */

  const emojiBtn =
    document.getElementById(
      "emojiBtn"
    );

  if(emojiBtn){

    emojiBtn.addEventListener(
      "click",
      () => {

        const emojis = [
          "😀",
          "😂",
          "😍",
          "🔥",
          "👍",
          "❤️",
          "🎉",
          "👏",
          "🙏",
          "💡"
        ];

        const emoji =
          emojis[
            Math.floor(
              Math.random() *
              emojis.length
            )
          ];

        messageInput.value +=
          emoji;

        messageInput.focus();

        messageInput.dispatchEvent(
          new Event("input")
        );

      }
    );

  }


  /* =========================================
     MOBILE BACK BUTTON
  ========================================== */

  const backBtn =
    document.getElementById(
      "backBtn"
    );

  if(backBtn){

    backBtn.addEventListener(
      "click",
      () => {

        document.body.classList.remove(
          "mobile-chat-open"
        );

      }
    );

  }


  /* =========================================
     GLOBAL ESCAPE KEY
  ========================================== */

  document.addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Escape"
      ){

        document.body.classList.remove(
          "mobile-chat-open"
        );

        cancelReply();

      }

    }
  );


  /* =========================================
     WINDOW CLEANUP
  ========================================== */

  window.addEventListener(
    "beforeunload",
    () => {

      if(
        unsubscribeMessages
      ){

        unsubscribeMessages();

      }

      if(
        unsubscribeConversations
      ){

        unsubscribeConversations();

      }

    }
  );


  /* =========================================
     PAGE READY
  ========================================== */

  console.log(
    "LetsStudy Pro Community Chat initialized."
  );

</script>
