<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Community Chat | LetsStudy Pro</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a;
height:100vh;
overflow:hidden
}

a{
text-decoration:none;
color:inherit
}

header{
height:62px;
background:#fff;
border-bottom:1px solid #e2e8f0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 17px;
gap:10px;
position:relative;
z-index:10
}

.logo{
font-size:18px;
font-weight:900;
color:#2563eb
}

nav{
display:flex;
gap:6px;
flex-wrap:wrap
}

nav a{
font-size:9px;
font-weight:900;
background:#f1f5f9;
padding:8px 9px;
border-radius:8px
}

.app{
height:calc(100vh - 62px);
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:250px 1fr;
background:#fff
}

.sidebar{
border-right:1px solid #e2e8f0;
padding:15px;
overflow-y:auto
}

.side-title{
font-size:11px;
font-weight:900;
margin-bottom:12px
}

.side-link{
display:block;
padding:10px;
border-radius:9px;
font-size:9px;
font-weight:900;
background:#f8fafc;
margin-bottom:7px
}

.side-link:hover{
background:#eff6ff
}

.group-info{
background:#eff6ff;
border:1px solid #bfdbfe;
border-radius:12px;
padding:12px;
margin-bottom:15px
}

.group-name{
font-size:11px;
font-weight:900;
color:#1d4ed8
}

.group-description{
font-size:8px;
line-height:1.6;
color:#64748b;
margin-top:5px
}

.chat{
display:flex;
flex-direction:column;
min-width:0;
height:100%
}

.chat-header{
height:64px;
border-bottom:1px solid #e2e8f0;
display:flex;
align-items:center;
padding:0 15px;
justify-content:space-between;
gap:10px
}

.chat-title{
font-size:12px;
font-weight:900
}

.chat-status{
font-size:8px;
color:#64748b;
margin-top:3px
}

.messages{
flex:1;
overflow-y:auto;
padding:18px;
background:#f8fafc;
scroll-behavior:smooth
}

.message{
display:flex;
margin-bottom:12px
}

.message.mine{
justify-content:flex-end
}

.bubble{
max-width:min(75%,600px);
padding:10px 12px;
border-radius:13px;
background:#fff;
border:1px solid #e2e8f0
}

.mine .bubble{
background:#2563eb;
color:#fff;
border-color:#2563eb
}

.sender{
font-size:8px;
font-weight:900;
color:#2563eb;
margin-bottom:4px
}

.mine .sender{
color:#dbeafe
}

.text{
font-size:10px;
line-height:1.6;
white-space:pre-wrap;
word-break:break-word
}

.time{
font-size:7px;
color:#94a3b8;
margin-top:5px;
text-align:right
}

.mine .time{
color:#dbeafe
}

.empty{
height:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:10px;
color:#64748b
}

.composer{
padding:11px;
background:#fff;
border-top:1px solid #e2e8f0;
display:flex;
gap:8px
}

textarea{
flex:1;
resize:none;
height:42px;
border:1px solid #cbd5e1;
border-radius:10px;
padding:11px;
font-size:10px;
outline:none
}

textarea:focus{
border-color:#2563eb
}

.send{
border:0;
background:#2563eb;
color:#fff;
padding:0 16px;
border-radius:10px;
font-size:9px;
font-weight:900;
cursor:pointer
}

.send:disabled{
opacity:.5;
cursor:not-allowed
}

.notice{
padding:9px 14px;
background:#fffbeb;
border-bottom:1px solid #fde68a;
font-size:8px;
color:#92400e;
display:none
}

@media(max-width:750px){

body{
overflow:auto
}

header{
height:auto;
min-height:62px;
padding:10px;
flex-direction:column;
align-items:flex-start
}

nav{
width:100%
}

nav a{
flex:1;
text-align:center
}

.app{
height:calc(100vh - 108px);
grid-template-columns:1fr
}

.sidebar{
display:none
}

.bubble{
max-width:85%
}

}

</style>

</head>


<body>


<header>

<a
href="community.html"
class="logo">

LetsStudy Pro

</a>


<nav>

<a href="community.html">
Community
</a>

<a href="groups.html">
Groups
</a>

<a id="groupTop" href="#">
Group
</a>

<a id="privateTop" href="#">
Private Chat
</a>

</nav>

</header>


<div class="app">


<aside class="sidebar">


<div class="side-title">
Community
</div>


<a
href="community.html"
class="side-link">

🌐 Community Home

</a>


<a
href="groups.html"
class="side-link">

👥 Groups

</a>


<a
id="groupSide"
href="#"
class="side-link">

📚 Current Group

</a>


<a
id="privateSide"
href="#"
class="side-link">

💬 Private Chat

</a>


<div
id="groupInfo"
class="group-info"
style="display:none">

<div
id="groupName"
class="group-name">

Study Group

</div>

<div
id="groupDescription"
class="group-description">

Group chat

</div>

</div>


<div
style="
font-size:8px;
line-height:1.6;
color:#94a3b8">

Community Chat is for learning,
discussion and collaboration.

</div>

</aside>


<section class="chat">


<div class="chat-header">

<div>

<div class="chat-title">
💬 Community Chat
</div>

<div
id="status"
class="chat-status">

Connecting...

</div>

</div>


<a
href="community.html"
style="
font-size:9px;
font-weight:900">

← Back

</a>

</div>


<div
id="notice"
class="notice">
</div>


<div
id="messages"
class="messages">

<div class="empty">

Loading community chat...

</div>

</div>


<form
id="composer"
class="composer">

<textarea
id="messageInput"
maxlength="2000"
placeholder="Write a message..."
required></textarea>


<button
id="sendButton"
class="send"
type="submit">

Send

</button>

</form>


</section>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp,
doc,
getDoc,
limit
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const messages=
document.getElementById("messages");

const input=
document.getElementById("messageInput");

const send=
document.getElementById("sendButton");

const status=
document.getElementById("status");

const notice=
document.getElementById("notice");

const groupInfo=
document.getElementById("groupInfo");

const groupName=
document.getElementById("groupName");

const groupDescription=
document.getElementById("groupDescription");

const groupTop=
document.getElementById("groupTop");

const groupSide=
document.getElementById("groupSide");

const privateTop=
document.getElementById("privateTop");

const privateSide=
document.getElementById("privateSide");


let currentUser=null;
let groupId=null;
let group=null;
let unsubscribe=null;


/* =========================================
URL
========================================= */

const params=
new URLSearchParams(
location.search
);

groupId=
params.get("groupId")||
params.get("group");


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);


/* =========================================
LOAD GROUP
========================================= */

async function loadGroup(){

try{

const snap=
await getDoc(
doc(
db,
"groups",
groupId
)
);


if(!snap.exists()){

showNotice(
"Group not found. Showing general community chat."
);

groupId=null;

return;

}


group={
id:snap.id,
...snap.data()
};


groupInfo.style.display=
"block";


groupName.textContent=
group.name||
group.title||
"Study Group";


groupDescription.textContent=
group.description||
"Community study group";


const groupURL=
"community-group.html?id="+
encodeURIComponent(groupId);


groupTop.href=
groupURL;

groupSide.href=
groupURL;


}catch(error){

console.error(
"Group error:",
error
);

showNotice(
"Unable to load group information."
);

}

}


/* =========================================
START CHAT
========================================= */

function startChat(){

status.textContent=
groupId
?
"Group discussion"
:
"Community discussion";


const messagesPath=
groupId
?
[
"groups",
groupId,
"messages"
]
:
[
"communityMessages"
];


const messagesRef=
collection(
db,
...messagesPath
);


const q=
query(
messagesRef,
orderBy(
"createdAt",
"asc"
),
limit(100)
);


unsubscribe=
onSnapshot(
q,
snapshot=>{

messages.innerHTML="";


if(snapshot.empty){

messages.innerHTML=`

<div class="empty">

<div>

💬<br><br>

No messages yet.<br>

Start the discussion.

</div>

</div>

`;

return;

}


snapshot.forEach(
messageDoc=>{

renderMessage(
messageDoc.id,
messageDoc.data()
);

});


scrollBottom();

},
error=>{

console.error(
"Chat listener:",
error
);

messages.innerHTML=`

<div class="empty">

Unable to load chat.<br><br>

Please check your connection
or Firebase permissions.

</div>

`;

status.textContent=
"Chat unavailable";

});


}


/* =========================================
SEND MESSAGE
========================================= */

document
.getElementById("composer")
.addEventListener(
"submit",
async event=>{

event.preventDefault();


const text=
input.value.trim();


if(!text)
return;


if(!currentUser)
return;


send.disabled=true;

send.textContent=
"Sending...";


try{

const userName=
currentUser.displayName||
currentUser.email?.split("@")[0]||
"Member";


const messageData={

text:text,

uid:currentUser.uid,

userId:currentUser.uid,

senderId:currentUser.uid,

senderName:userName,

authorName:userName,

senderPhoto:
currentUser.photoURL||
"",

createdAt:
serverTimestamp()

};


if(groupId){

messageData.groupId=
groupId;

await addDoc(
collection(
db,
"groups",
groupId,
"messages"
),
messageData
);

}else{

await addDoc(
collection(
db,
"communityMessages"
),
messageData
);

}


input.value="";


}catch(error){

console.error(
"Send message:",
error
);

showNotice(
"Unable to send message. Please try again."
);

}finally{

send.disabled=false;

send.textContent=
"Send";

input.focus();

}

});


/* =========================================
RENDER MESSAGE
========================================= */

function renderMessage(
id,
data
){

const mine=
data.uid===currentUser.uid||
data.userId===currentUser.uid||
data.senderId===currentUser.uid;


const wrapper=
document.createElement("div");

wrapper.className=
"message"+
(
mine
?
" mine"
:
""
);


const bubble=
document.createElement("div");

bubble.className=
"bubble";


const sender=
document.createElement("div");

sender.className=
"sender";

sender.textContent=
mine
?
"You"
:
data.senderName||
data.authorName||
"Member";


const text=
document.createElement("div");

text.className=
"text";

text.textContent=
data.text||
data.message||
"";


const time=
document.createElement("div");

time.className=
"time";

time.textContent=
formatTime(
data.createdAt
);


bubble.appendChild(
sender
);

bubble.appendChild(
text
);

bubble.appendChild(
time
);

wrapper.appendChild(
bubble
);

messages.appendChild(
wrapper
);

}


/* =========================================
PRIVATE CHAT
========================================= */

function setPrivateChat(
userId
){

if(!userId)
return;

const url=
"private-chat.html?userId="+
encodeURIComponent(userId);

privateTop.href=url;
privateSide.href=url;

}


/*
For general community chat there is no
single recipient. The private chat links
will become active when a user/profile
passes a userId.
*/

privateTop.addEventListener(
"click",
event=>{

if(
privateTop.getAttribute("href")==="#"
){

event.preventDefault();

showNotice(
"Open a member profile to start a private chat."
);

}

});


privateSide.addEventListener(
"click",
event=>{

if(
privateSide.getAttribute("href")==="#"
){

event.preventDefault();

showNotice(
"Open a member profile to start a private chat."
);

}

});


/* =========================================
NOTICE
========================================= */

function showNotice(text){

notice.textContent=
text;

notice.style.display=
"block";

setTimeout(
()=>{

notice.style.display=
"none";

},
4000
);

}


/* =========================================
SCROLL
========================================= */

function scrollBottom(){

requestAnimationFrame(
()=>{

messages.scrollTop=
messages.scrollHeight;

});

}


/* =========================================
TIME
========================================= */

function getTime(value){

if(!value)
return 0;

if(
typeof value.toMillis==="function"
){

return value.toMillis();

}

if(value.seconds){

return value.seconds*1000;

}

const time=
new Date(value).getTime();

return Number.isNaN(time)
?0
:time;

}


function formatTime(value){

const time=
getTime(value);

if(!time)
return "Sending...";

return new Intl.DateTimeFormat(
undefined,
{
hour:"2-digit",
minute:"2-digit"
}
).format(
new Date(time)
);

}


/* =========================================
CLEANUP
========================================= */

window.addEventListener(
"beforeunload",
()=>{

if(unsubscribe)
unsubscribe();

});


/* =========================================
ENTER TO SEND
========================================= */

input.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

document
.getElementById("composer")
.requestSubmit();

}

});

</script>

</body>
</html>
