<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Study Group | LetsStudy Pro</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a
}

a{
text-decoration:none;
color:inherit
}

button,input,textarea,select{
font:inherit
}

header{
position:sticky;
top:0;
z-index:50;
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:13px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb
}

nav{
display:flex;
gap:7px;
flex-wrap:wrap
}

nav a{
font-size:9px;
font-weight:900;
background:#f1f5f9;
padding:8px 10px;
border-radius:8px
}

.container{
max-width:1100px;
margin:auto;
padding:20px 15px
}

.hero{
background:linear-gradient(
135deg,
#2563eb,
#4f46e5
);
color:#fff;
border-radius:20px;
padding:27px;
margin-bottom:16px
}

.hero small{
font-size:8px;
font-weight:900;
letter-spacing:1px
}

.hero h1{
font-size:27px;
margin:8px 0
}

.hero p{
font-size:11px;
line-height:1.7;
max-width:720px;
opacity:.93
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:16px
}

.btn{
border:0;
cursor:pointer;
padding:10px 13px;
border-radius:9px;
font-size:9px;
font-weight:900;
display:inline-flex;
align-items:center;
justify-content:center
}

.primary{
background:#2563eb;
color:#fff
}

.white{
background:#fff;
color:#2563eb
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.danger{
background:#fee2e2;
color:#991b1b
}

.layout{
display:grid;
grid-template-columns:1fr 300px;
gap:16px
}

.panel{
background:#fff;
border:1px solid #e2e8f0;
border-radius:16px;
padding:15px;
margin-bottom:14px
}

.title{
font-size:13px;
font-weight:900;
margin-bottom:12px
}

.post{
border:1px solid #e2e8f0;
border-radius:13px;
padding:14px;
margin-bottom:10px
}

.post-title{
font-size:13px;
font-weight:900;
margin-bottom:6px
}

.post-body{
font-size:10px;
line-height:1.7;
color:#64748b
}

.post-meta{
font-size:8px;
color:#94a3b8;
margin-top:9px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:14px
}

.stat{
background:#f8fafc;
border-radius:10px;
padding:12px;
text-align:center
}

.stat strong{
display:block;
font-size:17px;
color:#2563eb
}

.stat span{
font-size:7px;
color:#64748b
}

.list{
display:flex;
flex-direction:column;
gap:8px
}

.list a{
background:#f8fafc;
padding:10px;
border-radius:9px;
font-size:9px;
font-weight:900
}

.member{
display:flex;
align-items:center;
gap:8px;
padding:8px 0;
border-bottom:1px solid #f1f5f9
}

.avatar{
width:35px;
height:35px;
border-radius:50%;
background:#dbeafe;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:900;
overflow:hidden
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.member-name{
font-size:9px;
font-weight:900
}

.member-role{
font-size:7px;
color:#64748b;
margin-top:2px
}

.loading,
.empty{
text-align:center;
padding:35px 15px;
font-size:10px;
color:#64748b
}

.message{
display:none;
padding:11px;
border-radius:9px;
font-size:10px;
font-weight:900;
margin-bottom:12px
}

.message.success{
display:block;
background:#dcfce7;
color:#166534
}

.message.error{
display:block;
background:#fee2e2;
color:#991b1b
}

footer{
text-align:center;
padding:30px;
font-size:10px;
color:#64748b
}

@media(max-width:800px){

.layout{
grid-template-columns:1fr
}

}

@media(max-width:550px){

header{
flex-direction:column;
align-items:flex-start
}

nav{
width:100%
}

nav a{
flex:1;
text-align:center
}

.hero h1{
font-size:23px
}

.stats{
grid-template-columns:1fr 1fr
}

}

</style>

</head>


<body>


<header>

<a
href="groups.html"
class="logo">

LetsStudy Pro

</a>


<nav>

<a href="groups.html">
Groups
</a>

<a href="community.html">
Community
</a>

<a href="community-chat.html">
Chat
</a>

<a href="dashboard.html">
Dashboard
</a>

</nav>

</header>


<main class="container">


<div
id="message"
class="message">
</div>


<section
id="groupHero"
class="hero">

<div class="loading">

Loading group...

</div>

</section>


<div class="layout">


<section>


<div class="stats">

<div class="stat">

<strong id="postCount">
0
</strong>

<span>Posts</span>

</div>


<div class="stat">

<strong id="memberCount">
0
</strong>

<span>Members</span>

</div>


<div class="stat">

<strong id="status">
—</strong>

<span>Your Status</span>

</div>

</div>


<div class="panel">

<div class="title">

Recent Posts

</div>


<div
id="posts">

<div class="loading">

Loading posts...

</div>

</div>

</div>

</section>


<aside>


<div class="panel">

<div class="title">
Group Actions
</div>


<div class="list">

<a
id="membersLink"
href="#">

👥 Group Members

</a>


<a
id="settingsLink"
href="#">

⚙️ Group Settings

</a>


<a
id="chatLink"
href="#">

💬 Community Chat

</a>


<a
id="createLink"
href="#">

✏️ Create Post

</a>


<a
href="groups.html">

← All Groups

</a>

</div>

</div>


<div class="panel">

<div class="title">
Members
</div>


<div id="members">

<div class="loading">

Loading...

</div>

</div>


<a
id="allMembersLink"
class="btn secondary"
style="width:100%;margin-top:10px"
href="#">

View All Members

</a>

</div>


</aside>


</div>

</main>


<footer>

© <span id="year"></span> LetsStudy Pro

</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
getDocs,
orderBy,
limit
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const hero=
document.getElementById("groupHero");

const posts=
document.getElementById("posts");

const members=
document.getElementById("members");

const message=
document.getElementById("message");

const postCount=
document.getElementById("postCount");

const memberCount=
document.getElementById("memberCount");

const status=
document.getElementById("status");

const membersLink=
document.getElementById("membersLink");

const settingsLink=
document.getElementById("settingsLink");

const chatLink=
document.getElementById("chatLink");

const createLink=
document.getElementById("createLink");

const allMembersLink=
document.getElementById("allMembersLink");


let currentUser=null;
let groupId=null;
let group=null;
let groupPosts=[];
let groupMembers=[];


/* =========================================
GROUP ID
========================================= */

const params=
new URLSearchParams(
location.search
);

groupId=
params.get("id")||
params.get("groupId");


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href=
"login.html?redirect="+
encodeURIComponent(
location.pathname+
location.search
);

return;

}

currentUser=user;

if(!groupId){

showError(
"Group not specified."
);

return;

}

await loadGroup();

});


/* =========================================
LOAD GROUP
========================================= */

async function loadGroup(){

try{

const snap=
await getDoc(
doc(
db,
"groups",
groupId
)
);


if(!snap.exists()){

showError(
"Study group not found."
);

return;

}


group={
id:snap.id,
...snap.data()
};


renderHero();

await Promise.all([
loadPosts(),
loadMembers()
]);

updateStats();

}catch(error){

console.error(error);

showError(
"Unable to load this group."
);

}

}


/* =========================================
HERO
========================================= */

function renderHero(){

const name=
group.name||
group.title||
"Study Group";

const description=
group.description||
"Learning community on LetsStudy Pro.";

const category=
group.category||
"General";

const privacy=
group.privacy||
group.visibility||
"public";

const image=
group.image||
group.cover||
group.coverImage||
"";


hero.innerHTML=`

${
image
?
`<div style="
height:150px;
border-radius:14px;
background:url('${escapeAttribute(image)}')
center/cover;
margin-bottom:15px">
</div>`
:
""
}


<small>
${escapeHTML(category)}
 •
 ${
String(privacy).toLowerCase()==="private"
 ?"PRIVATE"
 :"PUBLIC"
}
</small>


<h1>
${escapeHTML(name)}
</h1>


<p>
${escapeHTML(description)}
</p>


<div class="actions">


<a
href="groups.html"
class="btn white">

← Groups

</a>


<a
href="community.html"
class="btn white">

Community

</a>


<a
id="heroChat"
href="community-chat.html?groupId=${encodeURIComponent(groupId)}"
class="btn white">

💬 Chat

</a>


<a
id="heroCreate"
href="create-post.html?groupId=${encodeURIComponent(groupId)}"
class="btn white">

＋ Create Post

</a>


</div>

`;

}


/* =========================================
LOAD POSTS
========================================= */

async function loadPosts(){

try{

const q=
query(
collection(db,"posts"),
where("groupId","==",groupId),
limit(30)
);

const snap=
await getDocs(q);

groupPosts=
snap.docs.map(
d=>({

id:d.id,
...d.data()

})
);


groupPosts.sort(
(a,b)=>
getTime(b.createdAt)-
getTime(a.createdAt)
);


renderPosts();

}catch(error){

console.error(
"Posts:",
error
);

posts.innerHTML=`

<div class="empty">

No group posts available.

<br><br>

<a
href="create-post.html?groupId=${encodeURIComponent(groupId)}"
class="btn primary">

Create Post

</a>

</div>

`;

}

}


/* =========================================
RENDER POSTS
========================================= */

function renderPosts(){

postCount.textContent=
groupPosts.length;


posts.innerHTML="";


if(!groupPosts.length){

posts.innerHTML=`

<div class="empty">

💬<br><br>

No posts in this group yet.

<br><br>

<a
href="create-post.html?groupId=${encodeURIComponent(groupId)}"
class="btn primary">

Create First Post

</a>

</div>

`;

return;

}


groupPosts.forEach(
post=>{

const article=
document.createElement("article");

article.className="post";


const title=
post.title||
"Group Post";

const body=
post.body||
post.content||
"";

const author=
post.authorName||
post.userName||
"Member";


article.innerHTML=`

<a
href="post-details.html?id=${encodeURIComponent(post.id)}">

<div class="post-title">

${escapeHTML(title)}

</div>


<div class="post-body">

${escapeHTML(
body.substring(0,300)
)}
${body.length>300?"...":""}

</div>


<div class="post-meta">

${escapeHTML(author)}
 •
 ${escapeHTML(
formatDate(post.createdAt)
)}

</div>

</a>

`;


posts.appendChild(article);

});

}


/* =========================================
LOAD MEMBERS
========================================= */

async function loadMembers(){

try{

/*
Primary structure:
groupMembers/{groupId}/members/{uid}

Fallback:
users/{uid}/groups/{groupId}

*/

let memberDocs=[];


try{

const snap=
await getDocs(
collection(
db,
"groupMembers",
groupId,
"members"
)
);

memberDocs=
snap.docs;

}catch{

memberDocs=[];

}


/* Fallback using memberIds */

if(!memberDocs.length){

const ids=
Array.isArray(group.memberIds)
?
group.memberIds
:
[];


for(
const uid of ids.slice(0,30)
){

try{

const userSnap=
await getDoc(
doc(db,"users",uid)
);

if(userSnap.exists()){

memberDocs.push(
{
id:uid,
data:()=>userSnap.data()
}
);

}

}catch{}

}

}


groupMembers=
memberDocs.map(
d=>({

id:d.id,
...d.data()

})
);


renderMembers();

}catch(error){

console.error(
"Members:",
error
);

members.innerHTML=`

<div style="
font-size:9px;
color:#64748b">

Member list unavailable.

</div>

`;

}

}


/* =========================================
RENDER MEMBERS
========================================= */

function renderMembers(){

memberCount.textContent=
groupMembers.length||
group.memberCount||
0;


members.innerHTML="";


if(!groupMembers.length){

members.innerHTML=`

<div style="
font-size:9px;
color:#64748b">

No members available.

</div>

`;

return;

}


groupMembers
.slice(0,8)
.forEach(
member=>{

const name=
member.displayName||
member.name||
member.authorName||
"Member";

const photo=
member.photoURL||
member.photo||
member.avatar||
"";

const role=
member.role||
"Member";


const div=
document.createElement("div");

div.className="member";


div.innerHTML=`

<div class="avatar">

${
photo
?
`<img
src="${escapeAttribute(photo)}"
alt="">`
:
getInitials(name)
}

</div>


<div>

<div class="member-name">

${escapeHTML(name)}

</div>

<div class="member-role">

${escapeHTML(role)}

</div>

</div>

`;

members.appendChild(div);

});

}


/* =========================================
USER STATUS
========================================= */

async function updateStats(){

try{

const memberRef=
doc(
db,
"groupMembers",
groupId,
"members",
currentUser.uid
);

const snap=
await getDoc(memberRef);

if(snap.exists()){

status.textContent=
"Joined";

return;

}

}catch{}


/* Fallback */

const ids=
Array.isArray(group.memberIds)
?
group.memberIds
:
[];


if(ids.includes(currentUser.uid)){

status.textContent=
"Joined";

}else{

status.textContent=
"Visitor";

}

}


/* =========================================
LINKS
========================================= */

const groupQuery=
"?groupId="+
encodeURIComponent(groupId);


membersLink.href=
"group-members.html"+
groupQuery;

allMembersLink.href=
"group-members.html"+
groupQuery;

settingsLink.href=
"group-settings.html"+
groupQuery;

chatLink.href=
"community-chat.html"+
groupQuery;

createLink.href=
"create-post.html"+
groupQuery;


/* =========================================
ERROR
========================================= */

function showError(text){

hero.innerHTML=`

<div style="
text-align:center;
padding:20px">

<h1>
Group unavailable
</h1>

<p>
${escapeHTML(text)}
</p>

<br>

<a
href="groups.html"
class="btn white">

← Back to Groups

</a>

</div>

`;

posts.innerHTML="";

}


/* =========================================
MESSAGE
========================================= */

function showMessage(
text,
type
){

message.textContent=text;

message.className=
"message "+
type;

}


/* =========================================
DATE
========================================= */

function getTime(value){

if(!value)
return 0;

if(
typeof value.toMillis==="function"
){

return value.toMillis();

}

if(value.seconds){

return value.seconds*1000;

}

const t=
new Date(value).getTime();

return Number.isNaN(t)
?0
:t;

}


function formatDate(value){

const t=
getTime(value);

if(!t)
return "Recently";

return new Intl.DateTimeFormat(
undefined,
{
dateStyle:"medium",
timeStyle:"short"
}
).format(
new Date(t)
);

}


/* =========================================
INITIALS
========================================= */

function getInitials(name){

return String(name)
.trim()
.split(/\s+/)
.slice(0,2)
.map(
x=>
x.charAt(0)
.toUpperCase()
)
.join("")||
"U";

}


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttribute(value){

return String(value)
.replaceAll("'","%27")
.replaceAll('"',"%22")
.replaceAll("&","%26");

}


/* =========================================
YEAR
========================================= */

document.getElementById("year")
.textContent=
new Date().getFullYear();

</script>

</body>
</html>
