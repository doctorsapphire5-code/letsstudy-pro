<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Community Members | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a
}

a{text-decoration:none;color:inherit}

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:12px 17px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb
}

nav{
display:flex;
gap:7px;
flex-wrap:wrap
}

nav a{
font-size:9px;
font-weight:900;
background:#f1f5f9;
padding:8px 10px;
border-radius:8px
}

.container{
max-width:1050px;
margin:auto;
padding:20px 15px
}

.hero{
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:#fff;
border-radius:18px;
padding:25px;
margin-bottom:15px
}

.hero h1{
font-size:25px;
margin-bottom:7px
}

.hero p{
font-size:10px;
line-height:1.7;
opacity:.9
}

.tools{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:13px;
margin-bottom:15px;
display:flex;
gap:8px;
flex-wrap:wrap
}

input{
flex:1;
min-width:190px;
border:1px solid #cbd5e1;
border-radius:9px;
padding:11px;
font-size:10px;
outline:none
}

input:focus{
border-color:#2563eb
}

select{
border:1px solid #cbd5e1;
border-radius:9px;
padding:10px;
font-size:9px;
background:#fff
}

.stats{
display:flex;
gap:8px;
margin-bottom:15px;
flex-wrap:wrap
}

.stat{
background:#fff;
border:1px solid #e2e8f0;
border-radius:12px;
padding:12px 16px;
min-width:130px
}

.stat strong{
display:block;
font-size:17px;
margin-bottom:4px
}

.stat span{
font-size:8px;
color:#64748b
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:15px;
transition:.2s
}

.card:hover{
transform:translateY(-2px);
box-shadow:0 8px 25px rgba(15,23,42,.07)
}

.member-head{
display:flex;
align-items:center;
gap:10px;
margin-bottom:12px
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
background:#dbeafe;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
overflow:hidden;
flex-shrink:0
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.name{
font-size:11px;
font-weight:900
}

.username{
font-size:8px;
color:#64748b;
margin-top:3px
}

.bio{
font-size:9px;
line-height:1.6;
color:#475569;
min-height:30px;
margin-bottom:12px
}

.actions{
display:flex;
gap:6px;
flex-wrap:wrap
}

.btn{
padding:8px 9px;
border-radius:8px;
font-size:8px;
font-weight:900;
border:0;
cursor:pointer;
text-align:center
}

.primary{
background:#2563eb;
color:#fff
}

.secondary{
background:#f1f5f9;
color:#0f172a
}

.empty{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:50px 20px;
text-align:center;
color:#64748b;
font-size:10px
}

.loading{
text-align:center;
padding:45px;
font-size:10px;
color:#64748b
}

.message{
display:none;
padding:11px;
border-radius:9px;
font-size:9px;
font-weight:900;
margin-bottom:12px
}

.message.show{
display:block
}

.error{
background:#fee2e2;
color:#991b1b
}

footer{
text-align:center;
padding:30px;
font-size:9px;
color:#64748b
}

@media(max-width:850px){
.grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:560px){
.grid{grid-template-columns:1fr}

header{
align-items:flex-start;
flex-direction:column
}

nav{
width:100%
}

nav a{
flex:1;
text-align:center
}
}
</style>
</head>

<body>

<header>

<a href="community.html" class="logo">
LetsStudy Pro
</a>

<nav>
<a href="community.html">Community</a>
<a href="groups.html">Groups</a>
<a href="community-chat.html">Chat</a>
<a href="dashboard.html">Dashboard</a>
</nav>

</header>

<main class="container">

<section class="hero">

<h1>Community Members</h1>

<p>
Discover learners, educators and other members
of the LetsStudy Pro community.
</p>

</section>

<div id="message" class="message"></div>

<div class="stats">

<div class="stat">
<strong id="totalMembers">0</strong>
<span>Total Members</span>
</div>

<div class="stat">
<strong id="visibleMembers">0</strong>
<span>Showing</span>
</div>

</div>

<div class="tools">

<input
id="search"
type="search"
placeholder="Search members by name, username or email...">

<select id="roleFilter">
<option value="all">All Roles</option>
<option value="student">Students</option>
<option value="instructor">Instructors</option>
<option value="admin">Admins</option>
</select>

</div>

<div id="loading" class="loading">
Loading community members...
</div>

<div
id="members"
class="grid"
style="display:none">
</div>

<div
id="empty"
class="empty"
style="display:none">

<div style="font-size:25px;margin-bottom:10px">
👥
</div>

No members found.

</div>

</main>

<footer>
© <span id="year"></span> LetsStudy Pro
</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
query,
orderBy,
limit
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const membersEl=
document.getElementById("members");

const loading=
document.getElementById("loading");

const empty=
document.getElementById("empty");

const search=
document.getElementById("search");

const roleFilter=
document.getElementById("roleFilter");

const totalMembers=
document.getElementById("totalMembers");

const visibleMembers=
document.getElementById("visibleMembers");

const message=
document.getElementById("message");


let currentUser=null;
let allMembers=[];


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href=
"login.html?redirect="+
encodeURIComponent(
location.pathname
);

return;

}

currentUser=user;

await loadMembers();

});


/* =========================================
LOAD MEMBERS
========================================= */

async function loadMembers(){

try{

const ref=
collection(
db,
"users"
);

const q=
query(
ref,
orderBy(
"displayName",
"asc"
),
limit(300)
);

const snapshot=
await getDocs(q);

allMembers=[];

snapshot.forEach(
doc=>{

const data=
doc.data();

allMembers.push({
id:doc.id,
...data
});

});


/*
Fallback for databases where
displayName does not exist consistently.
*/

if(
allMembers.length===0
){

const fallback=
await getDocs(
collection(db,"users")
);

fallback.forEach(
doc=>{

allMembers.push({
id:doc.id,
...doc.data()
});

});

}


totalMembers.textContent=
allMembers.length;

loading.style.display=
"none";

membersEl.style.display=
"grid";

applyFilters();


}catch(error){

console.error(
"Members loading error:",
error
);

loading.style.display=
"none";

showMessage(
"Unable to load community members. Check Firestore permissions.",
"error"
);

}

}


/* =========================================
FILTER
========================================= */

search.addEventListener(
"input",
applyFilters
);

roleFilter.addEventListener(
"change",
applyFilters
);


function applyFilters(){

const term=
search.value
.trim()
.toLowerCase();

const role=
roleFilter.value;


const filtered=
allMembers.filter(
member=>{

const name=
String(
member.displayName||
member.name||
member.fullName||
""
).toLowerCase();

const username=
String(
member.username||
""
).toLowerCase();

const email=
String(
member.email||
""
).toLowerCase();

const memberRole=
String(
member.role||
"student"
).toLowerCase();


const matchesSearch=
!term||
name.includes(term)||
username.includes(term)||
email.includes(term);


const matchesRole=
role==="all"||
memberRole===role;


return(
matchesSearch&&
matchesRole
);

});


renderMembers(filtered);

}


/* =========================================
RENDER
========================================= */

function renderMembers(list){

membersEl.innerHTML="";

visibleMembers.textContent=
list.length;


if(!list.length){

membersEl.style.display=
"none";

empty.style.display=
"block";

return;

}

empty.style.display=
"none";

membersEl.style.display=
"grid";


list.forEach(
member=>{

membersEl.appendChild(
createMemberCard(member)
);

});

}


/* =========================================
CARD
========================================= */

function createMemberCard(member){

const card=
document.createElement("article");

card.className=
"card";


const name=
member.displayName||
member.name||
member.fullName||
member.username||
"Community Member";


const username=
member.username||
"";


const photo=
member.photoURL||
member.photo||
member.profilePhoto||
"";


const bio=
member.bio||
member.about||
"Learning and growing with LetsStudy Pro.";


const role=
member.role||
"student";


const avatarHTML=
photo
?
`<img
src="${escapeAttribute(photo)}"
alt="">`
:
escapeHTML(
getInitials(name)
);


const profileURL=
"profile.html?id="+
encodeURIComponent(member.id);


const chatURL=
"private-chat.html?userId="+
encodeURIComponent(member.id);


card.innerHTML=`

<div class="member-head">

<div class="avatar">
${avatarHTML}
</div>

<div>

<div class="name">
${escapeHTML(name)}
</div>

<div class="username">
${username
?
"@"+escapeHTML(username)
:
escapeHTML(
formatRole(role)
)}
</div>

</div>

</div>


<div class="bio">
${escapeHTML(
bio
)}
</div>


<div class="actions">

<a
href="${profileURL}"
class="btn secondary">

View Profile

</a>

${
member.id!==currentUser.uid
?
`
<a
href="${chatURL}"
class="btn primary">

💬 Message

</a>
`
:
`
<span
class="btn secondary">

You

</span>
`
}

</div>

`;


return card;

}


/* =========================================
ROLE
========================================= */

function formatRole(role){

return String(role)
.replaceAll("_"," ")
.replace(/\b\w/g,
c=>c.toUpperCase()
);

}


/* =========================================
MESSAGE
========================================= */

function showMessage(
text,
type
){

message.textContent=
text;

message.className=
"message show "+
type;

}


/* =========================================
INITIALS
========================================= */

function getInitials(name){

return String(name)
.trim()
.split(/\s+/)
.slice(0,2)
.map(
part=>
part.charAt(0)
.toUpperCase()
)
.join("")||
"U";

}


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttribute(value){

return String(value)
.replaceAll("'","%27")
.replaceAll('"',"%22")
.replaceAll("&","%26");

}


/* =========================================
YEAR
========================================= */

document.getElementById("year")
.textContent=
new Date().getFullYear();

</script>

</body>
</html>
