<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="LetsStudy Pro Community Members — connect, discover and learn with students, educators and professionals."
  >

  <title>Community Members | LetsStudy Pro</title>


  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:#f5f7fb;
      color:#172033;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .header{
      position:sticky;
      top:0;
      z-index:100;

      background:#ffffff;
      border-bottom:1px solid #e8ebf2;

      padding:14px 20px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;

      font-size:20px;
      font-weight:800;
      color:#1769ff;
    }

    .brand-icon{
      width:40px;
      height:40px;

      border-radius:12px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#1769ff;
      color:white;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .nav-btn{
      border:0;
      background:#f1f4f9;
      color:#27344d;

      padding:9px 13px;
      border-radius:10px;
    }

    .nav-btn:hover{
      background:#e7ecf5;
    }


    /* =====================================================
       CONTAINER
    ====================================================== */

    .container{
      width:min(1180px, 94%);
      margin:0 auto;
      padding:30px 0 60px;
    }


    /* =====================================================
       HERO
    ====================================================== */

    .hero{
      background:
        linear-gradient(
          135deg,
          #1769ff,
          #573cff
        );

      color:white;

      border-radius:24px;

      padding:32px;

      margin-bottom:22px;

      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:25px;
    }

    .hero h1{
      font-size:clamp(28px,5vw,42px);
      margin-bottom:8px;
    }

    .hero p{
      opacity:.9;
      line-height:1.6;
      max-width:650px;
    }

    .hero-icon{
      width:90px;
      height:90px;

      border-radius:24px;

      background:rgba(255,255,255,.15);

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:45px;
    }


    /* =====================================================
       STATS
    ====================================================== */

    .stats{
      display:grid;
      grid-template-columns:
        repeat(3,1fr);

      gap:15px;

      margin-bottom:20px;
    }

    .stat{
      background:white;
      border:1px solid #e7eaf0;
      border-radius:16px;

      padding:20px;
    }

    .stat strong{
      display:block;
      font-size:26px;
      margin-bottom:5px;
    }

    .stat span{
      color:#68748a;
      font-size:13px;
    }


    /* =====================================================
       SEARCH
    ====================================================== */

    .toolbar{
      background:white;
      border:1px solid #e5e9f0;
      border-radius:18px;

      padding:16px;

      display:grid;

      grid-template-columns:
        1fr 180px 180px;

      gap:10px;

      margin-bottom:20px;
    }

    .search-box{
      position:relative;
    }

    .search-box span{
      position:absolute;
      left:14px;
      top:50%;
      transform:translateY(-50%);
    }

    .search-box input{
      width:100%;
      padding:12px 14px 12px 42px;

      border:1px solid #dce1ea;
      border-radius:11px;

      outline:none;
    }

    .toolbar select{
      width:100%;

      padding:12px;

      border:1px solid #dce1ea;
      border-radius:11px;

      background:white;
      outline:none;
    }

    input:focus,
    select:focus{
      border-color:#1769ff;
      box-shadow:
        0 0 0 3px
        rgba(23,105,255,.08);
    }


    /* =====================================================
       MEMBERS
    ====================================================== */

    .members-grid{
      display:grid;

      grid-template-columns:
        repeat(4,1fr);

      gap:16px;
    }

    .member-card{
      background:white;

      border:1px solid #e6eaf1;

      border-radius:18px;

      padding:20px;

      transition:
        transform .2s,
        box-shadow .2s;
    }

    .member-card:hover{
      transform:translateY(-3px);

      box-shadow:
        0 12px 35px
        rgba(20,30,55,.08);
    }

    .member-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .avatar-wrap{
      position:relative;
    }

    .avatar{
      width:64px;
      height:64px;

      border-radius:50%;

      background:#eaf0ff;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;

      font-size:22px;
      font-weight:800;
      color:#1769ff;
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .online-dot{
      position:absolute;

      width:13px;
      height:13px;

      border-radius:50%;

      background:#24b36b;

      border:2px solid white;

      right:1px;
      bottom:2px;
    }

    .online-dot.offline{
      background:#a8afbc;
    }

    .member-name{
      margin-top:14px;

      font-size:17px;
      font-weight:750;
    }

    .member-role{
      margin-top:4px;

      color:#6d788c;

      font-size:13px;
    }

    .member-meta{
      display:flex;
      flex-wrap:wrap;
      gap:7px;

      margin-top:14px;
    }

    .tag{
      background:#f1f4f9;
      color:#56637a;

      padding:5px 8px;

      border-radius:7px;

      font-size:11px;
    }

    .member-actions{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:8px;

      margin-top:17px;
    }

    .member-actions button{
      border:0;

      padding:9px;

      border-radius:9px;

      background:#eef2f8;

      color:#26344d;
    }

    .member-actions .primary{
      background:#1769ff;
      color:white;
    }


    /* =====================================================
       EMPTY / LOADING
    ====================================================== */

    .state{
      grid-column:1/-1;

      background:white;

      border:1px solid #e6eaf1;

      border-radius:18px;

      padding:55px 20px;

      text-align:center;

      color:#667287;
    }

    .state-icon{
      font-size:42px;
      margin-bottom:12px;
    }


    /* =====================================================
       MODAL
    ====================================================== */

    .modal{
      position:fixed;
      inset:0;

      background:
        rgba(8,15,30,.55);

      display:none;

      align-items:center;
      justify-content:center;

      padding:20px;

      z-index:500;
    }

    .modal.active{
      display:flex;
    }

    .modal-card{
      width:min(500px,100%);

      max-height:90vh;
      overflow:auto;

      background:white;

      border-radius:22px;

      padding:25px;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;

      margin-bottom:20px;
    }

    .close{
      width:36px;
      height:36px;

      border:0;
      border-radius:10px;

      background:#f0f3f7;

      font-size:22px;
    }

    .profile-large{
      text-align:center;
    }

    .profile-large .avatar{
      width:100px;
      height:100px;

      margin:0 auto 15px;

      font-size:32px;
    }

    .profile-large h2{
      margin-bottom:5px;
    }

    .profile-large p{
      color:#6b768a;
      font-size:14px;
    }

    .profile-info{
      display:grid;
      grid-template-columns:1fr 1fr;

      gap:10px;

      margin-top:20px;
    }

    .info{
      background:#f6f8fb;

      border-radius:12px;

      padding:13px;
    }

    .info small{
      display:block;
      color:#7b8597;
      margin-bottom:5px;
    }

    .info strong{
      font-size:13px;
    }


    /* =====================================================
       TOAST
    ====================================================== */

    .toast{
      position:fixed;

      left:50%;
      bottom:25px;

      transform:
        translate(-50%,20px);

      opacity:0;

      background:#172033;
      color:white;

      padding:12px 17px;

      border-radius:10px;

      z-index:1000;

      transition:.25s;
    }

    .toast.show{
      opacity:1;
      transform:
        translate(-50%,0);
    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media(max-width:950px){

      .members-grid{
        grid-template-columns:
          repeat(3,1fr);
      }

      .toolbar{
        grid-template-columns:1fr 1fr;
      }

      .search-box{
        grid-column:1/-1;
      }

    }

    @media(max-width:650px){

      .header{
        padding:12px 14px;
      }

      .header-actions .nav-btn{
        display:none;
      }

      .container{
        padding-top:18px;
      }

      .hero{
        padding:24px;
      }

      .hero-icon{
        display:none;
      }

      .stats{
        grid-template-columns:1fr;
      }

      .toolbar{
        grid-template-columns:1fr;
      }

      .search-box{
        grid-column:auto;
      }

      .members-grid{
        grid-template-columns:
          repeat(2,1fr);
      }

    }

    @media(max-width:430px){

      .members-grid{
        grid-template-columns:1fr;
      }

    }

    .hidden{
      display:none!important;
    }

  </style>

</head>


<body>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="brand">

      <div class="brand-icon">
        📚
      </div>

      LetsStudy Pro

    </div>


    <div class="header-actions">

      <button
        class="nav-btn"
        id="communityBtn"
      >
        Community
      </button>

      <button
        class="nav-btn"
        id="groupsBtn"
      >
        Groups
      </button>

      <button
        class="nav-btn"
        id="chatBtn"
      >
        Chat
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="container">


    <section class="hero">

      <div>

        <h1>
          Community Members
        </h1>

        <p>
          Discover learners, educators and
          professionals across LetsStudy Pro.
          Connect, learn together and build
          your education network.
        </p>

      </div>


      <div class="hero-icon">
        👥
      </div>

    </section>


    <!-- =====================================================
         STATS
    ====================================================== -->

    <section class="stats">

      <div class="stat">

        <strong id="totalMembers">
          0
        </strong>

        <span>
          Total Members
        </span>

      </div>


      <div class="stat">

        <strong id="onlineMembers">
          0
        </strong>

        <span>
          Active Members
        </span>

      </div>


      <div class="stat">

        <strong id="verifiedMembers">
          0
        </strong>

        <span>
          Verified Members
        </span>

      </div>

    </section>


    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <section class="toolbar">

      <div class="search-box">

        <span>
          🔎
        </span>

        <input
          type="search"
          id="searchInput"
          placeholder="Search members..."
          autocomplete="off"
        >

      </div>


      <select id="roleFilter">

        <option value="all">
          All Roles
        </option>

        <option value="student">
          Student
        </option>

        <option value="teacher">
          Teacher
        </option>

        <option value="instructor">
          Instructor
        </option>

        <option value="professional">
          Professional
        </option>

      </select>


      <select id="statusFilter">

        <option value="all">
          All Status
        </option>

        <option value="online">
          Online
        </option>

        <option value="offline">
          Offline
        </option>

      </select>

    </section>


    <!-- =====================================================
         MEMBERS GRID
    ====================================================== -->

    <section
      class="members-grid"
      id="membersGrid"
    >

      <div class="state">

        <div class="state-icon">
          ⏳
        </div>

        Loading community members...

      </div>

    </section>


  </main>


  <!-- =====================================================
       PROFILE MODAL
  ====================================================== -->

  <div
    class="modal"
    id="profileModal"
    aria-hidden="true"
  >

    <div class="modal-card">

      <div class="modal-head">

        <strong>
          Member Profile
        </strong>

        <button
          class="close"
          id="closeProfile"
        >
          ×
        </button>

      </div>


      <div id="profileContent">

      </div>

    </div>

  </div>


  <div
    class="toast"
    id="toast"
  ></div>


  <!-- =====================================================
       FIREBASE
  ====================================================== -->

  <script type="module">

    import {
      initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    }
    from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot,
      doc,
      setDoc,
      serverTimestamp
    }
    from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =====================================================
       CONFIG
    ====================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

      measurementId:
        "G-M7Z6SPNH1N"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /* =====================================================
       STATE
    ====================================================== */

    let currentUser =
      null;

    let members = [];


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const membersGrid =
      document.getElementById(
        "membersGrid"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const roleFilter =
      document.getElementById(
        "roleFilter"
      );

    const statusFilter =
      document.getElementById(
        "statusFilter"
      );

    const profileModal =
      document.getElementById(
        "profileModal"
      );

    const profileContent =
      document.getElementById(
        "profileContent"
      );

    const toast =
      document.getElementById(
        "toast"
      );


    /* =====================================================
       AUTH
    ====================================================== */

    onAuthStateChanged(
      auth,
      async user => {

        currentUser =
          user;

        if(user){

          await updateLastSeen(
            user
          );

        }

        loadMembers();

      }
    );


    /* =====================================================
       UPDATE USER PRESENCE
    ====================================================== */

    async function updateLastSeen(
      user
    ){

      try{

        await setDoc(

          doc(
            db,
            "users",
            user.uid
          ),

          {

            uid:
              user.uid,

            displayName:
              user.displayName ||
              user.email?.split("@")[0] ||
              "LetsStudy User",

            email:
              user.email ||
              "",

            photoURL:
              user.photoURL ||
              "",

            lastSeen:
              serverTimestamp(),

            online:
              true,

            updatedAt:
              serverTimestamp()

          },

          {
            merge:true
          }

        );

      }catch(error){

        console.warn(
          "Presence update failed:",
          error
        );

      }

    }


    /* =====================================================
       LOAD MEMBERS
    ====================================================== */

    function loadMembers(){

      const membersQuery =
        query(

          collection(
            db,
            "users"
          ),

          orderBy(
            "displayName"
          )

        );


      onSnapshot(

        membersQuery,

        snapshot => {

          members =
            snapshot.docs.map(
              item => ({

                id:
                  item.id,

                ...item.data()

              })
            );


          updateStats();

          renderMembers();

        },

        error => {

          console.error(
            error
          );


          membersGrid.innerHTML = `

            <div class="state">

              <div class="state-icon">
                ⚠️
              </div>

              <strong>
                Unable to load members
              </strong>

              <p style="margin-top:8px;">
                Check your Firestore rules
                and connection.
              </p>

            </div>

          `;

        }

      );

    }


    /* =====================================================
       FILTER
    ====================================================== */

    function getFilteredMembers(){

      const keyword =
        searchInput.value
          .trim()
          .toLowerCase();


      const role =
        roleFilter.value;


      const status =
        statusFilter.value;


      return members.filter(
        member => {

          const name =
            String(
              member.displayName ||
              member.name ||
              ""
            )
            .toLowerCase();


          const email =
            String(
              member.email ||
              ""
            )
            .toLowerCase();


          const memberRole =
            String(
              member.role ||
              "student"
            )
          

           const memberRole =
              String(
                member.role ||
                "student"
              ).toLowerCase();


            const online =
              member.online === true;


            const searchMatch =
              !keyword ||
              name.includes(
                keyword
              ) ||
              email.includes(
                keyword
              );


            const roleMatch =
              role === "all" ||
              memberRole ===
              role.toLowerCase();


            const statusMatch =
              status === "all" ||
              (
                status === "online" &&
                online
              ) ||
              (
                status === "offline" &&
                !online
              );


            return (
              searchMatch &&
              roleMatch &&
              statusMatch
            );

          }
        );

    }


    /* =====================================================
       RENDER MEMBERS
    ====================================================== */

    function renderMembers(){

      const filtered =
        getFilteredMembers();


      if(!filtered.length){

        membersGrid.innerHTML = `

          <div class="state">

            <div class="state-icon">
              🔎
            </div>

            <strong>
              No members found
            </strong>

            <p style="margin-top:8px;">
              Try another search or filter.
            </p>

          </div>

        `;

        return;

      }


      membersGrid.innerHTML =
        filtered
          .map(
            member =>
              createMemberCard(
                member
              )
          )
          .join("");


      attachMemberEvents();

    }


    /* =====================================================
       MEMBER CARD
    ====================================================== */

    function createMemberCard(
      member
    ){

      const name =
        member.displayName ||
        member.name ||
        "LetsStudy User";


      const role =
        member.role ||
        "student";


      const online =
        member.online === true;


      const photo =
        member.photoURL ||
        member.avatar ||
        "";


      const initials =
        getInitials(
          name
        );


      return `

        <article
          class="member-card"
        >

          <div class="member-top">

            <div class="avatar-wrap">

              <div class="avatar">

                ${
                  photo
                    ? `
                      <img
                        src="${escapeAttr(
                          photo
                        )}"
                        alt="${escapeAttr(
                          name
                        )}"
                        loading="lazy"
                      >
                    `
                    : escapeHTML(
                        initials
                      )
                }

              </div>


              <span
                class="online-dot ${
                  online
                    ? ""
                    : "offline"
                }"
              ></span>

            </div>

          </div>


          <div class="member-name">

            ${escapeHTML(
              name
            )}

            ${
              member.emailVerified
                ? `
                  <span
                    title="Verified member"
                    aria-label="Verified member"
                  >
                    ✓
                  </span>
                `
                : ""
            }

          </div>


          <div class="member-role">

            ${escapeHTML(
              capitalize(
                role
              )
            )}

          </div>


          <div class="member-meta">

            ${
              member.form
                ? `
                  <span class="tag">
                    ${escapeHTML(
                      member.form
                    )}
                  </span>
                `
                : ""
            }


            ${
              member.educationLevel
                ? `
                  <span class="tag">
                    ${escapeHTML(
                      member.educationLevel
                    )}
                  </span>
                `
                : ""
            }


            ${
              member.country
                ? `
                  <span class="tag">
                    🌍
                    ${escapeHTML(
                      member.country
                    )}
                  </span>
                `
                : ""
            }


            <span class="tag">

              ${
                online
                  ? "🟢 Online"
                  : "⚪ Offline"
              }

            </span>

          </div>


          <div class="member-actions">

            <button
              type="button"
              data-profile="${escapeAttr(
                member.id
              )}"
            >
              Profile
            </button>


            <button
              type="button"
              class="primary"
              data-chat="${escapeAttr(
                member.id
              )}"
            >
              💬 Chat
            </button>

          </div>

        </article>

      `;

    }


    /* =====================================================
       MEMBER EVENTS
    ====================================================== */

    function attachMemberEvents(){

      document
        .querySelectorAll(
          "[data-profile]"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                openProfile(
                  button.dataset.profile
                );

              }
            );

          }
        );


      document
        .querySelectorAll(
          "[data-chat]"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                startChat(
                  button.dataset.chat
                );

              }
            );

          }
        );

    }


    /* =====================================================
       OPEN PROFILE
    ====================================================== */

    function openProfile(
      userId
    ){

      const member =
        members.find(
          item =>
            item.id === userId
        );


      if(!member){

        showToast(
          "Member profile not found."
        );

        return;

      }


      const name =
        member.displayName ||
        member.name ||
        "LetsStudy User";


      const photo =
        member.photoURL ||
        member.avatar ||
        "";


      const role =
        member.role ||
        "student";


      profileContent.innerHTML = `

        <div class="profile-large">

          <div class="avatar">

            ${
              photo
                ? `
                  <img
                    src="${escapeAttr(
                      photo
                    )}"
                    alt="${escapeAttr(
                      name
                    )}"
                  >
                `
                : escapeHTML(
                    getInitials(
                      name
                    )
                  )
            }

          </div>


          <h2>

            ${escapeHTML(
              name
            )}

            ${
              member.emailVerified
                ? " ✓"
                : ""
            }

          </h2>


          <p>
            ${escapeHTML(
              capitalize(
                role
              )
            )}
          </p>

        </div>


        <div class="profile-info">

          <div class="info">

            <small>
              Status
            </small>

            <strong>

              ${
                member.online === true
                  ? "🟢 Online"
                  : "⚪ Offline"
              }

            </strong>

          </div>


          <div class="info">

            <small>
              Verification
            </small>

            <strong>

              ${
                member.emailVerified === true
                  ? "✓ Verified"
                  : "Not verified"
              }

            </strong>

          </div>


          <div class="info">

            <small>
              Education
            </small>

            <strong>
              ${escapeHTML(
                member.form ||
                member.educationLevel ||
                "Not specified"
              )}
            </strong>

          </div>


          <div class="info">

            <small>
              Country
            </small>

            <strong>
              ${escapeHTML(
                member.country ||
                "Not specified"
              )}
            </strong>

          </div>

        </div>


        ${
          member.bio
            ? `
              <div
                style="
                  margin-top:18px;
                  padding:15px;
                  background:#f6f8fb;
                  border-radius:12px;
                  line-height:1.6;
                "
              >

                <small
                  style="
                    display:block;
                    color:#7b8597;
                    margin-bottom:6px;
                  "
                >
                  About
                </small>

                ${escapeHTML(
                  member.bio
                )}

              </div>
            `
            : ""
        }


        ${
          currentUser &&
          currentUser.uid !==
          member.id
            ? `
              <button
                type="button"
                id="profileChatBtn"
                style="
                  width:100%;
                  margin-top:20px;
                  border:0;
                  padding:13px;
                  border-radius:11px;
                  background:#1769ff;
                  color:white;
                  font-weight:700;
                  cursor:pointer;
                "
              >
                💬 Start Chat
              </button>
            `
            : ""
        }

      `;


      profileModal.classList.add(
        "active"
      );


      profileModal.setAttribute(
        "aria-hidden",
        "false"
      );


      document
        .getElementById(
          "profileChatBtn"
        )
        ?.addEventListener(
          "click",
          () => {

            startChat(
              userId
            );

          }
        );

    }


    /* =====================================================
       START CHAT
    ====================================================== */

    function startChat(
      userId
    ){

      if(!currentUser){

        showToast(
          "Please login to start a chat."
        );


        setTimeout(
          () => {

            window.location.href =
              "login.html?redirect=community-members.html";

          },
          700
        );


        return;

      }


      if(
        currentUser.uid ===
        userId
      ){

        showToast(
          "You cannot start a chat with yourself."
        );

        return;

      }


      window.location.href =
        "community-chat.html?user=" +
        encodeURIComponent(
          userId
        );

    }


    /* =====================================================
       CLOSE PROFILE
    ====================================================== */

    function closeProfile(){

      profileModal.classList.remove(
        "active"
      );

      profileModal.setAttribute(
        "aria-hidden",
        "true"
      );

    }


    document
      .getElementById(
        "closeProfile"
      )
      ?.addEventListener(
        "click",
        closeProfile
      );


    profileModal?.addEventListener(
      "click",
      event => {

        if(
          event.target ===
          profileModal
        ){

          closeProfile();

        }

      }
    );


    /* =====================================================
       KEYBOARD
    ====================================================== */

    document.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Escape"
        ){

          closeProfile();

        }

      }
    );


    /* =====================================================
       NAVIGATION
    ====================================================== */

    document
      .getElementById(
        "communityBtn"
      )
      ?.addEventListener(
        "click",
        () => {

          window.location.href =
            "community.html";

        }
      );


    document
      .getElementById(
        "groupsBtn"
      )
      ?.addEventListener(
        "click",
        () => {

          window.location.href =
            "community-groups.html";

        }
      );


    document
      .getElementById(
        "chatBtn"
      )
      ?.addEventListener(
        "click",
        () => {

          window.location.href =
            "community-chat.html";

        }
      );


    /* =====================================================
       SEARCH / FILTER
    ====================================================== */

    searchInput?.addEventListener(
      "input",
      renderMembers
    );


    roleFilter?.addEventListener(
      "change",
      renderMembers
    );


    statusFilter?.addEventListener(
      "change",
      renderMembers
    );


    /* =====================================================
       HELPERS
    ====================================================== */

    function getInitials(
      name
    ){

      const words =
        String(
          name ||
          "User"
        )
        .trim()
        .split(/\s+/)
        .filter(Boolean);


      if(!words.length){

        return "U";

      }


      return words
        .slice(0,2)
        .map(
          word =>
            word
              .charAt(0)
              .toUpperCase()
        )
        .join("");

    }


    function capitalize(
      text
    ){

      const value =
        String(
          text ||
          ""
        );


      return value
        .charAt(0)
        .toUpperCase() +
        value.slice(1);

    }


    function escapeHTML(
      value
    ){

      return String(
        value ?? ""
      )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

    }


    function escapeAttr(
      value
    ){

      return escapeHTML(
        value
      );

    }


    /* =====================================================
       TOAST
    ====================================================== */

    let toastTimer = null;


    function showToast(
      message
    ){

      if(!toast){

        return;

      }


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          3200
        );

    }


    /* =====================================================
       INITIAL RENDER
    ====================================================== */

    updateStats();

  </script>
