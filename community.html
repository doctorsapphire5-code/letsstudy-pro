<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Community | LetsStudy Pro</title>
<meta name="description" content="Explore communities, discussions and learning conversations on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.header-actions{
  display:flex;
  gap:8px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  text-decoration:none;
  font-size:14px;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2ff;
  color:#3730a3;
}

.hero{
  padding:45px 6%;
  background:linear-gradient(135deg,#eff6ff,#fff);
}

.hero h1{
  font-size:36px;
  margin-bottom:10px;
}

.hero p{
  color:#64748b;
  max-width:700px;
  line-height:1.6;
}

.container{
  width:92%;
  max-width:1200px;
  margin:28px auto;
}

.filters{
  background:#fff;
  padding:16px;
  border-radius:14px;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
  margin-bottom:22px;
  box-shadow:0 4px 18px #00000008;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #dce1e8;
  border-radius:8px;
  outline:none;
  background:#fff;
}

.section-title{
  margin:25px 0 14px;
  font-size:21px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 5px 20px #0000000b;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.icon{
  width:48px;
  height:48px;
  border-radius:12px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  margin-bottom:13px;
}

.title{
  font-size:18px;
  font-weight:700;
  margin-bottom:7px;
}

.text{
  color:#64748b;
  font-size:14px;
  line-height:1.55;
}

.meta{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  color:#64748b;
  font-size:13px;
  margin:14px 0;
}

.card-link{
  display:inline-block;
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:9px 12px;
  border-radius:8px;
  font-size:13px;
}

.post{
  background:#fff;
  border-radius:15px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px #0000000b;
}

.post-head{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:12px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#e5e7eb;
}

.author{
  font-weight:700;
}

.date{
  color:#94a3b8;
  font-size:12px;
  margin-top:3px;
}

.post-title{
  font-size:19px;
  font-weight:700;
  margin-bottom:7px;
}

.post-content{
  color:#475569;
  line-height:1.6;
  font-size:14px;
}

.post-footer{
  display:flex;
  gap:15px;
  margin-top:15px;
  color:#64748b;
  font-size:13px;
}

.loading,
.empty,
.error{
  background:#fff;
  border-radius:14px;
  padding:45px 20px;
  text-align:center;
  color:#64748b;
  grid-column:1/-1;
}

.error{
  color:#991b1b;
  background:#fef2f2;
}

@media(max-width:700px){
  .hero h1{
    font-size:28px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .header-actions .secondary{
    display:none;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <div class="header-actions">

    <a
      href="groups-community.html"
      class="btn secondary"
    >
      Groups
    </a>

    <a
      href="login.html"
      class="btn primary"
    >
      Join Community
    </a>

  </div>

</header>


<section class="hero">

  <h1>
    Community
  </h1>

  <p>
    Discover learning communities, join discussions,
    share ideas and connect with other learners.
  </p>

</section>


<main class="container">

  <div class="filters">

    <input
      id="search"
      type="search"
      placeholder="Search communities and posts..."
    >

    <select id="category">
      <option value="">
        All Categories
      </option>
    </select>

  </div>


  <h2 class="section-title">
    Communities
  </h2>

  <section
    id="groups"
    class="grid"
  >

    <div class="loading">
      Loading communities...
    </div>

  </section>


  <h2 class="section-title">
    Latest Discussions
  </h2>

  <section
    id="posts"
    class="posts"
  >

    <div class="loading">
      Loading discussions...
    </div>

  </section>

</main>


<script>

/* =================================
   PUBLIC API
================================= */

const API =
  "/api/data";


/* =================================
   STATE
================================= */

let groups = [];
let posts = [];


/* =================================
   DOM
================================= */

const groupsBox =
  document.getElementById(
    "groups"
  );

const postsBox =
  document.getElementById(
    "posts"
  );

const search =
  document.getElementById(
    "search"
  );

const category =
  document.getElementById(
    "category"
  );


/* =================================
   API REQUEST
================================= */

async function getCollection(
  collection,
  limit = 100
){

  const response =
    await fetch(
      API +
      "?collection=" +
      encodeURIComponent(
        collection
      ) +
      "&limit=" +
      limit
    );


  if(!response.ok){

    throw new Error(
      "API request failed"
    );

  }


  const result =
    await response.json();


  if(!result.success){

    throw new Error(
      result.error ||
      "Unable to load data"
    );

  }


  return Array.isArray(
    result.results
  )
  ? result.results
  : [];

}


/* =================================
   LOAD COMMUNITY
================================= */

async function loadCommunity(){

  try{

    const data =
      await Promise.all([
        getCollection(
          "groups",
          100
        ),
        getCollection(
          "posts",
          100
        )
      ]);


    groups = data[0];
    posts = data[1];


    buildCategories();

    renderGroups();

    renderPosts();


  }catch(error){

    console.error(
      "COMMUNITY API:",
      error
    );


    groupsBox.innerHTML = `
      <div class="error">
        Unable to load communities.
      </div>
    `;


    postsBox.innerHTML = `
      <div class="error">
        Unable to load discussions.
      </div>
    `;

  }

}


/* =================================
   CATEGORIES
================================= */

function buildCategories(){

  const categories =
    [
      ...new Set(
        groups
          .map(
            group =>
              group.category
          )
          .filter(Boolean)
      )
    ]
    .sort();


  category.innerHTML = `
    <option value="">
      All Categories
    </option>
  `;


  categories.forEach(
    item => {

      category.innerHTML += `
        <option value="${escapeAttr(item)}">
          ${escapeHTML(item)}
        </option>
      `;

    }
  );

}


/* =================================
   FILTER
================================= */

function matchesSearch(item){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  if(!keyword)
    return true;


  const text = `
    ${item.name || ""}
    ${item.title || ""}
    ${item.description || ""}
    ${item.content || ""}
    ${item.category || ""}
    ${item.tags || ""}
  `
  .toLowerCase();


  return text.includes(
    keyword
  );

}


/* =================================
   GROUPS
================================= */

function renderGroups(){

  let result =
    groups.filter(
      group => {

        return (
          matchesSearch(group) &&
          (
            !category.value ||
            group.category ===
              category.value
          )
        );

      }
    );


  if(result.length === 0){

    groupsBox.innerHTML = `
      <div class="empty">
        <h3>No communities found</h3>
        <p>
          Try another search or category.
        </p>
      </div>
    `;

    return;

  }


  groupsBox.innerHTML =
    result
      .map(
        createGroup
      )
      .join("");

}


/* =================================
   GROUP CARD
================================= */

function createGroup(
  group
){

  const id =
    group.id ||
    group.documentId;


  const name =
    group.name ||
    group.title ||
    "Community";


  const description =
    group.description ||
    group.shortDescription ||
    "Join this community and start learning together.";


  const members =
    Number(
      group.membersCount ||
      group.memberCount ||
      group.members ||
      0
    );


  return `

    <article class="card">

      <div class="icon">
        👥
      </div>

      <div class="title">
        ${escapeHTML(name)}
      </div>

      <div class="text">
        ${escapeHTML(
          description
        )}
      </div>

      <div class="meta">

        <span>
          👥
          ${members.toLocaleString()}
          members
        </span>

        ${
          group.category
          ? `
            <span>
              ${escapeHTML(
                group.category
              )}
            </span>
          `
          : ""
        }

      </div>

      <a
        class="card-link"
        href="group-community.html?id=${encodeURIComponent(id)}"
      >
        Open Community →
      </a>

    </article>

  `;

}


/* =================================
   POSTS
================================= */

function renderPosts(){

  let result =
    posts
      .filter(
        matchesSearch
      )
      .sort(
        (a,b) =>
          getTime(
            b.createdAt
          ) -
          getTime(
            a.createdAt
          )
      );


  if(result.length === 0){

    postsBox.innerHTML = `
      <div class="empty">
        <h3>No discussions found</h3>
        <p>
          There are no public discussions yet.
        </p>
      </div>
    `;

    return;

  }


  postsBox.innerHTML =
    result
      .slice(0,50)
      .map(
        createPost
      )
      .join("");

}


/* =================================
   POST
================================= */

function createPost(
  post
){

  const id =
    post.id ||
    post.documentId;


  const author =
    post.authorName ||
    post.userName ||
    post.username ||
    "Community Member";


  const title =
    post.title ||
    "Community Discussion";


  const content =
    post.content ||
    post.text ||
    post.description ||
    "";


  const avatar =
    post.authorPhoto ||
    post.avatar ||
    post.photoURL ||
    "";


  const comments =
    Number(
      post.commentsCount ||
      post.commentCount ||
      0
    );


  const likes =
    Number(
      post.likesCount ||
      post.likeCount ||
      0
    );


  return `

    <article class="post">

      <div class="post-head">

        ${
          avatar
          ? `
            <img
              class="avatar"
              src="${safeImage(avatar)}"
              alt=""
              onerror="
                this.style.display='none';
              "
            >
          `
          : `
            <div class="avatar"></div>
          `
        }

        <div>

          <div class="author">
            ${escapeHTML(author)}
          </div>

          <div class="date">
            ${escapeHTML(
              formatDate(
                post.createdAt
              )
            )}
          </div>

        </div>

      </div>


      <div class="post-title">
        ${escapeHTML(title)}
      </div>


      <div class="post-content">
        ${escapeHTML(
          content
        )}
      </div>


      <div class="post-footer">

        <span>
          ♥ ${likes}
        </span>

        <span>
          💬 ${comments}
        </span>

        <a
          href="post-details.html?id=${encodeURIComponent(id)}"
          style="
            margin-left:auto;
            color:#2563eb;
            text-decoration:none;
          "
        >
          View discussion →
        </a>

      </div>

    </article>

  `;

}


/* =================================
   HELPERS
================================= */

function getTime(value){

  if(!value)
    return 0;


  if(
    typeof value ===
    "number"
  )
    return value;


  const time =
    new Date(
      value
    ).getTime();


  return Number.isFinite(time)
    ? time
    : 0;

}


function formatDate(value){

  const time =
    getTime(value);


  if(!time)
    return "";


  return new Date(
    time
  ).toLocaleString(
    undefined,
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


function safeImage(url){

  const value =
    String(
      url || ""
    ).trim();


  if(
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "http://"
    )
  ){

    return value;

  }


  return "";

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(value){

  return escapeHTML(
    value
  );

}


/* =================================
   EVENTS
================================= */

search.addEventListener(
  "input",
  () => {

    renderGroups();
    renderPosts();

  }
);


category.addEventListener(
  "change",
  () => {

    renderGroups();

  }
);


/* =================================
   START
================================= */

loadCommunity();

</script>

</body>
</html>
