<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(900px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 12px}
.lead{font-size:18px;color:var(--muted);margin:0 0 26px;max-width:620px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{flex:none;border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px}
.search:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
#count{color:var(--muted);font-size:14px;margin:16px 0 12px;min-height:21px}
.list{display:grid;gap:14px}
.list.cols{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.c{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;align-items:center;gap:12px}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who{min-width:0}
.who b{display:block;color:var(--ink);line-height:1.3;overflow-wrap:anywhere}
.who span,.mt{font-size:13px;color:var(--muted)}
.ttl{margin:0;font-size:18px;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
.ttl a{color:var(--ink);text-decoration:none}
.ttl a:hover{color:var(--p)}
.tx{margin:0;color:var(--text);overflow-wrap:anywhere;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:auto}
.meta b{color:var(--ink)}
.badges{display:flex;flex-wrap:wrap;gap:7px}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.b.hot{background:#fef3c7;color:#92400e}
.ev{flex-direction:row;gap:16px;align-items:flex-start}
.dt{flex:none;width:58px;text-align:center;background:var(--soft);border-radius:12px;padding:6px 0}
.dt b{display:block;font-size:22px;line-height:1.1;color:var(--ink)}
.dt span{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--p)}
.ev>div:last-child{min-width:0;display:flex;flex-direction:column;gap:8px;flex:1}
.state{grid-column:1/-1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.btn{display:inline-block;margin-top:14px;border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.b.hot{background:#422006;color:#fbbf24}}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.c{padding:16px}}
</style>

<main class="wrap">
  <h1>Community</h1>
  <p class="lead">Ask questions, join study groups, attend events and stay up to date with what is happening on LetsStudy Pro.</p>

  <div class="tabs" role="tablist" id="tabs"></div>
  <input id="search" class="search" type="search" placeholder="Search" aria-label="Search">
  <div id="count" role="status"></div>
  <section id="list" class="list"></section>
</main>

<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,query,orderBy,limit}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const listEl=$("#list"),countEl=$("#count");
const N=new Intl.NumberFormat(undefined,{notation:"compact",maximumFractionDigits:1});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const cap=s=>s?String(s)[0].toUpperCase()+String(s).slice(1):s;

/* Tolerant field helpers: collections use slightly different field names */
const pick=(o,...k)=>{for(const x of k)if(o[x]!==undefined&&o[x]!==null&&o[x]!=="")return o[x];return ""};
const cnt=(o,...k)=>{const v=pick(o,...k);return Array.isArray(v)?v.length:Number(v)||0};
const toD=v=>{
  if(!v)return null;
  if(typeof v.toDate==="function")return v.toDate();
  const m=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  const x=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(v);
  return isNaN(x)?null:x;
};
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
const HIDE=/^(deleted|hidden|removed|rejected|spam|draft|pending|archived|flagged|blocked|cancelled|canceled)$/i;
const created=o=>toD(pick(o,"createdAt","publishedAt","postedAt"))||0;
const members=o=>cnt(o,"memberCount","membersCount","members");
const eventDate=o=>toD(pick(o,"startDate","date","eventDate","startAt","startTime"));

const TABS={
  posts:{col:"communityPosts",label:"Discussions",sort:(a,b)=>created(b)-created(a),empty:"No discussions yet. Check back soon."},
  groups:{col:"communityGroups",label:"Groups",sort:(a,b)=>members(b)-members(a),empty:"No groups yet."},
  events:{col:"communityEvents",label:"Events",empty:"No events scheduled.",
    sort:(a,b)=>{const n=Date.now(),x=eventDate(a),y=eventDate(b);
      const fa=x&&x>=n-864e5,fb2=y&&y>=n-864e5;
      if(fa&&fb2)return x-y; if(fa)return -1; if(fb2)return 1; return (y||0)-(x||0)}},
  news:{col:"communityAnnouncements",label:"Announcements",empty:"No announcements yet.",
    sort:(a,b)=>(!!b.pinned-!!a.pinned)||created(b)-created(a)}
};
/* Where each card links to. Change here if your detail pages are named differently. */
const href=(t,o)=>`community-details.html?type=${t}&id=${encodeURIComponent(o.id)}`;

const cache={};
let tab=new URLSearchParams(location.search).get("tab");
if(!TABS[tab])tab="posts";
let user=null;

function avatar(o){
  const ph=safe(pick(o,"authorPhoto","authorAvatar","photoURL","avatar")),n=String(pick(o,"authorName","ownerName","name","title")||"?").trim()[0]||"?";
  return `<div class="av" aria-hidden="true">${ph?`<img src="${esc(ph)}" alt="" loading="lazy" data-n="${esc(n.toUpperCase())}">`:esc(n.toUpperCase())}</div>`;
}
const when=o=>{const d=toD(pick(o,"createdAt","publishedAt","postedAt"));return d?`<time datetime="${d.toISOString()}" title="${esc(d.toLocaleString())}">${esc(ago(d))}</time>`:""};
const tags=o=>{const t=pick(o,"tags");return (Array.isArray(t)?t:[]).slice(0,4).map(x=>`<span class="b">#${esc(x)}</span>`).join("")};
const body=o=>pick(o,"content","text","description","message","body","excerpt");

function card(t,o){
  const link=href(t,o),title=pick(o,"title","name"),text=body(o);
  if(t==="events"){
    const d=eventDate(o),loc=pick(o,"location","venue"),go=cnt(o,"attendeesCount","goingCount","memberCount","attendees","members");
    return `<article class="c ev"><div class="dt">${d?`<b>${d.getDate()}</b><span>${esc(d.toLocaleDateString(undefined,{month:"short"}))}</span>`:`<b>–</b>`}</div>
      <div><h2 class="ttl"><a href="${link}">${esc(title||"Event")}</a></h2>
      ${text?`<p class="tx">${esc(text)}</p>`:""}
      <div class="badges">${pick(o,"category")?`<span class="b">${esc(cap(pick(o,"category")))}</span>`:""}${pick(o,"type","mode")?`<span class="b">${esc(cap(pick(o,"type","mode")))}</span>`:""}</div>
      <div class="meta">${d?`<span>${esc(d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))}</span>`:""}${loc?`<span>${esc(loc)}</span>`:""}${go?`<span><b>${N.format(go)}</b> going</span>`:""}</div></div></article>`;
  }
  if(t==="groups"){
    const m=members(o),priv=pick(o,"privacy","visibility");
    return `<article class="c"><div class="top">${avatar(o)}<div class="who"><b><a class="ttl" style="font-size:17px" href="${link}"><span style="color:var(--ink)">${esc(title||"Group")}</span></a></b>${pick(o,"category")?`<span>${esc(cap(pick(o,"category")))}</span>`:""}</div></div>
      ${text?`<p class="tx">${esc(text)}</p>`:""}
      <div class="meta"><span><b>${N.format(m)}</b> members</span>${priv?`<span>${esc(cap(priv))}</span>`:""}${cnt(o,"postsCount","postCount")?`<span><b>${N.format(cnt(o,"postsCount","postCount"))}</b> posts</span>`:""}</div></article>`;
  }
  if(t==="news"){
    return `<article class="c"><div class="badges">${o.pinned?`<span class="b hot">Pinned</span>`:""}${pick(o,"priority","type")?`<span class="b">${esc(cap(pick(o,"priority","type")))}</span>`:""}</div>
      <h2 class="ttl"><a href="${link}">${esc(title||"Announcement")}</a></h2>
      ${text?`<p class="tx">${esc(text)}</p>`:""}<div class="meta">${when(o)}</div></article>`;
  }
  const img=safe(pick(o,"image","coverImage","imageUrl","photo"));
  return `<article class="c"><div class="top">${avatar(o)}<div class="who"><b>${esc(pick(o,"authorName","ownerName","userName")||"Member")}</b><span>${when(o)}</span></div></div>
    ${title?`<h2 class="ttl"><a href="${link}">${esc(title)}</a></h2>`:""}
    ${text?`<p class="tx">${esc(text)}</p>`:""}
    ${img?`<img class="img" src="${esc(img)}" alt="" loading="lazy">`:""}
    ${tags(o)?`<div class="badges">${tags(o)}</div>`:""}
    <div class="meta"><span><b>${N.format(cnt(o,"likeCount","likesCount","likes"))}</b> likes</span><span><b>${N.format(cnt(o,"commentCount","commentsCount","comments"))}</b> comments</span>${pick(o,"category")?`<span>${esc(cap(pick(o,"category")))}</span>`:""}<a href="${link}">Open</a></div></article>`;
}

function render(){
  const T=TABS[tab],items=cache[tab]||[],q=$("#search").value.toLowerCase().trim();
  const out=items.filter(o=>!q||[o.title,o.name,body(o),o.authorName,o.ownerName,o.category,o.location,(o.tags||[]).join?.(" ")].join(" ").toLowerCase().includes(q));
  countEl.textContent=out.length===1?"1 result":`${out.length} results`;
  listEl.className="list"+(tab==="groups"?" cols":"");
  listEl.innerHTML=out.length?out.map(o=>card(tab,o)).join(""):
    `<div class="state"><h2>${items.length?"No matches":"Nothing here yet"}</h2><p>${items.length?"Try a different search.":T.empty}</p></div>`;
}

function fail(err){
  console.error(err);countEl.textContent="";
  const denied=err&&err.code==="permission-denied"&&!user;
  listEl.className="list";
  listEl.innerHTML=denied
    ?`<div class="state"><h2>Sign in to join the community</h2><p>Sign in to see discussions, groups and events.</p><a class="btn" href="login.html">Sign in</a></div>`
    :`<div class="state err"><h2>Unable to load ${esc(TABS[tab].label.toLowerCase())}</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry")?.addEventListener("click",()=>show(tab));
}

async function show(t){
  tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.t===t)));
  history.replaceState(null,"","?tab="+t);
  if(!cache[t]){
    listEl.innerHTML="";countEl.textContent="";
    const col=collection(db,TABS[t].col);
    let snap;
    try{snap=await getDocs(query(col,orderBy("createdAt","desc"),limit(60)))}
    catch{try{snap=await getDocs(query(col,limit(60)))}catch(e){return fail(e)}}
    cache[t]=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(o=>!HIDE.test(o.status||"")&&o.hidden!==true&&o.isDeleted!==true&&o.deleted!==true)
      .sort(TABS[t].sort);
  }
  if(tab===t)render();
}

$("#tabs").innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="false">${v.label}</button>`).join("");
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)show(b.dataset.t)});
$("#search").addEventListener("input",render);
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"){if(i.dataset.n)i.replaceWith(document.createTextNode(i.dataset.n));else if(i.classList.contains("img"))i.remove()}},true);

$("#year").textContent=new Date().getFullYear();
let started=false;
onAuthStateChanged(auth,u=>{
  const changed=!!u!==!!user;user=u;
  if(!started){started=true;show(tab)}
  else if(changed){for(const k in cache)delete cache[k];show(tab)}
});
</script>


</body></html>
