<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Chat | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  height:100vh;
  display:flex;
  flex-direction:column
}

header{
  height:65px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%
}

.logo{
  color:#2563eb;
  font-size:20px;
  font-weight:800;
  text-decoration:none
}

.back{
  color:#475569;
  text-decoration:none;
  font-size:14px
}

.chat{
  width:100%;
  max-width:900px;
  margin:auto;
  height:calc(100vh - 65px);
  background:#fff;
  display:flex;
  flex-direction:column
}

.chat-head{
  padding:15px 18px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  gap:12px
}

.group-img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#dbeafe
}

.chat-head h3{
  font-size:16px;
  margin-bottom:4px
}

.chat-head small{
  color:#64748b
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  background:#f8fafc
}

.message{
  display:flex;
  gap:8px;
  margin-bottom:15px
}

.message.me{
  flex-direction:row-reverse
}

.photo{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover
}

.bubble{
  max-width:70%;
  background:#fff;
  border:1px solid #e5e7eb;
  padding:9px 12px;
  border-radius:12px
}

.me .bubble{
  background:#2563eb;
  color:#fff;
  border:0
}

.sender{
  color:#2563eb;
  font-size:11px;
  font-weight:bold;
  margin-bottom:4px
}

.me .sender{
  color:#dbeafe
}

.time{
  font-size:9px;
  opacity:.6;
  margin-top:5px
}

.composer{
  padding:12px;
  border-top:1px solid #e5e7eb;
  display:flex;
  gap:8px
}

.composer input{
  flex:1;
  border:1px solid #dfe3e8;
  border-radius:25px;
  padding:12px 16px;
  outline:none
}

.send{
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#2563eb;
  color:white;
  cursor:pointer
}

@media(max-width:600px){
  .chat{height:calc(100vh - 65px)}
  .bubble{max-width:82%}
  header{padding:0 15px}
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<a href="community.html" class="back">
<i class="fa fa-arrow-left"></i>
Community
</a>

</header>


<section class="chat">

<div class="chat-head">

<img
id="groupImage"
class="group-img"
src="https://ui-avatars.com/api/?name=LetsStudy+Community&background=2563eb&color=fff"
>

<div>

<h3 id="groupName">
LetsStudy Pro Community
</h3>

<small id="members">
Community Group
</small>

</div>

</div>


<div
id="messages"
class="messages"
>

<div style="text-align:center;color:#64748b;padding:40px">
Loading messages...
</div>

</div>


<form
id="form"
class="composer"
>

<input
id="message"
placeholder="Write a message..."
autocomplete="off"
>

<button class="send">
<i class="fa fa-paper-plane"></i>
</button>

</form>

</section>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 query,
 orderBy,
 onSnapshot,
 addDoc,
 serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_PROJECT.firebaseapp.com",
 projectId:"YOUR_PROJECT_ID",
 storageBucket:"YOUR_PROJECT.firebasestorage.app",
 messagingSenderId:"YOUR_SENDER_ID",
 appId:"YOUR_APP_ID"
};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ONE GROUP ONLY */

const GROUP_ID=
"main";


/*
 Temporary current user.
 Connect this with Firebase Auth.
*/

const user={
 id:"CURRENT_USER_ID",
 name:"Current User",
 photo:
 "https://ui-avatars.com/api/?name=User"
};


const messages=
document.getElementById("messages");

const form=
document.getElementById("form");

const input=
document.getElementById("message");


/* LOAD MESSAGES */

const q=query(

 collection(
  db,
  "groupChat",
  GROUP_ID,
  "messages"
 ),

 orderBy(
  "createdAt",
  "asc"
 )

);


onSnapshot(q,snapshot=>{

 messages.innerHTML="";

 if(snapshot.empty){

  messages.innerHTML=`
   <div style="
    text-align:center;
    color:#64748b;
    padding:50px
   ">
    <i class="fa fa-comments"
       style="font-size:35px"></i>

    <p style="margin-top:10px">
     Start the conversation
    </p>
   </div>
  `;

  return;

 }


 snapshot.forEach(doc=>{

  const m=doc.data();

  const mine=
   m.senderId===user.id;

  const time=
   m.createdAt?.toDate
   ?m.createdAt
      .toDate()
      .toLocaleTimeString(
       [],
       {
        hour:"2-digit",
        minute:"2-digit"
       }
      )
   :"";


  messages.innerHTML+=`

   <div class="message ${mine?"me":""}">

    <img
     class="photo"
     src="${safe(
      m.senderPhoto||user.photo
     )}"
    >

    <div class="bubble">

     <div class="sender">
      ${safe(
       m.senderName||"User"
      )}
     </div>

     <div>
      ${safe(m.text||"")}
     </div>

     <div class="time">
      ${time}
     </div>

    </div>

   </div>

  `;

 });


 messages.scrollTop=
 messages.scrollHeight;

});


/* SEND MESSAGE */

form.addEventListener(
"submit",
async e=>{

 e.preventDefault();

 const text=
  input.value.trim();

 if(!text)return;


 await addDoc(

  collection(
   db,
   "groupChat",
   GROUP_ID,
   "messages"
  ),

  {
   senderId:user.id,
   senderName:user.name,
   senderPhoto:user.photo,
   text:text,
   type:"text",
   createdAt:
    serverTimestamp()
  }

 );


 input.value="";

});


function safe(value){

 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
