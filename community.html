<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
  --blue:#2563eb;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
}


/* =========================
   HEADER
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:100;

  height:64px;

  display:flex;
  align-items:center;

  border-bottom:1px solid var(--border);

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(12px);
}

.topbar-inner{
  width:100%;
  max-width:1180px;

  margin:auto;

  padding:0 15px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;

  font-size:14px;
  font-weight:850;

  white-space:nowrap;
}

.logo{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--primary);
  color:#fff;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--border);

  border-radius:10px;

  background:#fff;

  cursor:pointer;

  font-size:17px;

  position:relative;
}

.badge{
  position:absolute;

  top:-4px;
  right:-4px;

  min-width:17px;
  height:17px;

  padding:0 4px;

  display:none;
  align-items:center;
  justify-content:center;

  border-radius:20px;

  background:#dc2626;
  color:#fff;

  font-size:8px;
  font-weight:850;
}


/* =========================
   LAYOUT
========================= */

.layout{
  width:100%;
  max-width:1180px;

  margin:auto;

  padding:
    22px 15px
    60px;

  display:grid;

  grid-template-columns:
    220px
    minmax(0,1fr)
    260px;

  gap:18px;
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:sticky;
  top:84px;

  height:max-content;
}

.side-card{
  padding:12px;

  border:1px solid var(--border);

  border-radius:15px;

  background:var(--card);
}

.nav-item{
  width:100%;

  display:flex;
  align-items:center;

  gap:10px;

  padding:10px;

  border:0;

  border-radius:9px;

  background:transparent;

  color:var(--text);

  font-family:inherit;

  font-size:11px;
  font-weight:750;

  text-align:left;

  cursor:pointer;
}

.nav-item:hover,
.nav-item.active{
  background:var(--soft);
}

.nav-icon{
  width:25px;

  text-align:center;

  font-size:16px;
}

.profile-mini{
  display:flex;
  align-items:center;

  gap:9px;

  padding:
    7px 8px
    12px;

  margin-bottom:7px;

  border-bottom:
    1px solid var(--border);
}

.avatar{
  width:38px;
  height:38px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border-radius:50%;

  background:var(--soft);

  font-size:10px;
  font-weight:850;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.mini-name{
  min-width:0;
}

.mini-name strong{
  display:block;

  font-size:10px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.mini-name span{
  display:block;

  margin-top:2px;

  color:var(--muted);

  font-size:8px;
}


/* =========================
   MAIN
========================= */

.main{
  min-width:0;
}

.welcome{
  margin-bottom:16px;
}

.welcome h1{
  font-size:24px;
  font-weight:900;
}

.welcome p{
  margin-top:5px;

  color:var(--muted);

  font-size:11px;
}


/* =========================
   CREATE BOX
========================= */

.create-box{
  padding:13px;

  border:1px solid var(--border);

  border-radius:15px;

  background:var(--card);

  margin-bottom:15px;
}

.create-top{
  display:flex;
  align-items:center;

  gap:10px;
}

.create-input{
  flex:1;

  padding:11px 13px;

  border:1px solid var(--border);

  border-radius:20px;

  background:var(--soft);

  color:var(--muted);

  font-size:11px;

  cursor:pointer;
}

.create-actions{
  display:flex;

  gap:6px;

  margin-top:10px;

  padding-left:48px;
}

.create-action{
  padding:7px 10px;

  border:0;

  border-radius:8px;

  background:var(--soft);

  color:var(--text);

  font-family:inherit;

  font-size:9px;
  font-weight:750;

  cursor:pointer;
}


/* =========================
   FEED
========================= */

.feed{
  display:flex;

  flex-direction:column;

  gap:12px;
}

.post{
  padding:15px;

  border:1px solid var(--border);

  border-radius:15px;

  background:var(--card);

  cursor:pointer;
}

.post-head{
  display:flex;
  align-items:center;

  gap:9px;
}

.post-author{
  min-width:0;
  flex:1;
}

.post-author strong{
  display:block;

  font-size:11px;
}

.post-author span{
  display:block;

  margin-top:2px;

  color:var(--muted);

  font-size:8px;
}

.post-text{
  margin-top:12px;

  font-size:12px;

  line-height:1.6;

  white-space:pre-wrap;

  overflow-wrap:anywhere;
}

.post-media{
  width:100%;

  max-height:420px;

  margin-top:12px;

  object-fit:cover;

  border-radius:11px;
}

.post-stats{
  display:flex;

  gap:18px;

  margin-top:13px;

  padding-top:10px;

  border-top:
    1px solid var(--border);

  color:var(--muted);

  font-size:9px;
}


/* =========================
   RIGHT PANEL
========================= */

.right{
  position:sticky;
  top:84px;

  height:max-content;

  display:flex;
  flex-direction:column;

  gap:12px;
}

.widget{
  padding:14px;

  border:1px solid var(--border);

  border-radius:15px;

  background:var(--card);
}

.widget h2{
  font-size:12px;

  margin-bottom:11px;
}

.widget-link{
  width:100%;

  display:flex;
  align-items:center;

  gap:9px;

  padding:9px 0;

  border:0;

  border-bottom:
    1px solid var(--border);

  background:none;

  color:var(--text);

  font-family:inherit;

  font-size:10px;

  text-align:left;

  cursor:pointer;
}

.widget-link:last-child{
  border-bottom:0;
}

.widget-link span:first-child{
  font-size:15px;
}

.view-all{
  width:100%;

  margin-top:8px;

  padding:8px;

  border:0;

  border-radius:8px;

  background:var(--soft);

  font-family:inherit;

  font-size:9px;
  font-weight:800;

  cursor:pointer;
}


/* =========================
   EMPTY / LOADING
========================= */

.loading,
.empty{
  padding:55px 20px;

  text-align:center;

  border:1px solid var(--border);

  border-radius:15px;

  background:var(--card);

  color:var(--muted);

  font-size:11px;
}

.empty{
  display:none;
}

.empty-icon{
  font-size:38px;

  margin-bottom:9px;
}

.empty h2{
  color:var(--text);

  font-size:15px;
}

.empty p{
  margin-top:5px;

  font-size:10px;
}


/* =========================
   ERROR
========================= */

.error{
  display:none;

  margin-bottom:12px;

  padding:10px 12px;

  border:1px solid #fecaca;

  border-radius:9px;

  background:#fef2f2;

  color:#b91c1c;

  font-size:10px;
}

.error.show{
  display:block;
}


/* =========================
   MOBILE
========================= */

@media(max-width:950px){

  .layout{
    grid-template-columns:
      190px
      minmax(0,1fr);
  }

  .right{
    display:none;
  }

}

@media(max-width:650px){

  .topbar{
    height:58px;
  }

  .brand{
    font-size:11px;
  }

  .logo{
    width:35px;
    height:35px;
  }

  .header-actions .icon-btn{
    width:34px;
    height:34px;
  }

  .layout{
    display:block;

    padding:
      15px 10px
      60px;
  }

  .sidebar{
    position:static;

    margin-bottom:13px;
  }

  .side-card{
    display:flex;

    align-items:center;

    gap:4px;

    overflow-x:auto;

    padding:6px;
  }

  .profile-mini{
    display:none;
  }

  .nav-item{
    width:auto;

    flex-shrink:0;

    padding:8px 9px;
  }

  .nav-item span:last-child{
    display:none;
  }

  .nav-icon{
    width:auto;
  }

  .welcome h1{
    font-size:21px;
  }

  .create-actions{
    padding-left:0;
  }

}


/* =========================
   DARK MODE
========================= */

@media(prefers-color-scheme:dark){

  :root{
    --bg:#0f172a;
    --card:#111827;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#263244;
    --soft:#1e293b;
    --primary:#f8fafc;
  }

  .logo{
    color:#111827;
  }

  .icon-btn,
  select,
  textarea,
  .create-input{
    background:var(--soft);
    color:var(--text);
  }

}

</style>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();

const auth =
  firebase.auth();


/* =========================
   STATE
========================= */

let currentUser =
  null;

let unsubscribePosts =
  null;

let unsubscribeNotifications =
  null;


/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function getInitials(
  name
){

  return String(
    name ||
    "Member"
  )
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(
    word =>
      word
        .charAt(0)
        .toUpperCase()
  )
  .join("");

}


function formatTime(
  timestamp
){

  if(!timestamp){

    return "Recently";

  }


  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);


    const diff =
      Date.now() -
      date.getTime();


    const minute =
      60000;

    const hour =
      minute * 60;

    const day =
      hour * 24;


    if(diff < minute){

      return "Now";

    }


    if(diff < hour){

      return `${Math.floor(
        diff / minute
      )}m`;

    }


    if(diff < day){

      return `${Math.floor(
        diff / hour
      )}h`;

    }


    if(diff < day * 7){

      return `${Math.floor(
        diff / day
      )}d`;

    }


    return date.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"short"
      }
    );

  }

  catch{

    return "Recently";

  }

}


function go(
  page
){

  window.location.href =
    page;

}


function createPost(
  type = "text"
){

  window.location.href =
    `create-community.html?type=${encodeURIComponent(
      type
    )}`;

}


function openMessages(){

  go(
    "messages-community.html"
  );

}


function openNotifications(){

  go(
    "notifications-community.html"
  );

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  const element =
    document.getElementById(
      "error"
    );

  element.textContent =
    message;

  element.classList.add(
    "show"
  );

}


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
  async user => {

    currentUser =
      user;


    if(!user){

      document.getElementById(
        "loading"
      ).textContent =
        "Please sign in to access Community.";

      return;

    }


    await loadProfile();

    listenForPosts();

    listenForNotifications();

  }
);


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  try{

    const snapshot =
      await db
        .collection(
          "users"
        )
        .doc(
          currentUser.uid
        )
        .get();


    const data =
      snapshot.exists
        ? snapshot.data()
        : {};


    const name =
      data.displayName ||
      currentUser.displayName ||
      currentUser.email ||
      "Community Member";


    const username =
      data.username ||
      "member";


    const photo =
      data.photoURL ||
      currentUser.photoURL ||
      "";


    document.getElementById(
      "userName"
    ).textContent =
      name;


    document.getElementById(
      "userUsername"
    ).textContent =
      `@${username}`;


    const avatarHTML =
      photo

        ? `
          <img
            src="${escapeHTML(
              photo
            )}"
            alt="${escapeHTML(
              name
            )}"
          >
        `

        : escapeHTML(
            getInitials(
              name
            )
          );


    document.getElementById(
      "userAvatar"
    ).innerHTML =
      avatarHTML;


    document.getElementById(
      "createAvatar"
    ).innerHTML =
      avatarHTML;

  }

  catch(error){

    console.error(
      "Profile error:",
      error
    );

  }

}

  
/* =========================
   CREATE POST
========================= */

function createPost(
  type = "text"
){

  if(!currentUser){

    showError(
      "Please sign in first."
    );

    return;

  }

  window.location.href =
    `create-community.html?type=${encodeURIComponent(
      type
    )}`;

}


/* =========================
   NAVIGATION
========================= */

function openMessages(){

  window.location.href =
    "messages-community.html";

}


function openNotifications(){

  window.location.href =
    "notifications-community.html";

}


function openProfile(){

  if(!currentUser){

    showError(
      "Please sign in first."
    );

    return;

  }

  window.location.href =
    `profile-community.html?id=${encodeURIComponent(
      currentUser.uid
    )}`;

}


/* =========================
   POST DETAILS
========================= */

function openPost(
  postId
){

  if(!postId){

    return;

  }

  window.location.href =
    `post-community.html?id=${encodeURIComponent(
      postId
    )}`;

}


/* =========================
   POST RENDER
========================= */

function renderPosts(
  snapshot
){

  const feed =
    document.getElementById(
      "feed"
    );

  const empty =
    document.getElementById(
      "empty"
    );


  feed.innerHTML =
    "";


  if(
    !snapshot ||
    snapshot.empty
  ){

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  snapshot.forEach(
    doc => {

      const data =
        doc.data();

      renderPost(
        doc.id,
        data
      );

    }
  );

}


/* =========================
   SINGLE POST
========================= */

function renderPost(
  postId,
  data
){

  const feed =
    document.getElementById(
      "feed"
    );


  const authorName =
    data.authorName ||
    "Community Member";


  const authorPhoto =
    data.authorPhoto ||
    "";


  const avatarHTML =
    authorPhoto

      ? `
        <img
          src="${escapeHTML(
            authorPhoto
          )}"
          alt="${escapeHTML(
            authorName
          )}"
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      `

      : escapeHTML(
          getInitials(
            authorName
          )
        );


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "post";


  let mediaHTML =
    "";


  if(
    Array.isArray(
      data.media
    )
  ){

    mediaHTML =
      data.media
        .filter(
          item =>
            typeof item ===
            "string"
        )
        .slice(
          0,
          4
        )
        .map(
          url => `

            <img
              class="post-media"
              src="${escapeHTML(
                url
              )}"
              alt="Post media"
              loading="lazy"
              referrerpolicy="no-referrer"
            >

          `
        )
        .join("");

  }

  else if(
    typeof data.media ===
    "string" &&
    data.media.trim()
  ){

    mediaHTML =
      `

        <img
          class="post-media"
          src="${escapeHTML(
            data.media
          )}"
          alt="Post media"
          loading="lazy"
          referrerpolicy="no-referrer"
        >

      `;

  }


  const groupHTML =
    data.groupId

      ? `
        <span>
          👥 Group
        </span>
      `

      : "";


  const categoryHTML =
    data.categoryId

      ? `
        <span>
          # Community
        </span>
      `

      : "";


  card.innerHTML =
    `

      <div class="post-head">

        <div class="avatar">

          ${avatarHTML}

        </div>


        <div class="post-author">

          <strong>
            ${escapeHTML(
              authorName
            )}
          </strong>

          <span>

            ${escapeHTML(
              formatTime(
                data.createdAt
              )
            )}

          </span>

        </div>

      </div>


      <div
        class="post-meta"
        style="
          display:flex;
          gap:8px;
          margin-top:8px;
          color:var(--muted);
          font-size:8px;
        "
      >

        ${groupHTML}

        ${categoryHTML}

      </div>


      ${
        data.text
          ? `

            <div class="post-text">

              ${escapeHTML(
                data.text
              )}

            </div>

          `
          : ""
      }


      ${mediaHTML}


      <div class="post-stats">

        <span>
          ❤️ ${Number(
            data.likeCount || 0
          )}
        </span>

        <span>
          💬 ${Number(
            data.commentCount || 0
          )}
        </span>

        <span>
          ↗️ ${Number(
            data.shareCount || 0
          )}
        </span>

        <span>
          🔖 ${Number(
            data.saveCount || 0
          )}
        </span>

      </div>

    `;


  card.addEventListener(
    "click",
    event => {

      if(
        event.target.closest(
          "button,a"
        )
      ){

        return;

      }

      openPost(
        postId
      );

    }
  );


  feed.appendChild(
    card
  );

}


/* =========================
   LOAD POSTS
========================= */

function listenForPosts(){

  if(
    unsubscribePosts
  ){

    unsubscribePosts();

  }


  unsubscribePosts =
    db
      .collection(
        "posts"
      )
      .where(
        "status",
        "==",
        "published"
      )
      .orderBy(
        "createdAt",
        "desc"
      )
      .limit(
        30
      )
      .onSnapshot(

        snapshot => {

          const loading =
            document.getElementById(
              "loading"
            );


          loading.style.display =
            "none";


          renderPosts(
            snapshot
          );

        },

        error => {

          console.error(
            "Posts error:",
            error
          );


          document.getElementById(
            "loading"
          ).style.display =
            "none";


          showError(
            "Unable to load Community posts."
          );

        }

      );

}


/* =========================
   NOTIFICATIONS
========================= */

function listenForNotifications(){

  if(
    !currentUser
  ){

    return;

  }


  if(
    unsubscribeNotifications
  ){

    unsubscribeNotifications();

  }


  unsubscribeNotifications =
    db
      .collection(
        "notifications"
      )
      .where(
        "userId",
        "==",
        currentUser.uid
      )
      .where(
        "isRead",
        "==",
        false
      )
      .limit(
        50
      )
      .onSnapshot(

        snapshot => {

          updateBadge(
            "notificationBadge",
            snapshot.size
          );

        },

        error => {

          console.error(
            "Notification error:",
            error
          );

        }

      );

}


/* =========================
   UPDATE BADGE
========================= */

function updateBadge(
  elementId,
  count
){

  const badge =
    document.getElementById(
      elementId
    );


  if(!badge){

    return;

  }


  if(
    Number(count) > 0
  ){

    badge.textContent =
      count > 99
        ? "99+"
        : String(count);

    badge.style.display =
      "flex";

  }

  else{

    badge.textContent =
      "";

    badge.style.display =
      "none";

  }

}


/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(
  async user => {

    currentUser =
      user;


    if(!user){

      document.getElementById(
        "loading"
      ).style.display =
        "none";


      showError(
        "Please sign in to access the Community."
      );

      return;

    }


    await loadProfile();

    listenForPosts();

    listenForNotifications();

  }
);


/* =========================
   SEARCH / KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      const error =
        document.getElementById(
          "error"
        );


      error.classList.remove(
        "show"
      );

    }

  }
);


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(
      unsubscribePosts
    ){

      unsubscribePosts();

    }


    if(
      unsubscribeNotifications
    ){

      unsubscribeNotifications();

    }

  }
);


/* =========================
   FINAL ERROR HANDLER
========================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled Community error:",
      event.reason
    );

  }
);


/* =========================
   INITIAL STATE
========================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const loading =
      document.getElementById(
        "loading"
      );


    if(loading){

      loading.style.display =
        "block";

    }

  }
);

</script>

</body>

</html>
