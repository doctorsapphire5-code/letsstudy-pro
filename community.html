<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Community | LetsStudy Pro</title>

  <meta
    name="description"
    content="LetsStudy Pro Community — connect, learn, discuss, share knowledge and grow together."
  >

  <link rel="icon" href="favicon.ico">

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --primary-soft:#eef4ff;
      --text:#172033;
      --muted:#7b8799;
      --border:#e7ebf1;
      --bg:#f5f7fb;
      --card:#ffffff;
      --danger:#ef4444;
      --success:#16a34a;
      --warning:#f59e0b;
      --radius:16px;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:Inter,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.5;
    }

    body.modal-open{
      overflow:hidden;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      max-width:100%;
    }

    .app{
      min-height:100vh;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .topbar{
      position:sticky;
      top:0;
      z-index:1000;
      height:68px;
      padding:0 25px;
      display:flex;
      align-items:center;
      gap:20px;
      background:#fff;
      border-bottom:1px solid var(--border);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:205px;
      font-size:18px;
      font-weight:800;
    }

    .brand-logo{
      width:39px;
      height:39px;
      border-radius:11px;
      display:grid;
      place-items:center;
      background:var(--primary);
      color:#fff;
    }

    .brand span{
      color:var(--primary);
    }

    .search-box{
      flex:1;
      max-width:620px;
      position:relative;
    }

    .search-box i{
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      color:#9aa4b3;
    }

    .search-box input{
      width:100%;
      height:43px;
      border:1px solid var(--border);
      border-radius:12px;
      outline:none;
      background:#f8fafc;
      padding:0 15px 0 43px;
    }

    .search-box input:focus{
      border-color:var(--primary);
      background:#fff;
    }

    .header-actions{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .icon-button{
      position:relative;
      width:40px;
      height:40px;
      border:0;
      border-radius:11px;
      background:#f4f6f9;
      color:#586477;
    }

    .icon-button:hover{
      background:var(--primary-soft);
      color:var(--primary);
    }

    .notification-dot{
      position:absolute;
      right:7px;
      top:7px;
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--danger);
      border:2px solid #fff;
    }

    .user-menu{
      display:flex;
      align-items:center;
      gap:9px;
      margin-left:7px;
      cursor:pointer;
    }

    .user-menu img{
      width:39px;
      height:39px;
      border-radius:50%;
      object-fit:cover;
      background:#e8edf6;
    }

    .user-menu strong{
      font-size:12px;
      max-width:110px;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    /* =====================================================
       LAYOUT
    ===================================================== */

    .layout{
      width:min(1500px,100%);
      margin:auto;
      padding:24px;
      display:grid;
      grid-template-columns:225px minmax(0,1fr) 285px;
      gap:23px;
    }

    .left-sidebar{
      position:sticky;
      top:92px;
      height:max-content;
    }

    .right-sidebar{
      position:sticky;
      top:92px;
      height:max-content;
    }

    .main{
      min-width:0;
    }

    /* =====================================================
       NAVIGATION
    ===================================================== */

    .nav-heading{
      margin:0 0 9px 11px;
      font-size:10px;
      font-weight:800;
      color:#a0a8b5;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .nav-heading.spaced{
      margin-top:23px;
    }

    .nav-item{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
      padding:11px 13px;
      margin-bottom:4px;
      border:0;
      border-radius:11px;
      background:transparent;
      color:#5c687a;
      text-align:left;
      font-size:12px;
      font-weight:500;
    }

    .nav-item i{
      width:19px;
      text-align:center;
    }

    .nav-item:hover,
    .nav-item.active{
      background:var(--primary-soft);
      color:var(--primary);
      font-weight:700;
    }

    /* =====================================================
       HERO
    ===================================================== */

    .hero{
      position:relative;
      overflow:hidden;
      padding:29px;
      margin-bottom:19px;
      border-radius:20px;
      color:#fff;
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );
    }

    .hero:before{
      content:"";
      position:absolute;
      width:240px;
      height:240px;
      border:34px solid rgba(255,255,255,.08);
      border-radius:50%;
      right:-80px;
      top:-90px;
    }

    .hero-content{
      position:relative;
      z-index:2;
    }

    .hero-badge{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-bottom:11px;
      padding:7px 11px;
      border-radius:30px;
      background:rgba(255,255,255,.13);
      font-size:10px;
      font-weight:800;
    }

    .hero h1{
      margin-bottom:7px;
      font-size:28px;
      line-height:1.25;
    }

    .hero p{
      max-width:690px;
      color:#e9edff;
      font-size:13px;
    }

    /* =====================================================
       CARDS
    ===================================================== */

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      overflow:hidden;
      margin-bottom:18px;
    }

    .card-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px 18px;
      border-bottom:1px solid #edf0f4;
    }

    .card-header h3{
      font-size:14px;
    }

    .card-body{
      padding:18px;
    }

    /* =====================================================
       CREATE POST
    ===================================================== */

    .create-post{
      display:flex;
      align-items:center;
      gap:11px;
      padding:17px;
    }

    .avatar{
      width:43px;
      height:43px;
      flex:none;
      border-radius:50%;
      object-fit:cover;
      background:#e8edf6;
    }

    .post-trigger{
      flex:1;
      min-height:43px;
      padding:10px 14px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#f8fafc;
      color:#929baa;
      text-align:left;
      font-size:12px;
    }

    .post-trigger:hover{
      background:#fff;
      border-color:var(--primary);
    }

    .quick-actions{
      display:flex;
      gap:8px;
      padding:0 17px 16px 71px;
      flex-wrap:wrap;
    }

    .quick-button{
      border:0;
      padding:7px 10px;
      border-radius:9px;
      background:#f3f5f8;
      color:#586477;
      font-size:11px;
    }

    .quick-button:hover{
      color:var(--primary);
      background:var(--primary-soft);
    }

    /* =====================================================
       POST
    ===================================================== */

    .post{
      padding:19px;
    }

    .post-author{
      display:flex;
      align-items:center;
      gap:11px;
    }

    .post-author-info{
      flex:1;
      min-width:0;
    }

    .post-author-info strong{
      display:block;
      font-size:13px;
    }

    .post-meta{
      margin-top:2px;
      color:#98a1b0;
      font-size:10px;
    }

    .post-menu{
      width:34px;
      height:34px;
      border:0;
      border-radius:9px;
      background:transparent;
      color:#8b95a4;
    }

    .post-menu:hover{
      background:#f3f5f8;
    }

    .post-content{
      padding:15px 0 12px;
    }

    .post-content h3{
      margin-bottom:7px;
      font-size:16px;
    }

    .post-content p{
      color:#596579;
      font-size:13px;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .post-category{
      display:inline-flex;
      margin-bottom:9px;
      padding:5px 9px;
      border-radius:20px;
      background:var(--primary-soft);
      color:var(--primary);
      font-size:9px;
      font-weight:800;
      text-transform:uppercase;
    }

    .post-tags{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .tag{
      padding:5px 9px;
      border-radius:20px;
      background:#f1f4f8;
      color:#667286;
      font-size:10px;
    }

    .post-stats{
      display:flex;
      justify-content:space-between;
      padding:9px 0;
      border-bottom:1px solid #edf0f4;
      color:#8993a3;
      font-size:10px;
    }

    .post-actions{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:4px;
      padding-top:8px;
    }

    .post-action{
      border:0;
      border-radius:9px;
      background:transparent;
      padding:9px 5px;
      color:#647084;
      font-size:11px;
    }

    .post-action:hover,
    .post-action.active{
      background:var(--primary-soft);
      color:var(--primary);
    }

    /* =====================================================
       RIGHT SIDEBAR
    ===================================================== */

    .profile-card{
      padding:20px;
      text-align:center;
    }

    .profile-card .avatar{
      width:65px;
      height:65px;
      margin:auto;
    }

    .profile-card h3{
      margin-top:9px;
      font-size:15px;
    }

    .profile-card p{
      color:#8d97a6;
      font-size:11px;
    }

    .profile-stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      margin-top:15px;
      padding-top:14px;
      border-top:1px solid #edf0f4;
    }

    .profile-stat strong{
      display:block;
      font-size:14px;
    }

    .profile-stat span{
      display:block;
      margin-top:2px;
      color:#99a2b0;
      font-size:9px;
    }

    .trend-item{
      display:flex;
      gap:10px;
      padding:11px 0;
      border-bottom:1px solid #edf0f4;
    }

    .trend-item:last-child{
      border-bottom:0;
    }

    .trend-number{
      color:var(--primary);
      font-weight:800;
      font-size:12px;
    }

    .trend-item strong{
      display:block;
      font-size:11px;
    }

    .trend-item span{
      display:block;
      color:#9aa3b1;
      font-size:9px;
      margin-top:2px;
    }

    .group-item{
      display:flex;
      align-items:center;
      gap:9px;
      padding:10px 0;
      border-bottom:1px solid #edf0f4;
    }

    .group-item:last-child{
      border-bottom:0;
    }

    .group-icon{
      width:37px;
      height:37px;
      display:grid;
      place-items:center;
      border-radius:9px;
      background:var(--primary-soft);
      color:var(--primary);
    }

    .group-info{
      flex:1;
      min-width:0;
    }

    .group-info strong{
      display:block;
      font-size:11px;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .group-info span{
      color:#99a2b0;
      font-size:9px;
    }

    /* =====================================================
       BUTTONS
    ===================================================== */

    .btn{
      border:0;
      border-radius:9px;
      padding:9px 13px;
      font-size:11px;
      font-weight:700;
    }

    .btn-primary{
      color:#fff;
      background:var(--primary);
    }

    .btn-primary:hover{
      background:var(--primary-dark);
    }

    .btn-secondary{
      color:#5c687a;
      background:#eef1f5;
    }

    .btn-danger{
      color:#fff;
      background:var(--danger);
    }

    /* =====================================================
       MODALS
    ===================================================== */

    .modal{
      position:fixed;
      inset:0;
      z-index:5000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(15,23,42,.58);
    }

    .modal.show{
      display:flex;
    }

    .modal-box{
      width:min(680px,100%);
      max-height:90vh;
      overflow:auto;
      border-radius:18px;
      background:#fff;
      box-shadow:0 30px 80px rgba(0,0,0,.22);
    }

    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:17px 19px;
      border-bottom:1px solid var(--border);
    }

    .modal-header h2{
      font-size:17px;
    }

    .close-button{
      width:35px;
      height:35px;
      border:0;
      border-radius:9px;
      background:#f1f4f7;
      color:#566276;
    }

    .modal-body{
      padding:20px;
    }

    .modal-footer{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      padding:14px 19px;
      border-top:1px solid var(--border);
    }

    .form-group{
      margin-bottom:15px;
    }

    .form-group label{
      display:block;
      margin-bottom:6px;
      font-size:11px;
      font-weight:700;
    }

    .form-control{
      width:100%;
      outline:none;
      border:1px solid #dfe4eb;
      border-radius:10px;
      background:#fff;
      padding:10px 11px;
      font-size:12px;
    }

    .form-control:focus{
      border-color:var(--primary);
    }

    textarea.form-control{
      min-height:130px;
      resize:vertical;
    }

    .form-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:13px;
    }

    /* =====================================================
       COMMENTS
    ===================================================== */

    .comment{
      display:flex;
      gap:9px;
      padding:12px 0;
      border-bottom:1px solid #edf0f4;
    }

    .comment:last-child{
      border-bottom:0;
    }

    .comment .avatar{
      width:35px;
      height:35px;
    }

    .comment-content{
      flex:1;
    }

    .comment-content strong{
      font-size:11px;
    }

    .comment-content p{
      margin-top:3px;
      color:#596579;
      font-size:12px;
    }

    .comment-date{
      display:block;
      margin-top:3px;
      color:#9ba4b1;
      font-size:9px;
    }

    .comment-form{
      display:flex;
      gap:8px;
      padding:14px 19px;
      border-top:1px solid var(--border);
    }

    .comment-form input{
      flex:1;
    }

    /* =====================================================
       LOADING / EMPTY / ERROR
    ===================================================== */

    .loading,
    .empty-state,
    .error-state{
      padding:42px 20px;
      text-align:center;
      color:#8d97a6;
    }

    .loading i,
    .empty-state > i,
    .error-state > i{
      display:block;
      margin-bottom:10px;
      font-size:29px;
      color:#c1c8d4;
    }

    .empty-state h3,
    .error-state h3{
      margin-bottom:5px;
      color:#596579;
      font-size:14px;
    }

    .empty-state p,
    .error-state p{
      font-size:11px;
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast{
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:7000;
      display:none;
      max-width:340px;
      padding:12px 16px;
      border-radius:10px;
      background:#172033;
      color:#fff;
      box-shadow:0 15px 40px rgba(0,0,0,.2);
      font-size:11px;
    }

    .toast.show{
      display:block;
      animation:toastIn .2s ease;
    }

    @keyframes toastIn{
      from{
        opacity:0;
        transform:translateY(8px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:1150px){

      .layout{
        grid-template-columns:205px minmax(0,1fr);
      }

      .right-sidebar{
        display:none;
      }

    }

    @media(max-width:760px){

      .topbar{
        height:62px;
        padding:0 12px;
        gap:9px;
      }

      .brand{
        min-width:auto;
      }

      .brand-text{
        display:none;
      }

      .search-box{
        max-width:none;
      }

      .user-menu strong{
        display:none;
      }

      .layout{
        display:block;
        padding:13px;
      }

      .left-sidebar{
        position:static;
        overflow-x:auto;
        margin-bottom:14px;
      }

      .left-sidebar > div{
        display:flex;
        gap:4px;
        width:max-content !important;
      }

      .nav-heading{
        display:none;
      }

      .nav-heading.spaced{
        display:none;
      }

      .nav-item{
        width:auto;
        white-space:nowrap;
        margin:0;
      }

      .hero{
        padding:22px;
      }

      .hero h1{
        font-size:22px;
      }

      .quick-actions{
        padding-left:17px;
      }

      .post-actions{
        grid-template-columns:repeat(2,1fr);
      }

      .form-row{
        grid-template-columns:1fr;
      }

    }

    @media(max-width:450px){

      .header-actions .icon-button:nth-child(2){
        display:none;
      }

      .hero p{
        font-size:11px;
      }

      .create-post{
        align-items:flex-start;
      }

      .post-trigger{
        font-size:11px;
      }

    }

  </style>
</head>


<body>

<div class="app">


  <!-- =====================================================
       TOPBAR
  ====================================================== -->

  <header class="topbar">

    <a
      href="index.html"
      class="brand"
    >

      <div class="brand-logo">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>

      <div class="brand-text">
        LetsStudy <span>Pro</span>
      </div>

    </a>


    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        type="search"
        id="searchInput"
        placeholder="Search community..."
      >

    </div>


    <div class="header-actions">

      <button
        class="icon-button"
        id="notificationButton"
        title="Notifications"
      >

        <i class="fa-regular fa-bell"></i>

        <span
          class="notification-dot"
          id="notificationDot"
          style="display:none;"
        ></span>

      </button>


      <button
        class="icon-button"
        id="messageButton"
        title="Messages"
      >

        <i class="fa-regular fa-comment-dots"></i>

      </button>


      <div
        class="user-menu"
        id="userMenu"
      >

        <img
          id="headerAvatar"
          src="assets/images/avatar.png"
          alt="Profile"
        >

        <strong id="headerName">
          Guest
        </strong>

      </div>

    </div>

  </header>


  <!-- =====================================================
       MAIN LAYOUT
  ===========================================
<!-- ===========================================
     MAIN LAYOUT
     =========================================== -->
<main class="container">

  <div class="layout">

    <!-- ===========================================
         COMMUNITY FEED
         =========================================== -->

    <section class="feed-section">

      <!-- CREATE POST -->
      <div class="box create-post">

        <div class="create-head">

          <img
            id="currentAvatar"
            class="avatar"
            src="https://via.placeholder.com/100"
            alt="User"
          >

          <div>
            <strong id="currentUserName">
              Community Member
            </strong>

            <small>
              Share with the community
            </small>
          </div>

        </div>

        <textarea
          id="postText"
          placeholder="What would you like to share?"
        ></textarea>

        <div class="post-options">

          <input
            type="url"
            id="postImage"
            placeholder="Image URL (optional)"
          >

          <select id="postCategory">

            <option value="General">
              General
            </option>

            <option value="Study">
              Study
            </option>

            <option value="Career">
              Career
            </option>

            <option value="Scholarship">
              Scholarship
            </option>

            <option value="Technology">
              Technology
            </option>

            <option value="Business">
              Business
            </option>

          </select>

          <button
            id="publishPost"
            class="primary"
            type="button">

            <i class="fa-solid fa-paper-plane"></i>
            Post

          </button>

        </div>

      </div>


      <!-- FEED HEADER -->

      <div class="feed-header">

        <div>

          <h2>
            Community Feed
          </h2>

          <span id="postCount">
            Latest discussions
          </span>

        </div>

        <select id="feedFilter">

          <option value="all">
            All Posts
          </option>

          <option value="Study">
            Study
          </option>

          <option value="Career">
            Career
          </option>

          <option value="Scholarship">
            Scholarship
          </option>

<!-- ===========================================
     POST DETAILS MODAL

<div
  id="postModal"
  class="modal">

  <div class="modal-box">

    <button
      id="closeModal"

<!-- ===========================================
     FIREBASE
     =========================================== -->

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  doc,
  increment,
  serverTimestamp,
  query,
  orderBy,
  limit
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* ===========================================
   FIREBASE CONFIG
   =========================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


const auth =
  getAuth(app);



/* ===========================================
   GLOBAL STATE
   =========================================== */

let currentUser = null;

let allPosts = [];

let allGroups = [];



/* ===========================================
   ELEMENTS
   =========================================== */

const feed =
  document.getElementById("feed");

const groups =
  document.getElementById("groups");

const postText =
  document.getElementById("postText");

const postImage =
  document.getElementById("postImage");

const postCategory =
  document.getElementById("postCategory");

const feedFilter =
  document.getElementById("feedFilter");



/* ===========================================
   ESCAPE HTML
   =========================================== */

function esc(value = "") {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}



/* ===========================================
   ARRAY HELPER
   =========================================== */

function toArray(value) {

  if (Array.isArray(value)) {

    return value;

  }

  if (typeof value === "string") {

    return value
      .split(",")
      .map(x => x.trim())
      .filter(Boolean);

  }

  return [];

}



/* ===========================================
   AUTH
   =========================================== */

onAuthStateChanged(
  auth,
  user => {

    currentUser = user;

    const name =
      document.getElementById(
        "currentUserName"
      );

    const avatar =
      document.getElementById(
        "currentAvatar"
      );


    if (user) {

      name.textContent =
        user.displayName ||
        "Community Member";

      avatar.src =
        user.photoURL ||
        "https://via.placeholder.com/100";

    } else {

      name.textContent =
        "Guest Member";

    }

  }
);



/* ===========================================
   LOAD POSTS
   =========================================== */

async function loadPosts() {

  try {

    const postsQuery = query(

      collection(
        db,
        "communityPosts"
      ),

      orderBy(
        "createdAt",
        "desc"
      ),

      limit(50)

    );


    const snapshot =
      await getDocs(postsQuery);


    allPosts = [];


    snapshot.forEach(item => {

      allPosts.push({

        id: item.id,

        ...item.data()

      });

    });


    renderPosts();

    updateStats();

  } catch (error) {

    console.error(
      "Posts error:",
      error
    );


    feed.innerHTML = `

      <div class="box empty">

        <i class="fa-solid fa-triangle-exclamation"></i>

        <h3>
          Unable to load posts
        </h3>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}



/* ===========================================
   RENDER POSTS
   =========================================== */

function renderPosts() {

  const filter =
    feedFilter.value;


  const posts =
    allPosts.filter(post => {

      if (
        !post.status ||
        post.status === "published"
      ) {

        if (
          filter === "all"
        ) {

          return true;

        }

        return (
          post.category === filter
        );

      }

      return false;

    });


  document.getElementById(
    "postCount"
  ).textContent =
    `${posts.length} posts`;


  if (!posts.length) {

    feed.innerHTML = `

      <div class="box empty">

        <i class="fa-solid fa-comments"></i>

        <h3>
          No posts found
        </h3>

        <p>
          Start a new discussion.
        </p>

      </div>

    `;

    return;

  }


  feed.innerHTML =
    posts.map(
      createPost
    ).join("");

}



/* ===========================================
   CREATE POST CARD
   =========================================== */

function createPost(post) {

  const date =
    post.createdAt?.toDate
      ? post.createdAt
          .toDate()
          .toLocaleDateString(
            undefined,
            {
              day: "numeric",
              month: "short",
              year: "numeric"
            }
          )
      : "Recently";


  const avatar =
    post.userAvatar ||
    "https://via.placeholder.com/100";


  return `

    <article
      class="box post-card"
      id="post-${post.id}">


      <div class="post-head">

        <img
          class="avatar"
          src="${esc(avatar)}"
          alt="User">


        <div class="post-user-info">

          <strong>

            ${esc(
              post.userName ||
              "Community Member"
            )}

          </strong>

          <small>

            ${date}

            ${
              post.category
                ? ` • ${esc(
                    post.category
                  )}`
                : ""
            }

          </small>

        </div>

      </div>



      <div class="post-content">

        ${esc(
          post.content || ""
        )}

      </div>



      ${
        post.imageUrl

        ?

        `

        <img
          class="post-image"
          src="${esc(
            post.imageUrl
          )}"
          alt="Post image"
          loading="lazy">

        `

        : ""

      }



      <div class="post-actions">


        <button
          type="button"
          onclick="likePost('${post.id}')">

          <i class="fa-regular fa-heart"></i>

          <span>
            ${Number(
              post.likes || 0
            )}
          </span>

        </button>



        <button
          type="button"
          onclick="openPost('${post.id}')">

          <i class="fa-regular fa-comment"></i>

          <span>
            ${Number(
              post.commentsCount || 0
            )}
          </span>

        </button>



        <button
          type="button"
          onclick="sharePost('${post.id}')">

          <i class="fa-solid fa-share"></i>

          <span>
            ${Number(
              post.shares || 0
            )}
          </span>

        </button>


      </div>


    </article>

  `;

}



/* ===========================================
   CREATE POST
   =========================================== */

document
  .getElementById("publishPost")
  .addEventListener(
    "click",
    async () => {

      if (!currentUser) {

        alert(
          "Please login first."
        );

        location.href =
          "login.html";

        return;

      }


      const content =
        postText.value.trim();


      if (!content) {

        alert(
          "Write something first."
        );

        postText.focus();

        return;

      }


      const button =
        document.getElementById(
          "publishPost"
        );


      button.disabled = true;

      button.innerHTML =
        `<i class="fa fa-spinner fa-spin"></i> Posting...`;


      try {

        await addDoc(

          collection(
            db,
            "communityPosts"
          ),

          {

            userId:
              currentUser.uid,

            userName:
              currentUser.displayName ||
              "Community Member",

            userAvatar:
              currentUser.photoURL ||
              "",

            content:

              content,

            imageUrl:

              postImage.value.trim(),

            category:

              postCategory.value,

            groupId:

              "",

            likes: 0,

            commentsCount: 0,

            shares: 0,

            status:
              "published",

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()

          }

        );


        postText.value = "";

        postImage.value = "";


        await loadPosts();


      } catch (error) {

        console.error(error);

        alert(
          "Unable to publish post."
        );

      }


      button.disabled = false;

      button.innerHTML =
        `<i class="fa-solid fa-paper-plane"></i> Post`;

    }
  );



/* ===========================================
   FILTER
   =========================================== */

feedFilter.addEventListener(
  "change",
  renderPosts
);



/* ===========================================
   LOAD GROUPS
   =========================================== */

async function loadGroups() {

  try {

    const snapshot =
      await getDocs(

        collection(
          db,
          "communityGroups"
        )

      );


    allGroups = [];


    snapshot.forEach(item => {

      allGroups.push({

        id: item.id,

        ...item.data()

      });

    });


    renderGroups();

    updateStats();

  } catch (error) {

    console.error(error);

    groups.innerHTML = `

      <div class="side-loading">

        Unable to load groups.

      </div>

    `;

  }

}



/* ===========================================
   RENDER GROUPS
   =========================================== */

function renderGroups() {

  const published =
    allGroups
      .filter(
        group =>
          !group.status ||
          group.status === "published"
      )
      .sort(
        (a,b) =>
          Number(
            b.featured || false
          ) -
          Number(
            a.featured || false
          )
      )
      .slice(0,5);


  if (!published.length) {

    groups.innerHTML = `

      <div class="side-loading">

        No study groups yet.

      </div>

    `;

    return;

  }


  groups.innerHTML =
    published.map(group => `

      <a
        href="group.html?id=${encodeURIComponent(
          group.id
        )}"
        class="group">


        <img
          src="${esc(
            group.imageUrl ||
            "https://via.placeholder.com/100"
          )}"
          alt="">


        <div>

          <strong>
            ${esc(
              group.name ||
              "Study Group"
            )}
          </strong>

          <small>

            ${Number(
              group.membersCount || 0
            ).toLocaleString()}

            members

          </small>

        </div>


      </a>

    `).join("");

}



/* ===========================================
   LIKE POST
   =========================================== */

window.likePost =
async function(id) {

  try {

    await updateDoc(

      doc(
        db,
        "communityPosts",
        id
      ),

      {

        likes:
          increment(1)

      }

    );


    const post =
      allPosts.find(
        p => p.id === id
      );


    if (post) {

      post.likes =
        Number(
          post.likes || 0
        ) + 1;

    }


    renderPosts();


  } catch (error) {

    console.error(error);

  }

};



/* ===========================================
   SHARE POST
   =========================================== */

window.sharePost =
async function(id) {

  const url =
    `${location.origin}${
      location.pathname
    }?post=${encodeURIComponent(
      id
    )}`;


  try {

    if (
      navigator.share
    ) {

      await navigator.share({

        title:
          "LetsStudy Pro Community",

        text:
          "Check out this community post.",

        url

      });

    } else {

      await navigator.clipboard
        .writeText(url);

      alert(
        "Post link copied."
      );

    }


    await updateDoc(

      doc(
        db,
        "communityPosts",
        id
      ),

      {

        shares:
          increment(1)

      }

    );


  } catch(error) {

    console.log(error);

  }

};



/* ===========================================
   OPEN POST
   =========================================== */

window.openPost =
function(id) {

  const post =
    allPosts.find(
      p => p.id === id
    );


  if (!post) return;


  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <h2>
      Community Post
    </h2>

    <div class="post-content">

      ${esc(
        post.content || ""
      )}

    </div>

    <a
      class="primary modal-link"
      href="post.html?id=${encodeURIComponent(
        id
      )}">

      Open Discussion

    </a>

  `;


  document
    .getElementById(
      "postModal"
    )
    .classList.add("show");

};



/* ===========================================
   CLOSE MODAL
   =========================================== */

document
  .getElementById("closeModal")
  .onclick = () => {

    document
      .getElementById(
        "postModal"
      )
      .classList.remove(
        "show"
      );

  };



/* ===========================================
   COMMUNITY STATS
   =========================================== */

async function updateStats() {

  document.getElementById(
    "postsTotal"
  ).textContent =
    allPosts.length;


  document.getElementById(
    "groupsCount"
  ).textContent =
    allGroups.length;


  let members = 0;


  allGroups.forEach(
    group => {

      members +=
        Number(
          group.membersCount || 0
        );

    }
  );


  document.getElementById(
    "membersCount"
  ).textContent =
    members.toLocaleString();

}



/* ===========================================
   START
   =========================================== */

loadPosts();

loadGroups();

</script>

</body>
