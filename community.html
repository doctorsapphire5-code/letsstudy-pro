<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LetsStudy Community</title><style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#172033;font-family:Arial,sans-serif}
header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:20}
.logo{font-size:21px;font-weight:800;color:#2563eb}
.search{margin-left:25px;flex:1;max-width:450px}
.search input{width:100%;padding:11px 15px;border:1px solid #dbe1ea;border-radius:25px}
.profile{margin-left:auto;font-weight:600}
.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:230px 1fr 260px;gap:20px;padding:20px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 3px 15px #00000008;margin-bottom:15px}
.side a{display:block;padding:11px;border-radius:9px;text-decoration:none;color:#374151;margin:3px 0}
.side a:hover,.side a.active{background:#dbeafe;color:#1d4ed8}
.create textarea{width:100%;border:1px solid #dbe1ea;border-radius:10px;padding:12px;resize:none}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.primary{background:#2563eb;color:#fff}
.post-head{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:#2563eb;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold}
.post-text{margin:15px 0;line-height:1.55}
.actions{display:flex;gap:8px;border-top:1px solid #eee;padding-top:10px}
.action{background:none;border:0;cursor:pointer;color:#475569;padding:7px}
.action:hover{color:#2563eb}
.group{padding:11px;border-bottom:1px solid #eee;cursor:pointer}
.group:last-child{border:0}
.group b{display:block}
.muted{color:#64748b;font-size:13px}
.empty{text-align:center;color:#64748b;padding:30px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:50}
.modal.show{display:flex}
.modal-box{background:white;width:min(450px,94%);padding:20px;border-radius:14px}
.close{float:right;font-size:24px;cursor:pointer}
.comment{display:flex;gap:8px;margin-top:10px}
.comment input{flex:1;padding:9px;border:1px solid #ddd;border-radius:20px}
@media(max-width:950px){
.layout{grid-template-columns:190px 1fr}
.right{display:none}
}
@media(max-width:650px){
.layout{display:block;padding:10px}
.left{display:none}
header{padding:0 10px}
.search{margin-left:10px}
.profile{display:none}
}
</style></head><body><header>
<div class="logo">LetsStudy Community</div><div class="search">
<input id="search" placeholder="Search community..." oninput="renderPosts()">
</div><div class="profile" id="profileName">Loading...</div>
</header><div class="layout"><!-- LEFT --><aside class="left"><div class="card side"><a class="active" href="community.html">🏠 Home</a>
<a href="community-group.html">👥 Groups</a>
<a href="community-chat.html">💬 Chat</a>
<a href="profile.html">👤 Profile</a>
<a href="dashboard.html">📚 Dashboard</a>

</div><div class="card"><b>My Groups</b>

<div id="myGroups">
<div class="empty">Loading...</div>
</div></div></aside><!-- CENTER --><main><div class="card create"><textarea
id="postText"
rows="3"
placeholder="What's on your mind? Share with the community..."></textarea><br><br>

<button class="btn primary" onclick="createPost()">
Post
</button></div><div id="posts"><div class="card empty">
Loading community posts...
</div></div></main><!-- RIGHT --><aside class="right"><div class="card"><h3>Community</h3><p class="muted">
Learn, discuss, collaborate and connect with other students.
</p><hr><p>👥 Members <b id="memberCount">0</b></p>
<p>💬 Posts <b id="postCount">0</b></p>
<p>👥 Groups <b id="groupCount">0</b></p></div><div class="card"><h3>Popular Groups</h3><div id="popularGroups">
<div class="empty">Loading...</div>
</div></div></aside></div><!-- COMMENTS MODAL --><div class="modal" id="commentModal"><div class="modal-box"><span class="close" onclick="closeComments()">×</span>

<h3>Comments</h3><div id="comments"></div><div class="comment"><input
id="commentInput"
placeholder="Write a comment...">

<button class="btn primary"
onclick="addComment()">

Send

</button></div></div></div><script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
getDoc,
updateDoc,
deleteDoc,
serverTimestamp,
query,
orderBy,
limit,
increment
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ===============================
FIREBASE
================================ */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


let currentUser=null;
let posts=[];
let activePostId=null;


/* ===============================
AUTH
================================ */

onAuthStateChanged(auth,async user=>{

if(!user){

location.href="login.html";

return;

}

currentUser=user;

await loadProfile();
await loadPosts();
await loadGroups();
await loadMembers();

});


/* ===============================
PROFILE
================================ */

async function loadProfile(){

try{

const snap=await getDoc(
doc(db,"users",currentUser.uid)
);

const data=snap.exists()
?snap.data()
:{};


const name=
data.displayName ||
data.name ||
currentUser.displayName ||
currentUser.email?.split("@")[0] ||
"Student";


document.getElementById(
"profileName"
).textContent=name;

}catch(error){

console.error(error);

}

}


/* ===============================
POSTS
================================ */

async function loadPosts(){

try{

const q=query(
collection(db,"posts"),
orderBy("createdAt","desc"),
limit(50)
);

const snap=await getDocs(q);

posts=snap.docs.map(d=>({

id:d.id,
...d.data()

}));

renderPosts();

document.getElementById(
"postCount"
).textContent=posts.length;

}catch(error){

console.error(error);

document.getElementById(
"posts"
).innerHTML=`

<div class="card empty">
Unable to load posts.
</div>

`;

}

}


window.renderPosts=function(){

const search=
document.getElementById(
"search"
).value.toLowerCase().trim();


const filtered=posts.filter(p=>{

const text=`

${p.text||""}
${p.authorName||""}

`.toLowerCase();

return text.includes(search);

});


const container=
document.getElementById("posts");


if(!filtered.length){

container.innerHTML=`

<div class="card empty">
No posts found.
</div>

`;

return;

}


container.innerHTML="";


filtered.forEach(post=>{

const likes=
Array.isArray(post.likes)
?post.likes
:[];


const liked=
likes.includes(
currentUser.uid
);


const div=
document.createElement("div");

div.className="card";


div.innerHTML=`

<div class="post-head">

<div class="avatar">

${escapeHTML(
(post.authorName||"S").charAt(0)
.toUpperCase()
)}

</div>

<div>

<b>
${escapeHTML(
post.authorName||"Student"
)}
</b>

<div class="muted">
${formatDate(post.createdAt)}
</div>

</div>

</div>


<div class="post-text">

${escapeHTML(
post.text||""
)}

</div>


<div class="actions">

<button
class="action"
onclick="toggleLike('${post.id}')">

${liked?"❤️":"♡"}
 ${likes.length}

</button>


<button
class="action"
onclick="openComments('${post.id}')">

💬 Comments

</button>


${
post.authorId===currentUser.uid
?

`<button
class="action"
onclick="deletePost('${post.id}')">

🗑️ Delete

</button>`

:""

}

</div>

`;


container.appendChild(div);

});

};


/* ===============================
CREATE POST
================================ */

window.createPost=async function(){

const input=
document.getElementById("postText");


const text=input.value.trim();


if(!text)return;


try{

const snap=await getDoc(
doc(db,"users",currentUser.uid)
);

const data=snap.exists()
?snap.data()
:{};


const authorName=
data.displayName ||
data.name ||
currentUser.displayName ||
currentUser.email?.split("@")[0] ||
"Student";


await addDoc(
collection(db,"posts"),
{

text:text,

authorId:
currentUser.uid,

authorName:authorName,

likes:[],

commentsCount:0,

createdAt:
serverTimestamp()

}
);


input.value="";

await loadPosts();

}catch(error){

console.error(error);

alert("Unable to publish post.");

}

};


/* ===============================
LIKE
================================ */

window.toggleLike=async function(id){

const post=
posts.find(p=>p.id===id);

if(!post)return;


let likes=
Array.isArray(post.likes)
?[...post.likes]
:[];


const index=
likes.indexOf(
currentUser.uid
);


if(index>=0)
likes.splice(index,1);

else
likes.push(
currentUser.uid
);


try{

await updateDoc(
doc(db,"posts",id),
{

likes:likes

}
);

await loadPosts();

}catch(error){

console.error(error);

}

};


/* ===============================
DELETE POST
================================ */

window.deletePost=async function(id){

const post=
posts.find(p=>p.id===id);


if(!post ||
post.authorId!==currentUser.uid)
return;


if(!confirm(
"Delete this post?"
))return;


try{

await deleteDoc(
doc(db,"posts",id)
);

await loadPosts();

}catch(error){

console.error(error);

}

};


/* ===============================
COMMENTS
================================ */

window.openComments=async function(id){

activePostId=id;

document.getElementById(
"commentModal"
).classList.add("show");


await loadComments();

};


async function loadComments(){

const container=
document.getElementById(
"comments"
);


container.innerHTML=
"Loading comments...";


try{

const q=query(
collection(
db,
"posts",
activePostId,
"comments"
),
orderBy(
"createdAt",
"asc"
)
);


const snap=await getDocs(q);


if(snap.empty){

container.innerHTML=
`<p class="muted">
No comments yet.
</p>`;

return;

}


container.innerHTML="";


snap.forEach(d=>{

const c=d.data();


const div=
document.createElement("div");

div.style.marginBottom="12px";


div.innerHTML=`

<b>
${escapeHTML(
c.authorName||"Student"
)}
</b>

<div>
${escapeHTML(
c.text||""
)}
</div>

<div class="muted">
${formatDate(c.createdAt)}
</div>

`;


container.appendChild(div);

});


}catch(error){

console.error(error);

container.innerHTML=
"Unable to load comments.";

}

}


window.addComment=async function(){

const input=
document.getElementById(
"commentInput"
);


const text=input.value.trim();


if(!text ||
!activePostId)
return;


try{

const snap=await getDoc(
doc(db,"users",currentUser.uid)
);

const data=snap.exists()
?snap.data()
:{};


const name=
data.displayName ||
data.name ||
currentUser.displayName ||
"Student";


await addDoc(
collection(
db,
"posts",
activePostId,
"comments"
),
{

text:text,

authorId:
currentUser.uid,

authorName:name,

createdAt:
serverTimestamp()

}
);


await updateDoc(
doc(db,"posts",activePostId),
{

commentsCount:
increment(1)

}
);


input.value="";

await loadComments();

await loadPosts();

}catch(error){

console.error(error);

alert("Unable to add comment.");

}

};


window.closeComments=function(){

document.getElementById(
"commentModal"
).classList.remove("show");

activePostId=null;

};


/* ===============================
GROUPS
================================ */

async function loadGroups(){

try{

const snap=await getDocs(
collection(db,"groups")
);


const groups=
snap.docs.map(d=>({

id:d.id,
...d.data()

}));


document.getElementById(
"groupCount"
).textContent=
groups.length;


const popular=
document.getElementById(
"popularGroups"
);


const my=
document.getElementById(
"myGroups"
);


if(!groups.length){

popular.innerHTML=
`<div class="empty">
No groups yet.
</div>`;

my.innerHTML=
`<div class="empty">
No groups yet.
</div>`;

return;

}


const html=
groups.slice(0,8).map(g=>`

<div
class="group"
onclick="openGroup('${g.id}')">

<b>
👥 ${escapeHTML(
g.name||"Group"
)}
</b>

<span class="muted">

${Number(
g.memberCount||0
)} members

</span>

</div>

`).join("");


popular.innerHTML=html;

my.innerHTML=html;

}catch(error){

console.error(error);

}

}


window.openGroup=function(id){

location.href=
`community-group.html?id=${encodeURIComponent(id)}`;

};


/* ===============================
MEMBERS
================================ */

async function loadMembers(){

try{

const snap=await getDocs(
collection(
db,
"communityMembers"
)
);


document.getElementById(
"memberCount"
).textContent=
snap.size;

}catch(error){

console.error(error);

}

}


/* ===============================
HELPERS
================================ */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function formatDate(timestamp){

if(!timestamp)return"Just now";

try{

const date=
timestamp.toDate
?timestamp.toDate()
:new Date(timestamp);


return date.toLocaleString(
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return"Just now";

}

}

</script></body>
</html>
