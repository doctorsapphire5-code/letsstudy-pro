<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(760px,92%);margin:0 auto;padding:40px 0 70px}
.back{display:inline-block;margin-bottom:14px;font-weight:600;font-size:14px;text-decoration:none}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 20px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:22px}
textarea{width:100%;min-height:90px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.row small{color:var(--muted)}
.btn{border:0;background:var(--p);color:#fff;padding:9px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}}
#count{color:var(--muted);font-size:14px;margin:0 0 12px;min-height:21px}
.cm{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.d1{margin-left:28px}.d2{margin-left:56px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.bd{min-width:0;flex:1}
.hh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.hh b{color:var(--ink);overflow-wrap:anywhere}
.hh time,.mt{font-size:13px;color:var(--muted)}
.tag{padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.tx{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ac{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:8px;font-size:13px;color:var(--muted)}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.lnk:hover{color:var(--p)}
.rbox{margin-top:12px}
.pt{font-weight:700;text-decoration:none;color:var(--ink);overflow-wrap:anywhere}
.pt:hover{color:var(--p)}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.d1{margin-left:14px}.d2{margin-left:28px}.cm{padding:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="community.html">Community</a>
    <a href="communityComments.html" aria-current="page">Comments</a>
  </nav>
</div></header>

<main class="wrap">
  <a class="back" id="back" href="community.html" hidden="">← Back to post</a>
  <h1 id="title">Comments</h1>
  <div id="composer"></div>
  <div id="count" role="status"></div>
  <section id="list"></section>
</main>

<div class="toast" id="toast" role="status"></div>
<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,getDoc,doc,setDoc,updateDoc,increment,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const listEl=$("#list"),countEl=$("#count"),composer=$("#composer");
const p=new URLSearchParams(location.search);
const postId=(p.get("postId")||p.get("post")||p.get("id")||"").trim();

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}

let user=null,list=[],titles={};
const HIDE=/^(deleted|hidden|spam|rejected|removed|blocked)$/i;
const time=c=>{const d=toD(c.createdAt);return d?`<time datetime="${d.toISOString()}" title="${esc(d.toLocaleString())}">${esc(ago(d))}</time>`:""};
const likes=c=>{const n=Number(c.likesCount)||0;return n===1?"1 like":`${n} likes`};
const newest=(a,b)=>(toD(b.createdAt)||0)-(toD(a.createdAt)||0);
const oldest=(a,b)=>(toD(a.createdAt)||0)-(toD(b.createdAt)||0);
const me=()=>user.displayName||(user.email||"").split("@")[0]||"Member";
const postUrl=id=>`community-details.html?type=posts&id=${encodeURIComponent(id)}`;

function avatar(c){
  const ph=safe(c.authorPhoto),n=(c.authorName||"?").trim()[0]||"?";
  return `<div class="av" aria-hidden="true">${ph?`<img src="${esc(ph)}" alt="" loading="lazy" data-n="${esc(n.toUpperCase())}">`:esc(n.toUpperCase())}</div>`;
}

/* ---------- Thread for one post ---------- */
const visible=c=>!HIDE.test(c.status||"")&&(!/^pending$/i.test(c.status||"")||(user&&c.userId===user.uid));

function commentCard(c,dep,kids){
  const own=user&&c.userId===user.uid,pend=/^pending$/i.test(c.status||"");
  const kin=(kids[c.id]||[]).sort(oldest).map(r=>commentCard(r,Math.min(dep+1,2),kids)).join("");
  return `<article class="cm d${dep}" id="c-${esc(c.id)}">${avatar(c)}
    <div class="bd">
      <div class="hh"><b>${esc(c.authorName||"Member")}</b>${time(c)}${pend?`<span class="tag">Awaiting approval</span>`:""}</div>
      <p class="tx">${esc(c.content)}</p>
      <div class="ac"><span>${likes(c)}</span>
        <button class="lnk" type="button" data-reply="${esc(c.id)}">Reply</button>
        ${own?`<button class="lnk" type="button" data-del="${esc(c.id)}">Delete</button>`:""}</div>
      <div class="rbox" id="r-${esc(c.id)}"></div>
    </div></article>${kin}`;
}

function renderThread(){
  const kids={};
  list.forEach(c=>{const k=c.parentId&&list.some(x=>x.id===c.parentId)?c.parentId:"";(kids[k]=kids[k]||[]).push(c)});
  const roots=(kids[""]||[]).sort(newest);
  countEl.textContent=list.length===1?"1 comment":`${list.length} comments`;
  listEl.innerHTML=roots.length?roots.map(c=>commentCard(c,0,kids)).join(""):
    `<div class="state"><h2>No comments yet</h2><p>Be the first to share your thoughts.</p></div>`;
}

function composerHTML(parent){
  return user?`<div class="${parent?"":"box"}"><textarea maxlength="2000" placeholder="${parent?"Write a reply":"Add a comment"}" aria-label="${parent?"Reply":"Comment"}"></textarea>
    <div class="row"><small>Be respectful and keep it relevant.</small><span>${parent?`<button class="btn alt" type="button" data-cancel="1">Cancel</button> `:""}<button class="btn" type="button" data-send="${esc(parent||"")}">Post</button></span></div></div>`
    :`<div class="state"><h2>Join the discussion</h2><p>Sign in to comment and reply.</p><a class="btn" href="login.html">Sign in</a></div>`;
}

async function send(btn){
  const box=btn.closest(".box,.rbox"),ta=box.querySelector("textarea"),text=ta.value.trim();
  if(!text)return;
  btn.disabled=true;
  try{
    const ref=doc(collection(db,"communityComments")),now=new Date().toISOString();
    const data={commentId:ref.id,userId:user.uid,authorName:me(),authorPhoto:user.photoURL||"",createdAt:now,likesCount:"0",
      parentId:btn.dataset.send||"",postId,status:"published",content:text,updatedAt:now};
    await setDoc(ref,data);
    list.push({id:ref.id,...data});
    ta.value="";
    renderThread();btn.disabled=false;
    toast(btn.dataset.send?"Reply posted":"Comment posted");
  }catch(e){console.error(e);toast("Could not post your comment");btn.disabled=false}
}

async function remove(id){
  if(!confirm("Delete this comment?"))return;
  try{
    await updateDoc(doc(db,"communityComments",id),{status:"deleted",updatedAt:new Date().toISOString()});
    list=list.filter(c=>c.id!==id);
    postId?renderThread():renderMine();
    toast("Comment deleted");
  }catch(e){console.error(e);toast("Could not delete the comment")}
}

listEl.addEventListener("click",e=>{
  const r=e.target.closest("[data-reply]"),d=e.target.closest("[data-del]"),
        s=e.target.closest("[data-send]"),c=e.target.closest("[data-cancel]");
  if(r){const b=$("#r-"+CSS.escape(r.dataset.reply));b.innerHTML=b.innerHTML?"":composerHTML(r.dataset.reply);b.querySelector("textarea")?.focus()}
  else if(d)remove(d.dataset.del);
  else if(s)send(s);
  else if(c)c.closest(".rbox").innerHTML="";
});
composer.addEventListener("click",e=>{const s=e.target.closest("[data-send]");if(s)send(s)});
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"&&i.dataset.n)i.replaceWith(document.createTextNode(i.dataset.n))},true);

async function loadThread(){
  $("#back").href=postUrl(postId);$("#back").hidden=false;
  $("#title").textContent="Discussion";
  composer.innerHTML=composerHTML("");
  try{
    const s=await getDocs(query(collection(db,"communityComments"),where("postId","==",postId)));
    list=s.docs.map(d=>({id:d.id,...d.data()})).filter(visible);
  }catch(e){return fail(e,loadThread)}
  renderThread();
}

/* ---------- My comments ---------- */
function renderMine(){
  countEl.textContent=list.length===1?"1 comment":`${list.length} comments`;
  listEl.innerHTML=list.length?list.map(c=>`<article class="cm" id="c-${esc(c.id)}">${avatar(c)}
    <div class="bd">
      <div class="hh"><a class="pt" href="${postUrl(c.postId)}#c-${esc(c.id)}">${esc(titles[c.postId]||"View post")}</a>${time(c)}
        ${c.parentId?`<span class="tag">Reply</span>`:""}${/^(pending)$/i.test(c.status||"")?`<span class="tag">Awaiting approval</span>`:""}</div>
      <p class="tx clamp">${esc(c.content)}</p>
      <div class="ac"><span>${likes(c)}</span><button class="lnk" type="button" data-del="${esc(c.id)}">Delete</button></div>
    </div></article>`).join(""):
    `<div class="state"><h2>No comments yet</h2><p>Comments you write will appear here.</p><a class="btn" href="community.html">Browse community</a></div>`;
}

async function loadMine(){
  $("#title").textContent="My comments";composer.innerHTML="";
  try{
    const s=await getDocs(query(collection(db,"communityComments"),where("userId","==",user.uid)));
    list=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!HIDE.test(c.status||"")).sort(newest);
  }catch(e){return fail(e,loadMine)}
  await Promise.all([...new Set(list.map(c=>c.postId).filter(Boolean))].map(async id=>{
    try{const s=await getDoc(doc(db,"communityPosts",id));if(s.exists()){const d=s.data();titles[id]=d.title||String(d.content||d.text||"").slice(0,70)}}catch{}
  }));
  renderMine();
}

function signedOut(){
  $("#title").textContent="My comments";composer.innerHTML="";countEl.textContent="";
  listEl.innerHTML=`<div class="state"><h2>Sign in to see your comments</h2><p>Your comment history is private to your account.</p><a class="btn" href="login.html">Sign in</a></div>`;
}
function fail(err,retry){
  console.error(err);countEl.textContent="";
  listEl.innerHTML=`<div class="state err"><h2>Unable to load comments</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",retry);
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,u=>{
  user=u;
  if(postId)loadThread();else u?loadMine():signedOut();
});
</script>


</body></html>
