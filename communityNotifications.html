<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(760px,92%);margin:0 auto;padding:44px 0 70px}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0}
.pill{display:inline-block;vertical-align:middle;margin-left:10px;padding:2px 12px;border-radius:999px;background:var(--p);color:#fff;font-size:14px;font-weight:800;letter-spacing:0}
@media(prefers-color-scheme:dark){.pill{color:#0b1220}}
.ib{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.ib:hover:not(:disabled){border-color:var(--p)}
.ib:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
.n{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:12px}
.n.un{border-left-color:var(--p)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.n h2{font-size:17px;line-height:1.35;margin:0;color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.n.un h2{font-weight:800}
.n time{color:var(--muted);font-size:13px;white-space:nowrap}
.msg{margin:6px 0 0;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:12px;font-size:14px}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.go{font-weight:700;text-decoration:none}
.go:hover{text-decoration:underline}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.lnk:hover{color:var(--p)}
.more{display:block;margin:20px auto 0}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.btn{display:inline-block;margin-top:14px;border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.top{flex-direction:column;gap:2px}.n{padding:14px 16px}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="community.html">Community</a>
    <a href="communityNotifications.html" aria-current="page">Notifications</a>
  </nav>
</div></header>

<main class="wrap">
  <div class="head">
    <h1>Notifications<span class="pill" id="pill" hidden=""></span></h1>
    <button class="ib" id="markAll" type="button" hidden="">Mark all as read</button>
  </div>

  <div id="app" hidden="">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="all" aria-selected="true">All</button>
      <button class="tab" role="tab" data-v="unread" aria-selected="false">Unread</button>
    </div>
    <div class="chips" id="chips" hidden=""></div>
    <section id="list"></section>
  </div>
  <div id="msg"></div>
</main>

<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,updateDoc,writeBatch,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const listEl=$("#list"),chipBox=$("#chips");
const PAGE=40;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim(),location.href);return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}

let user=null,all=[],view="all",cat="",shown=PAGE,unsub=null;
const isRead=n=>String(n.read).toLowerCase()==="true";
const kind=n=>String(n.type||"general").toLowerCase();
const markRead=id=>updateDoc(doc(db,"communityNotifications",id),{read:"true"});

function card(n){
  const x=toD(n.createdAt),un=!isRead(n),link=safe(n.link);
  return `<article class="n${un?" un":""}" data-id="${esc(n.id)}">
    <div class="top"><h2>${esc(n.title||"Notification")}</h2>${x?`<time datetime="${x.toISOString()}" title="${esc(x.toLocaleString())}">${esc(ago(x))}</time>`:""}</div>
    ${n.message?`<p class="msg">${esc(n.message)}</p>`:""}
    <div class="act"><span class="b">${esc(cap(kind(n)))}</span>
      ${link?`<a class="go" href="${esc(link)}" data-open="${esc(n.id)}">Open</a>`:""}
      ${un?`<button class="lnk" type="button" data-read="${esc(n.id)}">Mark as read</button>`:""}</div>
  </article>`;
}

function render(){
  const unread=all.filter(n=>!isRead(n)).length;
  $("#pill").textContent=`${unread} new`;$("#pill").hidden=!unread;
  $("#markAll").hidden=!unread;
  const types=[...new Set(all.map(kind))].sort();
  if(cat&&!types.includes(cat))cat="";
  if(types.length<2)chipBox.hidden=true;
  else{
    chipBox.innerHTML=["",...types].map(c=>`<button class="chip" type="button" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c?cap(c):"All types")}</button>`).join("");
    chipBox.hidden=false;
  }
  const items=all.filter(n=>(view==="all"||!isRead(n))&&(!cat||kind(n)===cat));
  listEl.innerHTML=items.length
    ?items.slice(0,shown).map(card).join("")+(items.length>shown?`<button class="ib more" id="more" type="button">Show more (${items.length-shown})</button>`:"")
    :`<div class="state"><h2>${view==="unread"?"You are all caught up":"No notifications yet"}</h2><p>${view==="unread"?"There is nothing new to read.":"Replies, likes, mentions and updates from the community will appear here."}</p></div>`;
}

chipBox.addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.c;shown=PAGE;render()}});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  view=b.dataset.v;shown=PAGE;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  render();
}));

listEl.addEventListener("click",async e=>{
  if(e.target.closest("#more")){shown+=PAGE;render();return}
  const r=e.target.closest("[data-read]");
  if(r){r.disabled=true;try{await markRead(r.dataset.read)}catch(err){console.error(err);r.disabled=false}return}
  const o=e.target.closest("[data-open]");
  if(o){
    const n=all.find(x=>x.id===o.dataset.open);
    if(n&&!isRead(n)){
      e.preventDefault();
      await Promise.race([markRead(n.id).catch(console.error),new Promise(r=>setTimeout(r,1200))]);
      location.href=o.href;
    }
  }
});

$("#markAll").addEventListener("click",async e=>{
  const b=e.currentTarget,ids=all.filter(n=>!isRead(n)).map(n=>n.id);
  b.disabled=true;
  try{
    for(let i=0;i<ids.length;i+=400){
      const batch=writeBatch(db);
      ids.slice(i,i+400).forEach(id=>batch.update(doc(db,"communityNotifications",id),{read:"true"}));
      await batch.commit();
    }
  }catch(err){console.error(err)}
  b.disabled=false;
});

function signedOut(){
  $("#app").hidden=true;$("#pill").hidden=true;$("#markAll").hidden=true;
  $("#msg").innerHTML=`<div class="state"><h2>Sign in to see your notifications</h2><p>Your community notifications are private to your account.</p><a class="btn" href="login.html">Sign in</a></div>`;
}
function fail(err){
  console.error(err);
  $("#app").hidden=true;
  $("#msg").innerHTML=`<div class="state err"><h2>Unable to load notifications</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",listen);
}

/* Live updates: new notifications appear without refreshing */
function listen(){
  if(unsub)unsub();
  unsub=onSnapshot(query(collection(db,"communityNotifications"),where("userId","==",user.uid)),snap=>{
    all=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(toD(b.createdAt)||0)-(toD(a.createdAt)||0));
    $("#msg").innerHTML="";$("#app").hidden=false;
    render();
  },fail);
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,u=>{
  user=u;
  if(unsub){unsub();unsub=null}
  u?listen():signedOut();
});
</script>


</body></html>
