<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8;--heart:#e11d48}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a;--heart:#fb7185}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(740px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 10px}
.lead{font-size:18px;color:var(--muted);margin:0 0 24px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:22px}
.box textarea,.box input,.search,.sort,.dlg textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.search,.sort{background:var(--paper)}
.box textarea,.dlg textarea{min-height:96px;resize:vertical}
.box textarea:focus,.box input:focus,.search:focus,.sort:focus,.dlg textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.row small{color:var(--muted)}
.btn{border:0;background:var(--p);color:#fff;padding:10px 20px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.tools{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1;min-width:0}
.sort{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
.ctx{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
#count{color:var(--muted);font-size:14px;margin:6px 0 12px;min-height:21px}
.post{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.post.pin{border-color:color-mix(in srgb,var(--p) 45%,var(--line))}
.top{display:flex;align-items:center;gap:12px}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who{min-width:0;flex:1}
.who b{display:block;color:var(--ink);line-height:1.3;overflow-wrap:anywhere}
.who span{font-size:13px;color:var(--muted)}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);text-decoration:none}
.b.hot{background:#fef3c7;color:#92400e}
.b.pn{background:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.b.hot{background:#422006;color:#fbbf24}.b.pn{color:#0b1220}}
.tx{margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;text-decoration:none}
.lnk:hover{color:var(--p)}
.img{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block;margin-top:12px}
.ratio{position:relative;aspect-ratio:16/9;margin-top:12px;border-radius:12px;overflow:hidden;background:#000}
.ratio iframe,.ratio video{position:absolute;inset:0;width:100%;height:100%;border:0}
.files{display:grid;gap:8px;margin-top:12px}
.file{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{border:0;background:var(--soft);color:var(--p);font:inherit;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;cursor:pointer}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.ab{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;text-decoration:none}
.ab:hover{background:var(--soft);color:var(--ink)}
.ab.on{color:var(--heart)}
.sp{margin-left:auto;display:flex;flex-wrap:wrap}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.more{display:block;margin:20px auto 0}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,94vw);background:var(--paper);color:var(--text);box-shadow:0 25px 60px rgba(2,6,23,.4)}
dialog::backdrop{background:rgba(2,6,23,.6)}
.dlg{padding:22px}
.dlg h2{margin:0 0 12px;font-size:22px;color:var(--ink)}
.dlg .row{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.two{grid-template-columns:1fr}.tools{flex-direction:column}.sort{width:100%}.post{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="wrap">
  <h1>Community Posts</h1>
  <p class="lead">Share ideas, ask questions and learn together.</p>

  <div id="ctx" class="ctx" hidden=""></div>
  <div id="composer"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="all" aria-selected="true">All posts</button>

</div></dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,increment,arrayUnion,arrayRemove,serverTimestamp,query,where,orderBy,limit}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const listEl=$("#list"),countEl=$("#count"),chipBox=$("#chips"),COL="communityPosts",PAGE=15;
const qp=new URLSearchParams(location.search);
const communityId=(qp.get("communityId")||qp.get("groupId")||"").trim();   /* groupId kept for older links */
const catParam=(qp.get("category")||"").trim();
const N=new Intl.NumberFormat(undefined,{notation:"compact",maximumFractionDigits:1});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const cap=s=>s?String(s)[0].toUpperCase()+String(s).slice(1):s;
const num=v=>Number(v)||0;
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}

let user=null,all=[],mine=null,view="all",cat=catParam,shown=PAGE,member=new Set(),ctxName="",editing=null;
const HIDE=/^(deleted|hidden|removed|rejected|spam|draft|pending|archived|flagged|blocked)$/i;
const liked=p=>!!user&&Array.isArray(p.likedBy)&&p.likedBy.includes(user.uid);
const newest=(a,b)=>(toD(b.createdAt)||0)-(toD(a.createdAt)||0);
const SORTS={new:(a,b)=>(!!b.isPinned-!!a.isPinned)||newest(a,b),likes:(a,b)=>num(b.likesCount)-num(a.likesCount)||newest(a,b),talk:(a,b)=>num(b.commentsCount)-num(a.commentsCount)||newest(a,b)};
const shareUrl=id=>`${location.origin}/communityPosts.html#p-${encodeURIComponent(id)}`;

/* who may see a post (visibility field) */
function visible(p){
  if(HIDE.test(p.status||""))return false;
  const v=String(p.visibility||"public").toLowerCase();
  if(v===""||v==="public")return true;
  if(user&&p.userId===user.uid)return true;
  if(v==="private")return false;
  return !!user&&(!p.communityId||member.has(p.communityId));
}
const tagsOf=t=>[...new Set((t.match(/#[\p{L}\p{N}_]+/gu)||[]).map(x=>x.slice(1).toLowerCase()))].slice(0,10);
const mentionsOf=t=>[...new Set((t.match(/@[\p{L}\p{N}_.]+/gu)||[]).map(x=>x.slice(1)))].slice(0,10);

function ytId(u){return (String(u).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/)||[])[1]||""}
function videoHTML(u){
  const url=safe(u);if(!url)return "";
  const y=ytId(url),v=url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(y)return `<div class="ratio"><iframe src="https://www.youtube-nocookie.com/embed/${y}?rel=0" title="Video" allowfullscreen loading="lazy"></iframe></div>`;
  if(v)return `<div class="ratio"><iframe src="https://player.vimeo.com/video/${v[1]}" title="Video" allowfullscreen loading="lazy"></iframe></div>`;
  if(/\.(mp4|webm|ogg|mov)(\?|$)/i.test(url))return `<div class="ratio"><video src="${esc(url)}" controls playsinline preload="metadata"></video></div>`;
  return `<a class="file" href="${esc(url)}" target="_blank" rel="noopener">Watch video</a>`;
}
const fileName=u=>{try{return decodeURIComponent(new URL(u).pathname.split("/").filter(Boolean).pop()||"Attachment")}catch{return "Attachment"}};
const filesOf=a=>(Array.isArray(a)?a:[]).map(x=>typeof x==="string"?{url:safe(x),name:""}:{url:safe(x&&x.url),name:x&&x.name||""}).filter(x=>x.url);

function card(p){
  const x=toD(p.createdAt),own=!!user&&p.userId===user.uid,img=safe(p.imageUrl),n=(p.userName||"?").trim()[0]?.toUpperCase()||"M",ph=safe(p.userPhoto);
  const long=String(p.content||"").length>320,files=filesOf(p.attachments),tags=Array.isArray(p.hashtags)?p.hashtags:[];
  const off=p.allowComments===false;
  return `<article class="post${p.isPinned?" pin":""}" id="p-${esc(p.id)}">
    <div class="top"><div class="av" aria-hidden="true">${ph?`<img src="${esc(ph)}" alt="" loading="lazy" data-n="${esc(n)}">`:esc(n)}</div>
      <div class="who"><b>${esc(p.userName||"Member")}</b><span>${x?`<time datetime="${x.toISOString()}" title="${esc(x.toLocaleString())}">${esc(ago(x))}</time>`:""}${p.isEdited?" (edited)":""}</span></div>
      ${p.isPinned?`<span class="b pn">Pinned</span>`:""}${p.communityName?`<a class="b" href="communities.html?id=${encodeURIComponent(p.communityId||"")}">${esc(p.communityName)}</a>`:""}${p.category?`<span class="b">${esc(cap(p.category))}</span>`:""}</div>
    <p class="tx${long?" clamp":""}">${esc(p.content)}</p>${long?`<button class="lnk" type="button" data-more="1">Read more</button>`:""}
    ${img?`<img class="img" src="${esc(img)}" alt="" loading="lazy">`:""}
    ${p.videoUrl?videoHTML(p.videoUrl):""}
    ${files.length?`<div class="files">${files.map(f=>`<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name||fileName(f.url))}</a>`).join("")}</div>`:""}
    ${tags.length?`<div class="tags">${tags.slice(0,10).map(t=>`<button class="tag" type="button" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>`:""}
    <div class="act"><button class="ab${liked(p)?" on":""}" type="button" data-like="${esc(p.id)}" aria-pressed="${liked(p)}">${liked(p)?"Liked":"Like"} · ${N.format(num(p.likesCount))}</button>
      ${off?`<span class="ab" style="cursor:default">Comments off</span>`:`<a class="ab" href="communityComments.html?postId=${encodeURIComponent(p.id)}&back=${encodeURIComponent("communityPosts.html#p-"+p.id)}">${N.format(num(p.commentsCount))} comments</a>`}
      ${num(p.viewsCount)?`<span class="ab" style="cursor:default">${N.format(num(p.viewsCount))} views</span>`:""}
      <span class="sp"><button class="ab" type="button" data-share="${esc(p.id)}">Share</button>
        <a class="ab" href="communityReports.html?targetType=post&targetId=${encodeURIComponent(p.id)}">Report</a>
        ${own?`<button class="ab" type="button" data-edit="${esc(p.id)}">Edit</button><button class="ab" type="button" data-del="${esc(p.id)}">Delete</button>`:""}</span></div>
  </article>`;
}

function render(){
  const src=view==="mine"?(mine||[]):all,q=$("#search").value.toLowerCase().trim().replace(/^#/,"");
  const cats=[...new Set(src.map(p=>p.category).filter(Boolean))].sort();
  if(cats.length<2)chipBox.hidden=true;
  else{chipBox.innerHTML=["",...cats].map(c=>`<button class="chip" type="button" data-c="${esc(c)}" aria-pressed="${c.toLowerCase()===cat.toLowerCase()}">${esc(c?cap(c):"All")}</button>`).join("");chipBox.hidden=false}
  const items=src.filter(p=>(!cat||String(p.category||"").toLowerCase()===cat.toLowerCase())&&
    (!q||[p.content,p.userName,p.category,p.communityName,(p.hashtags||[]).join(" ")].join(" ").toLowerCase().includes(q))).sort(SORTS[$("#sort").value]);
  countEl.textContent=items.length===1?"1 post":`${items.length} posts`;
  listEl.innerHTML=items.length
    ?items.slice(0,shown).map(card).join("")+(items.length>shown?`<button class="btn alt more" id="more" type="button">Show more (${items.length-shown})</button>`:"")
    :`<div class="state"><h2>${src.length?"No matches":view==="mine"?"You have not posted yet":"No posts yet"}</h2><p>${src.length?"Try a different search or category.":view==="mine"?"Share something with the community above.":"Be the first to start a conversation."}</p></div>`;
}

/* ---- composer ---- */
function composer(){
  const cats=[...new Set(all.map(p=>p.category).filter(Boolean))];
  $("#composer").innerHTML=user
    ?`<div class="box"><textarea id="pc" maxlength="3000" placeholder="Share something with the community. Use #hashtags to help others find it." aria-label="Post content"></textarea>
      <div class="two"><input id="pcat" list="cl" placeholder="Category (optional)" maxlength="40" value="${esc(catParam)}" aria-label="Category"><input id="pimg" type="url" placeholder="Image URL (optional)" aria-label="Image URL"></div>
      <input id="pvid" type="url" placeholder="Video link, YouTube or Vimeo (optional)" aria-label="Video URL">
      <datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
      <div class="row"><small>${communityId?`Posting in ${esc(ctxName||"this community")}`:"Be respectful and keep it relevant."}</small><button class="btn" id="pgo" type="button">Post</button></div></div>`
    :`<div class="state" style="margin-bottom:22px"><h2>Join the conversation</h2><p>Sign in to share posts with the community.</p><a class="btn" href="login.html">Sign in</a></div>`;
}
$("#composer").addEventListener("click",async e=>{
  const b=e.target.closest("#pgo");if(!b)return;
  const content=$("#pc").value.trim(),img=$("#pimg").value.trim(),vid=$("#pvid").value.trim();
  if(!content){toast("Write something first");return}
  if((img&&!safe(img))||(vid&&!safe(vid))){toast("Links must start with https://");return}
  b.disabled=true;
  try{
    const ref=doc(collection(db,COL));
    const data={userId:user.uid,userName:user.displayName||(user.email||"").split("@")[0]||"Member",userPhoto:user.photoURL||"",postId:ref.id,content,imageUrl:img,videoUrl:vid,attachments:[],
      category:$("#pcat").value.trim().toLowerCase(),communityId,communityName:ctxName,visibility:"public",likesCount:0,commentsCount:0,sharesCount:0,viewsCount:0,likedBy:[],
      hashtags:tagsOf(content),mentions:mentionsOf(content),status:"published",isPinned:false,isEdited:false,allowComments:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp()};
    await setDoc(ref,data);
    const p={id:ref.id,...data,createdAt:new Date(),updatedAt:new Date()};
    all.unshift(p);if(mine)mine.unshift(p);
    $("#pc").value="";$("#pimg").value="";$("#pvid").value="";
    render();toast("Posted");
  }catch(err){console.error(err);toast("Could not publish your post")}
  b.disabled=false;
});

/* ---- like, share, edit, delete ---- */
async function toggleLike(p){
  if(!user){location.href="login.html";return}
  const was=liked(p),mineList=[...all,...(mine||[])].filter(x=>x.id===p.id),prevBy=Array.isArray(p.likedBy)?[...p.likedBy]:[],prevN=num(p.likesCount);
  mineList.forEach(x=>{x.likedBy=was?prevBy.filter(u=>u!==user.uid):[...prevBy,user.uid];x.likesCount=Math.max(0,prevN+(was?-1:1))});
  render();
  try{await updateDoc(doc(db,COL,p.id),{likedBy:was?arrayRemove(user.uid):arrayUnion(user.uid),likesCount:increment(was?-1:1)})}
  catch(err){console.error(err);toast("Something went wrong. Please try again.");mineList.forEach(x=>{x.likedBy=prevBy;x.likesCount=prevN});render()}
}
listEl.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("#more")){shown+=PAGE;render();return}
  const m=t.closest("[data-more]");
  if(m){const c=m.previousElementSibling.classList.toggle("clamp");m.textContent=c?"Read more":"Show less";return}
  const tg=t.closest("[data-tag]");if(tg){$("#search").value="#"+tg.dataset.tag;shown=PAGE;render();return}
  const l=t.closest("[data-like]");if(l){toggleLike(all.concat(mine||[]).find(x=>x.id===l.dataset.like));return}
  const s=t.closest("[data-share]");
  if(s){
    const url=shareUrl(s.dataset.share),p=all.find(x=>x.id===s.dataset.share);
    try{
      if(navigator.share)await navigator.share({title:"LetsStudy Pro community",text:String(p?.content||"").slice(0,100),url});
      else{await navigator.clipboard.writeText(url);toast("Link copied")}
      updateDoc(doc(db,COL,s.dataset.share),{sharesCount:increment(1)}).catch(()=>{});
    }catch{}
    return;
  }
  const ed=t.closest("[data-edit]");
  if(ed){editing=all.concat(mine||[]).find(x=>x.id===ed.dataset.edit);$("#et").value=editing.content||"";$("#dlg").showModal();return}
  const d=t.closest("[data-del]");
  if(d&&confirm("Delete this post?")){
    try{
      await updateDoc(doc(db,COL,d.dataset.del),{status:"deleted",updatedAt:serverTimestamp()});
      all=all.filter(p=>p.id!==d.dataset.del);if(mine)mine=mine.filter(p=>p.id!==d.dataset.del);
      render();toast("Post deleted");
    }catch(err){console.error(err);toast("Could not delete the post")}
  }
});
$("#ec").addEventListener("click",()=>$("#dlg").close());
$("#es").addEventListener("click",async e=>{
  const content=$("#et").value.trim();if(!content||!editing){toast("Write something first");return}
  const b=e.currentTarget;b.disabled=true;
  try{
    const f={content,hashtags:tagsOf(content),mentions:mentionsOf(content),isEdited:true,updatedAt:serverTimestamp()};
    await updateDoc(doc(db,COL,editing.id),f);
    all.concat(mine||[]).filter(x=>x.id===editing.id).forEach(x=>Object.assign(x,f,{updatedAt:new Date()}));
    $("#dlg").close();render();toast("Post updated");
  }catch(err){console.error(err);toast("Could not update the post")}
  b.disabled=false;
});

chipBox.addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.c;shown=PAGE;render()}});
$("#search").addEventListener("input",()=>{shown=PAGE;render()});
$("#sort").addEventListener("change",render);
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"){if(i.dataset.n)i.replaceWith(document.createTextNode(i.dataset.n));else if(i.classList.contains("img"))i.remove()}},true);
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",async()=>{
  view=b.dataset.v;cat="";shown=PAGE;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  if(view==="mine"){
    if(!user){listEl.innerHTML=`<div class="state"><h2>Sign in to see your posts</h2><a class="btn" href="login.html">Sign in</a></div>`;countEl.textContent="";chipBox.hidden=true;return}
    if(!mine){
      try{mine=(await getDocs(query(collection(db,COL),where("userId","==",user.uid)))).docs.map(d=>({id:d.id,...d.data()})).filter(p=>!HIDE.test(p.status||"")).sort(newest)}
      catch(e){console.error(e);mine=[]}
    }
  }
  render();
}));

/* ---- load ---- */
function fail(err){
  console.error(err);countEl.textContent="";chipBox.hidden=true;
  const denied=err&&err.code==="permission-denied"&&!user;
  listEl.innerHTML=denied
    ?`<div class="state"><h2>Sign in to view the community</h2><p>Sign in to read and share posts.</p><a class="btn" href="login.html">Sign in</a></div>`
    :`<div class="state err"><h2>Unable to load posts</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry")?.addEventListener("click",load);
}
async function load(){
  const col=collection(db,COL);
  let snap;
  try{
    if(communityId)snap=await getDocs(query(col,where("communityId","==",communityId),limit(100)));
    else{try{snap=await getDocs(query(col,orderBy("createdAt","desc"),limit(60)))}catch{snap=await getDocs(query(col,where("status","==","published"),limit(100)))}}
  }catch(e){return fail(e)}
  member=new Set();
  if(user)try{(await getDocs(query(collection(db,"groupMembers"),where("userId","==",user.uid)))).docs.forEach(d=>d.data().groupId&&member.add(d.data().groupId))}catch{}
  all=snap.docs.map(d=>({id:d.id,...d.data()})).filter(visible);
  mine=null;
  if(communityId){
    ctxName=(all.find(p=>p.communityName)||{}).communityName||"";
    for(const c of ["communityCategories","communities","groups"]){
      if(ctxName)break;
      try{const s=await getDoc(doc(db,c,communityId));if(s.exists()){const d=s.data();ctxName=d.title||d.name||""}}catch{}
    }
    $("#ctx").hidden=false;
    $("#ctx").innerHTML=`Showing posts in <b>${esc(ctxName||"this community")}</b>. <a href="communityPosts.html">Show all posts</a>`;
  }else if(catParam){
    $("#ctx").hidden=false;$("#ctx").innerHTML=`Showing posts in topic <b>${esc(cap(catParam))}</b>. <a href="communityPosts.html">Show all posts</a>`;
  }
  composer();render();
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,u=>{
  user=u;view="all";cat=catParam;shown=PAGE;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x.dataset.v==="all")));
  load();
});
</script>
