<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(800px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 10px}
.lead{font-size:18px;color:var(--muted);margin:0 0 24px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px}
.box h2{margin:0 0 4px;font-size:20px;color:var(--ink)}
.box p{margin:0 0 14px;color:var(--muted);font-size:15px}
.box label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:12px 0 6px}
.box select,.box textarea,.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.box textarea{min-height:100px;resize:vertical}
.search{background:var(--paper)}
.box select:focus,.box textarea:focus,.search:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.btn{border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.bad{background:#dc2626;color:#fff}
.btn.sm{padding:7px 13px;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}.btn.bad{color:#fff}}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.tab i{font-style:normal;margin-left:6px;background:var(--soft);border-radius:999px;padding:0 8px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
#count{color:var(--muted);font-size:14px;margin:6px 0 12px;min-height:21px}
.r{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c,#d97706);border-radius:14px;padding:16px 20px;margin-bottom:12px}
.r.done{--c:#16a34a}.r.no{--c:#64748b}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.r h2{margin:0;font-size:17px;color:var(--ink);line-height:1.35}
.r time{font-size:13px;color:var(--muted);white-space:nowrap}
.ds{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
.meta code{background:var(--soft);padding:1px 7px;border-radius:6px;font-size:12px}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.b.st{background:color-mix(in srgb,var(--c,#d97706) 16%,transparent);color:var(--c,#d97706)}
.snip{margin-top:12px;padding:12px 14px;background:var(--soft);border-radius:10px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.snip a{font-weight:700}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.top{flex-direction:column;gap:2px}.r{padding:14px 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,getDoc,doc,setDoc,updateDoc,query,where,orderBy,limit}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const listEl=$("#list"),countEl=$("#count"),chipBox=$("#chips");
const COL="communityReports";
const qp=new URLSearchParams(location.search);
const pre={type:(qp.get("targetType")||"").trim(),id:(qp.get("targetId")||"").trim()};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const cap=s=>s?String(s)[0].toUpperCase()+String(s).slice(1):s;
const short=id=>id.length>14?id.slice(0,6)+"…"+id.slice(-4):id;
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}

const REASONS=["Spam","Harassment or hate","Inappropriate content","Misinformation","Copyright","Other"];
const CLOSED=/^(resolved|dismissed|closed|actioned|rejected|done)$/i;
/* targetType -> collection holding the reported content */
const TARGETS={post:["communityPosts",d=>d.content,"posts"],comment:["communityComments",d=>d.content],
  group:["communityGroups",d=>d.name||d.description,"groups"],event:["communityEvents",d=>d.title||d.description,"events"],
  announcement:["communityAnnouncements",d=>d.title||d.message,"news"]};
const tkey=r=>String(r.targetType||"").toLowerCase().replace(/^community/,"").replace(/s$/,"");

let user=null,admin=false,reports=[],view="open",type="";
const isClosed=r=>CLOSED.test(r.status||"");
const newest=(a,b)=>(toD(b.createdAt)||0)-(toD(a.createdAt)||0);

function card(r){
  const x=toD(r.createdAt),c=isClosed(r),st=r.status||"open";
  const cls=c?(/^(dismissed|rejected)$/i.test(st)?"no":"done"):"";
  const k=tkey(r);
  return `<article class="r ${cls}" data-id="${esc(r.id)}">
    <div class="top"><h2>${esc(r.reason||"Report")}</h2>${x?`<time datetime="${x.toISOString()}" title="${esc(x.toLocaleString())}">${esc(ago(x))}</time>`:""}</div>
    ${r.description?`<p class="ds">${esc(r.description)}</p>`:""}
    <div class="meta"><span class="b st">${esc(cap(st))}</span><span class="b">${esc(cap(k||"content"))}</span>
      <span>Target <code title="${esc(r.targetId)}">${esc(short(String(r.targetId||"")))}</code></span>
      ${admin?`<span>Reporter <code title="${esc(r.reporterId)}">${esc(short(String(r.reporterId||"")))}</code></span>`:""}</div>
    <div class="snip" id="s-${esc(r.id)}" hidden></div>
    ${admin?`<div class="act">
      ${TARGETS[k]?`<button class="btn alt sm" type="button" data-show="${esc(r.id)}">Show content</button>`:""}
      ${c?`<button class="btn alt sm" type="button" data-set="open" data-id="${esc(r.id)}">Reopen</button>`
        :`<button class="btn sm" type="button" data-set="resolved" data-id="${esc(r.id)}">Resolve</button>
          <button class="btn alt sm" type="button" data-set="dismissed" data-id="${esc(r.id)}">Dismiss</button>
          ${TARGETS[k]?`<button class="btn bad sm" type="button" data-hide="${esc(r.id)}">Hide content</button>`:""}`}
    </div>`:""}
  </article>`;
}

function render(){
  const open=reports.filter(r=>!isClosed(r)),closed=reports.filter(isClosed);
  $("#n-open").textContent=open.length;$("#n-closed").textContent=closed.length;
  const src=view==="open"?open:closed,q=$("#search").value.toLowerCase().trim();
  const types=[...new Set(src.map(tkey).filter(Boolean))].sort();
  if(type&&!types.includes(type))type="";
  if(types.length<2)chipBox.hidden=true;
  else{chipBox.innerHTML=["",...types].map(t=>`<button class="chip" type="button" data-t="${esc(t)}" aria-pressed="${t===type}">${esc(t?cap(t):"All types")}</button>`).join("");chipBox.hidden=false}
  const items=src.filter(r=>(!type||tkey(r)===type)&&(!q||[r.reason,r.description,r.targetId,r.targetType].join(" ").toLowerCase().includes(q)));
  countEl.textContent=items.length===1?"1 report":`${items.length} reports`;
  listEl.innerHTML=items.length?items.map(card).join(""):
    `<div class="state"><h2>${src.length?"No matches":view==="open"?"No open reports":"No closed reports"}</h2><p>${src.length?"Try a different search.":admin?"Reports from the community will appear here.":"Reports you submit will appear here."}</p></div>`;
}

/* ---- report form (?targetType=post&targetId=...) ---- */
function renderForm(){
  const f=$("#form");
  if(!pre.id||!pre.type){f.innerHTML="";return}
  f.innerHTML=user?`<div class="box"><h2>Report this ${esc(pre.type)}</h2><p>Tell us what is wrong. Reports are reviewed by moderators.</p>
    <label for="rr">Reason</label><select id="rr">${REASONS.map(x=>`<option>${x}</option>`).join("")}</select>
    <label for="rd">Details (optional)</label><textarea id="rd" maxlength="1000" placeholder="Add any context that will help us review this"></textarea>
    <div class="act"><button class="btn" id="rgo" type="button">Submit report</button></div></div>`
  :`<div class="state" style="margin-bottom:24px"><h2>Sign in to report</h2><p>You need an account to report content.</p><a class="btn" href="login.html">Sign in</a></div>`;
}
$("#form").addEventListener("click",async e=>{
  if(!e.target.closest("#rgo"))return;
  const b=e.target.closest("#rgo");b.disabled=true;
  try{
    const ref=doc(collection(db,COL));
    const data={reportId:ref.id,createdAt:new Date().toISOString(),description:$("#rd").value.trim(),reason:$("#rr").value,
      reporterId:user.uid,status:"open",targetId:pre.id,targetType:pre.type};
    await setDoc(ref,data);
    reports.unshift({id:ref.id,...data});
    $("#form").innerHTML=`<div class="box"><h2>Thank you</h2><p>Your report has been sent to the moderators.</p></div>`;
    render();
  }catch(err){console.error(err);toast("Could not send your report");b.disabled=false}
});

/* ---- moderator actions ---- */
async function setStatus(id,status){
  await updateDoc(doc(db,COL,id),{status,reviewedBy:user.uid,reviewedAt:new Date().toISOString()});
  const r=reports.find(x=>x.id===id);if(r)r.status=status;
}
listEl.addEventListener("click",async e=>{
  const t=e.target;
  const sh=t.closest("[data-show]");
  if(sh){
    const r=reports.find(x=>x.id===sh.dataset.show),[col,pick]=TARGETS[tkey(r)],box=$("#s-"+CSS.escape(r.id));
    box.hidden=false;box.textContent="";
    try{
      const s=await getDoc(doc(db,col,r.targetId));
      if(!s.exists()){box.textContent="This content no longer exists."}
      else{
        const d=s.data(),k=tkey(r);
        const href=k==="comment"?`communityComments.html?postId=${encodeURIComponent(d.postId||"")}#c-${encodeURIComponent(r.targetId)}`
          :`community-details.html?type=${TARGETS[k][2]}&id=${encodeURIComponent(r.targetId)}`;
        box.innerHTML=`${esc(String(pick(d)||"(no text)").slice(0,400))}${d.status?` <span class="b">${esc(cap(d.status))}</span>`:""}<br><a href="${href}" target="_blank" rel="noopener">Open content</a>`;
      }
    }catch(err){console.error(err);box.textContent="Unable to load the content."}
    return;
  }
  const st=t.closest("[data-set]");
  if(st){
    st.disabled=true;
    try{await setStatus(st.dataset.id,st.dataset.set);render();toast("Report updated")}
    catch(err){console.error(err);toast("Could not update the report");st.disabled=false}
    return;
  }
  const hd=t.closest("[data-hide]");
  if(hd&&confirm("Hide the reported content and resolve this report?")){
    const r=reports.find(x=>x.id===hd.dataset.hide);hd.disabled=true;
    try{
      await updateDoc(doc(db,TARGETS[tkey(r)][0],r.targetId),{status:"hidden"});
      await setStatus(r.id,"resolved");render();toast("Content hidden");
    }catch(err){console.error(err);toast("Could not hide the content");hd.disabled=false}
  }
});

chipBox.addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){type=b.dataset.t;render()}});
$("#search").addEventListener("input",render);
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  view=b.dataset.v;type="";
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  render();
}));

/* ---- load ---- */
async function checkAdmin(u){
  for(const [c,ok] of [["admins",s=>s.exists()],["users",s=>s.exists()&&/admin|moderator/i.test(String(s.data().role||""))]]){
    try{if(ok(await getDoc(doc(db,c,u.uid))))return true}catch{}
  }
  return false;
}
function signedOut(){
  $("#app").hidden=true;renderForm();
  $("#lead").textContent="Report content that breaks the community rules.";
  if(!pre.id)$("#msg").innerHTML=`<div class="state"><h2>Sign in to view your reports</h2><p>Reports are private to your account.</p><a class="btn" href="login.html">Sign in</a></div>`;
  else $("#msg").innerHTML="";
}
function fail(err){
  console.error(err);$("#app").hidden=true;
  $("#msg").innerHTML=`<div class="state err"><h2>Unable to load reports</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",load);
}
async function load(){
  admin=await checkAdmin(user);
  $("#title").textContent=admin?"Moderation Queue":"My Reports";
  $("#lead").textContent=admin?"Review reports from the community and take action.":"Reports you have submitted and their status.";
  const col=collection(db,COL);
  try{
    let snap;
    if(admin){
      try{snap=await getDocs(query(col,orderBy("createdAt","desc"),limit(200)))}
      catch{snap=await getDocs(query(col,limit(200)))}
    }else snap=await getDocs(query(col,where("reporterId","==",user.uid)));
    reports=snap.docs.map(d=>({id:d.id,...d.data()})).sort(newest);
  }catch(e){return fail(e)}
  $("#msg").innerHTML="";$("#app").hidden=false;
  renderForm();render();
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,u=>{user=u;u?load():signedOut()});
</script>


</body></html>
