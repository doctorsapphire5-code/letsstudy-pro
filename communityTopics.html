<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(900px,92%);margin:0 auto;padding:44px 0 70px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 8px}
.lead{font-size:18px;color:var(--muted);margin:0;max-width:560px}
.tools{display:flex;gap:10px;margin-bottom:8px}
.search,.sort,.box input,.box textarea{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px}
.search{flex:1;min-width:0}
.search:focus,.sort:focus,.box input:focus,.box textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
#count{color:var(--muted);font-size:14px;margin:16px 0 14px;min-height:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.t{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s}
.t:hover{border-color:var(--p);transform:translateY(-2px)}
.nm{margin:0;font-size:20px;line-height:1.3;letter-spacing:-.01em;color:var(--ink);overflow-wrap:anywhere}
.nm::before{content:"#";color:var(--p);margin-right:2px}
.ds{margin:0;color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:auto;padding-top:6px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-size:15px}
.hot{align-self:flex-start;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#fef3c7;color:#92400e}
@media(prefers-color-scheme:dark){.hot{background:#422006;color:#fbbf24}}
.btn{border:0;background:var(--p);color:#fff;padding:11px 20px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:22px}
.box input,.box textarea{width:100%;background:var(--bg);margin-bottom:10px}
.box textarea{min-height:80px;resize:vertical}
.box .row{display:flex;gap:10px}
.state{grid-column:1/-1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.tools{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.t:hover{transform:none}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="community.html">Community</a>
    <a href="communityTopics.html" aria-current="page">Topics</a>
  </nav>
</div></header>

<main class="wrap">
  <div class="head">
    <div>
      <h1>Topics</h1>
      <p class="lead">Find the conversations that matter to you and join in.</p>
    </div>
    <button class="btn" id="newBtn" type="button" hidden="">New topic</button>
  </div>

  <div class="box" id="form" hidden="">
    <input id="tn" maxlength="40" placeholder="Topic name" aria-label="Topic name">
    <textarea id="td" maxlength="300" placeholder="What is this topic about?" aria-label="Description"></textarea>
    <div class="row"><button class="btn" id="tgo" type="button">Create topic</button><button class="btn alt" id="tcancel" type="button">Cancel</button></div>
  </div>

  <div class="tools">
    <input id="search" class="search" type="search" placeholder="Search topics" aria-label="Search topics">
    <select id="sort" class="sort" aria-label="Sort topics">
      <option value="active">Most active</option>
      <option value="az">A to Z</option>
      <option value="new">Newest</option>
      <option value="upd">Recently updated</option>
    </select>
  </div>
  <div id="count" role="status"></div>
  <section id="grid" class="grid"></section>
</main>

<div class="toast" id="toast" role="status"></div>
<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,getDoc,doc,setDoc,serverTimestamp,query,orderBy,limit}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const grid=$("#grid"),countEl=$("#count");
const COL="communityTopics";
const N=new Intl.NumberFormat(undefined,{notation:"compact",maximumFractionDigits:1});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const num=v=>Number(v)||0;
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}

const HIDE=/^(draft|pending|archived|deleted|hidden|removed|rejected|disabled|inactive|blocked)$/i;
const SORTS={
  active:(a,b)=>num(b.postCount)-num(a.postCount),
  az:(a,b)=>String(a.name||"").localeCompare(String(b.name||"")),
  new:(a,b)=>(toD(b.createdAt)||0)-(toD(a.createdAt)||0),
  upd:(a,b)=>(toD(b.updatedAt||b.createdAt)||0)-(toD(a.updatedAt||a.createdAt)||0)
};
let topics=[],user=null,admin=false;

function card(t){
  const u=toD(t.updatedAt||t.createdAt),n=num(t.postCount);
  const recent=u&&Date.now()-u<7*864e5&&n>0;
  return `<a class="t" href="communityPosts.html?category=${encodeURIComponent(t.name||"")}">
    ${recent?`<span class="hot">Active this week</span>`:""}
    <h2 class="nm">${esc(t.name||"Topic")}</h2>
    ${t.description?`<p class="ds">${esc(t.description)}</p>`:""}
    <div class="meta"><span><b>${N.format(n)}</b> ${n===1?"post":"posts"}</span>${u?`<span>Updated ${esc(ago(u))}</span>`:""}</div>
  </a>`;
}

function render(){
  const q=$("#search").value.toLowerCase().trim();
  const items=topics.filter(t=>!q||[t.name,t.description].join(" ").toLowerCase().includes(q)).sort(SORTS[$("#sort").value]);
  countEl.textContent=items.length===1?"1 topic":`${items.length} topics`;
  grid.innerHTML=items.length?items.map(card).join(""):
    `<div class="state"><h2>${topics.length?"No matches":"No topics yet"}</h2><p>${topics.length?"Try a different search.":"Topics will appear here soon."}</p></div>`;
}
$("#search").addEventListener("input",render);
$("#sort").addEventListener("change",render);

function fail(err){
  console.error(err);countEl.textContent="";
  const denied=err&&err.code==="permission-denied"&&!user;
  grid.innerHTML=denied
    ?`<div class="state"><h2>Sign in to browse topics</h2><p>Sign in to see community topics.</p><a class="btn" href="login.html">Sign in</a></div>`
    :`<div class="state err"><h2>Unable to load topics</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry")?.addEventListener("click",load);
}

async function load(){
  const col=collection(db,COL);
  let snap;
  try{snap=await getDocs(query(col,orderBy("postCount","desc"),limit(200)))}
  catch{try{snap=await getDocs(query(col,limit(200)))}catch(e){return fail(e)}}
  topics=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.name&&!HIDE.test(t.status||""));
  render();
}

/* Admins and moderators can create topics */
async function checkAdmin(u){
  for(const [c,ok] of [["admins",s=>s.exists()],["users",s=>s.exists()&&/admin|moderator/i.test(String(s.data().role||""))]]){
    try{if(ok(await getDoc(doc(db,c,u.uid))))return true}catch{}
  }
  return false;
}
$("#newBtn").addEventListener("click",()=>{$("#form").hidden=!$("#form").hidden;$("#tn").focus()});
$("#tcancel").addEventListener("click",()=>{$("#form").hidden=true});
$("#tgo").addEventListener("click",async e=>{
  const name=$("#tn").value.trim(),description=$("#td").value.trim();
  if(!name){toast("Enter a topic name");return}
  if(topics.some(t=>String(t.name).toLowerCase()===name.toLowerCase())){toast("That topic already exists");return}
  const b=e.currentTarget;b.disabled=true;
  try{
    const ref=doc(collection(db,COL));
    await setDoc(ref,{name,description,createdBy:user.uid,postCount:0,status:"active",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
    topics.push({id:ref.id,name,description,postCount:0,status:"active",createdAt:new Date(),updatedAt:new Date()});
    $("#tn").value="";$("#td").value="";$("#form").hidden=true;
    render();toast("Topic created");
  }catch(err){console.error(err);toast("Could not create the topic")}
  b.disabled=false;
});

$("#year").textContent=new Date().getFullYear();
let started=false;
onAuthStateChanged(auth,async u=>{
  user=u;admin=u?await checkAdmin(u):false;
  $("#newBtn").hidden=!admin;
  if(!admin)$("#form").hidden=true;
  if(!started){started=true;load()}
});
</script>


</body></html>
