<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(740px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 10px}
.lead{font-size:18px;color:var(--muted);margin:0 0 24px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{flex:none;border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.tab i{font-style:normal;margin-left:6px;background:var(--soft);border-radius:999px;padding:0 8px;font-size:12px}
.tab i.hot{background:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.tab i.hot{color:#0b1220}}
.search{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px;margin-bottom:14px}
.search:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.row{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.bd{min-width:0;flex:1}
.bd h2{margin:0;font-size:16px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.bd p,.bd small{margin:0;display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.act{flex:none;display:flex;gap:8px}
.btn{border:0;background:var(--p);color:#fff;padding:8px 16px;border-radius:10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}}
.invite{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--p);border-radius:14px;padding:16px;margin-bottom:22px}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.row,.invite{flex-wrap:wrap}.act{width:100%}.act .btn{flex:1;text-align:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>

    <a href="index.html">Home</a>

<main class="wrap">
  <h1>My Network</h1>
  <p class="lead">People you are connected with, and your connection requests.</p>

  <div id="invite"></div>

  <div id="app" hidden="">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="conn" aria-selected="true">Connections<i id="n-conn">0</i></button>
      <button class="tab" role="tab" data-v="recv" aria-selected="false">Requests<i id="n-recv">0</i></button>
      <button class="tab" role="tab" data-v="sent" aria-selected="false">Sent<i id="n-sent">0</i></button>
    </div>
    <input id="search" class="search" type="search" placeholder="Search by name" aria-label="Search by name">
    <section id="list"></section>
  </div>
  <div id="msg"></div>
</main>

<div class="toast" id="toast" role="status"></div>
<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,onSnapshot,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const listEl=$("#list"),COL="connections";
const connectTo=(new URLSearchParams(location.search).get("connectTo")||"").trim();

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}

const ACC=/^(accepted|connected|approved)$/i,DEAD=/^(declined|rejected|cancelled|canceled|blocked|removed)$/i;
let user=null,view="conn",unsubs=[],store={recv:[],sent:[]},prof={};

const mk=snap=>snap.docs.map(d=>({id:d.id,...d.data()}));
const all=()=>[...store.recv,...store.sent];
const other=c=>c.requesterId===user.uid?c.receiverId:c.requesterId;
const live=c=>!DEAD.test(c.status||"");
const sets=()=>{
  const a=all().filter(live),by=(x,y)=>(toD(y.updatedAt||y.createdAt)||0)-(toD(x.updatedAt||x.createdAt)||0);
  return {
    conn:a.filter(c=>ACC.test(c.status||"")).sort(by),
    recv:store.recv.filter(c=>live(c)&&!ACC.test(c.status||"")).sort(by),
    sent:store.sent.filter(c=>live(c)&&!ACC.test(c.status||"")).sort(by)
  };
};

const P=id=>prof[id]||{};
const nameOf=id=>{const p=P(id);return p.name||p.displayName||p.fullName||p.username||"Member"};
const photoOf=id=>{const p=P(id);return safe(p.photoURL||p.photo||p.avatar||p.profilePicture)};
const headOf=id=>{const p=P(id);return p.headline||p.profession||p.title||""};
const avatar=id=>{const n=nameOf(id)[0].toUpperCase(),ph=photoOf(id);
  return `<div class="av" aria-hidden="true">${ph?`<img src="${esc(ph)}" alt="" loading="lazy" data-n="${esc(n)}">`:esc(n)}</div>`};

async function loadProfiles(ids){
  const need=[...new Set(ids)].filter(id=>id&&!(id in prof));
  if(!need.length)return false;
  await Promise.all(need.map(async id=>{
    try{const s=await getDoc(doc(db,"users",id));prof[id]=s.exists()?s.data():{}}catch{prof[id]={}}
  }));
  return true;
}

function row(c,v){
  const id=other(c),x=toD(c.updatedAt||c.createdAt),when=x?ago(x):"";
  const acts=v==="conn"?`<button class="btn alt" type="button" data-set="removed" data-id="${esc(c.id)}">Remove</button>`
    :v==="recv"?`<button class="btn" type="button" data-set="accepted" data-id="${esc(c.id)}">Accept</button><button class="btn alt" type="button" data-set="declined" data-id="${esc(c.id)}">Decline</button>`
    :`<button class="btn alt" type="button" data-set="cancelled" data-id="${esc(c.id)}">Cancel request</button>`;
  return `<div class="row">${avatar(id)}<div class="bd"><h2>${esc(nameOf(id))}</h2>
    ${headOf(id)?`<p>${esc(headOf(id))}</p>`:""}<small>${v==="conn"?"Connected":v==="recv"?"Requested":"Sent"} ${esc(when)}</small></div>
    <div class="act">${acts}</div></div>`;
}

function render(){
  const s=sets();
  for(const k in s)$("#n-"+k).textContent=s[k].length;
  $("#n-recv").classList.toggle("hot",s.recv.length>0);
  const q=$("#search").value.toLowerCase().trim();
  const items=s[view].filter(c=>!q||nameOf(other(c)).toLowerCase().includes(q));
  const empty={conn:["No connections yet","People you connect with will appear here."],
    recv:["No pending requests","Requests you receive will appear here."],sent:["No sent requests","Requests you send will appear here."]}[view];
  listEl.innerHTML=items.length?items.map(c=>row(c,view)).join(""):
    `<div class="state"><h2>${s[view].length?"No matches":empty[0]}</h2><p>${s[view].length?"Try a different name.":empty[1]}</p></div>`;
  renderInvite(s);
}

/* ?connectTo=UID : send a connection request to that member */
async function renderInvite(s){
  const box=$("#invite");
  if(!connectTo||!user||connectTo===user.uid){box.innerHTML="";return}
  await loadProfiles([connectTo]);
  const ex=all().find(c=>other(c)===connectTo&&live(c));
  const state=ex?(ACC.test(ex.status||"")?"You are already connected.":ex.requesterId===user.uid?"Request sent. Waiting for a reply.":"This member sent you a request. Accept it below."):"";
  box.innerHTML=`<div class="invite">${avatar(connectTo)}<div class="bd"><h2>${esc(nameOf(connectTo))}</h2><p>${esc(state||"Connect to follow each other's activity.")}</p></div>
    ${state?"":`<div class="act"><button class="btn" id="go" type="button">Connect</button></div>`}</div>`;
}
$("#invite").addEventListener("click",async e=>{
  const b=e.target.closest("#go");if(!b)return;
  b.disabled=true;
  try{
    const id=`${user.uid}_${connectTo}`,now=new Date().toISOString();
    await setDoc(doc(db,COL,id),{connectionId:id,createdAt:now,receiverId:connectTo,requesterId:user.uid,status:"pending",updatedAt:now});
    toast("Request sent");
  }catch(err){console.error(err);toast("Could not send the request");b.disabled=false}
});

listEl.addEventListener("click",async e=>{
  const b=e.target.closest("[data-set]");if(!b)return;
  b.disabled=true;
  try{
    await updateDoc(doc(db,COL,b.dataset.id),{status:b.dataset.set,updatedAt:new Date().toISOString()});
    toast({accepted:"Connected",declined:"Request declined",cancelled:"Request cancelled",removed:"Connection removed"}[b.dataset.set]);
  }catch(err){console.error(err);toast("Something went wrong. Please try again.");b.disabled=false}
});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  view=t.dataset.v;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  render();
}));
$("#search").addEventListener("input",render);
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"&&i.dataset.n)i.replaceWith(document.createTextNode(i.dataset.n))},true);

function signedOut(){
  $("#app").hidden=true;$("#invite").innerHTML="";
  $("#msg").innerHTML=`<div class="state"><h2>Sign in to see your network</h2><p>Your connections are private to your account.</p><a class="btn" href="login.html">Sign in</a></div>`;
}
function fail(err){
  console.error(err);$("#app").hidden=true;
  $("#msg").innerHTML=`<div class="state err"><h2>Unable to load your network</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",listen);
}

/* Live updates for requests you received and sent */
function listen(){
  unsubs.forEach(u=>u());unsubs=[];store={recv:[],sent:[]};
  const col=collection(db,COL);
  const on=(field,key)=>onSnapshot(query(col,where(field,"==",user.uid)),async snap=>{
    store[key]=mk(snap);
    await loadProfiles(all().map(other));
    $("#msg").innerHTML="";$("#app").hidden=false;
    render();
  },fail);
  unsubs=[on("receiverId","recv"),on("requesterId","sent")];
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,u=>{
  user=u;unsubs.forEach(x=>x());unsubs=[];
  u?listen():signedOut();
});
</script>


</body></html>
