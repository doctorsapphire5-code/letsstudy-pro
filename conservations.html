<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(720px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 20px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.search{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px;margin-bottom:14px}
.search:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.c{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.c:last-child{border-bottom:0}
.c:hover{background:var(--soft)}
.av{flex:none;width:50px;height:50px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden}
.c:hover .av{background:var(--paper)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.bd{min-width:0;flex:1}
.nm{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nm b{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm time{flex:none;font-size:12px;color:var(--muted)}
.lm{margin:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g{display:inline-block;margin-right:6px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:800;background:var(--soft);color:var(--muted);vertical-align:1px}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.btn{display:inline-block;margin-top:14px;border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.c{padding:12px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<main class="wrap">
  <h1>Messages</h1>
  <div id="app" hidden="">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="all" aria-selected="true">All</button>
      <button class="tab" role="tab" data-v="direct" aria-selected="false">Direct</button>
      <button class="tab" role="tab" data-v="group" aria-selected="false">Groups</button>
    </div>
    <input id="search" class="search" type="search" placeholder="Search conversations" aria-label="Search conversations">
    <div id="list"></div>
  </div>
  <div id="msg"></div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,onSnapshot,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const COL="conservations"; /* collection name exactly as in Firestore */
/* Where a conversation opens. Change this to your chat page. */
const OPEN=id=>`messages.html?conversationId=${encodeURIComponent(id)}`;
const withUser=(new URLSearchParams(location.search).get("with")||"").trim();

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}

function stamp(x){
  if(!x)return "";
  const d0=n=>new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  const diff=Math.round((d0(new Date())-d0(x))/864e5);
  if(diff===0)return x.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  if(diff===1)return "Yesterday";
  if(diff<7)return x.toLocaleDateString(undefined,{weekday:"short"});
  return x.toLocaleDateString(undefined,{day:"numeric",month:"short",year:diff>300?"numeric":undefined});
}

let user=null,convs=[],prof={},view="all",unsub=null;
const members=c=>Array.isArray(c.memberIds)?c.memberIds:String(c.memberIds||"").split(/[,\s]+/).filter(Boolean);
const others=c=>members(c).filter(i=>i!==user.uid);
const isGroup=c=>/group/i.test(c.type||"")||members(c).length>2;
const when=c=>toD(c.lastMessageAt)||toD(c.updatedAt)||toD(c.createdAt);
const P=id=>prof[id]||{};
const nameOf=id=>{const p=P(id);return p.name||p.displayName||p.fullName||p.username||"Member"};
const photoOf=id=>safe(P(id).photoURL||P(id).photo||P(id).avatar||P(id).profilePicture);

function title(c){
  if(c.name||c.title)return c.name||c.title;
  const o=others(c).map(nameOf);
  if(!o.length)return "You";
  return o.length>2?`${o.slice(0,2).join(", ")} +${o.length-2}`:o.join(", ");
}
function avatar(c){
  const o=others(c);
  if(isGroup(c))return `<div class="av" aria-hidden="true">${esc(String(members(c).length))}</div>`;
  const id=o[0],n=(id?nameOf(id):"Y")[0].toUpperCase(),ph=id?photoOf(id):"";
  return `<div class="av" aria-hidden="true">${ph?`<img src="${esc(ph)}" alt="" loading="lazy" data-n="${esc(n)}">`:esc(n)}</div>`;
}

async function loadProfiles(){
  const need=[...new Set(convs.flatMap(others))].filter(id=>!(id in prof));
  await Promise.all(need.map(async id=>{
    try{const s=await getDoc(doc(db,"users",id));prof[id]=s.exists()?s.data():{}}catch{prof[id]={}}
  }));
}

function render(){
  const q=$("#search").value.toLowerCase().trim();
  const items=convs.filter(c=>(view==="all"||(view==="group")===isGroup(c))&&
    (!q||(title(c)+" "+(c.lastMessage||"")).toLowerCase().includes(q)));
  $("#list").innerHTML=items.length
    ?`<div class="list">${items.map(c=>`<a class="c" href="${OPEN(c.id)}">${avatar(c)}<div class="bd">
        <div class="nm"><b>${isGroup(c)?`<span class="g">Group</span>`:""}${esc(title(c))}</b><time>${esc(stamp(when(c)))}</time></div>
        <p class="lm">${esc(c.lastMessage||"No messages yet")}</p></div></a>`).join("")}</div>`
    :`<div class="state"><h2>${convs.length?"No matches":"No conversations yet"}</h2><p>${convs.length?"Try a different search.":"When you start chatting with someone, your conversations will appear here."}</p></div>`;
}

$("#search").addEventListener("input",render);
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  view=t.dataset.v;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  render();
}));
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"&&i.dataset.n)i.replaceWith(document.createTextNode(i.dataset.n))},true);

/* ?with=UID : open (or create) a direct conversation with that member */
let started=false;
async function startWith(){
  if(!withUser||withUser===user.uid||started)return;
  started=true;
  const ex=convs.find(c=>!isGroup(c)&&others(c).includes(withUser));
  if(ex){location.replace(OPEN(ex.id));return}
  try{
    const id=[user.uid,withUser].sort().join("_"),now=new Date().toISOString(),ref=doc(db,COL,id);
    if(!(await getDoc(ref)).exists())
      await setDoc(ref,{conservationId:id,createdAt:now,lastMessage:"",lastMessageAt:"",memberIds:[user.uid,withUser],type:"direct",updatedAt:now});
    location.replace(OPEN(id));
  }catch(err){console.error(err);started=false;toast("Could not start the conversation")}
}

function signedOut(){
  $("#app").hidden=true;
  $("#msg").innerHTML=`<div class="state"><h2>Sign in to see your messages</h2><p>Your conversations are private to your account.</p><a class="btn" href="login.html">Sign in</a></div>`;
}
function fail(err){
  console.error(err);$("#app").hidden=true;
  $("#msg").innerHTML=`<div class="state err"><h2>Unable to load messages</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",listen);
}

/* Live inbox: new messages move their conversation to the top */
function listen(){
  if(unsub)unsub();
  unsub=onSnapshot(query(collection(db,COL),where("memberIds","array-contains",user.uid)),async snap=>{
    convs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(when(b)||0)-(when(a)||0));
    await loadProfiles();
    $("#msg").innerHTML="";$("#app").hidden=false;
    render();startWith();
  },fail);
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,u=>{
  user=u;if(unsub){unsub();unsub=null}
  u?listen():signedOut();
});
</script>
