<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Conversations | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{color:#2563eb}

.home{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:900px;
  margin:30px auto;
}

.hero{
  margin-bottom:20px;
}

.hero h1{
  font-size:30px;
  margin-bottom:7px;
}

.hero p{
  color:#64748b;
}

.search{
  background:#fff;
  padding:15px;
  border-radius:13px;
  margin-bottom:18px;
  box-shadow:0 4px 18px #00000008;
}

.search input{
  width:100%;
  padding:12px;
  border:1px solid #dce1e8;
  border-radius:8px;
  outline:none;
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.conversation{
  background:#fff;
  border-radius:13px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
  box-shadow:0 3px 14px #00000008;
  transition:.2s;
}

.conversation:hover{
  transform:translateY(-2px);
}

.avatar{
  width:55px;
  height:55px;
  min-width:55px;
  border-radius:50%;
  object-fit:cover;
  background:#e5e7eb;
}

.info{
  min-width:0;
  flex:1;
}

.name{
  font-weight:700;
  margin-bottom:5px;
}

.message{
  color:#64748b;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  text-align:right;
  color:#94a3b8;
  font-size:12px;
}

.unread{
  display:inline-flex;
  min-width:20px;
  height:20px;
  align-items:center;
  justify-content:center;
  background:#2563eb;
  color:white;
  border-radius:50%;
  font-size:11px;
  margin-top:6px;
}

.empty{
  text-align:center;
  padding:65px 20px;
  color:#64748b;
}

.error{
  color:#dc2626;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="home"
    onclick="location.href='index.html'"
  >
    <i class="fa-solid fa-house"></i>
    Home
  </button>

</header>

<main class="container">

  <section class="hero">

    <h1>Conversations</h1>

    <p>
      View and continue your conversations.
    </p>

  </section>

  <div class="search">

    <input
      id="search"
      type="search"
      placeholder="Search conversations..."
    >

  </div>

  <section
    id="list"
    class="list"
  >

    <div class="empty">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>Loading conversations...</p>

    </div>

  </section>

</main>

<script type="module">

/*
==================================================
CONVERSATIONS COMMUNITY

Private user data.

Firebase Authentication:
- identifies the current user

API:
- loads only conversations belonging to
  the authenticated user

Admin pages are NOT touched.
==================================================
*/

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* ================================
   FIREBASE AUTH
================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* ================================
   STATE
================================ */

let conversations = [];


/* ================================
   DOM
================================ */

const list =
  document.getElementById("list");

const search =
  document.getElementById("search");


/* ================================
   AUTH
================================ */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      list.innerHTML = `

        <div class="empty">

          <i
            class="fa-solid fa-lock"
            style="font-size:38px"
          ></i>

          <h3>
            Login required
          </h3>

          <p>
            Sign in to view your conversations.
          </p>

          <br>

          <button
            class="home"
            onclick="location.href='login.html'"
          >
            Login
          </button>

        </div>

      `;

      return;

    }

    await loadConversations(user);

  }
);


/* ================================
   LOAD API
================================ */

async function loadConversations(user){

  try{

    list.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-spinner fa-spin"></i>

        <p>
          Loading conversations...
        </p>

      </div>

    `;


    /*
      IMPORTANT:

      Do NOT use:

      /api/data?collection=conversations

      because conversations are private.

      Firebase ID token is sent to the
      authenticated API.
    */

    const token =
      await user.getIdToken();


    const response =
      await fetch(
        "/api/data?collection=conversations&limit=100",
        {
          method:"GET",

          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load conversations"
      );

    }


    conversations =
      Array.isArray(result.results)
      ? result.results
      : [];


    render();

  }catch(error){

    console.error(
      "CONVERSATIONS ERROR:",
      error
    );

    list.innerHTML = `

      <div class="empty error">

        <i
          class="fa-solid fa-triangle-exclamation"
          style="font-size:38px"
        ></i>

        <h3>
          Failed to load conversations
        </h3>

        <p>
          ${escapeHTML(error.message)}
        </p>

      </div>

    `;

  }

}


/* ================================
   RENDER
================================ */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const result =
    conversations.filter(
      conversation => {

        const text = [

          conversation.name,
          conversation.title,
          conversation.lastMessage,
          conversation.participantName,
          conversation.username

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return text.includes(keyword);

      }
    );


  if(!result.length){

    list.innerHTML = `

      <div class="empty">

        <i
          class="fa-solid fa-comments"
          style="font-size:40px"
        ></i>

        <h3>
          No conversations
        </h3>

        <p>
          Your conversations will appear here.
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML =
    result
      .map(createConversation)
      .join("");

}


/* ================================
   CONVERSATION CARD
================================ */

function createConversation(item){

  const id =
    item.id ||
    item.documentId ||
    item.conversationId ||
    "";

  const name =
    item.name ||
    item.title ||
    item.participantName ||
    "Conversation";

  const avatar =
    safeImage(
      item.avatar ||
      item.photoURL ||
      item.participantPhoto
    );

  const message =
    item.lastMessage ||
    item.message ||
    "No messages yet.";

  const unread =
    Number(
      item.unreadCount || 0
    );


  return `

    <article
      class="conversation"
      onclick="
        openConversation(
          '${escapeAttr(id)}'
        )
      "
    >

      <img
        class="avatar"
        src="${avatar}"
        alt="${escapeAttr(name)}"
        onerror="
          this.src='https://via.placeholder.com/100';
        "
      >

      <div class="info">

        <div class="name">

          ${escapeHTML(name)}

        </div>

        <div class="message">

          ${escapeHTML(message)}

        </div>

      </div>

      <div class="meta">

        ${
          formatDate(
            item.updatedAt ||
            item.lastMessageAt ||
            item.createdAt
          )
        }

        ${
          unread > 0
          ? `
            <br>

            <span class="unread">
              ${unread > 99 ? "99+" : unread}
            </span>
          `
          : ""
        }

      </div>

    </article>

  `;

}


/* ================================
   OPEN CONVERSATION
================================ */

window.openConversation =
function(id){

  if(!id) return;

  location.href =
    "messages-community.html?conversationId=" +
    encodeURIComponent(id);

};


/* ================================
   SEARCH
================================ */

search.addEventListener(
  "input",
  render
);


/* ================================
   DATE
================================ */

function formatDate(value){

  if(!value) return "";

  try{

    const date =
      new Date(value);

    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "";

    }

    return date.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"short"
      }
    );

  }catch(e){

    return "";

  }

}


/* ================================
   SECURITY
================================ */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}


function safeImage(url){

  if(!url){

    return "https://via.placeholder.com/100";

  }

  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );

    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(e){}

  return "https://via.placeholder.com/100";

}

</script>

</body>
</html>
