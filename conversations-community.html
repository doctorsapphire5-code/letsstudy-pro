<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Conversations | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="Manage your conversations in Let'sStudy Pro Community."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
  --danger:#b91c1c;
  --danger-bg:#fee2e2;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
}


/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  min-height:64px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;

  font-size:14px;
  font-weight:850;
}

.logo-icon{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--primary);
  color:#fff;
}

.back{
  border:0;

  padding:9px 13px;

  border-radius:9px;

  background:var(--soft);

  color:var(--text);

  font-family:inherit;

  font-size:11px;
  font-weight:800;

  cursor:pointer;
}


/* =========================
   MAIN
========================= */

main{
  width:100%;
  max-width:850px;

  margin:auto;

  padding:
    28px 15px
    70px;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:28px;
  font-weight:850;
}

.heading p{
  margin-top:6px;

  color:var(--muted);

  font-size:13px;
  line-height:1.6;
}


/* =========================
   SEARCH
========================= */

.search{
  width:100%;
  height:45px;

  margin-bottom:15px;

  padding:0 14px;

  outline:none;

  border:
    1px solid var(--border);

  border-radius:11px;

  background:#fff;

  color:var(--text);

  font-family:inherit;

  font-size:13px;
}

.search:focus{
  border-color:#64748b;
}


/* =========================
   LIST
========================= */

.list{
  display:flex;

  flex-direction:column;

  gap:9px;
}

.conversation{
  display:flex;

  align-items:center;

  gap:12px;

  padding:14px;

  border:
    1px solid var(--border);

  border-radius:14px;

  background:var(--card);

  cursor:pointer;

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.conversation:hover{
  transform:translateY(-1px);

  box-shadow:
    0 6px 20px
    rgba(15,23,42,.06);
}

.icon{
  width:48px;
  height:48px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:var(--soft);

  font-size:21px;
}

.content{
  min-width:0;

  flex:1;
}

.row{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;
}

.title{
  min-width:0;

  font-size:13px;
  font-weight:850;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.time{
  flex-shrink:0;

  color:var(--muted);

  font-size:9px;
}

.message{
  margin-top:5px;

  color:var(--muted);

  font-size:11px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.meta{
  display:flex;

  align-items:center;

  gap:6px;

  margin-top:6px;
}

.badge{
  padding:
    3px 7px;

  border-radius:6px;

  background:var(--soft);

  color:var(--muted);

  font-size:8px;

  font-weight:800;

  text-transform:capitalize;
}

.members{
  color:var(--muted);

  font-size:8px;
}


/* =========================
   EMPTY
========================= */

.empty{
  display:none;

  padding:60px 20px;

  text-align:center;

  border:
    1px solid var(--border);

  border-radius:15px;

  background:#fff;
}

.empty-icon{
  font-size:40px;

  margin-bottom:10px;
}

.empty h2{
  margin-bottom:5px;

  font-size:16px;
}

.empty p{
  color:var(--muted);

  font-size:12px;
}


/* =========================
   LOADING
========================= */

.loading{
  padding:55px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

.spinner{
  width:30px;
  height:30px;

  margin:
    0 auto
    10px;

  border:
    3px solid var(--border);

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   ERROR
========================= */

.error{
  display:none;

  margin-bottom:15px;

  padding:12px;

  border:
    1px solid #fecaca;

  border-radius:10px;

  background:#fef2f2;

  color:var(--danger);

  font-size:12px;
}

.error.show{
  display:block;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  header{
    padding:0 11px;
  }

  .logo{
    font-size:12px;
  }

  main{
    padding:
      22px 11px
      60px;
  }

  .heading h1{
    font-size:24px;
  }

  .conversation{
    padding:12px;
  }

  .icon{
    width:44px;
    height:44px;
  }

}

</style>

</head>


<body>


<header>

  <div class="logo">

    <div class="logo-icon">
      💬
    </div>

    <span>
      Let'sStudy Pro Community
    </span>

  </div>


  <button
    class="back"
    type="button"
    onclick="goBack()"
  >
    ← Back
  </button>

</header>


<main>


  <section class="heading">

    <h1>
      Conversations
    </h1>

    <p>
      View and manage your Community conversations.
    </p>

  </section>


  <div
    id="error"
    class="error"
  ></div>


  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search conversations..."
    autocomplete="off"
  >


  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <p>
      Loading conversations...
    </p>

  </div>


  <section
    id="list"
    class="list"
  ></section>


  <section
    id="empty"
    class="empty"
  >

    <div class="empty-icon">
      💬
    </div>

    <h2>
      No conversations
    </h2>

    <p>
      Your conversations will appear here.
    </p>

  </section>


</main>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();

const auth =
  firebase.auth();


/* =========================
   STATE
========================= */

let currentUser =
  null;

let conversations =
  [];


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(
  timestamp
){

  if(!timestamp){

    return "Recently";

  }


  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);


    const now =
      new Date();


    const diff =
      now.getTime() -
      date.getTime();


    const minute =
      60 * 1000;

    const hour =
      60 * minute;

    const day =
      24 * hour;


    if(diff < minute){

      return "Now";

    }


    if(diff < hour){

      return `${Math.floor(
        diff / minute
      )}m`;

    }


    if(diff < day){

      return `${Math.floor(
        diff / hour
      )}h`;

    }


    if(diff < 7 * day){

      return `${Math.floor(
        diff / day
      )}d`;

    }


    return date.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"short"
      }
    );

  }

  catch{

    return "Recently";

  }

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  const element =
    document.getElementById(
      "error"
    );

  element.textContent =
    message;

  element.classList.add(
    "show"
  );

}


/* =========================
   LOAD
========================= */

async function loadConversations(){

  const loading =
    document.getElementById(
      "loading"
    );


  try{

    loading.style.display =
      "block";


    const snapshot =
      await db
        .collection(
          "conversations"
        )
        .where(
          "memberIds",
          "array-contains",
          currentUser.uid
        )
        .orderBy(
          "lastMessageAt",
          "desc"
        )
        .get();


    conversations =
      snapshot.docs.map(
        doc => ({

          id:
            doc.id,

          ...doc.data()

        })
      );


    loading.style.display =
      "none";


    render();

  }

  catch(error){

    console.error(
      "Load conversations error:",
      error
    );


    loading.style.display =
      "none";


    showError(
      "Unable to load conversations."
    );

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const list =
    document.getElementById(
      "list"
    );

  const empty =
    document.getElementById(
      "empty"
    );

  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  list.innerHTML =
    "";


  let data =
    conversations;


  if(search){

    data =
      conversations.filter(
        conversation => {

          const type =
            String(
              conversation.type ||
              ""
            ).toLowerCase();


          const message =
            String(
              conversation.lastMessage ||
              ""
            ).toLowerCase();


          return (
            type.includes(
              search
            ) ||

            message.includes(
              search
            )
          );

        }
      );

  }


  if(!data.length){

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  data.forEach(
    conversation => {

      createConversationCard(
        conversation
      );

    }
  );

}


/* =========================
   CARD
========================= */

function createConversationCard(
  conversation
){

  const list =
    document.getElementById(
      "list"
    );


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "conversation";


  const type =
    conversation.type ||
    "direct";


  const memberIds =
    Array.isArray(
      conversation.memberIds
    )
      ? conversation.memberIds
      : [];


  const memberCount =
    memberIds.length;


  let icon =
    "👤";


  if(type === "group"){

    icon =
      "👥";

  }


  const message =
    conversation.lastMessage ||
    "No messages yet";


  card.innerHTML =
    `
      <div class="icon">

        ${icon}

      </div>


      <div class="content">

        <div class="row">

          <div class="title">

            ${escapeHTML(
              type === "group"
                ? "Group Conversation"
                : "Direct Conversation"
            )}

          </div>


          <div class="time">

            ${escapeHTML(
              formatTime(
                conversation.lastMessageAt
              )
            )}

          </div>

        </div>


        <div class="message">

          ${escapeHTML(
            message
          )}

        </div>


        <div class="meta">

          <span class="badge">

            ${escapeHTML(
              type
            )}

          </span>


          <span class="members">

            ${memberCount}
            member${memberCount === 1 ? "" : "s"}

          </span>

        </div>

      </div>
    `;


  card.addEventListener(
    "click",
    () => {

      openConversation(
        conversation.id
      );

    }
  );


  list.appendChild(
    card
  );

}


/* =========================
   OPEN CONVERSATION
========================= */

function openConversation(
  conversationId
){

  if(!conversationId){

    return;

  }


  window.location.href =
    `conversation-community.html?conversationId=${encodeURIComponent(
      conversationId
    )}`;

}


/* =========================
   SEARCH
========================= */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    render
  );


/* =========================
   BACK
========================= */

function goBack(){

  if(
    document.referrer &&
    document.referrer.startsWith(
      window.location.origin
    )
  ){

    window.history.back();

  }

  else{

    window.location.href =
      "community.html";

  }

}


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
  async user => {

    currentUser =
      user;


    if(!user){

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      showError(
        "Please sign in to view your conversations."
      );

      return;

    }


    await loadConversations();

  }
);


/* =========================
   GLOBAL ERROR
========================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled error:",
      event.reason
    );

  }
);

</script>

</body>

</html>
