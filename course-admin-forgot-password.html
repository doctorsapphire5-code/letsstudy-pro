<body>

<div class="container">

  <div class="card">

    <div class="logo">🔐</div>

    <h1>Forgot Password?</h1>

    <p class="muted">
      Enter the email address associated with your administrator account.
      We will send you a password reset link.
    </p>

    <div id="message" class="message"></div>

    <form id="resetForm">

      <div class="field">
        <label for="email">Admin Email Address</label>
        <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" required="">
      </div>

      <button type="submit" id="submitBtn">
        Send Reset Link
      </button>

    </form>

    <div class="links">
      <a href="course-admin-login.html">← Back to Admin Login</a>
    </div>

  </div>

  <footer>
    © <span id="year"></span> Vorix Course. All rights reserved.
    <br><br>
    Secure administrator password recovery.
  </footer>

</div>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDaJ0LKede-fzMTZl-V1SxZ4Ps0IETepE",
    authDomain: "vorix-course.firebaseapp.com",
    projectId: "vorix-course",
    storageBucket: "vorix-course.firebasestorage.app",
    messagingSenderId: "277814413742",
    appId: "1:277814413742:web:fb4515f03591ea07c7603f",
    measurementId: "G-SQ6PN704M7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const $ = id => document.getElementById(id);

  $("year").textContent = new Date().getFullYear();

  function showMessage(message, type = "success") {
    const box = $("message");
    box.textContent = message;
    box.className = "message " + type;
  }

  $("resetForm").addEventListener("submit", async event => {

    event.preventDefault();

    const email = $("email").value.trim().toLowerCase();

    if (!email) {
      showMessage("Please enter your email address.", "error");
      return;
    }

    const button = $("submitBtn");

    button.disabled = true;
    button.textContent = "Sending...";

    try {

      await sendPasswordResetEmail(auth, email);

      showMessage(
        "If an account is registered with this email, a password reset link will be sent. Check your inbox and spam folder."
      );

      $("resetForm").reset();

    } catch (error) {

      console.error("Password recovery error:", error);

      if (
        error.code === "auth/invalid-email"
      ) {
        showMessage("Please enter a valid email address.", "error");

      } else if (
        error.code === "auth/too-many-requests"
      ) {
        showMessage("Too many attempts. Please wait before trying again.", "error");

      } else {
        showMessage(
          "Unable to process your request. Please try again later.",
          "error"
        );
      }

    } finally {

      button.disabled = false;
      button.textContent = "Send Reset Link";

    }

  });

</script>
