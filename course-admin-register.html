<body>

<main class="container"><h1>Create Account | Vorix Course</h1>

<div class="brand">VORIX <span>COURSE</span></div>

<p class="subtitle">
Create your account and start your learning journey.
</p>

<div id="message" class="message" role="alert" aria-live="polite"></div>

<form id="registerForm">

<div class="form-group">
<label for="fullName">Full Name</label>
<input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name" maxlength="100" required="">
</div>

<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" placeholder="name@example.com" autocomplete="email" maxlength="254" required="">
</div>

<div class="form-group">
<label for="password">Password</label>
<div class="password-wrapper">
<input type="password" id="password" placeholder="Minimum 8 characters" autocomplete="new-password" minlength="8" required="">
<button type="button" class="toggle-password" data-target="password">Show</button>
</div>
</div>

<div class="form-group">
<label for="confirmPassword">Confirm Password</label>
<div class="password-wrapper">
<input type="password" id="confirmPassword" placeholder="Enter password again" autocomplete="new-password" minlength="8" required="">
<button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
</div>
</div>

<div class="terms">
<label style="font-weight:normal">
<input type="checkbox" id="terms" required="">
I agree to the Terms and Privacy Policy.
</label>
</div>

<button type="submit" id="registerBtn">
Create Account
</button>

</form>

<div class="links">
Already have an account?
<a href="course-login.html">Sign In</a>
<br>
<a href="course-login.html">Back to Login</a>
</div>

<div class="footer">
© <span id="year"></span> Vorix Course.
Secure Authentication.
</div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
updateProfile,
sendEmailVerification
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// FIREBASE CONFIGURATION
const firebaseConfig = {
apiKey: "AIzaSyDaJ0LKede-fz0MTZl-V1SxZ4Ps0IETepE",
authDomain: "vorix-course.firebaseapp.com",
projectId: "vorix-course",
storageBucket: "vorix-course.firebasestorage.app",
messagingSenderId: "277814413742",
appId: "1:277814413742:web:fb4515f03591ea07c7603f",
measurementId: "G-SQ6PN704M7"
};

// INITIALIZE FIREBASE
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ELEMENTS
const form = document.getElementById("registerForm");
const btn = document.getElementById("registerBtn");
const message = document.getElementById("message");

document.getElementById("year").textContent =
new Date().getFullYear();

// SHOW / HIDE PASSWORD
document.querySelectorAll(".toggle-password").forEach(button => {
button.addEventListener("click", () => {
const target = document.getElementById(button.dataset.target);

if(target.type === "password"){
target.type = "text";
button.textContent = "Hide";
}else{
target.type = "password";
button.textContent = "Show";
}
});
});

// DISPLAY MESSAGE
function showMessage(text,type){
message.textContent = text;
message.className = "message " + type;
}

// FIREBASE ERROR HANDLING
function errorMessage(error){

const errors = {

"auth/email-already-in-use":
"This email is already registered. Please sign in.",

"auth/invalid-email":
"Please enter a valid email address.",

"auth/weak-password":
"Password must contain at least 8 characters.",

"auth/operation-not-allowed":
"Email and Password authentication is not enabled in Firebase.",

"auth/network-request-failed":
"Network error. Check your internet connection.",

"auth/api-key-not-valid.-please-pass-a-valid-api-key.":
"Invalid Firebase API Key. Check your Firebase configuration.",

"permission-denied":
"Your account was created, but the user profile could not be saved. Contact support."

};

return errors[error.code] ||
error.message ||
"Registration failed. Please try again.";
}

// CREATE ACCOUNT
form.addEventListener("submit", async (e) => {

e.preventDefault();

if(btn.disabled)return;

const fullName =
document.getElementById("fullName").value.trim();

const email =
document.getElementById("email").value.trim().toLowerCase();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const acceptedTerms =
document.getElementById("terms").checked;

// VALIDATION
if(fullName.length < 2){
showMessage("Please enter your full name.","error");
return;
}

if(password.length < 8){
showMessage("Password must contain at least 8 characters.","error");
return;
}

if(password !== confirmPassword){
showMessage("Passwords do not match.","error");
return;
}

if(!acceptedTerms){
showMessage("Please accept the Terms and Privacy Policy.","error");
return;
}

// START REGISTRATION
btn.disabled = true;
btn.textContent = "Creating Account...";

try{

// CREATE FIREBASE AUTH ACCOUNT
const credential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const user = credential.user;

// UPDATE AUTH PROFILE
await updateProfile(user,{
displayName:fullName
});

// USER DATABASE RECORD
const userData = {

uid:user.uid,

fullName:fullName,
displayName:fullName,
email:email,

role:"user",
status:"active",
accountType:"student",

emailVerified:false,

provider:"password",

createdAt:serverTimestamp(),
updatedAt:serverTimestamp(),

lastLoginAt:null,
loginCount:0

};

// SAVE USER TO FIRESTORE
await setDoc(
doc(db,"users",user.uid),
userData
);

// SEND VERIFICATION EMAIL
let verificationSent = true;

try{

await sendEmailVerification(user);

}catch(verificationError){

console.error(
"Verification email error:",
verificationError
);

verificationSent = false;

}

// SUCCESS
form.reset();

showMessage(
"Account created successfully! " +
(verificationSent
? "A verification link has been sent to your email. Please verify your email before signing in."
: "Your account was created, but the verification email could not be sent. You can request another verification email later."),
"success"
);

btn.textContent = "Account Created";

// REDIRECT
setTimeout(() => {
window.location.href = "course-login.html";
},4000);

}catch(error){

console.error("Registration error:",error);

showMessage(errorMessage(error),"error");

btn.disabled = false;
btn.textContent = "Create Account";

}

});

</script>



</body></html>
