<body>

  <main class="container"><h1>Admin Registration | Vorix Course</h1>

    <div class="brand">
      VORIX <span>COURSE</span>
    </div>

    <p class="subtitle">
      Authorized Administrator Registration
    </p>

    <div class="security">
      <strong>Restricted Access</strong><br>
      Only an existing active administrator can register another administrator.
    </div>

    <div id="message" class="message" role="alert"></div>

    <form id="adminRegisterForm">

      <div class="form-group">
        <label for="fullName">Administrator Full Name</label>
        <input type="text" id="fullName" placeholder="Enter full name" autocomplete="name" maxlength="100" required="">
      </div>

      <div class="form-group">
        <label for="email">Administrator Email</label>
        <input type="email" id="email" placeholder="Enter email address" autocomplete="email" required="">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 8 characters" autocomplete="new-password" minlength="8" required="">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password" minlength="8" required="">
      </div>

      <button type="submit" class="submit-btn" id="registerBtn" disabled="">
        Checking Administrator Access...
      </button>

    </form>

    <div class="links">
      <a href="course-admin-dashboard.html">
        Back to Admin Dashboard
      </a>
      <br>
      <a href="course-admin-login.html">
        Admin Sign In
      </a>
    </div>

    <div class="footer">
      © <span id="year"></span> Vorix Course. Administrator Portal.
    </div>

  </main>


  <script type="module">

    import { initializeApp, deleteApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      createUserWithEmailAndPassword,
      updateProfile,
      sendEmailVerification,
      deleteUser
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyDaJ0LKede-fz0MTZl-V1SxZ4Ps0IETepE",
      authDomain: "vorix-course.firebaseapp.com",
      projectId: "vorix-course",
      storageBucket: "vorix-course.firebasestorage.app",
      messagingSenderId: "277814413742",
      appId: "1:277814413742:web:fb4515f03591ea07c7603f",
      measurementId: "G-SQ6PN704M7"
    };


    // PRIMARY FIREBASE APP
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    // PAGE ELEMENTS
    const form = document.getElementById("adminRegisterForm");
    const registerBtn = document.getElementById("registerBtn");
    const messageBox = document.getElementById("message");

    let currentAdmin = null;
    let accessChecked = false;
    let registrationInProgress = false;


    document.getElementById("year").textContent =
      new Date().getFullYear();


    // DISPLAY MESSAGE
    function showMessage(message, type) {

      messageBox.textContent = message;
      messageBox.className = "message " + type;

    }


    // VERIFY CURRENT ADMIN
    async function verifyCurrentAdmin(user) {

      if (!user) {
        throw new Error("NOT_LOGGED_IN");
      }

      const adminRef = doc(db, "admins", user.uid);
      const adminSnap = await getDoc(adminRef);

      if (!adminSnap.exists()) {
        throw new Error("ADMIN_NOT_FOUND");
      }

      const adminData = adminSnap.data();

      if (
        String(adminData.role || "").toLowerCase() !== "admin" ||
        String(adminData.status || "").toLowerCase() !== "active" ||
        typeof adminData.adminId !== "string" ||
        !adminData.adminId.trim()
      ) {
        throw new Error("ADMIN_NOT_AUTHORIZED");
      }

      currentAdmin = {
        uid: user.uid,
        adminId: adminData.adminId
      };

      return adminData;

    }


    // CHECK AUTHENTICATION STATE
    onAuthStateChanged(auth, async user => {

      accessChecked = false;
      currentAdmin = null;

      registerBtn.disabled = true;

      if (!user) {

        registerBtn.textContent = "Admin Sign In Required";

        showMessage(
          "Please sign in with an authorized administrator account first.",
          "error"
        );

        return;

      }

      try {

        await verifyCurrentAdmin(user);

        accessChecked = true;

        registerBtn.disabled = false;
        registerBtn.textContent = "Register Administrator";

        showMessage(
          "Administrator access verified. You can register a new administrator.",
          "success"
        );

      } catch (error) {

        console.error("Admin verification error:", error);

        registerBtn.disabled = true;
        registerBtn.textContent = "Access Denied";

        showMessage(
          "Access denied. Your account is not an active authorized administrator.",
          "error"
        );

      }

    });


    // GENERATE ADMIN ID
    function generateAdminId() {

      const randomPart = crypto.randomUUID()
        .replace(/-/g, "")
        .substring(0, 8)
        .toUpperCase();

      return "ADM-" + randomPart;

    }


    // FIREBASE ERROR MESSAGES
    function getErrorMessage(error) {

      const errors = {

        "auth/email-already-in-use":
          "This email address is already registered.",

        "auth/invalid-email":
          "Please enter a valid email address.",

        "auth/weak-password":
          "Password must contain at least 8 characters.",

        "auth/network-request-failed":
          "Network error. Check your internet connection.",

        "auth/too-many-requests":
          "Too many attempts. Please try again later.",

        "auth/operation-not-allowed":
          "Email and password authentication is not enabled in Firebase.",

        "permission-denied":
          "Permission denied. Check your Firestore Security Rules."

      };

      return errors[error.code] ||
        error.message ||
        "Administrator registration failed.";

    }


    // ADMIN REGISTRATION
    form.addEventListener("submit", async event => {

      event.preventDefault();

      if (
        !accessChecked ||
        !currentAdmin ||
        registrationInProgress
      ) {

        showMessage(
          "You are not authorized to register administrators.",
          "error"
        );

        return;

      }


      const fullName = document
        .getElementById("fullName")
        .value.trim();

      const email = document
        .getElementById("email")
        .value.trim()
        .toLowerCase();

      const password = document
        .getElementById("password")
        .value;

      const confirmPassword = document
        .getElementById("confirmPassword")
        .value;


      // VALIDATION
      if (!fullName || !email || !password) {

        showMessage(
          "Please complete all required fields.",
          "error"
        );

        return;

      }

      if (password.length < 8) {

        showMessage(
          "Password must contain at least 8 characters.",
          "error"
        );

        return;

      }

      if (password !== confirmPassword) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;

      }

      if (auth.currentUser?.uid !== currentAdmin.uid) {

        showMessage(
          "Your administrator session has changed. Sign in again.",
          "error"
        );

        return;

      }


      registrationInProgress = true;

      registerBtn.disabled = true;
      registerBtn.textContent = "Registering Administrator...";

      let secondaryApp = null;
      let secondaryUser = null;
      let adminDocumentCreated = false;


      try {

        // VERIFY THE EXISTING ADMIN AGAIN
        const creator = auth.currentUser;

        await verifyCurrentAdmin(creator);


        // CREATE A SECONDARY FIREBASE APP
        // THIS PRESERVES THE EXISTING ADMIN SESSION
        secondaryApp = initializeApp(
          firebaseConfig,
          "AdminRegistration_" + crypto.randomUUID()
        );

        const secondaryAuth = getAuth(secondaryApp);

        const secondaryDb = getFirestore(secondaryApp);


        // CREATE NEW AUTH ACCOUNT
        const credential =
          await createUserWithEmailAndPassword(
            secondaryAuth,
            email,
            password
          );

        secondaryUser = credential.user;


        // UPDATE NEW AUTH PROFILE
        await updateProfile(secondaryUser, {
          displayName: fullName
        });


        const newAdminId = generateAdminId();


        // ADMIN DOCUMENT DATA
        const adminData = {

          adminId: newAdminId,

          userId: secondaryUser.uid,

          fullName: fullName,

          displayName: fullName,

          email: email,

          role: "admin",

          status: "active",

          adminType: "admin",

          permissions: [
            "dashboard.read",
            "users.read",
            "courses.read",
            "courses.create",
            "courses.update",
            "enrollments.read"
          ],

          emailVerified: false,

          provider: "password",

          providers: ["password"],

          createdBy: creator.uid,

          createdByAdminId: currentAdmin.adminId,

          createdAt: serverTimestamp(),

          updatedAt: serverTimestamp(),

          lastLoginAt: null,

          loginCount: 0

        };


        // SAVE TO ADMINS COLLECTION
        // THE EXISTING ADMIN'S SESSION IS NOT REPLACED
        await setDoc(
          doc(db, "admins", secondaryUser.uid),
          adminData
        );

        adminDocumentCreated = true;


        // SEND VERIFICATION EMAIL
        let verificationSent = true;

        try {

          await sendEmailVerification(secondaryUser);

        } catch (verificationError) {

          console.error(
            "Verification email error:",
            verificationError
          );

          verificationSent = false;

        }


        // SUCCESS
        showMessage(
          "Administrator registered successfully. Admin ID: " +
          newAdminId +
          (
            verificationSent
              ? ". Verification email sent."
              : ". Verification email could not be sent. The administrator can request another email later."
          ),
          "success"
        );

        form.reset();


      } catch (error) {

        console.error(
          "Administrator registration error:",
          error
        );


        // CLEAN UP AUTH ACCOUNT IF FIRESTORE WRITE FAILED
        if (secondaryUser && !adminDocumentCreated) {

          try {

            await deleteUser(secondaryUser);

          } catch (cleanupError) {

            console.error(
              "Account cleanup failed:",
              cleanupError
            );

            showMessage(
              "Registration failed while saving the admin record. An Auth account may remain and requires manual review. " +
              getErrorMessage(error),
              "error"
            );

          }

        }


        if (
          !secondaryUser ||
          adminDocumentCreated
        ) {

          showMessage(
            getErrorMessage(error),
            "error"
          );

        }

      } finally {

        // CLOSE SECONDARY APP
        if (secondaryApp) {

          try {

            await deleteApp(secondaryApp);

          } catch (cleanupError) {

            console.error(
              "Secondary app cleanup error:",
              cleanupError
            );

          }

        }

        registrationInProgress = false;

        registerBtn.disabled = !accessChecked;

        registerBtn.textContent = accessChecked
          ? "Register Administrator"
          : "Access Denied";

      }

    });

  </script>



</body></html>
