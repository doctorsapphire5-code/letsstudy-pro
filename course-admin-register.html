
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Create Account | Vorix Course</title>
<meta name="description" content="Create your Vorix Course learning account.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.container{
  width:100%;max-width:440px;
  background:#fff;padding:30px;
  border-radius:16px;
  border:1px solid #e2e8f0;
  box-shadow:0 10px 35px rgba(15,23,42,.08)
}
.brand{text-align:center;font-size:27px;font-weight:bold;margin-bottom:10px}
.brand span{color:#2563eb}
.subtitle{text-align:center;color:#64748b;font-size:13px;line-height:1.6;margin-bottom:25px}
.form-group{margin-bottom:17px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
input{
 width:100%;padding:14px;
 border:1px solid #cbd5e1;border-radius:8px;
 font-size:14px;outline:none
}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}
button{
 width:100%;padding:14px;border:0;border-radius:8px;
 background:#2563eb;color:white;font-weight:bold;
 font-size:14px;cursor:pointer
}
button:hover{background:#1d4ed8}
button:disabled{opacity:.6;cursor:not-allowed}
.message{
 display:none;padding:12px;border-radius:8px;
 margin-bottom:17px;font-size:13px;line-height:1.6;
 overflow-wrap:anywhere
}
.message.error{display:block;background:#fee2e2;color:#991b1b}
.message.success{display:block;background:#dcfce7;color:#166534}
.message.info{display:block;background:#eff6ff;color:#1e40af}
.links{text-align:center;margin-top:22px;font-size:13px;line-height:2.2}
a{color:#2563eb;text-decoration:none}
.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:25px}
@media(max-width:450px){.container{padding:24px 19px}}
</style>
</head>

<body>

<main class="container">

<div class="brand">VORIX <span>COURSE</span></div>

<p class="subtitle">
Create your account and start your learning journey.
</p>

<div id="message" class="message" role="alert"></div>

<form id="registerForm">

<div class="form-group">
<label for="fullName">Full Name</label>
<input type="text" id="fullName"
placeholder="Enter your full name"
autocomplete="name" maxlength="100" required>
</div>

<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email"
placeholder="name@example.com"
autocomplete="email" required>
</div>

<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password"
placeholder="Minimum 8 characters"
autocomplete="new-password"
minlength="8" required>
</div>

<div class="form-group">
<label for="confirmPassword">Confirm Password</label>
<input type="password" id="confirmPassword"
placeholder="Enter password again"
autocomplete="new-password"
minlength="8" required>
</div>

<button type="submit" id="registerBtn">
Create Account
</button>

</form>

<div class="links">
Already have an account?
<a href="course-login.html">Sign In</a>
<br>
<a href="course-login.html">Back to Login</a>
</div>

<div class="footer">
© <span id="year"></span> Vorix Course.
Secure Authentication.
</div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 updateProfile,
 sendEmailVerification
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 setDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// FIREBASE CONFIGURATION
// Copy the REAL configuration from Firebase Console.

const firebaseConfig = {
 apiKey: "PASTE_YOUR_REAL_API_KEY_HERE",
 authDomain: "vorix-course.firebaseapp.com",
 projectId: "vorix-course",
 storageBucket: "vorix-course.firebasestorage.app",
 messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
 appId: "YOUR_WEB_APP_ID"
};

// INITIALIZE FIREBASE
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ELEMENTS
const form = document.getElementById("registerForm");
const btn = document.getElementById("registerBtn");
const message = document.getElementById("message");

document.getElementById("year").textContent =
new Date().getFullYear();

// DISPLAY MESSAGE
function showMessage(text,type){
 message.textContent = text;
 message.className = "message " + type;
}

// FIREBASE ERRORS
function errorMessage(error){

 const errors = {
  "auth/email-already-in-use":"This email is already registered. Please sign in.",
  "auth/invalid-email":"Please enter a valid email address.",
  "auth/weak-password":"Password must contain at least 8 characters.",
  "auth/operation-not-allowed":"Email and Password authentication is not enabled.",
  "auth/network-request-failed":"Network error. Check your internet connection.",
  "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"Invalid Firebase API Key. Check your Firebase configuration.",
  "permission-denied":"Account created, but the profile could not be saved. Check Firestore Security Rules."
 };

 return errors[error.code] || error.message || "Registration failed.";
}

// CREATE ACCOUNT
form.addEventListener("submit", async (e)=>{

 e.preventDefault();

 const fullName =
 document.getElementById("fullName").value.trim();

 const email =
 document.getElementById("email").value.trim().toLowerCase();

 const password =
 document.getElementById("password").value;

 const confirmPassword =
 document.getElementById("confirmPassword").value;

 if(!fullName){
  showMessage("Please enter your full name.","error");
  return;
 }

 if(password.length < 8){
  showMessage("Password must contain at least 8 characters.","error");
  return;
 }

 if(password !== confirmPassword){
  showMessage("Passwords do not match.","error");
  return;
 }

 if(firebaseConfig.apiKey === "PASTE_YOUR_REAL_API_KEY_HERE"){
  showMessage("Please configure your real Firebase API Key first.","error");
  return;
 }

 btn.disabled = true;
 btn.textContent = "Creating Account...";

 try{

  // CREATE FIREBASE AUTH ACCOUNT
  const credential =
  await createUserWithEmailAndPassword(
   auth,email,password
  );

  const user = credential.user;

  // UPDATE USER PROFILE
  await updateProfile(user,{
   displayName:fullName
  });

  // USER DATABASE RECORD
  const userData = {

   uid:user.uid,
   fullName:fullName,
   displayName:fullName,
   email:email,

   role:"user",
   status:"active",
   accountType:"student",

   emailVerified:false,

   provider:"password",

   createdAt:serverTimestamp(),
   updatedAt:serverTimestamp(),

   lastLoginAt:null,
   loginCount:0

  };

  // SAVE TO FIRESTORE
  await setDoc(
   doc(db,"users",user.uid),
   userData
  );

  // SEND VERIFICATION EMAIL
  let verificationSent = true;

  try{
   await sendEmailVerification(user);
  }catch(error){
   console.error("Verification error:",error);
   verificationSent = false;
  }

  form.reset();

  showMessage(
   "Account created successfully! " +
   (verificationSent
    ? "A verification link has been sent to your email. Please verify your email before signing in."
    : "Your account was created, but the verification email could not be sent. Request another verification email after signing in."),
   "success"
  );

  btn.textContent = "Account Created";

  setTimeout(()=>{
   window.location.href = "course-login.html";
  },4000);

 }catch(error){

  console.error("Registration error:",error);

  showMessage(errorMessage(error),"error");

  btn.disabled = false;
  btn.textContent = "Create Account";

 }

});

</script>

</body>
</html>
