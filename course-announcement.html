<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course Announcements | LetsStudy Pro</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

.header{
  background:#ffffff;
  border-bottom:1px solid #e5e7eb;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#111827;
}

.logo span{
  color:#2563eb;
}

.back-btn{
  text-decoration:none;
  background:#eef2ff;
  color:#2563eb;
  padding:10px 15px;
  border-radius:9px;
  font-weight:700;
}

.container{
  max-width:1000px;
  margin:0 auto;
  padding:30px 18px 50px;
}

.hero{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  padding:30px;
  border-radius:18px;
  margin-bottom:25px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  opacity:.9;
  line-height:1.6;
}

.course-name{
  margin-top:15px;
  font-size:14px;
  opacity:.9;
}

.toolbar{
  background:white;
  border:1px solid #e5e7eb;
  padding:15px;
  border-radius:13px;
  margin-bottom:20px;
}

.toolbar input{
  width:100%;
  padding:12px 14px;
  border:1px solid #d1d5db;
  border-radius:9px;
  outline:none;
}

.toolbar input:focus{
  border-color:#2563eb;
}

.announcement-list{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.announcement{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:22px;
  transition:.2s;
}

.announcement:hover{
  box-shadow:0 8px 25px rgba(15,23,42,.08);
  transform:translateY(-1px);
}

.announcement-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:12px;
}

.announcement-title{
  font-size:20px;
  font-weight:800;
  line-height:1.4;
}

.priority{
  display:inline-flex;
  align-items:center;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  white-space:nowrap;
}

.priority-low{
  background:#f1f5f9;
  color:#475569;
}

.priority-normal{
  background:#dbeafe;
  color:#1d4ed8;
}

.priority-high{
  background:#fef3c7;
  color:#92400e;
}

.priority-urgent{
  background:#fee2e2;
  color:#b91c1c;
}

.message{
  color:#475569;
  line-height:1.7;
  white-space:pre-wrap;
  margin-bottom:17px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  color:#64748b;
  font-size:13px;
  border-top:1px solid #f1f5f9;
  padding-top:14px;
}

.meta-item{
  display:flex;
  align-items:center;
  gap:6px;
}

.loading{
  background:white;
  padding:45px;
  text-align:center;
  border-radius:15px;
  color:#64748b;
}

.empty{
  background:white;
  padding:45px;
  text-align:center;
  border-radius:15px;
  border:1px solid #e5e7eb;
  color:#64748b;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:18px;
  border-radius:12px;
  text-align:center;
}

@media(max-width:600px){

  .header{
    padding:0 15px;
  }

  .logo{
    font-size:19px;
  }

  .container{
    padding:20px 12px 40px;
  }

  .hero{
    padding:23px;
  }

  .hero h1{
    font-size:25px;
  }

  .announcement{
    padding:18px;
  }

  .announcement-top{
    flex-direction:column;
  }

  .priority{
    align-self:flex-start;
  }

}

</style>

</head>

<body>


<header class="header">

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <a
    href="course-learn.html"
    class="back-btn">
    ← Back to Course
  </a>

</header>


<main class="container">


  <section class="hero">

    <h1>
      Course Announcements
    </h1>

    <p>
      Stay updated with the latest announcements,
      important notices and course updates.
    </p>

    <div
      class="course-name"
      id="courseName">
      Loading course...
    </div>

  </section>


  <div class="toolbar">

    <input
      type="search"
      id="searchInput"
      placeholder="Search announcements...">

  </div>


  <section
    id="announcementList"
    class="announcement-list">

    <div class="loading">
      Loading announcements...
    </div>

  </section>

</main>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  where
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const list =
  document.getElementById(
    "announcementList"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const courseName =
  document.getElementById(
    "courseName"
  );


/* =====================================================
   COURSE ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const courseId =
  params.get("courseId") ||
  params.get("id");


/* =====================================================
   DATA
===================================================== */

let announcements = [];


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  if(
    value === undefined ||
    value === null
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value){

  if(!value){

    return "Not specified";

  }

  try{

    let date;

    if(
      typeof value === "object" &&
      value.seconds
    ){

      date =
        new Date(
          value.seconds * 1000
        );

    }else{

      date =
        new Date(value);

    }

    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "Not specified";

    }

    return date.toLocaleString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch(error){

    return "Not specified";

  }

}


/* =====================================================
   PRIORITY
===================================================== */

function priorityClass(priority){

  const value =
    String(
      priority || "normal"
    ).toLowerCase();


  if(value === "low"){
    return "priority-low";
  }

  if(value === "high"){
    return "priority-high";
  }

  if(value === "urgent"){
    return "priority-urgent";
  }

  return "priority-normal";

}


/* =====================================================
   LOAD ANNOUNCEMENTS
===================================================== */

async function loadAnnouncements(){

  try{

    let snapshot;


    if(courseId){

      const announcementsQuery =
        query(
          collection(
            db,
            "announcements"
          ),
          where(
            "courseId",
            "==",
            courseId
          )
        );


      snapshot =
        await getDocs(
          announcementsQuery
        );

    }else{

      snapshot =
        await getDocs(
          collection(
            db,
            "announcements"
          )
        );

    }


    announcements = [];


    snapshot.forEach(
      announcementDoc => {

        announcements.push({

          id:
            announcementDoc.id,

          ...announcementDoc.data()

        });

      }
    );


    announcements.sort(
      (a,b) => {

        const dateA =
          getTime(
            a.publishDate
          );

        const dateB =
          getTime(
            b.publishDate
          );

        return dateB - dateA;

      }
    );


    if(
      announcements.length > 0
    ){

      courseName.textContent =
        announcements[0].courseName ||
        `Course ID: ${courseId || "All Courses"}`;

    }else{

      courseName.textContent =
        courseId
        ? `Course ID: ${courseId}`
        : "All Course Announcements";

    }


    renderAnnouncements();

  }catch(error){

    console.error(
      "Announcement loading error:",
      error
    );


    list.innerHTML = `

      <div class="error">

        Unable to load announcements.
        Please try again.

      </div>

    `;

  }

}


/* =====================================================
   GET TIMESTAMP
===================================================== */

function getTime(value){

  if(!value){

    return 0;

  }

  try{

    if(
      typeof value === "object" &&
      value.seconds
    ){

      return (
        Number(value.seconds) * 1000
      );

    }

    const date =
      new Date(value);

    return date.getTime() || 0;

  }catch(error){

    return 0;

  }

}


/* =====================================================
   RENDER
===================================================== */

function renderAnnouncements(){

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    announcements.filter(
      announcement => {

        const text = [

          announcement.title,

          announcement.message,

          announcement.priority,

          announcement.createdBy

        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return (
          !search ||
          text.includes(search)
        );

      }
    );


  if(
    filtered.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        <h3 style="margin-bottom:8px;">
          No announcements found
        </h3>

        <p>
          There are currently no announcements
          available for this course.
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered.map(
      announcement => {

        const priority =
          String(
            announcement.priority ||
            "normal"
          ).toLowerCase();


        return `

          <article
            class="announcement">

            <div
              class="announcement-top">

              <h2
                class="announcement-title">

                ${escapeHTML(
                  announcement.title ||
                  "Untitled Announcement"
                )}

              </h2>


              <span
                class="priority
                ${priorityClass(priority)}">

                ${escapeHTML(
                  priority
                )}

              </span>

            </div>


            <div
              class="message">

              ${escapeHTML(
                announcement.message ||
                "No message available."
              )}

            </div>


            <div
              class="meta">

              <div
                class="meta-item">

                📅

                <span>

                  ${formatDate(
                    announcement.publishDate
                  )}

                </span>

              </div>


              <div
                class="meta-item">

                👤

                <span>

                  ${escapeHTML(
                    announcement.createdBy ||
                    "Admin"
                  )}

                </span>

              </div>


              ${
                announcement.courseId
                ?
                `
                <div
                  class="meta-item">

                  🎓

                  <span>

                    ${escapeHTML(
                      announcement.courseId
                    )}

                  </span>

                </div>
                `
                :
                ""
              }

            </div>

          </article>

        `;

      }
    ).join("");

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  renderAnnouncements
);


/* =====================================================
   START
===================================================== */

loadAnnouncements();

</script>

</body>
</html>
