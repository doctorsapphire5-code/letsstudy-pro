<style>
:root{
  --ink:#0d1b2a;--ink-2:#16293f;--paper:#f2f5f9;--card:#fff;--line:#dde4ec;
  --mute:#5b6b7e;--brand:#0a7c66;--brand-soft:#e2f4ef;--amber:#f2a93b;--red:#c0392b;
  --head:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.i{width:17px;height:17px;min-width:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,5%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:20px;font-weight:700;letter-spacing:-.3px;text-decoration:none}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--amber);display:grid;place-items:center;font-size:16px}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;text-decoration:none}
.back-btn:hover{background:var(--ink-2)}
.back-btn .i{width:15px;height:15px;transform:rotate(180deg)}

.container{flex:1;width:min(860px,92%);margin:0 auto;padding:30px 0 64px}

/* HERO */
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:34px 36px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;border:40px solid rgba(242,169,59,.08);pointer-events:none}
.hero h1{font-family:var(--head);font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.8px;margin-bottom:10px}
.hero p{color:#b6c3d2;max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.1);color:#dbe4ee;font-size:13px;font-weight:500}
.chip:empty{display:none}

/* TOOLBAR */
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px;display:grid;gap:12px}
.search{position:relative}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--line);border-radius:11px;background:var(--paper);font:500 15px var(--body);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex-shrink:0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--mute);font:600 13px var(--body);cursor:pointer;transition:all .2s}
.filter:hover{border-color:var(--ink);color:var(--ink)}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.filter small{font-weight:700;margin-left:5px;opacity:.7}

/* LIST */
.announcement-list{display:grid;gap:14px}
.announcement{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px 20px 28px;overflow:hidden;transition:border-color .2s}
.announcement::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bar,var(--brand))}
.announcement:hover{border-color:#c4cfdb}
.announcement.p-urgent{--bar:var(--red)}
.announcement.p-high{--bar:var(--amber)}
.announcement.p-low{--bar:#b6c2d0}
.announcement-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px}
.announcement-title{font-family:var(--head);font-size:20px;line-height:1.3;letter-spacing:-.3px}
.priority{flex-shrink:0;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700;text-transform:capitalize}
.priority-low{background:#eef1f4;color:#5b6b7e}
.priority-normal{background:var(--brand-soft);color:var(--brand)}
.priority-high{background:#fdf0d6;color:#8a5a06}
.priority-urgent{background:#fde4e1;color:#a8281b}
.message{color:#3b4a5d;white-space:pre-wrap;word-break:break-word;margin-bottom:16px;max-width:70ch}
.message a{color:var(--brand);font-weight:600;text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);font-size:13px;border-top:1px solid #edf1f5;padding-top:12px}
.meta-item{display:flex;align-items:center;gap:7px}

/* STATES */
.empty,.error{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:48px 24px;text-align:center;color:var(--mute)}
.empty h3,.error h3{font-family:var(--head);font-size:19px;color:var(--ink);margin-bottom:6px}
.state-icon{width:54px;height:54px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.state-icon .i{width:26px;height:26px}
.error{border-color:#fecaca}
.error .state-icon{background:#fee2e2;color:#b91c1c}
.retry{margin-top:16px;padding:11px 20px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 14px var(--body);cursor:pointer}
@keyframes sh{to{background-position:-200% 0}}
.sk{height:132px;border-radius:16px;background:linear-gradient(90deg,#e6ebf1 25%,#f4f7fa 50%,#e6ebf1 75%) 0 0/200% 100%;animation:sh 1.4s linear infinite}

.footer{padding:26px;background:#fff;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:14px}

@media(max-width:600px){
  .container{padding:18px 0 44px}
  .hero{padding:26px 22px}
  .announcement{padding:18px 18px 16px 22px}
  .announcement-top{flex-direction:column;gap:8px}
  .priority{order:-1}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-mega" viewBox="0 0 24 24"><path d="M4 10v4h3l8 4V6L7 10zM18 9a4 4 0 0 1 0 6"/></symbol>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">L</span>LetsStudy Pro</a>
  <a class="back-btn" id="backBtn" href="course-learn.html"><svg class="i"><use href="#i-arrow"/></svg>Back to course</a>
</header>

<main class="container">
  <section class="hero">
    <h1>Course announcements</h1>
    <p>Important notices and updates from your instructors, newest first.</p>
    <div class="chips">
      <span class="chip" id="courseName"></span>
      <span class="chip" id="countChip"></span>
    </div>
  </section>

  <div class="toolbar">
    <label class="search">
      <svg class="i"><use href="#i-search"/></svg>
      <input type="search" id="searchInput" placeholder="Search announcements" aria-label="Search announcements" autocomplete="off">
    </label>
    <div class="filters" id="filters" role="group" aria-label="Filter by priority"></div>
  </div>

  <section id="announcementList" class="announcement-list" aria-live="polite">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </section>
</main>

<footer class="footer">© 2026 LetsStudy Pro. Learn. Build. Grow.</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, getDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const db = getFirestore(initializeApp(firebaseConfig));

/* ELEMENTS */
const $ = (id) => document.getElementById(id);
const list = $("announcementList"), searchInput = $("searchInput"), filtersEl = $("filters");

/* COURSE ID */
const params = new URLSearchParams(window.location.search);
const courseId = params.get("courseId") || params.get("id");
if(courseId) $("backBtn").href = `course-learn.html?courseId=${encodeURIComponent(courseId)}`;

/* STATE */
let announcements = [];
let activePriority = "all";
const PRIORITIES = ["all", "urgent", "high", "normal", "low"];

/* HELPERS */
const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const escapeHTML = (v) => (v === undefined || v === null) ? "" : String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const norm = (p) => { const v = String(p || "normal").toLowerCase(); return ["low","high","urgent"].includes(v) ? v : "normal"; };

function getTime(value){
  if(!value) return 0;
  try{
    if(typeof value.toDate === "function") return value.toDate().getTime();
    if(typeof value === "object" && value.seconds) return Number(value.seconds) * 1000;
    return new Date(value).getTime() || 0;
  }catch(e){ return 0; }
}

function formatDate(value){
  const t = getTime(value);
  if(!t) return { rel: "Date not specified", full: "" };
  const d = new Date(t);
  const full = d.toLocaleString(undefined, { year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
  const mins = Math.round((Date.now() - t) / 60000);
  let rel = full;
  if(mins >= 0 && mins < 1) rel = "Just now";
  else if(mins >= 0 && mins < 60) rel = `${mins} min ago`;
  else if(mins >= 60 && mins < 1440) rel = `${Math.floor(mins / 60)} h ago`;
  else if(mins >= 1440 && mins < 10080) rel = `${Math.floor(mins / 1440)} d ago`;
  return { rel, full };
}

/* Escape first, then turn plain URLs into safe links */
function formatMessage(value){
  return escapeHTML(value).replace(/(https?:\/\/[^\s<]+)/g, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

/* LOAD: course-specific only, never every announcement */
async function loadAnnouncements(){
  if(!courseId){
    list.innerHTML = `
      <div class="error"><div class="state-icon">${icon("alert")}</div>
        <h3>Course not specified</h3>
        <p>Open announcements from a course page to see its updates.</p>
      </div>`;
    return;
  }

  try{
    const [snapshot, courseSnap] = await Promise.all([
      getDocs(query(collection(db, "announcements"), where("courseId", "==", courseId))),
      getDoc(doc(db, "courses", courseId)).catch(() => null)
    ]);

    announcements = [];
    snapshot.forEach((d) => announcements.push({ id: d.id, ...d.data() }));
    announcements.sort((a, b) => getTime(b.publishDate) - getTime(a.publishDate));

    const c = courseSnap && courseSnap.exists() ? courseSnap.data() : {};
    $("courseName").textContent = c.title || c.name || c.courseName || announcements[0]?.courseName || "";

    renderFilters();
    renderAnnouncements();
  }catch(error){
    console.error("Announcement loading error:", error);
    list.innerHTML = `
      <div class="error"><div class="state-icon">${icon("alert")}</div>
        <h3>Unable to load announcements</h3>
        <p>Check your connection and try again.</p>
        <button class="retry" id="retryBtn" type="button">Try again</button>
      </div>`;
    $("retryBtn").addEventListener("click", () => window.location.reload());
  }
}

/* FILTERS */
function renderFilters(){
  const counts = { all: announcements.length };
  announcements.forEach(a => { const p = norm(a.priority); counts[p] = (counts[p] || 0) + 1; });
  $("countChip").textContent = `${announcements.length} ${announcements.length === 1 ? "announcement" : "announcements"}`;

  filtersEl.innerHTML = PRIORITIES
    .filter(p => p === "all" || counts[p])
    .map(p => `<button class="filter" type="button" data-p="${p}" aria-pressed="${p === activePriority}">${p === "all" ? "All" : p[0].toUpperCase() + p.slice(1)}<small>${counts[p] || 0}</small></button>`)
    .join("");
}

filtersEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".filter");
  if(!btn) return;
  activePriority = btn.dataset.p;
  filtersEl.querySelectorAll(".filter").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  renderAnnouncements();
});

/* RENDER */
function renderAnnouncements(){
  const search = searchInput.value.trim().toLowerCase();

  const filtered = announcements.filter((a) => {
    if(activePriority !== "all" && norm(a.priority) !== activePriority) return false;
    if(!search) return true;
    return [a.title, a.message, a.priority, a.createdBy].filter(Boolean).join(" ").toLowerCase().includes(search);
  });

  if(!filtered.length){
    const none = !announcements.length;
    list.innerHTML = `
      <div class="empty"><div class="state-icon">${icon(none ? "mega" : "search")}</div>
        <h3>${none ? "No announcements yet" : "No matching announcements"}</h3>
        <p>${none ? "When your instructors post an update, it will show up here." : "Try a different search or choose another priority."}</p>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map((a) => {
    const p = norm(a.priority);
    const date = formatDate(a.publishDate);
    return `
      <article class="announcement p-${p}">
        <div class="announcement-top">
          <h2 class="announcement-title">${escapeHTML(a.title || "Untitled announcement")}</h2>
          <span class="priority priority-${p}">${p}</span>
        </div>
        <div class="message">${formatMessage(a.message || "No message available.")}</div>
        <div class="meta">
          <div class="meta-item" ${date.full ? `title="${escapeHTML(date.full)}"` : ""}>${icon("cal")}<span>${escapeHTML(date.rel)}</span></div>
          <div class="meta-item">${icon("user")}<span>${escapeHTML(a.createdBy || "Admin")}</span></div>
        </div>
      </article>`;
  }).join("");
}

searchInput.addEventListener("input", renderAnnouncements);

loadAnnouncements();
</script>
