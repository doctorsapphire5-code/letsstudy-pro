      line-height: 1.15;

      letter-spacing: -1px;
    }

    .checkout-heading p {
      color: #6b7280;
      font-size: 15px;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(320px, 0.9fr);
      gap: 28px;
      align-items: start;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e7eaf0;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.05);
    }

    .card-header {
      padding: 24px 26px 18px;
      border-bottom: 1px solid #eef0f4;
    }

      font-size: 20px;
      margin-bottom: 5px;
    }

    .card-header p {
      color: #6b7280;
      font-size: 14px;
    }

    .card-body {
      padding: 26px;
    }

    .course-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .course-item {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) auto;
      gap: 15px;
      align-items: center;
      padding: 14px;
      border: 1px solid #edf0f5;
      border-radius: 14px;
      background: #fbfcfe;
    }

    .course-image {
      width: 88px;
      height: 68px;
      border-radius: 10px;
      object-fit: cover;
      background: #eef2f7;
    }

    .course-image-placeholder {
      width: 88px;
      height: 68px;
      border-radius: 10px;
      background: #eef2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
      padding: 5px;
    }

    .course-info {
      min-width: 0;
    }

    .course-title {
      font-size: 15px;
      font-weight: 750;
      line-height: 1.35;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .course-description {
      color: #7b8494;
      font-size: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .course-price {
      white-space: nowrap;
      font-size: 14px;
      font-weight: 750;
    }

    .form-section {
      margin-top: 30px;
    }

    .form-section h3 {
      font-size: 17px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid #dce1e8;
      border-radius: 10px;
      background: #ffffff;
      padding: 0 13px;
      color: #172033;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus,

      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .payment-method {

      align-items: center;
      gap: 13px;

      border-radius: 10px;

      color: #26734d;
      font-size: 12px;
      line-height: 1.5;

      border-radius: 11px;
      margin-top: 20px;
      background: #2563eb;
      color: #ffffff;

      font-weight: 800;

    }

      margin-bottom: 8px;

      color: #6b7280;
      margin-bottom: 20px;
    }

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;

      font-size: 13px;
      line-height: 1.5;

    .message.error {

  /* =========================================
     HELPERS
     ========================================= */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function getCart() {

    try {

      const cart =
        JSON.parse(
          localStorage.getItem("courseCart") || "[]"
        );

      return Array.isArray(cart)
        ? cart
        : [];

    } catch (error) {

      console.error(
        "Cart parsing error:",
        error
      );

      return [];

    }

  }


  function getCourseId(item) {

    if (typeof item === "string") {

      return item;

    }

    if (
      item &&
      typeof item === "object"
    ) {

      return (
        item.id ||
        item.courseId ||
        item.courseID ||
        item.course_id ||
        null
      );

    }

    return null;

  }


  function getCourseTitle(course) {

    return (
      course.title ||
      course.name ||
      course.courseTitle ||
      course.courseName ||
      "Untitled Course"
    );

  }


  function getCourseDescription(course) {

    return (
      course.description ||
      course.shortDescription ||
      course.summary ||
      ""
    );

  }


  function getCourseImage(course) {

    return (
      course.thumbnail ||
      course.thumbnailUrl ||
      course.image ||
      course.imageUrl ||
      course.cover ||
      course.coverImage ||
      ""
    );

  }


  function getCoursePrice(course) {

    const rawPrice =

      course.salePrice ??
      course.currentPrice ??
      course.price ??
      course.amount ??
      course.coursePrice ??
      course.planPrice ??
      course.sellingPrice ??
      0;

    const price =
      Number(rawPrice);

    if (
      !Number.isFinite(price) ||
      price < 0
    ) {

      return 0;

    }

    return price;

  }


  function formatMoney(amount) {

    return new Intl.NumberFormat(
      "en-TZ",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }
    ).format(amount);

  }


  function showMessage(
    text,
    type = "error"
  ) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  function clearMessage() {

    const message =
      document.getElementById("message");

    message.textContent = "";

    message.className =

  }


  /* =========================================
     LOAD COURSES
     ========================================= */

  async function loadCheckoutCourses() {

    const cart =
      getCart();

    const ids =
      cart
        .map(getCourseId)
        .filter(Boolean);

    if (!ids.length) {

      renderEmptyState();

      return;

    }


    try {

      const snapshot =
        await getDocs(
          collection(db, "courses")
        );


      const courseMap =
        new Map();


      snapshot.forEach(doc => {

        courseMap.set(
          doc.id,
          {
            id: doc.id,
            ...doc.data()
          }
        );

      });


      checkoutCourses =
        ids
          .map(id => courseMap.get(id))
          .filter(Boolean);


      if (!checkoutCourses.length) {

        renderEmptyState();

        return;

      }


      subtotal =
        checkoutCourses.reduce(
          (
            total,
            course
          ) => {

            return (
              total +
              getCoursePrice(course)
            );

          },
          0
        );


      renderCheckout();

    } catch (error) {

      console.error(
        "Course loading error:",
        error
      );

      showMessage(
        "Unable to load your courses. Please try again."
      );

      document.getElementById(
        "checkoutContent"
      ).innerHTML = "";

    }

  }
