<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Course Checkout | LetsStudy Pro</title>

<meta
  name="description"
  content="Secure checkout for LetsStudy Pro courses."
>

<meta name="robots" content="noindex,nofollow">

<link rel="icon" href="favicon.ico">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f7f9fc;
  color:#172033;
}

a{
  text-decoration:none;
  color:inherit;
}

.navbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5eaf1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.back{
  color:#647184;
  font-size:14px;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

.page{
  padding:45px 0 80px;
}

h1{
  font-size:35px;
  margin:0 0 8px;
}

.subtitle{
  color:#687486;
  margin:0 0 30px;
}

.layout{
  display:grid;
  grid-template-columns:1fr .55fr;
  gap:30px;
  align-items:start;
}

.card{
  background:#fff;
  border:1px solid #e3e8ef;
  border-radius:18px;
  padding:28px;
  box-shadow:0 8px 30px rgba(20,35,60,.05);
}

.card h2{
  margin-top:0;
  font-size:21px;
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:800;
  color:#334155;
}

.form-group input,
.form-group select{
  width:100%;
  min-height:46px;
  padding:12px 13px;
  border:1px solid #d7dde6;
  border-radius:10px;
  background:#fff;
  color:#172033;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

.form-group input:focus,
.form-group select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.two-columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.course{
  display:flex;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid #edf0f4;
}

.course:last-child{
  border-bottom:0;
}

.course-image{
  width:90px;
  height:65px;
  object-fit:cover;
  border-radius:9px;
  background:#e9eef5;
  flex-shrink:0;
}

.course-info{
  min-width:0;
  flex:1;
}

.course-title{
  font-size:15px;
  font-weight:800;
  line-height:1.4;
  margin-bottom:5px;
}

.course-price{
  font-size:14px;
  font-weight:800;
}

.badge{
  display:inline-flex;
  padding:4px 8px;
  border-radius:999px;
  background:#eee9ff;
  color:#6040b5;
  font-size:10px;
  font-weight:800;
  margin-bottom:5px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:12px 0;
  font-size:14px;
}

.row strong{
  font-weight:800;
}

.total{
  border-top:1px solid #e3e7ee;
  margin-top:10px;
  padding-top:20px;
  font-size:23px;
  font-weight:900;
}

.payment-box{
  margin-top:25px;
  padding:16px;
  border-radius:12px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
}

.payment-title{
  font-size:14px;
  font-weight:900;
  margin-bottom:5px;
}

.payment-description{
  color:#64748b;
  font-size:12px;
  line-height:1.5;
}

.payment-method{
  margin-top:12px;
  padding:12px;
  background:#fff;
  border:1px solid #dbe1e8;
  border-radius:10px;
  font-weight:800;
  font-size:13px;
}

.checkout-btn{
  width:100%;
  min-height:50px;
  margin-top:22px;
  border:0;
  border-radius:11px;
  background:#2563eb;
  color:#fff;
  cursor:pointer;
  font-family:inherit;
  font-size:15px;
  font-weight:900;
}

.checkout-btn:hover{
  background:#1d4ed8;
}

.checkout-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.status{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  font-size:13px;
  font-weight:700;
  line-height:1.5;
}

.status.loading{
  display:block;
  background:#eff6ff;
  color:#1d4ed8;
}

.status.error{
  display:block;
  background:#fef2f2;
  color:#b91c1c;
}

.status.success{
  display:block;
  background:#ecfdf5;
  color:#047857;
}

.secure{
  margin-top:16px;
  text-align:center;
  color:#64748b;
  font-size:11px;
  line-height:1.5;
}

.empty{
  max-width:650px;
  margin:50px auto;
  text-align:center;
}

.empty p{
  color:#64748b;
  line-height:1.6;
}

.empty a{
  display:inline-block;
  margin-top:15px;
  padding:13px 20px;
  background:#2563eb;
  color:#fff;
  border-radius:10px;
  font-weight:800;
}

.loading-page{
  text-align:center;
  padding:80px 20px;
  color:#64748b;
}

@media(max-width:760px){

  .layout{
    grid-template-columns:1fr;
  }

  h1{
    font-size:29px;
  }

  .two-columns{
    grid-template-columns:1fr;
  }

  .card{
    padding:21px;
  }

}

</style>

</head>

<body>

<header class="navbar">

  <a
    href="index.html"
    class="logo"
  >
    📚 LetsStudy Pro
  </a>

  <a
    href="course-cart.html"
    class="back"
  >
    ← Course Cart
  </a>

</header>


<main class="page">

  <div class="container">

    <h1>
      Course Checkout
    </h1>

    <p class="subtitle">
      Complete your details and continue to secure payment.
    </p>


    <div id="app">

      <div class="loading-page">
        Loading your courses...
      </div>

    </div>

  </div>

</main>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVK5XbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   PAYMENT API
===================================================== */

const CREATE_ORDER_ENDPOINT =
  "https://api.letsstudy.pro/api/pesapal/create-order";


/* =====================================================
   ELEMENT
===================================================== */

const appContainer =
  document.getElementById("app");


/* =====================================================
   HELPERS
===================================================== */

function text(value){

  if(
    value === undefined ||
    value === null
  ){

    return "";

  }

  return String(value).trim();

}


function escapeHtml(value){

  return text(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function number(value){

  const n =
    parseFloat(
      String(value ?? "")
        .replace(/,/g,"")
        .replace(/[^0-9.-]/g,"")
    );

  return Number.isFinite(n)
    ? n
    : 0;

}


function money(value){

  return number(value)
    .toLocaleString(
      "en-TZ",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    ) +
    " TZS";

}


function first(data,fields){

  for(
    const field of fields
  ){

    const value =
      text(data?.[field]);

    if(value){

      return value;

    }

  }

  return "";

}


function getImage(data){

  return first(
    data,
    [
      "thumbnail",
      "thumbnailUrl",
      "image",
      "imageUrl",
      "cover",
      "coverImage"
    ]
  );

}


/* =====================================================
   PLAN CHECK
===================================================== */

function isPlanCourse(data){

  const access =
    first(
      data,
      [
        "access",
        "accessType",
        "membership",
        "plan",
        "pricing"
      ]
    ).toLowerCase();


  if(
    [
      "plan",
      "premium",
      "paid",
      "pro"
    ].includes(access)
  ){

    return true;

  }


  if(
    data?.premium === true ||
    data?.isPremium === true ||
    data?.paid === true
  ){

    return true;

  }


  return false;

}


/* =====================================================
   GET CART IDS
===================================================== */

function getCartIds(){

  try{

    const cart =
      JSON.parse(
        localStorage.getItem(
          "courseCart"
        ) || "[]"
      );


    if(!Array.isArray(cart)){

      return [];

    }


    return [
      ...new Set(
        cart
          .map(
            item => {

              if(
                typeof item === "string"
              ){

                return item;

              }

              if(
                item &&
                typeof item === "object"
              ){

                return (
                  item.id ||
                  item.courseId ||
                  ""
                );

              }

              return "";

            }
          )
          .filter(Boolean)
      )
    ];

  }
  catch(error){

    console.error(
      "Course cart error:",
      error
    );

    return [];

  }

}


/* =====================================================
   SHOW EMPTY
===================================================== */

function showEmpty(){

  appContainer.innerHTML = `

    <div class="card empty">

      <h2>
        Your course cart is empty
      </h2>

      <p>
        Add a Plan course to your cart before checkout.
      </p>

      <a href="search.html">
        Browse Courses
      </a>

    </div>

  `;

}


/* =====================================================
   LOAD COURSES
===================================================== */

async function loadCourses(){

  const ids =
    getCartIds();


  if(!ids.length){

    showEmpty();

    return;

  }


  const courses = [];


  for(
    const id of ids
  ){

    try{

      const snapshot =
        await getDoc(
          doc(
            db,
            "courses",
            id
          )
        );


      if(
        !snapshot.exists()
      ){

        continue;

      }


      const data =
        snapshot.data() || {};


      if(
        !isPlanCourse(data)
      ){

        continue;

      }


      const title =
        first(
          data,
          [
            "title",
            "name",
            "courseTitle"
          ]
        ) ||
        "Untitled Course";


      const description =
        first(
          data,
          [
            "shortDescription",
            "description",
            "summary",
            "excerpt"
          ]
        );


      const price =
        number(
          first(
            data,
            [
              "price",
              "amount",
              "coursePrice",
              "planPrice"
            ]
          )
        );


      courses.push({

        id:
          snapshot.id,

        title,

        description,

        image:
          getImage(data),

        price

      });

    }
    catch(error){

      console.error(
        "Unable to load course:",
        id,
        error
      );

    }

  }


  if(!courses.length){

    showEmpty();

    return;

  }


  renderCheckout(
    courses
  );

}


/* =====================================================
   RENDER CHECKOUT
===================================================== */

function renderCheckout(courses){

  const total =
    courses.reduce(
      (sum,course) =>
        sum + course.price,
      0
    );


  const courseHtml =
    courses
      .map(
        course => {

          return `

            <div class="course">

              ${
                course.image
                  ? `
                    <img
                      class="course-image"
                      src="${escapeHtml(course.image)}"
                      alt="${escapeHtml(course.title)}"
                    >
                  `
                  : `
                    <div class="course-image"></div>
                  `
              }


              <div class="course-info">

                <span class="badge">
                  Plan
                </span>

                <div class="course-title">
                  ${escapeHtml(course.title)}
                </div>

                <div class="course-price">
                  ${money(course.price)}
                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");


  appContainer.innerHTML = `

    <div class="layout">


      <section class="card">

        <h2>
          Customer Information
        </h2>


        <form id="checkoutForm">


          <div class="two-columns">


            <div class="form-group">

              <label for="firstName">
                First Name
              </label>

              <input
                id="firstName"
                name="firstName"
                type="text"
                autocomplete="given-name"
                required
              >

            </div>


            <div class="form-group">

              <label for="lastName">
                Last Name
              </label>

              <input
                id="lastName"
                name="lastName"
                type="text"
                autocomplete="family-name"
                required
              >

            </div>


          </div>


          <div class="form-group">

            <label for="email">
              Email Address
            </label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            >

          </div>


          <div class="form-group">

            <label for="phoneNumber">
              Phone Number
            </label>

            <input
              id="phoneNumber"
              name="phoneNumber"
              type="tel"
              autocomplete="tel"
              placeholder="+255..."
              required
            >

          </div>


          <div class="form-group">

            <label for="country">
              Country
            </label>

            <select
              id="country"
              name="country"
              required
            >

              <option value="">
                Select Country
              </option>

              <option value="TZ">
                Tanzania
              </option>

              <option value="KE">
                Kenya
              </option>

              <option value="UG">
                Uganda
              </option>

              <option value="RW">
                Rwanda
              </option>

              <option value="BI">
                Burundi
              </option>

              <option value="ZM">
                Zambia
              </option>

              <option value="MW">
                Malawi
              </option>

              <option value="ZA">
                South Africa
              </option>

              <option value="NG">
                Nigeria
              </option>

              <option value="GH">
                Ghana
              </option>

              <option value="US">
                United States
              </option>

              <option value="GB">
                United Kingdom
              </option>

              <option value="CA">
                Canada
              </option>

              <option value="AU">
                Australia
              </option>

              <option value="DE">
                Germany
              </option>

              <option value="FR">
                France
              </option>

              <option value="OTHER">
                Other
              </option>

            </select>

          </div>


          <div class="payment-box">

            <div class="payment-title">
              Secure Payment
            </div>

            <div class="payment-description">
              You will be redirected to the secure Pesapal payment page to complete your payment.
            </div>

            <div class="payment-method">
              💳 Pesapal
            </div>

          </div>


          <div
            id="status"
            class="status"
          ></div>


          <button
            id="payButton"
            class="checkout-btn"
            type="submit"
          >
            Continue to Pesapal
          </button>


          <div class="secure">
            🔒 Secure payment processing by Pesapal.
          </div>


        </form>

      </section>


      <aside class="card">

        <h2>
          Order Summary
        </h2>


        ${courseHtml}


        <div class="row">

          <span>
            Courses
          </span>

          <strong>
            ${courses.length}
          </strong>

        </div>


        <div class="row">

          <span>
            Subtotal
          </span>

          <strong>
            ${money(total)}
          </strong>

        </div>


        <div class="row total">

          <span>
            Total
          </span>

          <strong>
            ${money(total)}
          </strong>

        </div>

      </aside>


    </div>

  `;


  document
    .getElementById("checkoutForm")
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();

        createPaymentOrder(
          courses,
          total
        );

      }
    );

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
  message,
  type
){

  const status =
    document.getElementById(
      "status"
    );


  if(!status){

    return;

  }


  status.textContent =
    message;


  status.className =
    "status " +
    type;

}


/* =====================================================
   CREATE PAYMENT ORDER
===================================================== */

async function createPaymentOrder(
  courses,
  total
){

  const form =
    document.getElementById(
      "checkoutForm"
    );


  const payButton =
    document.getElementById(
      "payButton"
    );


  const firstName =
    text(
      document.getElementById(
        "firstName"
      ).value
    );


  const lastName =
    text(
      document.getElementById(
        "lastName"
      ).value
    );


  const email =
    text(
      document.getElementById(
        "email"
      ).value
    );


  const phoneNumber =
    text(
      document.getElementById(
        "phoneNumber"
      ).value
    );


  const country =
    text(
      document.getElementById(
        "country"
      ).value
    );


  if(
    !form.checkValidity()
  ){

    form.reportValidity();

    return;

  }


  if(total <= 0){

    showStatus(
      "Invalid course total.",
      "error"
    );

    return;

  }


  const orderId =
    "LSP-COURSE-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,8)
      .toUpperCase();


  const items =
    courses.map(
      course => ({

        id:
          course.id,

        name:
          course.title,

        quantity:
          1,

        price:
          Number(course.price)

      })
    );


  const description =
    courses.length === 1
      ? courses[0].title
      : "LetsStudy Pro Course Order - " +
        courses.length +
        " Courses";


  const payload = {

    orderId,

    amount:
      Number(total),

    currency:
      "TZS",

    description,

    email,

    firstName,

    lastName,

    phoneNumber,

    country,

    paymentMethod:
      "pesapal",

    productType:
      "course",

    items

  };


  payButton.disabled =
    true;


  payButton.textContent =
    "Preparing Payment...";


  showStatus(
  "Preparing your secure Pesapal payment...",
  "loading"
);

try {
  const response = await fetch(CREATE_ORDER_ENDPOINT, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  });

  let data = null;

  try {
    data = await response.json();
  } catch {
    data = null;
  }

  if (
    !response.ok ||
    !data ||
    data.success !== true
  ) {
    throw new Error(
      data?.message ||
      data?.error ||
      "Unable to create payment order."
    );
  }

  const redirectUrl =
    data.redirectUrl ||
    data.iframeUrl ||
    data.redirect_url;

  const orderTrackingId =
    data.orderTrackingId ||
    data.order_tracking_id;

  const merchantReference =
    data.merchantReference ||
    data.merchant_reference ||
    orderId;

  if (!redirectUrl) {
    throw new Error(
      "Pesapal payment URL was not returned."
    );
  }

  const pendingPayment = {
    orderId,
    orderTrackingId,
    merchantReference,
    productType: "course",
    amount: Number(total),
    currency: "TZS",
    description,
    items,
    createdAt: new Date().toISOString()
  };

  localStorage.setItem(
    "pendingPayment",
    JSON.stringify(pendingPayment)
  );

  localStorage.setItem(
    "pendingCoursePayment",
    JSON.stringify(pendingPayment)
  );

  localStorage.setItem(
    "pendingCheckoutCustomer",
    JSON.stringify({
      firstName,
      lastName,
      email,
      phoneNumber,
      country
    })
  );

  const paymentParams = new URLSearchParams({
    orderId,
    orderTrackingId: orderTrackingId || "",
    merchantReference,
    redirectUrl
  });

  window.location.href =
    "payment.html?" +
    paymentParams.toString();

} catch (error) {
  console.error(
    "Course checkout error:",
    error
  );

  showStatus(
    error.message ||
    "Payment could not be created. Please try again.",
    "error"
  );

  payButton.disabled = false;
  payButton.textContent =
    "Continue to Pesapal";
}

});

});

loadCourses()
  .catch(error => {
    console.error(
      "Checkout initialization error:",
      error
    );

    appContainer.innerHTML = `
      <div class="card empty">
        <h2>Unable to load checkout</h2>
        <p>
          Please return to your course cart
          and try again.
        </p>

        <a href="course-cart.html">
          Back to Course Cart
        </a>
      </div>
    `;
  });

</script>

</body>
</html>
