<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Course Discussion | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
header h1{flex:1;margin:0;font-size:18px}
button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:600}
.back{background:#eef2ff;color:#1d4ed8}
.primary{background:#2563eb;color:#fff}
main{max-width:900px;margin:auto;padding:18px}
.course{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:15px;margin-bottom:14px}
.course small{color:#64748b}
.course h2{margin:5px 0;font-size:20px}
.composer{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:15px;margin-bottom:15px}
textarea{width:100%;min-height:90px;border:1px solid #dbe1e8;border-radius:10px;padding:12px;resize:vertical;outline:none}
.actions{display:flex;justify-content:flex-end;margin-top:9px}
.discussion{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:15px;margin-bottom:12px}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-weight:bold}
.user strong{font-size:13px}
.meta{font-size:10px;color:#94a3b8;margin-top:3px}
.message{font-size:13px;line-height:1.6;color:#334155;margin:13px 0;white-space:pre-wrap}
.tools{display:flex;gap:7px;flex-wrap:wrap}
.tool{background:#f1f5f9;color:#475569;padding:7px 10px;font-size:11px}
.reply-box{display:none;margin-top:12px}
.reply-box textarea{min-height:65px}
.replies{margin-top:12px;padding-left:18px;border-left:2px solid #e5e7eb}
.reply{padding:10px 0;border-bottom:1px solid #f1f5f9}
.reply:last-child{border-bottom:0}
.empty{text-align:center;padding:50px;color:#64748b;background:#fff;border-radius:15px}
.loading{text-align:center;padding:45px;color:#64748b}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:200;font-size:12px}
.toast.show{display:block}
@media(max-width:600px){main{padding:10px}}
</style></head><body><header><button class="back" onclick="history.back()">←</button>

<h1>💬 Course Discussion</h1><button class="back" onclick="location.href='dashboard.html'">
Dashboard
</button></header><main><div id="courseInfo" class="course"><small>Course</small>

<h2 id="courseName">
Loading...
</h2><small id="courseIdText"></small>

</div><div class="composer"><strong>
Start a discussion
</strong><br><br>

<textarea
id="postText"
placeholder="Ask a question, share an idea or help another student..."></textarea><div class="actions"><button
class="primary"
onclick="createPost()">

Post Discussion

</button></div></div><div id="discussionList"><div class="loading">
Loading discussions...
</div></div></main><div id="toast" class="toast"></div><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
orderBy,
serverTimestamp,
doc,
updateDoc,
deleteDoc,
getDoc,
increment
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* =========================================
 VARIABLES
========================================= */

const params=
new URLSearchParams(
location.search
);

const courseId=
params.get("courseId")||
params.get("id");

let currentUser=null;
let discussions=[];


/* =========================================
 AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="login.html";

return;

}

currentUser=user;

await loadCourse();

await loadDiscussions();

});


/* =========================================
 COURSE
========================================= */

async function loadCourse(){

if(!courseId){

document.getElementById(
"courseName"
).textContent=
"Course Discussion";

return;

}

document.getElementById(
"courseIdText"
).textContent=
`Course ID: ${courseId}`;


try{

const snap=
await getDoc(
doc(
db,
"courses",
courseId
)
);

if(
snap.exists()
){

const data=
snap.data();

document.getElementById(
"courseName"
).textContent=
data.title||
data.name||
"Course Discussion";

}

}catch(error){

console.error(error);

}

}


/* =========================================
 LOAD DISCUSSIONS
========================================= */

async function loadDiscussions(){

const container=
document.getElementById(
"discussionList"
);

if(!courseId){

container.innerHTML=`

<div class="empty">
No course selected.
</div>

`;

return;

}


try{

/*
No orderBy to avoid
Firestore index problems.
*/

const q=query(

collection(
db,
"courseDiscussions"
),

where(
"courseId",
"==",
courseId
)

);


const snap=
await getDocs(q);


discussions=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);


discussions.sort(
(a,b)=>
getTime(b.createdAt)-
getTime(a.createdAt)
);


render();

}catch(error){

console.error(error);

container.innerHTML=`

<div class="empty">

⚠️ Unable to load discussions.

<br><br>

<button
class="primary"
onclick="location.reload()">

Try Again

</button>

</div>

`;

}

}


/* =========================================
 RENDER
========================================= */

function render(){

const container=
document.getElementById(
"discussionList"
);


if(!discussions.length){

container.innerHTML=`

<div class="empty">

<div style="font-size:40px">
💬
</div>

<strong>
No discussions yet
</strong>

<br>

Be the first student to start a discussion.

</div>

`;

return;

}


container.innerHTML=
discussions.map(
post=>`

<article
class="discussion"
id="post-${post.id}">

<div class="user">

<div class="avatar">
${initials(post.userName||"Student")}
</div>

<div>

<strong>
${esc(post.userName||"Student")}
</strong>

<div class="meta">
${formatDate(post.createdAt)}
</div>

</div>

</div>


<div class="message">
${esc(post.message||"")}
</div>


<div class="tools">

<button
class="tool"
onclick="likePost('${post.id}')">

👍 ${Number(post.likes||0)}

</button>


<button
class="tool"
onclick="toggleReply('${post.id}')">

↩ Reply

</button>


${
post.userId===currentUser.uid
?
`<button
class="tool"
onclick="deletePost('${post.id}')">

🗑 Delete

</button>`
:
""
}

</div>


<div
id="reply-box-${post.id}"
class="reply-box">

<textarea
id="reply-${post.id}"
placeholder="Write a reply..."></textarea><div class="actions"><button
class="primary"
onclick="addReply('${post.id}')">

Reply

</button></div></div><div
id="replies-${post.id}"
class="replies">${renderReplies(post.replies||[])}

</div></article>`
).join("");

}

/* =========================================
CREATE POST
========================================= */

window.createPost=
async function(){

const input=
document.getElementById(
"postText"
);

const message=
input.value.trim();

if(!message){

toast(
"Write something first."
);

return;

}

try{

await addDoc(

collection(
db,
"courseDiscussions"
),

{

courseId,

userId:
currentUser.uid,

userName:
currentUser.displayName||
currentUser.email?.split("@")[0]||
"Student",

message,

likes:0,

replies:[],

createdAt:
serverTimestamp()

}

);

input.value="";

toast(
"Discussion posted."
);

await loadDiscussions();

}catch(error){

console.error(error);

toast(
"Unable to post discussion."
);

}

};

/* =========================================
LIKE
========================================= */

window.likePost=
async function(id){

try{

await updateDoc(

doc(
db,
"courseDiscussions",
id
),

{

likes:
increment(1)

}

);

const post=
discussions.find(
x=>x.id===id
);

if(post)
post.likes=
Number(post.likes||0)+1;

render();

}catch(error){

console.error(error);

toast(
"Unable to like post."
);

}

};

/* =========================================
REPLY TOGGLE
========================================= */

window.toggleReply=
function(id){

const box=
document.getElementById(
"reply-box-${id}"
);

box.style.display=
box.style.display==="block"
?"none"
:"block";

};

/* =========================================
ADD REPLY
========================================= */

window.addReply=
async function(id){

const input=
document.getElementById(
"reply-${id}"
);

const message=
input.value.trim();

if(!message){

toast(
"Write a reply first."
);

return;

}

try{

const post=
discussions.find(
x=>x.id===id
);

if(!post)
return;

const replies=
Array.isArray(post.replies)
?[...post.replies]
:[];

replies.push({

id:
Date.now().toString(),

userId:
currentUser.uid,

userName:
currentUser.displayName||
currentUser.email?.split("@")[0]||
"Student",

message,

createdAt:
new Date().toISOString()

});

await updateDoc(

doc(
db,
"courseDiscussions",
id
),

{

replies

}

);

toast(
"Reply added."
);

await loadDiscussions();

}catch(error){

console.error(error);

toast(
"Unable to add reply."
);

}

};

/* =========================================
DELETE
========================================= */

window.deletePost=
async function(id){

if(
!confirm(
"Delete this discussion?"
)
)
return;

try{

await deleteDoc(

doc(
db,
"courseDiscussions",
id
)

);

toast(
"Discussion deleted."
);

await loadDiscussions();

}catch(error){

console.error(error);

toast(
"Unable to delete discussion."
);

}

};

/* =========================================
REPLIES
========================================= */

function renderReplies(
replies
){

if(!Array.isArray(replies)||
!replies.length)
return"";

return replies.map(
reply=>`

<div class="reply"><div class="user"><div class="avatar">
${initials(reply.userName||"Student")}
</div><div><strong>
${esc(reply.userName||"Student")}
</strong><div class="meta">
${formatDate(reply.createdAt)}
</div></div></div><div class="message">
${esc(reply.message||"")}
</div></div>`
).join("");

}

/* =========================================
HELPERS
========================================= */

function initials(name){

return String(name)
.split(" ")
.map(x=>x[0])
.join("")
.substring(0,2)
.toUpperCase();

}

function esc(value){

return String(
value??""
)

.replace(/&/g,"&")
.replace(/</g,"<")
.replace(/>/g,">")
.replace(/"/g,""")
.replace(/'/g,"'");

}

function getTime(value){

if(!value)
return 0;

try{

if(
typeof value.toDate===
"function"
)
return value.toDate().getTime();

return new Date(value).getTime();

}catch{

return 0;

}

}

function formatDate(value){

const time=
getTime(value);

if(!time)
return"Just now";

return new Date(time)
.toLocaleString();

}

function toast(message){

const el=
document.getElementById("toast");

el.textContent=message;

el.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
