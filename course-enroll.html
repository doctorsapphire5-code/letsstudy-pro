<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Enroll Course | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#0f172a;
}

a{text-decoration:none;color:inherit}

header{

border-bottom:1px solid #e2e8f0;
padding:14px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
position:sticky;

}

.logo{

font-weight:900;

}

nav{
display:flex;
gap:7px;

}

font-weight:800;

}

nav a:hover{
background:#eff6ff;
color:#2563eb;
}

.container{
max-width:950px;
margin:auto;
padding:25px 15px;
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:18px;
padding:23px;
margin-bottom:16px;
}

.hero{
text-align:center;
padding:30px 20px;
}

.icon{
width:80px;
height:80px;
margin:0 auto 15px;
display:flex;
align-items:center;
justify-content:center;
border-radius:18px;
background:#eff6ff;

}

.badge{

padding:6px 10px;
border-radius:20px;

color:#166534;

}

.badge.premium{

color:#92400e;
}

h1{
font-size:28px;
margin-bottom:9px;
}

.description{
font-size:13px;
color:#64748b;
line-height:1.7;
max-width:650px;
margin:auto;
}

.price{
font-size:24px;
font-weight:900;
color:#2563eb;
margin:14px 0;
}

.free{
color:#15803d;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
max-width:500px;
margin:20px auto 0;
}

.btn{
border:0;
padding:13px;
border-radius:9px;
font-size:12px;
font-weight:900;
cursor:pointer;
text-align:center;
}

.primary{
background:#2563eb;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.warning{
background:#f59e0b;
color:#fff;
}

.message{
display:none;
padding:12px;
border-radius:9px;
font-size:11px;
font-weight:800;
margin-bottom:15px;
}

.error{
display:block;
background:#fee2e2;
color:#991b1b;
}

.success{
display:block;
background:#dcfce7;
color:#166534;
}

.loading{
text-align:center;
padding:60px;
color:#64748b;
}

.info{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:20px;
}

.infoBox{
background:#f8fafc;
border-radius:10px;
padding:13px;
text-align:center;
}

.infoBox strong{
display:block;
font-size:13px;
margin-bottom:5px;
}

.infoBox span{
font-size:10px;
color:#64748b;
}

footer{
margin-top:30px;
padding:20px 0;
border-top:1px solid #e2e8f0;
font-size:11px;
color:#64748b;
display:flex;
justify-content:space-between;
}

footer a{
color:#2563eb;
font-weight:800;
}

@media(max-width:650px){

header{
flex-direction:column;
align-items:flex-start;
}

nav{
width:100%;
}

.actions{
grid-template-columns:1fr;
}

.info{
grid-template-columns:1fr;
}

h1{
font-size:24px;
}

footer{
flex-direction:column;
gap:8px;
}

}
</style>
</head>

<body>

<header>

<a href="dashboard.html" class="logo">
LetsStudy Pro
</a>

<nav>

<a href="item.html">Course</a>

<a href="courses.html">
Courses
</a>

<a href="dashboard.html">
Dashboard
</a>

</nav>

</header>


<main class="container">

<div id="loading" class="loading">
Loading enrollment...
</div>


<div id="app" style="display:none">


<div id="message" class="message"></div>


<section class="card hero">

<div id="icon" class="icon">
📚
</div>

<span id="badge" class="badge">
FREE
</span>

<h1 id="title">
Course
</h1>

<p id="description" class="description">
Course description
</p>

<div id="price" class="price free">
FREE
</div>


<div class="actions">

<button
id="mainButton"
class="btn primary">

Continue

</button>

<a
id="backButton"
href="courses.html"
class="btn secondary">

← Courses

</a>

</div>

</section>


<section class="card">

<div class="info">

<div class="infoBox">

<strong id="category">
General
</strong>

<span>
Category
</span>

</div>


<div class="infoBox">

<strong id="level">
All Levels
</strong>

<span>
Level
</span>

</div>


<div class="infoBox">

<strong id="lessons">
—
</strong>

<span>
Lessons
</span>

</div>

</div>

</section>


</div>


<footer>

<div>
© <span id="year"></span> LetsStudy Pro
</div>

<div>

<a href="courses.html">
Courses
</a>

&nbsp;•&nbsp;

<a href="item.html">
Course
</a>

&nbsp;•&nbsp;

<a href="dashboard.html">
Dashboard
</a>

</div>

</footer>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
FIREBASE
========================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAXKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ==========================================
ELEMENTS
========================================== */

const loading =
document.getElementById("loading");

const application =
document.getElementById("app");

const message =
document.getElementById("message");

const mainButton =
document.getElementById("mainButton");


/* ==========================================
COURSE ID
========================================== */

const params =
new URLSearchParams(location.search);

const courseId =
params.get("id");


let course = null;
let currentUser = null;


/* ==========================================
AUTH
========================================== */

onAuthStateChanged(
auth,
async user => {

currentUser = user;

await loadCourse();

});


/* ==========================================
LOAD COURSE
========================================== */

async function loadCourse(){

if(!courseId){

showError(
"No Course ID . Please back Coursee."
);

return;

}

try{

const courseSnap =
await getDoc(
doc(db,"courses",courseId)
);


if(!courseSnap.exists()){

showError(
"No Course."
);

return;

}


course = {

id:courseSnap.id,
...courseSnap.data()

};


renderCourse();


}catch(error){

console.error(error);

showError(
"No available course."
);

}

}


/* ==========================================
RENDER
========================================== */

function renderCourse(){

const type =
String(
course.type || "free"
).toLowerCase();


const price =
Number(course.price || 0);


const premium =
type === "premium";


document.getElementById(
"title"
).textContent =
course.title ||
"Untitled Course";


document.getElementById(
"description"
).textContent =
course.description ||
"Learn with LetsStudy Pro.";


document.getElementById(
"icon"
).textContent =
course.icon ||
(premium ? "⭐" : "📚");


document.getElementById(
"category"
).textContent =
course.category ||
"General";


document.getElementById(
"level"
).textContent =
course.level ||
"All Levels";


document.getElementById(
"lessons"
).textContent =
course.lessons ||
course.lessonCount ||
"—";


const badge =
document.getElementById("badge");


badge.textContent =
premium
? "PREMIUM"
: "FREE";


if(premium){

badge.classList.add("premium");

}


const priceElement =
document.getElementById("price");


priceElement.textContent =
premium
? formatTZS(price)
: "FREE";


priceElement.className =
premium
? "price"
: "price free";


/*
Main workflow
*/

mainButton.textContent =
premium
? "Continue to Premium"
: "Enroll Free";


mainButton.onclick =
handleEnrollment;


loading.style.display =
"none";

application.style.display =
"block";

}


/* ==========================================
ENROLLMENT
========================================== */

async function handleEnrollment(){

/*
1. Login protection
*/

if(!currentUser){

const redirect =
"course-enroll.html?id=" +
encodeURIComponent(courseId);

location.href =
"login.html?redirect=" +
encodeURIComponent(redirect);

return;

}


/*
2. Premium course
*/

const premium =
String(course.type || "free")
.toLowerCase()
=== "premium";


if(premium){

/*
Premium courses go through
pricing before checkout.
*/

location.href =
"pricing.html?courseId=" +
encodeURIComponent(courseId);

return;

}


/*
3. Free course
*/

try{

mainButton.disabled = true;

mainButton.textContent =
"Enrolling...";


const enrollmentId =
currentUser.uid +
"_" +
courseId;


await setDoc(

doc(
db,
"enrollments",
enrollmentId
),

{

userId:
currentUser.uid,

courseId:
courseId,

courseTitle:
course.title || "",

type:
"free",

status:
"active",

progress:
0,

enrolledAt:
serverTimestamp()

},

{
merge:true
}

);


showSuccess(
"Umefanikiwa kujiunga na course."
);


setTimeout(
()=>{

location.href =
"course-learning.html?id=" +
encodeURIComponent(courseId);

},
700
);


}catch(error){

console.error(error);

mainButton.disabled =
false;

mainButton.textContent =
"Enroll Free";


showError(
"No available Enrollment. Please try again another time."
);

}

}


/* ==========================================
MESSAGES
========================================== */

function showError(text){

loading.style.display =
"none";

application.style.display =
"block";

message.className =
"message error";

message.textContent =
text;

}


function showSuccess(text){

message.className =
"message success";

message.textContent =
text;

}


/* ==========================================
FORMAT
========================================== */

function formatTZS(amount){

return new Intl.NumberFormat(
"en-TZ",
{

style:"currency",

currency:"TZS",

maximumFractionDigits:0

}
).format(amount);

}


/* ==========================================
YEAR
========================================== */

document.getElementById(
"year"
).textContent =
new Date().getFullYear();

</script>

</body>
</html>
