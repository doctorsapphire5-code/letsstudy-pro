<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Enrollments | LetsStudy Pro Ecosystem</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f6f8fc;
  color:#172033
}

a{text-decoration:none;color:inherit}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #e8ebf1
}

.nav{
  max-width:1200px;
  min-height:68px;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.logo{
  font-size:21px;
  font-weight:950;
  color:#059669
}

.nav-links{
  display:flex;
  align-items:center;
  gap:18px;
  font-size:13px;
  font-weight:800;
  color:#667085
}

.nav-links a:hover{
  color:#059669
}

.cart{
  position:relative;
  padding:9px 12px;
  border-radius:9px;
  background:#ecfdf5;
  color:#047857
}

.cart-count{
  position:absolute;
  top:-7px;
  right:-7px;
  min-width:18px;
  height:18px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#ef4444;
  color:#fff;
  font-size:9px
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 18px 70px
}

.hero{
  position:relative;
  overflow:hidden;
  padding:32px;
  border-radius:22px;
  color:#fff;
  background:
    radial-gradient(circle at 85% 10%,#34d39955,transparent 30%),
    linear-gradient(135deg,#064e3b,#059669)
}

.hero:after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  right:-90px;
  bottom:-100px;
  border-radius:50%;
  background:#ffffff10
}

.hero h1{
  margin:0;
  font-size:34px;
  letter-spacing:-1px
}

.hero p{
  max-width:650px;
  margin:10px 0 0;
  color:#d1fae5;
  line-height:1.7
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
  margin-top:25px;
  max-width:650px
}

.stat{
  padding:15px;
  border:1px solid #ffffff25;
  border-radius:13px;
  background:#ffffff12
}

.stat strong{
  display:block;
  font-size:24px
}

.stat span{
  font-size:11px;
  color:#d1fae5
}

.toolbar{
  margin:25px 0 18px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}

.search{
  flex:1;
  min-width:230px;
  position:relative
}

input,select{
  width:100%;
  padding:12px 13px;
  border:1px solid #dce1e9;
  border-radius:10px;
  outline:none;
  background:#fff;
  color:#172033
}

input:focus,select:focus{
  border-color:#059669;
  box-shadow:0 0 0 3px #05966915
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.card{
  overflow:hidden;
  background:#fff;
  border:1px solid #e7eaf0;
  border-radius:17px;
  transition:.2s;
  box-shadow:0 5px 20px #17203308
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px #17203312
}

.cover{
  position:relative;
  height:170px;
  background:#e5e7eb
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover
}

.status{
  position:absolute;
  top:12px;
  left:12px;
  padding:6px 9px;
  border-radius:20px;
  background:#fff;
  font-size:10px;
  font-weight:950
}

.status.active{
  color:#047857
}

.status.completed{
  color:#1d4ed8
}

.body{
  padding:17px
}

.category{
  font-size:10px;
  font-weight:900;
  color:#059669;
  text-transform:uppercase;
  letter-spacing:.5px
}

.title{
  margin:7px 0;
  font-size:17px;
  font-weight:950;
  line-height:1.35
}

.instructor{
  color:#667085;
  font-size:11px;
  margin-bottom:15px
}

.progress-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
  font-size:11px;
  font-weight:800
}

.progress{
  height:7px;
  border-radius:20px;
  overflow:hidden;
  background:#e8edf2
}

.progress span{
  display:block;
  height:100%;
  background:#059669;
  border-radius:20px
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:13px 0;
  color:#667085;
  font-size:10px
}

.actions{
  display:flex;
  gap:8px
}

.btn{
  flex:1;
  padding:10px;
  border:0;
  border-radius:9px;
  cursor:pointer;
  text-align:center;
  font-size:11px;
  font-weight:950
}

.btn-primary{
  background:#059669;
  color:#fff
}

.btn-light{
  background:#ecfdf5;
  color:#047857
}

.empty{
  grid-column:1/-1;
  padding:65px 20px;
  text-align:center;
  background:#fff;
  border:1px solid #e7eaf0;
  border-radius:17px
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px
}

.empty h2{
  margin:0 0 8px
}

.empty p{
  color:#667085;
  font-size:13px
}

.empty a{
  display:inline-block;
  margin-top:10px;
  padding:11px 16px;
  border-radius:9px;
  background:#059669;
  color:#fff;
  font-size:12px;
  font-weight:900
}

.loading{
  grid-column:1/-1;
  padding:60px;
  text-align:center;
  color:#667085
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:100;
  padding:13px 16px;
  border-radius:10px;
  background:#111827;
  color:#fff;
  opacity:0;
  transform:translateY(15px);
  transition:.25s;
  font-size:12px
}

.toast.show{
  opacity:1;
  transform:translateY(0)
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:650px){
  .nav-links a:not(.cart){
    display:none
  }

  .hero{
    padding:24px
  }

  .hero h1{
    font-size:27px
  }

  .stats{
    grid-template-columns:repeat(3,1fr)
  }

  .grid{
    grid-template-columns:1fr
  }
}

@media(max-width:420px){
  .stats{
    gap:7px
  }

  .stat{
    padding:11px 8px
  }

  .stat strong{
    font-size:20px
  }
}
</style>
</head>

<body>

<header class="header">

<nav class="nav">

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<div class="nav-links">

<a href="courses.html">
Courses
</a>

<a href="resources.html">
Resources
</a>

<a href="dashboard.html">
Dashboard
</a>

<a href="cart.html" class="cart">
🛒 Cart
<span id="cartCount" class="cart-count">0</span>
</a>

</div>

</nav>

</header>


<main class="container">

<section class="hero">

<h1>
My Learning Journey
</h1>

<p>
Everything you're learning in one place.
Continue your courses, track your progress,
complete your lessons and earn certificates.
</p>

<div class="stats">

<div class="stat">
<strong id="total">0</strong>
<span>Enrolled</span>
</div>

<div class="stat">
<strong id="active">0</strong>
<span>In Progress</span>
</div>

<div class="stat">
<strong id="completed">0</strong>
<span>Completed</span>
</div>

</div>

</section>


<div class="toolbar">

<div class="search">

<input
id="search"
type="search"
placeholder="Search your courses...">

</div>

<select id="filter">

<option value="all">
All Courses
</option>

<option value="active">
In Progress
</option>

<option value="completed">
Completed
</option>

</select>

</div>


<section
id="courseGrid"
class="grid">

<div class="loading">
Loading your courses...
</div>

</section>

</main>


<div id="toast" class="toast"></div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================
FIREBASE
===================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAXKXbkljsyRgI_0rj0odBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const db =
getFirestore(app);


let enrollments=[];


/* =====================================
HELPERS
===================================== */

const $ =
id =>
document.getElementById(id);


function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function progressValue(item){

let value =
Number(
item.progress || 0
);

if(value > 0 && value <= 1){
value *= 100;
}

return Math.max(
0,
Math.min(
100,
Math.round(value)
)
);

}


function dateValue(value){

if(!value)
return "";

try{

const date =
value.toDate
? value.toDate()
: new Date(value);

return date.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}catch{

return "";

}

}


function showToast(message){

const toast =
$("toast");

toast.textContent =
message;

toast.classList.add(
"show"
);

setTimeout(
()=>{
toast.classList.remove(
"show"
);
},
2500
);

}


/* =====================================
AUTH
===================================== */




/* =====================================
LOAD USER ENROLLMENTS
===================================== */

async function loadEnrollments(){

const user =
auth.currentUser;

if(!user)
return;


try{

const q =
query(
collection(
db,
"enrollments"
),
where(
"userId",
"==",
user.uid
)
);


const snapshot =
await getDocs(q);


enrollments =
snapshot.docs.map(
item=>({

id:item.id,
...item.data()

})
);


updateStats();

renderCourses();

}catch(error){

console.error(
"Enrollment error:",
error
);

$("courseGrid")
.innerHTML=`

<div class="empty">

<div class="empty-icon">
⚠️
</div>

<h2>
Unable to load courses
</h2>

<p>
Please refresh the page and try again.
</p>

</div>

`;

}

}


/* =====================================
STATS
===================================== */

function updateStats(){

$("total")
.textContent=
enrollments.length;


$("active")
.textContent=
enrollments.filter(
item =>
item.status !==
"completed"
).length;


$("completed")
.textContent=
enrollments.filter(
item =>
item.status ===
"completed"
).length;

}


/* =====================================
RENDER
===================================== */

function renderCourses(){

const search =
$("search")
.value
.toLowerCase()
.trim();

const filter =
$("filter")
.value;


const filtered =
enrollments.filter(
item=>{

const title =
String(
item.courseTitle || ""
)
.toLowerCase();

const completed =
item.status ===
"completed";

const searchMatch =
!search ||
title.includes(search);

const filterMatch =
filter === "all"

||

(
filter === "active" &&
!completed
)

||

(
filter === "completed" &&
completed
);


return (
searchMatch &&
filterMatch
);

}
);


if(!filtered.length){

$("courseGrid")
.innerHTML=`

<div class="empty">

<div class="empty-icon">
📚
</div>

<h2>
No courses here yet
</h2>

<p>
Explore available courses and
start building your learning journey.
</p>

<a href="courses.html">
Explore Courses
</a>

</div>

`;

return;

}


$("courseGrid")
.innerHTML =
filtered
.map(
item =>
courseCard(item)
)
.join("");

}


/* =====================================
COURSE CARD
===================================== */

function courseCard(item){

const progress =
progressValue(item);

const completed =
item.status ===
"completed";

const thumbnail =
item.courseThumbnail ||
item.thumbnail ||
"https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=800";


const coursesId =
item.coursesId || "";


return `

<article class="card">

<div class="cover">

<img
src="${escapeHTML(thumbnail)}"
alt="${escapeHTML(
item.courseTitle ||
"Course"
)}">

<span class="status ${
completed
? "completed"
: "active"
}">

${
completed
? "✓ Completed"
: "● Learning"
}

</span>

</div>


<div class="body">

<div class="category">

${escapeHTML(
item.categoryName ||
"Course"
)}

</div>


<h2 class="title">

${escapeHTML(
item.courseTitle ||
"Untitled Course"
)}

</h2>


<div class="instructor">

${escapeHTML(
item.instructorName ||
"LetsStudy Pro"
)}

</div>


<div class="progress-head">

<span>
Learning Progress
</span>

<strong>
${progress}%
</strong>

</div>


<div class="progress">

<span
style="width:${progress}%">
</span>

</div>


<div class="meta">

<span>
${Number(
item.completedLessons || 0
)}
/
${Number(
item.totalLessons || 0
)}
 lessons
</span>

<span>
${dateValue(
item.lastAccessedAt ||
item.startedAt
)}
</span>

</div>


<div class="actions">

${
completed

?

`

<a
class="btn btn-primary"
href="certificate.html?courseId=${encodeURIComponent(courseId)}">

View Certificate

</a>

`

:

`

<a
class="btn btn-primary"
href="course-details.html?id=${encodeURIComponent(courseId)}">

Continue Learning

</a>

`

}


<a
class="btn btn-light"
href="course-details.html?id=${encodeURIComponent(courseId)}">

Details

</a>

</div>

</div>

</article>

`;

}


/* =====================================
SEARCH + FILTER
===================================== */

$("search")
.addEventListener(
"input",
renderCourses
);

$("filter")
.addEventListener(
"change",
renderCourses
);


/* =====================================
CART COUNT
===================================== */

function updateCartCount(){

let cart=[];

try{

cart =
JSON.parse(
localStorage.getItem(
"letsStudyCart"
) || "[]"
);

}catch{

cart=[];

}


const count =
cart.reduce(
(sum,item)=>
sum +
Number(
item.quantity || 1
),
0
);


$("cartCount")
.textContent =
count;

}


updateCartCount();

</script>

</body>
</html>
