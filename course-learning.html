<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Course Learning | LetsStudy Pro</title><style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
gap:12px;
padding:0 16px;
position:sticky;
top:0;
z-index:30;
}

header h1{
flex:1;
margin:0;
font-size:17px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

button{
border:0;
border-radius:9px;
padding:10px 13px;
cursor:pointer;
font-weight:600;
}

.back{
background:#eef2ff;
color:#1d4ed8;
}

.primary{
background:#2563eb;
color:#fff;
}

.success{
background:#16a34a;
color:#fff;
}

.layout{
display:grid;
grid-template-columns:300px 1fr;
min-height:calc(100vh - 64px);
}

.sidebar{
background:#fff;
border-right:1px solid #e5e7eb;
height:calc(100vh - 64px);
position:sticky;
top:64px;
overflow:auto;
}

.side-head{
padding:17px;
border-bottom:1px solid #edf0f4;
}

.side-head h2{
font-size:15px;
margin:0 0 10px;
}

.progress{
height:7px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:#2563eb;
width:0%;
transition:.3s;
}

.progress-text{
font-size:10px;
color:#64748b;
margin-top:7px;
}

.lesson{
padding:12px 15px;
border-bottom:1px solid #f1f5f9;
cursor:pointer;
display:flex;
gap:10px;
align-items:flex-start;
}

.lesson:hover{
background:#f8fafc;
}

.lesson.active{
background:#eff6ff;
border-left:3px solid #2563eb;
}

.lesson-number{
width:25px;
height:25px;
min-width:25px;
border-radius:50%;
background:#f1f5f9;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
font-weight:bold;
}

.lesson.active .lesson-number{
background:#2563eb;
color:#fff;
}

.lesson-title{
font-size:12px;
line-height:1.4;
}

.completed{
color:#16a34a;
font-size:11px;
margin-top:4px;
}

.content{
padding:20px;
max-width:1000px;
width:100%;
margin:auto;
}

.video{
background:#0f172a;
aspect-ratio:16/9;
border-radius:15px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:16px;
}

.video iframe,
.video video{
width:100%;
height:100%;
border:0;
}

.video-placeholder{
text-align:center;
color:#cbd5e1;
}

.video-placeholder div{
font-size:50px;
margin-bottom:10px;
}

.lesson-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:18px;
margin-bottom:15px;
}

.lesson-card h2{
margin:0 0 8px;
font-size:21px;
}

.meta{
color:#64748b;
font-size:11px;
}

.description{
font-size:13px;
line-height:1.8;
color:#475569;
white-space:pre-wrap;
margin-top:15px;
}

.resource-row{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-top:16px;
}

.navigation{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:15px;
}

.navigation button{
flex:1;
}

.complete{
margin-top:15px;
width:100%;
}

.empty{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:50px;
text-align:center;
color:#64748b;
}

.loading{
text-align:center;
padding:50px;
color:#64748b;
}

.toast{
position:fixed;
right:18px;
bottom:18px;
background:#172033;
color:#fff;
padding:12px 15px;
border-radius:9px;
display:none;
z-index:100;
font-size:12px;
}

.toast.show{
display:block;
}

@media(max-width:800px){

.layout{
grid-template-columns:1fr;
}

.sidebar{
position:relative;
top:0;
height:auto;
max-height:300px;
border-right:0;
border-bottom:1px solid #e5e7eb;
}

.content{
padding:12px;
}

header{
padding:0 10px;
}

}

</style></head><body><header><button
class="back"
onclick="history.back()">
←
</button>

<h1 id="courseTitle">
Loading course...
</h1><button
class="back"
onclick="location.href='course-discussion.html'">
💬
</button>

</header><div class="layout"><!-- LESSON SIDEBAR --><aside class="sidebar"><div class="side-head"><h2 id="sidebarCourse">
Course Lessons
</h2><div class="progress"><div
id="progressBar"
class="progress-bar">
</div></div><div
id="progressText"
class="progress-text">
0% completed
</div></div><div
id="lessonList"><div class="loading">
Loading lessons...
</div></div></aside><!-- MAIN CONTENT --><main class="content"><div id="mainArea"><div class="loading">
Loading lesson...
</div></div></main></div><div
id="toast"
class="toast">
</div><script type="module">


/* =========================================
 FIREBASE
========================================= */

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
query,
where,
getDocs,
getDoc,
doc,
setDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
 URL
========================================= */

const params=
new URLSearchParams(
location.search
);

const courseId=
params.get("courseId")||
params.get("course")||
params.get("id");


let currentUser=null;
let course=null;
let lessons=[];
let completed=[];
let currentIndex=0;


/* =========================================
 AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="login.html";

return;

}

currentUser=user;

if(!courseId){

showError(
"Course ID is missing."
);

return;

}

await loadCourse();

await loadLessons();

await loadProgress();

renderLessons();

selectLesson(
getInitialLesson()
);

});


/* =========================================
 COURSE
========================================= */

async function loadCourse(){

try{

const snap=
await getDoc(
doc(
db,
"courses",
courseId
)
);

if(
snap.exists()
){

course={
id:snap.id,
...snap.data()
};

document.getElementById(
"courseTitle"
).textContent=
course.title||
course.name||
"LetsStudy Pro Course";

document.getElementById(
"sidebarCourse"
).textContent=
course.title||
course.name||
"Course Lessons";

}else{

document.getElementById(
"courseTitle"
).textContent=
"Course";

}

}catch(error){

console.error(error);

}

}


/* =========================================
 LESSONS
========================================= */

async function loadLessons(){

try{

const q=query(

collection(
db,
"lessons"
),

where(
"courseId",
"==",
courseId
)

);


const snap=
await getDocs(q);


lessons=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);


lessons.sort(
(a,b)=>
Number(
a.order||0
)-
Number(
b.order||0
)
);


}catch(error){

console.error(error);

document.getElementById(
"lessonList"
).innerHTML=`

<div class="empty">

Unable to load lessons.

</div>

`;

}

}


/* =========================================
 PROGRESS
========================================= */

async function loadProgress(){

try{

const progressRef=
doc(
db,
"courseProgress",
`${currentUser.uid}_${courseId}`
);


const snap=
await getDoc(
progressRef
);


if(
snap.exists()
){

completed=
Array.isArray(
snap.data().completedLessons
)
?
snap.data().completedLessons
:
[];

}

}catch(error){

console.error(
"Progress error:",
error
);

}

}


/* =========================================
 RENDER LESSONS
========================================= */

function renderLessons(){

const list=
document.getElementById(
"lessonList"
);


if(!lessons.length){

list.innerHTML=`

<div class="empty">

No lessons available.

</div>

`;

updateProgress();

return;

}


list.innerHTML=
lessons.map(
(lesson,index)=>`

<div
class="lesson"
id="lesson-${lesson.id}"
onclick="selectLesson(${index})">

<div class="lesson-number">

${
completed.includes(lesson.id)
?"✓"
:index+1
}

</div>

<div>

<div class="lesson-title">

${esc(
lesson.title||
`Lesson ${index+1}`
)}

</div>

${
completed.includes(lesson.id)
?
`<div class="completed">
Completed
</div>`
:
""
}

</div>

</div>

`
).join("");


updateProgress();

}


/* =========================================
 SELECT LESSON
========================================= */

window.selectLesson=
function(index){

if(
typeof index!=="number"
)
index=Number(index);

if(
!lessons[index]
)
return;


currentIndex=index;

const lesson=
lessons[index];


document
.querySelectorAll(".lesson")
.forEach(
x=>x.classList.remove("active")
);


const item=
document.getElementById(
`lesson-${lesson.id}`
);

if(item)
item.classList.add("active");


renderLesson(lesson);


window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* =========================================
 RENDER CURRENT LESSON
========================================= */

function renderLesson(lesson){

const main=
document.getElementById(
"mainArea"
);


main.innerHTML=`

<div class="video">

${
getVideoHtml(lesson)
}

</div>


<section class="lesson-card">

<h2>
${esc(
lesson.title||
"Lesson"
)}
</h2>

<div class="meta">

Lesson ${currentIndex+1}
of ${lessons.length}

</div>


<div class="description">

${esc(
lesson.description||
lesson.content||
"No lesson description available."
)}

</div>


<div class="resource-row">

${
lesson.pdfUrl
?
`<button
class="back"
onclick="window.open('${safe(lesson.pdfUrl)}','_blank')">

📄 Open Notes

</button>`
:
""
}


${
lesson.resourceUrl
?
`<button
class="back"
onclick="window.open('${safe(lesson.resourceUrl)}','_blank')">

📎 Resource

</button>`
:
""
}


<button
class="back"
onclick="location.href='course-discussion.html?courseId=${encodeURIComponent(courseId)}'">

💬 Discussion

</button>

</div>


<button
id="completeBtn"
class="${
completed.includes(lesson.id)
?"success"
:"primary"
} complete"
onclick="toggleComplete()">

${
completed.includes(lesson.id)
?
"✓ Lesson Completed"
:
"✓ Mark Lesson Complete"
}

</button>

</section>


<div class="navigation">

<button
class="back"
onclick="previousLesson()"
${currentIndex===0?"disabled":""}>

← Previous

</button>


<button
class="primary"
onclick="nextLesson()"
${currentIndex===lessons.length-1?"disabled":""}>

Next →

</button>

</div>

`;

}


/* =========================================
 VIDEO
========================================= */

function getVideoHtml(lesson){

const url=
lesson.videoUrl||
lesson.video||
"";


if(!url){

return`

<div class="video-placeholder">

<div>▶️</div>

No video available for this lesson.

</div>

`;

}


const youtube=
getYoutubeId(url);


if(youtube){

return`

<iframe

src="https://www.youtube.com/embed/${youtube}"

allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"

allowfullscreen>

</iframe>

`;

}


if(
url.match(
/\.(mp4|webm|ogg)$/i
)
){

return`

<video
controls
preload="metadata">

<source
src="${safe(url)}">

Your browser does not support video.

</video>

`;

}


return`

<iframe
src="${safe(url)}"
allowfullscreen>
</iframe>

`;

}


/* =========================================
 COMPLETE
========================================= */

window.toggleComplete=
async function(){

if(
!lessons[currentIndex]
)
return;


const id=
lessons[currentIndex].id;


if(
completed.includes(id)
){

completed=
completed.filter(
x=>x!==id
);

}else{

completed.push(id);

}


try{

await setDoc(

doc(
db,
"courseProgress",
`${currentUser.uid}_${courseId}`
),

{

userId:
currentUser.uid,

courseId,

completedLessons:
completed,

progress:
Math.round(
(completed.length/
lessons.length)*100
),

updatedAt:
serverTimestamp()

}

);


renderLessons();

renderLesson(
lessons[currentIndex]
);

updateProgress();

toast(
completed.includes(id)
?
"Lesson completed!"
:
"Lesson marked incomplete."
);


}catch(error){

console.error(error);

toast(
"Unable to save progress."
);

}

};


/* =========================================
 NEXT
========================================= */

window.nextLesson=
function(){

if(
currentIndex<
lessons.length-1
){

selectLesson(
currentIndex+1
);

}

};


/* =========================================
 PREVIOUS
========================================= */

window.previousLesson=
function(){

if(
currentIndex>0
){

selectLesson(
currentIndex-1
);

}

};


/* =========================================
 UPDATE PROGRESS
========================================= */

function updateProgress(){

const total=
lessons.length;

const count=
completed.length;

const percent=
total
?
Math.round(
(count/total)*100
)
:0;


document.getElementById(
"progressBar"
).style.width=
percent+"%";


document.getElementById(
"progressText"
).textContent=
`${percent}% completed • ${count}/${total} lessons`;

}


/* =========================================
 INITIAL LESSON
========================================= */

function getInitialLesson(){

const lessonId=
params.get("lessonId");


if(lessonId){

const index=
lessons.findIndex(
x=>x.id===lessonId
);

if(index>=0)
return index;

}


return 0;

}


/* =========================================
 YOUTUBE
========================================= */

function getYoutubeId(url){

const match=
String(url).match(
/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?/]+)/i
);

return match
?match[1]
:null;

}


/* =========================================
 ERROR
========================================= */

function showError(message){

document.getElementById(
"mainArea"
).innerHTML=`

<div class="empty">

<div style="font-size:40px">
⚠️
</div>

<strong>
${esc(message)}
</strong>

</div>

`;

}


/* =========================================
 HELPERS
========================================= */

function esc(value){

return String(
value??""
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function safe(value){

return String(value||"")
.replace(/"/g,"%22")
.replace(/'/g,"%27");

}


function toast(message){

const el=
document.getElementById(
"toast"
);

el.textContent=message;

el.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
