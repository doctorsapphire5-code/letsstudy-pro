<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Course Lessons | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

.header{
  height:70px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:800;
}

.brand-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back-btn{
  border:1px solid #dbe1ea;
  background:#fff;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

.container{
  width:min(1150px,94%);
  margin:30px auto 60px;
}

.hero{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;
  padding:30px;
  border-radius:18px;
  margin-bottom:24px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#dbeafe;
}

.course-info{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.info-badge{
  background:rgba(255,255,255,.15);
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
}

.toolbar{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
  margin-bottom:22px;
}

.search{
  width:100%;
  padding:13px 15px;
  border:1px solid #dbe1ea;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.search:focus{
  border-color:#2563eb;
}

.lessons{
  display:grid;
  gap:16px;
}

.lesson{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
  display:flex;
  align-items:center;
  gap:17px;
  transition:.2s;
}

.lesson:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(15,23,42,.08);
}

.lesson-number{
  width:52px;
  height:52px;
  border-radius:14px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:800;
  flex-shrink:0;
}

.lesson-content{
  flex:1;
}

.lesson-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:5px;
}

.lesson-description{
  color:#64748b;
  font-size:14px;
  margin-bottom:10px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.badge{
  padding:5px 9px;
  background:#f1f5f9;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
  color:#475569;
}

.badge.video{
  background:#eff6ff;
  color:#2563eb;
}

.badge.success{
  background:#ecfdf5;
  color:#059669;
}

.play-btn{
  background:#2563eb;
  color:#fff;
  padding:11px 17px;
  border-radius:9px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}

.play-btn:hover{
  background:#1d4ed8;
}

.loading,
.empty,
.error{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:30px;
  text-align:center;
  color:#64748b;
}

.error{
  color:#b91c1c;
  border-color:#fecaca;
}

@media(max-width:700px){

  .header{
    padding:0 15px;
  }

  .brand{
    font-size:17px;
  }

  .container{
    width:96%;
    margin-top:20px;
  }

  .hero{
    padding:22px;
  }

  .hero h1{
    font-size:24px;
  }

  .lesson{
    align-items:flex-start;
    padding:16px;
  }

  .lesson-number{
    width:43px;
    height:43px;
  }

  .lesson-title{
    font-size:16px;
  }

  .play-btn{
    padding:9px 12px;
  }
}

@media(max-width:480px){

  .lesson{
    display:grid;
    grid-template-columns:45px 1fr;
  }

  .play-btn{
    grid-column:1 / -1;
    text-align:center;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="brand">
    <div class="brand-icon">🎓</div>
    <span>LetsStudy Pro</span>
  </a>

  <button
    class="back-btn"
    onclick="history.back()"
  >
    ← Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>Course Lessons</h1>

    <p>
      Watch lessons from this course directly inside LetsStudy Pro.
    </p>

    <div class="course-info">

      <div class="info-badge">
        Course ID:
        <strong id="courseIdDisplay">—</strong>
      </div>

      <div class="info-badge">
        Module:
        <strong id="moduleIdDisplay">—</strong>
      </div>

    </div>

  </section>


  <div class="toolbar">

    <input
      type="search"
      id="searchInput"
      class="search"
      placeholder="Search lessons..."
      autocomplete="off"
    >

  </div>


  <div id="lessonsContainer">

    <div class="loading">
      Loading course lessons...
    </div>

  </div>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


/*
  Supports:

  course-lessons.html?moduleId=MODULE_ID&courseId=COURSE_ID

  OR

  course-lessons.html?id=MODULE_ID&courseId=COURSE_ID
*/

const moduleId =
  params.get("moduleId") ||
  params.get("id") ||
  "";

const courseId =
  params.get("courseId") ||
  "";


/* =====================================================
   DATA
===================================================== */

let LESSONS = [];


/* =====================================================
   HELPERS
===================================================== */

function safe(value){

  if(
    value === undefined ||
    value === null
  ){

    return "";

  }

  return String(value).trim();

}


function escapeHtml(value){

  return safe(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getOrder(lesson){

  const order =
    Number(lesson.order);

  return Number.isFinite(order)
    ? order
    : 999999;

}


/* =====================================================
   LOAD LESSONS
===================================================== */

async function loadLessons(){

  const container =
    document.getElementById(
      "lessonsContainer"
    );


  document.getElementById(
    "courseIdDisplay"
  ).textContent =
    courseId || "—";


  document.getElementById(
    "moduleIdDisplay"
  ).textContent =
    moduleId || "All Modules";


  /*
    Course ID is required for a course-specific page.
  */

  if(!courseId){

    container.innerHTML = `

      <div class="error">

        <h3>
          Course ID is missing
        </h3>

        <p>
          Open this page from a specific course or module.
        </p>

      </div>

    `;

    return;

  }


  try{

    const snapshot =
      await getDocs(
        collection(db,"lessons")
      );


    LESSONS = [];


    snapshot.forEach(docSnap => {

      const data =
        docSnap.data() || {};

      LESSONS.push({

        ...data,

        id:docSnap.id,

        lessonId:docSnap.id,

        documentId:docSnap.id

      });

    });


    /*
      =================================================
      IMPORTANT SECURITY/FILTER LOGIC
      =================================================

      FIRST:
      Only lessons belonging to this COURSE.

      SECOND:
      If moduleId exists,
      only lessons belonging to this MODULE.

      This prevents lessons from another
      course/module from appearing.
    */


    LESSONS =
      LESSONS.filter(
        lesson =>
          safe(lesson.courseId) ===
          courseId
      );


    if(moduleId){

      LESSONS =
        LESSONS.filter(
          lesson =>
            safe(lesson.moduleId) ===
            moduleId
        );

    }


    /*
      Sort lessons by order.
    */

    LESSONS.sort(
      (a,b) =>
        getOrder(a) -
        getOrder(b)
    );


    renderLessons();


  }catch(error){

    console.error(
      "Lessons loading error:",
      error
    );


    container.innerHTML = `

      <div class="error">

        <h3>
          Unable to load lessons
        </h3>

        <p>
          ${escapeHtml(error.message)}
        </p>

      </div>

    `;

  }

}


/* =====================================================
   RENDER LESSONS
===================================================== */

function renderLessons(){

  const container =
    document.getElementById(
      "lessonsContainer"
    );


  const query =
    safe(
      document.getElementById(
        "searchInput"
      ).value
    ).toLowerCase();


  const filtered =
    LESSONS.filter(lesson => {

      if(!query){

        return true;

      }


      const searchable = [

        lesson.title,

        lesson.description,

        lesson.type,

        lesson.duration,

        lesson.status,

        lesson.createdBy,

        lesson.courseId,

        lesson.moduleId

      ]
      .map(value =>
        safe(value).toLowerCase()
      )
      .join(" ");


      return searchable.includes(query);

    });


  if(!filtered.length){

    container.innerHTML = `

      <div class="empty">

        <h3>
          No lessons found
        </h3>

        <p>
          This course does not have lessons matching your search.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="lessons">

      ${filtered.map(
        (lesson,index) => {

          const lessonId =
            safe(lesson.id);

          const title =
            safe(lesson.title) ||
            "Untitled Lesson";

          const description =
            safe(lesson.description) ||
            "No description available.";

          const type =
            safe(lesson.type) ||
            "video";

          const duration =
            safe(lesson.duration) ||
            "—";

          const status =
            safe(lesson.status) ||
            "published";

          const order =
            safe(lesson.order) ||
            (index + 1);


          return `

            <article class="lesson">

              <div class="lesson-number">

                ${escapeHtml(order)}

              </div>


              <div class="lesson-content">

                <div class="lesson-title">

                  ${escapeHtml(title)}

                </div>


                <div class="lesson-description">

                  ${escapeHtml(description)}

                </div>


                <div class="meta">

                  <span class="badge video">

                    🎬
                    ${escapeHtml(type)}

                  </span>


                  ${
                    duration !== "—"
                    ?
                    `
                    <span class="badge">

                      ⏱
                      ${escapeHtml(duration)}

                    </span>
                    `
                    :
                    ""
                  }


                  <span class="badge success">

                    ${escapeHtml(status)}

                  </span>

                </div>

              </div>


              <a
                class="play-btn"
                href="
                  lesson-watch.html?id=
                  ${encodeURIComponent(lessonId)}
                "
              >

                ▶ Watch Lesson

              </a>

            </article>

          `;

        }
      ).join("")}

    </div>

  `;

}


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderLessons
  );


/* =====================================================
   START
===================================================== */

loadLessons();

</script>

</body>
</html>
