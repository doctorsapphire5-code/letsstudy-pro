<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Lessons | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  width:100%;
  background:#111827;
  color:#fff;
  padding:15px 20px;
}

.nav{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.back{
  border:0;
  background:#374151;
  color:#fff;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
}

main{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:#fff;
  padding:22px;
  border-radius:14px;
  margin-bottom:18px;
  box-shadow:0 2px 10px #00000012;
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#6b7280;
  line-height:1.6;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.badge{
  background:#eef2ff;
  color:#3730a3;
  padding:7px 11px;
  border-radius:20px;
  font-size:13px;
}

.layout{
  display:grid;
  grid-template-columns:1fr 340px;
  gap:18px;
}

.player{
  background:#000;
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

video{
  width:100%;
  display:block;
  background:#000;
  max-height:70vh;
  cursor:pointer;
}

.video-info{
  background:#fff;
  padding:18px;
}

.video-info h2{
  margin:0 0 8px;
  font-size:22px;
}

.video-info p{
  margin:0;
  color:#6b7280;
  line-height:1.6;
}

.fullscreen{
  margin-top:12px;
  border:0;
  background:#111827;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.progress-wrap{
  margin-top:15px;
}

.progress{
  height:7px;
  width:100%;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0;
  background:#2563eb;
}

.progress-text{
  margin-top:7px;
  color:#6b7280;
  font-size:13px;
}

.lessons{
  background:#fff;
  border-radius:14px;
  padding:15px;
  box-shadow:0 2px 10px #00000012;
  max-height:80vh;
  overflow:auto;
}

.lessons h2{
  margin:5px 0 12px;
  font-size:20px;
}

.search{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
  margin-bottom:12px;
}

.lesson{
  width:100%;
  text-align:left;
  border:1px solid #e5e7eb;
  background:#fff;
  padding:13px;
  border-radius:10px;
  margin-bottom:9px;
  cursor:pointer;
}

.lesson:hover{
  background:#f9fafb;
}

.lesson.active{
  border-color:#2563eb;
  background:#eff6ff;
}

.lesson-number{
  font-size:12px;
  color:#6b7280;
  margin-bottom:4px;
}

.lesson-title{
  font-weight:700;
}

.lesson-meta{
  margin-top:5px;
  font-size:12px;
  color:#6b7280;
}

.loading,
.error{
  background:#fff;
  padding:25px;
  border-radius:12px;
  text-align:center;
}

.error{
  color:#b91c1c;
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr;
  }

  .lessons{
    max-height:none;
  }

  .hero h1{
    font-size:23px;
  }

  main{
    padding:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">🌍 LetsStudy Pro</div>
    <button class="back" id="backBtn">← Back</button>
  </div>
</header>

<main>

  <div id="loading" class="loading">
    Loading course...
  </div>

  <div id="error" class="error" style="display:none"></div>

  <section id="content" style="display:none">

    <div class="hero">
      <h1 id="courseTitle"></h1>
      <p id="courseDescription"></p>

      <div class="meta">
        <span class="badge" id="courseCategory"></span>
        <span class="badge" id="courseLevel"></span>
        <span class="badge" id="lessonCount"></span>
      </div>
    </div>

    <div class="layout">

      <!-- VIDEO -->
      <div>

        <div class="player">

          <video
            id="lessonVideo"
            controls
            playsinline
            preload="metadata"
          >
            <source id="videoSource" src="" type="video/mp4">
            Your browser does not support video.
          </video>

        </div>

        <div class="video-info">

          <h2 id="lessonTitle">
            Select a lesson
          </h2>

          <p id="lessonDescription">
            Select a lesson from the list to start learning.
          </p>

          <button
            class="fullscreen"
            id="fullscreenBtn"
          >
            ⛶ Full Screen
          </button>

          <div class="progress-wrap">

            <div class="progress">
              <div
                class="progress-bar"
                id="progressBar"
              ></div>
            </div>

            <div
              class="progress-text"
              id="progressText"
            >
              0% completed
            </div>

          </div>

        </div>

      </div>


      <!-- LESSONS -->
      <aside class="lessons">

        <h2>Course Lessons</h2>

        <input
          class="search"
          id="searchInput"
          type="search"
          placeholder="Search lessons..."
        >

        <div id="lessonsList"></div>

      </aside>

    </div>

  </section>

</main>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey:"AIzaSyBcOYDfAVK5XbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId:"G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================================
   URL PARAMETERS
========================================= */

const params =
  new URLSearchParams(window.location.search);

const courseId = (
  params.get("courseId") ||
  params.get("courseID") ||
  params.get("course") ||
  ""
).trim();

const requestedLessonId = (
  params.get("lessonId") ||
  params.get("lessonID") ||
  params.get("lesson") ||
  ""
).trim();


/* =========================================
   ELEMENTS
========================================= */

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const content =
  document.getElementById("content");

const courseTitle =
  document.getElementById("courseTitle");

const courseDescription =
  document.getElementById("courseDescription");

const courseCategory =
  document.getElementById("courseCategory");

const courseLevel =
  document.getElementById("courseLevel");

const lessonCount =
  document.getElementById("lessonCount");

const lessonsList =
  document.getElementById("lessonsList");

const searchInput =
  document.getElementById("searchInput");

const video =
  document.getElementById("lessonVideo");

const videoSource =
  document.getElementById("videoSource");

const lessonTitle =
  document.getElementById("lessonTitle");

const lessonDescription =
  document.getElementById("lessonDescription");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const backBtn =
  document.getElementById("backBtn");


let COURSE = null;
let LESSONS = [];
let CURRENT_LESSON = null;


/* =========================================
   BACK
========================================= */

backBtn.addEventListener("click", () => {

  if(history.length > 1){
    history.back();
  }else{
    window.location.href = "courses.html";
  }

});


/* =========================================
   ERROR
========================================= */

function showError(message){

  loading.style.display = "none";
  content.style.display = "none";

  errorBox.textContent = message;
  errorBox.style.display = "block";

}


/* =========================================
   START
========================================= */

if(!courseId){

  showError(
    "Course ID is missing. Please open this page using ?courseId=COURSE_ID"
  );

}else{

  loadCourse();

}


/* =========================================
   LOAD ONE COURSE ONLY
========================================= */

async function loadCourse(){

  try{

    loading.textContent =
      "Loading course...";

    /*
      IMPORTANT:
      Only this exact course document
      is loaded.
    */

    const courseRef =
      doc(db,"courses",courseId);

    const courseSnap =
      await getDoc(courseRef);


    if(!courseSnap.exists()){

      throw new Error(
        "The requested course was not found."
      );

    }


    COURSE = {
      id:courseSnap.id,
      ...courseSnap.data()
    };


    /*
      Optional safety check.
      If the document itself contains courseId,
      make sure it matches the URL.
    */

    if(
      COURSE.courseId &&
      String(COURSE.courseId) !==
      String(courseId)
    ){

      throw new Error(
        "Course ID mismatch."
      );

    }


    renderCourse();


    /*
      IMPORTANT:
      Lessons are queried ONLY for this
      courseId.
    */

    await loadLessons();


    content.style.display = "block";
    loading.style.display = "none";


  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Failed to load course."
    );

  }

}


/* =========================================
   LOAD LESSONS FOR THIS COURSE ONLY
========================================= */

async function loadLessons(){

  /*
    NO:
    getDocs(collection(db,"lessons"))

    YES:
    Firestore query-level filtering.
  */

  const lessonsQuery = query(
    collection(db,"lessons"),
    where("courseId","==",courseId)
  );


  const snapshot =
    await getDocs(lessonsQuery);


  LESSONS = [];


  snapshot.forEach(docSnap => {

    const data = docSnap.data() || {};


    /*
      Second safety check.
    */

    if(
      String(data.courseId || "") !==
      String(courseId)
    ){
      return;
    }


    const status =
      String(
        data.status ||
        data.lessonStatus ||
        ""
      ).toLowerCase();


    /*
      Hide obvious private/draft lessons.
    */

    if(
      status === "draft" ||
      status === "private" ||
      status === "disabled"
    ){
      return;
    }


    LESSONS.push({
      id:docSnap.id,
      ...data
    });

  });


  LESSONS.sort((a,b) => {

    const orderA =
      Number(
        a.order ??
        a.lessonOrder ??
        a.position ??
        999999
      );

    const orderB =
      Number(
        b.order ??
        b.lessonOrder ??
        b.position ??
        999999
      );

    return orderA - orderB;

  });


  lessonCount.textContent =
    `${LESSONS.length} Lessons`;


  renderLessons(LESSONS);


  /*
    Open requested lesson if supplied.
    Otherwise open first lesson.
  */

  let selected = null;


  if(requestedLessonId){

    selected =
      LESSONS.find(
        lesson =>
          String(lesson.id) ===
          String(requestedLessonId)
      );

  }


  if(!selected && LESSONS.length){

    selected = LESSONS[0];

  }


  if(selected){

    openLesson(selected);

  }else{

    lessonTitle.textContent =
      "No lessons available";

    lessonDescription.textContent =
      "This course currently has no published lessons.";

  }

}


/* =========================================
   COURSE UI
========================================= */

function renderCourse(){

  courseTitle.textContent =
    getValue(
      COURSE,
      ["title","name","courseTitle"],
      "Untitled Course"
    );


  courseDescription.textContent =
    getValue(
      COURSE,
      ["description","courseDescription"],
      "No course description available."
    );


  courseCategory.textContent =
    getValue(
      COURSE,
      ["category","courseCategory"],
      "Course"
    );


  courseLevel.textContent =
    getValue(
      COURSE,
      ["level","courseLevel"],
      "All Levels"
    );

}


/* =========================================
   RENDER LESSONS
========================================= */

function renderLessons(list){

  if(!list.length){

    lessonsList.innerHTML =
      `<p style="color:#6b7280">
        No lessons found.
      </p>`;

    return;

  }


  lessonsList.innerHTML =
    list.map((lesson,index) => {

      const title =
        getValue(
          lesson,
          ["title","lessonTitle","name"],
          `Lesson ${index + 1}`
        );


      const duration =
        getValue(
          lesson,
          ["duration","videoDuration"],
          ""
        );


      const type =
        getValue(
          lesson,
          ["type","lessonType"],
          "Video"
        );


      return `
        <button
          class="lesson"
          data-id="${escapeHTML(lesson.id)}"
        >

          <div class="lesson-number">
            Lesson ${index + 1}
          </div>

          <div class="lesson-title">
            ${escapeHTML(title)}
          </div>

          <div class="lesson-meta">
            ${escapeHTML(type)}
            ${duration ? " • " + escapeHTML(duration) : ""}
          </div>

        </button>
      `;

    }).join("");


  document
    .querySelectorAll(".lesson")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.id;

          const selected =
            LESSONS.find(
              lesson =>
                String(lesson.id) ===
                String(id)
            );

          if(selected){

            openLesson(selected);

          }

        }
      );

    });

}


/* =========================================
   OPEN LESSON
========================================= */

function openLesson(lesson){

  /*
    Extra protection:
    Never allow a lesson from another course.
  */

  if(
    String(lesson.courseId || "") !==
    String(courseId)
  ){

    console.error(
      "Blocked lesson from another course."
    );

    return;

  }


  CURRENT_LESSON = lesson;


  const title =
    getValue(
      lesson,
      ["title","lessonTitle","name"],
      "Untitled Lesson"
    );


  const description =
    getValue(
      lesson,
      ["description","lessonDescription"],
      "No lesson description available."
    );


  const videoUrl =
    getValue(
      lesson,
      [
        "videoUrl",
        "contentUrl",
        "video",
        "url"
      ],
      ""
    );


  lessonTitle.textContent =
    title;


  lessonDescription.textContent =
    description;


  /*
    Mark active lesson.
  */

  document
    .querySelectorAll(".lesson")
    .forEach(button => {

      button.classList.toggle(
        "active",
        String(button.dataset.id) ===
        String(lesson.id)
      );

    });


  /*
    Change video.
  */

  if(videoUrl){

    videoSource.src =
      safeUrl(videoUrl);

    video.load();

  }else{

    videoSource.src = "";

    video.load();

    console.warn(
      "No video URL found for lesson:",
      lesson.id
    );

  }


  /*
    Restore progress for this
    specific course + lesson.
  */

  restoreProgress();

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "input",
  function(){

    const term =
      this.value
        .trim()
        .toLowerCase();


    if(!term){

      renderLessons(LESSONS);

      highlightCurrent();

      return;

    }


    const filtered =
      LESSONS.filter(lesson => {

        const text = [

          lesson.title,
          lesson.lessonTitle,
          lesson.name,
          lesson.description,
          lesson.lessonDescription

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        return text.includes(term);

      });


    renderLessons(filtered);

    highlightCurrent();

  }
);


/* =========================================
   HIGHLIGHT CURRENT LESSON
========================================= */

function highlightCurrent(){

  if(!CURRENT_LESSON) return;

  document
    .querySelectorAll(".lesson")
    .forEach(button => {

      button.classList.toggle(
        "active",
        String(button.dataset.id) ===
        String(CURRENT_LESSON.id)
      );

    });

}


/* =========================================
   FULLSCREEN
========================================= */

async function toggleFullscreen(){

  try{

    if(document.fullscreenElement){

      await document.exitFullscreen();

      return;

    }


    /*
      Try video fullscreen first.
    */

    if(video.requestFullscreen){

      await video.requestFullscreen();

    }else if(video.webkitRequestFullscreen){

      video.webkitRequestFullscreen();

    }else if(video.webkitEnterFullscreen){

      video.webkitEnterFullscreen();

    }

  }catch(error){

    console.warn(
      "Fullscreen unavailable:",
      error
    );

  }

}


/*
  Clicking the video itself
  opens fullscreen.
*/

video.addEventListener(
  "click",
  toggleFullscreen
);


fullscreenBtn.addEventListener(
  "click",
  toggleFullscreen
);


/* =========================================
   FULLSCREEN BUTTON TEXT
========================================= */

document.addEventListener(
  "fullscreenchange",
  () => {

    fullscreenBtn.textContent =
      document.fullscreenElement
      ? "⛶ Exit Full Screen"
      : "⛶ Full Screen";

  }
);


/* =========================================
   VIDEO PROGRESS
========================================= */

video.addEventListener(
  "timeupdate",
  () => {

    if(
      !video.duration ||
      !isFinite(video.duration)
    ){
      return;
    }


    const percent =
      (video.currentTime /
      video.duration) * 100;


    progressBar.style.width =
      Math.min(100,percent) + "%";


    progressText.textContent =
      `${Math.round(percent)}% completed`;


    saveProgress();

  }
);


/* =========================================
   SAVE PROGRESS
========================================= */

function progressKey(){

  if(!CURRENT_LESSON) return "";

  return `lessonProgress_${courseId}_${CURRENT_LESSON.id}`;

}


function saveProgress(){

  const key = progressKey();

  if(!key) return;

  localStorage.setItem(
    key,
    String(video.currentTime || 0)
  );

}


/* =========================================
   RESTORE PROGRESS
========================================= */

function restoreProgress(){

  const key =
    progressKey();

  const saved =
    localStorage.getItem(key);


  progressBar.style.width =
    "0%";

  progressText.textContent =
    "0% completed";


  if(!saved) return;


  const time =
    Number(saved);


  if(
    Number.isFinite(time) &&
    time > 0
  ){

    video.addEventListener(
      "loadedmetadata",
      function restore(){

        if(
          video.duration &&
          time < video.duration
        ){

          video.currentTime =
            time;

        }

        video.removeEventListener(
          "loadedmetadata",
          restore
        );

      }
    );

  }

}


/* =========================================
   COMPLETED
========================================= */

video.addEventListener(
  "ended",
  () => {

    if(!CURRENT_LESSON) return;


    const key =
      `lessonCompleted_${courseId}_${CURRENT_LESSON.id}`;


    localStorage.setItem(
      key,
      "true"
    );


    progressBar.style.width =
      "100%";

    progressText.textContent =
      "100% completed ✓";

  }
);


/* =========================================
   HELPERS
========================================= */

function getValue(
  object,
  fields,
  fallback = ""
){

  for(const field of fields){

    const value =
      object?.[field];

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value);

    }

  }

  return fallback;

}


/* =========================================
   SAFE VIDEO URL
========================================= */

function safeUrl(value){

  if(!value) return "";

  const url =
    String(value).trim();

  if(
    url.startsWith("https://") ||
    url.startsWith("http://")
  ){

    return url;

  }

  return "";

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   PAGE READY
========================================= */

console.log(
  "LetsStudy Pro course lesson system loaded.",
  {
    courseId: courseId,
    requestedLessonId: requestedLessonId
  }
);

</script>

</body>
</html>
