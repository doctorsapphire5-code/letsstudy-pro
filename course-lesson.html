<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Course Lessons | LetsStudy Pro</title>

<meta
  name="description"
  content="Access lessons from your enrolled LetsStudy Pro courses."
>

<meta
  name="robots"
  content="noindex,nofollow"
>

<link rel="icon" href="favicon.ico">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  background:#f5f7fb;
  color:#172033;
  min-height:100vh;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:100;
}

.navbar{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:14px;
}

.back-btn{
  border:0;
  background:#eef2ff;
  color:#3730a3;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

.back-btn:hover{
  background:#e0e7ff;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.brand span{
  color:#4f46e5;
}

main{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 50px;
}

/* =====================================================
   COURSE SELECTOR
===================================================== */

.course-selector{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.course-selector label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

.course-selector select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  background:#fff;
  font-size:15px;
  outline:none;
}

.course-selector select:focus{
  border-color:#6366f1;
}

/* =====================================================
   HERO
===================================================== */

.hero{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #e5e7eb;
  margin-bottom:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.hero-image{
  width:100%;
  height:280px;
  object-fit:cover;
  background:#e5e7eb;
  display:block;
}

.hero-body{
  padding:25px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#eef2ff;
  color:#3730a3;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.hero h1{
  font-size:32px;
  margin-bottom:12px;
  line-height:1.25;
}

.hero-description{
  color:#667085;
  line-height:1.7;
  margin-bottom:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#f8fafc;
  border-radius:12px;
  padding:15px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.stat span{
  font-size:13px;
  color:#667085;
}

/* =====================================================
   SECTION
===================================================== */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.section-title h2{
  font-size:24px;
}

/* =====================================================
   SEARCH
===================================================== */

.search-box{
  position:relative;
  margin-bottom:18px;
}

.search-box i{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#98a2b3;
}

.search-box input{
  width:100%;
  padding:14px 15px 14px 45px;
  border:1px solid #d1d5db;
  border-radius:12px;
  outline:none;
  font-size:15px;
  background:#fff;
}

.search-box input:focus{
  border-color:#6366f1;
}

/* =====================================================
   LESSONS
===================================================== */

.lessons{
  display:grid;
  gap:12px;
}

.lesson-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:16px;
  transition:.2s;
}

.lesson-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.lesson-number{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:12px;
  background:#eef2ff;
  color:#4338ca;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.lesson-icon{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:11px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#475467;
}

.lesson-info{
  flex:1;
  min-width:0;
}

.lesson-info h3{
  font-size:17px;
  margin-bottom:6px;
  word-break:break-word;
}

.lesson-description{
  color:#667085;
  font-size:14px;
  line-height:1.5;
}

.lesson-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:8px;
}

.lesson-meta span{
  font-size:12px;
  color:#667085;
}

.open-btn{
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:7px;
}

.open-btn:hover{
  background:#4338ca;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
  text-align:center;
  padding:60px 20px;
  color:#667085;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #e5e7eb;
  border-top-color:#4f46e5;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  text-align:center;
  padding:60px 20px;
  color:#667085;
}

.empty i{
  font-size:45px;
  margin-bottom:15px;
  color:#98a2b3;
}

.empty h2{
  color:#172033;
  margin-bottom:8px;
}

/* =====================================================
   ERROR
===================================================== */

.error{
  background:#fff;
  border:1px solid #fecaca;
  border-radius:16px;
  padding:45px 20px;
  text-align:center;
}

.error i{
  color:#dc2626;
  font-size:45px;
  margin-bottom:15px;
}

.error h2{
  margin-bottom:10px;
}

.error p{
  color:#667085;
  margin-bottom:20px;
  line-height:1.6;
}

.retry-btn{
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:11px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

/* =====================================================
   FOOTER
===================================================== */

footer{
  text-align:center;
  color:#667085;
  font-size:13px;
  padding:30px 20px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  main{
    padding:18px 12px 40px;
  }

  .navbar{
    padding:12px;
  }

  .brand{
    font-size:17px;
  }

  .hero-image{
    height:190px;
  }

  .hero-body{
    padding:18px;
  }

  .hero h1{
    font-size:25px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .lesson-card{
    align-items:flex-start;
  }

  .lesson-number{
    display:none;
  }

  .lesson-icon{
    width:40px;
    min-width:40px;
  }

  .open-btn{
    padding:9px 11px;
    font-size:13px;
  }

}

</style>

</head>


<body>

<header>

  <div class="navbar">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >

      <i class="fa-solid fa-arrow-left"></i>

      Back

    </button>


    <div class="brand">

      LetsStudy <span>Pro</span>

    </div>

  </div>

</header>


<main>

  <!-- =================================================
       ENROLLED COURSE SELECTOR
  ================================================== -->

  <div
    class="course-selector"
    id="courseSelector"
    style="display:none;"
  >

    <label for="courseSelect">

      My Enrolled Courses

    </label>


    <select id="courseSelect">

      <option value="">

        Loading enrolled courses...

      </option>

    </select>

  </div>


  <!-- =================================================
       MAIN CONTENT
  ================================================== -->

  <div id="pageContent">

    <div class="loading">

      <div class="spinner"></div>

      <p>
        Checking your enrollment...
      </p>

    </div>

  </div>

</main>


<footer>

  © 2026 LetsStudy Pro ·
  Learn. Build. Work. Grow.

</footer>


<script type="module">


/* =====================================================
   FIREBASE APP
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  query,
  where
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRg0rj0odBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


const auth =
  getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const pageContent =
  document.getElementById(
    "pageContent"
  );


const courseSelector =
  document.getElementById(
    "courseSelector"
  );


const courseSelect =
  document.getElementById(
    "courseSelect"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let enrolledCourses = [];

let currentCourseId = "";

let currentCourse = null;

let allLessons = [];


/* =====================================================
   URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const urlCourseId = (
  params.get("courseId") ||
  params.get("courseID") ||
  params.get("id") ||
  params.get("course") ||
  ""
).trim();


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if (
      window.history.length > 1
    ) {

      window.history.back();

    } else {

      window.location.href =
        "courses.html";

    }

  }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if (!user) {

      currentUser = null;

      showLoginRequired();

      return;

    }


    currentUser = user;


    console.log(
      "Authenticated user:",
      user.uid
    );


    await loadEnrolledCourses(
      user.uid
    );

  }
);


/* =====================================================
   LOAD ENROLLED COURSES
===================================================== */

async function loadEnrolledCourses(
  userId
) {

  try {

    pageContent.innerHTML = `

      <div class="loading">

        <div class="spinner"></div>

        <p>
          Loading your enrolled courses...
        </p>

      </div>

    `;


    /*
      IMPORTANT:

      We only query enrollments
      belonging to the current user.
    */

    const enrollmentQuery =
      query(
        collection(
          db,
          "enrollments"
        ),
        where(
          "userId",
          "==",
          userId
        )
      );


    const enrollmentSnapshot =
      await getDocs(
        enrollmentQuery
      );


    if (
      enrollmentSnapshot.empty
    ) {

      showNoEnrollment();

      return;

    }


    const courseIds = [];


    enrollmentSnapshot.forEach(
      enrollmentDoc => {

        const data =
          enrollmentDoc.data();


        const status =
          String(
            data.status ||
            ""
          ).toLowerCase();


        /*
          Accepted enrollment states.
        */

        const validStatus =
          status === "" ||
          status === "active" ||
          status === "approved" ||
          status === "enrolled" ||
          status === "completed";


        if (!validStatus) {

          return;

        }


        const courseId =
          data.courseId ||
          data.courseID ||
          data.course;


        if (
          courseId &&
          !courseIds.includes(
            String(courseId)
          )
        ) {

          courseIds.push(
            String(courseId)
          );

        }

      }
    );


    if (
      courseIds.length === 0
    ) {

      showNoEnrollment();

      return;

    }


    /*
      Get only the courses that
      appear in the user's enrollments.
    */

    enrolledCourses = [];


    for (
      const courseId of courseIds
    ) {

      try {

        const courseRef =
          doc(
            db,
            "courses",
            courseId
          );


        const courseSnapshot =
          await getDoc(
            courseRef
          );


        if (
          courseSnapshot.exists()
        ) {

          enrolledCourses.push({

            id:
              courseSnapshot.id,

            ...courseSnapshot.data()

          });

        }

      } catch(error) {

        console.error(
          "Course load error:",
          courseId,
          error
        );

      }

    }


    if (
      enrolledCourses.length === 0
    ) {

      showNoEnrollment();

      return;

    }


    console.log(
      "Enrolled courses:",
      enrolledCourses
    );


    /*
      If URL contains an ID and the user
      is actually enrolled in that course,
      use it.

      Otherwise use first enrolled course.
    */

    const requestedCourse =
      enrolledCourses.find(
        course =>
          course.id ===
          urlCourseId
      );


    if (
      requestedCourse
    ) {

      currentCourseId =
        requestedCourse.id;

    } else {

      currentCourseId =
        enrolledCourses[0].id;

    }


    renderCourseSelector();


    await loadSelectedCourse();

  } catch(error) {

    console.error(
      "Enrollment error:",
      error
    );


    if (
      error?.code ===
      "permission-denied"
    ) {

      showError(
        "You do not have permission to access your enrollments."
      );

    } else {

      showError(
        "Unable to load your enrolled courses."
      );

    }

  }

}


/* =====================================================
   COURSE SELECTOR
===================================================== */

function renderCourseSelector() {

  if (
    enrolledCourses.length <= 1
  ) {

    courseSelector.style.display =
      "none";

    return;

  }


  courseSelector.style.display =
    "block";


  courseSelect.innerHTML =
    enrolledCourses
      .map(
        course => {

          const title =
            getCourseTitle(
              course
            );


          return `

            <option
              value="${escapeHTML(
                course.id
              )}"
              ${
                course.id ===
                currentCourseId
                  ? "selected"
                  : ""
              }
            >

              ${escapeHTML(
                title
              )}

            </option>

          `;

        }
      )
      .join("");

}


/* =====================================================
   COURSE CHANGE
===================================================== */

courseSelect.addEventListener(
  "change",
  async event => {

    const id =
      event.target.value;


    if (!id) {

      return;

    }


    /*
      Security/UI check:
      Never allow selecting a course
      that is not in enrolledCourses.
    */

    const enrolled =
      enrolledCourses.some(
        course =>
          course.id === id
      );


    if (!enrolled) {

      return;

    }


    currentCourseId =
      id;


    await loadSelectedCourse();

  }
);


/* =====================================================
   LOAD SELECTED COURSE
===================================================== */

async function loadSelectedCourse() {

  /*
    Extra client-side protection.
    The selected course must belong
    to the user's enrolled courses.
  */

  const isEnrolled =
    enrolledCourses.some(
      course =>
        course.id ===
        currentCourseId
    );


  if (!isEnrolled) {

    showError(
      "You are not enrolled in this course."
    );

    return;

  }


  pageContent.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      <p>
        Loading course...
      </p>

    </div>

  `;


  try {

    const courseSnapshot =
      await getDoc(
        doc(
          db,
          "courses",
          currentCourseId
        )
      );


    if (
      !courseSnapshot.exists()
    ) {

      showError(
        "This enrolled course could not be found."
      );

      return;

    }


    currentCourse = {

      id:
        courseSnapshot.id,

      ...courseSnapshot.data()

    };


    /*
      Load lessons belonging to
      this enrolled course.
    */

    await loadLessons();


    renderCourse();

  } catch(error) {

    console.error(
      "Selected course error:",
      error
    );


    if (
      error?.code ===
      "permission-denied"
    ) {

      showError(
        "Permission denied while loading this course."
      );

    } else {

      showError(
        "Unable to load this course."
      );

    }

  }

}


/* =====================================================
   LOAD LESSONS
===================================================== */

async function loadLessons() {

  allLessons = [];


  try {

    const lessonsQuery =
      query(
        collection(
          db,
          "lessons"
        ),
        where(
          "courseId",
          "==",
          currentCourseId
        )
      );


    const snapshot =
      await getDocs(
        lessonsQuery
      );


    allLessons =
      snapshot.docs.map(
        lessonDoc => ({

          id:
            lessonDoc.id,

          ...lessonDoc.data()

        })
      );


  } catch(error) {

    console.error(
      "Lesson query error:",
      error
    );


    /*
      Fallback for schemas using
      courseID/course instead of courseId.
    */

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "lessons"
          )
        );


      allLessons =
        snapshot.docs
          .map(
            lessonDoc => ({

              id:
                lessonDoc.id,

              ...lessonDoc.data()

            })
          )
          .filter(
            lesson => {

              const id =
                lesson.courseId ||
                lesson.courseID ||
                lesson.course ||
                "";


              return String(id) ===
                String(currentCourseId);

            }
          );


    } catch(
      fallbackError
    ) {

      console.error(
        "Lesson fallback error:",
        fallbackError
      );


          allLessons = [];

    }

  }


  /*
    Only show lessons that are published
    or active. Empty status is also allowed.
  */

  allLessons =
    allLessons.filter(
      lesson => {

        const status =
          String(
            lesson.status || ""
          ).toLowerCase().trim();

        return (
          status === "" ||
          status === "published" ||
          status === "active"
        );

      }
    );


  /*
    Sort lessons by module first,
    then by lesson order.
  */

  allLessons.sort(
    (a, b) => {

      const moduleA =
        String(
          a.moduleId ||
          a.moduleID ||
          a.module ||
          ""
        );

      const moduleB =
        String(
          b.moduleId ||
          b.moduleID ||
          b.module ||
          ""
        );


      if (moduleA !== moduleB) {

        return moduleA.localeCompare(
          moduleB,
          undefined,
          {
            numeric: true
          }
        );

      }


      const orderA =
        Number(
          a.order ??
          a.lessonOrder ??
          a.position ??
          0
        );


      const orderB =
        Number(
          b.order ??
          b.lessonOrder ??
          b.position ??
          0
        );


      return orderA - orderB;

    }
  );


  console.log(
    "Loaded enrolled course lessons:",
    allLessons
  );

}


/* =====================================================
   RENDER COURSE
===================================================== */

function renderCourse() {

  const title =
    getCourseTitle(
      currentCourse
    );


  const description =
    currentCourse.description ||
    currentCourse.summary ||
    currentCourse.shortDescription ||
    "Learn through structured lessons on LetsStudy Pro.";


  const image =
    currentCourse.image ||
    currentCourse.imageUrl ||
    currentCourse.thumbnail ||
    currentCourse.thumbnailUrl ||
    "";


  const category =
    currentCourse.category ||
    currentCourse.courseCategory ||
    "";


  const level =
    currentCourse.level ||
    currentCourse.difficulty ||
    "";


  const instructor =
    currentCourse.instructorName ||
    currentCourse.instructor ||
    currentCourse.teacher ||
    currentCourse.createdByName ||
    "";


  pageContent.innerHTML = `

    <section class="hero">

      ${
        image
          ? `
            <img
              class="hero-image"
              src="${escapeHTML(image)}"
              alt="${escapeHTML(title)}"
              onerror="
                this.style.display='none';
              "
            >
          `
          : ""
      }


      <div class="hero-body">

        <div class="badges">

          ${
            category
              ? `
                <span class="badge">

                  <i
                    class="fa-solid fa-layer-group"
                  ></i>

                  ${escapeHTML(
                    formatText(category)
                  )}

                </span>
              `
              : ""
          }


          ${
            level
              ? `
                <span class="badge">

                  <i
                    class="fa-solid fa-signal"
                  ></i>

                  ${escapeHTML(
                    formatText(level)
                  )}

                </span>
              `
              : ""
          }


          <span class="badge">

            <i
              class="fa-solid fa-circle-check"
            ></i>

            Enrolled

          </span>


          ${
            instructor
              ? `
                <span class="badge">

                  <i
                    class="fa-solid fa-user"
                  ></i>

                  ${escapeHTML(
                    String(instructor)
                  )}

                </span>
              `
              : ""
          }

        </div>


        <h1>
          ${escapeHTML(title)}
        </h1>


        <p class="hero-description">
          ${escapeHTML(
            String(description)
          )}
        </p>


        <div class="stats">

          <div class="stat">

            <strong>
              ${allLessons.length}
            </strong>

            <span>
              Lessons
            </span>

          </div>


          <div class="stat">

            <strong>
              ${countVideoLessons()}
            </strong>

            <span>
              Video Lessons
            </span>

          </div>


          <div class="stat">

            <strong>
              Enrolled
            </strong>

            <span>
              Your Access
            </span>

          </div>

        </div>

      </div>

    </section>


    <section>

      <div class="section-title">

        <h2>
          Course Lessons
        </h2>

      </div>


      ${
        allLessons.length > 0
          ? `

            <div class="search-box">

              <i
                class="fa-solid fa-magnifying-glass"
              ></i>

              <input
                id="lessonSearch"
                type="search"
                placeholder="Search lessons..."
                autocomplete="off"
              >

            </div>


            <div
              class="lessons"
              id="lessonsContainer"
            >

              ${renderLessons(
                allLessons
              )}

            </div>

          `
          : `

            <div class="empty">

              <i
                class="fa-solid fa-book-open"
              ></i>

              <h2>
                No Lessons Yet
              </h2>

              <p>
                This course does not have
                any published lessons yet.
              </p>

            </div>

          `
      }

    </section>

  `;


  setupSearch();

}


/* =====================================================
   RENDER LESSONS
===================================================== */

function renderLessons(
  lessons
) {

  return lessons
    .map(
      (lesson, index) => {

        const title =
          lesson.title ||
          lesson.name ||
          `Lesson ${index + 1}`;


        const type =
          lesson.type ||
          "lesson";


        const description =
          lesson.description ||
          lesson.summary ||
          "";


        const duration =
          lesson.duration ||
          lesson.length ||
          "";


        const order =
          lesson.order ??
          lesson.lessonOrder ??
          lesson.position ??
          index + 1;


        const moduleId =
          lesson.moduleId ||
          lesson.moduleID ||
          lesson.module ||
          "";


        return `

          <article
            class="lesson-card"
          >

            <div class="lesson-number">

              ${index + 1}

            </div>


            <div class="lesson-icon">

              <i
                class="${getIcon(type)}"
              ></i>

            </div>


            <div class="lesson-info">

              <h3>

                ${escapeHTML(
                  String(title)
                )}

              </h3>


              ${
                description
                  ? `
                    <div
                      class="lesson-description"
                    >

                      ${escapeHTML(
                        String(
                          description
                        )
                      )}

                    </div>
                  `
                  : ""
              }


              <div class="lesson-meta">

                <span>

                  <i
                    class="fa-solid fa-file"
                  ></i>

                  ${escapeHTML(
                    formatText(type)
                  )}

                </span>


                ${
                  duration
                    ? `
                      <span>

                        <i
                          class="fa-regular fa-clock"
                        ></i>

                        ${escapeHTML(
                          String(duration)
                        )}

                      </span>
                    `
                    : ""
                }


                ${
                  moduleId
                    ? `
                      <span>

                        <i
                          class="fa-solid fa-layer-group"
                        ></i>

                        Module:
                        ${escapeHTML(
                          String(moduleId)
                        )}

                      </span>
                    `
                    : ""
                }


                <span>

                  <i
                    class="fa-solid fa-list-ol"
                  ></i>

                  ${escapeHTML(
                    String(order)
                  )}

                </span>

              </div>

            </div>


            <a
              class="open-btn"
              href="lesson-watch.html?id=${encodeURIComponent(
                lesson.id
              )}"
            >

              Open

              <i
                class="fa-solid fa-arrow-right"
              ></i>

            </a>

          </article>

        `;

      }
    )
    .join("");

}


/* =====================================================
   SEARCH
===================================================== */

function setupSearch() {

  const input =
    document.getElementById(
      "lessonSearch"
    );


  const container =
    document.getElementById(
      "lessonsContainer"
    );


  if (
    !input ||
    !container
  ) {

    return;

  }


  input.addEventListener(
    "input",
    () => {

      const search =
        input.value
          .trim()
          .toLowerCase();


      const filtered =
        allLessons.filter(
          lesson => {

            const title =
              String(
                lesson.title ||
                lesson.name ||
                ""
              ).toLowerCase();


            const description =
              String(
                lesson.description ||
                lesson.summary ||
                ""
              ).toLowerCase();


            const type =
              String(
                lesson.type ||
                ""
              ).toLowerCase();


            const module =
              String(
                lesson.moduleId ||
                lesson.moduleID ||
                lesson.module ||
                ""
              ).toLowerCase();


            return (
              title.includes(search) ||
              description.includes(search) ||
              type.includes(search) ||
              module.includes(search)
            );

          }
        );


      if (
        filtered.length === 0
      ) {

        container.innerHTML = `

          <div class="empty">

            <i
              class="fa-solid fa-magnifying-glass"
            ></i>

            <h2>
              No Lessons Found
            </h2>

            <p>
              Try another search term.
            </p>

          </div>

        `;

        return;

      }


      container.innerHTML =
        renderLessons(
          filtered
        );

    }
  );

}


/* =====================================================
   GET COURSE TITLE
===================================================== */

function getCourseTitle(
  course
) {

  return (
    course?.title ||
    course?.name ||
    course?.courseTitle ||
    "Untitled Course"
  );

}


/* =====================================================
   VIDEO COUNT
===================================================== */

function countVideoLessons() {

  return allLessons.filter(
    lesson =>
      String(
        lesson.type ||
        ""
      ).toLowerCase() ===
      "video"
  ).length;

}


/* =====================================================
   ICON
===================================================== */

function getIcon(
  type
) {

  const value =
    String(
      type || ""
    ).toLowerCase();


  switch (value) {

    case "video":
      return "fa-solid fa-circle-play";

    case "audio":
      return "fa-solid fa-headphones";

    case "pdf":
      return "fa-solid fa-file-pdf";

    case "text":
    case "article":
      return "fa-solid fa-file-lines";

    case "live":
      return "fa-solid fa-video";

    default:
      return "fa-solid fa-file";

  }

}


/* =====================================================
   FORMAT TEXT
===================================================== */

function formatText(
  value
) {

  if (!value) {

    return "";

  }


  return String(value)
    .replace(
      /[_-]+/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim()
    .replace(
      /\b\w/g,
      letter =>
        letter.toUpperCase()
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
