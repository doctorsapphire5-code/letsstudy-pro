<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lesson | LetsStudy Pro</title>

  <meta
    name="description"
    content="Watch your lesson video directly inside LetsStudy Pro."
  >

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Inter,Arial,sans-serif;
      background:#f5f7fb;
      color:#172033;
      line-height:1.6;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .header{
      height:70px;
      background:#fff;
      border-bottom:1px solid #e6eaf0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 28px;
      position:sticky;
      top:0;
      z-index:100;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      font-size:20px;
    }

    .brand-icon{
      width:40px;
      height:40px;
      border-radius:12px;
      background:#2563eb;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
    }

    .back-btn{
      padding:10px 16px;
      border:1px solid #dfe4ec;
      border-radius:10px;
      background:#fff;
      color:#374151;
      font-weight:600;
      cursor:pointer;
    }

    .back-btn:hover{
      background:#f3f6fa;
    }

    .container{
      width:min(1180px,94%);
      margin:32px auto 60px;
    }

    .breadcrumb{
      color:#64748b;
      font-size:14px;
      margin-bottom:18px;
    }

    .breadcrumb span{
      color:#2563eb;
      font-weight:600;
    }

    .video-card{
      background:#000;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 15px 40px rgba(15,23,42,.12);
      margin-bottom:28px;
    }

    .video-wrapper{
      width:100%;
      aspect-ratio:16/9;
      position:relative;
      background:#000;
    }

    video,
    iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
    }

    video{
      object-fit:contain;
      background:#000;
    }

    .video-placeholder{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:#fff;
      text-align:center;
      padding:30px;
    }

    .video-placeholder .icon{
      font-size:50px;
      margin-bottom:12px;
    }

    .video-placeholder h3{
      font-size:20px;
      margin-bottom:6px;
    }

    .video-placeholder p{
      color:#cbd5e1;
      max-width:600px;
    }

    .content-grid{
      display:grid;
      grid-template-columns:1fr 320px;
      gap:24px;
    }

    .main-card,
    .side-card{
      background:#fff;
      border:1px solid #e6eaf0;
      border-radius:16px;
      padding:25px;
    }

    .badges{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:14px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      background:#eff6ff;
      color:#2563eb;
      font-size:12px;
      font-weight:700;
    }

    .badge.success{
      background:#ecfdf5;
      color:#059669;
    }

    .badge.dark{
      background:#f1f5f9;
      color:#475569;
    }

    .title{
      font-size:30px;
      line-height:1.25;
      margin-bottom:14px;
      color:#111827;
    }

    .description{
      color:#64748b;
      font-size:16px;
      white-space:pre-line;
    }

    .info-list{
      display:grid;
      gap:14px;
    }

    .info-item{
      display:flex;
      align-items:flex-start;
      gap:12px;
      padding-bottom:13px;
      border-bottom:1px solid #edf0f4;
    }

    .info-item:last-child{
      border-bottom:0;
      padding-bottom:0;
    }

    .info-icon{
      width:36px;
      height:36px;
      border-radius:10px;
      background:#eff6ff;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .info-label{
      color:#94a3b8;
      font-size:12px;
      font-weight:600;
    }

    .info-value{
      color:#1e293b;
      font-size:14px;
      font-weight:700;
      word-break:break-word;
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:18px;
    }

    .tag{
      padding:6px 10px;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      border-radius:8px;
      color:#475569;
      font-size:12px;
    }

    .loading{
      min-height:300px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#64748b;
      font-weight:600;
    }

    .error{
      background:#fff;
      border:1px solid #fecaca;
      color:#b91c1c;
      border-radius:14px;
      padding:20px;
      text-align:center;
    }

    .error h2{
      margin-bottom:8px;
    }

    .share-btn{
      width:100%;
      border:0;
      background:#2563eb;
      color:#fff;
      padding:13px 16px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      margin-top:20px;
    }

    .share-btn:hover{
      background:#1d4ed8;
    }

    .channel{
      display:flex;
      align-items:center;
      gap:12px;
      margin-top:22px;
      padding-top:20px;
      border-top:1px solid #edf0f4;
    }

    .channel-img{
      width:46px;
      height:46px;
      border-radius:50%;
      object-fit:cover;
      background:#e2e8f0;
    }

    .channel-name{
      font-weight:800;
      color:#1e293b;
    }

    .channel-handle{
      color:#94a3b8;
      font-size:13px;
    }

    @media(max-width:850px){
      .content-grid{
        grid-template-columns:1fr;
      }

      .title{
        font-size:25px;
      }
    }

    @media(max-width:600px){
      .header{
        padding:0 15px;
        height:62px;
      }

      .brand{
        font-size:17px;
      }

      .brand-icon{
        width:35px;
        height:35px;
      }

      .back-btn{
        padding:8px 11px;
        font-size:13px;
      }

      .container{
        width:96%;
        margin-top:20px;
      }

      .video-card{
        border-radius:12px;
      }

      .main-card,
      .side-card{
        padding:18px;
        border-radius:13px;
      }

      .title{
        font-size:22px;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <a href="index.html" class="brand">
    <div class="brand-icon">🎓</div>
    <span>LetsStudy Pro</span>
  </a>

  <button class="back-btn" onclick="goBack()">
    ← Back
  </button>

</header>


<main class="container">

  <div class="breadcrumb">
    Home / Courses / <span id="breadcrumbTitle">Lesson</span>
  </div>

  <div id="pageContent">

    <div class="loading">
      Loading lesson...
    </div>

  </div>

</main>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =====================================================
     FIREBASE
  ===================================================== */

  const firebaseConfig = {

    apiKey: "AIzaSyBcOyDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"

  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  /* =====================================================
     HELPERS
  ===================================================== */

  const params = new URLSearchParams(
    window.location.search
  );

  const lessonId =
    params.get("id") ||
    params.get("lessonId");


  function safe(value){

    if(value === undefined ||
       value === null){

      return "";
    }

    return String(value).trim();

  }


  function escapeHtml(value){

    return safe(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  function formatDate(value){

    if(!value){
      return "—";
    }

    try{

      let date;

      if(
        typeof value === "object" &&
        typeof value.toDate === "function"
      ){

        date = value.toDate();

      }else{

        date = new Date(value);

      }

      if(isNaN(date.getTime())){
        return safe(value);
      }

      return date.toLocaleDateString(
        undefined,
        {
          year:"numeric",
          month:"short",
          day:"numeric"
        }
      );

    }catch(error){

      return safe(value);

    }

  }


  /* =====================================================
     VIDEO URL DETECTION
  ===================================================== */

  function getYouTubeId(url){

    try{

      const parsed = new URL(url);

      const host =
        parsed.hostname
          .replace("www.","")
          .replace("m.","");

      if(host === "youtube.com"){

        if(parsed.pathname === "/watch"){

          return parsed.searchParams.get("v");

        }

        if(parsed.pathname.startsWith("/shorts/")){

          return parsed.pathname
            .split("/shorts/")[1]
            .split("/")[0];

        }

        if(parsed.pathname.startsWith("/embed/")){

          return parsed.pathname
            .split("/embed/")[1]
            .split("/")[0];

        }

      }

      if(host === "youtu.be"){

        return parsed.pathname
          .replace("/","")
          .split("/")[0];

      }

    }catch(error){

      console.error(error);

    }

    return null;

  }


  function getVimeoId(url){

    try{

      const parsed = new URL(url);

      if(
        parsed.hostname.includes("vimeo.com")
      ){

        const parts =
          parsed.pathname
            .split("/")
            .filter(Boolean);

        const id =
          parts.find(part =>
            /^\d+$/.test(part)
          );

        return id || null;

      }

    }catch(error){

      console.error(error);

    }

    return null;

  }


  function isDirectVideo(url){

    const lower =
      safe(url).toLowerCase();

    return (
      lower.includes(".mp4") ||
      lower.includes(".webm") ||
      lower.includes(".ogg") ||
      lower.includes(".m4v") ||
      lower.includes(".mov")
    );

  }


  /* =====================================================
     CREATE VIDEO PLAYER
  ===================================================== */

  function createPlayer(videoUrl, thumbnail){

    const url = safe(videoUrl);

    if(!url){

      return `

        <div class="video-placeholder">

          <div class="icon">🎬</div>

          <h3>Video unavailable</h3>

          <p>
            This lesson does not have a video link yet.
          </p>

        </div>

      `;

    }


    /* DIRECT VIDEO */

    if(isDirectVideo(url)){

      return `

        <video
          controls
          playsinline
          preload="metadata"
          ${thumbnail
            ? `poster="${escapeHtml(thumbnail)}"`
            : ""
          }
        >

          <source
            src="${escapeHtml(url)}"
            type="video/mp4"
          >

          Your browser does not support
          HTML5 video.

        </video>

      `;

    }


    /* YOUTUBE */

    const youtubeId =
      getYouTubeId(url);

    if(youtubeId){

      return `

        <iframe

          src="https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}"

          title="Lesson video"

          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share
          "

          allowfullscreen>

        </iframe>

      `;

    }


    /* VIMEO */

    const vimeoId =
      getVimeoId(url);

    if(vimeoId){

      return `

        <iframe

          src="https://player.vimeo.com/video/${encodeURIComponent(vimeoId)}"

          title="Lesson video"

          allow="
            autoplay;
            fullscreen;
            picture-in-picture
          "

          allowfullscreen>

        </iframe>

      `;

    }


    /* OTHER DIRECT URL */

    return `

      <video
        controls
        playsinline
        preload="metadata"
        ${thumbnail
          ? `poster="${escapeHtml(thumbnail)}"`
          : ""
        }
      >

        <source
          src="${escapeHtml(url)}"
        >

        Your browser does not support
        HTML5 video.

      </video>

    `;

  }


  /* =====================================================
     LOAD LESSON
  ===================================================== */

  async function loadLesson(){

    const page =
      document.getElementById("pageContent");


    if(!lessonId){

      page.innerHTML = `

        <div class="error">

          <h2>Lesson not found</h2>

          <p>
            No lesson ID was provided.
          </p>

        </div>

      `;

      return;

    }


    try{

      const lessonRef =
        doc(db,"lessons",lessonId);

      const lessonSnap =
        await getDoc(lessonRef);


      if(!lessonSnap.exists()){

        page.innerHTML = `

          <div class="error">

            <h2>Lesson not found</h2>

            <p>
              The requested lesson does not exist.
            </p>

          </div>

        `;

        return;

      }


      const lesson =
        lessonSnap.data();


      renderLesson(
        lessonSnap.id,
        lesson
      );


    }catch(error){

      console.error(
        "Lesson loading error:",
        error
      );


      page.innerHTML = `

        <div class="error">

          <h2>Unable to load lesson</h2>

          <p>
            ${escapeHtml(error.message)}
          </p>

        </div>

      `;

    }

  }


  /* =====================================================
     RENDER LESSON
  ===================================================== */

  function renderLesson(id,lesson){

    const title =
      safe(lesson.title) ||
      "Untitled Lesson";

    const description =
      safe(lesson.description) ||
      "No description available.";

    const contentUrl =
      safe(lesson.contentUrl);

    const thumbnail =
      safe(
        lesson.thumbnail ||
        lesson.image ||
        ""
      );

    const type =
      safe(lesson.type) ||
      "Video";

    const duration =
      safe(lesson.duration) ||
      "—";

    const order =
      safe(lesson.order) ||
      "—";

    const status =
      safe(lesson.status) ||
      "published";

    const courseId =
      safe(lesson.courseId) ||
      "—";

    const moduleId =
      safe(lesson.moduleId) ||
      "—";

    const createdBy =
      safe(lesson.createdBy) ||
      "—";


    document.title =
      title + " | LetsStudy Pro";


    document.getElementById(
      "breadcrumbTitle"
    ).textContent = title;


    document.getElementById(
      "pageContent"
    ).innerHTML = `

      <!-- VIDEO -->

      <div class="video-card">

        <div class="video-wrapper">

          ${createPlayer(
            contentUrl,
            thumbnail
          )}

        </div>

      </div>


      <!-- CONTENT -->

      <div class="content-grid">


        <!-- MAIN -->

        <section class="main-card">

          <div class="badges">

            <span class="badge">
              ${escapeHtml(type)}
            </span>

            <span class="badge success">
              ${escapeHtml(status)}
            </span>

            ${
              duration !== "—"
              ?
              `
              <span class="badge dark">
                ⏱ ${escapeHtml(duration)}
              </span>
              `
              :
              ""
            }

          </div>


          <h1 class="title">

            ${escapeHtml(title)}

          </h1>


          <p class="description">

            ${escapeHtml(description)}

          </p>


          ${
            createdBy !== "—"
            ?
            `
            <div class="channel">

              <div class="channel-img">
                👨‍🏫
              </div>

              <div>

                <div class="channel-name">

                  ${escapeHtml(createdBy)}

                </div>

                <div class="channel-handle">

                  Lesson instructor

                </div>

              </div>

            </div>
            `
            :
            ""
          }


          ${
            contentUrl
            ?
            `
            <button
              class="share-btn"
              id="shareBtn"
            >
              🔗 Share Lesson
            </button>
            `
            :
            ""
          }

        </section>


        <!-- SIDEBAR -->

        <aside class="side-card">

          <h3 style="margin-bottom:18px;">
            Lesson Information
          </h3>


          <div class="info-list">


            <div class="info-item">

              <div class="info-icon">
                📚
              </div>

              <div>

                <div class="info-label">
                  Course ID
                </div>

                <div class="info-value">
                  ${escapeHtml(courseId)}
                </div>

              </div>

            </div>


            <div class="info-item">

              <div class="info-icon">
                📦
              </div>

              <div>

                <div class="info-label">
                  Module ID
                </div>

                <div class="info-value">
                  ${escapeHtml(moduleId)}
                </div>

              </div>

            </div>


            <div class="info-item">

              <div class="info-icon">
                🔢
              </div>

              <div>

                <div class="info-label">
                  Lesson Order
                </div>

                <div class="info-value">
                  ${escapeHtml(order)}
                </div>

              </div>

            </div>


            <div class="info-item">

              <div class="info-icon">
                🎬
              </div>

              <div>

                <div class="info-label">
                  Type
                </div>

                <div class="info-value">
                  ${escapeHtml(type)}
                </div>

              </div>

            </div>


            <div class="info-item">

              <div class="info-icon">
                ⏱
              </div>

              <div>

                <div class="info-label">
                  Duration
                </div>

                <div class="info-value">
                  ${escapeHtml(duration)}
                </div>

              </div>

            </div>


            <div class="info-item">

              <div class="info-icon">
                📅
              </div>

              <div>

                <div class="info-label">
                  Created
                </div>

                <div class="info-value">
                  ${formatDate(lesson.createdAt)}
                </div>

              </div>

            </div>


            <div class="info-item">

              <div class="info-icon">
                🟢
              </div>

              <div>

                <div class="info-label">
                  Status
                </div>

                                <div class="info-value">
                  ${escapeHtml(status)}
                </div>

              </div>

            </div>


          </div>


          ${
            contentUrl
            ?
            `
            <div style="
              margin-top:22px;
              padding:14px;
              background:#f8fafc;
              border-radius:10px;
              font-size:12px;
              color:#64748b;
              word-break:break-all;
            ">

              <strong>Video source</strong><br><br>

              ${escapeHtml(contentUrl)}

            </div>
            `
            :
            ""
          }

        </aside>

      </div>

    `;


    const shareBtn =
      document.getElementById(
        "shareBtn"
      );


    if(shareBtn){

      shareBtn.addEventListener(
        "click",
        async () => {

          const shareData = {

            title: title,

            text:
              "Watch this lesson on LetsStudy Pro",

            url:
              window.location.href

          };


          try{

            if(
              navigator.share
            ){

              await navigator.share(
                shareData
              );

            }else{

              await navigator.clipboard.writeText(
                window.location.href
              );

              alert(
                "Lesson link copied!"
              );

            }

          }catch(error){

            console.log(
              "Share cancelled:",
              error
            );

          }

        }
      );

    }

  }


  /* =====================================================
     BACK BUTTON
  ===================================================== */

  window.goBack = function(){

    if(
      document.referrer &&
      document.referrer !== window.location.href
    ){

      history.back();

    }else{

      window.location.href =
        "course-lessons.html";

    }

  };


  /* =====================================================
     START
  ===================================================== */

  loadLesson();

</script>

</body>
</html>
