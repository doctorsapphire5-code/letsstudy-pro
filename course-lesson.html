<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Course Lessons | LetsStudy Pro</title>

<meta
  name="description"
  content="Access LetsStudy Pro courses and lessons."
>

<meta
  name="robots"
  content="noindex,nofollow"
>

<link rel="icon" href="favicon.ico">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
  min-height:100vh;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:100;
}

.navbar{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:14px;
}

.back-btn{
  border:0;
  background:#eef2ff;
  color:#3730a3;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

.back-btn:hover{
  background:#e0e7ff;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.brand span{
  color:#4f46e5;
}

main{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 50px;
}

/* COURSE SELECTOR */

.course-selector{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.course-selector label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

.course-selector select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  background:#fff;
  font-size:15px;
  outline:none;
}

.course-selector select:focus{
  border-color:#6366f1;
}

/* HERO */

.hero{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #e5e7eb;
  margin-bottom:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.hero-image{
  width:100%;
  height:280px;
  object-fit:cover;
  background:#e5e7eb;
  display:block;
}

.hero-body{
  padding:25px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#eef2ff;
  color:#3730a3;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.hero h1{
  font-size:32px;
  margin-bottom:12px;
  line-height:1.25;
}

.hero-description{
  color:#667085;
  line-height:1.7;
  margin-bottom:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#f8fafc;
  border-radius:12px;
  padding:15px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.stat span{
  font-size:13px;
  color:#667085;
}

/* SECTION */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.section-title h2{
  font-size:24px;
}

/* SEARCH */

.search-box{
  position:relative;
  margin-bottom:18px;
}

.search-box i{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#98a2b3;
}

.search-box input{
  width:100%;
  padding:14px 15px 14px 45px;
  border:1px solid #d1d5db;
  border-radius:12px;
  outline:none;
  font-size:15px;
  background:#fff;
}

.search-box input:focus{
  border-color:#6366f1;
}

/* LESSONS */

.lessons{
  display:grid;
  gap:12px;
}

.lesson-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:16px;
  transition:.2s;
}

.lesson-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.lesson-number{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:12px;
  background:#eef2ff;
  color:#4338ca;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.lesson-icon{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:11px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#475467;
}

.lesson-info{
  flex:1;
  min-width:0;
}

.lesson-info h3{
  font-size:17px;
  margin-bottom:6px;
  word-break:break-word;
}

.lesson-description{
  color:#667085;
  font-size:14px;
  line-height:1.5;
}

.lesson-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:8px;
}

.lesson-meta span{
  font-size:12px;
  color:#667085;
}

.open-btn{
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:7px;
}

.open-btn:hover{
  background:#4338ca;
}

/* LOADING */

.loading{
  text-align:center;
  padding:60px 20px;
  color:#667085;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #e5e7eb;
  border-top-color:#4f46e5;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* EMPTY */

.empty{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  text-align:center;
  padding:60px 20px;
  color:#667085;
}

.empty i{
  font-size:45px;
  margin-bottom:15px;
  color:#98a2b3;
}

.empty h2{
  color:#172033;
  margin-bottom:8px;
}

/* ERROR */

.error{
  background:#fff;
  border:1px solid #fecaca;
  border-radius:16px;
  padding:45px 20px;
  text-align:center;
}

.error i{
  color:#dc2626;
  font-size:45px;
  margin-bottom:15px;
}

.error h2{
  margin-bottom:10px;
}

.error p{
  color:#667085;
  margin-bottom:20px;
  line-height:1.6;
}

.retry-btn{
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:11px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

/* FOOTER */

footer{
  text-align:center;
  color:#667085;
  font-size:13px;
  padding:30px 20px;
}

/* MOBILE */

@media(max-width:700px){

  main{
    padding:18px 12px 40px;
  }

  .navbar{
    padding:12px;
  }

  .brand{
    font-size:17px;
  }

  .hero-image{
    height:190px;
  }

  .hero-body{
    padding:18px;
  }

  .hero h1{
    font-size:25px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .lesson-card{
    align-items:flex-start;
  }

  .lesson-number{
    display:none;
  }

  .lesson-icon{
    width:40px;
    min-width:40px;
  }

  .open-btn{
    padding:9px 11px;
    font-size:13px;
  }

}

</style>

</head>


<body>

<header>

  <div class="navbar">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >
      <i class="fa-solid fa-arrow-left"></i>
      Back
    </button>

    <div class="brand">
      LetsStudy <span>Pro</span>
    </div>

  </div>

</header>


<main>

  <div
    class="course-selector"
    id="courseSelector"
    style="display:none;"
  >

    <label for="courseSelect">
      Courses
    </label>

    <select id="courseSelect">
      <option value="">
        Loading courses...
      </option>
    </select>

  </div>


  <div id="pageContent">

    <div class="loading">

      <div class="spinner"></div>

      <p>
        Loading courses...
      </p>

    </div>

  </div>

</main>


<footer>

  © 2026 LetsStudy Pro ·
  Learn. Build. Work. Grow.

</footer>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  query,
  where
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRg0rj0odBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const pageContent =
  document.getElementById(
    "pageContent"
  );


const courseSelector =
  document.getElementById(
    "courseSelector"
  );


const courseSelect =
  document.getElementById(
    "courseSelect"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );


/* =====================================================
   STATE
===================================================== */

let allCourses = [];

let enrolledCourses = [];

let currentCourseId = "";

let currentCourse = null;

let allLessons = [];

let filteredLessons = [];


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const urlCourseId = (
  params.get("courseId") ||
  params.get("courseID") ||
  params.get("id") ||
  params.get("course") ||
  ""
).trim();


/* =====================================================
   BACK BUTTON
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if (
      window.history.length > 1
    ) {

      window.history.back();

    } else {

      window.location.href =
        "courses.html";

    }

  }
);


/* =====================================================
   START
===================================================== */

loadCourses();


/* =====================================================
   LOAD COURSES
===================================================== */

async function loadCourses(){

  try{

    pageContent.innerHTML = `

      <div class="loading">

        <div class="spinner"></div>

        <p>
          Loading courses...
        </p>

      </div>

    `;


    const snapshot =
      await getDocs(
        collection(
          db,
          "courses"
        )
      );


    allCourses =
      snapshot.docs.map(
        courseDoc => ({

          id:
            courseDoc.id,

          ...courseDoc.data()

        })
      );


    /*
      Only hide clearly inactive courses.
      Empty status remains visible.
    */

    allCourses =
      allCourses.filter(
        course => {

          const status =
            String(
              course.status ||
              ""
            ).toLowerCase();

          return (
            status === "" ||
            status === "published" ||
            status === "active" ||
            status === "available"
          );

        }
      );


    if(
      allCourses.length === 0
    ){

      showNoCourses();

      return;

    }


    /*
      URL course selection.
    */

    const requestedCourse =
      allCourses.find(
        course =>
          course.id ===
          urlCourseId
      );


    if(
      requestedCourse
    ){

      currentCourseId =
        requestedCourse.id;

    }else{

      currentCourseId =
        allCourses[0].id;

    }


    /*
      Keep the variable name for compatibility
      with existing page logic.
    */

    enrolledCourses =
      allCourses;


    renderCourseSelector();

    await loadSelectedCourse();


  }catch(error){

    console.error(
      "Courses error:",
      error
    );


    showError(
      "Unable to load courses from Firebase."
    );

  }

}


/* =====================================================
   COURSE SELECTOR
===================================================== */

function renderCourseSelector(){

  if(
    allCourses.length <= 1
  ){

    courseSelector.style.display =
      "none";

    return;

  }


  courseSelector.style.display =
    "block";


  courseSelect.innerHTML =
    allCourses.map(
      course => {

        const title =
          getCourseTitle(
            course
          );


        return `

          <option
            value="${escapeHTML(
              course.id
            )}"
            ${
              course.id ===
              currentCourseId
                ? "selected"
                : ""
            }
          >
            ${escapeHTML(title)}
          </option>

        `;

      }
    ).join("");

}


/* =====================================================
   COURSE CHANGE
===================================================== */

courseSelect.addEventListener(
  "change",
  async event => {

    const id =
      event.target.value;


    if(!id){
      return;
    }


    const exists =
      allCourses.some(
        course =>
          course.id === id
      );


    if(!exists){
      return;
    }


    currentCourseId =
      id;


    const newUrl =
      new URL(
        window.location.href
      );


    newUrl.searchParams.set(
      "courseId",
      id
    );


    window.history.replaceState(
      {},
      "",
      newUrl
    );


    await loadSelectedCourse();

  }
);


/* =====================================================
   LOAD SELECTED COURSE
===================================================== */

async function loadSelectedCourse(){

  const course =
    allCourses.find(
      item =>
        item.id ===
        currentCourseId
    );


  if(!course){

    showError(
      "Course not found."
    );

    return;

  }


  currentCourse = course;


  pageContent.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      <p>
        Loading course lessons...
      </p>

    </div>

  `;


  try{

    await loadLessons();

    renderCourse();


  }catch(error){

    console.error(
      "Selected course error:",
      error
    );


    showError(
      "Unable to load this course."
    );

  }

}


/* =====================================================
   LOAD LESSONS
===================================================== */

async function loadLessons(){

  allLessons = [];


  /*
    Primary schema:
    lessons.courseId
  */

  try{

    const lessonsQuery =
      query(
        collection(
          db,
          "lessons"
        ),
        where(
          "courseId",
          "==",
          currentCourseId
        )
      );


    const snapshot =
      await getDocs(
        lessonsQuery
      );


    allLessons =
      snapshot.docs.map(
        lessonDoc => ({

          id:
            lessonDoc.id,

          ...lessonDoc.data()

        })
      );


  }catch(error){

    console.warn(
      "courseId query failed:",
      error
    );


    /*
      Fallback for:
      courseID / course
    */

    try{

      const snapshot =
        await getDocs(
          collection(
            db,
            "lessons"
          )
        );


      allLessons =
        snapshot.docs
          .map(
            lessonDoc => ({

              id:
                lessonDoc.id,

              ...lessonDoc.data()

            })
          )
          .filter(
            lesson => {

              const lessonCourse =
                lesson.courseId ||
                lesson.courseID ||
                lesson.course ||
                "";


              return String(
                lessonCourse
              ) === String(
                currentCourseId
              );

            }
          );


    }catch(fallbackError){

      console.error(
        "Lesson fallback error:",
        fallbackError
      );


      allLessons = [];

    }

  }


  /*
    Public lesson states.
  */

  allLessons =
    allLessons.filter(
      lesson => {

        const status =
          String(
            lesson.status ||
            ""
          ).toLowerCase();


        return (
          status === "" ||
          status === "published" ||
          status === "active"
        );

      }
    );


  /*
    Sort lessons.
  */

  allLessons.sort(
    (a,b) => {

      const moduleA =
        Number(
          a.moduleOrder ??
          a.modulePosition ??
          0
        );


      const moduleB =
        Number(
          b.moduleOrder ??
          b.modulePosition ??
          0
        );


      if(
        moduleA !==
        moduleB
      ){

        return moduleA -
          moduleB;

      }


      const orderA =
        Number(
          a.order ??
          a.lessonOrder ??
          a.position ??
          0
        );


      const orderB =
        Number(
          b.order ??
          b.lessonOrder ??
          b.position ??
          0
        );


      return orderA -
        orderB;

    }
  );

}


/* =====================================================
   RENDER COURSE
===================================================== */

function renderCourse(){

  const title =
    getCourseTitle(
      currentCourse
    );


  const description =
    getCourseDescription(
      currentCourse
    );


  const image =
    getCourseImage(
      currentCourse
    );


  const instructor =
    currentCourse.instructor ||
    currentCourse.teacher ||
    currentCourse.author ||
    "";


  const category =
    currentCourse.category ||
    currentCourse.subject ||
    "Course";


  const level =
    currentCourse.level ||
    currentCourse.difficulty ||
    "";


  const courseType =
    currentCourse.type ||
    currentCourse.courseType ||
    "";


  const videoLessons =
    allLessons.filter(
      lesson =>
        String(
          lesson.type ||
          lesson.lessonType ||
          ""
        ).toLowerCase()
        === "video"
    ).length;


  const moduleCount =
    new Set(
      allLessons
        .map(
          lesson =>
            lesson.moduleId ||
            lesson.moduleID ||
            lesson.module ||
            lesson.moduleOrder ||
            ""
        )
        .filter(Boolean)
        .map(String)
    ).size;


  pageContent.innerHTML = `

    <section class="hero">

      ${
        image
          ? `
            <img
              class="hero-image"
              src="${safeUrl(image)}"
              alt="${escapeHTML(title)}"
              onerror="this.style.display='none';"
            >
          `
          : ""
      }


      <div class="hero-body">

        <div class="badges">

          <span class="badge">

            <i class="fa-solid fa-book-open"></i>

            ${escapeHTML(category)}

          </span>


          ${
            level
              ? `
                <span class="badge">

                  <i class="fa-solid fa-layer-group"></i>

                  ${escapeHTML(level)}

                </span>
              `
              : ""
          }


          ${
            courseType
              ? `
                <span class="badge">

                  <i class="fa-solid fa-tag"></i>

                  ${escapeHTML(courseType)}

                </span>
              `
              : ""
          }

        </div>


        <h1>
          ${escapeHTML(title)}
        </h1>


        ${
          description
            ? `
              <div class="hero-description">
                ${formatText(description)}
              </div>
            `
            : ""
        }


        ${
          instructor
            ? `
              <div class="hero-description">

                <strong>
                  Instructor:
                </strong>

                ${escapeHTML(
                  String(instructor)
                )}

              </div>
            `
            : ""
        }


        <div class="stats">

          <div class="stat">

            <strong>
              ${allLessons.length}
            </strong>

            <span>
              Lessons
            </span>

          </div>


          <div class="stat">

            <strong>
  ${videoLessons}
</strong>

<span>
  Video Lessons
</span>

</div>


<div class="stat">

  <strong>
    ${moduleCount}
  </strong>

  <span>
    Modules
  </span>

</div>

</div>

</div>

</section>


<section>

  <div class="section-title">

    <h2>
      Course Lessons
    </h2>

    <span id="lessonCount">
      ${allLessons.length}
    </span>

  </div>


  <div class="search-box">

    <i class="fa-solid fa-search"></i>

    <input
      id="lessonSearch"
      type="search"
      placeholder="Search lessons..."
      autocomplete="off"
    >

  </div>


  <div
    class="lessons"
    id="lessonsList"
  ></div>

</section>

`;


  filteredLessons =
    [...allLessons];


  renderLessons(
    filteredLessons
  );


  const searchInput =
    document.getElementById(
      "lessonSearch"
    );


  if(searchInput){

    searchInput.addEventListener(
      "input",
      event => {

        const term =
          String(
            event.target.value || ""
          )
          .trim()
          .toLowerCase();


        if(!term){

          filteredLessons =
            [...allLessons];

        }else{

          filteredLessons =
            allLessons.filter(
              lesson => {

                const searchableText = [

                  lesson.title,

                  lesson.name,

                  lesson.lessonTitle,

                  lesson.description,

                  lesson.summary,

                  lesson.type,

                  lesson.lessonType,

                  lesson.moduleId,

                  lesson.moduleID,

                  lesson.module,

                  lesson.duration

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return searchableText.includes(
                  term
                );

              }
            );

        }


        const count =
          document.getElementById(
            "lessonCount"
          );


        if(count){

          count.textContent =
            filteredLessons.length;

        }


        renderLessons(
          filteredLessons
        );

      }
    );

  }

}


/* =====================================================
   RENDER LESSONS
===================================================== */

function renderLessons(
  lessons
){

  const list =
    document.getElementById(
      "lessonsList"
    );


  if(!list){

    return;

  }


  if(
    lessons.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-book-open"></i>

        <h2>
          No Lessons Found
        </h2>

        <p>
          No lessons match your search.
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML =
    lessons.map(
      (lesson,index) => {

        const title =
          lesson.title ||
          lesson.name ||
          lesson.lessonTitle ||
          `Lesson ${index + 1}`;


        const description =
          lesson.description ||
          lesson.summary ||
          "";


        const type =
          lesson.type ||
          lesson.lessonType ||
          "lesson";


        const duration =
          lesson.duration ||
          lesson.length ||
          "";


        const module =
          lesson.moduleId ||
          lesson.moduleID ||
          lesson.module ||
          "";


        const order =
          lesson.order ??
          lesson.lessonOrder ??
          lesson.position ??
          index + 1;


        const icon =
          getLessonIcon(
            type
          );


        return `

          <article
            class="lesson-card"
          >

            <div
              class="lesson-number"
            >

              ${index + 1}

            </div>


            <div
              class="lesson-icon"
            >

              <i
                class="${icon}"
              ></i>

            </div>


            <div
              class="lesson-info"
            >

              <h3>

                ${escapeHTML(
                  String(title)
                )}

              </h3>


              ${
                description
                  ? `

                    <div
                      class="lesson-description"
                    >

                      ${escapeHTML(
                        String(description)
                      )}

                    </div>

                  `
                  : ""
              }


              <div
                class="lesson-meta"
              >

                <span>

                  <i
                    class="fa-solid fa-file-lines"
                  ></i>

                  ${escapeHTML(
                    String(type)
                  )}

                </span>


                ${
                  module
                    ? `

                      <span>

                        <i
                          class="fa-solid fa-layer-group"
                        ></i>

                        Module
                        ${escapeHTML(
                          String(module)
                        )}

                      </span>

                    `
                    : ""
                }


                ${
                  duration
                    ? `

                      <span>

                        <i
                          class="fa-regular fa-clock"
                        ></i>

                        ${escapeHTML(
                          String(duration)
                        )}

                      </span>

                    `
                    : ""
                }


                <span>

                  <i
                    class="fa-solid fa-list-ol"
                  ></i>

                  Lesson
                  ${escapeHTML(
                    String(order)
                  )}

                </span>

              </div>

            </div>


            <a
              class="open-btn"
              href="lesson-watch.html?id=${encodeURIComponent(
                lesson.id
              )}"
            >

              Open

              <i
                class="fa-solid fa-arrow-right"
              ></i>

            </a>

          </article>

        `;

      }
    )
    .join("");

}


/* =====================================================
   COURSE TITLE
===================================================== */

function getCourseTitle(
  course
){

  return (

    course.title ||

    course.name ||

    course.courseTitle ||

    course.courseName ||

    "Untitled Course"

  );

}


/* =====================================================
   COURSE DESCRIPTION
===================================================== */

function getCourseDescription(
  course
){

  return (

    course.description ||

    course.summary ||

    course.details ||

    course.about ||

    ""

  );

}


/* =====================================================
   COURSE IMAGE
===================================================== */

function getCourseImage(
  course
){

  return (

    course.imageUrl ||

    course.thumbnail ||

    course.thumbnailUrl ||

    course.coverImage ||

    course.coverUrl ||

    course.image ||

    ""

  );

}


/* =====================================================
   LESSON ICON
===================================================== */

function getLessonIcon(
  type
){

  const value =
    String(
      type || ""
    )
    .toLowerCase();


  if(
    value.includes("video")
  ){

    return "fa-solid fa-circle-play";

  }


  if(
    value.includes("audio")
  ){

    return "fa-solid fa-headphones";

  }


  if(
    value.includes("pdf")
  ){

    return "fa-solid fa-file-pdf";

  }


  if(
    value.includes("text") ||
    value.includes("article")
  ){

    return "fa-solid fa-file-lines";

  }


  if(
    value.includes("live")
  ){

    return "fa-solid fa-tower-broadcast";

  }


  if(
    value.includes("quiz")
  ){

    return "fa-solid fa-circle-question";

  }


  if(
    value.includes("assignment")
  ){

    return "fa-solid fa-pen-to-square";

  }


  return "fa-solid fa-book-open";

}

/* =====================================================
   ERROR
===================================================== */

function showError(
  message
){

  pageContent.innerHTML = `

    <div class="error">

      <i
        class="fa-solid fa-triangle-exclamation"
      ></i>

      <h2>
        Something Went Wrong
      </h2>

      <p>
        ${escapeHTML(
          String(message)
        )}
      </p>

      <button

        type="button"
        onclick="location.reload()"
      >

        Try Again

      </button>

    </div>

  `;

}


/* =====================================================
   TEXT FORMAT
===================================================== */

function formatText(
  text
){

  return escapeHTML(
    String(text ?? "")
  )
  .replace(
    /\n/g,
    "<br>"
  );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   SAFE URL
===================================================== */

function safeUrl(
  value
){

  try{

    const url =
      new URL(
        String(value),
        window.location.href
      );


    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return escapeHTML(
        url.href
      );

    }


    return "";

  }catch{

    return "";

  }

}
