<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Course Lessons | LetsStudy Pro</title>

<meta
  name="description"
  content="Learn from your selected LetsStudy Pro course."
>

<meta
  name="robots"
  content="index,follow"
>

<link
  rel="icon"
  href="favicon.ico"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  background: #f5f7fb;
  color: #172033;
}


/* =====================================================
   HEADER
===================================================== */

header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo {
  text-decoration: none;
  font-size: 21px;
  font-weight: 800;
  color: #111827;
}

.logo span {
  color: #2563eb;
}

.back-btn {
  border: 0;
  background: #eff6ff;
  color: #1d4ed8;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
}

.back-btn:hover {
  background: #dbeafe;
}


/* =====================================================
   PAGE
===================================================== */

.container {
  max-width: 1200px;
  margin: auto;
  padding: 25px 20px 60px;
}


/* =====================================================
   COURSE HERO
===================================================== */

.course-hero {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 360px 1fr;
  margin-bottom: 25px;
  box-shadow:
    0 10px 30px rgba(0,0,0,.05);
}

.course-image-wrapper {
  min-height: 260px;
  background: #e5e7eb;
}

.course-image {
  width: 100%;
  height: 100%;
  min-height: 260px;
  object-fit: cover;
  display: block;
}

.course-info {
  padding: 30px;
}

.course-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: #eff6ff;
  color: #2563eb;
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
}

.course-title {
  margin: 14px 0 10px;
  font-size: clamp(28px, 5vw, 42px);
  line-height: 1.15;
}

.course-description {
  color: #667085;
  line-height: 1.7;
  margin: 0 0 18px;
}

.course-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.course-meta span {
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  padding: 8px 12px;
  border-radius: 999px;
  color: #475467;
  font-size: 14px;
}

.course-price {
  margin-top: 18px;
  font-size: 21px;
  font-weight: 800;
  color: #16a34a;
}


/* =====================================================
   SECTION HEADER
===================================================== */

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin: 25px 0 15px;
}

.section-title {
  margin: 0;
  font-size: 25px;
}

.section-subtitle {
  margin: 5px 0 0;
  color: #667085;
}


/* =====================================================
   STATS
===================================================== */

.stats {
  display: grid;
  grid-template-columns:
    repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}

.stat {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 15px;
  padding: 18px;
}

.stat-icon {
  color: #2563eb;
  font-size: 20px;
  margin-bottom: 8px;
}

.stat-number {
  font-size: 25px;
  font-weight: 800;
}

.stat-label {
  color: #667085;
  font-size: 14px;
  margin-top: 4px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box {
  margin-bottom: 20px;
  position: relative;
}

.search-box i {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #98a2b3;
}

.search-box input {
  width: 100%;
  padding: 14px 15px 14px 45px;
  border: 1px solid #d0d5dd;
  border-radius: 12px;
  outline: none;
  background: #ffffff;
  font-size: 15px;
}

.search-box input:focus {
  border-color: #2563eb;
  box-shadow:
    0 0 0 3px rgba(37,99,235,.1);
}


/* =====================================================
   LESSONS
===================================================== */

.lessons {
  display: grid;
  gap: 13px;
}

.lesson-card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 15px;
  padding: 18px;
  display: grid;
  grid-template-columns: 48px 1fr auto;
  gap: 15px;
  align-items: center;
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.lesson-card:hover {
  transform: translateY(-2px);
  box-shadow:
    0 10px 25px rgba(0,0,0,.07);
}

.lesson-number {
  width: 45px;
  height: 45px;
  border-radius: 12px;
  background: #eff6ff;
  color: #2563eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
}

.lesson-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}

.lesson-type {
  color: #2563eb;
  font-size: 13px;
  font-weight: 700;
}

.lesson-status {
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 999px;
  background: #dcfce7;
  color: #15803d;
  font-weight: 700;
  text-transform: capitalize;
}

.lesson-content h3 {
  margin: 0 0 6px;
  font-size: 18px;
}

.lesson-content p {
  margin: 0;
  color: #667085;
  line-height: 1.5;
}

.lesson-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin-top: 9px;
  color: #98a2b3;
  font-size: 13px;
}

.lesson-meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.open-lesson {
  border: 0;
  background: #2563eb;
  color: #ffffff;
  padding: 11px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  white-space: nowrap;
}

.open-lesson:hover {
  background: #1d4ed8;
}


/* =====================================================
   STATES
===================================================== */

.loading,
.empty,
.error {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  min-height: 260px;
  padding: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #667085;
}

.loading i,
.empty > i,
.error > i {
  font-size: 40px;
  margin-bottom: 14px;
}

.empty h3,
.error h3 {
  margin: 0 0 7px;
  color: #1d2939;
}

.empty p,
.error p {
  margin: 0;
  line-height: 1.6;
}

.retry-btn {
  margin-top: 16px;
  border: 0;
  background: #2563eb;
  color: #ffffff;
  padding: 11px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
}


/* =====================================================
   FOOTER
===================================================== */

footer {
  text-align: center;
  padding: 35px 20px;
  color: #98a2b3;
  font-size: 14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 800px) {

  .course-hero {
    grid-template-columns: 1fr;
  }

  .course-image-wrapper {
    min-height: 210px;
  }

  .course-image {
    min-height: 210px;
    max-height: 280px;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .lesson-card {
    grid-template-columns: 42px 1fr;
  }

  .open-lesson {
    grid-column: 2;
    width: max-content;
  }

}

@media (max-width: 520px) {

  .container {
    padding: 18px 14px 45px;
  }

  .header-inner {
    padding: 12px 14px;
  }

  .course-info {
    padding: 20px;
  }

  .lesson-card {
    padding: 14px;
    gap: 11px;
  }

  .open-lesson {
    width: 100%;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="header-inner">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >

      <i class="fa-solid fa-arrow-left"></i>

      Back

    </button>


    <a
      href="index-auth.html"
      class="logo"
    >

      LetsStudy <span>Pro</span>

    </a>

  </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">

  <div id="pageContent">

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>
        Loading course...
      </p>

    </div>

  </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

  ©
  <span id="year"></span>
  LetsStudy Pro · Learn. Build. Work. Grow.

</footer>



<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =====================================================
   INIT
===================================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   DOM
===================================================== */

const pageContent =
  document.getElementById(
    "pageContent"
  );

const backBtn =
  document.getElementById(
    "backBtn"
  );

document.getElementById(
  "year"
).textContent =
  new Date().getFullYear();


/* =====================================================
   URL COURSE ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const courseId =
  (
    params.get("courseId") ||
    params.get("id") ||
    ""
  ).trim();


/* =====================================================
   DATA
===================================================== */

let course = null;

let lessons = [];


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if (
      window.history.length > 1
    ) {

      window.history.back();

    } else {

      window.location.href =
        "courses.html";

    }

  }
);


/* =====================================================
   START
===================================================== */

if (!courseId) {

  showError(
    "Course ID is missing. Please open this page from a course."
  );

} else {

  loadCourse();

}


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse() {

  try {

    pageContent.innerHTML = `
      <div class="loading">

        <i class="fa-solid fa-spinner fa-spin"></i>

        <p>
          Loading course...
        </p>

      </div>
    `;


    /* =================================================
       COURSE DOCUMENT
    ================================================= */

    const courseRef =
      doc(
        db,
        "courses",
        courseId
      );

    const courseSnap =
      await getDoc(courseRef);


    if (!courseSnap.exists()) {

      showError(
        "Course not found."
      );

      return;

    }


    course = {
      id: courseSnap.id,
      ...courseSnap.data()
    };


    /* =================================================
       LOAD LESSONS
    ================================================= */

    await loadLessons();


    /* =================================================
       RENDER
    ================================================= */

    renderPage();

  } catch (error) {

    console.error(
      "Course loading error:",
      error
    );

    showError(
      error.message ||
      "Unable to load course."
    );

  }

}


/* =====================================================
   LOAD LESSONS
===================================================== */

async function loadLessons() {

  try {

    const lessonsQuery =
      query(
        collection(
          db,
          "lessons"
        ),
        where(
          "courseId",
          "==",
          courseId
        )
      );


    const snapshot =
      await getDocs(
        lessonsQuery
      );


    lessons = [];


    snapshot.forEach(
      lessonDoc => {

        const data =
          lessonDoc.data();


        const status =
          String(
            data.status || ""
          ).toLowerCase();


        /*
         * Only lessons that are available
         * to learners are displayed.
         *
         * Empty status is also accepted
         * for existing lesson documents.
         */

        if (
          !status ||
          status === "published" ||
          status === "active"
        ) {

          lessons.push({

            id: lessonDoc.id,

            ...data

          });

        }

      }
    );


    /* =================================================
       SORT
    ================================================= */

    lessons.sort(
      (a, b) => {

        const moduleA =
          String(
            a.moduleId || ""
          );

        const moduleB =
          String(
            b.moduleId || ""
          );


        if (
          moduleA !== moduleB
        ) {

          return moduleA.localeCompare(
            moduleB,
            undefined,
            {
              numeric: true,
              sensitivity: "base"
            }
          );

        }


        return (
          Number(
            a.order || 0
          ) -
          Number(
            b.order || 0
          )
        );

      }
    );


  } catch (error) {

    console.error(
      "Lessons loading error:",
      error
    );

    throw error;

  }

}


/* =====================================================
   RENDER PAGE
===================================================== */

function renderPage() {

  const title =
    course.title ||
    course.name ||
    "Untitled Course";


  const description =
    course.description ||
    course.summary ||
    course.shortDescription ||
    "No course description available.";


  const category =
    course.category ||
    course.courseCategory ||
    "General";


  const level =
    course.level ||
    course.difficulty ||
    "All Levels";


  const instructor =
    course.instructorName ||
    course.instructor ||
    course.teacher ||
    course.createdByName ||
    "LetsStudy Pro";


  const image =
    course.image ||
    course.imageUrl ||
    course.thumbnail ||
    course.thumbnailUrl ||
    "";


  const price =
    course.price ??
    course.amount ??
    0;


  document.title =
    `${title} · Course Lessons | LetsStudy Pro`;


  pageContent.innerHTML = `

    <!-- ===============================================
         COURSE
    ================================================ -->

    <section class="course-hero">

      <div class="course-image-wrapper">

        ${
          image
            ? `
              <img
                class="course-image"
                src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="this.style.display='none'"
              >
            `
            : `
              <div
                class="empty"
                style="
                  height:100%;
                  min-height:260px;
                  border:0;
                  border-radius:0;
                "
              >

                <i class="fa-solid fa-graduation-cap"></i>

                <p>
                  LetsStudy Pro Course
                </p>

              </div>
            `
        }

      </div>


      <div class="course-info">

        <span class="course-label">

          <i class="fa-solid fa-book-open"></i>

          Course Lessons

        </span>


        <h1 class="course-title">

          ${escapeHTML(title)}

        </h1>


        <p class="course-description">

          ${escapeHTML(description)}

        </p>


        <div class="course-meta">

          <span>

            <i class="fa-solid fa-tag"></i>

            ${escapeHTML(category)}

          </span>


          <span>

            <i class="fa-solid fa-signal"></i>

            ${escapeHTML(level)}

          </span>


          <span>

            <i class="fa-solid fa-user"></i>

            ${escapeHTML(instructor)}

          </span>

        </div>


        <div class="course-price">

          ${
            price === 0 ||
            price === "0" ||
            String(price).toLowerCase() === "free"
              ? "Free"
              : escapeHTML(
                  String(price)
                )
          }

        </div>

      </div>

    </section>


    <!-- ===============================================
         STATS
    ================================================ -->

    <section class="stats">

      <div class="stat">

        <div class="stat-icon">

          <i class="fa-solid fa-book-open"></i>

        </div>

        <div
          class="stat-number"
          id="totalLessons"
        >
          ${lessons.length}
        </div>

        <div class="stat-label">
          Lessons
        </div>

      </div>


      <div class="stat">

        <div class="stat-icon">

          <i class="fa-solid fa-layer-group"></i>

        </div>

        <div
          class="stat-number"
          id="totalModules"
        >
          ${getModuleCount()}
        </div>

        <div class="stat-label">
          Modules
        </div>

      </div>


      <div class="stat">

        <div class="stat-icon">

          <i class="fa-solid fa-circle-check"></i>

        </div>

        <div
          class="stat-number"
          id="publishedLessons"
        >
          ${lessons.length}
        </div>

        <div class="stat-label">
          Available
        </div>

      </div>

    </section>


    <!-- ===============================================
         LESSON HEADER
    ================================================ -->

    <div class="section-header">

      <div>

        <h2 class="section-title">

          <i class="fa-solid fa-list"></i>

          Course Lessons

        </h2>

        <p class="section-subtitle">

          Learn from your selected course

        </p>

      </div>

    </div>


    <!-- ===============================================
         SEARCH
    ================================================ -->

    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        id="searchInput"
        type="search"
        placeholder="Search lessons..."
        autocomplete="off"
      >

    </div>


    <!-- ===============================================
         LESSON LIST
    ================================================ -->

    <section
      class="lessons"
      id="lessonsContainer"
    >

    /section>

  `;


  renderLessons();


  /* =====================================================
     SEARCH LESSONS
  ===================================================== */

  const searchInput =
    document.getElementById(
      "searchInput"
    );


  if (searchInput) {

    searchInput.addEventListener(
      "input",
      () => {

        const keyword =
          searchInput.value
            .trim()
            .toLowerCase();


        if (!keyword) {

          renderLessons();

          return;

        }


        const filtered =
          lessons.filter(
            lesson => {

              const title =
                String(
                  lesson.title ||
                  lesson.name ||
                  ""
                ).toLowerCase();


              const description =
                String(
                  lesson.description ||
                  ""
                ).toLowerCase();


              const type =
                String(
                  lesson.type ||
                  ""
                ).toLowerCase();


              const moduleId =
                String(
                  lesson.moduleId ||
                  ""
                ).toLowerCase();


              return (
                title.includes(keyword) ||
                description.includes(keyword) ||
                type.includes(keyword) ||
                moduleId.includes(keyword)
              );

            }
          );


        renderLessons(
          filtered
        );

      }
    );

  }

}


/* =====================================================
   RENDER LESSONS
===================================================== */

function renderLessons(
  list = lessons
) {

  const container =
    document.getElementById(
      "lessonsContainer"
    );


  if (!container) {
    return;
  }


  if (!list.length) {

    container.innerHTML = `

      <div class="empty">

        <i
          class="fa-solid fa-book-open"
        ></i>

        <h3>
          No lessons found
        </h3>

        <p>
          This course does not have
          any available lessons yet.
        </p>

      </div>

    `;

    return;
  }


  container.innerHTML =
    list.map(
      (lesson, index) => {

        const title =
          lesson.title ||
          lesson.name ||
          `Lesson ${index + 1}`;


        const description =
          lesson.description ||
          "No lesson description available.";


        const type =
          lesson.type ||
          "lesson";


        const duration =
          lesson.duration ||
          "";


        const moduleId =
          lesson.moduleId ||
          "";


        const status =
          String(
            lesson.status || ""
          ).toLowerCase();


        const originalIndex =
          lessons.findIndex(
            item =>
              item.id === lesson.id
          );


        const lessonNumber =
          originalIndex >= 0
            ? originalIndex + 1
            : index + 1;


        return `

          <article
            class="lesson-card"
          >

            <div
              class="lesson-number"
            >
              ${lessonNumber}
            </div>


            <div
              class="lesson-content"
            >

              <div
                class="lesson-top"
              >

                <span
                  class="lesson-type"
                >

                  <i
                    class="${getLessonIcon(type)}"
                  ></i>

                  ${escapeHTML(
                    formatText(type)
                  )}

                </span>


                ${
                  status
                    ? `
                      <span
                        class="lesson-status"
                      >
                        ${escapeHTML(
                          formatText(status)
                        )}
                      </span>
                    `
                    : ""
                }

              </div>


              <h3>
                ${escapeHTML(title)}
              </h3>


              <p>
                ${escapeHTML(
                  description
                )}
              </p>


              <div
                class="lesson-meta"
              >

                ${
                  moduleId
                    ? `
                      <span>

                        <i
                          class="fa-solid fa-layer-group"
                        ></i>

                        Module
                        ${escapeHTML(
                          String(moduleId)
                        )}

                      </span>
                    `
                    : ""
                }


                ${
                  duration
                    ? `
                      <span>

                        <i
                          class="fa-regular fa-clock"
                        ></i>

                        ${escapeHTML(
                          String(duration)
                        )}

                      </span>
                    `
                    : ""
                }


                ${
                  lesson.order !== undefined &&
                  lesson.order !== null &&
                  lesson.order !== ""
                    ? `
                      <span>

                        <i
                          class="fa-solid fa-list-ol"
                        ></i>

                        Lesson
                        ${escapeHTML(
                          String(
                            lesson.order
                          )
                        )}

                      </span>
                    `
                    : ""
                }

              </div>

            </div>


            <button
              class="open-lesson"
              type="button"
              data-id="${escapeHTML(
                lesson.id
              )}"
            >

              <i
                class="fa-solid fa-play"
              ></i>

              Open

            </button>

          </article>

        `;

      }
    ).join("");


  /* ===================================================
     OPEN LESSON
  =================================================== */

  container
    .querySelectorAll(
      ".open-lesson"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const id =
              button.dataset.id;


            if (!id) {
              return;
            }


            window.location.href =
              `lesson-watch.html?id=${
                encodeURIComponent(id)
              }`;

          }
        );

      }
    );

}


/* =====================================================
   MODULE COUNT
===================================================== */

function getModuleCount() {

  return new Set(
    lessons
      .map(
        lesson =>
          lesson.moduleId
      )
      .filter(Boolean)
  ).size;

}


/* =====================================================
   LESSON ICON
===================================================== */

function getLessonIcon(
  type
) {

  const value =
    String(
      type || ""
    ).toLowerCase();


  switch (value) {

    case "video":

      return "fa-solid fa-circle-play";


    case "text":

      return "fa-solid fa-file-lines";


    case "pdf":

      return "fa-solid fa-file-pdf";


    case "audio":

      return "fa-solid fa-headphones";


    case "live":

      return "fa-solid fa-video";


    case "article":

      return "fa-solid fa-newspaper";


    default:

      return "fa-solid fa-book-open";

  }

}


/* =====================================================
   FORMAT TEXT
===================================================== */

function formatText(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /[-_]/g,
      " "
    )
    .replace(
      /\b\w/g,
      char =>
        char.toUpperCase()
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
) {

  pageContent.innerHTML = `

    <div class="error">

      <i
        class="fa-solid fa-triangle-exclamation"
      ></i>

      <h3>
        Unable to Load Course
      </h3>

      <p>
        ${escapeHTML(message)}
      </p>

      <button
        class="retry-btn"
        id="retryBtn"
        type="button"
      >

        <i
          class="fa-solid fa-rotate-right"
        ></i>

        Try Again

      </button>

    </div>

  `;


  const retryBtn =
    document.getElementById(
      "retryBtn"
    );


  if (retryBtn) {

    retryBtn.addEventListener(
      "click",
      () => {

        window.location.reload();

      }
    );

  }

}


/* =====================================================
   INITIALIZE
===================================================== */

if (!courseId) {

  showError(
    "Course ID is missing. Please open this page from a course."
  );

} else {

  console.log(
    "Loading course:",
    courseId
  );

  loadCourse();

}

</script>
