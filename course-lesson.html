<style>

*{

}

body{

.container{

/* =========================
   TOP
========================= */

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  where
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =====================================================
   INIT
===================================================== */

const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const courseContainer =
  document.getElementById(
    "courseContainer"
  );


const lessonsContainer =
  document.getElementById(
    "lessons"
  );


const lessonCount =
  document.getElementById(
    "lessonCount"
  );


const searchInput =
  document.getElementById(
    "searchInput"
  );


const message =
  document.getElementById(
    "message"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );


/* =====================================================
   STATE
===================================================== */

let course = null;

let lessons = [];


/* =====================================================
   GET COURSE ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const courseId =
  params.get("courseId")
  ||
  params.get("id");


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   MESSAGE
===================================================== */

function showError(text){

  message.textContent =
    text;

  message.style.display =
    "block";

}


/* =====================================================
   LOAD COURSE DETAILS
===================================================== */

async function loadCourse(){

  if(!courseId){

    throw new Error(
      "Course ID is missing."
    );

  }


  const courseRef =
    doc(
      db,
      "courses",
      courseId
    );


  const snapshot =
    await getDoc(
      courseRef
    );


  if(!snapshot.exists()){

    throw new Error(
      "Course not found."
    );

  }


  course = {

    id:
      snapshot.id,

    ...snapshot.data()

  };


  renderCourse();

}


/* =====================================================
   RENDER COURSE
===================================================== */

function renderCourse(){

  const image =
    course.image ||
    course.imageUrl ||
    course.thumbnail ||
    course.thumbnailUrl ||
    "";


  const title =
    course.title ||
    course.name ||
    "Untitled Course";


  const description =
    course.description ||
    course.summary ||
    course.shortDescription ||
    "No course description available.";


  const category =
    course.category ||
    course.courseCategory ||
    "Course";


  const level =
    course.level ||
    course.difficulty ||
    "";


  const instructor =
    course.instructorName ||
    course.instructor ||
    course.teacher ||
    course.createdByName ||
    "";


  const price =
    course.price ??
    course.amount ??
    "";


  courseContainer.innerHTML = `

    <div class="course-cover">

      ${
        image
        ?
        `
          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(title)}"
            onerror="
              this.style.display='none';
              this.nextElementSibling.style.display='flex';
            "
          >

          <div
            class="course-cover-placeholder"
            style="display:none">

            <i class="fa-solid fa-graduation-cap"></i>

          </div>
        `
        :
        `
          <div class="course-cover-placeholder">

            <i class="fa-solid fa-graduation-cap"></i>

          </div>
        `
      }

    </div>


    <div class="course-body">

      <span class="course-category">

        ${escapeHTML(category)}

      </span>


      <h1 class="course-title">

        ${escapeHTML(title)}

      </h1>


      <div class="course-description">

        ${escapeHTML(description)}

      </div>


      <div class="course-meta">

        ${
          level
          ?
          `
            <span class="course-badge">

              <i class="fa-solid fa-layer-group"></i>

              ${escapeHTML(level)}

            </span>
          `
          :
          ""
        }


        ${
          instructor
          ?
          `
            <span class="course-badge">

              <i class="fa-solid fa-user"></i>

              ${escapeHTML(instructor)}

            </span>
          `
          :
          ""
        }


        ${
          price !== ""
          ?
          `
            <span class="course-badge">

              <i class="fa-solid fa-tag"></i>

              ${escapeHTML(price)}

            </span>
          `
          :
          ""
        }


        <span class="course-badge">

          <i class="fa-solid fa-book-open"></i>

          <span id="courseLessonMeta">
            Loading...
          </span>

        </span>

      </div>

    </div>

  `;

}


/* =====================================================
   LOAD LESSONS FOR THIS COURSE
===================================================== */

async function loadLessons(){

  if(!courseId){

    return;

  }


  const lessonsQuery =
    query(

      collection(
        db,
        "lessons"
      ),

      where(
        "courseId",
        "==",
        courseId
      )

    );


  const snapshot =
    await getDocs(
      lessonsQuery
    );


  lessons =
    snapshot.docs.map(
      item => ({

        id:
          item.id,

        ...item.data()

      })
    );


  lessons.sort(
    (a,b) => {

      const moduleA =
        String(
          a.moduleId || ""
        );

      const moduleB =
        String(
          b.moduleId || ""
        );


      if(
        moduleA !== moduleB
      ){

        return moduleA.localeCompare(
          moduleB
        );

      }


      return (
        Number(
          a.order || 0
        )
        -
        Number(
          b.order || 0
        )
      );

    }
  );


  lessonCount.textContent =
    `${lessons.length} ${
      lessons.length === 1
      ? "Lesson"
      : "Lessons"
    }`;


  const courseLessonMeta =
    document.getElementById(
      "courseLessonMeta"
    );


  if(courseLessonMeta){

    courseLessonMeta.textContent =
      `${lessons.length} ${
        lessons.length === 1
        ? "Lesson"
        : "Lessons"
      }`;

  }


  renderLessons();

}


/* =====================================================
   RENDER LESSONS
===================================================== */

function renderLessons(){

  const search =
    String(
      searchInput.value || ""
    )
    .trim()
    .toLowerCase();


  const filtered =
    lessons.filter(
      lesson => {

        if(!search)
          return true;


        const text = [

          lesson.title,

          lesson.description,

          lesson.type,

          lesson.status,

          lesson.duration,

          lesson.moduleId

        ]

        .map(
          value =>
            String(
              value ?? ""
            ).toLowerCase()
        )

        .join(" ");


        return text.includes(
          search
        );

      }
    );


  if(!filtered.length){

    lessonsContainer.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-book-open"></i>

        <br><br>

        ${
          search
          ?
          "No lessons match your search."
          :
          "No lessons found for this course."
        }

      </div>

    `;

    return;

  }


  lessonsContainer.innerHTML =
    filtered.map(
      (lesson,index) => {

        const title =
          lesson.title ||
          "Untitled Lesson";


        const description =
          lesson.description ||
          "No description";


        const type =
          String(
            lesson.type ||
            "lesson"
          ).toLowerCase();


        const status =
          String(
            lesson.status ||
            "published"
          ).toLowerCase();


        const duration =
          lesson.duration ||
          "";


        const order =
          lesson.order ||
          index + 1;


        let icon =
          "fa-file";


        if(type === "video")
          icon =
            "fa-video";


        else if(type === "text")
          icon =
            "fa-file-lines";


        else if(type === "pdf")
          icon =
            "fa-file-pdf";


        else if(type === "audio")
          icon =
            "fa-volume-high";


        else if(type === "live")
          icon =
            "fa-tower-broadcast";


        return `

          <div
            class="lesson"
            data-id="${escapeHTML(
              lesson.id
            )}"
          >


            <div class="lesson-number">

              ${escapeHTML(order)}

            </div>


            <div class="lesson-info">

              <div class="lesson-title">

                ${escapeHTML(title)}

              </div>


              <div class="lesson-description">

                ${escapeHTML(
                  description
                )}

              </div>


              <div class="lesson-meta">

                <span class="badge">

                  <i
                    class="fa-solid ${icon}"
                  ></i>

                  ${escapeHTML(type)}

                </span>


                <span class="badge">

                  ${escapeHTML(status)}

                </span>


                ${
                  duration
                  ?
                  `
                    <span class="badge">

                      <i
                        class="fa-regular fa-clock"
                      ></i>

                      ${escapeHTML(
                        duration
                      )}

                    </span>
                  `
                  :
                  ""
                }


                ${
                  lesson.moduleId
                  ?
                  `
                    <span class="badge">

                      Module:
                      ${escapeHTML(
                        lesson.moduleId
                      )}

                    </span>
                  `
                  :
                  ""
                }

              </div>

            </div>


            <div class="lesson-arrow">

              <i class="fa-solid fa-arrow-right"></i>

            </div>


          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   OPEN LESSON
===================================================== */

lessonsContainer.addEventListener(
  "click",
  event => {

    const lesson =
      event.target.closest(
        ".lesson"
      );


    if(!lesson)
      return;


    const lessonId =
      lesson.dataset.id;


    if(!lessonId)
      return;


    window.location.href =
      `lesson-watch.html?id=${encodeURIComponent(
        lessonId
      )}`;

  }
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  renderLessons
);


/* =====================================================
   BACK
===================================================== */

/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener("click", () => {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = "search.html";
  }
});


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse() {
  if (!courseId) {
    showError("Course ID is missing.");
    return;
  }

  try {
    const courseRef = doc(db, "courses", courseId);
    const courseSnap = await getDoc(courseRef);

    if (!courseSnap.exists()) {
      showError("Course not found.");
      return;
    }

    const course = courseSnap.data();

    renderCourse(course);
    await loadLessons();

  } catch (error) {
    console.error("Course loading error:", error);
    showError("Unable to load course details.");
  }
}


/* =====================================================
   RENDER COURSE DETAILS
===================================================== */

function renderCourse(course) {

  const image =
    course.image ||
    course.imageUrl ||
    course.thumbnail ||
    course.thumbnailUrl ||
    "";

  const title =
    course.title ||
    course.name ||
    "Untitled Course";

  const description =
    course.description ||
    course.summary ||
    course.shortDescription ||
    "No course description available.";

  const category =
    course.category ||
    course.courseCategory ||
    "General";

  const level =
    course.level ||
    course.difficulty ||
    "All Levels";

  const instructor =
    course.instructorName ||
    course.instructor ||
    course.teacher ||
    course.createdByName ||
    "LetsStudy Pro";

  const price =
    course.price ??
    course.amount ??
    0;

  courseTitle.textContent = title;
  courseDescription.textContent = description;
  courseCategory.textContent = category;
  courseLevel.textContent = level;
  courseInstructor.textContent = instructor;

  if (price === 0 || price === "0" || price === "Free") {
    coursePrice.textContent = "Free";
  } else {
    coursePrice.textContent = price;
  }

  if (image) {
    courseImage.src = image;
    courseImage.alt = title;
    courseImage.style.display = "block";
  } else {
    courseImage.style.display = "none";
  }

  document.title = `${title} · Lessons | LetsStudy Pro`;
}


/* =====================================================
   LOAD LESSONS FOR THIS COURSE
===================================================== */

async function loadLessons() {

  lessonsContainer.innerHTML = `
    <div class="loading">
      <i class="fa-solid fa-spinner fa-spin"></i>
      Loading lessons...
    </div>
  `;

  try {

    const lessonsQuery = query(
      collection(db, "lessons"),
      where("courseId", "==", courseId)
    );

    const snapshot = await getDocs(lessonsQuery);

    lessons = [];

    snapshot.forEach((lessonDoc) => {

      lessons.push({
        id: lessonDoc.id,
        ...lessonDoc.data()
      });

    });

    lessons.sort((a, b) => {

      const moduleA = String(a.moduleId || "");
      const moduleB = String(b.moduleId || "");

      if (moduleA !== moduleB) {
        return moduleA.localeCompare(moduleB, undefined, {
          numeric: true,
          sensitivity: "base"
        });
      }

      return Number(a.order || 0) - Number(b.order || 0);

    });

    updateStats();
    renderLessons();

  } catch (error) {

    console.error("Lessons loading error:", error);

    lessonsContainer.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <h3>Unable to load lessons</h3>
        <p>Please try again later.</p>
      </div>
    `;
  }
}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats() {

  totalLessons.textContent = lessons.length;

  const published = lessons.filter(lesson =>
    ["published", "active"].includes(
      String(lesson.status || "").toLowerCase()
    )
  ).length;

  publishedLessons.textContent = published;

  const modules = new Set(
    lessons
      .map(lesson => lesson.moduleId)
      .filter(Boolean)
  );

  totalModules.textContent = modules.size;
}


/* =====================================================
   RENDER LESSONS
===================================================== */

function renderLessons(list = lessons) {

  if (!list.length) {

    lessonsContainer.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-book-open"></i>

        <h3>No lessons found</h3>

        <p>
          This course does not have any lessons yet.
        </p>
      </div>
    `;

    return;
  }

  lessonsContainer.innerHTML = list.map((lesson, index) => {

    const title =
      lesson.title ||
      lesson.name ||
      `Lesson ${index + 1}`;

    const description =
      lesson.description ||
      "No lesson description available.";

    const type =
      lesson.type ||
      "lesson";

    const duration =
      lesson.duration ||
      "";

    const status =
      String(lesson.status || "").toLowerCase();

    const moduleId =
      lesson.moduleId ||
      "";

    const lessonNumber = index + 1;

    return `
      <article
        class="lesson-card"
        data-id="${escapeHTML(lesson.id)}"
      >

        <div class="lesson-number">
          ${lessonNumber}
        </div>

        <div class="lesson-content">

          <div class="lesson-top">

            <span class="lesson-type">
              <i class="${getLessonIcon(type)}"></i>
              ${escapeHTML(formatText(type))}
            </span>

            ${
              status
                ? `
                  <span class="lesson-status ${escapeHTML(status)}">
                    ${escapeHTML(formatText(status))}
                  </span>
                `
                : ""
            }

          </div>

          <h3>
            ${escapeHTML(title)}
          </h3>

          <p>
            ${escapeHTML(description)}
          </p>

          <div class="lesson-meta">

            ${
              moduleId
                ? `
                  <span>
                    <i class="fa-solid fa-layer-group"></i>
                    Module ${escapeHTML(String(moduleId))}
                  </span>
                `
                : ""
            }

            ${
              duration
                ? `
                  <span>
                    <i class="fa-regular fa-clock"></i>
                    ${escapeHTML(String(duration))}
                  </span>
                `
                : ""
            }

          </div>

        </div>

        <button
          class="open-lesson"
          type="button"
          data-id="${escapeHTML(lesson.id)}"
        >
          <i class="fa-solid fa-play"></i>
          Open
        </button>

      </article>
    `;

  }).join("");

  document
    .querySelectorAll(".open-lesson")
    .forEach(button => {

      button.addEventListener("click", () => {

        const id = button.dataset.id;

        if (!id) return;

        window.location.href =
          `lesson-watch.html?id=${encodeURIComponent(id)}`;

      });

    });
}


/* =====================================================
   SEARCH LESSONS
===================================================== */

searchInput.addEventListener("input", () => {

  const keyword =
    searchInput.value.trim().toLowerCase();

  if (!keyword) {
    renderLessons();
    return;
  }

  const filtered = lessons.filter(lesson => {

    const title =
      String(
        lesson.title ||
        lesson.name ||
        ""
      ).toLowerCase();

    const description =
      String(
        lesson.description ||
        ""
      ).toLowerCase();

    const type =
      String(
        lesson.type ||
        ""
      ).toLowerCase();

    const moduleId =
      String(
        lesson.moduleId ||
        ""
      ).toLowerCase();

    return (
      title.includes(keyword) ||
      description.includes(keyword) ||
      type.includes(keyword) ||
      moduleId.includes(keyword)
    );

  });

  renderLessons(filtered);
});


/* =====================================================
   LESSON ICON
===================================================== */

function getLessonIcon(type) {

  const value =
    String(type || "").toLowerCase();

  if (value === "video") {
    return "fa-solid fa-circle-play";
  }

  if (value === "text") {
    return "fa-solid fa-file-lines";
  }

  if (value === "pdf") {
    return "fa-solid fa-file-pdf";
  }

  if (value === "audio") {
    return "fa-solid fa-headphones";
  }

  if (value === "live") {
    return "fa-solid fa-video";
  }

  return "fa-solid fa-book-open";
}


/* =====================================================
   FORMAT TEXT
===================================================== */

function formatText(value) {

  return String(value || "")
    .replace(/[-_]/g, " ")
    .replace(/\b\w/g, char => char.toUpperCase());

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  lessonsContainer.innerHTML = `
    <div class="empty error">
      <i class="fa-solid fa-triangle-exclamation"></i>

      <h3>Something went wrong</h3>

      <p>
        ${escapeHTML(message)}
      </p>

      <button
        type="button"
        onclick="location.reload()"
      >
        <i class="fa-solid fa-rotate-right"></i>
        Try Again
      </button>
    </div>
  `;

}


/* =====================================================
   INITIALIZE
===================================================== */

loadCourse();

</script>

</body>
</html>
