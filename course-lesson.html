<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Course Lessons | LetsStudy Pro</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#f5f7fb;
  color:#111827;
}

/* =========================================
   HEADER
========================================= */

.header{

  height:70px;

  background:#ffffff;

  border-bottom:1px solid #e5e7eb;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 28px;

  position:sticky;

  top:0;

  z-index:100;

}

.logo{

  font-size:22px;

  font-weight:800;

}

.logo span{

  color:#2563eb;

}

.header-btn{

  border:1px solid #e5e7eb;

  background:#ffffff;

  padding:10px 16px;

  border-radius:10px;

  font-weight:700;

  cursor:pointer;

}

/* =========================================
   CONTAINER
========================================= */

.container{

  width:min(1150px,94%);

  margin:30px auto 60px;

}

/* =========================================
   HERO
========================================= */

.hero{

  background:#111827;

  color:white;

  border-radius:20px;

  padding:32px;

  margin-bottom:25px;

}

.hero h1{

  font-size:32px;

  margin-bottom:10px;

}

.hero p{

  color:#d1d5db;

  line-height:1.7;

}

.course-id{

  margin-top:18px;

  display:inline-block;

  background:rgba(255,255,255,.1);

  padding:8px 12px;

  border-radius:8px;

  font-size:13px;

  word-break:break-all;

}

/* =========================================
   FILTER
========================================= */

.filter{

  background:white;

  border:1px solid #e5e7eb;

  border-radius:16px;

  padding:18px;

  margin-bottom:22px;

}

.search{

  width:100%;

  padding:14px;

  border:1px solid #d1d5db;

  border-radius:10px;

  font-size:15px;

  outline:none;

}

.search:focus{

  border-color:#2563eb;

}

/* =========================================
   LESSON GRID
========================================= */

.lessons{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:18px;

}

/* =========================================
   LESSON CARD
========================================= */

.lesson-card{

  background:white;

  border:1px solid #e5e7eb;

  border-radius:17px;

  padding:22px;

  transition:.2s;

}

.lesson-card:hover{

  transform:translateY(-3px);

  box-shadow:
    0 12px 30px rgba(0,0,0,.08);

}

.lesson-top{

  display:flex;

  justify-content:space-between;

  gap:12px;

  margin-bottom:15px;

}

.lesson-number{

  min-width:42px;

  height:42px;

  border-radius:12px;

  background:#eff6ff;

  color:#2563eb;

  display:flex;

  align-items:center;

  justify-content:center;

  font-weight:800;

}

.badges{

  display:flex;

  flex-wrap:wrap;

  gap:6px;

}

.badge{

  font-size:11px;

  padding:5px 9px;

  border-radius:999px;

  background:#eff6ff;

  color:#1d4ed8;

  font-weight:700;

}

.badge.green{

  background:#ecfdf5;

  color:#047857;

}

.badge.gray{

  background:#f3f4f6;

  color:#4b5563;

}

.lesson-card h2{

  font-size:20px;

  margin-bottom:10px;

  line-height:1.35;

}

.description{

  color:#6b7280;

  line-height:1.7;

  font-size:14px;

  margin-bottom:18px;

}

.lesson-meta{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-bottom:18px;

}

.meta{

  background:#f8fafc;

  padding:11px;

  border-radius:9px;

}

.meta-label{

  color:#9ca3af;

  font-size:11px;

  margin-bottom:4px;

}

.meta-value{

  font-size:13px;

  font-weight:700;

  word-break:break-word;

}

.watch-btn{

  width:100%;

  border:0;

  background:#2563eb;

  color:white;

  padding:13px;

  border-radius:10px;

  font-weight:800;

  cursor:pointer;

}

.watch-btn:hover{

  background:#1d4ed8;

}

/* =========================================
   EMPTY
========================================= */

.empty{

  display:none;

  background:white;

  border:1px solid #e5e7eb;

  border-radius:16px;

  padding:45px 20px;

  text-align:center;

}

.empty-icon{

  font-size:42px;

  margin-bottom:12px;

}

.empty h2{

  margin-bottom:8px;

}

.empty p{

  color:#6b7280;

}

/* =========================================
   LOADING
========================================= */

.loading{

  text-align:center;

  padding:50px;

  color:#6b7280;

}

/* =========================================
   ERROR
========================================= */

.error{

  display:none;

  background:#fef2f2;

  border:1px solid #fecaca;

  color:#991b1b;

  padding:16px;

  border-radius:12px;

  margin-bottom:20px;

}

/* =========================================
   FOOTER
========================================= */

.footer{

  text-align:center;

  color:#9ca3af;

  font-size:13px;

  padding:35px 0;

}

/* =========================================
   MOBILE
========================================= */

@media(max-width:750px){

  .header{

    padding:0 15px;

  }

  .logo{

    font-size:19px;

  }

  .container{

    margin-top:20px;

  }

  .hero{

    padding:24px;

  }

  .hero h1{

    font-size:26px;

  }

  .lessons{

    grid-template-columns:1fr;

  }

}

@media(max-width:450px){

  .lesson-meta{

    grid-template-columns:1fr;

  }

  .header-btn{

    padding:8px 11px;

    font-size:12px;

  }

}

</style>

</head>

<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

  <div class="logo">

    LetsStudy <span>Pro</span>

  </div>

  <button
    class="header-btn"
    id="backBtn"
  >
    ← Back
  </button>

</header>


<main class="container">


  <!-- =======================================
       HERO
  ======================================== -->

  <section class="hero">

    <h1>
      Course Lessons
    </h1>

    <p>
      Continue learning through the lessons
      available in this course.
    </p>

    <div
      class="course-id"
      id="courseIdDisplay"
    >
      Course ID: —
    </div>

  </section>


  <!-- =======================================
       ERROR
  ======================================== -->

  <div
    class="error"
    id="error"
  ></div>


  <!-- =======================================
       SEARCH
  ======================================== -->

  <section class="filter">

    <input
      type="search"
      class="search"
      id="searchInput"
      placeholder="Search lessons..."
      autocomplete="off"
    >

  </section>


  <!-- =======================================
       LOADING
  ======================================== -->

  <div
    class="loading"
    id="loading"
  >

    Loading lessons...

  </div>


  <!-- =======================================
       LESSONS
  ======================================== -->

  <section
    class="lessons"
    id="lessonsContainer"
  ></section>


  <!-- =======================================
       EMPTY
  ======================================== -->

  <section
    class="empty"
    id="empty"
  >

    <div class="empty-icon">
      🎬
    </div>

    <h2>
      No Lessons Found
    </h2>

    <p>
      There are no lessons available for
      this course or your search.
    </p>

  </section>


  <div class="footer">

    © LetsStudy Pro — Learn. Build. Grow.

  </div>

</main>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* =========================================
   URL PARAMETERS
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const courseId =
  params.get("courseId") ||
  params.get("id") ||
  "";


const moduleId =
  params.get("moduleId") ||
  "";


/* =========================================
   ELEMENTS
========================================= */

const container =
  document.getElementById(
    "lessonsContainer"
  );


const loading =
  document.getElementById(
    "loading"
  );


const empty =
  document.getElementById(
    "empty"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const searchInput =
  document.getElementById(
    "searchInput"
  );


/* =========================================
   DATA
========================================= */

let lessons = [];


/* =========================================
   HELPERS
========================================= */

function safe(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return "—";

  }

  return String(value);

}


function escapeHtml(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   LOAD LESSONS
========================================= */

async function loadLessons(){

  try{

    if(!courseId){

      loading.style.display =
        "none";

      errorBox.style.display =
        "block";

      errorBox.textContent =
        "Course ID is missing. Open lessons from a specific course.";

      return;

    }


    document
      .getElementById(
        "courseIdDisplay"
      )
      .textContent =
      "Course ID: " +
      courseId;


    /* =====================================
       GET LESSONS
    ===================================== */

    const snapshot =
      await getDocs(
        collection(
          db,
          "lessons"
        )
      );


    lessons = [];


    snapshot.forEach(
      docSnap => {

        const data =
          docSnap.data() || {};


        /* =================================
           COURSE FILTER
        ================================= */

        if(
          String(
            data.courseId || ""
          ) !==
          String(courseId)
        ){

          return;

        }


        /* =================================
           MODULE FILTER
        ================================= */

        if(

          moduleId &&

          String(
            data.moduleId || ""
          ) !==
          String(moduleId)

        ){

          return;

        }


        lessons.push({

          ...data,

          id:
            docSnap.id,

          lessonId:
            docSnap.id,

          documentId:
            docSnap.id

        });

      }
    );


    /* =====================================
       SORT BY ORDER
    ===================================== */

    lessons.sort(
      (a,b) => {

        const orderA =
          Number(
            a.order || 0
          );

        const orderB =
          Number(
            b.order || 0
          );

        return orderA - orderB;

      }
    );


    loading.style.display =
      "none";


    renderLessons();

  }
  catch(error){

    console.error(
      "Lessons loading error:",
      error
    );


    loading.style.display =
      "none";


    errorBox.style.display =
      "block";


    errorBox.textContent =
      error.message ||
      "Unable to load lessons.";

  }

}


/* =========================================
   RENDER LESSONS
========================================= */

function renderLessons(){

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    lessons.filter(
      lesson => {

        const text = [

          lesson.title,

          lesson.description,

          lesson.type,

          lesson.duration,

          lesson.status,

          lesson.courseId,

          lesson.moduleId

        ]

        .map(
          value =>
            safe(value)
              .toLowerCase()
        )

        .join(" ");


        return text.includes(
          search
        );

      }
    );


  container.innerHTML =
    "";


  if(
    filtered.length === 0
  ){

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  filtered.forEach(
    lesson => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "lesson-card";


      card.innerHTML = `

        <div class="lesson-top">

          <div class="lesson-number">

            ${escapeHtml(
              safe(lesson.order)
            )}

          </div>


          <div class="badges">

            <span class="badge">

              ${escapeHtml(
                safe(lesson.type)
              )}

            </span>


            <span class="badge green">

              ${escapeHtml(
                safe(lesson.status)
              )}

            </span>

          </div>

        </div>


        <h2>

          ${escapeHtml(
            safe(lesson.title)
          )}

        </h2>


        <div class="description">

          ${escapeHtml(
            safe(lesson.description)
          )}

        </div>


        <div class="lesson-meta">


          <div class="meta">

            <div class="meta-label">
              Duration
            </div>

            <div class="meta-value">

              ${escapeHtml(
                safe(lesson.duration)
              )}

            </div>

          </div>


          <div class="meta">

            <div class="meta-label">
              Lesson ID
            </div>

            <div class="meta-value">

              ${escapeHtml(
                safe(lesson.id)
              )}

            </div>

          </div>


          <div class="meta">

            <div class="meta-label">
              Module ID
            </div>

            <div class="meta-value">

              ${escapeHtml(
                safe(lesson.moduleId)
              )}

            </div>

          </div>


          <div class="meta">

            <div class="meta-label">
              Course ID
            </div>

            <div class="meta-value">

              ${escapeHtml(
                safe(lesson.courseId)
              )}

            </div>

          </div>


        </div>


        <button
          class="watch-btn"
          data-id="${escapeHtml(
            lesson.id
          )}"
        >

          🎬 Watch Lesson

        </button>

      `;


      const button =
        card.querySelector(
          ".watch-btn"
        );


      button.addEventListener(
        "click",
        () => {

          openLesson(
            lesson
          );

        }
      );


      container.appendChild(
        card
      );

    }
  );

}


/* =========================================
   OPEN LESSON
========================================= */

function openLesson(
  lesson
){

  const lessonId =
    lesson.id ||
    lesson.lessonId ||
    lesson.documentId ||
    "";


  const lessonCourseId =
    lesson.courseId ||
    courseId ||
    "";


  const lessonModuleId =
    lesson.moduleId ||
    moduleId ||
    "";


  if(!lessonId){

    alert(
      "Lesson ID is missing."
    );

    return;

  }


  if(!lessonCourseId){

    alert(
      "Course ID is missing."
    );

    return;

  }


  let url =
    "lesson-watch.html?id=" +
    encodeURIComponent(
      lessonId
    ) +

    "&courseId=" +
    encodeURIComponent(
      lessonCourseId
    );


  if(lessonModuleId){

    url +=
      "&moduleId=" +
      encodeURIComponent(
        lessonModuleId
      );

  }


  window.location.href =
    url;

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "input",
  renderLessons
);


/* =========================================
   BACK
========================================= */

document
  .getElementById(
    "backBtn"
  )
  .addEventListener(
    "click",
    () => {

      if(courseId){

        window.location.href =
          "course-modules.html?courseId=" +
          encodeURIComponent(
            courseId
          );

      }
      else{

        history.back();

      }

    }
  );


/* =========================================
   START
========================================= */

loadLessons();

</script>

</body>
</html>
