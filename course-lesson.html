<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson Video | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827
}
header{
  background:#111827;
  color:white;
  padding:15px 20px;
  font-weight:700
}
main{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:20px
}
.video-box{
  position:relative;
  width:100%;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer
}
video{
  width:100%;
  display:block;
  max-height:75vh;
  background:#000
}
.info{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-top:15px;
  box-shadow:0 2px 10px #0001
}
h1{margin:0 0 10px;font-size:24px}
p{color:#6b7280;line-height:1.6}
button{
  border:0;
  background:#111827;
  color:white;
  padding:11px 16px;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px
}
.progress{
  margin-top:15px;
  height:7px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden
}
.progress-bar{
  height:100%;
  width:0;
  background:#2563eb
}
@media(max-width:600px){
  main{padding:10px}
  h1{font-size:20px}
  video{max-height:80vh}
}
</style>
</head>

<body>

<header>🌍 LetsStudy Pro</header>

<main>

  <div class="video-box" id="videoBox">
    <video
      id="lessonVideo"
      controls
      playsinline
      preload="metadata"
    >
      <source
        id="videoSource"
        src=""
        type="video/mp4"
      >
      Your browser does not support video.
    </video>
  </div>

  <div class="info">
    <h1 id="lessonTitle">Loading lesson...</h1>

    <p id="lessonDescription">
      Please wait while the lesson is loading.
    </p>

    <button id="fullscreenBtn">
      ⛶ Full Screen
    </button>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <p id="progressText">0% completed</p>
  </div>

</main>

<script>
/* =========================
   LESSON DATA
========================= */

const lesson = {
  title: "Introduction to Digital Learning",
  description:
    "Learn the fundamentals of digital learning with LetsStudy Pro.",
  video:
    "https://www.w3schools.com/html/mov_bbb.mp4"
};


/* =========================
   ELEMENTS
========================= */

const video = document.getElementById("lessonVideo");
const source = document.getElementById("videoSource");
const title = document.getElementById("lessonTitle");
const description = document.getElementById("lessonDescription");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const videoBox = document.getElementById("videoBox");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");


/* =========================
   LOAD LESSON
========================= */

title.textContent = lesson.title;
description.textContent = lesson.description;

source.src = lesson.video;
video.load();


/* =========================
   FULL SCREEN
========================= */

async function openFullscreen(){

  try{

    if(document.fullscreenElement){

      await document.exitFullscreen();

    }else{

      if(video.requestFullscreen){
        await video.requestFullscreen();

      }else if(video.webkitRequestFullscreen){
        video.webkitRequestFullscreen();

      }else if(video.webkitEnterFullscreen){
        video.webkitEnterFullscreen();
      }

    }

  }catch(error){

    console.log("Fullscreen error:",error);

  }

}


/* =========================
   VIDEO CLICK
========================= */

video.addEventListener("click",function(){

  openFullscreen();

});


/* =========================
   FULLSCREEN BUTTON
========================= */

fullscreenBtn.addEventListener("click",function(){

  openFullscreen();

});


/* =========================
   PROGRESS
========================= */

video.addEventListener("timeupdate",function(){

  if(!video.duration) return;

  const percent =
    (video.currentTime / video.duration) * 100;

  progressBar.style.width =
    percent + "%";

  progressText.textContent =
    Math.round(percent) + "% completed";

});


/* =========================
   SAVE PROGRESS
========================= */

video.addEventListener("timeupdate",function(){

  localStorage.setItem(
    "lessonProgress",
    video.currentTime
  );

});


/* =========================
   RESTORE PROGRESS
========================= */

video.addEventListener("loadedmetadata",function(){

  const saved =
    localStorage.getItem("lessonProgress");

  if(saved){

    video.currentTime =
      Math.min(
        Number(saved),
        video.duration
      );

  }

});


/* =========================
   COMPLETED
========================= */

video.addEventListener("ended",function(){

  localStorage.setItem(
    "lessonCompleted",
    "true"
  );

  progressBar.style.width = "100%";
  progressText.textContent =
    "100% completed ✓";

});


/* =========================
   FULLSCREEN CHANGE
========================= */

document.addEventListener(
  "fullscreenchange",
  function(){

    fullscreenBtn.textContent =
      document.fullscreenElement
      ? "⛶ Exit Full Screen"
      : "⛶ Full Screen";

  }
);

</script>

</body>
</html>
