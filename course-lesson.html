<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Course Lessons | LetsStudy Pro</title>

<meta
  name="description"
  content="Access LetsStudy Pro courses and lessons."
>

<meta
  name="robots"
  content="noindex,nofollow"
>

<link rel="icon" href="favicon.ico">

<link

  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
  min-height:100vh;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:100;
}

.navbar{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:14px;
}

.back-btn{
  border:0;
  background:#eef2ff;
  color:#3730a3;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

.back-btn:hover{
  background:#e0e7ff;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.brand span{
  color:#4f46e5;
}

main{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 50px;
}

/* HERO */

.hero{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #e5e7eb;
  margin-bottom:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.hero-image{
  width:100%;
  height:280px;
  object-fit:cover;
  background:#e5e7eb;
  display:block;
}

.hero-body{
  padding:25px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#eef2ff;
  color:#3730a3;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.hero h1{
  font-size:32px;
  margin-bottom:12px;
  line-height:1.25;
}

.hero-description{
  color:#667085;
  line-height:1.7;
  margin-bottom:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#f8fafc;
  border-radius:12px;
  padding:15px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.stat span{
  font-size:13px;
  color:#667085;
}

/* SECTION */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.section-title h2{
  font-size:24px;
}

.lesson-count{
  background:#eef2ff;
  color:#3730a3;
  padding:6px 10px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
}

/* SEARCH */

.search-box{
  position:relative;
  margin-bottom:18px;
}

.search-box i{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#98a2b3;
}

.search-box input{
  width:100%;
  padding:14px 15px 14px 45px;
  border:1px solid #d1d5db;
  border-radius:12px;
  outline:none;
  font-size:15px;
  background:#fff;
}

.search-box input:focus{
  border-color:#6366f1;
}

/* LESSONS */

.lessons{
  display:grid;
  gap:12px;
}

.lesson-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:16px;
  transition:.2s;
}

.lesson-card:hover{
  transform:translateY(-2px);

}

.lesson-number{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:12px;
  background:#eef2ff;
  color:#4338ca;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.lesson-icon{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:11px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#475467;
}

.lesson-info{
  flex:1;
  min-width:0;
}

.lesson-info h3{
  font-size:17px;
  margin-bottom:6px;
  word-break:break-word;
}

.lesson-description{
  color:#667085;
  font-size:14px;
  line-height:1.5;
}

.lesson-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:8px;
}

.lesson-meta span{
  font-size:12px;
  color:#667085;
}

.open-btn{
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:7px;
}

.open-btn:hover{
  background:#4338ca;
}

/* LOADING */

.loading{
  text-align:center;
  padding:60px 20px;
  color:#667085;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #e5e7eb;
  border-top-color:#4f46e5;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

/* EMPTY */

.empty{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  text-align:center;
  padding:60px 20px;
  color:#667085;
}

.empty i{
  font-size:45px;
  margin-bottom:15px;
  color:#98a2b3;
}

.empty h2{
  color:#172033;
  margin-bottom:8px;
}

/* ERROR */

.error{
  background:#fff;
  border:1px solid #fecaca;
  border-radius:16px;
  padding:45px 20px;
  text-align:center;
}

.error i{
  color:#dc2626;
  font-size:45px;
  margin-bottom:15px;
}

.error h2{
  margin-bottom:10px;
}

.error p{
  color:#667085;
  margin-bottom:20px;
  line-height:1.6;
}

.retry-btn{
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:11px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

/* FOOTER */

footer{
  text-align:center;
  color:#667085;
  font-size:13px;
  padding:30px 20px;
}

/* MOBILE */

@media(max-width:700px){

  main{
    padding:18px 12px 40px;
  }

  .navbar{
    padding:12px;
  }

  .brand{
    font-size:17px;
  }

  .hero-image{
    height:190px;
  }

  .hero-body{
    padding:18px;
  }

  .hero h1{
    font-size:25px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .lesson-card{
    align-items:flex-start;
  }

  .lesson-number{
    display:none;
  }

  .lesson-icon{
    width:40px;
    min-width:40px;
  }

  .open-btn{
    padding:9px 11px;
    font-size:13px;
  }

}

</style>

</head>


<body>

<header>

  <div class="navbar">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >

      <i class="fa-solid fa-arrow-left"></i>

    </button>

<main>

  </div>

</main>


<footer>

</footer>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDoc,
  getDocs,
  doc,
  query,
  where
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const pageContent =
  document.getElementById(
    "pageContent"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );


/* =====================================================
   COURSE ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const courseId = (
  params.get("courseId") ||
  params.get("courseID") ||
  params.get("id") ||
  ""
).trim();


/* =====================================================
   BACK BUTTON
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if(
      window.history.length > 1
    ){

      window.history.back();

    }else{

      window.location.href =
        "courses.html";

    }

  }
);


/* =====================================================
   VALIDATE COURSE ID
===================================================== */

if(!courseId){

  showError(
    "Course ID is missing. Please open this page from a specific course using ?courseId=COURSE_ID"
  );

}else{

  loadCourse();

}


/* =====================================================
   LOAD ONLY THE SELECTED COURSE
===================================================== */

async function loadCourse(){

  try{

    /*
    IMPORTANT:

    Only this exact course document is loaded.

    No:
    getDocs(collection(db,"courses"))

    No loading all courses.
    */

    const courseRef =
      doc(
        db,
        "courses",
        courseId
      );


    const courseSnap =
      await getDoc(
        courseRef
      );


    if(
      !courseSnap.exists()
    ){

      showError(
        "The selected course could not be found."
      );

      return;

    }


    const courseData =
      courseSnap.data();


    /*
    Extra safety if the document itself
    contains a courseId field.
    */

    if(
      courseData.courseId &&
      String(
        courseData.courseId
      ) !==
      String(
        courseId
      )
    ){

      showError(
        "This course document does not match the selected Course ID."
      );

      return;

    }


    const course = {

      id:
        courseSnap.id,

      ...courseData

    };


    await loadLessons(
      course
    );


  }catch(error){

    console.error(
      "Load course error:",
      error
    );


    showError(
      "Unable to load this course from Firebase."
    );

  }

}


/* =====================================================
   LOAD ONLY LESSONS FOR THIS COURSE
===================================================== */

async function loadLessons(
  course
){

  try{

    /*
    IMPORTANT:

    Only lessons with this exact
    courseId are requested.
    */

    const lessonsQuery =
      query(

        collection(
          db,
          "lessons"
        ),

        where(
          "courseId",
          "==",
          courseId
        )

      );


    const snapshot =
      await getDocs(
        lessonsQuery
      );


    let lessons =
      snapshot.docs.map(
        lessonDoc => ({

          id:
            lessonDoc.id,

          ...lessonDoc.data()

        })
      );


    /*
    Extra client-side safety.
    */

    lessons =
      lessons.filter(
        lesson =>
          String(
            lesson.courseId || ""
          ) ===
          String(
            courseId
          )
      );


    /*
    Only display published/active lessons.
    Empty status is also allowed.
    */

    lessons =
      lessons.filter(
        lesson => {

          const status =
            String(
              lesson.status || ""
            ).toLowerCase();


          return (

            status === "" ||

            status === "published" ||

            status === "active"

          );

        }
      );


    /*
    Sort lessons by order.
    */

    lessons.sort(
      (a,b) => {

        const orderA =
          Number(
            a.order ??
            a.lessonOrder ??
            a.position ??
            0
          );


        const orderB =
          Number(
            b.order ??
            b.lessonOrder ??
            b.position ??
            0
          );


        return (
          orderA -
          orderB
        );

      }
    );


    renderCourse(
      course,
      lessons
    );


  }catch(error){

    console.error(
      "Load lessons error:",
      error
    );


    /*
    Firestore may require an index only
    if the database configuration demands it.
    */

    if(
      error.code ===
      "failed-precondition"
    ){

      showError(
        "Firestore requires an index for the lessons courseId query. Open the Firebase Console and create the suggested index."
      );

    }else{

      showError(
        "Unable to load lessons for this course."
      );

    }

  }

}


/* =====================================================
   RENDER COURSE
===================================================== */

function renderCourse(
  course,
  lessons
){

  const title =
    getCourseTitle(
      course
    );


  const description =
    getCourseDescription(
      course
    );


  const image =
    getCourseImage(
      course
    );


  const instructor =
    course.instructor ||
    course.instructorName ||
    course.teacher ||
    course.author ||
    "";


  const category =
    course.category ||
    course.subject ||
    "Course";


  const level =
    course.level ||
    course.difficulty ||
    "";


  const courseType =
    course.type ||
    course.courseType ||
    "";


  const videoLessons =
    lessons.filter(
      lesson => {

        const type =
          String(
            lesson.type ||
            lesson.lessonType ||
            ""
          ).toLowerCase();


        return type === "video";

      }
    ).length;


  const moduleValues =
    lessons
      .map(
        lesson =>
          lesson.moduleId ||
          lesson.moduleID ||
          lesson.module ||
          ""
      )
      .filter(Boolean)
      .map(String);


  const moduleCount =
    new Set(
      moduleValues
    ).size;


  pageContent.innerHTML = `

    <section class="hero">

      ${
        image
          ? `

            <img
              class="hero-image"
              src="${safeUrl(image)}"
              alt="${escapeHTML(title)}"
              onerror="this.style.display='none';"
            >

          `
          : ""
      }


      <div class="hero-body">

        <div class="badges">

          <span class="badge">

            <i
              class="fa-solid fa-book-open"
            ></i>

            ${escapeHTML(category)}

          </span>


          ${
            level
              ? `

                <span class="badge">

                  <i
                    class="fa-solid fa-layer-group"
                  ></i>

                  ${escapeHTML(level)}

                </span>

              `
              : ""
          }


          ${
            courseType
              ? `

                <span class="badge">

                  <i
                    class="fa-solid fa-tag"
                  ></i>

                  ${escapeHTML(courseType)}

                </span>

              `
              : ""
          }

        </div>


        <h1>

          ${escapeHTML(title)}

        </h1>


        ${
          description
            ? `

              <div class="hero-description">

                ${formatText(
                  description
                )}

              </div>

            `
            : ""
        }


        ${
          instructor
            ? `

              <div class="hero-description">

                <strong>
                  Instructor:
                </strong>

                ${escapeHTML(
                  String(instructor)
                )}

              </div>

            `
            : ""
        }


        <div class="stats">

          <div class="stat">

            <strong>
              ${lessons.length}
            </strong>

            <span>
              Lessons
            </span>

          </div>


          <div class="stat">

            <strong>
              ${videoLessons}
            </strong>

            <span>
              Video Lessons
            </span>

          </div>


          <div class="stat">

            <strong>
              ${moduleCount}
            </strong>

            <span>
              Modules
            </span>

          </div>

        </div>

      </div>

    </section>


    <section>

      <div class="section-title">

        <h2>
          Course Lessons
        </h2>

        <span
          class="lesson-count"
          id="lessonCount"
        >
          ${lessons.length}
        </span>

      </div>


      <div class="search-box">

        <i
          class="fa-solid fa-search"
        ></i>

        <input
          id="lessonSearch"
          type="search"
          placeholder="Search lessons..."
          autocomplete="off"
        >

      </div>


      <div
        class="lessons"
        id="lessonsList"
      ></div>

    </section>

  `;


  renderLessons(
    lessons
  );


  const searchInput =
    document.getElementById(
      "lessonSearch"
    );


  searchInput.addEventListener(
    "input",
    event => {

      const term =
        String(
          event.target.value || ""
        )
        .trim()
        .toLowerCase();


      let filtered =
        lessons;


      if(term){

        filtered =
          lessons.filter(
            lesson => {

              const searchableText = [

                lesson.title,

                lesson.name,

                lesson.lessonTitle,

                lesson.description,

                lesson.summary,

                lesson.type,

                lesson.lessonType,

                lesson.duration,

                lesson.moduleId,

                lesson.moduleID,

                lesson.module

              ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


              return searchableText.includes(
                term
              );

            }
          );

      }


      const count =
        document.getElementById(
          "lessonCount"
        );


      if(count){

        count.textContent =
          filtered.length;

      }


      renderLessons(
        filtered
      );

    }
  );

}


/* =====================================================
   RENDER LESSONS
===================================================== */

function renderLessons(
  lessons
){

  const list =
    document.getElementById(
      "lessonsList"
    );


  if(!list){

    return;

  }


  if(
    lessons.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        <i
          class="fa-solid fa-book-open"
        ></i>

        <h2>
          No Lessons Found
        </h2>

        <p>
          This course currently has no lessons.
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML =
    lessons.map(
      (lesson,index) => {

        const title =
          lesson.title ||
          lesson.name ||
          lesson.lessonTitle ||
          `Lesson ${index + 1}`;


        const description =
          lesson.description ||
          lesson.summary ||
          "";


        const type =
          lesson.type ||
          lesson.lessonType ||
          "Lesson";


        const duration =
          lesson.duration ||
          lesson.length ||
          "";


        const module =
          lesson.moduleId ||
          lesson.moduleID ||
          lesson.module ||
          "";


        const order =
          lesson.order ??
          lesson.lessonOrder ??
          lesson.position ??
          index + 1;


        const icon =
          getLessonIcon(
            type
          );


        return `

          <article
            class="lesson-card"
          >

            <div
              class="lesson-number"
            >

              ${index + 1}

            </div>


            <div
              class="lesson-icon"
            >

              <i
                class="${icon}"
              ></i>

            </div>
        
           <div class="lesson-icon">
              <i class="${icon}"></i>
            </div>        <div class="lesson-info">
          <div class="lesson-number">
            Lesson ${index + 1}
          </div>

          <h3 class="lesson-title">
            ${escapeHtml(lesson.title || "Untitled Lesson")}
          </h3>

          <div class="lesson-meta">
            <span>
              <i class="fas fa-${lesson.type === "video" ? "play-circle" : "file-alt"}"></i>
              ${escapeHtml(lesson.type || "Lesson")}
            </span>

            ${
              lesson.duration
                ? `
                <span>
                  <i class="fas fa-clock"></i>
                  ${escapeHtml(lesson.duration)}
                </span>
                `
                : ""
            }

            ${
              lesson.moduleName
                ? `
                <span>
                  <i class="fas fa-layer-group"></i>
                  ${escapeHtml(lesson.moduleName)}
                </span>
                `
                : ""
            }
          </div>

          ${
            lesson.description
              ? `
              <p class="lesson-description">
                ${escapeHtml(lesson.description)}
              </p>
              `
              : ""
          }
        </div>

        <div class="lesson-action">
          <a
            href="lesson-watch.html?id=${encodeURIComponent(lesson.id)}"
            class="watch-btn"
          >
            <span>Open Lesson</span>
            <i class="fas fa-arrow-right"></i>
          </a>
        </div>

      </div>
    `;
  });

  lessonsList.innerHTML = html;
}

function updateStats() {
  const totalLessons = allLessons.length;

  const videoLessons = allLessons.filter(
    lesson =>
      String(lesson.type || "").toLowerCase() === "video" ||
      String(lesson.lessonType || "").toLowerCase() === "video"
  ).length;

  const modules = new Set(
    allLessons
      .map(lesson =>
        lesson.moduleId ||
        lesson.module ||
        lesson.moduleName ||
        ""
      )
      .filter(Boolean)
  ).size;

  const totalLessonsEl = document.getElementById("totalLessons");
  const videoLessonsEl = document.getElementById("videoLessons");
  const modulesEl = document.getElementById("modulesCount");

  if (totalLessonsEl) {
    totalLessonsEl.textContent = totalLessons;
  }

  if (videoLessonsEl) {
    videoLessonsEl.textContent = videoLessons;
  }

  if (modulesEl) {
    modulesEl.textContent = modules;
  }
}

function setupSearch() {
  const searchInput = document.getElementById("lessonSearch");

  if (!searchInput) return;

  searchInput.addEventListener("input", () => {
    const term = searchInput.value.trim().toLowerCase();

    if (!term) {
      filteredLessons = [...allLessons];
    } else {
      filteredLessons = allLessons.filter(lesson => {
        const title = String(lesson.title || "").toLowerCase();
        const description = String(
          lesson.description || ""
        ).toLowerCase();

        const moduleName = String(
          lesson.moduleName ||
          lesson.module ||
          ""
        ).toLowerCase();

        return (
          title.includes(term) ||
          description.includes(term) ||
          moduleName.includes(term)
        );
      });
    }

    renderLessons();
  });
}

function showError(message) {
  const errorContainer =
    document.getElementById("errorContainer");

  const loadingContainer =
    document.getElementById("loadingContainer");

  const courseContent =
    document.getElementById("courseContent");

  if (loadingContainer) {
    loadingContainer.style.display = "none";
  }

  if (courseContent) {
    courseContent.style.display = "none";
  }

  if (errorContainer) {
    errorContainer.style.display = "flex";

    const errorMessage =
      errorContainer.querySelector(".error-message");

    if (errorMessage) {
      errorMessage.textContent = message;
    }
  } else {
    console.error(message);
  }
}

function hideLoading() {
  const loadingContainer =
    document.getElementById("loadingContainer");

  if (loadingContainer) {
    loadingContainer.style.display = "none";
  }
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getLessonIcon(type) {
  const lessonType = String(type || "").toLowerCase();

  if (
    lessonType === "video" ||
    lessonType === "video lesson"
  ) {
    return "fa-play";
  }

  if (lessonType === "pdf" || lessonType === "document") {
    return "fa-file-pdf";
  }

  if (lessonType === "quiz") {
    return "fa-question-circle";
  }

  if (lessonType === "assignment") {
    return "fa-tasks";
  }

  return "fa-book-open";
}

async function loadLessons() {
  if (!currentCourseId) {
    showError(
      "Course ID is missing. Please open this page using ?courseId=COURSE_ID"
    );
    return;
  }

  try {
    const lessonsQuery = query(
      collection(db, "lessons"),
      where("courseId", "==", currentCourseId)
    );

    const snapshot = await getDocs(lessonsQuery);

    allLessons = [];

    snapshot.forEach(lessonDoc => {
      const data = lessonDoc.data();

      /*
       * Extra safety check:
       * Only keep lessons whose courseId exactly matches
       * the course currently opened in the URL.
       */
      if (
        String(data.courseId || "") !==
        String(currentCourseId)
      ) {
        return;
      }

      const status = String(
        data.status || "published"
      ).toLowerCase();

      if (
        status !== "published" &&
        status !== "active" &&
        status !== ""
      ) {
        return;
      }

      allLessons.push({
        id: lessonDoc.id,
        ...data
      });
    });

    allLessons.sort((a, b) => {
      const moduleA = Number(
        a.moduleOrder ??
        a.modulePosition ??
        0
      );

      const moduleB = Number(
        b.moduleOrder ??
        b.modulePosition ??
        0
      );

      if (moduleA !== moduleB) {
        return moduleA - moduleB;
      }

      const orderA = Number(
        a.order ??
        a.lessonOrder ??
        a.position ??
        0
      );

      const orderB = Number(
        b.order ??
        b.lessonOrder ??
        b.position ??
        0
      );

      return orderA - orderB;
    });

    filteredLessons = [...allLessons];

    updateStats();
    renderLessons();

  } catch (error) {
    console.error(
      "Error loading course lessons:",
      error
    );

    /*
     * IMPORTANT:
     * Never fall back to loading the complete lessons
     * collection. This page belongs to ONE course only.
     */
    showError(
      "Unable to load lessons for this course. Please try again."
    );
  }
}

async function loadCourse() {
  if (!currentCourseId) {
    showError(
      "Course ID is missing. Please open this page using ?courseId=COURSE_ID"
    );
    return;
  }

  try {
    /*
     * Load ONLY the requested course document.
     * No collection-wide courses query is performed.
     */
    const courseRef = doc(
      db,
      "courses",
      currentCourseId
    );

    const courseSnap = await getDoc(courseRef);

    if (!courseSnap.exists()) {
      showError(
        "The requested course could not be found."
      );
      return;
    }

    currentCourse = {
      id: courseSnap.id,
      ...courseSnap.data()
    };

    /*
     * Safety check in case the document itself contains
     * a courseId field.
     */
    if (
      currentCourse.courseId &&
      String(currentCourse.courseId) !==
        String(currentCourseId)
    ) {
      showError(
        "This course does not match the requested course ID."
      );
      return;
    }

    renderCourse();

    await loadLessons();

    const courseContent =
      document.getElementById("courseContent");

    if (courseContent) {
      courseContent.style.display = "block";
    }

    hideLoading();

  } catch (error) {
    console.error(
      "Error loading course:",
      error
    );

    showError(
      "Unable to load this course. Please try again."
    );
  }
}

function renderCourse() {
  if (!currentCourse) return;

  const title =
    currentCourse.title ||
    currentCourse.courseName ||
    "Untitled Course";

  const description =
    currentCourse.description ||
    currentCourse.shortDescription ||
    "Explore the lessons in this course.";

  const instructor =
    currentCourse.instructor ||
    currentCourse.instructorName ||
    "LetsStudy Pro";

  const image =
    currentCourse.thumbnail ||
    currentCourse.image ||
    currentCourse.coverImage ||
    "";

  const titleEl =
    document.getElementById("courseTitle");

  const descriptionEl =
    document.getElementById("courseDescription");

  const instructorEl =
    document.getElementById("courseInstructor");

  const imageEl =
    document.getElementById("courseImage");

  if (titleEl) {
    titleEl.textContent = title;
  }

  if (descriptionEl) {
    descriptionEl.textContent = description;
  }

  if (instructorEl) {
    instructorEl.textContent = instructor;
  }

  if (imageEl && image) {
    imageEl.src = image;
    imageEl.alt = title;

    imageEl.onerror = () => {
      imageEl.style.display = "none";
    };
  }

  document.title =
    `${title} | LetsStudy Pro`;
}

function initializeCourseId() {
  const params =
    new URLSearchParams(window.location.search);

  /*
   * Supported:
   * ?courseId=123
   * ?courseID=123
   * ?id=123
   * ?course=123
   */
  currentCourseId =
    params.get("courseId") ||
    params.get("courseID") ||
    params.get("id") ||
    params.get("course") ||
    "";

  currentCourseId =
    currentCourseId.trim();
}

async function init() {
  try {
    initializeCourseId();

    if (!currentCourseId) {
      showError(
        "Course ID is missing. Please open this page using ?courseId=COURSE_ID"
      );
      return;
    }

    setupSearch();

    await loadCourse();

  } catch (error) {
    console.error(
      "Initialization error:",
      error
    );

    showError(
      "Something went wrong while opening this course."
    );
  }
}

/*
 * Back button
 */
const backButton =
  document.getElementById("backButton");

if (backButton) {
  backButton.addEventListener("click", () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "course-details.html";
    }
  });
}

/*
 * Start page
 */
init();
