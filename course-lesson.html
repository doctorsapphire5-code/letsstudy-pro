<style>
:root{
  --ink:#0d1b2a;--ink-2:#16293f;--paper:#f2f5f9;--card:#fff;--line:#dde4ec;
  --mute:#5b6b7e;--brand:#0a7c66;--brand-soft:#e2f4ef;--amber:#f2a93b;
  --head:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.i{width:17px;height:17px;min-width:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,3%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:20px;font-weight:700;letter-spacing:-.3px;text-decoration:none}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--amber);display:grid;place-items:center;font-size:16px}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;text-decoration:none}
.back-btn:hover{background:var(--ink-2)}
.back-btn .i{width:15px;height:15px;transform:rotate(180deg)}

.wrap{width:min(1320px,94%);margin:0 auto;padding:22px 0 56px}

/* COURSE HEADER */
.course-head{margin-bottom:18px}
.course-head h1{font-family:var(--head);font-size:clamp(24px,3.4vw,34px);line-height:1.15;letter-spacing:-.7px}
.course-desc{color:var(--mute);margin-top:6px;max-width:80ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:#3b4a5d}

/* LAYOUT */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}

/* PLAYER */
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:20px;overflow:hidden}
.player video,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.player video{object-fit:contain}
.player-msg{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:24px;color:#c8d3df;background:var(--ink)}
.player-msg .i{width:38px;height:38px;color:var(--amber)}

/* LESSON INFO */
.info{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.info h2{font-family:var(--head);font-size:clamp(21px,3vw,27px);line-height:1.2;letter-spacing:-.5px;margin-bottom:8px}
.info .desc{color:#3b4a5d;white-space:pre-wrap;word-break:break-word;max-width:72ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.controls .sp{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:10px 16px;background:#fff;color:var(--ink);font:600 14px var(--body);cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.amber{background:var(--amber);border-color:var(--amber);font-weight:700}
.btn.amber:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px rgba(242,169,59,.35)}
.btn.done{background:var(--brand-soft);border-color:#bfe5da;color:var(--brand)}
.bar-wrap{margin-top:22px}
.bar{height:7px;border-radius:20px;background:#e6ebf1;overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:var(--brand);border-radius:20px;transition:width .3s}
.bar-text{margin-top:7px;font-size:13px;color:var(--mute)}

/* LESSON LIST */
.lessons{position:sticky;top:80px;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;max-height:calc(100vh - 100px);overflow:hidden}
.lessons-head{padding:18px 18px 12px}
.lessons-head h2{font-family:var(--head);font-size:20px;letter-spacing:-.3px}
.course-progress{margin:10px 0 14px}
.course-progress .bar{height:6px}
.course-progress .bar > i{background:var(--amber)}
.course-progress small{display:block;margin-top:6px;font-size:13px;color:var(--mute)}
.search{position:relative}
.search .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:11px;background:var(--paper);font:500 14.5px var(--body);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.lessons-list{position:relative;overflow-y:auto;padding:0 10px 12px;display:grid;gap:4px;align-content:start}
.lesson{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:11px 10px;cursor:pointer;color:var(--ink);font-size:inherit}
.lesson:hover{background:var(--paper)}
.lesson.active{background:var(--ink);color:#fff}
.mark{width:28px;height:28px;min-width:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:700}
.lesson.completed .mark{background:var(--brand);color:#fff}
.lesson.active .mark{background:var(--amber);color:var(--ink)}
.mark .i{width:15px;height:15px;stroke-width:2.6}
.lesson-title{font-weight:600;line-height:1.35;font-size:14.5px}
.lesson-meta{margin-top:2px;font-size:12.5px;color:var(--mute)}
.lesson.active .lesson-meta{color:#9fb0c3}
.no-lessons{padding:22px 10px;color:var(--mute);text-align:center;font-size:14px}

/* STATES */
.error{max-width:540px;margin:60px auto;background:var(--card);border:1px solid #fecaca;border-radius:22px;padding:44px 28px;text-align:center}
.error .state-icon{width:54px;height:54px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:#fee2e2;color:#b91c1c}
.error .state-icon .i{width:26px;height:26px}
.error h2{font-family:var(--head);font-size:22px;margin-bottom:6px}
.error p{color:var(--mute);margin-bottom:18px}
@keyframes sh{to{background-position:-200% 0}}
.sk{border-radius:16px;background:linear-gradient(90deg,#e6ebf1 25%,#f4f7fa 50%,#e6ebf1 75%) 0 0/200% 100%;animation:sh 1.4s linear infinite}

@media(max-width:940px){
  .layout{grid-template-columns:1fr}
  .lessons{position:static;max-height:none}
  .lessons-list{max-height:60vh}
  .player{border-radius:14px}
}
@media(max-width:560px){
  .wrap{width:100%;padding:0 0 40px}
  .course-head,.info,.lessons{margin-left:12px;margin-right:12px}
  .course-head{margin-top:16px}
  .player{border-radius:0}
  .info{padding:18px}
  .controls .sp{margin-left:0}
  .controls .btn{flex:1 1 calc(50% - 10px)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const db = getFirestore(initializeApp(firebaseConfig));

/* URL */
const params = new URLSearchParams(window.location.search);
const courseId = (params.get("courseId") || params.get("courseID") || params.get("course") || "").trim();
const requestedLessonId = (params.get("lessonId") || params.get("lessonID") || params.get("lesson") || "").trim();

/* ELEMENTS */
const $ = (id) => document.getElementById(id);
const video = $("lessonVideo"), player = $("player"), searchInput = $("searchInput"), lessonsList = $("lessonsList");

let COURSE = null, LESSONS = [], CURRENT = null, lastSave = 0;

if(courseId) $("backBtn").href = `course-learn.html?courseId=${encodeURIComponent(courseId)}`;

/* HELPERS */
const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const escapeHTML = (v) => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
function getValue(obj, keys, fallback = ""){
  for(const k of keys){
    const v = obj?.[k];
    if(v !== undefined && v !== null && String(v).trim() !== "") return String(v).trim();
  }
  return fallback;
}
const titleOf = (l, i) => getValue(l, ["title","lessonTitle","name"], `Lesson ${i + 1}`);
const typeOf = (l) => getValue(l, ["type","lessonType"], "Video");
const durationOf = (l) => getValue(l, ["duration","videoDuration"]);

/* Progress storage. The completed key matches course-learn.html. */
const keyDone = (id) => `lessonCompleted_${courseId}_${id}`;
const keyPos = (id) => `lessonPosition_${courseId}_${id}`;
const isDone = (id) => { try{ return localStorage.getItem(keyDone(id)) === "true"; }catch(e){ return false; } };
const setDone = (id, v) => { try{ v ? localStorage.setItem(keyDone(id), "true") : localStorage.removeItem(keyDone(id)); }catch(e){} };

/* VIDEO URL HELPERS */
const VIDEO_KEYS = ["videoUrl","videoURL","video_url","contentUrl","contentURL","video","videoLink","mediaUrl","mediaURL","url"];
function safeUrl(u){
  try{ const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : ""; }
  catch(e){ return ""; }
}
const hostOf = (u) => { try{ return new URL(u).hostname.replace(/^www\./, ""); }catch(e){ return ""; } };
const isYouTube = (u) => /(^|\.)(youtube\.com|youtu\.be|youtube-nocookie\.com)$/.test(hostOf(u));
const isVimeo = (u) => /(^|\.)vimeo\.com$/.test(hostOf(u));
function getYouTubeId(u){
  try{
    const x = new URL(u);
    let id = x.hostname.endsWith("youtu.be") ? x.pathname.slice(1).split("/")[0] : x.searchParams.get("v");
    if(!id){ const m = x.pathname.match(/\/(?:embed|shorts|live|v)\/([\w-]+)/); id = m ? m[1] : ""; }
    return /^[\w-]{6,}$/.test(id || "") ? id : "";
  }catch(e){ return ""; }
}
const getVimeoId = (u) => { const m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/); return m ? m[1] : ""; };

/* ERROR / START */
function showError(message){
  $("loading").hidden = true;
  $("content").hidden = true;
  const box = $("error");
  box.hidden = false;
  box.innerHTML = `<div class="state-icon">${icon("alert")}</div><h2>Unable to open this course</h2><p>${escapeHTML(message)}</p><a class="back-btn" href="courses.html" style="display:inline-flex">Browse courses</a>`;
}

if(!courseId){
  showError("Course ID is missing. Open this page from a course, or use a link like course-lesson.html?courseId=COURSE_ID.");
}else{
  loadCourse();
}

/* LOAD ONE COURSE */
async function loadCourse(){
  try{
    const snap = await getDoc(doc(db, "courses", courseId));
    if(!snap.exists()) throw new Error("The requested course was not found.");
    COURSE = { id: snap.id, ...snap.data() };
    if(COURSE.courseId && String(COURSE.courseId) !== String(courseId)) throw new Error("Course ID mismatch.");

    renderCourse();
    await loadLessons();

    $("loading").hidden = true;
    $("content").hidden = false;
  }catch(error){
    console.error("Course loading error:", error);
    showError(error.message || "Failed to load course.");
  }
}

function renderCourse(){
  const title = getValue(COURSE, ["title","name","courseTitle"], "Untitled course");
  const description = getValue(COURSE, ["description","courseDescription"], "");
  $("courseTitle").textContent = title;
  $("courseDescription").textContent = description;
  $("courseCategory").textContent = getValue(COURSE, ["category","courseCategory"], "Course");
  $("courseLevel").textContent = getValue(COURSE, ["level","courseLevel"], "All levels");
  document.title = `${title} | LetsStudy Pro`;
  const meta = document.querySelector('meta[name="description"]');
  if(meta && description) meta.content = description.slice(0, 155);
}

/* LOAD LESSONS: only this course's, and never drafts */
async function loadLessons(){
  const snapshot = await getDocs(query(collection(db, "lessons"), where("courseId", "==", courseId)));
  LESSONS = [];
  snapshot.forEach((d) => {
    const data = d.data() || {};
    if(String(data.courseId || "") !== String(courseId)) return;
    const status = String(data.status || data.lessonStatus || "").toLowerCase();
    if(["draft","private","disabled"].includes(status)) return;
    LESSONS.push({ id: d.id, ...data });
  });
  LESSONS.sort((a, b) => Number(a.order ?? a.lessonOrder ?? a.position ?? 999999) - Number(b.order ?? b.lessonOrder ?? b.position ?? 999999));

  $("lessonCount").textContent = `${LESSONS.length} ${LESSONS.length === 1 ? "lesson" : "lessons"}`;

  let selected = requestedLessonId ? LESSONS.find(l => String(l.id) === requestedLessonId) : null;
  if(!selected){
    /* Resume at the first lesson that is not completed yet */
    selected = LESSONS.find(l => !isDone(l.id)) || LESSONS[0];
  }

  renderLessons();
  updateCourseProgress();

  if(selected){
    openLesson(selected);
  }else{
    $("lessonTitle").textContent = "No lessons available";
    $("lessonDescription").textContent = "This course doesn't have any available lessons yet.";
    showMedia("none", "No lessons are available for this course yet.");
  }
}

/* LESSON LIST */
function renderLessons(){
  const q = searchInput.value.trim().toLowerCase();
  const items = LESSONS.map((l, i) => ({ l, i })).filter(({ l, i }) => !q || `${titleOf(l, i)} ${typeOf(l)}`.toLowerCase().includes(q));

  if(!items.length){
    lessonsList.innerHTML = `<div class="no-lessons">${LESSONS.length ? "No lessons match your search." : "No lessons found."}</div>`;
    return;
  }

  lessonsList.innerHTML = items.map(({ l, i }) => {
    const done = isDone(l.id);
    const active = CURRENT && CURRENT.id === l.id;
    const meta = [typeOf(l), durationOf(l)].filter(Boolean).join(" • ");
    return `
      <button type="button" class="lesson${done ? " completed" : ""}${active ? " active" : ""}" data-id="${escapeHTML(l.id)}" ${active ? 'aria-current="true"' : ""}>
        <span class="mark">${done ? icon("check") : i + 1}</span>
        <span>
          <div class="lesson-title">${escapeHTML(titleOf(l, i))}</div>
          <div class="lesson-meta">${escapeHTML(meta)}${done ? `${meta ? " • " : ""}Completed` : ""}</div>
        </span>
      </button>`;
  }).join("");

  const activeEl = lessonsList.querySelector(".active");
  if(activeEl) lessonsList.scrollTop = Math.max(0, activeEl.offsetTop - lessonsList.clientHeight / 2);
}

lessonsList.addEventListener("click", (e) => {
  const btn = e.target.closest(".lesson");
  if(!btn) return;
  const lesson = LESSONS.find(l => String(l.id) === btn.dataset.id);
  if(lesson) openLesson(lesson);
});
searchInput.addEventListener("input", renderLessons);

function updateCourseProgress(){
  const done = LESSONS.filter(l => isDone(l.id)).length;
  $("courseBar").style.width = LESSONS.length ? `${Math.round(done / LESSONS.length * 100)}%` : "0%";
  $("courseProgressText").textContent = `${done} of ${LESSONS.length} completed`;
}

/* MEDIA */
function clearFrame(){ const f = $("lessonVideoFrame"); if(f) f.remove(); }

function showMedia(kind, message){
  clearFrame();
  video.hidden = kind !== "video";
  $("playerMsg").hidden = kind !== "none";
  if(kind !== "video"){
    video.pause();
    video.removeAttribute("src");
    video.load();
  }
  if(kind === "none") $("playerMsgText").textContent = message || "";
}

function showFrame(src){
  showMedia("frame");
  const iframe = document.createElement("iframe");
  iframe.id = "lessonVideoFrame";
  iframe.src = src;
  iframe.title = "Lesson video";
  iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
  iframe.setAttribute("allowfullscreen", "");
  player.insertBefore(iframe, player.firstChild);
}

function setProgress(pct, text){
  $("progressBar").style.width = `${pct}%`;
  $("progressText").textContent = text ?? `${pct}% watched`;
}

/* OPEN LESSON */
function openLesson(lesson){
  /* Never open a lesson that belongs to another course */
  if(String(lesson.courseId || "") !== String(courseId)){
    console.error("Blocked lesson from another course.");
    return;
  }

  CURRENT = lesson;
  const index = LESSONS.findIndex(l => l.id === lesson.id);
  const title = titleOf(lesson, index);
  $("lessonTitle").textContent = title;
  $("lessonDescription").textContent = getValue(lesson, ["description","lessonDescription","content"], "No lesson description available.");
  document.title = `${title} | ${getValue(COURSE, ["title","name","courseTitle"], "Course")} | LetsStudy Pro`;

  /* Keep the address bar in sync so a refresh stays on this lesson */
  try{
    const url = new URL(location.href);
    url.searchParams.set("lessonId", lesson.id);
    history.replaceState(null, "", url);
  }catch(e){}

  $("prevBtn").disabled = index <= 0;
  $("nextBtn").disabled = index < 0 || index >= LESSONS.length - 1;
  $("completeBtn").disabled = false;
  updateCompleteBtn();
  renderLessons();

  const raw = getValue(lesson, VIDEO_KEYS, "");
  if(!raw){
    showMedia("none", "No video is available for this lesson.");
    setProgress(0, "No video to track. You can still mark this lesson as complete.");
    return;
  }

  const url = safeUrl(raw);
  if(!url){
    showMedia("none", "This lesson's video link isn't valid.");
    setProgress(0, "No video to track.");
    return;
  }

  if(isYouTube(url) || isVimeo(url)){
    const id = isYouTube(url) ? getYouTubeId(url) : getVimeoId(url);
    if(!id){
      showMedia("none", "This lesson's video link isn't valid.");
      setProgress(0, "No video to track.");
      return;
    }
    showFrame(isYouTube(url)
      ? `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&playsinline=1`
      : `https://player.vimeo.com/video/${id}`);
    setProgress(0, "Progress isn't tracked for embedded videos. Mark the lesson complete when you finish.");
    return;
  }

  showMedia("video");
  setProgress(0);
  video.src = url;
  video.load();
}

/* DIRECT VIDEO EVENTS */
video.addEventListener("loadedmetadata", () => {
  if(!CURRENT || !video.duration) return;
  let t = 0;
  try{ t = Number(localStorage.getItem(keyPos(CURRENT.id))) || 0; }catch(e){}
  if(t > 5 && t < video.duration - 5){
    video.currentTime = t;
    setProgress(Math.round(t / video.duration * 100));
  }
});

video.addEventListener("timeupdate", () => {
  if(!CURRENT || !video.duration) return;
  const pct = Math.min(100, Math.round(video.currentTime / video.duration * 100));
  setProgress(pct);
  const now = Date.now();
  if(now - lastSave > 2000){
    lastSave = now;
    try{ localStorage.setItem(keyPos(CURRENT.id), String(Math.floor(video.currentTime))); }catch(e){}
  }
  if(pct >= 90 && !isDone(CURRENT.id)) markDone(true);
});

video.addEventListener("ended", () => { if(CURRENT && !isDone(CURRENT.id)) markDone(true); });

video.addEventListener("error", () => {
  if(!video.getAttribute("src")) return;
  console.error("Video failed to load:", video.src);
  showMedia("none", "This video couldn't be loaded. Please try again, or contact support if it keeps happening.");
});

/* COMPLETION */
function updateCompleteBtn(){
  const done = !!CURRENT && isDone(CURRENT.id);
  const btn = $("completeBtn");
  btn.classList.toggle("done", done);
  btn.setAttribute("aria-pressed", String(done));
  $("completeText").textContent = done ? "Completed" : "Mark as complete";
}

function markDone(value){
  if(!CURRENT) return;
  setDone(CURRENT.id, value);
  updateCompleteBtn();
  renderLessons();
  updateCourseProgress();
}

$("completeBtn").addEventListener("click", () => { if(CURRENT) markDone(!isDone(CURRENT.id)); });

/* PREVIOUS / NEXT */
function step(delta){
  const index = LESSONS.findIndex(l => CURRENT && l.id === CURRENT.id);
  const target = LESSONS[index + delta];
  if(target){
    openLesson(target);
    player.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}
$("prevBtn").addEventListener("click", () => step(-1));
$("nextBtn").addEventListener("click", () => step(1));

/* FULL SCREEN */
async function toggleFullscreen(){
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
      return;
    }
    const target = $("lessonVideoFrame") || player;
    if(target.requestFullscreen){
      await target.requestFullscreen();
    }else if(video.webkitEnterFullscreen && !video.hidden){
      video.webkitEnterFullscreen();
    }
  }catch(error){
    console.warn("Fullscreen unavailable:", error);
  }
}
$("fullscreenBtn").addEventListener("click", toggleFullscreen);
</script>
</body>
</html>
