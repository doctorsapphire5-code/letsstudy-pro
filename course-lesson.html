<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVK5XbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const courseId = (
  params.get("courseId") ||
  params.get("courseID") ||
  params.get("course") ||
  ""
).trim();


const requestedLessonId = (
  params.get("lessonId") ||
  params.get("lessonID") ||
  params.get("lesson") ||
  ""
).trim();


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const content =
  document.getElementById("content");

const courseTitle =
  document.getElementById("courseTitle");

const courseDescription =
  document.getElementById("courseDescription");

const courseCategory =
  document.getElementById("courseCategory");

const courseLevel =
  document.getElementById("courseLevel");

const lessonCount =
  document.getElementById("lessonCount");

const lessonsList =
  document.getElementById("lessonsList");

const searchInput =
  document.getElementById("searchInput");

const player =
  document.getElementById("player");

const video =
  document.getElementById("lessonVideo");

const videoSource =
  document.getElementById("videoSource");

const lessonTitle =
  document.getElementById("lessonTitle");

const lessonDescription =
  document.getElementById("lessonDescription");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const backBtn =
  document.getElementById("backBtn");


let COURSE = null;
let LESSONS = [];
let CURRENT_LESSON = null;


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if(
      window.history.length > 1
    ){

      window.history.back();

    }else{

      window.location.href =
        "courses.html";

    }

  }
);


/* =====================================================
   ERROR
===================================================== */

function showError(message){

  loading.style.display =
    "none";

  content.style.display =
    "none";

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";

}


/* =====================================================
   START
===================================================== */

if(!courseId){

  showError(
    "Course ID is missing. Open this page using ?courseId=COURSE_ID"
  );

}else{

  loadCourse();

}


/* =====================================================
   LOAD ONE COURSE ONLY
===================================================== */

async function loadCourse(){

  try{

    /*
      IMPORTANT:
      Only ONE course document.
    */

    const courseRef =
      doc(
        db,
        "courses",
        courseId
      );


    const courseSnap =
      await getDoc(courseRef);


    if(
      !courseSnap.exists()
    ){

      throw new Error(
        "The requested course was not found."
      );

    }


    COURSE = {
      id:courseSnap.id,
      ...courseSnap.data()
    };


    /*
      Safety check.
    */

    if(
      COURSE.courseId &&
      String(COURSE.courseId) !==
      String(courseId)
    ){

      throw new Error(
        "Course ID mismatch."
      );

    }


    renderCourse();


    /*
      Only lessons belonging
      to this course.
    */

    await loadLessons();


    loading.style.display =
      "none";

    content.style.display =
      "block";


  }catch(error){

    console.error(
      "Course loading error:",
      error
    );

    showError(
      error.message ||
      "Failed to load course."
    );

  }

}


/* =====================================================
   LOAD LESSONS FOR ONE COURSE
===================================================== */

async function loadLessons(){

  /*
    IMPORTANT:
    This NEVER loads all lessons.

    Firestore filters them first.
  */

  const lessonsQuery =
    query(
      collection(db,"lessons"),
      where(
        "courseId",
        "==",
        courseId
      )
    );


  const snapshot =
    await getDocs(
      lessonsQuery
    );


  LESSONS = [];


  snapshot.forEach(
    lessonDoc => {

      const data =
        lessonDoc.data() || {};


      /*
        Second safety check.
      */

      if(
        String(
          data.courseId || ""
        ) !==
        String(courseId)
      ){

        return;

      }


      const status =
        String(
          data.status ||
          data.lessonStatus ||
          ""
        ).toLowerCase();


      if(
        status === "draft" ||
        status === "private" ||
        status === "disabled"
      ){

        return;

      }


      LESSONS.push({

        id:
          lessonDoc.id,

        ...data

      });

    }
  );


  LESSONS.sort(
    (a,b) => {

      const orderA =
        Number(
          a.order ??
          a.lessonOrder ??
          a.position ??
          999999
        );


      const orderB =
        Number(
          b.order ??
          b.lessonOrder ??
          b.position ??
          999999
        );


      return orderA - orderB;

    }
  );


  lessonCount.textContent =
    `${LESSONS.length} Lessons`;


  renderLessons(
    LESSONS
  );


  let selectedLesson =
    null;


  if(requestedLessonId){

    selectedLesson =
      LESSONS.find(
        lesson =>
          String(lesson.id) ===
          String(requestedLessonId)
      );

  }


  if(
    !selectedLesson &&
    LESSONS.length
  ){

    selectedLesson =
      LESSONS[0];

  }


  if(selectedLesson){

    openLesson(
      selectedLesson
    );

  }else{

    lessonTitle.textContent =
      "No lessons available";

    lessonDescription.textContent =
      "This course currently has no available lessons.";

  }

}


/* =====================================================
   COURSE UI
===================================================== */

function renderCourse(){

  courseTitle.textContent =
    getValue(
      COURSE,
      [
        "title",
        "name",
        "courseTitle"
      ],
      "Untitled Course"
    );


  courseDescription.textContent =
    getValue(
      COURSE,
      [
        "description",
        "courseDescription"
      ],
      "No course description available."
    );


  courseCategory.textContent =
    getValue(
      COURSE,
      [
        "category",
        "courseCategory"
      ],
      "Course"
    );


  courseLevel.textContent =
    getValue(
      COURSE,
      [
        "level",
        "courseLevel"
      ],
      "All Levels"
    );

}


/* =====================================================
   RENDER LESSONS
===================================================== */

function renderLessons(
  list
){

  if(!list.length){

    lessonsList.innerHTML =
      `
      <div class="no-lessons">
        No lessons found.
      </div>
      `;

    return;

  }


  lessonsList.innerHTML =
    list.map(
      (lesson,index) => {

        const title =
          getValue(
            lesson,
            [
              "title",
              "lessonTitle",
              "name"
            ],
            `Lesson ${index + 1}`
          );


        const duration =
          getValue(
            lesson,
            [
              "duration",
              "videoDuration"
            ],
            ""
          );


        const type =
          getValue(
            lesson,
            [
              "type",
              "lessonType"
            ],
            "Video"
          );


        const completed =
          localStorage.getItem(
            completedKey(
              lesson.id
            )
          ) === "true";


        return `

          <button
            type="button"
            class="lesson ${
              completed
                ? "completed"
                : ""
            }"
            data-id="${escapeHTML(
              lesson.id
            )}"
          >

            <div class="lesson-number">
              Lesson ${index + 1}
            </div>

            <div class="lesson-title">
              ${escapeHTML(title)}
            </div>

            <div class="lesson-meta">

              ${escapeHTML(type)}

              ${
                duration
                  ? " • " +
                    escapeHTML(duration)
                  : ""
              }

              ${
                completed
                  ? " • ✓ Completed"
                  : ""
              }

            </div>

          </button>

        `;

      }
    ).join("");


  document
    .querySelectorAll(".lesson")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const id =
              button.dataset.id;


            const selected =
              LESSONS.find(
                lesson =>
                  String(
                    lesson.id
                  ) ===
                  String(id)
              );


            if(selected){

              openLesson(
                selected
              );

            }

          }
        );

      }
    );


  highlightCurrent();

}


/* =====================================================
   OPEN LESSON
===================================================== */

function openLesson(
  lesson
){

  /*
    Security:
    never open a lesson from
    another course.
  */

  if(
    String(
      lesson.courseId || ""
    ) !==
    String(courseId)
  ){

    console.error(
      "Blocked lesson from another course."
    );

    return;

  }


  CURRENT_LESSON =
    lesson;


  const title =
    getValue(
      lesson,
      [
        "title",
        "lessonTitle",
        "name"
      ],
      "Untitled Lesson"
    );


  const description =
    getValue(
      lesson,
      [
        "description",
        "lessonDescription",
        "content"
      ],
      "No lesson description available."
    );


  lessonTitle.textContent =
    title;


  lessonDescription.textContent =
    description;


  highlightCurrent();


  /*
    Find video field.
  */

  const videoUrl =
    getValue(
      lesson,
      [
        "videoUrl",
        "videoURL",
        "video_url",
        "contentUrl",
        "contentURL",
        "video",
        "videoLink",
        "videoURL",
        "mediaUrl",
        "mediaURL",
        "url"
      ],
      ""
    ).trim();


  console.log(
    "Lesson:",
    lesson
  );


  console.log(
    "Video URL:",
    videoUrl
  );


  /*
    Reset old iframe.
  */

  removeVideoFrame();


  /*
    No video.
  */

  if(!videoUrl){

    video.style.display =
      "none";

    showVideoMessage(
      "No video is available for this lesson."
    );

    resetProgress();

    return;

  }


  removeVideoMessage();


  /*
    YouTube.
  */

  if(
    isYouTube(
      videoUrl
    )
  ){

    video.style.display =
      "none";

    loadYouTube(
      videoUrl
    );

    resetProgress();

    return;

  }


  /*
    Vimeo.
  */

  if(
    isVimeo(
      videoUrl
    )
  ){

    video.style.display =
      "none";

    loadVimeo(
      videoUrl
    );

    resetProgress();

    return;

  }


  /*
    Direct video.
  */

  video.style.display =
    "block";


  loadDirectVideo(
    videoUrl
  );


  restoreProgress();

}


/* =====================================================
   DIRECT VIDEO
===================================================== */

function loadDirectVideo(url){

  const cleanUrl =
    safeUrl(url);

  if(!cleanUrl){

    video.style.display = "none";

    showVideoMessage(
      "Invalid video URL."
    );

    return;

  }

  /* Remove old iframe */
  removeVideoFrame();

  /* Remove old video sources */
  while(video.firstChild){

    video.removeChild(
      video.firstChild
    );

  }

  /* Create new source */
  const source =
    document.createElement("source");

  source.src =
    cleanUrl;

  source.type =
    getVideoType(cleanUrl);

  video.appendChild(source);

  /* Show HTML5 video */
  video.style.display = "block";

  removeVideoMessage();

  /* Reload video */
  video.load();

  resetProgress();

  /* Successful load */
  video.onloadedmetadata = () => {

    console.log(
      "Video loaded successfully:",
      cleanUrl
    );

    removeVideoMessage();

    restoreProgress();

  };

  /* Video loading error */
  video.onerror = () => {

    console.error(
      "Video failed to load:",
      cleanUrl
    );

    showVideoMessage(
      "Video could not be loaded. Please check the video URL."
    );

  };

}


/* =====================================================
   YOUTUBE
===================================================== */

function loadYouTube(url){

  const videoId =
    getYouTubeId(url);

  if(!videoId){

    showVideoMessage(
      "Invalid YouTube video URL."
    );

    return;

  }

  video.style.display = "none";

  createVideoFrame(
    `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1&playsinline=1`
  );

  resetProgress();

}


/* =====================================================
   VIMEO
===================================================== */

function loadVimeo(url){

  const videoId =
    getVimeoId(url);

  if(!videoId){

    showVideoMessage(
      "Invalid Vimeo video URL."
    );

    return;

  }

  video.style.display = "none";

  createVideoFrame(
    `https://player.vimeo.com/video/${videoId}`
  );

  resetProgress();

}


/* =====================================================
   CREATE IFRAME
===================================================== */

function createVideoFrame(src){

  removeVideoFrame();

  removeVideoMessage();

  const iframe =
    document.createElement("iframe");

  iframe.id =
    "lessonVideoFrame";

  iframe.className =
    "video-frame";

  iframe.src =
    src;

  iframe.allow =
    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";

  iframe.setAttribute(
    "allowfullscreen",
    ""
  );

  iframe.setAttribute(
    "title",
    "Lesson Video"
  );

  player.insertBefore(
    iframe,
    player.firstChild
  );

}


/* =====================================================
   REMOVE IFRAME
===================================================== */

function removeVideoFrame(){

  const iframe =
    document.getElementById(
      "lessonVideoFrame"
    );

  if(iframe){

    iframe.remove();

  }

}


/* =====================================================
   VIDEO FULLSCREEN
===================================================== */

async function toggleFullscreen(){

  try{

    const iframe =
      document.getElementById(
        "lessonVideoFrame"
      );


    /* YouTube / Vimeo */

    if(iframe){

      if(
        document.fullscreenElement
      ){

        await document.exitFullscreen();

      }else if(
        iframe.requestFullscreen
      ){

        await iframe.requestFullscreen();

      }

      return;

    }


    /* Normal HTML5 video */

    if(
      document.fullscreenElement
    ){

      await document.exitFullscreen();

      return;

    }


    if(
      video.requestFullscreen
    ){

      await video.requestFullscreen();

    }else if(
      video.webkitRequestFullscreen
    ){

      await video.webkitRequestFullscreen();

    }else if(
      video.webkitEnterFullscreen
    ){

      video.webkitEnterFullscreen();

    }

  }catch(error){

    console.error(
      "Fullscreen error:",
      error
    );

  }

}


/* =====================================================
   VIDEO CLICK = FULLSCREEN
===================================================== */

video.addEventListener(
  "click",
  toggleFullscreen
);


/* =====================================================
   FULLSCREEN BUTTON
===================================================== */

fullscreenBtn.addEventListener(
  "click",
  toggleFullscreen
);


/* =====================================================
   FULLSCREEN STATE
===================================================== */

document.addEventListener(
  "fullscreenchange",
  () => {

    fullscreenBtn.textContent =
      document.fullscreenElement
        ? "⛶ Exit Full Screen"
        : "⛶ Full Screen";

  }
);


/* =====================================================
   VIDEO PROGRESS
===================================================== */

video.addEventListener(
  "timeupdate",
  () => {

    if(
      !video.duration ||
      !isFinite(video.duration)
    ){

      return;

    }

    const percent =
      (
        video.currentTime /
        video.duration
      ) * 100;

    progressBar.style.width =
      Math.min(
        100,
        percent
      ) + "%";

    progressText.textContent =
      `${Math.round(percent)}% completed`;

    saveProgress();

  }
);


/* =====================================================
   VIDEO ENDED
===================================================== */

video.addEventListener(
  "ended",
  () => {

    if(!CURRENT_LESSON){

      return;

    }

    localStorage.setItem(
      completedKey(
        CURRENT_LESSON.id
      ),
      "true"
    );

    progressBar.style.width =
      "100%";

    progressText.textContent =
      "100% completed ✓";

    renderLessons(
      filterLessons()
    );

  }
);


/* =====================================================
   PROGRESS KEY
===================================================== */

function progressKey(){

  if(!CURRENT_LESSON){

    return "";

  }

  return (
    "lessonProgress_" +
    courseId +
    "_" +
    CURRENT_LESSON.id
  );

}


/* =====================================================
   COMPLETED KEY
===================================================== */

function completedKey(
  lessonId
){

  return (
    "lessonCompleted_" +
    courseId +
    "_" +
    lessonId
  );

}


/* =====================================================
   SAVE PROGRESS
===================================================== */

function saveProgress(){

  const key =
    progressKey();

  if(!key){

    return;

  }

  localStorage.setItem(
    key,
    String(
      video.currentTime || 0
    )
  );

}


/* =====================================================
   RESTORE PROGRESS
===================================================== */

function restoreProgress(){

  resetProgress();

  const key =
    progressKey();

  if(!key){

    return;

  }

  const saved =
    localStorage.getItem(
      key
    );

  if(!saved){

    return;

  }

  const time =
    Number(saved);

  if(
    !Number.isFinite(time) ||
    time <= 0
  ){

    return;

  }

  if(
    video.readyState >= 1
  ){

    setVideoTime(time);

  }else{

    video.addEventListener(
      "loadedmetadata",
      () => {

        setVideoTime(time);

      },
      {once:true}
    );

  }

}


/* =====================================================
   SET VIDEO TIME
===================================================== */

function setVideoTime(time){

  if(
    video.duration &&
    time < video.duration
  ){

    video.currentTime =
      time;

    updateProgress();

  }

}


/* =====================================================
   UPDATE PROGRESS
===================================================== */

function updateProgress(){

  if(
    !video.duration ||
    !isFinite(video.duration)
  ){

    return;

  }

  const percent =
    (
      video.currentTime /
      video.duration
    ) * 100;

  progressBar.style.width =
    Math.min(
      100,
      percent
    ) + "%";

  progressText.textContent =
    `${Math.round(percent)}% completed`;

}


/* =====================================================
   RESET PROGRESS
===================================================== */

function resetProgress(){

  progressBar.style.width =
    "0%";

  progressText.textContent =
    "0% completed";

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  () => {

    renderLessons(
      filterLessons()
    );

  }
);


/* =====================================================
   FILTER LESSONS
===================================================== */

function filterLessons(){

  const term =
    searchInput.value
      .trim()
      .toLowerCase();

  if(!term){

    return LESSONS;

  }

  return LESSONS.filter(
    lesson => {

      const text = [

        lesson.title,
        lesson.lessonTitle,
        lesson.name,
        lesson.description,
        lesson.lessonDescription

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      return text.includes(
        term
      );

    }
  );

}

/* =====================================================
   YOUTUBE DETECTION
===================================================== */

function isYouTube(url){

  return (
    url.includes("youtube.com") ||
    url.includes("youtu.be")
  );

}


/* =====================================================
   GET YOUTUBE ID
===================================================== */

function getYouTubeId(url){

  try{

    const parsed =
      new URL(url);

    if(
      parsed.hostname.includes(
        "youtu.be"
      )
    ){

      return parsed.pathname
        .replace(/^\/+/,"")
        .split("/")[0];

    }

    if(
      parsed.hostname.includes(
        "youtube.com"
      )
    ){

      const watchId =
        parsed.searchParams.get("v");

      if(watchId){

        return watchId;

      }

      const parts =
        parsed.pathname
          .split("/")
          .filter(Boolean);

      const embedIndex =
        parts.indexOf("embed");

      if(
        embedIndex !== -1 &&
        parts[embedIndex + 1]
      ){

        return parts[
          embedIndex + 1
        ];

      }

      const shortsIndex =
        parts.indexOf("shorts");

      if(
        shortsIndex !== -1 &&
        parts[shortsIndex + 1]
      ){

        return parts[
          shortsIndex + 1
        ];

      }

    }

  }catch(error){

    console.error(
      "YouTube URL error:",
      error
    );

  }

  return null;

}


/* =====================================================
   VIMEO DETECTION
===================================================== */

function isVimeo(url){

  return url.includes(
    "vimeo.com"
  );

}


/* =====================================================
   GET VIMEO ID
===================================================== */

function getVimeoId(url){

  try{

    const parsed =
      new URL(url);

    const parts =
      parsed.pathname
        .split("/")
        .filter(Boolean);

    for(
      let i = parts.length - 1;
      i >= 0;
      i--
    ){

      if(
        /^\d+$/.test(
          parts[i]
        )
      ){

        return parts[i];

      }

    }

  }catch(error){

    console.error(
      "Vimeo URL error:",
      error
    );

  }

  return null;

}


/* =====================================================
   SAFE URL
===================================================== */

function safeUrl(value){

  if(!value){

    return "";

  }

  const url =
    String(value)
      .trim();

  if(
    url.startsWith("https://") ||
    url.startsWith("http://")
  ){

    return url;

  }

  return "";

}


/* =====================================================
   VIDEO TYPE
===================================================== */

function getVideoType(url){

  const clean =
    url
      .toLowerCase()
      .split("?")[0];

  if(
    clean.endsWith(".webm")
  ){

    return "video/webm";

  }

  if(
    clean.endsWith(".ogg") ||
    clean.endsWith(".ogv")
  ){

    return "video/ogg";

  }

  return "video/mp4";

}


/* =====================================================
   GET VALUE
===================================================== */

function getValue(
  object,
  fields,
  fallback = ""
){

  for(
    const field of fields
  ){

    const value =
      object?.[field];

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value);

    }

  }

  return fallback;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
