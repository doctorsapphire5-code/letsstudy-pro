  <style>
    * {

<body>

<main class="container">

  <div class="logo">🎓</div>

  <h1>Welcome Back</h1>

  <p class="subtitle">
    Sign in to Vorix Course and continue your learning journey.
  </p>

  <form id="loginForm">

    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="name@example.com"
      autocomplete="email"
      required
    >

    <div class="password-row">
      <label for="password">Password</label>
      <a href="course-forgot-password.html">Forgot Password?</a>
    </div>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">
      Sign In
    </button>

  </form>

  <div class="divider">OR</div>

  <button type="button" class="google" id="googleButton">
    Continue with Google
  </button>

  <div id="message" class="message" role="alert"></div>

  <div class="register">
    Don't have an account?
    <a href="course-register.html">Create Account</a>
  </div>

  <div class="footer">
    Vorix Course · Secure Authentication
  </div>

</main>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    serverTimestamp,
    increment
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDaJ0LKede-fz0MTZl-V1SxZ4Ps0IETepE",
  authDomain: "vorix-course.firebaseapp.com",
  projectId: "vorix-course",
  storageBucket: "vorix-course.firebasestorage.app",
  messagingSenderId: "277814413742",
  appId: "1:277814413742:web:fb4515f03591ea07c7603f",
  measurementId: "G-SQ6PN704M7"
};


  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);


  // Elements
  const loginForm = document.getElementById("loginForm");
  const loginButton = document.getElementById("loginButton");
  const googleButton = document.getElementById("googleButton");
  const messageBox = document.getElementById("message");


  // Messages
  function showMessage(message, type = "error") {
    messageBox.textContent = message;
    messageBox.className = "message " + type;
  }


  // Firebase error handling
  function firebaseError(error) {

    const errors = {
      "auth/invalid-credential":
        "Invalid email or password.",

      "auth/user-not-found":
        "No account found. Please create an account.",

      "auth/wrong-password":
        "Incorrect password.",

      "auth/invalid-email":
        "Please enter a valid email address.",

      "auth/user-disabled":
        "Your account has been disabled.",

      "auth/too-many-requests":
        "Too many login attempts. Please try again later.",

      "auth/popup-closed-by-user":
        "Google login was cancelled.",

      "auth/popup-blocked":
        "Allow popups in your browser to continue with Google.",

      "auth/unauthorized-domain":
        "This domain is not authorized in Firebase Authentication.",

      "auth/network-request-failed":
        "Network error. Check your internet connection.",

      "permission-denied":
        "Database permission denied. Check Firestore security rules."
    };

    return errors[error.code] ||
      error.message ||
      "Login failed. Please try again.";
  }


  // Custom errors
  function customError(error) {

    if (error.message === "USER_PROFILE_NOT_FOUND") {
      return "Your user profile was not found. Please contact support.";
    }

    if (error.message === "ACCOUNT_BLOCKED") {
      return "Your account is suspended or disabled. Contact support.";
    }

    return firebaseError(error);
  }


  // Check account and update login information
  async function verifyUserAndUpdate(user) {

    const userRef = doc(db, "users", user.uid);
    const snapshot = await getDoc(userRef);

    if (!snapshot.exists()) {
      await signOut(auth);
      throw new Error("USER_PROFILE_NOT_FOUND");
    }

    const data = snapshot.data();

    const blockedStatuses = [
      "suspended",
      "banned",
      "disabled"
    ];

    if (blockedStatuses.includes(data.status)) {
      await signOut(auth);
      throw new Error("ACCOUNT_BLOCKED");
    }

    await updateDoc(userRef, {

      lastLoginAt: serverTimestamp(),

      loginCount: increment(1),

      updatedAt: serverTimestamp(),

      email: user.email || data.email || "",

      emailVerified: user.emailVerified,

      displayName:
        user.displayName || data.displayName || ""

    });

    return data;
  }


  // Create Google user profile
  async function createGoogleProfile(user) {

    const userRef = doc(db, "users", user.uid);

    const snapshot = await getDoc(userRef);

    if (snapshot.exists()) {

      return await verifyUserAndUpdate(user);

    }

    const fullName = user.displayName || "";

    const nameParts = fullName.trim().split(/\s+/);

    const profile = {

      userId: user.uid,

      adminId: "",

      accountType: "student",

      role: "user",

      fullName: fullName,

      firstName: nameParts[0] || "",

      lastName: nameParts.slice(1).join(" "),

      displayName: fullName,

      username: "",

      email: user.email || "",

      phone: user.phoneNumber || "",

      phoneNumber: user.phoneNumber || "",

      photoURL: user.photoURL || "",

      bio: "",

      provider: "google",

      providers: ["google"],

      emailVerified: user.emailVerified,

      phoneVerified: false,

      status: "active",

      language: "en",

      timezone: "Africa/Dar_es_Salaam",

      country: "",

      region: "",

      city: "",

      address: "",

      educationLevel: "",

      occupation: "",

      organizationName: "",

      interests: [],

      skills: [],

      preferences: {
        theme: "light",
        language: "en"
      },

      notificationsEnabled: true,

      loginCount: 1,

      createdAt: serverTimestamp(),

      updatedAt: serverTimestamp(),

      lastLoginAt: serverTimestamp()

    };

    await setDoc(userRef, profile);

    return profile;
  }


  // Email and Password Login
  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email = document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();

    const password = document
      .getElementById("password")
      .value;

    loginButton.disabled = true;
    googleButton.disabled = true;

    loginButton.textContent = "Signing In...";

    try {

      const credential = await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      await verifyUserAndUpdate(credential.user);

      showMessage(
        "Login successful. Redirecting...",
        "success"
      );

      window.location.replace("course-dashboard.html");

    } catch (error) {

      console.error("Email login error:", error);

      showMessage(customError(error), "error");

      loginButton.disabled = false;
      googleButton.disabled = false;

      loginButton.textContent = "Sign In";

    }

  });


  // Google Login
  googleButton.addEventListener("click", async () => {

    googleButton.disabled = true;
    loginButton.disabled = true;

    googleButton.textContent = "Connecting to Google...";

    try {

      const provider = new GoogleAuthProvider();

      provider.setCustomParameters({
        prompt: "select_account"
      });

      const credential = await signInWithPopup(
        auth,
        provider
      );

      const user = credential.user;

      await createGoogleProfile(user);

      showMessage(
        "Google login successful. Redirecting...",
        "success"
      );

      window.location.replace("course-dashboard.html");

    } catch (error) {

      console.error("Google login error:", error);

      showMessage(customError(error), "error");

      googleButton.disabled = false;
      loginButton.disabled = false;

      googleButton.textContent = "Continue with Google";

    }

  });

</script>

</body>
</html>
