<h1>

</h1>

<p>

  </section></main><script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =====================================================
     FIREBASE
  ===================================================== */

  const firebaseConfig = {
    apiKey: "AIzaSyBcOYDfAVK5XbkljsyRgI_0rjodBn678tCc",
    authDomain: "let-s-study-pro-course.firebaseapp.com",
    databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId: "let-s-study-pro-course",
    storageBucket: "let-s-study-pro-course.firebasestorage.app",
    messagingSenderId: "474928293390",
    appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId: "G-85B7V5H5J0"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  /* =====================================================
     URL
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const courseId =
    (
      params.get("courseId") ||
      params.get("courseID") ||
      params.get("id") ||
      params.get("course") ||
      ""
    ).trim();


  const courseIdBox =
    document.getElementById(
      "courseIdBox"
    );


  /*
   * Never display "All Courses".
   * This page is strictly for one course.
   */

  courseIdBox.textContent =
    "Course ID: " +
    (courseId || "Missing");


  /* =====================================================
     HELPERS
  ===================================================== */

  function safe(value) {

    if (
      value === undefined ||
      value === null ||
      value === ""
    ) {
      return "—";
    }

    return String(value);
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     DATA
  ===================================================== */

  let MODULES = [];


  /* =====================================================
     ERROR
  ===================================================== */

  function showError(title, message) {

    const container =
      document.getElementById(
        "modulesContainer"
      );


    container.innerHTML = `

      <div class="state error">

        <div style="font-size:40px;">
          ⚠️
        </div>

        <h3 style="margin-top:12px;">
          ${escapeHtml(title)}
        </h3>

        <p style="margin-top:8px;">
          ${escapeHtml(message)}
        </p>

      </div>

    `;

  }


  /* =====================================================
     LOAD MODULES
  ===================================================== */

  async function loadModules() {

    const container =
      document.getElementById(
        "modulesContainer"
      );


    /*
     * STRICT REQUIREMENT:
     *
     * This page must always have a courseId.
     *
     * If courseId is missing, do NOT load
     * all modules.
     */

    if (!courseId) {

      showError(
        "Course ID is missing",
        "Please open this page using ?courseId=COURSE_ID"
      );

      return;

    }


    try {

      /*
       * IMPORTANT:
       *
       * Firestore filters at DATABASE level.
       *
       * We do NOT download the complete
       * modules collection.
       */

      const modulesQuery =
        query(
          collection(db, "modules"),
          where(
            "courseId",
            "==",
            courseId
          )
        );


      const snapshot =
        await getDocs(
          modulesQuery
        );


      MODULES = [];


      snapshot.forEach(docSnap => {

        const data =
          docSnap.data() || {};


        /*
         * Extra client-side safety check.
         */

        if (
          String(
            data.courseId || ""
          ) !==
          String(courseId)
        ) {

          return;

        }


        MODULES.push({

          ...data,

          id: docSnap.id,

          moduleId: docSnap.id,

          documentId: docSnap.id

        });

      });


      /*
       * Sort modules by order.
       */

      MODULES.sort((a, b) => {

        const orderA =
          Number(
            a.order ??
            a.moduleOrder ??
            999999
          );


        const orderB =
          Number(
            b.order ??
            b.moduleOrder ??
            999999
          );


        return orderA - orderB;

      });


      renderModules();


    } catch (error) {

      console.error(
        "Unable to load course modules:",
        error
      );


      /*
       * IMPORTANT:
       *
       * There is NO fallback such as:
       *
       * getDocs(collection(db,"modules"))
       *
       * because that could expose modules
       * from other courses.
       */

      showError(
        "Unable to load modules",
        "The modules for this course could not be loaded. Please try again."
      );

    }

  }


  /* =====================================================
     RENDER
  ===================================================== */

  function renderModules() {

    const container =
      document.getElementById(
        "modulesContainer"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const queryText =
      searchInput
        ? searchInput.value
            .trim()
            .toLowerCase()
        : "";


    const filtered =
      MODULES.filter(module => {

        if (!queryText) {
          return true;
        }


        const text = [

          module.title,

          module.description,

          module.courseId,

          module.status,

          module.createdBy,

          module.order

        ]
          .map(value =>
            safe(value)
              .toLowerCase()
          )
          .join(" ");


        return text.includes(
          queryText
        );

      });


    if (!filtered.length) {

      container.innerHTML = `

        <div class="state">

          <div style="font-size:40px;">
            📚
          </div>

          <h3 style="margin-top:12px;">
            No modules found
          </h3>

          <p style="margin-top:7px;">
            There are no modules available for this course.
          </p>

        </div>

      `;

      return;

    }


    container.innerHTML =
      filtered
        .map((module, index) => {

          const order =
            module.order !== undefined &&
            module.order !== null &&
            module.order !== ""
              ? module.order
              : index + 1;


          const moduleId =
            String(
              module.moduleId || ""
            );


          const selectedCourseId =
            String(
              module.courseId ||
              courseId
            );


          return `

            <article class="module">

              <div class="module-top">

                <div class="module-number">
                  ${escapeHtml(order)}
                </div>


                <div class="module-info">

                  <div class="module-title">

                    ${escapeHtml(
                      module.title ||
                      "Untitled Module"
                    )}

                  </div>


                  <div class="module-description">

                    ${escapeHtml(
                      module.description ||
                      "Continue learning through the lessons in this module."
                    )}

                  </div>


                  <span class="badge">

                    ${escapeHtml(
                      module.status ||
                      "published"
                    )}

                  </span>

                </div>

              </div>


              <div class="module-meta">

                <div class="meta-item">

                  📦 Module ID:
                  ${escapeHtml(moduleId)}

                </div>


                <div class="meta-item">

                  🔢 Order:
                  ${escapeHtml(order)}

                </div>


                <div class="meta-item">

                  📚 Course:
                  ${escapeHtml(selectedCourseId)}

                </div>

              </div>


              <button
                class="open-btn"
                data-module-id="${escapeHtml(moduleId)}"
                data-course-id="${escapeHtml(selectedCourseId)}"
              >
                View Lessons →
              </button>

            </article>

          `;

        })
        .join("");


    /*
     * Attach buttons safely after rendering.
     */

    container
      .querySelectorAll(
        ".open-btn"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const moduleId =
              button.dataset.moduleId;


            const selectedCourseId =
              button.dataset.courseId;


            openModule(
              moduleId,
              selectedCourseId
            );

          }
        );

      });

  }


  /* =====================================================
     OPEN MODULE
  ===================================================== */

  function openModule(
    moduleId,
    selectedCourseId
  ) {

    /*
     * Safety:
     * Never allow a module from another
     * course to be opened through this page.
     */

    if (
      String(selectedCourseId) !==
      String(courseId)
    ) {

      console.error(
        "Course mismatch blocked."
      );

      return;

    }


    if (!moduleId) {

      return;

    }


    window.location.href =
      "course-lesson.html" +
      "?moduleId=" +
      encodeURIComponent(
        moduleId
      ) +
      "&courseId=" +
      encodeURIComponent(
        courseId
      );

  }


  /* =====================================================
     SEARCH
  ===================================================== */

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      renderModules
    );


  /* =====================================================
     BACK
  ===================================================== */

  window.goBack =
    function() {

      if (
        window.history.length > 1
      ) {

        window.history.back();

      } else {

        window.location.href =
          "courses.html";

      }

    };


  /* =====================================================
     START
  ===================================================== */

  loadModules();

</script></body>
