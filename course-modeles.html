<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Course Modules | LetsStudy Pro</title>

<meta name="description"
content="Explore course modules and lessons on LetsStudy Pro.">

<link rel="icon" href="/favicon.ico">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.home-btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#eff6ff,#fff);
  padding:45px 6%;
}

.hero-inner{
  max-width:1200px;
  margin:auto;
}

.back{
  display:inline-block;
  color:#2563eb;
  text-decoration:none;
  margin-bottom:18px;
  font-size:14px;
}

.hero h1{
  font-size:36px;
  margin-bottom:10px;
}

.hero p{
  max-width:800px;
  color:#64748b;
  line-height:1.6;
}

.container{
  width:88%;
  max-width:1200px;
  margin:30px auto;
}

.course-summary{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:25px;
  box-shadow:0 5px 20px #0000000b;
  display:flex;
  gap:18px;
  align-items:center;
}

.course-image{
  width:110px;
  height:80px;
  object-fit:cover;
  border-radius:10px;
  background:#e5e7eb;
}

.course-info h2{
  margin-bottom:7px;
}

.course-info p{
  color:#64748b;
}

.modules{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.module{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 4px 18px #0000000a;
}

.module-header{
  width:100%;
  border:0;
  background:#fff;
  padding:20px;
  display:flex;
  align-items:center;
  gap:15px;
  text-align:left;
  cursor:pointer;
}

.module-header:hover{
  background:#f8fafc;
}

.module-number{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.module-main{
  flex:1;
}

.module-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:5px;
}

.module-description{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
}

.module-meta{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:8px;
  color:#64748b;
  font-size:13px;
}

.module-arrow{
  transition:.2s;
}

.module.open .module-arrow{
  transform:rotate(180deg);
}

.module-lessons{
  display:none;
  border-top:1px solid #edf0f4;
  padding:8px 18px 15px;
}

.module.open .module-lessons{
  display:block;
}

.lesson{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 5px;
  border-bottom:1px solid #f0f2f5;
}

.lesson:last-child{
  border-bottom:0;
}

.lesson-icon{
  width:38px;
  height:38px;
  border-radius:9px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#2563eb;
}

.lesson-info{
  flex:1;
}

.lesson-title{
  font-weight:600;
  margin-bottom:4px;
}

.lesson-meta{
  color:#64748b;
  font-size:12px;
}

.lesson-btn{
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:8px 12px;
  border-radius:7px;
  font-size:13px;
}

.empty,
.error{
  background:#fff;
  border-radius:14px;
  padding:60px 20px;
  text-align:center;
  color:#64748b;
}

.empty i,
.error i{
  font-size:38px;
  margin-bottom:15px;
}

.error h2{
  color:#172033;
  margin-bottom:8px;
}

.retry{
  display:inline-block;
  margin-top:15px;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}

.loading{
  text-align:center;
  padding:60px;
  color:#64748b;
}

@media(max-width:700px){

  .hero h1{
    font-size:28px;
  }

  .container{
    width:92%;
  }

  .course-summary{
    align-items:flex-start;
  }

  .course-image{
    width:80px;
    height:65px;
  }

  .lesson{
    align-items:flex-start;
  }

  .lesson-btn{
    padding:7px 9px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="home-btn"
    onclick="location.href='courses.html'"
  >
    <i class="fa-solid fa-arrow-left"></i>
    Courses
  </button>

</header>


<section class="hero">

  <div class="hero-inner">

    <a
      href="courses.html"
      class="back"
    >
      <i class="fa-solid fa-arrow-left"></i>
      Back to Courses
    </a>

    <h1 id="pageTitle">
      Course Modules
    </h1>

    <p id="pageDescription">
      Explore all modules and lessons in this course.
    </p>

  </div>

</section>


<main class="container">

  <div
    id="courseSummary"
    class="course-summary"
    style="display:none"
  ></div>


  <div
    id="modules"
    class="modules"
  >

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>
        Loading course modules...
      </p>

    </div>

  </div>

</main>


<script>

const API = "/api/data";


let courseId = "";

let course = null;

let modules = [];

let lessons = [];


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  loadPage
);


/* =====================================================
   PAGE LOAD
===================================================== */

async function loadPage(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  courseId =
    params.get("courseId") ||
    params.get("id") ||
    params.get("course");


  if(!courseId){

    showError(
      "Course ID is missing."
    );

    return;

  }


  try{

    await Promise.all([
      loadCourse(),
      loadModules(),
      loadLessons()
    ]);


    renderCourse();

    renderModules();

  }catch(error){

    console.error(
      "COURSE MODULES ERROR:",
      error
    );

    showError(
      "Unable to load course modules."
    );

  }

}


/* =====================================================
   API
===================================================== */

async function api(
  collection,
  params = ""
){

  const response =
    await fetch(
      `${API}?collection=${encodeURIComponent(
        collection
      )}${params}`,
      {
        method:"GET",
        headers:{
          "Accept":
            "application/json"
        },
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      `${collection} API error: ${response.status}`
    );

  }


  const result =
    await response.json();


  if(!result.success){

    throw new Error(
      result.error ||
      `Unable to load ${collection}`
    );

  }


  return result;

}


/* =====================================================
   COURSE
===================================================== */

async function loadCourse(){

  const result =
    await api(
      "courses",
      `&id=${encodeURIComponent(
        courseId
      )}`
    );


  course =
    result.data || {};

}


/* =====================================================
   MODULES
===================================================== */

async function loadModules(){

  const result =
    await api(
      "modules",
      "&limit=100"
    );


  modules =
    (result.results || [])
      .filter(
        module =>
          matchesCourse(
            module
          )
      )
      .sort(
        sortByOrder
      );

}


/* =====================================================
   LESSONS
===================================================== */

async function loadLessons(){

  const result =
    await api(
      "lessons",
      "&limit=100"
    );


  lessons =
    (result.results || [])
      .filter(
        lesson =>
          matchesCourse(
            lesson
          )
      )
      .sort(
        sortByOrder
      );

}


/* =====================================================
   COURSE MATCH
===================================================== */

function matchesCourse(
  item
){

  return (

    item.courseId ===
      courseId ||

    item.courseID ===
      courseId ||

    item.course ===
      courseId ||

    item.courseRef ===
      courseId ||

    item.parentCourseId ===
      courseId

  );

}


/* =====================================================
   SORT
===================================================== */

function sortByOrder(
  a,
  b
){

  const aOrder =
    Number(
      a.order ??
      a.position ??
      a.orderNumber ??
      999999
    );

  const bOrder =
    Number(
      b.order ??
      b.position ??
      b.orderNumber ??
      999999
    );

  return aOrder - bOrder;

}


/* =====================================================
   RENDER COURSE
===================================================== */

function renderCourse(){

  const title =
    course.title ||
    course.name ||
    "Course Modules";


  const description =
    course.description ||
    course.shortDescription ||
    "Explore all modules and lessons in this course.";


  document.title =
    `${title} Modules | LetsStudy Pro`;


  document.getElementById(
    "pageTitle"
  ).textContent =
    title;


  document.getElementById(
    "pageDescription"
  ).textContent =
    description;


  const summary =
    document.getElementById(
      "courseSummary"
    );


  summary.style.display =
    "flex";


  summary.innerHTML = `

    <img
      class="course-image"
      src="${safeImage(
        course.image ||
        course.thumbnail ||
        course.coverImage
      )}"
      alt="${escapeHTML(title)}"
      onerror="
        this.src='https://via.placeholder.com/300x200?text=Course';
      "
    >

    <div class="course-info">

      <h2>
        ${escapeHTML(title)}
      </h2>

      <p>

        ${lessons.length}
        ${
          lessons.length === 1
            ? "lesson"
            : "lessons"
        }

        •

        ${modules.length}
        ${
          modules.length === 1
            ? "module"
            : "modules"
        }

      </p>

    </div>

  `;

}


/* =====================================================
   RENDER MODULES
===================================================== */

function renderModules(){

  const container =
    document.getElementById(
      "modules"
    );


  if(!modules.length){

    /*
      Fallback:
      If there is no modules
      collection data, group lessons
      by moduleId/module.
    */

    renderFallbackModules(
      container
    );

    return;

  }


  container.innerHTML =
    modules
      .map(
        (module,index) =>
          createModule(
            module,
            index
          )
      )
      .join("");


  /*
    First module opens automatically.
  */

  const first =
    container.querySelector(
      ".module"
    );


  if(first){

    first.classList.add(
      "open"
    );

  }

}


/* =====================================================
   MODULE CARD
===================================================== */

function createModule(
  module,
  index
){

  const moduleId =
    module.id ||
    module.documentId ||
    "";


  const moduleLessons =
    lessons.filter(
      lesson =>
        lesson.moduleId ===
          moduleId ||

        lesson.moduleID ===
          moduleId ||

        lesson.module ===
          moduleId ||

        lesson.moduleRef ===
          moduleId
    );


  const title =
    module.title ||
    module.name ||
    `Module ${index + 1}`;


  return `

    <section
      class="module"
      data-module-id="${escapeHTML(
        moduleId
      )}"
    >

      <button
        class="module-header"
        type="button"
        onclick="toggleModule(this)"
      >

        <div class="module-number">
          ${index + 1}
        </div>

        <div class="module-main">

          <div class="module-title">
            ${escapeHTML(title)}
          </div>

          ${
            module.description ||
            module.shortDescription
              ? `
                <div class="module-description">
                  ${escapeHTML(
                    module.description ||
                    module.shortDescription
                  )}
                </div>
              `
              : ""
          }

          <div class="module-meta">

            <span>
              <i class="fa-solid fa-book-open"></i>

              ${moduleLessons.length}

              ${
                moduleLessons.length === 1
                  ? "Lesson"
                  : "Lessons"
              }

            </span>

            ${
              module.duration
                ? `
                  <span>
                    <i class="fa-regular fa-clock"></i>
                    ${escapeHTML(
                      String(
                        module.duration
                      )
                    )}
                  </span>
                `
                : ""
            }

          </div>

        </div>

        <i
          class="fa-solid fa-chevron-down module-arrow"
        ></i>

      </button>


      <div class="module-lessons">

        ${
          moduleLessons.length
            ? moduleLessons
                .map(
                  createLesson
                )
                .join("")
            : `
              <div class="empty">

                <i class="fa-solid fa-book"></i>

                <p>
                  No lessons available in this module yet.
                </p>

              </div>
            `
        }

      </div>

    </section>

  `;

}


/* =====================================================
   FALLBACK MODULES
===================================================== */

function renderFallbackModules(
  container
){

  if(!lessons.length){

    container.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-folder-open"></i>

        <h3>
          No modules available
        </h3>

        <p>
          Course modules will appear here when published.
        </p>

      </div>

    `;

    return;

  }


  /*
    Group lessons by module name.
  */

  const grouped = {};


  lessons.forEach(
    lesson => {

      const key =
        lesson.moduleId ||
        lesson.module ||
        lesson.moduleName ||
        "general";


      if(!grouped[key]){

        grouped[key] = [];

      }


      grouped[key].push(
        lesson
      );

    }
  );


  const keys =
    Object.keys(grouped);


  container.innerHTML =
    keys
      .map(
        (key,index) => {

          const group =
            grouped[key];


          const title =
            key === "general"
              ? "Course Lessons"
              : (
                  group[0].moduleName ||
                  key
                );


          return `

            <section class="module">

              <button
                class="module-header"
                type="button"
                onclick="toggleModule(this)"
              >

                <div class="module-number">
                  ${index + 1}
                </div>

                <div class="module-main">

                  <div class="module-title">
                    ${escapeHTML(title)}
                  </div>

                  <div class="module-meta">

                    <span>

                      <i class="fa-solid fa-book-open"></i>

                      ${group.length}

                      ${
                        group.length === 1
                          ? "Lesson"
                          : "Lessons"
                      }

                    </span>

                  </div>

                </div>

                <i
                  class="fa-solid fa-chevron-down module-arrow"
                ></i>

              </button>

              <div class="module-lessons">

                ${group
                  .map(
                    createLesson
                  )
                  .join("")}

              </div>

            </section>

          `;

        }
      )
      .join("");


  const first =
    container.querySelector(
      ".module"
    );


  if(first){

    first.classList.add(
      "open"
    );

  }

}


/* =====================================================
   LESSON
===================================================== */

function createLesson(
  lesson,
  index
){

  const lessonId =
    lesson.id ||
    lesson.documentId ||
    "";


  const url =
    lesson.url ||
    lesson.pageUrl ||
    (
      lessonId
        ? `lesson.html?lessonId=${encodeURIComponent(
            lessonId
          )}`
        : "#"
    );


  return `

    <div class="lesson">

      <div class="lesson-icon">

        <i class="fa-solid fa-play"></i>

      </div>


      <div class="lesson-info">

        <div class="lesson-title">

          ${escapeHTML(
            lesson.title ||
            lesson.name ||
            `Lesson ${index + 1}`
          )}

        </div>


        <div class="lesson-meta">

          ${
            lesson.duration
              ? `
                <span>
                  <i class="fa-regular fa-clock"></i>
                  ${escapeHTML(
                    String(
                      lesson.duration
                    )
                  )}
                </span>
              `
              : ""
          }

          ${
            lesson.type
              ? `
                •
                ${escapeHTML(
                  String(
                    lesson.type
                  )
                )}
              `
              : ""
          }

        </div>

      </div>


      ${
        url !== "#"
          ? `
            <a
              class="lesson-btn"
              href="${safeLink(url)}"
            >
              Open
              <i class="fa-solid fa-arrow-right"></i>
            </a>
          `
          : ""
      }

    </div>

  `;

}


/* =====================================================
   TOGGLE
===================================================== */

window.toggleModule =
function(button){

  const module =
    button.closest(
      ".module"
    );


  if(!module){

    return;

  }


  module.classList.toggle(
    "open"
  );

};


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
){

  document.getElementById(
    "modules"
  ).innerHTML = `

    <div class="error">

      <i class="fa-solid fa-triangle-exclamation"></i>

      <h2>
        Unable to load
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>

      <button
        class="retry"
        onclick="location.reload()"
      >
        Try Again
      </button>

    </div>

  `;

}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function safeImage(
  value
){

  if(!value){

    return
      "https://via.placeholder.com/600x300?text=LetsStudy+Pro";

  }


  const url =
    String(value).trim();


  if(
    url.startsWith("https://") ||
    url.startsWith("http://") ||
    url.startsWith("/")
  ){

    return escapeHTML(url);

  }


  return
    "https://via.placeholder.com/600x300?text=LetsStudy+Pro";

}


function safeLink(
  value
){

  if(!value){

    return "#";

  }


  const url =
    String(value).trim();


  if(
    url.startsWith("https://") ||
url.startsWith("http://")
    ? url
    : "#";
}


/* ================= SAFE HTML ================= */

function escapeHTML(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ================= LOAD MODULES ================= */

async function loadModules() {

  const courseId =
    new URLSearchParams(location.search)
      .get("courseId");

  if (!courseId) {
    showError("Course ID is missing.");
    return;
  }

  try {

    const response = await fetch(
      `/api/data?collection=modules&courseId=${encodeURIComponent(courseId)}&limit=100`
    );

    if (!response.ok) {
      throw new Error("API request failed");
    }

    const result = await response.json();

    if (!result.success) {
      throw new Error(result.error || "Unable to load modules");
    }

    const modules = Array.isArray(result.results)
      ? result.results
      : [];

    renderModules(modules);

  } catch (error) {

    console.error(error);

    showError(
      "Unable to load course modules."
    );

  }
}


/* ================= RENDER ================= */

function renderModules(modules) {

  const container =
    document.getElementById("modules");

  if (!container) return;

  if (!modules.length) {

    container.innerHTML = `
      <div class="empty">
        <h3>No modules available</h3>
        <p>
          Course modules have not been published yet.
        </p>
      </div>
    `;

    return;
  }

  modules.sort((a, b) => {

    const orderA =
      Number(
        a.order ??
        a.position ??
        a.moduleNumber ??
        9999
      );

    const orderB =
      Number(
        b.order ??
        b.position ??
        b.moduleNumber ??
        9999
      );

    return orderA - orderB;

  });

  container.innerHTML =
    modules.map((module, index) => {

      const moduleId =
        module.id ||
        module.documentId;

      const title =
        module.title ||
        module.name ||
        `Module ${index + 1}`;

      const description =
        module.description ||
        module.shortDescription ||
        "";

      const lessons =
        Number(
          module.lessonCount ||
          module.lessonsCount ||
          0
        );

      return `
        <article class="module-card">

          <div class="module-number">
            ${index + 1}
          </div>

          <div class="module-content">

            <h3>
              ${escapeHTML(title)}
            </h3>

            ${
              description
              ? `
                <p>
                  ${escapeHTML(description)}
                </p>
              `
              : ""
            }

            ${
              lessons
              ? `
                <span class="module-meta">
                  ${lessons}
                  lesson${lessons === 1 ? "" : "s"}
                </span>
              `
              : ""
            }

          </div>

          <a
            class="module-btn"
            href="course.html?courseId=${encodeURIComponent(
              new URLSearchParams(location.search)
                .get("courseId") || ""
            )}&moduleId=${encodeURIComponent(moduleId)}"
          >
            Open
            <i class="fa-solid fa-arrow-right"></i>
          </a>

        </article>
      `;

    }).join("");
}


/* ================= ERROR ================= */

function showError(message) {

  const container =
    document.getElementById("modules");

  if (!container) return;

  container.innerHTML = `
    <div class="empty error">

      <i class="fa-solid fa-triangle-exclamation"></i>

      <h3>
        Something went wrong
      </h3>

      <p>
        ${escapeHTML(message)}
      </p>

      <button
        class="retry-btn"
        onclick="loadModules()"
      >
        Try Again
      </button>

    </div>
  `;
}


/* ================= START ================= */

loadModules();

</script>
