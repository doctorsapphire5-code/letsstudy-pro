<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Course Modules | LetsStudy Pro</title>

  <meta
    name="description"
    content="Explore course modules and lessons on LetsStudy Pro."
  >

  <link rel="icon" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      height: 70px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      color: #2563eb;
    }

    .back-btn {
      border: none;
      background: #eef2ff;
      color: #2563eb;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    main {
      max-width: 1150px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .hero {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border-radius: 22px;
      padding: 35px;
      margin-bottom: 25px;
      box-shadow: 0 15px 35px rgba(37, 99, 235, .18);
    }

    .hero small {
      opacity: .85;
    }

    .hero h1 {
      margin-top: 8px;
      font-size: 32px;
    }

    .hero p {
      margin-top: 10px;
      opacity: .9;
    }

    .course-id {
      margin-top: 18px;
      background: rgba(255,255,255,.14);
      padding: 10px 14px;
      border-radius: 10px;
      display: inline-block;
      font-size: 13px;
    }

    .toolbar {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 22px;
      border: 1px solid #e5e7eb;
    }

    .search {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #dbe0e8;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    .search:focus {
      border-color: #2563eb;
    }

    .modules {
      display: grid;
      gap: 18px;
    }

    .module {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 23px;
      transition: .2s;
    }

    .module:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,.06);
    }

    .module-top {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .module-number {
      min-width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #eff6ff;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .module-info {
      flex: 1;
    }

    .module-title {
      font-size: 20px;
      font-weight: 800;
    }

    .module-description {
      margin-top: 7px;
      color: #667085;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #ecfdf3;
      color: #087443;
      font-size: 12px;
      font-weight: 700;
    }

    .module-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      color: #667085;
      font-size: 13px;
    }

    .meta-item {
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
    }

    .open-btn {
      margin-top: 20px;
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 13px;
      border-radius: 11px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
    }

    .open-btn:hover {
      background: #1d4ed8;
    }

    .state {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 18px;
      color: #667085;
    }

    .error {
      color: #b42318;
      background: #fef3f2;
    }

    @media (max-width: 700px) {
      header {
        padding: 0 15px;
      }

      main {
        padding: 20px 14px 40px;
      }

      .hero {
        padding: 25px 20px;
        border-radius: 18px;
      }

      .hero h1 {
        font-size: 25px;
      }

      .module {
        padding: 18px;
      }

      .module-top {
        gap: 12px;
      }

      .module-number {
        min-width: 42px;
        height: 42px;
      }

      .module-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">🎓 LetsStudy Pro</div>

  <button class="back-btn" onclick="goBack()">
    ← Back
  </button>
</header>

<main>

  <section class="hero">

    <small>Course / Modules</small>

    <h1>Course Modules</h1>

    <p>
      Explore the modules available in this course and continue learning
      step by step.
    </p>

    <div class="course-id" id="courseIdBox">
      Course ID: —
    </div>

  </section>

  <section class="toolbar">

    <input
      type="search"
      id="searchInput"
      class="search"
      placeholder="Search modules..."
    >

  </section>

  <section id="modulesContainer" class="modules">

    <div class="state">
      Loading modules...
    </div>

  </section>

</main>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =====================================================
     FIREBASE
  ===================================================== */

  const firebaseConfig = {
    apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
    authDomain: "let-s-study-pro-course.firebaseapp.com",
    databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId: "let-s-study-pro-course",
    storageBucket: "let-s-study-pro-course.firebasestorage.app",
    messagingSenderId: "474928293390",
    appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId: "G-85B7V5H5J0"
  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  /* =====================================================
     URL
  ===================================================== */

  const params = new URLSearchParams(window.location.search);

  const courseId =
    params.get("courseId") ||
    params.get("id") ||
    "";


  document.getElementById("courseIdBox").textContent =
    "Course ID: " + (courseId || "All Courses");


  /* =====================================================
     HELPERS
  ===================================================== */

  function safe(value) {

    if (
      value === undefined ||
      value === null ||
      value === ""
    ) {
      return "—";
    }

    return String(value);
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =====================================================
     DATA
  ===================================================== */

  let MODULES = [];


  async function loadModules() {

    const container =
      document.getElementById("modulesContainer");

    try {

      const snapshot =
        await getDocs(
          collection(db, "modules")
        );


      MODULES = [];


      snapshot.forEach(docSnap => {

        const data = docSnap.data() || {};

        const documentId = docSnap.id;


        MODULES.push({

          ...data,

          id: documentId,

          moduleId: documentId,

          documentId: documentId

        });

      });


      /*
        IMPORTANT:

        Filter by courseId first.
        This prevents modules belonging to another
        course from appearing in this course.
      */

      if (courseId) {

        MODULES = MODULES.filter(
          module =>
            String(module.courseId || "") ===
            String(courseId)
        );

      }


      MODULES.sort((a, b) => {

        const orderA =
          Number(a.order ?? 999999);

        const orderB =
          Number(b.order ?? 999999);

        return orderA - orderB;

      });


      renderModules();

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="state error">
          <h3>Unable to load modules</h3>

          <p style="margin-top:8px;">
            ${escapeHtml(error.message)}
          </p>
        </div>
      `;

    }

  }


  /* =====================================================
     RENDER
  ===================================================== */

  function renderModules() {

    const container =
      document.getElementById("modulesContainer");

    const query =
      document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const filtered =
      MODULES.filter(module => {

        if (!query) return true;


        const text = [

          module.title,

          module.description,

          module.courseId,

          module.status,

          module.createdBy,

          module.order

        ]
        .map(value => safe(value).toLowerCase())
        .join(" ");


        return text.includes(query);

      });


    if (!filtered.length) {

      container.innerHTML = `
        <div class="state">

          <div style="font-size:40px;">
            📚
          </div>

          <h3 style="margin-top:12px;">
            No modules found
          </h3>

          <p style="margin-top:7px;">
            There are no modules available for this course.
          </p>

        </div>
      `;

      return;

    }


    container.innerHTML =
      filtered.map((module, index) => {

        const order =
          module.order !== undefined &&
          module.order !== null &&
          module.order !== ""
            ? module.order
            : index + 1;


        return `

          <article class="module">

            <div class="module-top">

              <div class="module-number">
                ${escapeHtml(order)}
              </div>


              <div class="module-info">

                <div class="module-title">
                  ${escapeHtml(
                    module.title || "Untitled Module"
                  )}
                </div>


                <div class="module-description">

                  ${escapeHtml(
                    module.description ||
                    "Continue learning through the lessons in this module."
                  )}

                </div>


                <span class="badge">

                  ${escapeHtml(
                    module.status || "published"
                  )}

                </span>

              </div>

            </div>


            <div class="module-meta">

              <div class="meta-item">
                📦 Module ID:
                ${escapeHtml(module.moduleId)}
              </div>


              <div class="meta-item">
                🔢 Order:
                ${escapeHtml(order)}
              </div>


              <div class="meta-item">
                📚 Course:
                ${escapeHtml(module.courseId)}
              </div>

            </div>


            <button
              class="open-btn"
              onclick="openModule('${encodeURIComponent(module.moduleId)}','${encodeURIComponent(module.courseId || courseId)}')"
            >
              View Lessons →
            </button>

          </article>

        `;

      }).join("");

  }


  /* =====================================================
     OPEN MODULE
  ===================================================== */

  window.openModule =
    function(moduleId, selectedCourseId) {

      window.location.href =
        "course-lesson.html" +
        "?moduleId=" +
        moduleId +
        "&courseId=" +
        selectedCourseId;

    };


  /* =====================================================
     SEARCH
  ===================================================== */

  document
    .getElementById("searchInput")
    .addEventListener("input", renderModules);


  /* =====================================================
     BACK
  ===================================================== */

  window.goBack = function() {

    if (history.length > 1) {

      history.back();

    } else {

      window.location.href = "courses.html";

    }

  };


  /* =====================================================
     START
  ===================================================== */

  loadModules();

</script>

</body>
</html>
