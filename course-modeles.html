<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Course Modules | LetsStudy Pro</title>

<meta name="description"
content="Explore course modules and lessons on LetsStudy Pro.">

<link rel="icon" href="favicon.ico">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e8ebf2;
  position:sticky;
  top:0;
  z-index:50;
}

.header-inner{
  max-width:1150px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  color:#111827;
  text-decoration:none;
  font-size:21px;
  font-weight:900;
}

.logo span{
  color:#2563eb;
}

.back{
  color:#2563eb;
  text-decoration:none;
  font-weight:700;
}

.container{
  max-width:1050px;
  margin:40px auto;
  padding:0 20px;
}

.hero{
  background:#fff;
  border:1px solid #e5e9f0;
  border-radius:20px;
  padding:30px;
  margin-bottom:25px;
  box-shadow:0 8px 30px rgba(15,23,42,.05);
}

.badge{
  display:inline-block;
  padding:7px 11px;
  border-radius:999px;
  background:#eaf2ff;
  color:#2563eb;
  font-size:12px;
  font-weight:800;
  margin-bottom:14px;
}

h1{
  margin:0 0 10px;
  font-size:34px;
  line-height:1.2;
}

.description{
  margin:0;
  color:#667085;
  line-height:1.7;
}

.module{
  background:#fff;
  border:1px solid #e5e9f0;
  border-radius:17px;
  margin-bottom:16px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(15,23,42,.04);
}

.module-header{
  width:100%;
  border:0;
  background:#fff;
  padding:21px 22px;
  display:flex;
  align-items:center;
  gap:15px;
  cursor:pointer;
  text-align:left;
}

.module-header:hover{
  background:#f8fafc;
}

.module-number{
  width:42px;
  height:42px;
  min-width:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:#eef4ff;
  color:#2563eb;
  font-weight:900;
}

.module-info{
  flex:1;
}

.module-title{
  font-weight:850;
  font-size:17px;
  margin-bottom:5px;
}

.module-meta{
  color:#667085;
  font-size:13px;
}

.arrow{
  font-size:21px;
  color:#667085;
  transition:.2s;
}

.module.open .arrow{
  transform:rotate(180deg);
}

.lessons{
  max-height:0;
  overflow:hidden;
  transition:max-height .25s ease;
  border-top:1px solid transparent;
}

.module.open .lessons{
  border-top-color:#edf0f5;
}

.lesson{
  display:flex;
  align-items:center;
  gap:14px;
  padding:17px 22px;
  border-bottom:1px solid #f0f2f6;
}

.lesson:last-child{
  border-bottom:0;
}

.lesson-icon{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:9px;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.lesson-info{
  flex:1;
}

.lesson-title{
  font-weight:700;
  font-size:14px;
}

.lesson-meta{
  color:#667085;
  font-size:12px;
  margin-top:4px;
}

.lesson-action{
  color:#2563eb;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.loading,
.error,
.empty{
  background:#fff;
  border:1px solid #e5e9f0;
  border-radius:18px;
  padding:45px 25px;
  text-align:center;
}

.error{
  background:#fff7f7;
  color:#b42318;
  border-color:#ffd6d6;
}

.empty{
  color:#667085;
}

.hidden{
  display:none!important;
}

footer{
  text-align:center;
  padding:35px 20px;
  color:#667085;
  font-size:13px;
}

@media(max-width:650px){

  .container{
    margin:25px auto;
  }

  .hero{
    padding:24px 20px;
  }

  h1{
    font-size:28px;
  }

  .module-header{
    padding:17px;
  }

  .lesson{
    padding:15px 17px;
  }

  .lesson-action{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      LetsStudy <span>Pro</span>
    </a>

    <a href="#" id="backLink" class="back">
      ← Course
    </a>

  </div>
</header>


<main class="container">

  <div id="loading" class="loading">
    Loading course modules...
  </div>

  <div id="errorBox" class="error hidden"></div>

  <section id="content" class="hidden">

    <div class="hero">

      <div class="badge">
        COURSE MODULES
      </div>

      <h1 id="courseTitle">
        Course Modules
      </h1>

      <p id="courseDescription" class="description"></p>

    </div>

    <div id="modulesList"></div>

    <div id="empty" class="empty hidden">
      <h2>No modules available</h2>
      <p>
        Modules and lessons for this course have not been
        added yet.
      </p>
    </div>

  </section>

</main>


<footer>
  © <span id="year"></span> LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVK5XbkljsyRgI_0rj0odBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("errorBox");

const content =
  document.getElementById("content");

const empty =
  document.getElementById("empty");

const modulesList =
  document.getElementById("modulesList");

const courseTitle =
  document.getElementById("courseTitle");

const courseDescription =
  document.getElementById("courseDescription");

const backLink =
  document.getElementById("backLink");

document.getElementById("year")
  .textContent = new Date().getFullYear();


/* =====================================================
   COURSE ID
===================================================== */

const params =
  new URLSearchParams(window.location.search);

const courseId =
  params.get("id");


/* =====================================================
   HELPERS
===================================================== */

function first(obj, fields, fallback=""){

  for(const field of fields){

    if(
      obj &&
      obj[field] !== undefined &&
      obj[field] !== null &&
      String(obj[field]).trim() !== ""
    ){
      return obj[field];
    }

  }

  return fallback;
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   LESSON NORMALIZATION
===================================================== */

function normalizeLessons(module){

  const source =
    first(
      module,
      [
        "lessons",
        "items",
        "contents"
      ],
      []
    );

  if(!Array.isArray(source)){
    return [];
  }

  return source.map(
    (lesson,index) => {

      if(typeof lesson === "string"){

        return {
          title:lesson,
          duration:"",
          type:"Lesson",
          index:index + 1
        };

      }

      return {

        title:first(
          lesson,
          [
            "title",
            "name",
            "lessonTitle"
          ],
          `Lesson ${index + 1}`
        ),

        duration:first(
          lesson,
          [
            "duration",
            "length",
            "time"
          ],
          ""
        ),

        type:first(
          lesson,
          [
            "type",
            "lessonType",
            "contentType"
          ],
          "Lesson"
        ),

        /*
          Internal ID is intentionally not displayed.
        */

        index:index + 1

      };

    }
  );

}


/* =====================================================
   MODULE NORMALIZATION
===================================================== */

function normalizeModules(course){

  const source =
    first(
      course,
      [
        "modules",
        "sections",
        "courseModules",
        "curriculum"
      ],
      []
    );

  if(!Array.isArray(source)){
    return [];
  }

  return source.map(
    (module,index) => {

      if(typeof module === "string"){

        return {
          title:module,
          description:"",
          lessons:[],
          index:index + 1
        };

      }

      return {

        title:first(
          module,
          [
            "title",
            "name",
            "moduleTitle",
            "sectionTitle"
          ],
          `Module ${index + 1}`
        ),

        description:first(
          module,
          [
            "description",
            "summary"
          ],
          ""
        ),

        lessons:
          normalizeLessons(module),

        index:index + 1

      };

    }
  );

}


/* =====================================================
   RENDER MODULES
===================================================== */

function renderModules(modules){

  modulesList.innerHTML = "";

  if(modules.length === 0){

    empty.classList.remove("hidden");

    return;
  }

  empty.classList.add("hidden");


  modules.forEach(
    (module,index) => {

      const lessons =
        module.lessons || [];

      const wrapper =
        document.createElement("section");

      wrapper.className = "module";


      const lessonWord =
        lessons.length === 1
          ? "lesson"
          : "lessons";


      wrapper.innerHTML = `

        <button
          class="module-header"
          type="button"
          aria-expanded="false">

          <span class="module-number">
            ${index + 1}
          </span>

          <span class="module-info">

            <span class="module-title">
              ${escapeHTML(module.title)}
            </span>

            <span class="module-meta">
              ${lessons.length} ${lessonWord}
            </span>

          </span>

          <span class="arrow">
            ▼
          </span>

        </button>

        <div class="lessons">

          ${
            lessons.length
              ? lessons.map(
                  lesson => `

                    <div class="lesson">

                      <div class="lesson-icon">
                        ${
                          String(lesson.type)
                            .toLowerCase()
                            .includes("video")
                            ? "▶"
                            : "▤"
                        }
                      </div>

                      <div class="lesson-info">

                        <div class="lesson-title">
                          ${escapeHTML(lesson.title)}
                        </div>

                        <div class="lesson-meta">

                          ${escapeHTML(lesson.type)}

                          ${
                            lesson.duration
                              ? " • " +
                                escapeHTML(
                                  lesson.duration
                                )
                              : ""
                          }

                        </div>

                      </div>

                      <a
                        class="lesson-action"
                        href="course-learn.html?id=${encodeURIComponent(courseId)}">

                        Open

                      </a>

                    </div>

                  `
                ).join("")
              : `
                  <div class="lesson">

                    <div class="lesson-info">

                      <div class="lesson-title">
                        No lessons added
                      </div>

                    </div>

                  </div>
                `
          }

        </div>
      `;


      const button =
        wrapper.querySelector(
          ".module-header"
        );

      const lessonsPanel =
        wrapper.querySelector(
          ".lessons"
        );


      button.addEventListener(
        "click",
        () => {

          const isOpen =
            wrapper.classList.contains("open");


          document
            .querySelectorAll(".module.open")
            .forEach(other => {

              other.classList.remove("open");

              const otherButton =
                other.querySelector(
                  ".module-header"
                );

              const otherPanel =
                other.querySelector(
                  ".lessons"
                );

              otherButton.setAttribute(
                "aria-expanded",
                "false"
              );

              otherPanel.style.maxHeight =
                null;

            });


          if(!isOpen){

            wrapper.classList.add("open");

            button.setAttribute(
              "aria-expanded",
              "true"
            );

            lessonsPanel.style.maxHeight =
              lessonsPanel.scrollHeight + "px";

          }

        }
      );


      modulesList.appendChild(wrapper);

    }
  );

}


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse(){

  if(!courseId){

    loading.classList.add("hidden");

    errorBox.textContent =
      "Course information could not be identified.";

    errorBox.classList.remove("hidden");

    return;
  }


  try{

    /*
      Firebase document reference:

      courses/{COURSE_ID}

      The ID is internal only.
    */

    const courseRef =
      doc(
        db,
        "courses",
        courseId
      );

    const snapshot =
      await getDoc(courseRef);


    if(!snapshot.exists()){

      loading.classList.add("hidden");

      errorBox.textContent =
        "This course could not be found.";

      errorBox.classList.remove("hidden");

      return;
    }


    const course =
      snapshot.data();


    const title =
      first(
        course,
        [
          "title",
          "name",
          "courseTitle"
        ],
        "Course Modules"
      );


    const description =
      first(
        course,
        [
          "description",
          "shortDescription",
          "summary"
        ],
        "Explore the modules and lessons available in this course."
      );


    courseTitle.textContent =
      title;

    courseDescription.textContent =
      description;


    document.title =
      `${title} Modules | LetsStudy Pro`;


    backLink.href =
      `course-details.html?id=${encodeURIComponent(courseId)}`;


    const modules =
      normalizeModules(course);


    renderModules(modules);


    loading.classList.add("hidden");

    content.classList.remove("hidden");


  }catch(error){

    console.error(
      "Course modules error:",
      error
    );

    loading.classList.add("hidden");

    errorBox.textContent =
      "Unable to load the course modules. Please try again.";

    errorBox.classList.remove("hidden");

  }

}


/* =====================================================
   START
===================================================== */

loadCourse();

</script>

</body>
</html>
