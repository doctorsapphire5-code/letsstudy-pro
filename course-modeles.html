<style>
:root{
  --ink:#0d1b2a;--ink-2:#16293f;--paper:#f2f5f9;--card:#fff;--line:#dde4ec;
  --mute:#5b6b7e;--brand:#0a7c66;--brand-soft:#e2f4ef;--amber:#f2a93b;
  --head:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.i{width:17px;height:17px;min-width:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,5%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:20px;font-weight:700;letter-spacing:-.3px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--amber);display:grid;place-items:center;font-size:16px}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:600}
.back-btn:hover{background:var(--ink-2)}
.back-btn .i{width:15px;height:15px;transform:rotate(180deg)}

.container{flex:1;width:min(900px,92%);margin:0 auto;padding:30px 0 64px}

/* HERO */
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:34px 36px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;border:40px solid rgba(242,169,59,.08);pointer-events:none}
.hero > *{position:relative;z-index:1}
.eyebrow{font-size:13px;font-weight:600;color:var(--amber);margin-bottom:8px}
.hero h1{font-family:var(--head);font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.8px;margin-bottom:10px}
.hero p{color:#b6c3d2;max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.1);color:#dbe4ee;font-size:13px;font-weight:500}
.chip:empty{display:none}

/* SEARCH */
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px}
.search{position:relative;display:block}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--line);border-radius:11px;background:var(--paper);font:500 15px var(--body);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}

/* MODULES */
.modules{display:grid;gap:14px}
.module{display:grid;grid-template-columns:auto 1fr;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;transition:border-color .2s,transform .2s}
.module:hover{border-color:var(--brand);transform:translateY(-2px)}
.module.complete{--m:var(--brand)}
.num{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-family:var(--head);font-size:20px;font-weight:700}
.module.complete .num{background:var(--brand);color:#fff}
.num .i{width:22px;height:22px;stroke-width:2.6}
.module h2{font-family:var(--head);font-size:20px;line-height:1.28;letter-spacing:-.3px}
.module .desc{margin-top:6px;color:var(--mute);max-width:64ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;background:var(--paper);color:#3b4a5d;font-size:13px;font-weight:500}
.tag.state{background:#fdf0d6;color:#8a5a06;font-weight:700;text-transform:capitalize}
.bar{height:6px;border-radius:20px;background:#e6ebf1;overflow:hidden;margin-top:16px}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:20px;transition:width .5s}
.open{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:11px 18px;border-radius:11px;background:var(--ink);color:#fff;font-weight:700;font-size:14.5px;transition:background .2s,transform .2s}
.open:hover{background:var(--ink-2)}
.open.go{background:var(--amber);color:var(--ink)}
.open.go:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(242,169,59,.35)}

/* STATES */
.empty,.error{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:48px 24px;text-align:center;color:var(--mute)}
.empty h3,.error h3{font-family:var(--head);font-size:19px;color:var(--ink);margin-bottom:6px}
.state-icon{width:54px;height:54px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.state-icon .i{width:26px;height:26px}
.error{border-color:#fecaca}
.error .state-icon{background:#fee2e2;color:#b91c1c}
.retry{margin-top:16px;padding:11px 20px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 14px var(--body);cursor:pointer}
@keyframes sh{to{background-position:-200% 0}}
.sk{height:150px;border-radius:18px;background:linear-gradient(90deg,#e6ebf1 25%,#f4f7fa 50%,#e6ebf1 75%) 0 0/200% 100%;animation:sh 1.4s linear infinite}

.footer{padding:26px;background:#fff;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:14px}

@media(max-width:600px){
  .container{padding:18px 0 44px}
  .hero{padding:26px 22px}
  .module{grid-template-columns:1fr;gap:12px;padding:18px}
  .num{width:42px;height:42px;font-size:18px}
  .module h2{font-size:18px}
  .open{width:100%;justify-content:center}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
</svg>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">L</span>LetsStudy Pro</a>
  <a class="back-btn" id="backBtn" href="courses.html"><svg class="i"><use href="#i-arrow"/></svg>Back to course</a>
</header>

<main class="container">
  <section class="hero">
    <div class="eyebrow">Course / Modules</div>
    <h1>Course modules</h1>
    <p>Work through the course one module at a time. Each module groups related lessons together.</p>
    <div class="chips">
      <span class="chip" id="courseName"></span>
      <span class="chip" id="moduleChip"></span>
      <span class="chip" id="lessonChip"></span>
      <span class="chip" id="progressChip"></span>
    </div>
  </section>

  <div class="toolbar">
    <label class="search">
      <svg class="i"><use href="#i-search"/></svg>
      <input type="search" id="searchInput" placeholder="Search modules" aria-label="Search modules" autocomplete="off">
    </label>
  </div>

  <section id="modulesContainer" class="modules" aria-live="polite">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </section>
</main>

<footer class="footer">© 2026 LetsStudy Pro. Learn. Build. Grow.</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const db = getFirestore(initializeApp(firebaseConfig));

/* URL: this page is strictly for one course */
const params = new URLSearchParams(window.location.search);
const courseId = (params.get("courseId") || params.get("courseID") || params.get("id") || params.get("course") || "").trim();

const $ = (id) => document.getElementById(id);
const container = $("modulesContainer"), searchInput = $("searchInput");
const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const escapeHtml = (v) => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const HIDDEN = ["draft","private","disabled"];
const isDone = (lessonId) => { try{ return localStorage.getItem(`lessonCompleted_${courseId}_${lessonId}`) === "true"; }catch(e){ return false; } };

let MODULES = [], LESSONS = [];

if(courseId) $("backBtn").href = `course-learn.html?courseId=${encodeURIComponent(courseId)}`;

function showError(title, message, retry){
  container.innerHTML = `
    <div class="error"><div class="state-icon">${icon("alert")}</div>
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(message)}</p>
      ${retry ? `<button class="retry" id="retryBtn" type="button">Try again</button>` : ""}
    </div>`;
  if(retry) $("retryBtn").addEventListener("click", () => window.location.reload());
}

/* LOAD: Firestore filters by courseId. There is no fallback that loads every module. */
async function loadModules(){
  if(!courseId){
    showError("Course ID is missing", "Open the modules from a course page, or use a link like course-modeles.html?courseId=COURSE_ID.", false);
    return;
  }

  try{
    const [modSnap, lessonSnap, courseSnap] = await Promise.all([
      getDocs(query(collection(db, "modules"), where("courseId", "==", courseId))),
      getDocs(query(collection(db, "lessons"), where("courseId", "==", courseId))).catch(() => null),
      getDoc(doc(db, "courses", courseId)).catch(() => null)
    ]);

    MODULES = [];
    modSnap.forEach((d) => {
      const data = d.data() || {};
      if(String(data.courseId || "") !== String(courseId)) return;
      if(HIDDEN.includes(String(data.status || "").toLowerCase())) return;
      MODULES.push({ ...data, id: d.id });
    });
    MODULES.sort((a, b) => Number(a.order ?? a.moduleOrder ?? 999999) - Number(b.order ?? b.moduleOrder ?? 999999));

    LESSONS = [];
    if(lessonSnap) lessonSnap.forEach((d) => {
      const data = d.data() || {};
      if(String(data.courseId || "") !== String(courseId)) return;
      if(HIDDEN.includes(String(data.status || data.lessonStatus || "").toLowerCase())) return;
      LESSONS.push({ ...data, id: d.id });
    });

    const c = courseSnap && courseSnap.exists() ? courseSnap.data() : {};
    $("courseName").textContent = c.title || c.name || c.courseName || "";
    $("moduleChip").textContent = `${MODULES.length} ${MODULES.length === 1 ? "module" : "modules"}`;
    if(LESSONS.length){
      const done = LESSONS.filter(l => isDone(l.id)).length;
      $("lessonChip").textContent = `${LESSONS.length} lessons`;
      $("progressChip").textContent = `${Math.round(done / LESSONS.length * 100)}% complete`;
    }

    renderModules();
  }catch(error){
    console.error("Unable to load course modules:", error);
    showError("Unable to load modules", "The modules for this course could not be loaded. Check your connection and try again.", true);
  }
}

/* RENDER */
function renderModules(){
  const q = searchInput.value.trim().toLowerCase();
  const items = MODULES.map((m, i) => ({ m, i })).filter(({ m }) => !q || [m.title, m.description, m.status].filter(Boolean).join(" ").toLowerCase().includes(q));

  if(!items.length){
    const none = !MODULES.length;
    container.innerHTML = `
      <div class="empty"><div class="state-icon">${icon(none ? "layers" : "search")}</div>
        <h3>${none ? "No modules yet" : "No matching modules"}</h3>
        <p>${none ? "Modules will appear here as soon as they are added to this course." : "Try different words."}</p>
      </div>`;
    return;
  }

  container.innerHTML = items.map(({ m, i }) => {
    const lessons = LESSONS.filter(l => String(l.moduleId || "") === String(m.id));
    const total = lessons.length;
    const done = lessons.filter(l => isDone(l.id)).length;
    const complete = total > 0 && done === total;
    const status = String(m.status || "").toLowerCase();
    const label = !total ? "View module" : complete ? "Review module" : done ? "Continue" : "Start module";
    const href = `course-lesson.html?courseId=${encodeURIComponent(courseId)}&moduleId=${encodeURIComponent(m.id)}`;
    return `
      <article class="module${complete ? " complete" : ""}">
        <div class="num">${complete ? icon("check") : i + 1}</div>
        <div>
          <h2>${escapeHtml(m.title || "Untitled module")}</h2>
          <p class="desc">${escapeHtml(m.description || "Continue learning through the lessons in this module.")}</p>
          <div class="meta">
            ${total ? `<span class="tag">${icon("play")}${total} ${total === 1 ? "lesson" : "lessons"}</span><span class="tag">${icon("check")}${done} of ${total} done</span>` : ""}
            ${status && status !== "published" && status !== "active" ? `<span class="tag state">${escapeHtml(status)}</span>` : ""}
          </div>
          ${total ? `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(done / total * 100)}"><i style="width:${Math.round(done / total * 100)}%"></i></div>` : ""}
          <a class="open${total && !complete ? " go" : ""}" href="${href}">${label}${icon("arrow")}</a>
        </div>
      </article>`;
  }).join("");
}

searchInput.addEventListener("input", renderModules);

/* Refresh progress when the learner returns to this tab */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && MODULES.length){
    if(LESSONS.length) $("progressChip").textContent = `${Math.round(LESSONS.filter(l => isDone(l.id)).length / LESSONS.length * 100)}% complete`;
    renderModules();
  }
});

loadModules();
</script>
</body>
