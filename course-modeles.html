<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Course Modules | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}


/* HEADER */

.header{
background:#fff;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.header-top{
display:flex;
align-items:center;
gap:12px;
}

.header-icon{
width:48px;
height:48px;
border-radius:12px;
background:#eff6ff;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:21px;
}

.header h1{
margin:0;
font-size:22px;
}

.header p{
margin:8px 0 0;
color:#64748b;
font-size:13px;
}

.course-name{
margin-top:12px;
font-weight:bold;
color:#2563eb;
}


/* MODULES */

.modules{
display:flex;
flex-direction:column;
gap:12px;
}

.module{
background:#fff;
border-radius:14px;
padding:16px;
box-shadow:0 4px 18px rgba(0,0,0,.05);
display:flex;
gap:13px;
align-items:flex-start;
}

.module-number{
width:42px;
height:42px;
border-radius:50%;
background:#eff6ff;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:15px;
flex-shrink:0;
}

.module-content{
flex:1;
}

.module-title{
font-size:15px;
font-weight:bold;
margin-bottom:5px;
}

.module-description{
font-size:13px;
color:#64748b;
line-height:1.5;
}

.module-meta{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:10px;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:10px;
font-weight:bold;
}

.status-active,
.status-published{
background:#dcfce7;
color:#166534;
}

.status-draft{
background:#fef3c7;
color:#92400e;
}

.status-inactive{
background:#fee2e2;
color:#991b1b;
}

.status-default{
background:#e2e8f0;
color:#475569;
}

.order{
background:#f1f5f9;
color:#475569;
}

.module-arrow{
color:#94a3b8;
padding-top:12px;
}


/* EMPTY */

.empty{
background:#fff;
padding:40px 20px;
border-radius:14px;
text-align:center;
color:#64748b;
box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.empty i{
font-size:35px;
margin-bottom:10px;
}


/* LOADING */

.loading{
background:#fff;
padding:40px 20px;
border-radius:14px;
text-align:center;
color:#64748b;
}

.loading i{
font-size:28px;
}


/* ERROR */

.error{
background:#fee2e2;
color:#991b1b;
padding:18px;
border-radius:12px;
font-size:13px;
}


/* MOBILE */

@media(max-width:600px){

.container{
padding:10px;
}

.header{
padding:17px;
}

.header h1{
font-size:20px;
}

.module{
padding:14px;
}

.module-number{
width:38px;
height:38px;
}

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

<div class="header-top">

<div class="header-icon">
<i class="fa-solid fa-layer-group"></i>
</div>

<div>

<h1>
Course Modules
</h1>

</div>

</div>


<p>
Explore the modules included in your course.
</p>


<div
id="courseName"
class="course-name">

Loading course...

</div>

</div>


<!-- MODULES -->

<div
id="modules"
class="modules">

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Finding your course...

</div>

</div>


</div>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const modulesBox =
document.getElementById(
"modules"
);

const courseName =
document.getElementById(
"courseName"
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(
value ?? ""
)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   STATUS
===================================================== */

function statusClass(status){

const value =
String(
status || ""
).toLowerCase();

if(value === "active")
return "status-active";

if(value === "published")
return "status-published";

if(value === "draft")
return "status-draft";

if(value === "inactive")
return "status-inactive";

return "status-default";

}


/* =====================================================
   FIND USER COURSE AUTOMATICALLY
===================================================== */

async function getCurrentCourse(user){

/*
   We search:

   enrollments/{enrollmentId}

   userId == logged-in user UID
*/

const enrollmentQuery =
query(

collection(
db,
"enrollments"
),

where(
"userId",
"==",
user.uid
)

);


const enrollmentSnap =
await getDocs(
enrollmentQuery
);


if(enrollmentSnap.empty){

throw new Error(
"You are not enrolled in any course."
);

}


/*
   Take the first enrollment.

   If your system later supports
   multiple active courses, this can
   be changed to select the active
   enrollment.
*/

let selectedEnrollment = null;


for(
const enrollmentDoc
of enrollmentSnap.docs
){

const data =
enrollmentDoc.data();


if(
data.status === "active" ||
data.status === "completed" ||
!data.status
){

selectedEnrollment = data;

break;

}

}


/*
   Fallback to first enrollment
*/

if(!selectedEnrollment){

selectedEnrollment =
enrollmentSnap.docs[0].data();

}


const courseId =
selectedEnrollment.courseId;


if(!courseId){

throw new Error(
"Course ID haipo kwenye enrollment yako."
);

}


return courseId;

}


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse(
courseId
){

const courseSnap =
await getDoc(
doc(
db,
"courses",
courseId
)
);


if(
!courseSnap.exists()
){

throw new Error(
"Course haikupatikana."
);

}


const course =
courseSnap.data();


courseName.textContent =
course.title ||
"Course";

}


/* =====================================================
   LOAD MODULES
===================================================== */

async function loadModules(
courseId
){

/*
========================================================
   COURSE MODULE MODEL
========================================================

modules/{moduleId}

courseId
title
description
order
status
createdBy
createdAt
updatedAt

========================================================
*/


const modulesQuery =
query(

collection(
db,
"modules"
),

where(
"courseId",
"==",
courseId
)

);


const snapshot =
await getDocs(
modulesQuery
);


const modules =
snapshot.docs.map(
moduleDoc => ({

id:
moduleDoc.id,

...moduleDoc.data()

})
);


/* =====================================================
   SORT BY ORDER
===================================================== */

modules.sort(
(a,b) => {

const orderA =
Number(
a.order || 0
);

const orderB =
Number(
b.order || 0
);

return orderA - orderB;

}
);


/* =====================================================
   EMPTY
===================================================== */

if(!modules.length){

modulesBox.innerHTML = `

<div class="empty">

<i class="fa-solid fa-layer-group"></i>

<br><br>

<strong>
No modules available
</strong>

<br><br>

This course does not have any modules yet.

</div>

`;

return;

}


/* =====================================================
   RENDER
===================================================== */

modulesBox.innerHTML =

modules.map(
(module,index) => {

const number =
Number(
module.order
) || index + 1;


return `

<div
class="module"
data-module-id="${escapeHTML(module.id)}">


<div class="module-number">

${number}

</div>


<div class="module-content">


<div class="module-title">

${escapeHTML(
module.title ||
"Untitled Module"
)}

</div>


<div class="module-description">

${escapeHTML(
module.description ||
"No description available."
)}

</div>


<div class="module-meta">


<span class="badge order">

Module ${number}

</span>


<span
class="badge ${
statusClass(
module.status
)
}">

${escapeHTML(
module.status ||
"Available"
)}

</span>


</div>


</div>


<div class="module-arrow">

<i class="fa-solid fa-chevron-right"></i>

</div>


</div>

`;

}

).join("");

}


/* =====================================================
   MAIN
===================================================== */

async function start(){

try{

modulesBox.innerHTML = `

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Finding your course...

</div>

`;


/* GET LOGGED-IN USER */

const user =
await new Promise(
(resolve,reject)=>{

const unsubscribe =
onAuthStateChanged(
auth,
user => {

unsubscribe();

if(user){

resolve(user);

}else{

reject(
new Error(
"Please login to view your course modules."
)
);

}

},
error => {

reject(error);

}
);

}
);


/* FIND COURSE AUTOMATICALLY */

const courseId =
await getCurrentCourse(
user
);


/* LOAD COURSE */

await loadCourse(
courseId
);


/* LOAD MODULES */

await loadModules(
courseId
);

}catch(error){

console.error(
"Modules Error:",
error
);


modulesBox.innerHTML = `

<div class="error">

<i class="fa-solid fa-triangle-exclamation"></i>

<br><br>

<strong>
Unable to load modules
</strong>

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

}


/* =====================================================
   START
===================================================== */

start();

</script>


</body>
</html>
