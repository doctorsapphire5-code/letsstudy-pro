<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Course Modules | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.header{
  height:70px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:800;
}

.brand-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back-btn{
  border:1px solid #dbe1ea;
  background:#fff;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

.container{
  width:min(1150px,94%);
  margin:30px auto 60px;
}

.hero{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;
  padding:30px;
  border-radius:18px;
  margin-bottom:24px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#dbeafe;
}

.course-id{
  display:inline-block;
  margin-top:16px;
  background:rgba(255,255,255,.15);
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
}

.toolbar{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
  margin-bottom:22px;
}

.search{
  width:100%;
  padding:13px 15px;
  border:1px solid #dbe1ea;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.search:focus{
  border-color:#2563eb;
}

.modules{
  display:grid;
  gap:16px;
}

.module{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:22px;
  display:flex;
  align-items:center;
  gap:18px;
  transition:.2s;
}

.module:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(15,23,42,.08);
}

.number{
  width:52px;
  height:52px;
  border-radius:14px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:800;
  flex-shrink:0;
}

.module-content{
  flex:1;
}

.module-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:6px;
}

.module-description{
  color:#64748b;
  font-size:14px;
  margin-bottom:10px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.badge{
  padding:5px 9px;
  background:#f1f5f9;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
  color:#475569;
}

.badge.active{
  background:#ecfdf5;
  color:#059669;
}

.open-btn{
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}

.loading,
.empty,
.error{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:30px;
  text-align:center;
  color:#64748b;
}

.error{
  color:#b91c1c;
  border-color:#fecaca;
}

@media(max-width:700px){

  .header{
    padding:0 15px;
  }

  .brand{
    font-size:17px;
  }

  .container{
    width:96%;
    margin-top:20px;
  }

  .hero{
    padding:22px;
  }

  .hero h1{
    font-size:24px;
  }

  .module{
    align-items:flex-start;
    padding:17px;
  }

  .number{
    width:43px;
    height:43px;
  }

  .module-title{
    font-size:17px;
  }

  .open-btn{
    display:block;
    margin-top:12px;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="brand">
    <div class="brand-icon">🎓</div>
    <span>LetsStudy Pro</span>
  </a>

  <button
    class="back-btn"
    onclick="history.back()"
  >
    ← Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>Course Modules</h1>

    <p>
      Explore all modules available in this course.
    </p>

    <div class="course-id">
      Course ID:
      <strong id="courseIdDisplay">—</strong>
    </div>

  </section>


  <div class="toolbar">

    <input
      type="search"
      id="searchInput"
      class="search"
      placeholder="Search modules..."
      autocomplete="off"
    >

  </div>


  <div id="modulesContainer">

    <div class="loading">
      Loading modules...
    </div>

  </div>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const courseId =
  params.get("courseId") ||
  params.get("id") ||
  "";


/* =====================================================
   VARIABLES
===================================================== */

let MODULES = [];


/* =====================================================
   HELPERS
===================================================== */

function safe(value){

  if(
    value === undefined ||
    value === null
  ){
    return "";
  }

  return String(value).trim();

}


function escapeHtml(value){

  return safe(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getOrder(module){

  const order =
    Number(module.order);

  return Number.isFinite(order)
    ? order
    : 999999;

}


/* =====================================================
   LOAD MODULES
===================================================== */

async function loadModules(){

  const container =
    document.getElementById(
      "modulesContainer"
    );


  document.getElementById(
    "courseIdDisplay"
  ).textContent =
    courseId || "All Courses";


  try{

    const snapshot =
      await getDocs(
        collection(db,"modules")
      );


    MODULES = [];


    snapshot.forEach(docSnap => {

      const data =
        docSnap.data() || {};

      MODULES.push({

        ...data,

        id:docSnap.id,

        moduleId:docSnap.id,

        documentId:docSnap.id

      });

    });


    /*
      IMPORTANT:
      If courseId exists,
      only show modules belonging
      to that course.
    */

    if(courseId){

      MODULES =
        MODULES.filter(
          module =>
            safe(module.courseId) ===
            courseId
        );

    }


    MODULES.sort(
      (a,b) =>
        getOrder(a) -
        getOrder(b)
    );


    renderModules();

  }catch(error){

    console.error(
      "Modules loading error:",
      error
    );


    container.innerHTML = `

      <div class="error">

        <h3>
          Unable to load modules
        </h3>

        <p>
          ${escapeHtml(error.message)}
        </p>

      </div>

    `;

  }

}


/* =====================================================
   RENDER MODULES
===================================================== */

function renderModules(){

  const container =
    document.getElementById(
      "modulesContainer"
    );


  const query =
    safe(
      document.getElementById(
        "searchInput"
      ).value
    ).toLowerCase();


  let filtered =
    MODULES.filter(module => {

      if(!query){
        return true;
      }


      const text = [

        module.title,

        module.description,

        module.courseId,

        module.status,

        module.createdBy

      ]
      .map(value =>
        safe(value).toLowerCase()
      )
      .join(" ");


      return text.includes(query);

    });


  if(!filtered.length){

    container.innerHTML = `

      <div class="empty">

        <h3>
          No modules found
        </h3>

        <p>
          There are no modules matching your search.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="modules">

      ${filtered.map(
        (module,index) => {

          const moduleId =
            safe(module.id);

          const title =
            safe(module.title) ||
            "Untitled Module";

          const description =
            safe(module.description) ||
            "No description available.";

          const status =
            safe(module.status) ||
            "published";

          const order =
            safe(module.order) ||
            (index + 1);

          return `

            <article class="module">

              <div class="number">

                ${escapeHtml(order)}

              </div>


              <div class="module-content">

                <div class="module-title">

                  ${escapeHtml(title)}

                </div>


                <div class="module-description">

                  ${escapeHtml(description)}

                </div>


                <div class="meta">

                  <span class="badge active">

                    ${escapeHtml(status)}

                  </span>


                  <span class="badge">

                    Course:
                    ${escapeHtml(
                      module.courseId || "—"
                    )}

                  </span>


                  ${
                    module.createdBy
                    ?
                    `
                    <span class="badge">

                      By:
                      ${escapeHtml(
                        module.createdBy
                      )}

                    </span>
                    `
                    :
                    ""
                  }

                </div>

              </div>


              <a
                class="open-btn"
                href="
                  course-lessons.html?moduleId=
                  ${encodeURIComponent(moduleId)}
                  &courseId=
                  ${encodeURIComponent(
                    safe(module.courseId)
                  )}
                "
              >

                Open Module →

              </a>

            </article>

          `;

        }
      ).join("")}

    </div>

  `;

}


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderModules
  );


/* =====================================================
   START
===================================================== */

loadModules();

</script>

</body>
</html>
