<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Course Modules | LetsStudy Pro</title><link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

.container{
max-width:950px;
margin:auto;
padding:15px;
}


/* =====================================================
   PAGE HEADER
===================================================== */

.header{
background:#fff;
padding:20px;
border-radius:15px;
margin-bottom:18px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.header-top{
display:flex;
align-items:center;
gap:12px;
}

.header-icon{
width:48px;
height:48px;
border-radius:12px;
background:#eff6ff;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:21px;
flex-shrink:0;
}

.header h1{
margin:0;
font-size:22px;
}

.header p{
margin:8px 0 0;
color:#64748b;
font-size:13px;
line-height:1.5;
}

.course-count{
margin-top:12px;
display:inline-flex;
align-items:center;
gap:7px;
background:#eff6ff;
color:#2563eb;
padding:7px 11px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}


/* =====================================================
   COURSES
===================================================== */

.courses{
display:flex;
flex-direction:column;
gap:18px;
}


/* =====================================================
   COURSE CARD
===================================================== */

.course-card{
background:#fff;
border-radius:16px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
overflow:hidden;
}


/* COURSE HEADER */

.course-header{
padding:18px;
border-bottom:1px solid #eef2f7;
}

.course-header-top{
display:flex;
align-items:flex-start;
gap:12px;
}

.course-icon{
width:45px;
height:45px;
border-radius:12px;
background:#eff6ff;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:19px;
flex-shrink:0;
}

.course-info{
flex:1;
min-width:0;
}

.course-title{
font-size:17px;
font-weight:bold;
line-height:1.35;
word-break:break-word;
}

.course-id{
margin-top:5px;
font-size:10px;
color:#94a3b8;
word-break:break-all;
}

.course-meta{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:11px;
}

.course-badge{
padding:5px 9px;
border-radius:20px;
font-size:10px;
font-weight:bold;
background:#f1f5f9;
color:#475569;
}


/* =====================================================
   MODULES
===================================================== */

.modules{
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
}

.module{
background:#f8fafc;
border:1px solid #eef2f7;
border-radius:13px;
padding:14px;
display:flex;
gap:12px;
align-items:flex-start;
transition:.2s;
}

.module:hover{
border-color:#dbeafe;
background:#f8fbff;
}

.module-number{
width:40px;
height:40px;
border-radius:50%;
background:#eff6ff;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:14px;
flex-shrink:0;
}

.module-content{
flex:1;
min-width:0;
}

.module-title{
font-size:14px;
font-weight:bold;
line-height:1.4;
margin-bottom:5px;
word-break:break-word;
}

.module-description{
font-size:12px;
color:#64748b;
line-height:1.5;
word-break:break-word;
}

.module-meta{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:9px;
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:20px;
font-size:9px;
font-weight:bold;
}

.order{
background:#e2e8f0;
color:#475569;
}

.status-active,
.status-published{
background:#dcfce7;
color:#166534;
}

.status-draft{
background:#fef3c7;
color:#92400e;
}

.status-inactive{
background:#fee2e2;
color:#991b1b;
}

.status-default{
background:#e2e8f0;
color:#475569;
}

.module-arrow{
color:#94a3b8;
padding-top:11px;
}


/* =====================================================
   NO MODULES
===================================================== */

.no-modules{
padding:25px 15px;
text-align:center;
color:#64748b;
font-size:12px;
}

.no-modules i{
font-size:26px;
margin-bottom:8px;
color:#94a3b8;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
background:#fff;
padding:45px 20px;
border-radius:15px;
text-align:center;
color:#64748b;
box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.empty i{
font-size:38px;
margin-bottom:12px;
color:#94a3b8;
}

.empty strong{
color:#334155;
font-size:15px;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
background:#fff;
padding:45px 20px;
border-radius:15px;
text-align:center;
color:#64748b;
box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.loading i{
font-size:30px;
color:#2563eb;
}


/* =====================================================
   ERROR
===================================================== */

.error{
background:#fee2e2;
color:#991b1b;
padding:18px;
border-radius:12px;
font-size:13px;
line-height:1.5;
}


/* =====================================================
   COURSE ERROR
===================================================== */

.course-error{
margin:14px;
padding:15px;
background:#fff7ed;
border:1px solid #fed7aa;
border-radius:10px;
color:#9a3412;
font-size:12px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

.container{
padding:10px;
}

.header{
padding:17px;
}

.header h1{
font-size:20px;
}

.course-header{
padding:15px;
}

.course-title{
font-size:15px;
}

.module{
padding:12px;
}

.module-number{
width:36px;
height:36px;
font-size:13px;
}

.module-title{
font-size:13px;
}

.module-description{
font-size:11px;
}

}

</style></head><body><div class="container"><!-- =====================================================
     HEADER
===================================================== --><div class="header"><div class="header-top"><div class="header-icon">
<i class="fa-solid fa-layer-group"></i>
</div><div><h1>
My Course Modules
</h1></div></div><p>
Explore all courses you are enrolled in and the modules included in each course.
</p><div
id="courseCount"
class="course-count"><i class="fa-solid fa-spinner fa-spin"></i>

Loading courses...

</div></div><!-- =====================================================
     COURSES
===================================================== --><div
id="courses"
class="courses"><div class="loading"><i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Finding your enrolled courses...

</div></div></div><script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const coursesBox =
document.getElementById(
"courses"
);

const courseCount =
document.getElementById(
"courseCount"
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(
value ?? ""
)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(status){

const value =
String(
status || ""
).toLowerCase();

if(value === "active")
return "status-active";

if(value === "published")
return "status-published";

if(value === "draft")
return "status-draft";

if(value === "inactive")
return "status-inactive";

return "status-default";

}


/* =====================================================
   GET ALL USER ENROLLMENTS
===================================================== */

async function getUserEnrollments(user){

const enrollmentQuery =
query(

collection(
db,
"enrollments"
),

where(
"userId",
"==",
user.uid
)

);


const snapshot =
await getDocs(
enrollmentQuery
);


if(snapshot.empty){

return [];

}


/* =====================================================
   COLLECT COURSE IDS
===================================================== */

const courseIds = [];

const enrollmentData = [];


for(
const enrollmentDoc
of snapshot.docs
){

const data =
enrollmentDoc.data();


const courseId =
data.courseId;


/*
   Ignore broken enrollment
   documents without courseId.
*/

if(!courseId){

continue;

}


/*
   Save enrollment information.
*/

enrollmentData.push({

id:
enrollmentDoc.id,

...data

});


/*
   Prevent duplicate course IDs.

   A user may have more than one
   enrollment record for the same course.
*/

if(
!courseIds.includes(courseId)
){

courseIds.push(courseId);

}

}


return {

courseIds,

enrollments:
enrollmentData

};

}


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse(courseId){

const courseSnap =
await getDoc(

doc(
db,
"courses",
courseId
)

);


if(
!courseSnap.exists()
){

return {

id:
courseId,

missing:
true,

title:
"Course not found"

};

}


return {

id:
courseSnap.id,

...courseSnap.data(),

missing:
false

};

}


/* =====================================================
   LOAD MODULES FOR COURSE
===================================================== */

async function loadModules(courseId){

const modulesQuery =
query(

collection(
db,
"modules"
),

where(
"courseId",
"==",
courseId
)

);


const snapshot =
await getDocs(
modulesQuery
);


const modules =
snapshot.docs.map(
moduleDoc => ({

id:
moduleDoc.id,

...moduleDoc.data()

})
);


/* =====================================================
   SORT MODULES
===================================================== */

modules.sort(

(a,b) => {

const orderA =
Number(
a.order ?? 0
);

const orderB =
Number(
b.order ?? 0
);


/*
   If order is equal,
   use title as secondary sorting.
*/

if(
orderA === orderB
){

return String(
a.title || ""
).localeCompare(
String(
b.title || ""
)
);

}

return orderA - orderB;

}

);


return modules;

}


/* =====================================================
   LOAD ALL COURSES
===================================================== */

async function loadAllCourses(
courseIds
){

/*
   Promise.all allows all courses
   to be loaded instead of stopping
   at the first course.
*/

const courses =
await Promise.all(

courseIds.map(
courseId =>
loadCourse(
courseId
)

)

);


return courses;

}


/* =====================================================
   LOAD ALL MODULES
===================================================== */

async function loadAllCourseModules(
courses
){

const results =
await Promise.all(

courses.map(
async course => {

if(course.missing){

return {

courseId:
course.id,

modules:
[]

};

}


const modules =
await loadModules(
course.id
);


return {

courseId:
course.id,

modules

};

}

)

);


/* =====================================================
   CONVERT TO MAP
===================================================== */

const moduleMap =
new Map();


for(
const result
of results
){

moduleMap.set(
result.courseId,
result.modules
);

}


return moduleMap;

}


/* =====================================================
   RENDER MODULE
===================================================== */

function renderModule(
module,
index
){

const number =
Number(
module.order
) || index + 1;


return `

<div
class="module"
data-module-id="${escapeHTML(module.id)}">


<div class="module-number">

${number}

</div>


<div class="module-content">


<div class="module-title">

${escapeHTML(
module.title ||
"Untitled Module"
)}

</div>


<div class="module-description">

${escapeHTML(
module.description ||
"No description available."
)}

</div>


<div class="module-meta">


<span class="badge order">

Module ${number}

</span>


<span class="badge ${
statusClass(
module.status
)
}">

${escapeHTML(
module.status ||
"Available"
)}

</span>


</div>


</div>


<div class="module-arrow">

<i class="fa-solid fa-chevron-right"></i>

</div>


</div>

`;

}


/* =====================================================
   RENDER COURSE
===================================================== */

function renderCourse(
course,
modules
){

const courseTitle =
course.title ||
course.name ||
"Untitled Course";


const courseStatus =
course.status ||
course.courseStatus ||
"Available";


let modulesHTML = "";


/* =====================================================
   NO MODULES
===================================================== */

if(!modules.length){

modulesHTML = `

<div class="no-modules">

<i class="fa-solid fa-layer-group"></i>

<br>

<strong>
No modules available
</strong>

<br><br>

This course does not have any modules yet.

</div>

`;

}


/* =====================================================
   MODULES
===================================================== */

else{

modulesHTML =
modules.map(
(module,index) =>
renderModule(
module,
index
)
).join("");

}


return `

<div
class="course-card"
data-course-id="${escapeHTML(course.id)}">


<!-- COURSE HEADER -->

<div class="course-header">

<div class="course-header-top">


<div class="course-icon">

<i class="fa-solid fa-book-open"></i>

</div>


<div class="course-info">


<div class="course-title">

${escapeHTML(
courseTitle
)}

</div>


<div class="course-id">

Course ID:
${escapeHTML(
course.id
)}

</div>


<div class="course-meta">


<span class="course-badge">

<i class="fa-solid fa-layer-group"></i>

${modules.length}
${modules.length === 1 ? "Module" : "Modules"}

</span>


<span class="course-badge">

${escapeHTML(
courseStatus
)}

</span>


</div>


</div>


</div>

</div>


<!-- MODULES -->

<div class="modules">

${modulesHTML}

</div>


</div>

`;

}


/* =====================================================
   MAIN LOADER
===================================================== */

async function loadUserCourses(
user
){

try{


/* =====================================================
   GET ENROLLMENTS
===================================================== */

const enrollmentResult =
await getUserEnrollments(
user
);


const courseIds =
enrollmentResult.courseIds;


console.log(
"User enrollment count:",
enrollmentResult.enrollments.length
);


console.log(
"Unique course IDs:",
courseIds
);


/* =====================================================
   NO COURSES
===================================================== */

if(!courseIds.length){

courseCount.innerHTML = `

<i class="fa-solid fa-book"></i>

0 Courses

`;


coursesBox.innerHTML = `

<div class="empty">

<i class="fa-solid fa-graduation-cap"></i>

<br>

<strong>
No enrolled courses
</strong>

<br><br>

You are not currently enrolled in any courses.

</div>

`;

return;

}


/* =====================================================
   SHOW COURSE COUNT
===================================================== */

courseCount.innerHTML = `

<i class="fa-solid fa-book-open"></i>

${courseIds.length}

${courseIds.length === 1 ? "Course" : "Courses"}

`;


/* =====================================================
   LOAD ALL COURSES
===================================================== */

const courses =
await loadAllCourses(
courseIds
);


/* =====================================================
   LOAD MODULES FOR ALL COURSES
===================================================== */

const moduleMap =
await loadAllCourseModules(
courses
);


/* =====================================================
   RENDER ALL COURSES
===================================================== */

coursesBox.innerHTML =

courses.map(
course => {

const modules =
moduleMap.get(
course.id
) || [];


return renderCourse(
course,
modules
);

}

).join("");


/* =====================================================
   LOG RESULT
===================================================== */

console.log(
"Courses loaded:",
courses.length
);

console.log(
"Modules loaded:",
Object.fromEntries(
moduleMap
)
);


}catch(error){

console.error(
"Course Modules Error:",
error
);


courseCount.innerHTML = `

<i class="fa-solid fa-triangle-exclamation"></i>

Error

`;


coursesBox.innerHTML = `

<div class="error">

<i class="fa-solid fa-triangle-exclamation"></i>

<br><br>

<strong>
Unable to load your courses
</strong>

<br><br>

${escapeHTML(
error.message ||
"An unexpected error occurred."
)}

</div>

`;

}

}


/* =====================================================
   AUTHENTICATION
===================================================== */

function start(){

coursesBox.innerHTML = `

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Checking your account...

</div>

`;


const unsubscribe =
onAuthStateChanged(

auth,

async user => {

if(!user){

courseCount.innerHTML = `

<i class="fa-solid fa-lock"></i>

Login required

`;


coursesBox.innerHTML = `

<div class="empty">

<i class="fa-solid fa-lock"></i>

<br>

<strong>
Please login
</strong>

<br><br>

Please login to view your enrolled courses and modules.

</div>

`;

return;

}


/*
   User is logged in.
*/

await loadUserCourses(
user
);

}

);

}


/* =====================================================
   START
===================================================== */

start();

</script>

</body>

</html>
