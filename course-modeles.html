<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Modules | LetsStudy Pro</title>
<meta name="description" content="LetsStudy Pro course modules, lessons, quizzes, assignments, resources, announcements and FAQs.">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.logo{font-weight:800;color:#155eef;font-size:20px}
button{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:700}
.primary{background:#155eef;color:white}
.container{max-width:1100px;margin:auto;padding:25px 16px 60px}
.hero{background:linear-gradient(135deg,#101828,#155eef);color:white;border-radius:20px;padding:28px;margin-bottom:20px}
.hero h1{margin:5px 0 10px;font-size:32px}
.hero p{opacity:.9;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat,.module,.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px}
.stat{padding:18px}.stat b{font-size:24px;display:block}.stat span{color:#667085;font-size:13px}
.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-bottom:18px}
.module{margin-bottom:15px;overflow:hidden}
.module-head{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;padding:18px}
.num{width:40px;height:40px;border-radius:12px;background:#eef4ff;color:#155eef;display:grid;place-items:center;font-weight:800}
.module-info{flex:1}.module-info h2{margin:0 0 5px;font-size:17px}.module-info p{margin:0;color:#667085;font-size:13px}
.arrow{font-size:18px}
.module-body{display:none;padding:18px;border-top:1px solid #eee;background:#fafafa}
.module-body.open{display:block}
.section{margin-bottom:22px}.section h3{font-size:15px;margin:0 0 10px}
.list{display:grid;gap:9px}
.card{padding:14px}.card h4{margin:0 0 7px}.card p{margin:0;color:#667085;font-size:13px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef4ff;color:#155eef;font-size:11px;font-weight:700;margin:8px 5px 0 0}
a{color:#155eef;text-decoration:none;font-weight:700;font-size:13px}
.empty{text-align:center;padding:30px;color:#667085}
.error{background:#fef3f2;color:#b42318;padding:15px;border-radius:10px;margin-bottom:15px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero h1{font-size:26px}}
</style>
</head>

<body>

<header>
  <div class="logo">LetsStudy Pro</div>
  <button onclick="history.back()">← Back</button>
</header>

<main class="container">

<section class="hero">
  <small>COURSE CURRICULUM</small>
  <h1 id="courseTitle">Loading...</h1>
  <p id="courseDescription">Loading course information...</p>
</section>

<div class="stats">
  <div class="stat"><b id="modulesCount">0</b><span>Modules</span></div>
  <div class="stat"><b id="lessonsCount">0</b><span>Lessons</span></div>
  <div class="stat"><b id="quizzesCount">0</b><span>Quizzes</span></div>
  <div class="stat"><b id="assignmentsCount">0</b><span>Assignments</span></div>
</div>

<div id="error"></div>

<input id="search" class="search" placeholder="Search modules or lessons...">

<div style="margin-bottom:15px">
  <button class="primary" id="expand">Expand All</button>
</div>

<div id="modules">
  <div class="empty">Loading curriculum...</div>
</div>

</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* COURSE ID */

const courseId=
new URLSearchParams(location.search).get("courseId");

const modulesEl=document.getElementById("modules");
const errorEl=document.getElementById("error");

let modules=[];
let lessons=[];
let quizzes=[];
let assignments=[];
let resources=[];
let announcements=[];
let faqs=[];


/* ESCAPE */

const esc=v=>String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");


/* LOAD COLLECTION BY COURSE ID */

async function load(name){

  const q=query(
    collection(db,name),
    where("courseId","==",courseId)
  );

  const snap=await getDocs(q);

  return snap.docs.map(d=>({
    id:d.id,
    ...d.data()
  }));
}


/* COURSE */

async function loadCourse(){

  const snap=await getDoc(
    doc(db,"courses",courseId)
  );

  if(!snap.exists()){
    document.getElementById("courseTitle").textContent=
      "Course Not Found";
    return;
  }

  const c=snap.data();

  document.getElementById("courseTitle").textContent=
    c.title||"Untitled Course";

  document.getElementById("courseDescription").textContent=
    c.description||
    c.shortDescription||
    "Explore this course.";
}


/* LOAD EVERYTHING */

async function loadAll(){

  if(!courseId){
    modulesEl.innerHTML=
      `<div class="empty">Missing courseId in URL.</div>`;
    return;
  }

  try{

    await loadCourse();

    [
      modules,
      lessons,
      quizzes,
      assignments,
      resources,
      announcements,
      faqs
    ]=await Promise.all([
      load("modules"),
      load("lessons"),
      load("quizzes"),
      load("assignments"),
      load("resources"),
      load("announcements"),
      load("courseFAQs")
    ]);

    modules.sort((a,b)=>
      Number(a.order||0)-Number(b.order||0)
    );

    lessons.sort((a,b)=>
      Number(a.order||0)-Number(b.order||0)
    );

    document.getElementById("modulesCount").textContent=
      modules.length;

    document.getElementById("lessonsCount").textContent=
      lessons.length;

    document.getElementById("quizzesCount").textContent=
      quizzes.length;

    document.getElementById("assignmentsCount").textContent=
      assignments.length;

    render();

  }catch(e){

    console.error(e);

    errorEl.innerHTML=
      `<div class="error">
        Failed to load course data: ${esc(e.message)}
      </div>`;

  }
}


/* MODULE LESSONS */

function moduleLessons(id){

  return lessons.filter(x=>
    x.moduleId===id
  );
}


/* RENDER */

function render(){

  const term=
    document.getElementById("search")
    .value.trim().toLowerCase();

  const filtered=modules.filter(m=>{

    if(!term)return true;

    const ml=moduleLessons(m.id);

    return (
      String(m.title||"")
      .toLowerCase()
      .includes(term)
      ||
      ml.some(l=>
        String(l.title||"")
        .toLowerCase()
        .includes(term)
      )
    );
  });

  if(!filtered.length){
    modulesEl.innerHTML=
      `<div class="empty">No modules found.</div>`;
    return;
  }

  modulesEl.innerHTML=filtered.map((m,i)=>{

    const ml=moduleLessons(m.id);

    return `
    <article class="module">

      <button class="module-head"
        onclick="toggleModule('${m.id}')">

        <div class="num">${i+1}</div>

        <div class="module-info">
          <h2>${esc(m.title||"Untitled Module")}</h2>
          <p>${esc(m.description||"")}</p>
        </div>

        <div class="arrow">▼</div>

      </button>

      <div class="module-body"
        id="module-${m.id}">

        <div class="section">
          <h3>📚 Lessons (${ml.length})</h3>

          <div class="list">

          ${
            ml.length
            ?ml.map(l=>`
              <div class="card">

                <h4>
                  ${esc(l.title||"Untitled Lesson")}
                </h4>

                <p>
                  ${esc(l.description||"")}
                </p>

                ${l.type?
                  `<span class="badge">
                    ${esc(l.type)}
                  </span>`:""}

                ${l.duration?
                  `<span class="badge">
                    ${esc(l.duration)}
                  </span>`:""}

                ${
                  l.contentUrl
                  ?`<br><br>
                    <a href="${esc(l.contentUrl)}"
                       target="_blank">
                       Open Lesson →
                    </a>`
                  :""
                }

              </div>
            `).join("")
            :`<div class="empty">No lessons.</div>`
          }

          </div>
        </div>

        ${renderQuizzes()}
        ${renderAssignments()}
        ${renderResources()}
        ${renderAnnouncements()}
        ${renderFAQs()}

      </div>

    </article>
    `;

  }).join("");
}


/* QUIZZES */

function renderQuizzes(){

  if(!quizzes.length)return"";

  return `
  <div class="section">
    <h3>📝 Quizzes (${quizzes.length})</h3>

    <div class="grid">

    ${quizzes.map(q=>`
      <div class="card">
        <h4>${esc(q.title||"Quiz")}</h4>
        <p>${esc(q.description||"")}</p>

        ${
          q.passingScore!=null
          ?`<span class="badge">
             Passing: ${esc(q.passingScore)}%
           </span>`:""
        }

        ${
          q.timeLimit
          ?`<span class="badge">
             Time: ${esc(q.timeLimit)}
           </span>`:""
        }

        ${
          q.attempts
          ?`<span class="badge">
             Attempts: ${esc(q.attempts)}
           </span>`:""
        }
      </div>
    `).join("")}

    </div>
  </div>`;
}


/* ASSIGNMENTS */

function renderAssignments(){

  if(!assignments.length)return"";

  return `
  <div class="section">
    <h3>📋 Assignments (${assignments.length})</h3>

    <div class="grid">

    ${assignments.map(a=>`
      <div class="card">
        <h4>${esc(a.title||"Assignment")}</h4>
        <p>${esc(a.instructions||"")}</p>

        ${
          a.points
          ?`<span class="badge">
             ${esc(a.points)} Points
           </span>`:""
        }

        ${
          a.submissionType
          ?`<span class="badge">
             ${esc(a.submissionType)}
           </span>`:""
        }

        ${
          a.deadline
          ?`<span class="badge">
             Deadline: ${esc(a.deadline)}
           </span>`:""
        }
      </div>
    `).join("")}

    </div>
  </div>`;
}


/* RESOURCES */

function renderResources(){

  if(!resources.length)return"";

  return `
  <div class="section">
    <h3>📎 Resources (${resources.length})</h3>

    <div class="grid">

    ${resources.map(r=>`
      <div class="card">
        <h4>${esc(r.name||"Resource")}</h4>
        <p>${esc(r.description||"")}</p>

        ${
          r.type
          ?`<span class="badge">${esc(r.type)}</span>`:""
        }

        ${
          r.url
          ?`<br><br>
             <a href="${esc(r.url)}"
                target="_blank">
                Open Resource →
             </a>`:""
        }
      </div>
    `).join("")}

    </div>
  </div>`;
}


/* ANNOUNCEMENTS */

function renderAnnouncements(){

  if(!announcements.length)return"";

  return `
  <div class="section">
    <h3>📢 Announcements (${announcements.length})</h3>

    <div class="grid">

    ${announcements.map(a=>`
      <div class="card">
        <h4>${esc(a.title||"Announcement")}</h4>
        <p>${esc(a.message||"")}</p>

        ${
          a.priority
          ?`<span class="badge">
             ${esc(a.priority)}
           </span>`:""
        }

        ${
          a.publishDate
          ?`<span class="badge">
             ${esc(a.publishDate)}
           </span>`:""
        }
      </div>
    `).join("")}

    </div>
  </div>`;
}


/* FAQ */

function renderFAQs(){

  if(!faqs.length)return"";

  return `
  <div class="section">
    <h3>❓ FAQs (${faqs.length})</h3>

    <div class="grid">

    ${faqs.map(f=>`
      <div class="card">
        <h4>${esc(f.question||"Question")}</h4>
        <p>${esc(f.answer||"No answer available.")}</p>
      </div>
    `).join("")}

    </div>
  </div>`;
}


/* TOGGLE */

window.toggleModule=function(id){

  const el=
    document.getElementById("module-"+id);

  if(el)el.classList.toggle("open");
};


/* SEARCH */

document.getElementById("search")
.addEventListener("input",render);


/* EXPAND ALL */

document.getElementById("expand")
.addEventListener("click",()=>{

  document
    .querySelectorAll(".module-body")
    .forEach(x=>x.classList.add("open"));

});


/* START */

loadAll();

</script>

</body>
</html>
