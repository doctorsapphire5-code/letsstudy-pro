<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Quiz | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#f6f8fb;
  color:#172033
}
.header{
  height:66px;
  background:#fff;
  border-bottom:1px solid #e7eaf0;
  position:sticky;
  top:0;
  z-index:20
}
.nav{
  max-width:1100px;
  height:100%;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.logo{
  color:#059669;
  font-size:20px;
  font-weight:950
}
.nav a{
  background:#ecfdf5;
  color:#047857;
  padding:9px 12px;
  border-radius:9px;
  font-size:11px;
  font-weight:900
}
.container{
  max-width:900px;
  margin:auto;
  padding:28px 18px 70px
}
.top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:18px
}
.top h1{
  margin:0 0 5px;
  font-size:25px
}
.top p{
  margin:0;
  color:#667085;
  font-size:11px
}
.timer{
  min-width:90px;
  text-align:center;
  background:#fff;
  border:1px solid #e6e9ef;
  padding:12px;
  border-radius:12px
}
.timer strong{
  display:block;
  font-size:19px;
  color:#059669
}
.timer span{
  font-size:9px;
  color:#667085;
  font-weight:800
}
.progress{
  height:7px;
  background:#e8edf0;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px
}
.progress span{
  display:block;
  height:100%;
  width:0;
  background:#059669;
  transition:.25s
}
.card{
  background:#fff;
  border:1px solid #e6e9ef;
  border-radius:16px;
  padding:23px
}
.question-number{
  color:#059669;
  font-size:10px;
  font-weight:950;
  text-transform:uppercase
}
.question{
  margin:9px 0 20px;
  font-size:19px;
  line-height:1.55;
  font-weight:850
}
.option{
  display:flex;
  align-items:flex-start;
  gap:10px;
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border:1px solid #e0e5eb;
  background:#fff;
  border-radius:11px;
  cursor:pointer;
  text-align:left
}
.option:hover{
  border-color:#059669;
  background:#f0fdf4
}
.option.selected{
  border-color:#059669;
  background:#ecfdf5
}
.option input{
  margin-top:3px;
  accent-color:#059669
}
.option-text{
  font-size:12px;
  line-height:1.5;
  font-weight:700
}
.actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:20px
}
.btn{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  font-size:11px;
  font-weight:950;
  cursor:pointer
}
.primary{
  background:#059669;
  color:#fff
}
.secondary{
  background:#ecfdf5;
  color:#047857
}
.btn:disabled{
  opacity:.45;
  cursor:not-allowed
}
.result{
  display:none;
  text-align:center
}
.result.show{
  display:block
}
.result-icon{
  font-size:55px
}
.result h2{
  font-size:27px;
  margin:10px 0
}
.result p{
  color:#667085;
  font-size:12px;
  line-height:1.7
}
.score{
  font-size:42px;
  font-weight:950;
  color:#059669
}
.result-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:18px
}
.loading{
  padding:60px;
  text-align:center;
  color:#667085
}
.error{
  color:#b42318;
  background:#fef3f2;
  padding:15px;
  border-radius:10px;
  font-size:12px
}
@media(max-width:600px){
  .top{
    align-items:flex-start;
    flex-direction:column
  }
  .timer{
    width:100%
  }
  .question{
    font-size:17px
  }
  .actions{
    flex-direction:column
  }
  .actions .btn{
    width:100%
  }
}
</style>
</head>

<body>

<header class="header">
<nav class="nav">
<a href="index.html" class="logo">LetsStudy Pro</a>
<a id="backBtn" href="course-learning.html">← Course</a>
</nav>
</header>

<main class="container">

<div id="quizArea">

<div class="top">

<div>
<h1 id="quizTitle">Loading quiz...</h1>
<p id="courseTitle">Please wait...</p>
</div>

<div class="timer">
<strong id="timer">--:--</strong>
<span>TIME LEFT</span>
</div>

</div>

<div class="progress">
<span id="progressBar"></span>
</div>

<div class="card">

<div id="questionNumber" class="question-number">
Question
</div>

<div id="questionText" class="question">
Loading...
</div>

<div id="options"></div>

<div class="actions">

<button
id="previousBtn"
class="btn secondary">
← Previous
</button>

<button
id="nextBtn"
class="btn primary">
Next →
</button>

</div>

</div>

</div>


<div id="loading" class="loading">
Loading quiz...
</div>


<div id="result" class="card result">

<div id="resultIcon" class="result-icon">
🎉
</div>

<h2 id="resultTitle">
Quiz Complete
</h2>

<div id="score" class="score">
0%
</div>

<p id="resultText"></p>

<div class="result-actions">

<button
id="retryBtn"
class="btn primary">
Try Again
</button>

<a
id="learningBtn"
class="btn secondary"
href="#">
Back to Learning
</a>

<a
href="my-courses.html"
class="btn secondary">
My Courses
</a>

</div>

</div>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
collection,
getDocs,
query,
where,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================
FIREBASE
===================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAXKXbkljsyRgI_0rj0odBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* =====================================
URL + STATE
===================================== */

const params=
new URLSearchParams(location.search);

const courseId=
params.get("coursesId");

const quizId=
params.get("quizId") ||
params.get("id");

let user=null;
let course=null;
let quiz=null;
let questions=[];
let answers={};
let current=0;
let secondsLeft=0;
let timerInterval=null;
let attemptNumber=1;


/* =====================================
HELPERS
===================================== */

const $=id=>
document.getElementById(id);

function esc(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================
AUTH
===================================== */




/* =====================================
LOAD QUIZ
===================================== */

async function loadQuiz(){

if(!coursesId || !quizId){

showError(
"Course ID or Quiz ID is missing."
);

return;

}

try{

/* COURSE */

const courseSnap=
await getDoc(
doc(db,"courses",coursesId)
);

if(!courseSnap.exists()){

showError("Course not found.");
return;

}

course={
id:courseSnap.id,
...courseSnap.data()
};


/* QUIZ */

const quizSnap=
await getDoc(
doc(db,"quizzes",quizId)
);

if(!quizSnap.exists()){

showError("Quiz not found.");
return;

}

quiz={
id:quizSnap.id,
...quizSnap.data()
};


/* QUESTIONS */

const questionSnap=
await getDocs(
collection(
db,
"quizzes",
quizId,
"questions"
)
);

questions=
questionSnap.docs
.map(d=>({
id:d.id,
...d.data()
}))
.sort(
(a,b)=>
Number(a.order||0)-
Number(b.order||0)
);


/* ATTEMPTS */

const attemptQuery=
query(
collection(db,"quizAttempts"),
where("userId","==",user.uid),
where("quizId","==",quizId)
);

const attemptSnap=
await getDocs(attemptQuery);

attemptNumber=
attemptSnap.size+1;


/* LIMIT */

if(
quiz.attemptsAllowed &&
attemptNumber>
Number(quiz.attemptsAllowed)
){

showError(
"You have reached the maximum number of attempts for this quiz."
);

return;

}


/* TIMER */

secondsLeft=
Number(quiz.timeLimit||0)*60;

$("loading").style.display="none";

$("quizArea").style.display="block";

$("quizTitle").textContent=
quiz.title||"Course Quiz";

$("courseTitle").textContent=
course.title||"";

$("backBtn").href=
"course-learning.html?coursesId="+
encodeURIComponent(coursesId);

$("learningBtn").href=
"course-learning.html?coursesId="+
encodeURIComponent(coursesId);

if(!questions.length){

showError(
"This quiz has no questions yet."
);

return;

}

renderQuestion();

startTimer();

}catch(error){

console.error(error);

showError(
"Unable to load quiz."
);

}

}


/* =====================================
QUESTION
===================================== */

function renderQuestion(){

const q=questions[current];

const number=current+1;

$("questionNumber").textContent=
`Question ${number} of ${questions.length}`;

$("questionText").innerHTML=
esc(q.question||"");

const options=
Array.isArray(q.options)
?q.options
:[];

$("options").innerHTML=
options.map(
(option,index)=>{

let value;
let label;

if(
typeof option==="object"
){

value=
option.value||
String.fromCharCode(65+index);

label=
option.label||
option.text||
value;

}else{

value=
String.fromCharCode(65+index);

label=option;

}

const selected=
answers[q.id]===value
?"checked"
:"";

return `

<label class="option ${
selected?"selected":""
}">

<input
type="radio"
name="answer"
value="${esc(value)}"
${selected}>

<span class="option-text">
${esc(label)}
</span>

</label>

`;

}
).join("");


document
.querySelectorAll(
".option input"
)
.forEach(input=>{

input.addEventListener(
"change",
()=>{

answers[q.id]=
input.value;

document
.querySelectorAll(".option")
.forEach(
el=>
el.classList.remove("selected")
);

input
.closest(".option")
.classList.add(
"selected"
);

}
);

});


$("previousBtn").disabled=
current===0;

$("nextBtn").textContent=
current===questions.length-1
?"Submit Quiz"
:"Next →";


const percent=
((current+1)/questions.length)*100;

$("progressBar").style.width=
percent+"%";

}


/* =====================================
NEXT
===================================== */

$("nextBtn").onclick=async()=>{

if(current===questions.length-1){

await submitQuiz();

return;

}

current++;

renderQuestion();

};


/* =====================================
PREVIOUS
===================================== */

$("previousBtn").onclick=()=>{

if(current>0){

current--;

renderQuestion();

}

};


/* =====================================
TIMER
===================================== */

function startTimer(){

if(!secondsLeft){

$("timer").textContent=
"No limit";

return;

}

updateTimer();

timerInterval=
setInterval(
()=>{

secondsLeft--;

updateTimer();

if(secondsLeft<=0){

clearInterval(timerInterval);

submitQuiz(true);

}

},
1000
);

}


function updateTimer(){

const minutes=
Math.floor(secondsLeft/60);

const seconds=
secondsLeft%60;

$("timer").textContent=
`${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

if(secondsLeft<=30){

$("timer").style.color=
"#dc2626";

}

}


/* =====================================
SUBMIT
===================================== */

async function submitQuiz(auto=false){

if(timerInterval)
clearInterval(timerInterval);


let score=0;
let totalPoints=0;

questions.forEach(q=>{

const points=
Number(q.points||1);

totalPoints+=points;

if(
answers[q.id]!==undefined &&
String(answers[q.id])===
String(q.correctAnswer)
){

score+=points;

}

});


const percentage=
totalPoints
?
Math.round(
(score/totalPoints)*100
)
:0;


const passingScore=
Number(
quiz.passingScore??70
);

const passed=
percentage>=passingScore;


try{

const attemptRef=
await addDoc(
collection(
db,
"quizAttempts"
),
{

userId:user.uid,

quizId,

coursesId,

score,

totalPoints,

percentage,

passed,

answers,

attemptNumber,

startedAt:
serverTimestamp(),

completedAt:
serverTimestamp()

}
);


showResult(
percentage,
passed,
auto
);

}catch(error){

console.error(error);

alert(
"Unable to save quiz result."
);

}

}


/* =====================================
RESULT
===================================== */

function showResult(
percentage,
passed,
auto
){

$("quizArea").style.display="none";

$("result").classList.add("show");

$("score").textContent=
percentage+"%";

if(passed){

$("resultIcon").textContent="🎉";

$("resultTitle").textContent=
"Quiz Passed!";

$("resultText").textContent=
auto
?
`Time ended. You scored ${percentage}%. You passed this quiz.`
:
`Excellent work! You scored ${percentage}% and passed the quiz.`;

}else{

$("resultIcon").textContent="📚";

$("resultTitle").textContent=
"Keep Learning";

$("resultText").textContent=
`You scored ${percentage}%. The passing score is ${quiz.passingScore||70}%. Review the lesson and try again.`;

}

$("retryBtn").style.display=
quiz.attemptsAllowed &&
attemptNumber>=Number(quiz.attemptsAllowed)
?"none"
:"inline-block";

}


/* =====================================
RETRY
===================================== */

$("retryBtn").onclick=()=>{

location.reload();

};


/* =====================================
ERROR
===================================== */

function showError(message){

$("loading").style.display="none";

$("quizArea").style.display="none";

$("result").classList.add("show");

$("resultIcon").textContent="⚠️";

$("resultTitle").textContent=
"Quiz Unavailable";

$("resultText").textContent=
message;

$("retryBtn").style.display="none";

}

</script>

</body>
</html>
