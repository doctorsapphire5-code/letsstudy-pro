<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Course Q&A | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
header h1{flex:1;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:600}
.back{background:#eef2ff;color:#1d4ed8}
.primary{background:#2563eb;color:#fff}
.green{background:#16a34a;color:#fff}
main{max-width:950px;margin:auto;padding:18px}
.course{background:linear-gradient(135deg,#172554,#2563eb);color:#fff;padding:22px;border-radius:17px;margin-bottom:15px}
.course h2{margin:0 0 5px;font-size:22px}
.course p{margin:0;color:#dbeafe;font-size:12px}
.toolbar{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;display:flex;gap:8px;margin-bottom:14px}
input,textarea{width:100%;border:1px solid #dbe1e8;border-radius:9px;padding:11px;outline:none;font-family:inherit}
textarea{min-height:100px;resize:vertical}
.ask{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin-bottom:15px;display:none}
.ask.show{display:block}
.ask h3{margin:0 0 12px;font-size:15px}
.ask-actions{display:flex;justify-content:flex-end;margin-top:9px}
.question{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:17px;margin-bottom:12px}
.q-head{display:flex;gap:10px}
.avatar{width:38px;height:38px;min-width:38px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-weight:bold}
.user{font-size:12px;font-weight:bold}
.date{font-size:10px;color:#94a3b8;margin-top:3px}
.q-title{font-size:17px;font-weight:700;margin:14px 0 7px;color:#172033}
.q-body{font-size:13px;line-height:1.7;color:#475569;white-space:pre-wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tag{font-size:10px;background:#f1f5f9;color:#475569;border-radius:20px;padding:5px 8px}
.controls{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid #f1f5f9;padding-top:12px;margin-top:12px}
.control{background:#f8fafc;color:#475569;font-size:11px}
.answer-box{display:none;margin-top:12px}
.answer-box.show{display:block}
.answer{margin-top:14px;padding:13px;background:#f8fafc;border-radius:11px;border-left:3px solid #cbd5e1}
.answer.accepted{background:#f0fdf4;border-left-color:#16a34a}
.answer-top{display:flex;align-items:center;gap:8px}
.answer-body{font-size:12px;line-height:1.7;color:#475569;margin:10px 0;white-space:pre-wrap}
.accepted-label{color:#15803d;font-size:10px;font-weight:bold}
.empty{text-align:center;padding:50px;color:#64748b;background:#fff;border:1px solid #e5e7eb;border-radius:15px}
.loading{text-align:center;padding:45px;color:#64748b}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:100;font-size:12px}
.toast.show{display:block}
@media(max-width:600px){main{padding:10px}.toolbar{flex-direction:column}}
</style></head><body><header><button class="back" onclick="history.back()">←</button>

<h1>❓ Course Q&A</h1><button class="back" onclick="location.href='course-learning.html?courseId='+encodeURIComponent(courseId)">
Course
</button></header><main><section class="course"><h2 id="courseName">
Course Q&A
</h2><p>
Ask questions, share answers and learn together.
</p></section><div class="toolbar"><input
id="search"
placeholder="Search questions..."
oninput="render()">

<button
class="primary"
onclick="toggleAsk()">

+ Ask Question

</button></div><section
id="askBox"
class="ask"><h3>
Ask a Question
</h3><input
id="questionTitle"
placeholder="Question title...">

<br><br>

<textarea
id="questionBody"
placeholder="Explain your question in detail..."></textarea><div class="ask-actions"><button
class="primary"
onclick="askQuestion()">

Post Question

</button></div></section><div id="questions"><div class="loading">
Loading questions...
</div></div></main><div id="toast" class="toast"></div><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
query,
where,
getDocs,
getDoc,
doc,
addDoc,
updateDoc,
serverTimestamp,
arrayUnion
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* =========================================
 VARIABLES
========================================= */

const params=
new URLSearchParams(location.search);

window.courseId=
params.get("courseId")||
params.get("course")||
params.get("id");

let currentUser=null;
let questions=[];


/* =========================================
 AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="login.html";
return;

}

currentUser=user;

if(!courseId){

showError("Course ID is missing.");
return;

}

await loadCourse();
await loadQuestions();

});


/* =========================================
 COURSE
========================================= */

async function loadCourse(){

try{

const snap=
await getDoc(
doc(db,"courses",courseId)
);

if(snap.exists()){

const data=snap.data();

document.getElementById(
"courseName"
).textContent=
data.title||
data.name||
"Course Q&A";

}

}catch(error){

console.error(error);

}

}


/* =========================================
 QUESTIONS
========================================= */

async function loadQuestions(){

try{

const q=query(

collection(db,"courseQna"),

where("courseId","==",courseId)

);

const snap=await getDocs(q);

questions=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

questions.sort(
(a,b)=>
getTime(b.createdAt)-
getTime(a.createdAt)
);

render();

}catch(error){

console.error(error);

document.getElementById(
"questions"
).innerHTML=`

<div class="empty">

⚠️ Unable to load questions.

<br><br>

<button
class="primary"
onclick="location.reload()">

Try Again

</button>

</div>

`;

}

}


/* =========================================
 RENDER
========================================= */

window.render=function(){

const search=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const data=
questions.filter(q=>{

const text=
`${q.title||""}
${q.body||""}
${q.userName||""}`
.toLowerCase();

return text.includes(search);

});

const container=
document.getElementById("questions");


if(!data.length){

container.innerHTML=`

<div class="empty">

<div style="font-size:40px">
❓
</div>

<strong>
No questions found
</strong>

<br>

Be the first to ask a question.

</div>

`;

return;

}


container.innerHTML=
data.map(q=>`

<article class="question">

<div class="q-head">

<div class="avatar">
${initials(q.userName||"Student")}
</div>

<div>

<div class="user">
${esc(q.userName||"Student")}
</div>

<div class="date">
${formatDate(q.createdAt)}
</div>

</div>

</div>


<div class="q-title">
${esc(q.title||"Untitled question")}
</div>


<div class="q-body">
${esc(q.body||"")}
</div>


<div class="tags">

<span class="tag">
💬 ${Number(q.answers?.length||0)} answers
</span>

<span class="tag">
👍 ${Number(q.upvotes||0)} votes
</span>

${
q.acceptedAnswerId
?
`<span class="tag" style="color:#15803d">
✓ Answered
</span>`
:
""
}

</div>


<div class="controls">

<button
class="control"
onclick="upvote('${q.id}')">

👍 Upvote (${Number(q.upvotes||0)})

</button>

<button
class="control"
onclick="toggleAnswer('${q.id}')">

💬 Answer

</button>

${
q.userId===currentUser.uid
?
`<button
class="control"
onclick="deleteQuestion('${q.id}')">

🗑 Delete

</button>`
:
""
}

</div>


<div
id="answer-box-${q.id}"
class="answer-box">

<textarea
id="answer-${q.id}"
placeholder="Write your answer..."></textarea><div class="ask-actions"><button
class="primary"
onclick="addAnswer('${q.id}')">

Post Answer

</button></div></div><div>${renderAnswers(q)}

</div></article>`).join("");

};

/* =========================================
ASK QUESTION
========================================= */

window.toggleAsk=function(){

document
.getElementById("askBox")
.classList.toggle("show");

};

window.askQuestion=async function(){

const title=
document.getElementById("questionTitle")
.value.trim();

const body=
document.getElementById("questionBody")
.value.trim();

if(!title||!body){

toast(
"Please enter the question and details."
);

return;

}

try{

await addDoc(

collection(db,"courseQna"),

{

courseId,

userId:
currentUser.uid,

userName:
currentUser.displayName||
currentUser.email?.split("@")[0]||
"Student",

title,

body,

upvotes:0,

answers:[],

acceptedAnswerId:null,

createdAt:
serverTimestamp()

}

);

document.getElementById(
"questionTitle"
).value="";

document.getElementById(
"questionBody"
).value="";

document.getElementById(
"askBox"
).classList.remove("show");

toast("Question posted.");

await loadQuestions();

}catch(error){

console.error(error);

toast(
"Unable to post question."
);

}

};

/* =========================================
ANSWER TOGGLE
========================================= */

window.toggleAnswer=function(id){

const box=
document.getElementById(
"answer-box-${id}"
);

box.classList.toggle("show");

};

/* =========================================
ADD ANSWER
========================================= */

window.addAnswer=async function(id){

const input=
document.getElementById(
"answer-${id}"
);

const body=
input.value.trim();

if(!body){

toast(
"Write an answer first."
);

return;

}

const q=
questions.find(
x=>x.id===id
);

if(!q)return;

const answers=
Array.isArray(q.answers)
?[...q.answers]
:[];

answers.push({

id:
Date.now().toString(),

userId:
currentUser.uid,

userName:
currentUser.displayName||
currentUser.email?.split("@")[0]||
"Student",

body,

upvotes:0,

createdAt:
new Date().toISOString()

});

try{

await updateDoc(

doc(db,"courseQna",id),

{

answers

}

);

toast("Answer posted.");

await loadQuestions();

}catch(error){

console.error(error);

toast(
"Unable to post answer."
);

}

};

/* =========================================
UPVOTE QUESTION
========================================= */

window.upvote=async function(id){

try{

const q=
questions.find(
x=>x.id===id
);

if(!q)return;

await updateDoc(

doc(db,"courseQna",id),

{

upvotes:
Number(q.upvotes||0)+1

}

);

toast("Upvoted.");

await loadQuestions();

}catch(error){

console.error(error);

toast(
"Unable to upvote."
);

}

};

/* =========================================
ACCEPT ANSWER
========================================= */

window.acceptAnswer=
async function(
questionId,
answerId
){

const q=
questions.find(
x=>x.id===questionId
);

if(!q)return;

if(
q.userId!==currentUser.uid
){

toast(
"Only the question owner can accept an answer."
);

return;

}

try{

await updateDoc(

doc(db,"courseQna",questionId),

{

acceptedAnswerId:
answerId

}

);

toast(
"Answer accepted."
);

await loadQuestions();

}catch(error){

console.error(error);

toast(
"Unable to accept answer."
);

}

};

/* =========================================
RENDER ANSWERS
========================================= */

function renderAnswers(q){

if(
!Array.isArray(q.answers)||
!q.answers.length
)
return"";

return q.answers.map(
answer=>`

<div class="answer ${
q.acceptedAnswerId===answer.id
?"accepted"
:""
}"><div class="answer-top"><div class="avatar">${initials(
answer.userName||"Student"
)}

</div><div><div class="user">
${esc(answer.userName||"Student")}
</div><div class="date">
${formatDate(answer.createdAt)}
</div></div></div><div class="answer-body">${esc(answer.body||"")}

</div>${
q.acceptedAnswerId===answer.id
?
`<div class="accepted-label">
✓ ACCEPTED ANSWER

</div>`
:
q.userId===currentUser.uid
?
`<button
class="control"
onclick="acceptAnswer('${q.id}','${answer.id}')">✓ Accept Answer

</button>`
:
""
}

</div>`
).join("");

}

/* =========================================
DELETE QUESTION
========================================= */

window.deleteQuestion=
async function(id){

if(
!confirm(
"Delete this question?"
)
)
return;

const q=
questions.find(
x=>x.id===id
);

if(
!q||
q.userId!==currentUser.uid
){

toast(
"You cannot delete this question."
);

return;

}

try{

/*
Soft delete keeps the data
safe while hiding it.
*/

await updateDoc(

doc(db,"courseQna",id),

{

deleted:true

}

);

questions=
questions.filter(
x=>x.id!==id
);

render();

toast(
"Question deleted."
);

}catch(error){

console.error(error);

toast(
"Unable to delete question."
);

}

};

/* =========================================
HELPERS
========================================= */

function initials(name){

return String(name)
.split(" ")
.map(x=>x[0])
.join("")
.substring(0,2)
.toUpperCase();

}

function esc(value){

return String(value??"")
.replace(/&/g,"&")
.replace(/</g,"<")
.replace(/>/g,">")
.replace(/"/g,""")
.replace(/'/g,"'");

}

function getTime(value){

if(!value)return 0;

try{

if(
typeof value.toDate==="function"
)
return value.toDate().getTime();

return new Date(value).getTime();

}catch{

return 0;

}

}

function formatDate(value){

const time=getTime(value);

if(!time)
return"Just now";

return new Date(time)
.toLocaleString();

}

function showError(message){

document.getElementById(
"questions"
).innerHTML=`

<div class="empty">
⚠️ ${esc(message)}
</div>`;

}

function toast(message){

const el=
document.getElementById("toast");

el.textContent=message;

el.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
