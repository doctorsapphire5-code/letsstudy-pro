<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Course Quiz | LetsStudy Pro</title>

<meta name="description"
content="Test your knowledge with course quizzes on LetsStudy Pro.">

<link rel="icon" href="favicon.ico">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e6eaf0;
  position:sticky;
  top:0;
  z-index:50;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  text-decoration:none;
  color:#111827;
  font-size:21px;
  font-weight:900;
}

.logo span{color:#2563eb}

.back{
  color:#2563eb;
  text-decoration:none;
  font-weight:700;
}

.container{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

.hero{
  background:#fff;
  border:1px solid #e5e9f0;
  border-radius:20px;
  padding:30px;
  margin-bottom:25px;
  box-shadow:0 8px 30px rgba(15,23,42,.05);
}

.badge{
  display:inline-block;
  background:#eaf2ff;
  color:#2563eb;
  padding:7px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  margin-bottom:13px;
}

h1{
  margin:0 0 10px;
  font-size:34px;
}

.description{
  color:#667085;
  line-height:1.7;
  margin:0;
}

.quiz-card{
  background:#fff;
  border:1px solid #e5e9f0;
  border-radius:18px;
  padding:28px;
  margin-bottom:20px;
  box-shadow:0 6px 25px rgba(15,23,42,.04);
}

.progress{
  height:7px;
  background:#e9edf3;
  border-radius:99px;
  overflow:hidden;
  margin-bottom:25px;
}

.progress-bar{
  height:100%;
  width:0;
  background:#2563eb;
  transition:.25s;
}

.question-number{
  color:#667085;
  font-size:13px;
  font-weight:700;
  margin-bottom:9px;
}

.question{
  font-size:20px;
  line-height:1.5;
  font-weight:800;
  margin-bottom:22px;
}

.option{
  display:block;
  width:100%;
  padding:15px;
  margin:10px 0;
  border:1px solid #dce1e9;
  border-radius:12px;
  background:#fff;
  cursor:pointer;
  text-align:left;
  transition:.2s;
}

.option:hover{
  border-color:#2563eb;
  background:#f8fbff;
}

.option.selected{
  border-color:#2563eb;
  background:#eff6ff;
}

.option input{
  margin-right:10px;
}

.navigation{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:25px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:13px 20px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2f7;
  color:#172033;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.result{
  text-align:center;
  padding:35px;
}

.score{
  font-size:48px;
  font-weight:900;
  color:#2563eb;
}

.result-message{
  color:#667085;
  line-height:1.6;
}

.hidden{
  display:none!important;
}

.loading,
.error,
.empty{
  background:#fff;
  border:1px solid #e5e9f0;
  border-radius:18px;
  padding:45px 25px;
  text-align:center;
}

.error{
  background:#fff7f7;
  color:#b42318;
}

footer{
  text-align:center;
  padding:35px 20px;
  color:#667085;
  font-size:13px;
}

@media(max-width:650px){
  .container{
    margin:25px auto;
  }

  .hero{
    padding:24px 20px;
  }

  h1{
    font-size:28px;
  }

  .quiz-card{
    padding:20px;
  }

  .question{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      LetsStudy <span>Pro</span>
    </a>

    <a href="#" id="backLink" class="back">
      ← Course
    </a>

  </div>
</header>


<main class="container">

  <div id="loading" class="loading">
    Loading course quiz...
  </div>

  <div id="errorBox" class="error hidden"></div>

  <section id="content" class="hidden">

    <div class="hero">

      <div class="badge">
        COURSE QUIZ
      </div>

      <h1 id="courseTitle">
        Course Quiz
      </h1>

      <p id="courseDescription" class="description"></p>

    </div>

    <div id="quizArea"></div>

  </section>

</main>


<footer>
  © <span id="year"></span> LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVK5XbkljsyRgI_0rj0odBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("errorBox");

const content =
  document.getElementById("content");

const quizArea =
  document.getElementById("quizArea");

const courseTitle =
  document.getElementById("courseTitle");

const courseDescription =
  document.getElementById("courseDescription");

const backLink =
  document.getElementById("backLink");

document.getElementById("year")
  .textContent = new Date().getFullYear();


/* =====================================================
   COURSE ID
===================================================== */

const params =
  new URLSearchParams(window.location.search);

const courseId =
  params.get("id");


/* =====================================================
   STATE
===================================================== */

let questions = [];
let currentQuestion = 0;
let answers = [];


/* =====================================================
   HELPERS
===================================================== */

function first(obj, fields, fallback=""){

  for(const field of fields){

    if(
      obj &&
      obj[field] !== undefined &&
      obj[field] !== null &&
      String(obj[field]).trim() !== ""
    ){
      return obj[field];
    }

  }

  return fallback;
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   NORMALIZE QUESTIONS
===================================================== */

function normalizeQuestions(course){

  let source =
    first(
      course,
      [
        "quiz",
        "quizzes",
        "questions",
        "courseQuiz"
      ],
      []
    );


  /*
    If quiz is an object:

    quiz: {
      questions: [...]
    }
  */

  if(
    source &&
    !Array.isArray(source) &&
    Array.isArray(source.questions)
  ){
    source = source.questions;
  }


  if(!Array.isArray(source)){
    return [];
  }


  return source
    .map((item,index) => {

      if(!item || typeof item !== "object"){
        return null;
      }


      const question =
        first(
          item,
          [
            "question",
            "text",
            "title"
          ],
          ""
        );


      let options =
        first(
          item,
          [
            "options",
            "choices",
            "answers"
          ],
          []
        );


      if(!Array.isArray(options)){
        options = [];
      }


      /*
        Convert object options:

        {
          A: "Answer 1",
          B: "Answer 2"
        }
      */

      if(
        options.length === 0 &&
        item.options &&
        typeof item.options === "object"
      ){

        options =
          Object.values(item.options);

      }


      const correct =
        first(
          item,
          [
            "correctAnswer",
            "answer",
            "correct",
            "correctOption"
          ],
          ""
        );


      return {
        question,
        options,
        correct
      };

    })
    .filter(
      item =>
        item &&
        item.question &&
        item.options.length >= 2
    );

}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

  const q =
    questions[currentQuestion];

  if(!q){
    return;
  }


  const total =
    questions.length;

  const percent =
    ((currentQuestion + 1) / total) * 100;


  quizArea.innerHTML = `

    <div class="quiz-card">

      <div class="progress">

        <div
          class="progress-bar"
          style="width:${percent}%">
        </div>

      </div>

      <div class="question-number">
        Question ${currentQuestion + 1}
        of ${total}
      </div>

      <div class="question">
        ${escapeHTML(q.question)}
      </div>

      <div id="options"></div>

      <div class="navigation">

        <button
          id="previousBtn"
          class="btn secondary"
          type="button"
          ${currentQuestion === 0 ? "disabled" : ""}>
          ← Previous
        </button>

        <button
          id="nextBtn"
          class="btn primary"
          type="button">
          ${
            currentQuestion === total - 1
              ? "Finish Quiz"
              : "Next →"
          }
        </button>

      </div>

    </div>

  `;


  const optionsContainer =
    document.getElementById("options");


  q.options.forEach(
    (option,index) => {

      const optionValue =
        typeof option === "object"
          ? first(
              option,
              [
                "value",
                "label",
                "text",
                "answer"
              ],
              ""
            )
          : String(option);


      const label =
        document.createElement("label");

      label.className = "option";


      label.innerHTML = `

        <input
          type="radio"
          name="quiz-option"
          value="${index}">

        ${escapeHTML(optionValue)}

      `;


      const input =
        label.querySelector("input");


      if(
        answers[currentQuestion] === index
      ){

        input.checked = true;

        label.classList.add("selected");

      }


      input.addEventListener(
        "change",
        () => {

          answers[currentQuestion] =
            index;

          document
            .querySelectorAll(".option")
            .forEach(item =>
              item.classList.remove(
                "selected"
              )
            );

          label.classList.add(
            "selected"
          );

        }
      );


      optionsContainer.appendChild(label);

    }
  );


  document
    .getElementById("previousBtn")
    .addEventListener(
      "click",
      () => {

        if(currentQuestion > 0){

          currentQuestion--;

          renderQuestion();

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }

      }
    );


  document
    .getElementById("nextBtn")
    .addEventListener(
      "click",
      () => {

        if(
          answers[currentQuestion] === undefined
        ){

          alert(
            "Please select an answer first."
          );

          return;
        }


        if(
          currentQuestion ===
          questions.length - 1
        ){

          finishQuiz();

        }else{

          currentQuestion++;

          renderQuestion();

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }

      }
    );

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function isCorrect(question, selectedIndex){

  if(selectedIndex === undefined){
    return false;
  }


  const selected =
    question.options[selectedIndex];


  const selectedValue =
    typeof selected === "object"
      ? first(
          selected,
          [
            "value",
            "label",
            "text",
            "answer"
          ],
          ""
        )
      : String(selected);


  const correct =
    question.correct;


  /*
    Supports:

    correctAnswer: "A"
    correctAnswer: 0
    correctAnswer: "Answer text"
  */

  if(
    String(correct) ===
    String(selectedIndex)
  ){
    return true;
  }


  const letters =
    ["A","B","C","D","E","F"];


  if(
    letters[selectedIndex] ===
    String(correct).toUpperCase()
  ){
    return true;
  }


  if(
    String(selectedValue).trim().toLowerCase() ===
    String(correct).trim().toLowerCase()
  ){
    return true;
  }


  return false;

}


/* =====================================================
   FINISH QUIZ
===================================================== */

function finishQuiz(){

  let score = 0;


  questions.forEach(
    (question,index) => {

      if(
        isCorrect(
          question,
          answers[index]
        )
      ){
        score++;
      }

    }
  );


  const total =
    questions.length;

  const percentage =
    Math.round(
      (score / total) * 100
    );


  let message =
    "Keep learning and try again.";

  if(percentage >= 80){

    message =
      "Excellent work! You have demonstrated strong understanding.";

  }else if(percentage >= 60){

    message =
      "Good work! Review the lessons and try to improve your score.";

  }else{

    message =
      "Keep studying the course materials and try the quiz again.";

  }


  quizArea.innerHTML = `

    <div class="quiz-card result">

      <div class="badge">
        QUIZ COMPLETE
      </div>

      <div class="score">
        ${percentage}%
      </div>

      <h2>
        ${score} / ${total} Correct
      </h2>

      <p class="result-message">
        ${escapeHTML(message)}
      </p>

      <div class="navigation">

        <button
          id="retryBtn"
          class="btn secondary"
          type="button">
          Try Again
        </button>

        <a
          href="course-learn.html?id=${encodeURIComponent(courseId)}"
          class="btn primary"
          style="text-decoration:none;">
          Continue Learning
        </a>

      </div>

    </div>

  `;


  /*
    Save local progress.

    Firebase Course ID is used internally.
  */

  const result = {
    courseId,
    score,
    total,
    percentage,
    completedAt:
      new Date().toISOString()
  };


  localStorage.setItem(
    `courseQuizResult_${courseId}`,
    JSON.stringify(result)
  );


  document
    .getElementById("retryBtn")
    .addEventListener(
      "click",
      () => {

        currentQuestion = 0;

        answers = [];

        renderQuestion();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }
    );

}


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse(){

  if(!courseId){

    loading.classList.add("hidden");

    errorBox.textContent =
      "Course information could not be identified.";

    errorBox.classList.remove("hidden");

    return;
  }


  try{

    /*
      Firebase:

      courses/{COURSE_ID}
    */

    const courseRef =
      doc(
        db,
        "courses",
        courseId
      );


    const snapshot =
      await getDoc(courseRef);


    if(!snapshot.exists()){

      loading.classList.add("hidden");

      errorBox.textContent =
        "This course could not be found.";

      errorBox.classList.remove("hidden");

      return;
    }


    const course =
      snapshot.data();


    const title =
      first(
        course,
        [
          "title",
          "name",
          "courseTitle"
        ],
        "Course Quiz"
      );


    const description =
      first(
        course,
        [
          "description",
          "shortDescription",
          "summary"
        ],
        "Test your knowledge and understanding of this course."
      );


    courseTitle.textContent =
      title;

    courseDescription.textContent =
      description;


    document.title =
      `${title} Quiz | LetsStudy Pro`;


    backLink.href =
      `course-details.html?id=${encodeURIComponent(courseId)}`;


    questions =
      normalizeQuestions(course);


    if(questions.length === 0){

      loading.classList.add("hidden");

      content.classList.remove("hidden");

      quizArea.innerHTML = `

        <div class="empty">

          <h2>No quiz available</h2>

          <p>
            A quiz has not been added to this course yet.
          </p>

        </div>

      `;

      return;
    }


    answers =
      new Array(questions.length);


    loading.classList.add("hidden");

    content.classList.remove("hidden");


    renderQuestion();


  }catch(error){

    console.error(
      "Course quiz error:",
      error
    );

    loading.classList.add("hidden");

    errorBox.textContent =
      "Unable to load the course quiz. Please try again.";

    errorBox.classList.remove("hidden");

  }

}


/* =====================================================
   START
===================================================== */

loadCourse();

</script>

</body>
</html>
