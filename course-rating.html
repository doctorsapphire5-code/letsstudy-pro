<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rate Course | LetsStudy Pro</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a
}

a{
text-decoration:none
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:14px 20px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb
}

.back{
font-size:10px;
font-weight:900;
color:#2563eb
}

.container{
max-width:650px;
margin:auto;
padding:25px 15px
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:18px;
padding:25px;
text-align:center
}

.label{
font-size:10px;
font-weight:900;
color:#2563eb;
margin-bottom:8px
}

h1{
font-size:25px;
margin-bottom:8px
}

.description{
font-size:12px;
line-height:1.6;
color:#64748b
}

.course{
margin-top:18px;
padding:14px;
border-radius:11px;
background:#f8fafc;
font-size:14px;
font-weight:900
}

.stars{
display:flex;
justify-content:center;
gap:5px;
margin:25px 0 15px
}

.star{
border:0;
background:none;
font-size:42px;
cursor:pointer;
opacity:.25;
transition:.15s;
padding:3px
}

.star:hover,
.star.active{
opacity:1;
transform:scale(1.08)
}

.rating-text{
height:18px;
font-size:11px;
font-weight:900;
color:#64748b
}

button.save{
width:100%;
border:0;
border-radius:10px;
padding:13px;
background:#2563eb;
color:#fff;
font-size:11px;
font-weight:900;
cursor:pointer;
margin-top:18px
}

button.save:disabled{
opacity:.6;
cursor:not-allowed
}

.message{
display:none;
margin-top:12px;
padding:11px;
border-radius:9px;
font-size:10px;
font-weight:900
}

.success{
background:#dcfce7;
color:#166534
}

.error{
background:#fee2e2;
color:#991b1b
}

.actions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin-top:20px
}

.btn{
padding:11px 8px;
border-radius:9px;
font-size:9px;
font-weight:900;
display:flex;
justify-content:center;
align-items:center;
text-align:center
}

.primary{
background:#2563eb;
color:#fff
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.loading{
text-align:center;
padding:70px 20px;
font-size:13px;
color:#64748b
}

footer{
text-align:center;
padding:25px;
font-size:10px;
color:#64748b
}

@media(max-width:600px){

.actions{
grid-template-columns:1fr
}

.star{
font-size:36px
}

}
</style>
</head>

<body>

<header>

<a href="dashboard.html" class="logo">
LetsStudy Pro
</a>

<a
id="backLink"
href="course-complete.html"
class="back">

← Course Complete

</a>

</header>


<main class="container">

<div id="loading" class="loading">
Loading course...
</div>


<section
id="app"
class="card"
style="display:none">

<div class="label">
COURSE FEEDBACK
</div>

<h1>
Rate This Course
</h1>

<p class="description">
How would you rate your learning experience?
</p>

<div
id="courseName"
class="course">
Course
</div>


<div id="stars" class="stars">

<button
class="star"
data-rating="1"
aria-label="1 star">
★
</button>

<button
class="star"
data-rating="2"
aria-label="2 stars">
★
</button>

<button
class="star"
data-rating="3"
aria-label="3 stars">
★
</button>

<button
class="star"
data-rating="4"
aria-label="4 stars">
★
</button>

<button
class="star"
data-rating="5"
aria-label="5 stars">
★
</button>

</div>


<div
id="ratingText"
class="rating-text">
Select a rating
</div>


<button
id="saveBtn"
class="save"
disabled>

Submit Rating

</button>


<div
id="message"
class="message">
</div>


<div class="actions">

<a
id="reviewLink"
href="#"
class="btn primary">

💬 Write Review

</a>

<a
id="completeLink"
href="#"
class="btn secondary">

✓ Course Complete

</a>

<a
href="my-courses.html"
class="btn secondary">

📚 My Courses

</a>

</div>

</section>


<footer>

© <span id="year"></span> LetsStudy Pro

</footer>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAXKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
PARAMETERS
========================================= */

const params=
new URLSearchParams(location.search);

const courseId=
params.get("courseId")||
params.get("id");


/* =========================================
ELEMENTS
========================================= */

const loading=
document.getElementById("loading");

const appBox=
document.getElementById("app");

const courseName=
document.getElementById("courseName");

const ratingText=
document.getElementById("ratingText");

const saveBtn=
document.getElementById("saveBtn");

const message=
document.getElementById("message");

const stars=
document.querySelectorAll(".star");

const reviewLink=
document.getElementById("reviewLink");

const completeLink=
document.getElementById("completeLink");

const backLink=
document.getElementById("backLink");


let user=null;
let selectedRating=0;


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
auth,
async currentUser=>{

if(!currentUser){

const redirect=
"course-rating.html?courseId="+
encodeURIComponent(courseId||"");

location.href=
"login.html?redirect="+
encodeURIComponent(redirect);

return;

}

user=currentUser;

await initialize();

}
);


/* =========================================
INITIALIZE
========================================= */

async function initialize(){

if(!courseId){

showMessage(
"Course ID haipo.",
"error"
);

loading.style.display="none";
appBox.style.display="block";

return;

}

try{

await loadCourse();

await loadExistingRating();

setLinks();

loading.style.display="none";
appBox.style.display="block";

}catch(error){

console.error(error);

loading.textContent=
"Unable to load course.";

}

}


/* =========================================
LOAD COURSE
========================================= */

async function loadCourse(){

const snap=
await getDoc(
doc(
db,
"courses",
courseId
)
);

if(!snap.exists()){

throw new Error(
"Course not found"
);

}

const course=
snap.data();

courseName.textContent=
course.title||
"Course";


document.title=
"Rate "+
(course.title||"Course")+
" | LetsStudy Pro";

}


/* =========================================
LOAD EXISTING RATING
========================================= */

async function loadExistingRating(){

const reviewId=
user.uid+"_"+courseId;

const snap=
await getDoc(
doc(
db,
"courseReviews",
reviewId
)
);

if(!snap.exists()){

return;

}

const data=
snap.data();

if(data.rating){

selectRating(
Number(data.rating)
);

saveBtn.textContent=
"Update Rating";

}

}


/* =========================================
SELECT RATING
========================================= */

stars.forEach(
star=>{

star.addEventListener(
"click",
()=>{

selectRating(
Number(
star.dataset.rating
)
);

}
);

});


function selectRating(value){

selectedRating=value;

stars.forEach(
star=>{

const starValue=
Number(
star.dataset.rating
);

star.classList.toggle(
"active",
starValue<=value
);

}
);


const labels={

1:"Very Poor",
2:"Poor",
3:"Average",
4:"Good",
5:"Excellent"

};

ratingText.textContent=
labels[value]||
"Select a rating";

saveBtn.disabled=false;

}


/* =========================================
SAVE RATING
========================================= */

saveBtn.addEventListener(
"click",
async()=>{

if(!selectedRating){

showMessage(
"Please select a rating.",
"error"
);

return;

}

saveBtn.disabled=true;

saveBtn.textContent=
"Saving...";

try{

const reviewId=
user.uid+"_"+courseId;

await setDoc(

doc(
db,
"courseReviews",
reviewId
),

{

userId:user.uid,

courseId:courseId,

rating:selectedRating,

updatedAt:
serverTimestamp(),

createdAt:
serverTimestamp()

},

{
merge:true
}

);

showMessage(
"Rating saved successfully ✓",
"success"
);

saveBtn.textContent=
"Rating Saved ✓";

}catch(error){

console.error(error);

showMessage(
"Failed to save rating. Please try again.",
"error"
);

saveBtn.disabled=false;

saveBtn.textContent=
"Submit Rating";

}

});


/* =========================================
LINKS
========================================= */

function setLinks(){

const query=
"?courseId="+
encodeURIComponent(
courseId
);

reviewLink.href=
"course-review.html"+
query;

completeLink.href=
"course-complete.html"+
query;

backLink.href=
"course-complete.html"+
query;

}


/* =========================================
MESSAGE
========================================= */

function showMessage(
text,
type
){

message.textContent=text;

message.className=
"message "+
type;

message.style.display=
"block";

}


/* =========================================
YEAR
========================================= */

document.getElementById(
"year"
).textContent=
new Date().getFullYear();

</script>

</body>
</html>
