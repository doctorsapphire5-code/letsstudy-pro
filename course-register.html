<body>

  <main class="container">

    <div class="logo">
      <div class="logo-icon">V</div>
      <h1>Create Account</h1>
      <p class="subtitle">
        Create your Vorix Course account to get started.
      </p>
    </div>

    <div id="message" class="message" role="alert"></div>

    <form id="registerForm">

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name" required="">
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username" autocomplete="username" minlength="3" maxlength="30" required="">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email address" autocomplete="email" required="">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number" autocomplete="tel">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" minlength="6" required="">
          <button type="button" class="toggle-password" data-target="password">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" minlength="6" required="">
          <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        Create Account
      </button>

    </form>

    <div class="links">
      Already have an account?
      <a href="course-login.html">Login</a>
      <br>
      <a href="course-forgot-password.html">Forgot Password?</a>
    </div>

    <div class="security">
      Secure account registration powered by Firebase.
    </div>

  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile,
      sendEmailVerification
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDaJ0LKede-fz0MTZl-V1SxZ4Ps0IETepE",
      authDomain: "vorix-course.firebaseapp.com",
      projectId: "vorix-course",
      storageBucket: "vorix-course.firebasestorage.app",
      messagingSenderId: "277814413742",
      appId: "1:277814413742:web:fb4515f03591ea07c7603f",
      measurementId: "G-SQ6PN704M7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("registerForm");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("message");

    function showMessage(message, type = "error") {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    // Show and hide passwords
    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);

        if (input.type === "password") {
          input.type = "text";
          button.textContent = "Hide";
        } else {
          input.type = "password";
          button.textContent = "Show";
        }
      });
    });

    function getFirebaseError(error) {
      const errors = {
        "auth/email-already-in-use":
          "This email address is already registered.",
        "auth/invalid-email":
          "Please enter a valid email address.",
        "auth/weak-password":
          "Your password is too weak. Use at least 6 characters.",
        "auth/network-request-failed":
          "Network error. Check your internet connection.",
        "auth/operation-not-allowed":
          "Email and password registration is not enabled in Firebase.",
        "permission-denied":
          "Database permission denied. Check your Firestore security rules."
      };

      return errors[error.code] ||
        error.message ||
        "Registration failed. Please try again.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (!fullName || !username || !email || !password) {
        showMessage("Please complete all required fields.");
        return;
      }

      if (!/^[a-zA-Z0-9_.-]{3,30}$/.test(username)) {
        showMessage(
          "Username must be 3–30 characters and contain only letters, numbers, dots, underscores or hyphens."
        );
        return;
      }

      if (password.length < 6) {
        showMessage("Password must contain at least 6 characters.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating Account...";

      let createdUser = null;

      try {
        // Create Firebase Authentication account
        const userCredential = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        createdUser = userCredential.user;

        // Update Firebase Auth profile
        await updateProfile(createdUser, {
          displayName: fullName
        });

        // Create user profile in Firestore
        await setDoc(doc(db, "users", createdUser.uid), {
          userId: createdUser.uid,
          adminId: "",
          accountType: "student",
          role: "user",

          fullName: fullName,
          firstName: fullName.split(" ")[0],
          lastName: fullName.split(" ").slice(1).join(" "),
          displayName: fullName,
          username: username,

          email: email,
          phone: phone,

          photoURL: "",
          provider: "password",
          emailVerified: false,

          status: "active",
          language: "en",
          timezone: "Africa/Dar_es_Salaam",

          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          lastLoginAt: null
        });

        // Send email verification
        await sendEmailVerification(createdUser);

        showMessage(
          "Your account has been created. Please check your email and verify your account.",
          "success"
        );

        submitBtn.textContent = "Account Created";

        // Redirect to course dashboard
        setTimeout(() => {
          window.location.href = "course-dashboard.html";
        }, 2500);

      } catch (error) {
        console.error("Registration error:", error);

        // If Firestore profile creation fails after Auth creation,
        // keep the account so the user can recover instead of deleting it.
        if (createdUser) {
          showMessage(
            "Your login account was created, but saving your profile failed. Please contact support before trying to register again. " +
            getFirebaseError(error)
          );
        } else {
          showMessage(getFirebaseError(error));
        }

        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
      }
    });
  </script>


</body></html>
