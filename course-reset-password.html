<body>

  <main class="container">

    <div class="logo">
      <div class="logo-icon">V</div>
      <h1>Reset Password</h1>
      <p class="subtitle">
        Create a new secure password for your Vorix Course account.
      </p>
    </div>

    <div id="loadingMessage" class="message success">
      Verifying your password reset link...
    </div>

    <div id="emailInfo" class="email-info hidden">
      Account: <strong id="userEmail"></strong>
    </div>

    <form id="resetForm" class="hidden">

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="password-wrap">
          <input type="password" id="newPassword" placeholder="Enter new password" minlength="6" autocomplete="new-password" required="">
          <button type="button" class="toggle" data-target="newPassword">
            SHOW
          </button>
        </div>
        <p class="hint">Password must contain at least 6 characters.</p>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="6" autocomplete="new-password" required="">
          <button type="button" class="toggle" data-target="confirmPassword">
            SHOW
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="submit">
        Reset Password
      </button>

    </form>

    <div id="message" class="message"></div>

    <div id="successLinks" class="links hidden">
      <a href="course-login.html">Continue to Login</a>
    </div>

    <div id="errorLinks" class="links hidden">
      <a href="course-forgot-password.html">Request a New Reset Link</a>
      <br><br>
      <a href="course-login.html">Back to Login</a>
    </div>

    <div class="footer">
      Secure authentication powered by Vorix Course.
    </div>

  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    // Firebase Configuration - Vorix Course
    const firebaseConfig = {
      apiKey: "AIzaSyDaJ0LKede-fz0MTZl-V1SxZ4Ps0IETepE",
      authDomain: "vorix-course.firebaseapp.com",
      projectId: "vorix-course",
      storageBucket: "vorix-course.firebasestorage.app",
      messagingSenderId: "277814413742",
      appId: "1:277814413742:web:fb4515f03591ea07c7603f",
      measurementId: "G-SQ6PN704M7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);

    const mode = params.get("mode");
    const oobCode = params.get("oobCode");

    const loadingMessage = document.getElementById("loadingMessage");
    const resetForm = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const emailInfo = document.getElementById("emailInfo");
    const userEmail = document.getElementById("userEmail");
    const submitBtn = document.getElementById("submitBtn");

    let verifiedEmail = "";

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function showError(error) {
      const errors = {
        "auth/expired-action-code":
          "This password reset link has expired. Request a new link.",
        "auth/invalid-action-code":
          "This reset link is invalid or has already been used.",
        "auth/user-disabled":
          "This account has been disabled.",
        "auth/user-not-found":
          "The account associated with this link could not be found.",
        "auth/weak-password":
          "Please choose a stronger password.",
        "auth/too-many-requests":
          "Too many attempts. Please try again later."
      };

      return errors[error.code] ||
        "Something went wrong. Please request a new password reset link.";
    }

    async function verifyResetLink() {
      try {
        if (mode !== "resetPassword" || !oobCode) {
          throw {
            code: "auth/invalid-action-code"
          };
        }

        verifiedEmail = await verifyPasswordResetCode(auth, oobCode);

        userEmail.textContent = verifiedEmail;
        emailInfo.classList.remove("hidden");

        loadingMessage.classList.add("hidden");
        resetForm.classList.remove("hidden");

      } catch (error) {
        loadingMessage.classList.add("hidden");
        showMessage(showError(error), "error");
        document.getElementById("errorLinks").classList.remove("hidden");
      }
    }

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const newPassword =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (newPassword.length < 6) {
        showMessage(
          "Password must contain at least 6 characters.",
          "error"
        );
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage(
          "Passwords do not match. Please try again.",
          "error"
        );
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = "Updating Password...";

        await confirmPasswordReset(
          auth,
          oobCode,
          newPassword
        );

        resetForm.classList.add("hidden");
        emailInfo.classList.add("hidden");

        showMessage(
          "Your password has been reset successfully. You can now sign in using your new password.",
          "success"
        );

        document.getElementById("successLinks")
          .classList.remove("hidden");

      } catch (error) {
        showMessage(showError(error), "error");

        submitBtn.disabled = false;
        submitBtn.textContent = "Reset Password";
      }
    });

    // Show / hide password
    document.querySelectorAll(".toggle").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(
          button.dataset.target
        );

        if (input.type === "password") {
          input.type = "text";
          button.textContent = "HIDE";
        } else {
          input.type = "password";
          button.textContent = "SHOW";
        }
      });
    });

    verifyResetLink();
  </script>



</body></html>
