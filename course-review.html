<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Course Review | LetsStudy Pro</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a
}

a{
text-decoration:none
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:14px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb
}

.back{
font-size:10px;
font-weight:900;
color:#2563eb
}

.container{
max-width:680px;
margin:auto;
padding:25px 15px
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:18px;
padding:25px
}

.center{
text-align:center
}

.label{
font-size:10px;
font-weight:900;
color:#2563eb;
margin-bottom:8px
}

h1{
font-size:25px;
margin-bottom:8px
}

.description{
font-size:12px;
line-height:1.6;
color:#64748b
}

.course{
margin-top:18px;
padding:14px;
border-radius:11px;
background:#f8fafc;
font-size:14px;
font-weight:900
}

.rating-box{
margin-top:20px;
text-align:center
}

.stars{
display:flex;
justify-content:center;
gap:4px;
margin:10px 0
}

.star{
border:0;
background:transparent;
font-size:34px;
cursor:pointer;
opacity:.25;
padding:2px
}

.star.active{
opacity:1
}

.rating-label{
font-size:10px;
font-weight:900;
color:#64748b;
height:15px
}

textarea{
width:100%;
min-height:170px;
margin-top:20px;
padding:14px;
border:1px solid #cbd5e1;
border-radius:11px;
font-family:Arial,sans-serif;
font-size:12px;
line-height:1.6;
resize:vertical;
outline:none
}

textarea:focus{
border-color:#2563eb
}

.counter{
text-align:right;
font-size:9px;
color:#64748b;
margin-top:5px
}

.save{
width:100%;
border:0;
background:#2563eb;
color:#fff;
padding:13px;
border-radius:10px;
font-size:11px;
font-weight:900;
cursor:pointer;
margin-top:14px
}

.save:disabled{
opacity:.6;
cursor:not-allowed
}

.message{
display:none;
padding:11px;
border-radius:9px;
margin-top:12px;
font-size:10px;
font-weight:900;
text-align:center
}

.success{
background:#dcfce7;
color:#166534
}

.error{
background:#fee2e2;
color:#991b1b
}

.actions{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:18px
}

.btn{
padding:11px 6px;
border-radius:9px;
font-size:9px;
font-weight:900;
display:flex;
align-items:center;
justify-content:center;
text-align:center
}

.primary{
background:#2563eb;
color:#fff
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.loading{
text-align:center;
padding:70px 20px;
color:#64748b;
font-size:13px
}

footer{
text-align:center;
padding:25px;
font-size:10px;
color:#64748b
}

@media(max-width:600px){

.actions{
grid-template-columns:1fr 1fr
}

.star{
font-size:30px
}

.card{
padding:20px
}

}
</style>
</head>

<body>

<header>

<a href="dashboard.html" class="logo">
LetsStudy Pro
</a>

<a
id="backLink"
href="course-complete.html"
class="back">

← Course Complete

</a>

</header>


<main class="container">

<div id="loading" class="loading">
Loading review...
</div>


<section
id="app"
class="card"
style="display:none">

<div class="center">

<div class="label">
COURSE FEEDBACK
</div>

<h1>
Write a Review
</h1>

<p class="description">
Share your experience and help other students choose the right course.
</p>

<div
id="courseName"
class="course">
Course
</div>

</div>


<div class="rating-box">

<div class="label">
YOUR RATING
</div>

<div id="stars" class="stars">

<button
class="star"
data-rating="1">
★
</button>

<button
class="star"
data-rating="2">
★
</button>

<button
class="star"
data-rating="3">
★
</button>

<button
class="star"
data-rating="4">
★
</button>

<button
class="star"
data-rating="5">
★
</button>

</div>

<div
id="ratingLabel"
class="rating-label">
Select your rating
</div>

</div>


<textarea
id="reviewText"
maxlength="1000"
placeholder="What did you like about this course? What could be improved?">
</textarea>

<div
id="counter"
class="counter">
0 / 1000
</div>


<button
id="saveBtn"
class="save">

Publish Review

</button>


<div
id="message"
class="message">
</div>


<div class="actions">

<a
id="ratingLink"
href="#"
class="btn primary">

⭐ Rating

</a>

<a
id="completeLink"
href="#"
class="btn secondary">

✓ Complete

</a>

<a
href="my-courses.html"
class="btn secondary">

📚 My Courses

</a>

<a
href="dashboard.html"
class="btn secondary">

🏠 Dashboard

</a>

</div>

</section>


<footer>

© <span id="year"></span> LetsStudy Pro

</footer>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAXKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
PARAMETERS
========================================= */

const params=
new URLSearchParams(location.search);

const courseId=
params.get("courseId")||
params.get("id");


/* =========================================
ELEMENTS
========================================= */

const loading=
document.getElementById("loading");

const appBox=
document.getElementById("app");

const courseName=
document.getElementById("courseName");

const reviewText=
document.getElementById("reviewText");

const counter=
document.getElementById("counter");

const stars=
document.querySelectorAll(".star");

const ratingLabel=
document.getElementById("ratingLabel");

const saveBtn=
document.getElementById("saveBtn");

const message=
document.getElementById("message");

const ratingLink=
document.getElementById("ratingLink");

const completeLink=
document.getElementById("completeLink");

const backLink=
document.getElementById("backLink");


let user=null;
let selectedRating=0;


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
auth,
async currentUser=>{

if(!currentUser){

const redirect=
"course-review.html?courseId="+
encodeURIComponent(
courseId||""
);

location.href=
"login.html?redirect="+
encodeURIComponent(
redirect
);

return;

}

user=currentUser;

await initialize();

}
);


/* =========================================
INITIALIZE
========================================= */

async function initialize(){

if(!courseId){

showMessage(
"Course ID haipo.",
"error"
);

loading.style.display="none";
appBox.style.display="block";

return;

}

try{

await loadCourse();

await loadExistingReview();

setLinks();

loading.style.display="none";
appBox.style.display="block";

}catch(error){

console.error(error);

loading.textContent=
"Unable to load course review.";

}

}


/* =========================================
LOAD COURSE
========================================= */

async function loadCourse(){

const snap=
await getDoc(
doc(
db,
"courses",
courseId
)
);

if(!snap.exists()){

throw new Error(
"Course not found"
);

}

const course=
snap.data();

courseName.textContent=
course.title||
"Course";

document.title=
"Review "+
(course.title||"Course")+
" | LetsStudy Pro";

}


/* =========================================
LOAD EXISTING REVIEW
========================================= */

async function loadExistingReview(){

const reviewId=
user.uid+"_"+courseId;

const snap=
await getDoc(
doc(
db,
"courseReviews",
reviewId
)
);

if(!snap.exists()){

return;

}

const data=
snap.data();

if(data.rating){

selectRating(
Number(data.rating)
);

}

if(data.review){

reviewText.value=
data.review;

updateCounter();

saveBtn.textContent=
"Update Review";

}

}


/* =========================================
STAR SELECTION
========================================= */

stars.forEach(
star=>{

star.addEventListener(
"click",
()=>{

selectRating(
Number(
star.dataset.rating
)
);

}
);

});


function selectRating(value){

selectedRating=value;

stars.forEach(
star=>{

const starValue=
Number(
star.dataset.rating
);

star.classList.toggle(
"active",
starValue<=value
);

}
);

const labels={

1:"Very Poor",
2:"Poor",
3:"Average",
4:"Good",
5:"Excellent"

};

ratingLabel.textContent=
labels[value]||
"Select your rating";

}


/* =========================================
COUNTER
========================================= */

reviewText.addEventListener(
"input",
updateCounter
);


function updateCounter(){

counter.textContent=
reviewText.value.length+
" / 1000";

}


/* =========================================
SAVE REVIEW
========================================= */

saveBtn.addEventListener(
"click",
async()=>{

const review=
reviewText.value.trim();

if(!selectedRating){

showMessage(
"Please select a rating first.",
"error"
);

return;

}

if(review.length<10){

showMessage(
"Please write at least 10 characters.",
"error"
);

return;

}

saveBtn.disabled=true;

saveBtn.textContent=
"Publishing...";

try{

const reviewId=
user.uid+"_"+courseId;

await setDoc(

doc(
db,
"courseReviews",
reviewId
),

{

userId:user.uid,

courseId:courseId,

rating:selectedRating,

review:review,

updatedAt:
serverTimestamp(),

createdAt:
serverTimestamp()

},

{
merge:true
}
);

showMessage(
"Your review has been saved successfully ✓",
"success"
);

saveBtn.textContent=
"Review Published ✓";

}catch(error){

console.error(error);

showMessage(
"Failed to save review. Please try again.",
"error"
);

saveBtn.disabled=false;

saveBtn.textContent=
"Publish Review";

}

});


/* =========================================
LINKS
========================================= */

function setLinks(){

const query=
"?courseId="+
encodeURIComponent(
courseId
);

ratingLink.href=
"course-rating.html"+
query;

completeLink.href=
"course-complete.html"+
query;

backLink.href=
"course-complete.html"+
query;

}


/* =========================================
MESSAGE
========================================= */

function showMessage(
text,
type
){

message.textContent=
text;

message.className=
"message "+
type;

message.style.display=
"block";

}


/* =========================================
YEAR
========================================= */

document.getElementById(
"year"
).textContent=
new Date().getFullYear();

</script>

</body>
</html>
