<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Courses | LetsStudy Pro</title><style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
gap:12px;
padding:0 16px;
position:sticky;
top:0;
z-index:20;
}

header h1{
flex:1;
margin:0;
font-size:18px;
}

button{
border:0;
border-radius:9px;
padding:10px 13px;
cursor:pointer;
font-weight:600;
}

.back{
background:#eef2ff;
color:#1d4ed8;
}

.primary{
background:#2563eb;
color:#fff;
}

main{
max-width:1200px;
margin:auto;
padding:18px;
}

.hero{
background:linear-gradient(135deg,#172554,#2563eb);
color:#fff;
border-radius:18px;
padding:28px;
margin-bottom:16px;
}

.hero h2{
margin:0 0 8px;
font-size:28px;
}

.hero p{
margin:0;
color:#dbeafe;
font-size:13px;
}

.filters{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:13px;
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:9px;
margin-bottom:16px;
}

input,select{
width:100%;
padding:11px;
border:1px solid #dbe1e8;
border-radius:9px;
background:#fff;
outline:none;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
overflow:hidden;
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.thumb{
height:170px;
background:#e2e8f0;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.thumb img{
width:100%;
height:100%;
object-fit:cover;
}

.placeholder{
font-size:45px;
}

.body{
padding:15px;
}

.category{
font-size:10px;
color:#2563eb;
font-weight:bold;
text-transform:uppercase;
}

.title{
font-size:17px;
font-weight:700;
margin:7px 0;
line-height:1.4;
}

.description{
font-size:12px;
color:#64748b;
line-height:1.6;
height:38px;
overflow:hidden;
}

.tags{
display:flex;
gap:6px;
flex-wrap:wrap;
margin:12px 0;
}

.tag{
background:#f1f5f9;
color:#475569;
padding:5px 8px;
border-radius:20px;
font-size:9px;
}

.bottom{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
margin-top:12px;
}

.price{
font-weight:bold;
font-size:14px;
}

.free{
color:#16a34a;
}

.loading,
.empty{
grid-column:1/-1;
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:55px;
text-align:center;
color:#64748b;
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
align-items:center;
justify-content:center;
padding:15px;
z-index:100;
}

.modal.show{
display:flex;
}

.box{
background:#fff;
width:100%;
max-width:600px;
max-height:90vh;
overflow:auto;
border-radius:17px;
padding:20px;
}

.modal-head{
display:flex;
gap:10px;
align-items:center;
}

.modal-head h2{
flex:1;
margin:0;
font-size:20px;
}

.modal-image{
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
margin:15px 0;
}

.modal-description{
font-size:13px;
line-height:1.8;
color:#475569;
white-space:pre-wrap;
}

.modal-actions{
display:flex;
gap:8px;
margin-top:18px;
}

.toast{
position:fixed;
right:18px;
bottom:18px;
background:#172033;
color:#fff;
padding:12px 15px;
border-radius:9px;
display:none;
z-index:200;
font-size:12px;
}

.toast.show{
display:block;
}

@media(max-width:900px){
.grid{grid-template-columns:1fr 1fr}
}

@media(max-width:650px){
.grid,.filters{grid-template-columns:1fr}
main{padding:10px}
}

</style></head><body><header><button
class="back"
onclick="history.back()">
←
</button>

<h1>📚 Courses</h1><button
class="back"
onclick="location.href='dashboard.html'">
Dashboard
</button>

</header><main><section class="hero"><h2>
Learn. Grow. Succeed. 🚀
</h2><p>
Explore professional courses and build skills for your future.
</p></section><section class="filters"><input
id="search"
placeholder="Search courses..."
oninput="render()">

<select
id="category"
onchange="render()">

<option value="all">
All Categories
</option><option value="Technology">
Technology
</option><option value="Business">
Business
</option><option value="Education">
Education
</option><option value="Marketing">
Marketing
</option><option value="Science">
Science
</option><option value="Finance">
Finance
</option><option value="Design">
Design
</option></select><select
id="level"
onchange="render()">

<option value="all">
All Levels
</option><option value="Beginner">
Beginner
</option><option value="Intermediate">
Intermediate
</option><option value="Advanced">
Advanced
</option></select></section><div
id="courses"
class="grid"><div class="loading">
Loading courses...
</div></div></main><!-- COURSE DETAILS --><div
id="modal"
class="modal"><div class="box"><div class="modal-head"><h2 id="modalTitle">
Course
</h2><button
class="back"
onclick="closeModal()">
✕
</button>

</div><img
id="modalImage"
class="modal-image"
alt="Course">

<div
id="modalMeta"
class="tags">
</div><div
id="modalDescription"
class="modal-description">
</div><div class="modal-actions"><button
id="enrollBtn"
class="primary">
Start Course
</button>

<button
class="back"
onclick="closeModal()">
Close
</button>

</div></div></div><div
id="toast"
class="toast">
</div><script type="module">


/* =========================================
 FIREBASE
========================================= */

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
getDocs,
doc,
setDoc,
getDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


let currentUser=null;
let courses=[];
let selectedCourse=null;


/* =========================================
 AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

currentUser=user;

await loadCourses();

});


/* =========================================
 LOAD COURSES
========================================= */

async function loadCourses(){

const container=
document.getElementById(
"courses"
);

try{

const snap=
await getDocs(
collection(
db,
"courses"
)
);


courses=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);


/*
Show active/published courses.
If status is missing, the course
is also allowed.
*/

courses=
courses.filter(
course=>
!course.status||
course.status==="active"||
course.status==="published"
);


courses.sort(
(a,b)=>
getTime(b.createdAt)-
getTime(a.createdAt)
);


render();


}catch(error){

console.error(error);

container.innerHTML=`

<div class="empty">

<div style="font-size:40px">
⚠️
</div>

Unable to load courses.

<br><br>

<button
class="primary"
onclick="location.reload()">

Try Again

</button>

</div>

`;

}

}


/* =========================================
 RENDER
========================================= */

window.render=function(){

const search=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

const category=
document.getElementById(
"category"
).value;

const level=
document.getElementById(
"level"
).value;


const data=
courses.filter(course=>{

const text=
`${course.title||""}
${course.description||""}
${course.instructor||""}
${course.category||""}`
.toLowerCase();


return(

text.includes(search)&&

(
category==="all"||
course.category===category
)&&

(
level==="all"||
course.level===level
)

);

});


const container=
document.getElementById(
"courses"
);


if(!data.length){

container.innerHTML=`

<div class="empty">

<div style="font-size:40px">
🔎
</div>

<strong>
No courses found
</strong>

<br>

Try another search or filter.

</div>

`;

return;

}


container.innerHTML=
data.map(course=>`

<article class="card">


<div class="thumb">

${
course.thumbnail||
course.image||
course.imageUrl
?

`<img
src="${safe(
course.thumbnail||
course.image||
course.imageUrl
)}"
alt="${esc(
course.title||"Course"
)}"
onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>📚</div>'">`

:

`<div class="placeholder">
📚
</div>`
}

</div>


<div class="body">


<div class="category">

${esc(
course.category||
"General"
)}

</div>


<div class="title">

${esc(
course.title||
"Untitled Course"
)}

</div>


<div class="description">

${esc(
course.description||
"Learn practical skills with LetsStudy Pro."
)}

</div>


<div class="tags">

<span class="tag">

${
course.level||
"All Levels"
}

</span>


<span class="tag">

${
course.duration||
"Self-paced"
}

</span>


${
course.lessons
?
`<span class="tag">
${course.lessons} lessons
</span>`
:
""
}

</div>


<div class="bottom">

<div class="price">

${
isFree(course)
?
`<span class="free">FREE</span>`
:
esc(formatPrice(course.price))
}

</div>


<button
class="primary"
onclick="openCourse('${course.id}')">

View Course

</button>

</div>


</div>

</article>

`).join("");

};


/* =========================================
 OPEN COURSE
========================================= */

window.openCourse=
function(id){

selectedCourse=
courses.find(
x=>x.id===id
);

if(!selectedCourse)
return;


const course=
selectedCourse;


document.getElementById(
"modalTitle"
).textContent=
course.title||
"Course";


const image=
course.thumbnail||
course.image||
course.imageUrl;


const img=
document.getElementById(
"modalImage"
);


if(image){

img.src=image;
img.style.display="block";

}else{

img.style.display="none";

}


document.getElementById(
"modalMeta"
).innerHTML=`

<span class="tag">
📚 ${esc(
course.category||"General"
)}
</span>

<span class="tag">
🎯 ${esc(
course.level||"All Levels"
)}
</span>

<span class="tag">
⏱ ${esc(
course.duration||"Self-paced"
)}
</span>

${
course.instructor
?
`<span class="tag">
👨‍🏫 ${esc(course.instructor)}
</span>`
:
""
}

`;


document.getElementById(
"modalDescription"
).textContent=
course.description||
"No course description available.";


const button=
document.getElementById(
"enrollBtn"
);


button.textContent=
isFree(course)
?
"Start Course"
:
"Enroll & Continue";


button.onclick=
()=>startCourse(course);


document.getElementById(
"modal"
).classList.add(
"show"
);

};


/* =========================================
 START / ENROLL
========================================= */

async function startCourse(course){

if(!currentUser){

location.href=
"login.html";

return;

}


try{

/*
Free courses can be started
immediately.

Paid courses can be connected
to checkout later.
*/

if(!isFree(course)){

location.href=
`checkout.html?courseId=${encodeURIComponent(course.id)}`;

return;

}


/*
Create enrollment record.
*/

await setDoc(

doc(
db,
"enrollments",
`${currentUser.uid}_${course.id}`
),

{

userId:
currentUser.uid,

courseId:
course.id,

status:
"active",

enrolledAt:
serverTimestamp()

},

{
merge:true
}

);


location.href=
`course-learning.html?courseId=${encodeURIComponent(course.id)}`;


}catch(error){

console.error(error);

toast(
"Unable to start course."
);

}

}


/* =========================================
 CLOSE
========================================= */

window.closeModal=
function(){

document.getElementById(
"modal"
).classList.remove(
"show"
);

};


/* =========================================
 HELPERS
========================================= */

function isFree(course){

return(

course.isFree===true||

course.price===0||

course.price==="0"||

String(
course.price||""
).toLowerCase()==="free"

);

}


function formatPrice(price){

if(
price===undefined||
price===null||
price===""
)
return"Paid";


const number=
Number(price);


if(!isNaN(number)){

return new Intl.NumberFormat(
"en-TZ",
{
style:"currency",
currency:"TZS",
maximumFractionDigits:0
}
).format(number);

}

return String(price);

}


function getTime(value){

if(!value)
return 0;

try{

if(
typeof value.toDate===
"function"
){

return value
.toDate()
.getTime();

}

return new Date(value)
.getTime();

}catch{

return 0;

}

}


function esc(value){

return String(
value??""
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function safe(value){

return String(value||"")
.replace(/"/g,"%22")
.replace(/'/g,"%27");

}


function toast(message){

const el=
document.getElementById(
"toast"
);

el.textContent=message;

el.classList.add(
"show"
);

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{
el.classList.remove("show");
},
3000
);

}

</script></body>
</html>
