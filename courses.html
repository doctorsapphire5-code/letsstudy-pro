<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courses | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#07111f;color:white;padding:15px 5%;position:sticky;top:0;z-index:10}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;gap:20px}
.logo{font-size:22px;font-weight:900;color:white;text-decoration:none}
.logo span{color:#22d3ee}
.search{flex:1}
.search input{width:100%;padding:12px 18px;border:0;border-radius:30px;outline:0}
.nav a{color:white;text-decoration:none}
.hero{padding:55px 5%;background:linear-gradient(135deg,#07111f,#164e63);color:white}
.wrap{max-width:1200px;margin:auto}
.hero h1{font-size:45px;margin:0 0 10px}
.hero p{color:#cbd5e1}
.filters{background:white;padding:18px;margin:-25px auto 30px;border-radius:15px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;box-shadow:0 15px 40px #0001}
.filters input,.filters select{padding:13px;border:1px solid #ddd;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb}
.image{height:190px;position:relative}
.image img{width:100%;height:100%;object-fit:cover}
.featured{position:absolute;top:12px;left:12px;background:#f59e0b;color:white;padding:6px 10px;border-radius:20px;font-size:12px}
.body{padding:18px}
.category{font-size:12px;color:#2563eb;font-weight:bold}
h3{margin:8px 0}
.desc{color:#64748b;font-size:14px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:10px;color:#64748b;font-size:12px;margin:15px 0}
.rating{color:#f59e0b}
.price{font-size:20px;font-weight:900}
.free{color:#16a34a}
.old{text-decoration:line-through;color:#94a3b8;font-size:13px;margin-left:6px}
button{width:100%;border:0;padding:12px;border-radius:9px;background:#172033;color:white;font-weight:bold;cursor:pointer;margin-top:12px}
button:hover{background:#2563eb}
.loading{text-align:center;padding:80px}
.empty{text-align:center;padding:80px;grid-column:1/-1}
footer{margin-top:60px;background:#07111f;color:#94a3b8;padding:40px 5%}

@media(max-width:850px){
.grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
.grid,.filters{grid-template-columns:1fr}
.hero h1{font-size:34px}
.nav a{display:none}
}
</style>
</head>

<body>

<header>
<div class="nav">

<a class="logo" href="index.html">
LetsStudy <span>Pro</span>
</a>

<div class="search">
<input id="topSearch" placeholder="Search courses...">
</div>

<a href="cart.html">
<i class="fa fa-cart-shopping"></i>
<span id="cartCount">0</span>
</a>

</div>
</header>


<section class="hero">
<div class="wrap">

<h1>Explore Courses</h1>

<p>
Learn. Build. Grow with professional courses
from LetsStudy Pro.
</p>

</div>
</section>


<main class="wrap">

<div class="filters">

<input
id="search"
placeholder="Search title, instructor, category or tags...">

<select id="category">
<option value="">All Categories</option>
</select>

<select id="level">
<option value="">All Levels</option>
<option value="Beginner">Beginner</option>
<option value="Intermediate">Intermediate</option>
<option value="Advanced">Advanced</option>
</select>

</div>


<div style="margin-bottom:20px;color:#64748b">

<i class="fa fa-book"></i>

<span id="total">0</span>
courses available

</div>


<div id="loading" class="loading">

<i class="fa fa-spinner fa-spin fa-2x"></i>

<p>Loading courses...</p>

</div>


<div id="courses"
class="grid"
style="display:none">
</div>

</main>


<footer>

<div class="wrap">

<h2 style="color:white">
LetsStudy Pro
</h2>

<p>Learn. Build. Grow.</p>

<p>
Professional learning, careers and business ecosystem.
</p>

</div>

</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ================= DATA ================= */

let courses=[];


/* ================= LOAD ================= */

async function loadCourses(){

try{

const snap=
await getDocs(
collection(db,"courses")
);


/*
 Firestore document ID
 = courseId
*/

courses=
snap.docs.map(doc=>({

courseId:doc.id,

title:doc.data().title || "",
slug:doc.data().slug || "",
shortDescription:doc.data().shortDescription || "",
description:doc.data().description || "",
thumbnail:doc.data().thumbnail || "",
previewVideo:doc.data().previewVideo || "",

instructorId:doc.data().instructorId || "",
instructorName:doc.data().instructorName || "",

category:doc.data().category || "",
subcategory:doc.data().subcategory || "",
level:doc.data().level || "",
language:doc.data().language || "",
duration:doc.data().duration || "",

lessonsCount:Number(doc.data().lessonsCount || 0),
modulesCount:Number(doc.data().modulesCount || 0),

price:Number(doc.data().price || 0),
discountPrice:Number(doc.data().discountPrice || 0),

currency:doc.data().currency || "TZS",
isFree:doc.data().isFree === true,

certificate:doc.data().certificate === true,

requirements:Array.isArray(doc.data().requirements)
?doc.data().requirements:[],

whatYouLearn:Array.isArray(doc.data().whatYouLearn)
?doc.data().whatYouLearn:[],

targetAudience:doc.data().targetAudience || "",

tags:Array.isArray(doc.data().tags)
?doc.data().tags:[],

status:doc.data().status || "",
featured:doc.data().featured === true,
published:doc.data().published === true,

rating:Number(doc.data().rating || 0),
ratingCount:Number(doc.data().ratingCount || 0),
enrollmentCount:Number(doc.data().enrollmentCount || 0),
views:Number(doc.data().views || 0),

createdBy:doc.data().createdBy || "",
createdAt:doc.data().createdAt || null,
updatedAt:doc.data().updatedAt || null,
publishedAt:doc.data().publishedAt || null

}));


document.getElementById("total")
.textContent=courses.length;


createCategories();

renderCourses();


document.getElementById("loading")
.style.display="none";

document.getElementById("courses")
.style.display="grid";


}catch(error){

console.error(error);

document.getElementById("loading")
.innerHTML=`

<i class="fa fa-circle-exclamation fa-2x"></i>

<h3>Unable to load courses</h3>

<p>${error.message}</p>

`;

}

}


/* ================= CATEGORIES ================= */

function createCategories(){

const select=
document.getElementById("category");

const categories=[
...new Set(
courses
.map(c=>c.category)
.filter(Boolean)
)
];

categories.forEach(cat=>{

const option=
document.createElement("option");

option.value=cat;
option.textContent=cat;

select.appendChild(option);

});

}


/* ================= RENDER ================= */

function renderCourses(){

const q=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const cat=
document.getElementById("category").value;

const lvl=
document.getElementById("level").value;


const filtered=
courses.filter(c=>{

/* Published courses only */

const visible=
c.published===true ||
c.status==="published";

if(!visible)return false;


const searchable=`

${c.title}
${c.slug}
${c.shortDescription}
${c.description}
${c.instructorName}
${c.category}
${c.subcategory}
${c.language}
${c.targetAudience}
${c.tags.join(" ")}

`.toLowerCase();


return(

(!q || searchable.includes(q)) &&

(!cat || c.category===cat) &&

(!lvl || c.level===lvl)

);

});


const box=
document.getElementById("courses");


if(!filtered.length){

box.innerHTML=`

<div class="empty">

<i class="fa fa-book-open fa-3x"></i>

<h2>No courses found</h2>

<p>Try another search.</p>

</div>

`;

return;

}


box.innerHTML=
filtered.map(renderCard).join("");

}


/* ================= CARD ================= */

function renderCard(c){

const price=
Number(c.price||0);

const discount=
Number(c.discountPrice||0);

const free=
c.isFree===true ||
price===0;

const finalPrice=
discount>0 &&
discount<price
?discount
:price;


return `

<article class="card">

<div class="image">

<img
src="${
c.thumbnail ||
"https://via.placeholder.com/800x450?text=LetsStudy+Pro"
}"
alt="${esc(c.title)}">

${
c.featured
?
`
<span class="featured">
<i class="fa fa-star"></i>
Featured
</span>
`
:""
}

</div>


<div class="body">

<div class="category">

${esc(c.category || "Course")}

${c.subcategory
? " · "+esc(c.subcategory)
:""}

</div>


<h3>
${esc(c.title || "Untitled Course")}
</h3>


<p class="desc">

${esc(
c.shortDescription ||
c.description ||
"Professional course."
)}

</p>


<div class="meta">

<span>
<i class="fa fa-user"></i>
${esc(
c.instructorName ||
"LetsStudy Pro"
)}
</span>

<span class="rating">

<i class="fa fa-star"></i>
${c.rating.toFixed(1)}

(${c.ratingCount})

</span>

<span>
<i class="fa fa-users"></i>
${c.enrollmentCount}
</span>

<span>
<i class="fa fa-eye"></i>
${c.views}
</span>

</div>


<div class="meta">

<span>
<i class="fa fa-signal"></i>
${esc(c.level || "-")}
</span>

<span>
<i class="fa fa-language"></i>
${esc(c.language || "-")}
</span>

<span>
<i class="fa fa-clock"></i>
${esc(c.duration || "-")}
</span>

</div>


<div>

${
free

?

`
<span class="price free">
Free
</span>
`

:

`
<span class="price">

${esc(c.currency)}
${finalPrice.toLocaleString()}

</span>

${
discount>0 && discount<price

?

`
<span class="old">

${esc(c.currency)}
${price.toLocaleString()}

</span>
`

:""
}

`

}

</div>


<button
onclick="openCourse('${c.courseId}')">

<i class="fa fa-arrow-right"></i>

View Course

</button>


</div>

</article>

`;

}


/* ================= OPEN COURSE ================= */

window.openCourse=
function(courseId){

if(!courseId){

alert("Course ID is missing.");

return;

}


/*
 ONLY DOCUMENT ID
*/

location.href=
"enroll.html?id="+
encodeURIComponent(courseId);

};


/* ================= SEARCH ================= */

document.getElementById("search")
.addEventListener(
"input",
renderCourses
);

document.getElementById("category")
.addEventListener(
"change",
renderCourses
);

document.getElementById("level")
.addEventListener(
"change",
renderCourses
);


document.getElementById("topSearch")
.addEventListener(
"input",
function(){

document.getElementById("search")
.value=this.value;

renderCourses();

});


/* ================= CART ================= */

/* ================= CART ================= */

function addToCart(c){

    let cart = [];

    try{
        cart = JSON.parse(
            localStorage.getItem("cart") || "[]"
        );
    }catch(e){
        cart = [];
    }

    const courseId = c.courseId || window.courseId;

    if(!courseId){
        alert("Course ID missing.");
        return;
    }

    /* Already in cart */
    if(cart.some(item => item.courseId === courseId)){

        alert("Course already exists in your cart.");

        location.href = "cart.html";

        return;
    }

    const price =
        Number(c.price || 0);

    const discountPrice =
        Number(c.discountPrice || 0);

    const finalPrice =
        discountPrice > 0 &&
        discountPrice < price
        ? discountPrice
        : price;

    const item = {

        courseId: courseId,

        title: c.title || "",

        slug: c.slug || "",

        thumbnail: c.thumbnail || "",

        shortDescription:
            c.shortDescription || "",

        instructorId:
            c.instructorId || "",

        instructorName:
            c.instructorName ||
            "LetsStudy Pro",

        category:
            c.category || "",

        level:
            c.level || "",

        language:
            c.language || "",

        duration:
            c.duration || "",

        modulesCount:
            Number(c.modulesCount || 0),

        lessonsCount:
            Number(c.lessonsCount || 0),

        price: price,

        discountPrice:
            discountPrice,

        finalPrice:
            finalPrice,

        currency:
            c.currency || "TZS",

        isFree:
            c.isFree === true,

        certificate:
            c.certificate === true,

        addedAt:
            Date.now()

    };

    cart.push(item);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    updateCartCount();

    alert("Course added to cart.");

}


/* ================= CART COUNT ================= */

function updateCartCount(){

    let cart = [];

    try{

        cart = JSON.parse(
            localStorage.getItem("cart") || "[]"
        );

    }catch(e){

        cart = [];

    }

    const count =
        document.getElementById("cartCount");

    if(count){

        count.textContent =
            cart.length;

    }

}


/* ================= CART BUTTON ================= */

document.getElementById(
    "cartButton"
)?.addEventListener(
    "click",
    function(){

        if(window.currentCourse){

            addToCart(
                window.currentCourse
            );

        }

    }
);


/* ================= START ================= */

updateCartCount();


/* ================= ESCAPE ================= */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================= START ================= */

loadCourses();

</script>

</body>
</html>
