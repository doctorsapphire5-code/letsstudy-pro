<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    id="metaDescription"
    content="Explore courses on LetsStudy Pro Ecosystem."
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title id="pageTitle">
    Course | LetsStudy Pro
  </title>


  <style>

    :root{
      --bg:#f5f7fb;
      --surface:#ffffff;
      --surface2:#f8fafc;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --purple:#7c3aed;
      --success:#16a34a;
      --danger:#dc2626;
      --warning:#f59e0b;
      --shadow:0 20px 55px rgba(15,23,42,.09);
      --radius:20px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button,
    input{
      font:inherit;
    }

    button{
      cursor:pointer;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    header{
      position:sticky;
      top:0;
      z-index:1000;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(18px);

      border-bottom:
        1px solid var(--border);
    }

    .nav{
      max-width:1400px;
      min-height:72px;
      margin:auto;
      padding:0 22px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;

      font-weight:900;
      font-size:18px;
    }

    .logo{
      width:43px;
      height:43px;

      display:grid;
      place-items:center;

      border-radius:13px;

      color:#fff;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--purple)
        );
    }

    .brand span{
      color:var(--primary);
    }

    .nav-actions{
      display:flex;
      gap:9px;
    }

    .nav-btn{
      position:relative;

      width:42px;
      height:42px;

      display:grid;
      place-items:center;

      border:
        1px solid var(--border);

      border-radius:11px;

      background:#fff;

      font-size:18px;
    }

    .nav-btn:hover{
      border-color:var(--primary);
      color:var(--primary);
    }

    .cart-count{
      position:absolute;

      top:-6px;
      right:-6px;

      min-width:20px;
      height:20px;

      padding:0 5px;

      display:grid;
      place-items:center;

      border-radius:999px;

      background:var(--danger);
      color:#fff;

      border:
        2px solid #fff;

      font-size:10px;
      font-weight:900;
    }


    /* =====================================================
       MAIN
    ===================================================== */

    main{
      max-width:1400px;
      margin:auto;
      padding:35px 22px 75px;
    }


    /* =====================================================
       BREADCRUMB
    ===================================================== */

    .breadcrumb{
      display:flex;
      flex-wrap:wrap;
      gap:7px;

      color:var(--muted);

      font-size:12px;

      margin-bottom:22px;
    }

    .breadcrumb a:hover{
      color:var(--primary);
    }


    /* =====================================================
       HERO
    ===================================================== */

    .course-hero{
      display:grid;

      grid-template-columns:
        minmax(0,1fr)
        420px;

      gap:30px;

      align-items:start;
    }

    .hero-content{
      padding:15px 0;
    }

    .category{
      display:inline-flex;

      padding:7px 11px;

      border-radius:999px;

      background:#eff6ff;
      color:var(--primary);

      font-size:11px;
      font-weight:900;

      text-transform:uppercase;
      letter-spacing:.06em;
    }

    h1{
      margin-top:15px;

      font-size:
        clamp(32px,5vw,55px);

      line-height:1.05;

      letter-spacing:-1.8px;
    }

    .short-description{
      margin-top:16px;

      max-width:800px;

      color:var(--muted);

      font-size:16px;

      line-height:1.75;
    }

    .course-meta{
      display:flex;
      flex-wrap:wrap;

      gap:10px;

      margin-top:22px;
    }

    .meta-item{
      padding:9px 12px;

      border:
        1px solid var(--border);

      border-radius:10px;

      background:#fff;

      color:var(--muted);

      font-size:12px;
      font-weight:700;
    }

    .meta-item strong{
      color:var(--text);
    }


    /* =====================================================
       COURSE PURCHASE CARD
    ===================================================== */

    .purchase-card{
      overflow:hidden;

      background:#fff;

      border:
        1px solid var(--border);

      border-radius:var(--radius);

      box-shadow:var(--shadow);
    }

    .course-image{
      width:100%;
      height:245px;

      display:block;

      object-fit:cover;

      background:#e2e8f0;
    }

    .purchase-body{
      padding:21px;
    }

    .price{
      font-size:28px;
      font-weight:950;
      letter-spacing:-.7px;
    }

    .price.free{
      color:var(--success);
    }

    .old-price{
      margin-left:7px;

      color:#94a3b8;

      font-size:13px;

      text-decoration:line-through;
    }

    .price-note{
      margin-top:5px;

      color:var(--muted);

      font-size:11px;
    }

    .primary-btn{
      width:100%;

      margin-top:17px;

      padding:15px;

      border:0;

      border-radius:12px;

      color:#fff;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--purple)
        );

      font-size:14px;
      font-weight:900;

      box-shadow:
        0 12px 28px
        rgba(37,99,235,.2);
    }

    .primary-btn:hover{
      transform:translateY(-1px);
    }

    .secondary-btn{
      width:100%;

      margin-top:9px;

      padding:13px;

      border:
        1px solid var(--border);

      border-radius:12px;

      background:#fff;

      font-weight:800;
    }

    .secondary-btn:hover{
      border-color:var(--primary);
      color:var(--primary);
    }

    .purchase-info{
      margin-top:17px;

      padding-top:17px;

      border-top:
        1px solid var(--border);
    }

    .info-row{
      display:flex;

      justify-content:space-between;

      gap:15px;

      padding:7px 0;

      color:var(--muted);

      font-size:12px;
    }

    .info-row strong{
      color:var(--text);
    }


    /* =====================================================
       CONTENT
    ===================================================== */

    .content-layout{
      display:grid;

      grid-template-columns:
        minmax(0,1fr)
        360px;

      gap:25px;

      margin-top:30px;
    }

    .content-card{
      background:#fff;

      border:
        1px solid var(--border);

      border-radius:var(--radius);

      box-shadow:
        0 10px 35px
        rgba(15,23,42,.05);

      padding:25px;
    }

    .content-card h2{
      font-size:23px;

      margin-bottom:14px;
    }

    .description{
      color:#334155;

      line-height:1.8;

      font-size:14px;

      white-space:pre-line;
    }

    .side-card{
      background:#fff;

      border:
        1px solid var(--border);

      border-radius:var(--radius);

      padding:21px;
    }

    .side-card h3{
      font-size:18px;
      margin-bottom:13px;
    }

    .list{
      list-style:none;
    }

    .list li{
      padding:11px 0;

      border-bottom:
        1px solid var(--border);

      color:var(--muted);

      font-size:13px;

      line-height:1.5;
    }

    .list li:last-child{
      border-bottom:0;
    }

    .list strong{
      color:var(--text);
    }


    /* =====================================================
       SKILLS
    ===================================================== */

    .skills{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .skill{
      padding:7px 10px;

      border-radius:8px;

      background:#f1f5f9;

      color:#334155;

      font-size:11px;
      font-weight:700;
    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading{
      min-height:60vh;

      display:grid;
      place-items:center;

      text-align:center;

      color:var(--muted);
    }

    .spinner{
      width:34px;
      height:34px;

      margin:0 auto 13px;

      border:
        3px solid #e2e8f0;

      border-top-color:
        var(--primary);

      border-radius:50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin{

      to{
        transform:rotate(360deg);
      }

    }


    /* =====================================================
       ERROR
    ===================================================== */

    .error{
      max-width:650px;

      margin:80px auto;

      padding:40px 25px;

      text-align:center;

      background:#fff;

      border:
        1px solid var(--border);

      border-radius:20px;

      box-shadow:var(--shadow);
    }

    .error-icon{
      font-size:40px;
      margin-bottom:12px;
    }

    .error h2{
      font-size:24px;
    }

    .error p{
      margin-top:8px;

      color:var(--muted);

      line-height:1.6;
    }

    .back-btn{
      display:inline-block;

      margin-top:20px;

      padding:12px 18px;

      border-radius:11px;

      background:var(--primary);

      color:#fff;

      font-size:13px;
      font-weight:800;
    }


    /* =====================================================
       TOAST
    ===================================================== */

    .toast{
      position:fixed;

      left:50%;
      bottom:25px;

      transform:
        translate(-50%,20px);

      opacity:0;

      pointer-events:none;

      max-width:90%;

      padding:13px 18px;

      border-radius:12px;

      background:#0f172a;

      color:#fff;

      font-size:12px;
      font-weight:750;

      text-align:center;

      box-shadow:
        0 15px 35px
        rgba(15,23,42,.25);

      transition:.25s;

      z-index:5000;
    }

    .toast.show{
      opacity:1;

      transform:
        translate(-50%,0);
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    footer{
      padding:35px 22px;

      background:#fff;

      border-top:
        1px solid var(--border);
    }

    .footer{
      max-width:1400px;
      margin:auto;

      display:flex;

      justify-content:space-between;

      gap:20px;

      flex-wrap:wrap;

      color:var(--muted);

      font-size:12px;
    }

    .footer-links{
      display:flex;
      gap:18px;
      flex-wrap:wrap;
    }

    .footer-links a:hover{
      color:var(--primary);
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media(max-width:1000px){

      .course-hero{
        grid-template-columns:1fr;
      }

      .purchase-card{
        max-width:600px;
      }

      .content-layout{
        grid-template-columns:1fr;
      }

    }

    @media(max-width:600px){

      main{
        padding:
          25px 14px 55px;
      }

      .nav{
        padding:
          0 14px;
      }

      .brand{
        font-size:15px;
      }

      .course-image{
        height:210px;
      }

      .content-card{
        padding:19px;
      }

      h1{
        font-size:34px;
      }

    }

  </style>

</head>

<main id="app">

<!-- =====================================================
     FIREBASE

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


if(
  !firebase.apps.length
){

  firebase.initializeApp(
    firebaseConfig
  );

}


const db =
  firebase.firestore();


/* =====================================================
   STATE
===================================================== */

let course = null;

let cart = [];


/* =====================================================
   DOM
===================================================== */

const app =
  document.getElementById(
    "app"
  );

const cartCount =
  document.getElementById(
    "cartCount"
  );


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function getParam(
  name
){

  return new URLSearchParams(
    window.location.search
  ).get(
    name
  );

}


/* =====================================================
   CART
===================================================== */

function loadCart(){

  try{

    const raw =
      localStorage.getItem(
        "letsStudyProCart"
      );


    cart =
      raw
        ? JSON.parse(raw)
        : [];


    if(
      !Array.isArray(cart)
    ){

      cart = [];

    }

  }catch(error){

    console.error(
      error
    );

    cart = [];

  }


  updateCartCount();

}


function saveCart(){

  localStorage.setItem(
    "letsStudyProCart",
    JSON.stringify(
      cart
    )
  );


  updateCartCount();

}


function updateCartCount(){

  const count =
    cart.reduce(
      (
        total,
        item
      ) =>
        total +
        Number(
          item.quantity || 1
        ),
      0
    );


  if(cartCount){

    cartCount.textContent =
      count;

  }

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(){

  if(!course){

    return;

  }


  const id =
    String(
      course.id
    );


  const existing =
    cart.find(
      item =>
        String(
          item.id ||
          item.courseId
        ) === id
    );


  if(existing){

    existing.quantity =
      Number(
        existing.quantity || 1
      ) + 1;

  }else{

    cart.push({

      id:
        id,

      courseId:
        id,

      title:
        course.title ||
        "Course",

      slug:
        course.slug ||
        "",

      type:
        "course",

      category:
        course.category ||
        "",

      description:
        course.description ||
        "",

      shortDescription:
        course.shortDescription ||
        "",

      thumbnail:
        course.thumbnail ||
        course.imageUrl ||
        "",

      imageUrl:
        course.imageUrl ||
        course.thumbnail ||
        "",

      price:
        Number(
          course.price || 0
        ),

      discountPrice:
        Number(
          course.discountPrice || 0
        ),

      currency:
        course.currency ||
        "TZS",

      quantity:
        1,

      courseUrl:
        "course.html?id=" +
        encodeURIComponent(
          id
        ),

      addedAt:
        new Date().toISOString()

    });

  }


  saveCart();


  showToast(
    "Course added to cart."
  );


  updatePurchaseButton();

}


/* =====================================================
   REMOVE FROM CART
===================================================== */

function removeFromCart(){

  if(!course){

    return;

  }


  cart =
    cart.filter(
      item =>
        String(
          item.id ||
          item.courseId
        ) !==
        String(
          course.id
        )
    );


  saveCart();

  updatePurchaseButton();

}


/* =====================================================
   IS IN CART
===================================================== */

function isInCart(){

  if(!course){

    return false;

  }


  return cart.some(
    item =>
      String(
        item.id ||
        item.courseId
      ) ===
      String(
        course.id
      )
  );

}


/* =====================================================
   PURCHASE BUTTON
===================================================== */

function updatePurchaseButton(){

  const button =
    document.getElementById(
      "cartButton"
    );


  if(!button){

    return;

  }


  if(isInCart()){

    button.textContent =
      "✓ Added to Cart";

    button.style.background =
      "var(--success)";

  }else{

    button.textContent =
      "🛒 Add to Cart";

    button.style.background =
      "";

  }

}


/* =====================================================
   FREE COURSE
===================================================== */

function openFreeCourse(){

  if(!course){

    return;

  }


  const target =
    course.learningUrl ||
    course.courseContentUrl ||
    (
      "learn-course.html?id=" +
      encodeURIComponent(
        course.id
      )
    );


  window.location.href =
    target;

}


/* =====================================================
   COURSE LOAD
===================================================== */

async function loadCourse(){

  const id =
    getParam(
      "id"
    );


  const slug =
    getParam(
      "slug"
    );


  if(!id && !slug){

    showError(
      "Course not specified."
    );

    return;

  }


  try{

    let doc = null;


    if(id){

      doc =
        await db
          .collection(
            "courses"
          )
          .doc(
            id
          )
          .get();


      if(
        doc.exists
      ){

        course = {

          id:
            doc.id,

          ...doc.data()

                };

      }
    }

    /* =====================================================
       FALLBACK: LOAD BY SLUG
    ===================================================== */

    if(
      !course &&
      slug
    ){

      const snapshot =
        await db
          .collection("courses")
          .where(
            "slug",
            "==",
            slug
          )
          .limit(1)
          .get();


      if(
        !snapshot.empty
      ){

        const doc =
          snapshot.docs[0];


        course = {

          id:
            doc.id,

          ...doc.data()

        };

      }

    }


    /* =====================================================
       LOCAL STORAGE FALLBACK
    ===================================================== */

    if(!course){

      await loadCourseFromLocalStorage(
        id,
        slug
      );

    }


    /* =====================================================
       COURSE NOT FOUND
    ===================================================== */

    if(!course){

      showError(
        "This course could not be found."
      );

      return;

    }


    /* =====================================================
       RENDER COURSE
    ===================================================== */

    renderCourse();


  }catch(error){

    console.error(
      "Course loading error:",
      error
    );


    /* Try localStorage if Firebase fails */

    await loadCourseFromLocalStorage(
      id,
      slug
    );


    if(course){

      renderCourse();

    }else{

      showError(
        "Unable to load this course. Please try again."
      );

    }

  }

}


/* =====================================================
   LOCAL STORAGE COURSE FALLBACK
===================================================== */

async function loadCourseFromLocalStorage(
  id,
  slug
){

  try{

    const storageKeys = [

      "letsStudyProCourses",

      "courses",

      "adminCourses",

      "courseData"

    ];


    for(
      const key of storageKeys
    ){

      const raw =
        localStorage.getItem(
          key
        );


      if(!raw){

        continue;

      }


      const data =
        JSON.parse(
          raw
        );


      if(
        !Array.isArray(data)
      ){

        continue;

      }


      const found =
        data.find(
          item => {

            const itemId =
              String(
                item.id ||
                item.courseId ||
                ""
              );


            const itemSlug =
              String(
                item.slug ||
                ""
              );


            return (

              (
                id &&
                itemId ===
                String(id)
              )

              ||

              (
                slug &&
                itemSlug ===
                String(slug)
              )

            );

          }
        );


      if(found){

        course = {

          id:
            found.id ||
            found.courseId,

          ...found

        };


        console.log(
          "Course loaded from localStorage:",
          key
        );


        return;

      }

    }

  }catch(error){

    console.error(
      "localStorage course error:",
      error
    );

  }

}


/* =====================================================
   RENDER COURSE
===================================================== */

function renderCourse(){

  if(!course){

    showError(
      "Course information is unavailable."
    );

    return;

  }


  const title =
    course.title ||
    "Untitled Course";


  const description =
    course.description ||
    course.shortDescription ||
    "No course description available.";


  const shortDescription =
    course.shortDescription ||
    description;


  const category =
    course.category ||
    "General";


  const level =
    course.level ||
    course.experienceLevel ||
    "All Levels";


  const currency =
    course.currency ||
    "TZS";


  const price =
    Number(
      course.price || 0
    );


  const discountPrice =
    Number(
      course.discountPrice || 0
    );


  const finalPrice =
    discountPrice > 0 &&
    discountPrice < price

      ? discountPrice

      : price;


  const image =
    course.thumbnail ||
    course.imageUrl ||
    "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80";


  /* =====================================================
     SEO
  ===================================================== */

  document.title =
    title +
    " | LetsStudy Pro";


  const metaDescription =
    document.getElementById(
      "metaDescription"
    );


  if(metaDescription){

    metaDescription.setAttribute(
      "content",
      shortDescription
    );

  }


  /* =====================================================
     PAGE HTML
  ===================================================== */

  app.innerHTML = `

    <div class="breadcrumb">

      <a href="index.html">
        Home
      </a>

      <span>›</span>

      <a href="courses.html">
        Courses
      </a>

      <span>›</span>

      <span>
        ${escapeHtml(title)}
      </span>

    </div>


    <section class="course-hero">

      <div class="hero-content">

        <span class="category">

          ${escapeHtml(
            category
          )}

        </span>


        <h1>

          ${escapeHtml(
            title
          )}

        </h1>


        <p class="short-description">

          ${escapeHtml(
            shortDescription
          )}

        </p>


        <div class="course-meta">

          <div class="meta-item">

            📊

            <strong>
              ${escapeHtml(
                level
              )}
            </strong>

          </div>


          ${
            course.duration
              ? `

                <div class="meta-item">

                  ⏱

                  <strong>
                    ${escapeHtml(
                      course.duration
                    )}
                  </strong>

                </div>

              `
              : ""
          }


          ${
            course.lessons
              ? `

                <div class="meta-item">

                  📚

                  <strong>
                    ${escapeHtml(
                      course.lessons
                    )}
                  </strong>

                  lessons

                </div>

              `
              : ""
          }


          ${
            course.language
              ? `

                <div class="meta-item">

                  🌐

                  <strong>
                    ${escapeHtml(
                      course.language
                    )}
                  </strong>

                </div>

              `
              : ""
          }


          ${
            course.instructor
              ? `

                <div class="meta-item">

                  👨‍🏫

                  <strong>
                    ${escapeHtml(
                      course.instructor
                    )}
                  </strong>

                </div>

              `
              : ""
          }

        </div>

      </div>


      <aside class="purchase-card">

        <img
          class="course-image"
          src="${escapeHtml(image)}"
          alt="${escapeHtml(title)}"
          onerror="
            this.onerror=null;
            this.src='https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80';
          "
        >


        <div class="purchase-body">

          <div
            class="price ${
              finalPrice <= 0
                ? "free"
                : ""
            }"
          >

            ${
              finalPrice <= 0

                ? "FREE"

                :

                  escapeHtml(
                    currency
                  ) +

                  " " +

                  finalPrice.toLocaleString()

            }


            ${
              discountPrice > 0 &&
              discountPrice < price

                ? `

                  <span class="old-price">

                    ${escapeHtml(
                      currency
                    )}

                    ${price.toLocaleString()}

                  </span>

                `

                : ""
            }

          </div>


          <div class="price-note">

            ${
              finalPrice <= 0

                ? "Free access"

                : "One-time course purchase"

            }

          </div>


          ${
            finalPrice <= 0

              ? `

                <button
                  id="freeButton"
                  class="primary-btn"
                  type="button"
                >

                  🎓 Start Course

                </button>

              `

              :

              `

                <button
                  id="cartButton"
                  class="primary-btn"
                  type="button"
                >

                  🛒 Add to Cart

                </button>

              `

          }


          <a
            href="cart.html"
            class="secondary-btn"
            style="
              display:block;
              text-align:center;
            "
          >

            View Cart

          </a>


          <div class="purchase-info">

            <div class="info-row">

              <span>
                Course type
              </span>

              <strong>

                ${escapeHtml(
                  course.type ||
                  "Course"
                )}

              </strong>

            </div>


            <div class="info-row">

              <span>
                Access
              </span>

              <strong>

                ${escapeHtml(
                  course.access ||
                  "Online"
                )}

              </strong>

            </div>


            <div class="info-row">

              <span>
                Certificate
              </span>

              <strong>

                ${
                  course.certificate
                    ? "Available"
                    : "—"
                }

              </strong>

            </div>

          </div>

        </div>

      </aside>

    </section>


    <section class="content-layout">

      <div>

        <article class="content-card">

          <h2>
            About this course
          </h2>

          <div class="description">

            ${escapeHtml(
              description
            )}

          </div>

        </article>


        ${getSkillsHtml()}


        ${getRequirementsHtml()}

      </div>


      <aside>

        ${getBenefitsHtml()}


        ${getCourseDetailsHtml()}

      </aside>

    </section>

  `;


  /* =====================================================
     BUTTON EVENTS
  ===================================================== */

  attachPurchaseEvents();


  /* =====================================================
     UPDATE CART UI
  ===================================================== */

  updatePurchaseButton();

}


</script>

</body>
</html>
