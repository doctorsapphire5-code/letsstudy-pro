<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}
header{background:#fff;padding:16px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:800}.logo span{color:#2563eb}
.btn{border:0;border-radius:8px;padding:11px 16px;background:#2563eb;color:#fff;cursor:pointer;text-decoration:none}
.hero{background:#111827;color:#fff;padding:45px 6%}
.hero-inner{max-width:1200px;margin:auto;display:grid;grid-template-columns:1.5fr 1fr;gap:35px;align-items:center}
.hero img{width:100%;border-radius:14px;max-height:330px;object-fit:cover}
.container{width:88%;max-width:1200px;margin:30px auto}
.card{background:#fff;padding:25px;border-radius:14px;margin-bottom:20px;box-shadow:0 4px 18px #00000008}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.price{font-size:27px;font-weight:800;margin:15px 0}
.old{text-decoration:line-through;color:#94a3b8;font-size:16px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#dbeafe;color:#1d4ed8;font-size:12px;margin:3px}
ul{line-height:2}
.muted{color:#64748b}
@media(max-width:750px){
 .hero-inner,.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="logo">LetsStudy <span>Pro</span></div>
  <a href="cart.html" class="btn">Cart</a>
</header>

<section class="hero">
  <div class="hero-inner" id="courseHero">
    Loading...
  </div>
</section>

<main class="container">

  <div class="grid">

    <div class="card">
      <h2>What You'll Learn</h2>
      <div id="learn"></div>
    </div>

    <div class="card">
      <h2>Requirements</h2>
      <div id="requirements"></div>
    </div>

  </div>

  <div class="card">
    <h2>About This Course</h2>
    <p id="description"></p>
  </div>

  <div class="card">
    <h2>Target Audience</h2>
    <div id="audience"></div>
  </div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getFirestore,
 doc,
 getDoc,
 updateDoc,
 increment
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const params=new URLSearchParams(location.search);
const courseId=params.get("id");

let course=null;

function money(c){

 if(c.isFree || Number(c.price||0)===0)
   return "Free";

 const price=
   Number(c.discountPrice||0)>0
   ? c.discountPrice
   : c.price;

 return `${c.currency||"TZS"} ${Number(price).toLocaleString()}`;
}

function list(value){

 if(Array.isArray(value)){
   return `<ul>${value.map(x=>`<li>${escapeHTML(x)}</li>`).join("")}</ul>`;
 }

 if(!value)return "<p class='muted'>Not specified.</p>";

 return `<p>${escapeHTML(value)}</p>`;
}

function escapeHTML(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

async function loadCourse(){

 if(!courseId){
   document.getElementById("courseHero").innerHTML=
     "<h2>Course not found.</h2>";
   return;
 }

 const snap=
   await getDoc(
     doc(db,"courses",courseId)
   );

 if(!snap.exists()){
   document.getElementById("courseHero").innerHTML=
     "<h2>Course not found.</h2>";
   return;
 }

 course={
   id:snap.id,
   ...snap.data()
 };

 await updateDoc(
   doc(db,"courses",courseId),
   {views:increment(1)}
 );

 render();
}

function render(){

 document.title=
   course.title+" | LetsStudy Pro";

 document.getElementById("courseHero").innerHTML=`

   <div>

     <span class="badge">
       ${escapeHTML(course.category||"Course")}
     </span>

     ${
       course.featured
       ? `<span class="badge">Featured</span>`
       : ""
     }

     <h1>${escapeHTML(course.title)}</h1>

     <p>
       ${escapeHTML(course.shortDescription||"")}
     </p>

     <p class="muted">
       Instructor:
       ${escapeHTML(course.instructorName||"")}
     </p>

     <p>
       ${escapeHTML(course.level||"")} •
       ${escapeHTML(course.language||"")} •
       ${escapeHTML(course.duration||"")}
     </p>

     <div class="price">
       ${money(course)}

       ${
        Number(course.discountPrice||0)>0
        ? `<span class="old">
             ${course.currency||"TZS"}
             ${Number(course.price||0).toLocaleString()}
           </span>`
        : ""
       }
     </div>

     <button
       class="btn"
       onclick="enrollCourse()">
       ${course.isFree?"Enroll Free":"Enroll Now"}
     </button>

     <button
       class="btn"
       style="background:#0f172a"
       onclick="addToCart()">
       Add to Cart
     </button>

   </div>

   <img
     src="${course.thumbnail||'https://via.placeholder.com/800x450'}"
     onerror="this.src='https://via.placeholder.com/800x450'"
     alt="Course">

 `;

 document.getElementById("learn").innerHTML=
   list(course.whatYouLearn);

 document.getElementById("requirements").innerHTML=
   list(course.requirements);

 document.getElementById("audience").innerHTML=
   list(course.targetAudience);

 document.getElementById("description").textContent=
   course.description||"";

}

window.addToCart=function(){

 const cart=
   JSON.parse(
     localStorage.getItem("letsStudyCart")||"[]"
   );

 const exists=
   cart.some(x=>x.id===course.id);

 if(!exists){

   cart.push({
     id:course.id,
     title:course.title,
     thumbnail:course.thumbnail||"",
     price:Number(
       course.discountPrice||course.price||0
     ),
     currency:course.currency||"TZS"
   });

   localStorage.setItem(
     "letsStudyCart",
     JSON.stringify(cart)
   );

   alert("Course added to cart.");

 }else{

   alert("Course is already in your cart.");

 }

};

window.enrollCourse=function(){

 location.href=
   "enroll.html?id="+
   encodeURIComponent(course.id);

};

loadCourse();

</script>
</body>
</html>
