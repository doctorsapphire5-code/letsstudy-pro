<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>LetsStudy Pro - Course Management</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#1f2937;
}

header{
  background:#111827;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:700;
}

.admin{
  font-size:14px;
  color:#d1d5db;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:25px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.top h1{
  font-size:25px;
}

.top p{
  color:#6b7280;
  margin-top:5px;
}

.btn{
  border:0;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.stat i{
  font-size:22px;
  color:#2563eb;
}

.stat h2{
  margin-top:10px;
}

.stat span{
  color:#6b7280;
  font-size:13px;
}

.panel{
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:7px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

.search{
  max-width:350px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:14px 10px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:14px;
}

th{
  background:#f9fafb;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

.published{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#fef3c7;
  color:#92400e;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.actions button{
  border:0;
  padding:7px 9px;
  border-radius:6px;
  cursor:pointer;
}

.edit{
  background:#dbeafe;
  color:#1d4ed8;
}

.preview{
  background:#ede9fe;
  color:#6d28d9;
}

.status{
  background:#dcfce7;
  color:#166534;
}

.delete{
  background:#fee2e2;
  color:#b91c1c;
}

.empty{
  text-align:center;
  padding:35px;
  color:#6b7280;
}

.loading{
  text-align:center;
  padding:30px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal.active{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:850px;
  max-height:92vh;
  overflow:auto;
  border-radius:14px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:none;
  font-size:24px;
  cursor:pointer;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.form-group{
  margin-bottom:15px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  display:block;
  font-weight:600;
  font-size:14px;
  margin-bottom:7px;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
}

.checkbox input{
  width:auto;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .table-wrap{
    overflow-x:auto;
  }

  table{
    min-width:850px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }
}

@media(max-width:500px){

  .container{
    padding:15px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
  }

  .search{
    max-width:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    LetsStudy Pro
  </div>

  <div class="admin">
    <i class="fa-solid fa-user-shield"></i>
    Admin
  </div>
</header>

<main class="container">

  <div class="top">

    <div>
      <h1>Course Management</h1>
      <p>Manage courses, status, editing and previews</p>
    </div>

    <button class="btn btn-primary" id="addCourseBtn">
      <i class="fa-solid fa-plus"></i>
      Add Course
    </button>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <i class="fa-solid fa-book"></i>
      <h2 id="totalCourses">0</h2>
      <span>Total Courses</span>
    </div>

    <div class="stat">
      <i class="fa-solid fa-circle-check"></i>
      <h2 id="publishedCourses">0</h2>
      <span>Published</span>
    </div>

    <div class="stat">
      <i class="fa-solid fa-file"></i>
      <h2 id="draftCourses">0</h2>
      <span>Drafts</span>
    </div>

    <div class="stat">
      <i class="fa-solid fa-users"></i>
      <h2 id="enrollments">0</h2>
      <span>Enrollments</span>
    </div>

  </div>


  <!-- COURSES -->

  <section class="panel">

    <div class="toolbar">

      <input
        type="search"
        id="search"
        class="search"
        placeholder="Search courses..."
      >

      <select id="statusFilter">
        <option value="all">All Status</option>
        <option value="published">Published</option>
        <option value="draft">Draft</option>
      </select>

      <select id="categoryFilter">
        <option value="all">All Courses</option>
      </select>

    </div>


    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Course</th>
            <th>Category</th>
            <th>Price</th>
            <th>Status</th>
            <th>Featured</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="coursesBody">

          <tr>
            <td colspan="6" class="loading">
              Loading courses...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<!-- ADD / EDIT MODAL -->

<div class="modal" id="courseModal">

  <div class="modal-box">

    <div class="modal-head">

      <div>
        <h2 id="modalTitle">Add Course</h2>
        <p id="courseIdText"></p>
      </div>

      <button class="close" id="closeModal">
        &times;
      </button>

    </div>


    <form id="courseForm">

      <div class="form-grid">

        <div class="form-group full">

          <label>Course Title *</label>

          <input
            type="text"
            id="title"
            required
            placeholder="Complete Digital Marketing Course"
          >

        </div>


        <div class="form-group">

          <label>Category *</label>

          <input
            type="text"
            id="category"
            required
            placeholder="Business"
          >

        </div>


        <div class="form-group">

          <label>Level</label>

          <select id="level">

            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>

          </select>

        </div>


        <div class="form-group">

          <label>Language</label>

          <select id="language">

            <option value="English">English</option>
            <option value="Swahili">Swahili</option>

          </select>

        </div>


        <div class="form-group">

          <label>Duration</label>

          <input
            type="text"
            id="duration"
            placeholder="6 Weeks"
          >

        </div>


        <div class="form-group">

          <label>Instructor</label>

          <input
            type="text"
            id="instructor"
            placeholder="Instructor name"
          >

        </div>


        <div class="form-group">

          <label>Price</label>

          <input
            type="number"
            id="price"
            value="0"
            min="0"
          >

        </div>


        <div class="form-group">

          <label>Currency</label>

          <select id="currency">

            <option value="TZS">TZS</option>
            <option value="USD">USD</option>

          </select>

        </div>


        <div class="form-group full">

          <label>Thumbnail URL</label>

          <input
            type="url"
            id="thumbnail"
            placeholder="https://example.com/image.jpg"
          >

        </div>


        <div class="form-group full">

          <label>Short Description</label>

          <textarea
            id="shortDescription"
            rows="3"
            placeholder="Short course description..."
          ></textarea>

        </div>


        <div class="form-group full">

          <label>Description *</label>

          <textarea
            id="description"
            rows="7"
            required
            placeholder="Full course description..."
          ></textarea>

        </div>


        <div class="form-group">

          <label>Status</label>

          <select id="status">

            <option value="draft">Draft</option>
            <option value="published">Published</option>

          </select>

        </div>


        <div class="form-group">

          <label>Featured</label>

          <div class="checkbox">

            <input
              type="checkbox"
              id="featured"
            >

            <span>Featured Course</span>

          </div>

        </div>

      </div>


      <div class="form-actions">

        <button
          type="button"
          class="btn btn-secondary"
          id="cancelBtn"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          id="saveBtn"
        >
          <i class="fa-solid fa-floppy-disk"></i>
          Save Course
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const coursesBody =
  document.getElementById("coursesBody");

const modal =
  document.getElementById("courseModal");

const form =
  document.getElementById("courseForm");

const search =
  document.getElementById("search");

const statusFilter =
  document.getElementById("statusFilter");

const categoryFilter =
  document.getElementById("categoryFilter");

const addCourseBtn =
  document.getElementById("addCourseBtn");

const closeModal =
  document.getElementById("closeModal");

const cancelBtn =
  document.getElementById("cancelBtn");

const modalTitle =
  document.getElementById("modalTitle");

const courseIdText =
  document.getElementById("courseIdText");

const saveBtn =
  document.getElementById("saveBtn");


let courses = [];

let editingCourseId = null;


/* =========================
   LOAD COURSES
========================= */

async function loadCourses(){

  coursesBody.innerHTML = `
    <tr>
      <td colspan="6" class="loading">
        Loading courses...
      </td>
    </tr>
  `;

  try{

    const snapshot =
      await getDocs(
        collection(db,"courses")
      );

    courses = [];

    snapshot.forEach(docSnap => {

      courses.push({

        id: docSnap.id,

        ...docSnap.data()

      });

    });


    updateStats();

    populateCategories();

    renderCourses();

  }catch(error){

    console.error(error);

    coursesBody.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          Failed to load courses.
          <br>
          ${error.message}
        </td>
      </tr>
    `;

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  const total =
    courses.length;

  const published =
    courses.filter(
      c => c.status === "published"
    ).length;

  const draft =
    courses.filter(
      c => c.status === "draft"
    ).length;

  const enrollments =
    courses.reduce(
      (sum,c) =>
        sum + Number(c.enrollments || 0),
      0
    );


  document.getElementById(
    "totalCourses"
  ).textContent = total;


  document.getElementById(
    "publishedCourses"
  ).textContent = published;


  document.getElementById(
    "draftCourses"
  ).textContent = draft;


  document.getElementById(
    "enrollments"
  ).textContent = enrollments;

}


/* =========================
   CATEGORIES
========================= */

function populateCategories(){

  const categories =
    [
      ...new Set(
        courses
          .map(c => c.category)
          .filter(Boolean)
      )
    ]
    .sort();


  categoryFilter.innerHTML =
    `<option value="all">All Courses</option>`;


  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value = category;

    option.textContent = category;

    categoryFilter.appendChild(option);

  });

}


/* =========================
   RENDER
========================= */

function renderCourses(){

  const query =
    search.value
      .trim()
      .toLowerCase();

  const selectedStatus =
    statusFilter.value;

  const selectedCategory =
    categoryFilter.value;


  const filtered =
    courses.filter(course => {

      const matchesSearch =
        !query ||

        String(course.title || "")
          .toLowerCase()
          .includes(query)

        ||

        String(course.category || "")
          .toLowerCase()
          .includes(query);


      const matchesStatus =
        selectedStatus === "all" ||

        course.status === selectedStatus;


      const matchesCategory =
        selectedCategory === "all" ||

        course.category === selectedCategory;


      return (
        matchesSearch &&
        matchesStatus &&
        matchesCategory
      );

    });


  if(!filtered.length){

    coursesBody.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          No courses found.
        </td>
      </tr>
    `;

    return;

  }


  coursesBody.innerHTML =
    filtered.map(course => {

      const price =
        Number(course.price || 0)
          .toLocaleString();


      const status =
        course.status || "draft";


      return `

      <tr>

        <td>

          <strong>
            ${escapeHtml(
              course.title || "Untitled Course"
            )}
          </strong>

          <br>

          <small>
            ID: ${course.id}
          </small>

        </td>


        <td>
          ${escapeHtml(
            course.category || "-"
          )}
        </td>


        <td>
          ${price}
          ${course.currency || "TZS"}
        </td>


        <td>

          <span class="badge ${status}">
            ${status}
          </span>

        </td>


        <td>
          ${course.featured ? "Yes" : "No"}
        </td>


        <td>

          <div class="actions">

            <button
              class="edit"
              onclick="editCourse('${course.id}')"
            >
              <i class="fa-solid fa-pen"></i>
              Edit
            </button>


            <button
              class="preview"
              onclick="previewCourse('${course.id}')"
            >
              <i class="fa-solid fa-eye"></i>
              Preview
            </button>


            <button
              class="status"
              onclick="toggleStatus('${course.id}')"
            >
              <i class="fa-solid fa-toggle-on"></i>
              Status
            </button>


            <button
              class="delete"
              onclick="removeCourse('${course.id}')"
            >
              <i class="fa-solid fa-trash"></i>
            </button>

          </div>

        </td>

      </tr>

      `;

    }).join("");

}


/* =========================
   ADD COURSE
========================= */

addCourseBtn.addEventListener(
  "click",
  () => {

    editingCourseId = null;

    form.reset();

    document.getElementById(
      "price"
    ).value = 0;

    document.getElementById(
      "currency"
    ).value = "TZS";

    document.getElementById(
      "status"
    ).value = "draft";

    modalTitle.textContent =
      "Add Course";

    courseIdText.textContent = "";

    saveBtn.innerHTML =
      `<i class="fa-solid fa-floppy-disk"></i>
       Save Course`;

    modal.classList.add("active");

  }
);


/* =========================
   EDIT COURSE
========================= */

window.editCourse =
async function(id){

  const course =
    courses.find(
      c => c.id === id
    );


  if(!course){

    alert("Course not found.");

    return;

  }


  editingCourseId = id;


  document.getElementById(
    "title"
  ).value =
    course.title || "";


  document.getElementById(
    "category"
  ).value =
    course.category || "";


  document.getElementById(
    "level"
  ).value =
    course.level || "Beginner";


  document.getElementById(
    "language"
  ).value =
    course.language || "English";


  document.getElementById(
    "duration"
  ).value =
    course.duration || "";


  document.getElementById(
    "instructor"
  ).value =
    course.instructor || "";


  document.getElementById(
    "price"
  ).value =
    course.price || 0;


  document.getElementById(
    "currency"
  ).value =
    course.currency || "TZS";


  document.getElementById(
    "thumbnail"
  ).value =
    course.thumbnail || "";


  document.getElementById(
    "shortDescription"
  ).value =
    course.shortDescription || "";


  document.getElementById(
    "description"
  ).value =
    course.description || "";


  document.getElementById(
    "status"
  ).value =
    course.status || "draft";


  document.getElementById(
    "featured"
  ).checked =
    Boolean(course.featured);


  modalTitle.textContent =
    "Edit Course";


  courseIdText.textContent =
    "Course ID: " + id;


  saveBtn.innerHTML =
    `<i class="fa-solid fa-floppy-disk"></i>
     Update Course`;


  modal.classList.add("active");

};


/* =========================
   SAVE / UPDATE
========================= */

form.addEventListener(
  "submit",
  async e => {

    e.preventDefault();


    const data = {

      title:
        document.getElementById(
          "title"
        ).value.trim(),

      category:
        document.getElementById(
          "category"
        ).value.trim(),

      level:
        document.getElementById(
          "level"
        ).value,

      language:
        document.getElementById(
          "language"
        ).value,

      duration:
        document.getElementById(
          "duration"
        ).value.trim(),

      instructor:
        document.getElementById(
          "instructor"
        ).value.trim(),

      price:
        Number(
          document.getElementById(
            "price"
          ).value || 0
        ),

      currency:
        document.getElementById(
          "currency"
        ).value,

      thumbnail:
  document.getElementById(
    "thumbnail"
  ).value.trim(),

shortDescription:
  document.getElementById(
    "shortDescription"
  ).value.trim(),

description:
  document.getElementById(
    "description"
  ).value.trim(),

status:
  document.getElementById(
    "status"
  ).value,

featured:
  document.getElementById(
    "featured"
  ).checked,

updatedAt:
  new Date()

};


/* =========================
   VALIDATION
========================= */

if (!data.title) {
  alert("Course title is required.");
  return;
}

if (!data.category) {
  alert("Course category is required.");
  return;
}

if (!data.description) {
  alert("Course description is required.");
  return;
}


/* =========================
   SAVE BUTTON
========================= */

saveBtn.disabled = true;

saveBtn.innerHTML =
  `<i class="fa-solid fa-spinner fa-spin"></i>
   Saving...`;


try {

  /* =========================
     UPDATE COURSE
  ========================= */

  if (editingCourseId) {

    await updateDoc(
      doc(
        db,
        "courses",
        editingCourseId
      ),
      data
    );

    alert(
      "Course updated successfully."
    );

  }

  /* =========================
     ADD NEW COURSE
  ========================= */

  else {

    const docRef =
      await addDoc(
        collection(
          db,
          "courses"
        ),
        {
          ...data,

          enrollments: 0,

          createdAt:
            new Date()
        }
      );

    alert(
      "Course created successfully.\n\nCourse ID: "
      + docRef.id
    );

  }


  /* =========================
     CLOSE + RELOAD
  ========================= */

  closeCourseModal();

  await loadCourses();


} catch (error) {

  console.error(
    "Course save error:",
    error
  );

  alert(
    "Failed to save course:\n" +
    error.message
  );

}


/* =========================
   RESTORE BUTTON
========================= */

saveBtn.disabled = false;

saveBtn.innerHTML =
  `<i class="fa-solid fa-floppy-disk"></i>
   ${editingCourseId
      ? "Update Course"
      : "Save Course"
   }`;

});


/* =========================
   PREVIEW COURSE
========================= */

window.previewCourse =
function(id) {

  if (!id) {

    alert(
      "Course ID is missing."
    );

    return;

  }

  window.open(
    "course.html?id=" +
    encodeURIComponent(id),
    "_blank"
  );

};


/* =========================
   EDIT COURSE
========================= */

window.editCourse =
async function(id) {

  if (!id) {

    alert(
      "Course ID is missing."
    );

    return;

  }


  const course =
    courses.find(
      c => c.id === id
    );


  if (!course) {

    alert(
      "Course not found."
    );

    return;

  }


  editingCourseId = id;


  document.getElementById(
    "title"
  ).value =
    course.title || "";


  document.getElementById(
    "category"
  ).value =
    course.category || "";


  document.getElementById(
    "level"
  ).value =
    course.level || "Beginner";


  document.getElementById(
    "language"
  ).value =
    course.language || "English";


  document.getElementById(
    "duration"
  ).value =
    course.duration || "";


  document.getElementById(
    "instructor"
  ).value =
    course.instructor || "";


  document.getElementById(
    "price"
  ).value =
    course.price || 0;


  document.getElementById(
    "currency"
  ).value =
    course.currency || "TZS";


  document.getElementById(
    "thumbnail"
  ).value =
    course.thumbnail || "";


  document.getElementById(
    "shortDescription"
  ).value =
    course.shortDescription || "";


  document.getElementById(
    "description"
  ).value =
    course.description || "";


  document.getElementById(
    "status"
  ).value =
    course.status || "draft";


  document.getElementById(
    "featured"
  ).checked =
    Boolean(course.featured);


  modalTitle.textContent =
    "Edit Course";


  courseIdText.textContent =
    "Course ID: " + id;


  saveBtn.innerHTML =
    `<i class="fa-solid fa-floppy-disk"></i>
     Update Course`;


  modal.classList.add(
    "active"
  );

};


/* =========================
   CHANGE STATUS
========================= */

window.toggleStatus =
async function(id) {

  if (!id) {

    alert(
      "Course ID is missing."
    );

    return;

  }


  const course =
    courses.find(
      c => c.id === id
    );


  if (!course) {

    alert(
      "Course not found."
    );

    return;

  }


  const newStatus =
    course.status === "published"
      ? "draft"
      : "published";


  try {

    await updateDoc(
      doc(
        db,
        "courses",
        id
      ),
      {
        status: newStatus,
        updatedAt: new Date()
      }
    );


    await loadCourses();


  } catch (error) {

    console.error(error);

    alert(
      "Failed to change status:\n" +
      error.message
    );

  }

};


/* =========================
   DELETE COURSE
========================= */

window.removeCourse =
async function(id) {

  if (!id) {

    alert(
      "Course ID is missing."
    );

    return;

  }


  const course =
    courses.find(
      c => c.id === id
    );


  if (!course) {

    alert(
      "Course not found."
    );

    return;

  }


  const confirmed =
    confirm(
      "Delete this course?\n\n" +
      course.title
    );


  if (!confirmed) {
    return;
  }


  try {

    await deleteDoc(
      doc(
        db,
        "courses",
        id
      )
    );


    alert(
      "Course deleted successfully."
    );


    await loadCourses();


  } catch (error) {

    console.error(error);

    alert(
      "Failed to delete course:\n" +
      error.message
    );

  }

};


/* =========================
   CLOSE MODAL
========================= */

function closeCourseModal() {

  modal.classList.remove(
    "active"
  );

  form.reset();

  editingCourseId = null;

  modalTitle.textContent =
    "Add Course";

  courseIdText.textContent = "";

  saveBtn.innerHTML =
    `<i class="fa-solid fa-floppy-disk"></i>
     Save Course`;

}


closeModal.addEventListener(
  "click",
  closeCourseModal
);


cancelBtn.addEventListener(
  "click",
  closeCourseModal
);


/* =========================
   CLOSE OUTSIDE
========================= */

modal.addEventListener(
  "click",
  function(e) {

    if (e.target === modal) {

      closeCourseModal();

    }

  }
);


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  renderCourses
);


/* =========================
   STATUS FILTER
========================= */

statusFilter.addEventListener(
  "change",
  renderCourses
);


/* =========================
   CATEGORY FILTER
========================= */

categoryFilter.addEventListener(
  "change",
  renderCourses
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   INITIAL LOAD
========================= */

loadCourses();

</script>
