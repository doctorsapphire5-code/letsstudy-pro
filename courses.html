<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course | LetsStudy Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:Arial;color:#172033}
header{background:#111827;color:#fff;padding:18px}.container{max-width:1050px;margin:auto;padding:20px}
.card{background:#fff;padding:22px;border-radius:14px;margin-bottom:18px;box-shadow:0 3px 15px #0001}
.hero{display:grid;grid-template-columns:280px 1fr;gap:25px}.thumb{width:100%;height:190px;object-fit:cover;border-radius:10px}
h1{margin:0 0 10px}.muted{color:#6b7280}.price{font-size:25px;font-weight:bold;color:#16a34a}
button,.btn{border:0;background:#2563eb;color:#fff;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:5px 10px;border-radius:20px;font-size:12px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:700px){.hero,.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<div class="container"><b>LetsStudy Pro</b></div>
</header>

<main class="container">

<div id="loading" class="card">Loading course...</div>

<div id="error" class="card" style="display:none">
<h2>Course not found</h2>
<p>Course ID is missing or invalid.</p>
</div>

<div id="content" style="display:none">

<section class="card">

<div class="hero">

<img id="thumbnail" class="thumb">

<div>

<span id="status" class="badge"></span>

<h1 id="title"></h1>

<p id="shortDescription" class="muted"></p>

<p>
<b>Instructor:</b>
<span id="instructor"></span>
</p>

<p>
<b>Level:</b>
<span id="level"></span>
</p>

<p>
<b>Duration:</b>
<span id="duration"></span>
</p>

<p class="price">
<span id="price"></span>
<span id="currency"></span>
</p>

<button id="enrollBtn">
Enroll Now
</button>

<button id="cartBtn">
Add to Cart
</button>

</div>

</div>

</section>

<div class="grid">

<div>

<section class="card">
<h2>Description</h2>
<div id="description"></div>
</section>

<section class="card">
<h2>Course Content</h2>
<div id="modules">Loading...</div>
</section>

</div>

<aside>

<section class="card">
<h3>Course Information</h3>

<p><b>Category</b><br><span id="category"></span></p>
<p><b>Language</b><br><span id="language"></span></p>
<p><b>Students</b><br><span id="students"></span></p>
<p><b>Course ID</b><br><small id="courseId"></small></p>

</section>

</aside>

</div>

</div>
</main>


<script type="module">

import{
initializeApp
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import{
getFirestore,
doc,
getDoc,
collection,
getDocs,
updateDoc,
increment
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


const courseId=
new URLSearchParams(location.search).get("id");

let course;


if(!courseId){

showError();

}else{

loadCourse();

}


async function loadCourse(){

try{

const ref=doc(db,"courses",courseId);
const snap=await getDoc(ref);

if(!snap.exists()){
showError();
return;
}

course={
id:snap.id,
...snap.data()
};

set("title",course.title);
set("shortDescription",course.shortDescription);
setHTML("description",course.description);

set("instructor",course.instructor);
set("level",course.level);
set("duration",course.duration);
set("category",course.category);
set("language",course.language);
set("students",Number(course.enrollments||0).toLocaleString());
set("courseId",course.id);
set("status",course.status||"draft");

set(
"price",
Number(course.price||0).toLocaleString()
);

set("currency",course.currency||"TZS");

document.getElementById("thumbnail").src=
course.thumbnail||
"https://via.placeholder.com/600x400";


try{
await updateDoc(ref,{
views:increment(1)
});
}catch(e){}


document.getElementById("enrollBtn")
.onclick=()=>{
location.href=
`enroll.html?id=${encodeURIComponent(course.id)}`;
};


document.getElementById("cartBtn")
.onclick=()=>{
addToCart(course);
};


await loadModules();

document.getElementById("loading").style.display="none";
document.getElementById("content").style.display="block";

}catch(error){

console.error(error);
showError();

}

}


function addToCart(course){

let cart=
JSON.parse(localStorage.getItem("letsStudyCart")||"[]");

const exists=
cart.some(x=>x.id===course.id);

if(exists){

alert("Course already exists in cart.");

}else{

cart.push({
id:course.id,
title:course.title,
price:Number(course.price||0),
currency:course.currency||"TZS",
thumbnail:course.thumbnail||""
});

localStorage.setItem(
"letsStudyCart",
JSON.stringify(cart)
);

alert("Course added to cart.");

}

}


async function loadModules(){

const box=document.getElementById("modules");

try{

const snap=await getDocs(
collection(
db,
"courses",
courseId,
"modules"
)
);

if(snap.empty){

box.innerHTML="<p>No modules available yet.</p>";
return;

}

box.innerHTML=snap.docs.map(m=>`

<div style="
padding:13px;
border:1px solid #eee;
margin:8px 0;
border-radius:8px">

<b>${esc(m.data().title||"Module")}</b>

</div>

`).join("");

}catch(e){

box.innerHTML="<p>Course content unavailable.</p>";

}

}


function set(id,value){
document.getElementById(id).textContent=value||"-";
}

function setHTML(id,value){
document.getElementById(id).innerHTML=value||"";
}

function esc(value){
return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function showError(){
document.getElementById("loading").style.display="none";
document.getElementById("error").style.display="block";
}

</script>

</body>
</html>
