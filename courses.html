<script>

"use strict";


/*
====================================================
LETSSTUDY PRO — PUBLIC COURSE PAGE
====================================================

Firebase Auth/Admin:
NOT USED HERE.

Public data:
GET /api/data?collection=courses&id=COURSE_ID

Modules:
GET /api/data?collection=courseModules&courseId=COURSE_ID

Lessons:
GET /api/data?collection=lessons&courseId=COURSE_ID

If your Firestore uses another module collection,
the page will still work with lessons directly.
====================================================
*/


const API =
  "/api/data";


let course = null;

let modules = [];

let lessons = [];



/*
====================================================
GET COURSE ID
====================================================
*/

function getCourseId(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  return (
    params.get("courseId") ||
    params.get("id") ||
    params.get("course") ||
    ""
  ).trim();

}



/*
====================================================
API REQUEST
====================================================
*/

async function api(
  params
){

  const query =
    new URLSearchParams(
      params
    );


  const response =
    await fetch(
      API +
      "?" +
      query.toString(),
      {
        method:"GET",
        headers:{
          "Accept":"application/json"
        },
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "API request failed: " +
      response.status
    );

  }


  const data =
    await response.json();


  if(!data.success){

    throw new Error(
      data.error ||
      "API request failed"
    );

  }


  return data;

}



/*
====================================================
LOAD COURSE
====================================================
*/

async function loadCourse(){

  const courseId =
    getCourseId();


  if(!courseId){

    showError(
      "No course ID was provided. Open the course using ?courseId=COURSE_ID."
    );

    showEmpty();

    return;

  }


  try{

    /*
      COURSE
    */

    const courseResponse =
      await api({
        collection:"courses",
        id:courseId
      });


    course =
      normalizeCourse(
        courseResponse.data
      );


    /*
      MODULES
    */

    try{

      const moduleResponse =
        await api({
          collection:"courseModules",
          limit:"100"
        });


      modules =
        normalizeArray(
          moduleResponse.results
        )
        .filter(
          item =>
            sameCourse(
              item,
              courseId
            )
        );

    }catch(error){

      console.warn(
        "Module API unavailable:",
        error
      );

      modules = [];

    }


    /*
      LESSONS
    */

    try{

      const lessonResponse =
        await api({
          collection:"lessons",
          limit:"100"
        });


      lessons =
        normalizeArray(
          lessonResponse.results
        )
        .filter(
          item =>
            sameCourse(
              item,
              courseId
            )
        );

    }catch(error){

      console.warn(
        "Lesson API unavailable:",
        error
      );

      lessons = [];

    }


    renderCourse();

  }catch(error){

    console.error(
      error
    );


    showError(
      "Unable to load this course."
    );

    showEmpty();

  }

}



/*
====================================================
NORMALIZE COURSE
====================================================
*/

function normalizeCourse(
  data
){

  return {

    id:
      data.id ||
      data.documentId ||
      data.courseId,

    title:
      data.title ||
      data.name ||
      "Untitled Course",

    description:
      data.description ||
      data.shortDescription ||
      "",

    category:
      data.category ||
      data.subject ||
      "General",

    level:
      data.level ||
      data.educationLevel ||
      "",

    language:
      data.language ||
      "English",

    image:
      data.image ||
      data.coverImage ||
      data.thumbnail ||
      "",

    price:
      Number(
        data.price ||
        data.amount ||
        0
      ),

    currency:
      data.currency ||
      "TZS",

    access:
      String(
        data.access ||
        data.plan ||
        (
          Number(
            data.price || 0
          ) > 0
          ? "premium"
          : "free"
        )
      ).toLowerCase(),

    duration:
      data.duration ||
      data.totalDuration ||
      "",

    instructor:
      data.instructor ||
      data.teacher ||
      data.creatorName ||
      "",

    status:
      data.status ||
      "published"

  };

}



/*
====================================================
NORMALIZE ARRAY
====================================================
*/

function normalizeArray(
  array
){

  if(
    !Array.isArray(array)
  ){

    return [];

  }


  return array.map(
    item => ({
      id:
        item.id ||
        item.documentId,

      ...item
    })
  );

}



/*
====================================================
COURSE MATCH
====================================================
*/

function sameCourse(
  item,
  courseId
){

  const values = [

    item.courseId,

    item.courseID,

    item.course,

    item.parentCourseId,

    item.courseDocumentId

  ];


  return values.some(
    value =>
      String(
        value || ""
      ) === String(
        courseId
      )
  );

}



/*
====================================================
RENDER COURSE
====================================================
*/

function renderCourse(){

  if(!course){

    showEmpty();

    return;

  }


  document.title =
    course.title +
    " | LetsStudy Pro";


  /*
    HERO
  */

  const premium =
    isPremium(
      course
    );


  document.getElementById(
    "heroContent"
  ).innerHTML = `

    <div class="badges">

      <span class="badge">
        ${escapeHTML(
          course.category
        )}
      </span>


      ${
        course.level
        ? `
          <span class="badge">
            ${escapeHTML(
              course.level
            )}
          </span>
        `
        : ""
      }


      <span
        class="badge ${
          premium
          ? "premium"
          : "free"
        }"
      >

        ${
          premium
          ? "PREMIUM"
          : "FREE"
        }

      </span>

    </div>


    <h1>
      ${escapeHTML(
        course.title
      )}
    </h1>


    <p class="hero-description">

      ${escapeHTML(
        course.description
      )}

    </p>

  `;


  /*
    COVER
  */

  const cover =
    document.getElementById(
      "cover"
    );


  cover.src =
    safeImage(
      course.image
    );


  cover.onerror =
    function(){

      this.src =
        fallbackImage();

    };


  /*
    DESCRIPTION
  */

  document.getElementById(
    "courseDescription"
  ).innerHTML = `

    <h2>
      About This Course
    </h2>

    <div
      class="description"
      style="margin-top:12px"
    >

      ${escapeHTML(
        course.description ||
        "No course description available."
      )}

    </div>


    ${
      course.instructor
      ? `
        <div class="meta">

          <div class="meta-item">

            Instructor:
            <strong>
              ${escapeHTML(
                course.instructor
              )}
            </strong>

          </div>

        </div>
      `
      : ""
    }

  `;


  /*
    SUMMARY
  */

  document.getElementById(
    "level"
  ).textContent =
    course.level || "—";


  document.getElementById(
    "category"
  ).textContent =
    course.category || "—";


  document.getElementById(
    "language"
  ).textContent =
    course.language || "—";


  document.getElementById(
    "moduleCount"
  ).textContent =
    modules.length;


  document.getElementById(
    "lessonCount"
  ).textContent =
    lessons.length;


  const price =
    document.getElementById(
      "price"
    );


  if(premium){

    price.textContent =
      formatMoney(
        course.price,
        course.currency
      );

  }else{

    price.textContent =
      "Free";

    price.classList.add(
      "free"
    );

  }


  /*
    ENROLL
  */

  const enrollBtn =
    document.getElementById(
      "enrollBtn"
    );


  enrollBtn.disabled =
    false;


  enrollBtn.onclick =
    function(){

      /*
        Keep public page clean.
        Existing enrollment flow receives
        courseId.
      */

      window.location.href =
        "/enroll.html?courseId=" +
        encodeURIComponent(
          course.id
        );

    };


  /*
    CONTENT
  */

  renderModules();

}



/*
====================================================
MODULES
====================================================
*/

function renderModules(){

  const container =
    document.getElementById(
      "modules"
    );


  /*
    If there are no module documents,
    group lessons directly by moduleId.
  */

  if(!modules.length){

    if(!lessons.length){

      container.innerHTML = `

        <div class="empty">

          <h3>
            Course content is not available yet.
          </h3>

        </div>

      `;

      return;

    }


    const grouped =
      {};


    lessons.forEach(
      lesson => {

        const key =
          lesson.moduleId ||
          lesson.moduleID ||
          lesson.module ||
          "course";


        if(!grouped[key]){

          grouped[key] = [];

        }


        grouped[key].push(
          lesson
        );

      }
    );


    modules =
      Object.keys(
        grouped
      ).map(
        (key,index) => ({

          id:key,

          title:
            key === "course"
            ? "Course Lessons"
            : "Module " +
              (index + 1),

          lessons:
            grouped[key]

        })
      );

  }


  container.innerHTML =
    modules
      .map(
        (module,index) => {

          const moduleLessons =
            module.lessons ||
            lessons.filter(
              lesson =>
                String(
                  lesson.moduleId ||
                  lesson.moduleID ||
                  lesson.module ||
                  ""
                ) ===
                String(
                  module.id
                )
            );


          return `

            <div
              class="module ${
                index === 0
                ? "open"
                : ""
              }"
            >

              <div
                class="module-head"
                onclick="toggleModule(this)"
              >

                <div>

                  <div class="module-title">

                    ${escapeHTML(
                      module.title ||
                      module.name ||
                      "Module " +
                      (index + 1)
                    )}

                  </div>


                  <div class="module-meta">

                    ${moduleLessons.length}
                    lesson${
                      moduleLessons.length === 1
                      ? ""
                      : "s"
                    }

                  </div>

                </div>


                <span>
                  ▼
                </span>

              </div>


              <div class="lessons">

                ${
                  moduleLessons.length
                  ? moduleLessons
                      .map(
                        createLesson
                      )
                      .join("")
                  : `
                    <div class="empty">
                      No lessons available.
                    </div>
                  `
                }

              </div>

            </div>

          `;

        }
      )
      .join("");

}



/*
====================================================
LESSON
====================================================
*/

function createLesson(
  lesson
){

  const id =
    lesson.id ||
    lesson.documentId;


  const title =
    lesson.title ||
    lesson.name ||
    "Untitled Lesson";


  const type =
    lesson.type ||
    lesson.lessonType ||
    "Lesson";


  return `

    <div class="lesson">

      <div>

        <div class="lesson-title">

          ${escapeHTML(
            title
          )}

        </div>


        <div class="lesson-type">

          ${escapeHTML(
            type
          )}

          ${
            lesson.duration
            ? " • " +
            escapeHTML(String(lesson.duration))
: "";

const lessonUrl =
  lesson.url ||
  lesson.videoUrl ||
  lesson.videoURL ||
  `lesson.html?lessonId=${encodeURIComponent(
    lesson.id || lesson.documentId || ""
  )}`;

return `
  <article class="lesson-card">

    <div class="lesson-icon">
      <i class="fa-solid fa-play"></i>
    </div>

    <div class="lesson-info">

      <h3>
        ${escapeHTML(
          lesson.title ||
          lesson.name ||
          "Untitled Lesson"
        )}
      </h3>

      <p>
        ${escapeHTML(
          lesson.description ||
          lesson.shortDescription ||
          "Lesson available in this course."
        )}
      </p>

      <div class="lesson-meta">

        ${
          lesson.duration
            ? `
              <span>
                <i class="fa-regular fa-clock"></i>
                ${escapeHTML(
                  String(lesson.duration)
                )}
              </span>
            `
            : ""
        }

        ${
          lesson.type
            ? `
              <span>
                <i class="fa-solid fa-layer-group"></i>
                ${escapeHTML(
                  String(lesson.type)
                )}
              </span>
            `
            : ""
        }

      </div>

    </div>

    <a
      class="lesson-button"
      href="${safeLink(lessonUrl)}"
    >
      Open Lesson
      <i class="fa-solid fa-arrow-right"></i>
    </a>

  </article>
`;
}


/* =====================================================
   COURSE PAGE
===================================================== */

async function loadCoursePage() {

  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const courseId =
      params.get("courseId") ||
      params.get("id");

    if (!courseId) {
      showError("Course ID is missing.");
      return;
    }

    const course =
      await loadCourse(courseId);

    const lessons =
      await loadLessons(courseId);

    renderCourse(course, lessons);

  } catch (error) {

    console.error(
      "COURSE ERROR:",
      error
    );

    showError(
      "Unable to load this course."
    );

  }

}


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse(courseId) {

  const response =
    await fetch(
      `/api/data?collection=courses&id=${encodeURIComponent(courseId)}`,
      {
        headers: {
          "Accept": "application/json"
        }
      }
    );

  if (!response.ok) {
    throw new Error(
      `Course API error: ${response.status}`
    );
  }

  const result =
    await response.json();

  if (!result.success) {
    throw new Error(
      result.error ||
      "Course not found"
    );
  }

  return result.data;

}


/* =====================================================
   LOAD LESSONS
===================================================== */

async function loadLessons(courseId) {

  const response =
    await fetch(
      `/api/data?collection=lessons&limit=100`,
      {
        headers: {
          "Accept": "application/json"
        }
      }
    );

  if (!response.ok) {
    throw new Error(
      `Lessons API error: ${response.status}`
    );
  }

  const result =
    await response.json();

  if (!result.success) {
    throw new Error(
      result.error ||
      "Unable to load lessons"
    );
  }

  return (
    result.results || []
  ).filter(
    lesson => {

      return (
        lesson.courseId === courseId ||
        lesson.courseID === courseId ||
        lesson.course === courseId ||
        lesson.courseRef === courseId
      );

    }
  );

}


/* =====================================================
   RENDER COURSE
===================================================== */

function renderCourse(
  course,
  lessons
) {

  const title =
    course.title ||
    course.name ||
    "Untitled Course";

  const description =
    course.description ||
    course.shortDescription ||
    "No course description available.";

  const image =
    course.image ||
    course.thumbnail ||
    course.coverImage ||
    "https://via.placeholder.com/1200x500?text=LetsStudy+Pro";

  const instructor =
    course.instructorName ||
    course.instructor ||
    course.teacher ||
    "LetsStudy Pro";

  const level =
    course.level ||
    course.courseLevel ||
    "";

  const category =
    course.category ||
    "";

  const price =
    Number(
      course.price || 0
    );

  const access =
    course.access ||
    course.plan ||
    (
      price > 0
        ? "paid"
        : "free"
    );


  document.title =
    `${title} | LetsStudy Pro`;


  const hero =
    document.getElementById(
      "courseHero"
    );

  if (hero) {

    hero.innerHTML = `

      <div class="course-hero-image">

        <img
          src="${safeImage(image)}"
          alt="${escapeHTML(title)}"
        >

      </div>

      <div class="course-hero-content">

        <div class="course-badges">

          ${
            category
              ? `
                <span class="badge">
                  ${escapeHTML(category)}
                </span>
              `
              : ""
          }

          ${
            level
              ? `
                <span class="badge">
                  ${escapeHTML(level)}
                </span>
              `
              : ""
          }

          ${
            access === "free"
              ? `
                <span class="badge free">
                  FREE
                </span>
              `
              : ""
          }

        </div>

        <h1>
          ${escapeHTML(title)}
        </h1>

        <p>
          ${escapeHTML(description)}
        </p>

        <div class="course-meta">

          <span>
            <i class="fa-solid fa-user"></i>
            ${escapeHTML(instructor)}
          </span>

          <span>
            <i class="fa-solid fa-book-open"></i>
            ${lessons.length}
            ${lessons.length === 1
              ? "Lesson"
              : "Lessons"}
          </span>

          ${
            price > 0
              ? `
                <span>
                  <i class="fa-solid fa-money-bill"></i>
                  ${price.toLocaleString()}
                  ${escapeHTML(
                    course.currency || ""
                  )}
                </span>
              `
              : `
                <span class="free-text">
                  <i class="fa-solid fa-unlock"></i>
                  Free
                </span>
              `
          }

        </div>

      </div>

    `;

  }


  const lessonsContainer =
    document.getElementById(
      "lessonsList"
    );

  if (!lessonsContainer) {
    return;
  }


  if (!lessons.length) {

    lessonsContainer.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-book-open"></i>

        <h3>
          No lessons available yet
        </h3>

        <p>
          Lessons for this course will appear here.
        </p>

      </div>

    `;

    return;

  }


  lessonsContainer.innerHTML =
    lessons
      .map(createLessonCard)
      .join("");

}


/* =====================================================
   LESSON CARD
===================================================== */

function createLessonCard(
  lesson,
  index
) {

  const lessonId =
    lesson.id ||
    lesson.documentId ||
    "";

  const lessonUrl =
    lesson.url ||
    lesson.pageUrl ||
    (
      lessonId
        ? `lesson.html?lessonId=${encodeURIComponent(
            lessonId
          )}`
        : "#"
    );


  return `

    <article class="lesson-card">

      <div class="lesson-number">

        ${
          Number(index) + 1
        }

      </div>

      <div class="lesson-info">

        <h3>

          ${escapeHTML(
            lesson.title ||
            lesson.name ||
            `Lesson ${Number(index) + 1}`
          )}

        </h3>

        ${
          lesson.description ||
          lesson.shortDescription
            ? `
              <p>
                ${escapeHTML(
                  lesson.description ||
                  lesson.shortDescription
                )}
              </p>
            `
            : ""
        }

        <div class="lesson-meta">

          ${
            lesson.duration
              ? `
                <span>
                  <i class="fa-regular fa-clock"></i>
                  ${escapeHTML(
                    String(
                      lesson.duration
                    )
                  )}
                </span>
              `
              : ""
          }

          ${
            lesson.type
              ? `
                <span>
                  <i class="fa-solid fa-video"></i>
                  ${escapeHTML(
                    String(
                      lesson.type
                    )
                  )}
                </span>
              `
              : ""
          }

        </div>

      </div>

      ${
        lessonUrl !== "#"
          ? `
            <a
              class="lesson-button"
              href="${safeLink(lessonUrl)}"
            >
              Open Lesson
              <i class="fa-solid fa-arrow-right"></i>
            </a>
          `
          : `
            <button
              class="lesson-button disabled"
              disabled
            >
              Unavailable
            </button>
          `
      }

    </article>

  `;

}


/* =====================================================
   IMAGE SAFETY
===================================================== */

function safeImage(
  value
) {

  if (!value) {

    return
      "https://via.placeholder.com/1200x500?text=LetsStudy+Pro";

  }

  const url =
    String(value).trim();

  if (
    url.startsWith("https://") ||
    url.startsWith("http://") ||
    url.startsWith("/")
  ) {

    return escapeHTML(url);

  }

  return
    "https://via.placeholder.com/1200x500?text=LetsStudy+Pro";

}


/* =====================================================
   LINK SAFETY
===================================================== */

function safeLink(
  value
) {

  if (!value) {
    return "#";
  }

  const url =
    String(value).trim();

  if (
    url.startsWith("https://") ||
    url.startsWith("http://") ||
    url.startsWith("/") ||
    url.startsWith("./") ||
    url.startsWith("../") ||
    url.startsWith("lesson.html?")
  ) {

    return escapeHTML(url);

  }

  return "#";

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
) {

  const hero =
    document.getElementById(
      "courseHero"
    );

  const lessons =
    document.getElementById(
      "lessonsList"
    );

  if (hero) {

    hero.innerHTML = `

      <div class="error-box">

        <i class="fa-solid fa-triangle-exclamation"></i>

        <h2>
          Unable to load course
        </h2>

        <p>
          ${escapeHTML(message)}
        </p>

        <a
          href="courses.html"
          class="back-button"
        >
          Browse Courses
        </a>

      </div>

    `;

  }

  if (lessons) {

    lessons.innerHTML = "";

  }

}


/* =====================================================
   START
===================================================== */

loadCoursePage();

</script>
