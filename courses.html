<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Courses | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
background:#07111f;
color:white;
padding:15px 5%;
position:sticky;
top:0;
z-index:10
}

.nav{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
gap:20px
}

.logo{
font-size:22px;
font-weight:900;
color:white;
text-decoration:none
}

.logo span{
color:#22d3ee
}

.search{
flex:1
}

.search input{
width:100%;
padding:12px 18px;
border:0;
border-radius:30px;
outline:0
}

.nav a{
color:white;
text-decoration:none
}

.hero{
padding:55px 5%;
background:linear-gradient(
135deg,
#07111f,
#164e63
);
color:white
}

.wrap{
max-width:1200px;
margin:auto
}

.hero h1{
font-size:45px;
margin:0 0 10px
}

.hero p{
color:#cbd5e1
}

.filters{
background:white;
padding:18px;
margin:-25px auto 30px;
border-radius:15px;

display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:12px;

box-shadow:0 15px 40px #0001
}

.filters input,
.filters select{
padding:13px;
border:1px solid #ddd;
border-radius:9px;
outline:0;
background:white
}

.grid{
display:grid;
grid-template-columns:
repeat(3,1fr);
gap:20px
}

.card{
background:white;
border-radius:16px;
overflow:hidden;
border:1px solid #e5e7eb;
transition:.2s
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 15px 35px #0001
}

.image{
height:190px;
position:relative
}

.image img{
width:100%;
height:100%;
object-fit:cover
}

.featured{
position:absolute;
top:12px;
left:12px;

background:#f59e0b;
color:white;

padding:6px 10px;
border-radius:20px;

font-size:12px
}

.body{
padding:18px
}

.category{
font-size:12px;
color:#2563eb;
font-weight:bold
}

h3{
margin:8px 0;
line-height:1.35
}

.desc{
color:#64748b;
font-size:14px;
line-height:1.6
}

.meta{
display:flex;
flex-wrap:wrap;
gap:10px;

color:#64748b;
font-size:12px;

margin:15px 0
}

.rating{
color:#f59e0b
}

.price{
font-size:20px;
font-weight:900
}

.free{
color:#16a34a
}

.old{
text-decoration:line-through;
color:#94a3b8;

font-size:13px;

margin-left:6px
}

button{
width:100%;

border:0;

padding:12px;

border-radius:9px;

background:#172033;
color:white;

font-weight:bold;

cursor:pointer;

margin-top:12px
}

button:hover{
background:#2563eb
}

.loading{
text-align:center;
padding:80px
}

.empty{
text-align:center;
padding:80px;
grid-column:1/-1
}

footer{
margin-top:60px;

background:#07111f;
color:#94a3b8;

padding:40px 5%
}

@media(max-width:850px){

.grid{
grid-template-columns:
repeat(2,1fr)
}

}

@media(max-width:600px){

.grid,
.filters{
grid-template-columns:1fr
}

.hero h1{
font-size:34px
}

.nav a{
display:none
}

}

</style>
</head>


<body>


<header>

<div class="nav">


<a
class="logo"
href="index.html">

LetsStudy
<span>Pro</span>

</a>


<div class="search">

<input
id="topSearch"
placeholder="Search courses...">

</div>


<a href="cart.html">

<i class="fa fa-cart-shopping"></i>

<span id="cartCount">
0
</span>

</a>


</div>

</header>



<section class="hero">

<div class="wrap">

<h1>
Explore Courses
</h1>

<p>
Learn. Build. Grow with professional courses
from LetsStudy Pro.
</p>

</div>

</section>



<main class="wrap">


<div class="filters">


<input
id="search"
placeholder="Search title, instructor, category or tags...">


<select id="category">

<option value="">
All Categories
</option>

</select>


<select id="level">

<option value="">
All Levels
</option>

<option value="Beginner">
Beginner
</option>

<option value="Intermediate">
Intermediate
</option>

<option value="Advanced">
Advanced
</option>

</select>


</div>



<div
style="
margin-bottom:20px;
color:#64748b
">

<i class="fa fa-book"></i>

<span id="total">
0
</span>

courses available

</div>



<div
id="loading"
class="loading">

<i
class="fa fa-spinner fa-spin fa-2x">
</i>

<p>
Loading courses...
</p>

</div>



<div
id="courses"
class="grid"
style="display:none">

</div>


</main>



<footer>

<div class="wrap">

<h2 style="color:white">
LetsStudy Pro
</h2>

<p>
Learn. Build. Grow.
</p>

<p>
Professional learning, careers and business ecosystem.
</p>

</div>

</footer>



<script type="module">


/* ================= FIREBASE ================= */


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,
collection,
getDocs

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig={


apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",


authDomain:
"let-s-study-pro-course.firebaseapp.com",


projectId:
"let-s-study-pro-course",


storageBucket:
"let-s-study-pro-course.firebasestorage.app",


messagingSenderId:
"474928293390",


appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"


};



const app=
initializeApp(
firebaseConfig
);


const db=
getFirestore(app);



/* ================= DATA ================= */


let courses=[];



/* ================= LOAD ================= */


async function loadCourses(){


try{


const snap=
await getDocs(
collection(
db,
"courses"
)
);


/*
Firestore Document ID
= courseId
*/


courses=
snap.docs.map(
doc=>{

const d=
doc.data();


return{

courseId:
doc.id,

title:
d.title || "",

slug:
d.slug || "",

shortDescription:
d.shortDescription || "",

description:
d.description || "",

thumbnail:
d.thumbnail || "",

previewVideo:
d.previewVideo || "",

instructorId:
d.instructorId || "",

instructorName:
d.instructorName || "",

category:
d.category || "",

subcategory:
d.subcategory || "",

level:
d.level || "",

language:
d.language || "",

duration:
d.duration || "",

lessonsCount:
Number(
d.lessonsCount || 0
),

modulesCount:
Number(
d.modulesCount || 0
),

price:
Number(
d.price || 0
),

discountPrice:
Number(
d.discountPrice || 0
),

currency:
d.currency || "TZS",

isFree:
d.isFree === true,

certificate:
d.certificate === true,

requirements:
Array.isArray(
d.requirements
)
?
d.requirements
:
[],

whatYouLearn:
Array.isArray(
d.whatYouLearn
)
?
d.whatYouLearn
:
[],

targetAudience:
d.targetAudience || "",

tags:
Array.isArray(
d.tags
)
?
d.tags
:
[],

status:
d.status || "",

featured:
d.featured === true,

published:
d.published === true,

rating:
Number(
d.rating || 0
),

ratingCount:
Number(
d.ratingCount || 0
),

enrollmentCount:
Number(
d.enrollmentCount || 0
),

views:
Number(
d.views || 0
),

createdBy:
d.createdBy || "",

createdAt:
d.createdAt || null,

updatedAt:
d.updatedAt || null,

publishedAt:
d.publishedAt || null

};

}
);



document
.getElementById("total")
.textContent=
courses.length;



createCategories();

renderCourses();



document
.getElementById("loading")
.style.display=
"none";


document
.getElementById("courses")
.style.display=
"grid";


}catch(error){


console.error(error);


document
.getElementById("loading")
.innerHTML=`

<i
class="fa fa-circle-exclamation fa-2x">
</i>

<h3>
Unable to load courses
</h3>

<p>
${esc(error.message)}
</p>

`;

}

}



/* ================= CATEGORIES ================= */


function createCategories(){


const select=
document.getElementById(
"category"
);


const categories=[

...new Set(

courses
.map(
c=>c.category
)
.filter(Boolean)

)

];


categories.forEach(
cat=>{

const option=
document.createElement(
"option"
);

option.value=
cat;

option.textContent=
cat;

select.appendChild(
option
);

});

}



/* ================= RENDER ================= */


function renderCourses(){


const q=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const cat=
document
.getElementById("category")
.value;


const lvl=
document
.getElementById("level")
.value;



const filtered=
courses.filter(
c=>{


const visible=

c.published===true ||

c.status==="published";


if(!visible)
return false;



const searchable=`

${c.title}

${c.slug}

${c.shortDescription}

${c.description}

${c.instructorName}

${c.category}

${c.subcategory}

${c.language}

${c.targetAudience}

${c.tags.join(" ")}

`
.toLowerCase();



return(

(!q ||
searchable.includes(q))

&&

(!cat ||
c.category===cat)

&&

(!lvl ||
c.level===lvl)

);

});



const box=
document.getElementById(
"courses"
);



if(!filtered.length){


box.innerHTML=`

<div class="empty">

<i
class="fa fa-book-open fa-3x">
</i>

<h2>
No courses found
</h2>

<p>
Try another search.
</p>

</div>

`;

return;

}



box.innerHTML=
filtered
.map(
renderCard
)
.join("");

}



/* ================= CARD ================= */


function renderCard(c){


const price=
Number(
c.price || 0
);


const discount=
Number(
c.discountPrice || 0
);


const free=

c.isFree===true ||

price===0;


const finalPrice=

discount>0 &&
discount<price

?

discount

:

price;



return `

<article class="card">


<div class="image">


<img

src="${
c.thumbnail ||

"https://via.placeholder.com/800x450?text=LetsStudy+Pro"
}"

alt="${esc(c.title)}">


${

c.featured

?

`

<span class="featured">

<i
class="fa fa-star">
</i>

Featured

</span>

`

:

""

}


</div>



<div class="body">


<div class="category">


${esc(
c.category ||
"Course"
)}


${
c.subcategory

?

" · " +
esc(
c.subcategory
)

:

""

}


</div>



<h3>

${esc(
c.title ||
"Untitled Course"
)}

</h3>



<p class="desc">

${esc(

c.shortDescription ||

c.description ||

"Professional course."

)}

</p>



<div class="meta">


<span>

<i class="fa fa-user">
</i>

${esc(

c.instructorName ||

"LetsStudy Pro"

)}

</span>



<span class="rating">

<i class="fa fa-star">
</i>

${c.rating.toFixed(1)}

(${c.ratingCount})

</span>



<span>

<i class="fa fa-users">
</i>

${c.enrollmentCount}

</span>



<span>

<i class="fa fa-eye">
</i>

${c.views}

</span>


</div>



<div class="meta">


<span>

<i class="fa fa-signal">
</i>

${esc(
c.level || "-"
)}

</span>



<span>

<i class="fa fa-language">
</i>

${esc(
c.language || "-"
)}

</span>



<span>

<i class="fa fa-clock">
</i>

${esc(
c.duration || "-"
)}

</span>



<span>

<i class="fa fa-layer-group">
</i>

${c.modulesCount}

modules

</span>



<span>

<i class="fa fa-play-circle">
</i>

${c.lessonsCount}

lessons

</span>


</div>



<div>


${

free

?

`

<span class="price free">

Free

</span>

`

:

`

<span class="price">

${esc(
c.currency
)}

${finalPrice.toLocaleString()}

</span>


${

discount>0 &&
discount<price

?

`

<span class="old">

${esc(
c.currency
)}

${price.toLocaleString()}

</span>

`

:

""

}


`

}


</div>



<button

onclick=
"openCourse('${c.courseId}')">


<i
class="fa fa-arrow-right">
</i>

View Course


</button>


</div>


</article>

`;

}



/* ================= OPEN COURSE ================= */


window.openCourse=
function(courseId){


if(!courseId){

alert(
"Course ID is missing."
);

return;

}



const course=
courses.find(
c=>
c.courseId===courseId
);



if(!course){

alert(
"Course not found."
);

return;

}



/* ================= FREE ================= */


const isFree=

course.isFree===true ||

Number(
course.price || 0
)===0;



if(isFree){


/*
FREE COURSE

Document ID only.
enroll.html will read
the complete course from
Firebase.
*/


location.href=

"enroll.html?id="+

encodeURIComponent(
courseId
);

return;

}



/* ================= PAID ================= */


/*
PAID COURSE

Document ID only.
cart.html will read ALL
payment information from
Firebase.
*/


location.href=

"cart.html?id="+

encodeURIComponent(
courseId
);


};



/* ================= SEARCH ================= */


document
.getElementById("search")
.addEventListener(
"input",
renderCourses
);



document
.getElementById("category")
.addEventListener(
"change",
renderCourses
);



document
.getElementById("level")
.addEventListener(
"change",
renderCourses
);



document
.getElementById("topSearch")
.addEventListener(
"input",
function(){


document
.getElementById("search")
.value=
this.value;


renderCourses();

});



/* ================= CART COUNT ================= */


function updateCartCount(){


try{


const cart=
JSON.parse(

localStorage.getItem(
"cart"
) || "[]"

);


document
.getElementById(
"cartCount"
)
.textContent=
cart.length;


}catch{


document
.getElementById(
"cartCount"
)
.textContent=
"0";

}

}



/* ================= ESCAPE ================= */


function esc(value){


return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}



/* ================= START ================= */


updateCartCount();

loadCourses();


</script>

</body>
</html>
