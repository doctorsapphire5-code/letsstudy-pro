<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courses | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 padding:16px 5%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:10
}
.logo{
 font-size:22px;
 font-weight:700;
 color:#2563eb
}
header a{
 color:#475569;
 text-decoration:none
}
.container{
 max-width:1150px;
 margin:auto;
 padding:25px 15px
}
.hero{
 background:#2563eb;
 color:#fff;
 padding:35px 25px;
 border-radius:18px;
 margin-bottom:22px
}
.hero h1{
 margin:0 0 8px;
 font-size:30px
}
.hero p{
 margin:0
}
.search{
 width:100%;
 margin-top:18px;
 padding:15px;
 border:0;
 border-radius:10px;
 font-size:16px;
 outline:none
}
.filters{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 margin-bottom:22px
}
.filters select{
 padding:11px;
 border:1px solid #dbe1ea;
 border-radius:8px;
 background:#fff;
 min-width:150px
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
 gap:18px
}
.card{
 background:#fff;
 border-radius:15px;
 overflow:hidden;
 border:1px solid #e5e7eb;
 box-shadow:0 3px 12px #0000000a
}
.card.featured{
 border:2px solid #f59e0b
}
.thumbnail{
 width:100%;
 height:175px;
 object-fit:cover;
 background:#e2e8f0
}
.cardBody{
 padding:17px
}
.badges{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin-bottom:8px
}
.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:700
}
.featuredBadge{
 background:#fef3c7;
 color:#92400e
}
.freeBadge{
 background:#dcfce7;
 color:#166534
}
.levelBadge{
 background:#dbeafe;
 color:#1d4ed8
}
.card h3{
 margin:8px 0 5px;
 font-size:18px
}
.instructor{
 color:#64748b;
 font-size:13px
}
.description{
 color:#64748b;
 font-size:14px;
 line-height:1.6
}
.meta{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 color:#64748b;
 font-size:12px;
 margin:12px 0
}
.rating{
 color:#f59e0b;
 font-weight:bold
}
.price{
 font-size:19px;
 font-weight:bold;
 margin-top:12px
}
.oldPrice{
 color:#94a3b8;
 text-decoration:line-through;
 font-size:13px;
 margin-left:5px
}
.btn{
 display:inline-block;
 padding:10px 14px;
 border:0;
 border-radius:8px;
 background:#2563eb;
 color:#fff;
 text-decoration:none;
 cursor:pointer;
 font-weight:600;
 margin-top:10px
}
.btn.secondary{
 background:#e2e8f0;
 color:#172033;
 margin-left:5px
}
.empty{
 text-align:center;
 padding:50px;
 color:#64748b;
 grid-column:1/-1
}

/* MODAL */
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:50;
 padding:20px;
 overflow:auto
}
.modalBox{
 background:#fff;
 max-width:800px;
 margin:25px auto;
 border-radius:15px;
 padding:25px
}
.close{
 float:right;
 width:35px;
 height:35px;
 border:0;
 border-radius:50%;
 background:#f1f5f9;
 cursor:pointer;
 font-size:20px
}
.detailThumbnail{
 width:100%;
 max-height:350px;
 object-fit:cover;
 border-radius:12px
}
.detail h1{
 margin-bottom:5px
}
.detailSection{
 margin-top:22px
}
.detailSection h3{
 margin-bottom:8px
}
.detailText{
 line-height:1.8;
 white-space:pre-line;
 color:#475569
}
.tags span{
 display:inline-block;
 background:#eef2ff;
 color:#3730a3;
 padding:6px 9px;
 border-radius:6px;
 margin:3px;
 font-size:12px
}

@media(max-width:600px){
 .hero h1{font-size:24px}
 .filters select{width:100%}
}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<a href="index.html">
Home
</a>

</header>


<main class="container">

<section class="hero">

<h1>Explore Our Courses</h1>

<p>
Learn new skills, advance your career and earn certificates.
</p>

<input
id="search"
class="search"
placeholder="Search courses, instructors, categories or skills..."
>

</section>


<div class="filters">

<select id="category">

<option value="">
All Categories
</option>

</select>


<select id="level">

<option value="">
All Levels
</option>

</select>


<select id="language">

<option value="">
All Languages
</option>

</select>


<select id="priceFilter">

<option value="">
All Courses
</option>

<option value="free">
Free Courses
</option>

<option value="paid">
Paid Courses
</option>

</select>

</div>


<div id="courses" class="grid"></div>

</main>


<!-- COURSE DETAILS -->

<div class="modal" id="modal">

<div class="modalBox">

<button
class="close"
onclick="closeModal()">
×
</button>

<div id="details"></div>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
increment
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =================================
 FIREBASE
================================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/* =================================
 VARIABLES
================================= */

let courses=[];

const container=
document.getElementById("courses");

const search=
document.getElementById("search");

const category=
document.getElementById("category");

const level=
document.getElementById("level");

const language=
document.getElementById("language");

const priceFilter=
document.getElementById("priceFilter");


/* =================================
 LOAD COURSES
================================= */

async function loadCourses(){

try{

const snap=
await getDocs(
collection(db,"courses")
);

courses=[];

snap.forEach(d=>{

const c=d.data();

if(
c.published===true &&
c.status==="published"
){

courses.push({

id:d.id,
...c

});

}

});

setupFilters();

renderCourses();

}catch(error){

console.error(error);

container.innerHTML=`

<div class="empty">

<h3>Unable to load courses</h3>

<p>
Please try again later.
</p>

</div>

`;

}

}


/* =================================
 FILTER OPTIONS
================================= */

function setupFilters(){

fillSelect(
category,
"category"
);

fillSelect(
level,
"level"
);

fillSelect(
language,
"language"
);

}


function fillSelect(
select,
field
){

const values=[

...new Set(

courses

.map(c=>c[field])

.filter(Boolean)

)

];

values.sort();

values.forEach(value=>{

const option=
document.createElement("option");

option.value=value;

option.textContent=value;

select.appendChild(option);

});

}


/* =================================
 RENDER
================================= */

function renderCourses(){

const q=
search.value
.toLowerCase()
.trim();


const filtered=
courses.filter(c=>{

const text=`

${c.title||""}
${c.instructorName||""}
${c.category||""}
${c.subcategory||""}
${c.description||""}
${Array.isArray(c.tags)
?c.tags.join(" ")
:c.tags||""}

`.toLowerCase();


const matchesSearch=
text.includes(q);


const matchesCategory=
!category.value ||
c.category===category.value;


const matchesLevel=
!level.value ||
c.level===level.value;


const matchesLanguage=
!language.value ||
c.language===language.value;


const matchesPrice=

!priceFilter.value ||

(
priceFilter.value==="free" &&
(c.isFree===true || Number(c.price)===0)
)

||

(
priceFilter.value==="paid" &&
c.isFree!==true &&
Number(c.price)>0
);


return(

matchesSearch &&
matchesCategory &&
matchesLevel &&
matchesLanguage &&
matchesPrice

);

});


if(!filtered.length){

container.innerHTML=`

<div class="empty">

<h3>No courses found</h3>

<p>
Try another search or filter.
</p>

</div>

`;

return;

}


container.innerHTML=
filtered.map(c=>{

const tags=
Array.isArray(c.tags)
?c.tags
:String(c.tags||"")
.split(",")
.filter(Boolean);


const price=

c.isFree===true ||
Number(c.price)===0

?

`<span class="freeBadge badge">
FREE
</span>`

:

`

<div class="price">

${escapeHTML(c.currency||"")}
${Number(c.discountPrice)>0
?c.discountPrice
:c.price||0}

${
Number(c.discountPrice)>0
?

`<span class="oldPrice">
${escapeHTML(c.currency||"")}
${c.price||0}
</span>`

:""

}

</div>

`;


return`

<article
class="card ${c.featured?"featured":""}">


<img

class="thumbnail"

src="${safeURL(c.thumbnail)}"

onerror="
this.src='https://via.placeholder.com/600x350'
"

>


<div class="cardBody">


<div class="badges">

${
c.featured
?

`<span class="featuredBadge badge">
FEATURED
</span>`

:""
}


${
c.isFree
?

`<span class="freeBadge badge">
FREE
</span>`

:""
}


${
c.level
?

`<span class="levelBadge badge">
${escapeHTML(c.level)}
</span>`

:""
}

</div>


<h3>
${escapeHTML(c.title||"Untitled Course")}
</h3>


<div class="instructor">

By
${escapeHTML(c.instructorName||"Instructor")}

</div>


<p class="description">

${escapeHTML(
c.shortDescription||
c.description||
""
).substring(0,150)}

${(
c.shortDescription||
c.description||
""
).length>150
?"...":""
}

</p>


<div class="meta">

<span>
⏱ ${escapeHTML(c.duration||"-")}
</span>

<span>
📚 ${Number(c.lessonsCount)||0} Lessons
</span>

<span>
📦 ${Number(c.modulesCount)||0} Modules
</span>

</div>


<div class="rating">

⭐ ${Number(c.rating||0).toFixed(1)}

<span style="color:#94a3b8">
(${Number(c.ratingCount)||0})
</span>

</div>


${price}


<div>

<button

class="btn secondary"

onclick="
viewCourse('${c.id}')
">

View Details

</button>


<a

class="btn"

href="enroll.html?courseId=${encodeURIComponent(c.id)}"

onclick="
enrollCourse('${c.id}')
">

${
c.isFree ||
Number(c.price)===0
?"Enroll Free"
:"Enroll Now"
}

</a>

</div>


</div>

</article>

`;

}).join("");

}


/* =================================
 VIEW COURSE
================================= */

window.viewCourse=
async function(id){

const course=
courses.find(c=>c.id===id);

if(!course)return;


await updateDoc(

doc(
db,
"courses",
id
),

{
views:increment(1)
}

).catch(()=>{});


const tags=
Array.isArray(course.tags)
?course.tags
:String(course.tags||"")
.split(",")
.filter(Boolean);


const whatYouLearn=
Array.isArray(course.whatYouLearn)
?course.whatYouLearn
:String(course.whatYouLearn||"")
.split("\n")
.filter(Boolean);


document.getElementById(
"details"
).innerHTML=`

<div class="detail">


<img

class="detailThumbnail"

src="${safeURL(course.thumbnail)}"

onerror="
this.src='https://via.placeholder.com/600x350'
"

>


<div class="badges" style="margin-top:15px">

${
course.featured
?

`<span class="featuredBadge badge">
FEATURED
</span>`

:""
}


${
course.isFree
?

`<span class="freeBadge badge">
FREE
</span>`

:""
}


${
course.level
?

`<span class="levelBadge badge">
${escapeHTML(course.level)}
</span>`

:""
}

</div>


<h1>
${escapeHTML(course.title||"")}
</h1>


<p class="instructor">

Instructor:
<strong>
${escapeHTML(course.instructorName||"")}
</strong>

</p>


<div class="meta">

<span>
📂 ${escapeHTML(course.category||"-")}
</span>

<span>
🌐 ${escapeHTML(course.language||"-")}
</span>

<span>
⏱ ${escapeHTML(course.duration||"-")}
</span>

<span>
📚 ${Number(course.lessonsCount)||0} Lessons
</span>

<span>
📦 ${Number(course.modulesCount)||0} Modules
</span>

</div>


<div class="rating">

⭐ ${Number(course.rating||0).toFixed(1)}

<span style="color:#94a3b8">

(${Number(course.ratingCount)||0} ratings)

</span>

</div>


<div class="detailSection">

<h3>
About This Course
</h3>

<div class="detailText">

${escapeHTML(course.description||"")}

</div>

</div>


<div class="detailSection">

<h3>
What You Will Learn
</h3>

<ul>

${whatYouLearn.map(x=>
`<li>${escapeHTML(x)}</li>`
).join("")}

</ul>

</div>


<div class="detailSection">

<h3>
Requirements
</h3>

<div class="detailText">

${escapeHTML(course.requirements||"")}

</div>

</div>


<div class="detailSection">

<h3>
Target Audience
</h3>

<div class="detailText">

${escapeHTML(course.targetAudience||"")}

</div>

</div>


<div class="detailSection">

<h3>
Certificate
</h3>

<p>

${
course.certificate
?"🏆 Certificate available"
:"Certificate not available"
}

</p>

</div>


<div class="detailSection">

<h3>
Topics
</h3>

<div class="tags">

${tags.map(tag=>
`<span>
${escapeHTML(tag)}
</span>`
).join("")}

</div>

</div>


<div class="detailSection">

<h2>

${
course.isFree ||
Number(course.price)===0

?

"FREE"

:

`${escapeHTML(course.currency||"")}
${
Number(course.discountPrice)>0
?course.discountPrice
:course.price||0
}`

}

</h2>


<a

class="btn"

href="enroll.html?courseId=${encodeURIComponent(course.id)}"

onclick="
enrollCourse('${course.id}')
">

${
course.isFree ||
Number(course.price)===0

?"Enroll Free"

:"Enroll Now"

}

</a>


${
course.previewVideo

?

`<a
class="btn secondary"
href="${safeURL(course.previewVideo)}"
target="_blank">

▶ Preview Course

</a>`

:""

}

</div>

</div>

`;


document.getElementById(
"modal"
).style.display="block";

};


/* =================================
 ENROLL CLICK
================================= */

window.enrollCourse=
async function(id){

await updateDoc(

doc(
db,
"courses",
id
),

{
enrollmentCount:increment(1)
}

).catch(()=>{});

};


/* =================================
 CLOSE MODAL
================================= */

window.closeModal=function(){

document.getElementById(
"modal"
).style.display="none";

};


document.getElementById(
"modal"
).addEventListener(
"click",
e=>{

if(e.target.id==="modal"){

closeModal();

}

});


/* =================================
 SEARCH + FILTERS
================================= */

search.addEventListener(
"input",
renderCourses
);

category.addEventListener(
"change",
renderCourses
);

level.addEventListener(
"change",
renderCourses
);

language.addEventListener(
"change",
renderCourses
);

priceFilter.addEventListener(
"change",
renderCourses
);


/* =================================
 SECURITY HELPERS
================================= */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function safeURL(url){

if(!url)
return "https://via.placeholder.com/600x350";

try{

const u=new URL(url);

if(
u.protocol==="http:" ||
u.protocol==="https:"
){

return u.href;

}

}catch(e){}

return "https://via.placeholder.com/600x350";

}


/* =================================
 START
================================= */

loadCourses();

</script>

</body>
</html>
