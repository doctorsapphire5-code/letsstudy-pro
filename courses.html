<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Course | LetsStudy Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
 box-sizing:border-box;
}

:root{
 --primary:#2563eb;
 --primary-dark:#1d4ed8;
 --dark:#0f172a;
 --text:#172033;
 --muted:#64748b;
 --border:#e2e8f0;
 --bg:#f8fafc;
 --white:#fff;
 --success:#16a34a;
 --warning:#f59e0b;
 --danger:#dc2626;
 --shadow:0 15px 40px rgba(15,23,42,.08);
}

body{
 margin:0;
 font-family:Inter,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
}

a{
 text-decoration:none;
 color:inherit;
}

button{
 font-family:inherit;
}

.header{
 height:70px;
 background:#fff;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 5%;
 position:sticky;
 top:0;
 z-index:100;
}

.logo{
 font-size:22px;
 font-weight:800;
 white-space:nowrap;
}

.logo span{
 color:var(--primary);
}

.nav{
 display:flex;
 align-items:center;
 gap:22px;
}

.nav a{
 color:#475569;
 font-size:14px;
 font-weight:600;
}

.nav a:hover{
 color:var(--primary);
}

.cart-link{
 position:relative;
}

.cart-count{
 position:absolute;
 top:-10px;
 right:-12px;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#ef4444;
 color:#fff;
 font-size:10px;
 display:flex;
 align-items:center;
 justify-content:center;
}

.mobile-menu{
 display:none;
 border:0;
 background:none;
 font-size:22px;
}

.hero{
 background:
 linear-gradient(135deg,#0f172a,#172554);
 color:#fff;
 padding:60px 5%;
}

.hero-inner{
 max-width:1250px;
 margin:auto;
}

.breadcrumb{
 font-size:13px;
 color:#cbd5e1;
 margin-bottom:20px;
}

.breadcrumb a{
 color:#93c5fd;
}

.category-badge{
 display:inline-flex;
 align-items:center;
 gap:7px;
 padding:7px 12px;
 border-radius:30px;
 background:rgba(37,99,235,.25);
 border:1px solid rgba(147,197,253,.25);
 color:#bfdbfe;
 font-size:12px;
 font-weight:700;
}

.hero h1{
 max-width:900px;
 font-size:44px;
 line-height:1.15;
 margin:18px 0 14px;
}

.hero-description{
 max-width:850px;
 color:#cbd5e1;
 line-height:1.7;
 font-size:16px;
}

.hero-meta{
 display:flex;
 flex-wrap:wrap;
 gap:20px;
 margin-top:25px;
 color:#cbd5e1;
 font-size:13px;
}

.hero-meta span{
 display:flex;
 align-items:center;
 gap:7px;
}

.rating{
 color:#fbbf24;
}

.container{
 max-width:1250px;
 margin:auto;
 padding:40px 20px 70px;
}

.main-grid{
 display:grid;
 grid-template-columns:minmax(0,1fr) 370px;
 gap:30px;
 align-items:start;
}

.content-card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:16px;
 padding:28px;
 margin-bottom:22px;
 box-shadow:0 5px 20px rgba(15,23,42,.03);
}

.content-card h2{
 margin:0 0 20px;
 font-size:22px;
}

.description{
 color:#475569;
 line-height:1.9;
 white-space:pre-line;
}

.preview{
 background:#020617;
 border-radius:14px;
 overflow:hidden;
 margin-bottom:22px;
}

.preview video{
 width:100%;
 display:block;
 max-height:520px;
}

.preview iframe{
 width:100%;
 height:450px;
 border:0;
 display:block;
}

.course-card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:16px;
 padding:18px;
 box-shadow:var(--shadow);
 position:sticky;
 top:90px;
}

.course-thumbnail{
 width:100%;
 height:210px;
 object-fit:cover;
 border-radius:12px;
 display:block;
 margin-bottom:18px;
}

.price-box{
 margin-bottom:15px;
}

.current-price{
 font-size:30px;
 font-weight:800;
}

.old-price{
 color:#94a3b8;
 text-decoration:line-through;
 margin-left:8px;
 font-size:14px;
}

.discount{
 display:inline-block;
 margin-left:8px;
 background:#dcfce7;
 color:#15803d;
 padding:5px 8px;
 border-radius:5px;
 font-size:11px;
 font-weight:700;
}

.action-btn{
 width:100%;
 border:0;
 padding:14px 16px;
 border-radius:9px;
 cursor:pointer;
 font-size:14px;
 font-weight:700;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:9px;
 transition:.2s;
}

.action-btn:hover{
 transform:translateY(-1px);
}

.enroll-btn{
 background:var(--primary);
 color:#fff;
 margin-bottom:10px;
}

.enroll-btn:hover{
 background:var(--primary-dark);
}

.cart-btn{
 background:#eff6ff;
 color:var(--primary);
 margin-bottom:10px;
}

.share-btn{
 background:#f1f5f9;
 color:#334155;
}

.course-info{
 border-top:1px solid var(--border);
 margin-top:18px;
 padding-top:18px;
}

.info-row{
 display:flex;
 justify-content:space-between;
 gap:20px;
 padding:10px 0;
 color:#475569;
 font-size:13px;
}

.info-row strong{
 color:#172033;
 text-align:right;
}

.learning-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.learning-item{
 display:flex;
 gap:10px;
 color:#475569;
 line-height:1.5;
 font-size:14px;
}

.learning-item i{
 color:var(--success);
 margin-top:3px;
}

.list{
 padding:0;
 margin:0;
 list-style:none;
}

.list li{
 position:relative;
 padding:9px 0 9px 25px;
 color:#475569;
 line-height:1.6;
}

.list li:before{
 content:"✓";
 position:absolute;
 left:0;
 color:var(--success);
 font-weight:800;
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

.tag{
 padding:7px 11px;
 background:#eff6ff;
 color:#1d4ed8;
 border-radius:20px;
 font-size:12px;
 font-weight:600;
}

.instructor{
 display:flex;
 gap:18px;
 align-items:center;
}

.instructor-avatar{
 width:70px;
 height:70px;
 border-radius:50%;
 object-fit:cover;
 border:3px solid #eff6ff;
}

.instructor-name{
 font-size:17px;
 font-weight:800;
}

.instructor-role{
 color:var(--muted);
 font-size:13px;
 margin-top:5px;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin-top:20px;
}

.stat{
 background:#f8fafc;
 border-radius:10px;
 padding:15px;
 text-align:center;
}

.stat strong{
 display:block;
 font-size:18px;
 margin-bottom:5px;
}

.stat span{
 color:var(--muted);
 font-size:11px;
}

.curriculum-empty{
 padding:25px;
 background:#f8fafc;
 border-radius:10px;
 color:var(--muted);
 text-align:center;
}

.module{
 border:1px solid var(--border);
 border-radius:10px;
 overflow:hidden;
 margin-bottom:10px;
}

.module-head{
 width:100%;
 border:0;
 background:#f8fafc;
 padding:15px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 cursor:pointer;
 font-weight:700;
 color:#172033;
 text-align:left;
}

.module-body{
 display:none;
 padding:15px;
 border-top:1px solid var(--border);
}

.module.open .module-body{
 display:block;
}

.lesson{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 0;
 color:#64748b;
 font-size:13px;
 border-bottom:1px solid #f1f5f9;
}

.lesson:last-child{
 border-bottom:0;
}

.lesson i{
 color:var(--primary);
}

.alert{
 padding:14px;
 border-radius:9px;
 margin-bottom:15px;
 display:none;
 font-size:13px;
}

.loading{
 min-height:500px;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 color:var(--muted);
 gap:12px;
}

.loading i{
 font-size:40px;
 color:var(--primary);
}

.not-found{
 max-width:700px;
 margin:80px auto;
 background:#fff;
 border:1px solid var(--border);
 border-radius:16px;
 padding:60px 25px;
 text-align:center;
}

.not-found i{
 font-size:50px;
 color:#94a3b8;
 margin-bottom:15px;
}

.not-found h2{
 margin:10px 0;
}

.back-btn{
 display:inline-flex;
 margin-top:20px;
 background:var(--primary);
 color:#fff;
 padding:13px 20px;
 border-radius:8px;
 font-weight:700;
}

@media(max-width:900px){

 .main-grid{
  grid-template-columns:1fr;
 }

 .course-card{
  position:static;
 }

 .hero h1{
  font-size:34px;
 }

}

@media(max-width:650px){

 .header{
  padding:0 20px;
 }

 .nav a:not(.cart-link){
  display:none;
 }

 .mobile-menu{
  display:block;
 }

 .hero{
  padding:40px 20px;
 }

 .hero h1{
  font-size:28px;
 }

 .container{
  padding:25px 15px 50px;
 }

 .content-card{
  padding:20px;
 }

 .learning-grid{
  grid-template-columns:1fr;
 }

 .stats{
  grid-template-columns:1fr 1fr;
 }

 .preview iframe{
  height:240px;
 }

}

</style>
</head>

<body>

<header class="header">

<a href="index.html" class="logo">
 LetsStudy <span>Pro</span>
</a>

<nav class="nav">

<a href="index.html">Home</a>

<a href="courses.html">Courses</a>

<a href="careers.html">Careers</a>

<a href="scholarships.html">Scholarships</a>

<a href="cart.html" class="cart-link">

<i class="fa-solid fa-cart-shopping"></i>

<span class="cart-count" id="cartCount">0</span>

</a>

</nav>

<button class="mobile-menu">
<i class="fa-solid fa-bars"></i>
</button>

</header>


<section class="hero">

<div class="hero-inner" id="hero">

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<span>Loading course...</span>

</div>

</div>

</section>


<main class="container">

<div id="page">

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<span>Connecting to LetsStudy Pro...</span>

</div>

</div>

</main>


<script type="module">

/* ================= FIREBASE ================= */

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getFirestore,
 collection,
 query,
 where,
 getDocs,
 doc,
 updateDoc,
 increment
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= CONFIG ================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ================= STATE ================= */

let course=null;


/* ================= URL SLUG ================= */

const params=
new URLSearchParams(
window.location.search
);

const slug=
params.get("slug");


/* ================= LOAD COURSE ================= */

async function loadCourse(){

 if(!slug){

  showNotFound(
   "No course slug was provided."
  );

  return;
 }

 try{

  const q=
  query(
   collection(db,"courses"),
   where("slug","==",slug)
  );

  const snap=
  await getDocs(q);


  if(snap.empty){

   showNotFound(
    "Course not found"
   );

   return;
  }


  const courseDoc=
  snap.docs[0];


  course={
   id:courseDoc.id,
   ...courseDoc.data()
  };


  /*
   Allow published courses only.
  */

  if(
   course.published!==true &&
   course.status!=="published"
  ){

   showNotFound(
    "This course is not currently available."
   );

   return;
  }


  renderCourse();


  updateCourseViews();


 }catch(error){

  console.error(error);

  showNotFound(
   "Unable to connect to Firebase."
  );

 }

}


/* ================= VIEWS ================= */

async function updateCourseViews(){

 try{

  await updateDoc(

   doc(
    db,
    "courses",
    course.id
   ),

   {
    views:increment(1)
   }

  );

 }catch(error){

  console.log(
   "View counter skipped:",
   error
  );

 }

}


/* ================= RENDER ================= */

function renderCourse(){

 const price=
 getCoursePrice();


 const discount=
 getDiscount();


 document.getElementById(
 "hero"
 ).innerHTML=`

  <div class="hero-inner">

   <div class="breadcrumb">

    <a href="courses.html">
     Courses
    </a>

    <span> / </span>

    <span>
     ${esc(course.category||"Course")}
    </span>

   </div>


   <span class="category-badge">

    <i class="fa-solid fa-book-open"></i>

    ${esc(
     course.category||
     "Online Course"
    )}

   </span>


   <h1>
    ${esc(
     course.title||
     "Untitled Course"
    )}
   </h1>


   <p class="hero-description">

    ${esc(
     course.shortDescription||
     ""
    )}

   </p>


   <div class="hero-meta">

    <span>

     <i class="fa-solid fa-user"></i>

     ${esc(
      course.instructorName||
      "LetsStudy Pro"
     )}

    </span>


    <span class="rating">

     <i class="fa-solid fa-star"></i>

     ${Number(
      course.rating||0
     ).toFixed(1)}

     (${Number(
      course.ratingCount||0
     )} ratings)

    </span>


    <span>

     <i class="fa-solid fa-users"></i>

     ${Number(
      course.enrollmentCount||0
     ).toLocaleString()}

     students

    </span>


    <span>

     <i class="fa-solid fa-globe"></i>

     ${esc(
      course.language||
      "English"
     )}

    </span>

   </div>

  </div>

 `;


 document.getElementById(
 "page"
 ).innerHTML=`

  <div class="main-grid">


   <!-- ================= LEFT ================= -->

   <div>


    ${renderPreview()}


    <!-- ABOUT -->

    <section class="content-card">

     <h2>
      About This Course
     </h2>

     <div class="description">

      ${esc(
       course.description||
       "No course description available."
      )}

     </div>

    </section>


    <!-- WHAT YOU LEARN -->

    <section class="content-card">

     <h2>
      What You'll Learn
     </h2>

     ${renderLearning()}

    </section>


    <!-- CURRICULUM -->

    <section class="content-card">

     <h2>
      Course Curriculum
     </h2>

     <div id="curriculum">

      <div class="curriculum-empty">

       <i class="fa-solid fa-layer-group"></i>

       <p>
        Course modules and lessons
        will appear here.
       </p>

      </div>

     </div>

    </section>


    <!-- REQUIREMENTS -->

    <section class="content-card">

     <h2>
      Requirements
     </h2>

     ${renderList(
      course.requirements,
      "No specific requirements."
     )}

    </section>


    <!-- TARGET AUDIENCE -->

    <section class="content-card">

     <h2>
      Who This Course Is For
     </h2>

     ${renderList(
      course.targetAudience,
      "This course is suitable for learners interested in this subject."
     )}

    </section>


    <!-- INSTRUCTOR -->

    <section class="content-card">

     <h2>
      Your Instructor
     </h2>

     <div class="instructor">

      <img
       class="instructor-avatar"
       src="${
        course.instructorImage||
        "https://via.placeholder.com/100"
       }"
       onerror="
        this.src='https://via.placeholder.com/100'
       ">


      <div>

       <div class="instructor-name">

        ${esc(
         course.instructorName||
         "LetsStudy Pro Instructor"
        )}

       </div>

       <div class="instructor-role">

        Course Instructor

       </div>

      </div>

     </div>

    </section>


    <!-- TAGS -->

    <section class="content-card">

     <h2>
      Course Tags
     </h2>

     <div class="tags">

      ${
       toArray(course.tags)
       .map(tag=>`

        <span class="tag">
         ${esc(tag)}
        </span>

       `)
       .join("")
      }

     </div>

    </section>


   </div>


   <!-- ================= RIGHT ================= -->

   <aside>


    <div class="course-card">


     <img
      class="course-thumbnail"
      src="${
       course.thumbnail||
       "https://via.placeholder.com/800x450"
      }"
      onerror="
       this.src='https://via.placeholder.com/800x450'
      ">


     <!-- PRICE -->

     <div class="price-box">

      ${
       price===0

       ?`

        <span class="current-price">
         Free
        </span>

       `

       :`

        <span class="current-price">

         ${esc(
          course.currency||
          "TZS"
         )}

         ${price.toLocaleString()}

        </span>


        ${
         discount>0

         ?`

          <span class="old-price">

           ${esc(
            course.currency||
            "TZS"
           )}

           ${Number(
            course.price||0
           ).toLocaleString()}

          </span>


          <span class="discount">

           ${discount}% OFF

          </span>

         `

         :""
        }

       `
      }

     </div>


     <div
      id="actionAlert"
      class="alert">
     </div>


     <!-- ENROLL -->

     <button
      class="action-btn enroll-btn"
      id="enrollBtn">

      <i class="fa-solid fa-graduation-cap"></i>

      Enroll Now

     </button>


     <!-- CART -->

     <button
      class="action-btn cart-btn"
      id="cartBtn">

      <i class="fa-solid fa-cart-plus"></i>

      Add to Cart

     </button>


     <!-- SHARE -->

     <button
      class="action-btn share-btn"
      id="shareBtn">

      <i class="fa-solid fa-share-nodes"></i>

      Share Course

     </button>


     <!-- COURSE INFO -->

     <div class="course-info">


      <div class="info-row">

       <span>
        <i class="fa-solid fa-layer-group"></i>
        Level
       </span>

       <strong>
        ${esc(
         course.level||
         "All Levels"
        )}
       </strong>

      </div>


      <div class="info-row">

       <span>
        <i class="fa-solid fa-clock"></i>
        Duration
       </span>

       <strong>
        ${esc(
         course.duration||
         "-"
        )}
       </strong>

      </div>


      <div class="info-row">

       <span>
        <i class="fa-solid fa-book"></i>
        Lessons
       </span>

       <strong>
        ${Number(
         course.lessonsCount||0
        )}
       </strong>

      </div>


      <div class="info-row">

       <span>
        <i class="fa-solid fa-folder"></i>
        Modules
       </span>

       <strong>
        ${Number(
         course.modulesCount||0
        )}
       </strong>

      </div>


      <div class="info-row">

       <span>
        <i class="fa-solid fa-language"></i>
        Language
       </span>

       <strong>
        ${esc(
         course.language||
         "English"
        )}
       </strong>

      </div>


      <div class="info-row">

       <span>
        <i class="fa-solid fa-certificate"></i>
        Certificate
       </span>

       <strong>
        ${
         course.certificate
         ? "Included"
         : "Not Included"
        }
       </strong>

      </div>


      <div class="info-row">

       <span>
        <i class="fa-solid fa-eye"></i>
        Views
       </span>

       <strong>
        ${Number(
         course.views||0
        ).toLocaleString()}
       </strong>

      </div>


     </div>


    </div>


    <!-- STATS -->

    <div class="content-card">

     <div class="stats">

      <div class="stat">

       <strong>
        ${Number(
         course.lessonsCount||0
        )}
       </strong>

       <span>
        Lessons
       </span>

      </div>


      <div class="stat">

       <strong>
        ${Number(
         course.modulesCount||0
        )}
       </strong>

       <span>
        Modules
       </span>

      </div>


      <div class="stat">

       <strong>
        ${Number(
         course.enrollmentCount||0
        ).toLocaleString()}
       </strong>

       <span>
        Students
       </span>

      </div>


      <div class="stat">

       <strong>
        ${Number(
         course.rating||0
        ).toFixed(1)}
       </strong>

       <span>
        Rating
       </span>

      </div>

     </div>

    </div>


   </aside>


  </div>

 `;


 bindActions();

 loadCurriculum();

 updateCartCount();

}


/* ================= PREVIEW ================= */

function renderPreview(){

 if(!course.previewVideo){

  return "";

 }


 const url=
 course.previewVideo.trim();


 if(
  url.includes("youtube.com")||
  url.includes("youtu.be")
 ){

  const videoId=
   getYoutubeId(url);


  if(videoId){

   return`

    <section class="content-card">

     <h2>

<script>

/* ================= CURRICULUM ================= */

function renderCurriculum(course){

    const curriculum =
        document.getElementById("curriculum");

    if(!curriculum) return;

    /*
      Supports:
      course.modules = [
        {
          title:"Module 1",
          lessons:[
            {title:"Lesson 1", type:"video"},
            {title:"Lesson 2", type:"pdf"}
          ]
        }
      ]
    */

    const modules =
        Array.isArray(course.modules)
            ? course.modules
            : [];


    if(!modules.length){

        curriculum.innerHTML = `
            <div class="curriculum-empty">

                <i class="fa-solid fa-layer-group"></i>

                <p>
                    Course content will appear here
                    when modules and lessons are added.
                </p>

            </div>
        `;

        return;
    }


    curriculum.innerHTML =
        modules.map((module,index)=>{

            const lessons =
                Array.isArray(module.lessons)
                    ? module.lessons
                    : [];


            return `
                <div class="module">

                    <button
                        type="button"
                        class="module-head"
                        onclick="toggleModule(this)">

                        <span>
                            <i class="fa-solid fa-folder"></i>

                            ${index + 1}.
                            ${escapeHTML(
                                module.title ||
                                `Module ${index + 1}`
                            )}
                        </span>

                        <span>
                            ${lessons.length} lessons
                            <i class="fa-solid fa-chevron-down"></i>
                        </span>

                    </button>


                    <div class="module-body">

                        ${
                            lessons.length

                            ? lessons.map(
                                (lesson,lessonIndex)=>{

                                    const type =
                                        lesson.type ||
                                        "video";

                                    let icon =
                                        "fa-play-circle";

                                    if(type === "pdf"){
                                        icon =
                                            "fa-file-pdf";
                                    }

                                    if(type === "text"){
                                        icon =
                                            "fa-file-lines";
                                    }

                                    if(type === "quiz"){
                                        icon =
                                            "fa-circle-question";
                                    }

                                    return `
                                        <div class="lesson">

                                            <i class="
                                                fa-solid
                                                ${icon}
                                            "></i>

                                            <span>
                                                ${lessonIndex + 1}.
                                                ${escapeHTML(
                                                    lesson.title ||
                                                    "Untitled Lesson"
                                                )}
                                            </span>

                                            ${
                                                lesson.duration
                                                ? `
                                                    <small>
                                                        ${escapeHTML(
                                                            lesson.duration
                                                        )}
                                                    </small>
                                                  `
                                                : ""
                                            }

                                        </div>
                                    `;

                                }
                            ).join("")

                            : `
                                <div class="lesson">
                                    No lessons available.
                                </div>
                              `
                        }

                    </div>

                </div>
            `;

        }).join("");

}


/* ================= MODULE TOGGLE ================= */

window.toggleModule =
function(button){

    const module =
        button.closest(".module");

    if(!module) return;

    module.classList.toggle("open");

};


/* ================= CART ================= */

function getCart(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "letsstudy_cart"
            ) || "[]"
        );

    }catch(error){

        return [];

    }

}


function saveCart(cart){

    localStorage.setItem(
        "letsstudy_cart",
        JSON.stringify(cart)
    );

}


function updateCartCount(){

    const count =
        document.getElementById(
            "cartCount"
        );

    if(!count) return;

    count.textContent =
        getCart().length;

}


function addCourseToCart(course){

    const cart =
        getCart();


    const exists =
        cart.some(
            item =>
                item.id === course.id
        );


    if(exists){

        showMessage(
            "Course is already in your cart.",
            "info"
        );

        return;

    }


    const price =
        course.isFree
            ? 0
            : Number(
                course.discountPrice ||
                course.price ||
                0
              );


    cart.push({

        id: course.id,

        courseId: course.id,

        title:
            course.title || "",

        slug:
            course.slug || "",

        thumbnail:
            course.thumbnail || "",

        instructorName:
            course.instructorName || "",

        price: price,

        currency:
            course.currency || "TZS",

        isFree:
            course.isFree === true,

        quantity: 1,

        addedAt:
            new Date().toISOString()

    });


    saveCart(cart);

    updateCartCount();


    showMessage(
        "Course added to cart successfully.",
        "success"
    );

}


/* ================= ENROLL ================= */

function openEnrollment(course){

    if(!course || !course.slug){

        showMessage(
            "Course information is incomplete.",
            "error"
        );

        return;

    }


    window.location.href =
        "enroll.html?slug=" +
        encodeURIComponent(
            course.slug
        );

}


/* ================= SHARE ================= */

async function shareCourse(course){

    const url =
        window.location.href;


    const data = {

        title:
            course.title ||
            "LetsStudy Pro Course",

        text:
            course.shortDescription ||
            "Check out this course on LetsStudy Pro.",

        url:url

    };


    try{

        if(
            navigator.share
        ){

            await navigator.share(
                data
            );

        }else{

            await navigator.clipboard.writeText(
                url
            );

            showMessage(
                "Course link copied.",
                "success"
            );

        }

    }catch(error){

        console.log(
            "Share cancelled."
        );

    }

}

function showMessage(
    message,
    type="info"
){

    const alert =
        document.getElementById(
            "actionAlert"
        );


    if(!alert) return;


    alert.textContent =
        message;


    alert.style.display =
        "block";


    if(type === "success"){

        alert.style.background =
            "#dcfce7";

        alert.style.color =
            "#166534";

    }else if(type === "error"){

        alert.style.background =
            "#fee2e2";

        alert.style.color =
            "#991b1b";

    }else{

        alert.style.background =
            "#eff6ff";

        alert.style.color =
            "#1d4ed8";

    }


    clearTimeout(
        window.messageTimer
    );


    window.messageTimer =
        setTimeout(
            ()=>{

                alert.style.display =
                    "none";

            },
            3500
        );

}


/* ================= ESCAPE HTML ================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ================= FORMAT PRICE ================= */

function formatPrice(course){

    if(
        course.isFree === true
    ){

        return "Free";

    }


    const price =
        Number(
            course.discountPrice ||
            course.price ||
            0
        );


    if(price <= 0){

        return "Free";

    }


    return `
        ${escapeHTML(
            course.currency ||
            "TZS"
        )}
        ${price.toLocaleString()}
    `;

}

    if(
        oldPrice &&
        discounted > 0 &&
        original > discounted
    ){

        oldPrice.textContent =
            `${course.currency || "TZS"} ${original.toLocaleString()}`;

        oldPrice.style.display =
            "inline";

    }


    if(
        discount &&
        discounted > 0 &&
        original > discounted
    ){

        const percent =
            Math.round(
                (
                    (original - discounted) /
                    original
                ) * 100
            );


        discount.textContent =
            `${percent}% OFF`;

        discount.style.display =
            "inline-block";

    }

}


/* ================= LOAD CURRICULUM ================= */

if(course){

    renderCurriculum(
        course
    );

    setupCourseActions(
        course
    );

    renderPrice(
        course
    );

    updateCartCount();

}


/* ================= IMAGE FALLBACK ================= */

document.querySelectorAll(
    "img"
).forEach(img=>{

    img.addEventListener(
        "error",
        function(){

            if(
                !this.dataset.fallback
            ){

                this.dataset.fallback =
                    "true";

                this.src =
                    "https://via.placeholder.com/800x450";

            }

        }
    );

});


/* ================= VIDEO ================= */

const video =
    document.getElementById(
        "previewVideo"
    );


if(
    video &&
    course &&
    course.previewVideo
){

    video.src =
        course.previewVideo;


    if(course.thumbnail){

        video.poster =
            course.thumbnail;

    }

}


/* ================= PAGE TITLE ================= */

if(course){

    document.title =
        `${course.title || "Course"} | LetsStudy Pro`;

}


/* ================= URL ================= */

if(course){

    const canonicalSlug =
        course.slug;


    if(
        canonicalSlug
    ){

        console.log(
            "Loaded course:",
            canonicalSlug
        );

    }

}

</script>
