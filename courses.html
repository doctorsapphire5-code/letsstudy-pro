<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Course | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

/* =========================
   HEADER
========================= */

header{
    height:70px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:23px;
    font-weight:800;
    color:#2563eb;
}

.nav{
    display:flex;
    align-items:center;
    gap:20px;
}

.nav a{
    text-decoration:none;
    color:#172033;
    font-weight:600;
}

.cart-link{
    position:relative;
    font-size:20px;
}

.cart-count{
    position:absolute;
    top:-10px;
    right:-12px;
    min-width:18px;
    height:18px;
    padding:0 5px;
    background:#ef4444;
    color:white;
    border-radius:50%;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:100px 20px;
    color:#64748b;
}

.loading i{
    margin-bottom:15px;
}

/* =========================
   ERROR
========================= */

.error{
    display:none;
    background:#fff;
    border-radius:16px;
    padding:60px 20px;
    text-align:center;
    color:#dc2626;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.error i{
    font-size:40px;
    margin-bottom:15px;
}

/* =========================
   COURSE
========================= */

.course-box{
    display:none;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
}

/* =========================
   HERO
========================= */

.course-hero{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:35px;
    padding:35px;
}

.course-image{
    width:100%;
    height:360px;
    object-fit:cover;
    border-radius:16px;
    background:#e5e7eb;
}

.category{
    display:inline-block;
    background:#eff6ff;
    color:#2563eb;
    padding:7px 13px;
    border-radius:30px;
    font-size:13px;
    font-weight:700;
    margin-bottom:15px;
}

.course-title{
    font-size:38px;
    line-height:1.2;
    margin-bottom:15px;
}

.short-description{
    color:#64748b;
    line-height:1.7;
    margin-bottom:20px;
}

.price{
    font-size:30px;
    font-weight:800;
    margin:20px 0;
}

.currency{
    font-size:15px;
    color:#64748b;
}

/* =========================
   BUTTONS
========================= */

.course-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.btn{
    width:100%;
    border:none;
    padding:15px 20px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-cart{
    background:#2563eb;
    color:#fff;
}

.btn-enroll{
    background:#111827;
    color:#fff;
}

.btn-cart:hover{
    background:#1d4ed8;
}

.btn-enroll:hover{
    background:#000;
}

/* =========================
   COURSE DETAILS
========================= */

.course-content{
    padding:35px;
    border-top:1px solid #eee;
}

.section{
    margin-bottom:30px;
}

.section h2{
    font-size:23px;
    margin-bottom:15px;
}

.description{
    line-height:1.8;
    color:#475569;
    white-space:pre-line;
}

/* =========================
   INFO
========================= */

.course-info{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.info-card{
    background:#f8fafc;
    padding:17px;
    border-radius:12px;
}

.info-card i{
    color:#2563eb;
    margin-right:6px;
}

.info-card small{
    display:block;
    color:#64748b;
    margin-bottom:7px;
}

.info-card strong{
    font-size:14px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    bottom:25px;
    right:25px;
    background:#111827;
    color:white;
    padding:15px 20px;
    border-radius:10px;
    display:none;
    z-index:9999;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .course-hero{
        grid-template-columns:1fr;
        padding:20px;
    }

    .course-image{
        height:230px;
    }

    .course-title{
        font-size:28px;
    }

    .course-content{
        padding:20px;
    }

    .course-info{
        grid-template-columns:1fr 1fr;
    }

    .nav a.home{
        display:none;
    }

}

@media(max-width:480px){

    .course-info{
        grid-template-columns:1fr;
    }

    header{
        padding:0 20px;
    }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        LetsStudy Pro
    </div>

    <div class="nav">

        <a href="index.html"
           class="home">
            Home
        </a>

        <a href="courses.html"
           class="home">
            Courses
        </a>

        <a href="cart.html"
           class="cart-link">

            <i class="fa-solid fa-cart-shopping"></i>

            <span id="cartCount"
                  class="cart-count">
                0
            </span>

        </a>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- LOADING -->

    <div id="loading"
         class="loading">

        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>

        <p>
            Loading course...
        </p>

    </div>


    <!-- ERROR -->

    <div id="error"
         class="error">

        <i class="fa-solid fa-circle-exclamation"></i>

        <h2>
            Course Not Found
        </h2>

        <p id="errorMessage">
            Unable to load this course.
        </p>

    </div>


    <!-- COURSE -->

    <div id="courseBox"
         class="course-box">


        <!-- =====================
             HERO
        ====================== -->

        <div class="course-hero">


            <!-- IMAGE -->

            <div>

                <img id="courseImage"
                     class="course-image"
                     src=""
                     alt="Course">

            </div>


            <!-- COURSE DETAILS -->

            <div>

                <span id="courseCategory"
                      class="category">
                    Course
                </span>


                <h1 id="courseTitle"
                    class="course-title">
                    Course Title
                </h1>


                <p id="shortDescription"
                   class="short-description">
                </p>


                <!-- PRICE -->

                <div class="price">

                    <span id="coursePrice">
                        FREE
                    </span>

                </div>


                <!-- ACTIONS -->

                <div id="courseActions"
                     class="course-actions">

                </div>


            </div>

        </div>


        <!-- =====================
             CONTENT
        ====================== -->

        <div class="course-content">


            <!-- DESCRIPTION -->

            <div class="section">

                <h2>
                    About This Course
                </h2>

                <div id="description"
                     class="description">
                </div>

            </div>


            <!-- INFO -->

            <div class="section">

                <h2>
                    Course Information
                </h2>


                <div class="course-info">


                    <div class="info-card">

                        <small>
                            <i class="fa-solid fa-user"></i>
                            Instructor
                        </small>

                        <strong id="instructor">
                            -
                        </strong>

                    </div>


                    <div class="info-card">

                        <small>
                            <i class="fa-solid fa-signal"></i>
                            Level
                        </small>

                        <strong id="level">
                            -
                        </strong>

                    </div>


                    <div class="info-card">

                        <small>
                            <i class="fa-solid fa-clock"></i>
                            Duration
                        </small>

                        <strong id="duration">
                            -
                        </strong>

                    </div>


                    <div class="info-card">

                        <small>
                            <i class="fa-solid fa-play"></i>
                            Lessons
                        </small>

                        <strong id="lessons">
                            -
                        </strong>

                    </div>


                </div>

            </div>


        </div>

    </div>

</div>


<!-- TOAST -->

<div id="toast"
     class="toast">
</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* ==========================================
   GET COURSE ID
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const courseId =
    params.get("id");


console.log(
    "URL Course ID:",
    courseId
);


/* ==========================================
   CART FUNCTIONS
========================================== */

function getCart(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "letsStudyCart"
            )
        ) || [];

    }catch(error){

        return [];

    }

}


function saveCart(cart){

    localStorage.setItem(
        "letsStudyCart",
        JSON.stringify(cart)
    );

}


function updateCartCount(){

    const cart =
        getCart();

    document.getElementById(
        "cartCount"
    ).textContent =
        cart.length;

}


updateCartCount();


/* ==========================================
   TOAST
========================================== */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.style.display =
        "block";


    setTimeout(() => {

        toast.style.display =
            "none";

    }, 2500);

}


/* ==========================================
   CHECK COURSE ID
========================================== */

if(!courseId){

    showError(
        "Course ID is missing from the URL."
    );

}else{

    loadCourse();

}


/* ==========================================
   ERROR
========================================== */

function showError(message){

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "courseBox"
    ).style.display =
        "none";


    document.getElementById(
        "error"
    ).style.display =
        "block";


    document.getElementById(
        "errorMessage"
    ).textContent =
        message;

}


/* ==========================================
   LOAD COURSE
========================================== */

async function loadCourse(){

    try{


        /*
         * IMPORTANT
         *
         * courseId hapa ni Firestore
         * Document ID.
         */

        const courseRef =
            doc(
                db,
                "course",
                courseId
            );


        const snap =
            await getDoc(
                courseRef
            );


        if(!snap.exists()){

            throw new Error(
                "This course does not exist."
            );

        }


        /*
         * THIS IS THE REAL FIRESTORE
         * DOCUMENT ID.
         */

        const realCourseId =
            snap.id;


        const data =
            snap.data();


        console.log(
            "REAL DOCUMENT ID:",
            realCourseId
        );


        console.log(
            "COURSE DATA:",
            data
        );


        /* ==================================
           BASIC INFORMATION
        ================================== */

        const title =
            data.title ||
            "Untitled Course";


        const shortDescription =
            data.shortDescription ||
            data.short_description ||
            "";


        const description =
            data.description ||
            "";


        const category =
            data.category ||
            "Course";


        const instructor =
            data.instructorName ||
            data.instructor ||
            data.createdBy ||
            "LetsStudy Pro";


        const level =
            data.level ||
            "All Levels";


        const duration =
            data.duration ||
            "Self Paced";


        const lessons =
            data.lessonsCount ||
            data.lessons ||
            "—";


        const image =
            data.thumbnail ||
            data.image ||
            data.coverImage ||
            data.courseImage ||
            "";


        /*
         * PRICE
         *
         * 0 = FREE
         */

        const price =
            Number(
                data.price || 0
            );


        /* ==================================
           DISPLAY
        ================================== */

        document.getElementById(
            "courseTitle"
        ).textContent =
            title;


        document.getElementById(
            "courseCategory"
        ).textContent =
            category;


        document.getElementById(
            "shortDescription"
        ).textContent =
            shortDescription;


        document.getElementById(
            "description"
        ).textContent =
            description;


        document.getElementById(
            "instructor"
        ).textContent =
            instructor;


        document.getElementById(
            "level"
        ).textContent =
            level;


        document.getElementById(
            "duration"
        ).textContent =
            duration;


        document.getElementById(
            "lessons"
        ).textContent =
            lessons;


        /* ==================================
           IMAGE
        ================================== */

        document.getElementById(
            "courseImage"
        ).src =
            image ||
            "https://via.placeholder.com/800x500?text=Course";


        /* ==================================
           PRICE DISPLAY
        ================================== */

        if(price === 0){

            document.getElementById(
                "coursePrice"
            ).textContent =
                "FREE";

        }else{

            document.getElementById(
                "coursePrice"
            ).textContent =
                "TZS " +
                price.toLocaleString();

        }


        /* ==================================
           ACTION BUTTONS
        ================================== */

        const actions =
            document.getElementById(
                "courseActions"
            );


        /* ==================================
           FREE COURSE
           → ENROLL.HTML
        ================================== */

        if(price === 0){

            actions.innerHTML = `

                <button
                    class="btn btn-enroll"
                    id="freeEnrollBtn">

                    <i class="fa-solid fa-graduation-cap"></i>

                    Enroll for Free

                </button>

            `;


            document.getElementById(
                "freeEnrollBtn"
            ).onclick = function(){

                window.location.href =
                    "enroll.html?id=" +
                    encodeURIComponent(
                        realCourseId
                    );

            };

        }


        /* ==================================
           PAID COURSE
           → CART.HTML
        ================================== */

        else{

            actions.innerHTML = `

                <button
                    class="btn btn-cart"
                    id="addCartBtn">

                    <i class="fa-solid fa-cart-plus"></i>

                    Add to Cart

                </button>

                <button
                    class="btn btn-enroll"
                    id="viewCartBtn">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Go to Cart

                </button>

            `;


            /* ==================================
               ADD TO CART
            ================================== */

            document.getElementById(
                "addCartBtn"
            ).onclick = function(){


                let cart =
                    getCart();


                /*
                 * CHECK DUPLICATE
                 */

                const exists =
                    cart.some(
                        item =>
                            item.courseId ===
                            realCourseId
                    );


                if(exists){

                    showToast(
                        "Course is already in your cart."
                    );

                    setTimeout(() => {

                        window.location.href =
                            "cart.html";

                    }, 700);

                    return;

                }


                /*
                 * COURSE INFORMATION
                 * SENT TO CART
                 */

                const cartItem = {

                    /*
                     * REAL FIRESTORE DOCUMENT ID
                     */

                    courseId:
                        realCourseId,


                    title:
                        title,


                    shortDescription:
                        shortDescription,


                    description:
                        description,


                    category:
                        category,


                    thumbnail:
                        image,


                    price:
                        price,


                    currency:
                        data.currency ||
                        "TZS",


                    instructor:
                        instructor,


                    addedAt:
                        Date.now()

                };


                                /*
                 * ADD
                 */

                cart.push(
                    cartItem
                );


                /*
                 * SAVE CART
                 */

                saveCart(
                    cart
                );


                /*
                 * UPDATE CART COUNT
                 */

                updateCartCount();


                /*
                 * SHOW SUCCESS MESSAGE
                 */

                showToast(
                    "Course added to cart successfully."
                );


                /*
                 * GO TO CART
                 */

                setTimeout(() => {

                    window.location.href =
                        "cart.html";

                }, 700);

            };


            /* ==================================
               GO TO CART
            ================================== */

            document.getElementById(
                "viewCartBtn"
            ).onclick = function(){

                window.location.href =
                    "cart.html";

            };

        }


        /* ==================================
           SHOW COURSE
        ================================== */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "courseBox"
        ).style.display =
            "block";


    }catch(error){

        console.error(
            "Course Error:",
            error
        );


        showError(
            error.message ||
            "Unable to load course."
        );

    }

}

</script>

</body>

</html>
