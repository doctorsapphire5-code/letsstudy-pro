<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Inter,Arial,sans-serif;
 background:#f6f8fb;
 color:#172033
}

button,a{font:inherit}

.top{
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 padding:16px 6%;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.logo{
 font-size:21px;
 font-weight:800;
 color:#155eef
}

.cart{
 position:relative;
 color:#172033;
 text-decoration:none;
 font-size:20px
}

.cart span{
 position:absolute;
 top:-9px;
 right:-10px;
 background:#155eef;
 color:#fff;
 font-size:10px;
 width:18px;
 height:18px;
 border-radius:50%;
 display:grid;
 place-items:center
}

.hero{
 background:linear-gradient(135deg,#155eef,#0b4acb);
 color:white;
 padding:45px 6%
}

.hero-inner{
 max-width:1100px;
 margin:auto;
 display:grid;
 grid-template-columns:1fr 350px;
 gap:35px;
 align-items:center
}

.hero h1{
 font-size:36px;
 line-height:1.2;
 margin:10px 0
}

.hero p{
 color:#e5edff;
 line-height:1.7
}

.badges{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}

.badge{
 padding:6px 10px;
 background:#ffffff20;
 border:1px solid #ffffff30;
 border-radius:20px;
 font-size:12px
}

.thumbnail{
 width:100%;
 height:230px;
 object-fit:cover;
 border-radius:15px;
 background:#fff
}

.container{
 max-width:1100px;
 margin:30px auto;
 padding:0 20px;
 display:grid;
 grid-template-columns:1fr 330px;
 gap:25px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:22px;
 margin-bottom:20px
}

.card h2{
 margin-top:0;
 font-size:19px
}

.learn{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.learn div{
 padding:10px;
 background:#f8fafc;
 border-radius:8px;
 font-size:13px
}

.module{
 border:1px solid #e5e7eb;
 border-radius:10px;
 margin-bottom:10px;
 overflow:hidden
}

.module-title{
 padding:14px;
 font-weight:700;
 background:#f8fafc;
 display:flex;
 justify-content:space-between
}

.lesson{
 padding:11px 14px;
 border-top:1px solid #eee;
 font-size:13px;
 color:#596579
}

.lesson i{
 color:#155eef;
 margin-right:8px
}

.buy{
 position:sticky;
 top:20px
}

.price{
 font-size:28px;
 font-weight:800;
 margin:10px 0 20px
}

.action{
 width:100%;
 border:0;
 padding:14px;
 border-radius:10px;
 font-weight:700;
 cursor:pointer;
 margin-bottom:10px
}

.primary{
 background:#155eef;
 color:white
}

.secondary{
 background:#eef2f6;
 color:#172033
}

.meta{
 display:grid;
 gap:12px;
 margin-top:15px
}

.meta div{
 display:flex;
 justify-content:space-between;
 font-size:13px
}

.loading{
 text-align:center;
 padding:80px 20px
}

@media(max-width:800px){
 .hero-inner,.container{
   grid-template-columns:1fr
 }

 .hero h1{
   font-size:28px
 }

 .buy{
   position:static
 }

 .learn{
   grid-template-columns:1fr
 }
}
</style>
</head>

<body>

<header class="top">

  <a href="index.html" class="logo">
    LetsStudy Pro
  </a>

  <a href="cart.html" class="cart">
    <i class="fa-solid fa-cart-shopping"></i>
    <span id="cartCount">0</span>
  </a>

</header>


<div id="app">

  <div class="loading">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Loading course...</p>
  </div>

</div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 doc,
 getDoc,
 collection,
 getDocs,
 query,
 where,
 addDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
 getAuth,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);
const auth=getAuth(app);


/* =========================
   COURSE ID
========================= */

const params=
 new URLSearchParams(location.search);

const courseId=
 params.get("courseId") ||
 params.get("id");

const appEl=
 document.getElementById("app");

let currentUser=null;
let course=null;


/* =========================
   HELPERS
========================= */

function esc(value=""){
 return String(value)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function money(value,currency="TZS"){

 if(!value || Number(value)===0)
   return "Free";

 return `${currency} ${Number(value).toLocaleString()}`;
}


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth,user=>{

 currentUser=user;

 if(course)
   renderCourse();

});


/* =========================
   LOAD COURSE
========================= */

async function loadCourse(){

 if(!courseId){

   appEl.innerHTML=`
    <div class="loading">
      <h2>Course not found</h2>
      <p>Course ID is missing.</p>
    </div>
   `;

   return;
 }

 try{

   const ref=
     doc(db,"courses",courseId);

   const snap=
     await getDoc(ref);

   if(!snap.exists()){

     appEl.innerHTML=`
      <div class="loading">
       <h2>Course not found</h2>
      </div>
     `;

     return;
   }

   course={
     id:snap.id,
     ...snap.data()
   };

   await renderCourse();

 }catch(error){

   console.error(error);

   appEl.innerHTML=`
    <div class="loading">
      <h2>Unable to load course</h2>
      <p>Please try again later.</p>
    </div>
   `;
 }

}


/* =========================
   RENDER
========================= */

async function renderCourse(){

 if(!course)return;

 let modules=[];

 try{

   const q=query(
     collection(db,"courseModules"),
     where("courseId","==",courseId)
   );

   const snap=await getDocs(q);

   snap.forEach(x=>{
     modules.push({
       id:x.id,
       ...x.data()
     });
   });

   modules.sort(
     (a,b)=>(a.order||0)-(b.order||0)
   );

 }catch(e){

   console.error(e);

 }


 const image=
 course.thumbnail ||
 course.image ||
 "https://via.placeholder.com/700x400?text=Course";


 appEl.innerHTML=`

 <!-- HERO -->

 <section class="hero">

  <div class="hero-inner">

   <div>

    <div class="badges">

      ${course.category?
      `<span class="badge">
        ${esc(course.category)}
      </span>`:""}

      ${course.level?
      `<span class="badge">
        ${esc(course.level)}
      </span>`:""}

      ${course.featured?
      `<span class="badge">
        <i class="fa fa-star"></i>
        Featured
      </span>`:""}

    </div>

    <h1>
      ${esc(course.title||"Course")}
    </h1>

    <p>
      ${esc(
       course.shortDescription||
       course.description||
       ""
      )}
    </p>

    <p>
      <i class="fa fa-user"></i>
      ${esc(course.instructorName||"LetsStudy Pro")}
    </p>

   </div>

   <img
     class="thumbnail"
     src="${esc(image)}"
     alt="${esc(course.title||"Course")}"
   >

  </div>

 </section>


 <!-- MAIN -->

 <main class="container">

  <div>

   <!-- DESCRIPTION -->

   <section class="card">

    <h2>About This Course</h2>

    <p>
      ${esc(course.description||"")}
    </p>

   </section>


   <!-- WHAT YOU LEARN -->

   <section class="card">

    <h2>What You'll Learn</h2>

    <div class="learn">

      ${
       Array.isArray(course.learningOutcomes)
       ? course.learningOutcomes.map(x=>`
          <div>
           <i class="fa fa-check"></i>
           ${esc(x)}
          </div>
       `).join("")
       : `
         <div>
          <i class="fa fa-check"></i>
          Practical knowledge and skills
         </div>
         <div>
          <i class="fa fa-check"></i>
          Real-world learning experience
         </div>
       `
      }

    </div>

   </section>


   <!-- CURRICULUM -->

   <section class="card">

    <h2>Course Curriculum</h2>

    ${
      modules.length
      ? modules.map(module=>`

        <div class="module">

          <div class="module-title">

            <span>
              ${esc(module.title)}
            </span>

            <span class="muted">
              ${module.lessonsCount||""}
            </span>

          </div>

          <div
            id="lessons-${module.id}"
            class="module-lessons"
          >
            <div class="lesson">
              <i class="fa fa-spinner fa-spin"></i>
              Loading lessons...
            </div>
          </div>

        </div>

      `).join("")
      : `
        <p>
          Course content will be available soon.
        </p>
      `
    }

   </section>


   <!-- REQUIREMENTS -->

   <section class="card">

    <h2>Requirements</h2>

    <p>
      ${esc(course.requirements||"No specific requirements.")}
    </p>

   </section>

  </div>


  <!-- PURCHASE -->

  <aside>

   <div class="card buy">

    <h2>Get This Course</h2>

    <div class="price">
      ${money(
       course.price,
       course.currency||"TZS"
      )}
    </div>

    <button
      class="action primary"
      id="cartBtn"
    >
      <i class="fa fa-cart-plus"></i>
      Add to Cart
    </button>

    <button
      class="action secondary"
      id="enrollBtn"
    >
      Enroll Now
    </button>

    <div class="meta">

      <div>
       <span>Level</span>
       <strong>
        ${esc(course.level||"All Levels")}
       </strong>
      </div>

      <div>
       <span>Language</span>
       <strong>
        ${esc(course.language||"English")}
       </strong>
      </div>

      <div>
       <span>Lessons</span>
       <strong>
        ${course.lessonsCount||"—"}
       </strong>
      </div>

      <div>
       <span>Students</span>
       <strong>
        ${Number(
         course.enrollmentCount||0
        ).toLocaleString()}
      </strong>
      </div>

    </div>

   </div>

  </aside>

 </main>
 `;


 /* LOAD LESSONS */

 for(const module of modules){

   loadLessons(module.id);

 }


 document
  .getElementById("cartBtn")
  ?.addEventListener(
    "click",
    addToCart
  );


 document
  .getElementById("enrollBtn")
  ?.addEventListener(
    "click",
    enrollNow
  );


 updateCartCount();

}


/* =========================
   LESSONS
========================= */

async function loadLessons(moduleId){

 try{

   const q=query(
     collection(db,"lessons"),
     where("moduleId","==",moduleId)
   );

   const snap=await getDocs(q);

   const lessons=[];

   snap.forEach(x=>{
     lessons.push({
       id:x.id,
       ...x.data()
     });
   });

   lessons.sort(
     (a,b)=>(a.order||0)-(b.order||0)
   );

   const el=
    document.getElementById(
     `lessons-${moduleId}`
    );

   if(!el)return;

   el.innerHTML=lessons.length
   ? lessons.map(lesson=>`

      <div class="lesson">

       <i class="${
        lesson.type==="video"
        ?"fa fa-play"
        :lesson.type==="pdf"
        ?"fa fa-file-pdf"
        :"fa fa-book"
       }"></i>

       ${esc(lesson.title)}

       ${
        lesson.duration
        ?` · ${esc(lesson.duration)}`
        :""
       }

      </div>

    `).join("")
   :`
      <div class="lesson">
       No lessons yet.
      </div>
    `;

 }catch(error){

   console.error(error);

 }

}


/* =========================
   ADD TO CART
========================= */

async function addToCart(){

 if(!currentUser){

   location.href=
    "login.html?redirect="+
    encodeURIComponent(
     location.href
    );

   return;
 }


 const cartRef=
  collection(
   db,
   "users",
   currentUser.uid,
   "cart"
  );


 try{

   const existing=query(
     cartRef,
     where("courseId","==",courseId)
   );

   const snap=
    await getDocs(existing);

   if(!snap.empty){

     location.href=
      `cart.html?courseId=${courseId}`;

     return;
   }


   await addDoc(
    cartRef,
    {
      courseId,
      title:course.title||"",
      price:Number(course.price||0),
      currency:course.currency||"TZS",
      thumbnail:
       course.thumbnail||
       course.image||
       "",
      addedAt:serverTimestamp()
    }
   );


   location.href=
    `cart.html?courseId=${courseId}`;

 }catch(error){

   console.error(error);

   alert(
    "Unable to add course to cart."
   );

 }

}


/* =========================
   ENROLL
========================= */

async function enrollNow(){

 if(!currentUser){

   location.href=
    "login.html?redirect="+
    encodeURIComponent(
     location.href
    );

   return;
 }


 if(Number(course.price||0)>0){

   await addToCart();

   return;
 }


 try{

   await addDoc(
    collection(
     db,
     "enrollments"
    ),
    {
      userId:currentUser.uid,
      courseId,
      courseTitle:course.title||"",
      status:"active",
      progress:0,
      completedLessons:[],
      lastLessonId:null,
      enrolledAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    }
   );


   location.href=
    `enrollments.html?courseId=${courseId}`;

 }catch(error){

   console.error(error);

   alert(
    "Enrollment failed."
   );

 }

}


/* =========================
   CART COUNT
========================= */

async function updateCartCount(){

 if(!currentUser){

   document.getElementById(
    "cartCount"
   ).textContent="0";

   return;
 }


 try{

   const snap=
    await getDocs(
     collection(
      db,
      "users",
      currentUser.uid,
      "cart"
     )
    );

   document.getElementById(
    "cartCount"
   ).textContent=snap.size;

 }catch(e){}

}


/* =========================
   START
========================= */

loadCourse();

</script>

</body>
</html>
