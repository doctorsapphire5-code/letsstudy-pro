<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Course | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
height:65px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5%
}

.logo{
font-size:21px;
font-weight:800;
color:#2563eb
}

header a{
color:#475569;
text-decoration:none
}

.hero{
background:#111827;
color:#fff;
padding:45px 5%
}

.hero-inner{
max-width:1150px;
margin:auto;
display:grid;
grid-template-columns:1.5fr 1fr;
gap:35px;
align-items:center
}

.badge{
display:inline-block;
background:#2563eb;
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:700;
margin-bottom:15px
}

.hero h1{
font-size:38px;
line-height:1.15;
margin:0 0 15px
}

.hero p{
color:#cbd5e1;
line-height:1.7
}

.meta{
display:flex;
flex-wrap:wrap;
gap:15px;
margin-top:20px;
color:#cbd5e1;
font-size:13px
}

.preview{
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 10px 35px #0005
}

.preview img{
width:100%;
height:230px;
object-fit:cover;
display:block
}

.preview-body{
padding:20px;
color:#172033
}

.price{
font-size:27px;
font-weight:800;
margin-bottom:15px
}

.enroll{
width:100%;
padding:14px;
border:0;
border-radius:8px;
background:#2563eb;
color:#fff;
font-weight:800;
cursor:pointer
}

main{
max-width:1150px;
margin:30px auto;
padding:0 15px
}

.layout{
display:grid;
grid-template-columns:2fr 1fr;
gap:22px
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:22px;
margin-bottom:20px
}

.card h2{
margin:0 0 18px;
font-size:19px
}

.description{
line-height:1.8;
color:#475569;
white-space:pre-line
}

.outcome{
padding:10px 0;
border-bottom:1px solid #eee
}

.outcome i{
color:#16a34a;
margin-right:8px
}

.module{
border:1px solid #e5e7eb;
border-radius:10px;
margin-bottom:10px;
overflow:hidden
}

.module-head{
padding:15px;
display:flex;
justify-content:space-between;
background:#f8fafc;
font-weight:700
}

.lesson{
padding:12px 15px;
border-top:1px solid #eee;
font-size:13px;
color:#475569
}

.side-item{
display:flex;
justify-content:space-between;
padding:11px 0;
border-bottom:1px solid #eee;
font-size:14px
}

.loading{
text-align:center;
padding:60px;
color:#64748b
}

.error{
text-align:center;
padding:70px 20px
}

@media(max-width:800px){

.hero-inner,
.layout{
grid-template-columns:1fr
}

.hero h1{
font-size:29px
}

.preview{
max-width:500px
}

}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<a href="courses.html">
<i class="fa fa-arrow-left"></i>
Courses
</a>

</header>


<div id="app">

<div class="loading">
<i class="fa fa-spinner fa-spin"></i>
Loading course...
</div>

</div>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getFirestore,
doc,
getDoc,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* COURSE ID */

const params=
new URLSearchParams(location.search);

const courseId=
params.get("id");

const appBox=
document.getElementById("app");


/* ESCAPE */

function safe(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* LOAD COURSE */

async function loadCourse(){

if(!courseId){

appBox.innerHTML=`
<div class="error">
<h2>Course not found</h2>
<p>No course ID was provided.</p>
<a href="courses.html">
Back to Courses
</a>
</div>`;

return;

}


try{

const snap=
await getDoc(
doc(db,"courses",courseId)
);


if(!snap.exists()){

appBox.innerHTML=`
<div class="error">
<h2>Course Not Found</h2>
<p>This course does not exist.</p>
</div>`;

return;

}


const course=snap.data();


/* STATUS CHECK */

if(
course.status==="draft"
){

appBox.innerHTML=`
<div class="error">
<h2>Course Unavailable</h2>
<p>This course has not been published yet.</p>
</div>`;

return;

}


/* TAGS */

const tags=
Array.isArray(course.tags)
?course.tags.join(", ")
:"";


/* PRICE */

const price=
Number(course.price||0);

const currency=
course.currency||"TZS";

const priceText=
price===0
?"Free"
:`${currency} ${price.toLocaleString()}`;


/* THUMBNAIL */

const image=
course.thumbnail||
"https://via.placeholder.com/800x450?text=LetsStudy+Pro";


/* OUTCOMES */

let outcomes="";

if(Array.isArray(course.outcomes)){

outcomes=
course.outcomes.map(item=>`

<div class="outcome">

<i class="fa fa-check-circle"></i>

${safe(item)}

</div>

`).join("");

}


/* PAGE */

appBox.innerHTML=`

<section class="hero">

<div class="hero-inner">

<div>

<span class="badge">
${safe(course.category||"Course")}
</span>

<h1>
${safe(course.title||"Untitled Course")}
</h1>

<p>
${safe(
course.shortDescription||
"Start learning with LetsStudy Pro."
)}
</p>

<div class="meta">

<span>
<i class="fa fa-signal"></i>
${safe(course.level||"All Levels")}
</span>

<span>
<i class="fa fa-clock"></i>
${safe(course.duration||"Self paced")}
</span>

<span>
<i class="fa fa-language"></i>
${safe(course.language||"English")}
</span>

<span>
<i class="fa fa-user"></i>
${safe(course.instructor||"LetsStudy Pro")}
</span>

</div>

</div>


<div class="preview">

<img
src="${safe(image)}"
alt="${safe(course.title)}"
onerror="this.src='https://via.placeholder.com/800x450?text=Course'">

<div class="preview-body">

<div class="price">
${priceText}
</div>

<button
class="enroll"
onclick="enrollCourse()">

<i class="fa fa-graduation-cap"></i>
Enroll Now

</button>

</div>

</div>

</div>

</section>


<main>

<div class="layout">

<div>

<div class="card">

<h2>
<i class="fa fa-book-open"></i>
About This Course
</h2>

<div class="description">
${safe(course.description||"No description available.")}
</div>

</div>


<div class="card">

<h2>
<i class="fa fa-bullseye"></i>
What You Will Learn
</h2>

${outcomes||`
<p class="description">
Learning outcomes will be added soon.
</p>
`}

</div>


<div class="card">

<h2>
<i class="fa fa-layer-group"></i>
Course Content
</h2>

<div id="modules">

<div class="loading">
Loading modules...
</div>

</div>

</div>

</div>


<div>

<div class="card">

<h2>
Course Information
</h2>

<div class="side-item">
<span>Category</span>
<strong>${safe(course.category||"-")}</strong>
</div>

<div class="side-item">
<span>Level</span>
<strong>${safe(course.level||"-")}</strong>
</div>

<div class="side-item">
<span>Language</span>
<strong>${safe(course.language||"-")}</strong>
</div>

<div class="side-item">
<span>Duration</span>
<strong>${safe(course.duration||"-")}</strong>
</div>

<div class="side-item">
<span>Instructor</span>
<strong>${safe(course.instructor||"-")}</strong>
</div>

<div class="side-item">
<span>Students</span>
<strong>${Number(course.enrollmentCount||0).toLocaleString()}</strong>
</div>

</div>


<div class="card">

<h2>
Requirements
</h2>

<p class="description">
${safe(course.requirements||"No specific requirements.")}
</p>

</div>


<div class="card">

<h2>
Tags
</h2>

<p class="description">
${safe(tags||"No tags")}
</p>

</div>

</div>

</div>

</main>

`;


/* LOAD MODULES */

loadModules();

}catch(error){

console.error(error);

appBox.innerHTML=`
<div class="error">
<h2>Something went wrong</h2>
<p>Unable to load this course.</p>
</div>`;

}

}


/* MODULES */

async function loadModules(){

const container=
document.getElementById("modules");

if(!container)return;


try{

const snap=
await getDocs(
collection(
db,
"courses",
courseId,
"modules"
)
);


if(snap.empty){

container.innerHTML=`
<p class="description">
Course content will be available soon.
</p>`;

return;

}


container.innerHTML="";


for(const moduleDoc of snap.docs){

const module=
moduleDoc.data();

const moduleBox=
document.createElement("div");

moduleBox.className=
"module";


moduleBox.innerHTML=`

<div class="module-head">

<span>
${safe(module.title||"Module")}
</span>

<span>
<i class="fa fa-chevron-down"></i>
</span>

</div>

<div class="lesson-list"
id="lessons-${moduleDoc.id}">

<div class="lesson">
Loading lessons...
</div>

</div>

`;


container.appendChild(moduleBox);


/* LESSONS */

loadLessons(
moduleDoc.id,
moduleBox.querySelector(".lesson-list")
);

}

}catch(error){

console.error(error);

container.innerHTML=`
<p class="description">
No modules available yet.
</p>`;

}

}


/* LESSONS */

async function loadLessons(
moduleId,
container
){

try{

const snap=
await getDocs(
collection(
db,
"courses",
courseId,
"modules",
moduleId,
"lessons"
)
);


if(snap.empty){

container.innerHTML=`
<div class="lesson">
No lessons yet.
</div>`;

return;

}


container.innerHTML="";


snap.forEach(d=>{

const lesson=d.data();

container.innerHTML+=`

<div class="lesson">

<i class="fa fa-play-circle"></i>

${safe(
lesson.title||
"Lesson"
)}

</div>

`;

});

}catch(error){

container.innerHTML=`
<div class="lesson">
Lessons unavailable.
</div>`;

}

}


/* ENROLL */

window.enrollCourse=
function(){

if(!courseId)return;

location.href=
`enroll.html?courseId=${encodeURIComponent(courseId)}`;

};


/* START */

loadCourse();

</script>

</body>
</html>
