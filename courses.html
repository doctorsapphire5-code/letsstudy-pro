<style>
:root{
  --ink:#0d1b2a;--ink-2:#16293f;--paper:#f2f5f9;--card:#fff;--line:#dde4ec;
  --mute:#5b6b7e;--brand:#0a7c66;--brand-soft:#e2f4ef;--amber:#f2a93b;
  --head:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.i{width:17px;height:17px;min-width:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,5%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:20px;font-weight:700;letter-spacing:-.3px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--amber);display:grid;place-items:center;font-size:16px}
.topbar nav{display:flex;gap:6px}
.topbar nav a{padding:8px 14px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--mute)}
.topbar nav a:hover{background:var(--paper);color:var(--ink)}
.topbar nav a[aria-current]{color:var(--ink);background:var(--paper)}

.container{flex:1;width:min(1180px,92%);margin:0 auto;padding:30px 0 64px}

/* HERO */
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:clamp(28px,5vw,52px);margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-100px;top:-100px;width:340px;height:340px;border-radius:50%;border:48px solid rgba(242,169,59,.07);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero h1{font-family:var(--head);font-size:clamp(32px,5.4vw,56px);line-height:1.04;letter-spacing:-1.4px;margin-bottom:12px;max-width:16ch}
.hero p{color:#b6c3d2;max-width:54ch;margin-bottom:26px;font-size:17px}
.search{position:relative;display:block;max-width:560px}
.search .i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--mute);width:19px;height:19px}
.search input{width:100%;height:56px;padding:0 18px 0 50px;border:2px solid transparent;border-radius:14px;background:#fff;font:500 16px var(--body);color:var(--ink)}
.search input::placeholder{color:#8b98a8}
.search input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(242,169,59,.25)}

/* TOOLBAR */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:8px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.filters::-webkit-scrollbar{display:none}
.filter{flex-shrink:0;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--mute);font:600 13.5px var(--body);cursor:pointer;transition:all .2s}
.filter:hover{border-color:var(--ink);color:var(--ink)}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sort{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font:600 13.5px var(--body);color:var(--ink)}
.sort:focus{outline:none;border-color:var(--brand)}
.count{color:var(--mute);font-size:14px;margin:6px 2px 18px;min-height:22px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s,box-shadow .2s}
.card:hover{border-color:var(--brand);transform:translateY(-4px);box-shadow:0 16px 36px rgba(13,27,42,.1)}
.thumb{position:relative;aspect-ratio:16/10;background:var(--ink);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .thumb img{transform:scale(1.04)}
.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ink),var(--ink-2));color:var(--amber);font-family:var(--head);font-size:56px;font-weight:700}
.tag{position:absolute;top:12px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
.tag.cat{left:12px;background:rgba(13,27,42,.78);color:#fff}
.tag.acc{right:12px;background:var(--brand);color:#fff}
.tag.acc.plan{background:var(--amber);color:var(--ink)}
.content{padding:20px;display:flex;flex-direction:column;flex:1}
.content h2{font-family:var(--head);font-size:20px;line-height:1.28;letter-spacing:-.3px;margin-bottom:8px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.content p{color:var(--mute);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;margin-bottom:16px;font-size:13px;color:var(--mute)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:14.5px;transition:background .2s}
.card:hover .btn{background:var(--amber);color:var(--ink)}

/* STATES */
.state{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:56px 24px;text-align:center;color:var(--mute)}
.state h3{font-family:var(--head);font-size:21px;color:var(--ink);margin-bottom:6px}
.state-icon{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.state-icon .i{width:27px;height:27px}
.state.err{border-color:#fecaca}
.state.err .state-icon{background:#fee2e2;color:#b91c1c}
.state button{margin-top:16px;padding:11px 20px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 14px var(--body);cursor:pointer}
@keyframes sh{to{background-position:-200% 0}}
.sk{height:380px;border-radius:20px;background:linear-gradient(90deg,#e6ebf1 25%,#f4f7fa 50%,#e6ebf1 75%) 0 0/200% 100%;animation:sh 1.4s linear infinite}

.footer{padding:26px;background:#fff;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:14px}

@media(max-width:600px){
  .container{padding:18px 0 44px}
  .hero{border-radius:20px}
  .grid{grid-template-columns:1fr}
  .sort{width:100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></symbol>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">L</span>LetsStudy Pro</a>
  <nav aria-label="Main">
    <a href="index.html">Home</a>
    <a href="courses.html" aria-current="page">Courses</a>

  </nav>

<main class="container">

  <section class="hero">
    <h1>Explore courses</h1>
    <p>Learn practical skills and grow with LetsStudy Pro. Pick a course and start today.</p>
    <label class="search">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search by title, topic or instructor" aria-label="Search courses" autocomplete="off">
    </label>
  </section>

  <div class="toolbar">
    <div class="filters" id="filters" role="group" aria-label="Filter by category" hidden></div>
    <select class="sort" id="sort" aria-label="Sort courses">
      <option value="newest">Newest first</option>
      <option value="az">A to Z</option>
    </select>
  </div>
  <div class="count" id="status" aria-live="polite">Loading courses…</div>

  <div id="courses" class="grid">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const db = getFirestore(initializeApp(firebaseConfig));

const $ = (id) => document.getElementById(id);
const container = $("courses"), statusEl = $("status"), search = $("search"), filtersEl = $("filters"), sortEl = $("sort");
const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
/* Every value from the database is escaped before it goes into the page */
const esc = (v) => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const HIDDEN = ["draft","private","disabled"];

let allCourses = [], activeCategory = "all";

/* FIELD HELPERS */
function first(data, fields){
  for(const f of fields){
    const v = data?.[f];
    if(v !== undefined && v !== null && String(v).trim() !== "") return String(v).trim();
  }
  return "";
}
const titleOf = (c) => first(c, ["title","name","courseTitle"]) || "Untitled course";
const categoryOf = (c) => first(c, ["category","subject","field"]);
const imageOf = (c) => first(c, ["thumbnail","thumbnailUrl","image","imageUrl","cover","coverImage"]);
function isPlan(c){
  const access = first(c, ["access","accessType","membership","plan","pricing"]).toLowerCase();
  return ["plan","premium","paid","pro"].includes(access) || c.premium === true || c.isPremium === true || c.paid === true;
}
function time(v){
  if(!v) return 0;
  if(typeof v.toDate === "function") return v.toDate().getTime();
  if(typeof v === "object" && v.seconds) return Number(v.seconds) * 1000;
  const t = new Date(v).getTime();
  return Number.isNaN(t) ? 0 : t;
}
/* Only normal web images are used */
const safeImage = (u) => /^https?:\/\//i.test(u) ? u : "";

/* LOAD */
async function loadCourses(){
  try{
    const snap = await getDocs(collection(db, "courses"));
    allCourses = snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .filter((c) => !HIDDEN.includes(String(c.status || "").toLowerCase()));
    renderFilters();
    const q = new URLSearchParams(location.search).get("q");
    if(q) search.value = q;
    render();
  }catch(error){
    console.error(error);
    statusEl.textContent = "";
    container.innerHTML = `
      <div class="state err"><div class="state-icon">${icon("alert")}</div>
        <h3>Unable to load courses</h3>
        <p>Check your connection and try again.</p>
        <button type="button" id="retry">Try again</button>
      </div>`;
    $("retry").addEventListener("click", () => location.reload());
  }
}

/* CATEGORY FILTERS */
function renderFilters(){
  const counts = {};
  allCourses.forEach(c => { const k = categoryOf(c); if(k) counts[k] = (counts[k] || 0) + 1; });
  const cats = Object.keys(counts).sort((a, b) => a.localeCompare(b));
  filtersEl.hidden = cats.length < 2;
  filtersEl.innerHTML = ["all", ...cats].map(k => `<button class="filter" type="button" data-c="${esc(k)}" aria-pressed="${k === activeCategory}">${k === "all" ? "All courses" : esc(k)}</button>`).join("");
}
filtersEl.addEventListener("click", (e) => {
  const b = e.target.closest(".filter");
  if(!b) return;
  activeCategory = b.dataset.c;
  filtersEl.querySelectorAll(".filter").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
});

/* RENDER */
function render(){
  const q = search.value.toLowerCase().trim();
  const list = allCourses.filter((c) => {
    if(activeCategory !== "all" && categoryOf(c) !== activeCategory) return false;
    if(!q) return true;
    return [titleOf(c), first(c, ["description","shortDescription","summary"]), categoryOf(c), first(c, ["instructor","instructorName","teacher","author"])].join(" ").toLowerCase().includes(q);
  });

  list.sort(sortEl.value === "az"
    ? (a, b) => titleOf(a).localeCompare(titleOf(b))
    : (a, b) => time(b.createdAt) - time(a.createdAt) || titleOf(a).localeCompare(titleOf(b)));

  if(!list.length){
    statusEl.textContent = "";
    container.innerHTML = `
      <div class="state"><div class="state-icon">${icon(allCourses.length ? "search" : "book")}</div>
        <h3>${allCourses.length ? "No courses found" : "No courses yet"}</h3>
        <p>${allCourses.length ? "Try different words or choose another category." : "New courses will appear here soon."}</p>
      </div>`;
    return;
  }

  statusEl.textContent = `${list.length} ${list.length === 1 ? "course" : "courses"} available`;

  container.innerHTML = list.map((c) => {
    const title = titleOf(c), cat = categoryOf(c), img = safeImage(imageOf(c));
    const desc = first(c, ["description","shortDescription","summary"]) || "Learn practical knowledge and skills.";
    const level = first(c, ["level","courseLevel"]), dur = first(c, ["duration","courseDuration"]), who = first(c, ["instructor","instructorName","teacher","author"]);
    return `
      <article class="card">
        <div class="thumb">
          ${img ? `<img src="${esc(img)}" alt="${esc(title)}" loading="lazy">` : `<div class="ph" aria-hidden="true">${esc(title.charAt(0).toUpperCase())}</div>`}
          ${cat ? `<span class="tag cat">${esc(cat)}</span>` : ""}
          <span class="tag acc${isPlan(c) ? " plan" : ""}">${isPlan(c) ? "Plan" : "Free"}</span>
        </div>
        <div class="content">
          <h2>${esc(title)}</h2>
          <p>${esc(desc)}</p>
          <div class="meta">
            ${level ? `<span>${icon("level")}${esc(level)}</span>` : ""}
            ${dur ? `<span>${icon("clock")}${esc(dur)}</span>` : ""}
            ${who ? `<span>${icon("user")}${esc(who)}</span>` : ""}
          </div>
          <a class="btn" href="course-details.html?id=${encodeURIComponent(c.id)}">View course${icon("arrow")}</a>
        </div>
      </article>`;
  }).join("");
}

/* A broken image falls back to the lettered placeholder */
container.addEventListener("error", (e) => {
  const img = e.target;
  if(img.tagName !== "IMG") return;
  const ph = document.createElement("div");
  ph.className = "ph";
  ph.setAttribute("aria-hidden", "true");
  ph.textContent = (img.alt || "?").charAt(0).toUpperCase();
  img.replaceWith(ph);
}, true);

search.addEventListener("input", render);
sortEl.addEventListener("change", render);

loadCourses();
</script>
</body>
