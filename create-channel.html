<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Create Channel | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{color:#2563eb}

.home{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:700px;
  margin:35px auto;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 22px #0000000b;
}

h1{
  font-size:28px;
  margin-bottom:7px;
}

.subtitle{
  color:#64748b;
  margin-bottom:25px;
}

.field{
  margin-bottom:17px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #dce1e8;
  border-radius:8px;
  outline:none;
  font:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.submit{
  width:100%;
  border:0;
  background:#2563eb;
  color:white;
  padding:13px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.submit:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
}

.status.show{display:block}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.user{
  background:#f1f5f9;
  padding:11px;
  border-radius:8px;
  margin-bottom:20px;
  color:#475569;
  font-size:14px;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="home"
    onclick="location.href='index.html'"
  >
    <i class="fa-solid fa-house"></i>
    Home
  </button>

</header>

<main class="container">

  <div class="card">

    <h1>Create Channel</h1>

    <p class="subtitle">
      Create your public channel on LetsStudy Pro.
    </p>

    <div
      id="userBox"
      class="user"
    >
      Checking authentication...
    </div>

    <form id="channelForm">

      <div class="field">

        <label for="name">
          Channel Name
        </label>

        <input
          id="name"
          type="text"
          maxlength="100"
          required
          placeholder="e.g. Science Learning"
        >

      </div>

      <div class="field">

        <label for="username">
          Channel Username
        </label>

        <input
          id="username"
          type="text"
          maxlength="50"
          required
          placeholder="e.g. sciencelearning"
        >

      </div>

      <div class="field">

        <label for="category">
          Category
        </label>

        <select id="category" required>

          <option value="">
            Select category
          </option>

          <option>Education</option>
          <option>Technology</option>
          <option>Business</option>
          <option>Science</option>
          <option>Career</option>
          <option>News</option>
          <option>Entertainment</option>
          <option>Other</option>

        </select>

      </div>

      <div class="field">

        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          maxlength="1000"
          placeholder="Describe your channel..."
        ></textarea>

      </div>

      <div class="field">

        <label for="image">
          Channel Image URL
        </label>

        <input
          id="image"
          type="url"
          placeholder="https://..."
        >

      </div>

      <button
        id="submitBtn"
        class="submit"
        type="submit"
      >
        <i class="fa-solid fa-plus"></i>
        Create Channel
      </button>

      <div
        id="status"
        class="status"
      ></div>

    </form>

  </div>

</main>

<script type="module">

/*
==================================================
CREATE CHANNEL

Firebase Auth:
- identifies the logged-in user

API:
- creates the channel

Firestore:
- remains the database

Admin:
- NOT USED / NOT MODIFIED
==================================================
*/

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* =========================
   DOM
========================= */

const form =
  document.getElementById(
    "channelForm"
  );

const userBox =
  document.getElementById(
    "userBox"
  );

const statusBox =
  document.getElementById(
    "status"
  );

const submitBtn =
  document.getElementById(
    "submitBtn"
  );


let currentUser = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  user => {

    currentUser = user;

    if(!user){

      userBox.innerHTML = `

        <i class="fa-solid fa-lock"></i>

        You must login before creating
        a channel.

      `;

      submitBtn.disabled = true;

      return;

    }


    userBox.innerHTML = `

      <i class="fa-solid fa-user"></i>

      Signed in as

      <strong>
        ${escapeHTML(
          user.displayName ||
          user.email ||
          "User"
        )}
      </strong>

    `;

    submitBtn.disabled = false;

  }
);


/* =========================
   CREATE
========================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(!currentUser){

      showStatus(
        "Please login first.",
        "error"
      );

      return;

    }


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const username =
      document
        .getElementById("username")
        .value
        .trim()
        .toLowerCase()
        .replace(
          /[^a-z0-9_]/g,
          ""
        );


    const category =
      document
        .getElementById("category")
        .value;


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    const image =
      document
        .getElementById("image")
        .value
        .trim();


    if(!name || !username || !category){

      showStatus(
        "Please complete all required fields.",
        "error"
      );

      return;

    }


    submitBtn.disabled = true;

    submitBtn.innerHTML = `

      <i class="fa-solid fa-spinner fa-spin"></i>

      Creating...

    `;


    try{

      /*
        Firebase Auth token.

        API uses this token to verify
        who is creating the channel.
      */

      const token =
        await currentUser.getIdToken();


      const response =
        await fetch(
          "/api/channels",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " + token
            },

            body:JSON.stringify({

              name,

              username,

              category,

              description,

              image

            })

          }
        );


      const result =
        await response.json();


      if(!response.ok){

        throw new Error(
          result.error ||
          "Failed to create channel"
        );

      }


      showStatus(
        "Channel created successfully.",
        "success"
      );


      form.reset();


      /*
        If API returns a channel ID,
        open the channel page.
      */

      if(
        result.id ||
        result.channelId
      ){

        const id =
          result.id ||
          result.channelId;

        setTimeout(
          () => {

            location.href =
              "channel.html?id=" +
              encodeURIComponent(id);

          },
          700
        );

      }


    }catch(error){

      console.error(
        "CREATE CHANNEL ERROR:",
        error
      );

      showStatus(
        error.message ||
        "Unable to create channel.",
        "error"
      );

    }finally{

      submitBtn.disabled = false;

      submitBtn.innerHTML = `

        <i class="fa-solid fa-plus"></i>

        Create Channel

      `;

    }

  }
);


/* =========================
   STATUS
========================= */

function showStatus(
  message,
  type
){

  statusBox.className =
    "status show " + type;

  statusBox.textContent =
    message;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
