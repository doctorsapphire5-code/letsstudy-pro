<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Event</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#172033;
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.header h1{
    margin:0;
    font-size:19px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:28px 20px 60px;
}

.card{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:24px;
}

.card h2{
    margin:0 0 20px;
    font-size:18px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    color:#475569;
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:11px 12px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:#fff;
    outline:none;
    font:inherit;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#7c3aed;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
}

.checkbox-row input{
    width:auto;
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    margin-top:24px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 16px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.primary{
    background:#7c3aed;
    color:#fff;
}

.secondary{
    background:#e2e8f0;
    color:#334155;
}

.message{
    display:none;
    margin-top:16px;
    padding:11px;
    border-radius:7px;
    background:#dcfce7;
    color:#166534;
    font-size:11px;
    font-weight:700;
}

.message.show{
    display:block;
}

@media(max-width:650px){

    .header{
        padding:0 14px;
    }

    .container{
        padding:16px 12px 40px;
    }

    .card{
        padding:18px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

    .actions{
        flex-direction:column-reverse;
    }

    button{
        width:100%;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>Create Event</h1>

    <button
        class="secondary"
        onclick="goBack()">
        Back
    </button>

</header>


<main class="container">

    <section class="card">

        <h2>
            Event details
        </h2>


        <form
            id="eventForm"
            onsubmit="createEvent(event)">


            <div class="form-group">

                <label for="title">
                    Event title
                </label>

                <input
                    id="title"
                    name="title"
                    type="text"
                    placeholder="Team meeting"
                    required>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Add event details..."></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        id="date"
                        name="date"
                        type="date"
                        required>

                </div>


                <div class="form-group">

                    <label for="time">
                        Time
                    </label>

                    <input
                        id="time"
                        name="time"
                        type="time"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    id="location"
                    name="location"
                    type="text"
                    placeholder="Office, online, or address">

            </div>


            <div class="form-group">

                <label for="eventType">
                    Event type
                </label>

                <select
                    id="eventType"
                    name="eventType">

                    <option value="meeting">
                        Meeting
                    </option>

                    <option value="appointment">
                        Appointment
                    </option>

                    <option value="personal">
                        Personal
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="attendees">
                    Attendees
                </label>

                <input
                    id="attendees"
                    name="attendees"
                    type="text"
                    placeholder="john@example.com, jane@example.com">

            </div>


            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status">

                    <option value="scheduled">
                        Scheduled
                    </option>

                    <option value="confirmed">
                        Confirmed
                    </option>

                    <option value="draft">
                        Draft
                    </option>

                </select>

            </div>


            <div class="checkbox-row">

                <input
                    id="reminder"
                    name="reminder"
                    type="checkbox"
                    checked>

                <label
                    for="reminder">
                    Send a reminder
                </label>

            </div>


            <div
                id="message"
                class="message">
                Event created successfully.
            </div>


            <div class="actions">

                <button
                    type="button"
                    class="secondary"
                    onclick="resetForm()">
                    Clear
                </button>

                <button
                    type="submit"
                    class="primary">
                    Create Event
                </button>

            </div>

        </form>

    </section>

</main>


<script>

const STORAGE_KEY =
    "events-data";


/* =========================
   INITIALIZE
========================= */

function initializeForm(){

    const now =
        new Date();


    const date =
        now.toISOString()
        .split("T")[0];


    document.getElementById(
        "date"
    ).value =
        date;

}


/* =========================
   CREATE EVENT
========================= */

function createEvent(event){

    event.preventDefault();


    const title =
        document.getElementById(
            "title"
        ).value.trim();

    const description =
        document.getElementById(
            "description"
        ).value.trim();

    const date =
        document.getElementById(
            "date"
        ).value;

    const time =
        document.getElementById(
            "time"
        ).value;

    const location =
        document.getElementById(
            "location"
        ).value.trim();

    const eventType =
        document.getElementById(
            "eventType"
        ).value;

    const attendees =
        document.getElementById(
            "attendees"
        ).value
        .split(",")
        .map(
            item =>
                item.trim()
        )
        .filter(Boolean);

    const status =
        document.getElementById(
            "status"
        ).value;

    const reminder =
        document.getElementById(
            "reminder"
        ).checked;


    if(
        !title ||
        !date ||
        !time
    ){

        return;

    }


    const eventData = {

        id:
            Date.now(),

        title,

        description,

        date,

        time,

        location,

        eventType,

        attendees,

        status,

        reminder,

        createdAt:
            new Date()
            .toISOString()

    };


    const events =
        loadEvents();


    events.push(
        eventData
    );


    saveEvents(
        events
    );


    document.getElementById(
        "message"
    ).classList.add(
        "show"
    );


    setTimeout(
        () => {

            document.getElementById(
                "message"
            ).classList.remove(
                "show"
            );

        },
        2500
    );

}


/* =========================
   LOAD EVENTS
========================= */

function loadEvents(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if(!saved){
        return [];
    }


    try{

        const events =
            JSON.parse(
                saved
            );


        return Array.isArray(
            events
        )
            ? events
            : [];

    }catch(error){

        return [];

    }

}


/* =========================
   SAVE EVENTS
========================= */

function saveEvents(
    events
){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            events
        )
    );

}


/* =========================
   RESET
========================= */

function resetForm(){

    document.getElementById(
        "eventForm"
    ).reset();


    initializeForm();

}


/* =========================
   BACK
========================= */

function goBack(){

    if(
        history.length > 1
    ){

        history.back();

    }else{

        location.href =
            "events.html";

    }

}


/* =========================
   START
========================= */

initializeForm();

</script>

</body>
</html>
