<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Post | LetsStudy Pro</title>

<meta
  name="description"
  content="Create and publish educational posts on LetsStudy Pro Community."
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

a{
  text-decoration:none;
  color:inherit;
}

.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:20px;
}

.logo-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.top-links{
  display:flex;
  gap:10px;
  align-items:center;
}

.top-links a{
  padding:9px 13px;
  border-radius:9px;
  color:#6b7280;
  font-size:14px;
  font-weight:600;
}

.top-links a:hover{
  background:#eff6ff;
  color:#2563eb;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:30px 18px 60px;
}

.hero{
  background:linear-gradient(
    135deg,
    #1d4ed8,
    #2563eb
  );
  color:#fff;
  padding:30px;
  border-radius:22px;
  margin-bottom:22px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#dbeafe;
  line-height:1.7;
  font-size:14px;
}

.editor{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:24px;
  box-shadow:0 8px 30px rgba(15,23,42,.06);
}

.field{
  margin-bottom:20px;
}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #dfe3e8;
  border-radius:12px;
  outline:none;
  background:#fafafa;
  padding:13px 14px;
  font:inherit;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
  background:#fff;
}

textarea{
  min-height:220px;
  resize:vertical;
  line-height:1.7;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.preview{
  margin-top:10px;
  display:none;
}

.preview img{
  width:100%;
  max-height:320px;
  object-fit:cover;
  border-radius:14px;
}

.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid #e5e7eb;
}

.status{
  font-size:13px;
  color:#6b7280;
}

.buttons{
  display:flex;
  gap:10px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 17px;
  font-weight:800;
  cursor:pointer;
}

.btn-secondary{
  background:#f3f4f6;
  color:#374151;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-primary:hover{
  background:#1d4ed8;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:13px 15px;
  border-radius:11px;
  margin-bottom:18px;
  font-size:13px;
  font-weight:600;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:700px){

  .topbar{
    padding:0 14px;
  }

  .top-links a{
    display:none;
  }

  .page{
    padding:18px 12px 40px;
  }

  .hero{
    padding:23px;
  }

  .hero h1{
    font-size:25px;
  }

  .editor{
    padding:18px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
    align-items:stretch;
  }

  .buttons{
    width:100%;
  }

  .buttons .btn{
    flex:1;
  }

}

</style>
</head>

<body>


<header class="topbar">

  <a
    href="community.html"
    class="logo"
  >

    <span class="logo-icon">
      <i class="fa-solid fa-graduation-cap"></i>
    </span>

    <span>LetsStudy Pro</span>

  </a>


  <nav class="top-links">

    <a href="community.html">
      <i class="fa-solid fa-house"></i>
      Community
    </a>

    <a href="community-members.html">
      <i class="fa-solid fa-users"></i>
      Members
    </a>

    <a href="groups.html">
      <i class="fa-solid fa-user-group"></i>
      Groups
    </a>

  </nav>

</header>



<main class="page">


  <section class="hero">

    <h1>
      Create a Post
    </h1>

    <p>
      Share knowledge, questions, ideas,
      announcements and educational content
      with the LetsStudy Pro community.
    </p>

  </section>



  <section class="editor">

    <div
      id="message"
      class="message"
    ></div>


    <!-- TITLE -->

    <div class="field">

      <label for="title">
        Post Title
      </label>

      <input
        id="title"
        type="text"
        maxlength="180"
        placeholder="Enter your post title..."
      >

    </div>



    <!-- CATEGORY + TYPE -->

    <div class="grid">

      <div class="field">

        <label for="category">
          Category
        </label>

        <select id="category">

          <option value="education">
            Education
          </option>

          <option value="technology">
            Technology
          </option>

          <option value="career">
            Career
          </option>

          <option value="business">
            Business
          </option>

          <option value="study">
            Study
          </option>

          <option value="announcement">
            Announcement
          </option>

          <option value="question">
            Question
          </option>

          <option value="general">
            General
          </option>

        </select>

      </div>


      <div class="field">

        <label for="visibility">
          Visibility
        </label>

        <select id="visibility">

          <option value="public">
            Public
          </option>

          <option value="community">
            Community
          </option>

        </select>

      </div>

    </div>



    <!-- CONTENT -->

    <div class="field">

      <label for="content">
        Content
      </label>

      <textarea
        id="content"
        placeholder="Write your post here..."
      ></textarea>

    </div>



    <!-- IMAGE -->

    <div class="field">

      <label for="postImage">
        Image URL
      </label>

      <input
        id="postImage"
        type="url"
        placeholder="https://example.com/image.jpg"
      >

      <div
        id="imagePreview"
        class="preview"
      >

        <img
          id="previewImage"
          alt="Post preview"
        >

      </div>

    </div>



    <!-- ACTIONS -->

    <div class="actions">

      <div
        id="status"
        class="status"
      >
        Ready to publish
      </div>


      <div class="buttons">

        <button
          type="button"
          class="btn btn-secondary"
          id="cancelBtn"
        >
          Cancel
        </button>


        <button
          type="button"
          class="btn btn-primary"
          id="publishBtn"
        >
          <i class="fa-solid fa-paper-plane"></i>
          Publish Post
        </button>

      </div>

    </div>

  </section>

</main>



<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* ==========================================
   FIREBASE
========================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);



/* ==========================================
   ELEMENTS
========================================== */

const title =
  document.getElementById(
    "title"
  );

const content =
  document.getElementById(
    "content"
  );

const category =
  document.getElementById(
    "category"
  );

const visibility =
  document.getElementById(
    "visibility"
  );

const postImage =
  document.getElementById(
    "postImage"
  );

const publishBtn =
  document.getElementById(
    "publishBtn"
  );

const cancelBtn =
  document.getElementById(
    "cancelBtn"
  );

const message =
  document.getElementById(
    "message"
  );

const status =
  document.getElementById(
    "status"
  );



let currentUser = null;



/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
      user;

    if(!user){

      showMessage(
        "You must login before creating a post.",
        "error"
      );

      publishBtn.disabled =
        true;

    }

  }
);



/* ==========================================
   CLEAN SLUG
========================================== */

function createSlug(
  text
){

  return String(
    text || ""
  )
    .normalize(
      "NFD"
    )
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .toLowerCase()
    .trim()
    .replace(
      /[^a-z0-9]+/g,
      "-"
    )
    .replace(
      /^-+|-+$/g,
      "");

}



/* ==========================================
   SHOW MESSAGE
========================================== */

function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " +
    type;

}



/* ==========================================
   IMAGE PREVIEW
========================================== */

postImage.addEventListener(
  "input",
  () => {

    const url =
      postImage.value.trim();

    const preview =
      document.getElementById(
        "imagePreview"
      );

    const image =
      document.getElementById(
        "previewImage"
      );


    if(!url){

      preview.style.display =
        "none";

      return;

    }


    image.src =
      url;


    image.onload =
      () => {

        preview.style.display =
          "block";

      };


    image.onerror =
      () => {

        preview.style.display =
          "none";

      };

  }
);



/* ==========================================
   PUBLISH
========================================== */

publishBtn.addEventListener(
  "click",
  async () => {

    if(!currentUser){

      showMessage(
        "Please login first.",
        "error"
      );

      return;

    }


    const postTitle =
      title.value.trim();


    const postContent =
      content.value.trim();


    const postCategory =
      category.value;


    const postVisibility =
      visibility.value;


    const imageUrl =
      postImage.value.trim();



    if(!postTitle){

      showMessage(
        "Please enter a post title.",
        "error"
      );

      title.focus();

      return;

    }


    if(!postContent){

      showMessage(
        "Please write some content.",
        "error"
      );

      content.focus();

      return;

    }


    if(
      postTitle.length < 5
    ){

      showMessage(
        "Post title is too short.",
        "error"
      );

      return;

    }



    publishBtn.disabled =
      true;


    status.textContent =
      "Publishing post...";


    try{

      const slug =
        createSlug(
          postTitle
        );


      /*
       * IMPORTANT:
       * The slug is saved here so
       * post-details.html can resolve:
       *
       * /a-level-biology-revision-questions.html
       *
       * using the posts collection.
       */

      const postData = {

        title:
          postTitle,

        slug:
          slug,

        content:
          postContent,

        imageUrl:
          imageUrl,

        category:
          postCategory,

        visibility:
          postVisibility,

        authorId:
          currentUser.uid,

        authorName:
          currentUser.displayName ||
          "LetsStudy Member",

        authorEmail:
          currentUser.email ||
          "",

        authorPhoto:
          currentUser.photoURL ||
          "",

        status:
          "published",

        published:
          true,

        views:
          0,

        likesCount:
          0,

        commentsCount:
          0,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      };


      const postRef =
        await addDoc(
          collection(
            db,
            "posts"
          ),
          postData
        );


      status.textContent =
        "Post published successfully.";


      showMessage(
        "Your post has been published successfully.",
        "success"
      );


      /*
       * Use the generated document ID
       * as fallback navigation.
       */

      setTimeout(
        () => {

          window.location.href =
            "post-details.html?id=" +
            encodeURIComponent(
              postRef.id
            );

        },
        900
      );


    }catch(error){

      console.error(
        "Create post error:",
        error
      );


      publishBtn.disabled =
        false;


      status.textContent =
        "Ready to publish";


      showMessage(
        error.message ||
        "Failed to publish post.",
        "error"
      );

    }

  }
);



/* ==========================================
   CANCEL
========================================== */

cancelBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "community.html";

  }
);

</script>

</body>
</html>
