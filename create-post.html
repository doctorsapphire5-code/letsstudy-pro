<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Post | LetsStudy Pro</title>

<meta name="description"
content="Create and publish a study post on LetsStudy Pro.">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

.navbar{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
}

.nav-container{
  max-width:1100px;
  min-height:68px;
  margin:auto;
  padding:0 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;

  color:#2563eb;
  font-weight:800;
  font-size:18px;
  text-decoration:none;
}

.logo-icon{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:#2563eb;
  color:white;

  font-size:11px;
  font-weight:900;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  text-decoration:none;
  color:#475569;
  font-size:12px;
  font-weight:600;
}

main{
  max-width:850px;
  margin:auto;
  padding:35px 20px 60px;
}

.back{
  display:inline-block;
  margin-bottom:18px;

  color:#2563eb;
  font-size:10px;
  font-weight:800;
  text-decoration:none;
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:25px;
}

.card h1{
  font-size:23px;
  margin-bottom:7px;
}

.subtitle{
  color:#64748b;
  font-size:10px;
  line-height:1.6;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:17px;
}

label{
  display:block;
  margin-bottom:7px;

  color:#334155;
  font-size:10px;
  font-weight:800;
}

input,
select,
textarea{
  width:100%;

  border:1px solid #cbd5e1;
  border-radius:9px;

  padding:12px;

  outline:none;

  background:#fff;

  font-size:11px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

textarea{
  min-height:180px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 18px;

  font-size:10px;
  font-weight:800;

  cursor:pointer;
}

.publish{
  background:#2563eb;
  color:#fff;
}

.cancel{
  background:#f1f5f9;
  color:#475569;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;

  padding:11px;

  border-radius:9px;

  margin-bottom:18px;

  font-size:10px;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.user-info{
  display:none;

  background:#eff6ff;
  color:#1e40af;

  padding:10px;

  border-radius:8px;

  margin-bottom:18px;

  font-size:9px;
}

footer{
  text-align:center;
  padding:30px;

  color:#94a3b8;
  font-size:9px;
}

@media(max-width:650px){

  .nav-links{
    display:none;
  }

  .actions{
    flex-direction:column;
  }

  button{
    width:100%;
  }

}

</style>

</head>


<body>


<header class="navbar">

<div class="nav-container">

<a href="/" class="logo">

<div class="logo-icon">
LS
</div>

LetsStudy Pro

</a>

<nav class="nav-links">

<a href="/">
Home
</a>

<a href="/courses.html">
Courses
</a>

<a href="/resources.html">
Resources
</a>

<a href="/groups.html">
Groups
</a>

<a href="/profile.html">
Profile
</a>

</nav>

</div>

</header>



<main>

<a
href="/groups.html"
class="back">

← Back to Groups

</a>


<div
id="message"
class="message">
</div>


<div
id="userInfo"
class="user-info">
</div>


<section class="card">

<h1>
Create Post
</h1>

<p class="subtitle">
Share knowledge, questions, study tips or educational
content with the LetsStudy Pro community.
</p>


<form id="postForm">


<div class="form-group">

<label for="title">
Post Title
</label>

<input
id="title"
type="text"
maxlength="120"
placeholder="Enter your post title"
required>

</div>


<div class="form-group">

<label for="category">
Category
</label>

<select
id="category"
required>

<option value="">
Select category
</option>

<option value="Physics">
Physics
</option>

<option value="Chemistry">
Chemistry
</option>

<option value="Mathematics">
Mathematics
</option>

<option value="Biology">
Biology
</option>

<option value="ICT">
ICT
</option>

<option value="Business">
Business
</option>

<option value="Scholarships">
Scholarships
</option>

<option value="General">
General
</option>

</select>

</div>


<div class="form-group">

<label for="content">
Post Content
</label>

<textarea
id="content"
maxlength="5000"
placeholder="Write your post here..."
required></textarea>

</div>


<div class="form-group">

<label for="imageUrl">
Image URL (Optional)
</label>

<input
id="imageUrl"
type="url"
placeholder="https://example.com/image.jpg">

</div>


<div class="actions">

<button
type="button"
class="cancel"
id="cancelBtn">

Cancel

</button>


<button
type="submit"
class="publish"
id="publishBtn">

Publish Post

</button>

</div>

</form>

</section>

</main>


<footer>

© 2026 LetsStudy Pro. All rights reserved.

</footer>



<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  push,
  set
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const form =
document.getElementById(
  "postForm"
);

const titleInput =
document.getElementById(
  "title"
);

const categoryInput =
document.getElementById(
  "category"
);

const contentInput =
document.getElementById(
  "content"
);

const imageInput =
document.getElementById(
  "imageUrl"
);

const publishBtn =
document.getElementById(
  "publishBtn"
);

const cancelBtn =
document.getElementById(
  "cancelBtn"
);

const message =
document.getElementById(
  "message"
);

const userInfo =
document.getElementById(
  "userInfo"
);


let currentUser =
null;


/* =========================
   MESSAGE
========================= */

function showMessage(
text,
type
){

  message.textContent =
  text;

  message.className =
  "message " +
  type;

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
    user;


    if(!user){

      window.location.href =
      "/login.html?redirect=create-post.html";

      return;

    }


    userInfo.style.display =
    "block";

    userInfo.textContent =
    "Logged in as: " +
    (
      user.email ||
      "Student"
    );

  }
);


/* =========================
   CREATE POST
========================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(!currentUser){

      showMessage(
        "Please login before creating a post.",
        "error"
      );

      return;

    }


    const title =
    titleInput.value.trim();


    const category =
    categoryInput.value;


    const content =
    contentInput.value.trim();


    const imageUrl =
    imageInput.value.trim();


    if(
      !title ||
      !category ||
      !content
    ){

      showMessage(
        "Please complete all required fields.",
        "error"
      );

      return;

    }


    publishBtn.disabled =
    true;

    publishBtn.textContent =
    "Publishing...";


    try{

      const postRef =
      push(
        ref(
          db,
          "posts"
        )
      );


      await set(
        postRef,
        {

          id:
          postRef.key,

          title:
          title,

          category:
          category,

          content:
          content,

          imageUrl:
          imageUrl || "",

          authorId:
          currentUser.uid,

          authorEmail:
          currentUser.email ||
          "",

          createdAt:
          Date.now(),

          updatedAt:
          Date.now(),

          likes:
          0,

          commentsCount:
          0,

          status:
          "published"

        }
      );


      showMessage(
        "Post published successfully.",
        "success"
      );


      form.reset();


      setTimeout(
        () => {

          window.location.href =
          "/community.html";

        },
        1000
      );


    }catch(error){

      console.error(
        "Create post error:",
        error
      );


      showMessage(
        "Unable to create post. Please try again.",
        "error"
      );

    }


    publishBtn.disabled =
    false;

    publishBtn.textContent =
    "Publish Post";

  }
);


/* =========================
   CANCEL
========================= */

cancelBtn.addEventListener(
  "click",
  () => {

    window.location.href =
    "/groups.html";

  }
);

</script>

</body>

</html>
