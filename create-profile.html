<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Create Profile | LetsStudy Pro</title>

<meta name="description"
content="Complete your LetsStudy Pro profile.">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
background:
radial-gradient(circle at 10% 10%,#dbeafe,transparent 30%),
radial-gradient(circle at 90% 90%,#e0e7ff,transparent 30%),
#f8fafc;
color:#0f172a;
}

a{
text-decoration:none;
}

.page{
min-height:100vh;
display:flex;
flex-direction:column;
}


/* HEADER */

header{
height:70px;
background:rgba(255,255,255,.95);
border-bottom:1px solid #e2e8f0;
display:flex;
align-items:center;
}

.nav{
width:100%;
max-width:1200px;
margin:auto;
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:900;
color:#2563eb;
}

.logo-icon{
width:42px;
height:42px;
display:grid;
place-items:center;
background:#2563eb;
color:white;
border-radius:12px;
}

.logout{
border:1px solid #cbd5e1;
background:white;
color:#334155;
padding:10px 15px;
border-radius:10px;
font-weight:800;
cursor:pointer;
}


/* MAIN */

main{
flex:1;
display:flex;
justify-content:center;
padding:40px 18px;
}

.wrapper{
width:100%;
max-width:600px;
}

.card{
background:white;
border:1px solid #e2e8f0;
border-radius:22px;
padding:34px;
box-shadow:0 25px 60px rgba(15,23,42,.10);
}

.icon{
width:62px;
height:62px;
display:grid;
place-items:center;
margin:0 auto 18px;
background:#eff6ff;
border-radius:18px;
font-size:28px;
}

h1{
text-align:center;
font-size:30px;
margin-bottom:9px;
}

.subtitle{
text-align:center;
color:#64748b;
font-size:14px;
line-height:1.7;
margin-bottom:26px;
}


/* PROGRESS */

.progress{
height:6px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden;
margin-bottom:26px;
}

.progress-bar{
height:100%;
width:100%;
background:#2563eb;
}


/* ALERT */

.alert{
display:none;
padding:13px 14px;
border-radius:10px;
margin-bottom:18px;
font-size:14px;
font-weight:700;
line-height:1.5;
}

.alert.error{
display:block;
background:#fef2f2;
color:#b91c1c;
border:1px solid #fecaca;
}

.alert.success{
display:block;
background:#ecfdf5;
color:#047857;
border:1px solid #a7f3d0;
}

.alert.info{
display:block;
background:#eff6ff;
color:#1d4ed8;
border:1px solid #bfdbfe;
}


/* FORM */

.form-group{
margin-bottom:17px;
}

label{
display:block;
font-size:14px;
font-weight:800;
color:#334155;
margin-bottom:8px;
}

input,
select,
textarea{
width:100%;
border:1px solid #cbd5e1;
border-radius:10px;
outline:none;
font-family:inherit;
font-size:14px;
background:white;
color:#0f172a;
}

input,
select{
height:48px;
padding:0 13px;
}

textarea{
min-height:100px;
padding:13px;
resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.10);
}


/* GRID */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}


/* USER EMAIL */

.account{
padding:13px;
background:#f8fafc;
border:1px solid #e2e8f0;
border-radius:10px;
font-size:13px;
color:#64748b;
margin-bottom:20px;
}

.account strong{
display:block;
color:#0f172a;
margin-top:4px;
word-break:break-word;
}


/* BUTTONS */

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:22px;
}

.btn{
height:49px;
border:0;
border-radius:10px;
font-weight:900;
font-size:14px;
cursor:pointer;
}

.primary{
background:#2563eb;
color:white;
}

.primary:hover{
background:#1d4ed8;
}

.secondary{
background:#f1f5f9;
color:#334155;
}

.secondary:hover{
background:#e2e8f0;
}

.btn:disabled{
opacity:.6;
cursor:not-allowed;
}


/* FOOTER */

footer{
background:#020617;
color:#94a3b8;
}

.footer{
max-width:1200px;
margin:auto;
padding:23px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
font-size:13px;
}

.footer a{
color:#94a3b8;
}

.footer a:hover{
color:white;
}


/* MOBILE */

@media(max-width:600px){

.card{
padding:28px 20px;
}

.grid,
.actions{
grid-template-columns:1fr;
}

h1{
font-size:26px;
}

.footer{
flex-direction:column;
text-align:center;
}

}

</style>

</head>

<body>

<div class="page">


<!-- HEADER -->

<header>

<nav class="nav">

<a href="index.html" class="logo">

<span class="logo-icon">
L
</span>

LetsStudy Pro

</a>

<button
id="logoutBtn"
class="logout">

Logout

</button>

</nav>

</header>


<!-- MAIN -->

<main>

<section class="wrapper">

<div class="card">

<div class="icon">
👤
</div>

<h1>
Complete Your Profile
</h1>

<p class="subtitle">

Tell us a little about yourself so we can
personalize your LetsStudy Pro experience.

</p>


<div class="progress">
<div class="progress-bar"></div>
</div>


<div
id="alert"
class="alert">
</div>


<div
id="accountBox"
class="account"
style="display:none">

Logged in as:

<strong id="userEmail"></strong>

</div>


<form id="profileForm">


<!-- FULL NAME -->

<div class="form-group">

<label for="fullName">
Full Name
</label>

<input
id="fullName"
type="text"
placeholder="Enter your full name"
maxlength="100"
required>

</div>


<!-- GRID -->

<div class="grid">


<!-- COUNTRY -->

<div class="form-group">

<label for="country">
Country
</label>

<select id="country" required>

<option value="">
Select country
</option>

<option>Tanzania</option>
<option>Kenya</option>
<option>Uganda</option>
<option>Rwanda</option>
<option>Burundi</option>
<option>Nigeria</option>
<option>Ghana</option>
<option>South Africa</option>
<option>United States</option>
<option>United Kingdom</option>
<option>Canada</option>
<option>India</option>
<option>Other</option>

</select>

</div>


<!-- EDUCATION -->

<div class="form-group">

<label for="education">
Education Level
</label>

<select id="education" required>

<option value="">
Select level
</option>

<option>Primary</option>
<option>Secondary</option>
<option>High School</option>
<option>College</option>
<option>University</option>
<option>Graduate</option>
<option>Professional</option>
<option>Other</option>

</select>

</div>

</div>


<!-- INTEREST -->

<div class="form-group">

<label for="interest">
Main Interest
</label>

<select id="interest" required>

<option value="">
Choose your interest
</option>

<option>Technology</option>
<option>Business</option>
<option>Science</option>
<option>Mathematics</option>
<option>Education</option>
<option>Health</option>
<option>Engineering</option>
<option>Arts & Design</option>
<option>Marketing</option>
<option>Career Development</option>
<option>Other</option>

</select>

</div>


<!-- BIO -->

<div class="form-group">

<label for="bio">
About You
<span style="font-weight:400;color:#94a3b8">
(optional)
</span>
</label>

<textarea
id="bio"
maxlength="500"
placeholder="Tell us about yourself, your goals or what you want to learn..."></textarea>

</div>


<!-- ACTIONS -->

<div class="actions">

<button
type="button"
id="profileBtn"
class="btn secondary">

View Profile

</button>

<button
type="submit"
id="saveBtn"
class="btn primary">

Save & Continue

</button>

</div>


</form>

</div>

</section>

</main>


<!-- FOOTER -->

<footer>

<div class="footer">

<div>
© <span id="year"></span> LetsStudy Pro
</div>

<div>

<a href="dashboard.html">
Dashboard
</a>

&nbsp; • &nbsp;

<a href="profile.html">
Profile
</a>

</div>

</div>

</footer>


<!-- FIREBASE -->

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getDatabase,
ref,
get,
set,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =====================================================
FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAXKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* =====================================================
ELEMENTS
===================================================== */

const form =
document.getElementById("profileForm");

const fullName =
document.getElementById("fullName");

const country =
document.getElementById("country");

const education =
document.getElementById("education");

const interest =
document.getElementById("interest");

const bio =
document.getElementById("bio");

const alertBox =
document.getElementById("alert");

const saveBtn =
document.getElementById("saveBtn");

const profileBtn =
document.getElementById("profileBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const accountBox =
document.getElementById("accountBox");

const userEmail =
document.getElementById("userEmail");


let currentUser =
null;


/* =====================================================
ALERT
===================================================== */

function showAlert(
message,
type="error"
){

alertBox.textContent =
message;

alertBox.className =
"alert " + type;

}


/* =====================================================
AUTH CHECK
===================================================== */

onAuthStateChanged(
auth,
async user=>{

if(!user){

window.location.href =
"login.html?redirect=create-profile.html";

return;

}


currentUser =
user;


/* SECURITY */

await user.reload();

currentUser =
auth.currentUser;


/*
If email verification is required,
do not allow profile completion before verification.
*/

if(
!currentUser.emailVerified
){

window.location.href =
"email-verification.html?redirect=create-profile.html";

return;

}


/* SHOW EMAIL */

accountBox.style.display =
"block";

userEmail.textContent =
currentUser.email;


/* LOAD EXISTING PROFILE */

await loadProfile();

});


/* =====================================================
LOAD PROFILE
===================================================== */

async function loadProfile(){

if(!currentUser)
return;


try{

const snapshot =
await get(
ref(
db,
"users/" + currentUser.uid
)
);


if(
snapshot.exists()
){

const data =
snapshot.val();


if(data.name)
fullName.value =
data.name;

else if(
currentUser.displayName
)
fullName.value =
currentUser.displayName;


if(data.country)
country.value =
data.country;

if(data.education)
education.value =
data.education;

if(data.interest)
interest.value =
data.interest;

if(data.bio)
bio.value =
data.bio;

}


}catch(error){

console.error(
"Profile loading error:",
error
);

showAlert(
"Unable to load your existing profile.",
"error"
);

}

}


/* =====================================================
SAVE PROFILE
===================================================== */

form.addEventListener(
"submit",
async event=>{

event.preventDefault();


if(!currentUser){

showAlert(
"Please login first."
);

return;

}


const name =
fullName.value.trim();

const selectedCountry =
country.value;

const selectedEducation =
education.value;

const selectedInterest =
interest.value;

const about =
bio.value.trim();


/* VALIDATION */

if(name.length < 2){

showAlert(
"Please enter your full name."
);

fullName.focus();

return;

}


if(!selectedCountry){

showAlert(
"Please select your country."
);

country.focus();

return;

}


if(!selectedEducation){

showAlert(
"Please select your education level."
);

education.focus();

return;

}


if(!selectedInterest){

showAlert(
"Please select your main interest."
);

interest.focus();

return;

}


/* LOADING */

saveBtn.disabled =
true;

saveBtn.textContent =
"Saving...";


try{


const userRef =
ref(
db,
"users/" + currentUser.uid
);


/* GET EXISTING DATA */

const snapshot =
await get(userRef);

const oldData =
snapshot.exists()
?
snapshot.val()
:
{};


/* SAVE PROFILE */

await set(
userRef,
{

...oldData,

uid:
currentUser.uid,

email:
currentUser.email,

name:
name,

displayName:
name,

country:
selectedCountry,

education:
selectedEducation,

interest:
selectedInterest,

bio:
about,

role:
oldData.role ||
"student",

status:
oldData.status ||
"active",

profileCompleted:
true,

emailVerified:
currentUser.emailVerified,

updatedAt:
serverTimestamp(),

createdAt:
oldData.createdAt ||
serverTimestamp()

}
);


/* SUCCESS */

showAlert(
"Profile saved successfully.",
"success"
);


setTimeout(
()=>{

window.location.href =
"dashboard.html";

},
700
);


}catch(error){

console.error(
"Profile save error:",
error
);

showAlert(
"Unable to save your profile. Please try again."
);

saveBtn.disabled =
false;

saveBtn.textContent =
"Save & Continue";

}

});


/* =====================================================
VIEW PROFILE
===================================================== */

profileBtn.addEventListener(
"click",
()=>{

window.location.href =
"profile.html";

});


/* =====================================================
LOGOUT
===================================================== */

logoutBtn.addEventListener(
"click",
async ()=>{

try{

await signOut(auth);

window.location.href =
"login.html";

}catch(error){

console.error(error);

showAlert(
"Unable to logout. Please try again."
);

}

});


/* =====================================================
YEAR
===================================================== */

document.getElementById("year")
.textContent =
new Date().getFullYear();

</script>

</div>

</body>
</html>
