<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Create Profile | LetsStudy Pro</title>

<meta
  name="description"
  content="Create your LetsStudy Pro student profile."
>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Inter,
    Arial,
    sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,
input,
textarea,
select{
  font:inherit;
}

.header{
  height:70px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  padding:0 20px;
}

.header-inner{
  width:100%;
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:900;
}

.logo-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#1769ff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back-btn{
  border:0;
  background:#f3f5f9;
  padding:10px 14px;
  border-radius:10px;
  color:#475467;
  cursor:pointer;
}

.page{
  padding:30px 15px 60px;
}

.card{
  width:100%;
  max-width:700px;
  margin:auto;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:22px;
  padding:30px;
  box-shadow:
    0 12px 40px
    rgba(15,23,42,.06);
}

.heading{
  text-align:center;
  margin-bottom:25px;
}

.heading h1{
  margin:0 0 8px;
  font-size:27px;
}

.heading p{
  margin:0;
  color:#667085;
  font-size:14px;
}

.avatar-section{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:28px;
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#eef4ff;
  color:#1769ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:900;
  overflow:hidden;
  border:4px solid #fff;
  box-shadow:
    0 4px 20px
    rgba(0,0,0,.1);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar-label{
  margin-top:10px;
  color:#1769ff;
  font-size:13px;
  font-weight:700;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  font-weight:800;
  color:#344054;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #d9dee8;
  border-radius:11px;
  outline:none;
  background:#fff;
  color:#172033;
  padding:12px 13px;
}

input,
select{
  height:46px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#1769ff;
  box-shadow:
    0 0 0 3px
    rgba(23,105,255,.08);
}

.email-box{
  background:#f8fafc;
  color:#667085;
}

.hint{
  color:#98a2b3;
  font-size:11px;
}

.save-btn{
  width:100%;
  height:50px;
  margin-top:25px;
  border:0;
  border-radius:12px;
  background:#1769ff;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.save-btn:hover{
  background:#0959e8;
}

.save-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.alert{
  display:none;
  margin-bottom:18px;
  padding:12px 14px;
  border-radius:10px;
  font-size:13px;
}

.alert.show{
  display:block;
}

.alert.error{
  background:#fff1f2;
  color:#be123c;
}

.alert.success{
  background:#ecfdf3;
  color:#027a48;
}

.loading{
  display:inline-flex;
  align-items:center;
  gap:8px;
}

.spinner{
  width:18px;
  height:18px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.security-note{
  margin-top:20px;
  padding:14px;
  border-radius:12px;
  background:#f8fafc;
  color:#667085;
  font-size:12px;
  line-height:1.6;
  text-align:center;
}

@media(max-width:650px){

  .card{
    padding:22px 17px;
    border-radius:17px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .heading h1{
    font-size:23px;
  }

}

</style>

</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="header-inner">

    <div class="logo">

      <span class="logo-icon">
        📚
      </span>

      <span>
        LetsStudy Pro
      </span>

    </div>

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >
      ← Back
    </button>

  </div>

</header>


<!-- =====================================================
     PAGE
===================================================== -->

<main class="page">

  <section class="card">


    <div class="heading">

      <h1>
        Create Your Profile
      </h1>

      <p>
        Complete your profile to get the
        best LetsStudy Pro experience.
      </p>

    </div>


    <div
      class="alert"
      id="alertBox"
    ></div>


    <!-- =================================================
         AVATAR
    ================================================== -->

    <div class="avatar-section">

      <div
        class="avatar"
        id="avatarPreview"
      >
        👤
      </div>

      <div class="avatar-label">
        Profile photo
      </div>

    </div>


    <!-- =================================================
         FORM
    ================================================== -->

    <form
      id="profileForm"
    >

      <div class="form-grid">


        <!-- FULL NAME -->

        <div class="form-group">

          <label for="fullName">
            Full Name *
          </label>

          <input
            id="fullName"
            type="text"
            placeholder="Enter your full name"
            maxlength="80"
            required
          >

        </div>


        <!-- USERNAME -->

        <div class="form-group">

          <label for="username">
            Username *
          </label>

          <input
            id="username"
            type="text"
            placeholder="@username"
            maxlength="30"
            required
          >

          <span class="hint">
            Letters, numbers and underscore only.
          </span>

        </div>


        <!-- EMAIL -->

        <div class="form-group full">

          <label for="email">
            Email Address
          </label>

          <input
            id="email"
            class="email-box"
            type="email"
            readonly
          >

        </div>


        <!-- PHONE -->

        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>

          <input
            id="phone"
            type="tel"
            placeholder="+255 7XX XXX XXX"
            maxlength="20"
          >

        </div>


        <!-- EDUCATION -->

        <div class="form-group">

          <label for="educationLevel">
            Education Level
          </label>

          <select
            id="educationLevel"
          >

            <option value="">
              Select level
            </option>

            <option value="O-Level">
              O-Level
            </option>

            <option value="A-Level">
              A-Level
            </option>

            <option value="University">
              University
            </option>

            <option value="College">
              College
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <!-- FORM / CLASS -->

        <div class="form-group">

          <label for="classLevel">
            Form / Class
          </label>

          <select
            id="classLevel"
          >

            <option value="">
              Select class
            </option>

            <option value="Form 1">
              Form 1
            </option>

            <option value="Form 2">
              Form 2
            </option>

            <option value="Form 3">
              Form 3
            </option>

            <option value="Form 4">
              Form 4
            </option>

            <option value="Form 5">
              Form 5
            </option>

            <option value="Form 6">
              Form 6
            </option>

            <option value="University">
              University
            </option>

          </select>

        </div>


        <!-- LOCATION -->

        <div class="form-group">

          <label for="location">
            Location
          </label>

          <input
            id="location"
            type="text"
            placeholder="e.g. Dar es Salaam"
            maxlength="80"
          >

        </div>


        <!-- BIO -->

        <div class="form-group full">

          <label for="bio">
            About Me
          </label>

          <textarea
            id="bio"
            maxlength="300"
            placeholder="Tell the community something about yourself..."
          ></textarea>

        </div>


      </div>


      <!-- SAVE -->

      <button
        class="save-btn"
        id="saveBtn"
        type="submit"
      >
        <span id="saveText">
          Create Profile
        </span>

        <span
          class="loading"
          id="saveLoading"
          style="display:none"
        >

          <span class="spinner"></span>

          Saving...

        </span>

      </button>


    </form>


    <!-- SECURITY -->

    <div class="security-note">

      🔒
      Your profile information is securely
      stored with Firebase and is only used
      to provide your LetsStudy Pro experience.

    </div>


  </section>

</main>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-M7Z6SPNH1N"

};


/* =====================================================
   INIT
===================================================== */

const app =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(
    app
  );

const db =
  getFirestore(
    app
  );


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "profileForm"
  );

const fullName =
  document.getElementById(
    "fullName"
  );

const username =
  document.getElementById(
    "username"
  );

const email =
  document.getElementById(
    "email"
  );

const phone =
  document.getElementById(
    "phone"
  );

const educationLevel =
  document.getElementById(
    "educationLevel"
  );

const classLevel =
  document.getElementById(
    "classLevel"
  );

const locationInput =
  document.getElementById(
    "location"
  );

const bio =
  document.getElementById(
    "bio"
  );

const avatarPreview =
  document.getElementById(
    "avatarPreview"
  );

const alertBox =
  document.getElementById(
    "alertBox"
  );

const saveBtn =
  document.getElementById(
    "saveBtn"
  );

const saveText =
  document.getElementById(
    "saveText"
  );

const saveLoading =
  document.getElementById(
    "saveLoading"
  );


let currentUser =
  null;


/* =====================================================
   AUTH CHECK
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
        "login.html?redirect=create-profile.html";

      return;

    }


    currentUser =
      user;


    email.value =
      user.email ||
      "";


    /* Google / existing photo */

    if(user.photoURL){

      avatarPreview.innerHTML = `

        <img
          src="${escapeHtml(
            user.photoURL
          )}"
          alt="Profile"
        >

      `;

    }else{

      avatarPreview.textContent =
        getInitials(
          user.displayName ||
          user.email ||
          "U"
        );

    }


    /* Load existing profile */

    await loadProfile();

  }
);


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

  if(!currentUser){

    return;

  }


  try{

    const profileRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const profileSnap =
      await getDoc(
        profileRef
      );


    if(
      !profileSnap.exists()
    ){

      if(
        currentUser.displayName
      ){

        fullName.value =
          currentUser.displayName;

      }

      return;

    }


    const data =
      profileSnap.data();


    fullName.value =
      data.displayName ||
      currentUser.displayName ||
      "";


    username.value =
      data.username ||
      "";


    phone.value =
      data.phone ||
      "";


    educationLevel.value =
      data.educationLevel ||
      "";


    classLevel.value =
      data.classLevel ||
      "";


    locationInput.value =
      data.location ||
      "";


    bio.value =
      data.bio ||
      "";


    if(
      data.photoURL ||
      currentUser.photoURL
    ){

      avatarPreview.innerHTML = `

        <img
          src="${escapeHtml(
            data.photoURL ||
            currentUser.photoURL
          )}"
          alt="Profile"
        >

      `;

    }

  }catch(error){

    console.error(
      "Profile load error:",
      error
    );

  }

}


/* =====================================================
   USERNAME VALIDATION
===================================================== */

username.addEventListener(
  "input",
  () => {

    username.value =
      username.value
        .toLowerCase()
        .replace(
          /[^a-z0-9_]/g,
          ""
        );

  }
);


/* =====================================================
   SAVE PROFILE
===================================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(!currentUser){

      showAlert(
        "Please login first.",
        "error"
      );

      return;

    }


    const name =
      fullName.value.trim();


    const user =
      username.value.trim();


    if(
      name.length <
      2
    ){

      showAlert(
        "Please enter your full name.",
        "error"
      );

      fullName.focus();

      return;

    }


    if(
      !/^[a-z0-9_]{3,30}$/
        .test(user)
    ){

      showAlert(
        "Username must contain 3–30 lowercase letters, numbers or underscore.",
        "error"
      );

      username.focus();

      return;

    }


    setSaving(
      true
    );


    try{

      const profileData = {

        uid:
          currentUser.uid,

        displayName:
          name,

        username:
          user,

        email:
          currentUser.email ||
          "",

        phone:
          phone.value.trim(),

        educationLevel:
          educationLevel.value,

        classLevel:
          classLevel.value,

        location:
          locationInput.value.trim(),

        bio:
          bio.value.trim(),

        photoURL:
          currentUser.photoURL ||
          "",

        role:
          "student",

        online:
          true,

        updatedAt:
          serverTimestamp(),

        profileCompleted:
          true

      };


      const profileRef =
        doc(
          db,
          "users",
          currentUser.uid
        );


      await setDoc(
        profileRef,
        profileData,
        {
          merge:true
        }
      );


      showAlert(
        "Profile created successfully!",
        "success"
      );


      setTimeout(
        () => {

          const params =
            new URLSearchParams(
              window.location.search
            );


          const redirect =
            params.get(
              "redirect"
            );


          window.location.href =
            redirect ||
            "community.html";

        },
        900
      );


    }catch(error){

      console.error(
        "Create profile error:",
        error
      );


      showAlert(
        getFirebaseError(
          error
        ),
        "error"
      );

    }finally{

      setSaving(
        false
      );

    }

  }
);


/* =====================================================
   ALERT
===================================================== */

function showAlert(
  message,
  type
){

  alertBox.textContent =
    message;

  alertBox.className =
    `alert show ${type}`;

}


/* =====================================================
   SAVING STATE
===================================================== */

function setSaving(
  saving
){

  saveBtn.disabled =
    saving;


  saveText.style.display =
    saving
      ? "none"
      : "inline";


  saveLoading.style.display =
    saving
      ? "inline-flex"
      : "none";

}


/* =====================================================
   FIREBASE ERRORS
===================================================== */

function getFirebaseError(
  error
){

  const code =
    error?.code ||
    "";


  if(
    code ===
    "permission-denied"
  ){

    return
      "Permission denied. Check your Firestore security rules.";

  }


  if(
    code ===
    "unavailable"
  ){

    return
      "Network unavailable. Please try again.";

  }


  return
    "Unable to save your profile. Please try again.";

}


/* =====================================================
   INITIALS
===================================================== */

function getInitials(
  name
){

  return String(
    name || "U"
  )
    .trim()
    .split(
      /\s+/
    )
    .slice(
      0,
      2
    )
    .map(
      word =>
        word
          .charAt(0)
          .toUpperCase()
    )
    .join("");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   BACK
===================================================== */

document
  .getElementById(
    "backBtn"
  )
  .addEventListener(
    "click",
    () => {

      if(
        document.referrer
      ){

        history.back();

      }else{

        window.location.href =
          "dashboard.html";

      }

    }
  );

</script>

</body>

</html>
