<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Profile | LetsStudy Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #2563eb;
      font-size: 28px;
    }

    .logo p {
      color: #6b7280;
      margin-top: 5px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #111827;
    }

    .profile-preview {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      background: #e5e7eb;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      overflow: hidden;
    }

    .profile-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #9ca3af;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>LetsStudy Pro</h1>
      <p>Complete Your Profile</p>
    </div>

    <h2>Create Profile</h2>

    <div id="message" class="message"></div>

    <div class="profile-preview" id="preview">
      👤
    </div>

    <form id="profileForm">

      <div class="form-group">
        <label for="fullName">Full Name</label>

        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          placeholder="Enter username"
          required
        >
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>

        <input
          type="tel"
          id="phone"
          placeholder="+255..."
        >
      </div>

      <div class="form-group">
        <label for="country">Country</label>

        <select id="country">
          <option value="">Select country</option>
          <option value="Tanzania">Tanzania</option>
          <option value="Kenya">Kenya</option>
          <option value="Uganda">Uganda</option>
          <option value="Rwanda">Rwanda</option>
          <option value="Burundi">Burundi</option>
          <option value="Nigeria">Nigeria</option>
          <option value="Ghana">Ghana</option>
          <option value="South Africa">South Africa</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="education">Education Level</label>

        <select id="education">
          <option value="">Select education level</option>
          <option value="Primary">Primary</option>
          <option value="Secondary">Secondary</option>
          <option value="A-Level">A-Level</option>
          <option value="College">College</option>
          <option value="University">University</option>
          <option value="Professional">Professional</option>
        </select>
      </div>

      <div class="form-group">
        <label for="bio">About You</label>

        <textarea
          id="bio"
          placeholder="Tell us something about yourself..."
        ></textarea>
      </div>

      <button type="submit" id="saveBtn">
        Save Profile
      </button>

    </form>

    <div class="footer">
      © 2026 LetsStudy Pro
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* ============================================
       FIREBASE CONFIG
    ============================================ */

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    let currentUser = null;


    /* ============================================
       MESSAGE
    ============================================ */

    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";
    }


    /* ============================================
       CHECK LOGIN
    ============================================ */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href = "login.html";

        return;
      }

      currentUser = user;


      /* Load existing profile */

      try {

        const userRef =
          doc(db, "users", user.uid);

        const snap =
          await getDoc(userRef);


        if (snap.exists()) {

          const data = snap.data();


          document.getElementById("fullName").value =
            data.fullName || "";

          document.getElementById("username").value =
            data.username || "";

          document.getElementById("phone").value =
            data.phone || "";

          document.getElementById("country").value =
            data.country || "";

          document.getElementById("education").value =
            data.education || "";

          document.getElementById("bio").value =
            data.bio || "";

        }

      } catch (error) {

        console.error(error);

      }

    });


    /* ============================================
       SAVE PROFILE
    ============================================ */

    document
      .getElementById("profileForm")
      .addEventListener("submit", async (event) => {

        event.preventDefault();


        if (!currentUser) {

          showMessage(
            "Please login first.",
            "error"
          );

          return;
        }


        const saveBtn =
          document.getElementById("saveBtn");


        saveBtn.disabled = true;

        saveBtn.textContent =
          "Saving...";


        try {

          const userRef =
            doc(
              db,
              "users",
              currentUser.uid
            );


          /* Get existing role */

          const existing =
            await getDoc(userRef);


          let role = "student";


          if (existing.exists()) {

            role =
              existing.data().role || "student";

          }


          await setDoc(
            userRef,
            {

              uid: currentUser.uid,

              email:
                currentUser.email || "",

              fullName:
                document
                  .getElementById("fullName")
                  .value
                  .trim(),

              username:
                document
                  .getElementById("username")
                  .value
                  .trim(),

              phone:
                document
                  .getElementById("phone")
                  .value
                  .trim(),

              country:
                document
                  .getElementById("country")
                  .value,

              education:
                document
                  .getElementById("education")
                  .value,

              bio:
                document
                  .getElementById("bio")
                  .value
                  .trim(),

              role: role,

              profileCompleted: true,

              updatedAt: new Date()

            },

            {
              merge: true
            }

          );


          showMessage(
            "Profile saved successfully!",
            "success"
          );


          setTimeout(() => {

            window.location.href =
              "dashboard.html";

          }, 1000);


        } catch (error) {

          console.error(error);

          showMessage(
            "Failed to save profile. Please try again.",
            "error"
          );


          saveBtn.disabled = false;

          saveBtn.textContent =
            "Save Profile";

        }

      });

  </script>

</body>
</html>
