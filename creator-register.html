<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Become a Creator - LetsStudy Pro</title>
<meta name="description" content="Join LetsStudy Pro as a creator and share your skills, knowledge, services and digital content.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://letsstudy.pro/creator-register.html">
<link rel="icon" href="favicon.ico">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#0b1220;
  color:white;
  padding:18px;
}

.nav{
  max-width:1000px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.nav a{
  color:white;
  text-decoration:none;
  margin-left:15px;
  font-size:14px;
}

main{
  max-width:800px;
  margin:35px auto;
  padding:0 18px;
}

.card{
  background:white;
  padding:28px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

h1{
  margin-top:0;
  font-size:32px;
}

.intro{
  color:#667085;
}

label{
  display:block;
  margin:17px 0 7px;
  font-weight:700;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #d7dce5;
  border-radius:10px;
  font:inherit;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#315bb5;
}

button{
  width:100%;
  border:0;
  background:#111827;
  color:white;
  padding:14px;
  border-radius:10px;
  margin-top:22px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:18px;
  padding:13px;
  border-radius:9px;
  font-size:14px;
}

.success{
  display:block;
  background:#ecfdf3;
  color:#087443;
}

.error{
  display:block;
  background:#fff1f2;
  color:#b42318;
}

.links{
  margin-top:20px;
  text-align:center;
}

.links a{
  color:#315bb5;
  text-decoration:none;
  margin:0 7px;
}

footer{
  text-align:center;
  padding:30px 18px;
  color:#667085;
  font-size:13px;
}

@media(max-width:600px){
  h1{font-size:27px}
  .nav a{display:none}
  .card{padding:21px}
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">LetsStudy Pro</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="creator-hub.html">Creators</a>
      <a href="freelancers.html">Freelancers</a>
      <a href="marketplace.html">Marketplace</a>
    </nav>
  </div>
</header>

<main>

<div class="card">

  <h1>Become a Creator</h1>

  <p class="intro">
    Join the LetsStudy Pro creator ecosystem. Share your knowledge,
    skills, services and digital content with a growing global audience.
  </p>

  <form id="creatorForm">

    <label for="name">Full Name / Creator Name</label>

    <input
      id="name"
      type="text"
      placeholder="Your name or creator name"
      required
    >

    <label for="role">Creator Role</label>

    <input
      id="role"
      type="text"
      placeholder="e.g. Graphic Designer, Tutor, Developer"
      required
    >

    <label for="category">Category</label>

    <select id="category" required>

      <option value="">Select category</option>

      <option>Education</option>
      <option>Technology</option>
      <option>Programming</option>
      <option>Graphic Design</option>
      <option>Video Editing</option>
      <option>Digital Marketing</option>
      <option>Writing</option>
      <option>Business</option>
      <option>Career</option>
      <option>Finance</option>
      <option>Photography</option>
      <option>Music</option>
      <option>Content Creation</option>
      <option>Other</option>

    </select>

    <label for="skills">Skills</label>

    <input
      id="skills"
      type="text"
      placeholder="e.g. Canva, Photoshop, HTML, SEO"
      required
    >

    <label for="location">Location</label>

    <input
      id="location"
      type="text"
      placeholder="City, Country"
    >

    <label for="bio">About You</label>

    <textarea
      id="bio"
      placeholder="Tell people about your skills, experience and what you create..."
      required
    ></textarea>

    <label for="image">Profile Image URL</label>

    <input
      id="image"
      type="url"
      placeholder="https://example.com/profile.jpg"
    >

    <label for="website">Website / Portfolio</label>

    <input
      id="website"
      type="url"
      placeholder="https://yourwebsite.com"
    >

    <label for="email">Contact Email</label>

    <input
      id="email"
      type="email"
      placeholder="you@example.com"
      required
    >

    <button id="submitBtn" type="submit">
      Register as Creator
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="links">
    <a href="creator-hub.html">Creator Hub</a>
    <a href="freelancers.html">Find Freelancers</a>
    <a href="marketplace.html">Marketplace</a>
  </div>

</div>

</main>

<footer>
  © <span id="year"></span> LetsStudy Pro. All rights reserved.
</footer>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form =
  document.getElementById("creatorForm");

const button =
  document.getElementById("submitBtn");

const message =
  document.getElementById("message");


form.addEventListener("submit", async e=>{

  e.preventDefault();

  button.disabled = true;
  button.textContent = "Submitting...";

  message.className = "message";
  message.textContent = "";


  const name =
    document.getElementById("name").value.trim();

  const role =
    document.getElementById("role").value.trim();

  const category =
    document.getElementById("category").value;

  const skills =
    document.getElementById("skills").value
      .split(",")
      .map(x=>x.trim())
      .filter(Boolean);

  const location =
    document.getElementById("location").value.trim();

  const bio =
    document.getElementById("bio").value.trim();

  const image =
    document.getElementById("image").value.trim();

  const website =
    document.getElementById("website").value.trim();

  const email =
    document.getElementById("email").value.trim();


  try{

    await addDoc(
      collection(db,"creators"),
      {

        name:name,

        creatorName:name,

        role:role,

        category:category,

        skills:skills,

        location:location,

        bio:bio,

        description:bio,

        image:image,

        profileImage:image,

        website:website,

        email:email,

        status:"pending",

        published:false,

        createdAt:serverTimestamp(),

        updatedAt:serverTimestamp()

      }
    );


    message.className =
      "message success";

    message.innerHTML =
      "Creator registration submitted successfully. " +
      "Your profile can be reviewed before being published.";


    form.reset();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


  }catch(error){

    console.error(error);

    message.className =
      "message error";

    message.textContent =
      "Registration failed. Please try again.";

  }


  button.disabled = false;
  button.textContent = "Register as Creator";

});


document.getElementById("year").textContent =
  new Date().getFullYear();

</script>

</body>
</html>
