/* ======================================
   ESCAPE HTML
====================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

/* ======================================
   RENDER TEMPLATES
====================================== */

function renderTemplates(){

  const search =
    searchInput
      .value
      .trim()
      .toLowerCase();


  const category =
    categoryFilter.value;


  const filtered =
    templates.filter(
      template => {

        const searchable =
          [
            template.name,
            template.category,
            template.description,
            ...template.tags
          ]
          .join(" ")
          .toLowerCase();


                const matchesSearch =
          !search ||
          searchable.includes(search);


        const matchesCategory =
          category === "all" ||
          template.category === category;


        return (
          matchesSearch &&
          matchesCategory
        );

      }
    );


  if(!filtered.length){

    templateGrid.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-file-circle-xmark"></i>

        <h3>
          No CV templates found
        </h3>

        <p>
          Try another search term or category.
        </p>

      </div>

    `;

    return;

  }


  templateGrid.innerHTML =
    filtered.map(
      template => `

        <article
          class="template-card"
          data-template-id="${escapeHTML(template.id)}"
        >

          <div class="template-preview">

            ${previewHTML(template)}

          </div>


          <div class="template-content">

            <h2>
              ${escapeHTML(template.name)}
            </h2>

            <p>
              ${escapeHTML(template.description)}
            </p>


            <div class="tags">

              ${template.tags
                .map(
                  tag => `
                    <span class="tag">
                      ${escapeHTML(tag)}
                    </span>
                  `
                )
                .join("")}

            </div>


            <div class="template-actions">

              <button
                type="button"
                class="btn btn-secondary"
                data-preview="${escapeHTML(template.id)}"
              >
                <i class="fa-solid fa-eye"></i>
                Preview
              </button>


              <button
                type="button"
                class="btn btn-primary"
                data-use="${escapeHTML(template.id)}"
              >
                <i class="fa-solid fa-pen-to-square"></i>
                Use Template
              </button>

            </div>

          </div>

        </article>

      `
    )
    .join("");


  bindTemplateButtons();

}


/* ======================================
   TEMPLATE BUTTONS
====================================== */

function bindTemplateButtons(){

  document
    .querySelectorAll(
      "[data-preview]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function(){

            const template =
              templates.find(
                item =>
                  item.id ===
                  this.dataset.preview
              );


            if(template){

              openPreview(
                template
              );

            }

          }
        );

      }
    );


  document
    .querySelectorAll(
      "[data-use]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function(){

            const template =
              templates.find(
                item =>
                  item.id ===
                  this.dataset.use
              );


            if(template){

              useTemplate(
                template
              );

            }

          }
        );

      }
    );

}


/* ======================================
   OPEN PREVIEW
====================================== */

function openPreview(template){

  selectedTemplate =
    template;


  modalTitle.textContent =
    template.name;


  modalPreview.innerHTML =
    previewHTML(template);


  previewModal
    .classList
    .add("open");


  document.body.style.overflow =
    "hidden";

}


/* ======================================
   CLOSE PREVIEW
====================================== */

function closeModal(){

  previewModal
    .classList
    .remove("open");


  document.body.style.overflow =
    "";


  selectedTemplate =
    null;

}


document
  .querySelector(
    "#closeModal"
  )
  .addEventListener(
    "click",
    closeModal
  );


previewModal
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        previewModal
      ){

        closeModal();

      }

    }
  );


document
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Escape" &&
        previewModal.classList.contains("open")
      ){

        closeModal();

      }

    }
  );


/* ======================================
   USE TEMPLATE
====================================== */

function useTemplate(template){

  try{

    localStorage.setItem(
      "selectedCVTemplate",
      JSON.stringify({

        id:template.id,

        name:template.name,

        category:template.category

      })
    );

  }
  catch(error){

    console.error(
      "Template could not be saved:",
      error
    );

  }


  window.location.href =
    "cv-builder.html";

}


document
  .querySelector(
    "#useTemplateBtn"
  )
  .addEventListener(
    "click",
    function(){

      if(selectedTemplate){

        useTemplate(
          selectedTemplate
        );

      }

    }
  );


/* ======================================
   PRINT TEMPLATE
====================================== */

document
  .querySelector(
    "#printTemplateBtn"
  )
  .addEventListener(
    "click",
    function(){

      if(!selectedTemplate){

        return;

      }


      const printWindow =
        window.open(
          "",
          "_blank",
          "width=900,height=1000"
        );


      if(!printWindow){

        alert(
          "Please allow pop-ups to print the CV template."
        );

        return;

      }


      printWindow.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

          <title>
            ${escapeHTML(
              selectedTemplate.name
            )}
          </title>

          <style>

            *{
              box-sizing:border-box;
            }

            body{
              margin:0;
              padding:30px;
              background:#fff;
              font-family:Arial,sans-serif;
            }

            .paper{
              max-width:800px;
              min-height:1000px;
              margin:auto;
              background:#fff;
              padding:35px;
              color:#172033;
              box-shadow:0 0 10px rgba(0,0,0,.08);
            }

            .paper h2{
              font-size:28px;
              margin-bottom:8px;
            }

            .paper h3{
              margin-top:25px;
              margin-bottom:10px;
              border-bottom:1px solid #ccc;
              padding-bottom:5px;
            }

            .line{
              height:7px;
              background:#e5e7eb;
              margin:7px 0;
              border-radius:4px;
            }

            .short{
              width:60%;
            }

            .medium{
              width:80%;
            }

            .long{
              width:95%;
            }

            @media print{

              body{
                padding:0;
              }

              .paper{
                box-shadow:none;
              }

            }

          </style>

        </head>

        <body>

          ${previewHTML(
            selectedTemplate
          )}

        </body>

        </html>

      `);


      printWindow.document.close();


      printWindow.focus();


      setTimeout(
        function(){

          printWindow.print();

        },
        400
      );

    }
  );


/* ======================================
   SEARCH
====================================== */

searchInput
  .addEventListener(
    "input",
    renderTemplates
  );


categoryFilter
  .addEventListener(
    "change",
    renderTemplates
  );


/* ======================================
   MOBILE NAVIGATION
====================================== */

document
  .querySelector(
    "#menuBtn"
  )
  .addEventListener(
    "click",
    function(){

      document
        .querySelector(
          "#navLinks"
        )
        .classList
        .toggle("open");

    }
  );


/* ======================================
   LOAD SAVED TEMPLATE
====================================== */

function loadSelectedTemplate(){

  try{

    const saved =
      localStorage.getItem(
        "selectedCVTemplate"
      );


    if(!saved){

      return;

    }


    const selected =
      JSON.parse(saved);


    const template =
      templates.find(
        item =>
          item.id === selected.id
      );


    if(template){

      selectedTemplate =
        template;

    }

  }
  catch(error){

    console.error(
      "Could not load selected template:",
      error
    );

  }

}


/* ======================================
   INITIALIZE PAGE
====================================== */

loadSelectedTemplate();

renderTemplates();


/* ======================================
   CLOSE NAV AFTER LINK CLICK
====================================== */

document
  .querySelectorAll(
    "#navLinks a"
  )
  .forEach(
    link => {

      link.addEventListener(
        "click",
        function(){

          document
            .querySelector(
              "#navLinks"
            )
            .classList
            .remove("open");

        }
      );

    }
  );


/* ======================================
   PAGE READY
====================================== */

window.addEventListener(
  "load",
  function(){

    document.body.classList.add(
      "page-ready"
    );

  }
);

</script>

</body>
</html>
