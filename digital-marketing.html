<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Marketing Skills</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    :root {
      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 30px rgba(15,23,42,.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    header {
      background:
        linear-gradient(135deg, #4c1d95, #7c3aed, #db2777);
      color: white;
      padding: 70px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 30px;
      background: rgba(255,255,255,.14);
      font-size: .85rem;
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0 0 15px;
      font-size: clamp(2.2rem, 6vw, 4rem);
    }

    header p {
      max-width: 720px;
      line-height: 1.7;
      color: #f3e8ff;
      margin: 0;
    }

    main {
      padding: 40px 0;
    }

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
      padding: 20px;
      margin-bottom: 25px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: var(--shadow);
    }

    .filter-group label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      font-size: .95rem;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .input-wrap input {
      padding-left: 40px;
    }

    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .result-bar select {
      width: auto;
      min-width: 180px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .skill-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: .25s ease;
    }

    .skill-card:hover {
      transform: translateY(-5px);
    }

    .skill-cover {
      height: 175px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 4rem;
    }

    .cover-fundamentals {
      background: linear-gradient(135deg,#7c3aed,#4c1d95);
    }

    .cover-seo {
      background: linear-gradient(135deg,#059669,#065f46);
    }

    .cover-social {
      background: linear-gradient(135deg,#db2777,#9d174d);
    }

    .cover-content {
      background: linear-gradient(135deg,#2563eb,#1e40af);
    }

    .cover-email {
      background: linear-gradient(135deg,#ea580c,#9a3412);
    }

    .cover-analytics {
      background: linear-gradient(135deg,#0891b2,#155e75);
    }

    .cover-ads {
      background: linear-gradient(135deg,#ca8a04,#713f12);
    }

    .cover-brand {
      background: linear-gradient(135deg,#be123c,#881337);
    }

    .skill-content {
      padding: 20px;
    }

    .skill-content h3 {
      margin: 10px 0;
    }

    .skill-content p {
      color: var(--muted);
      line-height: 1.6;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 20px;
      background: #f5f3ff;
      color: #6d28d9;
      font-size: .78rem;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--muted);
    }

    .empty i {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15,23,42,.7);
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      position: relative;
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 16px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 30px;
      cursor: pointer;
    }

    .modal-box li {
      margin: 10px 0;
      color: var(--muted);
    }

    footer {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 750px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .result-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .result-bar select {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">

    <div class="eyebrow">
      <i class="fa-solid fa-bullhorn"></i>
      Career Skills
    </div>

    <h1>Digital Marketing Skills</h1>

    <p>
      Build practical digital marketing skills for growing brands,
      reaching customers, creating content, analyzing campaigns,
      and increasing online visibility.
    </p>

  </div>
</header>


<main class="container">

  <!-- FILTERS -->
  <section class="filters">

    <div class="filter-group">
      <label for="search">
        Search Skills
      </label>

      <div class="input-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="search"
          id="search"
          placeholder="Search marketing skills..."
        >
      </div>
    </div>


    <div class="filter-group">
      <label for="level">
        Level
      </label>

      <select id="level">
        <option value="all">All Levels</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>
    </div>


    <div class="filter-group">
      <label for="category">
        Category
      </label>

      <select id="category">

        <option value="all">
          All Categories
        </option>

        <option value="Digital Marketing">
          Digital Marketing
        </option>

        <option value="SEO">
          SEO
        </option>

        <option value="Social Media">
          Social Media
        </option>

        <option value="Content Marketing">
          Content Marketing
        </option>

        <option value="Email Marketing">
          Email Marketing
        </option>

        <option value="Marketing Analytics">
          Marketing Analytics
        </option>

        <option value="Paid Advertising">
          Paid Advertising
        </option>

        <option value="Brand Marketing">
          Brand Marketing
        </option>

      </select>
    </div>

  </section>


  <div class="result-bar">

    <strong id="resultCount">
      0 skills
    </strong>

    <select id="sort">
      <option value="popularity">
        Most Popular
      </option>

      <option value="az">
        A-Z
      </option>

      <option value="level">
        Level
      </option>
    </select>

  </div>


  <!-- DYNAMIC SKILLS -->
  <section
    class="skills-grid"
    id="skillsGrid"
  ></section>

</main>


<!-- DETAILS MODAL -->
<div
  class="modal"
  id="detailsModal"
>

  <div class="modal-box">

    <button
      type="button"
      class="close"
      id="closeModal"
      aria-label="Close"
    >
      &times;
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<footer>
  <p>
    © 2026 Digital Marketing Skills Platform
  </p>
</footer>


<script>

  /* =========================================
     DIGITAL MARKETING SKILLS DATA
  ========================================= */

  const marketingSkills = [

    {
      id: 1,
      title: "Digital Marketing Fundamentals",
      category: "Digital Marketing",
      level: "Beginner",
      duration: "4 weeks",
      popularity: 98,
      icon: "fa-solid fa-bullhorn",
      cover: "fundamentals",
      description:
        "Learn the foundations of digital marketing and how businesses attract and engage online audiences.",
      skills: [
        "Digital marketing concepts",
        "Customer journeys",
        "Marketing channels",
        "Audience research",
        "Campaign planning"
      ]
    },


    {
      id: 2,
      title: "Search Engine Optimization",
      category: "SEO",
      level: "Intermediate",
      duration: "7 weeks",
      popularity: 100,
      icon: "fa-solid fa-magnifying-glass-chart",
      cover: "seo",
      description:
        "Learn how to improve website visibility and attract relevant organic search traffic.",
      skills: [
        "Keyword research",
        "On-page SEO",
        "Technical SEO",
        "Content optimization",
        "SEO analysis"
      ]
    },


    {
      id: 3,
      title: "Social Media Marketing",
      category: "Social Media",
      level: "Beginner",
      duration: "5 weeks",
      popularity: 99,
      icon: "fa-solid fa-share-nodes",
      cover: "social",
      description:
        "Learn how to create social media strategies, engage audiences, and measure campaign performance.",
      skills: [
        "Social media strategy",
        "Content planning",
        "Audience engagement",
        "Community management",
        "Social analytics"
      ]
    },


    {
      id: 4,
      title: "Content Marketing",
      category: "Content Marketing",
      level: "Intermediate",
      duration: "6 weeks",
      popularity: 96,
      icon: "fa-solid fa-pen-nib",
      cover: "content",
      description:
        "Learn how to create useful content that attracts audiences and supports business goals.",
      skills: [
        "Content strategy",
        "Blog writing",
        "Content calendars",
        "Storytelling",
        "Content optimization"
      ]
    },


    {
      id: 5,
      title: "Email Marketing",
      category: "Email Marketing",
      level: "Intermediate",
      duration: "5 weeks",
      popularity: 91,
      icon: "fa-solid fa-envelope",
      cover: "email",
      description:
        "Learn how to create effective email campaigns, nurture leads, and improve customer engagement.",
      skills: [
        "Email campaigns",
        "Audience segmentation",
        "Email copywriting",
        "Automation",
        "Campaign analysis"
      ]
    },


    {
      id: 6,
      title: "Marketing Analytics",
      category: "Marketing Analytics",
      level: "Advanced",
      duration: "8 weeks",
      popularity: 94,
      icon: "fa-solid fa-chart-line",
      cover: "analytics",
      description:
        "Learn how to measure marketing performance and turn campaign data into useful insights.",
      skills: [
        "Marketing metrics",
        "Conversion analysis",
        "Campaign reporting",
        "Customer analytics",
        "Performance optimization"
      ]
    },


    {
      id: 7,
      title: "Paid Advertising",
      category: "Paid Advertising",
      level: "Intermediate",
      duration: "7 weeks",
      popularity: 97,
      icon: "fa-solid fa-rectangle-ad",
      cover: "ads",
      description:
        "Learn the principles of paid digital advertising and how to optimize campaigns.",
      skills: [
        "Campaign setup",
        "Audience targeting",
        "Ad copy",
        "Budget management",
        "Campaign optimization"
      ]
    },


    {
      id: 8,
      title: "Brand Marketing",
      category: "Brand Marketing",
      level: "Advanced",
      duration: "6 weeks",
      popularity: 89,
      icon: "fa-solid fa-star",
      cover: "brand",
      description:
        "Learn how to build a strong digital brand identity and create consistent customer experiences.",
      skills: [
        "Brand positioning",
        "Brand identity",
        "Customer perception",
        "Brand storytelling",
        "Digital branding"
      ]
    }

  ];


  /* =========================================
     DOM ELEMENTS
  ========================================= */

  const skillsGrid =
    document.getElementById("skillsGrid");

  const searchInput =
    document.getElementById("search");

  const levelSelect =
    document.getElementById("level");

  const categorySelect =
    document.getElementById("category");

  const sortSelect =
    document.getElementById("sort");

  const resultCount =
    document.getElementById("resultCount");

  const modal =
    document.getElementById("detailsModal");

  const modalContent =
    document.getElementById("modalContent");

  const closeModal =
    document.getElementById("closeModal");


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     RENDER SKILLS
  ========================================= */

  function renderSkills(list) {

    if (!list.length) {

      skillsGrid.innerHTML = `

        <div class="empty">

          <i class="fa-solid fa-bullhorn"></i>

          <h2>
            No skills found
          </h2>

          <p>
            Try another search term or change your filters.
          </p>

        </div>

      `;

      resultCount.textContent =
        "0 skills";

      return;
    }


    skillsGrid.innerHTML =
      list.map(skill => `

        <article class="skill-card">

          <div
            class="skill-cover cover-${skill.cover}"
          >
            <i class="${skill.icon}"></i>
          </div>


          <div class="skill-content">

            <div class="meta">

              <span class="badge">
                ${escapeHTML(skill.level)}
              </span>

              <span class="badge">
                ${escapeHTML(skill.category)}
              </span>

            </div>


            <h3>
              ${escapeHTML(skill.title)}
            </h3>


            <p>
              ${escapeHTML(skill.description)}
            </p>


            <div class="meta">

              <span class="badge">
                <i class="fa-regular fa-clock"></i>
                ${escapeHTML(skill.duration)}
              </span>

              <span class="badge">
                <i class="fa-solid fa-fire"></i>
                ${skill.popularity}%
              </span>

            </div>


            <button
              type="button"
              class="btn btn-primary"
              onclick="showDetails(${skill.id})"
            >
              View Details
            </button>

          </div>

        </article>

      `).join("");


    resultCount.textContent =
      `${list.length} skill${list.length === 1 ? "" : "s"}`;

  }


  /* =========================================
     FILTER SKILLS
  ========================================= */

  function filterSkills() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    const level =
      levelSelect.value;

    const category =
      categorySelect.value;


    let filtered =
      marketingSkills.filter(skill => {

        const searchableText = [

          skill.title,
          skill.category,
          skill.level,
          skill.description,
          skill.duration,
          ...skill.skills

        ]
          .join(" ")
          .toLowerCase();


        const matchesSearch =
          !search ||
          searchableText.includes(search);


        const matchesLevel =
          level === "all" ||
          skill.level === level;


        const matchesCategory =
          category === "all" ||
          skill.category === category;


        return (
          matchesSearch &&
          matchesLevel &&
          matchesCategory
        );

      });


    /* =====================================
       SORT
    ===================================== */

    if (sortSelect.value === "az") {

      filtered.sort(
        (a, b) =>
          a.title.localeCompare(b.title)
      );

    }

    else if (sortSelect.value === "level") {

      const levelOrder = {
        Beginner: 1,
        Intermediate: 2,
        Advanced: 3
      };

      filtered.sort(
        (a, b) =>
          levelOrder[a.level] -
          levelOrder[b.level]
      );

    }

    else {

      filtered.sort(
        (a, b) =>
          b.popularity -
          a.popularity
      );

    }


    renderSkills(filtered);

  }


  /* =========================================
     SHOW DETAILS
  ========================================= */

  function showDetails(id) {

    const skill =
      marketingSkills.find(
        item => item.id === id
      );

    if (!skill) return;


    modalContent.innerHTML = `

      <div
        class="skill-cover cover-${skill.cover}"
        style="
          border-radius:12px;
          margin-bottom:20px;
        "
      >
        <i class="${skill.icon}"></i>
      </div>


      <span class="badge">
        ${escapeHTML(skill.category)}
      </span>


      <h2>
        ${escapeHTML(skill.title)}
      </h2>


      <p>
        ${escapeHTML(skill.description)}
      </p>


      <p>
        <strong>Level:</strong>
        ${escapeHTML(skill.level)}
      </p>


      <p>
        <strong>Duration:</strong>
        ${escapeHTML(skill.duration)}
      </p>


      <h3>
        Key Skills
      </h3>


      <ul>

        ${skill.skills.map(item => `

          <li>

            <i
              class="fa-solid fa-check"
              style="
                color:#16a34a;
                margin-right:7px;
              "
            ></i>

            ${escapeHTML(item)}

          </li>

        `).join("")}

      </ul>


      <button
        type="button"
        class="btn btn-primary"
        onclick="startLearning(${skill.id})"
      >
        Start Learning
      </button>

    `;


    modal.classList.add("active");

    document.body.style.overflow =
      "hidden";

  }


  /* =========================================
     START LEARNING
  ========================================= */

  function startLearning(id) {

    const skill =
      marketingSkills.find(
        item => item.id === id
      );

    if (!skill) return;


    alert(
      `You selected "${skill.title}". Connect this button to your course or learning page.`
    );

  }


  /* =========================================
     CLOSE MODAL
  ========================================= */

   /* =========================================
     CLOSE MODAL
  ========================================= */

  function closeDetails() {

    modal.classList.remove("active");

    document.body.style.overflow = "";

  }


  closeModal.addEventListener(
    "click",
    closeDetails
  );


  modal.addEventListener(
    "click",
    function(event) {

      if (event.target === modal) {
        closeDetails();
      }

    }
  );


  /* =========================================
     ESC KEY
  ========================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {
        closeDetails();
      }

    }
  );


  /* =========================================
     EVENTS
  ========================================= */

  searchInput.addEventListener(
    "input",
    filterSkills
  );

  levelSelect.addEventListener(
    "change",
    filterSkills
  );

  categorySelect.addEventListener(
    "change",
    filterSkills
  );

  sortSelect.addEventListener(
    "change",
    filterSkills
  );


  /* =========================================
     KEYBOARD SEARCH
  ========================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "/" &&
        document.activeElement.tagName !== "INPUT" &&
        document.activeElement.tagName !== "SELECT"
      ) {

        event.preventDefault();

        searchInput.focus();

      }

    }
  );


  /* =========================================
     INITIAL LOAD
  ========================================= */

  renderSkills(
    [...marketingSkills].sort(
      (a, b) =>
        b.popularity -
        a.popularity
    )
  );


  /* =========================================
     RESET FILTERS
  ========================================= */

  function resetFilters() {

    searchInput.value = "";
    levelSelect.value = "all";
    categorySelect.value = "all";
    sortSelect.value = "popularity";

    filterSkills();

  }

</script>

</body>
</html>
