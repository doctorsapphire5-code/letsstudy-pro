<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Discover Communities | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:14px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{color:#2563eb}

.home{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1100px;
  margin:30px auto;
}

.hero{
  margin-bottom:20px;
}

.hero h1{
  font-size:30px;
  margin-bottom:7px;
}

.hero p{
  color:#64748b;
}

.search{
  background:#fff;
  padding:15px;
  border-radius:13px;
  margin-bottom:20px;
  box-shadow:0 4px 18px #00000008;
}

.search input{
  width:100%;
  padding:13px;
  border:1px solid #dce1e8;
  border-radius:9px;
  outline:none;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.filters button{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:9px 14px;
  border-radius:20px;
  cursor:pointer;
}

.filters button.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(250px,1fr));
  gap:16px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:18px;
  box-shadow:0 4px 18px #00000009;
}

.icon{
  width:58px;
  height:58px;
  border-radius:14px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin-bottom:14px;
}

.name{
  font-size:18px;
  font-weight:800;
  margin-bottom:7px;
}

.description{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
  min-height:42px;
}

.meta{
  color:#94a3b8;
  font-size:12px;
  margin:13px 0;
}

.open{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:11px;
  border-radius:8px;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:65px 20px;
  color:#64748b;
}

.error{
  color:#dc2626;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="home"
    onclick="location.href='community.html'"
  >
    <i class="fa-solid fa-users"></i>
    Community
  </button>

</header>

<main class="container">

  <section class="hero">

    <h1>Discover Communities</h1>

    <p>
      Explore communities and find people
      with similar interests.
    </p>

  </section>

  <div class="search">

    <input
      id="search"
      type="search"
      placeholder="Search communities..."
    >

  </div>

  <div class="filters">

    <button
      class="active"
      data-category="all"
    >
      All
    </button>

    <button data-category="Education">
      Education
    </button>

    <button data-category="Technology">
      Technology
    </button>

    <button data-category="Business">
      Business
    </button>

    <button data-category="Science">
      Science
    </button>

    <button data-category="Career">
      Career
    </button>

  </div>

  <section
    id="grid"
    class="grid"
  >

    <div class="empty">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>Loading communities...</p>

    </div>

  </section>

</main>

<script type="module">

/*
==================================================
DISCOVER COMMUNITY

Public:
- Reads published community data through API.

Firebase Auth:
- Not required to browse.
- Authentication can be used by the
  destination page for private actions.

Admin:
- NOT USED.
==================================================
*/

const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");

const filterButtons =
  document.querySelectorAll(
    ".filters button"
  );

let communities = [];

let activeCategory = "all";


/* ================================
   LOAD DATA
================================ */

async function loadCommunities(){

  try{

    const response =
      await fetch(
        "/api/data?collection=groups&limit=100"
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load communities"
      );

    }


    communities =
      Array.isArray(result.results)
      ? result.results
      : [];


    render();


  }catch(error){

    console.error(
      "DISCOVER COMMUNITY ERROR:",
      error
    );

    grid.innerHTML = `

      <div class="empty error">

        <i
          class="fa-solid fa-triangle-exclamation"
          style="font-size:38px"
        ></i>

        <h3>
          Unable to load communities
        </h3>

        <p>
          ${escapeHTML(error.message)}
        </p>

      </div>

    `;

  }

}


/* ================================
   RENDER
================================ */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    communities.filter(item => {

      const category =
        String(
          item.category ||
          ""
        );


      const matchesCategory =
        activeCategory === "all" ||
        category.toLowerCase() ===
        activeCategory.toLowerCase();


      const text = [

        item.name,
        item.title,
        item.description,
        item.category,
        item.username

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      return (
        matchesCategory &&
        text.includes(keyword)
      );

    });


  if(!filtered.length){

    grid.innerHTML = `

      <div class="empty">

        <i
          class="fa-solid fa-users-slash"
          style="font-size:40px"
        ></i>

        <h3>
          No communities found
        </h3>

        <p>
          Try another search or category.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered
      .map(createCard)
      .join("");

}


/* ================================
   CARD
================================ */

function createCard(item){

  const id =
    item.id ||
    item.documentId ||
    item.groupId ||
    "";


  const name =
    item.name ||
    item.title ||
    "Community";


  const description =
    item.description ||
    "Join this community and connect with others.";


  const category =
    item.category ||
    "Community";


  const members =
    item.memberCount ??
    item.membersCount ??
    0;


  return `

    <article class="card">

      <div class="icon">

        <i class="fa-solid fa-users"></i>

      </div>

      <div class="name">

        ${escapeHTML(name)}

      </div>

      <div class="description">

        ${escapeHTML(
          description
        )}

      </div>

      <div class="meta">

        ${escapeHTML(category)}

        ${members
          ? " • " +
            escapeHTML(
              String(members)
            ) +
            " members"
          : ""
        }

      </div>

      <button
        class="open"
        data-id="${escapeAttr(id)}"
      >

        View Community

      </button>

    </article>

  `;

}


/* ================================
   OPEN
================================ */

grid.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".open"
      );

    if(!button) return;


    const id =
      button.dataset.id;


    if(!id) return;


    location.href =
      "group-community.html?id=" +
      encodeURIComponent(id);

  }
);


/* ================================
   SEARCH
================================ */

search.addEventListener(
  "input",
  render
);


/* ================================
   FILTER
================================ */

filterButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        filterButtons.forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        activeCategory =
          button.dataset.category ||
          "all";


        render();

      }
    );

  }
);


/* ================================
   SECURITY
================================ */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}


/* ================================
   START
================================ */

loadCommunities();

</script>

</body>
</html>
