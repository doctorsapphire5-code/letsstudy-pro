<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Documents</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033
}

a{text-decoration:none;color:inherit}

.container{
  width:min(1200px,94%);
  margin:auto
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:15px 0
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.logo{
  color:#2563eb;
  font-size:18px;
  font-weight:900
}

.nav-links{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}

.nav-links a{
  padding:9px 11px;
  border-radius:8px;
  color:#64748b;
  font-size:7px;
  font-weight:900
}

.nav-links a:hover,
.nav-links a.active{
  background:#eff6ff;
  color:#2563eb
}

main{
  padding:28px 0 60px
}

.hero{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px
}

h1{
  font-size:28px;
  margin-bottom:6px
}

.subtitle{
  color:#64748b;
  font-size:10px
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  font-size:7px;
  font-weight:900;
  cursor:pointer
}

.primary{
  background:#2563eb;
  color:#fff
}

.gray{
  background:#f1f5f9;
  color:#334155
}

.red{
  background:#fee2e2;
  color:#991b1b
}

.layout{
  display:grid;
  grid-template-columns:210px 1fr;
  gap:16px
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:17px
}

.sidebar-title{
  font-size:9px;
  font-weight:900;
  margin-bottom:10px
}

.folder{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  border-radius:8px;
  color:#64748b;
  font-size:7px;
  font-weight:900;
  cursor:pointer;
  margin-bottom:4px
}

.folder:hover,
.folder.active{
  background:#eff6ff;
  color:#2563eb
}

.folder-count{
  margin-left:auto;
  font-size:6px;
  background:#f1f5f9;
  padding:4px 6px;
  border-radius:20px
}

.search{
  width:100%;
  padding:11px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none;
  font-size:8px;
  margin-bottom:12px
}

.search:focus{
  border-color:#2563eb
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px
}

.title{
  font-size:13px;
  font-weight:900
}

.document{
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eef2f7
}

.document:last-child{
  border-bottom:0
}

.doc-icon{
  width:40px;
  height:40px;
  border-radius:9px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px
}

.doc-info strong{
  display:block;
  font-size:8px;
  margin-bottom:4px;
  word-break:break-word
}

.doc-info span{
  display:block;
  color:#64748b;
  font-size:6px;
  margin-bottom:4px
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:6px;
  font-weight:900
}

.draft{
  background:#fef3c7;
  color:#92400e
}

.published{
  background:#dcfce7;
  color:#166534
}

.review{
  background:#dbeafe;
  color:#1d4ed8
}

.archived{
  background:#f1f5f9;
  color:#475569
}

.empty{
  text-align:center;
  padding:45px 15px;
  color:#64748b;
  font-size:8px
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px
}

.meta-card{
  background:#f8fafc;
  border-radius:9px;
  padding:12px
}

.meta-card span{
  display:block;
  color:#64748b;
  font-size:6px;
  margin-bottom:5px
}

.meta-card strong{
  font-size:10px
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100
}

.modal.show{
  display:flex
}

.modal-box{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:14px;
  padding:20px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}

.modal-head h2{
  font-size:14px
}

.close{
  width:28px;
  height:28px;
  border:0;
  border-radius:7px;
  background:#f1f5f9;
  cursor:pointer
}

.field{
  margin-bottom:12px
}

.field label{
  display:block;
  font-size:7px;
  font-weight:900;
  margin-bottom:6px
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:8px;
  padding:10px;
  outline:none;
  font-size:8px;
  font-family:inherit
}

.field textarea{
  min-height:140px;
  resize:vertical;
  line-height:1.6
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#2563eb
}

.preview{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:9px;
  padding:15px;
  min-height:180px;
  font-size:8px;
  line-height:1.7;
  white-space:pre-wrap
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#172033;
  color:#fff;
  padding:11px 15px;
  border-radius:8px;
  font-size:8px;
  font-weight:900;
  display:none;
  z-index:200
}

.toast.show{
  display:block
}

@media(max-width:850px){
  .layout{
    grid-template-columns:1fr
  }

  .nav{
    align-items:flex-start;
    flex-direction:column
  }
}

@media(max-width:600px){
  .hero{
    align-items:flex-start;
    flex-direction:column
  }

  .meta{
    grid-template-columns:1fr
  }

  .document{
    grid-template-columns:40px 1fr
  }

  .document .actions{
    grid-column:2
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<a href="documents.html" class="logo">
📄 Documents
</a>

<nav class="nav-links">
<a href="cloud.html">Cloud</a>
<a href="documents.html" class="active">Documents</a>
<a href="cloud-files.html">Files</a>
<a href="cloud-shared.html">Shared</a>
</nav>

</div>
</header>


<main class="container">

<section class="hero">

<div>
<h1>Documents</h1>
<p class="subtitle">
Create, organize, edit and manage your business documents.
</p>
</div>

<div class="actions">

<button
class="btn gray"
onclick="openTemplateModal()">
Templates
</button>

<button
class="btn primary"
onclick="openEditor()">
+ New Document
</button>

</div>

</section>


<div class="meta">

<div class="meta-card">
<span>TOTAL DOCUMENTS</span>
<strong id="total">0</strong>
</div>

<div class="meta-card">
<span>DRAFTS</span>
<strong id="drafts">0</strong>
</div>

<div class="meta-card">
<span>PUBLISHED</span>
<strong id="published">0</strong>
</div>

</div>


<div class="layout">

<aside class="card">

<div class="sidebar-title">
Folders
</div>

<div
class="folder active"
data-folder="All"
onclick="selectFolder('All',this)">
📁 All Documents
<span id="allCount" class="folder-count">0</span>
</div>

<div
class="folder"
data-folder="Business"
onclick="selectFolder('Business',this)">
💼 Business
</div>

<div
class="folder"
data-folder="Reports"
onclick="selectFolder('Reports',this)">
📊 Reports
</div>

<div
class="folder"
data-folder="Plans"
onclick="selectFolder('Plans',this)">
📋 Plans
</div>

<div
class="folder"
data-folder="Marketing"
onclick="selectFolder('Marketing',this)">
📣 Marketing
</div>

<div
class="folder"
data-folder="Finance"
onclick="selectFolder('Finance',this)">
💰 Finance
</div>

<div
class="folder"
data-folder="Other"
onclick="selectFolder('Other',this)">
📂 Other
</div>

</aside>


<section class="card">

<div class="toolbar">

<div class="title" id="folderTitle">
All Documents
</div>

<button
class="btn gray"
onclick="sortDocuments()">
Sort
</button>

</div>

<input
id="search"
class="search"
type="search"
placeholder="Search documents...">

<div id="documentList"></div>

</section>

</div>

</main>


<!-- EDITOR MODAL -->

<div id="editorModal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="editorTitle">
New Document
</h2>

<button
class="close"
onclick="closeEditor()">
×
</button>

</div>


<div class="field">

<label>
DOCUMENT TITLE
</label>

<input
id="docTitle"
type="text"
placeholder="Enter document title">

</div>


<div class="field">

<label>
FOLDER
</label>

<select id="docFolder">

<option>Business</option>
<option>Reports</option>
<option>Plans</option>
<option>Marketing</option>
<option>Finance</option>
<option>Other</option>

</select>

</div>


<div class="field">

<label>
STATUS
</label>

<select id="docStatus">

<option>Draft</option>
<option>Review</option>
<option>Published</option>
<option>Archived</option>

</select>

</div>


<div class="field">

<label>
CONTENT
</label>

<textarea
id="docContent"
placeholder="Write your document here..."></textarea>

</div>


<div class="actions">

<button
class="btn gray"
onclick="closeEditor()">
Cancel
</button>

<button
class="btn primary"
onclick="saveDocument()">
Save Document
</button>

</div>

</div>

</div>


<!-- VIEW MODAL -->

<div id="viewModal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="viewTitle">
Document
</h2>

<button
class="close"
onclick="closeView()">
×
</button>

</div>

<div
id="viewContent"
class="preview">
</div>

<div class="actions" style="margin-top:15px">

<button
class="btn gray"
onclick="closeView()">
Close
</button>

<button
id="editViewButton"
class="btn primary">
Edit
</button>

</div>

</div>

</div>


<!-- TEMPLATE MODAL -->

<div id="templateModal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2>
Document Templates
</h2>

<button
class="close"
onclick="closeTemplateModal()">
×
</button>

</div>

<div class="quick-template">

<button
class="btn gray"
onclick="useTemplate('Business Report')">
📊 Business Report
</button>

<button
class="btn gray"
onclick="useTemplate('Business Plan')">
💼 Business Plan
</button>

<button
class="btn gray"
onclick="useTemplate('Project Proposal')">
📋 Project Proposal
</button>

<button
class="btn gray"
onclick="useTemplate('Meeting Notes')">
📝 Meeting Notes
</button>

<button
class="btn gray"
onclick="useTemplate('Marketing Plan')">
📣 Marketing Plan
</button>

<button
class="btn gray"
onclick="useTemplate('Invoice')">
💰 Invoice
</button>

</div>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

let activeFolder = "All";
let editingId = null;


/*
  DOCUMENTS TEMPLATE

  Data is saved to localStorage for this frontend demo.

  Production:
  - Authenticate users
  - Store documents in a database
  - Store files in cloud storage
  - Add server-side authorization
  - Add version history
  - Add collaboration
*/


const defaultDocuments = [

{
 id:"doc_1",
 title:"Business Report",
 folder:"Business",
 status:"Published",
 content:"Business Report\\n\\nExecutive Summary\\n\\nThis document contains the main business performance summary.",
 updatedAt:new Date().toISOString()
},

{
 id:"doc_2",
 title:"Marketing Plan",
 folder:"Marketing",
 status:"Draft",
 content:"Marketing Plan\\n\\nObjectives\\n\\nDefine your marketing goals, target audience, channels and budget.",
 updatedAt:new Date(Date.now()-86400000).toISOString()
},

{
 id:"doc_3",
 title:"Financial Report",
 folder:"Finance",
 status:"Review",
 content:"Financial Report\\n\\nRevenue\\nExpenses\\nProfit\\n\\nAdd financial analysis here.",
 updatedAt:new Date(Date.now()-2*86400000).toISOString()
}

];


function getDocuments(){

let data =
JSON.parse(
localStorage.getItem(
"documents"
) || "null"
);

if(!Array.isArray(data)){

data = defaultDocuments;

saveDocuments(data);

}

return data;

}


function saveDocuments(data){

localStorage.setItem(
"documents",
JSON.stringify(data)
);

}


function renderDocuments(){

const query =
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

let documents =
getDocuments();


if(activeFolder !== "All"){

documents =
documents.filter(
doc =>
doc.folder === activeFolder
);

}


if(query){

documents =
documents.filter(
doc =>
doc.title
.toLowerCase()
.includes(query) ||

doc.content
.toLowerCase()
.includes(query)
);

}


documents.sort(
(a,b)=>
new Date(b.updatedAt) -
new Date(a.updatedAt)
);


const list =
document.getElementById(
"documentList"
);

list.innerHTML = "";


if(!documents.length){

list.innerHTML = `

<div class="empty">

📄
<br><br>

No documents found.

<br><br>

<button
class="btn primary"
onclick="openEditor()">
Create Document
</button>

</div>

`;

updateStats();
return;

}


documents.forEach(doc=>{

const row =
document.createElement("div");

row.className = "document";

row.innerHTML = `

<div class="doc-icon">
📄
</div>

<div class="doc-info">

<strong>
${escapeHTML(doc.title)}
</strong>

<span>
${escapeHTML(doc.folder)}
· Updated ${formatDate(doc.updatedAt)}
</span>

<span class="badge ${statusClass(doc.status)}">
${escapeHTML(doc.status)}
</span>

</div>

<div class="actions">

<button
class="btn gray"
onclick="viewDocument('${safe(doc.id)}')">
View
</button>

<button
class="btn gray"
onclick="editDocument('${safe(doc.id)}')">
Edit
</button>

<button
class="btn red"
onclick="deleteDocument('${safe(doc.id)}')">
Delete
</button>

</div>

`;

list.appendChild(row);

});


updateStats();

}


function updateStats(){

const documents =
getDocuments();

document.getElementById(
"total"
).textContent =
documents.length;

document.getElementById(
"drafts"
).textContent =
documents.filter(
doc => doc.status === "Draft"
).length;

document.getElementById(
"published"
).textContent =
documents.filter(
doc => doc.status === "Published"
).length;

document.getElementById(
"allCount"
).textContent =
documents.length;

}


function selectFolder(folder, element){

activeFolder = folder;

document.querySelectorAll(
".folder"
).forEach(
item =>
item.classList.remove("active")
);

element.classList.add("active");

document.getElementById(
"folderTitle"
).textContent =
folder === "All"
? "All Documents"
: folder;

renderDocuments();

}


function openEditor(){

editingId = null;

document.getElementById(
"editorTitle"
).textContent =
"New Document";

document.getElementById(
"docTitle"
).value = "";

document.getElementById(
"docFolder"
).value =
activeFolder === "All"
? "Business"
: activeFolder;

document.getElementById(
"docStatus"
).value =
"Draft";

document.getElementById(
"docContent"
).value = "";

document.getElementById(
"editorModal"
).classList.add("show");

}


function editDocument(id){

const doc =
getDocuments().find(
item => item.id === id
);

if(!doc) return;

editingId = id;

document.getElementById(
"editorTitle"
).textContent =
"Edit Document";

document.getElementById(
"docTitle"
).value =
doc.title;

document.getElementById(
"docFolder"
).value =
doc.folder;

document.getElementById(
"docStatus"
).value =
doc.status;

document.getElementById(
"docContent"
).value =
doc.content;

document.getElementById(
"editorModal"
).classList.add("show");

}


function closeEditor(){

document.getElementById(
"editorModal"
).classList.remove("show");

}


function saveDocument(){

const title =
document.getElementById(
"docTitle"
).value.trim();

const folder =
document.getElementById(
"docFolder"
).value;

const status =
document.getElementById(
"docStatus"
).value;

const content =
document.getElementById(
"docContent"
).value.trim();


if(!title){

showToast(
"Enter a document title."
);

return;

}


const documents =
getDocuments();


if(editingId){

const index =
documents.findIndex(
doc => doc.id === editingId
);

if(index !== -1){

documents[index] = {

...documents[index],

title,
folder,
status,
content,

updatedAt:
new Date().toISOString()

};

}

showToast(
"Document updated."
);

}else{

documents.unshift({

id:
"doc_"+Date.now(),

title,
folder,
status,
content,

updatedAt:
new Date().toISOString()

});

showToast(
"Document created."
);

}


saveDocuments(documents);

closeEditor();

renderDocuments();

}


function viewDocument(id){

const doc =
getDocuments().find(
item => item.id === id
);

if(!doc) return;

document.getElementById(
"viewTitle"
).textContent =
doc.title;

document.getElementById(
"viewContent"
).textContent =
doc.content || "No content.";

document.getElementById(
"editViewButton"
).onclick =
()=>{

closeView();
editDocument(id);

};

document.getElementById(
"viewModal"
).classList.add("show");

}


function closeView(){

document.getElementById(
"viewModal"
).classList.remove("show");

}


function deleteDocument(id){

const documents =
getDocuments();

const doc =
documents.find(
item => item.id === id
);

if(!doc) return;


if(!confirm(
"Move this document to Trash?"
)) return;


const trash =
JSON.parse(
localStorage.getItem(
"documentTrash"
) || "[]"
);


trash.unshift({

...doc,

deletedAt:
new Date().toISOString()

});


localStorage.setItem(
"documentTrash",
JSON.stringify(trash)
);


saveDocuments(
documents.filter(
item => item.id !== id
)
);


renderDocuments();

showToast(
"Document moved to Trash."
);

}


function sortDocuments(){

const documents =
getDocuments();

documents.sort(
(a,b)=>
a.title.localeCompare(b.title)
);

saveDocuments(documents);

renderDocuments();

showToast(
"Documents sorted alphabetically."
);

}


function openTemplateModal(){

document.getElementById(
"templateModal"
).classList.add("show");

}


function closeTemplateModal(){

document.getElementById(
"templateModal"
).classList.remove("show");

}


function useTemplate(type){

const templates = {

"Business Report":
{
folder:"Business",
content:
"BUSINESS REPORT\\n\\n1. Executive Summary\\n\\n2. Business Performance\\n\\n3. Revenue Analysis\\n\\n4. Expenses\\n\\n5. Profitability\\n\\n6. Key Findings\\n\\n7. Recommendations"
},

"Business Plan":
{
folder:"Business",
content:
"BUSINESS PLAN\\n\\n1. Executive Summary\\n\\n2. Business Idea\\n\\n3. Market Analysis\\n\\n4. Products or Services\\n\\n5. Marketing Strategy\\n\\n6. Operations Plan\\n\\n7. Financial Plan\\n\\n8. Growth Strategy"
},

"Project Proposal":
{
folder:"Plans",
content:
"PROJECT PROPOSAL\\n\\nProject Name:\\n\\nObjective:\\n\\nProblem:\\n\\nProposed Solution:\\n\\nTimeline:\\n\\nBudget:\\n\\nExpected Results:"
},

"Meeting Notes":
{
folder:"Business",
content:
"MEETING NOTES\\n\\nDate:\\n\\nParticipants:\\n\\nAgenda:\\n\\nDiscussion:\\n\\nDecisions:\\n\\nAction Items:\\n\\nNext Meeting:"
},

"Marketing Plan":
{
folder:"Marketing",
content:
"MARKETING PLAN\\n\\n1. Business Overview\\n\\n2. Target Market\\n\\n3. Competitor Analysis\\n\\n4. Marketing Goals\\n\\n5. Marketing Channels\\n\\n6. Campaign Strategy\\n\\n7. Budget\\n\\n8. KPIs"
},

"Invoice":
{
folder:"Finance",
content:
"INVOICE\\n\\nInvoice Number:\\nDate:\\nDue Date:\\n\\nCustomer:\\n\\nDescription\\nQuantity\\nUnit Price\\nTotal\\n\\nSubtotal:\\nTax:\\nTotal Due:"
}

};


const template =
templates[type];

if(!template) return;

closeTemplateModal();

openEditor();

document.getElementById(
"docTitle"
).value =
type;

document.getElementById(
"docFolder"
).value =
template.folder;

document.getElementById(
"docContent"
).value =
template.content;

}


function statusClass(status){

return String(status)
.toLowerCase();

}


function formatDate(value){

if(!value)
return "Unknown";

return new Date(value)
.toLocaleDateString(
"en-US",
{
month:"short",
day:"numeric",
year:"numeric"
}
);

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function safe(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


function showToast(message){

const toast =
document.getElementById("toast");

toast.textContent =
message;

toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2400);

}


/* SEARCH */

document.getElementById(
"search"
).addEventListener(
"input",
renderDocuments
);
