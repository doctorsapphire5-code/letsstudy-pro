<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Document View</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
a{text-decoration:none;color:inherit}
header{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 0}
.container{width:min(1180px,94%);margin:auto}
.nav{display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-weight:900;color:#2563eb;font-size:17px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:9px 12px;font-size:8px;font-weight:900;cursor:pointer}
.primary{background:#2563eb;color:#fff}
.gray{background:#f1f5f9;color:#334155}
.red{background:#fee2e2;color:#991b1b}
main{padding:24px 0 60px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}
.breadcrumb{color:#64748b;font-size:7px;margin-bottom:6px}
h1{font-size:25px;margin-bottom:6px}
.meta{color:#64748b;font-size:7px}
.layout{display:grid;grid-template-columns:1fr 250px;gap:16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:13px}
.document-paper{padding:40px;min-height:650px}
.status{display:inline-block;padding:5px 8px;border-radius:20px;font-size:6px;font-weight:900;background:#dcfce7;color:#166534}
.document-content{margin-top:25px;font-size:10px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.sidebar{padding:17px}
.side-title{font-size:10px;font-weight:900;margin-bottom:12px}
.info{padding:10px 0;border-bottom:1px solid #eef2f7}
.info:last-child{border:0}
.info span{display:block;color:#64748b;font-size:6px;margin-bottom:4px}
.info strong{font-size:8px;word-break:break-word}
.section{margin-top:20px}
.section button{width:100%;margin-bottom:7px;text-align:left}
.empty{text-align:center;padding:80px 20px;color:#64748b;font-size:9px}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:11px 15px;border-radius:8px;font-size:8px;font-weight:900;display:none}
.toast.show{display:block}
@media(max-width:800px){
.layout{grid-template-columns:1fr}
.document-paper{padding:24px}
.toolbar{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>

<header>
<div class="container nav">
<a href="documents.html" class="logo">📄 Documents</a>
<div class="actions">
<a href="documents.html" class="btn gray">← Documents</a>
<button class="btn primary" onclick="editDocument()">Edit</button>
</div>
</div>
</header>

<main class="container">

<div id="loading"></div>

<div id="view" style="display:none">

<div class="toolbar">

<div>
<div class="breadcrumb">Documents / View</div>
<h1 id="title"></h1>
<div class="meta" id="meta"></div>
</div>

<div class="actions">
<button class="btn gray" onclick="printDocument()">Print</button>
<button class="btn gray" onclick="downloadDocument()">Download</button>
<button class="btn red" onclick="deleteDocument()">Delete</button>
</div>

</div>

<div class="layout">

<article class="card document-paper">

<div>
<span id="status" class="status"></span>
</div>

<div id="content" class="document-content"></div>

</article>

<aside class="card sidebar">

<div class="side-title">Document Details</div>

<div class="info">
<span>Title</span>
<strong id="sideTitle"></strong>
</div>

<div class="info">
<span>Folder</span>
<strong id="folder"></strong>
</div>

<div class="info">
<span>Status</span>
<strong id="sideStatus"></strong>
</div>

<div class="info">
<span>Created</span>
<strong id="created"></strong>
</div>

<div class="info">
<span>Last Updated</span>
<strong id="updated"></strong>
</div>

<div class="info">
<span>Document ID</span>
<strong id="docId"></strong>
</div>

<div class="section">

<div class="side-title">Actions</div>

<button class="btn gray" onclick="editDocument()">✏️ Edit Document</button>
<button class="btn gray" onclick="duplicateDocument()">📑 Duplicate</button>
<button class="btn gray" onclick="shareDocument()">🔗 Share</button>
<button class="btn red" onclick="deleteDocument()">🗑️ Move to Trash</button>

</div>

</aside>

</div>

</div>

</main>

<div id="toast" class="toast"></div>

<script>

let currentDocument=null;


/*
  DOCUMENT VIEW

  Expected URL:
  document-view.html?id=doc_123

  Documents are read from:
  localStorage["documents"]

  This matches the Documents template page.
*/


function getDocuments(){

const data=
JSON.parse(
localStorage.getItem("documents")||"[]"
);

return Array.isArray(data)?data:[];

}


function getDocument(){

const params=
new URLSearchParams(
window.location.search
);

const id=
params.get("id");

const documents=
getDocuments();

if(id){

return documents.find(
doc=>String(doc.id)===String(id)
);

}


/* Optional fallback:
   open the newest document */

return documents[0];

}


function loadDocument(){

currentDocument=
getDocument();

const loading=
document.getElementById("loading");

if(!currentDocument){

loading.innerHTML=`

<div class="card empty">

📄

<br><br>

Document not found.

<br><br>

<a
href="documents.html"
class="btn primary">
Back to Documents
</a>

</div>

`;

return;

}

loading.style.display="none";

document.getElementById(
"view"
).style.display="block";


document.title=
currentDocument.title+
" — Document View";


document.getElementById(
"title"
).textContent=
currentDocument.title;


document.getElementById(
"sideTitle"
).textContent=
currentDocument.title;


document.getElementById(
"folder"
).textContent=
currentDocument.folder||"Other";


document.getElementById(
"status"
).textContent=
currentDocument.status||"Draft";


document.getElementById(
"sideStatus"
).textContent=
currentDocument.status||"Draft";


document.getElementById(
"created"
).textContent=
formatDate(
currentDocument.createdAt||
currentDocument.updatedAt
);


document.getElementById(
"updated"
).textContent=
formatDate(
currentDocument.updatedAt
);


document.getElementById(
"docId"
).textContent=
currentDocument.id;


document.getElementById(
"content"
).textContent=
currentDocument.content||
"No document content.";


document.getElementById(
"meta"
).textContent=
`${currentDocument.folder||"Other"} · Updated ${formatDate(currentDocument.updatedAt)}`;

}


function editDocument(){

if(!currentDocument)return;

window.location.href=
"documents.html?edit="+
encodeURIComponent(
currentDocument.id
);

}


function duplicateDocument(){

if(!currentDocument)return;

const documents=
getDocuments();

const copy={
...currentDocument,
id:"doc_"+Date.now(),
title:currentDocument.title+" Copy",
status:"Draft",
createdAt:new Date().toISOString(),
updatedAt:new Date().toISOString()
};

documents.unshift(copy);

localStorage.setItem(
"documents",
JSON.stringify(documents)
);

showToast(
"Document duplicated."
);

setTimeout(()=>{
window.location.href=
"document-view.html?id="+
encodeURIComponent(copy.id);
},700);

}


function shareDocument(){

if(!currentDocument)return;

const url=
window.location.href;

if(
navigator.clipboard &&
navigator.clipboard.writeText
){

navigator.clipboard.writeText(url)
.then(()=>{
showToast(
"Document link copied."
);
})
.catch(()=>{
showToast(
"Copy the URL from your browser."
);
});

}else{

showToast(
"Copy the URL from your browser."
);

}

}


function deleteDocument(){

if(!currentDocument)return;

const confirmed=
confirm(
"Move this document to Trash?"
);

if(!confirmed)return;


const documents=
getDocuments();

const remaining=
documents.filter(
doc=>
String(doc.id)!==
String(currentDocument.id)
);


const trash=
JSON.parse(
localStorage.getItem(
"documentTrash"
)||"[]"
);


trash.unshift({
...currentDocument,
deletedAt:
new Date().toISOString()
});


localStorage.setItem(
"documents",
JSON.stringify(remaining)
);

localStorage.setItem(
"documentTrash",
JSON.stringify(trash)
);


showToast(
"Document moved to Trash."
);

setTimeout(()=>{
window.location.href=
"documents.html";
},700);

}


function printDocument(){

if(!currentDocument)return;

const printWindow=
window.open(
"",
"_blank",
"width=900,height=700"
);

if(!printWindow){

showToast(
"Please allow pop-ups to print."
);

return;

}


const safeTitle=
escapeHTML(
currentDocument.title
);

const content=
escapeHTML(
currentDocument.content||
"No document content."
);


printWindow.document.write(`

<!DOCTYPE html>

<html>

<head>

<title>${safeTitle}</title>

<style>

body{
font-family:Arial,sans-serif;
max-width:800px;
margin:50px auto;
color:#111827;
line-height:1.8
}

h1{
font-size:28px;
margin-bottom:25px
}

.content{
white-space:pre-wrap;
font-size:14px
}

</style>

</head>

<body>

<h1>${safeTitle}</h1>

<div class="content">${content}</div>

</body>

</html>

`);

printWindow.document.close();

printWindow.focus();

setTimeout(()=>{
printWindow.print();
},300);

}


function downloadDocument(){

if(!currentDocument)return;

const content=
currentDocument.content||
"";

const blob=
new Blob(
[
currentDocument.title+
"\n\n"+
content
],
{
type:"text/plain;charset=utf-8"
}
);

const url=
URL.createObjectURL(blob);

const link=
document.createElement("a");

link.href=url;

link.download=
sanitizeFilename(
currentDocument.title
)+
".txt";

document.body.appendChild(link);

link.click();

link.remove();

URL.revokeObjectURL(url);

showToast(
"Document downloaded."
);

}


function sanitizeFilename(name){

return String(name)
.replace(/[\\/:*?"<>|]/g,"")
.trim()||
"document";

}


function formatDate(value){

if(!value)return"Unknown";

const date=
new Date(value);

if(
Number.isNaN(
date.getTime()
)
)return"Unknown";

return date.toLocaleDateString(
"en-US",
{
year:"numeric",
month:"short",
day:"numeric"
}
);

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showToast(message){

const toast=
document.getElementById(
"toast"
);

toast.textContent=message;

toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2200);

}


/* LOAD */

loadDocument();

</script>

</body>
</html>
