<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const loading=
document.getElementById("loading");

const content=
document.getElementById("content");

const title=
document.getElementById("title");

const description=
document.getElementById("description");

const type=
document.getElementById("type");

const format=
document.getElementById("format");

const fileStatus=
document.getElementById("fileStatus");

const downloadBtn=
document.getElementById("downloadBtn");

const openBtn=
document.getElementById("openBtn");

const backBtn=
document.getElementById("backBtn");

const status=
document.getElementById("status");

const icon=
document.getElementById("icon");

const badge=
document.getElementById("badge");


/* =========================================
URL PARAMETERS
========================================= */

const params=
new URLSearchParams(
window.location.search
);

const id=
params.get("id");

const source=
(
params.get("source")||
params.get("type")||
"resource"
).toLowerCase();


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);


/* =========================================
LOAD FILE
========================================= */

async function loadFile(){

if(!id){

showError(
"Missing file ID. Please return and select a file again."
);

return;

}


try{

let data=null;


/*
RESOURCE
*/

if(
source!=="certificate"&&
source!=="cert"
){

const snap=
await getDoc(
doc(
db,
"resources",
id
)
);

if(
snap.exists()
){

data={
id:snap.id,
...snap.data()
};

}

}


/*
CERTIFICATE
*/

if(
!data &&
(
source==="certificate"||
source==="cert"
)
){

const certificateSnap=
await getDoc(
doc(
db,
"certificates",
id
)
);

if(
certificateSnap.exists()
){

data={
id:certificateSnap.id,
...certificateSnap.data()
};

}

}


/*
FALLBACK:
try certificate if resource wasn't found
*/

if(!data){

const certificateSnap=
await getDoc(
doc(
db,
"certificates",
id
)
);

if(
certificateSnap.exists()
){

data={
id:certificateSnap.id,
...certificateSnap.data()
};

}

}


/*
NOT FOUND
*/

if(!data){

showError(
"File not found. It may have been removed or the link is invalid."
);

return;

}


displayFile(data);

}catch(error){

console.error(
"Download error:",
error
);

showError(
"Unable to load this file. Please try again."
);

}

}


/* =========================================
DISPLAY
========================================= */

function displayFile(data){

loading.style.display="none";

content.style.display="block";


const isCertificate=
source==="certificate"||
source==="cert"||
data.certificateId||
data.certificateNumber;


if(isCertificate){

icon.textContent="🎓";

badge.textContent=
"CERTIFICATE";

type.textContent=
"Certificate";

backBtn.href=
"certificate-view.html?id="+
encodeURIComponent(id);

}else{

icon.textContent="📥";

badge.textContent=
"LEARNING RESOURCE";

type.textContent=
data.type||
data.category||
"Resource";

backBtn.href=
"resources-details.html?id="+
encodeURIComponent(id);

}


title.textContent=
data.title||
data.name||
"Learning File";


description.textContent=
data.description||
"Your learning file is ready.";

const fileUrl=
data.downloadUrl||
data.fileUrl||
data.pdfUrl||
data.url||
data.file||
"";


const extension=
getExtension(fileUrl);

format.textContent=
extension?
extension.toUpperCase():
"FILE";


if(!fileUrl){

fileStatus.textContent=
"Unavailable";

downloadBtn.style.display="none";

openBtn.style.display="none";

showStatus(
"No downloadable file is currently attached to this item.",
"error"
);

return;

}


/*
FILE AVAILABLE
*/

fileStatus.textContent=
"Available";

downloadBtn.href=
fileUrl;

openBtn.href=
fileUrl;


/*
If it is a PDF, browser can open it.
*/

if(
extension==="pdf"
){

openBtn.textContent=
"📄 Open PDF";

}


/*
Download using anchor.
Some external storage/CDN providers
may ignore download attribute.
*/

downloadBtn.onclick=()=>{
showStatus(
"Your download is starting...",
"success"
);
};

}


/* =========================================
ERROR
========================================= */

function showError(text){

loading.style.display="none";

content.style.display="block";

icon.textContent="⚠️";

badge.textContent=
"DOWNLOAD ERROR";

title.textContent=
"Download unavailable";

description.textContent=
text;

type.textContent=
"Error";

format.textContent=
"—";

fileStatus.textContent=
"Unavailable";

downloadBtn.style.display=
"none";

openBtn.style.display=
"none";

backBtn.href=
source==="certificate"
?
"certificate-view.html"
:
"resources-details.html";

showStatus(
text,
"error"
);

}


/* =========================================
STATUS
========================================= */

function showStatus(
text,
kind
){

status.textContent=text;

status.className=
"status show "+
kind;

}


/* =========================================
EXTENSION
========================================= */

function getExtension(url){

try{

const clean=
url.split("?")[0]
.split("#")[0];

const parts=
clean.split(".");

if(parts.length<2)
return "";

return parts
.pop()
.toLowerCase();

}catch{

return "";

}

}


/* =========================================
YEAR
========================================= */

document.getElementById("year")
.textContent=
new Date().getFullYear();

</script>
