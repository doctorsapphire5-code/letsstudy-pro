<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download | LetsStudy Pro</title>

<meta name="description"
content="Download educational resources, PDF notes and certificates from LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:#fff;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:700;
}

.back{
  color:#fff;
  text-decoration:none;
  font-size:14px;
}

.container{
  max-width:720px;
  margin:45px auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:32px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.icon{
  text-align:center;
  font-size:58px;
}

h1{
  text-align:center;
  margin:12px 0;
}

.description{
  text-align:center;
  color:#667085;
  line-height:1.6;
}

.file-box{
  margin:25px 0;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:11px 0;
  border-bottom:1px solid #e5e7eb;
}

.row:last-child{
  border-bottom:0;
}

.label{
  color:#667085;
}

.value{
  font-weight:600;
  text-align:right;
  word-break:break-word;
}

.download-btn{
  display:block;
  width:100%;
  padding:16px;
  border:0;
  border-radius:11px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  text-align:center;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.download-btn:hover{
  background:#1d4ed8;
}

.secondary{
  display:block;
  margin-top:12px;
  width:100%;
  padding:14px;
  border-radius:10px;
  background:#eef2ff;
  color:#3730a3;
  text-align:center;
  text-decoration:none;
  font-weight:600;
}

.message{
  display:none;
  padding:14px;
  border-radius:10px;
  margin-top:18px;
  text-align:center;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.loading{
  text-align:center;
  color:#667085;
  padding:20px;
}

footer{
  text-align:center;
  color:#667085;
  padding:30px 20px;
  font-size:13px;
}

@media(max-width:600px){

  .container{
    margin:20px auto;
    padding:15px;
  }

  .card{
    padding:24px 18px;
  }

  .row{
    flex-direction:column;
    gap:5px;
  }

  .value{
    text-align:left;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy Pro
  </div>

  <a
    id="backLink"
    href="dashboard.html"
    class="back"
  >
    ← Back
  </a>

</header>


<main class="container">

  <div class="card">

    <div class="icon">
      📄
    </div>

    <h1 id="title">
      Download
    </h1>

    <p
      id="description"
      class="description"
    >
      Preparing your file...
    </p>


    <div
      id="loading"
      class="loading"
    >
      Loading file information...
    </div>


    <div
      id="fileBox"
      class="file-box"
      style="display:none;"
    >

      <div class="row">

        <span class="label">
          File
        </span>

        <span
          id="fileName"
          class="value"
        >
          —
        </span>

      </div>


      <div class="row">

        <span class="label">
          Type
        </span>

        <span
          id="fileType"
          class="value"
        >
          PDF
        </span>

      </div>


      <div class="row">

        <span class="label">
          Source
        </span>

        <span
          id="source"
          class="value"
        >
          —
        </span>

      </div>

    </div>


    <a
      id="downloadBtn"
      class="download-btn"
      href="#"
      target="_blank"
      rel="noopener"
      style="display:none;"
    >
      ⬇ Download File
    </a>


    <a
      id="sourceBtn"
      class="secondary"
      href="dashboard.html"
      style="display:none;"
    >
      ← Return to Page
    </a>


    <div
      id="message"
      class="message"
    ></div>

  </div>

</main>


<footer>
  © 2026 LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

/*
=========================================================
LETSSTUDY PRO DOWNLOAD SYSTEM
=========================================================

DOWNLOAD URL:

download.html?id=RESOURCE_ID

The ADMIN creates the resource and stores:

resources/{RESOURCE_ID}

Example:

{
  title: "A Level Biology Notes",
  description: "Complete Biology notes",
  fileName: "biology-notes.pdf",
  fileUrl: "https://example.com/biology-notes.pdf",
  fileType: "PDF",
  sourcePage: "resources-details.html",
  sourceUrl: "resources-details.html?id=RESOURCE_ID"
}

NO FIREBASE STORAGE IS USED.
=========================================================
*/


import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
=========================================================
FIREBASE CONFIG
=========================================================
*/

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfKXAVKxbljsyRgI_0rj0rodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/*
=========================================================
ELEMENTS
=========================================================
*/

const title =
  document.getElementById("title");

const description =
  document.getElementById("description");

const fileName =
  document.getElementById("fileName");

const fileType =
  document.getElementById("fileType");

const source =
  document.getElementById("source");

const fileBox =
  document.getElementById("fileBox");

const downloadBtn =
  document.getElementById("downloadBtn");

const sourceBtn =
  document.getElementById("sourceBtn");

const loading =
  document.getElementById("loading");

const message =
  document.getElementById("message");

const backLink =
  document.getElementById("backLink");


/*
=========================================================
URL PARAMETERS
=========================================================

download.html?id=abc123

=========================================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );

const resourceId =
  params.get("id");


/*
=========================================================
SHOW MESSAGE
=========================================================
*/

function showMessage(
  text,
  type = "error"
){

  message.className =
    "message " + type;

  message.textContent =
    text;

}


/*
=========================================================
CHECK RESOURCE ID
=========================================================
*/

if(!resourceId){

  loading.style.display =
    "none";

  showMessage(
    "Download link is incomplete. Please return to the resource page."
  );

}else{

  loadResource();

}


/*
=========================================================
LOAD RESOURCE
=========================================================
*/

async function loadResource(){

  try{

    const resourceRef =
      doc(
        db,
        "resources",
        resourceId
      );

    const resourceSnap =
      await getDoc(resourceRef);


    /*
    RESOURCE NOT FOUND
    */

    if(!resourceSnap.exists()){

      loading.style.display =
        "none";

      showMessage(
        "This resource could not be found."
      );

      return;
    }


    const data =
      resourceSnap.data();


    /*
    =====================================================
    RESOURCE INFORMATION
    =====================================================
    */

    const resourceTitle =
      data.title ||
      data.name ||
      "Download Resource";


    const resourceDescription =
      data.description ||
      "Your file is ready for download.";


    const url =
      data.fileUrl ||
      data.pdfUrl ||
      data.downloadUrl ||
      data.url;


    const name =
      data.fileName ||
      data.file ||
      "download.pdf";


    const type =
      data.fileType ||
      data.type ||
      "PDF";


    /*
    =====================================================
    CHECK FILE URL
    =====================================================
    */

    if(!url){

      loading.style.display =
        "none";

      title.textContent =
        resourceTitle;

      description.textContent =
        resourceDescription;

      fileName.textContent =
        name;

      fileType.textContent =
        type;

      fileBox.style.display =
        "block";

      showMessage(
        "The download link has not been added by the administrator yet."
      );

      return;
    }


    /*
    =====================================================
    DISPLAY RESOURCE
    =====================================================
    */

    title.textContent =
      resourceTitle;

    description.textContent =
      resourceDescription;

    fileName.textContent =
      name;

    fileType.textContent =
      type;


    /*
    =====================================================
    SOURCE PAGE
    =====================================================
    */

    let sourceUrl =
      data.sourceUrl ||
      data.returnUrl;


    let sourcePage =
      data.sourcePage;


    if(!sourceUrl){

      if(
        sourcePage ===
        "notes.html"
      ){

        sourceUrl =
          "notes.html";

      }else if(
        sourcePage ===
        "certificate-view.html"
      ){

        sourceUrl =
          "certificate-view.html?id=" +
          encodeURIComponent(resourceId);

      }else{

        sourceUrl =
          "resources-details.html?id=" +
          encodeURIComponent(resourceId);

      }

    }


    source.textContent =
      sourcePage ||
      "Resources";


    sourceBtn.href =
      sourceUrl;

    backLink.href =
      sourceUrl;


    /*
    =====================================================
    DOWNLOAD LINK
    =====================================================
    */

    downloadBtn.href =
      url;


    /*
    IMPORTANT:
    Browser download attribute works best when
    the server permits downloading.
    */

    downloadBtn.setAttribute(
      "download",
      name
    );


    downloadBtn.style.display =
      "block";


    sourceBtn.style.display =
      "block";


    fileBox.style.display =
      "block";


    loading.style.display =
      "none";


    showMessage(
      "Your file is ready for download.",
      "success"
    );


  }catch(error){

    console.error(
      "DOWNLOAD ERROR:",
      error
    );


    loading.style.display =
      "none";


    showMessage(
      "Unable to load the download information. Please try again."
    );

  }

}

</script>

</body>
</html>
