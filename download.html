<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Download | LetsStudy Pro</title>

<meta
name="description"
content="Download learning resources, notes and certificates from LetsStudy Pro."
>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:#111827;
color:white;
padding:18px 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:21px;
font-weight:700;
}

.back{
color:white;
text-decoration:none;
font-size:14px;
}

.container{
max-width:720px;
margin:45px auto;
padding:20px;
}

.card{
background:white;
border-radius:18px;
padding:32px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
text-align:center;
}

.icon{
font-size:58px;
margin-bottom:10px;
}

h1{
margin:10px 0;
}

.description{
color:#667085;
line-height:1.6;
}

.file-box{
margin:25px 0;
padding:18px;
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:12px;
text-align:left;
}

.row{
display:flex;
justify-content:space-between;
gap:20px;
padding:10px 0;
border-bottom:1px solid #e5e7eb;
}

.row:last-child{
border-bottom:none;
}

.label{
color:#667085;
}

.value{
font-weight:600;
word-break:break-word;
text-align:right;
}

.download-btn{
display:block;
width:100%;
padding:16px;
background:#2563eb;
color:white;
border-radius:10px;
text-decoration:none;
font-weight:700;
font-size:17px;
margin-top:20px;
}

.download-btn:hover{
background:#1d4ed8;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:14px;
border-radius:10px;
margin-top:20px;
}

.info{
background:#eff6ff;
color:#1e40af;
padding:14px;
border-radius:10px;
margin-top:20px;
}

footer{
text-align:center;
padding:30px;
color:#667085;
font-size:13px;
}

@media(max-width:600px){

.container{
margin:20px auto;
padding:15px;
}

.card{
padding:25px 18px;
}

.row{
flex-direction:column;
gap:5px;
}

.value{
text-align:left;
}

}

</style>

</head>

<body>


<header>

<div class="logo">
LetsStudy Pro
</div>

<a
href="javascript:history.back()"
class="back"
>
← Back
</a>

</header>


<main class="container">

<div class="card">

<div class="icon" id="icon">
📄
</div>

<h1 id="title">
Download
</h1>

<p
class="description"
id="description"
>
Preparing your download...
</p>


<div class="file-box">

<div class="row">

<span class="label">
File
</span>

<span
class="value"
id="fileName"
>
Loading...
</span>

</div>


<div class="row">

<span class="label">
Type
</span>

<span
class="value"
id="fileType"
>
Loading...
</span>

</div>

</div>


<div id="message"></div>


<a
id="downloadButton"
class="download-btn"
href="#"
download
style="display:none"
>
⬇ Download
</a>

</div>

</main>


<footer>

© 2026 LetsStudy Pro. All rights reserved.

</footer>


<script>

/*
==================================================
LETSTUDY PRO DOWNLOAD SYSTEM
==================================================

SUPPORTED SOURCES:

resources-details.html
notes.html
certificate-view.html
dashboard.html

URL FORMAT:

download.html?url=pdf/biology.pdf
&name=Biology%20Notes.pdf
&type=pdf

==================================================
*/


const params =
new URLSearchParams(
window.location.search
);


/*
==================================================
GET PARAMETERS
==================================================
*/

const fileUrl =
params.get("url");

const fileNameParam =
params.get("name");

const fileTypeParam =
params.get("type");


/*
==================================================
ELEMENTS
==================================================
*/

const icon =
document.getElementById("icon");

const title =
document.getElementById("title");

const description =
document.getElementById("description");

const fileName =
document.getElementById("fileName");

const fileType =
document.getElementById("fileType");

const button =
document.getElementById("downloadButton");

const message =
document.getElementById("message");


/*
==================================================
ERROR FUNCTION
==================================================
*/

function showError(text){

message.className =
"error";

message.textContent =
text;

button.style.display =
"none";

}


/*
==================================================
TYPE
==================================================
*/

let type =
(fileTypeParam || "pdf")
.toLowerCase();


/*
==================================================
DEFAULT INFORMATION
==================================================
*/

let pageTitle =
"Download PDF";

let pageDescription =
"Your file is ready for download.";

let buttonText =
"⬇ Download PDF";

let iconText =
"📄";


/*
==================================================
PDF
==================================================
*/

if(type === "pdf"){

pageTitle =
"Download PDF";

pageDescription =
"Your PDF is ready for download.";

buttonText =
"⬇ Download PDF";

iconText =
"📄";

}


/*
==================================================
CERTIFICATE
==================================================
*/

else if(type === "certificate"){

pageTitle =
"Download Certificate";

pageDescription =
"Your certificate is ready for download.";

buttonText =
"⬇ Download Certificate";

iconText =
"🏆";

}


/*
==================================================
DOCUMENT
==================================================
*/

else if(type === "document"){

pageTitle =
"Download Document";

pageDescription =
"Your document is ready for download.";

buttonText =
"⬇ Download Document";

iconText =
"📄";

}


/*
==================================================
RESOURCE
==================================================
*/

else if(type === "resource"){

pageTitle =
"Download Resource";

pageDescription =
"Your learning resource is ready for download.";

buttonText =
"⬇ Download Resource";

iconText =
"📚";

}


/*
==================================================
UPDATE UI
==================================================
*/

icon.textContent =
iconText;

title.textContent =
pageTitle;

description.textContent =
pageDescription;

fileType.textContent =
type.toUpperCase();


/*
==================================================
CHECK URL
==================================================
*/

if(!fileUrl){

showError(
"Download file is not available."
);

}else{


/*
Get filename
*/

let finalName =
fileNameParam;


/*
If name not provided,
get it from URL
*/

if(!finalName){

try{

finalName =
decodeURIComponent(
fileUrl.split("/").pop()
);

}catch{

finalName =
"download.pdf";

}

}


fileName.textContent =
finalName;


/*
Set download URL
*/

button.href =
fileUrl;

button.download =
finalName;

button.textContent =
buttonText;

button.style.display =
"block";


/*
Success message
*/

message.className =
"info";

message.textContent =
"Your download is ready. Tap the button below.";


}


/*
==================================================
OPTIONAL AUTO DOWNLOAD
==================================================

Usiweke true kama hutaki automatic download.
==================================================
*/

const AUTO_DOWNLOAD =
false;


if(
AUTO_DOWNLOAD &&
fileUrl
){

setTimeout(() => {

button.click();

}, 700);

}

</script>

</body>
</html>
