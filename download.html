<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download PDF | LetsStudy Pro</title>

<meta name="description"
content="Download educational PDF notes and learning resources from LetsStudy Pro.">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:700;
}

.back{
  color:white;
  text-decoration:none;
}

.container{
  max-width:700px;
  margin:50px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:35px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.icon{
  font-size:60px;
}

h1{
  margin:15px 0 10px;
}

.description{
  color:#667085;
  line-height:1.6;
}

.file-box{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:18px;
  margin:25px 0;
  text-align:left;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:10px 0;
  border-bottom:1px solid #e5e7eb;
}

.row:last-child{
  border-bottom:none;
}

.label{
  color:#667085;
}

.value{
  font-weight:600;
  word-break:break-word;
}

.download-btn{
  display:block;
  width:100%;
  padding:16px;
  border-radius:10px;
  background:#2563eb;
  color:white;
  text-decoration:none;
  font-size:17px;
  font-weight:700;
}

.download-btn:hover{
  background:#1d4ed8;
}

.error{
  color:#b42318;
  background:#fee4e2;
  padding:14px;
  border-radius:10px;
  margin-top:20px;
}

footer{
  text-align:center;
  color:#667085;
  padding:30px;
  font-size:13px;
}

@media(max-width:600px){

  .container{
    margin:20px auto;
  }

  .card{
    padding:25px 18px;
  }

  .row{
    flex-direction:column;
    gap:5px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy Pro
  </div>

  <a href="javascript:history.back()" class="back">
    ← Back
  </a>

</header>


<main class="container">

  <div class="card">

    <div class="icon">
      📄
    </div>

    <h1 id="title">
      Download PDF
    </h1>

    <p class="description" id="description">
      Your PDF is ready for download.
    </p>


    <div class="file-box">

      <div class="row">

        <span class="label">
          File
        </span>

        <span class="value" id="fileName">
          Loading...
        </span>

      </div>


      <div class="row">

        <span class="label">
          Type
        </span>

        <span class="value">
          PDF Document
        </span>

      </div>

    </div>


    <div id="error"></div>


    <a
      id="downloadButton"
      class="download-btn"
      href="#"
      download
      style="display:none;"
    >
      ⬇ Download PDF
    </a>

  </div>

</main>


<footer>

  © 2026 LetsStudy Pro. All rights reserved.

</footer>


<script>

/*
====================================================
PDF DOWNLOAD SYSTEM
====================================================

Example:

download.html?file=pdf/biology-form-five.pdf
====================================================
*/


const params =
  new URLSearchParams(window.location.search);


const pdf =
  params.get("file");


const title =
  params.get("title");


const fileName =
  document.getElementById("fileName");


const titleElement =
  document.getElementById("title");


const description =
  document.getElementById("description");


const button =
  document.getElementById("downloadButton");


const error =
  document.getElementById("error");


/*
====================================================
CHECK PDF
====================================================
*/

if(!pdf){

  error.className = "error";

  error.textContent =
    "PDF download link is missing.";

}else{

  /*
  Get filename
  */

  const name =
    pdf.split("/").pop();


  fileName.textContent =
    name;


  /*
  Page title
  */

  if(title){

    titleElement.textContent =
      decodeURIComponent(title);

    description.textContent =
      "Download " +
      decodeURIComponent(title) +
      " from LetsStudy Pro.";

  }


  /*
  Download link
  */

  button.href =
    pdf;

  button.download =
    name;

  button.style.display =
    "block";

}

</script>

</body>
</html>
