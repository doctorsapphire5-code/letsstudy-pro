<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>eBooks | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Inter,system-ui,sans-serif;
 background:#f5f7fa;
 color:#172033;
}

a{text-decoration:none;color:inherit}

.header{
 height:68px;
 background:#fff;
 border-bottom:1px solid #e5e9ee;
 position:sticky;
 top:0;
 z-index:20;
}

.nav{
 max-width:1200px;
 height:100%;
 margin:auto;
 padding:0 18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:#059669;
 font-size:20px;
 font-weight:950;
}

.navlinks{
 display:flex;
 gap:7px;
}

.navlinks a{
 padding:9px 11px;
 border-radius:8px;
 font-size:9px;
 font-weight:900;
}

.navlinks a:hover{
 background:#ecfdf5;
 color:#047857;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:24px 18px 70px;
}

.hero{
 padding:30px;
 border-radius:18px;
 color:#fff;
 background:
 radial-gradient(circle at 90% 10%,#fde68a,transparent 32%),
 linear-gradient(135deg,#78350f,#d97706);
 animation:up .5s ease;
}

.hero h1{
 margin:0 0 8px;
 font-size:29px;
}

.hero p{
 margin:0;
 max-width:650px;
 color:#fef3c7;
 font-size:10px;
 line-height:1.7;
}

.hero-actions{
 margin-top:18px;
 display:flex;
 gap:8px;
}

.btn{
 display:inline-block;
 border:0;
 padding:10px 14px;
 border-radius:8px;
 font-size:9px;
 font-weight:950;
 cursor:pointer;
}

.btn-light{
 background:#fff;
 color:#92400e;
}

.btn-dark{
 background:#172033;
 color:#fff;
}

.toolbar{
 margin:17px 0;
 display:flex;
 gap:8px;
 background:#fff;
 padding:10px;
 border:1px solid #e5e9ee;
 border-radius:12px;
}

.search{
 flex:1;
 min-width:0;
 padding:10px;
 border:1px solid #e5e9ee;
 border-radius:8px;
 outline:none;
 font-size:9px;
}

.select{
 padding:10px;
 border:1px solid #e5e9ee;
 border-radius:8px;
 background:#fff;
 font-size:9px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:13px;
}

.card{
 background:#fff;
 border:1px solid #e5e9ee;
 border-radius:14px;
 overflow:hidden;
 transition:.25s;
 animation:up .5s ease;
}

.card:hover{
 transform:translateY(-5px);
 box-shadow:0 15px 35px #17203314;
}

.cover{
 width:100%;
 height:190px;
 object-fit:cover;
 background:#fffbeb;
}

.cover-empty{
 width:100%;
 height:190px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:48px;
 background:#fffbeb;
}

.body{
 padding:14px;
}

.badge{
 display:inline-block;
 padding:5px 7px;
 border-radius:6px;
 background:#fef3c7;
 color:#92400e;
 font-size:7px;
 font-weight:950;
}

.title{
 margin:9px 0 5px;
 font-size:11px;
 font-weight:950;
}

.desc{
 color:#667085;
 font-size:8px;
 line-height:1.6;
 min-height:30px;
}

.seller{
 margin-top:9px;
 color:#98a2b3;
 font-size:7px;
}

.bottom{
 margin-top:13px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.price{
 color:#059669;
 font-size:10px;
 font-weight:950;
}

.buy{
 padding:8px 10px;
 border-radius:7px;
 background:#059669;
 color:#fff;
 font-size:8px;
 font-weight:950;
}

.buy:hover{
 background:#047857;
}

.empty{
 grid-column:1/-1;
 background:#fff;
 padding:55px 20px;
 border-radius:14px;
 border:1px solid #e5e9ee;
 text-align:center;
 color:#667085;
 font-size:9px;
}

.loading{
 grid-column:1/-1;
 padding:50px;
 text-align:center;
 color:#667085;
 font-size:9px;
}

.toast{
 position:fixed;
 right:18px;
 bottom:18px;
 background:#172033;
 color:#fff;
 padding:11px 14px;
 border-radius:8px;
 font-size:9px;
 font-weight:900;
 opacity:0;
 transform:translateY(15px);
 transition:.25s;
 z-index:50;
}

.toast.show{
 opacity:1;
 transform:translateY(0);
}

@keyframes up{
 from{
  opacity:0;
  transform:translateY(15px);
 }
 to{
  opacity:1;
  transform:translateY(0);
 }
}

@media(max-width:1000px){
 .grid{
  grid-template-columns:repeat(3,1fr);
 }
}

@media(max-width:700px){
 .grid{
  grid-template-columns:repeat(2,1fr);
 }
}

@media(max-width:520px){

.container{
 padding:15px 10px 50px;
}

.grid{
 grid-template-columns:1fr;
}

.toolbar{
 flex-direction:column;
}

.navlinks a:not(:last-child){
 display:none;
}

.hero{
 padding:23px;
}

}
</style>
</head>

<body>

<header class="header">

<nav class="nav">

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<div class="navlinks">

<a href="courses.html">
Courses
</a>

<a href="seller-ebooks.html">
Seller eBooks
</a>

<a href="marketplace-search.html">
Marketplace
</a>

<a href="cart.html">
🛒 Cart
</a>

</div>

</nav>

</header>


<main class="container">


<section class="hero">

<h1>
📚 Discover eBooks
</h1>

<p>
Explore educational books, career guides, business books,
technology resources and practical digital publications
from LetsStudy Pro creators.
</p>

<div class="hero-actions">

<a
href="marketplace-search.html"
class="btn btn-light">
Explore Marketplace
</a>

<a
href="cart.html"
class="btn btn-dark">
View Cart
</a>

</div>

</section>


<section class="toolbar">

<input
id="search"
class="search"
placeholder="Search eBooks...">

<select
id="category"
class="select">

<option value="all">
All Categories
</option>

</select>

</section>


<section
id="grid"
class="grid">

<div class="loading">
Loading eBooks...
</div>

</section>

</main>


<div
id="toast"
class="toast">
</div>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
 getFirestore,
 collection,
 query,
 where,
 getDocs
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsYRgI_0rj0odBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


let ebooks=[];


const $=
id=>document.getElementById(id);


function escapeHTML(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function money(value,currency){

try{

return new Intl.NumberFormat(
undefined,
{
style:"currency",
currency:currency||"USD",
maximumFractionDigits:0
}
).format(
Number(value||0)
);

}catch{

return `${currency||""} ${value||0}`;

}

}


function toast(message){

const el=$("toast");

el.textContent=message;

el.classList.add("show");

setTimeout(
()=>el.classList.remove("show"),
2200
);

}


async function loadEbooks(){

try{

const q=
query(
collection(db,"marketplace"),
where("type","==","ebook"),
where("status","==","published")
);

const snap=
await getDocs(q);

ebooks=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

buildCategories();

render();

}catch(error){

console.error(error);

$("grid").innerHTML=`

<div class="empty">

Unable to load eBooks right now.

</div>

`;

}

}


function buildCategories(){

const categories=
[
...new Set(
ebooks
.map(
e=>e.category
)
.filter(Boolean)
)
].sort();


$("category").innerHTML=`

<option value="all">
All Categories
</option>

${
categories
.map(
category=>
`
<option value="${escapeHTML(category)}">
${escapeHTML(category)}
</option>
`
)
.join("")
}

`;

}


function render(){

const search=
$("search").value
.toLowerCase()
.trim();

const category=
$("category").value;


const filtered=
ebooks.filter(
ebook=>{

const text=`

${ebook.title||""}
${ebook.category||""}
${ebook.description||""}
${ebook.shortDescription||""}

`
.toLowerCase();


return(
(!search || text.includes(search)) &&
(category==="all" ||
ebook.category===category)
);

});


if(!filtered.length){

$("grid").innerHTML=`

<div class="empty">

📚

<br><br>

No eBooks match your search.

<br><br>

<a
href="marketplace-search.html"
class="btn btn-dark">
Explore Marketplace
</a>

</div>

`;

return;

}


$("grid").innerHTML=
filtered
.map(
ebook=>{

const image=
ebook.thumbnail||
ebook.imageUrl||
"";


const price=
Number(
ebook.discountPrice>0 &&
ebook.discountPrice<ebook.price
?
ebook.discountPrice
:
ebook.price||0
);


return `

<article class="card">

${
image
?
`
<img
class="cover"
src="${escapeHTML(image)}"
alt="${escapeHTML(ebook.title)}"
loading="lazy">
`
:
`
<div class="cover-empty">
📚
</div>
`
}


<div class="body">

<span class="badge">
eBOOK
</span>


<div class="title">
${escapeHTML(
ebook.title||
"Untitled eBook"
)}
</div>


<div class="desc">
${escapeHTML(
ebook.shortDescription||
ebook.description||
"Educational digital publication."
)}
</div>


<div class="seller">

${
ebook.category
?
escapeHTML(ebook.category)
:
"Digital Publication"
}

</div>


<div class="bottom">

<span class="price">

${
price>0
?
money(
price,
ebook.currency
)
:
"FREE"
}

</span>


<a
class="buy"
href="marketplace-product.html?productId=${encodeURIComponent(ebook.id)}">

View eBook

</a>

</div>

</div>

</article>

`;

}
)
.join("");

}


$("search")
.addEventListener(
"input",
render
);

$("category")
.addEventListener(
"change",
render
);


loadEbooks();

</script>

</body>
</html>
