<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Edit Profile | LetsStudy Pro</title>

<meta name="description"
content="Edit and manage your LetsStudy Pro profile information.">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#0f172a;
}

a{
text-decoration:none;
color:inherit;
}

button{
font-family:inherit;
cursor:pointer;
}

.topbar{
height:68px;
background:#fff;
border-bottom:1px solid #e2e8f0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb;
}

.nav{
display:flex;
gap:8px;
}

.nav a{
font-size:12px;
font-weight:800;
padding:9px 13px;
border-radius:9px;
}

.nav a:hover{
background:#eff6ff;
color:#2563eb;
}

.container{
max-width:850px;
margin:auto;
padding:30px 20px;
}

.header{
margin-bottom:20px;
}

.header h1{
font-size:25px;
margin-bottom:6px;
}

.header p{
font-size:13px;
color:#64748b;
line-height:1.6;
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:18px;
padding:25px;
margin-bottom:18px;
}

.avatar-area{
display:flex;
align-items:center;
gap:18px;
padding-bottom:20px;
border-bottom:1px solid #e2e8f0;
margin-bottom:20px;
}

.avatar{
width:80px;
height:80px;
border-radius:50%;
display:grid;
place-items:center;
background:#dbeafe;
color:#1d4ed8;
font-size:29px;
font-weight:900;
}

.avatar-info h2{
font-size:16px;
margin-bottom:4px;
}

.avatar-info p{
font-size:12px;
color:#64748b;
}

.form-group{
margin-bottom:17px;
}

label{
display:block;
font-size:12px;
font-weight:800;
margin-bottom:7px;
}

input,
textarea,
select{
width:100%;
border:1px solid #cbd5e1;
border-radius:9px;
padding:12px;
font-size:13px;
outline:none;
background:#fff;
}

input:focus,
textarea:focus,
select:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

textarea{
min-height:100px;
resize:vertical;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.btn{
border:0;
padding:11px 17px;
border-radius:9px;
font-size:12px;
font-weight:900;
display:inline-flex;
align-items:center;
justify-content:center;
}

.primary{
background:#2563eb;
color:white;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.primary:hover{
background:#1d4ed8;
}

.secondary:hover{
background:#cbd5e1;
}

.message{
display:none;
padding:12px;
border-radius:9px;
font-size:12px;
font-weight:700;
margin-bottom:15px;
}

.message.success{
display:block;
background:#dcfce7;
color:#166534;
}

.message.error{
display:block;
background:#fee2e2;
color:#991b1b;
}

.loading{
opacity:.6;
pointer-events:none;
}

footer{
padding:20px 0;
border-top:1px solid #e2e8f0;
margin-top:25px;
display:flex;
justify-content:space-between;
font-size:11px;
color:#64748b;
}

footer a{
color:#2563eb;
font-weight:800;
}

@media(max-width:650px){

.topbar{
padding:0 15px;
}

.nav{
gap:3px;
}

.nav a{
padding:8px;
font-size:11px;
}

.container{
padding:22px 15px;
}

.card{
padding:19px;
}

.avatar-area{
align-items:flex-start;
}

.actions{
flex-direction:column;
}

.btn{
width:100%;
}

footer{
flex-direction:column;
gap:8px;
}

}

</style>

</head>

<body>


<header class="topbar">

<a href="dashboard.html" class="logo">
LetsStudy Pro
</a>

<nav class="nav">

<a href="profile.html">
Profile
</a>

<a href="account-preferences.html">
Preferences
</a>

<a href="dashboard.html">
Dashboard
</a>

</nav>

</header>


<main class="container">


<section class="header">

<h1>
Edit Profile
</h1>

<p>
Update your LetsStudy Pro profile information.
Your changes will be saved to your account.
</p>

</section>


<section class="card">

<div
id="message"
class="message">
</div>


<div class="avatar-area">

<div
id="avatar"
class="avatar">

U

</div>

<div class="avatar-info">

<h2 id="displayName">
Loading...
</h2>

<p id="displayEmail">
Loading...
</p>

</div>

</div>


<form id="profileForm">


<div class="form-group">

<label for="name">
Full Name
</label>

<input
id="name"
type="text"
placeholder="Enter your full name"
required
maxlength="100">

</div>


<div class="form-group">

<label for="username">
Username
</label>

<input
id="username"
type="text"
placeholder="Enter username"
maxlength="30">

</div>


<div class="form-group">

<label for="phone">
Phone Number
</label>

<input
id="phone"
type="tel"
placeholder="Enter phone number"
maxlength="30">

</div>


<div class="form-group">

<label for="country">
Country
</label>

<input
id="country"
type="text"
placeholder="Enter your country"
maxlength="80">

</div>


<div class="form-group">

<label for="bio">
Bio
</label>

<textarea
id="bio"
placeholder="Tell us something about yourself..."
maxlength="500"></textarea>

</div>


<div class="form-group">

<label for="education">
Education
</label>

<input
id="education"
type="text"
placeholder="School, college or university"
maxlength="150">

</div>


<div class="form-group">

<label for="interests">
Learning Interests
</label>

<input
id="interests"
type="text"
placeholder="e.g. Technology, Business, Science"
maxlength="200">

</div>


<div class="actions">

<button
id="saveBtn"
type="submit"
class="btn primary">

Save Changes

</button>

<a
href="profile.html"
class="btn secondary">

Cancel

</a>

<a
href="account-preferences.html"
class="btn secondary">

Preferences

</a>

<a
href="dashboard.html"
class="btn secondary">

Dashboard

</a>

</div>

</form>

</section>


<footer>

<div>
© <span id="year"></span> LetsStudy Pro
</div>

<div>

<a href="profile.html">
Profile
</a>

&nbsp; • &nbsp;

<a href="account-preferences.html">
Preferences
</a>

&nbsp; • &nbsp;

<a href="dashboard.html">
Dashboard
</a>

</div>

</footer>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getDatabase,
ref,
get,
update
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ============================================
   FIREBASE CONFIG
============================================ */

const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAXKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


/* ============================================
   INITIALIZE
============================================ */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* ============================================
   ELEMENTS
============================================ */

const form =
document.getElementById(
"profileForm"
);

const message =
document.getElementById(
"message"
);

const saveBtn =
document.getElementById(
"saveBtn"
);

const nameInput =
document.getElementById(
"name"
);

const usernameInput =
document.getElementById(
"username"
);

const phoneInput =
document.getElementById(
"phone"
);

const countryInput =
document.getElementById(
"country"
);

const bioInput =
document.getElementById(
"bio"
);

const educationInput =
document.getElementById(
"education"
);

const interestsInput =
document.getElementById(
"interests"
);

const avatar =
document.getElementById(
"avatar"
);

const displayName =
document.getElementById(
"displayName"
);

const displayEmail =
document.getElementById(
"displayEmail"
);


/* ============================================
   MESSAGE
============================================ */

function showMessage(
text,
type
){

message.textContent =
text;

message.className =
"message " +
type;

}


/* ============================================
   AUTH PROTECTION
============================================ */

onAuthStateChanged(
auth,
async user => {

if(!user){

location.href =
"login.html?redirect=edit-profile.html";

return;
}


try{

const userRef =
ref(
db,
"users/" +
user.uid
);

const snapshot =
await get(userRef);


let data =
snapshot.exists()
? snapshot.val()
: {};


const name =
data.name ||
data.displayName ||
user.displayName ||
"Student";


/* ==========================================
   LOAD FORM
========================================== */

nameInput.value =
name;

usernameInput.value =
data.username ||
"";

phoneInput.value =
data.phone ||
"";

countryInput.value =
data.country ||
"";

bioInput.value =
data.bio ||
"";

educationInput.value =
data.education ||
"";

interestsInput.value =
data.interests ||
"";


/* ==========================================
   HEADER
========================================== */

displayName.textContent =
name;

displayEmail.textContent =
user.email ||
"";

avatar.textContent =
name
.charAt(0)
.toUpperCase();


/* ==========================================
   ACCOUNT STATUS
========================================== */

if(
data.status === "disabled" ||
data.status === "suspended" ||
data.status === "banned"
){

location.href =
"access-denied.html";

return;

}


}catch(error){

console.error(
"Profile loading error:",
error
);

showMessage(
"Unable to load your profile.",
"error"
);

}

});


/* ============================================
   SAVE PROFILE
============================================ */

form.addEventListener(
"submit",
async event => {

event.preventDefault();


const user =
auth.currentUser;


if(!user){

location.href =
"login.html?redirect=edit-profile.html";

return;
}


const name =
nameInput.value.trim();

const username =
usernameInput.value.trim();

const phone =
phoneInput.value.trim();

const country =
countryInput.value.trim();

const bio =
bioInput.value.trim();

const education =
educationInput.value.trim();

const interests =
interestsInput.value.trim();


if(!name){

showMessage(
"Please enter your full name.",
"error"
);

nameInput.focus();

return;

}


saveBtn.disabled =
true;

saveBtn.textContent =
"Saving...";


try{


/* ==========================================
   UPDATE FIREBASE AUTH PROFILE
========================================== */

await updateProfile(
user,
{
displayName:name
}
);


/* ==========================================
   UPDATE REALTIME DATABASE
========================================== */

const userRef =
ref(
db,
"users/" +
user.uid
);


await update(
userRef,
{

name:name,

displayName:name,

username:username,

phone:phone,

country:country,

bio:bio,

education:education,

interests:interests,

updatedAt:
new Date().toISOString()

}
);


/* ==========================================
   UPDATE UI
========================================== */

displayName.textContent =
name;

avatar.textContent =
name
.charAt(0)
.toUpperCase();


showMessage(
"Profile updated successfully.",
"success"
);


saveBtn.textContent =
"Saved ✓";


/* ==========================================
   RETURN TO PROFILE
========================================== */

setTimeout(
()=>{

location.href =
"profile.html";

},
1000
);


}catch(error){

console.error(
"Save profile error:",
error
);

showMessage(
"Unable to save your profile. Please try again.",
"error"
);

saveBtn.disabled =
false;

saveBtn.textContent =
"Save Changes";

}

});


/* ============================================
   YEAR
============================================ */

document.getElementById(
"year"
).textContent =
new Date().getFullYear();

</script>

</body>
</html>
