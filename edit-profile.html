<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile | LetsStudy Pro</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

.navbar{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:16px 20px;
}

.navbar-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#2563eb;
  font-size:20px;
  font-weight:800;
  text-decoration:none;
}

.back{
  color:#475569;
  text-decoration:none;
  font-size:14px;
}

.container{
  max-width:650px;
  margin:40px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:28px;
  box-shadow:0 8px 25px rgba(15,23,42,.05);
}

h1{
  font-size:25px;
  margin-bottom:7px;
}

.subtitle{
  color:#64748b;
  font-size:14px;
  margin-bottom:25px;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#dbeafe;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:800;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#334155;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  padding:12px 13px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

input:disabled{
  background:#f1f5f9;
  color:#64748b;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:25px;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer;
}

.save{
  background:#2563eb;
  color:#fff;
  flex:1;
}

.save:hover{
  background:#1d4ed8;
}

.cancel{
  background:#f1f5f9;
  color:#334155;
}

.message{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:18px;
  font-size:13px;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.loading{
  text-align:center;
  color:#64748b;
  padding:30px;
}

@media(max-width:600px){

  .card{
    padding:20px;
  }

  .actions{
    flex-direction:column;
  }

}

</style>
</head>


<body>


<header class="navbar">

<div class="navbar-inner">

<a href="/" class="logo">
LetsStudy Pro
</a>

<a href="/profile.html" class="back">
← Back to Profile
</a>

</div>

</header>



<main class="container">

<div class="card">

<h1>
Edit Profile
</h1>

<p class="subtitle">
Update your LetsStudy Pro account information.
</p>


<div
  id="loading"
  class="loading">

Loading profile...

</div>


<div
  id="editor"
  style="display:none;">


<div
  class="avatar"
  id="avatar">

U

</div>


<div
  id="message"
  class="message">
</div>


<form id="editProfileForm">


<div class="form-group">

<label for="name">
Full Name
</label>

<input
  id="name"
  type="text"
  placeholder="Enter your full name"
  required>

</div>


<div class="form-group">

<label for="email">
Email Address
</label>

<input
  id="email"
  type="email"
  disabled>

</div>


<div class="form-group">

<label for="phone">
Phone Number
</label>

<input
  id="phone"
  type="tel"
  placeholder="+255...">

</div>


<div class="form-group">

<label for="level">
Form / Level
</label>

<select id="level">

<option value="">
Select your level
</option>

<option value="Form 1">
Form 1
</option>

<option value="Form 2">
Form 2
</option>

<option value="Form 3">
Form 3
</option>

<option value="Form 4">
Form 4
</option>

<option value="Form 5">
Form 5
</option>

<option value="Form 6">
Form 6
</option>

</select>

</div>


<div class="form-group">

<label for="school">
School
</label>

<input
  id="school"
  type="text"
  placeholder="Enter your school">

</div>


<div class="actions">

<a
  href="/profile.html"
  class="cancel"
  style="text-align:center;">

Cancel

</a>


<button
  type="submit"
  class="save"
  id="saveBtn">

Save Changes

</button>

</div>


</form>

</div>

</div>

</main>



<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  update
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0dBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(app);

const db =
  getDatabase(app);



/* =========================
   ELEMENTS
========================= */

const loading =
  document.getElementById(
    "loading"
  );

const editor =
  document.getElementById(
    "editor"
  );

const form =
  document.getElementById(
    "editProfileForm"
  );

const message =
  document.getElementById(
    "message"
  );

const saveBtn =
  document.getElementById(
    "saveBtn"
  );



/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}



/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.replace(
        "/login.html"
      );

      return;

    }


    document.getElementById(
      "email"
    ).value =
      user.email || "";


    try{

      const snapshot =
        await get(
          ref(
            db,
            "users/" +
            user.uid
          )
        );


      if(snapshot.exists()){

        const data =
          snapshot.val();


        document.getElementById(
          "name"
        ).value =
          data.name ||
          data.displayName ||
          "";


        document.getElementById(
          "phone"
        ).value =
          data.phone ||
          "";


        document.getElementById(
          "level"
        ).value =
          data.level ||
          data.form ||
          "";


        document.getElementById(
          "school"
        ).value =
          data.school ||
          "";


        updateAvatar(
          data.name ||
          data.displayName ||
          "Student"
        );

      }else{

        updateAvatar(
          "Student"
        );

      }


      loading.style.display =
        "none";

      editor.style.display =
        "block";


    }catch(error){

      console.error(
        error
      );

      loading.textContent =
        "Unable to load profile.";

    }

  }
);



/* =========================
   AVATAR
========================= */

function updateAvatar(name){

  const first =
    name.trim()
      .charAt(0)
      .toUpperCase() ||
    "U";

  document.getElementById(
    "avatar"
  ).textContent =
    first;

}



/* =========================
   SAVE PROFILE
========================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const user =
      auth.currentUser;


    if(!user){

      return;

    }


    const name =
      document.getElementById(
        "name"
      ).value.trim();


    const phone =
      document.getElementById(
        "phone"
      ).value.trim();


    const level =
      document.getElementById(
        "level"
      ).value;


    const school =
      document.getElementById(
        "school"
      ).value.trim();


    if(!name){

      showMessage(
        "Please enter your full name.",
        "error"
      );

      return;

    }


    try{

      saveBtn.disabled =
        true;

      saveBtn.textContent =
        "Saving...";


      await update(
        ref(
          db,
          "users/" +
          user.uid
        ),
        {

          name:
            name,

          displayName:
            name,

          phone:
            phone,

          level:
            level,

          school:
            school,

          updatedAt:
            Date.now()

        }
      );


      updateAvatar(
        name
      );


      showMessage(
        "Profile updated successfully.",
        "success"
      );


      setTimeout(
        () => {

          window.location.href =
            "/profile.html";

        },
        1200
      );


    }catch(error){

      console.error(
        "Update profile error:",
        error
      );


      showMessage(
        "Failed to update profile. Please try again.",
        "error"
      );


    }finally{

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "Save Changes";

    }

  }
);

</script>

</body>
</html>
