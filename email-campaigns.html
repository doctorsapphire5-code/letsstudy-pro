<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Campaigns | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#7c3aed;color:#fff;padding:16px 20px;font-size:20px;font-weight:800}
.container{max-width:1100px;margin:auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 10px #0001}
.stat b{display:block;font-size:25px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
input,textarea,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;margin:7px 0 13px;font:inherit}
textarea{min-height:170px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 15px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer}
button:hover{opacity:.9}
.green{background:#16a34a}
.red{background:#dc2626}
.blue{background:#2563eb}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.preview{border:1px solid #e5e7eb;border-radius:10px;padding:15px;min-height:220px;background:#fff}
.campaign{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid #eee}
.badge{display:inline-block;margin-top:5px;padding:4px 9px;border-radius:20px;background:#ede9fe;color:#6d28d9;font-size:12px}
small{color:#6b7280}
@media(max-width:700px){
.stats{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr}
.campaign{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>

<header>📧 LetsStudy Pro — Email Campaigns</header>

<div class="container">

<!-- STATS -->

<div class="stats">

<div class="card stat">
Total
<b id="total">0</b>
</div>

<div class="card stat">
Drafts
<b id="drafts">0</b>
</div>

<div class="card stat">
Scheduled
<b id="scheduled">0</b>
</div>

<div class="card stat">
Sent
<b id="sent">0</b>
</div>

</div>


<div class="grid">

<!-- CREATE -->

<div class="card">

<h2>Create Email Campaign</h2>

<input id="campaignId" type="hidden">

<label>Campaign Name</label>

<input
id="name"
placeholder="New Course Promotion"
>

<label>Audience</label>

<select id="audience">

<option value="all">
All Users
</option>

<option value="students">
Students
</option>

<option value="premium">
Premium Users
</option>

<option value="instructors">
Instructors
</option>

<option value="leads">
Leads
</option>

</select>


<label>Recipient Email</label>

<input
id="email"
type="email"
placeholder="student@example.com"
>


<label>Subject</label>

<input
id="subject"
placeholder="New Course Available"
>


<label>Email Message</label>

<textarea
id="message"
placeholder="Hello {{name}},&#10;&#10;We have a new course for you..."
></textarea>


<label>Schedule</label>

<input
id="schedule"
type="datetime-local"
>


<div class="actions">

<button onclick="saveCampaign()">
Save Campaign
</button>

<button
class="blue"
onclick="previewMessage()"
>
Preview
</button>

<button
class="red"
onclick="clearForm()"
>
Clear
</button>

</div>

</div>


<!-- PREVIEW -->

<div class="card">

<h2>Email Preview</h2>

<div id="preview" class="preview">

<p>
Your email preview will appear here.
</p>

</div>

<br>

<button
class="green"
onclick="sendCurrentEmail()"
>
📧 Send Email
</button>

</div>

</div>


<!-- CAMPAIGNS -->

<div
class="card"
style="margin-top:18px"
>

<h2>Campaigns</h2>

<input
id="search"
placeholder="Search campaigns..."
oninput="renderCampaigns()"
>

<div id="campaignList">
Loading campaigns...
</div>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
doc,
updateDoc,
deleteDoc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const campaignsRef =
collection(
db,
"emailCampaigns"
);


let campaigns = [];


/* =====================================================
   SAVE CAMPAIGN
===================================================== */

window.saveCampaign =
async function(){

const name =
document
.getElementById("name")
.value.trim();

const audience =
document
.getElementById("audience")
.value;

const email =
document
.getElementById("email")
.value.trim();

const subject =
document
.getElementById("subject")
.value.trim();

const message =
document
.getElementById("message")
.value.trim();

const schedule =
document
.getElementById("schedule")
.value;


if(!name){

alert(
"Enter campaign name."
);

return;

}


if(!subject){

alert(
"Enter email subject."
);

return;

}


if(!message){

alert(
"Enter email message."
);

return;

}


const data = {

name,

audience,

email,

subject,

message,

schedule:
schedule || null,

status:
schedule
? "scheduled"
: "draft",

updatedAt:
serverTimestamp()

};


try{

const id =
document
.getElementById("campaignId")
.value;


if(id){

await updateDoc(

doc(
db,
"emailCampaigns",
id
),

data

);

alert(
"Campaign updated successfully."
);

}else{

await addDoc(

campaignsRef,

{
...data,

createdAt:
serverTimestamp()

}

);

alert(
"Campaign created successfully."
);

}


clearForm();

await loadCampaigns();


}catch(error){

console.error(error);

alert(
"Unable to save campaign."
);

}

};


/* =====================================================
   LOAD
===================================================== */

async function loadCampaigns(){

try{

const snapshot =
await getDocs(
campaignsRef
);

campaigns = [];

snapshot.forEach(
item => {

campaigns.push({

id:item.id,

...item.data()

});

});

renderCampaigns();

}catch(error){

console.error(error);

document
.getElementById("campaignList")
.textContent =
"Unable to load campaigns.";

}

}


/* =====================================================
   RENDER
===================================================== */

window.renderCampaigns =
function(){

const query =
document
.getElementById("search")
.value
.toLowerCase();


const filtered =
campaigns.filter(
c =>
(c.name || "")
.toLowerCase()
.includes(query) ||

(c.subject || "")
.toLowerCase()
.includes(query)
);


const list =
document
.getElementById("campaignList");


list.innerHTML = "";


if(!filtered.length){

list.innerHTML =
"<p>No campaigns found.</p>";

updateStats();

return;

}


filtered.forEach(
c => {

const row =
document.createElement(
"div"
);

row.className =
"campaign";


row.innerHTML = `

<div>

<strong>
${escapeHtml(
c.name || "Untitled"
)}
</strong>

<br>

<small>
${escapeHtml(
c.subject || "No subject"
)}
</small>

<br>

<span class="badge">
${escapeHtml(
c.status || "draft"
)}
</span>

</div>


<div class="actions">

<button
onclick="editCampaign('${c.id}')"
>
Edit
</button>

<button
class="green"
onclick="sendCampaign('${c.id}')"
>
Send
</button>

<button
class="red"
onclick="deleteCampaign('${c.id}')"
>
Delete
</button>

</div>

`;


list.appendChild(row);

});


updateStats();

};


/* =====================================================
   STATS
===================================================== */

function updateStats(){

document
.getElementById("total")
.textContent =
campaigns.length;


document
.getElementById("drafts")
.textContent =
campaigns.filter(
x => x.status === "draft"
).length;


document
.getElementById("scheduled")
.textContent =
campaigns.filter(
x => x.status === "scheduled"
).length;


document
.getElementById("sent")
.textContent =
campaigns.filter(
x => x.status === "sent"
).length;

}


/* =====================================================
   EDIT
===================================================== */

window.editCampaign =
function(id){

const c =
campaigns.find(
x => x.id === id
);

if(!c)return;


document
.getElementById("campaignId")
.value =
c.id;


document
.getElementById("name")
.value =
c.name || "";


document
.getElementById("audience")
.value =
c.audience || "all";


document
.getElementById("email")
.value =
c.email || "";


document
.getElementById("subject")
.value =
c.subject || "";


document
.getElementById("message")
.value =
c.message || "";


document
.getElementById("schedule")
.value =
c.schedule || "";


previewMessage();

};


/* =====================================================
   DELETE
===================================================== */

window.deleteCampaign =
async function(id){

if(
!confirm(
"Delete this email campaign?"
)
)return;


try{

await deleteDoc(
doc(
db,
"emailCampaigns",
id
)
);

await loadCampaigns();

}catch(error){

console.error(error);

alert(
"Unable to delete campaign."
);

}

};


/* =====================================================
   PREVIEW
===================================================== */

window.previewMessage =
function(){

let message =
document
.getElementById("message")
.value;


message =
message.replaceAll(
"{{name}}",
"Student"
);


message =
message.replaceAll(
"{{course}}",
"Complete Web Development Course"
);


const subject =
document
.getElementById("subject")
.value;


document
.getElementById("preview")
.innerHTML = `

<h3>
${escapeHtml(
subject || "Email Subject"
)}
</h3>

<hr>

<div style="
white-space:pre-wrap;
line-height:1.6;
">
${escapeHtml(message)}
</div>

`;

};


/* =====================================================
   SEND CURRENT
===================================================== */

window.sendCurrentEmail =
function(){

const email =
document
.getElementById("email")
.value.trim();

const subject =
document
.getElementById("subject")
.value.trim();

let message =
document
.getElementById("message")
.value.trim();


if(!email){

alert(
"Enter recipient email."
);

return;

}


if(!subject){

alert(
"Enter email subject."
);

return;

}


if(!message){

alert(
"Enter email message."
);

return;

}


message =
message.replaceAll(
"{{name}}",
"Student"
);


sendEmail(
email,
subject,
message
);

};


/* =====================================================
   SEND CAMPAIGN
===================================================== */

window.sendCampaign =
async function(id){

const c =
campaigns.find(
x => x.id === id
);

if(!c)return;


if(!c.email){

alert(
"This campaign has no recipient email."
);

return;

}


let message =
c.message || "";


message =
message.replaceAll(
"{{name}}",
"Student"
);


await sendEmail(
c.email,
c.subject || "",
message
);


try{

await updateDoc(

doc(
db,
"emailCampaigns",
id
),

{
status:"sent",

updatedAt:
serverTimestamp()
}

);

await loadCampaigns();

}catch(error){

console.error(error);

}

};


/* =====================================================
   EMAIL SENDER
=====================================================

IMPORTANT:

Do NOT put SendGrid, Mailgun,
Resend, SMTP or other secret
API keys in this HTML.

Use a Firebase Cloud Function.

Example endpoint:

/api/send-email

===================================================== */

async function sendEmail(
email,
subject,
message
){

try{

/*

const response =
await fetch(
"https://YOUR-FUNCTION-URL",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

to:email,

subject:subject,

message:message

})
}
);

if(!response.ok){

throw new Error(
"Email sending failed."
);

}

alert(
"Email sent successfully."
);

*/


/* DEMO */

console.log(
"Email:",
{
to:email,
subject,
message
}
);


alert(
"Email prepared successfully.\n\n" +
"Connect your Firebase Cloud Function/email provider to enable real sending."
);


}catch(error){

console.error(error);

alert(
"Email sending failed."
);

}

}


/* =====================================================
   CLEAR
===================================================== */

window.clearForm =
function(){

document
.getElementById("campaignId")
.value = "";


document
.getElementById("name")
.value = "";


document
.getElementById("audience")
.value =
"all";


document
.getElementById("email")
.value = "";


document
.getElementById("subject")
.value = "";


document
.getElementById("message")
.value = "";


document
.getElementById("schedule")
.value = "";


document
.getElementById("preview")
.innerHTML =
"<p>Your email preview will appear here.</p>";

};


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* =====================================================
   START
===================================================== */

loadCampaigns();

</script>

</body>
</html>
