<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Email Verification | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#17243a;
}
header{
  background:#102b55;
  color:white;
  padding:20px;
}
header h2{margin:0;font-size:21px}
header p{margin:6px 0 0;color:#d8e5fa;font-size:13px}
.container{max-width:510px;width:92%;margin:45px auto}
.card{
  background:white;
  padding:28px;
  border-radius:15px;
  box-shadow:0 5px 25px #17243a0c;
  text-align:center;
}
.icon{
  width:75px;height:75px;
  margin:0 auto 20px;
  border-radius:50%;
  background:#eaf1ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}
h1{font-size:25px;margin:0 0 12px}
p{font-size:14px;color:#64748b;line-height:1.7}
.email{
  background:#f1f5f9;
  padding:13px;
  border-radius:8px;
  color:#173b70;
  font-weight:bold;
  overflow-wrap:anywhere;
  margin:18px 0;
}
button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:8px;
  background:#185adb;
  color:white;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  margin-top:12px;
}
button:disabled{opacity:.6;cursor:not-allowed}
.secondary{background:#eaf0fa;color:#173b70}
.message{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-top:16px;
  font-size:13px;
  line-height:1.5;
  text-align:left;
}
.success{display:block;background:#e8f8ef;color:#176b3a}
.error{display:block;background:#fff0f0;color:#a32020}
.verified{display:none;background:#e8f8ef;color:#176b3a;padding:13px;border-radius:8px}
.links{margin-top:22px;font-size:13px}
a{color:#185adb;text-decoration:none}
footer{text-align:center;padding:25px;color:#718096;font-size:12px}
</style>

<meta name="description" content="LetsStudy Pro Learn. Build. Work. Grow. Verify Your Email Please verify your email address to help secure your account. Your email address has been confirm">

<link rel="canonical" href="https://letsstudy.pro/email-verification.html">

<meta property="og:title" content="Email Verification | LetsStudy Pro">

<meta property="og:url" content="https://letsstudy.pro/email-verification.html">

<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">

</head>

<body>

<header>
<h2>LetsStudy Pro</h2>
<p>Learn. Build. Work. Grow.</p>
</header>

<main class="container">
<section class="card">

<div class="icon" id="statusIcon">✉</div>

<h1 id="pageTitle">Verify Your Email</h1>

<p id="description">
Please verify your email address to help secure your account.
</p>

<div class="email" id="emailAddress">Loading account...</div>

<div class="verified" id="verifiedBox">
<strong>Email successfully verified!</strong>
<p>Your email address has been confirmed.</p>
</div>

<div id="actionArea">
<button type="button" id="sendBtn">Send Verification Email</button>
<button type="button" class="secondary" id="checkBtn">
I've Verified My Email
</button>
</div>

<div id="message" class="message" role="status"></div>

<div class="links">
<a href="profile.html">My Profile</a> |
<a href="dashboard.html">Dashboard</a> |
<a href="login.html" id="loginLink">Sign In</a>
</div>

</section>
</main>

<footer>
© <span id="year"></span> LetsStudy Pro. All rights reserved.
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbKXjsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const $ = id => document.getElementById(id);

let currentUser = null;
let sending = false;

function showMessage(text,type){
  $("message").textContent = text;
  $("message").className = "message " + type;
}

function showVerified(){
  $("statusIcon").textContent = "✓";
  $("pageTitle").textContent = "Email Verified";
  $("description").textContent =
    "Your email address has been successfully verified.";
  $("verifiedBox").style.display = "block";
  $("actionArea").style.display = "none";
}

async function updateFirestoreVerification(user){
  await db.collection("users").doc(user.uid).set({
    email: user.email || "",
    emailVerified: true,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true});
}

auth.onAuthStateChanged(async user => {
  if(!user){
    $("emailAddress").textContent = "No signed-in account";
    $("pageTitle").textContent = "Sign In Required";
    $("description").textContent =
      "Please sign in before verifying your email address.";
    $("actionArea").style.display = "none";
    return;
  }

  currentUser = user;
  $("emailAddress").textContent = user.email || "No email available";

  try{
    await user.reload();
    currentUser = auth.currentUser;

    if(currentUser.emailVerified){
      await updateFirestoreVerification(currentUser);
      showVerified();
    }else{
      $("pageTitle").textContent = "Verify Your Email";
      $("description").textContent =
        "We need to confirm that you own this email address. Open the verification link sent to your inbox.";
    }
  }catch(error){
    console.error(error);
    showMessage("Unable to check verification status. Please try again.","error");
  }
});

$("sendBtn").addEventListener("click",async()=>{
  if(!currentUser || sending) return;

  sending = true;
  $("sendBtn").disabled = true;
  $("sendBtn").textContent = "Sending...";

  try{
    await currentUser.reload();
    currentUser = auth.currentUser;

    if(currentUser.emailVerified){
      await updateFirestoreVerification(currentUser);
      showVerified();
      return;
    }

    await currentUser.sendEmailVerification();

    showMessage(
      "Verification email sent. Check your inbox and spam folder, then open the verification link.",
      "success"
    );

  }catch(error){
    console.error(error);

    let errorText = "Unable to send verification email. Please try again.";

    if(error.code === "auth/too-many-requests"){
      errorText = "Too many requests. Please wait before trying again.";
    }else if(error.code === "auth/network-request-failed"){
      errorText = "Network error. Check your internet connection.";
    }else if(error.code === "auth/invalid-email"){
      errorText = "Your account email address is invalid.";
    }

    showMessage(errorText,"error");

  }finally{
    sending = false;
    $("sendBtn").disabled = false;
    $("sendBtn").textContent = "Send Verification Email";
  }
});

$("checkBtn").addEventListener("click",async()=>{
  if(!currentUser) return;

  $("checkBtn").disabled = true;
  $("checkBtn").textContent = "Checking...";

  try{
    await currentUser.reload();
    currentUser = auth.currentUser;

    if(currentUser.emailVerified){
      await updateFirestoreVerification(currentUser);
      showVerified();
    }else{
      showMessage(
        "Your email is not verified yet. Open the verification link in your email, then check again.",
        "error"
      );
    }
  }catch(error){
    console.error(error);
    showMessage("Unable to check your email status. Try again.","error");
  }finally{
    $("checkBtn").disabled = false;
    $("checkBtn").textContent = "I've Verified My Email";
  }
});

$("year").textContent = new Date().getFullYear();
</script>



</body></html>
