<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Verify Email | LetsStudy Pro</title>

  <meta
    name="description"
    content="Verify your LetsStudy Pro account email securely."
  >

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{

      min-height:100vh;

      display:flex;

      align-items:center;

      justify-content:center;

      padding:20px;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eff6ff,
          #f8fafc,
          #f5f3ff
        );

      color:#0f172a;

    }

    .verify-card{

      width:100%;

      max-width:440px;

      padding:32px 25px;

      background:#fff;

      border:
        1px solid
        #e2e8f0;

      border-radius:24px;

      text-align:center;

      box-shadow:
        0 25px 70px
        rgba(15,23,42,.10);

    }

    .logo{

      width:58px;
      height:58px;

      margin:0 auto 18px;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:17px;

      color:#fff;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      font-size:27px;

      box-shadow:
        0 12px 28px
        rgba(37,99,235,.20);

    }

    h1{

      margin-bottom:9px;

      font-size:23px;

      font-weight:900;

      letter-spacing:-.5px;

    }

    .subtitle{

      margin-bottom:22px;

      color:#64748b;

      font-size:12px;

      line-height:1.7;

    }

    .email-box{

      margin-bottom:18px;

      padding:13px;

      border:
        1px solid
        #dbeafe;

      border-radius:12px;

      background:#eff6ff;

      color:#1e40af;

      font-size:11px;

      font-weight:700;

      word-break:break-word;

    }

    .status{

      display:none;

      margin-bottom:15px;

      padding:12px;

      border-radius:10px;

      font-size:10px;

      line-height:1.6;

    }

    .status.show{

      display:block;

    }

    .status.error{

      color:#991b1b;

      background:#fef2f2;

      border:
        1px solid
        #fecaca;

    }

    .status.success{

      color:#166534;

      background:#f0fdf4;

      border:
        1px solid
        #bbf7d0;

    }

    .btn{

      width:100%;

      min-height:50px;

      margin-top:9px;

      border:0;

      border-radius:12px;

      font-size:12px;

      font-weight:800;

      cursor:pointer;

      transition:.2s ease;

    }

    .primary{

      color:#fff;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      box-shadow:
        0 10px 25px
        rgba(37,99,235,.18);

    }

    .primary:hover{

      transform:
        translateY(-1px);

    }

    .secondary{

      color:#334155;

      background:#f8fafc;

      border:
        1px solid
        #e2e8f0;

    }

    .btn:disabled{

      opacity:.5;

      cursor:not-allowed;

      transform:none;

    }

    .logout{

      margin-top:16px;

      border:0;

      background:none;

      color:#64748b;

      font-size:10px;

      cursor:pointer;

    }

    .logout:hover{

      color:#dc2626;

    }

    .loader{

      display:none;

      width:18px;
      height:18px;

      margin:auto;

      border:
        2px solid
        rgba(255,255,255,.4);

      border-top-color:#fff;

      border-radius:50%;

      animation:
        spin .7s linear infinite;

    }

    .loader.show{

      display:block;

    }

    .btn-text.hidden{

      display:none;

    }

    @keyframes spin{

      to{
        transform:rotate(360deg);
      }

    }

    .footer{

      margin-top:22px;

      color:#94a3b8;

      font-size:9px;

      line-height:1.6;

    }

    @media(max-width:420px){

      .verify-card{

        padding:27px 18px;

        border-radius:20px;

      }

      h1{

        font-size:20px;

      }

    }

  </style>

</head>

<body>


  <main class="verify-card">

    <div class="logo">
      ✉️
    </div>


    <h1>
      Verify Your Email
    </h1>


    <p class="subtitle">

      We've sent a verification link to your email
      address. Please verify your email before
      continuing to LetsStudy Pro.

    </p>


    <div
      id="userEmail"
      class="email-box"
    >
      Loading...
    </div>


    <div
      id="status"
      class="status"
    ></div>


    <button
      id="checkBtn"
      class="btn primary"
      type="button"
    >

      <span
        id="checkText"
        class="btn-text"
      >
        I've Verified My Email
      </span>

      <span
        id="checkLoader"
        class="loader"
      ></span>

    </button>


    <button
      id="resendBtn"
      class="btn secondary"
      type="button"
    >

      Resend Verification Email

    </button>


    <button
      id="logoutBtn"
      class="logout"
      type="button"
    >

      Sign out and use another account

    </button>


    <div class="footer">

      🔒 Your account security is important to us.

      <br>

      ©
      <span id="year"></span>
      LetsStudy Pro

    </div>

  </main>


  <script type="module">

    import {

      initializeApp

    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {

      getAuth,

      onAuthStateChanged,

      sendEmailVerification,

      reload,

      signOut

    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =====================================================
       FIREBASE CONFIG
    ====================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

      measurementId:
        "G-M7Z6SPNH1N"

    };


    /* =====================================================
       INITIALIZE FIREBASE
    ====================================================== */

    const app =
      initializeApp(
        firebaseConfig
      );


    const auth =
      getAuth(
        app
      );


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const userEmail =
      document.getElementById(
        "userEmail"
      );


    const statusBox =
      document.getElementById(
        "status"
      );


    const checkBtn =
      document.getElementById(
        "checkBtn"
      );


    const resendBtn =
      document.getElementById(
        "resendBtn"
      );


    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );


    const checkText =
      document.getElementById(
        "checkText"
      );


    const checkLoader =
      document.getElementById(
        "checkLoader"
      );


    /* =====================================================
       VARIABLES
    ====================================================== */

    let currentUser =
      null;

    let resendCooldown =
      false;


    /* =====================================================
       STATUS
    ====================================================== */

    function showStatus(
      message,
      type
    ){

      statusBox.textContent =
        message;

      statusBox.className =
        `status show ${type}`;

    }


    function clearStatus(){

      statusBox.textContent =
        "";

      statusBox.className =
        "status";

    }


    /* =====================================================
       AUTH STATE
    ====================================================== */

    onAuthStateChanged(
      auth,
      async user => {

        currentUser =
          user;


        if(!user){

          window.location.href =
            "login.html";

          return;

        }


        userEmail.textContent =
          user.email ||
          "Email address";


        try{

          await reload(
            user
          );


          if(
            auth.currentUser.emailVerified
          ){

            showStatus(
              "Your email is already verified. Redirecting...",
              "success"
            );


            setTimeout(
              () => {

                window.location.href =
                  "dashboard.html";

              },
              1200
            );


            return;

          }

        }catch(error){

          console.error(
            error
          );

        }

      }
    );


    /* =====================================================
       CHECK VERIFICATION
    ====================================================== */

    checkBtn.addEventListener(
      "click",
      async () => {

        if(!currentUser){

          return;

        }


        checkBtn.disabled =
          true;


        checkText.classList.add(
          "hidden"
        );


        checkLoader.classList.add(
          "show"
        );


        clearStatus();


        try{

          await reload(
            currentUser
          );


          currentUser =
            auth.currentUser;


          if(
            currentUser.emailVerified
          ){

            showStatus(
              "Email verified successfully! Welcome to LetsStudy Pro.",
              "success"
            );


            if(
              typeof gtag ===
              "function"
            ){

              gtag(
                "event",
                "email_verified"
              );

            }


            setTimeout(
              () => {

                window.location.href =
                  "dashboard.html";

              },
              1000
            );

          }else{

            showStatus(
              "Your email is not verified yet. Please open the verification email and click the verification link.",
              "error"
            );

            checkBtn.disabled =
              false;

          }

        }catch(error){

          console.error(
            error
          );


          showStatus(
            "Unable to check verification status. Please try again.",
            "error"
          );

          checkBtn.disabled =
            false;

        }


        checkText.classList.remove(
          "hidden"
        );

        checkLoader.classList.remove(
          "show"
        );

      }
    );


    /* =====================================================
       RESEND VERIFICATION EMAIL
    ====================================================== */

    resendBtn.addEventListener(
      "click",
      async () => {

        if(!currentUser){

          return;

        }


        if(resendCooldown){

          return;

        }


        clearStatus();


        resendBtn.disabled =
          true;


        try{

          await sendEmailVerification(
            currentUser
          );


          showStatus(
            "Verification email sent. Please check your inbox and spam folder.",
            "success"
          );


          resendCooldown =
            true;


          let seconds =
            60;


          resendBtn.textContent =
            `Resend available in ${seconds}s`;


          const timer =
            setInterval(
              () => {

                seconds--;


                resendBtn.textContent =
                  `Resend available in ${seconds}s`;


                if(
                  seconds <= 0
                ){

                  clearInterval(
                    timer
                  );


                  resendCooldown =
                    false;


                  resendBtn.disabled =
                    false;


                  resendBtn.textContent =
                    "Resend Verification Email";

                }

              },
              1000
            );


        }catch(error){

          console.error(
            error
          );


          resendBtn.disabled =
            false;


          if(
            error.code ===
            "auth/too-many-requests"
          ){

            showStatus(
              "Too many verification emails were requested. Please wait a while before trying again.",
              "error"
            );

          }else{

            showStatus(
              "Unable to send verification email. Please try again.",
              "error"
            );

          }

        }

      }
    );


    /* =====================================================
       SIGN OUT
    ====================================================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try{

          await signOut(
            auth
          );


          window.location.href =
            "login.html";

        }catch(error){

          console.error(
            error
          );

        }

      }
    );


    /* =====================================================
       YEAR
    ====================================================== */

    document
      .getElementById(
        "year"
      )
      .textContent =
      new Date()
        .getFullYear();

  </script>

</body>
</html>
