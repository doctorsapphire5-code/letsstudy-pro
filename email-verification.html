<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Email Verification | LetsStudy Pro</title>

<meta name="description"
      content="Verify your email address to continue using LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:460px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:34px 28px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
  text-align:center;
}

.logo{
  width:62px;
  height:62px;
  margin:0 auto 18px;
  border-radius:16px;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:800;
}

h1{
  margin:0 0 10px;
  font-size:26px;
}

.subtitle{
  color:#667085;
  line-height:1.6;
  margin-bottom:22px;
}

.email-box{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  padding:13px;
  border-radius:10px;
  font-weight:600;
  word-break:break-word;
  margin-bottom:20px;
}

.icon{
  font-size:52px;
  margin-bottom:12px;
}

.alert{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:18px;
  font-size:14px;
  line-height:1.5;
}

.alert.success{
  display:block;
  background:#ecfdf3;
  color:#067647;
  border:1px solid #abefc6;
}

.alert.error{
  display:block;
  background:#fef3f2;
  color:#b42318;
  border:1px solid #fecdca;
}

.alert.info{
  display:block;
  background:#eff8ff;
  color:#175cd3;
  border:1px solid #b2ddff;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2ff;
  color:#1d4ed8;
}

.danger{
  background:#fef2f2;
  color:#b42318;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.status{
  margin:18px 0 4px;
  font-size:14px;
  color:#667085;
}

.loader{
  display:inline-block;
  width:17px;
  height:17px;
  border:2px solid #dbeafe;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
  margin-right:7px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.footer{
  text-align:center;
  color:#98a2b3;
  font-size:12px;
  margin-top:20px;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">LS</div>

    <div class="icon">📧</div>

    <h1>Verify Your Email</h1>

    <p class="subtitle">
      We sent a verification link to your email address.
      Please open your email and click the verification link
      to continue to LetsStudy Pro.
    </p>

    <div id="emailBox" class="email-box">
      Loading...
    </div>

    <div id="alertBox" class="alert"></div>

    <button
      id="checkBtn"
      class="primary"
      type="button">
      I've Verified My Email
    </button>

    <button
      id="resendBtn"
      class="secondary"
      type="button">
      Resend Verification Email
    </button>

    <button
      id="logoutBtn"
      class="danger"
      type="button">
      Sign Out
    </button>

    <div id="statusText" class="status">
      Checking your account...
    </div>

  </div>

  <div class="footer">
    © 2026 LetsStudy Pro. All rights reserved.
  </div>

</div>


<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  sendEmailVerification,
  reload,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const emailBox =
  document.getElementById("emailBox");

const alertBox =
  document.getElementById("alertBox");

const checkBtn =
  document.getElementById("checkBtn");

const resendBtn =
  document.getElementById("resendBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const statusText =
  document.getElementById("statusText");


/* =========================
   ALERT
========================= */

function showAlert(
  message,
  type = "info"
){

  alertBox.textContent =
    message;

  alertBox.className =
    "alert " + type;
}


/* =========================
   STATUS
========================= */

function setStatus(
  message,
  loading = false
){

  statusText.innerHTML =
    loading
      ? `<span class="loader"></span>${message}`
      : message;
}


/* =========================
   CREATE / UPDATE USER
========================= */

async function ensureUserProfile(
  user
){

  if(!user){
    return;
  }

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );

  const snapshot =
    await getDoc(userRef);

  if(!snapshot.exists()){

    await setDoc(
      userRef,
      {
        uid:user.uid,
        email:user.email || "",
        displayName:
          user.displayName || "",
        photoURL:
          user.photoURL || "",

        role:"student",
        status:"active",

        emailVerified:
          user.emailVerified,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp(),

        lastLoginAt:
          serverTimestamp(),

        points:0,
        level:1,
        xp:0,
        walletBalance:0,

        premium:false,
        premiumPlan:"",
        premiumExpiresAt:null
      }
    );

  }else{

    await setDoc(
      userRef,
      {
        emailVerified:
          user.emailVerified,

        updatedAt:
          serverTimestamp()
      },
      {
        merge:true
      }
    );
  }
}


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if(!user){

      showAlert(
        "You are not signed in. Redirecting to login...",
        "error"
      );

      setStatus(
        "Redirecting..."
      );

      setTimeout(
        () => {
          window.location.href =
            "login.html";
        },
        1200
      );

      return;
    }


    emailBox.textContent =
      user.email || "Your email";


    try{

      await reload(user);

      if(user.emailVerified){

        await ensureUserProfile(user);

        showAlert(
          "Your email has been verified successfully.",
          "success"
        );

        setStatus(
          "Verification complete. Redirecting..."
        );

        checkBtn.disabled = true;
        resendBtn.disabled = true;

        /*
         * Verified user flow:
         *
         * email-verification
         *        ↓
         * create-profile
         *        ↓
         * dashboard
         */

        setTimeout(
          async () => {

            const profileRef =
              doc(
                db,
                "users",
                user.uid
              );

            const profileSnapshot =
              await getDoc(profileRef);

            if(
              !profileSnapshot.exists()
            ){

              window.location.href =
                "create-profile.html";

              return;
            }

            const profile =
              profileSnapshot.data();

            /*
             * If profile has not been
             * completed, continue to
             * create-profile.
             */

            if(
              !profile.profileCompleted
            ){

              window.location.href =
                "create-profile.html";

              return;
            }

            window.location.href =
              "dashboard.html";

          },
          1200
        );

        return;
      }


      showAlert(
        "Your email is not verified yet. Check your inbox and click the verification link.",
        "info"
      );

      setStatus(
        "Waiting for email verification..."
      );

    }catch(error){

      console.error(
        "Verification check error:",
        error
      );

      showAlert(
        "Unable to check verification status. Please try again.",
        "error"
      );

      setStatus(
        "Verification check failed."
      );
    }

  }
);


/* =========================
   CHECK VERIFICATION
========================= */

checkBtn.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;

    if(!user){

      window.location.href =
        "login.html";

      return;
    }

    checkBtn.disabled = true;

    setStatus(
      "Checking verification...",
      true
    );

    try{

      await reload(user);

      if(user.emailVerified){

        await ensureUserProfile(user);

        showAlert(
          "Email verified successfully!",
          "success"
        );

        setStatus(
          "Redirecting..."
        );

        setTimeout(
          () => {
            window.location.href =
              "create-profile.html";
          },
          1000
        );

      }else{

        showAlert(
          "Email is still not verified. Please click the verification link in your email.",
          "info"
        );

        setStatus(
          "Waiting for verification..."
        );

        checkBtn.disabled = false;
      }

    }catch(error){

      console.error(error);

      showAlert(
        error.message ||
        "Could not check verification.",
        "error"
      );

      setStatus(
        "Please try again."
      );

      checkBtn.disabled = false;
    }

  }
);


/* =========================
   RESEND EMAIL
========================= */

resendBtn.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;

    if(!user){

      window.location.href =
        "login.html";

      return;
    }

    if(user.emailVerified){

      showAlert(
        "Your email is already verified.",
        "success"
      );

      return;
    }

    resendBtn.disabled = true;

    setStatus(
      "Sending verification email...",
      true
    );

    try{

      await sendEmailVerification(
        user
      );

      showAlert(
        "Verification email sent. Please check your inbox and spam folder.",
        "success"
      );

      setStatus(
        "Verification email sent."
      );

      /*
       * Prevent accidental spam.
       * Button becomes available again
       * after 30 seconds.
       */

      let seconds = 30;

      resendBtn.textContent =
        `Resend Email (${seconds}s)`;

      const timer =
        setInterval(
          () => {

            seconds--;

            resendBtn.textContent =
              `Resend Email (${seconds}s)`;

            if(seconds <= 0){

              clearInterval(timer);

              resendBtn.disabled =
                false;

              resendBtn.textContent =
                "Resend Verification Email";
            }

          },
          1000
        );

    }catch(error){

      console.error(
        "Resend error:",
        error
      );

      let message =
        "Unable to send verification email.";

      if(
        error.code ===
        "auth/too-many-requests"
      ){

        message =
          "Too many verification requests. Please wait and try again later.";
      }

      showAlert(
        message,
        "error"
      );

      setStatus(
        "Verification email was not sent."
      );

      resendBtn.disabled =
        false;
    }

  }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    logoutBtn.disabled =
      true;

    try{

      await signOut(auth);

      window.location.href =
        "login.html";

    }catch(error){

      console.error(
        "Logout error:",
        error
      );

      showAlert(
        "Unable to sign out. Please try again.",
        "error"
      );

      logoutBtn.disabled =
        false;
    }

  }
);

</script>

</body>
</html>
