<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(840px,92%);margin:0 auto;padding:44px 0 70px}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0}
.btn{border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.bad{background:#dc2626;color:#fff}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}.btn.bad{color:#fff}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{flex:none;border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.tab i{font-style:normal;margin-left:6px;background:var(--soft);border-radius:999px;padding:0 8px;font-size:12px}
.search{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px;margin-bottom:14px}
.search:focus,.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.c{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.c h2{margin:0;font-size:18px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.sj{margin:2px 0 0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.pv{margin:10px 0 0;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c,#64748b) 16%,transparent);color:var(--c,#64748b);white-space:nowrap}
.s-scheduled,.s-queued{--c:#2563eb}.s-sending{--c:#d97706}.s-sent{--c:#16a34a}.s-failed{--c:#dc2626}
@media(prefers-color-scheme:dark){.s-scheduled,.s-queued{--c:#60a5fa}.s-sending{--c:#fbbf24}.s-sent{--c:#4ade80}.s-failed{--c:#f87171}}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
dialog{border:0;border-radius:18px;padding:0;width:min(600px,94vw);max-height:92vh;background:var(--paper);color:var(--text);box-shadow:0 25px 60px rgba(2,6,23,.4)}
dialog::backdrop{background:rgba(2,6,23,.6)}
.f{padding:22px;overflow:auto;max-height:92vh}
.f h2{margin:0 0 12px;font-size:22px;color:var(--ink)}
.f label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:12px 0 6px}
.f input,.f select,.f textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.f textarea{min-height:170px;resize:vertical}
.f small{color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f .act{margin-top:20px;justify-content:flex-end}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.two{grid-template-columns:1fr}.c{padding:14px 16px}.top{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="emailCompaigns.html" aria-current="page">Campaigns</a>
  </nav>
</div></header>

<main class="wrap">
  <div class="head">
    <h1>Email Campaigns</h1>
    <button class="btn" id="newBtn" type="button" hidden="">New campaign</button>
  </div>

  <div id="app" hidden="">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="all" aria-selected="true">All<i id="n-all">0</i></button>
      <button class="tab" role="tab" data-v="draft" aria-selected="false">Drafts<i id="n-draft">0</i></button>
      <button class="tab" role="tab" data-v="scheduled" aria-selected="false">Scheduled<i id="n-scheduled">0</i></button>
      <button class="tab" role="tab" data-v="sent" aria-selected="false">Sent<i id="n-sent">0</i></button>
    </div>
    <input id="search" class="search" type="search" placeholder="Search campaigns" aria-label="Search campaigns">
    <section id="list"></section>
  </div>
  <div id="msg"></div>
</main>

<dialog id="dlg">
  <div class="f">
    <h2 id="dt">New campaign</h2>
    <label for="fn">Campaign name</label><input id="fn" maxlength="80" placeholder="e.g. October newsletter">
    <label for="fs">Subject</label><input id="fs" maxlength="150" placeholder="Subject line recipients will see">
    <div class="two">
      <div><label for="fa">Audience</label>
        <select id="fa"><option value="all">All users</option><option value="student">Students</option><option value="instructor">Instructors</option><option value="admin">Admins</option><option value="subscribers">Subscribers</option></select></div>
      <div><label for="fw">Send at</label><input id="fw" type="datetime-local"></div>
    </div>
    <small>Leave "Send at" empty to send as soon as possible.</small>
    <label for="fe">Sender email (reply-to)</label><input id="fe" type="email" placeholder="hello@letsstudy.pro">
    <label for="fm">Message</label><textarea id="fm" placeholder="Write your email. Plain text or HTML."></textarea>
    <div class="act">
      <button class="btn alt" id="cancel" type="button">Cancel</button>
      <button class="btn alt" id="saveDraft" type="button">Save draft</button>
      <button class="btn" id="schedule" type="button">Schedule</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>
<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const COL="emailCompaigns"; /* spelled exactly as in Firestore */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const cap=s=>s?String(s)[0].toUpperCase()+String(s).slice(1):s;
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}

const AUD={all:"All users",student:"Students",instructor:"Instructors",admin:"Admins",subscribers:"Subscribers"};
const group=c=>{const s=String(c.status||"draft").toLowerCase();
  return /^(sent|delivered|completed)$/.test(s)?"sent":/^(scheduled|queued|sending)$/.test(s)?"scheduled":"draft"};
const locked=c=>/^(sending|sent|delivered|completed)$/i.test(c.status||"");

let user=null,camps=[],view="all",editing=null,unsub=null;
const localInput=iso=>{const d=toD(iso);if(!d)return "";const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};

function card(c){
  const st=String(c.status||"draft").toLowerCase(),w=toD(c.schedule),u=toD(c.updatedAt||c.createdAt);
  const prev=String(c.message||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
  return `<article class="c">
    <div class="top"><div><h2>${esc(c.name||"Untitled campaign")}</h2><p class="sj">${esc(c.subject||"No subject")}</p></div><span class="b s-${esc(st)}">${esc(cap(st))}</span></div>
    ${prev?`<p class="pv">${esc(prev)}</p>`:""}
    <div class="meta"><span>To: ${esc(AUD[c.audience]||cap(c.audience)||"All users")}</span>
      ${w?`<span>${group(c)==="sent"?"Sent":"Scheduled for"} ${esc(w.toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</span>`:""}
      ${u?`<span>Updated ${esc(ago(u))}</span>`:""}</div>
    <div class="act">
      ${locked(c)?"":`<button class="btn alt sm" type="button" data-edit="${esc(c.id)}">Edit</button>`}
      ${group(c)==="scheduled"&&!locked(c)?`<button class="btn alt sm" type="button" data-unsched="${esc(c.id)}">Unschedule</button>`:""}
      <button class="btn alt sm" type="button" data-dup="${esc(c.id)}">Duplicate</button>
      <button class="btn bad sm" type="button" data-del="${esc(c.id)}">Delete</button></div>
  </article>`;
}

function render(){
  for(const k of ["all","draft","scheduled","sent"])$("#n-"+k).textContent=k==="all"?camps.length:camps.filter(c=>group(c)===k).length;
  const q=$("#search").value.toLowerCase().trim();
  const items=camps.filter(c=>(view==="all"||group(c)===view)&&(!q||[c.name,c.subject,c.message].join(" ").toLowerCase().includes(q)));
  $("#list").innerHTML=items.length?items.map(card).join(""):
    `<div class="state"><h2>${camps.length?"No campaigns here":"No campaigns yet"}</h2><p>${camps.length?"Try another tab or search.":"Create your first campaign to reach your audience."}</p>${camps.length?"":`<button class="btn" type="button" data-new="1">New campaign</button>`}</div>`;
}
$("#search").addEventListener("input",render);
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  view=t.dataset.v;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  render();
}));

/* ---- editor ---- */
function openEditor(c){
  editing=c||null;
  $("#dt").textContent=c?"Edit campaign":"New campaign";
  $("#fn").value=c?.name||"";$("#fs").value=c?.subject||"";$("#fa").value=c?.audience||"all";
  $("#fw").value=localInput(c?.schedule);$("#fe").value=c?.email||"";$("#fm").value=c?.message||"";
  $("#dlg").showModal();$("#fn").focus();
}
$("#newBtn").addEventListener("click",()=>openEditor());
$("#list").addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("[data-new]"))return openEditor();
  const ed=t.closest("[data-edit]");if(ed)return openEditor(camps.find(c=>c.id===ed.dataset.edit));
  const un=t.closest("[data-unsched]");
  if(un){try{await updateDoc(doc(db,COL,un.dataset.unsched),{status:"draft",updatedAt:new Date().toISOString()});toast("Moved back to drafts")}catch(err){console.error(err);toast("Could not update the campaign")}return}
  const dp=t.closest("[data-dup]");
  if(dp){
    const c=camps.find(x=>x.id===dp.dataset.dup),ref=doc(collection(db,COL)),now=new Date().toISOString();
    try{await setDoc(ref,{compaignId:ref.id,audience:c.audience||"all",createdAt:now,email:c.email||"",message:c.message||"",name:`${c.name||"Campaign"} (copy)`,schedule:"",status:"draft",subject:c.subject||"",updatedAt:now});toast("Duplicated as a draft")}
    catch(err){console.error(err);toast("Could not duplicate the campaign")}
    return;
  }
  const dl=t.closest("[data-del]");
  if(dl&&confirm("Delete this campaign permanently?")){
    try{await deleteDoc(doc(db,COL,dl.dataset.del));toast("Campaign deleted")}catch(err){console.error(err);toast("Could not delete the campaign")}
  }
});
$("#cancel").addEventListener("click",()=>$("#dlg").close());

async function save(asStatus,btn){
  const name=$("#fn").value.trim(),subject=$("#fs").value.trim(),message=$("#fm").value.trim(),email=$("#fe").value.trim();
  if(!name){toast("Enter a campaign name");return}
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast("Enter a valid sender email");return}
  if(asStatus==="scheduled"&&(!subject||!message)){toast("Add a subject and message before scheduling");return}
  const w=$("#fw").value,when=w?new Date(w):null;
  if(w&&isNaN(when)){toast("Enter a valid send time");return}
  const now=new Date().toISOString();
  const data={audience:$("#fa").value,email,message,name,
    schedule:asStatus==="scheduled"?(when||new Date()).toISOString():(when?when.toISOString():""),
    status:asStatus,subject,updatedAt:now};
  btn.disabled=true;
  try{
    if(editing)await updateDoc(doc(db,COL,editing.id),data);
    else{const ref=doc(collection(db,COL));await setDoc(ref,{compaignId:ref.id,createdAt:now,...data})}
    $("#dlg").close();toast(asStatus==="scheduled"?"Campaign scheduled":"Draft saved");
  }catch(err){console.error(err);toast("Could not save the campaign")}
  btn.disabled=false;
}
$("#saveDraft").addEventListener("click",e=>save("draft",e.currentTarget));
$("#schedule").addEventListener("click",e=>save("scheduled",e.currentTarget));

/* ---- access: admins and moderators only ---- */
async function checkAdmin(u){
  for(const [c,ok] of [["admins",s=>s.exists()],["users",s=>s.exists()&&/admin|moderator/i.test(String(s.data().role||""))]]){
    try{if(ok(await getDoc(doc(db,c,u.uid))))return true}catch{}
  }
  return false;
}
function gate(title,text,link){
  $("#app").hidden=true;$("#newBtn").hidden=true;
  $("#msg").innerHTML=`<div class="state"><h2>${title}</h2><p>${text}</p>${link||""}</div>`;
}
function fail(err){
  console.error(err);$("#app").hidden=true;
  $("#msg").innerHTML=`<div class="state err"><h2>Unable to load campaigns</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",listen);
}
function listen(){
  if(unsub)unsub();
  unsub=onSnapshot(collection(db,COL),snap=>{
    camps=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(toD(b.createdAt)||0)-(toD(a.createdAt)||0));
    $("#msg").innerHTML="";$("#app").hidden=false;$("#newBtn").hidden=false;
    render();
  },fail);
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,async u=>{
  user=u;if(unsub){unsub();unsub=null}
  if(!u)return gate("Sign in to manage campaigns","Email campaigns are available to administrators.",`<a class="btn" href="login.html">Sign in</a>`);
  if(!(await checkAdmin(u)))return gate("Administrators only","Your account does not have access to email campaigns.");
  listen();
});
</script>


</body></html>
