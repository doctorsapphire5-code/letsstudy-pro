<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Enroll Course | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
height:65px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5%
}

.logo{
font-size:21px;
font-weight:800;
color:#2563eb
}

header a{
text-decoration:none;
color:#475569
}

main{
max-width:900px;
margin:35px auto;
padding:0 15px
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
padding:25px;
margin-bottom:20px
}

.course{
display:flex;
gap:18px;
align-items:center
}

.course img{
width:130px;
height:90px;
border-radius:10px;
object-fit:cover;
background:#e5e7eb
}

.course h1{
font-size:24px;
margin:0 0 8px
}

.course p{
margin:0;
color:#64748b
}

.price{
font-size:25px;
font-weight:800;
color:#2563eb
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.info div{
padding:14px;
background:#f8fafc;
border-radius:9px
}

.info small{
display:block;
color:#64748b;
margin-bottom:5px
}

.btn{
width:100%;
padding:14px;
border:0;
border-radius:9px;
font-weight:800;
cursor:pointer;
font-size:15px
}

.enroll{
background:#2563eb;
color:#fff
}

.login{
background:#0f172a;
color:#fff
}

.success{
text-align:center;
padding:35px
}

.success i{
font-size:50px;
color:#16a34a;
margin-bottom:15px
}

.message{
font-size:13px;
margin-top:12px;
text-align:center
}

.loading{
text-align:center;
padding:70px;
color:#64748b
}

.error{
text-align:center;
padding:70px 20px
}

@media(max-width:650px){

.course{
flex-direction:column;
align-items:flex-start
}

.course img{
width:100%;
height:180px
}

.info{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<a href="courses.html">
<i class="fa fa-arrow-left"></i>
Courses
</a>

</header>


<main>

<div id="app">

<div class="loading">
<i class="fa fa-spinner fa-spin"></i>
Loading...
</div>

</div>

</main>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getFirestore,
doc,
getDoc,
setDoc,
serverTimestamp,
increment
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* FIREBASE */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);


/* COURSE ID */

const params=
new URLSearchParams(
location.search
);

const courseId=
params.get("courseId") ||
params.get("id");

const appBox=
document.getElementById("app");

let currentUser=null;
let course=null;


/* ESCAPE */

function safe(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* LOAD COURSE */

async function loadCourse(){

if(!courseId){

appBox.innerHTML=`

<div class="error">

<h2>Course Not Found</h2>

<p>
No course ID was provided.
</p>

<a href="courses.html">
Back to Courses
</a>

</div>

`;

return;

}


try{

const snap=
await getDoc(
doc(db,"courses",courseId)
);


if(!snap.exists()){

appBox.innerHTML=`

<div class="error">

<h2>Course Not Found</h2>

<p>
This course does not exist.
</p>

</div>

`;

return;

}


course=snap.data();


if(course.status==="draft"){

appBox.innerHTML=`

<div class="error">

<h2>Course Unavailable</h2>

<p>
This course is not currently published.
</p>

</div>

`;

return;

}


render();

}catch(error){

console.error(error);

appBox.innerHTML=`

<div class="error">

<h2>Unable to load course</h2>

<p>
${safe(error.message)}
</p>

</div>

`;

}

}


/* RENDER */

function render(){

const price=
Number(course.price||0);

const currency=
course.currency||"TZS";

const priceText=
price===0
?"Free"
:`${currency} ${price.toLocaleString()}`;

const image=
course.thumbnail||
"https://via.placeholder.com/800x450?text=LetsStudy+Pro";


appBox.innerHTML=`

<div class="card">

<div class="course">

<img
src="${safe(image)}"
alt="${safe(course.title||"Course")}"
onerror="
this.src='https://via.placeholder.com/800x450?text=Course'
">

<div>

<h1>
${safe(course.title||"Course")}
</h1>

<p>
${safe(
course.shortDescription||
course.description||
""
)}
</p>

</div>

</div>

</div>


<div class="card">

<h2>
Confirm Enrollment
</h2>

<div class="info">

<div>

<small>Course</small>

<strong>
${safe(course.title||"-")}
</strong>

</div>


<div>

<small>Category</small>

<strong>
${safe(course.category||"-")}
</strong>

</div>


<div>

<small>Level</small>

<strong>
${safe(course.level||"All Levels")}
</strong>

</div>


<div>

<small>Duration</small>

<strong>
${safe(course.duration||"Self paced")}
</strong>

</div>


<div>

<small>Instructor</small>

<strong>
${safe(course.instructor||"LetsStudy Pro")}
</strong>

</div>


<div>

<small>Price</small>

<strong class="price">
${priceText}
</strong>

</div>

</div>

<br>

<div id="enrollArea">

<div class="loading">
Checking account...
</div>

</div>

<div id="message"
class="message">
</div>

</div>

`;

}


/* AUTH */

onAuthStateChanged(
auth,
async user=>{

currentUser=user;

if(!course){

await loadCourse();

}

if(course){

await updateEnrollmentArea();

}

});


/* ENROLL AREA */

async function updateEnrollmentArea(){

const area=
document.getElementById("enrollArea");

if(!area)return;


if(!currentUser){

area.innerHTML=`

<button
class="btn login"
onclick="
location.href='login.html?redirect=${encodeURIComponent(location.href)}'
">

<i class="fa fa-right-to-bracket"></i>

Login to Enroll

</button>

`;

return;

}


try{

const enrollmentRef=
doc(
db,
"enrollments",
`${currentUser.uid}_${courseId}`
);


const snap=
await getDoc(enrollmentRef);


if(snap.exists()){

area.innerHTML=`

<div class="success">

<i class="fa fa-circle-check"></i>

<h2>
Already Enrolled
</h2>

<p>
You are already enrolled in this course.
</p>

<button
class="btn enroll"
onclick="
location.href='my-course.html?id=${courseId}'
">

Continue Learning

</button>

</div>

`;

return;

}


area.innerHTML=`

<button
class="btn enroll"
id="enrollButton">

<i class="fa fa-graduation-cap"></i>

Enroll Now

</button>

`;

document.getElementById(
"enrollButton"
).onclick=
enroll;


}catch(error){

console.error(error);

area.innerHTML=`

<button
class="btn enroll"
id="enrollButton">

<i class="fa fa-graduation-cap"></i>

Enroll Now

</button>

`;

document.getElementById(
"enrollButton"
).onclick=
enroll;

}

}


/* ENROLL */

async function enroll(){

if(!currentUser){

location.href=
`login.html?redirect=${encodeURIComponent(location.href)}`;

return;

}


const button=
document.getElementById(
"enrollButton"
);

const message=
document.getElementById(
"message"
);


if(button){

button.disabled=true;

button.innerHTML=`

<i class="fa fa-spinner fa-spin"></i>
Enrolling...

`;

}


try{

const enrollmentId=
`${currentUser.uid}_${courseId}`;


const enrollmentRef=
doc(
db,
"enrollments",
enrollmentId
);


const existing=
await getDoc(enrollmentRef);


if(existing.exists()){

await updateEnrollmentView();

return;

}


/* ENROLLMENT DATA */

await setDoc(
enrollmentRef,
{

userId:
currentUser.uid,

courseId,

courseTitle:
course.title||"",

instructor:
course.instructor||"",

price:
Number(course.price||0),

currency:
course.currency||"TZS",

status:
"active",

progress:0,

completed:false,

certificateIssued:false,

enrolledAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}
);


/* USER COURSE */

await setDoc(

doc(
db,
"users",
currentUser.uid,
"courses",
courseId
),

{

courseId,

title:
course.title||"",

progress:0,

status:"active",

enrolledAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}

);


/* COURSE COUNTER */

try{

await updateEnrollmentView();

}catch(e){

console.log(
"Enrollment counter unavailable"
);

}


/* SUCCESS */

appBox.innerHTML=`

<div class="card success">

<i class="fa fa-circle-check"></i>

<h2>
Enrollment Successful!
</h2>

<p>
You have successfully enrolled in:
</p>

<h3>
${safe(course.title||"Course")}
</h3>

<br>

<button
class="btn enroll"
onclick="
location.href='my-course.html?id=${courseId}'
">

Start Learning

</button>

</div>

`;


}catch(error){

console.error(error);

if(button){

button.disabled=false;

button.innerHTML=`

<i class="fa fa-graduation-cap"></i>
Enroll Now

`;

}

message.textContent=
error.message||
"Enrollment failed.";

message.style.color=
"#dc2626";

}

}


/* UPDATE COURSE ENROLLMENT COUNT */

async function updateEnrollmentView(){

try{

await setDoc(

doc(
db,
"courses",
courseId
),

{

enrollmentCount:
increment(1)

},

{

merge:true

}

);

}catch(error){

console.error(error);

}

}


/* START */

loadCourse();

</script>

</body>
</html>
