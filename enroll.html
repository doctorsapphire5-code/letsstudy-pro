<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Enroll in Course | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{color:#2563eb}

.back{
  border:0;
  background:#eef2f7;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:850px;
  margin:35px auto;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:25px;
  box-shadow:0 5px 25px #0000000b;
}

h1{
  font-size:28px;
  margin-bottom:8px;
}

.subtitle{
  color:#64748b;
  margin-bottom:25px;
}

.course{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
}

.course h2{
  margin-bottom:8px;
}

.course p{
  color:#64748b;
  line-height:1.5;
}

.price{
  margin-top:15px;
  font-size:22px;
  font-weight:800;
}

.user{
  background:#f8fafc;
  padding:13px;
  border-radius:9px;
  margin-bottom:18px;
  color:#475569;
}

.enroll{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:14px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
}

.enroll:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
}

.status.show{display:block}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:#64748b;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>

<main class="container">

  <div class="card">

    <h1>Enroll in Course</h1>

    <p class="subtitle">
      Join this course and start learning.
    </p>

    <div id="courseBox">

      <div class="empty">
        Loading course...
      </div>

    </div>

    <div
      id="userBox"
      class="user"
    >
      Checking login...
    </div>

    <button
      id="enrollBtn"
      class="enroll"
      disabled
    >
      Enroll Now
    </button>

    <div
      id="status"
      class="status"
    ></div>

  </div>

</main>

<script type="module">

/*
==================================================
ENROLL FLOW

Course:
  API -> Firestore

Authentication:
  Firebase Auth

Enrollment:
  Authenticated API -> Firestore

Admin:
  NOT USED
==================================================
*/

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* =========================
   STATE
========================= */

const params =
  new URLSearchParams(
    location.search
  );

const courseId =
  params.get("courseId") ||
  params.get("id") ||
  params.get("documentId");


let course = null;
let currentUser = null;


/* =========================
   DOM
========================= */

const courseBox =
  document.getElementById(
    "courseBox"
  );

const userBox =
  document.getElementById(
    "userBox"
  );

const enrollBtn =
  document.getElementById(
    "enrollBtn"
  );

const statusBox =
  document.getElementById(
    "status"
  );


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  user => {

    currentUser = user;

    if(!user){

      userBox.innerHTML = `

        You are not logged in.

        <br><br>

        <button
          class="back"
          onclick="
            location.href='login.html'
          "
        >
          Login
        </button>

      `;

      enrollBtn.disabled = true;

      return;

    }


    userBox.innerHTML = `

      Signed in as

      <strong>
        ${escapeHTML(
          user.displayName ||
          user.email ||
          "User"
        )}
      </strong>

    `;


    if(course){

      enrollBtn.disabled = false;

    }

  }
);


/* =========================
   LOAD COURSE
========================= */

async function loadCourse(){

  if(!courseId){

    courseBox.innerHTML = `

      <div class="empty">

        Course ID is missing.

      </div>

    `;

    return;

  }


  try{

    const response =
      await fetch(
        "/api/data?collection=courses&id=" +
        encodeURIComponent(courseId)
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Course not found"
      );

    }


    course =
      result.data;


    renderCourse();


    if(currentUser){

      enrollBtn.disabled = false;

    }

  }catch(error){

    courseBox.innerHTML = `

      <div class="empty">

        <h3>
          Unable to load course
        </h3>

        <p>
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


/* =========================
   COURSE
========================= */

function renderCourse(){

  const title =
    course.title ||
    course.name ||
    "Course";


  const description =
    course.description ||
    "Start learning with LetsStudy Pro.";


  const price =
    course.price ??
    course.amount ??
    0;


  const access =
    String(
      course.access ||
      course.type ||
      "free"
    ).toLowerCase();


  const priceText =
    access === "free" ||
    Number(price) === 0
      ? "Free"
      : formatPrice(price);


  courseBox.innerHTML = `

    <div class="course">

      <h2>
        ${escapeHTML(title)}
      </h2>

      <p>
        ${escapeHTML(description)}
      </p>

      <div class="price">

        ${escapeHTML(priceText)}

      </div>

    </div>

  `;

}


/* =========================
   ENROLL
========================= */

enrollBtn.addEventListener(
  "click",
  async () => {

    if(!currentUser){

      showStatus(
        "Please login first.",
        "error"
      );

      return;

    }


    if(!course){

      showStatus(
        "Course is not available.",
        "error"
      );

      return;

    }


    enrollBtn.disabled = true;

    enrollBtn.textContent =
      "Enrolling...";


    try{

      const token =
        await currentUser.getIdToken();


      /*
        Authenticated endpoint.

        Do NOT use the public data API
        for creating enrollments.
      */

      const response =
        await fetch(
          "/api/enroll",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " + token
            },

            body:JSON.stringify({

              courseId:
                course.id ||
                course.documentId ||
                courseId,

              courseTitle:
                course.title ||
                course.name ||
                ""

            })

          }
        );


      const result =
        await response.json();


      if(!response.ok){

        throw new Error(
          result.error ||
          "Enrollment failed"
        );

      }


      showStatus(
        "Enrollment successful. You can start learning now.",
        "success"
      );


      enrollBtn.textContent =
        "Enrolled";


      setTimeout(
        () => {

          location.href =
            "student-course.html?courseId=" +
            encodeURIComponent(
              course.id ||
              course.documentId ||
              courseId
            );

        },
        900
      );


    }catch(error){

      console.error(
        "ENROLL ERROR:",
        error
      );

      showStatus(
        error.message ||
        "Unable to enroll.",
        "error"
      );

      enrollBtn.disabled = false;

      enrollBtn.textContent =
        "Enroll Now";

    }

  }
);


/* =========================
   STATUS
========================= */

function showStatus(
  message,
  type
){

  statusBox.className =
    "status show " + type;

  statusBox.textContent =
    message;

}


/* =========================
   PRICE
========================= */

function formatPrice(value){

  const number =
    Number(value);

  if(!Number.isFinite(number)){

    return String(value);

  }

  return new Intl.NumberFormat(
    undefined,
    {
      style:"currency",
      currency:"TZS",
      maximumFractionDigits:0
    }
  ).format(number);

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadCourse();

</script>

</body>
</html>
