<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Enroll | LetsStudy Pro</title>

<meta name="description"
content="Enroll in a free course on LetsStudy Pro.">

<meta name="robots" content="index,follow">

<link rel="icon" href="favicon.ico">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f7f9fc;
  color:#172033;
}

a{
  text-decoration:none;
  color:inherit;
}

.navbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5eaf1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.back{
  color:#5e6979;
  font-size:14px;
}

.container{
  width:min(1000px,92%);
  margin:auto;
}

.page{
  padding:55px 0 80px;
}

.grid{
  display:grid;
  grid-template-columns:1fr .65fr;
  gap:30px;
  align-items:start;
}

.card{
  background:#fff;
  border:1px solid #e3e8ef;
  border-radius:18px;
  padding:30px;
  box-shadow:0 8px 30px rgba(20,35,60,.06);
}

.thumbnail{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:13px;
  background:#e9eef5;
  margin-bottom:22px;
}

h1{
  font-size:34px;
  line-height:1.15;
  margin:0 0 15px;
}

h2{
  font-size:21px;
  margin-top:0;
}

.description{
  color:#5d6879;
  line-height:1.7;
}

.badge{
  display:inline-flex;
  padding:7px 12px;
  border-radius:999px;
  background:#e8f8ee;
  color:#167342;
  font-size:13px;
  font-weight:800;
  margin-bottom:20px;
}

.info{
  padding:15px;
  background:#f7f9fc;
  border-radius:12px;
  margin-bottom:12px;
}

.info strong{
  display:block;
  margin-bottom:4px;
}

.info span{
  color:#687486;
  font-size:14px;
}

.button{
  display:block;
  width:100%;
  border:0;
  border-radius:11px;
  padding:15px 20px;
  background:#111827;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  text-align:center;
}

.button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.notice{
  padding:14px;
  border-radius:10px;
  background:#eef5ff;
  color:#3e5f87;
  font-size:14px;
  line-height:1.5;
  margin-bottom:18px;
}

.loading{
  text-align:center;
  padding:100px 20px;
  color:#657184;
}

.error{
  text-align:center;
  padding:100px 20px;
}

.success{
  text-align:center;
}

.success-icon{
  font-size:55px;
  margin-bottom:15px;
}

.footer{
  padding:35px;
  background:#fff;
  border-top:1px solid #e5e9f0;
  text-align:center;
  color:#7b8492;
}

@media(max-width:750px){

  .grid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:29px;
  }

  .thumbnail{
    height:200px;
  }

}

</style>
</head>

<body>

<header class="navbar">

  <a href="index.html" class="logo">
    📚 LetsStudy Pro
  </a>

  <a href="search.html" class="back">
    ← Search
  </a>

</header>


<main class="page">

  <div class="container">

    <div id="app">

      <div class="loading">
        Loading enrollment...
      </div>

    </div>

  </div>

</main>


<footer class="footer">
  © 2026 LetsStudy Pro. Learn. Build. Grow.
</footer>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXK5bkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const appContainer =
  document.getElementById("app");


/* =====================================================
   HELPERS
===================================================== */

function text(value){

  if(
    value === undefined ||
    value === null
  ){

    return "";

  }

  return String(value).trim();

}


function escapeHtml(value){

  return text(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function first(data,fields){

  for(
    const field of fields
  ){

    const value =
      text(data?.[field]);

    if(value){

      return value;

    }

  }

  return "";

}


function isPlanCourse(data){

  const access =
    first(
      data,
      [
        "access",
        "accessType",
        "membership",
        "plan",
        "pricing"
      ]
    ).toLowerCase();


  if(
    access === "plan" ||
    access === "premium" ||
    access === "paid" ||
    access === "pro"
  ){

    return true;

  }


  if(
    data?.premium === true ||
    data?.isPremium === true ||
    data?.paid === true
  ){

    return true;

  }


  return false;

}


function getImage(data){

  return first(
    data,
    [
      "thumbnail",
      "thumbnailUrl",
      "image",
      "imageUrl",
      "cover",
      "coverImage"
    ]
  );

}


/* =====================================================
   COURSE ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const courseId =
  params.get("id");


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse(){

  if(!courseId){

    showError(
      "Course not found",
      "No course was selected."
    );

    return;

  }


  try{

    const courseRef =
      doc(
        db,
        "courses",
        courseId
      );


    const snapshot =
      await getDoc(courseRef);


    if(!snapshot.exists()){

      showError(
        "Course not found",
        "This course is unavailable."
      );

      return;

    }


    const course =
      snapshot.data() || {};


    if(isPlanCourse(course)){

      showError(
        "Plan course",
        "This course requires a plan. Please return to the course page and add it to your cart."
      );

      return;

    }


    renderCourse(course);


  }catch(error){

    console.error(
      "Enrollment loading error:",
      error
    );


    showError(
      "Unable to load course",
      "Please try again later."
    );

  }

}


/* =====================================================
   RENDER COURSE
===================================================== */

function renderCourse(course){

  const title =
    first(
      course,
      [
        "title",
        "name",
        "courseTitle"
      ]
    ) ||
    "Untitled Course";


  const description =
    first(
      course,
      [
        "description",
        "shortDescription",
        "summary",
        "excerpt",
        "about"
      ]
    );


  const instructor =
    first(
      course,
      [
        "instructor",
        "instructorName",
        "teacher",
        "author"
      ]
    );


  const category =
    first(
      course,
      [
        "category",
        "subject",
        "field"
      ]
    );


  const image =
    getImage(course);


  document.title =
    `Enroll: ${title} | LetsStudy Pro`;


  appContainer.innerHTML = `

    <div class="grid">

      <section class="card">

        ${
          image
            ? `
              <img
                class="thumbnail"
                src="${escapeHtml(image)}"
                alt="${escapeHtml(title)}"
              >
            `
            : ""
        }


        <span class="badge">
          Free Course
        </span>


        <h1>
          ${escapeHtml(title)}
        </h1>


        ${
          description
            ? `
              <p class="description">
                ${escapeHtml(description)}
              </p>
            `
            : ""
        }


        ${
          instructor
            ? `
              <div class="info">
                <strong>Instructor</strong>
                <span>
                  ${escapeHtml(instructor)}
                </span>
              </div>
            `
            : ""
        }


        ${
          category
            ? `
              <div class="info">
                <strong>Category</strong>
                <span>
                  ${escapeHtml(category)}
                </span>
              </div>
            `
            : ""
        }

      </section>


      <aside class="card">

        <h2>
          Enroll for Free
        </h2>


        <div class="notice">
          This course is available at no cost. Confirm your enrollment to start learning.
        </div>


        <div class="info">

          <strong>
            Course access
          </strong>

          <span>
            Free
          </span>

        </div>


        <div class="info">

          <strong>
            Access
          </strong>

          <span>
            Immediate
          </span>

        </div>


        <button
          id="enrollButton"
          class="button">

          Enroll Free

        </button>


        <div
          id="status"
          style="margin-top:15px">
        </div>

      </aside>

    </div>

  `;


  document
    .getElementById("enrollButton")
    .addEventListener(
      "click",
      () => enroll(course)
    );

}


/* =====================================================
   ENROLL
===================================================== */

function enroll(course){

  const button =
    document.getElementById(
      "enrollButton"
    );


  const status =
    document.getElementById(
      "status"
    );


  button.disabled = true;

  button.textContent =
    "Enrolling...";


  /*
   * Local enrollment record.
   *
   * This allows the free-course flow
   * to work immediately without requiring
   * authentication.
   */

  const enrollments =
    JSON.parse(
      localStorage.getItem(
        "courseEnrollments"
      ) || "[]"
    );


  const enrollment = {

    id:
      courseId,

    title:
      first(
        course,
        [
          "title",
          "name",
          "courseTitle"
        ]
      ),

    enrolledAt:
      new Date().toISOString(),

    access:
      "free"

  };


  const existing =
    enrollments.some(
      item =>
        item.id === courseId
    );


  if(!existing){

    enrollments.push(
      enrollment
    );

  }


  localStorage.setItem(
    "courseEnrollments",
    JSON.stringify(
      enrollments
    )
  );


  status.innerHTML = `

    <div class="success">

      <div class="success-icon">
        ✓
      </div>

      <strong>
        Enrollment successful
      </strong>

      <p class="description">
        You can now start learning this course.
      </p>

      <a
        class="button"
        href="course-learn.html?id=${encodeURIComponent(courseId)}">

        Start Learning

      </a>

    </div>

  `;

}


/* =====================================================
   ERROR
===================================================== */

function showError(title,message){

  appContainer.innerHTML = `

    <div class="card error">

      <h1>
        ${escapeHtml(title)}
      </h1>

      <p class="description">
        ${escapeHtml(message)}
      </p>

      <br>

      <a
        href="course-details.html?id=${encodeURIComponent(courseId || "")}"
        class="button"
        style="display:inline-block;width:auto">

        Back to Course

      </a>

    </div>

  `;

}


/* =====================================================
   START
===================================================== */

loadCourse();

</script>

</body>
</html>
