<style>
:root{
  --ink:#0d1b2a;--ink-2:#16293f;--paper:#f2f5f9;--card:#fff;--line:#dde4ec;
  --mute:#5b6b7e;--brand:#0a7c66;--brand-soft:#e2f4ef;--amber:#f2a93b;
  --head:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.i{width:18px;height:18px;min-width:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,5%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:20px;font-weight:700;letter-spacing:-.3px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--amber);display:grid;place-items:center;font-size:16px}
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:600}
.back:hover{background:var(--ink-2)}
.back .i{width:15px;height:15px;transform:rotate(180deg)}

/* LAYOUT */
.page{flex:1;width:min(1080px,92%);margin:0 auto;padding:44px 0 72px}
.grid{display:grid;grid-template-columns:1fr 380px;gap:44px;align-items:start}

/* COURSE */
.media{width:100%;aspect-ratio:16/9;border-radius:20px;object-fit:cover;background:var(--ink);display:block;margin-bottom:28px}
.media.ph{display:grid;place-items:center;color:var(--amber);font-family:var(--head);font-size:72px;font-weight:700;background:linear-gradient(135deg,var(--ink),var(--ink-2))}
.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:700;margin-bottom:14px}
h1{font-family:var(--head);font-size:clamp(28px,4.2vw,42px);line-height:1.1;letter-spacing:-.9px;margin-bottom:16px}
.description{color:var(--mute);font-size:16.5px;max-width:64ch;white-space:pre-line}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:28px}
.fact{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.fact span{display:block;font-size:13px;color:var(--mute)}
.fact strong{font-size:15.5px}

/* ENROLL PANEL */
.panel{position:sticky;top:88px;background:var(--ink);color:#fff;border-radius:22px;padding:28px}
.panel h2{font-family:var(--head);font-size:24px;letter-spacing:-.4px;margin-bottom:6px}
.panel .lead{color:#b6c3d2;font-size:14.5px;margin-bottom:20px}
.perks{list-style:none;margin-bottom:22px;display:grid;gap:11px}
.perks li{display:flex;align-items:center;gap:11px;font-size:14.5px;color:#e3eaf2}
.perks .i{color:var(--amber)}
.button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:13px;padding:15px 20px;background:var(--amber);color:var(--ink);font:700 16px var(--body);cursor:pointer;transition:transform .2s,box-shadow .2s}
.button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px rgba(242,169,59,.35)}
.button:disabled{opacity:.6;cursor:not-allowed}
.button.light{background:#fff}
.fine{margin-top:14px;font-size:12.5px;color:#8fa1b5;text-align:center}

/* SUCCESS */
.done{text-align:center;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
.done-icon{width:62px;height:62px;border-radius:50%;background:var(--amber);color:var(--ink);display:grid;place-items:center;margin:0 auto 16px}
.done-icon .i{width:30px;height:30px;stroke-width:2.6}
.done h2{margin-bottom:6px}
.done p{color:#b6c3d2;font-size:14.5px;margin-bottom:22px}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* ERROR */
.error{max-width:560px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:44px 30px;text-align:center}
.error .done-icon{background:#fee2e2;color:#b91c1c}
.error h1{font-size:28px;letter-spacing:-.5px}
.error .description{margin:0 auto 24px}
.error .button{display:inline-flex;width:auto;padding:13px 24px;background:var(--ink);color:#fff}

/* SKELETON */
@keyframes sh{to{background-position:-200% 0}}
.sk{border-radius:12px;background:linear-gradient(90deg,#e6ebf1 25%,#f4f7fa 50%,#e6ebf1 75%) 0 0/200% 100%;animation:sh 1.4s linear infinite}

.footer{padding:28px;background:#fff;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:14px}

@media(max-width:860px){
  .grid{grid-template-columns:1fr;gap:28px}
  .panel{position:static}
  .page{padding:26px 0 48px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const db = getFirestore(initializeApp(firebaseConfig));
const appContainer = document.getElementById("app");

/* HELPERS */
const text = (v) => (v === undefined || v === null) ? "" : String(v).trim();
const escapeHtml = (v) => text(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const first = (data, fields) => { for(const f of fields){ const v = text(data?.[f]); if(v) return v; } return ""; };
const icon = (name) => `<svg class="i"><use href="#i-${name}"/></svg>`;

function isPlanCourse(data){
  const access = first(data, ["access","accessType","membership","plan","pricing"]).toLowerCase();
  if(["plan","premium","paid","pro"].includes(access)) return true;
  return data?.premium === true || data?.isPremium === true || data?.paid === true;
}
const getImage = (d) => first(d, ["thumbnail","thumbnailUrl","image","imageUrl","cover","coverImage"]);
const getTitle = (d) => first(d, ["title","name","courseTitle"]);

function readEnrollments(){
  try{ return JSON.parse(localStorage.getItem("courseEnrollments") || "[]"); }
  catch(e){ return []; }
}

/* COURSE ID */
const courseId = new URLSearchParams(window.location.search).get("id");

/* LOAD */
async function loadCourse(){
  if(!courseId){
    showError("Course not found", "No course was selected. Go back and choose a course to enroll in.");
    return;
  }
  try{
    const snapshot = await getDoc(doc(db, "courses", courseId));
    if(!snapshot.exists()){
      showError("Course not found", "This course is unavailable or has been removed.");
      return;
    }
    const course = snapshot.data() || {};
    if(isPlanCourse(course)){
      showError("This course needs a plan", "Paid courses can't be enrolled in here. Return to the course page and add it to your cart.");
      return;
    }
    renderCourse(course);
  }catch(error){
    console.error("Enrollment loading error:", error);
    showError("Unable to load course", "Check your connection and try again.");
  }
}

/* RENDER */
function renderCourse(course){
  const title = getTitle(course) || "Untitled course";
  const description = first(course, ["description","shortDescription","summary","excerpt","about"]);
  const instructor = first(course, ["instructor","instructorName","teacher","author"]);
  const category = first(course, ["category","subject","field"]);
  const image = getImage(course);

  document.title = `Enroll: ${title} | LetsStudy Pro`;

  const facts = [
    instructor ? `<div class="fact"><span>Instructor</span><strong>${escapeHtml(instructor)}</strong></div>` : "",
    category ? `<div class="fact"><span>Category</span><strong>${escapeHtml(category)}</strong></div>` : ""
  ].join("");

  appContainer.innerHTML = `
    <div class="grid">
      <section>
        ${image
          ? `<img class="media" src="${escapeHtml(image)}" alt="${escapeHtml(title)}">`
          : `<div class="media ph" aria-hidden="true">${escapeHtml(title.charAt(0).toUpperCase())}</div>`}
        <span class="badge">${icon("tag")}Free course</span>
        <h1>${escapeHtml(title)}</h1>
        ${description ? `<p class="description">${escapeHtml(description)}</p>` : ""}
        ${facts ? `<div class="facts">${facts}</div>` : ""}
      </section>

      <aside class="panel" id="panel"></aside>
    </div>`;

  if(readEnrollments().some(item => item.id === courseId)){
    showEnrolled();
    return;
  }

  document.getElementById("panel").innerHTML = `
    <h2>Enroll for free</h2>
    <p class="lead">Confirm your enrollment to add this course to your learning list.</p>
    <ul class="perks">
      <li>${icon("check")}Free. No payment needed</li>
      <li>${icon("bolt")}Immediate access to the course</li>
    </ul>
    <button id="enrollButton" class="button" type="button">Enroll for free</button>
    <p class="fine" id="status"></p>`;

  document.getElementById("enrollButton").addEventListener("click", () => enroll(course));
}

/* ENROLL */
function enroll(course){
  const button = document.getElementById("enrollButton");
  const status = document.getElementById("status");
  button.disabled = true;
  button.textContent = "Enrolling…";

  /* Local enrollment record: lets the free-course flow work without sign-in. */
  try{
    const enrollments = readEnrollments();
    if(!enrollments.some(item => item.id === courseId)){
      enrollments.push({
        id: courseId,
        title: getTitle(course),
        enrolledAt: new Date().toISOString(),
        access: "free"
      });
    }
    localStorage.setItem("courseEnrollments", JSON.stringify(enrollments));
  }catch(error){
    console.error("Enrollment save error:", error);
    button.disabled = false;
    button.textContent = "Enroll for free";
    status.textContent = "We couldn't save your enrollment. Allow site storage in your browser and try again.";
    return;
  }

  showEnrolled();
}

function showEnrolled(){
  document.getElementById("panel").innerHTML = `
    <div class="done">
      <div class="done-icon">${icon("check")}</div>
      <h2>You're enrolled</h2>
      <p>This course is ready whenever you are.</p>
      <a class="button light" href="course-learn.html?id=${encodeURIComponent(courseId)}">Start learning${icon("arrow")}</a>
    </div>`;
}

/* ERROR */
function showError(title, message){
  appContainer.innerHTML = `
    <div class="error">
      <div class="done-icon">${icon("x")}</div>
      <h1>${escapeHtml(title)}</h1>
      <p class="description">${escapeHtml(message)}</p>
      <a class="button" href="${courseId ? `course-details.html?id=${encodeURIComponent(courseId)}` : "search.html"}">${courseId ? "Back to course" : "Browse courses"}</a>
    </div>`;
}

loadCourse();
</script>
