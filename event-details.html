<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Details</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#172033;
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.header h1{
    margin:0;
    font-size:19px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.container{
    max-width:950px;
    margin:auto;
    padding:28px 20px 60px;
}

.card{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:12px;
    overflow:hidden;
}

.event-header{
    padding:25px;
    border-bottom:1px solid #e2e8f0;
}

.event-header h2{
    margin:0 0 10px;
    font-size:25px;
}

.event-header p{
    margin:0;
    color:#64748b;
    font-size:12px;
}

.content{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:0;
}

.main{
    padding:25px;
    border-right:1px solid #e2e8f0;
}

.sidebar{
    padding:25px;
}

.section{
    margin-bottom:25px;
}

.section:last-child{
    margin-bottom:0;
}

.section-title{
    margin:0 0 10px;
    font-size:10px;
    color:#64748b;
    font-weight:900;
    text-transform:uppercase;
}

.description{
    font-size:13px;
    line-height:1.7;
    white-space:pre-wrap;
}

.detail{
    padding:12px 0;
    border-bottom:1px solid #f1f5f9;
}

.detail:last-child{
    border-bottom:0;
}

.detail-label{
    color:#64748b;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
    margin-bottom:4px;
}

.detail-value{
    font-size:12px;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:9px;
    font-weight:900;
}

.scheduled{
    background:#dbeafe;
    color:#1d4ed8;
}

.confirmed{
    background:#dcfce7;
    color:#166534;
}

.draft{
    background:#fef3c7;
    color:#92400e;
}

.completed{
    background:#e2e8f0;
    color:#475569;
}

.cancelled{
    background:#fee2e2;
    color:#b91c1c;
}

.attendee{
    padding:9px 0;
    border-bottom:1px solid #f1f5f9;
    font-size:11px;
}

.attendee:last-child{
    border-bottom:0;
}

.reminder{
    padding:11px;
    border-radius:8px;
    background:#f1f5f9;
    font-size:10px;
}

.empty{
    text-align:center;
    padding:80px 20px;
    color:#64748b;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.primary{
    background:#7c3aed;
    color:#fff;
}

.secondary{
    background:#e2e8f0;
    color:#334155;
}

.danger{
    background:#fee2e2;
    color:#b91c1c;
}

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(15,23,42,.55);
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(500px,100%);
    background:#fff;
    border-radius:12px;
    padding:22px;
}

.modal-card h2{
    margin-top:0;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    color:#64748b;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

@media(max-width:750px){

    .header{
        padding:0 12px;
    }

    .header-actions .danger{
        display:none;
    }

    .container{
        padding:12px;
    }

    .content{
        grid-template-columns:1fr;
    }

    .main{
        border-right:0;
        border-bottom:1px solid #e2e8f0;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>Event Details</h1>

    <div class="header-actions">

        <button
            class="secondary"
            onclick="goBack()">
            Back
        </button>

        <button
            class="primary"
            onclick="openEditModal()">
            Edit
        </button>

        <button
            class="danger"
            onclick="deleteEvent()">
            Delete
        </button>

    </div>

</header>


<main class="container">

    <div
        id="eventContainer"
        class="card">

    </div>

</main>


<!-- =========================
     EDIT MODAL
========================= -->

<div
    id="editModal"
    class="modal">

    <div class="modal-card">

        <h2>
            Edit Event
        </h2>


        <div class="form-group">

            <label>
                Title
            </label>

            <input
                id="editTitle"
                type="text">

        </div>


        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="editDescription"
                rows="4"></textarea>

        </div>


        <div class="form-group">

            <label>
                Date
            </label>

            <input
                id="editDate"
                type="date">

        </div>


        <div class="form-group">

            <label>
                Time
            </label>

            <input
                id="editTime"
                type="time">

        </div>


        <div class="form-group">

            <label>
                Location
            </label>

            <input
                id="editLocation"
                type="text">

        </div>


        <div class="form-group">

            <label>
                Status
            </label>

            <select id="editStatus">

                <option value="scheduled">
                    Scheduled
                </option>

                <option value="confirmed">
                    Confirmed
                </option>

                <option value="draft">
                    Draft
                </option>

                <option value="completed">
                    Completed
                </option>

                <option value="cancelled">
                    Cancelled
                </option>

            </select>

        </div>


        <div class="modal-actions">

            <button
                class="secondary"
                onclick="closeEditModal()">
                Cancel
            </button>

            <button
                class="primary"
                onclick="saveEditedEvent()">
                Save Changes
            </button>

        </div>

    </div>

</div>


<script>

const STORAGE_KEY =
    "events-data";


let eventData = null;


/* =========================
   GET EVENT ID
========================= */

function getEventId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get(
        "id"
    );

}


/* =========================
   LOAD EVENT
========================= */

function loadEvent(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if(!saved){

        showEmpty();

        return;

    }


    let events = [];


    try{

        events =
            JSON.parse(
                saved
            );

    }catch(error){

        showEmpty();

        return;

    }


    if(!Array.isArray(events)){

        showEmpty();

        return;

    }


    const id =
        getEventId();


    if(id){

        eventData =
            events.find(
                item =>
                    String(item.id) ===
                    String(id)
            );

    }


    /*
      If no ID is supplied, display
      the most recently created event.
    */

    if(!eventData){

        eventData =
            events[events.length - 1];

    }


    if(!eventData){

        showEmpty();

        return;

    }


    renderEvent();

}


/* =========================
   RENDER
========================= */

function renderEvent(){

    const container =
        document.getElementById(
            "eventContainer"
        );


    const attendees =
        Array.isArray(
            eventData.attendees
        )
            ? eventData.attendees
            : [];


    const date =
        eventData.date
            ? new Date(
                eventData.date +
                "T00:00:00"
              )
            : null;


    const formattedDate =
        date
            ? date.toLocaleDateString(
                undefined,
                {
                    weekday:"long",
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
              )
            : "No date";


    container.innerHTML = `

        <div class="event-header">

            <h2>
                ${escapeHTML(
                    eventData.title ||
                    "Untitled Event"
                )}
            </h2>

            <p>

                ${
                    eventData.eventType
                        ? escapeHTML(
                            eventData.eventType
                        )
                        : "Event"
                }

                ·

                ${formattedDate}

            </p>

        </div>


        <div class="content">

            <div class="main">

                <section class="section">

                    <h3 class="section-title">
                        Description
                    </h3>

                    <div class="description">

                        ${
                            eventData.description
                                ? escapeHTML(
                                    eventData.description
                                  )
                                : "No description provided."
                        }

                    </div>

                </section>


                <section class="section">

                    <h3 class="section-title">
                        Attendees
                    </h3>

                    ${
                        attendees.length
                            ? attendees
                                .map(
                                    attendee => `
                                        <div class="attendee">
                                            ${escapeHTML(
                                                attendee
                                            )}
                                        </div>
                                    `
                                )
                                .join("")
                            : `
                                <div class="attendee">
                                    No attendees added.
                                </div>
                              `
                    }

                </section>

            </div>


            <aside class="sidebar">

                <section class="section">

                    <h3 class="section-title">
                        Event information
                    </h3>


                    <div class="detail">

                        <div class="detail-label">
                            Date
                        </div>

                        <div class="detail-value">
                            ${formattedDate}
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            Time
                        </div>

                        <div class="detail-value">
                            ${
                                eventData.time
                                    ? escapeHTML(
                                        eventData.time
                                      )
                                    : "No time"
                            }
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            Location
                        </div>

                        <div class="detail-value">
                            ${
                                eventData.location
                                    ? escapeHTML(
                                        eventData.location
                                      )
                                    : "No location"
                            }
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            Type
                        </div>

                        <div class="detail-value">
                            ${
                                eventData.eventType
                                    ? escapeHTML(
                                        eventData.eventType
                                      )
                                    : "Other"
                            }
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            Status
                        </div>

                        <div class="detail-value">

                            <span
                                class="status ${escapeHTML(
                                    eventData.status ||
                                    "scheduled"
                                )}">

                                ${escapeHTML(
                                    (
                                        eventData.status ||
                                        "scheduled"
                                    ).toUpperCase()
                                )}

                            </span>

                        </div>

                    </div>

                </section>


                <section class="section">

                    <h3 class="section-title">
                        Reminder
                    </h3>

                    <div class="reminder">

                        ${
                            eventData.reminder
                                ? "Reminder is enabled for this event."
                                : "No reminder is enabled."
                        }

                    </div>

                </section>

            </aside>

        </div>
    `;

}


/* =========================
   EDIT
========================= */

function openEditModal(){

    if(!eventData){
        return;
    }


    document.getElementById(
        "editTitle"
    ).value =
        eventData.title || "";


    document.getElementById(
        "editDescription"
    ).value =
        eventData.description || "";


    document.getElementById(
        "editDate"
    ).value =
        eventData.date || "";


    document.getElementById(
        "editTime"
    ).value =
        eventData.time || "";


    document.getElementById(
        "editLocation"
    ).value =
        eventData.location || "";


    document.getElementById(
        "editStatus"
    ).value =
        eventData.status ||
        "scheduled";


    document.getElementById(
        "editModal"
    ).classList.add(
        "show"
    );

}


function closeEditModal(){

    document.getElementById(
        "editModal"
    ).classList.remove(
        "show"
    );

}


/* =========================
   SAVE EDIT
========================= */

function saveEditedEvent(){

    if(!eventData){
        return;
    }


    const title =
        document.getElementById(
            "editTitle"
        ).value.trim();


    const date =
        document.getElementById(
            "editDate"
        ).value;


    const time =
        document.getElementById(
            "editTime"
        ).value;


    if(
        !title ||
        !date ||
        !time
    ){

        alert(
            "Title, date and time are required."
        );

        return;

    }


    eventData.title =
        title;


    eventData.description =
        document.getElementById(
            "editDescription"
        ).value.trim();


    eventData.date =
        date;


    eventData.time =
        time;


    eventData.location =
        document.getElementById(
            "editLocation"
        ).value.trim();


    eventData.status =
        document.getElementById(
            "editStatus"
        ).value;


    const events =
        loadAllEvents();


    const index =
        events.findIndex(
            item =>
                String(item.id) ===
                String(eventData.id)
        );


    if(index !== -1){

        events[index] =
            eventData;

    }else{

        events.push(
            eventData
        );

    }


    saveAllEvents(
        events
    );


    closeEditModal();

    renderEvent();

}


/* =========================
   DELETE
========================= */

function deleteEvent(){

    if(!eventData){
        return;
    }


    if(
        !confirm(
            "Delete this event?"
        )
    ){

        return;

    }


    const events =
        loadAllEvents();


    const remaining =
        events.filter(
            item =>
                String(item.id) !==
                String(eventData.id)
        );


    saveAllEvents(
        remaining
    );


    goBack();

}


/* =========================
   STORAGE
========================= */

function loadAllEvents(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if(!saved){
        return [];
    }


    try{

        const events =
            JSON.parse(
                saved
            );


        return Array.isArray(
            events
        )
            ? events
            : [];

    }catch(error){

        return [];

    }

}


function saveAllEvents(
    events
){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            events
        )
    );

}


/* =========================
   EMPTY STATE
========================= */

function showEmpty(){

    document.getElementById(
        "eventContainer"
    ).innerHTML = `

        <div class="empty">

            <h2>
                Event not found
            </h2>

            <p>
                The event may have been deleted
                or does not exist.
            </p>

            <button
                class="primary"
                onclick="goBack()">
                Go Back
            </button>

        </div>

    `;

}


/* =========================
   BACK
========================= */

function goBack(){

    if(
        document.referrer &&
        document.referrer !==
        window.location.href
    ){

        history.back();

    }else{

        location.href =
            "events.html";

    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   START
========================= */

loadEvent();

</script>

</body>
</html>
