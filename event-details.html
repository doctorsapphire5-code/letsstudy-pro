<style>
:root{
  --ink:#0d1b2a;--ink-2:#16293f;--paper:#f2f5f9;--card:#fff;--line:#dde4ec;
  --mute:#5b6b7e;--brand:#0a7c66;--brand-soft:#e2f4ef;--amber:#f2a93b;
  --head:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.i{width:18px;height:18px;min-width:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,5%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:20px;font-weight:700;letter-spacing:-.3px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--amber);display:grid;place-items:center;font-size:16px}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:600}
.back-btn:hover{background:var(--ink-2)}
.back-btn .i{width:15px;height:15px;transform:rotate(180deg)}

.page{flex:1;width:min(1080px,92%);margin:0 auto;padding:28px 0 64px}

/* COVER + HEADER */
.cover{position:relative;aspect-ratio:21/9;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,var(--ink),var(--ink-2));margin-bottom:24px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--amber);font-family:var(--head);font-size:88px;font-weight:700;opacity:.9}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.badge{padding:6px 13px;border-radius:999px;font-size:13px;font-weight:700;background:var(--ink);color:#fff}
.badge.soft{background:var(--brand-soft);color:var(--brand)}
.badge.now{background:var(--brand);color:#fff}
.badge.soon{background:var(--amber);color:var(--ink)}
.badge.past{background:#e6ebf1;color:var(--mute)}
h1{font-family:var(--head);font-size:clamp(30px,5vw,50px);line-height:1.08;letter-spacing:-1.1px;margin-bottom:22px;overflow-wrap:anywhere}

/* LAYOUT */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px}
.card h2{font-family:var(--head);font-size:22px;letter-spacing:-.4px;margin-bottom:12px}
.about{color:#3b4a5d;white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.facts{display:grid;gap:16px;margin-bottom:22px}
.fact{display:flex;gap:14px;align-items:flex-start}
.fact .ico{width:42px;height:42px;min-width:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.fact small{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.fact b{display:block;font-weight:700;overflow-wrap:anywhere}
.fact span{font-size:13.5px;color:var(--mute)}
.side{position:sticky;top:84px;display:grid;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font:700 15px var(--body);cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.amber{background:var(--amber);border-color:var(--amber)}
.btn.amber:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px rgba(242,169,59,.35)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.done{background:var(--brand-soft);border-color:#bfe5da;color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{font-size:14px;padding:12px 10px}
.msg{font-size:13.5px;color:var(--mute);text-align:center;min-height:20px}
.msg.err{color:#a8281b}

/* RELATED */
.related{margin-top:34px}
.related h2{font-family:var(--head);font-size:24px;letter-spacing:-.4px;margin-bottom:14px}
.rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.rel{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;transition:border-color .2s,transform .2s}
.rel:hover{border-color:var(--brand);transform:translateY(-3px)}
.rel small{color:var(--brand);font-weight:700;font-size:12.5px}
.rel b{display:block;font-family:var(--head);font-size:18px;line-height:1.3;margin:4px 0 8px}
.rel span{font-size:13.5px;color:var(--mute)}

/* STATES */
.state{max-width:540px;margin:50px auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:46px 28px;text-align:center;color:var(--mute)}
.state h2{font-family:var(--head);font-size:23px;color:var(--ink);margin-bottom:6px}
.state-icon{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:#fee2e2;color:#b91c1c}
.state-icon .i{width:27px;height:27px}
.state .btn{width:auto;display:inline-flex;margin-top:18px}
@keyframes sh{to{background-position:-200% 0}}
.sk{border-radius:20px;background:linear-gradient(90deg,#e6ebf1 25%,#f4f7fa 50%,#e6ebf1 75%) 0 0/200% 100%;animation:sh 1.4s linear infinite}

.footer{padding:26px;background:#fff;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:14px}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static;order:-1}
  .cover{aspect-ratio:16/9;border-radius:18px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, addDoc, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = (id) => document.getElementById(id);
const pageContent = $("pageContent");
$("year").textContent = new Date().getFullYear();
const eventId = (new URLSearchParams(location.search).get("id") || "").trim();

let EVENT = null, ALL = [], SCHED = null, USER = null, SAVED = false;

/* HELPERS */
const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const esc = (v) => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const raw = (e, keys) => { for(const k of keys){ const v = e?.[k]; if(v !== undefined && v !== null && String(v).trim() !== "") return v; } return ""; };
const first = (e, keys) => { const v = raw(e, keys); return typeof v === "object" ? "" : String(v).trim(); };
const idOf = (e) => String(e.id || e.documentId || e.eventId || "");
const titleOf = (e) => first(e, ["title","name"]) || "Untitled event";
const safeUrl = (v) => { try{ const u = new URL(String(v || ""), location.href); return /^https?:$/.test(u.protocol) ? u.href : ""; }catch(e){ return ""; } };
const pad = (n) => String(n).padStart(2, "0");

/* DATES */
function toDate(v){
  if(!v) return null;
  if(typeof v === "object"){
    const s = v.seconds ?? v._seconds;
    if(s !== undefined) return new Date(Number(s) * 1000);
    if(typeof v.toDate === "function") return v.toDate();
    return null;
  }
  const s = String(v).trim(), m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return new Date(+m[1], +m[2] - 1, +m[3]);
  const d = new Date(s);
  return Number.isNaN(d.getTime()) ? null : d;
}
function parseTime(t){
  const m = String(t || "").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);
  if(!m) return null;
  let h = +m[1]; const mi = +(m[2] || 0), ap = (m[3] || "").toLowerCase();
  if(ap === "pm" && h < 12) h += 12;
  if(ap === "am" && h === 12) h = 0;
  return h > 23 || mi > 59 ? null : [h, mi];
}
/* start, end and whether the event has a clock time */
function scheduleOf(e){
  const dateRaw = raw(e, ["date","eventDate","startDate"]);
  const day = toDate(dateRaw);
  if(!day) return null;
  const range = first(e, ["time","startTime"]).split(/\s*(?:-|–|—|\bto\b)\s*/i);
  let st = parseTime(range[0]);
  const start = new Date(day.getTime());
  let timed = false;
  if(st){ start.setHours(st[0], st[1], 0, 0); timed = true; }
  else if(day.getHours() || day.getMinutes()) timed = true;
  else start.setHours(0, 0, 0, 0);

  const endDay = toDate(raw(e, ["endDate"]));
  const end = new Date((endDay || start).getTime());
  const et = parseTime(first(e, ["endTime"]) || range[1]);
  if(et){ end.setHours(et[0], et[1], 0, 0); }
  else if(timed && !endDay) end.setTime(start.getTime() + 3600000);
  else if(!timed) end.setHours(0, 0, 0, 0);
  if(end < start) end.setTime(start.getTime() + 3600000);
  return { start, end, timed };
}
const fmtDay = (d) => d.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
const fmtTime = (d) => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const ymd = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
const local = (d) => `${ymd(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

function statusOf(s){
  if(!s) return null;
  const now = Date.now(), end = s.timed ? s.end.getTime() : s.end.getTime() + 86400000;
  if(now > end) return { cls: "past", text: "Ended" };
  if(now >= s.start.getTime()) return { cls: "now", text: "Happening now" };
  const mins = Math.round((s.start.getTime() - now) / 60000);
  const span = mins < 60 ? `${mins} min` : mins < 1440 ? `${Math.floor(mins / 60)} h` : `${Math.floor(mins / 1440)} d`;
  return { cls: mins < 4320 ? "soon" : "soft", text: `Starts in ${span}` };
}

/* LOAD: the events list API first (the same one event.html uses), then Firestore */
async function load(){
  if(!eventId) return fail("No event was selected.");
  try{
    try{
      const res = await fetch("/api/data?collection=events&limit=100");
      const data = await res.json();
      if(res.ok && Array.isArray(data.results)){
        ALL = data.results;
        EVENT = ALL.find(e => idOf(e) === eventId) || null;
      }
    }catch(e){ console.warn("Events API unavailable:", e); }

    if(!EVENT){
      const snap = await getDoc(doc(db, "events", eventId));
      if(snap.exists()) EVENT = { id: snap.id, ...snap.data() };
    }
    if(!EVENT) return fail("This event could not be found. It may have been removed.");
    SCHED = scheduleOf(EVENT);
    render();
  }catch(error){
    console.error("Event loading error:", error);
    fail("Unable to load this event. Check your connection and try again.");
  }
}

function fail(message){
  pageContent.innerHTML = `
    <div class="state"><div class="state-icon">${icon("alert")}</div>
      <h2>Unable to open this event</h2><p>${esc(message)}</p>
      <a class="btn dark" href="event.html">Browse events</a>
    </div>`;
}

/* RENDER */
function priceText(e){
  const p = first(e, ["price","fee","ticketPrice"]);
  if(!p || /^(0|free)$/i.test(p)) return "Free";
  return /^\d+(\.\d+)?$/.test(p) ? `${first(e, ["currency"]) || "TZS"} ${Number(p).toLocaleString()}` : p;
}

function render(){
  const e = EVENT, title = titleOf(e), cat = first(e, ["category"]);
  const desc = first(e, ["description","details","about"]);
  const img = safeUrl(first(e, ["image","coverImage","thumbnail","imageUrl"]));
  const where = first(e, ["location","venue"]) || "Online";
  const who = first(e, ["organizer","organiser","host"]);
  const link = safeUrl(first(e, ["registrationUrl","registerUrl","registrationLink","ticketUrl","link","url","website"]));
  const meet = safeUrl(first(e, ["meetingUrl","meetingLink","joinUrl","liveUrl"]));
  const st = statusOf(SCHED);

  document.title = `${title} | LetsStudy Pro`;
  const meta = document.querySelector('meta[name="description"]');
  if(meta && desc) meta.content = desc.slice(0, 155);
  addJsonLd(e, title, desc, img, where);

  const when = SCHED
    ? `<div class="fact"><div class="ico">${icon("cal")}</div><div><small>Date</small><b>${esc(fmtDay(SCHED.start))}</b>${SCHED.end.toDateString() !== SCHED.start.toDateString() ? `<span>until ${esc(fmtDay(SCHED.end))}</span>` : ""}</div></div>
       <div class="fact"><div class="ico">${icon("clock")}</div><div><small>Time</small><b>${SCHED.timed ? `${esc(fmtTime(SCHED.start))} – ${esc(fmtTime(SCHED.end))}` : "All day"}</b></div></div>`
    : `<div class="fact"><div class="ico">${icon("cal")}</div><div><small>Date</small><b>To be announced</b></div></div>`;

  pageContent.innerHTML = `
    <div class="cover">${img ? `<img src="${esc(img)}" alt="${esc(title)}">` : `<div class="ph" aria-hidden="true">${esc(title.charAt(0).toUpperCase())}</div>`}</div>
    <div class="badges">
      ${cat ? `<span class="badge">${esc(cat)}</span>` : ""}
      ${st ? `<span class="badge ${st.cls}">${esc(st.text)}</span>` : ""}
      <span class="badge soft">${esc(priceText(e))}</span>
    </div>
    <h1>${esc(title)}</h1>

    <div class="layout">
      <section class="card">
        <h2>About this event</h2>
        <p class="about">${desc ? esc(desc) : "Details for this event will be shared soon."}</p>
      </section>

      <aside class="side">
        <div class="card">
          <div class="facts">
            ${when}
            <div class="fact"><div class="ico">${icon("pin")}</div><div><small>Location</small><b>${esc(where)}</b></div></div>
            ${who ? `<div class="fact"><div class="ico">${icon("user")}</div><div><small>Organizer</small><b>${esc(who)}</b></div></div>` : ""}
          </div>
          ${link ? `<a class="btn amber" href="${esc(link)}" target="_blank" rel="noopener noreferrer" style="margin-bottom:10px">${icon("ext")}Register or get tickets</a>` : ""}
          ${meet ? `<a class="btn dark" href="${esc(meet)}" target="_blank" rel="noopener noreferrer" style="margin-bottom:10px">${icon("ext")}Join online</a>` : ""}
          <button class="btn ${link || meet ? "" : "amber"}" id="saveBtn" type="button" ${SCHED ? "" : "disabled"}>${icon("calplus")}<span id="saveText">Add to my calendar</span></button>
          <div class="msg" id="saveMsg" role="status"></div>
          <div class="row2">
 <button class="btn" id="gcalBtn" type="button" ${SCHED ? "" : "disabled"}>${icon("cal")}Google</button>
            <button class="btn" id="icsBtn" type="button" ${SCHED ? "" : "disabled"}>${icon("down")}.ics file</button>
          </div>
          <button class="btn" id="shareBtn" type="button" style="margin-top:10px">${icon("share")}Share event</button>
        </div>
      </aside>
    </div>
    <div id="related"></div>`;

  $("saveBtn").addEventListener("click", saveToCalendar);
  $("gcalBtn").addEventListener("click", openGoogle);
  $("icsBtn").addEventListener("click", downloadIcs);
  $("shareBtn").addEventListener("click", share);
  renderRelated();
  refreshSaveState();
}

/* RELATED: other upcoming events in the same category */
function renderRelated(){
  const cat = first(EVENT, ["category"]).toLowerCase();
  const list = ALL.filter(e => idOf(e) !== eventId && (!cat || first(e, ["category"]).toLowerCase() === cat))
    .map(e => ({ e, s: scheduleOf(e) }))
    .filter(x => !x.s || x.s.end.getTime() + 86400000 > Date.now())
    .sort((a, b) => (a.s ? a.s.start.getTime() : Infinity) - (b.s ? b.s.start.getTime() : Infinity))
    .slice(0, 3);
  if(!list.length) return;
  $("related").innerHTML = `
    <section class="related"><h2>More events you may like</h2>
      <div class="rel-grid">${list.map(({ e, s }) => `
        <a class="rel" href="event-details.html?id=${encodeURIComponent(idOf(e))}">
          <small>${esc(first(e, ["category"]) || "Event")}</small>
          <b>${esc(titleOf(e))}</b>
          <span>${s ? esc(s.start.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })) : "Date to be announced"}</span>
        </a>`).join("")}</div>
    </section>`;
}

/* ADD TO CALENDAR: saved calendar (signed in), Google Calendar, .ics download */
const placeOf = () => first(EVENT, ["location","venue"]) || "Online";
const details = () => [first(EVENT, ["description","details","about"]), location.href].filter(Boolean).join("\n\n");

function openGoogle(){
  if(!SCHED) return;
  const { start, end, timed } = SCHED;
  const dates = timed ? `${local(start)}/${local(end)}` : `${ymd(start)}/${ymd(new Date(end.getTime() + 86400000))}`;
  const u = new URL("https://calendar.google.com/calendar/render");
  u.search = new URLSearchParams({ action: "TEMPLATE", text: titleOf(EVENT), dates, details: details(), location: placeOf() }).toString();
  window.open(u.href, "_blank", "noopener");
}

function downloadIcs(){
  if(!SCHED) return;
  const { start, end, timed } = SCHED;
  const t = (s) => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LetsStudy Pro//Events//EN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:${eventId}@letsstudy.pro`, `DTSTAMP:${stamp}`,
    timed ? `DTSTART:${local(start)}` : `DTSTART;VALUE=DATE:${ymd(start)}`,
    timed ? `DTEND:${local(end)}` : `DTEND;VALUE=DATE:${ymd(new Date(end.getTime() + 86400000))}`,
    `SUMMARY:${t(titleOf(EVENT))}`, `DESCRIPTION:${t(details())}`, `LOCATION:${t(placeOf())}`, `URL:${location.href}`,
    "END:VEVENT","END:VCALENDAR"];
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${titleOf(EVENT).replace(/[^\w]+/g, "-").toLowerCase().slice(0, 40) || "event"}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Saved calendar: the same calendarEvents collection that calendar.html reads */
onAuthStateChanged(auth, (u) => { USER = u; if(EVENT) refreshSaveState(); });

async function refreshSaveState(){
  const btn = $("saveBtn");
  if(!btn || !SCHED) return;
  SAVED = false;
  if(USER){
    try{
      const q = query(collection(db, "calendarEvents"), where("userId", "==", USER.uid), where("sourceEventId", "==", eventId), limit(1));
      SAVED = !(await getDocs(q)).empty;
    }catch(e){ console.warn("Calendar check failed:", e); }
  }
  btn.classList.toggle("done", SAVED);
  btn.disabled = SAVED;
  $("saveText").textContent = SAVED ? "In your calendar" : "Add to my calendar";
  $("saveMsg").className = "msg";
  $("saveMsg").innerHTML = SAVED
    ? `<a href="calendar.html" style="color:var(--brand);font-weight:700">Open my calendar</a>`
    : USER ? "" : "You'll be asked to sign in to save it.";
}

async function saveToCalendar(){
  if(!SCHED) return;
  if(!USER){
    location.href = `login.html?next=${encodeURIComponent(`event-details.html?id=${eventId}`)}`;
    return;
  }
  const btn = $("saveBtn"), msg = $("saveMsg");
  btn.disabled = true;
  $("saveText").textContent = "Saving…";
  const { start, end, timed } = SCHED, now = new Date().toISOString();
  try{
    await addDoc(collection(db, "calendarEvents"), {
      title: titleOf(EVENT),
      description: first(EVENT, ["description","details","about"]),
      category: first(EVENT, ["category"]) || "Event",
      date: `${start.getFullYear()}-${pad(start.getMonth() + 1)}-${pad(start.getDate())}`,
      startTime: timed ? `${pad(start.getHours())}:${pad(start.getMinutes())}` : "",
      endTime: timed ? `${pad(end.getHours())}:${pad(end.getMinutes())}` : "",
      allDay: String(!timed),
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
      location: placeOf(),
      meetingUrl: safeUrl(first(EVENT, ["meetingUrl","meetingLink","joinUrl","liveUrl"])),
      priority: "medium",
      remender: "30",
      repeat: "none",
      status: "scheduled",
      userId: USER.uid,
      sourceEventId: eventId,
      createdAt: now,
      updatedAt: now
    });
    SAVED = true;
    btn.classList.add("done");
    $("saveText").textContent = "In your calendar";
    msg.className = "msg";
    msg.innerHTML = `Added. <a href="calendar.html" style="color:var(--brand);font-weight:700">Open my calendar</a>`;
  }catch(error){
    console.error("Calendar save error:", error);
    btn.disabled = false;
    $("saveText").textContent = "Add to my calendar";
    msg.className = "msg err";
    msg.textContent = "We couldn't save it. Please try again, or use Google or the .ics file.";
  }
}

/* SHARE */
async function share(){
  const data = { title: titleOf(EVENT), text: `${titleOf(EVENT)} on LetsStudy Pro`, url: location.href };
  const btn = $("shareBtn");
  try{
    if(navigator.share){ await navigator.share(data); return; }
    await navigator.clipboard.writeText(location.href);
    btn.innerHTML = `${icon("check")}Link copied`;
  }catch(e){
    if(e && e.name === "AbortError") return;
    btn.innerHTML = "Copy the link from the address bar";
  }
  setTimeout(() => { btn.innerHTML = `${icon("share")}Share event`; }, 2200);
}

/* SEO: structured data for search engines */
function addJsonLd(e, title, desc, img, place){
  if(!SCHED) return;
  const ld = { "@context": "https://schema.org", "@type": "Event", name: title, startDate: SCHED.start.toISOString(), endDate: SCHED.end.toISOString(), description: desc || title, location: { "@type": "Place", name: place }, url: location.href };
  if(img) ld.image = [img];
  const s = document.createElement("script");
  s.type = "application/ld+json";
  s.textContent = JSON.stringify(ld);
  document.head.appendChild(s);
}
