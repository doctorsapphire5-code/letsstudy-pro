<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Event Details | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{color:#2563eb}

.back{
  border:0;
  background:#eef2f7;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:900px;
  margin:30px auto;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:25px;
  box-shadow:0 5px 25px #0000000b;
}

.cover{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:22px;
  background:#e5e7eb;
}

h1{
  font-size:30px;
  margin-bottom:10px;
}

.description{
  color:#475569;
  line-height:1.7;
  margin:15px 0 22px;
  white-space:pre-wrap;
}

.info{
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(180px,1fr)
  );
  gap:12px;
  margin-bottom:22px;
}

.info-box{
  background:#f8fafc;
  padding:14px;
  border-radius:10px;
}

.label{
  color:#94a3b8;
  font-size:12px;
  margin-bottom:5px;
}

.value{
  font-weight:700;
}

.register{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:14px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
}

.register:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
}

.status.show{display:block}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  text-align:center;
  padding:70px 20px;
  color:#64748b;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>

<main class="container">

  <div
    id="content"
    class="card"
  >

    <div class="empty">
      Loading event...
    </div>

  </div>

</main>

<script type="module">

/*
==================================================
EVENT DETAILS

Public:
  GET /api/data?collection=events&id=...

Authentication:
  Firebase Auth

Registration:
  Authenticated /api/events/register

Admin:
  NOT USED
==================================================
*/

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* =========================
   STATE
========================= */

const params =
  new URLSearchParams(
    location.search
  );

const eventId =
  params.get("eventId") ||
  params.get("id") ||
  params.get("documentId");


let eventData = null;
let currentUser = null;


/* =========================
   DOM
========================= */

const content =
  document.getElementById(
    "content"
  );


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  user => {

    currentUser = user;

    render();

  }
);


/* =========================
   LOAD EVENT
========================= */

async function loadEvent(){

  if(!eventId){

    content.innerHTML = `

      <div class="empty">

        Event ID is missing.

      </div>

    `;

    return;

  }


  try{

    const response =
      await fetch(
        "/api/data?collection=events&id=" +
        encodeURIComponent(eventId)
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Event not found"
      );

    }


    eventData =
      result.data;


    render();


  }catch(error){

    console.error(
      "EVENT ERROR:",
      error
    );

    content.innerHTML = `

      <div class="empty">

        <h3>
          Unable to load event
        </h3>

        <p>
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function render(){

  if(!eventData){

    return;

  }


  const title =
    eventData.title ||
    eventData.name ||
    "Event";


  const description =
    eventData.description ||
    "Event details are not available.";


  const image =
    safeImage(
      eventData.image ||
      eventData.coverImage ||
      eventData.thumbnail
    );


  const date =
    formatDate(
      eventData.date ||
      eventData.eventDate ||
      eventData.startDate
    );


  const time =
    eventData.time ||
    eventData.startTime ||
    "";


  const location =
    eventData.location ||
    eventData.venue ||
    eventData.address ||
    "Online";


  const category =
    eventData.category ||
    "Event";


  const organizer =
    eventData.organizerName ||
    eventData.organizer ||
    "LetsStudy Pro";


  content.innerHTML = `

    ${
      image
      ? `
        <img
          class="cover"
          src="${image}"
          alt="${escapeAttr(title)}"
        >
      `
      : ""
    }

    <h1>
      ${escapeHTML(title)}
    </h1>

    <div class="info">

      <div class="info-box">

        <div class="label">
          DATE
        </div>

        <div class="value">
          ${escapeHTML(date || "TBA")}
        </div>

      </div>

      <div class="info-box">

        <div class="label">
          TIME
        </div>

        <div class="value">
          ${escapeHTML(time || "TBA")}
        </div>

      </div>

      <div class="info-box">

        <div class="label">
          LOCATION
        </div>

        <div class="value">
          ${escapeHTML(location)}
        </div>

      </div>

      <div class="info-box">

        <div class="label">
          CATEGORY
        </div>

        <div class="value">
          ${escapeHTML(category)}
        </div>

      </div>

      <div class="info-box">

        <div class="label">
          ORGANIZER
        </div>

        <div class="value">
          ${escapeHTML(organizer)}
        </div>

      </div>

    </div>

    <div class="description">
      ${escapeHTML(description)}
    </div>

    <button
      id="registerBtn"
      class="register"
    >
      ${
        currentUser
        ? "Register for Event"
        : "Login to Register"
      }
    </button>

    <div
      id="status"
      class="status"
    ></div>

  `;


  document
    .getElementById(
      "registerBtn"
    )
    .addEventListener(
      "click",
      registerEvent
    );

}


/* =========================
   REGISTER
========================= */

async function registerEvent(){

  const button =
    document.getElementById(
      "registerBtn"
    );


  const status =
    document.getElementById(
      "status"
    );


  if(!currentUser){

    location.href =
      "login.html";

    return;

  }


  button.disabled = true;

  button.textContent =
    "Registering...";


  try{

    const token =
      await currentUser.getIdToken();


    const response =
      await fetch(
        "/api/events/register",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + token
          },

          body:JSON.stringify({

            eventId:
              eventData.id ||
              eventData.documentId ||
              eventId,

            eventTitle:
              eventData.title ||
              eventData.name ||
              ""

          })

        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Registration failed"
      );

    }


    status.className =
      "status show success";

    status.textContent =
      "You are successfully registered for this event.";

    button.textContent =
      "Registered";


  }catch(error){

    status.className =
      "status show error";

    status.textContent =
      error.message ||
      "Unable to register.";

    button.disabled = false;

    button.textContent =
      "Register for Event";

  }

}


/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value) return "";

  try{

    const date =
      new Date(value);

    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return String(value);

    }

    return date.toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

  }catch(e){

    return String(value);

  }

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}


function safeImage(url){

  if(!url) return "";

  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );

    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(e){}

  return "";

}


/* =========================
   START
========================= */

loadEvent();

</script>

</body>
</html>
