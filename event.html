<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Events | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.home{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1100px;
  margin:30px auto;
}

.hero{
  margin-bottom:20px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#64748b;
}

.search{
  background:#fff;
  padding:15px;
  border-radius:13px;
  margin-bottom:18px;
  box-shadow:0 4px 18px #00000008;
}

.search input{
  width:100%;
  padding:13px;
  border:1px solid #dce1e8;
  border-radius:9px;
  outline:none;
}

.filters{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.filters button{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:9px 14px;
  border-radius:20px;
  cursor:pointer;
}

.filters button.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(260px,1fr));
  gap:17px;
}

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 18px #00000009;
}

.cover{
  width:100%;
  height:165px;
  object-fit:cover;
  background:#e5e7eb;
}

.body{
  padding:17px;
}

.category{
  color:#2563eb;
  font-size:12px;
  font-weight:700;
  margin-bottom:7px;
}

.title{
  font-size:19px;
  font-weight:800;
  margin-bottom:8px;
}

.description{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.meta{
  margin:14px 0;
  color:#64748b;
  font-size:13px;
  line-height:1.7;
}

.view{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:11px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.empty{
  text-align:center;
  padding:65px 20px;
  color:#64748b;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="home"
    onclick="location.href='index.html'"
  >
    Home
  </button>

</header>

<main class="container">

  <section class="hero">

    <h1>Events</h1>

    <p>
      Discover upcoming events and activities.
    </p>

  </section>

  <div class="search">

    <input
      id="search"
      type="search"
      placeholder="Search events..."
    >

  </div>

  <div class="filters">

    <button
      class="active"
      data-category="all"
    >
      All
    </button>

    <button data-category="Education">
      Education
    </button>

    <button data-category="Technology">
      Technology
    </button>

    <button data-category="Business">
      Business
    </button>

    <button data-category="Career">
      Career
    </button>

    <button data-category="Other">
      Other
    </button>

  </div>

  <section
    id="grid"
    class="grid"
  >

    <div class="empty">
      Loading events...
    </div>

  </section>

</main>

<script type="module">

/*
==================================================
EVENTS PUBLIC PAGE

READ:
  GET /api/data?collection=events

DETAIL:
  event-details.html?id=EVENT_ID

Admin:
  NOT USED
==================================================
*/


const grid =
  document.getElementById(
    "grid"
  );

const search =
  document.getElementById(
    "search"
  );

const filterButtons =
  document.querySelectorAll(
    ".filters button"
  );


let events = [];

let activeCategory = "all";


/* ================================
   LOAD EVENTS
================================ */

async function loadEvents(){

  try{

    const response =
      await fetch(
        "/api/data?collection=events&limit=100"
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load events"
      );

    }


    events =
      Array.isArray(result.results)
      ? result.results
      : [];


    render();

  }catch(error){

    console.error(
      "EVENTS ERROR:",
      error
    );

    grid.innerHTML = `

      <div class="empty">

        <h3>
          Unable to load events
        </h3>

        <p>
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


/* ================================
   RENDER
================================ */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    events.filter(event => {

      const category =
        String(
          event.category ||
          ""
        );


      const categoryMatch =
        activeCategory === "all" ||
        category.toLowerCase() ===
        activeCategory.toLowerCase();


      const text = [

        event.title,
        event.name,
        event.description,
        event.category,
        event.location,
        event.venue,
        event.organizer

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      return (
        categoryMatch &&
        text.includes(keyword)
      );

    });


  if(!filtered.length){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No events found
        </h3>

        <p>
          Try another search or category.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered
      .map(createCard)
      .join("");

}


/* ================================
   EVENT CARD
================================ */

function createCard(event){

  const id =
    event.id ||
    event.documentId ||
    event.eventId ||
    "";


  const title =
    event.title ||
    event.name ||
    "Untitled Event";


  const description =
    event.description ||
    "Discover this event on LetsStudy Pro.";


  const category =
    event.category ||
    "Event";


  const image =
    safeImage(
      event.image ||
      event.coverImage ||
      event.thumbnail
    );


  const date =
    formatDate(
      event.date ||
      event.eventDate ||
      event.startDate
    );


  const time =
    event.time ||
    event.startTime ||
    "";


  const location =
    event.location ||
    event.venue ||
    "Online";


  return `

    <article class="card">

      ${
        image
        ? `
          <img
            class="cover"
            src="${image}"
            alt="${escapeAttr(title)}"
            loading="lazy"
          >
        `
        : `
          <div
            class="cover"
            aria-hidden="true"
          ></div>
        `
      }

      <div class="body">

        <div class="category">

          ${escapeHTML(category)}

        </div>

        <div class="title">

          ${escapeHTML(title)}

        </div>

        <div class="description">

          ${escapeHTML(description)}

        </div>

        <div class="meta">

          ${
            date
            ? "📅 " +
              escapeHTML(date)
            : ""
          }

          ${
            time
            ? "<br>🕐 " +
              escapeHTML(time)
            : ""
          }

          ${
            location
            ? "<br>📍 " +
              escapeHTML(location)
            : ""
          }

        </div>

        <button
          class="view"
          data-id="${escapeAttr(id)}"
        >
          View Event
        </button>

      </div>

    </article>

  `;

}


/* ================================
   OPEN EVENT
================================ */

grid.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".view"
      );


    if(!button) return;


    const id =
      button.dataset.id;


    if(!id){

      return;

    }


    location.href =
      "event-details.html?id=" +
      encodeURIComponent(id);

  }
);


/* ================================
   SEARCH
================================ */

search.addEventListener(
  "input",
  render
);


/* ================================
   FILTERS
================================ */

filterButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        filterButtons.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        activeCategory =
          button.dataset.category ||
          "all";


        render();

      }
    );

  }
);


/* ================================
   DATE
================================ */

function formatDate(value){

  if(!value) return "";

  try{

    const date =
      new Date(value);


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return String(value);

    }


    return date.toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

  }catch(error){

    return String(value);

  }

}


/* ================================
   IMAGE SECURITY
================================ */

function safeImage(url){

  if(!url) return "";

  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );


    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(error){}


  return "";

}


/* ================================
   SECURITY
================================ */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}


/* ================================
   START
================================ */

loadEvents();

</script>

</body>
</html>
