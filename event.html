<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --primary:#7c3aed;
    --primary-dark:#6d28d9;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;
    --danger:#dc2626;
    --success:#15803d;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.header h1{
    margin:0;
    font-size:19px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.container{
    max-width:1150px;
    margin:auto;
    padding:24px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

button:active{
    transform:translateY(1px);
}

.primary{
    background:var(--primary);
    color:#fff;
}

.primary:hover{
    background:var(--primary-dark);
}

.secondary{
    background:#e2e8f0;
    color:#334155;
}

.danger{
    background:#fee2e2;
    color:#b91c1c;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search{
    flex:1;
    padding:11px 12px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
}

.search:focus{
    border-color:var(--primary);
}

.filter{
    min-width:150px;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:#fff;
}

.event-list{
    display:grid;
    gap:12px;
}

.event-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:17px;
    display:grid;
    grid-template-columns:75px 1fr auto;
    gap:17px;
    align-items:center;
}

.event-date{
    text-align:center;
    border-right:1px solid var(--border);
    padding-right:15px;
}

.event-day{
    font-size:26px;
    font-weight:900;
}

.event-month{
    color:var(--primary);
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
}

.event-info h2{
    margin:0 0 7px;
    font-size:15px;
}

.event-meta{
    color:var(--muted);
    font-size:10px;
    line-height:1.8;
}

.status{
    display:inline-block;
    margin-top:7px;
    padding:4px 8px;
    border-radius:20px;
    font-size:9px;
    font-weight:900;
}

.scheduled{
    background:#dbeafe;
    color:#1d4ed8;
}

.confirmed{
    background:#dcfce7;
    color:#166534;
}

.draft{
    background:#fef3c7;
    color:#92400e;
}

.completed{
    background:#e2e8f0;
    color:#475569;
}

.cancelled{
    background:#fee2e2;
    color:#b91c1c;
}

.event-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.empty{
    display:none;
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
}

.empty h2{
    margin-bottom:6px;
}

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(15,23,42,.55);
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(560px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:12px;
    padding:22px;
}

.modal-card h2{
    margin:0 0 20px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    color:var(--muted);
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:10px 11px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
    font:inherit;
    background:#fff;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--primary);
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin:5px 0 15px;
    color:#475569;
    font-size:11px;
}

.checkbox-row input{
    width:16px;
    height:16px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    padding:12px 15px;
    border-radius:8px;
    background:#172033;
    color:#fff;
    font-size:11px;
    opacity:0;
    pointer-events:none;
    transform:translateY(10px);
    transition:.2s;
    z-index:2000;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:750px){

    .header{
        padding:0 12px;
    }

    .container{
        padding:12px;
    }

    .event-card{
        grid-template-columns:1fr;
    }

    .event-date{
        text-align:left;
        border-right:0;
        border-bottom:1px solid var(--border);
        padding:0 0 10px;
    }

    .event-actions{
        justify-content:flex-start;
    }
}

@media(max-width:600px){

    .toolbar{
        flex-direction:column;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

    .modal-actions{
        flex-direction:column-reverse;
    }

    .modal-actions button{
        width:100%;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>Events</h1>

    <div class="header-actions">

        <button
            class="secondary"
            onclick="clearCompletedEvents()">
            Clear Completed
        </button>

        <button
            class="primary"
            onclick="openCreateModal()">
            + Create Event
        </button>

    </div>

</header>


<main class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search events..."
            oninput="renderEvents()">

        <select
            id="filter"
            class="filter"
            onchange="renderEvents()">

            <option value="all">
                All events
            </option>

            <option value="scheduled">
                Scheduled
            </option>

            <option value="confirmed">
                Confirmed
            </option>

            <option value="draft">
                Draft
            </option>

            <option value="completed">
                Completed
            </option>

            <option value="cancelled">
                Cancelled
            </option>

        </select>

    </div>


    <section
        id="eventList"
        class="event-list">
    </section>


    <div
        id="empty"
        class="empty">

        <h2>
            No events found
        </h2>

        <p>
            Create your first event to get started.
        </p>

        <button
            class="primary"
            onclick="openCreateModal()">
            Create Event
        </button>

    </div>

</main>


<!-- CREATE / EDIT MODAL -->

<div
    id="eventModal"
    class="modal">

    <div class="modal-card">

        <h2 id="modalTitle">
            Create Event
        </h2>


        <form
            id="eventForm"
            onsubmit="saveEvent(event)">

            <input
                id="eventId"
                type="hidden">


            <div class="form-group">

                <label for="title">
                    Event Title
                </label>

                <input
                    id="title"
                    type="text"
                    placeholder="Team meeting"
                    required>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    rows="4"
                    placeholder="Add event details..."></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        id="date"
                        type="date"
                        required>

                </div>


                <div class="form-group">

                    <label for="time">
                        Time
                    </label>

                    <input
                        id="time"
                        type="time"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    id="location"
                    type="text"
                    placeholder="Office, online, or address">

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="eventType">
                        Event Type
                    </label>

                    <select id="eventType">

                        <option value="meeting">
                            Meeting
                        </option>

                        <option value="appointment">
                            Appointment
                        </option>

                        <option value="personal">
                            Personal
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="scheduled">
                            Scheduled
                        </option>

                        <option value="confirmed">
                            Confirmed
                        </option>

                        <option value="draft">
                            Draft
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="attendees">
                    Attendees
                </label>

                <input
                    id="attendees"
                    type="text"
                    placeholder="john@example.com, jane@example.com">

            </div>


            <div class="checkbox-row">

                <input
                    id="reminder"
                    type="checkbox"
                    checked>

                <label for="reminder">
                    Enable reminder
                </label>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary"
                    onclick="closeModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary">
                    Save Event
                </button>

            </div>

        </form>

    </div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

const STORAGE_KEY =
    "events-data";

let events = [];


/* =========================
   STORAGE
========================= */

function loadEvents(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if(!saved){

        events = [];

        return;

    }

    try{

        const parsed =
            JSON.parse(saved);

        events =
            Array.isArray(parsed)
                ? parsed
                : [];

    }catch(error){

        events = [];

    }

}


function saveEvents(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(events)
    );

}


/* =========================
   DEFAULT DATE
========================= */

function today(){

    return new Date()
        .toISOString()
        .split("T")[0];

}


/* =========================
   MODAL
========================= */

function openCreateModal(){

    document.getElementById(
        "eventForm"
    ).reset();

    document.getElementById(
        "eventId"
    ).value = "";

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Create Event";

    document.getElementById(
        "date"
    ).value =
        today();

    document.getElementById(
        "status"
    ).value =
        "scheduled";

    document.getElementById(
        "reminder"
    ).checked =
        true;

    document.getElementById(
        "eventModal"
    ).classList.add(
        "show"
    );

}


function openEditModal(id){

    const event =
        events.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if(!event){

        return;

    }

    document.getElementById(
        "eventId"
    ).value =
        event.id;

    document.getElementById(
        "title"
    ).value =
        event.title || "";

    document.getElementById(
        "description"
    ).value =
        event.description || "";

    document.getElementById(
        "date"
    ).value =
        event.date || "";

    document.getElementById(
        "time"
    ).value =
        event.time || "";

    document.getElementById(
        "location"
    ).value =
        event.location || "";

    document.getElementById(
        "eventType"
    ).value =
        event.eventType || "other";

    document.getElementById(
        "status"
    ).value =
        event.status || "scheduled";

    document.getElementById(
        "attendees"
    ).value =
        Array.isArray(event.attendees)
            ? event.attendees.join(", ")
            : "";

    document.getElementById(
        "reminder"
    ).checked =
        Boolean(event.reminder);

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Event";

    document.getElementById(
        "eventModal"
    ).classList.add(
        "show"
    );

}


function closeModal(){

    document.getElementById(
        "eventModal"
    ).classList.remove(
        "show"
    );

}


/* =========================
   SAVE EVENT
========================= */

function saveEvent(event){

    event.preventDefault();


    const id =
        document.getElementById(
            "eventId"
        ).value;


    const data = {

        title:
            document.getElementById(
                "title"
            ).value.trim(),

        description:
            document.getElementById(
                "description"
            ).value.trim(),

        date:
            document.getElementById(
                "date"
            ).value,

        time:
            document.getElementById(
                "time"
            ).value,

        location:
            document.getElementById(
                "location"
            ).value.trim(),

        eventType:
            document.getElementById(
                "eventType"
            ).value,

        status:
            document.getElementById(
                "status"
            ).value,

        attendees:
            document.getElementById(
                "attendees"
            ).value
            .split(",")
            .map(
                item =>
                    item.trim()
            )
            .filter(Boolean),

        reminder:
            document.getElementById(
                "reminder"
            ).checked

    };


    if(!data.title){

        showToast(
            "Enter an event title."
        );

        return;

    }


    if(!data.date){

        showToast(
            "Choose an event date."
        );

        return;

    }


    if(!data.time){

        showToast(
            "Choose an event time."
        );

        return;

    }


    if(id){

        const index =
            events.findIndex(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if(index !== -1){

            events[index] = {

                ...events[index],

                ...data,

                updatedAt:
                    new Date()
                    .toISOString()

            };

        }

        showToast(
            "Event updated."
        );

    }else{

        events.push({

            id:
                Date.now(),

            ...data,

            createdAt:
                new Date()
                .toISOString()

        });

        showToast(
            "Event created."
        );

    }


    saveEvents();

    closeModal();

    renderEvents();

}


/* =========================
   RENDER
========================= */

function renderEvents(){

    const list =
        document.getElementById(
            "eventList"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const query =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();

    const filter =
        document.getElementById(
            "filter"
        ).value;


    list.innerHTML = "";


    const filtered =
        events
        .filter(
            event => {

                const text =
                    [
                        event.title,
                        event.description,
                        event.location,
                        event.eventType,
                        ...(Array.isArray(event.attendees)
                            ? event.attendees
                            : [])
                    ]
                    .join(" ")
                    .toLowerCase();


                if(
                    !text.includes(
                        query
                    )
                ){

                    return false;

                }


                if(
                    filter !== "all" &&
                    event.status !== filter
                ){

                    return false;

                }


                return true;

            }
        )
        .sort(
            (a,b) => {

                const first =
                    new Date(
                        `${a.date || "9999-12-31"}T${a.time || "23:59"}`
                    );

                const second =
                    new Date(
                        `${b.date || "9999-12-31"}T${b.time || "23:59"}`
                    );

                return first - second;

            }
        );


    if(!filtered.length){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        event => {

            const article =
                document.createElement(
                    "article"
                );

            article.className =
                "event-card";


            const date =
                event.date
                    ? new Date(
                        event.date +
                        "T00:00:00"
                      )
                    : null;


            const day =
                date
                    ? date.getDate()
                    : "—";


            const month =
                date
                    ? date.toLocaleString(
                        "en",
                        {
                            month:"short"
                        }
                      )
                    : "—";


            const formattedDate =
    date
        ? date.toLocaleDateString(
            undefined,
            {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            }
          )
        : "No date";


const attendeeCount =
    Array.isArray(event.attendees)
        ? event.attendees.length
        : 0;


article.innerHTML = `

    <div class="event-date">

        <div class="event-day">
            ${day}
        </div>

        <div class="event-month">
            ${escapeHTML(month)}
        </div>

    </div>


    <div class="event-info">

        <h2>
            ${escapeHTML(event.title)}
        </h2>

        <div class="event-meta">

            ${escapeHTML(formattedDate)}

            ·

            ${escapeHTML(
                event.time || "No time"
            )}

            ${
                event.location
                    ? `
                        <br>
                        ${escapeHTML(
                            event.location
                        )}
                      `
                    : ""
            }

            ${
                attendeeCount
                    ? `
                        <br>
                        ${attendeeCount}
                        attendee${attendeeCount === 1 ? "" : "s"}
                      `
                    : ""
            }

        </div>


        <span
            class="status ${safeClass(event.status)}">

            ${escapeHTML(
                (
                    event.status ||
                    "scheduled"
                ).toUpperCase()
            )}

        </span>

    </div>


    <div class="event-actions">

        <button
            class="secondary"
            onclick="viewEvent(${event.id})">
            View
        </button>

        <button
            class="primary"
            onclick="openEditModal(${event.id})">
            Edit
        </button>

        ${
            event.status !== "completed"
                ? `
                    <button
                        class="secondary"
                        onclick="completeEvent(${event.id})">
                        Complete
                    </button>
                  `
                : ""
        }

        <button
            class="danger"
            onclick="deleteEvent(${event.id})">
            Delete
        </button>

    </div>

`;


list.appendChild(article);

        }
    );

}


/* =========================
   VIEW EVENT
========================= */

function viewEvent(id){

    const event =
        events.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if(!event){
        return;
    }

    const params =
        new URLSearchParams();

    params.set(
        "id",
        event.id
    );

    window.location.href =
        "event-details.html?" +
        params.toString();

}


/* =========================
   COMPLETE EVENT
========================= */

function completeEvent(id){

    const event =
        events.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if(!event){
        return;
    }

    event.status =
        "completed";

    saveEvents();

    renderEvents();

    showToast(
        "Event marked as completed."
    );

}


/* =========================
   DELETE EVENT
========================= */

function deleteEvent(id){

    const event =
        events.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if(!event){
        return;
    }

    if(
        !confirm(
            `Delete "${event.title}"?`
        )
    ){
        return;
    }

    events =
        events.filter(
            item =>
                String(item.id) !==
                String(id)
        );

    saveEvents();

    renderEvents();

    showToast(
        "Event deleted."
    );

}


/* =========================
   CLEAR COMPLETED EVENTS
========================= */

function clearCompletedEvents(){

    const hasCompleted =
        events.some(
            event =>
                event.status ===
                "completed"
        );

    if(!hasCompleted){

        showToast(
            "There are no completed events."
        );

        return;
    }

    if(
        !confirm(
            "Delete all completed events?"
        )
    ){
        return;
    }

    events =
        events.filter(
            event =>
                event.status !==
                "completed"
        );

    saveEvents();

    renderEvents();

    showToast(
        "Completed events cleared."
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   SAFE STATUS CLASS
========================= */

function safeClass(value){

    const allowed = [
        "scheduled",
        "confirmed",
        "draft",
        "completed",
        "cancelled"
    ];

    return allowed.includes(value)
        ? value
        : "scheduled";

}


/* =========================
   TOAST
========================= */

let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================
   CLOSE MODAL WHEN CLICKING
   OUTSIDE THE FORM
========================= */

document.getElementById(
    "eventModal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closeModal();

        }

    }
);


/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeModal();

        }

    }
);


/* =========================
   START APPLICATION
========================= */

loadEvents();

renderEvents();

</script>

</body>
</html>
