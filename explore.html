<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Explore Courses | LetsStudy Pro</title><style>
*{box-sizing:border-box}

:root{
 --primary:#2563eb;
 --primary2:#1d4ed8;
 --bg:#f5f7fb;
 --card:#fff;
 --text:#172033;
 --muted:#64748b;
 --border:#e5e7eb;
}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--text);
}

button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

header{
 height:64px;
 background:#fff;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 gap:12px;
 padding:0 18px;
 position:sticky;
 top:0;
 z-index:100;
}

.logo{
 font-weight:900;
 font-size:17px;
 color:var(--primary);
}

.logo span{color:var(--text)}

.header-title{
 flex:1;
 font-weight:700;
 font-size:16px;
}

.header-btn{
 border:0;
 background:#eff6ff;
 color:var(--primary2);
 padding:9px 11px;
 border-radius:9px;
}

main{
 max-width:1250px;
 margin:auto;
 padding:18px;
}

.hero{
 background:linear-gradient(135deg,#172554,#2563eb);
 color:#fff;
 border-radius:20px;
 padding:28px;
 margin-bottom:18px;
}

.hero h1{
 margin:0 0 7px;
 font-size:27px;
}

.hero p{
 margin:0;
 color:#dbeafe;
 font-size:12px;
}

.search{
 margin-top:20px;
 background:#fff;
 border-radius:12px;
 padding:8px;
 display:flex;
 gap:8px;
}

.search input{
 flex:1;
 border:0;
 outline:0;
 padding:12px;
 color:#172033;
 min-width:0;
}

.search button{
 border:0;
 background:var(--primary);
 color:#fff;
 border-radius:9px;
 padding:0 20px;
 font-weight:700;
}

.filters{
 display:grid;
 grid-template-columns:2fr 1fr 1fr 1fr;
 gap:10px;
 margin-bottom:15px;
}

.filters input,
.filters select{
 width:100%;
 padding:11px;
 background:#fff;
 border:1px solid var(--border);
 border-radius:9px;
 outline:none;
 color:var(--text);
}

.categories{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding-bottom:8px;
 margin-bottom:14px;
}

.category{
 white-space:nowrap;
 border:1px solid var(--border);
 background:#fff;
 color:#475569;
 padding:9px 15px;
 border-radius:20px;
 font-size:11px;
}

.category.active{
 background:var(--primary);
 color:#fff;
 border-color:var(--primary);
}

.result-bar{
 display:flex;
 align-items:center;
 margin-bottom:12px;
}

.result-bar strong{
 flex:1;
 font-size:12px;
}

.result-bar span{
 font-size:10px;
 color:var(--muted);
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:16px;
}

.course{
 background:#fff;
 border:1px solid var(--border);
 border-radius:16px;
 overflow:hidden;
 transition:.2s;
}

.course:hover{
 transform:translateY(-3px);
 box-shadow:0 12px 30px rgba(15,23,42,.08);
}

.thumb{
 height:170px;
 background:#e2e8f0;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
}

.thumb img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.placeholder{
 font-size:48px;
}

.course-body{
 padding:15px;
}

.badge{
 display:inline-block;
 background:#eff6ff;
 color:#1d4ed8;
 border-radius:6px;
 padding:5px 8px;
 font-size:9px;
 margin-bottom:8px;
}

.course-title{
 font-weight:800;
 font-size:15px;
 line-height:1.4;
}

.description{
 color:var(--muted);
 font-size:10px;
 line-height:1.5;
 margin:7px 0;
 height:30px;
 overflow:hidden;
}

.meta{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin:11px 0;
 font-size:9px;
 color:var(--muted);
}

.course-footer{
 display:flex;
 align-items:center;
 gap:8px;
 border-top:1px solid #f1f5f9;
 padding-top:11px;
}

.price{
 flex:1;
 font-size:14px;
 font-weight:900;
}

.view{
 border:0;
 background:var(--primary);
 color:#fff;
 border-radius:8px;
 padding:9px 12px;
 font-size:10px;
 font-weight:700;
}

.loading,
.empty{
 grid-column:1/-1;
 background:#fff;
 border:1px solid var(--border);
 border-radius:15px;
 padding:50px 20px;
 text-align:center;
 color:var(--muted);
 font-size:12px;
}

footer{
 text-align:center;
 padding:30px 10px;
 color:#94a3b8;
 font-size:10px;
}

@media(max-width:950px){
 .filters{grid-template-columns:1fr 1fr}
 .grid{grid-template-columns:1fr 1fr}
}

@media(max-width:600px){
 main{padding:10px}
 .hero{padding:20px}
 .hero h1{font-size:22px}
 .filters{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
 .header-title{font-size:14px}
}
</style></head><body><header><div class="logo">
LETSSTUDY <span>PRO</span>
</div><div class="header-title">
Explore
</div><button
class="header-btn"
onclick="location.href='dashboard.html'">
🏠
</button>

<button
class="header-btn"
onclick="location.href='dashboard-course.html'">
📚
</button>

</header><main><section class="hero"><h1>Explore Courses 🚀</h1><p>
Discover courses, gain new skills and build your future with LetsStudy Pro.
</p><div class="search"><input
id="search"
type="search"
placeholder="Search courses, subjects, skills..."
oninput="renderCourses()">

<button onclick="renderCourses()">
Search
</button></div></section><section class="filters"><input
id="keyword"
placeholder="Course name..."
oninput="renderCourses()">

<select
id="categorySelect"
onchange="renderCourses()">

<option value="">All Categories</option>
<option value="Physics">Physics</option>
<option value="Chemistry">Chemistry</option>
<option value="Mathematics">Mathematics</option>
<option value="Biology">Biology</option>
<option value="Technology">Technology</option>
<option value="Business">Business</option>
<option value="Marketing">Marketing</option>
<option value="Programming">Programming</option></select><select
id="level"
onchange="renderCourses()">

<option value="">All Levels</option>
<option value="Beginner">Beginner</option>
<option value="Intermediate">Intermediate</option>
<option value="Advanced">Advanced</option>
<option value="All Levels">All Levels</option></select><select
id="sort"
onchange="renderCourses()">

<option value="newest">Newest</option>
<option value="az">A-Z</option>
<option value="low">Price: Low → High</option>
<option value="high">Price: High → Low</option></select></section><div class="categories"><button
class="category active"
onclick="category(this,'')">
All
</button>

<button
class="category"
onclick="category(this,'Physics')">
Physics
</button>

<button
class="category"
onclick="category(this,'Chemistry')">
Chemistry
</button>

<button
class="category"
onclick="category(this,'Mathematics')">
Mathematics
</button>

<button
class="category"
onclick="category(this,'Biology')">
Biology
</button>

<button
class="category"
onclick="category(this,'Technology')">
Technology
</button>

<button
class="category"
onclick="category(this,'Business')">
Business
</button>

</div><div class="result-bar"><strong>
Available Courses
</strong><span id="count">
Loading...
</span></div><section
id="courseGrid"
class="grid"><div class="loading">
📚 Loading courses...
</div></section><footer>
© 2026 LetsStudy Pro • Learn • Connect • Grow
</footer></main><script type="module">

import{
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
 getAuth,
 onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
 getFirestore,
 collection,
 getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================
 FIREBASE
===================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


let currentUser=null;

let allCourses=[];

let selectedCategory="";


/* =====================================
 AUTH
===================================== */

onAuthStateChanged(
auth,
user=>{

currentUser=user||null;

loadCourses();

});


/* =====================================
 LOAD COURSES
===================================== */

async function loadCourses(){

const grid=
document.getElementById("courseGrid");

try{

const snapshot=
await getDocs(
collection(db,"courses")
);

allCourses=
snapshot.docs.map(
item=>({

id:item.id,
...item.data()

})
);

renderCourses();

}catch(error){

console.error(error);

grid.innerHTML=`

<div class="empty">

⚠️ Unable to load courses.

<br><br>

${escapeHTML(error.message)}

</div>

`;

}

}


/* =====================================
 CATEGORY
===================================== */

window.category=function(
button,
value
){

selectedCategory=value;

document
.querySelectorAll(".category")
.forEach(
item=>{
item.classList.remove("active");
}
);

button.classList.add("active");

document.getElementById(
"categorySelect"
).value=value;

renderCourses();

};


/* =====================================
 RENDER
===================================== */

window.renderCourses=function(){

const grid=
document.getElementById("courseGrid");

const search=
(
document.getElementById("search").value||
""
).toLowerCase().trim();

const keyword=
(
document.getElementById("keyword").value||
""
).toLowerCase().trim();

const categoryValue=
document.getElementById(
"categorySelect"
).value;

const level=
document.getElementById("level").value;

const sort=
document.getElementById("sort").value;

if(categoryValue)
selectedCategory=categoryValue;


const text=
search||keyword;


let filtered=
allCourses.filter(course=>{

const title=
String(
course.title||
course.name||
""
).toLowerCase();

const description=
String(
course.description||
""
).toLowerCase();

const category=
String(
course.category||
""
).toLowerCase();

const courseLevel=
String(
course.level||
"All Levels"
).toLowerCase();


const matchText=
!text||
title.includes(text)||
description.includes(text)||
category.includes(text);

const matchCategory=
!selectedCategory||
category===
selectedCategory.toLowerCase();

const matchLevel=
!level||
courseLevel===
level.toLowerCase();


return(
matchText&&
matchCategory&&
matchLevel
);

});


if(sort==="az"){

filtered.sort(
(a,b)=>
String(
a.title||a.name||""
).localeCompare(
String(
b.title||b.name||""
)
)
);

}


if(sort==="low"){

filtered.sort(
(a,b)=>
Number(a.price||0)-
Number(b.price||0)
);

}


if(sort==="high"){

filtered.sort(
(a,b)=>
Number(b.price||0)-
Number(a.price||0)
);

}


document.getElementById(
"count"
).textContent=
`${filtered.length} course${
filtered.length===1?"":"s"
}`;


if(!filtered.length){

grid.innerHTML=`

<div class="empty">

🔎

<br><br>

No courses found.

<br><br>

Try another search or category.

</div>

`;

return;

}


grid.innerHTML=
filtered.map(
course=>{

const title=
course.title||
course.name||
"Untitled Course";

const image=
course.thumbnail||
course.image||
course.imageUrl||
"";

const price=
Number(course.price||0);

const priceText=
price<=0
?
"Free"
:
`TZS ${price.toLocaleString()}`;


return`

<article class="course">

<div class="thumb">

${
image
?
`
<img
src="${escapeHTML(image)}"
alt="${escapeHTML(title)}"
onerror="this.style.display='none'">
`
:
`
<div class="placeholder">
📚
</div>
`
}

</div>


<div class="course-body">

<div class="badge">

${escapeHTML(
course.category||
"Course"
)}

</div>


<div class="course-title">

${escapeHTML(title)}

</div>


<div class="description">

${escapeHTML(
course.description||
"Learn practical skills with LetsStudy Pro."
)}

</div>


<div class="meta">

<span>
📊 ${escapeHTML(
course.level||
"All Levels"
)}
</span>

<span>
⏱ ${escapeHTML(
course.duration||
"Self paced"
)}
</span>

</div>


<div class="course-footer">

<div class="price">
${priceText}
</div>

<button
class="view"
onclick="openCourse('${escapeAttribute(course.id)}')">

View Course

</button>

</div>

</div>

</article>

`;

}
).join("");

};


/* =====================================
 COURSE PAGE
===================================== */

window.openCourse=function(id){

location.href=
"course.html?courseId="+
encodeURIComponent(id);

};


/* =====================================
 SECURITY
===================================== */

function escapeHTML(value){

return String(value??"")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value??"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}

</script></body>
</html>
