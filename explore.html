<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Explore | LetsStudy Pro</title>

<meta name="description"
content="Explore courses, resources, careers, jobs, scholarships, businesses, services and events on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.home{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1150px;
  margin:30px auto;
}

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  font-size:32px;
  margin-bottom:9px;
}

.hero p{
  color:#64748b;
}

.search{
  background:#fff;
  padding:15px;
  border-radius:14px;
  box-shadow:0 4px 20px #00000008;
  margin-bottom:20px;
}

.search input{
  width:100%;
  padding:14px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  font-size:15px;
}

.categories{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.categories button{
  background:#fff;
  border:1px solid #dbe2ea;
  padding:9px 14px;
  border-radius:20px;
  cursor:pointer;
}

.categories button.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.section{
  margin-bottom:32px;
}

.section-title{
  font-size:21px;
  margin-bottom:14px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(245px,1fr));
  gap:15px;
}

.card{
  background:#fff;
  padding:18px;
  border-radius:14px;
  box-shadow:0 4px 18px #00000008;
}

.icon{
  width:48px;
  height:48px;
  border-radius:12px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  margin-bottom:13px;
}

.card h3{
  font-size:17px;
  margin-bottom:7px;
}

.card p{
  color:#64748b;
  font-size:13px;
  line-height:1.5;
  min-height:39px;
}

.meta{
  margin:11px 0;
  font-size:12px;
  color:#94a3b8;
}

.open{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.loading,
.empty{
  background:#fff;
  padding:40px 20px;
  border-radius:14px;
  text-align:center;
  color:#64748b;
}

.error{
  color:#b91c1c;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="home"
    onclick="location.href='index.html'"
  >
    Home
  </button>

</header>

<main class="container">

  <section class="hero">

    <h1>Explore LetsStudy Pro</h1>

    <p>
      Discover learning, opportunities,
      services and more.
    </p>

  </section>


  <div class="search">

    <input
      id="search"
      type="search"
      placeholder="Search everything..."
      autocomplete="off"
    >

  </div>


  <div class="categories">

    <button
      class="active"
      data-type="all"
    >
      All
    </button>

    <button data-type="courses">
      Courses
    </button>

    <button data-type="resources">
      Resources
    </button>

    <button data-type="careers">
      Careers
    </button>

    <button data-type="jobs">
      Jobs
    </button>

    <button data-type="scholarships">
      Scholarships
    </button>

    <button data-type="businesses">
      Businesses
    </button>

    <button data-type="services">
      Services
    </button>

    <button data-type="events">
      Events
    </button>

  </div>


  <section class="section">

    <h2 class="section-title">
      Explore
    </h2>

    <div
      id="grid"
      class="grid"
    >

      <div class="loading">
        Loading...
      </div>

    </div>

  </section>

</main>


<script>

/*
==================================================
EXPLORE

Single public API engine:

/api/data?collection=...

No Admin API.
No Firebase Admin SDK.
No direct Firestore access.

Public collections only.
==================================================
*/


const COLLECTIONS = [

  {
    key:"courses",
    label:"Courses",
    icon:"🎓",
    page:"course.html"
  },

  {
    key:"resources",
    label:"Resources",
    icon:"📚",
    page:"resources-details.html"
  },

  {
    key:"careers",
    label:"Careers",
    icon:"💼",
    page:"career.html"
  },

  {
    key:"jobs",
    label:"Jobs",
    icon:"🧑‍💼",
    page:"jobs.html"
  },

  {
    key:"scholarships",
    label:"Scholarships",
    icon:"🎓",
    page:"scholarships.html"
  },

  {
    key:"businesses",
    label:"Businesses",
    icon:"🏢",
    page:"business.html"
  },

  {
    key:"services",
    label:"Services",
    icon:"🛠️",
    page:"services-view.html"
  },

  {
    key:"events",
    label:"Events",
    icon:"📅",
    page:"event-details.html"
  }

];


const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");

const categoryButtons =
  document.querySelectorAll(
    ".categories button"
  );


let data = [];

let activeType = "all";


/* =================================
   LOAD
================================= */

async function load(){

  grid.innerHTML = `
    <div class="loading">
      Loading...
    </div>
  `;


  try{

    const responses =
      await Promise.all(

        COLLECTIONS.map(
          async collection => {

            const response =
              await fetch(
                "/api/data?collection=" +
                encodeURIComponent(
                  collection.key
                ) +
                "&limit=20"
              );


            const result =
              await response.json();


            if(!response.ok){

              return [];

            }


            const items =
              Array.isArray(
                result.results
              )
              ? result.results
              : [];


            return items.map(
              item => ({

                ...item,

                _type:
                  collection.key,

                _label:
                  collection.label,

                _icon:
                  collection.icon,

                _page:
                  collection.page

              })
            );

          }
        )

      );


    data =
      responses.flat();


    render();


  }catch(error){

    console.error(
      "EXPLORE ERROR:",
      error
    );


    grid.innerHTML = `

      <div class="empty error">

        Unable to load explore data.

      </div>

    `;

  }

}


/* =================================
   RENDER
================================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  let results =
    data.filter(item => {

      if(
        activeType !== "all" &&
        item._type !== activeType
      ){

        return false;

      }


      const text = [

        item.title,
        item.name,
        item.description,
        item.category,
        item.location,
        item.company,
        item.organizer

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      return text.includes(keyword);

    });


  if(!results.length){

    grid.innerHTML = `

      <div class="empty">

        <h3>No results found</h3>

        <p>
          Try another search or category.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    results
      .slice(0,100)
      .map(createCard)
      .join("");

}


/* =================================
   CARD
================================= */

function createCard(item){

  const id =
    item.id ||
    item.documentId ||
    item.courseId ||
    item.resourceId ||
    item.eventId ||
    item.businessId ||
    item.serviceId ||
    item.jobId ||
    item.scholarshipId ||
    "";


  const title =
    item.title ||
    item.name ||
    "Untitled";


  const description =
    item.description ||
    "View more details.";


  const category =
    item.category ||
    item._label;


  return `

    <article class="card">

      <div class="icon">

        ${item._icon}

      </div>

      <h3>

        ${escapeHTML(title)}

      </h3>

      <p>

        ${escapeHTML(description)}

      </p>

      <div class="meta">

        ${escapeHTML(
          item._label
        )}

        ${
          category &&
          category !== item._label
          ? " • " +
            escapeHTML(category)
          : ""
        }

      </div>

      <button
        class="open"
        data-id="${escapeAttr(id)}"
        data-page="${escapeAttr(
          item._page
        )}"
      >

        View

      </button>

    </article>

  `;

}


/* =================================
   OPEN
================================= */

grid.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".open"
      );


    if(!button) return;


    const id =
      button.dataset.id;


    const page =
      button.dataset.page;


    if(!id || !page){

      return;

    }


    location.href =
      page +
      "?id=" +
      encodeURIComponent(id);

  }
);


/* =================================
   SEARCH
================================= */

search.addEventListener(
  "input",
  render
);


/* =================================
   CATEGORY
================================= */

categoryButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        categoryButtons.forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        activeType =
          button.dataset.type ||
          "all";


        render();

      }
    );

  }
);


/* =================================
   SECURITY
================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}


/* =================================
   START
================================= */

load();

</script>

</body>
</html>
