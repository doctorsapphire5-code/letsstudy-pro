<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Extensions | Developer Market</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --primary:#2563eb;
 --dark:#172033;
 --muted:#718096;
 --bg:#f4f6fa;
 --card:#fff;
 --border:#e2e8f0;
 --success:#15803d;
 --danger:#dc2626;
}

body{
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--dark);
}

button,input,select{
 font:inherit;
}

button{cursor:pointer}

.topbar{
 height:64px;
 background:#fff;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:20;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:900;
}

.logo{
 width:38px;
 height:38px;
 border-radius:10px;
 background:var(--dark);
 color:#fff;
 display:grid;
 place-items:center;
}

.actions{
 display:flex;
 gap:8px;
}

.btn{
 border:0;
 border-radius:8px;
 padding:10px 14px;
 font-weight:800;
}

.primary{
 background:var(--primary);
 color:#fff;
}

.secondary{
 background:#eaf0f7;
 color:var(--dark);
}

.danger{
 background:var(--danger);
 color:#fff;
}

.layout{
 display:grid;
 grid-template-columns:220px 1fr;
 min-height:calc(100vh - 64px);
}

.sidebar{
 background:#fff;
 border-right:1px solid var(--border);
 padding:18px 12px;
}

.sidebar h4{
 font-size:11px;
 color:var(--muted);
 text-transform:uppercase;
 margin-bottom:10px;
}

.nav{
 display:grid;
 gap:4px;
}

.nav a{
 text-decoration:none;
 color:#596478;
 padding:11px;
 border-radius:8px;
 font-weight:700;
}

.nav a:hover,
.nav a.active{
 background:#edf3ff;
 color:var(--primary);
}

.main{
 max-width:1350px;
 width:100%;
 margin:auto;
 padding:24px;
}

.header{
 display:flex;
 justify-content:space-between;
 gap:15px;
 margin-bottom:20px;
}

.header h1{
 font-size:28px;
 margin:5px 0;
}

.muted{
 color:var(--muted);
 font-size:13px;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin-bottom:18px;
}

.stat{
 background:#fff;
 border:1px solid var(--border);
 border-radius:12px;
 padding:16px;
}

.stat strong{
 display:block;
 font-size:22px;
 margin-top:7px;
}

.toolbar{
 background:#fff;
 border:1px solid var(--border);
 border-radius:12px;
 padding:14px;
 display:flex;
 gap:10px;
 margin-bottom:18px;
}

input,select{
 border:1px solid #d7deea;
 border-radius:8px;
 padding:11px;
 outline:none;
 background:#fff;
}

input:focus,
select:focus{
 border-color:var(--primary);
}

.search{
 flex:1;
}

.categories{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-bottom:18px;
}

.category{
 border:1px solid var(--border);
 background:#fff;
 padding:8px 12px;
 border-radius:20px;
 font-weight:700;
}

.category.active{
 background:#edf3ff;
 color:var(--primary);
 border-color:var(--primary);
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.extension{
 background:#fff;
 border:1px solid var(--border);
 border-radius:13px;
 padding:16px;
}

.ext-top{
 display:flex;
 align-items:center;
 gap:12px;
}

.icon{
 width:50px;
 height:50px;
 border-radius:12px;
 background:#eef2ff;
 display:grid;
 place-items:center;
 font-size:25px;
}

.extension h3{
 margin-top:14px;
 font-size:17px;
}

.description{
 color:var(--muted);
 font-size:13px;
 line-height:1.5;
 margin:8px 0;
}

.meta{
 display:flex;
 justify-content:space-between;
 font-size:12px;
 color:var(--muted);
}

.ext-actions{
 display:flex;
 gap:7px;
 margin-top:13px;
}

.ext-actions button{
 flex:1;
}

.empty{
 background:#fff;
 border:1px dashed var(--border);
 border-radius:12px;
 padding:40px;
 text-align:center;
 color:var(--muted);
 grid-column:1/-1;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.45);
 display:none;
 place-items:center;
 padding:20px;
 z-index:100;
}

.modal.show{
 display:grid;
}

.modal-box{
 background:#fff;
 border-radius:14px;
 width:100%;
 max-width:500px;
 padding:20px;
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}

.close{
 border:0;
 background:#edf2f7;
 border-radius:8px;
 padding:8px 11px;
}

.form{
 display:grid;
 gap:12px;
}

.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 background:var(--dark);
 color:#fff;
 padding:12px 16px;
 border-radius:9px;
 opacity:0;
 transform:translateY(10px);
 transition:.2s;
 z-index:200;
}

.toast.show{
 opacity:1;
 transform:translateY(0);
}

@media(max-width:1000px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .stats{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:750px){
 .layout{display:block}
 .sidebar{display:none}
 .grid{grid-template-columns:1fr}
 .toolbar{flex-direction:column}
 .header{flex-direction:column}
}

@media(max-width:500px){
 .main{padding:15px}
 .stats{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header class="topbar">

<div class="brand">
 <div class="logo">🧩</div>
 <span>Extension Market</span>
</div>

<div class="actions">
 <button class="btn secondary"
         onclick="openInstalled()">
 Installed
 </button>

 <button class="btn primary"
         onclick="openCreate()">
 + Create
 </button>
</div>

</header>


<div class="layout">

<aside class="sidebar">

<h4>Developer</h4>

<nav class="nav">

<a href="developer-market.html">
🛒 Market
</a>

<a href="extension.html" class="active">
🧩 Extensions
</a>

<a href="plugin-development.html">
🔌 Plugins
</a>

<a href="theme-development.html">
🎨 Themes
</a>

<a href="developer-settings.html">
⚙ Settings
</a>

</nav>

</aside>


<main class="main">

<section class="header">

<div>
<p class="muted">
Developer Market / Extensions
</p>

<h1>Extensions</h1>

<p class="muted">
Discover, install and manage developer extensions.
</p>
</div>

<button class="btn primary"
        onclick="openCreate()">
+ Create Extension
</button>

</section>


<section class="stats">

<div class="stat">
<span class="muted">Extensions</span>
<strong id="total">0</strong>
</div>

<div class="stat">
<span class="muted">Installed</span>
<strong id="installed">0</strong>
</div>

<div class="stat">
<span class="muted">Enabled</span>
<strong id="enabled">0</strong>
</div>

<div class="stat">
<span class="muted">Categories</span>
<strong id="categories">0</strong>
</div>

</section>


<div class="toolbar">

<input
 id="search"
 class="search"
 placeholder="Search extensions..."
>

<select id="sort">
<option value="popular">Popular</option>
<option value="name">Name</option>
<option value="newest">Newest</option>
</select>

</div>


<div class="categories">

<button class="category active"
 data-cat="All"
 onclick="setCategory('All')">
All
</button>

<button class="category"
 data-cat="Productivity"
 onclick="setCategory('Productivity')">
Productivity
</button>

<button class="category"
 data-cat="Development"
 onclick="setCategory('Development')">
Development
</button>

<button class="category"
 data-cat="Design"
 onclick="setCategory('Design')">
Design
</button>

<button class="category"
 data-cat="SEO"
 onclick="setCategory('SEO')">
SEO
</button>

</div>


<section id="grid" class="grid"></section>

</main>

</div>


<!-- CREATE MODAL -->

<div id="createModal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2>Create Extension</h2>

<button class="close"
 onclick="closeModal('createModal')">
✕
</button>

</div>

<div class="form">

<input id="name"
 placeholder="Extension name">

<input id="description"
 placeholder="Description">

<select id="category">
<option>Development</option>
<option>Productivity</option>
<option>Design</option>
<option>SEO</option>
</select>

<input id="icon"
 placeholder="Icon e.g. 🧩">

<button class="btn primary"
 onclick="createExtension()">
Publish Extension
</button>

</div>

</div>
</div>


<!-- INSTALLED MODAL -->

<div id="installedModal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2>Installed Extensions</h2>

<button class="close"
 onclick="closeModal('installedModal')">
✕
</button>

</div>

<div id="installedList"></div>

</div>
</div>


<div id="toast" class="toast"></div>


<script>

const KEY =
    "letsstudy_extensions";

const INSTALLED_KEY =
    "letsstudy_installed_extensions";


let category =
    "All";

let extensions = [];

let installed = [];


/* =========================
   HELPERS
========================= */

function get(id){
    return document.getElementById(id);
}


function escapeHTML(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            char => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[char])
        );

}


function toast(message){

    const el = get("toast");

    el.textContent = message;

    el.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(
            () => el.classList.remove("show"),
            2200
        );

}


/* =========================
   DEFAULT EXTENSIONS
========================= */

const defaults = [

{
 id:"seo-tools",
 name:"SEO Tools",
 description:"Analyze titles, keywords and metadata.",
 category:"SEO",
 icon:"🔎",
 downloads:1200,
 created:Date.now()
},

{
 id:"code-helper",
 name:"Code Helper",
 description:"Useful developer utilities for faster coding.",
 category:"Development",
 icon:"💻",
 downloads:2500,
 created:Date.now()
},

{
 id:"design-tools",
 name:"Design Tools",
 description:"Quick tools for creators and designers.",
 category:"Design",
 icon:"🎨",
 downloads:1800,
 created:Date.now()
},

{
 id:"productivity",
 name:"Productivity Suite",
 description:"Improve workflow and manage tasks.",
 category:"Productivity",
 icon:"⚡",
 downloads:3100,
 created:Date.now()
}

];


/* =========================
   LOAD
========================= */

function load(){

    const saved =
        localStorage.getItem(KEY);

    extensions =
        saved
        ? JSON.parse(saved)
        : defaults;

    const savedInstalled =
        localStorage.getItem(
            INSTALLED_KEY
        );

    installed =
        savedInstalled
        ? JSON.parse(savedInstalled)
        : [];

}


/* =========================
   SAVE
========================= */

function save(){

    localStorage.setItem(
        KEY,
        JSON.stringify(extensions)
    );

    localStorage.setItem(
        INSTALLED_KEY,
        JSON.stringify(installed)
    );

}


/* =========================
   FILTER
========================= */

function filtered(){

    const search =
        get("search")
        .value
        .toLowerCase()
        .trim();

    let list =
        extensions.filter(ext => {

            const matchCategory =
                category === "All" ||
                ext.category === category;

            const matchSearch =
                !search ||
                ext.name
                    .toLowerCase()
                    .includes(search) ||
                ext.description
                    .toLowerCase()
                    .includes(search);

            return (
                matchCategory &&
                matchSearch
            );

        });


    const sort =
        get("sort").value;


    if(sort === "name"){

        list.sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name
                )
        );

    }


    if(sort === "newest"){

        list.sort(
            (a,b) =>
                b.created - a.created
        );

    }


    if(sort === "popular"){

        list.sort(
            (a,b) =>
                b.downloads -
                a.downloads
        );

    }


    return list;

}


/* =========================
   RENDER
========================= */

function render(){

    const grid =
        get("grid");

    const list =
        filtered();


    get("total").textContent =
        extensions.length;


    get("installed").textContent =
        installed.length;


    get("enabled").textContent =
        installed.filter(
            x => x.enabled
        ).length;


    get("categories").textContent =
        new Set(
            extensions.map(
                x => x.category
            )
        ).size;


    if(!list.length){

        grid.innerHTML = `
            <div class="empty">
                🔍<br><br>
                No extensions found.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        list.map(
            extensionCard
        ).join("");

}


/* =========================
   CARD
========================= */

function extensionCard(ext){

    const item =
        installed.find(
            x => x.id === ext.id
        );


    const isInstalled =
        !!item;


    const isEnabled =
        item?.enabled;


    return `

<article class="extension">

<div class="ext-top">

<div class="icon">
${escapeHTML(ext.icon || "🧩")}
</div>

<div>

<strong>
${escapeHTML(ext.name)}
</strong>

<p class="muted">
${escapeHTML(ext.category)}
</p>

</div>

</div>


<h3>
${escapeHTML(ext.name)}
</h3>


<p class="description">
${escapeHTML(ext.description)}
</p>


<div class="meta">

<span>
⬇ ${Number(
ext.downloads || 0
).toLocaleString()}
</span>

<span>
${escapeHTML(ext.category)}
</span>

</div>


<div class="ext-actions">

${
isInstalled

? `
<button
 class="btn ${
     isEnabled
     ? "secondary"
     : "primary"
 }"
 onclick="toggle('${ext.id}')">

${isEnabled
 ? "Disable"
 : "Enable"}

</button>

<button
 class="btn danger"
 onclick="uninstall('${ext.id}')">

Uninstall

</button>
`

: `
<button
 class="btn primary"
 onclick="install('${ext.id}')">

Install

</button>
`
}

</div>

</article>

`;

}


/* =========================
   INSTALL
========================= */

function install(id){

    const ext =
        extensions.find(
            x => x.id === id
        );

    if(!ext) return;


    if(
        installed.some(
            x => x.id === id
        )
    ){

        toast(
            "Already installed."
        );

        return;

    }


    installed.push({

        id:id,

        enabled:true,

        installedAt:
            Date.now()

    });


    ext.downloads =
        Number(ext.downloads || 0) + 1;


    save();

    render();

    toast(
        ext.name +
        " installed successfully."
    );

}


/* =========================
   UNINSTALL
========================= */

function uninstall(id){

    installed =
        installed.filter(
            x => x.id !== id
        );


    save();

    render();

    toast(
        "Extension uninstalled."
    );

}


/* =========================
   ENABLE / DISABLE
========================= */

function toggle(id){

    const item =
        installed.find(
            x => x.id === id
        );

    if(!item) return;


    item.enabled =
        !item.enabled;


    save();

    render();

    toast(
        item.enabled
        ? "Extension enabled."
        : "Extension disabled."
    );

}


/* =========================
   CATEGORY
========================= */

function setCategory(value){

    category = value;


    document
        .querySelectorAll(
            ".category"
        )
        .forEach(
            btn =>
                btn.classList.toggle(
                    "active",
                    btn.dataset.cat === value
                )
        );


    render();

}


/* =========================
   CREATE
========================= */

function openCreate(){

    get("createModal")
        .classList.add("show");

}


function createExtension(){

    const name =
        get("name")
        .value
        .trim();

    const description =
        get("description")
        .value
        .trim();

    const categoryValue =
        get("category")
        .value;

    const icon =
        get("icon")
        .value
        .trim() ||
        "🧩";


    if(!name){

        toast(
            "Enter extension name."
        );

        return;

    }


    extensions.unshift({

        id:
            "ext-" +
            Date.now(),

        name:name,

        description:
            description ||
            "Developer extension.",

        category:
            categoryValue,

        icon:icon,

        downloads:0,

        created:
            Date.now()

    });


    save();

    render();

    closeModal(
        "createModal"
    );


    get("name").value = "";
    get("description").value = "";
    get("icon").value = "";


    toast(
        "Extension published."
    );

}


/* =========================
   INSTALLED
========================= */

function openInstalled(){

    const container =
        get("installedList");


    if(!installed.length){

        container.innerHTML = `
            <div class="empty">
                No installed extensions.
            </div>
        `;

    }else{

        container.innerHTML =
            installed.map(item => {

                const ext =
                    extensions.find(
                        x => x.id === item.id
                    );

                if(!ext) return "";

                return `

                <div
                    style="
                        padding:12px 0;
                        border-bottom:
                        1px solid var(--border)
                    "
                >

                    <strong>
                        ${escapeHTML(
                            ext.icon
                        )}
                        ${escapeHTML(
                            ext.name
                        )}
                    </strong>

                    <p class="muted">
                        ${
                            item.enabled
                            ? "Enabled"
                            : "Disabled"
                        }
                    </p>

                </div>

                `;

            }).join("");

    }


    get("installedModal")
        .classList.add("show");

}


/* =========================
   MODAL
========================= */

function closeModal(id){

    get(id)
        ?.classList.remove(
            "show"
        );

}


document
.querySelectorAll(".modal")
.forEach(modal => {

    modal.addEventListener(
        "click",
        e => {

            if(
                e.target === modal
            ){

                modal.classList.remove(
                    "show"
                );

            }

        }
    );

});


/* =========================
   EVENTS
========================= */

get("search")
.addEventListener(
    "input",
    render
);

get("sort")
.addEventListener(
    "change",
    render
);


document.addEventListener(
    "keydown",
    e => {

        if(e.key === "Escape"){

            document
            .querySelectorAll(
                ".modal.show"
            )
            .forEach(
                modal =>
                    modal.classList.remove(
                        "show"
                    )
            );

        }

    }
);


/* =========================
   INITIALIZATION
========================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        load();

        render();

    }
);


/* =========================
   GLOBAL API
========================= */

window.install =
    install;

window.uninstall =
    uninstall;

window.toggle =
    toggle;

window.setCategory =
    setCategory;

window.openCreate =
    openCreate;

window.createExtension =
    createExtension;

window.openInstalled =
    openInstalled;

window.closeModal =
    closeModal;

</script>

</body>
</html>
