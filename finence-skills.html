<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Finance Skills</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    /* =========================================
       HERO
    ========================================= */

    header {
      padding: 70px 0;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          #064e3b,
          #059669,
          #10b981
        );
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 30px;
      background: rgba(255,255,255,.12);
      font-size: .85rem;
      font-weight: 700;
    }

    header h1 {
      margin: 0 0 15px;
      font-size: clamp(2.3rem, 6vw, 4rem);
    }

    header p {
      max-width: 780px;
      margin: 0;
      color: #d1fae5;
      line-height: 1.75;
    }

    /* =========================================
       FILTERS
    ========================================= */

    main {
      padding: 40px 0;
    }

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
      padding: 20px;
      margin-bottom: 25px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .filter-group label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: var(--muted);
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    .input-wrap input {
      padding-left: 40px;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(5,150,105,.1);
    }

    /* =========================================
       RESULT BAR
    ========================================= */

    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .result-count {
      color: var(--muted);
    }

    .result-count strong {
      color: var(--text);
    }

    .result-bar select {
      width: auto;
      min-width: 190px;
    }

    /* =========================================
       SKILLS GRID
    ========================================= */

    .skills-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .skill-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: .25s ease;
    }

    .skill-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(15,23,42,.13);
    }

    .skill-cover {
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 4rem;
    }

    .cover-budget {
      background: linear-gradient(135deg,#064e3b,#059669);
    }

    .cover-accounting {
      background: linear-gradient(135deg,#1d4ed8,#1e3a8a);
    }

    .cover-investment {
      background: linear-gradient(135deg,#7c3aed,#4c1d95);
    }

    .cover-analysis {
      background: linear-gradient(135deg,#0891b2,#164e63);
    }

    .cover-tax {
      background: linear-gradient(135deg,#ea580c,#9a3412);
    }

    .cover-risk {
      background: linear-gradient(135deg,#dc2626,#7f1d1d);
    }

    .cover-personal {
      background: linear-gradient(135deg,#db2777,#831843);
    }

    .cover-corporate {
      background: linear-gradient(135deg,#475569,#0f172a);
    }

    .skill-content {
      padding: 20px;
    }

    .skill-content h3 {
      margin: 10px 0;
      line-height: 1.35;
    }

    .skill-content p {
      min-height: 76px;
      margin: 0 0 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #ecfdf5;
      color: #047857;
      font-size: .77rem;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    /* =========================================
       EMPTY
    ========================================= */

    .empty {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--muted);
    }

    .empty i {
      font-size: 3rem;
    }

    .empty h2 {
      color: var(--text);
    }

    /* =========================================
       MODAL
    ========================================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15,23,42,.75);
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      position: relative;
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      border-radius: 18px;
      background: #fff;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 16px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 30px;
      cursor: pointer;
    }

    .modal-box p {
      color: var(--muted);
      line-height: 1.7;
    }

    .modal-box li {
      margin: 10px 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .learning-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #ecfdf5;
      color: #047857;
    }

    footer {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 750px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .result-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .result-bar select {
        width: 100%;
      }

      .skill-content p {
        min-height: auto;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="container">

    <div class="eyebrow">
      <i class="fa-solid fa-coins"></i>
      Career Skills
    </div>

    <h1>
      Finance Skills
    </h1>

    <p>
      Develop practical financial skills in budgeting,
      accounting, investing, financial analysis, taxation,
      risk management, and personal finance.
    </p>

  </div>

</header>


<main class="container">

  <!-- =========================================
       FILTERS
  ========================================= -->

  <section class="filters">

    <div class="filter-group">

      <label for="search">
        Search Skills
      </label>

      <div class="input-wrap">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="search"
          id="search"
          placeholder="Search finance skills..."
        >

      </div>

    </div>


    <div class="filter-group">

      <label for="level">
        Level
      </label>

      <select id="level">

        <option value="all">
          All Levels
        </option>

        <option value="Beginner">
          Beginner
        </option>

        <option value="Intermediate">
          Intermediate
        </option>

        <option value="Advanced">
          Advanced
        </option>

      </select>

    </div>


    <div class="filter-group">

      <label for="category">
        Category
      </label>

      <select id="category">

        <option value="all">
          All Categories
        </option>

        <option value="Budgeting">
          Budgeting
        </option>

        <option value="Accounting">
          Accounting
        </option>

        <option value="Investment">
          Investment
        </option>

        <option value="Financial Analysis">
          Financial Analysis
        </option>

        <option value="Taxation">
          Taxation
        </option>

        <option value="Risk Management">
          Risk Management
        </option>

        <option value="Personal Finance">
          Personal Finance
        </option>

        <option value="Corporate Finance">
          Corporate Finance
        </option>

      </select>

    </div>

  </section>


  <!-- =========================================
       RESULT BAR
  ========================================= -->

  <div class="result-bar">

    <div class="result-count">

      Showing
      <strong id="resultCount">0</strong>
      finance skills

    </div>

    <select id="sort">

      <option value="popularity">
        Most Popular
      </option>

      <option value="az">
        A-Z
      </option>

      <option value="level">
        Level
      </option>

    </select>

  </div>


  <!-- =========================================
       SKILLS GRID
  ========================================= -->

  <section
    class="skills-grid"
    id="skillsGrid"
  ></section>

</main>


<!-- =========================================
     DETAILS MODAL
========================================= -->

<div
  class="modal"
  id="detailsModal"
  aria-hidden="true"
>

  <div class="modal-box">

    <button
      type="button"
      class="close"
      id="closeModal"
      aria-label="Close"
    >
      &times;
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<footer>

  <p>
    © 2026 Finance Skills Platform
  </p>

</footer>


<script>

  /* =========================================
     FINANCE SKILLS DATA
  ========================================= */

  const financeSkills = [

    {
      id: 1,
      title: "Budgeting & Financial Planning",
      category: "Budgeting",
      level: "Beginner",
      duration: "4 weeks",
      popularity: 100,
      icon: "fa-solid fa-wallet",

      description:
        "Learn how to create budgets, track expenses, manage cash flow, and plan financial goals effectively.",
      skills: [
        "Budget creation",

    {

      popularity: 98,
      icon: "fa-solid fa-calculator",
      cover: "accounting",

      skills: [
        "Bookkeeping",
        "Income statements",

      ]
    },


    {
      id: 3,
      title: "Investment Fundamentals",

      level: "Intermediate",
      duration: "8 weeks",
      popularity: 97,
      icon: "fa-solid fa-chart-line",
      cover: "investment",
      description:
        "Build an understanding of investments, diversification, returns, risk, and long-term investment strategies.",
      skills: [
        "Asset classes",
        "Diversification",
        "Investment risk",
        "Portfolio basics",
        "Return analysis"
      ]
    },


    {
      id: 4,
      title: "Financial Analysis",
      category: "Financial Analysis",
      level: "Advanced",
      duration: "8 weeks",
      popularity: 95,
      icon: "fa-solid fa-magnifying-glass-chart",
      cover: "analysis",
      description:
        "Learn how to analyze financial statements, ratios, performance indicators, and business financial health.",
      skills: [
        "Financial ratios",
        "Trend analysis",
        "Financial statements",
        "Performance analysis",
        "Forecasting"
      ]
    },


    {
      id: 5,
      title: "Taxation Basics",
      category: "Taxation",
      level: "Intermediate",
      duration: "5 weeks",
      popularity: 89,
      icon: "fa-solid fa-file-invoice-dollar",
      cover: "tax",
      description:
        "Develop a practical understanding of taxes, taxable income, deductions, records, and tax planning concepts.",
      skills: [
        "Tax concepts",
        "Taxable income",
        "Deductions",
        "Tax records",
        "Tax planning"
      ]
    },


    {
      id: 6,
      title: "Financial Risk Management",
      category: "Risk Management",
      level: "Advanced",
      duration: "7 weeks",
      popularity: 92,
      icon: "fa-solid fa-shield-halved",
      cover: "risk",
      description:
        "Learn how organizations identify, evaluate, monitor, and manage financial risks.",
      skills: [
        "Risk identification",
        "Risk assessment",
        "Credit risk",
        "Market risk",
        "Risk controls"
      ]
    },


    {
      id: 7,
      title: "Personal Finance",
      category: "Personal Finance",
      level: "Beginner",
      duration: "4 weeks",
      popularity: 99,
      icon: "fa-solid fa-piggy-bank",
      cover: "personal",
      description:
        "Build practical skills for managing personal income, expenses, savings, debt, and financial goals.",
      skills: [
        "Saving",
        "Debt management",
        "Emergency funds",
        "Personal budgeting",
        "Financial goals"
      ]
    },


    {
      id: 8,
      title: "Corporate Finance",
      category: "Corporate Finance",
      level: "Advanced",
      duration: "10 weeks",
      popularity: 90,
      icon: "fa-solid fa-building-columns",
      cover: "corporate",
      description:
        "Understand corporate financial decisions involving capital, investment, valuation, funding, and business performance.",
      skills: [
        "Capital budgeting",
        "Business valuation",
        "Capital structure",
        "Financial strategy",
        "Investment decisions"
      ]
    }

  ];


  /* =========================================
     DOM ELEMENTS
  ========================================= */

  const skillsGrid =
    document.getElementById("skillsGrid");

  const searchInput =
    document.getElementById("search");

  const levelSelect =
    document.getElementById("level");

  const categorySelect =
    document.getElementById("category");

  const sortSelect =
    document.getElementById("sort");

  const resultCount =
    document.getElementById("resultCount");

  const modal =
    document.getElementById("detailsModal");

  const modalContent =
    document.getElementById("modalContent");

  const closeModal =
    document.getElementById("closeModal");


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     RENDER SKILLS
  ========================================= */

  function renderSkills(list) {

    if (!list.length) {

      skillsGrid.innerHTML = `

        <div class="empty">

          <i class="fa-solid fa-coins"></i>

          <h2>
            No finance skills found
          </h2>

          <p>
            Try another search term or change
            your filters.
          </p>

        </div>

      `;

      resultCount.textContent = "0";

      return;
    }


    skillsGrid.innerHTML =
      list.map(skill => `

        <article class="skill-card">

          <div
            class="skill-cover cover-${skill.cover}"
          >

            <i class="${skill.icon}"></i>

          </div>


          <div class="skill-content">

            <div class="meta">

              <span class="badge">
                ${escapeHTML(skill.level)}
              </span>

              <span class="badge">
                ${escapeHTML(skill.category)}
              </span>

            </div>


            <h3>
              ${escapeHTML(skill.title)}
            </h3>


            <p>
              ${escapeHTML(skill.description)}
            </p>


            <div class="meta">

              <span class="badge">

                <i class="fa-regular fa-clock"></i>

                ${escapeHTML(skill.duration)}

              </span>


              <span class="badge">

                <i class="fa-solid fa-fire"></i>

                ${skill.popularity}%

              </span>

            </div>


            <button
              type="button"
              class="btn btn-primary"
              onclick="showDetails(${skill.id})"
            >
              View Details
            </button>

          </div>

        </article>

      `).join("");


    resultCount.textContent =
      list.length;

  }


  /* =========================================
     FILTER SKILLS
  ========================================= */

  function filterSkills() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    const level =
      levelSelect.value;

    const category =
      categorySelect.value;


    let filtered =
      financeSkills.filter(skill => {

        const searchableText = [

          skill.title,
          skill.category,
          skill.level,
          skill.description,
          skill.duration,
          ...skill.skills

        ]
          .join(" ")
          .toLowerCase();


        const matchesSearch =
          !search ||
          searchableText.includes(search);


        const matchesLevel =
          level === "all" ||
          skill.level === level;


        const matchesCategory =
          category === "all" ||
          skill.category === category;


        return (
          matchesSearch &&
          matchesLevel &&
          matchesCategory
        );

      });


    if (sortSelect.value === "az") {

      filtered.sort(
        (a, b) =>
          a.title.localeCompare(b.title)
      );

    }

    else if (sortSelect.value === "level") {

      const levelOrder = {
        Beginner: 1,
        Intermediate: 2,
        Advanced: 3
      };

      filtered.sort(
        (a, b) =>
          levelOrder[a.level] -
          levelOrder[b.level]
      );

    }

    else {

      filtered.sort(
        (a, b) =>
          b.popularity -
          a.popularity
      );

    }


    renderSkills(filtered);

  }


  /* =========================================
     SHOW DETAILS
  ========================
/* =========================================
   SHOW DETAILS
========================================= */

function showDetails(id) {

  const skill =
    financeSkills.find(
      item => item.id === id
    );

  if (!skill) {
    return;
  }

  modalContent.innerHTML = `

    <div
      class="skill-cover cover-${skill.cover}"
      style="
        border-radius:12px;
        margin-bottom:20px;
      "
    >
      <i class="${skill.icon}"></i>
    </div>

    <span class="badge">
      ${escapeHTML(skill.category)}
    </span>

    <h2>
      ${escapeHTML(skill.title)}
    </h2>

    <p>
      ${escapeHTML(skill.description)}
    </p>

    <p>
      <strong>Level:</strong>
      ${escapeHTML(skill.level)}
    </p>

    <p>
      <strong>Duration:</strong>
      ${escapeHTML(skill.duration)}
    </p>

    <h3>
      Key Skills
    </h3>

    <ul>

      ${skill.skills.map(item => `

        <li>
          <i class="fa-solid fa-check"></i>
          ${escapeHTML(item)}
        </li>

      `).join("")}

    </ul>

    <button
      type="button"
      class="btn btn-primary"
      onclick="startLearning(${skill.id})"
    >
      <i class="fa-solid fa-play"></i>
      Start Learning
    </button>

  `;

  modal.classList.add("active");

  modal.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.style.overflow = "hidden";
}


/* =========================================
   START LEARNING
========================================= */

function startLearning(id) {

  const skill =
    financeSkills.find(
      item => item.id === id
    );

  if (!skill) {
    return;
  }

  modalContent.innerHTML = `

    <div
      class="skill-cover cover-${skill.cover}"
      style="
        border-radius:12px;
        margin-bottom:20px;
      "
    >
      <i class="${skill.icon}"></i>
    </div>

    <span class="badge">
      ${escapeHTML(skill.category)}
    </span>

    <h2>
      Start Learning:
      ${escapeHTML(skill.title)}
    </h2>

    <p>
      Follow this learning path to develop
      practical finance skills.
    </p>

    <h3>
      Learning Path
    </h3>

    <ol>

      ${skill.skills.map((item, index) => `

        <li>
          <strong>
            Step ${index + 1}:
          </strong>
          ${escapeHTML(item)}
        </li>

      `).join("")}

    </ol>

    <div class="learning-box">

      <strong>
        Recommended Level:
      </strong>

      ${escapeHTML(skill.level)}

      <br><br>

      <strong>
        Estimated Duration:
      </strong>

      ${escapeHTML(skill.duration)}

    </div>

    <button
      type="button"
      class="btn btn-primary"
      style="margin-top:20px;"
      onclick="completeLearning(${skill.id})"
    >
      <i class="fa-solid fa-play"></i>
      Begin Course
    </button>

  `;

}


/* =========================================
   COMPLETE LEARNING
========================================= */

function completeLearning(id) {

  const skill =
    financeSkills.find(
      item => item.id === id
    );

  if (!skill) {
    return;
  }

  modalContent.innerHTML = `

    <div
      style="
        text-align:center;
        padding:20px 0;
      "
    >

      <div
        style="
          width:80px;
          height:80px;
          margin:0 auto 20px;
          display:flex;
          align-items:center;
          justify-content:center;
          border-radius:50%;
          background:#dcfce7;
          color:#16a34a;
          font-size:2rem;
        "
      >
        <i class="fa-solid fa-check"></i>
      </div>

      <h2>
        Course Ready!
      </h2>

      <p>
        You are ready to begin
        <strong>
          ${escapeHTML(skill.title)}
        </strong>.
      </p>

      <button
        type="button"
        class="btn btn-primary"
        onclick="closeDetails()"
      >
        Continue
      </button>

    </div>

  `;

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeDetails() {

  modal.classList.remove("active");

  modal.setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.style.overflow = "";

}


closeModal.addEventListener(
  "click",
  closeDetails
);


modal.addEventListener(
  "click",
  function(event) {

    if (event.target === modal) {
      closeDetails();
    }

  }
);


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {
      closeDetails();
    }

  }
);


/* =========================================
   EVENTS
========================================= */

searchInput.addEventListener(
  "input",
  filterSkills
);

levelSelect.addEventListener(
  "change",
  filterSkills
);

categorySelect.addEventListener(
  "change",
  filterSkills
);

sortSelect.addEventListener(
  "change",
  filterSkills
);


/* =========================================
   KEYBOARD SEARCH
========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "/" &&
      document.activeElement.tagName !== "INPUT" &&
      document.activeElement.tagName !== "SELECT" &&
      !modal.classList.contains("active")
    ) {

      event.preventDefault();

      searchInput.focus();

    }

  }
);


/* =========================================
   RESET FILTERS
========================================= */

function resetFilters() {

  searchInput.value = "";
  levelSelect.value = "all";
  categorySelect.value = "all";
  sortSelect.value = "popularity";

  filterSkills();

}


/* =========================================
   INITIAL LOAD
========================================= */

renderSkills(
  [...financeSkills].sort(
    (a, b) =>
      b.popularity -
      a.popularity
  )
);

</script>

</body>
</html>
