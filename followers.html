<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Followers</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --primary:#7c3aed;
    --primary-dark:#6d28d9;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;
    --danger:#dc2626;
    --success:#15803d;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.header h1{
    margin:0;
    font-size:19px;
}

.header-count{
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    margin-left:8px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:24px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search{
    flex:1;
    padding:11px 12px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
    font-size:11px;
}

.search:focus{
    border-color:var(--primary);
}

.filter{
    min-width:150px;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:#fff;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 13px;
    cursor:pointer;
    font-size:10px;
    font-weight:800;
}

.primary{
    background:var(--primary);
    color:#fff;
}

.primary:hover{
    background:var(--primary-dark);
}

.secondary{
    background:#e2e8f0;
    color:#334155;
}

.following{
    background:#dcfce7;
    color:var(--success);
}

.danger{
    background:#fee2e2;
    color:#b91c1c;
}

.followers-grid{
    display:grid;
    grid-template-columns:
        repeat(3,minmax(0,1fr));
    gap:14px;
}

.follower-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:11px;
    padding:18px;
}

.profile{
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:14px;
}

.avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#ede9fe;
    color:#5b21b6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:900;
    flex-shrink:0;
}

.name{
    font-size:12px;
    font-weight:900;
}

.username{
    margin-top:4px;
    color:var(--muted);
    font-size:9px;
}

.bio{
    color:#475569;
    font-size:10px;
    line-height:1.6;
    min-height:33px;
    margin-bottom:14px;
}

.stats{
    display:flex;
    gap:20px;
    padding:11px 0;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    margin-bottom:13px;
}

.stat strong{
    display:block;
    font-size:11px;
}

.stat span{
    color:var(--muted);
    font-size:8px;
}

.card-actions{
    display:flex;
    gap:7px;
}

.card-actions button{
    flex:1;
}

.empty{
    display:none;
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
}

.empty h2{
    margin-bottom:6px;
    color:var(--text);
}

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(15,23,42,.55);
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(500px,100%);
    background:#fff;
    border-radius:12px;
    padding:22px;
}

.modal-card h2{
    margin:0 0 18px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    color:var(--muted);
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:10px 11px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
    font:inherit;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:var(--primary);
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
}

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#172033;
    color:#fff;
    padding:11px 14px;
    border-radius:8px;
    font-size:10px;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.2s;
    z-index:2000;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:900px){
    .followers-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }
}

@media(max-width:650px){
    .header{
        padding:0 12px;
    }

    .container{
        padding:12px;
    }

    .toolbar{
        flex-direction:column;
    }

    .filter{
        width:100%;
    }

    .followers-grid{
        grid-template-columns:1fr;
    }

    .modal-actions{
        flex-direction:column-reverse;
    }

    .modal-actions button{
        width:100%;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>
        Followers
        <span
            id="headerCount"
            class="header-count">
            0
        </span>
    </h1>

    <button
        class="primary"
        onclick="openAddModal()">
        + Add Follower
    </button>

</header>


<main class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search followers..."
            oninput="renderFollowers()">

        <select
            id="filter"
            class="filter"
            onchange="renderFollowers()">

            <option value="all">
                All Followers
            </option>

            <option value="following">
                Following
            </option>

            <option value="not-following">
                Not Following
            </option>

        </select>

    </div>


    <section
        id="followersGrid"
        class="followers-grid">
    </section>


    <div
        id="empty"
        class="empty">

        <h2>
            No followers found
        </h2>

        <p>
            Try another search or add a new follower.
        </p>

    </div>

</main>


<!-- ADD FOLLOWER MODAL -->

<div
    id="modal"
    class="modal">

    <div class="modal-card">

        <h2>
            Add Follower
        </h2>


        <form
            id="followerForm"
            onsubmit="addFollower(event)">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="John Doe"
                    required>

            </div>


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="@johndoe"
                    required>

            </div>


            <div class="form-group">

                <label for="bio">
                    Bio
                </label>

                <textarea
                    id="bio"
                    placeholder="Short profile description..."></textarea>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary"
                    onclick="closeModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary">
                    Add Follower
                </button>

            </div>

        </form>

    </div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

const STORAGE_KEY =
    "followers-data";

let followers = [];


/* =========================
   LOAD DATA
========================= */

function loadFollowers(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if(saved){

        try{

            const parsed =
                JSON.parse(saved);

            followers =
                Array.isArray(parsed)
                    ? parsed
                    : [];

        }catch(error){

            followers = [];

        }

        return;

    }


    followers = [

        {
            id:1,
            name:"Alex Morgan",
            username:"@alexmorgan",
            bio:"Product designer and creative thinker.",
            followers:1240,
            following:320,
            isFollowing:true,
            createdAt:"2026-08-01T09:00:00"
        },

        {
            id:2,
            name:"Sarah Wilson",
            username:"@sarahwilson",
            bio:"Building useful things for the web.",
            followers:980,
            following:210,
            isFollowing:true,
            createdAt:"2026-08-02T10:30:00"
        },

        {
            id:3,
            name:"David Kim",
            username:"@davidkim",
            bio:"Developer, reader, and coffee enthusiast.",
            followers:2450,
            following:450,
            isFollowing:false,
            createdAt:"2026-08-03T12:00:00"
        },

        {
            id:4,
            name:"Maya Johnson",
            username:"@mayaj",
            bio:"Photography, travel, and storytelling.",
            followers:1730,
            following:390,
            isFollowing:true,
            createdAt:"2026-08-04T14:00:00"
        },

        {
            id:5,
            name:"Chris Brown",
            username:"@chrisbrown",
            bio:"Entrepreneur and technology enthusiast.",
            followers:3200,
            following:680,
            isFollowing:false,
            createdAt:"2026-08-05T15:20:00"
        },

        {
            id:6,
            name:"Emma Davis",
            username:"@emmadavis",
            bio:"Writer sharing ideas about creativity.",
            followers:870,
            following:190,
            isFollowing:true,
            createdAt:"2026-08-06T16:40:00"
        }

    ];


    saveFollowers();

}


/* =========================
   SAVE DATA
========================= */

function saveFollowers(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            followers
        )
    );

}


/* =========================
   RENDER
========================= */

function renderFollowers(){

    const grid =
        document.getElementById(
            "followersGrid"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const query =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();

    const filter =
        document.getElementById(
            "filter"
        ).value;


    let filtered =
        followers.filter(
            follower => {

                const content =
                    (
                        follower.name +
                        " " +
                        follower.username +
                        " " +
                        follower.bio
                    )
                    .toLowerCase();


                if(
                    !content.includes(
                        query
                    )
                ){

                    return false;

                }


                if(
                    filter ===
                    "following" &&
                    !follower.isFollowing
                ){

                    return false;

                }


                if(
                    filter ===
                    "not-following" &&
                    follower.isFollowing
                ){

                    return false;

                }


                return true;

            }
        );


    grid.innerHTML = "";


    document.getElementById(
        "headerCount"
    ).textContent =
        followers.length;


    if(!filtered.length){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        follower => {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "follower-card";


            const initial =
                (
                    follower.name ||
                    "U"
                )
                .charAt(0)
                .toUpperCase();


            card.innerHTML = `

                <div class="profile">

                    <div class="avatar">
                        ${escapeHTML(
                            initial
                        )}
                    </div>

                    <div>

                        <div class="name">
                            ${escapeHTML(
                                follower.name
                            )}
                        </div>

                        <div class="username">
                            ${escapeHTML(
                                follower.username
                            )}
                        </div>

                    </div>

                </div>


                <div class="bio">
                    ${escapeHTML(
                        follower.bio ||
                        "No bio available."
                    )}
                </div>


                <div class="stats">

                    <div class="stat">

                        <strong>
                            ${formatNumber(
                                follower.followers || 0
                            )}
                        </strong>

                        <span>
                            Followers
                        </span>

                    </div>


                    <div class="stat">

                        <strong>
                            ${formatNumber(
                                follower.following || 0
                            )}
                        </strong>

                        <span>
                            Following
                        </span>

                    </div>

                </div>


                <div class="card-actions">

                    <button
                        class="${
                            follower.isFollowing
                                ? "following"
                                : "primary"
                        }"
                        onclick="toggleFollow(${follower.id})">

                        ${
                            follower.isFollowing
                                ? "Following"
                                : "Follow"
                        }

                    </button>


                    <button
                        class="secondary"
                        onclick="viewProfile(${follower.id})">

                        View

                    </button>


                    <button
                        class="danger"
                        onclick="removeFollower(${follower.id})">

                        Remove

                    </button>

                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =========================
   FOLLOW / UNFOLLOW
========================= */

function toggleFollow(id){

    const follower =
        followers.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!follower){
        return;
    }


    follower.isFollowing =
        !follower.isFollowing;


    if(
        follower.isFollowing
    ){

        follower.followers =
            Number(
                follower.followers || 0
            ) + 1;

        showToast(
            "You are now following " +
            follower.name
        );

    }else{

        follower.followers =
            Math.max(
                0,
                Number(
                    follower.followers || 0
                ) - 1
            );

        showToast(
            "You unfollowed " +
            follower.name
        );

    }


    saveFollowers();

    renderFollowers();

}


/* =========================
   VIEW PROFILE
========================= */

function viewProfile(id){

    const follower =
        followers.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!follower){
        return;
    }


    showToast(
        "Opening " +
        follower.name +
        "'s profile."
    );

}


/* =========================
   REMOVE
========================= */

function removeFollower(id){

    const follower =
        followers.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!follower){
        return;
    }


    if(
        !confirm(
            "Remove " +
            follower.name +
            " from followers?"
        )
    ){

        return;

    }


    followers =
        followers.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    saveFollowers();

    renderFollowers();

    showToast(
        "Follower removed."
    );

}


/* =========================
   ADD FOLLOWER
========================= */

function openAddModal(){

    document.getElementById(
        "followerForm"
    ).reset();

    document.getElementById(
        "modal"
    ).classList.add(
        "show"
    );

}


function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove(
        "show"
    );

}


function addFollower(event){

    event.preventDefault();


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    let username =
        document.getElementById(
            "username"
        ).value.trim();


    const bio =
        document.getElementById(
            "bio"
        ).value.trim();


    if(
        !name ||
        !username
    ){

        return;

    }


    if(
        !username.startsWith("@")
    ){

        username =
            "@" +
            username;

    }


    followers.unshift({

        id:
            Date.now(),

        name,

        username,

        bio,

        followers:0,

        following:0,

        isFollowing:false,

        createdAt:
            new Date()
            .toISOString()

    });


    saveFollowers();

    closeModal();

    renderFollowers();

    showToast(
        "Follower added."
    );

}


/* =========================
   FORMAT NUMBER
========================= */

function formatNumber(
    number
){

    return new Intl.NumberFormat(
        "en-US",
        {
            notation:"compact",
            maximumFractionDigits:1
        }
    ).format(
        Number(number) || 0
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   TOAST
========================= */

let toastTimer = null;

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =======================
/* =========================
   MODAL EVENTS
========================= */

document.getElementById(
    "modal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closeModal();

        }

    }
);


/* =========================
   ESCAPE KEY
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeModal();

        }

    }
);


/* =========================
   START PAGE
========================= */

loadFollowers();

renderFollowers();

</script>

</body>
</html>
