<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Followers | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:800px;
  margin:30px auto;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 5px 25px #0000000a;
}

h1{
  font-size:28px;
  margin-bottom:6px;
}

.subtitle{
  color:#64748b;
  margin-bottom:22px;
}

.user-info{
  background:#f8fafc;
  padding:13px;
  border-radius:10px;
  margin-bottom:18px;
  color:#475569;
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.person{
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px;
  border:1px solid #e5e7eb;
  border-radius:11px;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.person-info{
  flex:1;
}

.name{
  font-weight:700;
}

.email{
  color:#64748b;
  font-size:13px;
  margin-top:3px;
}

.view{
  border:0;
  background:#eef2ff;
  color:#2563eb;
  padding:8px 11px;
  border-radius:7px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:45px 15px;
}

.error{
  color:#b91c1c;
}

.loading{
  text-align:center;
  color:#64748b;
  padding:35px;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>

<main class="container">

  <div class="card">

    <h1>Followers</h1>

    <p class="subtitle">
      People following your profile.
    </p>

    <div
      id="userInfo"
      class="user-info"
    >
      Checking account...
    </div>

    <div
      id="list"
      class="list"
    >
      <div class="loading">
        Loading followers...
      </div>
    </div>

  </div>

</main>

<script type="module">

/*
==================================================
FOLLOWERS

AUTH:
  Firebase Authentication

DATA:
  Authenticated API

ENDPOINT:
  GET /api/followers

ADMIN:
  NOT USED

Expected response:

{
  success:true,
  total:2,
  results:[
    {
      id:"...",
      name:"...",
      email:"...",
      photoURL:"..."
    }
  ]
}
==================================================
*/

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


/* =========================
   DOM
========================= */

const list =
  document.getElementById(
    "list"
  );

const userInfo =
  document.getElementById(
    "userInfo"
  );


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      userInfo.innerHTML = `
        You are not logged in.
      `;

      list.innerHTML = `
        <div class="empty">
          Please login to view your followers.
        </div>
      `;

      return;

    }


    userInfo.innerHTML = `

      Signed in as

      <strong>
        ${escapeHTML(
          user.displayName ||
          user.email ||
          "User"
        )}
      </strong>

    `;


    await loadFollowers(user);

  }
);


/* =========================
   LOAD FOLLOWERS
========================= */

async function loadFollowers(user){

  list.innerHTML = `
    <div class="loading">
      Loading followers...
    </div>
  `;


  try{

    const token =
      await user.getIdToken();


    const response =
      await fetch(
        "/api/followers",
        {
          method:"GET",

          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load followers"
      );

    }


    const followers =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    render(followers);


  }catch(error){

    console.error(
      "FOLLOWERS ERROR:",
      error
    );


    list.innerHTML = `

      <div class="empty error">

        Unable to load followers.

        <br>

        <small>
          ${escapeHTML(
            error.message
          )}
        </small>

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function render(followers){

  if(!followers.length){

    list.innerHTML = `

      <div class="empty">

        <h3>
          No followers yet
        </h3>

        <p>
          Your followers will appear here.
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML =
    followers
      .map(createPerson)
      .join("");

}


/* =========================
   PERSON
========================= */

function createPerson(person){

  const id =
    person.id ||
    person.uid ||
    person.userId ||
    "";


  const name =
    person.name ||
    person.displayName ||
    person.username ||
    "User";


  const email =
    person.email ||
    "";


  const photo =
    safeImage(
      person.photoURL ||
      person.photo ||
      person.avatar
    );


  const initial =
    escapeHTML(
      name
        .trim()
        .charAt(0)
        .toUpperCase() ||
      "U"
    );


  return `

    <article class="person">

      <div class="avatar">

        ${
          photo
          ? `
            <img
              src="${photo}"
              alt="${escapeAttr(name)}"
              loading="lazy"
            >
          `
          : initial
        }

      </div>

      <div class="person-info">

        <div class="name">
          ${escapeHTML(name)}
        </div>

        ${
          email
          ? `
            <div class="email">
              ${escapeHTML(email)}
            </div>
          `
          : ""
        }

      </div>

      ${
        id
        ? `
          <button
            class="view"
            data-id="${escapeAttr(id)}"
          >
            View
          </button>
        `
        : ""
      }

    </article>

  `;

}


/* =========================
   PROFILE
========================= */

list.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".view"
      );


    if(!button) return;


    const id =
      button.dataset.id;


    if(!id) return;


    location.href =
      "profile-community.html?id=" +
      encodeURIComponent(id);

  }
);


/* =========================
   IMAGE SECURITY
========================= */

function safeImage(url){

  if(!url) return "";

  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );


    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(error){}

  return "";

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}

</script>

</body>
</html>
