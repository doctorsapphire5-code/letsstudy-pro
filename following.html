<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Following | LetsStudy Pro</title>

<meta name="description"
content="View the people and profiles you follow on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  color:#172033;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:800px;
  margin:30px auto;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 5px 25px #0000000a;
}

h1{
  font-size:28px;
  margin-bottom:6px;
}

.subtitle{
  color:#64748b;
  margin-bottom:22px;
}

.user-info{
  background:#f8fafc;
  padding:13px;
  border-radius:10px;
  margin-bottom:18px;
  color:#475569;
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.person{
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px;
  border:1px solid #e5e7eb;
  border-radius:11px;
  background:#fff;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.person-info{
  flex:1;
  min-width:0;
}

.name{
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.username{
  color:#64748b;
  font-size:13px;
  margin-top:3px;
}

.view{
  border:0;
  background:#eef2ff;
  color:#2563eb;
  padding:8px 11px;
  border-radius:7px;
  cursor:pointer;
}

.loading,
.empty{
  text-align:center;
  color:#64748b;
  padding:45px 15px;
}

.error{
  color:#b91c1c;
}

@media(max-width:500px){

  .container{
    width:94%;
    margin:20px auto;
  }

  .card{
    padding:17px;
  }

  h1{
    font-size:25px;
  }

  .person{
    padding:11px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <div class="card">

    <h1>Following</h1>

    <p class="subtitle">
      People and profiles you follow.
    </p>

    <div
      id="userInfo"
      class="user-info"
    >
      Checking account...
    </div>

    <div
      id="list"
      class="list"
    >

      <div class="loading">
        Loading following...
      </div>

    </div>

  </div>

</main>


<script type="module">

/*
==================================================
FOLLOWING.HTML

AUTHENTICATION
Firebase Authentication

DATA
Authenticated API

ENDPOINT
GET /api/following

ADMIN
NOT USED

Expected API response:

{
  success: true,
  total: 2,
  results: [
    {
      id: "...",
      name: "...",
      username: "...",
      photoURL: "..."
    }
  ]
}

==================================================
*/


/* =========================
   FIREBASE
========================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


/* =========================
   DOM
========================= */

const userInfo =
  document.getElementById(
    "userInfo"
  );

const list =
  document.getElementById(
    "list"
  );


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      userInfo.innerHTML = `
        You are not logged in.
      `;

      list.innerHTML = `

        <div class="empty">

          Please login to view
          the profiles you follow.

        </div>

      `;

      return;

    }


    userInfo.innerHTML = `

      Signed in as

      <strong>
        ${escapeHTML(
          user.displayName ||
          user.email ||
          "User"
        )}
      </strong>

    `;


    await loadFollowing(user);

  }
);


/* =========================
   LOAD FOLLOWING
========================= */

async function loadFollowing(user){

  list.innerHTML = `

    <div class="loading">
      Loading following...
    </div>

  `;


  try{

    const token =
      await user.getIdToken();


    const response =
      await fetch(
        "/api/following",
        {
          method:"GET",

          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load following"
      );

    }


    const following =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    renderFollowing(
      following
    );


  }catch(error){

    console.error(
      "FOLLOWING ERROR:",
      error
    );


    list.innerHTML = `

      <div class="empty error">

        Unable to load following.

        <br><br>

        <small>
          ${escapeHTML(
            error.message
          )}
        </small>

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function renderFollowing(
  following
){

  if(!following.length){

    list.innerHTML = `

      <div class="empty">

        <h3>
          You are not following anyone yet
        </h3>

        <p>
          Profiles you follow will appear here.
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML =
    following
      .map(createPerson)
      .join("");

}


/* =========================
   PERSON CARD
========================= */

function createPerson(
  person
){

  const id =
    person.id ||
    person.uid ||
    person.userId ||
    "";


  const name =
    person.name ||
    person.displayName ||
    person.username ||
    "User";


  const username =
    person.username
      ? "@" + String(
          person.username
        ).replace(/^@/,"")
      : "";


  const photo =
    safeImage(
      person.photoURL ||
      person.photo ||
      person.avatar
    );


  const initial =
    escapeHTML(
      String(name)
        .trim()
        .charAt(0)
        .toUpperCase() ||
      "U"
    );


  return `

    <article class="person">

      <div class="avatar">

        ${
          photo
          ? `

            <img
              src="${photo}"
              alt="${escapeAttr(name)}"
              loading="lazy"
            >

          `
          : initial
        }

      </div>


      <div class="person-info">

        <div class="name">

          ${escapeHTML(name)}

        </div>


        ${
          username
          ? `

            <div class="username">

              ${escapeHTML(username)}

            </div>

          `
          : ""
        }

      </div>


      ${
        id
        ? `

          <button
            class="view"
            data-id="${escapeAttr(id)}"
          >
            View
          </button>

        `
        : ""
      }

    </article>

  `;

}


/* =========================
   PROFILE OPEN
========================= */

list.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".view"
      );


    if(!button) return;


    const id =
      button.dataset.id;


    if(!id) return;


    location.href =
      "profile-community.html?id=" +
      encodeURIComponent(id);

  }
);


/* =========================
   IMAGE SECURITY
========================= */

function safeImage(url){

  if(!url) return "";


  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );


    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(error){}


  return "";

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}

</script>

</body>
</html>
