<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Connections | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="Manage followers and following on Let'sStudy Pro Community."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
  --success:#166534;
  --danger:#b91c1c;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
}


/* =========================
   HEADER
========================= */

.topbar{
  min-height:64px;

  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:0 20px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;

  font-size:14px;
  font-weight:850;
}

.brand-icon{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--primary);
  color:#fff;
}

.back-btn{
  border:0;

  padding:9px 13px;

  border-radius:10px;

  background:var(--soft);
  color:var(--text);

  font-size:12px;
  font-weight:750;

  cursor:pointer;
}


/* =========================
   MAIN
========================= */

.container{
  width:100%;
  max-width:850px;

  margin:auto;

  padding:
    28px 16px
    70px;
}

.hero{
  margin-bottom:20px;
}

.hero h1{
  font-size:29px;
  font-weight:850;
}

.hero p{
  margin-top:6px;

  color:var(--muted);

  font-size:13px;
  line-height:1.6;
}


/* =========================
   ERROR
========================= */

.error{
  display:none;

  margin-bottom:15px;
  padding:12px;

  border:
    1px solid #fecaca;

  border-radius:10px;

  background:#fef2f2;

  color:var(--danger);

  font-size:12px;
}

.error.show{
  display:block;
}


/* =========================
   TABS
========================= */

.tabs{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;

  margin-bottom:15px;
}

.tab{
  min-height:43px;

  border:
    1px solid var(--border);

  border-radius:11px;

  background:#fff;

  color:var(--muted);

  font-family:inherit;

  font-size:12px;
  font-weight:800;

  cursor:pointer;
}

.tab.active{
  background:var(--primary);
  color:#fff;

  border-color:
    var(--primary);
}


/* =========================
   SEARCH
========================= */

.search-box{
  margin-bottom:15px;
}

.search{
  width:100%;
  height:45px;

  padding:
    0 14px;

  border:
    1px solid var(--border);

  border-radius:11px;

  outline:none;

  background:#fff;

  color:var(--text);

  font-family:inherit;
  font-size:13px;
}

.search:focus{
  border-color:#64748b;
}


/* =========================
   LIST
========================= */

.list{
  display:flex;

  flex-direction:column;

  gap:9px;
}

.person{
  display:flex;

  align-items:center;

  gap:12px;

  padding:13px 14px;

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:14px;
}

.avatar{
  width:48px;
  height:48px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  border-radius:50%;

  background:var(--soft);

  color:var(--text);

  font-size:13px;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.person-info{
  min-width:0;

  flex:1;
}

.name{
  font-size:13px;
  font-weight:800;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.username{
  margin-top:3px;

  color:var(--muted);

  font-size:10px;
}

.date{
  margin-top:5px;

  color:var(--muted);

  font-size:9px;
}

.action{
  border:0;

  min-width:82px;

  padding:
    8px 10px;

  border-radius:8px;

  background:var(--primary);

  color:#fff;

  font-family:inherit;

  font-size:10px;
  font-weight:800;

  cursor:pointer;
}

.action.following{
  background:var(--soft);
  color:var(--text);

  border:
    1px solid var(--border);
}

.action:disabled{
  opacity:.55;

  cursor:not-allowed;
}


/* =========================
   LOADING
========================= */

.loading{
  text-align:center;

  padding:55px;

  color:var(--muted);

  font-size:12px;
}

.spinner{
  width:31px;
  height:31px;

  margin:
    0 auto
    10px;

  border:
    3px solid var(--border);

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   EMPTY
========================= */

.empty{
  display:none;

  text-align:center;

  padding:55px 20px;

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:15px;

  color:var(--muted);
}

.empty-icon{
  font-size:40px;

  margin-bottom:9px;
}

.empty h3{
  color:var(--text);

  font-size:16px;

  margin-bottom:5px;
}

.empty p{
  font-size:12px;
}


/* =========================
   LOAD MORE
========================= */

.load-more{
  display:none;

  margin:
    20px auto
    0;

  padding:
    10px 18px;

  border:0;

  border-radius:10px;

  background:var(--primary);

  color:#fff;

  font-family:inherit;

  font-size:12px;
  font-weight:800;

  cursor:pointer;
}

.load-more:disabled{
  opacity:.5;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{
    padding:0 12px;
  }

  .brand{
    font-size:12px;
  }

  .container{
    padding:
      22px 11px
      60px;
  }

  .hero h1{
    font-size:24px;
  }

  .person{
    padding:12px;
  }

  .date{
    display:none;
  }

  .action{
    min-width:72px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      👥
    </div>

    <span>
      Let'sStudy Pro Community
    </span>

  </div>


  <button
    class="back-btn"
    type="button"
    onclick="goBack()"
  >
    ← Back
  </button>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


  <section class="hero">

    <h1>
      Connections
    </h1>

    <p>
      Manage your followers and the
      people you follow in the community.
    </p>

  </section>


  <div
    id="errorBox"
    class="error"
  ></div>


  <!-- TABS -->

  <div class="tabs">

    <button
      id="followersTab"
      class="tab active"
      type="button"
    >
      Followers
    </button>


    <button
      id="followingTab"
      class="tab"
      type="button"
    >
      Following
    </button>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search people..."
      autocomplete="off"
    >

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <p>
      Loading connections...
    </p>

  </div>


  <!-- PEOPLE -->

  <section
    id="peopleList"
    class="list"
  ></section>


  <!-- EMPTY -->

  <section
    id="empty"
    class="empty"
  >

    <div class="empty-icon">
      👥
    </div>

    <h3>
      No people found
    </h3>

    <p>
      There are no connections to display.
    </p>

  </section>


  <!-- LOAD MORE -->

  <button
    id="loadMore"
    class="load-more"
    type="button"
  >
    Load More
  </button>


</main>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();

const auth =
  firebase.auth();


/* =========================
   STATE
========================= */

let currentUser =
  null;

let activeTab =
  "followers";

let relationships =
  [];

let lastDocument =
  null;

const PAGE_SIZE =
  20;


/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function initials(
  name
){

  return String(
    name ||
    "Member"
  )
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(
    word =>
      word
        .charAt(0)
        .toUpperCase()
  )
  .join("");

}


function formatDate(
  timestamp
){

  if(!timestamp){

    return "Recently";

  }

  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

  }

  catch{

    return "Recently";

  }

}


function showError(
  message
){

  const box =
    document.getElementById(
      "errorBox"
    );

  box.textContent =
    message;

  box.classList.add(
    "show"
  );

}


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
  async user => {

    currentUser =
      user;


    if(!user){

      showError(
        "Please sign in to manage your community connections."
      );

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      return;

    }


    await loadConnections();

  }
);


/* =========================
   LOAD CONNECTIONS
========================= */

async function loadConnections(
  append = false
){

  const loading =
    document.getElementById(
      "loading"
    );


  try{

    if(!append){

      loading.style.display =
        "block";

    }


    let query;


    if(
      activeTab ===
      "followers"
    ){

      query =
        db
          .collection("follows")
          .where(
            "followingId",
            "==",
            currentUser.uid
          )
          .orderBy(
            "createdAt",
            "desc"
          )
          .limit(
            PAGE_SIZE
          );

    }

    else{

      query =
        db
          .collection("follows")
          .where(
            "followerId",
            "==",
            currentUser.uid
          )
          .orderBy(
            "createdAt",
            "desc"
          )
          .limit(
            PAGE_SIZE
          );

    }


    if(
      append &&
      lastDocument
    ){

      query =
        query.startAfter(
          lastDocument
        );

    }


    const snapshot =
      await query.get();


    loading.style.display =
      "none";


    if(!append){

      relationships =
        [];

    }


    if(
      !snapshot.empty
    ){

      lastDocument =
        snapshot.docs[
          snapshot.docs.length - 1
        ];

    }


    for(
      const doc of snapshot.docs
    ){

      relationships.push({

        id:
          doc.id,

        ...doc.data()

      });

    }


    await renderPeople();


    const loadMore =
      document.getElementById(
        "loadMore"
      );


    if(
      snapshot.size <
      PAGE_SIZE
    ){

      loadMore.style.display =
        "none";

    }

    else{

      loadMore.style.display =
        "block";

    }

  }

  catch(error){

    console.error(
      "Follow loading error:",
      error
    );


    loading.style.display =
      "none";


    showError(
      "Unable to load connections. Check your Firestore rules or required index."
    );

  }

}


/* =========================
   GET USER
========================= */

async function getUser(
  userId
){

  if(!userId){

    return {};

  }


  try{

    const snapshot =
      await db
        .collection("users")
        .doc(userId)
        .get();


    if(
      snapshot.exists
    ){

      return snapshot.data();

    }

  }

  catch(error){

    console.error(
      "User loading error:",
      error
    );

  }


  return {};

}


/* =========================
   RENDER
========================= */

async function renderPeople(){

  const container =
    document.getElementById(
      "peopleList"
    );


  const empty =
    document.getElementById(
      "empty"
    );


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  container.innerHTML =
    "";


  const prepared =
    [];


  for(
    const relationship of relationships
  ){

    const userId =
      activeTab ===
      "followers"

        ? relationship.followerId

        : relationship.followingId;


    if(
      userId ===
      currentUser.uid
    ){

      continue;

    }


    const user =
      await getUser(
        userId
      );


    const name =
      user.displayName ||
      user.username ||
      "Community Member";


    const username =
      user.username ||
      "";


    if(
      search &&
      !String(
        name
      )
      .toLowerCase()
      .includes(search) &&

      !String(
        username
      )
      .toLowerCase()
      .includes(search)
    ){

      continue;

    }


    prepared.push({

      relationship,
      user,
      userId

    });

  }


  if(!prepared.length){

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  prepared.forEach(
    item => {

      renderPerson(
        item
      );

    }
  );

}


/* =========================
   PERSON CARD
========================= */

function renderPerson(
  item
){

  const container =
    document.getElementById(
      "peopleList"
    );


  const user =
    item.user;

  const relationship =
    item.relationship;


  const name =
    user.displayName ||
    user.username ||
    "Community Member";


  const username =
    user.username
      ? `@${user.username}`
      : "Community Member";


  const photo =
    user.photoURL ||
    "";


  const element =
    document.createElement(
      "article"
    );


  element.className =
    "person";


  const avatar =
    photo

      ? `
        <img
          src="${escapeHTML(
            photo
          )}"
          alt="${escapeHTML(
            name
          )}"
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      `

      : escapeHTML(
          initials(
            name
          )
        );


  element.innerHTML =
    `
      <div class="avatar">

        ${avatar}

      </div>


      <div class="person-info">

        <div class="name">

          ${escapeHTML(
            name
          )}

        </div>


        <div class="username">

          ${escapeHTML(
            username
          )}

        </div>


        <div class="date">

          Connected
          ${escapeHTML(
            formatDate(
              relationship.createdAt
            )
          )}

        </div>

      </div>


      <button
        class="action following"
        type="button"
        data-user-id="${escapeHTML(
          item.userId
        )}"
        data-follow-id="${escapeHTML(
          relationship.id
        )}"
      >

        ${
          activeTab ===
          "following"

            ? "Following"

            : "Follow Back"
        }

      </button>
    `;


  const button =
    element.querySelector(
      ".action"
    );


  button.addEventListener(
    "click",
    async () => {

      if(
        activeTab ===
        "following"
      ){

        await unfollow(
          item.userId,
          relationship.id,
          button
        );

      }

      else{

        await toggleFollow(
          item.userId,
          button
        );

      }

    }
  );


  container.appendChild(
    element
  );


  if(
    activeTab ===
    "followers"
  ){

    checkFollowingStatus(
      item.userId,
      button
    );

  }

}


/* =========================
   CHECK FOLLOWING
========================= */

async function checkFollowingStatus(
  userId,
  button
){

  try{

    const followId =
      `${currentUser.uid}_${userId}`;


    const snapshot =
      await db
        .collection("follows")
        .doc(followId)
        .get();


    if(
      snapshot.exists
    ){

      button.textContent =
        "Following";

      button.classList.add(
        "following"
      );

    }

    else{

      button.textContent =
        "Follow Back";

      button.classList.remove(
        "following"
      );

    }

  }

  catch(error){

    console.error(
      "Follow status error:",
      error
    );

  }

}


/* =========================
   FOLLOW
========================= */

async function toggleFollow(
  userId,
  button
){

  if(
    !currentUser ||
    userId ===
    currentUser.uid
  ){

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Following...";


  try{

    const followId =
      `${currentUser.uid}_${userId}`;


    await db
      .collection("follows")
      .doc(followId)
      .set({

        followerId:
          currentUser.uid,

        followingId:
          userId,

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });


    button.textContent =
      "Following";

    button.classList.add(
      "following"
    );

  }

  catch(error){

    console.error(
      "Follow error:",
      error
    );

    button.textContent =
      "Follow Back";

    showError(
      "Unable to follow this member."
    );

  }


  button.disabled =
    false;

}


/* =========================
   UNFOLLOW
========================= */

async function unfollow(
  userId,
  followId,
  button
){

  if(
    !currentUser
  ){

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Removing...";


  try{

    await db
      .collection("follows")
      .doc(followId)
      .delete();


    relationships =
      relationships.filter(
        relationship =>
          relationship.id !==
          followId
      );


    await renderPeople();

  }

  catch(error){

    console.error(
      "Unfollow error:",
      error
    );

    showError(
      "Unable to unfollow this member."
    );

    button.disabled =
      false;

    button.textContent =
      "Following";

  }

}


/* =========================
   TABS
========================= */

document
  .getElementById(
    "followersTab"
  )
  .addEventListener(
    "click",
    async () => {

      if(
        activeTab ===
        "followers"
      ){

        return;

      }


      activeTab =
        "followers";


      updateTabs();

      resetAndLoad();

    }
  );


document
  .getElementById(
    "followingTab"
  )
  .addEventListener(
    "click",
    async () => {

      if(
        activeTab ===
        "following"
      ){

        return;

      }


      activeTab =
        "following";


      updateTabs();

            resetAndLoad();

    }
  );


/* =========================
   SEARCH
========================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    () => {

      renderPeople();

    }
  );


/* =========================
   LOAD MORE
========================= */

document
  .getElementById(
    "loadMore"
  )
  .addEventListener(
    "click",
    async () => {

      const button =
        document.getElementById(
          "loadMore"
        );

      button.disabled =
        true;

      button.textContent =
        "Loading...";

      try {

        await loadConnections(
          true
        );

      }

      catch (error) {

        console.error(
          "Load more error:",
          error
        );

        showError(
          "Unable to load more connections."
        );

      }

      finally {

        button.disabled =
          false;

        button.textContent =
          "Load More";

      }

    }
  );


/* =========================
   BACK
========================= */

function goBack() {

  if (
    document.referrer &&
    document.referrer.startsWith(
      window.location.origin
    )
  ) {

    window.history.back();

  }

  else {

    window.location.href =
      "community.html";

  }

}


/* =========================
   INITIALIZE
========================= */

async function initializeCommunity() {

  if (!currentUser) {

    return;

  }

  relationships =
    [];

  lastDocument =
    null;

  await loadConnections();

}


/* =========================
   FIREBASE AUTH STATE
========================= */

auth.onAuthStateChanged(
  async user => {

    currentUser =
      user;

    if (!user) {

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      document.getElementById(
        "peopleList"
      ).innerHTML =
        "";

      showError(
        "Please sign in to view your community connections."
      );

      return;

    }

    document.getElementById(
      "errorBox"
    ).classList.remove(
      "show"
    );

    await initializeCommunity();

  }
);


/* =========================
   GLOBAL ERROR HANDLER
========================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled Community error:",
      event.reason
    );

  }
);


/* =========================
   JAVASCRIPT ERROR HANDLER
========================= */

window.addEventListener(
  "error",
  event => {

    console.error(
      "Community page error:",
      event.error
    );

  }
);

</script>

</body>

</html>
