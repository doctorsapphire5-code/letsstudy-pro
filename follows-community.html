<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Follows | LetsStudy Pro</title>

<meta name="description"
content="Manage follows on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:850px;
  margin:30px auto;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 5px 25px #0000000a;
}

h1{
  font-size:28px;
  margin-bottom:7px;
}

.subtitle{
  color:#64748b;
  margin-bottom:22px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tab{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:9px 15px;
  border-radius:20px;
  cursor:pointer;
}

.tab.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.user-box{
  background:#f8fafc;
  padding:13px;
  border-radius:10px;
  margin-bottom:18px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.person{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid #e5e7eb;
  padding:13px;
  border-radius:11px;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-weight:800;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-weight:700;
}

.username{
  color:#64748b;
  font-size:13px;
  margin-top:3px;
}

.action{
  border:0;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  background:#2563eb;
  color:#fff;
}

.action.unfollow{
  background:#eef2f7;
  color:#172033;
}

.loading,
.empty{
  text-align:center;
  color:#64748b;
  padding:45px 15px;
}

.status{
  display:none;
  margin-bottom:15px;
  padding:11px;
  border-radius:8px;
}

.status.show{
  display:block;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <div class="card">

    <h1>Follows</h1>

    <p class="subtitle">
      Manage your followers and the profiles you follow.
    </p>


    <div
      id="userBox"
      class="user-box"
    >
      Checking account...
    </div>


    <div class="tabs">

      <button
        class="tab active"
        data-tab="following"
      >
        Following
      </button>

      <button
        class="tab"
        data-tab="followers"
      >
        Followers
      </button>

    </div>


    <div
      id="status"
      class="status"
    ></div>


    <div
      id="list"
      class="list"
    >

      <div class="loading">
        Loading...
      </div>

    </div>

  </div>

</main>


<script type="module">

/*
==================================================
FOLLOWS COMMUNITY

Firebase:
  Authentication only

API:
  GET  /api/following
  GET  /api/followers
  POST /api/follows

POST body:

{
  targetUserId: "USER_ID",
  action: "follow"
}

or

{
  targetUserId: "USER_ID",
  action: "unfollow"
}

Admin:
  NOT USED
==================================================
*/


import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


/* =========================
   STATE
========================= */

let currentUser = null;

let activeTab =
  "following";


/* =========================
   DOM
========================= */

const userBox =
  document.getElementById(
    "userBox"
  );

const list =
  document.getElementById(
    "list"
  );

const statusBox =
  document.getElementById(
    "status"
  );

const tabs =
  document.querySelectorAll(
    ".tab"
  );


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;


    if(!user){

      userBox.textContent =
        "Please login to manage follows.";


      list.innerHTML = `

        <div class="empty">

          Please login first.

        </div>

      `;

      return;

    }


    userBox.innerHTML = `

      Signed in as

      <strong>
        ${escapeHTML(
          user.displayName ||
          user.email ||
          "User"
        )}
      </strong>

    `;


    await loadList();

  }
);


/* =========================
   LOAD
========================= */

async function loadList(){

  if(!currentUser) return;


  list.innerHTML = `

    <div class="loading">
      Loading ${activeTab}...
    </div>

  `;


  try{

    const token =
      await currentUser.getIdToken();


    const endpoint =
      activeTab === "followers"
        ? "/api/followers"
        : "/api/following";


    const response =
      await fetch(
        endpoint,
        {
          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load follows"
      );

    }


    const people =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    render(
      people
    );


  }catch(error){

    console.error(
      "FOLLOWS ERROR:",
      error
    );


    list.innerHTML = `

      <div class="empty">

        Unable to load ${escapeHTML(
          activeTab
        )}.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function render(
  people
){

  if(!people.length){

    list.innerHTML = `

      <div class="empty">

        ${
          activeTab === "following"
          ? "You are not following anyone yet."
          : "You do not have any followers yet."
        }

      </div>

    `;

    return;

  }


  list.innerHTML =
    people
      .map(
        person =>
          createPerson(
            person
          )
      )
      .join("");

}


/* =========================
   PERSON
========================= */

function createPerson(
  person
){

  const id =
    person.id ||
    person.uid ||
    person.userId ||
    "";


  const name =
    person.name ||
    person.displayName ||
    person.username ||
    "User";


  const username =
    person.username
      ? "@" +
        String(
          person.username
        ).replace(/^@/,"")
      : "";


  const photo =
    safeImage(
      person.photoURL ||
      person.photo ||
      person.avatar
    );


  const initial =
    String(name)
      .trim()
      .charAt(0)
      .toUpperCase() ||
    "U";


  return `

    <article class="person">

      <div class="avatar">

        ${
          photo
          ? `
            <img
              src="${photo}"
              alt="${escapeAttr(name)}"
              loading="lazy"
            >
          `
          : escapeHTML(initial)
        }

      </div>


      <div class="info">

        <div class="name">

          ${escapeHTML(name)}

        </div>

        ${
          username
          ? `
            <div class="username">
              ${escapeHTML(username)}
            </div>
          `
          : ""
        }

      </div>


      ${
        id
        ? `

          ${
            activeTab === "following"
            ? `
              <button
                class="action unfollow"
                data-action="unfollow"
                data-id="${escapeAttr(id)}"
              >
                Unfollow
              </button>
            `
            : `
              <button
                class="action"
                data-action="follow"
                data-id="${escapeAttr(id)}"
              >
                Follow Back
              </button>
            `
          }

        `
        : ""
      }

    </article>

  `;

}


/* =========================
   TAB SWITCH
========================= */

tabs.forEach(
  tab => {

    tab.addEventListener(
      "click",
      async () => {

        tabs.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


        tab.classList.add(
          "active"
        );


        activeTab =
          tab.dataset.tab;


        await loadList();

      }
    );

  }
);


/* =========================
   FOLLOW / UNFOLLOW
========================= */

list.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        ".action"
      );


    if(!button) return;


    const targetUserId =
      button.dataset.id;


    const action =
      button.dataset.action;


    if(
      !targetUserId ||
      !currentUser ||
      targetUserId === currentUser.uid
    ){

      return;

    }


    button.disabled = true;

    button.textContent =
      action === "follow"
        ? "Following..."
        : "Unfollowing...";


    try{

      const token =
        await currentUser.getIdToken();


      const response =
        await fetch(
          "/api/follows",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " + token
            },

            body:JSON.stringify({

              targetUserId,

              action

            })

          }
        );


      const result =
        await response.json();


      if(!response.ok){

        throw new Error(
          result.error ||
          "Action failed"
        );

      }


      showStatus(
        action === "follow"
          ? "Followed successfully."
          : "Unfollowed successfully.",
        "success"
      );


      await loadList();


    }catch(error){

      showStatus(
        error.message ||
        "Unable to update follow.",
        "error"
      );


      button.disabled = false;

      button.textContent =
        action === "follow"
          ? "Follow Back"
          : "Unfollow";

    }

  }
);


/* =========================
   STATUS
========================= */

function showStatus(
  message,
  type
){

  statusBox.className =
    "status show " + type;

  statusBox.textContent =
    message;


  setTimeout(
    () => {

      statusBox.className =
        "status";

    },
    2500
  );

}


/* =========================
   SECURITY
========================= */

function safeImage(url){

  if(!url) return "";


  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );


    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(error){}


  return "";

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}

</script>

</body>
</html>
