<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8;--star:#f59e0b}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(760px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 10px}
.lead{font-size:18px;color:var(--muted);margin:0 0 24px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.tab i{font-style:normal;margin-left:6px;background:var(--p);color:#fff;border-radius:999px;padding:0 8px;font-size:12px}
@media(prefers-color-scheme:dark){.tab i{color:#0b1220}}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px}
.box label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:14px 0 6px}
.box label:first-child{margin-top:0}
.box input,.box select,.box textarea,.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.search{background:var(--paper)}
.box textarea{min-height:130px;resize:vertical}
.box input:focus,.box select:focus,.box textarea:focus,.search:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>div>label{margin-top:14px}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;padding:2px;font-size:32px;line-height:1;color:var(--line);cursor:pointer}
.stars button.on{color:var(--star)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn{border:0;background:var(--p);color:#fff;padding:12px 24px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.bad{background:#dc2626;color:#fff}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}.btn.bad{color:#fff}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.st{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.st b{display:block;font-size:26px;line-height:1.1;color:var(--ink)}
.st span{font-size:13px;color:var(--muted)}
.sub{display:flex;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
.search{margin-bottom:12px}
#count{color:var(--muted);font-size:14px;margin:6px 0 12px;min-height:21px}
.fb{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--star);border-radius:14px;padding:16px 20px;margin-bottom:12px}
.fb.done{border-left-color:#16a34a}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rt{color:var(--star);letter-spacing:2px;font-size:16px;white-space:nowrap}
.fb h2{margin:6px 0 0;font-size:17px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.fb time{font-size:13px;color:var(--muted);white-space:nowrap}
.ms{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.b.ok{background:color-mix(in srgb,#16a34a 16%,transparent);color:#15803d}
@media(prefers-color-scheme:dark){.b.ok{color:#4ade80}}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.two{grid-template-columns:1fr}.top{flex-direction:column;gap:2px}.stats{gap:8px}.st{padding:12px}.st b{font-size:22px}.box{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="features.html">Features</a>
    <a href="follows.html" aria-current="page">Feedback</a>
  </nav>
</div></header>

<main class="wrap">
  <h1>Feedback</h1>
  <p class="lead">Tell us what is working and what we can do better. We read every message.</p>

  <div class="tabs" role="tablist" id="tabs" hidden="">
    <button class="tab" role="tab" data-v="send" aria-selected="true">Send feedback</button>
    <button class="tab" role="tab" data-v="inbox" aria-selected="false">Inbox<i id="n-new" hidden="">0</i></button>
  </div>

  <section id="send">
    <div class="box" id="formBox">
      <label for="fname">Your name</label><input id="fname" maxlength="80" autocomplete="name">
      <label for="femail">Email</label><input id="femail" type="email" maxlength="120" autocomplete="email" placeholder="you@example.com">
      <div class="two">
        <div><label for="ftype">Type</label><select id="ftype"></select></div>
        <div><label for="fpage">About</label><select id="fpage"></select></div>
      </div>
      <label>Rating</label>
      <div class="stars" id="stars" role="radiogroup" aria-label="Rating"></div>
      <label for="fsub">Subject</label><input id="fsub" maxlength="120" placeholder="A short summary">
      <label for="fmsg">Message</label><textarea id="fmsg" maxlength="2000" placeholder="Tell us more"></textarea>
      <div class="hp" aria-hidden="true"><label>Leave this empty<input id="hp" tabindex="-1" autocomplete="off"></label></div>
      <div style="margin-top:20px"><button class="btn" id="go" type="button">Send feedback</button></div>
    </div>
    <div class="box" id="thanks" hidden=""><h2 style="margin:0 0 6px;color:var(--ink)">Thank you</h2><p style="margin:0 0 16px;color:var(--muted)">Your feedback has been sent. It helps us improve LetsStudy Pro.</p><button class="btn alt" id="again" type="button">Send another</button></div>
  </section>

  <section id="inbox" hidden="">
    <div class="stats" id="stats"></div>
    <div class="sub" id="sub">
      <button class="chip" type="button" data-f="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-f="new" aria-pressed="false">New</button>
      <button class="chip" type="button" data-f="done" aria-pressed="false">Reviewed</button>
    </div>
    <input id="search" class="search" type="search" placeholder="Search feedback" aria-label="Search feedback">
    <div id="count" role="status"></div>
    <div id="list"></div>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>
<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,addDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,query,orderBy,limit}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const COL="follows";
const TYPES=["Resource Feedback","Course Feedback","Bug Report","Suggestion","Other"];
const PAGES=["Course","Blog","Community","Channels","Playlists","Other"];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800)}

let user=null,admin=false,rating=0,items=[],filter="all",unsub=null;

/* ---------- send feedback ---------- */
$("#ftype").innerHTML=TYPES.map(t=>`<option>${t}</option>`).join("");
$("#fpage").innerHTML=PAGES.map(t=>`<option>${t}</option>`).join("");
$("#stars").innerHTML=[1,2,3,4,5].map(n=>`<button type="button" role="radio" aria-checked="false" aria-label="${n} star${n>1?"s":""}" data-n="${n}">&#9733;</button>`).join("");
function paint(n){document.querySelectorAll("#stars button").forEach(b=>{const on=+b.dataset.n<=n;b.classList.toggle("on",on);b.setAttribute("aria-checked",String(+b.dataset.n===rating))})}
$("#stars").addEventListener("click",e=>{const b=e.target.closest("button");if(b){rating=+b.dataset.n;paint(rating)}});
$("#stars").addEventListener("mouseover",e=>{const b=e.target.closest("button");if(b)paint(+b.dataset.n)});
$("#stars").addEventListener("mouseleave",()=>paint(rating));

$("#go").addEventListener("click",async e=>{
  if($("#hp").value){$("#formBox").hidden=true;$("#thanks").hidden=false;return}
  const name=$("#fname").value.trim(),email=$("#femail").value.trim(),message=$("#fmsg").value.trim();
  if(!name){toast("Please enter your name");return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast("Please enter a valid email");return}
  if(!rating){toast("Please choose a rating");return}
  if(message.length<5){toast("Please write a short message");return}
  let last=0;try{last=Number(localStorage.getItem("fb_last"))||0}catch{}
  if(Date.now()-last<60000){toast("Please wait a minute before sending another message");return}
  const b=e.currentTarget;b.disabled=true;
  try{
    await addDoc(collection(db,COL),{createdAt:serverTimestamp(),email,message,name,page:$("#fpage").value,rating,
      reviewed:false,status:"new",subject:$("#fsub").value.trim(),type:$("#ftype").value,updatedAt:serverTimestamp()});
    try{localStorage.setItem("fb_last",String(Date.now()))}catch{}
    $("#formBox").hidden=true;$("#thanks").hidden=false;
  }catch(err){console.error(err);toast("Could not send your feedback. Please try again.")}
  b.disabled=false;
});
$("#again").addEventListener("click",()=>{
  $("#fsub").value="";$("#fmsg").value="";rating=0;paint(0);
  $("#thanks").hidden=true;$("#formBox").hidden=false;
});

/* ---------- admin inbox ---------- */
const stars=n=>"★".repeat(n)+"☆".repeat(Math.max(0,5-n));
const isDone=f=>f.reviewed===true;

function card(f){
  const x=toD(f.createdAt),n=Math.max(0,Math.min(5,Number(f.rating)||0)),mail=String(f.email||"");
  return `<article class="fb${isDone(f)?" done":""}">
    <div class="top"><span class="rt" aria-label="${n} out of 5">${stars(n)}</span>${x?`<time datetime="${x.toISOString()}" title="${esc(x.toLocaleString())}">${esc(ago(x))}</time>`:""}</div>
    ${f.subject?`<h2>${esc(f.subject)}</h2>`:""}
    ${f.message?`<p class="ms">${esc(f.message)}</p>`:""}
    <div class="meta"><b>${esc(f.name||"Anonymous")}</b>${mail?`<a href="mailto:${esc(mail)}">${esc(mail)}</a>`:""}
      ${f.type?`<span class="b">${esc(f.type)}</span>`:""}${f.page?`<span class="b">${esc(f.page)}</span>`:""}${isDone(f)?`<span class="b ok">Reviewed</span>`:""}</div>
    <div class="act"><button class="btn alt sm" type="button" data-rev="${esc(f.id)}">${isDone(f)?"Mark as new":"Mark as reviewed"}</button>
      ${mail?`<a class="btn alt sm" href="mailto:${esc(mail)}?subject=${encodeURIComponent("Re: "+(f.subject||"Your feedback"))}">Reply</a>`:""}
      <button class="btn bad sm" type="button" data-del="${esc(f.id)}">Delete</button></div>
  </article>`;
}

function render(){
  const unrev=items.filter(f=>!isDone(f)).length,rated=items.filter(f=>Number(f.rating)>0);
  const avg=rated.length?(rated.reduce((s,f)=>s+Number(f.rating),0)/rated.length).toFixed(1):"–";
  $("#stats").innerHTML=[[items.length,"Total"],[unrev,"Awaiting review"],[avg,"Average rating"]].map(x=>`<div class="st"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
  $("#n-new").textContent=unrev;$("#n-new").hidden=!unrev;
  const q=$("#search").value.toLowerCase().trim();
  const out=items.filter(f=>(filter==="all"||(filter==="done")===isDone(f))&&
    (!q||[f.subject,f.message,f.name,f.email,f.type,f.page].join(" ").toLowerCase().includes(q)));
  $("#count").textContent=out.length===1?"1 message":`${out.length} messages`;
  $("#list").innerHTML=out.length?out.map(card).join(""):
    `<div class="state"><h2>${items.length?"Nothing here":"No feedback yet"}</h2><p>${items.length?"Try another filter or search.":"Feedback from your visitors will appear here."}</p></div>`;
}
$("#sub").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  filter=b.dataset.f;
  $("#sub").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
});
$("#search").addEventListener("input",render);
$("#list").addEventListener("click",async e=>{
  const r=e.target.closest("[data-rev]"),d=e.target.closest("[data-del]");
  if(r){
    const f=items.find(x=>x.id===r.dataset.rev),done=!isDone(f);
    r.disabled=true;
    try{await updateDoc(doc(db,COL,f.id),{reviewed:done,status:done?"reviewed":"new",updatedAt:serverTimestamp()})}
    catch(err){console.error(err);toast("Could not update this message");r.disabled=false}
  }else if(d&&confirm("Delete this feedback permanently?")){
    try{await deleteDoc(doc(db,COL,d.dataset.del));toast("Deleted")}catch(err){console.error(err);toast("Could not delete this message")}
  }
});

function listen(){
  if(unsub)unsub();
  unsub=onSnapshot(query(collection(db,COL),orderBy("createdAt","desc"),limit(300)),snap=>{
    items=snap.docs.map(d=>({id:d.id,...d.data()}));render();
  },err=>{console.error(err);$("#list").innerHTML=`<div class="state err"><h2>Unable to load feedback</h2><p>${esc(err.message||"Please check your connection.")}</p></div>`});
}

function view(v){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.v===v)));
  $("#send").hidden=v!=="send";$("#inbox").hidden=v!=="inbox";
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>view(t.dataset.v)));

async function checkAdmin(u){
  for(const [c,ok] of [["admins",s=>s.exists()],["users",s=>s.exists()&&/admin|moderator/i.test(String(s.data().role||""))]]){
    try{if(ok(await getDoc(doc(db,c,u.uid))))return true}catch{}
  }
  return false;
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,async u=>{
  user=u;if(unsub){unsub();unsub=null}
  if(u){
    if(!$("#fname").value)$("#fname").value=u.displayName||"";
    if(!$("#femail").value)$("#femail").value=u.email||"";
  }
  admin=u?await checkAdmin(u):false;
  $("#tabs").hidden=!admin;
  if(admin)listen();else view("send");
});
</script>
