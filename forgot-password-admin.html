<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Reset Admin Password | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Reset your Let'sStudy Pro administrator password."
  >

  <meta name="robots" content="noindex,nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .icon {
      width: 62px;
      height: 62px;
      margin: auto;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      color: white;
      font-size: 28px;
    }

    h1 {
      margin: 12px 0 5px;
      font-size: 24px;
    }

    .brand p {
      margin: 0;
      color: #687386;
      font-size: 14px;
    }

    .card {
      background: white;
      border: 1px solid #e2e7ef;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, .1);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .description {
      margin: 0 0 22px;
      color: #687386;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 49px;
      padding: 12px 14px;
      border: 1px solid #e2e7ef;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .13);
    }

    button {
      width: 100%;
      min-height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
    }

    .back {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    footer {
      margin-top: 18px;
      text-align: center;
      color: #687386;
      font-size: 12px;
    }
  </style>
</head>

<body>

<main class="container">

  <header class="brand">
    <div class="icon" aria-hidden="true">🔐</div>

    <h1>Let'sStudy Pro</h1>

    <p>Administrator Portal</p>
  </header>

  <section class="card">

    <h2>Reset Admin Password</h2>

    <p class="description">
      Enter your administrator email address and
      we'll send you a secure password reset link.
    </p>

    <div
      id="message"
      class="message"
      role="alert"
      aria-live="polite"
    ></div>

    <form id="resetForm">

      <label for="email">
        Admin Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        inputmode="email"
        placeholder="admin@example.com"
        required
      >

      <button
        id="resetBtn"
        type="submit"
      >
        Send Reset Link
      </button>

    </form>

    <a
      href="login-admin.html"
      class="back"
    >
      ← Back to Admin Login
    </a>

  </section>

  <footer>
    © <span id="year"></span> Let'sStudy Pro
  </footer>

</main>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);


  const form =
    document.getElementById("resetForm");

  const email =
    document.getElementById("email");

  const button =
    document.getElementById("resetBtn");

  const message =
    document.getElementById("message");


  document.getElementById("year").textContent =
    new Date().getFullYear();


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      `message ${type}`;
  }


  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      const emailAddress =
        email.value.trim();

      if (!emailAddress) {

        showMessage(
          "Please enter your admin email.",
          "error"
        );

        email.focus();

        return;
      }


      button.disabled = true;

      button.textContent =
        "Sending...";


      try {

        await sendPasswordResetEmail(
          auth,
          emailAddress
        );


        showMessage(
          "If this email is registered, a password reset link has been sent. Check your inbox and spam folder.",
          "success"
        );


        form.reset();


      } catch (error) {

        console.error(
          "Password reset error:",
          error
        );


        showMessage(
          "Unable to process the password reset request. Please check the email and try again.",
          "error"
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Send Reset Link";
      }

    }
  );

</script>

</body>
</html>
