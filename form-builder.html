<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form Builder</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --primary:#7c3aed;
    --primary-light:#ede9fe;
    --bg:#f1f5f9;
    --surface:#ffffff;
    --border:#dbe2ea;
    --text:#172033;
    --muted:#64748b;
    --danger:#dc2626;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:var(--bg);
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   HEADER
========================= */

.header{
    height:60px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:32px;
    height:32px;
    border-radius:8px;
    display:grid;
    place-items:center;
    background:var(--primary-light);
    color:var(--primary);
    font-weight:900;
}

.brand-title{
    font-size:14px;
    font-weight:800;
}

.header-actions{
    display:flex;
    gap:7px;
}

.btn{
    border:0;
    border-radius:7px;
    padding:9px 13px;
    font-size:10px;
    font-weight:800;
}

.btn-primary{
    background:var(--primary);
    color:#fff;
}

.btn-secondary{
    background:#f1f5f9;
    color:#334155;
}

.btn-danger{
    background:#fee2e2;
    color:#b91c1c;
}

/* =========================
   APP
========================= */

.app{
    height:calc(100vh - 60px);
    display:grid;
    grid-template-columns:220px 1fr 260px;
}

/* =========================
   LEFT PANEL
========================= */

.left-panel{
    background:#fff;
    border-right:1px solid var(--border);
    padding:15px;
    overflow-y:auto;
}

.panel-title{
    font-size:11px;
    font-weight:900;
    margin-bottom:12px;
}

.field-group{
    margin-bottom:20px;
}

.group-title{
    color:var(--muted);
    font-size:8px;
    font-weight:900;
    margin-bottom:7px;
    text-transform:uppercase;
}

.field-button{
    width:100%;
    border:1px solid var(--border);
    background:#fff;
    border-radius:7px;
    padding:10px;
    margin-bottom:7px;
    text-align:left;
    font-size:9px;
    font-weight:800;
}

.field-button:hover{
    background:var(--primary-light);
    color:var(--primary);
    border-color:#c4b5fd;
}

/* =========================
   CENTER
========================= */

.builder{
    overflow:auto;
    background:
        linear-gradient(
            45deg,
            #e9eef4 25%,
            transparent 25%
        ) 0 0/20px 20px,
        linear-gradient(
            -45deg,
            #e9eef4 25%,
            transparent 25%
        ) 0 0/20px 20px,
        #f8fafc;
    padding:30px;
}

.form-page{
    width:min(700px,100%);
    min-height:650px;
    margin:auto;
    background:#fff;
    border-radius:10px;
    box-shadow:0 18px 50px rgba(15,23,42,.13);
    padding:40px;
}

.form-header{
    margin-bottom:30px;
}

.form-title{
    width:100%;
    border:0;
    outline:0;
    font-size:30px;
    font-weight:900;
    color:var(--text);
    margin-bottom:9px;
}

.form-description{
    width:100%;
    border:0;
    outline:0;
    resize:none;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.fields{
    min-height:300px;
}

.empty-message{
    border:2px dashed #cbd5e1;
    border-radius:9px;
    padding:45px 20px;
    text-align:center;
    color:var(--muted);
    font-size:11px;
}

.form-field{
    position:relative;
    border:1px solid transparent;
    border-radius:8px;
    padding:13px;
    margin-bottom:10px;
}

.form-field:hover,
.form-field.selected{
    border-color:#c4b5fd;
    background:#faf9ff;
}

.form-field-label{
    display:block;
    font-size:11px;
    font-weight:800;
    margin-bottom:7px;
}

.required{
    color:var(--danger);
}

.field-control{
    width:100%;
    border:1px solid #cbd5e1;
    border-radius:7px;
    padding:10px;
    outline:0;
    background:#fff;
    font-size:10px;
}

.field-control:focus{
    border-color:var(--primary);
}

textarea.field-control{
    min-height:90px;
    resize:vertical;
}

.field-actions{
    position:absolute;
    right:7px;
    top:7px;
    display:none;
    gap:4px;
}

.form-field:hover .field-actions,
.form-field.selected .field-actions{
    display:flex;
}

.small-btn{
    width:25px;
    height:25px;
    border:1px solid var(--border);
    background:#fff;
    border-radius:5px;
    font-size:9px;
}

.small-btn.delete{
    color:var(--danger);
}

.submit-preview{
    margin-top:20px;
    padding:11px 18px;
    border:0;
    border-radius:7px;
    background:var(--primary);
    color:#fff;
    font-size:10px;
    font-weight:800;
}

/* =========================
   RIGHT PANEL
========================= */

.right-panel{
    background:#fff;
    border-left:1px solid var(--border);
    padding:15px;
    overflow-y:auto;
}

.settings-title{
    font-size:11px;
    font-weight:900;
    margin-bottom:15px;
}

.setting{
    margin-bottom:14px;
}

.setting label{
    display:block;
    color:var(--muted);
    font-size:8px;
    font-weight:900;
    margin-bottom:5px;
}

.setting input,
.setting textarea,
.setting select{
    width:100%;
    border:1px solid var(--border);
    border-radius:6px;
    padding:9px;
    outline:0;
    font-size:9px;
}

.setting textarea{
    resize:vertical;
    min-height:65px;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:9px;
}

.checkbox-row input{
    width:auto;
}

.no-selection{
    color:var(--muted);
    font-size:9px;
    line-height:1.5;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:12px;
    padding:22px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.modal-header h2{
    margin:0;
    font-size:17px;
}

.preview-form{
    border:1px solid var(--border);
    border-radius:9px;
    padding:25px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#172033;
    color:#fff;
    padding:10px 14px;
    border-radius:7px;
    font-size:9px;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.2s;
    z-index:2000;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .app{
        grid-template-columns:180px 1fr;
    }

    .right-panel{
        display:none;
    }

}

@media(max-width:650px){

    .app{
        grid-template-columns:1fr;
    }

    .left-panel{
        display:none;
    }

    .builder{
        padding:12px;
    }

    .form-page{
        padding:25px 18px;
    }

    .header{
        padding:0 9px;
    }

    .header-actions .btn-secondary{
        display:none;
    }

}
</style>
</head>

<body>

<header class="header">

    <div class="brand">

        <div class="logo">
            F
        </div>

        <div
            id="builderTitle"
            class="brand-title">
            Form Builder
        </div>

    </div>


    <div class="header-actions">

        <button
            class="btn btn-secondary"
            onclick="openPreview()">
            Preview
        </button>

        <button
            class="btn btn-secondary"
            onclick="saveForm()">
            Save
        </button>

        <button
            class="btn btn-primary"
            onclick="publishForm()">
            Publish
        </button>

    </div>

</header>


<div class="app">

<!-- =========================
     LEFT PANEL
========================= -->

<aside class="left-panel">

    <div class="panel-title">
        Add Fields
    </div>


    <div class="field-group">

        <div class="group-title">
            Basic
        </div>

        <button
            class="field-button"
            onclick="addField('text')">
            + Text
        </button>

        <button
            class="field-button"
            onclick="addField('email')">
            + Email
        </button>

        <button
            class="field-button"
            onclick="addField('phone')">
            + Phone
        </button>

        <button
            class="field-button"
            onclick="addField('number')">
            + Number
        </button>

        <button
            class="field-button"
            onclick="addField('textarea')">
            + Long Text
        </button>

    </div>


    <div class="field-group">

        <div class="group-title">
            Choice
        </div>

        <button
            class="field-button"
            onclick="addField('select')">
            + Dropdown
        </button>

        <button
            class="field-button"
            onclick="addField('radio')">
            + Radio Buttons
        </button>

        <button
            class="field-button"
            onclick="addField('checkbox')">
            + Checkbox
        </button>

    </div>


    <div class="field-group">

        <div class="group-title">
            Other
        </div>

        <button
            class="field-button"
            onclick="addField('date')">
            + Date
        </button>

        <button
            class="field-button"
            onclick="addField('file')">
            + File Upload
        </button>

    </div>


    <button
        class="btn btn-secondary"
        style="width:100%"
        onclick="addField('divider')">
        + Divider
    </button>

</aside>


<!-- =========================
     BUILDER
========================= -->

<main class="builder">

    <section class="form-page">

        <div class="form-header">

            <input
                id="formTitle"
                class="form-title"
                value="Contact Form"
                placeholder="Form title"
                oninput="updateFormInfo()"
            >

            <textarea
                id="formDescription"
                class="form-description"
                rows="2"
                placeholder="Form description"
                oninput="updateFormInfo()"
            >Tell us how we can help.</textarea>

        </div>


        <div
            id="fields"
            class="fields">
        </div>


        <button
            class="submit-preview">
            Submit
        </button>

    </section>

</main>


<!-- =========================
     RIGHT PANEL
========================= -->

<aside class="right-panel">

    <div class="settings-title">
        Field Settings
    </div>

    <div
        id="settings">

        <div class="no-selection">
            Select a field to edit its settings.
        </div>

    </div>

</aside>

</div>


<!-- =========================
     PREVIEW MODAL
========================= -->

<div
    id="previewModal"
    class="modal">

    <div class="modal-card">

        <div class="modal-header">

            <h2>
                Form Preview
            </h2>

            <button
                class="btn btn-secondary"
                onclick="closePreview()">
                Close
            </button>

        </div>


        <div
            id="previewForm"
            class="preview-form">
        </div>

    </div>

</div>


<div
    id="toast"
    class="toast">
    Saved
</div>


<script>

/* =========================
   STATE
========================= */

const STORAGE_KEY =
    "form-builder-data";

let form = {

    title:
        "Contact Form",

    description:
        "Tell us how we can help.",

    fields:[]

};


let selectedFieldId = null;


/* =========================
   FIELD TEMPLATES
========================= */

const templates = {

    text:{
        label:"Full Name",
        placeholder:"Enter your name",
        required:true
    },

    email:{
        label:"Email Address",
        placeholder:"you@example.com",
        required:true
    },

    phone:{
        label:"Phone Number",
        placeholder:"Enter your phone number",
        required:false
    },

    number:{
        label:"Number",
        placeholder:"Enter a number",
        required:false
    },

    textarea:{
        label:"Message",
        placeholder:"Write your message...",
        required:false
    },

    select:{
        label:"Select an option",
        placeholder:"",
        options:[
            "Option 1",
            "Option 2",
            "Option 3"
        ],
        required:false
    },

    radio:{
        label:"Choose one",
        placeholder:"",
        options:[
            "Option 1",
            "Option 2",
            "Option 3"
        ],
        required:false
    },

    checkbox:{
        label:"Select all that apply",
        placeholder:"",
        options:[
            "Option 1",
            "Option 2",
            "Option 3"
        ],
        required:false
    },

    date:{
        label:"Date",
        placeholder:"",
        required:false
    },

    file:{
        label:"Upload File",
        placeholder:"",
        required:false
    },

    divider:{
        label:"",
        placeholder:"",
        required:false
    }

};


/* =========================
   INIT
========================= */

function init(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if(saved){

        try{

            const data =
                JSON.parse(saved);

            if(data){

                form = {
                    ...form,
                    ...data
                };

            }

        }catch(error){

            console.error(
                "Unable to load form:",
                error
            );

        }

    }


    document.getElementById(
        "formTitle"
    ).value =
        form.title;


    document.getElementById(
        "formDescription"
    ).value =
        form.description;


    render();

}


/* =========================
   ADD FIELD
========================= */

function addField(type){

    const template =
        templates[type];


    if(!template){
        return;
    }


    const field = {

        id:
            createId(),

        type,

        label:
            template.label,

        placeholder:
            template.placeholder,

        required:
            template.required,

        options:
            template.options
                ? [...template.options]
                : []

    };


    form.fields.push(
        field
    );


    selectedFieldId =
        field.id;


    saveForm(false);

    render();

}


/* =========================
   DELETE FIELD
========================= */

function deleteField(id){

    form.fields =
        form.fields.filter(
            field =>
                field.id !== id
        );


    if(
        selectedFieldId === id
    ){

        selectedFieldId =
            null;

    }


    saveForm(false);

    render();

}


/* =========================
   DUPLICATE FIELD
========================= */

function duplicateField(id){

    const original =
        form.fields.find(
            field =>
                field.id === id
        );


    if(!original){
        return;
    }


    const copy =
        JSON.parse(
            JSON.stringify(
                original
            )
        );


    copy.id =
        createId();


    copy.label +=
        " Copy";


    const index =
        form.fields.findIndex(
            field =>
                field.id === id
        );


    form.fields.splice(
        index + 1,
        0,
        copy
    );


    selectedFieldId =
        copy.id;


    saveForm(false);

    render();

}


/* =========================
   SELECT FIELD
========================= */

function selectField(id){

    selectedFieldId =
        id;

    render();

}


/* =========================
   RENDER
========================= */

function render(){

    renderFields();

    renderSettings();

}


/* =========================
   RENDER FIELDS
========================= */

function renderFields(){

    const container =
        document.getElementById(
            "fields"
        );


    container.innerHTML = "";


    if(!form.fields.length){

        container.innerHTML = `

            <div class="empty-message">

                <strong>
                    Your form is empty
                </strong>

                <br><br>

                Choose a field from the
                left panel to get started.

            </div>

        `;

        return;

    }


    form.fields.forEach(
        field => {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "form-field" +
                (
                    selectedFieldId === field.id
                        ? " selected"
                        : ""
                );


            wrapper.dataset.id =
                field.id;


            if(
                field.type ===
                "divider"
            ){

                wrapper.innerHTML = `

                    <hr style="
                        border:0;
                        border-top:
                            1px solid #dbe2ea;
                        margin:8px 0;
                    ">

                    <div class="field-actions">

                        <button
                            class="small-btn"
                            onclick="duplicateField('${field.id}')">
                            ⧉
                        </button>

                        <button
                            class="small-btn delete"
                            onclick="deleteField('${field.id}')">
                            ×
                        </button>

                    </div>

                `;

                wrapper.addEventListener(
                    "click",
                    function(){

                        selectField(
                            field.id
                        );

                    }
                );


                container.appendChild(
                    wrapper
                );

                return;

            }


            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "form-field-label";


            label.innerHTML =
                escapeHTML(
                    field.label ||
                    "Untitled field"
                ) +
                (
                    field.required
                        ? ' <span class="required">*</span>'
                        : ""
                );


            wrapper.appendChild(
                label
            );


            const control =
                createControl(
                    field
                );


            wrapper.appendChild(
                control
            );


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "field-actions";


            actions.innerHTML = `

                <button
                    class="small-btn"
                    title="Duplicate"
                    onclick="duplicateField('${field.id}')">
                    ⧉
                </button>

                 <button
    class="small-btn"
    title="Duplicate"
    onclick="duplicateField('${field.id}')">
    ⧉
</button>

<button
    class="small-btn delete"
    title="Delete"
    onclick="deleteField('${field.id}')">
    ×
</button>

</div>

</div>

        container.appendChild(
            wrapper
        );

    }
);

}


/* =========================
   CREATE CONTROL
========================= */

function createControl(field){

    let element;


    if(
        field.type ===
        "textarea"
    ){

        element =
            document.createElement(
                "textarea"
            );

        element.className =
            "field-control";

        element.placeholder =
            field.placeholder || "";


    }else if(
        field.type ===
        "select"
    ){

        element =
            document.createElement(
                "select"
            );

        element.className =
            "field-control";


        field.options.forEach(
            option => {

                const optionElement =
                    document.createElement(
                        "option"
                    );

                optionElement.value =
                    option;

                optionElement.textContent =
                    option;

                element.appendChild(
                    optionElement
                );

            }
        );


    }else{

        element =
            document.createElement(
                "input"
            );

        element.className =
            "field-control";

        element.type =
            field.type;

        element.placeholder =
            field.placeholder || "";

    }


    return element;

}


/* =========================
   SETTINGS
========================= */

function renderSettings(){

    const container =
        document.getElementById(
            "settings"
        );

    const field =
        form.fields.find(
            item =>
                item.id === selectedFieldId
        );

    if(!field){

        container.innerHTML = `
            <div class="no-selection">
                Select a field to edit
                its settings.
            </div>
        `;

        return;
    }

    container.innerHTML = `
        <div class="setting">

            <label>FIELD LABEL</label>

            <input
                id="settingLabel"
                value="${escapeAttribute(field.label)}"
            >

        </div>

        <div class="setting">

            <label>PLACEHOLDER</label>

            <input
                id="settingPlaceholder"
                value="${escapeAttribute(
                    field.placeholder || ""
                )}"
            >

        </div>

        <div class="setting">

            <label>REQUIRED</label>

            <div class="checkbox-row">

                <input
                    id="settingRequired"
                    type="checkbox"
                    ${field.required ? "checked" : ""}
                >

                <span>Required field</span>

            </div>

        </div>

        <button
            class="btn btn-primary"
            style="width:100%"
            onclick="applyFieldSettings()">
            Apply Changes
        </button>
    `;
}


/* =========================
   APPLY SETTINGS
========================= */

function applyFieldSettings(){

    const field =
        form.fields.find(
            item =>
                item.id === selectedFieldId
        );

    if(!field){
        return;
    }

    field.label =
        document.getElementById(
            "settingLabel"
        ).value;

    field.placeholder =
        document.getElementById(
            "settingPlaceholder"
        ).value;

    field.required =
        document.getElementById(
            "settingRequired"
        ).checked;

    saveForm(false);

    render();

    showToast(
        "Field updated"
    );
}


/* =========================
   FORM INFORMATION
========================= */

function updateFormInfo(){

    form.title =
        document.getElementById(
            "formTitle"
        ).value;

    form.description =
        document.getElementById(
            "formDescription"
        ).value;

    document.getElementById(
        "builderTitle"
    ).textContent =
        form.title ||
        "Form Builder";

    saveForm(false);
}


/* =========================
   SAVE FORM
========================= */

function saveForm(
    notify = true
){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(form)
    );

    if(notify){
        showToast("Form saved");
    }
}


/* =========================
   PREVIEW
========================= */

function openPreview(){

    const preview =
        document.getElementById(
            "previewForm"
        );

    preview.innerHTML = `
        <h2>
            ${escapeHTML(form.title)}
        </h2>

        <p>
            ${escapeHTML(form.description)}
        </p>
    `;

    form.fields.forEach(
        field => {

            if(
                field.type === "divider"
            ){

                preview.innerHTML +=
                    "<hr>";

                return;
            }

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.style.marginBottom =
                "18px";

            const label =
                document.createElement(
                    "label"
                );

            label.textContent =
                field.label;

            label.style.display =
                "block";

            label.style.fontWeight =
                "bold";

            label.style.marginBottom =
                "7px";

            wrapper.appendChild(label);

            wrapper.appendChild(
                createControl(field)
            );

            preview.appendChild(
                wrapper
            );
        }
    );

    preview.innerHTML += `
        <button class="submit-preview">
            Submit
        </button>
    `;

    document.getElementById(
        "previewModal"
    ).classList.add("show");
}


function closePreview(){

    document.getElementById(
        "previewModal"
    ).classList.remove("show");
}


/* =========================
   PUBLISH
========================= */

function publishForm(){

    saveForm(false);

    showToast(
        "Form published"
    );
}


/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            1800
        );
}


/* =========================
   HELPERS
========================= */

function createId(){

    return (
        "field-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2,8)
    );
}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeAttribute(value){

    return escapeHTML(value);
}


/* =========================
   KEYBOARD SHORTCUTS
========================= */

document.addEventListener(
    "keydown",
    function(event){

        const modifier =
            event.ctrlKey ||
            event.metaKey;

        if(
            modifier &&
            event.key.toLowerCase() === "s"
        ){

            event.preventDefault();

            saveForm();
        }

        if(
            event.key === "Escape"
        ){

            closePreview();
        }
    }
);


/* =========================
   START APPLICATION
========================= */

init();

</script>
