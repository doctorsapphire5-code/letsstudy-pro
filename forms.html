<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#172033;
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.header h1{
    margin:0;
    font-size:19px;
}

.btn{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.primary{
    background:#7c3aed;
    color:#fff;
}

.secondary{
    background:#e2e8f0;
    color:#334155;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search{
    flex:1;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
}

.forms-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(250px,1fr));
    gap:16px;
}

.form-card{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:18px;
}

.form-card h2{
    margin:0 0 8px;
    font-size:16px;
}

.form-card p{
    margin:0 0 18px;
    color:#64748b;
    font-size:11px;
    line-height:1.5;
}

.meta{
    display:flex;
    justify-content:space-between;
    color:#64748b;
    font-size:10px;
    margin-bottom:14px;
}

.actions{
    display:flex;
    gap:7px;
}

.empty{
    text-align:center;
    padding:70px 20px;
    color:#64748b;
}

@media(max-width:600px){

    .container{
        padding:14px;
    }

    .header{
        padding:0 14px;
    }

    .header .secondary{
        display:none;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>Forms</h1>

    <div>
        <button
            class="btn secondary"
            onclick="openResponses()">
            Responses
        </button>

        <button
            class="btn primary"
            onclick="createForm()">
            + New Form
        </button>
    </div>

</header>


<main class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search forms..."
            oninput="renderForms()">

    </div>


    <section
        id="formsGrid"
        class="forms-grid">
    </section>

    <div
        id="empty"
        class="empty"
        style="display:none">

        No forms found.

    </div>

</main>


<script>

const STORAGE_KEY =
    "forms-list";


let forms = [];


/* =========================
   LOAD
========================= */

function loadForms(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if(saved){

        try{

            forms =
                JSON.parse(saved);

        }catch(error){

            forms = [];

        }

    }


    if(!Array.isArray(forms)){
        forms = [];
    }

}


/* =========================
   SAVE
========================= */

function saveForms(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(forms)
    );

}


/* =========================
   CREATE
========================= */

function createForm(){

    const form = {

        id:
            Date.now(),

        title:
            "Untitled Form",

        description:
            "Create a new form.",

        responses:
            0,

        updated:
            new Date()
                .toLocaleDateString()

    };


    forms.unshift(
        form
    );


    saveForms();

    openBuilder(
        form.id
    );

}


/* =========================
   RENDER
========================= */

function renderForms(){

    const grid =
        document.getElementById(
            "formsGrid"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const query =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    grid.innerHTML = "";


    const filtered =
        forms.filter(
            form =>
                form.title
                    .toLowerCase()
                    .includes(query)
        );


    if(!filtered.length){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        form => {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "form-card";


            card.innerHTML = `

                <h2>
                    ${escapeHTML(form.title)}
                </h2>

                <p>
                    ${escapeHTML(
                        form.description
                    )}
                </p>

                <div class="meta">

                    <span>
                        ${form.responses}
                        responses
                    </span>

                    <span>
                        ${escapeHTML(
                            form.updated
                        )}
                    </span>

                </div>

                <div class="actions">

                    <button
                        class="btn secondary"
                        onclick="openBuilder(${form.id})">
                        Edit
                    </button>

                    <button
                        class="btn secondary"
                        onclick="viewResponses(${form.id})">
                        Responses
                    </button>

                    <button
                        class="btn secondary"
                        onclick="deleteForm(${form.id})">
                        Delete
                    </button>

                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =========================
   OPEN BUILDER
========================= */

function openBuilder(id){

    location.href =
        "form-builder.html?id=" +
        encodeURIComponent(id);

}


/* =========================
   RESPONSES
========================= */

function openResponses(){

    location.href =
        "responses.html";

}


function viewResponses(id){

    location.href =
        "responses.html?form=" +
        encodeURIComponent(id);

}


/* =========================
   DELETE
========================= */

function deleteForm(id){

    const confirmed =
        confirm(
            "Delete this form?"
        );


    if(!confirmed){
        return;
    }


    forms =
        forms.filter(
            form =>
                form.id !== id
        );


    saveForms();

    renderForms();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
    value
){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   START
========================= */

loadForms();

renderForms();

</script>

</body>
</html>
