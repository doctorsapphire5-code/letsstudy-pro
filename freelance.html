<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Freelancers | LetsStudy Pro</title>

<meta name="description"
content="Find verified freelancers and professional experts on LetsStudy Pro.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

a{
 text-decoration:none;
 color:inherit
}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 6%;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:800
}

.nav{
 display:flex;
 gap:18px;
 font-size:13px;
 font-weight:700
}

.hero{
 background:linear-gradient(135deg,#155eef,#073bba);
 color:#fff;
 padding:55px 20px
}

.hero-inner{
 max-width:1100px;
 margin:auto
}

.hero h1{
 margin:0 0 10px;
 font-size:37px
}

.hero p{
 max-width:650px;
 line-height:1.7;
 color:#dbe7ff
}

.container{
 max-width:1100px;
 margin:25px auto;
 padding:0 20px
}

.toolbar{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:14px;
 display:grid;
 grid-template-columns:2fr 1fr 1fr 1fr;
 gap:10px;
 margin-bottom:20px
}

input,
select{
 width:100%;
 padding:11px;
 border:1px solid #d9dee8;
 border-radius:9px;
 outline:none;
 background:#fff
}

.section-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:13px
}

.section-head h2{
 margin:0;
 font-size:20px
}

.count{
 color:#667085;
 font-size:12px
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:16px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:15px;
 overflow:hidden;
 transition:.2s
}

.card:hover{
 transform:translateY(-3px);
 box-shadow:0 12px 30px #00000012
}

.cover{
 height:135px;
 background:#eaf0ff;
 position:relative
}

.cover img{
 width:100%;
 height:100%;
 object-fit:cover
}

.featured{
 position:absolute;
 top:10px;
 left:10px;
 background:#f59e0b;
 color:#fff;
 padding:5px 9px;
 border-radius:20px;
 font-size:10px;
 font-weight:800
}

.profile{
 margin-top:-35px;
 padding:0 15px;
 position:relative
}

.avatar{
 width:70px;
 height:70px;
 border-radius:50%;
 border:4px solid #fff;
 background:#e8eefc;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#155eef;
 font-size:23px;
 font-weight:800
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover
}

.body{
 padding:10px 15px 15px
}

.name-row{
 display:flex;
 align-items:center;
 gap:6px
}

.name{
 font-size:17px;
 font-weight:800;
 margin:0
}

.verified{
 color:#12b76a;
 font-size:13px
}

.username{
 color:#667085;
 font-size:11px;
 margin-top:3px
}

.headline{
 margin:9px 0;
 font-size:12px;
 line-height:1.5;
 color:#475467
}

.location{
 color:#667085;
 font-size:11px;
 display:flex;
 gap:5px;
 align-items:center
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin:11px 0
}

.tag{
 background:#f2f4f7;
 color:#475467;
 padding:5px 8px;
 border-radius:20px;
 font-size:10px
}

.rating{
 display:flex;
 align-items:center;
 gap:5px;
 font-size:12px;
 margin-top:10px
}

.rating i{
 color:#f59e0b
}

.rating span{
 color:#667085
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 border-top:1px solid #eef0f3;
 border-bottom:1px solid #eef0f3;
 margin-top:13px;
 padding:10px 0
}

.stat{
 text-align:center;
 font-size:11px
}

.stat strong{
 display:block;
 font-size:13px;
 color:#172033
}

.stat span{
 color:#667085;
 font-size:9px
}

.bottom{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-top:13px
}

.rate{
 font-size:15px;
 font-weight:800
}

.rate small{
 color:#667085;
 font-size:9px;
 font-weight:500
}

.view{
 background:#155eef;
 color:#fff;
 padding:10px 13px;
 border-radius:8px;
 font-size:11px;
 font-weight:800
}

.empty{
 grid-column:1/-1;
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:55px;
 text-align:center;
 color:#667085
}

.loading{
 text-align:center;
 padding:60px;
 color:#667085
}

@media(max-width:850px){

 .grid{
  grid-template-columns:repeat(2,1fr)
 }

 .toolbar{
  grid-template-columns:1fr 1fr
 }

}

@media(max-width:550px){

 .nav{
  display:none
 }

 .hero h1{
  font-size:29px
 }

 .container{
  padding:0 15px
 }

 .toolbar,
 .grid{
  grid-template-columns:1fr
 }

}
</style>
</head>

<body>

<header class="top">

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<nav class="nav">

<a href="course.html">
Courses
</a>

<a href="marketplace.html">
Marketplace
</a>

<a href="service.html">
Services
</a>

<a href="careers.html">
Careers
</a>

</nav>

</header>


<section class="hero">

<div class="hero-inner">

<h1>
Find Professional Freelancers
</h1>

<p>
Discover verified freelancers, creative professionals
and skilled experts ready to work on your next project.
</p>

</div>

</section>


<main class="container">


<section class="toolbar">

<input
id="search"
placeholder="Search freelancers, skills...">


<select id="category">

<option value="">
All Categories
</option>

</select>


<select id="experience">

<option value="">
All Experience
</option>

</select>


<select id="availability">

<option value="">
All Availability
</option>

</select>

</section>


<section>

<div class="section-head">

<h2>
Top Freelancers
</h2>

<span
id="count"
class="count">
Loading...
</span>

</div>


<div
id="freelancers"
class="grid">

<div class="loading">

<i class="fa fa-spinner fa-spin"></i>

<p>
Loading freelancers...
</p>

</div>

</div>

</section>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
FIREBASE
========================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsYrgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =========================
STATE
========================= */

let freelancers=[];


/* =========================
DOM
========================= */

const list=
document.getElementById(
"freelancers"
);

const search=
document.getElementById(
"search"
);

const category=
document.getElementById(
"category"
);

const experience=
document.getElementById(
"experience"
);

const availability=
document.getElementById(
"availability"
);

const count=
document.getElementById(
"count"
);


/* =========================
ESCAPE
========================= */

function esc(value=""){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
ARRAY HELPER
========================= */

function toArray(value){

if(Array.isArray(value))
return value;

if(typeof value==="string")
return value
.split(",")
.map(x=>x.trim())
.filter(Boolean);

return [];

}


/* =========================
LOAD
========================= */

async function loadFreelancers(){

try{

const snap=
await getDocs(
collection(
db,
"freelancers"
)
);


freelancers=[];


snap.forEach(item=>{

const data=item.data();


if(
data.status==="published"
){

freelancers.push({

id:item.id,
...data

});

}

});


buildFilters();

render();


}catch(error){

console.error(error);


list.innerHTML=`

<div class="empty">

<i class="fa fa-triangle-exclamation"></i>

<h3>
Unable to load freelancers
</h3>

<p>
Please try again later.
</p>

</div>

`;

count.textContent="0 freelancers";

}

}


/* =========================
FILTER OPTIONS
========================= */

function buildFilters(){

const categories=
freelancers
.flatMap(
f=>toArray(f.categories)
)
.filter(Boolean);


const levels=
freelancers
.map(
f=>f.experienceLevel
)
.filter(Boolean);


const availabilityList=
freelancers
.map(
f=>f.availability
)
.filter(Boolean);


fillSelect(
category,
"All Categories",
categories
);


fillSelect(
experience,
"All Experience",
levels
);


fillSelect(
availability,
"All Availability",
availabilityList
);

}


function fillSelect(
element,
first,
items
){

const values=
[
...new Set(items)
].sort();


element.innerHTML=
`<option value="">
${first}
</option>`

+

values.map(
value=>`

<option value="${esc(value)}">
${esc(value)}
</option>

`
).join("");

}


/* =========================
RENDER
========================= */

function render(){

const keyword=
search.value
.toLowerCase()
.trim();


const selectedCategory=
category.value;


const selectedExperience=
experience.value;


const selectedAvailability=
availability.value;


let data=
freelancers.filter(f=>{

const skills=
toArray(f.skills);


const categories=
toArray(f.categories);


const languages=
toArray(f.languages);


const text=`

${f.name||""}

${f.username||""}

${f.headline||""}

${f.bio||""}

${skills.join(" ")}

${categories.join(" ")}

${languages.join(" ")}

${f.city||""}

${f.country||""}

`.toLowerCase();


return(

text.includes(keyword)

&&

(
!selectedCategory ||
categories.includes(
selectedCategory
)
)

&&

(
!selectedExperience ||
f.experienceLevel===
selectedExperience
)

&&

(
!selectedAvailability ||
f.availability===
selectedAvailability
)

);

});


/* FEATURED FIRST */

data.sort(
(a,b)=>
Number(b.featured||false)
-
Number(a.featured||false)
);


count.textContent=
`${data.length} freelancer${
data.length===1?"":"s"
}`;


if(!data.length){

list.innerHTML=`

<div class="empty">

<i class="fa fa-user-slash"></i>

<h3>
No freelancers found
</h3>

<p>
Try another search or filter.
</p>

</div>

`;

return;

}


list.innerHTML=
data
.map(createCard)
.join("");

}


/* =========================
CARD
========================= */

function createCard(f){

const skills=
toArray(f.skills)
.slice(0,4);


const initials=
(f.name||"F")
.trim()
.charAt(0)
.toUpperCase();


const rating=
Number(f.rating||0);


const ratingCount=
Number(f.ratingCount||0);


const jobs=
Number(f.completedJobs||0);


const portfolio=
Number(f.portfolioCount||0);


const rate=
Number(f.hourlyRate||0);


const currency=
f.currency||"TZS";


const location=
[
f.city,
f.region,
f.country
]
.filter(Boolean)
.join(", ");


const profileImage=
f.profileImage||"";


return`

<article class="card">


<div class="cover">

<img
src="${esc(
f.coverImage||
"https://via.placeholder.com/800x300?text=Freelancer"
)}"
alt="${esc(f.name||"Freelancer")}"
loading="lazy">


${
f.featured
?
`
<span class="featured">
★ Featured
</span>
`
:
""
}

</div>


<div class="profile">


<div class="avatar">

${
profileImage
?
`
<img
src="${esc(profileImage)}"
alt="${esc(f.name||"Freelancer")}"
>
`
:
esc(initials)
}

</div>

</div>


<div class="body">


<div class="name-row">

<h3 class="name">

${esc(
f.name||
"Freelancer"
)}

</h3>


${
f.verified
?
`
<i
class="fa fa-circle-check verified"
title="Verified">
</i>
`
:
""
}

</div>


<div class="username">

@${esc(
f.username||
"freelancer"
)}

</div>


<div class="headline">

${esc(
f.headline||
"Professional Freelancer"
)}

</div>


${
location
?
`
<div class="location">

<i class="fa fa-location-dot"></i>

${esc(location)}

</div>
`
:
""
}


<div class="tags">

${
skills
.map(
skill=>`

<span class="tag">

${esc(skill)}

</span>

`
)
.join("")
}

</div>


<div class="rating">

<i class="fa fa-star"></i>

<strong>
${rating.toFixed(1)}
</strong>

<span>
(${ratingCount.toLocaleString()} reviews)
</span>

</div>


<div class="stats">

<div class="stat">

<strong>
${jobs.toLocaleString()}
</strong>

<span>
Completed
</span>

</div>


<div class="stat">

<strong>
${portfolio.toLocaleString()}
</strong>

<span>
Portfolio
</span>

</div>


<div class="stat">

<strong>
${Number(
f.totalJobs||0
).toLocaleString()}
</strong>

<span>
Jobs
</span>

</div>

</div>


<div class="bottom">


<div class="rate">

${esc(currency)}
 ${rate.toLocaleString()}

<small>
 / hour
</small>

</div>


<a
class="view"
href="freelancer-view.html?id=${encodeURIComponent(f.id)}">

View Profile

<i class="fa fa-arrow-right"></i>

</a>


</div>


</div>

</article>

`;

}


/* =========================
EVENTS
========================= */

search.addEventListener(
"input",
render
);

category.addEventListener(
"change",
render
);

experience.addEventListener(
"change",
render
);

availability.addEventListener(
"change",
render
);


/* =========================
START
========================= */

loadFreelancers();

</script>

</body>
</html>
