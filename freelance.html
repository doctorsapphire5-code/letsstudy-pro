<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Freelancers | LetsStudy Pro</title>

<meta name="description"
content="Find verified freelancers and professional talent on LetsStudy Pro.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

a{
 text-decoration:none;
 color:inherit
}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 6%;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:800
}

.nav{
 display:flex;
 gap:18px;
 font-size:13px;
 font-weight:700
}

.hero{
 background:linear-gradient(135deg,#155eef,#073bba);
 color:#fff;
 padding:55px 20px
}

.hero-inner{
 max-width:1100px;
 margin:auto
}

.hero h1{
 margin:0 0 10px;
 font-size:37px
}

.hero p{
 max-width:650px;
 color:#dbe7ff;
 line-height:1.7
}

.container{
 max-width:1100px;
 margin:25px auto;
 padding:0 20px
}

.toolbar{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:14px;
 display:grid;
 grid-template-columns:2fr 1fr 1fr 1fr;
 gap:10px;
 margin-bottom:20px
}

input,select{
 width:100%;
 padding:11px;
 border:1px solid #d9dee8;
 border-radius:9px;
 outline:none;
 background:#fff
}

.heading{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:13px
}

.heading h2{
 margin:0;
 font-size:20px
}

.heading span{
 color:#667085;
 font-size:12px
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:16px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:15px;
 overflow:hidden;
 transition:.2s
}

.card:hover{
 transform:translateY(-3px);
 box-shadow:0 12px 30px #00000012
}

.cover{
 height:110px;
 background:#e9eef7;
 position:relative
}

.cover img{
 width:100%;
 height:100%;
 object-fit:cover
}

.profile{
 width:76px;
 height:76px;
 border-radius:50%;
 border:4px solid #fff;
 object-fit:cover;
 position:absolute;
 left:18px;
 bottom:-38px;
 background:#eef2f6
}

.verified{
 position:absolute;
 right:10px;
 top:10px;
 background:#ecfdf3;
 color:#027a48;
 border-radius:20px;
 padding:5px 9px;
 font-size:10px;
 font-weight:800
}

.featured{
 position:absolute;
 top:10px;
 left:10px;
 background:#f59e0b;
 color:#fff;
 border-radius:20px;
 padding:5px 9px;
 font-size:10px;
 font-weight:800
}

.body{
 padding:45px 16px 16px
}

.name{
 display:flex;
 align-items:center;
 gap:5px;
 font-size:17px;
 font-weight:800
}

.username{
 color:#667085;
 font-size:11px;
 margin-top:2px
}

.headline{
 color:#155eef;
 font-size:12px;
 font-weight:700;
 margin:10px 0 5px
}

.bio{
 color:#667085;
 font-size:12px;
 line-height:1.6;
 min-height:38px
}

.skills{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin:10px 0
}

.skill{
 background:#f2f4f7;
 padding:5px 8px;
 border-radius:20px;
 font-size:10px;
 color:#475467
}

.rating{
 color:#f59e0b;
 font-size:12px;
 margin:8px 0
}

.rating span{
 color:#667085
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
 margin-top:10px
}

.stat{
 background:#f8fafc;
 padding:8px;
 border-radius:8px;
 text-align:center;
 font-size:10px;
 color:#667085
}

.stat strong{
 display:block;
 color:#172033;
 font-size:12px;
 margin-bottom:2px
}

.meta{
 display:flex;
 justify-content:space-between;
 margin-top:10px;
 font-size:10px;
 color:#667085
}

.available{
 color:#027a48;
 font-weight:700
}

.busy{
 color:#b42318;
 font-weight:700
}

.actions{
 display:flex;
 gap:7px;
 margin-top:13px
}

.actions a{
 flex:1;
 padding:10px;
 text-align:center;
 border-radius:8px;
 background:#eef2f6;
 font-size:11px;
 font-weight:700
}

.actions .primary{
 background:#155eef;
 color:#fff
}

.empty{
 grid-column:1/-1;
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:55px;
 text-align:center;
 color:#667085
}

@media(max-width:900px){

 .grid{
  grid-template-columns:repeat(2,1fr)
 }

 .toolbar{
  grid-template-columns:1fr 1fr
 }

}

@media(max-width:550px){

 .nav{
  display:none
 }

 .hero h1{
  font-size:29px
 }

 .container{
  padding:0 15px
 }

 .toolbar,
 .grid{
  grid-template-columns:1fr
 }

}
</style>
</head>

<body>

<header class="top">

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<nav class="nav">

<a href="course.html">Courses</a>

<a href="marketplace.html">Marketplace</a>

<a href="service.html">Services</a>

<a href="freelance.html">Freelancers</a>

<a href="careers.html">Careers</a>

</nav>

</header>


<section class="hero">

<div class="hero-inner">

<h1>
Find Top Freelancers
</h1>

<p>
Connect with verified professionals,
explore their skills and hire freelancers
for your next project.
</p>

</div>

</section>


<main class="container">


<section class="toolbar">

<input
id="search"
placeholder="Search freelancer, skill or service...">

<select id="category">

<option value="">
All Categories
</option>

</select>

<select id="experience">

<option value="">
All Experience
</option>

<option value="entry">
Entry Level
</option>

<option value="intermediate">
Intermediate
</option>

<option value="expert">
Expert
</option>

</select>

<select id="availability">

<option value="">
All Availability
</option>

<option value="available">
Available
</option>

<option value="busy">
Busy
</option>

</select>

</section>


<section>

<div class="heading">

<h2>
Professional Freelancers
</h2>

<span id="count">
Loading...
</span>

</div>


<div
id="freelancers"
class="grid">

<div class="empty">

<i class="fa fa-spinner fa-spin"></i>

<p>
Loading freelancers...
</p>

</div>

</div>

</section>

</main>


<script type="module">

import {
 initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


let freelancers=[];


const list=
document.getElementById(
"freelancers"
);

const search=
document.getElementById(
"search"
);

const category=
document.getElementById(
"category"
);

const experience=
document.getElementById(
"experience"
);

const availability=
document.getElementById(
"availability"
);

const count=
document.getElementById(
"count"
);


function esc(value=""){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function arrayValue(value){

if(Array.isArray(value))
return value;

if(typeof value==="string")
return value
.split(",")
.map(x=>x.trim())
.filter(Boolean);

return [];

}


/* =========================
 LOAD
========================= */

async function loadFreelancers(){

try{

const snap=
await getDocs(
collection(
db,
"freelancers"
)
);


freelancers=[];


snap.forEach(item=>{

const data=item.data();


if(data.status==="published"){

freelancers.push({

id:item.id,
...data

});

}

});


buildCategories();

render();

}catch(error){

console.error(error);

list.innerHTML=`

<div class="empty">

<i class="fa fa-triangle-exclamation"></i>

<h3>
Unable to load freelancers
</h3>

<p>
Please try again later.
</p>

</div>

`;

}

}


/* =========================
 CATEGORIES
========================= */

function buildCategories(){

const categories=[];


freelancers.forEach(f=>{

arrayValue(
f.categories
).forEach(c=>{

if(!categories.includes(c))
categories.push(c);

});

});


categories.sort();


category.innerHTML=

`<option value="">
All Categories
</option>`

+

categories.map(
c=>`

<option value="${esc(c)}">
${esc(c)}
</option>

`
).join("");

}


/* =========================
 RENDER
========================= */

function render(){

const keyword=
search.value
.toLowerCase()
.trim();

const selectedCategory=
category.value;

const selectedExperience=
experience.value;

const selectedAvailability=
availability.value;


const data=
freelancers.filter(f=>{

const skills=
arrayValue(
f.skills
);

const categories=
arrayValue(
f.categories
);


const text=`

${f.name||""}
${f.username||""}
${f.headline||""}
${f.bio||""}
${skills.join(" ")}
${categories.join(" ")}

`.toLowerCase();


return(

text.includes(keyword)

&&

(
!selectedCategory ||
categories.includes(
selectedCategory
)
)

&&

(
!selectedExperience ||
f.experienceLevel===
selectedExperience
)

&&

(
!selectedAvailability ||
f.availability===
selectedAvailability
)

);

});


count.textContent=
`${data.length} freelancer${
data.length===1?"":"s"
}`;


if(!data.length){

list.innerHTML=`

<div class="empty">

<i class="fa fa-user-slash"></i>

<h3>
No freelancers found
</h3>

<p>
Try another search or filter.
</p>

</div>

`;

return;

}


/* FEATURED FIRST */

data.sort(
(a,b)=>
Number(b.featured||false)
-
Number(a.featured||false)
);


list.innerHTML=
data.map(
createCard
).join("");

}


/* =========================
 CARD
========================= */

function createCard(f){

const skills=
arrayValue(
f.skills
).slice(0,5);


const profile=
f.profileImage||
"https://via.placeholder.com/200?text=User";


const cover=
f.coverImage||
"https://via.placeholder.com/900x300?text=Freelancer";


const rating=
Number(f.rating||0);


return`

<article class="card">


<div class="cover">

<img
src="${esc(cover)}"
alt=""
loading="lazy">


<img
class="profile"
src="${esc(profile)}"
alt="${esc(f.name||"Freelancer")}"
loading="lazy">


${
f.featured
?
`<span class="featured">
★ Featured
</span>`
:""
}


${
f.verified
?
`<span class="verified">
✓ Verified
</span>`
:""
}

</div>


<div class="body">


<div class="name">

${esc(
f.name||
"Freelancer"
)}

${
f.verified
?
`<i
class="fa fa-circle-check"
style="color:#155eef;font-size:13px">
</i>`
:""
}

</div>


<div class="username">

@${esc(
f.username||
f.slug||
"freelancer"
)}

</div>


<div class="headline">

${esc(
f.headline||
"Professional Freelancer"
)}

</div>


<div class="bio">

${esc(
f.bio||
"Available for professional projects."
)}

</div>


<div class="skills">

${
skills.map(
s=>
`<span class="skill">
${esc(s)}
</span>`
).join("")
}

</div>


<div class="rating">

★ ${rating.toFixed(1)}

<span>
(${Number(
f.ratingCount||0
).toLocaleString()})
</span>

</div>


<div class="stats">

<div class="stat">

<strong>
${Number(
f.completedJobs||0
).toLocaleString()}
</strong>

Completed

</div>


<div class="stat">

<strong>
${Number(
f.portfolioCount||0
).toLocaleString()}
</strong>

Portfolio

</div>


<div class="stat">

<strong>
${Number(
f.totalJobs||0
).toLocaleString()}
</strong>

Jobs

</div>

</div>


<div class="meta">

<span>

<i class="fa fa-location-dot"></i>

${esc(
f.city||
f.country||
"Remote"
)}

</span>


<span class="${
f.availability==="available"
?"available"
:"busy"
}">

<i class="fa fa-circle"></i>

${esc(
f.availability||
"Available"
)}

</span>

</div>


<div class="actions">

<a
class="primary"
href="freelancer-details.html?id=${encodeURIComponent(f.id)}">

View Profile

</a>


<a
href="service.html?freelancerId=${encodeURIComponent(f.id)}">

Services

</a>

</div>


</div>

</article>

`;

}


/* =========================
 FILTER EVENTS
========================= */

search.addEventListener(
"input",
render
);

category.addEventListener(
"change",
render
);

experience.addEventListener(
"change",
render
);

availability.addEventListener(
"change",
render
);


/* =========================
 START
========================= */

loadFreelancers();

</script>

</body>
</html>
