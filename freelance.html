<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freelancers | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f6f8fb;color:#172033}
header{height:65px;background:#fff;border-bottom:1px solid #e5e7eb;
display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}
.logo{font-size:20px;font-weight:800;color:#2563eb}
nav{display:flex;gap:22px}
nav a{text-decoration:none;color:#475569;font-size:14px}
.btn{border:0;background:#2563eb;color:white;padding:10px 15px;border-radius:8px;cursor:pointer}
.hero{text-align:center;padding:55px 20px;background:#eff6ff}
.hero h1{font-size:40px;margin-bottom:12px}
.hero h1 span{color:#2563eb}
.hero p{color:#64748b}
.search{max-width:1000px;margin:-25px auto 30px;padding:0 15px}
.searchbox{background:#fff;padding:12px;border-radius:12px;
box-shadow:0 8px 25px #0001;display:flex;gap:10px}
.searchbox input{flex:1;border:1px solid #ddd;padding:13px;border-radius:8px;outline:0}
.filters{max-width:1400px;margin:auto;padding:0 20px 20px;
display:flex;gap:10px;flex-wrap:wrap}
select{padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff}
.categories{max-width:1400px;margin:auto;padding:0 20px 20px;display:flex;gap:8px;overflow:auto}
.cat{white-space:nowrap;border:1px solid #ddd;background:white;padding:8px 13px;border-radius:20px;cursor:pointer}
.cat.active{background:#2563eb;color:white}
.container{max-width:1400px;margin:auto;padding:0 20px 50px}
.info{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:white;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}
.cover{height:100px;background:#2563eb}
.cover img{width:100%;height:100%;object-fit:cover}
.profile{padding:0 16px 16px}
.avatar{width:70px;height:70px;border:4px solid white;border-radius:50%;
margin-top:-35px;overflow:hidden;background:#ddd}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{display:flex;align-items:center;gap:6px;margin:8px 0 5px}
.name h3{font-size:17px}
.verified{color:#2563eb;font-size:13px}
.headline{height:38px;color:#64748b;font-size:13px;line-height:1.4}
.rating{margin:10px 0;font-size:13px}
.rating i{color:#f59e0b}
.location{color:#64748b;font-size:12px;margin-bottom:10px}
.skills{display:flex;flex-wrap:wrap;gap:5px;height:48px}
.skill{background:#f1f5f9;padding:5px 7px;border-radius:5px;font-size:11px}
.footer{border-top:1px solid #eee;padding-top:12px;
display:flex;justify-content:space-between;align-items:center}
.rate{font-size:14px;font-weight:bold}
.view{background:#2563eb;color:white;border:0;padding:8px 11px;border-radius:7px;cursor:pointer}
.loading,.empty{grid-column:1/-1;text-align:center;padding:60px;color:#64748b}
.pagination{text-align:center;margin-top:25px}
.page{border:1px solid #ddd;background:white;padding:8px 12px;margin:3px;border-radius:6px;cursor:pointer}
.page.active{background:#2563eb;color:white}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){nav{display:none}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.searchbox{flex-direction:column}}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">LetsStudy Pro</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="Courses.html">Courses</a>
    <a href="careers.html">Careers</a>
    <a href="Freelance.html">Freelance</a>
    <a href="community.html">Community</a>
  </nav>

  <button class="btn"
    onclick="location.href='become-freelancer.html'">
    Become Freelancer
  </button>
</header>

<section class="hero">
  <h1>Find <span>Freelancers</span></h1>
  <p>Discover skilled professionals and hire the right person for your project.</p>
</section>

<div class="search">
  <div class="searchbox">
    <input id="search" placeholder="Search freelancers, skills...">
    <button class="btn" onclick="filterData()">
      <i class="fa fa-search"></i> Search
    </button>
  </div>
</div>

<div class="categories" id="categories">
  <button class="cat active" data-cat="all">All</button>
  <button class="cat" data-cat="Web Development">Web Development</button>
  <button class="cat" data-cat="Graphic Design">Graphic Design</button>
  <button class="cat" data-cat="Writing">Writing</button>
  <button class="cat" data-cat="Marketing">Marketing</button>
  <button class="cat" data-cat="Video">Video</button>
</div>

<div class="filters">
  <select id="experience">
    <option value="all">All Experience</option>
    <option>Entry Level</option>
    <option>Intermediate</option>
    <option>Expert</option>
  </select>

  <select id="sort">
    <option value="featured">Featured</option>
    <option value="rating">Highest Rated</option>
    <option value="jobs">Most Jobs</option>
    <option value="low">Rate Low → High</option>
    <option value="high">Rate High → Low</option>
  </select>
</div>

<main class="container">

  <div class="info">
    <h2>Top Freelancers</h2>
    <span id="count">Loading...</span>
  </div>

  <div class="grid" id="grid">
    <div class="loading">
      <i class="fa fa-spinner fa-spin"></i>
      Loading freelancers...
    </div>
  </div>

  <div class="pagination" id="pagination"></div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let data=[];
let filtered=[];
let category="all";
let page=1;
const limit=12;


const $=id=>document.getElementById(id);


async function load(){

 try{

  const snap=await getDocs(collection(db,"freelancers"));

  data=snap.docs.map(d=>({
   id:d.id,...d.data()
  })).filter(x=>
   !x.status ||
   x.status==="active" ||
   x.status==="published"
  );

  filterData();

 }catch(e){

  console.error(e);

  $("grid").innerHTML=`
   <div class="empty">
    <i class="fa fa-triangle-exclamation"></i>
    <p>Failed to load freelancers.</p>
   </div>`;

 }

}


window.filterData=function(){

 const q=$("search").value.toLowerCase().trim();
 const exp=$("experience").value;

 filtered=data.filter(x=>{

  const cats=Array.isArray(x.categories)?x.categories:[];
  const skills=Array.isArray(x.skills)?x.skills:[];

  const text=[
   x.name,x.username,x.headline,x.bio,
   x.country,x.region,x.city,
   ...cats,...skills
  ].filter(Boolean).join(" ").toLowerCase();

  const catOk=
   category==="all" ||
   cats.some(c=>
    String(c).toLowerCase()===
    category.toLowerCase()
   );

  const expOk=
   exp==="all" ||
   String(x.experienceLevel||"").toLowerCase()===
   exp.toLowerCase();

  return catOk && expOk && (!q||text.includes(q));

 });

 sortData();
 page=1;
 render();

};


function sortData(){

 const s=$("sort").value;

 if(s==="rating")
  filtered.sort((a,b)=>
   (b.rating||0)-(a.rating||0));

 if(s==="jobs")
  filtered.sort((a,b)=>
   (b.completedJobs||0)-(a.completedJobs||0));

 if(s==="low")
  filtered.sort((a,b)=>
   (a.hourlyRate||0)-(b.hourlyRate||0));

 if(s==="high")
  filtered.sort((a,b)=>
   (b.hourlyRate||0)-(a.hourlyRate||0));

 if(s==="featured")
  filtered.sort((a,b)=>
   Number(b.featured)-Number(a.featured));

}


function render(){

 $("count").textContent=
  `${filtered.length} freelancers`;

 if(!filtered.length){

  $("grid").innerHTML=`
   <div class="empty">
    <i class="fa fa-user-slash"></i>
    <h3>No freelancers found</h3>
    <p>Try another search or category.</p>
   </div>`;

  $("pagination").innerHTML="";
  return;
 }

 const start=(page-1)*limit;
 const items=filtered.slice(start,start+limit);

 $("grid").innerHTML=
  items.map(card).join("");

 pagination();

}


function card(x){

 const name=esc(x.name||"Freelancer");
 const avatar=x.profileImage||
  `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}`;

 const cover=x.coverImage||
  "https://images.unsplash.com/photo-1557682250-33bd709cbe85?auto=format&fit=crop&w=800&q=80";

 const skills=Array.isArray(x.skills)?x.skills:[];

 return `
 <article class="card">

  <div class="cover">
   <img src="${esc(cover)}"
    onerror="this.style.display='none'">
  </div>

  <div class="profile">

   <div class="avatar">
    <img src="${esc(avatar)}"
     onerror="this.src='https://ui-avatars.com/api/?name=User'">
   </div>

   <div class="name">
    <h3>${name}</h3>
    ${x.verified?
     `<i class="fa fa-circle-check verified"></i>`:""}
   </div>

   <div class="headline">
    ${esc(x.headline||"Professional Freelancer")}
   </div>

   <div class="rating">
    <i class="fa fa-star"></i>
    ${Number(x.rating||0).toFixed(1)}
    (${x.ratingCount||0})
   </div>

   <div class="location">
    <i class="fa fa-location-dot"></i>
    ${esc([x.city,x.country].filter(Boolean).join(", ")
      ||"Location not specified")}
   </div>

   <div class="skills">
    ${skills.slice(0,4).map(s=>
     `<span class="skill">${esc(s)}</span>`
    ).join("")}
   </div>

   <div class="footer">

    <div class="rate">
     ${esc(x.currency||"USD")}
     ${Number(x.hourlyRate||0).toLocaleString()}
     /hr
    </div>

    <button class="view"
     onclick="profile('${x.id}')">
     View
    </button>

   </div>

  </div>
 </article>`;
}


function pagination(){

 const pages=Math.ceil(filtered.length/limit);
 let html="";

 for(let i=1;i<=pages;i++)
  html+=`
   <button class="page ${i===page?"active":""}"
    onclick="go(${i})">${i}</button>`;

 $("pagination").innerHTML=html;
}


window.go=i=>{
 page=i;
 render();
 window.scrollTo({top:350,behavior:"smooth"});
};


window.profile=id=>{
 location.href=
 `freelancer-profile.html?id=${encodeURIComponent(id)}`;
};


document.querySelectorAll(".cat").forEach(btn=>{
 btn.onclick=()=>{

  document.querySelectorAll(".cat")
   .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");
  category=btn.dataset.cat;

  filterData();
 };
});


$("search").oninput=filterData;
$("experience").onchange=filterData;
$("sort").onchange=filterData;

function esc(v){
 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

load();

</script>

</body>
</html>
