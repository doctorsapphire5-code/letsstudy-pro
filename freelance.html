<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Freelancers | LetsStudy Pro</title>

<meta name="description"
content="Discover freelancers, skills and professional services on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1150px;
  margin:30px auto;
}

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  color:#64748b;
}

.search-box{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 4px 20px #00000008;
}

.search-box input{
  width:100%;
  padding:14px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

.filters{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.filters button{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:9px 14px;
  border-radius:20px;
  cursor:pointer;
}

.filters button.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(245px,1fr));
  gap:15px;
}

.freelancer{
  background:#fff;
  border-radius:15px;
  padding:18px;
  box-shadow:0 4px 18px #00000008;
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  font-weight:700;
}

.username{
  color:#64748b;
  font-size:13px;
  margin-top:4px;
}

.title{
  font-size:16px;
  font-weight:700;
  margin-bottom:7px;
}

.description{
  color:#64748b;
  font-size:13px;
  line-height:1.5;
  min-height:40px;
}

.tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:13px 0;
}

.tag{
  background:#eff6ff;
  color:#2563eb;
  padding:5px 8px;
  border-radius:6px;
  font-size:11px;
}

.meta{
  color:#64748b;
  font-size:12px;
  margin-bottom:12px;
}

.view{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.loading,
.empty{
  background:#fff;
  padding:45px 20px;
  border-radius:14px;
  text-align:center;
  color:#64748b;
}

.error{
  color:#b91c1c;
}

.count{
  color:#64748b;
  font-size:13px;
  margin-bottom:14px;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>Find Freelancers</h1>

    <p>
      Discover skilled professionals and
      creative talent.
    </p>

  </section>


  <div class="search-box">

    <input
      id="search"
      type="search"
      placeholder="Search freelancers, skills or services..."
      autocomplete="off"
    >

  </div>


  <div class="filters">

    <button
      class="active"
      data-filter="all"
    >
      All
    </button>

    <button data-filter="design">
      Design
    </button>

    <button data-filter="development">
      Development
    </button>

    <button data-filter="writing">
      Writing
    </button>

    <button data-filter="marketing">
      Marketing
    </button>

    <button data-filter="education">
      Education
    </button>

  </div>


  <div
    id="count"
    class="count"
  ></div>


  <div
    id="grid"
    class="grid"
  >

    <div class="loading">
      Loading freelancers...
    </div>

  </div>

</main>


<script>

/*
==================================================
FREELANCE.HTML

PUBLIC PAGE

DATA:
  GET /api/data?collection=freelancers

NO ADMIN
NO ADMIN SDK IN BROWSER
NO DIRECT FIRESTORE

Optional profile page:
  freelancer-profile.html?id=DOCUMENT_ID
==================================================
*/


const API =
  "/api/data?collection=freelancers&limit=100";


const grid =
  document.getElementById(
    "grid"
  );

const search =
  document.getElementById(
    "search"
  );

const count =
  document.getElementById(
    "count"
  );

const filterButtons =
  document.querySelectorAll(
    ".filters button"
  );


let freelancers = [];

let activeFilter = "all";


/* =========================
   LOAD DATA
========================= */

async function loadFreelancers(){

  grid.innerHTML = `

    <div class="loading">
      Loading freelancers...
    </div>

  `;


  try{

    const response =
      await fetch(API);


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load freelancers"
      );

    }


    freelancers =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    render();


  }catch(error){

    console.error(
      "FREELANCE ERROR:",
      error
    );


    grid.innerHTML = `

      <div class="empty error">

        Unable to load freelancers.

        <br><br>

        <small>
          ${escapeHTML(
            error.message
          )}
        </small>

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const results =
    freelancers.filter(
      freelancer => {

        const text = [

          freelancer.name,

          freelancer.displayName,

          freelancer.username,

          freelancer.title,

          freelancer.bio,

          freelancer.description,

          freelancer.skills,

          freelancer.category,

          freelancer.service

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        const matchesSearch =
          !keyword ||
          text.includes(keyword);


        if(
          activeFilter === "all"
        ){

          return matchesSearch;

        }


        const filterText =
          text;


        const matchesFilter =
          filterText.includes(
            activeFilter
          );


        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );


  count.textContent =
    results.length +
    (
      results.length === 1
      ? " freelancer found"
      : " freelancers found"
    );


  if(!results.length){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No freelancers found
        </h3>

        <p>
          Try another search or category.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    results
      .map(
        createCard
      )
      .join("");

}


/* =========================
   CARD
========================= */

function createCard(
  freelancer
){

  const id =
    freelancer.id ||
    freelancer.documentId ||
    freelancer.userId ||
    freelancer.uid ||
    "";


  const name =
    freelancer.name ||
    freelancer.displayName ||
    freelancer.username ||
    "Freelancer";


  const username =
    freelancer.username
      ? "@" +
        String(
          freelancer.username
        ).replace(/^@/,"")
      : "";


  const title =
    freelancer.title ||
    freelancer.service ||
    freelancer.category ||
    "Professional Freelancer";


  const description =
    freelancer.description ||
    freelancer.bio ||
    "Available for freelance work.";


  const photo =
    safeImage(
      freelancer.photoURL ||
      freelancer.photo ||
      freelancer.avatar
    );


  const skills =
    getSkills(
      freelancer.skills
    );


  const location =
    freelancer.location ||
    freelancer.country ||
    "";


  const initial =
    String(name)
      .trim()
      .charAt(0)
      .toUpperCase() ||
    "F";


  return `

    <article class="freelancer">

      <div class="top">

        <div class="avatar">

          ${
            photo
            ? `

              <img
                src="${photo}"
                alt="${escapeAttr(name)}"
                loading="lazy"
              >

            `
            : escapeHTML(initial)
          }

        </div>


        <div>

          <div class="name">
            ${escapeHTML(name)}
          </div>

          ${
            username
            ? `
              <div class="username">
                ${escapeHTML(username)}
              </div>
            `
            : ""
          }

        </div>

      </div>


      <div class="title">

        ${escapeHTML(title)}

      </div>


      <div class="description">

        ${escapeHTML(
          String(description)
            .slice(0,140)
        )}

        ${
          String(description).length > 140
          ? "..."
          : ""
        }

      </div>


      ${
        skills.length
        ? `

          <div class="tags">

            ${
              skills
                .slice(0,5)
                .map(
                  skill =>
                    `<span class="tag">
                      ${escapeHTML(skill)}
                    </span>`
                )
                .join("")
            }

          </div>

        `
        : ""
      }


      ${
        location
        ? `

          <div class="meta">

            📍 ${escapeHTML(location)}

          </div>

        `
        : ""
      }


      <button
        class="view"
        data-id="${escapeAttr(id)}"
      >

        View Profile

      </button>

    </article>

  `;

}


/* =========================
   SKILLS
========================= */

function getSkills(
  skills
){

  if(
    Array.isArray(skills)
  ){

    return skills
      .filter(Boolean)
      .map(
        String
      );

  }


  if(
    typeof skills === "string"
  ){

    return skills
      .split(",")
      .map(
        item =>
          item.trim()
      )
      .filter(Boolean);

  }


  return [];

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  render
);


/* =========================
   FILTER
========================= */

filterButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        filterButtons.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        activeFilter =
          button.dataset.filter ||
          "all";


        render();

      }
    );

  }
);


/* =========================
   PROFILE
========================= */

grid.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".view"
      );


    if(!button) return;


    const id =
      button.dataset.id;


    if(!id){

      return;

    }


    location.href =
      "freelancer-profile.html?id=" +
      encodeURIComponent(id);

  }
);


/* =========================
   SECURITY
========================= */

function safeImage(url){

  if(!url) return "";


  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );


    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(error){}


  return "";

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}


/* =========================
   START
========================= */

loadFreelancers();

</script>

</body>
</html>
