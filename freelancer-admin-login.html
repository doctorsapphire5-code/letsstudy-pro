<body>

  <main class="login-card">

    <div class="logo">V</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Sign in to your Vorix Freelancer administrator account.
    </p>

    <div id="message" class="message" role="status"></div>

    <form id="loginForm">

      <label for="adminId">Admin ID</label>
      <input type="text" id="adminId" placeholder="Enter your Admin ID" autocomplete="username" required="">

      <label for="password">Password</label>

      <div class="password-wrap">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required="">

        <button type="button" class="toggle-password" id="togglePassword">Show</button>
      </div>

      <a href="freelancer-admin-forgot-password.html" class="forgot">Forgot password?</a>

      <button type="submit" class="login-btn" id="loginBtn">
        Sign In
      </button>

    </form>

    <div class="bottom-links">
      Don't have an administrator account?
      <br>
      <a href="freelancer-admin-register.html">Create Admin Account</a>
    </div>

    <div class="footer">
      © 2026 Vorix Freelancer. All rights reserved.
    </div>

  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCHBwq_TIgMjld8Tn13iHby6eUkNrx8cFQ",
      authDomain: "vorix-freelancer.firebaseapp.com",
      projectId: "vorix-freelancer",
      storageBucket: "vorix-freelancer.firebasestorage.app",
      messagingSenderId: "478181968438",
      appId: "1:478181968438:web:f605e7cd4a735e77d8e697",
      measurementId: "G-S5230Q7K18"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    const loginForm = document.getElementById("loginForm");
    const adminIdInput = document.getElementById("adminId");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const messageBox = document.getElementById("message");

    // Show / Hide password
    document.getElementById("togglePassword")
      .addEventListener("click", function() {
        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword ? "text" : "password";

        this.textContent =
          isPassword ? "Hide" : "Show";
      });

    function showMessage(message, type = "error") {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtn.textContent = loading
        ? "Signing in..."
        : "Sign In";
    }

    function getDeviceInfo() {
      return navigator.userAgent || "Unknown device";
    }

    async function logoutCurrentUser() {
      try {
        await auth.signOut();
      } catch (error) {
        console.error(error);
      }

      sessionStorage.removeItem("adminId");
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const adminId = adminIdInput.value.trim();
      const password = passwordInput.value;

      if (!adminId || !password) {
        showMessage("Please enter your Admin ID and password.");
        return;
      }

      setLoading(true);
      messageBox.className = "message";

      try {
        /*
          Admin records are retrieved using Admin ID
          as the Firestore document ID.
        */

        const adminRef = db.collection("admins").doc(adminId);
        const adminSnap = await adminRef.get();

        if (!adminSnap.exists) {
          throw new Error("INVALID_ADMIN");
        }

        const admin = adminSnap.data();

        // Validate administrator identity and status
        if (
          admin.adminId !== adminId ||
          admin.role !== "admin" ||
          admin.status !== "active" ||
          !admin.email
        ) {
          throw new Error("ADMIN_NOT_AUTHORIZED");
        }

        // Sign in using Firebase Authentication
        const credential = await auth.signInWithEmailAndPassword(
          admin.email,
          password
        );

        const user = credential.user;

        // Verify actual Firebase Auth email verification
        if (!user.emailVerified) {
          await logoutCurrentUser();

          throw new Error("EMAIL_NOT_VERIFIED");
        }

        // Verify Firebase Auth identity against Firestore
        if (
          user.email.toLowerCase() !==
          admin.email.toLowerCase()
        ) {
          await logoutCurrentUser();

          throw new Error("ACCOUNT_MISMATCH");
        }

        if (admin.uid && admin.uid !== user.uid) {
          await logoutCurrentUser();

          throw new Error("UID_MISMATCH");
        }

        // Save Admin ID for subsequent admin pages
        sessionStorage.setItem("adminId", adminId);

        // Update admin login history
        await adminRef.update({
          uid: user.uid,
          emailVerified: true,
          lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastLoginDevice: getDeviceInfo(),
          loginCount: firebase.firestore.FieldValue.increment(1),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showMessage(
          "Login successful. Redirecting to dashboard...",
          "success"
        );

        window.location.href = "freelancer-admin-dashboard.html";

      } catch (error) {
        console.error("Admin login error:", error);

        if (error.message === "INVALID_ADMIN") {
          showMessage("Invalid Admin ID or password.");
        } else if (error.message === "ADMIN_NOT_AUTHORIZED") {
          showMessage("Your administrator account is inactive or not authorized.");
        } else if (error.message === "EMAIL_NOT_VERIFIED") {
          showMessage("Please verify your email address before signing in.");
        } else if (
          error.message === "ACCOUNT_MISMATCH" ||
          error.message === "UID_MISMATCH"
        ) {
          showMessage("Your administrator account could not be verified. Contact support.");
        } else if (error.code === "auth/wrong-password" ||
                   error.code === "auth/invalid-credential" ||
                   error.code === "auth/user-not-found") {
          showMessage("Invalid Admin ID or password.");
        } else if (error.code === "auth/too-many-requests") {
          showMessage("Too many login attempts. Please try again later.");
        } else if (error.code === "auth/network-request-failed") {
          showMessage("Network error. Check your internet connection.");
        } else {
          showMessage("Login failed. Please try again.");
        }

        // Do not leave a partially authenticated session
        if (auth.currentUser) {
          await logoutCurrentUser();
        }

      } finally {
        setLoading(false);
      }
    });

    // Clear stale Admin ID when opening login page
    sessionStorage.removeItem("adminId");
  </script>
