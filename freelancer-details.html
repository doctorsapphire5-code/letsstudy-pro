<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Freelancer Details | LetsStudy Pro</title>

<meta
  name="description"
  content="View freelancer profile, skills and services on LetsStudy Pro."
>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:900px;
  margin:30px auto;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:25px;
  box-shadow:0 5px 25px #0000000a;
}

.profile{
  display:flex;
  align-items:center;
  gap:18px;
  padding-bottom:22px;
  border-bottom:1px solid #e5e7eb;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:800;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  font-size:26px;
  font-weight:800;
}

.username{
  color:#64748b;
  margin-top:5px;
}

.location{
  color:#64748b;
  font-size:13px;
  margin-top:8px;
}

.section{
  padding-top:22px;
}

.section h2{
  font-size:19px;
  margin-bottom:10px;
}

.description{
  color:#475569;
  line-height:1.7;
}

.tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.tag{
  background:#eff6ff;
  color:#2563eb;
  padding:7px 10px;
  border-radius:7px;
  font-size:13px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:22px;
}

.btn{
  border:0;
  padding:11px 17px;
  border-radius:9px;
  cursor:pointer;
  font-weight:600;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2f7;
  color:#172033;
}

.price{
  font-size:21px;
  font-weight:800;
  color:#2563eb;
}

.loading,
.empty{
  text-align:center;
  padding:55px 20px;
  color:#64748b;
}

.error{
  color:#b91c1c;
}

@media(max-width:600px){

  .profile{
    align-items:flex-start;
  }

  .avatar{
    width:70px;
    height:70px;
    font-size:25px;
  }

  .name{
    font-size:21px;
  }

  .card{
    padding:18px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <div
    id="content"
    class="card"
  >

    <div class="loading">
      Loading freelancer...
    </div>

  </div>

</main>


<script>

/*
==================================================
FREELANCE-DETAILS.HTML

PUBLIC PAGE

DATA:
GET /api/data?collection=freelancers&id=DOCUMENT_ID

URL:
freelance-details.html?id=DOCUMENT_ID

NO ADMIN
NO DIRECT FIRESTORE
NO FIREBASE ADMIN IN BROWSER
==================================================
*/


const content =
  document.getElementById(
    "content"
  );


const params =
  new URLSearchParams(
    location.search
  );


const id =
  params.get("id") ||
  params.get("documentId") ||
  params.get("freelancerId");


/* =========================
   VALIDATE ID
========================= */

if(!id){

  content.innerHTML = `

    <div class="empty error">

      <h2>
        Freelancer not found
      </h2>

      <p>
        No freelancer ID was provided.
      </p>

    </div>

  `;

}else{

  loadFreelancer();

}


/* =========================
   LOAD
========================= */

async function loadFreelancer(){

  try{

    const url =
      "/api/data?collection=freelancers&id=" +
      encodeURIComponent(id);


    const response =
      await fetch(url);


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load freelancer"
      );

    }


    if(
      !result.data
    ){

      throw new Error(
        "Freelancer not found"
      );

    }


    render(
      result.data
    );


  }catch(error){

    console.error(
      "FREELANCER DETAILS ERROR:",
      error
    );


    content.innerHTML = `

      <div class="empty error">

        <h2>
          Unable to load freelancer
        </h2>

        <p>
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function render(
  freelancer
){

  const name =
    freelancer.name ||
    freelancer.displayName ||
    freelancer.username ||
    "Freelancer";


  const username =
    freelancer.username
      ? "@" +
        String(
          freelancer.username
        ).replace(/^@/,"")
      : "";


  const title =
    freelancer.title ||
    freelancer.service ||
    freelancer.category ||
    "Professional Freelancer";


  const description =
    freelancer.description ||
    freelancer.bio ||
    "No description available.";


  const location =
    freelancer.location ||
    freelancer.country ||
    "";


  const photo =
    safeImage(
      freelancer.photoURL ||
      freelancer.photo ||
      freelancer.avatar
    );


  const skills =
    getSkills(
      freelancer.skills
    );


  const price =
    freelancer.price ||
    freelancer.rate ||
    freelancer.hourlyRate ||
    "";


  const contact =
    freelancer.email ||
    freelancer.contact ||
    freelancer.phone ||
    "";


  const initial =
    String(name)
      .trim()
      .charAt(0)
      .toUpperCase() ||
    "F";


  content.innerHTML = `

    <section class="profile">

      <div class="avatar">

        ${
          photo
          ? `

            <img
              src="${photo}"
              alt="${escapeAttr(name)}"
            >

          `
          : escapeHTML(initial)
        }

      </div>


      <div>

        <div class="name">

          ${escapeHTML(name)}

        </div>


        ${
          username
          ? `

            <div class="username">

              ${escapeHTML(username)}

            </div>

          `
          : ""
        }


        ${
          location
          ? `

            <div class="location">

              📍 ${escapeHTML(location)}

            </div>

          `
          : ""
        }

      </div>

    </section>


    <section class="section">

      <h2>
        ${escapeHTML(title)}
      </h2>

      <p class="description">

        ${escapeHTML(description)}

      </p>

    </section>


    ${
      skills.length
      ? `

        <section class="section">

          <h2>
            Skills
          </h2>

          <div class="tags">

            ${
              skills
                .map(
                  skill =>
                    `<span class="tag">
                      ${escapeHTML(skill)}
                    </span>`
                )
                .join("")
            }

          </div>

        </section>

      `
      : ""
    }


    ${
      price
      ? `

        <section class="section">

          <h2>
            Rate
          </h2>

          <div class="price">

            ${escapeHTML(price)}

          </div>

        </section>

      `
      : ""
    }


    <div class="actions">

      <button
        class="btn secondary"
        onclick="history.back()"
      >
        Back to Freelancers
      </button>


      ${
        contact
        ? `

          <button
            class="btn primary"
            id="contactBtn"
          >
            Contact
          </button>

        `
        : ""
      }

    </div>

  `;


  if(contact){

    document
      .getElementById(
        "contactBtn"
      )
      .addEventListener(
        "click",
        () => {

          if(
            String(contact)
              .includes("@")
          ){

            location.href =
              "mailto:" +
              contact;

          }else{

            location.href =
              "tel:" +
              contact;

          }

        }
      );

  }

}


/* =========================
   SKILLS
========================= */

function getSkills(
  skills
){

  if(
    Array.isArray(skills)
  ){

    return skills
      .filter(Boolean)
      .map(String);

  }


  if(
    typeof skills === "string"
  ){

    return skills
      .split(",")
      .map(
        item =>
          item.trim()
      )
      .filter(Boolean);

  }


  return [];

}


/* =========================
   IMAGE
========================= */

function safeImage(url){

  if(!url) return "";


  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );


    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(error){}


  return "";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}

</script>

</body>
</html>
