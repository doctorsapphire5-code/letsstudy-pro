<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freelancer | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:#07111f;
color:#fff;
padding:15px 5%;
position:sticky;
top:0;
z-index:20;
}

.nav{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
gap:20px;
}

.logo{
font-size:22px;
font-weight:900;
color:#fff;
text-decoration:none;
}

.logo span{color:#22d3ee}

.search{flex:1}

.search input{
width:100%;
padding:12px 18px;
border:0;
border-radius:30px;
outline:0;
}

.nav a{
color:#fff;
text-decoration:none;
}

.wrap{
max-width:1200px;
margin:auto;
padding:0 5%;
}

.cover{
height:300px;
background:#0f172a;
background-size:cover;
background-position:center;
position:relative;
}

.cover:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(transparent,#07111fcc);
}

.profile{
margin-top:-90px;
position:relative;
z-index:2;
display:grid;
grid-template-columns:1fr 350px;
gap:25px;
}

.card{
background:#fff;
border-radius:18px;
border:1px solid #e5e7eb;
box-shadow:0 15px 40px #0000000b;
}

.main{
padding:30px;
}

.avatar{
width:125px;
height:125px;
border-radius:50%;
object-fit:cover;
border:6px solid #fff;
box-shadow:0 8px 25px #0002;
margin-top:-85px;
position:relative;
z-index:3;
background:#e2e8f0;
}

.name{
font-size:30px;
font-weight:900;
margin:15px 0 5px;
}

.headline{
font-size:17px;
color:#64748b;
}

.verified{
display:inline-flex;
align-items:center;
gap:6px;
background:#ecfeff;
color:#0891b2;
padding:7px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin-top:12px;
}

.featured{
display:inline-flex;
background:#fff7ed;
color:#ea580c;
padding:7px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin:8px 5px 0 0;
}

.bio{
color:#475569;
line-height:1.8;
margin-top:25px;
white-space:pre-line;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-top:25px;
}

.stat{
background:#f8fafc;
padding:18px;
border-radius:12px;
text-align:center;
}

.stat strong{
display:block;
font-size:21px;
}

.stat span{
font-size:12px;
color:#64748b;
}

.side{
padding:25px;
height:max-content;
}

.rate{
font-size:28px;
font-weight:900;
}

.currency{
color:#64748b;
font-size:14px;
}

.rating{
color:#f59e0b;
margin:12px 0;
}

.info{
display:flex;
gap:12px;
padding:13px 0;
border-bottom:1px solid #eee;
color:#475569;
}

.info i{
width:20px;
color:#2563eb;
}

.btn{
display:block;
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#172033;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:18px;
text-align:center;
text-decoration:none;
}

.btn:hover{
background:#2563eb;
}

.section{
margin-top:25px;
padding:25px;
}

.section h2{
margin-top:0;
}

.tags{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.tag{
background:#eff6ff;
color:#2563eb;
padding:8px 12px;
border-radius:20px;
font-size:13px;
}

.skills{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.skill{
background:#f1f5f9;
padding:10px 14px;
border-radius:9px;
font-size:14px;
}

.categories{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.category{
padding:9px 13px;
border:1px solid #e2e8f0;
border-radius:20px;
font-size:13px;
}

.loading{
text-align:center;
padding:100px 20px;
}

.error{
text-align:center;
padding:100px 20px;
}

footer{
margin-top:60px;
background:#07111f;
color:#94a3b8;
padding:40px 5%;
}

@media(max-width:850px){

.profile{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

.cover{
height:220px;
}

.name{
font-size:24px;
}

.main,
.side,
.section{
padding:20px;
}

.nav a:not(.logo){
display:none;
}

}
</style>
</head>

<body>

<header>

<div class="nav">

<a class="logo" href="index.html">
LetsStudy <span>Pro</span>
</a>

<div class="search">
<input
id="search"
placeholder="Search freelancers...">
</div>

<a href="freelancers.html">
<i class="fa fa-users"></i>
</a>

</div>

</header>


<div id="loading" class="loading">

<i class="fa fa-spinner fa-spin fa-2x"></i>

<p>Loading freelancer...</p>

</div>


<div id="page" style="display:none">

<div
id="cover"
class="cover">
</div>


<main class="wrap">

<div class="profile">


<section>


<div class="card main">

<img
id="profileImage"
class="avatar"
alt="Freelancer">

<div id="badges"></div>

<h1 id="name" class="name"></h1>

<div id="headline" class="headline"></div>

<div id="bio" class="bio"></div>


<div class="stats">

<div class="stat">
<strong id="totalJobs">0</strong>
<span>Total Jobs</span>
</div>

<div class="stat">
<strong id="completedJobs">0</strong>
<span>Completed</span>
</div>

<div class="stat">
<strong id="activeJobs">0</strong>
<span>Active Jobs</span>
</div>

<div class="stat">
<strong id="portfolioCount">0</strong>
<span>Portfolio</span>
</div>

</div>

</div>


<div class="card section">

<h2>
<i class="fa fa-bolt"></i>
Skills
</h2>

<div id="skills" class="skills"></div>

</div>


<div class="card section">

<h2>
<i class="fa fa-layer-group"></i>
Categories
</h2>

<div id="categories" class="categories"></div>

</div>


<div class="card section">

<h2>
<i class="fa fa-language"></i>
Languages
</h2>

<div id="languages" class="skills"></div>

</div>

</section>


<aside class="card side">

<div class="rate">
<span id="hourlyRate">0</span>
<span id="currency" class="currency">TZS</span>
<span class="currency">/ hour</span>
</div>


<div class="rating">

<i class="fa fa-star"></i>

<strong id="rating">0.0</strong>

<span id="ratingCount">
(0 reviews)
</span>

</div>


<div class="info">

<i class="fa fa-location-dot"></i>

<span id="location">—</span>

</div>


<div class="info">

<i class="fa fa-chart-line"></i>

<span id="experience">—</span>

</div>


<div class="info">

<i class="fa fa-circle-check"></i>

<span id="availability">—</span>

</div>


<div class="info">

<i class="fa fa-clock"></i>

<span id="responseTime">—</span>

</div>


<div class="info">

<i class="fa fa-globe"></i>

<span id="timezone">—</span>

</div>


<a
id="orderBtn"
class="btn"
href="#">

<i class="fa fa-briefcase"></i>
Hire Freelancer
</a>

</aside>

</div>

</main>

</div>


<footer>

<div class="wrap">

<h2 style="color:white">
LetsStudy Pro
</h2>

<p>
Learn. Build. Grow.
</p>

<p>
Professional learning, careers and business ecosystem.
</p>

</div>

</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ================= GET ID ================= */

const freelancerId=
new URLSearchParams(
location.search
).get("id");


/* ================= HELPERS ================= */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function arr(value){

return Array.isArray(value)
?value
:[];

}


/* ================= LOAD ================= */

async function loadFreelancer(){

if(!freelancerId){

showError(
"Freelancer ID is missing."
);

return;

}


try{

/*
Firestore document ID
*/

const ref=
doc(
db,
"freelancers",
freelancerId
);


const snap=
await getDoc(ref);


if(!snap.exists()){

showError(
"Freelancer not found."
);

return;

}


const f=snap.data();


/* ================= BASIC ================= */

document.title=
`${f.name || "Freelancer"} | LetsStudy Pro`;


document.getElementById("name")
.textContent=
f.name || "Freelancer";


document.getElementById("headline")
.textContent=
f.headline || "";


document.getElementById("bio")
.textContent=
f.bio || "No biography available.";


/* ================= IMAGES ================= */

const profileImage=
f.profileImage ||
"https://via.placeholder.com/300?text=Freelancer";


document.getElementById("profileImage")
.src=profileImage;


const cover=
document.getElementById("cover");


if(f.coverImage){

cover.style.backgroundImage=
`url("${f.coverImage}")`;

}else{

cover.style.background=
"linear-gradient(135deg,#07111f,#164e63)";

}


/* ================= BADGES ================= */

let badges="";


if(f.verified===true){

badges+=`

<span class="verified">

<i class="fa fa-circle-check"></i>

Verified Freelancer

</span>

`;

}


if(f.featured===true){

badges+=`

<span class="featured">

<i class="fa fa-star"></i>

Featured Freelancer

</span>

`;

}


document.getElementById("badges")
.innerHTML=badges;


/* ================= STATS ================= */

document.getElementById("totalJobs")
.textContent=
Number(f.totalJobs||0);


document.getElementById("completedJobs")
.textContent=
Number(f.completedJobs||0);


document.getElementById("activeJobs")
.textContent=
Number(f.activeJobs||0);


document.getElementById("portfolioCount")
.textContent=
Number(f.portfolioCount||0);


/* ================= RATE ================= */

document.getElementById("hourlyRate")
.textContent=
Number(f.hourlyRate||0)
.toLocaleString();


document.getElementById("currency")
.textContent=
f.currency || "TZS";


/* ================= RATING ================= */

document.getElementById("rating")
.textContent=
Number(f.rating||0).toFixed(1);


document.getElementById("ratingCount")
.textContent=
`(${Number(f.ratingCount||0)} reviews)`;


/* ================= LOCATION ================= */

const locationParts=[
f.city,
f.region,
f.country
].filter(Boolean);


document.getElementById("location")
.textContent=
locationParts.join(", ") || "Not specified";


/* ================= OTHER INFO ================= */

document.getElementById("experience")
.textContent=
f.experienceLevel || "Not specified";


document.getElementById("availability")
.textContent=
f.availability || "Not specified";


document.getElementById("responseTime")
.textContent=
f.responseTime || "Not specified";


document.getElementById("timezone")
.textContent=
f.timezone || "Not specified";


/* ================= SKILLS ================= */

const skills=
arr(f.skills);


document.getElementById("skills")
.innerHTML=
skills.length

?

skills.map(skill=>`

<span class="skill">
${esc(skill)}
</span>

`).join("")

:

"<span>No skills listed.</span>";


/* ================= CATEGORIES ================= */

const categories=
arr(f.categories);


document.getElementById("categories")
.innerHTML=
categories.length

?

categories.map(cat=>`

<span class="category">
${esc(cat)}
</span>

`).join("")

:

"<span>No categories listed.</span>";


/* ================= LANGUAGES ================= */

const languages=
arr(f.languages);


document.getElementById("languages")
.innerHTML=
languages.length

?

languages.map(lang=>`

<span class="skill">
${esc(lang)}
</span>

`).join("")

:

"<span>No languages listed.</span>";


/* ================= ORDER ================= */

document.getElementById("orderBtn")
.href=
`freelancer-order.html?id=${encodeURIComponent(freelancerId)}`;


/* ================= SHOW ================= */

document.getElementById("loading")
.style.display="none";


document.getElementById("page")
.style.display="block";


}catch(error){

console.error(error);

showError(
error.message
);

}

}


/* ================= ERROR ================= */

function showError(message){

document.getElementById("loading")
.className="error";

document.getElementById("loading")
.innerHTML=`

<i class="fa fa-circle-exclamation fa-3x"></i>

<h2>
${esc(message)}
</h2>

<a
href="freelancers.html"
class="btn"
style="max-width:250px;margin:20px auto">

Browse Freelancers

</a>

`;

}


/* ================= SEARCH ================= */

document.getElementById("search")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

const q=
this.value.trim();

if(q){

location.href=
"freelancers.html?search="+
encodeURIComponent(q);

}

}

});


/* ================= START ================= */

loadFreelancer();

</script>

</body>
</html>
