<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphic Design Skills</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    :root {
      --primary: #ec4899;
      --primary-dark: #db2777;
      --secondary: #8b5cf6;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    header {
      padding: 70px 0;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          #4c1d95,
          #8b5cf6,
          #ec4899,
          #f97316
        );
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      margin-bottom: 18px;
      border-radius: 30px;
      background: rgba(255,255,255,.15);
      font-size: .85rem;
      font-weight: 700;
    }

    header h1 {
      margin: 0 0 15px;
      font-size: clamp(2.3rem, 6vw, 4rem);
    }

    header p {
      max-width: 750px;
      margin: 0;
      color: #fdf4ff;
      line-height: 1.7;
    }

    main {
      padding: 40px 0;
    }

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
      padding: 20px;
      margin-bottom: 25px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .filter-group label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: var(--muted);
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: #fff;
      font-size: .95rem;
    }

    .input-wrap input {
      padding-left: 40px;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(236,72,153,.1);
    }

    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .result-bar select {
      width: auto;
      min-width: 180px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .skill-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .skill-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(15,23,42,.12);
    }

    .skill-cover {
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 4rem;
    }

    .cover-fundamentals {
      background: linear-gradient(135deg,#7c3aed,#4c1d95);
    }

    .cover-uiux {
      background: linear-gradient(135deg,#ec4899,#be185d);
    }

    .cover-branding {
      background: linear-gradient(135deg,#f97316,#c2410c);
    }

    .cover-illustration {
      background: linear-gradient(135deg,#06b6d4,#0e7490);
    }

    .cover-photoshop {
      background: linear-gradient(135deg,#2563eb,#1e3a8a);
    }

    .cover-typography {
      background: linear-gradient(135deg,#475569,#0f172a);
    }

    .cover-motion {
      background: linear-gradient(135deg,#db2777,#831843);
    }

    .cover-designsystems {
      background: linear-gradient(135deg,#16a34a,#166534);
    }

    .skill-content {
      padding: 20px;
    }

    .skill-content h3 {
      margin: 10px 0;
      line-height: 1.35;
    }

    .skill-content p {
      color: var(--muted);
      line-height: 1.6;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #fdf2f8;
      color: #be185d;
      font-size: .78rem;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 700;
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--muted);
    }

    .empty i {
      margin-bottom: 15px;
      font-size: 3rem;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15,23,42,.72);
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      position: relative;
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      border-radius: 16px;
      background: #fff;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 16px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 30px;
      cursor: pointer;
    }

    .modal-box li {
      margin: 10px 0;
      color: var(--muted);
      line-height: 1.5;
    }

    footer {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 750px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .result-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .result-bar select {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">

    <div class="eyebrow">
      <i class="fa-solid fa-palette"></i>
      Career Skills
    </div>

    <h1>Graphic Design Skills</h1>

    <p>
      Develop creative design skills for branding, digital products,
      visual communication, illustration, typography, and modern
      graphic design workflows.
    </p>

  </div>
</header>


<main class="container">

  <section class="filters">

    <div class="filter-group">
      <label for="search">
        Search Skills
      </label>

      <div class="input-wrap">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="search"
          id="search"
          placeholder="Search graphic design skills..."
        >

      </div>
    </div>


    <div class="filter-group">

      <label for="level">
        Level
      </label>

      <select id="level">

        <option value="all">
          All Levels
        </option>

        <option value="Beginner">
          Beginner
        </option>

        <option value="Intermediate">
          Intermediate
        </option>

        <option value="Advanced">
          Advanced
        </option>

      </select>

    </div>


    <div class="filter-group">

      <label for="category">
        Category
      </label>

      <select id="category">

        <option value="all">
          All Categories
        </option>

        <option value="Graphic Design">
          Graphic Design
        </option>

        <option value="UI/UX Design">
          UI/UX Design
        </option>

        <option value="Branding">
          Branding
        </option>

        <option value="Illustration">
          Illustration
        </option>

        <option value="Photo Editing">
          Photo Editing
        </option>

        <option value="Typography">
          Typography
        </option>

        <option value="Motion Design">
          Motion Design
        </option>

        <option value="Design Systems">
          Design Systems
        </option>

      </select>

    </div>

  </section>


  <div class="result-bar">

    <strong id="resultCount">
      0 skills
    </strong>

    <select id="sort">

      <option value="popularity">
        Most Popular
      </option>

      <option value="az">
        A-Z
      </option>

      <option value="level">
        Level
      </option>

    </select>

  </div>


  <section
    class="skills-grid"
    id="skillsGrid"
  ></section>

</main>


<div
  class="modal"
  id="detailsModal"
>

  <div class="modal-box">

    <button
      type="button"
      class="close"
      id="closeModal"
      aria-label="Close"
    >
      &times;
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<footer>
  <p>
    © 2026 Graphic Design Skills Platform
  </p>
</footer>


<script>

  /* =========================================
     GRAPHIC DESIGN SKILLS
  ========================================= */

  const graphicDesignSkills = [

    {
      id: 1,
      title: "Graphic Design Fundamentals",
      category: "Graphic Design",
      level: "Beginner",
      duration: "4 weeks",
      popularity: 99,
      icon: "fa-solid fa-palette",
      cover: "fundamentals",
      description:
        "Learn the core principles of visual design, composition, color, balance, and creative communication.",
      skills: [
        "Design principles",
        "Composition",
        "Color theory",
        "Visual hierarchy",
        "Creative process"
      ]
    },


    {
      id: 2,
      title: "UI/UX Design",
      category: "UI/UX Design",
      level: "Intermediate",
      duration: "8 weeks",
      popularity: 100,
      icon: "fa-solid fa-mobile-screen-button",
      cover: "uiux",
      description:
        "Design intuitive digital interfaces and user experiences for websites and applications.",
      skills: [
        "Wireframing",
        "User research",
        "Prototyping",
        "Interface design",
        "Usability testing"
      ]
    },


    {
      id: 3,
      title: "Brand Identity Design",
      category: "Branding",
      level: "Intermediate",
      duration: "6 weeks",
      popularity: 96,
      icon: "fa-solid fa-copyright",
      cover: "branding",
      description:
        "Learn how to create memorable visual identities that communicate a brand's personality.",
      skills: [
        "Logo design",
        "Brand guidelines",
        "Color systems",
        "Visual identity",
        "Brand strategy"
      ]
    },


    {
      id: 4,
      title: "Digital Illustration",
      category: "Illustration",
      level: "Beginner",
      duration: "7 weeks",
      popularity: 93,
      icon: "fa-solid fa-pen-ruler",
      cover: "illustration",
      description:
        "Develop illustration techniques for creating original digital artwork and visual assets.",
      skills: [
        "Digital drawing",
        "Shape construction",
        "Character design",
        "Vector illustration",
        "Creative composition"
      ]
    },


    {
      id: 5,
      title: "Photo Editing",
      category: "Photo Editing",
      level: "Intermediate",
      duration: "5 weeks",
      popularity: 95,
      icon: "fa-solid fa-image",
      cover: "photoshop",
      description:
        "Learn professional image editing, retouching, compositing, and photo manipulation techniques.",
      skills: [
        "Image correction",
        "Retouching",
        "Photo manipulation",
        "Compositing",
        "Layer workflows"
      ]
    },


    {
      id: 6,
      title: "Typography",
      category: "Typography",
      level: "Intermediate",
      duration: "4 weeks",
      popularity: 88,
      icon: "fa-solid fa-font",
      cover: "typography",
      description:
        "Master typography choices and layouts that make visual communication clear and attractive.",
      skills: [
        "Font selection",
        "Type hierarchy",
        "Spacing",
        "Readability",
        "Typography layouts"
      ]
    },


    {
      id: 7,
      title: "Motion Design",
      category: "Motion Design",
      level: "Advanced",
      duration: "9 weeks",
      popularity: 91,
      icon: "fa-solid fa-film",
      cover: "motion",
      description:
        "Create engaging animated graphics and visual effects for digital media.",
      skills: [
        "Motion principles",
        "Animation",
        "Transitions",
        "Visual effects",
        "Motion storytelling"
      ]
    },


    {
      id: 8,
      title: "Design Systems",
      category: "Design Systems",
      level: "Advanced",
      duration: "7 weeks",
      popularity: 87,
      icon: "fa-solid fa-layer-group",
      cover: "designsystems",
      description:
        "Learn how to build reusable visual components and consistent design systems.",
      skills: [
        "Design tokens",
        "Component libraries",
        "Reusable patterns",
        "Consistency",
        "Design documentation"
      ]
    }

  ];


  /* =========================================
     DOM ELEMENTS
  ========================================= */

  const skillsGrid =
    document.getElementById("skillsGrid");

  const searchInput =
    document.getElementById("search");

  const levelSelect =
    document.getElementById("level");

  const categorySelect =
    document.getElementById("category");

  const sortSelect =
    document.getElementById("sort");

  const resultCount =
    document.getElementById("resultCount");

  const modal =
    document.getElementById("detailsModal");

  const modalContent =
    document.getElementById("modalContent");

  const closeModal =
    document.getElementById("closeModal");


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     RENDER SKILLS
  ========================================= */

  function renderSkills(list) {

    if (!list.length) {

      skillsGrid.innerHTML = `

        <div class="empty">

          <i class="fa-solid fa-palette"></i>

          <h2>
            No skills found
          </h2>

          <p>
            Try another search term or change your filters.
          </p>

        </div>

      `;

      resultCount.textContent =
        "0 skills";

      return;
    }


    skillsGrid.innerHTML =
      list.map(skill => `

        <article class="skill-card">

          <div
            class="skill-cover cover-${skill.cover}"
          >

            <i class="${skill.icon}"></i>

          </div>


          <div class="skill-content">

            <div class="meta">

              <span class="badge">
                ${escapeHTML(skill.level)}
              </span>

              <span class="badge">
                ${escapeHTML(skill.category)}
              </span>

            </div>


            <h3>
              ${escapeHTML(skill.title)}
            </h3>


            <p>
              ${escapeHTML(skill.description)}
            </p>


            <div class="meta">

              <span class="badge">

                <i class="fa-regular fa-clock"></i>

                ${escapeHTML(skill.duration)}

              </span>


              <span class="badge">

                <i class="fa-solid fa-fire"></i>

                ${skill.popularity}%

              </span>

            </div>


            <button
              type="button"
              class="btn btn-primary"
              onclick="showDetails(${skill.id})"
            >
              View Details
            </button>

          </div>

        </article>

      `).join("");


    resultCount.textContent =
      `${list.length} skill${list.length === 1 ? "" : "s"}`;

  }


  /* =========================================
     FILTER SKILLS
  ========================================= */

  function filterSkills() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    const level =
      levelSelect.value;

    const category =
      categorySelect.value;


    let filtered =
      graphicDesignSkills.filter(skill => {

        const searchableText = [

          skill.title,
          skill.category,
          skill.level,
          skill.description,
          skill.duration,
          ...skill.skills

        ]
          .join(" ")
          .toLowerCase();


        const matchesSearch =
          !search ||
          searchableText.includes(search);


        const matchesLevel =
          level === "all" ||
          skill.level === level;


        const matchesCategory =
          category === "all" ||
          skill.category === category;


        return (
          matchesSearch &&
          matchesLevel &&
          matchesCategory
        );

      });


    /* =====================================
       SORT
    ===================================== */

    if (sortSelect.value === "az") {

      filtered.sort(
        (a, b) =>
          a.title.localeCompare(b.title)
      );

    }

    else if (sortSelect.value === "level") {

      const levelOrder = {
        Beginner: 1,
        Intermediate: 2,
        Advanced: 3
      };

      filtered.sort(
        (a, b) =>
          levelOrder[a.level] -
          levelOrder[b.level]
      );

    }

    else {

      filtered.sort(
        (a, b) =>
          b.popularity -
          a.popularity
      );

    }


    renderSkills(filtered);

  }


  /* =========================================
     SHOW DETAILS
  ========================================= */

  function showDetails(id) {

    const skill =
      graphicDesignSkills.find(
        item => item.id === id
      );

    if (!skill) return;


    modalContent.innerHTML = `

      <div
        class="skill-cover cover-${skill.cover}"
        style="
          border-radius:12px;
          margin-bottom:20px;
        "
      >

        <i class="${skill.icon}"></i>

      </div>


      <span class="badge">
        ${escapeHTML(skill.category)}
      </span>


      <h2>
        ${escapeHTML(skill.title)}
      </h2>


      <p>
        ${escapeHTML(skill.description)}
      </p>


      <p>
        <strong>Level:</strong>
        ${escapeHTML(skill.level)}
      </p>


      <p>
        <strong>Duration:</strong>
        ${escapeHTML(skill.duration)}
      </p>


      <h3>
        Key Skills
      </h3>


      <ul>

        ${skill.skills.map(item => `

          <li>

            <i
              class="fa-solid fa-check"
              style="
                color:#16a34a;
                margin-right:7px;
              "
            ></i>

            ${escapeHTML(item)}

          </li>

        `).join("")}

      </ul>


      <button
        type="button"
        class="btn btn-primary"
        onclick="startLearning(${skill.id})"
      >
        Start Learning
      </button>

    `;


    modal.classList.add("active");

    document.body.style.overflow =
      "hidden";

  }


  /* =========================================
     START LEARNING
  ========================================= */

  /* =========================================
     START LEARNING
  ========================================= */

  function startLearning(id) {

    const skill =
      graphicDesignSkills.find(
        item => item.id === id
      );

    if (!skill) {
      return;
    }

    const title =
      escapeHTML(skill.title);

    modalContent.innerHTML = `

      <div
        class="skill-cover cover-${skill.cover}"
        style="
          border-radius:12px;
          margin-bottom:20px;
        "
      >
        <i class="${skill.icon}"></i>
      </div>

      <span class="badge">
        ${escapeHTML(skill.category)}
      </span>

      <h2>
        Start Learning: ${title}
      </h2>

      <p>
        You are about to begin learning
        <strong>${title}</strong>.
        Follow the topics below to build
        your graphic design skills step by step.
      </p>

      <h3>
        Learning Path
      </h3>

      <ol>

        ${skill.skills.map((item, index) => `

          <li>
            <strong>
              Step ${index + 1}:
            </strong>
            ${escapeHTML(item)}
          </li>

        `).join("")}

      </ol>

      <div
        style="
          margin-top:20px;
          padding:15px;
          border-radius:10px;
          background:#fdf2f8;
          color:#9d174d;
        "
      >
        <strong>
          Recommended Level:
        </strong>
        ${escapeHTML(skill.level)}
      </div>

      <button
        type="button"
        class="btn btn-primary"
        style="margin-top:20px;"
        onclick="closeDetails()"
      >
        Begin Course
      </button>

    `;

  }


  /* =========================================
     CLOSE MODAL
  ========================================= */

  function closeDetails() {

    modal.classList.remove("active");

    document.body.style.overflow = "";

  }


  closeModal.addEventListener(
    "click",
    closeDetails
  );


  modal.addEventListener(
    "click",
    function(event) {

      if (event.target === modal) {
        closeDetails();
      }

    }
  );


  /* =========================================
     ESC KEY
  ========================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {
        closeDetails();
      }

    }
  );


  /* =========================================
     EVENTS
  ========================================= */

  searchInput.addEventListener(
    "input",
    filterSkills
  );

  levelSelect.addEventListener(
    "change",
    filterSkills
  );

  categorySelect.addEventListener(
    "change",
    filterSkills
  );

  sortSelect.addEventListener(
    "change",
    filterSkills
  );


  /* =========================================
     KEYBOARD SEARCH
  ========================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "/" &&
        document.activeElement.tagName !== "INPUT" &&
        document.activeElement.tagName !== "SELECT"
      ) {

        event.preventDefault();

        searchInput.focus();

      }

    }
  );


  /* =========================================
     RESET FILTERS
  ========================================= */

  function resetFilters() {

    searchInput.value = "";
    levelSelect.value = "all";
    categorySelect.value = "all";
    sortSelect.value = "popularity";

    filterSkills();

  }


  /* =========================================
     INITIAL LOAD
  ========================================= */

  renderSkills(
    [...graphicDesignSkills].sort(
      (a, b) =>
        b.popularity -
        a.popularity
    )
  );

</script>

</body>
</html>
