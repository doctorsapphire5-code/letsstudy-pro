<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Group Categories | LetsStudy Pro</title>

<meta name="description"
content="Explore community group categories on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1050px;
  margin:30px auto;
}

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#64748b;
}

.search{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-bottom:22px;
  box-shadow:0 4px 20px #00000008;
}

.search input{
  width:100%;
  padding:13px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));
  gap:15px;
}

.category{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:20px;
  cursor:pointer;
  transition:.2s;
}

.category:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 22px #0000000c;
}

.icon{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eff6ff;
  color:#2563eb;
  border-radius:12px;
  font-size:22px;
  margin-bottom:14px;
}

.name{
  font-weight:800;
  font-size:17px;
}

.description{
  color:#64748b;
  font-size:13px;
  line-height:1.5;
  margin-top:7px;
}

.count{
  color:#64748b;
  font-size:12px;
  margin-top:10px;
}

.loading,
.empty{
  background:#fff;
  padding:50px 20px;
  text-align:center;
  border-radius:15px;
  color:#64748b;
}

.error{
  color:#b91c1c;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      Group Categories
    </h1>

    <p>
      Discover communities based on your interests.
    </p>

  </section>


  <div class="search">

    <input
      id="search"
      type="search"
      placeholder="Search group categories..."
      autocomplete="off"
    >

  </div>


  <div
    id="grid"
    class="grid"
  >

    <div class="loading">
      Loading categories...
    </div>

  </div>

</main>


<script>

/*
==================================================
GROUP-CATEGORIES-COMMUNITY.HTML

PUBLIC PAGE

SOURCE:
GET /api/data?collection=groups&limit=100

This page derives categories from public group
documents.

NO ADMIN
NO DIRECT FIRESTORE
==================================================
*/


const grid =
  document.getElementById(
    "grid"
  );

const search =
  document.getElementById(
    "search"
  );


let groups = [];

let categories = [];


/* =========================
   DEFAULT CATEGORIES
========================= */

const defaultCategories = [

  {
    name:"Study & Education",
    icon:"📚",
    description:
      "Learning, revision and academic communities."
  },

  {
    name:"Technology",
    icon:"💻",
    description:
      "Programming, technology and digital skills."
  },

  {
    name:"Business",
    icon:"💼",
    description:
      "Business, entrepreneurship and professional growth."
  },

  {
    name:"Career",
    icon:"🎯",
    description:
      "Career development, jobs and opportunities."
  },

  {
    name:"Science",
    icon:"🔬",
    description:
      "Science, research and innovation communities."
  },

  {
    name:"Creative",
    icon:"🎨",
    description:
      "Design, writing, media and creative work."
  },

  {
    name:"Marketing",
    icon:"📣",
    description:
      "Marketing, branding and digital growth."
  },

  {
    name:"Community",
    icon:"🌍",
    description:
      "General discussion and community groups."
  }

];


/* =========================
   LOAD GROUPS
========================= */

async function loadGroups(){

  try{

    const response =
      await fetch(
        "/api/data?collection=groups&limit=100"
      );


    const result =
      await response.json();


    if(
      response.ok &&
      Array.isArray(
        result.results
      )
    ){

      groups =
        result.results;

      buildCategories();

    }else{

      categories =
        defaultCategories;

      render();

    }

  }catch(error){

    console.error(
      "GROUP CATEGORIES:",
      error
    );

    categories =
      defaultCategories;

    render();

  }

}


/* =========================
   BUILD
========================= */

function buildCategories(){

  const map =
    new Map();


  defaultCategories.forEach(
    category => {

      map.set(
        category.name.toLowerCase(),
        {
          ...category,
          count:0
        }
      );

    }
  );


  groups.forEach(
    group => {

      const raw =
        group.category ||
        group.categoryName;


      if(!raw) return;


      const name =
        String(raw).trim();


      if(!name) return;


      const key =
        name.toLowerCase();


      if(
        map.has(key)
      ){

        map.get(key).count++;

      }else{

        map.set(
          key,
          {
            name,
            icon:"👥",
            description:
              "Community groups and discussions.",
            count:1
          }
        );

      }

    }
  );


  categories =
    Array.from(
      map.values()
    );


  render();

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const results =
    categories.filter(
      category => {

        const text =
          (
            category.name +
            " " +
            category.description
          )
          .toLowerCase();


        return !keyword ||
          text.includes(
            keyword
          );

      }
    );


  if(!results.length){

    grid.innerHTML = `

      <div class="empty">

        No categories found.

      </div>

    `;

    return;

  }


  grid.innerHTML =
    results
      .map(
        category => `

          <article
            class="category"
            data-category="${escapeAttr(
              category.name
            )}"
          >

            <div class="icon">

              ${escapeHTML(
                category.icon ||
                "👥"
              )}

            </div>


            <div class="name">

              ${escapeHTML(
                category.name
              )}

            </div>


            <div class="description">

              ${escapeHTML(
                category.description ||
                ""
              )}

            </div>


            ${
              category.count
              ? `

                <div class="count">

                  ${category.count}
                  ${
                    category.count === 1
                    ? " group"
                    : " groups"
                  }

                </div>

              `
              : ""
            }

          </article>

        `
      )
      .join("");

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  render
);


/* =========================
   CATEGORY CLICK
========================= */

grid.addEventListener(
  "click",
  event => {

    const card =
      event.target.closest(
        ".category"
      );


    if(!card) return;


    const category =
      card.dataset.category;


    if(!category) return;


    location.href =
      "community.html?category=" +
      encodeURIComponent(
        category
      );

  }
);


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}


/* =========================
   START
========================= */

loadGroups();

</script>

</body>
</html>
