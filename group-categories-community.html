<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Group Categories | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="Explore community group categories on Let'sStudy Pro."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
}

body{

  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);

  color:var(--text);

}


/* =========================
   HEADER
========================= */

.topbar{

  min-height:64px;

  position:sticky;
  top:0;

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  padding:
    0 20px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(12px);

  border-bottom:
    1px solid var(--border);

}

.brand{

  display:flex;

  align-items:center;

  gap:10px;

  font-weight:800;

}

.brand-icon{

  width:38px;
  height:38px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:11px;

  background:var(--primary);

  color:#fff;

}

.create-btn{

  border:0;

  padding:
    10px 14px;

  border-radius:10px;

  background:var(--primary);

  color:#fff;

  font-size:12px;

  font-weight:750;

  cursor:pointer;

}


/* =========================
   MAIN
========================= */

.container{

  width:100%;

  max-width:1100px;

  margin:auto;

  padding:
    28px 16px
    70px;

}

.hero{

  margin-bottom:22px;

}

.hero h1{

  font-size:30px;

  font-weight:850;

}

.hero p{

  max-width:680px;

  margin-top:7px;

  color:var(--muted);

  font-size:14px;

  line-height:1.6;

}


/* =========================
   SEARCH
========================= */

.search-box{

  margin-bottom:22px;

}

.search-box input{

  width:100%;

  height:46px;

  padding:
    0 14px;

  border:
    1px solid var(--border);

  border-radius:12px;

  outline:none;

  background:#fff;

  color:var(--text);

  font-family:inherit;

  font-size:13px;

}

.search-box input:focus{

  border-color:
    #64748b;

}


/* =========================
   GRID
========================= */

.grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:16px;

}


/* =========================
   CATEGORY CARD
========================= */

.category-card{

  padding:20px;

  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:16px;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}

.category-card:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 8px 25px
    rgba(15,23,42,.07);

}

.category-top{

  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  gap:12px;

}

.category-icon{

  width:52px;
  height:52px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;

  border-radius:14px;

  background:var(--soft);

  font-size:25px;

}

.status{

  padding:
    4px 8px;

  border-radius:7px;

  background:#f0fdf4;

  color:#166534;

  font-size:9px;

  font-weight:800;

  text-transform:
    uppercase;

}

.status.inactive{

  background:#fef2f2;

  color:#b91c1c;

}

.category-name{

  margin-top:15px;

  font-size:17px;

  font-weight:850;

}

.category-slug{

  margin-top:4px;

  color:var(--muted);

  font-size:10px;

}

.category-description{

  min-height:40px;

  margin-top:10px;

  color:var(--muted);

  font-size:12px;

  line-height:1.55;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;

}

.category-footer{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-top:17px;

  padding-top:14px;

  border-top:
    1px solid var(--border);

}

.group-count{

  color:var(--muted);

  font-size:11px;

  font-weight:700;

}

.view-btn{

  border:0;

  padding:
    8px 11px;

  border-radius:8px;

  background:var(--primary);

  color:#fff;

  font-size:10px;

  font-weight:750;

  cursor:pointer;

}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  padding:55px;

  color:var(--muted);

}

.spinner{

  width:32px;
  height:32px;

  margin:
    0 auto
    10px;

  border:
    3px solid var(--border);

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   EMPTY
========================= */

.empty{

  grid-column:
    1 / -1;

  text-align:center;

  padding:60px 20px;

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:16px;

  color:var(--muted);

}

.empty-icon{

  font-size:42px;

  margin-bottom:10px;

}

.empty h3{

  color:var(--text);

  font-size:17px;

  margin-bottom:5px;

}


/* =========================
   ERROR
========================= */

.error{

  display:none;

  padding:12px;

  margin-bottom:15px;

  border-radius:10px;

  background:#fef2f2;

  border:
    1px solid #fecaca;

  color:#b91c1c;

  font-size:12px;

}

.error.show{

  display:block;

}


/* =========================
   LOAD MORE
========================= */

.load-more{

  display:block;

  margin:
    22px auto 0;

  padding:
    10px 18px;

  border:0;

  border-radius:10px;

  background:var(--primary);

  color:#fff;

  font-size:12px;

  font-weight:750;

  cursor:pointer;

}

.load-more:disabled{

  opacity:.5;

}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .grid{

    grid-template-columns:
      repeat(2,1fr);

  }

}

@media(max-width:600px){

  .topbar{

    padding:
      0 12px;

  }

  .brand{

    font-size:13px;

  }

  .create-btn{

    padding:
      9px 11px;

  }

  .container{

    padding:
      22px 11px
      60px;

  }

  .hero h1{

    font-size:25px;

  }

  .grid{

    grid-template-columns:1fr;

  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      🗂️
    </div>

    <span>
      Let'sStudy Pro Community
    </span>

  </div>


  <button
    class="create-btn"
    type="button"
    onclick="createCategory()"
  >
    + Create Category
  </button>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


  <section class="hero">

    <h1>
      Group Categories
    </h1>

    <p>
      Explore categories created for
      Community Groups and discover
      communities based on your interests.
    </p>

  </section>


  <div
    id="errorBox"
    class="error"
  ></div>


  <!-- SEARCH -->

  <section class="search-box">

    <input
      id="searchInput"
      type="search"
      placeholder="Search group categories..."
      autocomplete="off"
    >

  </section>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <p>
      Loading categories...
    </p>

  </div>


  <!-- GRID -->

  <section
    id="categories"
    class="grid"
  ></section>


  <!-- EMPTY -->

  <section
    id="empty"
    class="empty"
    style="display:none"
  >

    <div class="empty-icon">
      🗂️
    </div>

    <h3>
      No categories found
    </h3>

    <p>
      Try searching for another category.
    </p>

  </section>


  <!-- LOAD MORE -->

  <button
    id="loadMore"
    class="load-more"
    type="button"
    style="display:none"
  >
    Load More
  </button>


</main>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();


/* =========================
   STATE
========================= */

let categories =
  [];

let lastDocument =
  null;

const PAGE_SIZE =
  18;


/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  const box =
    document.getElementById(
      "errorBox"
    );

  box.textContent =
    message;

  box.classList.add(
    "show"
  );

}


/* =========================
   LOAD CATEGORIES
========================= */

async function loadCategories(
  append = false
){

  const loading =
    document.getElementById(
      "loading"
    );


  try{

    if(!append){

      loading.style.display =
        "block";

    }


    let query =
      db
        .collection(
          "groupCategories"
        )
        .where(
          "status",
          "==",
          "active"
        )
        .orderBy(
          "name",
          "asc"
        )
        .limit(
          PAGE_SIZE
        );


    if(
      append &&
      lastDocument
    ){

      query =
        query.startAfter(
          lastDocument
        );

    }


    const snapshot =
      await query.get();


    loading.style.display =
      "none";


    if(
      snapshot.empty &&
      !append
    ){

      document.getElementById(
        "empty"
      ).style.display =
        "block";

      return;

    }


    if(
      !snapshot.empty
    ){

      lastDocument =
        snapshot.docs[
          snapshot.docs.length - 1
        ];

    }


    snapshot.forEach(
      doc => {

        categories.push({

          id:
            doc.id,

          ...doc.data()

        });

      }
    );


    renderCategories();


    if(
      snapshot.size <
      PAGE_SIZE
    ){

      document.getElementById(
        "loadMore"
      ).style.display =
        "none";

    }

    else{

      document.getElementById(
        "loadMore"
      ).style.display =
        "block";

    }

  }

  catch(error){

    console.error(
      "Category load error:",
      error
    );


    loading.style.display =
      "none";


    showError(
      "Unable to load group categories. Check your Firestore rules or index."
    );

  }

}


/* =========================
   RENDER CATEGORIES
========================= */

function renderCategories(){

  const container =
    document.getElementById(
      "categories"
    );


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  container.innerHTML =
    "";


  const filtered =
    categories.filter(
      category => {

        const name =
          String(
            category.name || ""
          ).toLowerCase();


        const slug =
          String(
            category.slug || ""
          ).toLowerCase();


        const description =
          String(
            category.description || ""
          ).toLowerCase();


        return (
          !search ||
          name.includes(search) ||
          slug.includes(search) ||
          description.includes(search)
        );

      }
    );


  if(!filtered.length){

    document.getElementById(
      "empty"
    ).style.display =
      "block";

    return;

  }


  document.getElementById(
    "empty"
  ).style.display =
    "none";


  filtered.forEach(
    category => {

      renderCategory(
        category
      );

    }
  );

}


/* =========================
   CATEGORY CARD
========================= */

function renderCategory(
  category
){

  const container =
    document.getElementById(
      "categories"
    );


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "category-card";


  const name =
    category.name ||
    "Community Category";


  const slug =
    category.slug ||
    "";


  const description =
    category.description ||
    "Explore groups in this community category.";


  const icon =
    category.icon ||
    "👥";


  const count =
    Number(
      category.groupCount || 0
    );


  const status =
    category.status ||
    "active";


  const statusClass =
    status === "active"
      ? ""
      : "inactive";


  card.innerHTML =
    `
      <div class="category-top">

        <div class="category-icon">

          ${escapeHTML(
            icon
          )}

        </div>


        <span
          class="status ${statusClass}"
        >

          ${escapeHTML(
            status
          )}

        </span>

      </div>


      <div class="category-name">

        ${escapeHTML(
          name
        )}

      </div>


      ${
        slug
          ? `
            <div class="category-slug">

              /${escapeHTML(
                slug
              )}

            </div>
          `
          : ""
      }


      <div class="category-description">

        ${escapeHTML(
          description
        )}

      </div>


      <div class="category-footer">

        <span class="group-count">

          👥
          ${count}
          ${
            count === 1
              ? "Group"
              : "Groups"
          }

        </span>


        <button
          class="view-btn"
          type="button"
        >
          View Groups
        </button>

      </div>
    `;


  card
    .querySelector(
      ".view-btn"
    )
    .addEventListener(
      "click",
      () => {

        openCategory(
          category
        );

      }
    );


  container.appendChild(
    card
  );

}


/* =========================
   OPEN CATEGORY
========================= */

function openCategory(
  category
){

  const categoryId =
    category.id;


  window.location.href =
    `groups-community.html?categoryId=${
      encodeURIComponent(
        categoryId
      )
    }`;

}


/* =========================
   CREATE CATEGORY
========================= */

function createCategory(){

  window.location.href =
    "create-community.html?type=category";

}


/* =========================
   SEARCH
========================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    () => {

      renderCategories();

    }
  );


/* =========================
   LOAD MORE
========================= */

document
  .getElementById(
    "loadMore"
  )
  .addEventListener(
    "click",
    async () => {

      const button =
        document.getElementById(
          "loadMore"
        );


      button.disabled =
        true;


      button.textContent =
        "Loading...";


      try{

        await loadCategories(
          true
        );

      }

      catch(error){

        console.error(
          "Load more error:",
          error
        );

      }


      button.disabled =
        false;


      button.textContent =
        "Load More";

    }
  );


/* =========================
   START
========================= */

loadCategories();


/* =========================
   GLOBAL ERROR
========================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled community error:",
      event.reason
    );

  }
);

</script>

</body>

</html>
