<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Community Groups | LetsStudy Pro</title>

<meta
  name="description"
  content="Discover and join community groups on LetsStudy Pro."
>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1100px;
  margin:30px auto;
}

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#64748b;
}

.tools{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 4px 20px #00000008;
}

.search{
  width:100%;
  padding:13px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  font-size:15px;
}

.categories{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px;
}

.categories button{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:8px 13px;
  border-radius:20px;
  cursor:pointer;
}

.categories button.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.count{
  color:#64748b;
  font-size:13px;
  margin-bottom:14px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(245px,1fr));
  gap:15px;
}

.group{
  background:#fff;
  border-radius:15px;
  padding:18px;
  border:1px solid #e5e7eb;
  box-shadow:0 4px 18px #00000008;
}

.group-top{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:14px;
}

.group-image{
  width:55px;
  height:55px;
  border-radius:12px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:23px;
  color:#2563eb;
  flex-shrink:0;
}

.group-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.group-name{
  font-weight:800;
  font-size:17px;
}

.category{
  color:#2563eb;
  font-size:12px;
  margin-top:4px;
}

.description{
  color:#64748b;
  font-size:13px;
  line-height:1.5;
  min-height:40px;
}

.meta{
  display:flex;
  justify-content:space-between;
  margin:14px 0;
  color:#64748b;
  font-size:12px;
}

.view{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.loading,
.empty{
  background:#fff;
  padding:50px 20px;
  text-align:center;
  border-radius:15px;
  color:#64748b;
}

.error{
  color:#b91c1c;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      Community Groups
    </h1>

    <p>
      Find communities, share ideas and connect with others.
    </p>

  </section>


  <div class="tools">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search groups..."
      autocomplete="off"
    >


    <div
      id="categories"
      class="categories"
    >

      <button
        class="active"
        data-category="all"
      >
        All
      </button>

    </div>

  </div>


  <div
    id="count"
    class="count"
  ></div>


  <div
    id="grid"
    class="grid"
  >

    <div class="loading">
      Loading groups...
    </div>

  </div>

</main>


<script>

/*
==================================================
GROUP-COMMUNITY.HTML

PUBLIC COMMUNITY PAGE

DATA:
GET /api/data?collection=groups&limit=100

GROUP DETAILS:
group-details-community.html?id=DOCUMENT_ID

NO ADMIN
NO DIRECT FIRESTORE
==================================================
*/


const grid =
  document.getElementById(
    "grid"
  );

const search =
  document.getElementById(
    "search"
  );

const categoriesBox =
  document.getElementById(
    "categories"
  );

const count =
  document.getElementById(
    "count"
  );


let groups = [];

let activeCategory =
  "all";


/* =========================
   URL CATEGORY
========================= */

const params =
  new URLSearchParams(
    location.search
  );


const urlCategory =
  params.get(
    "category"
  );


if(urlCategory){

  activeCategory =
    urlCategory;

}


/* =========================
   LOAD
========================= */

async function loadGroups(){

  try{

    const response =
      await fetch(
        "/api/data?collection=groups&limit=100"
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load groups"
      );

    }


    groups =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    buildCategories();

    render();


  }catch(error){

    console.error(
      "GROUP COMMUNITY:",
      error
    );


    grid.innerHTML = `

      <div class="empty error">

        Unable to load community groups.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   CATEGORIES
========================= */

function buildCategories(){

  const map =
    new Map();


  groups.forEach(
    group => {

      const category =
        group.category ||
        group.categoryName;


      if(!category) return;


      const value =
        String(category)
          .trim();


      if(value){

        map.set(
          value.toLowerCase(),
          value
        );

      }

    }
  );


  const sorted =
    Array.from(
      map.values()
    ).sort(
      (a,b) =>
        a.localeCompare(b)
    );


  categoriesBox.innerHTML = `

    <button
      class="${
        activeCategory === "all"
        ? "active"
        : ""
      }"
      data-category="all"
    >
      All
    </button>

    ${
      sorted
        .map(
          category => `

            <button
              class="${
                activeCategory.toLowerCase() ===
                category.toLowerCase()
                ? "active"
                : ""
              }"
              data-category="${escapeAttr(
                category
              )}"
            >

              ${escapeHTML(
                category
              )}

            </button>

          `
        )
        .join("")
    }

  `;

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    groups.filter(
      group => {

        const name =
          group.name ||
          group.title ||
          group.groupName ||
          "";


        const description =
          group.description ||
          group.bio ||
          "";


        const category =
          group.category ||
          group.categoryName ||
          "";


        const text =
          (
            name +
            " " +
            description +
            " " +
            category +
            " " +
            (group.tags || "")
          ).toLowerCase();


        const matchesSearch =
          !keyword ||
          text.includes(
            keyword
          );


        const matchesCategory =
          activeCategory === "all" ||
          String(category)
            .toLowerCase() ===
          activeCategory
            .toLowerCase();


        return (
          matchesSearch &&
          matchesCategory
        );

      }
    );


  count.textContent =
    filtered.length +
    (
      filtered.length === 1
      ? " group"
      : " groups"
    );


  if(!filtered.length){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No groups found
        </h3>

        <p style="margin-top:7px;">
          Try another search or category.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered
      .map(
        createGroup
      )
      .join("");

}


/* =========================
   GROUP CARD
========================= */

function createGroup(
  group
){

  const id =
    group.id ||
    group.documentId ||
    group.groupId ||
    "";


  const name =
    group.name ||
    group.title ||
    group.groupName ||
    "Community Group";


  const category =
    group.category ||
    group.categoryName ||
    "Community";


  const description =
    group.description ||
    group.bio ||
    "Join this community and connect with members.";


  const image =
    safeImage(
      group.imageURL ||
      group.image ||
      group.coverURL ||
      group.photoURL
    );


  const members =
    group.memberCount ??
    group.membersCount ??
    (
      Array.isArray(
        group.members
      )
      ? group.members.length
      : null
    );


  return `

    <article class="group">

      <div class="group-top">

        <div class="group-image">

          ${
            image
            ? `

              <img
                src="${image}"
                alt="${escapeAttr(name)}"
                loading="lazy"
              >

            `
            : "👥"
          }

        </div>


        <div>

          <div class="group-name">

            ${escapeHTML(name)}

          </div>


          <div class="category">

            ${escapeHTML(category)}

          </div>

        </div>

      </div>


      <div class="description">

        ${escapeHTML(
          String(description)
            .slice(0,150)
        )}

        ${
          String(description).length > 150
          ? "..."
          : ""
        }

      </div>


      <div class="meta">

        <span>
          ${
            members !== null
            ? members + " members"
            : "Community"
          }
        </span>

        ${
          group.visibility
          ? escapeHTML(
              group.visibility
            )
          : ""
        }

      </div>


      <button
        class="view"
        data-id="${escapeAttr(id)}"
      >

        View Group

      </button>

    </article>

  `;

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  render
);


/* =========================
   CATEGORY CLICK
========================= */

categoriesBox.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button"
      );


    if(!button) return;


    activeCategory =
      button.dataset.category ||
      "all";


    categoriesBox
      .querySelectorAll(
        "button"
      )
      .forEach(
        item =>
          item.classList.remove(
            "active"
          )
      );


    button.classList.add(
      "active"
    );


    render();

  }
);


/* =========================
   GROUP DETAILS
========================= */

grid.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".view"
      );


    if(!button) return;


    const id =
      button.dataset.id;


    if(!id) return;


    location.href =
      "group-details-community.html?id=" +
      encodeURIComponent(id);

  }
);


/* =========================
   SECURITY
========================= */

function safeImage(url){

  if(!url) return "";


  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );


    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(error){}


  return "";

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}


/* =========================
   START
========================= */

loadGroups();

</script>

</body>
</html>
