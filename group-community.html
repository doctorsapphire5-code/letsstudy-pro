<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Group | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="View community group posts and discussions on Let'sStudy Pro."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
  --danger:#dc2626;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
}


/* =========================
   HEADER
========================= */

.topbar{

  height:64px;

  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);

}

.brand{

  display:flex;
  align-items:center;
  gap:10px;

  font-weight:800;

}

.brand-icon{

  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--primary);
  color:#fff;

}

.back-btn{

  border:0;

  padding:9px 13px;

  border-radius:10px;

  background:var(--soft);

  color:var(--text);

  font-weight:700;

  cursor:pointer;

}


/* =========================
   MAIN
========================= */

.container{

  width:100%;
  max-width:900px;

  margin:auto;

  padding:24px 15px 70px;

}


/* =========================
   GROUP HERO
========================= */

.group-header{

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:18px;

  padding:23px;

  margin-bottom:18px;

}

.group-top{

  display:flex;

  gap:15px;

  align-items:center;

}

.group-icon{

  width:62px;
  height:62px;

  border-radius:16px;

  background:var(--soft);

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:28px;

  flex-shrink:0;

}

.group-name{

  font-size:24px;

  font-weight:850;

}

.group-description{

  margin-top:6px;

  color:var(--muted);

  font-size:13px;

  line-height:1.55;

}

.group-meta{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:16px;

}

.badge{

  padding:6px 9px;

  border-radius:8px;

  background:var(--soft);

  color:var(--muted);

  font-size:11px;

  font-weight:700;

}


/* =========================
   TABS
========================= */

.tabs{

  display:flex;

  gap:8px;

  margin-bottom:15px;

}

.tab{

  border:0;

  padding:9px 14px;

  border-radius:9px;

  background:var(--soft);

  color:var(--muted);

  font-size:12px;

  font-weight:750;

  cursor:pointer;

}

.tab.active{

  background:var(--primary);

  color:#fff;

}


/* =========================
   POST
========================= */

.post{

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:17px;

  padding:18px;

  margin-bottom:13px;

}

.author{

  display:flex;

  align-items:center;

  gap:10px;

}

.author-avatar{

  width:43px;
  height:43px;

  border-radius:50%;

  overflow:hidden;

  background:var(--soft);

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:14px;

  font-weight:800;

  flex-shrink:0;

}

.author-avatar img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.author-name{

  font-size:13px;

  font-weight:800;

}

.post-time{

  margin-top:3px;

  color:var(--muted);

  font-size:10px;

}

.post-type{

  margin-left:auto;

  padding:5px 8px;

  border-radius:7px;

  background:var(--soft);

  color:var(--muted);

  font-size:10px;

  font-weight:700;

}

.post-text{

  margin-top:15px;

  color:#334155;

  font-size:14px;

  line-height:1.65;

  white-space:pre-wrap;

  overflow-wrap:anywhere;

}

.post-media{

  margin-top:14px;

  border-radius:12px;

  overflow:hidden;

  background:var(--soft);

}

.post-media img{

  width:100%;

  max-height:500px;

  display:block;

  object-fit:cover;

}

.post-actions{

  display:flex;

  align-items:center;

  gap:5px;

  margin-top:15px;

  padding-top:12px;

  border-top:
    1px solid var(--border);

}

.action{

  border:0;

  background:transparent;

  color:var(--muted);

  padding:7px 9px;

  border-radius:8px;

  font-size:11px;

  font-weight:700;

  cursor:pointer;

}

.action:hover{

  background:var(--soft);

  color:var(--text);

}


/* =========================
   EMPTY
========================= */

.empty{

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:17px;

  text-align:center;

  padding:55px 20px;

  color:var(--muted);

}

.empty-icon{

  font-size:38px;

  margin-bottom:10px;

}

.empty h3{

  color:var(--text);

  margin-bottom:5px;

}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  padding:50px 10px;

  color:var(--muted);

}

.spinner{

  width:34px;
  height:34px;

  margin:0 auto 12px;

  border:
    3px solid var(--border);

  border-top-color:var(--primary);

  border-radius:50%;

  animation:spin .7s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   ERROR
========================= */

.error{

  display:none;

  background:#fef2f2;

  color:#b91c1c;

  border:
    1px solid #fecaca;

  border-radius:12px;

  padding:13px;

  margin-bottom:15px;

  font-size:13px;

}

.error.show{

  display:block;

}


/* =========================
   LOAD MORE
========================= */

.load-more{

  display:block;

  margin:20px auto;

  border:0;

  border-radius:10px;

  padding:10px 18px;

  background:var(--primary);

  color:#fff;

  font-weight:750;

  cursor:pointer;

}

.load-more:disabled{

  opacity:.5;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{

    padding:0 12px;

  }

  .brand{

    font-size:13px;

  }

  .container{

    padding:
      18px 11px 60px;

  }

  .group-name{

    font-size:21px;

  }

  .group-header{

    padding:18px;

  }

  .post{

    padding:15px;

  }

  .post-type{

    display:none;

  }

}

</style>

</head>


<body>


<header class="topbar">

  <div class="brand">

    </div>

  </div>

     FIREBASE

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};

firebase.initializeApp(
  firebaseConfig
);

const db =
  firebase.firestore();


/* =========================
   STATE
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const groupId =
  params.get("id") ||
  params.get("groupId");


let lastDocument =
  null;

const PAGE_SIZE =
  20;


/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function getInitials(
  name
){

  return String(
    name ||
    "Member"
  )
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(
    word =>
      word
        .charAt(0)
        .toUpperCase()
  )
  .join("");

}


/* =========================
   TIME
========================= */

function formatTime(
  timestamp
){

  if(!timestamp){

    return "Recently";

  }

  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);


    return date.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

  }

  catch{

    return "Recently";

  }

}


/* =========================
   LOAD GROUP
========================= */

async function loadGroup(){

  if(!groupId){

    showError(
      "No group ID was provided."
    );

    document.getElementById(
      "loading"
    ).style.display =
      "none";

    return;

  }


  try{

    /*
     * Expected group document:
     *
     * groups/{groupId}
     */

    const snapshot =
      await db
        .collection("groups")
        .doc(groupId)
        .get();


    if(!snapshot.exists){

      showError(
        "This group could not be found."
      );

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      return;

    }


    const data =
      snapshot.data();


    document.getElementById(
      "groupName"
    ).textContent =
      data.name ||
      data.title ||
      "Community Group";


    document.getElementById(
      "groupDescription"
    ).textContent =
      data.description ||
      "Community discussion group.";


    document.getElementById(
      "aboutText"
    ).textContent =
      data.description ||
      "Community discussion group.";


    document.getElementById(
      "groupIcon"
    ).textContent =
      data.icon ||
      "👥";


    document.getElementById(
      "memberCount"
    ).textContent =
      `👥 ${Number(
        data.memberCount || 0
      )} Members`;


    document.getElementById(
      "postCount"
    ).textContent =
      `📝 ${Number(
        data.postCount || 0
      )} Posts`;

  }

  catch(error){

    console.error(
      "Load group error:",
      error
    );

    showError(
      "Unable to load this group."
    );

  }

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(
  append = false
){

  const loading =
    document.getElementById(
      "loading"
    );


  const posts =
    document.getElementById(
      "posts"
    );


  try{

    if(!append){

      loading.style.display =
        "block";

    }


    let query =
      db
        .collection("posts")
        .where(
          "groupId",
          "==",
          groupId
        )
        .where(
          "status",
          "==",
          "published"
        )
        .orderBy(
          "createdAt",
          "desc"
        )
        .limit(
          PAGE_SIZE
        );


    if(
      append &&
      lastDocument
    ){

      query =
        query.startAfter(
          lastDocument
        );

    }


    const snapshot =
      await query.get();


    loading.style.display =
      "none";


    if(
      snapshot.empty &&
      !append
    ){

      document.getElementById(
        "empty"
      ).style.display =
        "block";

      return;

    }


    if(
      !snapshot.empty
    ){

      lastDocument =
        snapshot.docs[
          snapshot.docs.length - 1
        ];

    }


    snapshot.forEach(
      doc => {

        renderPost(
          doc.id,
          doc.data()
        );

      }
    );


    if(
      snapshot.size <
      PAGE_SIZE
    ){

      document.getElementById(
        "loadMore"
      ).style.display =
        "none";

    }

    else{

      document.getElementById(
        "loadMore"
      ).style.display =
        "block";

    }

  }

  catch(error){

    console.error(
      "Load posts error:",
      error
    );


    loading.style.display =
      "none";


    /*
     * Firestore may require a composite
     * index for groupId + status +
     * createdAt.
     */

    showError(
      "Unable to load group posts. Check your Firestore query/index configuration."
    );

  }

}


/* =========================
   RENDER POST
========================= */

function renderPost(
  postId,
  data
){

  const posts =
    document.getElementById(
      "posts"
    );


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "post";


  const authorName =
    data.authorName ||
    "Community Member";


  const photo =
    data.authorPhoto ||
    "";


  const avatar =
    photo

      ? `
        <img
          src="${escapeHTML(photo)}"
          alt="${escapeHTML(authorName)}"
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      `

      : getInitials(
          authorName
        );


  const text =
    data.text ||
    "";


  let mediaHTML =
    "";


  if(
    data.media &&
    typeof data.media ===
      "string"
  ){

    mediaHTML =
      `
        <div class="post-media">

          <img
            src="${escapeHTML(data.media)}"
            alt="Post media"
            loading="lazy"
            referrerpolicy="no-referrer"
          >

        </div>
      `;

  }


  card.innerHTML =
    `
      <div class="author">

        <div class="author-avatar">
          ${avatar}
        </div>


        <div>

          <div class="author-name">
            ${escapeHTML(
              authorName
            )}
          </div>

          <div class="post-time">
            ${formatTime(
              data.createdAt
            )}
          </div>

        </div>


        <span class="post-type">
          ${escapeHTML(
            data.type ||
            "post"
          )}
        </span>

      </div>


      ${
        text
          ? `
            <div class="post-text">
              ${escapeHTML(text)}
            </div>
          `
          : ""
      }


      ${mediaHTML}


      <div class="post-actions">

        <button
          class="action"
          type="button"
          onclick="openPost('${encodeURIComponent(postId)}')"
        >
          ❤️ ${Number(
            data.likeCount || 0
          )}
        </button>


        <button
          class="action"
          type="button"
          onclick="openPost('${encodeURIComponent(postId)}')"
        >
          💬 ${Number(
            data.commentCount || 0
          )}
        </button>


        <button
          class="action"
          type="button"
          onclick="sharePost('${encodeURIComponent(postId)}')"
        >
          ↗️ ${Number(
            data.shareCount || 0
          )}
        </button>


        <button
          class="action"
          type="button"
          onclick="savePost('${encodeURIComponent(postId)}')"
        >
          🔖 ${Number(
            data.saveCount || 0
          )}
        </button>

      </div>
    `;


  posts.appendChild(
    card
  );

}


/* =========================
   OPEN POST
========================= */

function openPost(
  postId
){

  window.location.href =
    "/post-community.html?id=" +
    postId;

}


/* =========================
   SHARE
========================= */

async function sharePost(
  postId
){

  const url =
    window.location.origin +
    "/post-community.html?id=" +
    postId;


  try{

    if(
      navigator.share
    ){

      await navigator.share({

        title:
          "Let'sStudy Pro Community",

        url:url

      });

    }

    else{

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Post link copied."
      );

    }

  }

  catch(error){

    console.error(
      "Share error:",
      error
    );

  }

}


/* =========================
   SAVE
========================= */

async function savePost(
  postId
){

  try{

    const user =
      firebase.auth().currentUser;


    if(!user){

      alert(
        "Please login to save posts."
      );

      return;

    }


    await db
      .collection("posts")
      .doc(postId)
      .update({

        saveCount:
          firebase.firestore
            .FieldValue
            .increment(1),

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });

  }

  catch(error){

    console.error(
      "Save error:",
      error
    );

  }

}


/* =========================
   TABS
========================= */

function showPosts(){

  document.getElementById(
    "postsSection"
  ).style.display =
    "block";


  document.getElementById(
    "aboutSection"
  ).style.display =
    "none";

}


function showAbout(){

  document.getElementById(
    "postsSection"
  ).style.display =
    "none";


  document.getElementById(
    "aboutSection"
  ).style.display =
    "block";

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent =
    message;


  box.classList.add(
    "show"
  );

}


/* =========================
   LOAD MORE
========================= */

document
  .getElementById(
    "loadMore"
  )
  .addEventListener(
    "click",
    async () => {

      const button =
        document.getElementById(
          "loadMore"
        );


      button.disabled =
        true;

      button.textContent =
        "Loading...";


      await loadPosts(
        true
      );


      button.disabled =
        false;

            button.textContent =
        "Load More";

    }

  );


/* =========================
   AUTH STATE
========================= */

firebase.auth()
  .onAuthStateChanged(
    user => {

      if(user){

        console.log(
          "Community user:",
          user.uid
        );

      }

    }
  );


/* =========================
   AUTO REFRESH
========================= */

let refreshTimer =
  null;


function startAutoRefresh(){

  if(refreshTimer){

    clearInterval(
      refreshTimer
    );

  }


  refreshTimer =
    setInterval(
      async () => {

        if(
          document.visibilityState !==
          "visible"
        ){

          return;

        }


        try{

          const snapshot =
            await db
              .collection("posts")
              .where(
                "groupId",
                "==",
                groupId
              )
              .where(
                "status",
                "==",
                "published"
              )
              .orderBy(
                "createdAt",
                "desc"
              )
              .limit(1)
              .get();


          /*
           * Only refresh when there is
           * a newer post.
           */

          if(
            snapshot.empty
          ){

            return;

          }

        }

        catch(error){

          console.error(
            "Refresh error:",
            error
          );

        }

      },
      60000
    );

}


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState ===
      "visible"
    ){

      startAutoRefresh();

    }

    else{

      if(refreshTimer){

        clearInterval(
          refreshTimer
        );

        refreshTimer =
          null;

      }

    }

  }
);


/* =========================
   START AUTO REFRESH
========================= */

startAutoRefresh();


/* =========================
   KEYBOARD ACCESSIBILITY
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      showPosts();

    }

  }
);


/* =========================
   IMAGE ERROR HANDLING
========================= */

document.addEventListener(
  "error",
  event => {

    const target =
      event.target;


    if(
      target &&
      target.tagName ===
      "IMG"
    ){

      target.style.display =
        "none";

    }

  },
  true
);


/* =========================
   FINAL INITIALIZATION
========================= */

(async function(){

  try{

    await init();

  }

  catch(error){

    console.error(
      "Group initialization error:",
      error
    );


    const loading =
      document.getElementById(
        "loading"
      );


    if(loading){

      loading.style.display =
        "none";

    }


    showError(
      "Something went wrong while opening this community group."
    );

  }

})();

</script>

</body>

</html>
