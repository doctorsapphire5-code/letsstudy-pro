<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Group Members | LetsStudy Pro</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a
}

a{
text-decoration:none;
color:inherit
}

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:12px 17px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb
}

nav{
display:flex;
gap:7px;
flex-wrap:wrap
}

nav a{
font-size:9px;
font-weight:900;
background:#f1f5f9;
padding:8px 10px;
border-radius:8px
}

.container{
max-width:1050px;
margin:auto;
padding:20px 15px
}

.hero{
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:#fff;
border-radius:18px;
padding:24px;
margin-bottom:15px
}

.hero h1{
font-size:24px;
margin-bottom:7px
}

.hero p{
font-size:10px;
line-height:1.7;
opacity:.92
}

.group-meta{
margin-top:13px;
display:flex;
gap:7px;
flex-wrap:wrap
}

.badge{
display:inline-block;
padding:7px 10px;
background:rgba(255,255,255,.18);
border-radius:8px;
font-size:8px;
font-weight:900
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-bottom:15px
}

.btn{
padding:9px 11px;
border-radius:9px;
font-size:8px;
font-weight:900;
display:inline-block;
border:0;
cursor:pointer
}

.primary{
background:#2563eb;
color:#fff
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.white{
background:#fff;
color:#1d4ed8
}

.tools{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:13px;
margin-bottom:15px;
display:flex;
gap:8px;
flex-wrap:wrap
}

input{
flex:1;
min-width:190px;
border:1px solid #cbd5e1;
border-radius:9px;
padding:11px;
font-size:10px;
outline:none
}

input:focus{
border-color:#2563eb
}

select{
border:1px solid #cbd5e1;
border-radius:9px;
padding:10px;
font-size:9px;
background:#fff
}

.stats{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:15px
}

.stat{
background:#fff;
border:1px solid #e2e8f0;
border-radius:12px;
padding:12px 16px;
min-width:125px
}

.stat strong{
display:block;
font-size:17px
}

.stat span{
font-size:8px;
color:#64748b
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:15px
}

.member{
display:flex;
gap:10px;
align-items:center;
margin-bottom:12px
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
background:#dbeafe;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
overflow:hidden;
flex-shrink:0
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.name{
font-size:11px;
font-weight:900
}

.username{
font-size:8px;
color:#64748b;
margin-top:3px
}

.member-role{
display:inline-block;
margin-top:5px;
padding:4px 7px;
border-radius:6px;
font-size:7px;
font-weight:900;
background:#eff6ff;
color:#1d4ed8
}

.bio{
font-size:9px;
line-height:1.6;
color:#475569;
min-height:30px;
margin-bottom:12px
}

.card-actions{
display:flex;
gap:6px;
flex-wrap:wrap
}

.empty,
.loading{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:45px 20px;
text-align:center;
font-size:10px;
color:#64748b
}

.message{
display:none;
padding:11px;
border-radius:9px;
font-size:9px;
font-weight:900;
margin-bottom:12px
}

.message.show{
display:block
}

.error{
background:#fee2e2;
color:#991b1b
}

footer{
text-align:center;
padding:30px;
font-size:9px;
color:#64748b
}

@media(max-width:850px){

.grid{
grid-template-columns:repeat(2,1fr)
}

}

@media(max-width:560px){

.grid{
grid-template-columns:1fr
}

header{
flex-direction:column;
align-items:flex-start
}

nav{
width:100%
}

nav a{
flex:1;
text-align:center
}

}
</style>

</head>

<body>


<header>

<a
href="community.html"
class="logo">

LetsStudy Pro

</a>

<nav>

<a href="community.html">
Community
</a>

<a href="groups.html">
Groups
</a>

<a id="groupLinkTop" href="#">
Group
</a>

<a href="dashboard.html">
Dashboard
</a>

</nav>

</header>


<main class="container">


<section class="hero">

<h1 id="groupTitle">
Group Members
</h1>

<p id="groupDescription">
Loading group information...
</p>

<div class="group-meta">

<span
class="badge">

👥 <span id="memberCount">0</span> Members

</span>

<span
id="groupVisibility"
class="badge">

Community Group

</span>

</div>

</section>


<div id="message" class="message"></div>


<div class="actions">

<a
href="groups.html"
class="btn secondary">

← Groups

</a>

<a
id="groupLink"
href="#"
class="btn primary">

📚 Group

</a>

<a
id="chatLink"
href="#"
class="btn primary">

💬 Group Chat

</a>

<a
id="settingsLink"
href="#"
class="btn secondary">

⚙️ Group Settings

</a>

</div>


<div class="stats">

<div class="stat">

<strong id="total">
0
</strong>

<span>
Total Members
</span>

</div>


<div class="stat">

<strong id="visible">
0
</strong>

<span>
Showing
</span>

</div>


<div class="stat">

<strong id="admins">
0
</strong>

<span>
Admins
</span>

</div>

</div>


<div class="tools">

<input
id="search"
type="search"
placeholder="Search group members...">


<select id="roleFilter">

<option value="all">
All Members
</option>

<option value="owner">
Owners
</option>

<option value="admin">
Admins
</option>

<option value="moderator">
Moderators
</option>

<option value="member">
Members
</option>

</select>

</div>


<div
id="loading"
class="loading">

Loading group members...

</div>


<div
id="members"
class="grid"
style="display:none">
</div>


<div
id="empty"
class="empty"
style="display:none">

<div
style="font-size:26px;margin-bottom:10px">

👥

</div>

No group members found.

</div>


</main>


<footer>

© <span id="year"></span> LetsStudy Pro

</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
collection,
getDocs,
query,
limit
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXKbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const groupTitle=
document.getElementById("groupTitle");

const groupDescription=
document.getElementById("groupDescription");

const groupVisibility=
document.getElementById("groupVisibility");

const memberCount=
document.getElementById("memberCount");

const total=
document.getElementById("total");

const visible=
document.getElementById("visible");

const admins=
document.getElementById("admins");

const search=
document.getElementById("search");

const roleFilter=
document.getElementById("roleFilter");

const membersEl=
document.getElementById("members");

const loading=
document.getElementById("loading");

const empty=
document.getElementById("empty");

const message=
document.getElementById("message");

const groupLink=
document.getElementById("groupLink");

const groupLinkTop=
document.getElementById("groupLinkTop");

const chatLink=
document.getElementById("chatLink");

const settingsLink=
document.getElementById("settingsLink");


let currentUser=null;
let groupId=null;
let group=null;
let allMembers=[];


/* =========================================
URL
========================================= */

const params=
new URLSearchParams(
location.search
);

groupId=
params.get("groupId")||
params.get("id")||
params.get("group");


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);

currentUser=user;


if(!groupId){

showError(
"Group ID is missing. Open this page from a group."
);

return;

}


await loadGroup();

await loadMembers();

});


/* =========================================
LOAD GROUP
========================================= */

async function loadGroup(){

try{

const snap=
await getDoc(
doc(
db,
"groups",
groupId
)
);


if(!snap.exists()){

showError(
"This group does not exist."
);

return;

}


group={
id:snap.id,
...snap.data()
};


groupTitle.textContent=
(group.name||
group.title||
"Study Group")+
" — Members";


groupDescription.textContent=
group.description||
"Members of this LetsStudy Pro study group.";


groupVisibility.textContent=
group.visibility||
"Community Group";


const groupURL=
"community-group.html?id="+
encodeURIComponent(groupId);


groupLink.href=
groupURL;

groupLinkTop.href=
groupURL;


chatLink.href=
"community-chat.html?groupId="+
encodeURIComponent(groupId);


settingsLink.href=
"group-settings.html?id="+
encodeURIComponent(groupId);


}catch(error){

console.error(
"Group error:",
error
);

showError(
"Unable to load group information."
);

}

}


/* =========================================
LOAD MEMBERS
========================================= */

async function loadMembers(){

try{

/*
Primary structure:

groups/{groupId}/members/{userId}
*/

const membersRef=
collection(
db,
"groups",
groupId,
"members"
);

const snapshot=
await getDocs(
query(
membersRef,
limit(500)
));


allMembers=[];


snapshot.forEach(
memberDoc=>{

allMembers.push({

id:memberDoc.id,
...memberDoc.data()

});

});


/*
If group has an array of member IDs,
use it as fallback.
*/

if(
allMembers.length===0 &&
Array.isArray(group.members)
){

await loadMembersFromUserIds(
group.members
);

}


/*
If group has memberIds instead.
*/

if(
allMembers.length===0 &&
Array.isArray(group.memberIds)
){

await loadMembersFromUserIds(
group.memberIds
);

}


total.textContent=
allMembers.length;

memberCount.textContent=
allMembers.length;

admins.textContent=
allMembers.filter(
member=>{

const role=
String(
member.role||
member.groupRole||
"member"
).toLowerCase();

return[
"owner",
"admin",
"moderator"
].includes(role);

}
).length;


loading.style.display=
"none";

membersEl.style.display=
"grid";

applyFilters();


}catch(error){

console.error(
"Members error:",
error
);

loading.style.display=
"none";

showError(
"Unable to load group members. Check Firestore permissions."
);

}

}


/* =========================================
FALLBACK USER IDS
========================================= */

async function loadMembersFromUserIds(ids){

for(
const userId of ids.slice(0,500)
){

try{

const userSnap=
await getDoc(
doc(
db,
"users",
userId
)
);


if(userSnap.exists()){

allMembers.push({

id:userSnap.id,

...userSnap.data(),

groupRole:"member"

});

}

}catch(error){

console.warn(
"User loading failed:",
userId
);

}

}

}


/* =========================================
FILTER
========================================= */

search.addEventListener(
"input",
applyFilters
);

roleFilter.addEventListener(
"change",
applyFilters
);


function applyFilters(){

const term=
search.value
.trim()
.toLowerCase();

const role=
roleFilter.value;


const filtered=
allMembers.filter(
member=>{

const name=
String(
member.displayName||
member.name||
member.fullName||
member.username||
""
).toLowerCase();


const username=
String(
member.username||
""
).toLowerCase();


const email=
String(
member.email||
""
).toLowerCase();


const memberRole=
String(
member.groupRole||
member.role||
"member"
).toLowerCase();


const searchMatch=
!term||
name.includes(term)||
username.includes(term)||
email.includes(term);


const roleMatch=
role==="all"||
memberRole===role;


return(
searchMatch&&
roleMatch
);

});


renderMembers(filtered);

}


/* =========================================
RENDER MEMBERS
========================================= */

function renderMembers(list){

membersEl.innerHTML="";

visible.textContent=
list.length;


if(!list.length){

membersEl.style.display=
"none";

empty.style.display=
"block";

return;

}


empty.style.display=
"none";

membersEl.style.display=
"grid";


list.forEach(
member=>{

membersEl.appendChild(
createMemberCard(member)
);

});

}


/* =========================================
MEMBER CARD
========================================= */

function createMemberCard(member){

const card=
document.createElement("article");

card.className=
"card";


const name=
member.displayName||
member.name||
member.fullName||
member.username||
"Community Member";


const username=
member.username||
"";


const photo=
member.photoURL||
member.photo||
member.profilePhoto||
"";


const bio=
member.bio||
member.about||
"Member of this LetsStudy Pro study group.";


const role=
String(
member.groupRole||
member.role||
"member"
).toLowerCase();


const avatar=
photo
?
`<img
src="${escapeAttribute(photo)}"
alt="">`
:
escapeHTML(
getInitials(name)
);


const profileURL=
"profile.html?id="+
encodeURIComponent(member.id);


const chatURL=
"private-chat.html?userId="+
encodeURIComponent(member.id);


const isCurrent=
member.id===
currentUser.uid;


card.innerHTML=`

<div class="member">

<div class="avatar">

${avatar}

</div>


<div>

<div class="name">

${escapeHTML(name)}

</div>


<div class="username">

${
username
?
"@"+escapeHTML(username)
:
"Community Member"
}

</div>


<span class="member-role">

${escapeHTML(
formatRole(role)
)}

</span>

</div>

</div>


<div class="bio">

${escapeHTML(bio)}

</div>


<div class="card-actions">

<a
href="${profileURL}"
class="btn secondary">

View Profile

</a>


${
!isCurrent
?
`
<a
href="${chatURL}"
class="btn primary">

💬 Message

</a>
`
:
`
<span
class="btn secondary">

You

</span>
`
}

</div>

`;


return card;

}


/* =========================================
FORMAT ROLE
========================================= */

function formatRole(role){

return String(role)
.replaceAll("_"," ")
.replace(/\b\w/g,
c=>c.toUpperCase()
);

}


/* =========================================
ERROR
========================================= */

function showError(text){

message.textContent=
text;

message.className=
"message show error";

}


/* =========================================
INITIALS
========================================= */

function getInitials(name){

return String(name)
.trim()
.split(/\s+/)
.slice(0,2)
.map(
part=>
part.charAt(0).toUpperCase()
)
.join("")||
"U";

}


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttribute(value){

return String(value)
.replaceAll("'","%27")
.replaceAll('"',"%22")
.replaceAll("&","%26");

}


/* =========================================
YEAR
========================================= */

document.getElementById("year")
.textContent=
new Date().getFullYear();

</script>

</body>
</html>
