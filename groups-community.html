<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Groups Community | LetsStudy Pro</title>

<meta name="description"
content="Discover community groups on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10
}

.logo{
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer
}

.container{
  width:92%;
  max-width:1100px;
  margin:30px auto
}

.hero{
  background:#fff;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  margin-bottom:20px;
  box-shadow:0 4px 20px #00000008
}

.hero h1{
  font-size:30px;
  margin-bottom:8px
}

.hero p{
  color:#64748b;
  line-height:1.6
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:18px;
  flex-wrap:wrap
}

.btn{
  border:0;
  padding:11px 16px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700
}

.primary{
  background:#2563eb;
  color:#fff
}

.secondary{
  background:#eef2f7;
  color:#172033
}

.tools{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-bottom:20px
}

.search{
  width:100%;
  padding:13px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  font-size:15px
}

.categories{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px
}

.categories button{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:8px 13px;
  border-radius:20px;
  cursor:pointer
}

.categories button.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb
}

.count{
  color:#64748b;
  font-size:13px;
  margin-bottom:12px
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(250px,1fr));
  gap:15px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:18px
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:13px
}

.image{
  width:55px;
  height:55px;
  border-radius:12px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:23px
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover
}

.name{
  font-weight:800;
  font-size:17px
}

.category{
  color:#2563eb;
  font-size:12px;
  margin-top:4px
}

.description{
  color:#64748b;
  font-size:13px;
  line-height:1.55;
  min-height:40px
}

.meta{
  display:flex;
  justify-content:space-between;
  color:#64748b;
  font-size:12px;
  margin:14px 0
}

.view{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700
}

.loading,
.empty{
  background:#fff;
  border-radius:15px;
  padding:50px 20px;
  text-align:center;
  color:#64748b
}

.error{
  color:#b91c1c
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy <span>Pro</span>
  </div>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      Community Groups
    </h1>

    <p>
      Discover groups, connect with people and
      participate in meaningful discussions.
    </p>

    <div class="actions">

      <button
        class="btn primary"
        onclick="location.href='group-categories-community.html'"
      >
        Browse Categories
      </button>

    </div>

  </section>


  <section class="tools">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search groups..."
      autocomplete="off"
    >


    <div
      id="categories"
      class="categories"
    >

      <button
        class="active"
        data-category="all"
      >
        All
      </button>

    </div>

  </section>


  <div
    id="count"
    class="count"
  >
    Loading groups...
  </div>


  <section
    id="grid"
    class="grid"
  >

    <div class="loading">
      Loading community groups...
    </div>

  </section>

</main>


<script>

/*
==================================================
GROUPS-COMMUNITY.HTML

PUBLIC GROUP DIRECTORY

GET:
 /api/data?collection=groups&limit=100

DETAIL:
 group-details-community.html?id=GROUP_ID

MEMBERS:
 group-members-community.html?groupId=GROUP_ID

CATEGORY:
 group-categories-community.html

NO FIREBASE SDK
NO ADMIN
NO DIRECT FIRESTORE
==================================================
*/

const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");

const categories =
  document.getElementById("categories");

const count =
  document.getElementById("count");


let groups = [];

let activeCategory = "all";


/* =========================
   URL CATEGORY
========================= */

const params =
  new URLSearchParams(
    location.search
  );

const urlCategory =
  params.get("category");

if(urlCategory){

  activeCategory =
    urlCategory;

}


/* =========================
   LOAD GROUPS
========================= */

async function loadGroups(){

  try{

    const response =
      await fetch(
        "/api/data?collection=groups&limit=100"
      );

    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load groups."
      );

    }


    groups =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    buildCategories();

    render();

  }catch(error){

    console.error(
      "GROUPS COMMUNITY:",
      error
    );


    count.textContent = "";

    grid.innerHTML = `

      <div class="empty error">

        <h3>
          Unable to load groups
        </h3>

        <p style="margin-top:8px">
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


/* =========================
   BUILD CATEGORIES
========================= */

function buildCategories(){

  const map =
    new Map();


  groups.forEach(
    group => {

      const value =
        group.category ||
        group.categoryName;


      if(!value) return;


      const category =
        String(value).trim();


      if(category){

        map.set(
          category.toLowerCase(),
          category
        );

      }

    }
  );


  const values =
    Array.from(
      map.values()
    ).sort(
      (a,b) =>
        a.localeCompare(b)
    );


  categories.innerHTML = `

    <button
      class="${
        activeCategory === "all"
        ? "active"
        : ""
      }"
      data-category="all"
    >
      All
    </button>

    ${
      values.map(
        category => `

          <button
            class="${
              activeCategory.toLowerCase() ===
              category.toLowerCase()
              ? "active"
              : ""
            }"
            data-category="${escapeAttr(
              category
            )}"
          >

            ${escapeHTML(
              category
            )}

          </button>

        `
      ).join("")
    }

  `;

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    groups.filter(
      group => {

        const name =
          group.name ||
          group.title ||
          group.groupName ||
          "";


        const description =
          group.description ||
          group.bio ||
          "";


        const category =
          group.category ||
          group.categoryName ||
          "";


        const tags =
          Array.isArray(
            group.tags
          )
          ? group.tags.join(" ")
          : group.tags || "";


        const text =
          (
            name +
            " " +
            description +
            " " +
            category +
            " " +
            tags
          ).toLowerCase();


        const searchMatch =
          !keyword ||
          text.includes(
            keyword
          );


        const categoryMatch =
          activeCategory === "all" ||
          String(category)
            .toLowerCase() ===
          activeCategory
            .toLowerCase();


        return (
          searchMatch &&
          categoryMatch
        );

      }
    );


  count.textContent =
    filtered.length +
    (
      filtered.length === 1
      ? " group"
      : " groups"
    );


  if(!filtered.length){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No groups found
        </h3>

        <p style="margin-top:7px">
          Try another search or category.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered
      .map(
        createCard
      )
      .join("");

}


/* =========================
   CARD
========================= */

function createCard(
  group
){

  const id =
    group.id ||
    group.documentId ||
    group.groupId ||
    "";


  const name =
    group.name ||
    group.title ||
    group.groupName ||
    "Community Group";


  const category =
    group.category ||
    group.categoryName ||
    "Community";


  const description =
    group.description ||
    group.bio ||
    "Join this community group.";


  const image =
    safeImage(
      group.imageURL ||
      group.image ||
      group.photoURL ||
      group.coverURL
    );


  const memberCount =
    group.memberCount ??
    group.membersCount ??
    (
      Array.isArray(
        group.members
      )
      ? group.members.length
      : null
    );


  return `

    <article class="card">

      <div class="top">

        <div class="image">

          ${
            image
            ? `

              <img
                src="${image}"
                alt="${escapeAttr(name)}"
                loading="lazy"
              >

            `
            : "👥"
          }

        </div>


        <div>

          <div class="name">

            ${escapeHTML(name)}

          </div>


          <div class="category">

            ${escapeHTML(category)}

          </div>

        </div>

      </div>


      <div class="description">

        ${escapeHTML(
          String(description)
            .slice(0,150)
        )}

        ${
          String(description).length > 150
          ? "..."
          : ""
        }

      </div>


      <div class="meta">

        <span>

          ${
            memberCount !== null
            ? memberCount + " members"
            : "Community"
          }

        </span>


        <span>

          ${
            group.visibility
            ? escapeHTML(
                group.visibility
              )
            : "Public"
          }

        </span>

      </div>


      <button
        class="view"
        data-id="${escapeAttr(id)}"
      >

        View Group

      </button>

    </article>

  `;

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  render
);


/* =========================
   CATEGORY
========================= */

categories.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button"
      );


    if(!button) return;


    activeCategory =
      button.dataset.category ||
      "all";


    categories
      .querySelectorAll(
        "button"
      )
      .forEach(
        item =>
          item.classList.remove(
            "active"
          )
      );


    button.classList.add(
      "active"
    );


    render();

  }
);


/* =========================
   OPEN GROUP
========================= */

grid.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".view"
      );


    if(!button) return;


    const id =
      button.dataset.id;


    if(!id){

      return;

    }


    location.href =
      "group-details-community.html?id=" +
      encodeURIComponent(id);

  }
);


/* =========================
   SECURITY
========================= */

function safeImage(url){

  if(!url) return "";


  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );


    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(error){}


  return "";

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}


/* =========================
   START
========================= */

loadGroups();

</script>

</body>
</html>
