<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Groups | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="Discover and explore communities on Let'sStudy Pro."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
}

body{

  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);

}


/* =========================
   HEADER
========================= */

.topbar{

  height:64px;

  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);

}

.brand{

  display:flex;
  align-items:center;
  gap:10px;

  font-weight:800;

}

.brand-icon{

  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--primary);
  color:#fff;

}

.create-btn{

  border:0;

  padding:10px 15px;

  border-radius:10px;

  background:var(--primary);

  color:#fff;

  font-size:12px;

  font-weight:750;

  cursor:pointer;

}


/* =========================
   MAIN
========================= */

.container{

  width:100%;
  max-width:1100px;

  margin:auto;

  padding:28px 16px 70px;

}

.hero{

  margin-bottom:22px;

}

.hero h1{

  font-size:30px;

  font-weight:850;

}

.hero p{

  max-width:650px;

  margin-top:7px;

  color:var(--muted);

  font-size:14px;

  line-height:1.6;

}


/* =========================
   CONTROLS
========================= */

.controls{

  display:flex;

  gap:10px;

  margin-bottom:20px;

}

.search{

  flex:1;

}

.search input,
select{

  width:100%;

  height:44px;

  padding:
    0 13px;

  border:
    1px solid var(--border);

  border-radius:11px;

  outline:none;

  background:#fff;

  color:var(--text);

  font-family:inherit;

  font-size:13px;

}

.search input:focus,
select:focus{

  border-color:#64748b;

}


/* =========================
   GROUP GRID
========================= */

.grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:16px;

}


/* =========================
   GROUP CARD
========================= */

.group{

  overflow:hidden;

  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:16px;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}

.group:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 8px 25px
    rgba(15,23,42,.07);

}

.cover{

  height:125px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #e2e8f0,
      #f8fafc
    );

}

.cover img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.icon{

  width:58px;
  height:58px;

  position:absolute;
  bottom:-25px;
  left:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    4px solid #fff;

  border-radius:15px;

  background:var(--soft);

  font-size:27px;

}

.group-body{

  padding:
    37px
    16px
    16px;

}

.group-name{

  font-size:16px;

  font-weight:850;

  line-height:1.3;

}

.category{

  display:inline-block;

  margin-top:7px;

  padding:
    4px
    8px;

  border-radius:7px;

  background:var(--soft);

  color:var(--muted);

  font-size:10px;

  font-weight:750;

}

.description{

  min-height:42px;

  margin-top:10px;

  color:var(--muted);

  font-size:12px;

  line-height:1.55;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;

}

.meta{

  display:flex;

  gap:12px;

  margin-top:14px;

  color:var(--muted);

  font-size:10px;

}

.meta span{

  display:flex;

  align-items:center;

  gap:4px;

}

.group-footer{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-top:15px;

  padding-top:13px;

  border-top:
    1px solid var(--border);

}

.privacy{

  font-size:10px;

  color:var(--muted);

}

.view-btn{

  border:0;

  padding:
    8px
    11px;

  border-radius:8px;

  background:var(--primary);

  color:#fff;

  font-size:10px;

  font-weight:750;

  cursor:pointer;

}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  padding:50px;

  color:var(--muted);

}

.spinner{

  width:32px;
  height:32px;

  margin:
    0 auto
    10px;

  border:
    3px solid var(--border);

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   EMPTY
========================= */

.empty{

  grid-column:
    1 / -1;

  text-align:center;

  padding:60px 20px;

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:16px;

  color:var(--muted);

}

.empty-icon{

  font-size:42px;

  margin-bottom:10px;

}

.empty h3{

  color:var(--text);

  font-size:17px;

  margin-bottom:5px;

}


/* =========================
   ERROR
========================= */

.error{

  display:none;

  padding:12px;

  margin-bottom:15px;

  border-radius:10px;

  background:#fef2f2;

  border:
    1px solid #fecaca;

  color:#b91c1c;

  font-size:12px;

}

.error.show{

  display:block;

}


/* =========================
   LOAD MORE
========================= */

.load-more{

  display:block;

  margin:22px auto 0;

  padding:
    10px
    18px;

  border:0;

  border-radius:10px;

  background:var(--primary);

  color:#fff;

  font-size:12px;

  font-weight:750;

  cursor:pointer;

}

.load-more:disabled{

  opacity:.5;

}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .grid{

    grid-template-columns:
      repeat(2,1fr);

  }

}

@media(max-width:600px){

  .topbar{

    padding:
      0 12px;

  }

  .brand{

    font-size:13px;

  }

  .create-btn{

    padding:
      9px
      11px;

  }

  .container{

    padding:
      22px
      11px
      60px;

  }

  .hero h1{

    font-size:25px;

  }

  .controls{

    flex-direction:column;

  }

  .grid{

    grid-template-columns:1fr;

  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      👥
    </div>

    <span>
      Let'sStudy Pro Community
    </span>

  </div>


  <button
    class="create-btn"
    type="button"
    onclick="createGroup()"
  >
    + Create Group
  </button>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


  <section class="hero">

    <h1>
      Community Groups
    </h1>

    <p>
      Discover communities, meet people
      with shared interests, and take part
      in meaningful discussions.
    </p>

  </section>


  <div
    id="errorBox"
    class="error"
  ></div>


  <!-- CONTROLS -->

  <section class="controls">

    <div class="search">

      <input
        id="searchInput"
        type="search"
        placeholder="Search groups..."
        autocomplete="off"
      >

    </div>


    <div>

      <select
        id="categoryFilter"
      >

        <option value="">
          All Categories
        </option>

      </select>

    </div>


    <div>

      <select
        id="privacyFilter"
      >

        <option value="">
          All Privacy
        </option>

        <option value="public">
          Public
        </option>

        <option value="private">
          Private
        </option>

        <option value="restricted">
          Restricted
        </option>

      </select>

    </div>

  </section>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <p>
      Discovering groups...
    </p>

  </div>


  <!-- GRID -->

  <section
    id="groups"
    class="grid"
  ></section>


  <!-- EMPTY -->

  <section
    id="empty"
    class="empty"
    style="display:none"
  >

    <div class="empty-icon">
      👥
    </div>

    <h3>
      No groups found
    </h3>

    <p>
      Try another search or category.
    </p>

  </section>


  <!-- LOAD MORE -->

  <button
    id="loadMore"
    class="load-more"
    type="button"
    style="display:none"
  >
    Load More
  </button>


</main>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();


/* =========================
   STATE
========================= */

let allGroups =
  [];

let lastDocument =
  null;

const PAGE_SIZE =
  18;


/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function slugify(
  value
){

  return String(
    value || ""
  )
  .toLowerCase()
  .trim()
  .replace(
    /[^a-z0-9]+/g,
    "-"
  )
  .replace(
    /^-+|-+$/g,
    ""
  );

}


function showError(
  message
){

  const box =
    document.getElementById(
      "errorBox"
    );

  box.textContent =
    message;

  box.classList.add(
    "show"
  );

}


function clearError(){

  document.getElementById(
    "errorBox"
  ).classList.remove(
    "show"
  );

}


/* =========================
   LOAD GROUPS
========================= */

async function loadGroups(
  append = false
){

  const loading =
    document.getElementById(
      "loading"
    );


  try{

    clearError();


    if(!append){

      loading.style.display =
        "block";

    }


    let query =
      db
        .collection("groups")
        .where(
          "status",
          "==",
          "active"
        )
        .orderBy(
          "createdAt",
          "desc"
        )
        .limit(
          PAGE_SIZE
        );


    if(
      append &&
      lastDocument
    ){

      query =
        query.startAfter(
          lastDocument
        );

    }


    const snapshot =
      await query.get();


    loading.style.display =
      "none";


    if(
      snapshot.empty &&
      !append
    ){

      document.getElementById(
        "empty"
      ).style.display =
        "block";

      return;

    }


    if(
      !snapshot.empty
    ){

      lastDocument =
        snapshot.docs[
          snapshot.docs.length - 1
        ];

    }


    snapshot.forEach(
      doc => {

        const data =
          doc.data();


        allGroups.push({

          id:
            doc.id,

          ...data

        });

      }
    );


    buildCategories();


    renderGroups();


    if(
      snapshot.size <
      PAGE_SIZE
    ){

      document.getElementById(
        "loadMore"
      ).style.display =
        "none";

    }

    else{

      document.getElementById(
        "loadMore"
      ).style.display =
        "block";

    }

  }

  catch(error){

    console.error(
      "Groups load error:",
      error
    );


    loading.style.display =
      "none";


    showError(
      "Unable to load groups. Check your Firestore index and security rules."
    );

  }

}


/* =========================
   CATEGORIES
========================= */

function buildCategories(){

  const select =
    document.getElementById(
      "categoryFilter"
    );


  const current =
    select.value;


  const categories =
    new Map();


  allGroups.forEach(
    group => {

      if(
        group.categoryId ||
        group.categoryName
      ){

        const id =
          group.categoryId ||
          slugify(
            group.categoryName
          );


        const name =
          group.categoryName ||
          id;


        categories.set(
          id,
          name
        );

      }

    }
  );


  select.innerHTML =
    `
      <option value="">
        All Categories
      </option>
    `;


  [...categories.entries()]
    .sort(
      (a,b) =>
        a[1].localeCompare(
          b[1]
        )
    )
    .forEach(
      ([id,name]) => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          id;

        option.textContent =
          name;

        select.appendChild(
          option
        );

      }
    );


  if(
    [...select.options]
      .some(
        option =>
          option.value === current
      )
  ){

    select.value =
      current;

  }

}


/* =========================
   RENDER
========================= */

function renderGroups(){

  const container =
    document.getElementById(
      "groups"
    );


  const search =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  const category =
    document.getElementById(
      "categoryFilter"
    ).value;


  const privacy =
    document.getElementById(
      "privacyFilter"
    ).value;


  container.innerHTML =
    "";


  const filtered =
    allGroups.filter(
      group => {

        const name =
          String(
            group.name || ""
          ).toLowerCase();


        const description =
          String(
            group.description || ""
          ).toLowerCase();


        const categoryId =
          group.categoryId ||
          slugify(
            group.categoryName
          );


        const matchesSearch =
          !search ||
          name.includes(search) ||
          description.includes(search);


        const matchesCategory =
          !category ||
          categoryId === category;


        const matchesPrivacy =
          !privacy ||
          group.privacy === privacy;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesPrivacy
        );

      }
    );


  if(!filtered.length){

    document.getElementById(
      "empty"
    ).style.display =
      "block";

    return;

  }


  document.getElementById(
    "empty"
  ).style.display =
    "none";


  filtered.forEach(
    group => {

      renderGroup(
        group
      );

    }
  );

}


/* =========================
   GROUP CARD
========================= */

function renderGroup(
  group
){

  const container =
    document.getElementById(
      "groups"
    );


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "group";


  const name =
    group.name ||
    "Community Group";


  const description =
    group.description ||
    "Join this community and connect with other members.";


  const category =
    group.categoryName ||
    "Community";


  const privacy =
    group.privacy ||
    "public";


  const memberCount =
    Number(
      group.memberCount || 0
    );


  const postCount =
    Number(
      group.postCount || 0
    );


  const cover =
    group.coverPhoto
      ? `
        <img
          src="${escapeHTML(
            group.coverPhoto
          )}"
          alt="${escapeHTML(
            name
          )}"
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      `
      : "";


  const icon =
    group.icon ||
    "👥";


  card.innerHTML =
    `
      <div class="cover">

        ${cover}

        <div class="icon">

          ${escapeHTML(
            icon
          )}

        </div>

      </div>


      <div class="group-body">

        <div class="group-name">

          ${escapeHTML(
            name
          )}

        </div>


        <span class="category">

          ${escapeHTML(
            category
          )}

        </span>


        <div class="description">

          ${escapeHTML(
            description
          )}

        </div>


        <div class="meta">

          <span>
            👥
            ${memberCount}
            members
          </span>


          <span>
            💬
            ${postCount}
            posts
          </span>

        </div>


        <div class="group-footer">

          <span class="privacy">

            ${
              privacy === "private"
                ? "🔒 Private"
                : privacy === "restricted"
                  ? "🛡 Restricted"
                  : "🌐 Public"
            }

          </span>


          <button
            class="view-btn"
            type="button"
            data-group="${escapeHTML(
              group.id
            )}"
          >
            View Group
          </button>

        </div>

      </div>
    `;


  card
    .querySelector(
      ".view-btn"
    )
    .addEventListener(
      "click",
      () => {

        openGroup(
          group
        );

      }
    );


  container.appendChild(
    card
  );

}


/* =========================
   OPEN GROUP
========================= */

function openGroup(
  group
){

  window.location.href =
    `group-community.html?id=${
      encodeURIComponent(
        group.id
      )
    }`;

}


/* =========================
   CREATE GROUP
========================= */

function createGroup(){

  window.location.href =
    "create-community.html";

}


/* =========================
   SEARCH
========================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    () => {

      renderGroups();

    }
  );


/* =========================
   CATEGORY
========================= */

document
  .getElementById(
    "categoryFilter"
  )
  .addEventListener(
    "change",
    () => {

      renderGroups();

    }
  );


/* =========================
   PRIVACY
========================= */

document
  .getElementById(
    "privacyFilter"
  )
  .addEventListener(
    "change",
    () => {

      renderGroups();

    }
  );


/* =========================
   LOAD MORE
========================= */

document
  .getElementById(
    "loadMore"
  )
  .addEventListener(
    "click",
    async () => {

      const button =
        document.getElementById(
          "loadMore"
        );


      button.disabled =
        true;


      button.textContent =
        "Loading...";


      await loadGroups(
        true
      );


      button.disabled =
        false;


      button.textContent =
        "Load More";

    }
  );


/* =========================
   START
========================= */

loadGroups();


/* =========================
   GLOBAL ERROR
========================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled error:",
      event.reason
    );

  }
);

</script>

</body>

</html>
