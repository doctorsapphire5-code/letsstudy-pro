<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(1000px,92%);margin:0 auto;padding:44px 0 70px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 8px}
.lead{font-size:18px;color:var(--muted);margin:0;max-width:560px}
.btn{border:0;background:var(--p);color:#fff;padding:10px 20px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.tools{display:flex;gap:10px;margin-bottom:12px}
.search,.sort{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px}
.search{flex:1;min-width:0}
.search:focus,.sort:focus,.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
#count{color:var(--muted);font-size:14px;margin:16px 0 14px;min-height:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.g{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.bn{height:84px;background:var(--soft)}
.bn img{width:100%;height:100%;object-fit:cover;display:block}
.in{padding:0 18px 18px;display:flex;flex-direction:column;flex:1}
.ic{width:60px;height:60px;border-radius:16px;border:4px solid var(--paper);background:var(--soft);margin-top:-30px;position:relative;display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--p);overflow:hidden}
.nm{margin:10px 0 0;font-size:19px;line-height:1.3;letter-spacing:-.01em;color:var(--ink);overflow-wrap:anywhere}
.nm a{color:inherit;text-decoration:none}
.nm a:hover{color:var(--p)}
.bd{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.ds{margin:10px 0 0;font-size:15px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.stats{display:flex;gap:16px;margin:12px 0 14px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-size:15px;margin-right:3px}
.act{display:flex;gap:8px;margin-top:auto}
.act .btn{flex:1}
.f{padding:22px}
.f h2{margin:0 0 6px;font-size:22px;color:var(--ink)}
.f label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:12px 0 6px}
.f input,.f select,.f textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.f textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:90px 1fr;gap:12px}
.f .act{justify-content:flex-end;margin-top:20px}
.f .act .btn{flex:none}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,94vw);max-height:92vh;background:var(--paper);color:var(--text);box-shadow:0 25px 60px rgba(2,6,23,.4);overflow:auto}
dialog::backdrop{background:rgba(2,6,23,.6)}
.state{grid-column:1/-1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.tools{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="wrap">
  <div class="head">
    <div><h1>Groups</h1><p class="lead">Join study groups and communities, or start your own.</p></div>
    <button class="btn" id="newBtn" type="button" hidden="">Create a group</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="explore" aria-selected="true">Explore</button>
    <button class="tab" role="tab" data-v="mine" aria-selected="false">My groups</button>
  </div>
  <div class="tools">
    <input id="search" class="search" type="search" placeholder="Search groups" aria-label="Search groups">
    <select id="sort" class="sort" aria-label="Sort groups">
      <option value="members">Most members</option>
      <option value="new">Newest</option>
      <option value="az">A to Z</option>
    </select>
  </div>
  <div class="chips" id="chips" hidden=""></div>
  <div id="count" role="status"></div>
  <section id="grid" class="grid"></section>
</main>

<dialog id="dlg">
  <div class="f">
    <h2>Create a group</h2>
    <div class="two">
      <div><label for="gi">Icon</label><input id="gi" maxlength="2" placeholder="📚" aria-label="Icon"></div>
      <div><label for="gn">Name</label><input id="gn" maxlength="60" placeholder="e.g. Biology study circle"></div>
    </div>
    <label for="gd">Description</label><textarea id="gd" maxlength="400" placeholder="What is this group about?"></textarea>
    <label for="gc">Category</label><select id="gc"></select>
    <label for="gp">Privacy</label><select id="gp"><option value="public">Public: anyone can join</option><option value="private">Private: members need approval</option></select>
    <label for="gv">Cover image URL (optional)</label><input id="gv" type="url" placeholder="https://...">
    <div class="act"><button class="btn alt" id="cancel" type="button">Cancel</button><button class="btn" id="save" type="button">Create group</button></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>
<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteDoc,query,where,orderBy,limit}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const grid=$("#grid"),countEl=$("#count"),chipBox=$("#chips");
const N=new Intl.NumberFormat(undefined,{notation:"compact",maximumFractionDigits:1});
const startCat=(new URLSearchParams(location.search).get("categoryId")||"").trim();
/* Where a group opens: its posts in the community feed. Change if you have a group page. */
const OPEN=id=>`communityPosts.html?groupId=${encodeURIComponent(id)}`;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const cap=s=>s?String(s)[0].toUpperCase()+String(s).slice(1):s;
const num=v=>Number(v)||0;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}

const HIDE=/^(draft|pending|archived|deleted|hidden|removed|rejected|disabled|inactive|blocked|suspended)$/i;
const ACTIVE=/^(active|approved|joined|member|accepted)$/i;
let user=null,view="explore",cat=startCat,cats=[],groups=[],extra=[],mem=new Map();

const isPriv=g=>/^(private|closed)$/i.test(g.privacy||"");
const secret=g=>/^(secret|hidden)$/i.test(g.privacy||"");
const mine=g=>user&&(g.ownerId===user.uid||mem.has(g.id));
const SORTS={members:(a,b)=>num(b.memberCount)-num(a.memberCount),
  new:(a,b)=>(toD(b.createdAt)||0)-(toD(a.createdAt)||0),az:(a,b)=>String(a.name||"").localeCompare(String(b.name||""))};

function card(g){
  const m=mem.get(g.id),own=user&&g.ownerId===user.uid,cover=safe(g.coverPhoto);
  const joined=m&&ACTIVE.test(m.status||""),pend=m&&!joined;
  const btn=own?`<span class="btn alt sm" style="cursor:default">Owner</span>`
    :joined?`<button class="btn alt sm" type="button" data-leave="${esc(g.id)}">Joined</button>`
    :pend?`<button class="btn alt sm" type="button" data-leave="${esc(g.id)}">Requested</button>`
    :`<button class="btn sm" type="button" data-join="${esc(g.id)}">${isPriv(g)?"Request to join":"Join"}</button>`;
  return `<article class="g"><div class="bn">${cover?`<img src="${esc(cover)}" alt="" loading="lazy">`:""}</div>
    <div class="in"><div class="ic" aria-hidden="true">${esc(g.icon||(g.name||"G")[0].toUpperCase())}</div>
      <h2 class="nm"><a href="${OPEN(g.id)}">${esc(g.name||"Group")}</a></h2>
      <div class="bd">${g.categoryName?`<span class="b">${esc(g.categoryName)}</span>`:""}<span class="b">${isPriv(g)?"Private":"Public"}</span></div>
      ${g.description?`<p class="ds">${esc(g.description)}</p>`:""}
      <div class="stats"><span><b>${N.format(num(g.memberCount))}</b>members</span><span><b>${N.format(num(g.postCount))}</b>posts</span></div>
      <div class="act">${btn}<a class="btn alt sm" href="${OPEN(g.id)}">View posts</a></div></div></article>`;
}

function render(){
  const q=$("#search").value.toLowerCase().trim();
  const pool=[...groups,...extra.filter(e=>!groups.some(g=>g.id===e.id))];
  const src=pool.filter(g=>!HIDE.test(g.status||"")||mine(g)).filter(g=>view==="mine"?mine(g):(!secret(g)||mine(g)));
  const items=src.filter(g=>(!cat||g.categoryId===cat)&&(!q||[g.name,g.description,g.categoryName].join(" ").toLowerCase().includes(q))).sort(SORTS[$("#sort").value]);
  countEl.textContent=items.length===1?"1 group":`${items.length} groups`;
  grid.innerHTML=items.length?items.map(card).join(""):
    `<div class="state"><h2>${src.length?"No matches":view==="mine"?"You have not joined any groups":"No groups yet"}</h2><p>${src.length?"Try a different search or category.":view==="mine"?"Join a group or create your own.":"Be the first to start one."}</p></div>`;
}

function chips(){
  const list=cats.length?cats:[...new Map(groups.filter(g=>g.categoryId).map(g=>[g.categoryId,{id:g.categoryId,name:g.categoryName||g.categoryId}])).values()];
  if(list.length<2){chipBox.hidden=true;return}
  chipBox.innerHTML=[{id:"",name:"All"},...list].map(c=>`<button class="chip" type="button" data-c="${esc(c.id)}" aria-pressed="${c.id===cat}">${c.icon?esc(c.icon)+" ":""}${esc(c.name)}</button>`).join("");
  chipBox.hidden=false;
}
chipBox.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  cat=b.dataset.c;
  chipBox.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
});
$("#search").addEventListener("input",render);
$("#sort").addEventListener("change",render);
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  view=t.dataset.v;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  if(view==="mine"&&!user){countEl.textContent="";grid.innerHTML=`<div class="state"><h2>Sign in to see your groups</h2><a class="btn" href="login.html">Sign in</a></div>`;return}
  render();
}));
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"&&i.closest(".bn"))i.remove()},true);

/* ---- join / leave (groupMembers) ---- */
grid.addEventListener("click",async e=>{
  const j=e.target.closest("[data-join]"),l=e.target.closest("[data-leave]");
  if(j){
    if(!user){location.href="login.html";return}
    const g=[...groups,...extra].find(x=>x.id===j.dataset.join);if(!g)return;
    j.disabled=true;
    const id=`${g.id}_${user.uid}`,status=isPriv(g)?"pending":"active";
    try{
      await setDoc(doc(db,"groupMembers",id),{memberId:id,groupId:g.id,joinedAt:new Date().toISOString(),role:"member",status,userId:user.uid});
      mem.set(g.id,{id,status,role:"member"});
      toast(status==="pending"?"Request sent":"You joined "+(g.name||"the group"));
    }catch(err){console.error(err);toast("Could not join the group")}
    render();
  }else if(l){
    const m=mem.get(l.dataset.leave);if(!m)return;
    if(!confirm(ACTIVE.test(m.status||"")?"Leave this group?":"Cancel your request?"))return;
    l.disabled=true;
    try{await deleteDoc(doc(db,"groupMembers",m.id));mem.delete(l.dataset.leave);toast("Done")}
    catch(err){console.error(err);toast("Something went wrong")}
    render();
  }
});

/* ---- create group ---- */
$("#newBtn").addEventListener("click",()=>{
  $("#gc").innerHTML=cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")||`<option value="">General</option>`;
  $("#dlg").showModal();$("#gn").focus();
});
$("#cancel").addEventListener("click",()=>$("#dlg").close());
$("#save").addEventListener("click",async e=>{
  const name=$("#gn").value.trim(),cover=$("#gv").value.trim();
  if(!name){toast("Enter a group name");return}
  if(cover&&!safe(cover)){toast("Cover URL must start with https://");return}
  const b=e.currentTarget;b.disabled=true;
  try{
    const ref=doc(collection(db,"groups")),now=new Date().toISOString(),c=cats.find(x=>x.id===$("#gc").value);
    const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||ref.id;
    const g={groupId:ref.id,categoryId:c?.id||"",categoryName:c?.name||"",coverPhoto:cover,createdAt:now,description:$("#gd").value.trim(),
      icon:$("#gi").value.trim(),memberCount:"1",name,ownerId:user.uid,postCount:"0",privacy:$("#gp").value,slug,status:"active",updatedAt:now};
    await setDoc(ref,g);
    const mid=`${ref.id}_${user.uid}`;
    await setDoc(doc(db,"groupMembers",mid),{memberId:mid,groupId:ref.id,joinedAt:now,role:"owner",status:"active",userId:user.uid});
    groups.unshift({id:ref.id,...g});mem.set(ref.id,{id:mid,status:"active",role:"owner"});
    $("#dlg").close();["#gn","#gd","#gi","#gv"].forEach(s=>$(s).value="");
    render();toast("Group created");
  }catch(err){console.error(err);toast("Could not create the group")}
  b.disabled=false;
});

/* ---- load ---- */
function fail(err){
  console.error(err);countEl.textContent="";
  const denied=err&&err.code==="permission-denied"&&!user;
  grid.innerHTML=denied
    ?`<div class="state"><h2>Sign in to browse groups</h2><a class="btn" href="login.html">Sign in</a></div>`
    :`<div class="state err"><h2>Unable to load groups</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry")?.addEventListener("click",load);
}

async function load(){
  const gc=collection(db,"groups");
  let gs;
  try{gs=await getDocs(query(gc,orderBy("createdAt","desc"),limit(100)))}
  catch{try{gs=await getDocs(query(gc,limit(100)))}catch(e){return fail(e)}}
  groups=gs.docs.map(d=>({id:d.id,...d.data()}));
  try{
    cats=(await getDocs(query(collection(db,"groupCategories"),limit(100)))).docs.map(d=>({id:d.id,...d.data()}))
      .filter(c=>c.name&&!HIDE.test(c.status||"")).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  }catch{cats=[]}
  await memberships();
  chips();render();
}

async function memberships(){
  mem=new Map();extra=[];
  if(!user)return;
  try{
    (await getDocs(query(collection(db,"groupMembers"),where("userId","==",user.uid)))).docs
      .forEach(d=>{const m=d.data();if(m.groupId)mem.set(m.groupId,{id:d.id,status:m.status,role:m.role})});
    const miss=[...mem.keys()].filter(id=>!groups.some(g=>g.id===id));
    await Promise.all(miss.map(async id=>{try{const s=await getDoc(doc(db,"groups",id));if(s.exists())extra.push({id:s.id,...s.data()})}catch{}}));
  }catch(e){console.warn(e)}
}

$("#year").textContent=new Date().getFullYear();
let first=true;
onAuthStateChanged(auth,async u=>{
  user=u;$("#newBtn").hidden=!u;
  if(first){first=false;await load()}
  else{await memberships();chips();render()}
});
</script>
