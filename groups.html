<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Study Groups | LetsStudy Pro</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a
}

a{
text-decoration:none;
color:inherit
}

button,
input,
select{
font:inherit
}

header{
position:sticky;
top:0;
z-index:30;
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:13px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb
}

nav{
display:flex;
gap:7px;
flex-wrap:wrap
}

nav a{
font-size:9px;
font-weight:900;
color:#334155;
background:#f1f5f9;
padding:8px 10px;
border-radius:8px
}

.container{
max-width:1100px;
margin:auto;
padding:22px 15px
}

.hero{
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:#fff;
border-radius:20px;
padding:27px;
margin-bottom:16px
}

.hero small{
font-size:8px;
font-weight:900;
letter-spacing:1px
}

.hero h1{
font-size:28px;
margin:8px 0
}

.hero p{
font-size:11px;
line-height:1.7;
max-width:720px;
opacity:.92
}

.hero-actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:16px
}

.btn{
border:0;
cursor:pointer;
padding:10px 13px;
border-radius:9px;
font-size:9px;
font-weight:900;
display:inline-flex;
align-items:center;
justify-content:center
}

.primary{
background:#2563eb;
color:#fff
}

.white{
background:#fff;
color:#2563eb
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.danger{
background:#fee2e2;
color:#991b1b
}

.toolbar{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:13px;
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:16px
}

input,
select{
border:1px solid #cbd5e1;
border-radius:9px;
padding:11px;
font-size:10px;
outline:none;
background:#fff
}

.search{
flex:1;
min-width:200px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:17px;
overflow:hidden;
transition:.2s
}

.card:hover{
transform:translateY(-2px);
box-shadow:0 8px 25px rgba(15,23,42,.08)
}

.cover{
height:125px;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
background:linear-gradient(135deg,#dbeafe,#ede9fe);
background-size:cover;
background-position:center
}

.content{
padding:15px
}

.category{
font-size:8px;
font-weight:900;
color:#2563eb;
margin-bottom:7px
}

.title{
font-size:14px;
font-weight:900;
line-height:1.4;
margin-bottom:7px
}

.description{
font-size:10px;
line-height:1.6;
color:#64748b;
min-height:48px
}

.meta{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px
}

.meta span{
font-size:8px;
color:#64748b;
background:#f8fafc;
padding:6px 8px;
border-radius:7px
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:13px
}

.loading,
.empty{
grid-column:1/-1;
background:#fff;
border:1px solid #e2e8f0;
border-radius:16px;
padding:50px 20px;
text-align:center;
font-size:11px;
color:#64748b
}

.message{
display:none;
padding:11px;
border-radius:9px;
font-size:10px;
font-weight:900;
margin-bottom:12px
}

.message.success{
display:block;
background:#dcfce7;
color:#166534
}

.message.error{
display:block;
background:#fee2e2;
color:#991b1b
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:16px
}

.stat{
background:#fff;
border:1px solid #e2e8f0;
border-radius:13px;
padding:13px;
text-align:center
}

.stat strong{
display:block;
font-size:18px;
color:#2563eb
}

.stat span{
font-size:8px;
color:#64748b
}

footer{
text-align:center;
padding:30px;
font-size:10px;
color:#64748b
}

@media(max-width:850px){
.grid{
grid-template-columns:repeat(2,1fr)
}
}

@media(max-width:550px){

header{
flex-direction:column;
align-items:flex-start
}

nav{
width:100%
}

nav a{
flex:1;
text-align:center
}

.grid{
grid-template-columns:1fr
}

.stats{
grid-template-columns:1fr 1fr
}

}

</style>

</head>


<body>


<header>

<a
href="community.html"
class="logo">

LetsStudy Pro

</a>


<nav>

<a href="community.html">
Community
</a>

<a href="community-group.html">
My Group
</a>

<a href="create-post.html">
Create Post
</a>

<a href="dashboard.html">
Dashboard
</a>

</nav>

</header>


<main class="container">


<section class="hero">

<small>
LETSSTUDY COMMUNITY
</small>

<h1>
Study Groups
</h1>

<p>
Find learning communities, join study groups and collaborate with other students and educators.
</p>


<div class="hero-actions">

<a
href="community.html"
class="btn white">

← Community

</a>


<a
href="create-post.html"
class="btn white">

＋ Create Post

</a>

</div>

</section>


<div
id="message"
class="message">
</div>


<section class="stats">

<div class="stat">

<strong id="totalGroups">
0
</strong>

<span>
Total Groups
</span>

</div>


<div class="stat">

<strong id="publicGroups">
0
</strong>

<span>
Public Groups
</span>

</div>


<div class="stat">

<strong id="myGroups">
0
</strong>

<span>
My Groups
</span>

</div>

</section>


<section class="toolbar">

<input
id="search"
class="search"
type="search"
placeholder="Search study groups...">


<select id="category">

<option value="all">
All Categories
</option>

<option value="mathematics">
Mathematics
</option>

<option value="physics">
Physics
</option>

<option value="chemistry">
Chemistry
</option>

<option value="biology">
Biology
</option>

<option value="computer">
Computer Science
</option>

<option value="business">
Business
</option>

<option value="language">
Languages
</option>

<option value="other">
Other
</option>

</select>


<select id="privacy">

<option value="all">
All Groups
</option>

<option value="public">
Public
</option>

<option value="private">
Private
</option>

</select>


<button
id="clear"
class="btn secondary">

Clear

</button>

</section>


<section
id="groups"
class="grid">

<div class="loading">

Loading study groups...

</div>

</section>


</main>


<footer>

© <span id="year"></span> LetsStudy Pro

</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
setDoc,
deleteDoc,
query,
limit
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const groupsEl=
document.getElementById("groups");

const search=
document.getElementById("search");

const category=
document.getElementById("category");

const privacy=
document.getElementById("privacy");

const clear=
document.getElementById("clear");

const message=
document.getElementById("message");

const totalGroups=
document.getElementById("totalGroups");

const publicGroups=
document.getElementById("publicGroups");

const myGroups=
document.getElementById("myGroups");


let currentUser=null;
let groups=[];
let joinedIds=new Set();


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href=
"login.html?redirect="+
encodeURIComponent(
"groups.html"
);

return;

}

currentUser=user;

await loadGroups();

await loadMemberships();

updateStats();

render();

}
);


/* =========================================
LOAD GROUPS
========================================= */

async function loadGroups(){

try{

const snap=
await getDocs(
query(
collection(db,"groups"),
limit(100)
)
);

groups=
snap.docs.map(
d=>({

id:d.id,
...d.data()

})
);

}catch(error){

console.error(
"Groups error:",
error
);

groups=[];

showMessage(
"Unable to load study groups.",
"error"
);

}

}


/* =========================================
LOAD MEMBERSHIPS
========================================= */

async function loadMemberships(){

joinedIds=
new Set();

try{

const snap=
await getDocs(
collection(
db,
"users",
currentUser.uid,
"groups"
)
);

snap.forEach(
d=>
joinedIds.add(d.id)
);

}catch(error){

console.warn(
"Membership collection unavailable.",
error
);


/*
Fallback:
check memberIds on groups.
*/

groups.forEach(
group=>{

const ids=
group.memberIds||
[];

if(
Array.isArray(ids)&&
ids.includes(currentUser.uid)
){

joinedIds.add(group.id);

}

});

}

}


/* =========================================
STATS
========================================= */

function updateStats(){

totalGroups.textContent=
groups.length;

publicGroups.textContent=
groups.filter(
g=>
String(
g.privacy||
g.visibility||
"public"
).toLowerCase()==="public"
).length;

myGroups.textContent=
groups.filter(
g=>
joinedIds.has(g.id)
).length;

}


/* =========================================
RENDER
========================================= */

function render(){

let list=
[...groups];


const keyword=
search.value
.trim()
.toLowerCase();


if(keyword){

list=
list.filter(
group=>{

const title=
String(
group.name||
group.title||
""
).toLowerCase();

const description=
String(
group.description||
""
).toLowerCase();

const groupCategory=
String(
group.category||
""
).toLowerCase();

return(
title.includes(keyword)||
description.includes(keyword)||
groupCategory.includes(keyword)
);

}
);

}


/* CATEGORY */

if(category.value!=="all"){

list=
list.filter(
group=>
String(
group.category||
"other"
).toLowerCase()===
category.value
);

}


/* PRIVACY */

if(privacy.value!=="all"){

list=
list.filter(
group=>
String(
group.privacy||
group.visibility||
"public"
).toLowerCase()===
privacy.value
);

}


groupsEl.innerHTML="";


if(!list.length){

groupsEl.innerHTML=`

<div class="empty">

👥<br><br>

No study groups found.

<br><br>

<a
href="community.html"
class="btn primary">

Back to Community

</a>

</div>

`;

return;

}


list.forEach(
group=>{

groupsEl.appendChild(
createCard(group)
);

});

}


/* =========================================
GROUP CARD
========================================= */

function createCard(group){

const card=
document.createElement("article");

card.className="card";


const title=
group.name||
group.title||
"Study Group";

const description=
group.description||
"Join this learning community.";

const categoryValue=
group.category||
"Other";

const privacyValue=
group.privacy||
group.visibility||
"public";

const image=
group.image||
group.cover||
group.coverImage||
"";

const memberCount=
group.memberCount||
(
Array.isArray(group.memberIds)
?
group.memberIds.length
:
0
);

const isJoined=
joinedIds.has(group.id);


card.innerHTML=`

<div
class="cover"
${
image
?
`style="background-image:url('${escapeAttribute(image)}')"`
:
""
}>

${image?"":"👥"}

</div>


<div class="content">

<div class="category">

${escapeHTML(categoryValue)}

</div>


<div class="title">

${escapeHTML(title)}

</div>


<div class="description">

${escapeHTML(
description.substring(0,130)
)}
${description.length>130?"...":""}

</div>


<div class="meta">

<span>
👥 ${memberCount} members
</span>

<span>
${String(privacyValue).toLowerCase()==="private"
?"🔒 Private"
:"🌎 Public"}
</span>

</div>


<div class="actions">

<a
href="community-group.html?id=${encodeURIComponent(group.id)}"
class="btn primary">

Open Group

</a>


<button
class="btn ${isJoined?"danger":"secondary"}"
data-action="${isJoined?"leave":"join"}"
data-id="${escapeAttribute(group.id)}">

${isJoined?"Leave Group":"Join Group"}

</button>

</div>

</div>

`;

return card;

}


/* =========================================
JOIN / LEAVE
========================================= */

groupsEl.addEventListener(
"click",
async event=>{

const button=
event.target.closest(
"[data-action]"
);

if(!button)
return;

const groupId=
button.dataset.id;

const action=
button.dataset.action;

button.disabled=true;

try{

const membershipRef=
doc(
db,
"users",
currentUser.uid,
"groups",
groupId
);


if(action==="join"){

await setDoc(
membershipRef,
{

uid:currentUser.uid,

groupId,

joinedAt:
new Date()

}
);

joinedIds.add(groupId);

showMessage(
"You joined the group.",
"success"
);

}else{

await deleteDoc(
membershipRef
);

joinedIds.delete(groupId);

showMessage(
"You left the group.",
"success"
);

}

updateStats();

render();

}catch(error){

console.error(error);

showMessage(
"Unable to update group membership.",
"error"
);

button.disabled=false;

}

});


/* =========================================
FILTERS
========================================= */

search.addEventListener(
"input",
render
);

category.addEventListener(
"change",
render
);

privacy.addEventListener(
"change",
render
);


clear.addEventListener(
"click",
()=>{

search.value="";

category.value="all";

privacy.value="all";

render();

}
);


/* =========================================
MESSAGE
========================================= */

function showMessage(
text,
type
){

message.textContent=text;

message.className=
"message "+
type;

setTimeout(
()=>{

message.className=
"message";

},
3000
);

}


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttribute(value){

return String(value)
.replaceAll("&","%26")
.replaceAll('"',"%22")
.replaceAll("'","%27");

}


/* =========================================
YEAR
========================================= */

document.getElementById("year")
.textContent=
new Date().getFullYear();

</script>

</body>
</html>
