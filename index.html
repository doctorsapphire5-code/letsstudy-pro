  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", Arial, sans-serif;
      background: #f8fafc;
      color: #334155;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =====================================================
       VARIABLES
    ===================================================== */

    :root {

      --primary: #2563eb;
      --primary-dark: #1d4ed8;

      --secondary: #7c3aed;

      --dark: #0f172a;

      --text: #334155;

      --muted: #64748b;

      --light: #f8fafc;

      --white: #ffffff;

      --border: #e2e8f0;

      --success: #16a34a;

      --warning: #f59e0b;

      --danger: #dc2626;

      --radius: 18px;

      --shadow:
        0 12px 35px rgba(15, 23, 42, .08);

    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    .container {

      width: min(1180px, 92%);

      margin: auto;

    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {

      position: sticky;

      top: 0;

      z-index: 1000;

      background:
        rgba(255,255,255,.94);

      backdrop-filter:
        blur(16px);

      border-bottom:
        1px solid var(--border);

    }


    .navbar {

      min-height: 72px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

    }


    .logo {

      display: flex;

      align-items: center;

      gap: 10px;

      font-size: 21px;

      font-weight: 900;

      color: var(--dark);

      white-space: nowrap;

    }


    .logo-icon {

      width: 42px;

      height: 42px;

      display: grid;

      place-items: center;

      border-radius: 13px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--secondary)
        );

      box-shadow:
        0 8px 20px rgba(37,99,235,.25);

    }


    nav {

      display: flex;

      align-items: center;

      gap: 20px;

    }


    nav a {

      font-size: 14px;

      font-weight: 700;

      color: var(--text);

      transition: .2s;

    }


    nav a:hover {

      color: var(--primary);

    }


    .nav-actions {

      display: flex;

      align-items: center;

      gap: 9px;

    }


    .btn {

      border: none;

      border-radius: 12px;

      padding:
        11px 17px;

      font-weight: 800;

      display: inline-flex;

      justify-content: center;

      align-items: center;

      gap: 7px;

      transition: .2s;

    }


    .btn:hover {

      transform:
        translateY(-2px);

    }


    .btn-primary {

      color: white;

      background:
        var(--primary);

    }


    .btn-primary:hover {

      background:
        var(--primary-dark);

    }


    .btn-outline {

      color: var(--dark);

      background: white;

      border:
        1px solid var(--border);

    }


    .btn-white {

      color: var(--primary);

      background: white;

    }


    .menu-btn {

      display: none;

      border: none;

      background: transparent;

      font-size: 27px;

    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {

      padding:
        85px 0 70px;

      background:

        radial-gradient(
          circle at 85% 15%,
          rgba(124,58,237,.18),
          transparent 30%
        ),

        radial-gradient(
          circle at 15% 30%,
          rgba(37,99,235,.13),
          transparent 32%
        ),

        linear-gradient(
          135deg,
          #eff6ff,
          #ffffff
        );

    }


    .hero-grid {

      display: grid;

      grid-template-columns:
        1.1fr .9fr;

      gap: 55px;

      align-items: center;

    }


    .eyebrow {

      display: inline-flex;

      padding:
        7px 12px;

      border-radius: 999px;

      background: #dbeafe;

      color: #1d4ed8;

      font-size: 12px;

      font-weight: 900;

      margin-bottom: 18px;

    }


    .hero h1 {

      color: var(--dark);

      font-size:
        clamp(42px, 6vw, 70px);

      line-height: 1.02;

      letter-spacing: -3px;

      margin-bottom: 22px;

    }


    .hero h1 span {

      color: var(--primary);

    }


    .hero-text {

      max-width: 680px;

      color: var(--muted);

      font-size: 18px;

      margin-bottom: 28px;

    }


    .hero-buttons {

      display: flex;

      flex-wrap: wrap;

      gap: 11px;

      margin-bottom: 30px;

    }


    .trust-row {

      display: flex;

      flex-wrap: wrap;

      gap: 18px;

      color: var(--muted);

      font-size: 13px;

      font-weight: 600;

    }


    /* HERO VISUAL */

    .hero-visual {

      position: relative;

    }


    .dashboard-card {

      background: white;

      border:
        1px solid var(--border);

      border-radius: 28px;

      padding: 20px;

      box-shadow:
        0 25px 70px
        rgba(15,23,42,.12);

    }


    .visual-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 18px;

    }


    .visual-header strong {

      color: var(--dark);

    }


    .online {

      display: flex;

      align-items: center;

      gap: 6px;

      color: var(--success);

      font-size: 12px;

      font-weight: 800;

    }


    .online-dot {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      background: var(--success);

    }


    .visual-main {

      padding: 25px;

      border-radius: 22px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      margin-bottom: 15px;

    }


    .visual-main small {

      opacity: .8;

    }


    .visual-main h2 {

      margin:
        7px 0 18px;

      font-size: 25px;

    }


    .visual-progress {

      height: 8px;

      background:
        rgba(255,255,255,.22);

      border-radius: 20px;

      overflow: hidden;

    }


    .visual-progress span {

      display: block;

      width: 72%;

      height: 100%;

      background: white;

    }


    .visual-bottom {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 10px;

    }


    .mini-card {

      padding: 15px;

      border:
        1px solid var(--border);

      border-radius: 15px;

      text-align: center;

    }


    .mini-card strong {

      display: block;

      color: var(--dark);

      font-size: 18px;

    }


    .mini-card span {

      color: var(--muted);

      font-size: 11px;

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    .search-section {

      margin-top: -28px;

      position: relative;

      z-index: 5;

    }


    .search-box {

      max-width: 900px;

      margin: auto;

      padding: 10px;

      background: white;

      border:
        1px solid var(--border);

      border-radius: 17px;

      box-shadow: var(--shadow);

      display: flex;

      gap: 8px;

    }


    .search-box input {

      flex: 1;

      border: none;

      outline: none;

      padding:
        13px 15px;

      color: var(--dark);

      min-width: 0;

    }


    .search-box button {

      border: none;

      border-radius: 11px;

      padding:
        0 22px;

      color: white;

      background:
        var(--primary);

      font-weight: 800;

    }


    /* =====================================================
       SECTIONS
    ===================================================== */

    section {

      padding:
        75px 0;

    }


    .section-head {

      display: flex;

      justify-content: space-between;

      align-items: end;

      gap: 20px;

      margin-bottom: 35px;

    }


    .section-head.center {

      display: block;

      text-align: center;

    }


    .section-head h2 {

      color: var(--dark);

      font-size:
        clamp(29px, 4vw, 42px);

      line-height: 1.15;

      margin-bottom: 8px;

    }


    .section-head p {

      max-width: 680px;

      color: var(--muted);

    }


    .section-head.center p {

      margin: auto;

    }


    .view-all {

      color: var(--primary);

      font-size: 14px;

      font-weight: 800;

      white-space: nowrap;

    }


    /* =====================================================
       PLATFORM CARDS
    ===================================================== */

    .platform-grid {

      display: grid;

      grid-template-columns:
        repeat(5,1fr);

      gap: 15px;

    }


    .platform-card {

      background: white;

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      padding: 22px 17px;

      transition: .2s;

    }


    .platform-card:hover {

      transform:
        translateY(-5px);

      box-shadow:
        var(--shadow);

    }


    .platform-icon {

      width: 50px;

      height: 50px;

      border-radius: 14px;

      display: grid;

      place-items: center;

      background: #eff6ff;

      font-size: 24px;

      margin-bottom: 15px;

    }


    .platform-card h3 {

      color: var(--dark);

      font-size: 16px;

      margin-bottom: 6px;

    }


    .platform-card p {

      color: var(--muted);

      font-size: 12px;

    }


    /* =====================================================
       EDUCATION LEVELS
    ===================================================== */

    .level-grid {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 15px;

    }


    .level-card {

      padding: 22px;

      background: white;

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      transition: .2s;

    }


    .level-card:hover {

      border-color:
        #bfdbfe;

      box-shadow:
        var(--shadow);

    }


    .level-card span {

      font-size: 26px;

    }


    .level-card h3 {

      color: var(--dark);

      margin:
        10px 0 5px;

      font-size: 17px;

    }


    .level-card p {

      color: var(--muted);

      font-size: 13px;

    }


    /* =====================================================
       CONTENT GRID
    ===================================================== */

    .content-grid {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 20px;

    }


    .content-card {

      background: white;

      border:
        1px solid var(--border);

      border-radius: 18px;

      overflow: hidden;

      transition: .2s;

    }


    .content-card:hover {

      transform:
        translateY(-4px);

      box-shadow:
        var(--shadow);

    }


    .content-cover {

      height: 155px;

      display: grid;

      place-items: center;

      font-size: 52px;

      background:
        linear-gradient(
          135deg,
          #dbeafe,
          #ede9fe
        );

    }


    .content-body {

      padding: 19px;

    }


    .tag-row {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 10px;

    }


    .tag {

      display: inline-flex;

      padding:
        5px 9px;

      border-radius: 8px;

      font-size: 10px;

      font-weight: 900;

    }


    .tag-free {

      background: #dcfce7;

      color: #166534;

    }


    .tag-paid {

      background: #fef3c7;

      color: #92400e;

    }


    .tag-premium {

      background: #ede9fe;

      color: #6d28d9;

    }


    .content-card h3 {

      color: var(--dark);

      font-size: 18px;

      margin-bottom: 7px;

    }


    .content-card p {

      color: var(--muted);

      font-size: 13px;

      margin-bottom: 15px;

    }


    .card-footer {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

    }


    .price {

      color: var(--dark);

      font-weight: 900;

    }


    /* =====================================================
       FEATURE SPLIT
    ===================================================== */

    .split {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 30px;

    }


    .feature-box {

      border-radius: 25px;

      padding: 35px;

      min-height: 320px;

      display: flex;

      flex-direction: column;

      justify-content: center;

    }


    .scholarship-box {

      color: white;

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #334155
        );

    }


    .career-box {

      color: white;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

    }


    .feature-box .feature-icon {

      font-size: 40px;

      margin-bottom: 15px;

    }


    .feature-box h2 {

      font-size: 30px;

      margin-bottom: 10px;

    }


    .feature-box p {

      opacity: .85;

      margin-bottom: 20px;

      max-width: 500px;

    }


    /* =====================================================
       AI
    ===================================================== */

    .ai-section {

      background: white;

    }


    .ai-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 40px;

      align-items: center;

    }


    .ai-preview {

      padding: 25px;

      border:
        1px solid var(--border);

      border-radius: 24px;

      background: #f8fafc;

    }


    .chat {

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    .message {

      max-width: 82%;

      padding:
        12px 15px;

      border-radius: 14px;

      font-size: 13px;

    }


    .message.ai {

      background: white;

      border:
        1px solid var(--border);

      color: var(--text);

    }


    .message.user {

      align-self: flex-end;

      background:
        var(--primary);

      color: white;

    }


    .ai-tools {

      display: grid;

      grid-template-columns:
        repeat(2,1fr);

      gap: 12px;

      margin-top: 20px;

    }


    .ai-tool {

      padding: 15px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background: white;

      font-weight: 800;

      font-size: 13px;

    }


    /* =====================================================
       MARKETPLACE
    ===================================================== */

    .marketplace {

      background:
        #f1f5f9;

    }


    .market-grid {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 15px;

    }


    .market-card {

      background: white;

      border:
        1px solid var(--border);

      padding: 20px;

      border-radius: 17px;

    }


    .market-card .emoji {

      font-size: 34px;

      margin-bottom: 12px;

    }


    .market-card h3 {

      color: var(--dark);

      font-size: 16px;

      margin-bottom: 5px;

    }


    .market-card p {

      color: var(--muted);

      font-size: 12px;

    }


    /* =====================================================
       COMMUNITY
    ===================================================== */

    .community-grid {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 20px;

    }


    .community-card {

      background: white;

      border:
        1px solid var(--border);

      border-radius: 18px;

      padding: 22px;

    }


    .avatar-row {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 14px;

    }


    .avatar {

      width: 40px;

      height: 40px;

      border-radius: 50%;

      display: grid;

      place-items: center;

      background: #dbeafe;

    }


    .community-card h3 {

      color: var(--dark);

      font-size: 16px;

      margin-bottom: 7px;

    }


    .community-card p {

      color: var(--muted);

      font-size: 13px;

    }


    /* =====================================================
       PREMIUM
    ===================================================== */

    .premium-section {

      background:
        linear-gradient(
          135deg,
          #eff6ff,
          #faf5ff
        );

    }


    .premium-card {

      max-width: 1000px;

      margin: auto;

      padding: 40px;

      border-radius: 28px;

      background: white;

      border:
        2px solid #bfdbfe;

      box-shadow:
        var(--shadow);

      display: grid;

      grid-template-columns:
        .8fr 1.2fr;

      gap: 35px;

      align-items: center;

    }


    .premium-price {

      color: var(--dark);

      font-size: 40px;

      font-weight: 900;

      margin:
        10px 0 18px;

    }


    .premium-list {

      list-style: none;

      display: grid;

      grid-template-columns:
        repeat(2,1fr);

      gap: 9px;

      margin-bottom: 22px;

    }


    .premium-list li {

      font-size: 13px;

      font-weight: 600;

    }


    /* =====================================================
       STATS
    ===================================================== */

    .stats {

      background: white;

    }


    .stats-grid {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 20px;

    }


    .stat {

      text-align: center;

    }


    .stat strong {

  display: block;

  color: var(--dark);

  font-size: 34px;

}


.stat span {

  color: var(--muted);

  font-size: 13px;

}


/* =====================================================
   CTA
====================================================== */

.cta {

  padding:
    85px 0;

  color: white;

  background:
    linear-gradient(
      135deg,
      #1d4ed8,
      #7c3aed
    );

  text-align: center;

}


.cta h2 {

  font-size:
    clamp(32px,5vw,50px);

  line-height: 1.1;

  margin-bottom: 14px;

}


.cta p {

  max-width: 650px;

  margin:
    0 auto 25px;

  opacity: .88;

}


.cta .btn-white {

  color: var(--primary);

  background: white;

}


/* =====================================================
   FOOTER
====================================================== */

footer {

  padding:
    60px 0 25px;

  color: white;

  background: #020617;

}


.footer-grid {

  display: grid;

  grid-template-columns:
    2fr 1fr 1fr 1fr;

  gap: 40px;

}


footer h3 {

  margin-bottom: 14px;

}


footer p,
footer a {

  color: #94a3b8;

  font-size: 13px;

}


footer a {

  display: block;

  margin:
    8px 0;

}


footer a:hover {

  color: white;

}


.footer-bottom {

  border-top:
    1px solid #1e293b;

  margin-top: 40px;

  padding-top: 20px;

  text-align: center;

  color: #64748b;

  font-size: 12px;

}


/* =====================================================
   TOAST
====================================================== */

.toast {

  position: fixed;

  left: 50%;

  bottom: 25px;

  transform:
    translate(-50%, 100px);

  background:
    #0f172a;

  color: white;

  padding:
    12px 18px;

  border-radius: 12px;

  z-index: 3000;

  opacity: 0;

  transition: .3s;

  font-size: 13px;

}


.toast.show {

  transform:
    translate(-50%, 0);

  opacity: 1;

}


/* =====================================================
   RESPONSIVE
====================================================== */

@media (max-width: 1050px) {

  nav {

    gap: 12px;

  }

  nav a {

    font-size: 12px;

  }

  .platform-grid {

    grid-template-columns:
      repeat(3,1fr);

  }

  .market-grid {

    grid-template-columns:
      repeat(2,1fr);

  }

}


@media (max-width: 850px) {

  .hero-grid,
  .ai-grid,
  .split,
  .premium-card {

    grid-template-columns: 1fr;

  }

  nav {

    display: none;

    position: absolute;

    top: 72px;

    left: 0;

    right: 0;

    padding: 20px;

    background: white;

    border-bottom:
      1px solid var(--border);

    flex-direction: column;

    align-items: flex-start;

  }

  nav.active {

    display: flex;

  }

  .menu-btn {

    display: block;

  }

  .level-grid {

    grid-template-columns:
      repeat(2,1fr);

  }

  .content-grid,
  .community-grid {

    grid-template-columns:
      repeat(2,1fr);

  }

  .stats-grid {

    grid-template-columns:
      repeat(2,1fr);

  }

  .footer-grid {

    grid-template-columns:
      repeat(2,1fr);

  }

}


@media (max-width: 600px) {

  .hero {

    padding:
      55px 0;

  }

  .hero h1 {

    letter-spacing: -2px;

  }

  .search-box {

    flex-direction: column;

  }

  .search-box button {

    min-height: 45px;

  }

  .platform-grid,
  .level-grid,
  .content-grid,
  .community-grid,
  .market-grid {

    grid-template-columns: 1fr;

  }

  .premium-list {

    grid-template-columns: 1fr;

  }

  .footer-grid {

    grid-template-columns: 1fr;

  }

  .nav-actions .btn-outline {

    display: none;

  }

  .hero-buttons {

    flex-direction: column;

  }

  .hero-buttons .btn {

    width: 100%;

  }

  .visual-bottom {

    grid-template-columns: 1fr;

  }

}
