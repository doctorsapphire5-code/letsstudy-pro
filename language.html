<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Language Courses | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f6f8fc;
  color:#172033;
}

.header{
  background:#111827;
  color:#fff;
  position:sticky;
  top:0;
  z-index:50;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:21px;
  font-weight:950;
}

.nav a{
  color:#fff;
  text-decoration:none;
  margin-left:15px;
  font-size:14px;
}

.cart{
  position:relative;
  font-weight:800;
}

.cart-count{
  position:absolute;
  top:-10px;
  right:-12px;
  background:#ef4444;
  color:#fff;
  width:19px;
  height:19px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:10px;
}

.hero{
  background:linear-gradient(
    135deg,
    #172554,
    #2563eb
  );
  color:#fff;
  padding:65px 18px;
}

.hero-inner{
  max-width:1200px;
  margin:auto;
}

.hero h1{
  font-size:clamp(32px,6vw,58px);
  margin:0;
  max-width:750px;
  line-height:1.05;
}

.hero h1 span{
  color:#bfdbfe;
}

.hero p{
  max-width:700px;
  color:#dbeafe;
  line-height:1.7;
  font-size:17px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 18px 70px;
}

.toolbar{
  background:#fff;
  padding:15px;
  border:1px solid #e5e7eb;
  border-radius:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

input,
select{
  border:1px solid #d7dce5;
  padding:12px 13px;
  border-radius:9px;
  outline:none;
}

.search{
  flex:1;
  min-width:220px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 35px #00000012;
}

.thumb{
  height:190px;
  width:100%;
  object-fit:cover;
  background:#e5e7eb;
}

.content{
  padding:17px;
}

.badges{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
}

.language{
  background:#dbeafe;
  color:#1d4ed8;
}

.free{
  background:#dcfce7;
  color:#166534;
}

.paid{
  background:#fce7f3;
  color:#9d174d;
}

.title{
  font-size:18px;
  font-weight:950;
  line-height:1.3;
  margin:7px 0;
}

.description{
  color:#667085;
  font-size:13px;
  line-height:1.6;
  min-height:42px;
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:15px 0;
  font-size:12px;
  color:#667085;
}

.price{
  font-weight:950;
  font-size:18px;
  color:#111827;
}

.btn{
  width:100%;
  border:0;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
  font-weight:900;
  background:#2563eb;
  color:#fff;
}

.btn.free-btn{
  background:#16a34a;
}

.loading,
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px;
  color:#667085;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .nav a:not(.cart){
    display:none;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="nav">

    <div class="logo">
      LetsStudy Pro
    </div>

    <div>

      <a href="courses.html">
        Courses
      </a>

      <a href="resources.html">
        Resources
      </a>

      <a
        href="cart.html"
        class="cart">

        🛒 Cart

        <span
          id="cartCount"
          class="cart-count">
          0
        </span>

      </a>

    </div>

  </div>

</header>


<section class="hero">

  <div class="hero-inner">

    <h1>
      Learn a new language.
      <span>Open a new world.</span>
    </h1>

    <p>
      Explore practical language courses
      designed to help you build confidence,
      improve communication and achieve your
      academic and professional goals.
    </p>

  </div>

</section>


<main class="container">

  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="Search language courses...">

    <select id="language">

      <option value="">
        All Languages
      </option>

      <option>English</option>
      <option>Kiswahili</option>
      <option>French</option>
      <option>Spanish</option>
      <option>German</option>
      <option>Arabic</option>
      <option>Chinese</option>
      <option>Japanese</option>
      <option>Other</option>

    </select>


    <select id="level">

      <option value="">
        All Levels
      </option>

      <option>Beginner</option>
      <option>Intermediate</option>
      <option>Advanced</option>
      <option>Professional</option>

    </select>


    <select id="type">

      <option value="">
        All Courses
      </option>

      <option value="free">
        Free
      </option>

      <option value="paid">
        Paid
      </option>

    </select>

  </div>


  <div
    id="courseGrid"
    class="grid">

    <div class="loading">
      Loading language courses...
    </div>

  </div>

</main>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


let courses = [];


/* =========================================
   SELECTOR
========================================= */

const $ =
  id =>
    document.getElementById(id);


/* =========================================
   ESCAPE
========================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =========================================
   LOAD COURSES
========================================= */

async function loadCourses(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "courses"
        )
      );


    courses =
      snapshot.docs
      .map(
        item => ({
          id:item.id,
          ...item.data()
        })
      )
      .filter(
        course =>

          String(
            course.categoryId ||
            ""
          ).toLowerCase() ===
          "languages"

          &&

          course.status ===
          "published"
      );


    renderCourses();

  }

  catch(error){

    console.error(error);

    $("courseGrid")
      .innerHTML = `

        <div class="empty">

          Unable to load courses.
          Please try again.

        </div>

      `;

  }

}


/* =========================================
   RENDER
========================================= */

function renderCourses(){

  const search =
    $("search")
      .value
      .toLowerCase()
      .trim();


  const language =
    $("language")
      .value;


  const level =
    $("level")
      .value;


  const type =
    $("type")
      .value;


  const filtered =
    courses.filter(
      course => {

        const title =
          String(
            course.title ||
            ""
          ).toLowerCase();


        const description =
          String(
            course.description ||
            ""
          ).toLowerCase();


        const isFree =
          course.isFree === true ||
          Number(
            course.price || 0
          ) === 0;


        return (

          (
            !search ||
            title.includes(search) ||
            description.includes(search)
          )

          &&

          (
            !language ||
            course.language ===
            language
          )

          &&

          (
            !level ||
            course.level ===
            level
          )

          &&

          (
            !type ||
            (
              type === "free" &&
              isFree
            )
            ||
            (
              type === "paid" &&
              !isFree
            )
          )

        );

      }
    );


  if(!filtered.length){

    $("courseGrid")
      .innerHTML = `

        <div class="empty">

          No language courses
          match your search.

        </div>

      `;

    return;

  }


  $("courseGrid")
    .innerHTML =

    filtered
    .map(
      course => {

        const isFree =
          course.isFree === true ||
          Number(
            course.price || 0
          ) === 0;


        const price =
          Number(
            course.discountPrice ??
            course.price ??
            0
          );


        const image =
          course.thumbnail ||
          "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=900";


        return `

          <article
            class="card">

            <img
              class="thumb"
              src="${escapeHTML(image)}"
              alt="${escapeHTML(
                course.title
              )}">


            <div class="content">

              <div class="badges">

                <span
                  class="badge language">

                  ${escapeHTML(
                    course.language ||
                    "Language"
                  )}

                </span>


                <span
                  class="badge ${
                    isFree
                      ? "free"
                      : "paid"
                  }">

                  ${
                    isFree
                      ? "FREE"
                      : "PAID"
                  }

                </span>

              </div>


              <div class="title">

                ${escapeHTML(
                  course.title ||
                  "Language Course"
                )}

              </div>


              <div class="description">

                ${escapeHTML(
                  course.shortDescription ||
                  course.description ||
                  "Learn practical language skills."
                )}

              </div>


              <div class="meta">

                <span>

                  ${escapeHTML(
                    course.level ||
                    "Beginner"
                  )}

                </span>


                <span>

                  ${escapeHTML(
                    course.duration ||
                    "Self-paced"
                  )}

                </span>

              </div>


              <div class="meta">

                <strong class="price">

                  ${
                    isFree
                      ? "Free"
                      :
                      `${escapeHTML(
                        course.currency ||
                        "TZS"
                      )}
                      ${price.toLocaleString()}`
                  }

                </strong>


                <span>

                  ${
                    Number(
                      course.lessonCount ||
                      0
                    )
                  }
                  lessons

                </span>

              </div>


              <button
                class="btn ${
                  isFree
                    ? "free-btn"
                    : ""
                }"
                data-id="${course.id}">

                ${
                  isFree
                    ? "Start Free Course"
                    : "Add to Cart"
                }

              </button>

            </div>

          </article>

        `;

      }
    )
    .join("");


  document
    .querySelectorAll(
      ".btn"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            openCourse(
              button.dataset.id
            );

          }
        );

      }
    );

}


/* =========================================
   COURSE ACTION
========================================= */

function openCourse(id){

  const course =
    courses.find(
      item =>
        item.id === id
    );


  if(!course){

    return;

  }


  const isFree =
    course.isFree === true ||
    Number(
      course.price || 0
    ) === 0;


  /*
    FREE:
    Direct access.

    PAID:
    Add to cart then
    redirect to cart.html.
  */

  if(isFree){

    window.location.href =
      "course-details.html?id=" +
      encodeURIComponent(
        course.id
      );

    return;

  }


  addToCart(course);

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(course){

  let cart = [];


  try{

    cart =
      JSON.parse(
        localStorage.getItem(
          "letsStudyCart"
        )
      ) || [];

  }

  catch(error){

    cart = [];

  }


  const exists =
    cart.some(
      item =>
        item.id ===
        course.id
    );


  if(!exists){

    cart.push({

      id:
        course.id,

      title:
        course.title,

      slug:
        course.slug || "",

      thumbnail:
        course.thumbnail || "",

      categoryId:
        course.categoryId,

      categoryName:
        course.categoryName,

      language:
        course.language,

      price:
        Number(
          course.discountPrice ??
          course.price ??
          0
        ),

      originalPrice:
        Number(
          course.price ||
          0
        ),

      currency:
        course.currency ||
        "TZS",

      quantity:
        1

    });

  }


  localStorage.setItem(
    "letsStudyCart",
    JSON.stringify(cart)
  );


  updateCartCount();


  window.location.href =
    "cart.html";

}


/* =========================================
   CART COUNT
========================================= */

function updateCartCount(){

  let cart = [];


  try{

    cart =
      JSON.parse(
        localStorage.getItem(
          "letsStudyCart"
        )
      ) || [];

  }

  catch(error){

    cart = [];

  }


  $("cartCount")
    .textContent =
    cart.reduce(
      (
        total,
        item
      ) =>
        total +
        Number(
          item.quantity || 1
        ),
      0
    );

}


/* =========================================
   FILTER EVENTS
========================================= */

$("search")
  .addEventListener(
    "input",
    renderCourses
  );


$("language")
  .addEventListener(
    "change",
    renderCourses
  );


$("level")
  .addEventListener(
    "change",
    renderCourses
  );


$("type")
  .addEventListener(
    "change",
    renderCourses
  );


/* =========================================
   START
========================================= */

updateCartCount();

loadCourses();

</script>

</body>
</html>
