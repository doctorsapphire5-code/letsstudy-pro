<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leaderboard | LetsStudy Pro</title>

<meta name="description"
content="LetsStudy Pro student leaderboard. See top students and learning points.">

<meta name="theme-color" content="#2563eb">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

a{
  text-decoration:none;
}

.navbar{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
}

.nav-container{
  max-width:1100px;
  min-height:68px;
  margin:auto;
  padding:0 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;

  color:#2563eb;
  font-size:18px;
  font-weight:800;
}

.logo-icon{
  width:38px;
  height:38px;

  border-radius:10px;

  background:#2563eb;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:11px;
  font-weight:900;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  color:#475569;
  font-size:12px;
  font-weight:600;
}

.menu-btn{
  display:none;

  border:0;
  background:none;

  font-size:25px;
}

main{
  max-width:900px;
  margin:auto;

  padding:35px 20px 60px;
}

.hero{
  text-align:center;

  margin-bottom:25px;
}

.hero-icon{
  width:65px;
  height:65px;

  margin:0 auto 13px;

  border-radius:18px;

  background:#eff6ff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;
}

.hero h1{
  font-size:27px;
  margin-bottom:7px;
}

.hero p{
  color:#64748b;
  font-size:11px;
}

.top-three{
  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:12px;

  margin-bottom:20px;
}

.top-card{
  background:#fff;

  border:1px solid #e2e8f0;

  border-radius:16px;

  padding:20px 12px;

  text-align:center;
}

.top-card.first{
  border-color:#2563eb;
  transform:translateY(-6px);
}

.rank-icon{
  font-size:27px;

  margin-bottom:8px;
}

.avatar{
  width:48px;
  height:48px;

  margin:0 auto 9px;

  border-radius:50%;

  background:#2563eb;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:16px;
  font-weight:800;
}

.top-name{
  font-size:11px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  margin-bottom:5px;
}

.top-points{
  color:#2563eb;

  font-size:10px;
  font-weight:800;
}

.board{
  background:#fff;

  border:1px solid #e2e8f0;

  border-radius:16px;

  overflow:hidden;
}

.board-header{
  padding:17px 18px;

  border-bottom:1px solid #e2e8f0;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.board-header h2{
  font-size:14px;
}

.board-header span{
  color:#94a3b8;
  font-size:8px;
}

.student{
  display:grid;

  grid-template-columns:
  45px 1fr 100px 90px;

  align-items:center;

  gap:10px;

  padding:13px 18px;

  border-bottom:1px solid #f1f5f9;
}

.student:last-child{
  border-bottom:0;
}

.position{
  font-size:10px;
  font-weight:900;

  color:#64748b;

  text-align:center;
}

.student-info{
  display:flex;

  align-items:center;

  gap:10px;

  min-width:0;
}

.small-avatar{
  width:38px;
  height:38px;

  flex-shrink:0;

  border-radius:50%;

  background:#eff6ff;

  color:#2563eb;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:11px;
  font-weight:800;
}

.student-name{
  font-size:10px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.student-level{
  color:#94a3b8;

  font-size:8px;

  margin-top:3px;
}

.points{
  text-align:right;

  color:#2563eb;

  font-size:10px;
  font-weight:800;
}

.badge{
  justify-self:end;

  padding:5px 8px;

  border-radius:6px;

  background:#f1f5f9;

  color:#475569;

  font-size:7px;
  font-weight:800;
}

.current{
  background:#eff6ff;
}

.current .student-name{
  color:#2563eb;
}

.empty{
  text-align:center;

  padding:50px 20px;

  color:#94a3b8;

  font-size:10px;
}

.loading{
  text-align:center;

  padding:50px;

  color:#64748b;

  font-size:10px;
}

.message{
  display:none;

  padding:11px;

  border-radius:8px;

  margin-bottom:15px;

  font-size:9px;
}

.message.show{
  display:block;
}

.message.error{
  background:#fee2e2;
  color:#991b1b;
}

footer{
  text-align:center;

  padding:30px;

  color:#94a3b8;

  font-size:9px;
}

@media(max-width:650px){

  .nav-links{
    display:none;
  }

  .menu-btn{
    display:block;
  }

  .top-three{
    grid-template-columns:1fr;
  }

  .top-card.first{
    transform:none;
  }

  .student{
    grid-template-columns:
    35px 1fr 70px;
  }

  .badge{
    display:none;
  }

}

</style>

</head>


<body>


<header class="navbar">

<div class="nav-container">

<a href="/" class="logo">

<div class="logo-icon">
LS
</div>

LetsStudy Pro

</a>


<nav class="nav-links">

<a href="/">Home</a>
<a href="/courses.html">Courses</a>
<a href="/resources.html">Resources</a>
<a href="/profile.html">Profile</a>

</nav>


<button
id="menuBtn"
class="menu-btn">

☰

</button>

</div>

</header>



<main>


<section class="hero">

<div class="hero-icon">
🏆
</div>

<h1>
Leaderboard
</h1>

<p>
See the top learners on LetsStudy Pro.
</p>

</section>



<div
id="message"
class="message">
</div>



<section
id="topThree"
class="top-three">

<div class="loading">
Loading leaderboard...
</div>

</section>



<section class="board">

<div class="board-header">

<h2>
Top Students
</h2>

<span id="studentCount">
0 students
</span>

</div>


<div
id="leaderboard">

<div class="loading">
Loading students...
</div>

</div>

</section>


</main>



<footer>

© 2026 LetsStudy Pro. All rights reserved.

</footer>



<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getDatabase,
  ref,
  get
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(
  firebaseConfig
);

const db =
getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const topThree =
document.getElementById(
  "topThree"
);

const leaderboard =
document.getElementById(
  "leaderboard"
);

const studentCount =
document.getElementById(
  "studentCount"
);

const message =
document.getElementById(
  "message"
);


/* =========================
   GET INITIALS
========================= */

function initials(
name
){

  const text =
  String(
    name || "Student"
  ).trim();


  if(!text){
    return "S";
  }


  const parts =
  text.split(
    /\s+/
  );


  if(
    parts.length === 1
  ){

    return parts[0]
    .substring(
      0,
      2
    )
    .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  )
  .toUpperCase();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   LOAD STUDENTS
========================= */

async function loadLeaderboard(){

  try{

    const snapshot =
    await get(
      ref(
        db,
        "users"
      )
    );


    if(
      !snapshot.exists()
    ){

      showEmpty();

      return;

    }


    const data =
    snapshot.val();


    let students =
    Object.entries(
      data
    )
    .map(
      ([id,user]) => ({

        id,

        ...user

      })
    )
    .filter(
      user =>
      user.role !== "admin" &&
      user.role !== "superadmin"
    );


    /*
     * Supports:
     * points
     * xp
     * score
     */

    students =
    students.map(
      user => ({

        ...user,

        points:
        Number(
          user.points ??
          user.xp ??
          user.score ??
          0
        )

      })
    );


    students.sort(
      (a,b) =>
      b.points -
      a.points
    );


    studentCount.textContent =
    students.length +
    (
      students.length === 1
      ? " student"
      : " students"
    );


    renderTopThree(
      students.slice(
        0,
        3
      )
    );


    renderLeaderboard(
      students
    );


  }catch(error){

    console.error(
      "Leaderboard error:",
      error
    );


    showError();

  }

}


/* =========================
   TOP THREE
========================= */

function renderTopThree(
students
){

  topThree.innerHTML =
  "";


  if(
    students.length === 0
  ){

    topThree.innerHTML = `

      <div class="empty">

        No students available yet.

      </div>

    `;

    return;

  }


  const order =
  [
    {
      index:1,
      icon:"🥇",
      className:"first"
    },

    {
      index:0,
      icon:"🥈",
      className:""
    },

    {
      index:2,
      icon:"🥉",
      className:""
    }
  ];


  order.forEach(
    item => {

      const student =
      students[
        item.index
      ];


      if(!student){
        return;
      }


      const name =
      student.displayName ||
      student.name ||
      student.username ||
      "Student";


      const card =
      document.createElement(
        "div"
      );


      card.className =
      "top-card " +
      item.className;


      card.innerHTML = `

        <div class="rank-icon">

          ${item.icon}

        </div>


        <div class="avatar">

          ${escapeHTML(
            initials(name)
          )}

        </div>


        <div class="top-name">

          ${escapeHTML(name)}

        </div>


        <div class="top-points">

          ${Number(
            student.points || 0
          ).toLocaleString()}
          XP

        </div>

      `;


      topThree.appendChild(
        card
      );

    }
  );

}


/* =========================
   FULL LEADERBOARD
========================= */

function renderLeaderboard(
students
){

  leaderboard.innerHTML =
  "";


  if(
    students.length === 0
  ){

    showEmpty();

    return;

  }


  students.forEach(
    (student,index) => {

      const position =
      index + 1;


      const name =
      student.displayName ||
      student.name ||
      student.username ||
      "Student";


      const level =
      student.level ||
      student.form ||
      student.class ||
      "Student";


      const points =
      Number(
        student.points ||
        0
      );


      const row =
      document.createElement(
        "div"
      );


      row.className =
      "student";


      row.innerHTML = `

        <div class="position">

          #${position}

        </div>


        <div class="student-info">

          <div class="small-avatar">

            ${escapeHTML(
              initials(name)
            )}

          </div>


          <div>

            <div class="student-name">

              ${escapeHTML(name)}

            </div>


            <div class="student-level">

              ${escapeHTML(level)}

            </div>

          </div>

        </div>


        <div class="points">

          ${points.toLocaleString()}
          XP

        </div>


        <div class="badge">

          ${getRank(position)}

        </div>

      `;


      leaderboard.appendChild(
        row
      );

    }
  );

}


/* =========================
   RANK
========================= */

function getRank(
position
){

  if(
    position === 1
  ){

    return "Champion";

  }


  if(
    position <= 3
  ){

    return "Top 3";

  }


  if(
    position <= 10
  ){

    return "Top 10";

  }


  return "Learner";

}


/* =========================
   EMPTY
========================= */

function showEmpty(){

  topThree.innerHTML = `

    <div class="empty">

      No students available yet.

    </div>

  `;


  leaderboard.innerHTML = `

    <div class="empty">

      Start learning to appear on the leaderboard.

    </div>

  `;


  studentCount.textContent =
  "0 students";

}


/* =========================
   ERROR
========================= */

function showError(){

  message.textContent =
  "Unable to load leaderboard. Please try again.";

  message.className =
  "message show error";


  topThree.innerHTML =
  "";


  leaderboard.innerHTML = `

    <div class="empty">

      Unable to load leaderboard.

    </div>

  `;

}


/* =========================
   MOBILE MENU
========================= */

document
.getElementById(
"menuBtn"
)
.addEventListener(
"click",
function(){

  document
  .querySelector(
    ".nav-links"
  )
  .classList.toggle(
    "active"
  );

});


/* =========================
   START
========================= */

loadLeaderboard();

</script>

</body>

</html>
