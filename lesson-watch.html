<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Lesson | LetsStudy Pro</title>

<meta
  name="description"
  content="Watch and study your LetsStudy Pro course lesson."
>

<meta
  name="robots"
  content="noindex,nofollow"
>

<link
  rel="icon"
  href="favicon.ico"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  font-weight:800;
  font-size:20px;
  color:#111827;
  text-decoration:none;
}

.logo span{
  color:#2563eb;
}

.back-btn{
  border:0;
  background:#eef2ff;
  color:#1d4ed8;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  transition:.2s ease;
}

.back-btn:hover{
  background:#dbeafe;
}

/* PAGE */

.page{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 50px;
}

/* COURSE LINK */

.course-link{
  color:#2563eb;
  text-decoration:none;
  font-weight:700;
}

.course-link:hover{
  text-decoration:underline;
}

/* LESSON HEADER */

.lesson-header{
  margin:20px 0;
}

.lesson-header h1{
  margin:8px 0;
  font-size:clamp(26px,5vw,42px);
  line-height:1.2;
}

.lesson-header p{
  color:#667085;
  line-height:1.7;
  margin:0;
}

/* META */

.lesson-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.meta-item{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:999px;
  padding:8px 13px;
  color:#475467;
  font-size:14px;
}

/* PLAYER */

.player-card{
  background:#111827;
  border-radius:18px;
  overflow:hidden;
  min-height:300px;
  box-shadow:
    0 15px 40px rgba(0,0,0,.12);
}

.player{
  width:100%;
  min-height:500px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.player iframe,
.player video{
  width:100%;
  height:500px;
  border:0;
  display:block;
}

.player video{
  background:#000;
}

.player audio{
  width:min(700px,90%);
}

/* TEXT */

.text-content{
  background:#fff;
  padding:30px;
  border-radius:15px;
  line-height:1.8;
  white-space:pre-wrap;
  color:#344054;
  width:100%;
  min-height:300px;
  overflow-wrap:anywhere;
}

/* PDF */

.pdf-frame{
  width:100%;
  height:650px;
  border:0;
  background:#fff;
}

/* LESSON BODY */

.lesson-body{
  margin-top:25px;
  display:grid;
  grid-template-columns:1fr 320px;
  gap:25px;
}

.content-card,
.sidebar-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:24px;
}

.content-card h2,
.sidebar-card h3{
  margin-top:0;
}

/* DESCRIPTION */

.description{
  color:#475467;
  line-height:1.8;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/* SIDEBAR */

.sidebar-item{
  padding:12px 0;
  border-bottom:1px solid #eef0f3;
}

.sidebar-item:last-child{
  border-bottom:0;
}

.sidebar-label{
  font-size:12px;
  color:#98a2b3;
  text-transform:uppercase;
  font-weight:700;
  margin-bottom:4px;
}

.sidebar-value{
  font-weight:600;
  color:#344054;
  word-break:break-word;
}

/* LOADING / ERROR / EMPTY */

.loading,
.error,
.empty{
  min-height:300px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  color:#667085;
}

.loading i,
.error>i,
.empty>i{
  font-size:42px;
  margin-bottom:15px;
}

.error h2,
.empty h2{
  color:#1d2939;
  margin:5px 0 10px;
}

.error p,
.empty p{
  max-width:650px;
  line-height:1.7;
}

/* BUTTON */

.retry-btn{
  margin-top:15px;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:11px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:8px;
}

.retry-btn:hover{
  background:#1d4ed8;
}

/* NAVIGATION */

.navigation{
  margin-top:25px;
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.nav-btn{
  border:1px solid #d0d5dd;
  background:#fff;
  color:#344054;
  padding:12px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  transition:.2s ease;
}

.nav-btn:hover:not(:disabled){
  background:#f9fafb;
}

.nav-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* FOOTER */

.footer{
  text-align:center;
  padding:35px 20px;
  color:#98a2b3;
  font-size:14px;
}

.player-card a{
  color:inherit;
}

/* RESPONSIVE */

@media(max-width:850px){

  .lesson-body{
    grid-template-columns:1fr;
  }

  .player,
  .player iframe,
  .player video{
    min-height:300px;
    height:300px;
  }

  .pdf-frame{
    height:500px;
  }

}

@media(max-width:600px){

  .header-inner{
    padding:12px 14px;
  }

  .page{
    padding:18px 14px 40px;
  }

  .logo{
    font-size:17px;
  }

  .back-btn{
    padding:8px 10px;
  }

  .player,
  .player iframe,
  .player video{
    height:240px;
    min-height:240px;
  }

  .content-card,
  .sidebar-card{
    padding:18px;
  }

  .text-content{
    padding:20px;
  }

  .navigation{
    flex-direction:column;
  }

  .nav-btn{
    width:100%;
  }

}

</style>

</head>


<body>

<header class="header">

  <div class="header-inner">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >

      <i class="fa-solid fa-arrow-left"></i>

      Back

    </button>


    <a
      class="logo"
      href="index-auth.html"
    >

      LetsStudy <span>Pro</span>

    </a>

  </div>

</header>


<main class="page">

  <div id="pageContent">

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>
        Loading lesson...
      </p>

    </div>

  </div>

</main>


<footer class="footer">

  © <span id="year"></span>

  LetsStudy Pro ·
  Learn. Build. Work. Grow.

</footer>


<script type="module">


/* =====================================================
   FIREBASE IMPORTS
   NO AUTH
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRg0rj0odBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


/* =====================================================
   DOM
===================================================== */

const pageContent =
  document.getElementById(
    "pageContent"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );


const yearElement =
  document.getElementById(
    "year"
  );


yearElement.textContent =
  new Date().getFullYear();


/* =====================================================
   URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const lessonId =
  (
    params.get("id") ||
    params.get("lessonId") ||
    ""
  )
  .trim();


/* =====================================================
   STATE
===================================================== */

let currentLesson =
  null;


let currentCourse =
  null;


let relatedLessons =
  [];


let currentIndex =
  -1;


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    const courseId =
      getCourseId(
        currentLesson
      );


    if(courseId){

      window.location.href =
        `course-lessons.html?courseId=${
          encodeURIComponent(
            courseId
          )
        }`;

      return;

    }


    if(
      window.history.length > 1
    ){

      window.history.back();

    }else{

      window.location.href =
        "courses.html";

    }

  }
);


/* =====================================================
   START
===================================================== */

loadLesson();


/* =====================================================
   LOAD LESSON
===================================================== */

async function loadLesson(){

  if(!lessonId){

    showError(
      "Lesson ID is missing."
    );

    return;

  }


  try{

    const lessonRef =
      doc(
        db,
        "lessons",
        lessonId
      );


    const lessonSnap =
      await getDoc(
        lessonRef
      );


    if(
      !lessonSnap.exists()
    ){

      showError(
        "Lesson not found."
      );

      return;

    }


    currentLesson = {

      id:
        lessonSnap.id,

      ...lessonSnap.data()

    };


    /* =================================================
       STATUS
    ================================================= */

    const status =
      String(
        currentLesson.status ||
        ""
      )
      .toLowerCase()
      .trim();


    /*
      Empty status is allowed.

      Published and active are allowed.

      Other statuses are hidden.
    */

    if(
      status &&
      ![
        "published",
        "active"
      ].includes(status)
    ){

      showError(
        "This lesson is not currently available."
      );

      return;

    }


    /* =================================================
       COURSE
    ================================================= */

    const courseId =
      getCourseId(
        currentLesson
      );


    if(!courseId){

      showError(
        "This lesson is not linked to a course."
      );

      return;

    }


    await loadCourse(
      courseId
    );


    await loadRelatedLessons(
      courseId
    );


    renderPage();


  }catch(error){

    console.error(
      "Lesson loading error:",
      error
    );


    showError(
      error.message ||
      "Unable to load this lesson."
    );

  }

}


/* =====================================================
   COURSE ID
===================================================== */

function getCourseId(
  lesson
){

  if(!lesson){

    return "";

  }


  return String(

    lesson.courseId ||

    lesson.courseID ||

    lesson.course ||

    ""

  ).trim();

}


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse(
  courseId
){

  try{

    const courseSnap =
      await getDoc(
        doc(
          db,
          "courses",
          courseId
        )
      );


    if(
      courseSnap.exists()
    ){

      currentCourse = {

        id:
          courseSnap.id,

        ...courseSnap.data()

      };

    }else{

      currentCourse = {

        id:
          courseId,

        title:
          "Course"

      };

    }

  }catch(error){

    console.warn(
      "Course loading failed:",
      error
    );


    currentCourse = {

      id:
        courseId,

      title:
        "Course"

    };

  }

}


/* =====================================================
   LOAD RELATED LESSONS
===================================================== */

async function loadRelatedLessons(
  courseId
){

  relatedLessons = [];


  /*
    Primary query.
  */

  try{

    const q =
      query(
        collection(
          db,
          "lessons"
        ),
        where(
          "courseId",
          "==",
          courseId
        )
      );


    const snapshot =
      await getDocs(q);


    snapshot.forEach(
      lessonDoc => {

        const data =
          lessonDoc.data();


        const status =
          String(
            data.status ||
            ""
          )
          .toLowerCase()
          .trim();


        if(
          !status ||
          status === "published" ||
          status === "active"
        ){

          relatedLessons.push({

            id:
              lessonDoc.id,

            ...data

          });

        }

      }
    );


  }catch(error){

    console.warn(
      "Primary lesson query failed:",
      error
    );


    /*
      Fallback for courseID/course.
    */

    try{

      const snapshot =
        await getDocs(
          collection(
            db,
            "lessons"
          )
        );


      snapshot.forEach(
        lessonDoc => {

          const data =
            lessonDoc.data();


          const lessonCourse =
            getCourseId(
              data
            );


          const status =
            String(
              data.status ||
              ""
            )
            .toLowerCase()
            .trim();


          if(
            String(
              lessonCourse
            ) === String(
              courseId
            ) &&
            (
              !status ||
              status === "published" ||
              status === "active"
            )
          ){

            relatedLessons.push({

              id:
                lessonDoc.id,

              ...data

            });

          }

        }
      );


    }catch(fallbackError){

      console.error(
        "Fallback lessons error:",
        fallbackError
      );

    }

  }


  /*
    Make sure current lesson
    is included.
  */

  const exists =
    relatedLessons.some(
      lesson =>
        lesson.id ===
        lessonId
    );


  if(
    !exists &&
    currentLesson
  ){

    relatedLessons.push(
      currentLesson
    );

  }


  /*
    SORT LESSONS
  */

  relatedLessons.sort(
    (a,b) => {

      const moduleA =
        String(
          a.moduleOrder ??
          a.modulePosition ??
          a.moduleId ??
          a.moduleID ??
          a.module ??
          ""
        );


      const moduleB =
        String(
          b.moduleOrder ??
          b.modulePosition ??
          b.moduleId ??
          b.moduleID ??
          b.module ??
          ""
        );


      const moduleCompare =
        moduleA.localeCompare(
          moduleB,
          undefined,
          {
            numeric:true
          }
        );


      if(
        moduleCompare !== 0
      ){

        return moduleCompare;

      }


      const orderA =
        Number(
          a.order ??
          a.lessonOrder ??
          a.position ??
          0
        );


      const orderB =
        Number(
          b.order ??
          b.lessonOrder ??
          b.position ??
          0
        );


      return (
        orderA -
        orderB
      );

    }
  );


  currentIndex =
    relatedLessons.findIndex(
      lesson =>
        lesson.id ===
        lessonId
    );

}


/* =====================================================
   RENDER PAGE
===================================================== */

function renderPage(){

  const lesson =
    currentLesson;


  const title =
    lesson.title ||
    lesson.name ||
    lesson.lessonTitle ||
    "Untitled Lesson";


  const description =
    lesson.description ||
    lesson.summary ||
    "";


  const type =
    lesson.type ||
    lesson.lessonType ||
    "lesson";


  const duration =
    lesson.duration ||
    lesson.length ||
    "Not specified";


  const order =
    lesson.order ??
    lesson.lessonOrder ??
    lesson.position ??
    "";


  const moduleId =
    lesson.moduleId ||
    lesson.moduleID ||
    lesson.module ||
    "Not specified";


  const courseId =
    getCourseId(
      lesson
    );


  const courseTitle =
    currentCourse?.title ||
    currentCourse?.name ||
    currentCourse?.courseTitle ||
    currentCourse?.courseName ||
    "Course";


  document.title =
    `${title} | LetsStudy Pro`;


  pageContent.innerHTML = `

    <!-- LESSON HEADER -->

    <div class="lesson-header">

      <a
        class="course-link"
        href="course-lessons.html?courseId=${encodeURIComponent(courseId)}"
      >

        <i class="fa-solid fa-book"></i>

        ${escapeHTML(
          String(courseTitle)
        )}

      </a>


      <h1>

        ${escapeHTML(
          String(title)
        )}

      </h1>


      ${
        description
          ? `
            <p>

              ${escapeHTML(
                String(description)
              )}

            </p>
          `
          : ""
      }


      <div class="lesson-meta">

        <span class="meta-item">

          <i
            class="${getIcon(type)}"
          ></i>

          ${escapeHTML(
            String(type)
          )}

        </span>


        <span class="meta-item">

          <i
            class="fa-regular fa-clock"
          ></i>

          ${escapeHTML(
            String(duration)
          )}

        </span>


        <span class="meta-item">

          <i
            class="fa-solid fa-layer-group"
          ></i>

          Module:
          ${escapeHTML(
            String(moduleId)
          )}

        </span>


        ${
          order !== ""
            ? `
              <span class="meta-item">

                <i
                  class="fa-solid fa-list-ol"
                ></i>

                Lesson:
                ${escapeHTML(
                  String(order)
                )}

              </span>
            `
            : ""
        }

      </div>

    </div>


    <!-- PLAYER -->

    <div class="player-card">

      <div
        class="player"
        id="player"
      >

        ${renderLessonContent(
          lesson
        )}

      </div>

    </div>


    <!-- BODY -->

    <div class="lesson-body">


      <section class="content-card">

        <h2>

          <i
            class="fa-solid fa-circle-info"
          ></i>

          About This Lesson

        </h2>

        <br>


        <div class="description">

          ${
            description
              ? escapeHTML(
                  String(description)
                )
              : "No additional description available."
          }

        </div>


        ${
          lesson.content ||
          lesson.text ||
          lesson.body
            ? `
              <br>

              <h2>

                <i
                  class="fa-solid fa-file-lines"
                ></i>

                Lesson Content

              </h2>

              <br>

              <div class="description">

                ${escapeHTML(
                  String(
                    lesson.content ||
                    lesson.text ||
                    lesson.body ||
                    ""
                  )
                )}

              </div>
            `
            : ""
        }

      </section>


      <aside class="sidebar-card">

        <h3>

          <i
            class="fa-solid fa-book-open"
          ></i>

          Course Information

        </h3>


        <div class="sidebar-item">

          <div class="sidebar-label">
            Course
          </div>

          <div class="sidebar-value">

            ${escapeHTML(
              String(courseTitle)
            )}

          </div>

        </div>


        <div class="sidebar-item">

          <div class="sidebar-label">
            Lesson
          </div>

          <div class="sidebar-value">

            ${escapeHTML(
              String(title)
            )}

          </div>

          </div>


          <div class="sidebar-item">

            <div class="sidebar-label">
              Type
            </div>

            <div class="sidebar-value">

              ${escapeHTML(
                String(type)
              )}

            </div>

          </div>


          <div class="sidebar-item">

            <div class="sidebar-label">
              Duration
            </div>

            <div class="sidebar-value">

              ${escapeHTML(
                String(duration)
              )}

            </div>

          </div>


          <div class="sidebar-item">

            <div class="sidebar-label">
              Module
            </div>

            <div class="sidebar-value">

              ${escapeHTML(
                String(moduleId)
              )}

            </div>

          </div>


          ${
            order !== ""
              ? `
                <div class="sidebar-item">

                  <div class="sidebar-label">
                    Lesson Number
                  </div>

                  <div class="sidebar-value">

                    ${escapeHTML(
                      String(order)
                    )}

                  </div>

                </div>
              `
              : ""
          }

        </aside>

      </div>


      <!-- PREVIOUS / NEXT -->

      <div class="navigation">

        <button
          class="nav-btn"
          id="previousBtn"
          type="button"
          ${currentIndex <= 0 ? "disabled" : ""}
        >

          <i
            class="fa-solid fa-arrow-left"
          ></i>

          Previous Lesson

        </button>


        <button
          class="nav-btn"
          id="nextBtn"
          type="button"
          ${
            currentIndex === -1 ||
            currentIndex >= relatedLessons.length - 1
              ? "disabled"
              : ""
          }
        >

          Next Lesson

          <i
            class="fa-solid fa-arrow-right"
          ></i>

        </button>

      </div>

  `;


  setupNavigation();

}


/* =====================================================
   NAVIGATION
===================================================== */

function setupNavigation(){

  const previousBtn =
    document.getElementById(
      "previousBtn"
    );


  const nextBtn =
    document.getElementById(
      "nextBtn"
    );


  if(previousBtn){

    previousBtn.addEventListener(
      "click",
      () => {

        if(
          currentIndex <= 0
        ){

          return;

        }


        const previousLesson =
          relatedLessons[
            currentIndex - 1
          ];


        if(
          previousLesson &&
          previousLesson.id
        ){

          window.location.href =
            `lesson-watch.html?id=${
              encodeURIComponent(
                previousLesson.id
              )
            }`;

        }

      }
    );

  }


  if(nextBtn){

    nextBtn.addEventListener(
      "click",
      () => {

        if(
          currentIndex === -1 ||
          currentIndex >=
          relatedLessons.length - 1
        ){

          return;

        }


        const nextLesson =
          relatedLessons[
            currentIndex + 1
          ];


        if(
          nextLesson &&
          nextLesson.id
        ){

          window.location.href =
            `lesson-watch.html?id=${
              encodeURIComponent(
                nextLesson.id
              )
            }`;

        }

      }
    );

  }

}


/* =====================================================
   LESSON CONTENT
===================================================== */

function renderLessonContent(
  lesson
){

  const type =
    String(
      lesson.type ||
      lesson.lessonType ||
      ""
    )
    .toLowerCase()
    .trim();


  const url =
    lesson.contentUrl ||
    lesson.videoUrl ||
    lesson.fileUrl ||
    lesson.pdfUrl ||
    lesson.audioUrl ||
    lesson.url ||
    lesson.link ||
    "";


  const content =
    lesson.content ||
    lesson.text ||
    lesson.body ||
    "";


  /* YOUTUBE */

  if(
    isYouTube(url) ||
    type.includes("youtube")
  ){

    const videoId =
      getYouTubeId(
        url
      );


    if(videoId){

      return `

        <iframe
          src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}"
          title="YouTube Lesson"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          loading="lazy"
        ></iframe>

      `;

    }

  }


  /* VIMEO */

  if(
    isVimeo(url) ||
    type.includes("vimeo")
  ){

    const videoId =
      getVimeoId(
        url
      );


    if(videoId){

      return `

        <iframe
          src="https://player.vimeo.com/video/${encodeURIComponent(videoId)}"
          title="Vimeo Lesson"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen
          loading="lazy"
        ></iframe>

      `;

    }

  }


  /* DIRECT VIDEO */

  if(
    type.includes("video") ||
    /\.(mp4|webm|ogg|mov)(?:[?#]|$)/i.test(
      String(url)
    )
  ){

    const safe =
      safeUrl(
        url
      );


    if(safe){

      return `

        <video
          controls
          playsinline
          preload="metadata"
        >

          <source
            src="${safe}"
          >

          Your browser does not support video playback.

        </video>

      `;

    }

  }


  /* AUDIO */

  if(
    type.includes("audio") ||
    /\.(mp3|wav|m4a|aac|ogg)(?:[?#]|$)/i.test(
      String(url)
    )
  ){

    const safe =
      safeUrl(
        url
      );


    if(safe){

      return `

        <div
          style="
            width:100%;
            min-height:300px;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            gap:20px;
            padding:30px;
            color:#fff;
          "
        >

          <i
            class="fa-solid fa-headphones"
            style="font-size:60px;"
          ></i>


          <h2>
            Audio Lesson
          </h2>


          <audio controls>

            <source
              src="${safe}"
            >

            Your browser does not support audio playback.

          </audio>

        </div>

      `;

    }

  }


  /* PDF */

  if(
    type.includes("pdf") ||
    /\.pdf(?:[?#]|$)/i.test(
      String(url)
    )
  ){

    const safe =
      safeUrl(
        url
      );


    if(safe){

      return `

        <iframe
          class="pdf-frame"
          src="${safe}"
          title="PDF Lesson"
          loading="lazy"
        ></iframe>

      `;

    }

  }


  /* TEXT / ARTICLE */

  if(
    type.includes("text") ||
    type.includes("article") ||
    type.includes("reading")
  ){

    if(content){

      return `

        <div class="text-content">

          ${escapeHTML(
            String(content)
          )}

        </div>

      `;

    }

  }


  /* LIVE LESSON */

  if(
    type.includes("live")
  ){

    const safe =
      safeUrl(
        url
      );


    if(safe){

      return `

        <div
          style="
            width:100%;
            min-height:300px;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            gap:15px;
            padding:30px;
            text-align:center;
            color:#fff;
          "
        >

          <i
            class="fa-solid fa-tower-broadcast"
            style="font-size:60px;"
          ></i>


          <h2>
            Live Lesson
          </h2>


          <p>
            Join the live lesson using the button below.
          </p>


          <a
            class="retry-btn"
            href="${safe}"
            target="_blank"
            rel="noopener noreferrer"
          >

            <i
              class="fa-solid fa-arrow-up-right-from-square"
            ></i>

            Join Live Lesson

          </a>

        </div>

      `;

    }

  }


  /* EXTERNAL RESOURCE */

  if(url){

    const safe =
      safeUrl(
        url
      );


    if(safe){

      return `

        <div
          style="
            width:100%;
            min-height:300px;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            gap:15px;
            padding:30px;
            text-align:center;
            color:#fff;
          "
        >

          <i
            class="fa-solid fa-link"
            style="font-size:55px;"
          ></i>


          <h2>
            Lesson Resource
          </h2>


          <p>
            Open the lesson resource below.
          </p>


          <a
            class="retry-btn"
            href="${safe}"
            target="_blank"
            rel="noopener noreferrer"
          >

            <i
              class="fa-solid fa-arrow-up-right-from-square"
            ></i>

            Open Resource

          </a>

        </div>

      `;

    }

  }


  /* RAW CONTENT FALLBACK */

  if(content){

    return `

      <div class="text-content">

        ${escapeHTML(
          String(content)
        )}

      </div>

    `;

  }


  /* NOTHING */

  return `

    <div class="empty">

      <i
        class="fa-solid fa-file-circle-question"
      ></i>


      <h2>
        No Lesson Content
      </h2>


      <p>
        This lesson does not have content available yet.
      </p>

    </div>

  `;

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(
  value
){

  try{

    const raw =
      String(
        value || ""
      );


    const url =
      new URL(
        raw
      );


    if(
      url.hostname.includes(
        "youtu.be"
      )
    ){

      return url.pathname
        .replace(
          /^\/+/,
          ""
        )
        .split("/")[0];

    }


    if(
      url.hostname.includes(
        "youtube.com"
      ) ||
      url.hostname.includes(
        "youtube-nocookie.com"
      )
    ){

      const watchId =
        url.searchParams.get(
          "v"
        );


      if(watchId){

        return watchId;

      }


      const parts =
        url.pathname
          .split("/")
          .filter(Boolean);


      const embedIndex =
        parts.indexOf(
          "embed"
        );


      if(
        embedIndex !== -1 &&
        parts[embedIndex + 1]
      ){

        return parts[
          embedIndex + 1
        ];

      }


      const shortsIndex =
        parts.indexOf(
          "shorts"
        );


      if(
        shortsIndex !== -1 &&
        parts[shortsIndex + 1]
      ){

        return parts[
          shortsIndex + 1
        ];

      }

    }

  }catch(error){

    console.warn(
      "Invalid YouTube URL:",
      error
    );

  }


  return "";

}


/* =====================================================
   VIMEO ID
===================================================== */

function getVimeoId(
  value
){

  const match =
    String(
      value || ""
    )
    .match(
      /vimeo\.com\/(?:video\/)?(\d+)/i
    );


  return match
    ? match[1]
    : "";

}


/* =====================================================
   PLATFORM CHECK
===================================================== */

function isYouTube(
  value
){

  return /(?:youtube\.com|youtu\.be)/i
    .test(
      String(
        value || ""
      )
    );

}


function isVimeo(
  value
){

  return /vimeo\.com/i
    .test(
      String(
        value || ""
      )
    );

}


/* =====================================================
   ICON
===================================================== */

function getIcon(
  type
){

  const value =
    String(
      type || ""
    )
    .toLowerCase();


  if(
    value.includes("video") ||
    value.includes("youtube") ||
    value.includes("vimeo")
  ){

    return "fa-solid fa-circle-play";

  }


  if(
    value.includes("audio")
  ){

    return "fa-solid fa-headphones";

  }


  if(
    value.includes("pdf")
  ){

    return "fa-solid fa-file-pdf";

  }


  if(
    value.includes("text") ||
    value.includes("article") ||
    value.includes("reading")
  ){

    return "fa-solid fa-file-lines";

  }


  if(
    value.includes("live")
  ){

    return "fa-solid fa-tower-broadcast";

  }


  if(
    value.includes("quiz")
  ){

    return "fa-solid fa-circle-question";

  }


  return "fa-solid fa-book-open";

}


/* =====================================================
   SAFE URL
===================================================== */

function safeUrl(
  value
){

  try{

    const url =
      new URL(
        String(
          value || ""
        ),
        window.location.href
      );


    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return escapeHTML(
        url.href
      );

    }


    return "";

  }catch(error){

    return "";

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
){

  pageContent.innerHTML = `

    <div class="error">

      <i
        class="fa-solid fa-triangle-exclamation"
      ></i>


      <h2>
        Unable to Load Lesson
      </h2>


      <p>

        ${escapeHTML(
          String(message)
        )}

      </p>


      <button
        class="retry-btn"
        type="button"
        id="retryBtn"
      >

        <i
          class="fa-solid fa-rotate-right"
        ></i>

        Try Again

      </button>

    </div>

  `;


  const retryBtn =
    document.getElementById(
      "retryBtn"
    );


  if(retryBtn){

    retryBtn.addEventListener(
      "click",
      () => {

        window.location.reload();

      }
    );

  }

}
