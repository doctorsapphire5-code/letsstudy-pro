<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Lesson | LetsStudy Pro</title>

<meta
  name="description"
  content="Watch and study your LetsStudy Pro course lesson."
>

<meta
  name="robots"
  content="noindex,nofollow"
>

<link
  rel="icon"
  href="favicon.ico"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  background: #f5f7fb;
  color: #172033;
}

button,
input,
textarea,
select {
  font-family: inherit;
}

/* HEADER */

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  font-weight: 800;
  font-size: 20px;
  color: #111827;
  text-decoration: none;
}

.logo span {
  color: #2563eb;
}

.back-btn {
  border: 0;
  background: #eef2ff;
  color: #1d4ed8;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  transition: .2s ease;
}

.back-btn:hover {
  background: #dbeafe;
}

/* PAGE */

.page {
  max-width: 1200px;
  margin: auto;
  padding: 25px 20px 50px;
}

/* COURSE LINK */

.course-link {
  color: #2563eb;
  text-decoration: none;
  font-weight: 700;
}

.course-link:hover {
  text-decoration: underline;
}

/* LESSON HEADER */

.lesson-header {
  margin: 20px 0;
}

.lesson-header h1 {
  margin: 8px 0;
  font-size: clamp(26px, 5vw, 42px);
  line-height: 1.2;
}

.lesson-header p {
  color: #667085;
  line-height: 1.7;
  margin: 0;
}

/* META */

.lesson-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

.meta-item {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 999px;
  padding: 8px 13px;
  color: #475467;
  font-size: 14px;
}

/* PLAYER */

.player-card {
  background: #111827;
  border-radius: 18px;
  overflow: hidden;
  min-height: 300px;
  box-shadow:
    0 15px 40px rgba(0,0,0,.12);
}

.player {
  width: 100%;
  min-height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.player iframe,
.player video {
  width: 100%;
  height: 500px;
  border: 0;
  display: block;
}

.player video {
  background: #000000;
}

.player audio {
  width: min(700px, 90%);
}

/* TEXT CONTENT */

.text-content {
  background: #ffffff;
  padding: 30px;
  border-radius: 15px;
  line-height: 1.8;
  white-space: pre-wrap;
  color: #344054;
  width: 100%;
  min-height: 300px;
  overflow-wrap: anywhere;
}

/* PDF */

.pdf-frame {
  width: 100%;
  height: 650px;
  border: 0;
  background: #ffffff;
}

/* LESSON BODY */

.lesson-body {
  margin-top: 25px;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 25px;
}

.content-card,
.sidebar-card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 24px;
}

.content-card h2,
.sidebar-card h3 {
  margin-top: 0;
}

/* DESCRIPTION */

.description {
  color: #475467;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* SIDEBAR */

.sidebar-item {
  padding: 12px 0;
  border-bottom: 1px solid #eef0f3;
}

.sidebar-item:last-child {
  border-bottom: 0;
}

.sidebar-label {
  font-size: 12px;
  color: #98a2b3;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 4px;
}

.sidebar-value {
  font-weight: 600;
  color: #344054;
  word-break: break-word;
}

/* LOADING / ERROR / EMPTY */

.loading,
.error,
.empty {
  min-height: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  color: #667085;
}

.loading i,
.error > i,
.empty > i {
  font-size: 42px;
  margin-bottom: 15px;
}

.error h2,
.empty h2 {
  color: #1d2939;
  margin: 5px 0 10px;
}

.error p,
.empty p {
  max-width: 650px;
  line-height: 1.7;
}

/* BUTTONS */

.retry-btn {
  margin-top: 15px;
  border: 0;
  background: #2563eb;
  color: #ffffff;
  padding: 11px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.retry-btn:hover {
  background: #1d4ed8;
}

/* NAVIGATION */

.navigation {
  margin-top: 25px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.nav-btn {
  border: 1px solid #d0d5dd;
  background: #ffffff;
  color: #344054;
  padding: 12px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  transition: .2s ease;
}

.nav-btn:hover:not(:disabled) {
  background: #f9fafb;
}

.nav-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* FOOTER */

.footer {
  text-align: center;
  padding: 35px 20px;
  color: #98a2b3;
  font-size: 14px;
}

/* RESPONSIVE */

@media (max-width: 850px) {

  .lesson-body {
    grid-template-columns: 1fr;
  }

  .player,
  .player iframe,
  .player video {
    min-height: 300px;
    height: 300px;
  }

  .pdf-frame {
    height: 500px;
  }

}

@media (max-width: 600px) {

  .header-inner {
    padding: 12px 14px;
  }

  .page {
    padding: 18px 14px 40px;
  }

  .logo {
    font-size: 17px;
  }

  .back-btn {
    padding: 8px 10px;
  }

  .player,
  .player iframe,
  .player video {
    height: 240px;
    min-height: 240px;
  }

  .content-card,
  .sidebar-card {
    padding: 18px;
  }

  .text-content {
    padding: 20px;
  }

  .navigation {
    flex-direction: column;
  }

  .nav-btn {
    width: 100%;
  }

}

.player-card a {
  color: inherit;
}

</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >
      <i class="fa-solid fa-arrow-left"></i>
      Back
    </button>

    <a
      class="logo"
      href="index-auth.html"
    >
      LetsStudy <span>Pro</span>
    </a>

  </div>

</header>


<main class="page">

  <div id="pageContent">

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>Loading lesson...</p>

    </div>

  </div>

</main>


<footer class="footer">

  © <span id="year"></span>
  LetsStudy Pro · Learn. Build. Work. Grow.

</footer>


<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRg0rj0odBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const auth =
  getAuth(app);


/* =====================================================
   DOM
===================================================== */

const pageContent =
  document.getElementById(
    "pageContent"
  );

const backBtn =
  document.getElementById(
    "backBtn"
  );

const yearElement =
  document.getElementById(
    "year"
  );

yearElement.textContent =
  new Date().getFullYear();


/* =====================================================
   URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const lessonId =
  (
    params.get("id") ||
    params.get("lessonId") ||
    ""
  ).trim();


/* =====================================================
   STATE
===================================================== */

let currentLesson = null;

let currentCourse = null;

let relatedLessons = [];

let currentIndex = -1;


/* =====================================================
   BACK BUTTON
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    const courseId =
      getCourseId(
        currentLesson
      );

    if (courseId) {

      window.location.href =
        `course-lessons.html?courseId=${
          encodeURIComponent(courseId)
        }`;

      return;

    }


    if (
      window.history.length > 1
    ) {

      window.history.back();

    } else {

      window.location.href =
        "courses.html";

    }

  }
);


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if (!user) {

      showError(
        "Please sign in to access this lesson.",
        true
      );

      return;

    }

    await loadLesson(user);

  }
);


/* =====================================================
   LOAD LESSON
===================================================== */

async function loadLesson(user) {

  if (!lessonId) {

    showError(
      "Lesson ID is missing."
    );

    return;

  }


  try {

    const lessonRef =
      doc(
        db,
        "lessons",
        lessonId
      );


    const lessonSnap =
      await getDoc(
        lessonRef
      );


    if (!lessonSnap.exists()) {

      showError(
        "Lesson not found."
      );

      return;

    }


    currentLesson = {

      id:
        lessonSnap.id,

      ...lessonSnap.data()

    };


    /* =================================================
       STATUS
    ================================================= */

    const status =
      String(
        currentLesson.status || ""
      )
        .toLowerCase()
        .trim();


    if (
      status &&
      ![
        "published",
        "active"
      ].includes(status)
    ) {

      showError(
        "This lesson is not currently available."
      );

      return;

    }


    /* =================================================
       COURSE ID
    ================================================= */

    const courseId =
      getCourseId(
        currentLesson
      );


    if (!courseId) {

      showError(
        "This lesson is not linked to a course."
      );

      return;

    }


    /* =================================================
       LOAD COURSE
    ================================================= */

    await loadCourse(
      courseId
    );


    /* =================================================
       CHECK ENROLLMENT
    ================================================= */

    await checkEnrollment(
      user.uid,
      courseId
    );


    /* =================================================
       RELATED LESSONS
    ================================================= */

    await loadRelatedLessons(
      courseId
    );


    /* =================================================
       RENDER
    ================================================= */

    renderPage();

  }

  catch (error) {

    console.error(
      "Lesson loading error:",
      error
    );


    if (
      error.message ===
        "USER_NOT_ENROLLED" ||
      error.message ===
        "ENROLLMENT_NOT_ACTIVE"
    ) {

      return;

    }


    showError(
      error.message ||
      "Unable to load lesson."
    );

  }

}


/* =====================================================
   GET COURSE ID
===================================================== */

function getCourseId(
  lesson
) {

  if (!lesson) {
    return "";
  }


  return String(
    lesson.courseId ||
    lesson.courseID ||
    lesson.course ||
    ""
  ).trim();

}


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse(
  courseId
) {

  const courseRef =
    doc(
      db,
      "courses",
      courseId
    );


  const courseSnap =
    await getDoc(
      courseRef
    );


  if (
    courseSnap.exists()
  ) {

    currentCourse = {

      id:
        courseSnap.id,

      ...courseSnap.data()

    };

  } else {

    currentCourse = {

      id:
        courseId,

      title:
        "Course"

    };

  }

}


/* =====================================================
   CHECK ENROLLMENT
===================================================== */

async function checkEnrollment(
  userId,
  courseId
) {

  let snapshot;


  try {

    const q =
      query(

        collection(
          db,
          "enrollments"
        ),

        where(
          "userId",
          "==",
          userId
        ),

        where(
          "courseId",
          "==",
          courseId
        )

      );


    snapshot =
      await getDocs(q);

  }

  catch (error) {

    /*
      Fallback for enrollment documents
      using courseID/course.
    */

    const q =
      query(

        collection(
          db,
          "enrollments"
        ),

        where(
          "userId",
          "==",
          userId
        )

      );


    const all =
      await getDocs(q);


    const matching =
      all.docs.filter(
        enrollmentDoc => {

          const data =
            enrollmentDoc.data();


          const enrolledCourse =
            String(
              data.courseId ||
              data.courseID ||
              data.course ||
              ""
            ).trim();


          return (
            enrolledCourse ===
            String(courseId)
          );

        }
      );


    snapshot = {

      empty:
        matching.length === 0,

      docs:
        matching

    };

  }


  if (
    snapshot.empty
  ) {

    showError(
      "You are not enrolled in this course."
    );

    throw new Error(
      "USER_NOT_ENROLLED"
    );

  }


  const allowedStatuses = [

    "",
    "active",
    "approved",
    "enrolled",
    "completed"

  ];


  const valid =
    snapshot.docs.some(
      enrollmentDoc => {

        const data =
          enrollmentDoc.data();


        const status =
          String(
            data.status || ""
          )
            .toLowerCase()
            .trim();


        return allowedStatuses.includes(
          status
        );

      }
    );


  if (!valid) {

    showError(
      "Your enrollment is not active."
    );

    throw new Error(
      "ENROLLMENT_NOT_ACTIVE"
    );

  }

}


/* =====================================================
   LOAD RELATED LESSONS
===================================================== */

async function loadRelatedLessons(
  courseId
) {

  relatedLessons = [];


  try {

    const q =
      query(

        collection(
          db,
          "lessons"
        ),

        where(
          "courseId",
          "==",
          courseId
        )

      );


    const snapshot =
      await getDocs(q);


    snapshot.forEach(
      lessonDoc => {

        const data =
          lessonDoc.data();


        const status =
          String(
            data.status || ""
          )
            .toLowerCase()
            .trim();


        if (
          !status ||
          status === "published" ||
          status === "active"
        ) {

          relatedLessons.push({

            id:
              lessonDoc.id,

            ...data

          });

        }

      }
    );

  }

  catch (error) {

    console.warn(
      "Primary lesson query failed:",
      error
    );


    /*
      Fallback:
      read lessons and filter locally.
    */

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "lessons"
          )
        );


      snapshot.forEach(
        lessonDoc => {

          const data =
            lessonDoc.data();


          const lessonCourseId =
            getCourseId(
              data
            );


          const status =
            String(
              data.status || ""
            )
              .toLowerCase()
              .trim();


          if (
            lessonCourseId ===
              String(courseId) &&
            (
              !status ||
              status === "published" ||
              status === "active"
            )
          ) {

            relatedLessons.push({

              id:
                lessonDoc.id,

              ...data

            });

          }

        }
      );

    }

    catch (fallbackError) {

      console.error(
        "Fallback lessons error:",
        fallbackError
      );

    }

  }


  /* =================================================
     SORT
  ================================================= */

  relatedLessons.sort(
    (a, b) => {

      const moduleA =
        String(
          a.moduleId ||
          a.moduleID ||
          a.module ||
          ""
        );


      const moduleB =
        String(
          b.moduleId ||
          b.moduleID ||
          b.module ||
          ""
        );


      const moduleCompare =
        moduleA.localeCompare(
          moduleB,
          undefined,
          {
            numeric: true
          }
        );


      if (
        moduleCompare !== 0
      ) {

        return moduleCompare;

      }


      const orderA =
        Number(
          a.order ??
          a.lessonOrder ??
          a.position ??
          0
        );


      const orderB =
        Number(
          b.order ??
          b.lessonOrder ??
          b.position ??
          0
        );


      return (
        orderA - orderB
      );

    }
  );


  currentIndex =
    relatedLessons.findIndex(
      lesson =>
        lesson.id === lessonId
    );

}


/* =====================================================
   RENDER PAGE
===================================================== */

function renderPage() {

  const lesson =
    currentLesson;


  const title =
    lesson.title ||
    lesson.name ||
    "Untitled Lesson";


  const description =
    lesson.description ||
    "No lesson description available.";


  const type =
    lesson.type ||
    "lesson";


  const duration =
    lesson.duration ||
    "Not specified";


  const order =
    lesson.order ??
    lesson.lessonOrder ??
    lesson.position ??
    "";


  const moduleId =
    lesson.moduleId ||
    lesson.moduleID ||
    lesson.module ||
    "Not specified";


  const courseId =
    getCourseId(
      lesson
    );


  const courseTitle =
    currentCourse?.title ||
    currentCourse?.name ||
    "Course";


  document.title =
    `${title} | LetsStudy Pro`;


  pageContent.innerHTML = `

    <div class="lesson-header">

      <a
        class="course-link"
        href="course-lessons.html?courseId=${encodeURIComponent(courseId)}"
      >

        <i class="fa-solid fa-book"></i>

        ${escapeHTML(courseTitle)}

      </a>


      <h1>
        ${escapeHTML(title)}
      </h1>


      <p>
        ${escapeHTML(description)}
      </p>


      <div class="lesson-meta">

        <span class="meta-item">

          <i
            class="${getIcon(type)}"
          ></i>

          ${escapeHTML(
            formatText(type)
          )}

        </span>


        <span class="meta-item">

          <i
            class="fa-regular fa-clock"
          ></i>

          ${escapeHTML(
            String(duration)
          )}

        </span>


        <span class="meta-item">
  <i class="fa-solid fa-layer-group"></i>
  Module:
  ${escapeHTML(String(moduleId))}
</span>

${
  order !== ""
    ? `
      <span class="meta-item">
        <i class="fa-solid fa-list-ol"></i>
        Lesson:
        ${escapeHTML(String(order))}
      </span>
    `
    : ""
}

</div>

</div>


<!-- =============================================
     PLAYER
============================================= -->

<div class="player-card">

  <div
    class="player"
    id="lessonPlayer"
  >

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>
        Loading lesson content...
      </p>

    </div>

  </div>

</div>


<!-- =============================================
     LESSON BODY
============================================= -->

<div class="lesson-body">

  <section class="content-card">

    <h2>
      <i class="fa-solid fa-book-open"></i>
      Lesson Details
    </h2>

    <div class="description">
      ${escapeHTML(description)}
    </div>

    <div class="navigation">

      <button
        class="nav-btn"
        id="previousBtn"
        type="button"
      >
        <i class="fa-solid fa-arrow-left"></i>
        Previous
      </button>

      <button
        class="nav-btn"
        id="nextBtn"
        type="button"
      >
        Next
        <i class="fa-solid fa-arrow-right"></i>
      </button>

    </div>

  </section>


  <!-- SIDEBAR -->

  <aside class="sidebar-card">

    <h3>
      <i class="fa-solid fa-circle-info"></i>
      Course Information
    </h3>

    <div class="sidebar-item">

      <div class="sidebar-label">
        Course
      </div>

      <div class="sidebar-value">
        ${escapeHTML(courseTitle)}
      </div>

    </div>


    <div class="sidebar-item">

      <div class="sidebar-label">
        Lesson Type
      </div>

      <div class="sidebar-value">
        ${escapeHTML(formatText(type))}
      </div>

    </div>


    <div class="sidebar-item">

      <div class="sidebar-label">
        Duration
      </div>

      <div class="sidebar-value">
        ${escapeHTML(String(duration))}
      </div>

    </div>


    <div class="sidebar-item">

      <div class="sidebar-label">
        Module
      </div>

      <div class="sidebar-value">
        ${escapeHTML(String(moduleId))}
      </div>

    </div>


    ${
      currentCourse?.level
        ? `
          <div class="sidebar-item">

            <div class="sidebar-label">
              Level
            </div>

            <div class="sidebar-value">
              ${escapeHTML(
                String(currentCourse.level)
              )}
            </div>

          </div>
        `
        : ""
    }


    ${
      currentCourse?.instructor
        ? `
          <div class="sidebar-item">

            <div class="sidebar-label">
              Instructor
            </div>

            <div class="sidebar-value">
              ${escapeHTML(
                String(currentCourse.instructor)
              )}
            </div>

          </div>
        `
        : ""
    }

  </aside>

</div>

`;


  renderLessonContent();

  setupNavigation();

}


/* =====================================================
   RENDER LESSON CONTENT
===================================================== */

function renderLessonContent() {

  const lesson =
    currentLesson;

  const player =
    document.getElementById(
      "lessonPlayer"
    );

  if (!player) {
    return;
  }


  const type =
    String(
      lesson.type || ""
    )
      .toLowerCase()
      .trim();


  const url =
    String(
      lesson.contentUrl ||
      lesson.videoUrl ||
      lesson.fileUrl ||
      lesson.pdfUrl ||
      lesson.audioUrl ||
      lesson.url ||
      lesson.link ||
      ""
    ).trim();


  const content =
    String(
      lesson.content ||
      lesson.text ||
      lesson.body ||
      ""
    );


  /* =================================================
     YOUTUBE
  ================================================= */

  const youtubeId =
    getYouTubeId(url);


  if (
    (
      type === "video" ||
      !type
    ) &&
    youtubeId
  ) {

    player.innerHTML = `

      <iframe
        src="https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}"
        title="${escapeHTML(
          lesson.title ||
          "Lesson Video"
        )}"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share
        "
        allowfullscreen
      ></iframe>

    `;

    return;
  }


  /* =================================================
     VIMEO
  ================================================= */

  const vimeoId =
    getVimeoId(url);


  if (
    (
      type === "video" ||
      !type
    ) &&
    vimeoId
  ) {

    player.innerHTML = `

      <iframe
        src="https://player.vimeo.com/video/${encodeURIComponent(vimeoId)}"
        title="${escapeHTML(
          lesson.title ||
          "Lesson Video"
        )}"
        allow="
          autoplay;
          fullscreen;
          picture-in-picture
        "
        allowfullscreen
      ></iframe>

    `;

    return;
  }


  /* =================================================
     DIRECT VIDEO
  ================================================= */

  if (
    type === "video" &&
    url
  ) {

    player.innerHTML = `

      <video
        controls
        playsinline
        preload="metadata"
      >

        <source
          src="${escapeHTML(url)}"
        >

        Your browser does not support
        HTML5 video.

      </video>

    `;

    return;
  }


  /* =================================================
     AUDIO
  ================================================= */

  if (
    type === "audio" &&
    url
  ) {

    player.innerHTML = `

      <audio
        controls
        preload="metadata"
      >

        <source
          src="${escapeHTML(url)}"
        >

        Your browser does not support
        audio playback.

      </audio>

    `;

    return;
  }


  /* =================================================
     PDF
  ================================================= */

  if (
    type === "pdf" &&
    url
  ) {

    player.innerHTML = `

      <iframe
        class="pdf-frame"
        src="${escapeHTML(url)}"
        title="${escapeHTML(
          lesson.title ||
          "Lesson PDF"
        )}"
      ></iframe>

    `;

    return;
  }


  /* =================================================
     TEXT / ARTICLE
  ================================================= */

  if (
    type === "text" ||
    type === "article" ||
    type === "reading"
  ) {

    player.innerHTML = `

      <div class="text-content">

        ${escapeHTML(
          content ||
          lesson.description ||
          "No text content available."
        )}

      </div>

    `;

    return;
  }


  /* =================================================
     LIVE
  ================================================= */

  if (
    type === "live" &&
    url
  ) {

    player.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-tower-broadcast"></i>

        <h2>
          Live Lesson
        </h2>

        <p>
          Join the live lesson using
          the button below.
        </p>

        <a
          class="retry-btn"
          href="${escapeHTML(url)}"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-solid fa-video"></i>

          Join Live Lesson

        </a>

      </div>

    `;

    return;
  }


  /* =================================================
     OTHER RESOURCE
  ================================================= */

  if (
    type === "other" &&
    url
  ) {

    player.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-link"></i>

        <h2>
          Lesson Resource
        </h2>

        <p>
          Open the lesson resource below.
        </p>

        <a
          class="retry-btn"
          href="${escapeHTML(url)}"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-solid fa-arrow-up-right-from-square"></i>

          Open Resource

        </a>

      </div>

    `;

    return;
  }


  /* =================================================
     GENERIC URL
  ================================================= */

  if (url) {

    player.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-link"></i>

        <h2>
          Lesson Content
        </h2>

        <p>
          Open the lesson content below.
        </p>

        <a
          class="retry-btn"
          href="${escapeHTML(url)}"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-solid fa-arrow-up-right-from-square"></i>

          Open Content

        </a>

      </div>

    `;

    return;
  }


  /* =================================================
     NO CONTENT
  ================================================= */

  player.innerHTML = `

    <div class="empty">

      <i class="fa-solid fa-file-circle-question"></i>

      <h2>
        No Lesson Content
      </h2>

      <p>
        This lesson does not have content
        available yet.
      </p>

    </div>

  `;

}


/* =====================================================
   NAVIGATION
===================================================== */

function setupNavigation() {

  const previousBtn =
    document.getElementById(
      "previousBtn"
    );

  const nextBtn =
    document.getElementById(
      "nextBtn"
    );


  if (
    !previousBtn ||
    !nextBtn
  ) {

    return;
  }


  previousBtn.disabled =
    currentIndex <= 0;


  nextBtn.disabled =
    currentIndex < 0 ||
    currentIndex >=
      relatedLessons.length - 1;


  previousBtn.addEventListener(
    "click",
    () => {

      if (
        currentIndex <= 0
      ) {

        return;
      }


      const previousLesson =
        relatedLessons[
          currentIndex - 1
        ];


      if (previousLesson) {

        window.location.href =
          `lesson-watch.html?id=${
            encodeURIComponent(
              previousLesson.id
            )
          }`;

      }

    }
  );


  nextBtn.addEventListener(
    "click",
    () => {

      if (
        currentIndex < 0 ||
        currentIndex >=
          relatedLessons.length - 1
      ) {

        return;
      }


      const nextLesson =
        relatedLessons[
          currentIndex + 1
        ];


      if (nextLesson) {

        window.location.href =
          `lesson-watch.html?id=${
            encodeURIComponent(
              nextLesson.id
            )
          }`;

      }

    }
  );

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(
  url
) {

  if (!url) {
    return "";
  }


  const value =
    String(url).trim();


  const patterns = [

    /youtube\.com\/watch\?v=([^&]+)/i,

    /youtube\.com\/embed\/([^?&/]+)/i,

    /youtube\.com\/shorts\/([^?&/]+)/i,

    /youtube-nocookie\.com\/embed\/([^?&/]+)/i,

    /youtu\.be\/([^?&/]+)/i

  ];


  for (
    const pattern of patterns
  ) {

    const match =
      value.match(pattern);


    if (
      match &&
      match[1]
    ) {

      return match[1];

    }

  }


  return "";

}


/* =====================================================
   VIMEO ID
===================================================== */

function getVimeoId(
  url
) {

  if (!url) {
    return "";
  }


  const match =
    String(url).match(
      /vimeo\.com\/(?:video\/)?(\d+)/i
    );


  return (
    match &&
    match[1]
  )
    ? match[1]
    : "";

}


/* =====================================================
   ICON
===================================================== */

function getIcon(
  type
) {

  const value =
    String(
      type || ""
    ).toLowerCase();


  if (
    value === "video"
  ) {

    return "fa-solid fa-circle-play";

  }


  if (
    value === "audio"
  ) {

    return "fa-solid fa-headphones";

  }


  if (
    value === "pdf"
  ) {

    return "fa-solid fa-file-pdf";

  }


  if (
    value === "text" ||
    value === "article" ||
    value === "reading"
  ) {

    return "fa-solid fa-file-lines";

  }


  if (
    value === "live"
  ) {

    return "fa-solid fa-tower-broadcast";

  }


  return "fa-solid fa-book-open";

}


/* =====================================================
   FORMAT TEXT
===================================================== */

function formatText(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /[_-]+/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim()
    .replace(
      /\b\w/g,
      char =>
        char.toUpperCase()
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message,
  signIn = false
) {

  pageContent.innerHTML = `

    <div class="error">

      <i class="fa-solid fa-triangle-exclamation"></i>

      <h2>
        Unable to Load Lesson
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>

      ${
        signIn
          ? `
            <a
              class="retry-btn"
              href="index-auth.html"
            >

              <i class="fa-solid fa-right-to-bracket"></i>

              Sign In

            </a>
          `
          : `
            <button
              class="retry-btn"
              type="button"
              onclick="location.reload()"
            >

              <i class="fa-solid fa-rotate"></i>

              Try Again

            </button>
          `
      }

    </div>

  `;

}
