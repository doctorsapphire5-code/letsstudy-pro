<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Lesson | LetsStudy Pro</title>

<meta
  name="description"
  content="Watch and study your LetsStudy Pro course lesson."
>

<meta
  name="robots"
  content="noindex,nofollow"
>

<link
  rel="icon"
  href="favicon.ico"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  background: #f5f7fb;
  color: #172033;
}

button,
input,
textarea,
select {
  font-family: inherit;
}


/* =====================================================
   HEADER
===================================================== */

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  font-weight: 800;
  font-size: 20px;
  color: #111827;
  text-decoration: none;
}

.logo span {
  color: #2563eb;
}

.back-btn {
  border: 0;
  background: #eef2ff;
  color: #1d4ed8;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  transition: .2s ease;
}

.back-btn:hover {
  background: #dbeafe;
}


/* =====================================================
   PAGE
===================================================== */

.page {
  max-width: 1200px;
  margin: auto;
  padding: 25px 20px 50px;
}


/* =====================================================
   COURSE LINK
===================================================== */

.course-link {
  color: #2563eb;
  text-decoration: none;
  font-weight: 700;
}

.course-link:hover {
  text-decoration: underline;
}


/* =====================================================
   LESSON HEADER
===================================================== */

.lesson-header {
  margin: 20px 0;
}

.lesson-header h1 {
  margin: 8px 0;
  font-size: clamp(26px, 5vw, 42px);
  line-height: 1.2;
}

.lesson-header p {
  color: #667085;
  line-height: 1.7;
  margin: 0;
}


/* =====================================================
   META
===================================================== */

.lesson-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

.meta-item {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 999px;
  padding: 8px 13px;
  color: #475467;
  font-size: 14px;
}


/* =====================================================
   PLAYER
===================================================== */

.player-card {
  background: #111827;
  border-radius: 18px;
  overflow: hidden;
  min-height: 300px;
  box-shadow:
    0 15px 40px rgba(0,0,0,.12);
}

.player {
  width: 100%;
  min-height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.player iframe,
.player video {
  width: 100%;
  height: 500px;
  border: 0;
  display: block;
}

.player video {
  background: #000000;
}

.player audio {
  width: min(700px, 90%);
}


/* =====================================================
   TEXT CONTENT
===================================================== */

.text-content {
  background: #ffffff;
  padding: 30px;
  border-radius: 15px;
  line-height: 1.8;
  white-space: pre-wrap;
  color: #344054;
  width: 100%;
  min-height: 300px;
  overflow-wrap: anywhere;
}


/* =====================================================
   PDF
===================================================== */

.pdf-frame {
  width: 100%;
  height: 650px;
  border: 0;
  background: #ffffff;
}


/* =====================================================
   LESSON BODY
===================================================== */

.lesson-body {
  margin-top: 25px;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 25px;
}

.content-card,
.sidebar-card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 24px;
}

.content-card h2,
.sidebar-card h3 {
  margin-top: 0;
}


/* =====================================================
   DESCRIPTION
===================================================== */

.description {
  color: #475467;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar-item {
  padding: 12px 0;
  border-bottom: 1px solid #eef0f3;
}

.sidebar-item:last-child {
  border-bottom: 0;
}

.sidebar-label {
  font-size: 12px;
  color: #98a2b3;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 4px;
}

.sidebar-value {
  font-weight: 600;
  color: #344054;
  word-break: break-word;
}


/* =====================================================
   LOADING / ERROR / EMPTY
===================================================== */

.loading,
.error,
.empty {
  min-height: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  color: #667085;
}

.loading i,
.error > i,
.empty > i {
  font-size: 42px;
  margin-bottom: 15px;
}

.error h2,
.empty h2 {
  color: #1d2939;
  margin: 5px 0 10px;
}

.error p,
.empty p {
  max-width: 650px;
  line-height: 1.7;
}


/* =====================================================
   BUTTONS
===================================================== */

.retry-btn {
  margin-top: 15px;
  border: 0;
  background: #2563eb;
  color: #ffffff;
  padding: 11px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.retry-btn:hover {
  background: #1d4ed8;
}


/* =====================================================
   NAVIGATION
===================================================== */

.navigation {
  margin-top: 25px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.nav-btn {
  border: 1px solid #d0d5dd;
  background: #ffffff;
  color: #344054;
  padding: 12px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  transition: .2s ease;
}

.nav-btn:hover:not(:disabled) {
  background: #f9fafb;
}

.nav-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
  text-align: center;
  padding: 35px 20px;
  color: #98a2b3;
  font-size: 14px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 850px) {

  .lesson-body {
    grid-template-columns: 1fr;
  }

  .player,
  .player iframe,
  .player video {
    min-height: 300px;
    height: 300px;
  }

  .pdf-frame {
    height: 500px;
  }

}


@media (max-width: 600px) {

  .header-inner {
    padding: 12px 14px;
  }

  .page {
    padding: 18px 14px 40px;
  }

  .logo {
    font-size: 17px;
  }

  .back-btn {
    padding: 8px 10px;
  }

  .player,
  .player iframe,
  .player video {
    height: 240px;
    min-height: 240px;
  }

  .content-card,
  .sidebar-card {
    padding: 18px;
  }

  .text-content {
    padding: 20px;
  }

  .navigation {
    flex-direction: column;
  }

  .nav-btn {
    width: 100%;
  }

}


/* =====================================================
   DARK PLAYER SAFETY
===================================================== */

.player-card a {
  color: inherit;
}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="header-inner">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >

      <i class="fa-solid fa-arrow-left"></i>

      Back

    </button>


    <a
      class="logo"
      href="index-auth.html"
    >

      LetsStudy <span>Pro</span>

    </a>

  </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">

  <div id="pageContent">

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>Loading lesson...</p>

    </div>

  </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

  © <span id="year"></span>
  LetsStudy Pro · Learn. Build. Work. Grow.

</footer>


<!-- =====================================================
     FIREBASE SCRIPT
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const auth =
  getAuth(app);


/* =====================================================
   DOM
===================================================== */

const pageContent =
  document.getElementById(
    "pageContent"
  );

const backBtn =
  document.getElementById(
    "backBtn"
  );

const yearElement =
  document.getElementById(
    "year"
  );

yearElement.textContent =
  new Date().getFullYear();


/* =====================================================
   URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const lessonId =
  (
    params.get("id") ||
    params.get("lessonId") ||
    ""
  ).trim();


/* =====================================================
   STATE
===================================================== */

let currentLesson = null;

let currentCourse = null;

let relatedLessons = [];

let currentIndex = -1;


/* =====================================================
   BACK BUTTON
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if (
      currentLesson &&
      currentLesson.courseId
    ) {

      window.location.href =
        `course-lessons.html?courseId=${
          encodeURIComponent(
            currentLesson.courseId
          )
        }`;

      return;
    }


    if (
      window.history.length > 1
    ) {

      window.history.back();

    } else {

      window.location.href =
        "courses.html";

    }

  }
);


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) {

      showError(
        "Please sign in to access this lesson.",
        true
      );

      return;
    }


    await loadLesson(user);

  }
);


/* =====================================================
   LOAD LESSON
===================================================== */

async function loadLesson(user) {

  if (!lessonId) {

    showError(
      "Lesson ID is missing."
    );

    return;
  }


  try {

    console.log(
      "Loading lesson:",
      lessonId
    );


    /* =================================================
       LESSON DOCUMENT
    ================================================= */

    const lessonRef =
      doc(
        db,
        "lessons",
        lessonId
      );


    const lessonSnap =
      await getDoc(
        lessonRef
      );


    if (!lessonSnap.exists()) {

      showError(
        "Lesson not found."
      );

      return;
    }


    currentLesson = {

      id:
        lessonSnap.id,

      ...lessonSnap.data()

    };


    /* =================================================
       STATUS
    ================================================= */

    const status =
      String(
        currentLesson.status || ""
      ).toLowerCase();


    if (
      status &&
      ![
        "published",
        "active"
      ].includes(status)
    ) {

      showError(
        "This lesson is not currently available."
      );

      return;
    }


    /* =================================================
       COURSE
    ================================================= */

    if (
      currentLesson.courseId
    ) {

      await loadCourse(
        currentLesson.courseId
      );


      /* ===============================================
         ENROLLMENT
      =============================================== */

      await checkEnrollment(
        user.uid,
        currentLesson.courseId
      );


      /* ===============================================
         RELATED LESSONS
      =============================================== */

      await loadRelatedLessons(
        currentLesson.courseId
      );

    }


    /* =================================================
       RENDER
    ================================================= */

    renderPage();


  } catch (error) {

    console.error(
      "Lesson loading error:",
      error
    );


    /*
      Enrollment errors are already displayed
      to the user.
    */

    if (
      error.message ===
      "User is not enrolled." ||
      error.message ===
      "Enrollment is not active."
    ) {

      return;
    }


    showError(
      error.message ||
      "Unable to load lesson."
    );

  }

}


/* =====================================================
   LOAD COURSE
===================================================== */

async function loadCourse(
  courseId
) {

  const courseRef =
    doc(
      db,
      "courses",
      courseId
    );


  const courseSnap =
    await getDoc(
      courseRef
    );


  if (
    courseSnap.exists()
  ) {

    currentCourse = {

      id:
        courseSnap.id,

      ...courseSnap.data()

    };

  }

}


/* =====================================================
   CHECK ENROLLMENT
===================================================== */

async function checkEnrollment(
  userId,
  courseId
) {

  const enrollmentQuery =
    query(

      collection(
        db,
        "enrollments"
      ),

      where(
        "userId",
        "==",
        userId
      ),

      where(
        "courseId",
        "==",
        courseId
      )

    );


  const snapshot =
    await getDocs(
      enrollmentQuery
    );


  if (
    snapshot.empty
  ) {

    showError(
      "You are not enrolled in this course."
    );

    throw new Error(
      "User is not enrolled."
    );

  }


  const allowedStatuses = [

    "active",
    "approved",
    "enrolled",
    "completed"

  ];


  const valid =
    snapshot.docs.some(
      enrollmentDoc => {

        const data =
          enrollmentDoc.data();


        const status =
          String(
            data.status || ""
          ).toLowerCase();


        return (
          allowedStatuses.includes(
            status
          )
        );

      }
    );


  if (!valid) {

    showError(
      "Your enrollment is not active."
    );

    throw new Error(
      "Enrollment is not active."
    );

  }

}


/* =====================================================
   RELATED LESSONS
===================================================== */

async function loadRelatedLessons(
  courseId
) {

  try {

    const lessonsQuery =
      query(

        collection(
          db,
          "lessons"
        ),

        where(
          "courseId",
          "==",
          courseId
        )

      );


    const snapshot =
      await getDocs(
        lessonsQuery
      );


    relatedLessons = [];


    snapshot.forEach(
      lessonDoc => {

        const data =
          lessonDoc.data();


        const status =
          String(
            data.status || ""
          ).toLowerCase();


        if (
          !status ||
          status === "published" ||
          status === "active"
        ) {

          relatedLessons.push({

            id:
              lessonDoc.id,

            ...data

          });

        }

      }
    );


    /* =================================================
       SORT
    ================================================= */

    relatedLessons.sort(
      (a, b) => {

        const moduleA =
          String(
            a.moduleId || ""
          );

        const moduleB =
          String(
            b.moduleId || ""
          );


        if (
          moduleA !== moduleB
        ) {

          return moduleA.localeCompare(
            moduleB,
            undefined,
            {
              numeric: true
            }
          );

        }


        return (
          Number(
            a.order || 0
          ) -
          Number(
            b.order || 0
          )
        );

      }
    );


    currentIndex =
      relatedLessons.findIndex(
        lesson =>
          lesson.id === lessonId
      );


  } catch (error) {

    console.error(
      "Related lessons error:",
      error
    );

  }

}


/* =====================================================
   RENDER PAGE
===================================================== */

function renderPage() {

  const lesson =
    currentLesson;


  const title =
    lesson.title ||
    lesson.name ||
    "Untitled Lesson";


  const description =
    lesson.description ||
    "No lesson description available.";


  const type =
    lesson.type ||
    "lesson";


  const duration =
    lesson.duration ||
    "Not specified";


  const order =
    lesson.order ||
    "";


  const moduleId =
    lesson.moduleId ||
    "Not specified";


  const courseTitle =
    currentCourse?.title ||
    currentCourse?.name ||
    "Course";


  document.title =
    `${title} | LetsStudy Pro`;


  pageContent.innerHTML = `

    <div class="lesson-header">

      <a
        class="course-link"
        href="course-lessons.html?courseId=${
          encodeURIComponent(
            lesson.courseId || ""
          )
        }"
      >

        <i class="fa-solid fa-book"></i>

        ${escapeHTML(courseTitle)}

      </a>


      <h1>
        ${escapeHTML(title)}
      </h1>


      <p>
        ${escapeHTML(description)}
      </p>


      <div class="lesson-meta">

        <span class="meta-item">

          <i
            class="${getIcon(type)}"
          ></i>

          ${escapeHTML(
            formatText(type)
          )}

        </span>


        <span class="meta-item">

          <i
            class="fa-regular fa-clock"
          ></i>

          ${escapeHTML(
            String(duration)
          )}

        </span>


        <span class="meta-item">

          <i
            class="fa-solid fa-layer-group"
          ></i>

          Module

        </div>

        <div class="sidebar-item">

          <div class="sidebar-label">
            Duration
          </div>

          <div class="sidebar-value">

            ${escapeHTML(
              String(duration)
            )}

          </div>

        </div>

        <div class="sidebar-item">

          <div class="sidebar-label">
            Module
          </div>

          <div class="sidebar-value">

            ${escapeHTML(
              String(moduleId)
            )}

          </div>

        </div>

        ${
          order
            ? `
              <div class="sidebar-item">

                <div class="sidebar-label">
                  Lesson Number
                </div>

                <div class="sidebar-value">

                  ${escapeHTML(
                    String(order)
                  )}

                </div>

              </div>
            `
            : ""
        }

      </aside>

    </div>

  `;


  setupNavigation();

}


/* =====================================================
   RENDER LESSON CONTENT
===================================================== */

function renderLessonContent(
  lesson
) {

  const type =
    String(
      lesson.type || ""
    ).toLowerCase();

  const url =
    lesson.contentUrl ||
    lesson.videoUrl ||
    lesson.videoURL ||
    lesson.url ||
    lesson.video ||
    "";


  /* ===================================================
     VIDEO
  =================================================== */

  if (
    type === "video"
  ) {

    const youtubeId =
      getYouTubeId(url);

    if (youtubeId) {

      return `

        <iframe
          src="https://www.youtube.com/embed/${escapeHTML(youtubeId)}"
          title="${escapeHTML(
            lesson.title ||
            "Lesson video"
          )}"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share
          "
          allowfullscreen
        ></iframe>

      `;

    }


    const vimeoId =
      getVimeoId(url);

    if (vimeoId) {

      return `

        <iframe
          src="https://player.vimeo.com/video/${escapeHTML(vimeoId)}"
          title="${escapeHTML(
            lesson.title ||
            "Lesson video"
          )}"
          allow="
            autoplay;
            fullscreen;
            picture-in-picture
          "
          allowfullscreen
        ></iframe>

      `;

    }


    if (url) {

      return `

        <video
          controls
          playsinline
          preload="metadata"
        >

          <source
            src="${escapeHTML(url)}"
          >

          Your browser does not support video.

        </video>

      `;

    }

  }


  /* ===================================================
     AUDIO
  =================================================== */

  if (
    type === "audio"
  ) {

    if (url) {

      return `

        <audio
          controls
          preload="metadata"
        >

          <source
            src="${escapeHTML(url)}"
          >

          Your browser does not support audio.

        </audio>

      `;

    }

  }


  /* ===================================================
     PDF
  =================================================== */

  if (
    type === "pdf"
  ) {

    if (url) {

      return `

        <iframe
          class="pdf-frame"
          src="${escapeHTML(url)}"
          title="PDF Lesson"
        ></iframe>

      `;

    }

  }


  /* ===================================================
     TEXT / ARTICLE
  =================================================== */

  if (
    type === "text" ||
    type === "article"
  ) {

    const content =
      lesson.content ||
      lesson.text ||
      lesson.body ||
      lesson.description ||
      "";

    if (content) {

      return `

        <div class="text-content">

          ${escapeHTML(
            String(content)
          )}

        </div>

      `;

    }

  }


  /* ===================================================
     LIVE LESSON
  =================================================== */

  if (
    type === "live"
  ) {

    if (url) {

      return `

        <div class="empty">

          <i
            class="fa-solid fa-video"
          ></i>

          <h2>
            Live Lesson
          </h2>

          <p>
            Join the live lesson using
            the button below.
          </p>

          <a
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener noreferrer"
            class="retry-btn"
          >

            <i
              class="fa-solid fa-video"
            ></i>

            Join Live Lesson

          </a>

        </div>

      `;

    }

  }


  /* ===================================================
     OTHER
  =================================================== */

  if (
    type === "other"
  ) {

    if (url) {

      return `

        <div class="empty">

          <i
            class="fa-solid fa-arrow-up-right-from-square"
          ></i>

          <h2>
            Lesson Resource
          </h2>

          <p>
            Open the lesson resource
            using the button below.
          </p>

          <a
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener noreferrer"
            class="retry-btn"
          >

            <i
              class="fa-solid fa-external-link"
            ></i>

            Open Resource

          </a>

        </div>

      `;

    }

  }


  /* ===================================================
     GENERIC URL
  =================================================== */

  if (url) {

    return `

      <div class="empty">

        <i
          class="fa-solid fa-link"
        ></i>

        <h2>
          Lesson Resource
        </h2>

        <p>
          This lesson contains
          an external resource.
        </p>

        <a
          href="${escapeHTML(url)}"
          target="_blank"
          rel="noopener noreferrer"
          class="retry-btn"
        >

          <i
            class="fa-solid fa-arrow-up-right-from-square"
          ></i>

          Open Resource

        </a>

      </div>

    `;

  }


  /* ===================================================
     NO CONTENT
  =================================================== */

  return `

    <div class="empty">

      <i
        class="fa-solid fa-file-circle-question"
      ></i>

      <h2>
        Content Not Available
      </h2>

      <p>
        This lesson does not have
        any content yet.
      </p>

    </div>

  `;

}


/* =====================================================
   NAVIGATION
===================================================== */

function setupNavigation() {

  const previousBtn =
    document.getElementById(
      "previousBtn"
    );

  const nextBtn =
    document.getElementById(
      "nextBtn"
    );

  if (
    !previousBtn ||
    !nextBtn
  ) {

    return;

  }


  previousBtn.disabled =
    currentIndex <= 0;

  nextBtn.disabled =
    currentIndex === -1 ||
    currentIndex >=
      relatedLessons.length - 1;


  /* ===================================================
     PREVIOUS
  =================================================== */

  previousBtn.addEventListener(
    "click",
    () => {

      if (
        currentIndex <= 0
      ) {

        return;

      }

      const previousLesson =
        relatedLessons[
          currentIndex - 1
        ];

      if (
        !previousLesson
      ) {

        return;

      }

      window.location.href =
        `lesson-watch.html?id=${
          encodeURIComponent(
            previousLesson.id
          )
        }`;

    }
  );


  /* ===================================================
     NEXT
  =================================================== */

  nextBtn.addEventListener(
    "click",
    () => {

      if (
        currentIndex === -1 ||
        currentIndex >=
          relatedLessons.length - 1
      ) {

        return;

      }

      const nextLesson =
        relatedLessons[
          currentIndex + 1
        ];

      if (
        !nextLesson
      ) {

        return;

      }

      window.location.href =
        `lesson-watch.html?id=${
          encodeURIComponent(
            nextLesson.id
          )
        }`;

    }
  );

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(url) {

  if (!url) {

    return "";

  }

  const value =
    String(url).trim();

  const patterns = [

    /youtu\.be\/([^?&/]+)/i,

    /youtube\.com\/watch\?v=([^?&/]+)/i,

    /youtube\.com\/embed\/([^?&/]+)/i,

    /youtube\.com\/shorts\/([^?&/]+)/i,

    /youtube\.com\/live\/([^?&/]+)/i

  ];

  for (
    const pattern of patterns
  ) {

    const match =
      value.match(pattern);

    if (
      match &&
      match[1]
    ) {

      return match[1];

    }

  }

  return "";

}


/* =====================================================
   VIMEO ID
===================================================== */

function getVimeoId(url) {

  if (!url) {

    return "";

  }

  const value =
    String(url).trim();

  const match =
    value.match(
      /vimeo\.com\/(?:video\/)?(\d+)/i
    );

  return match
    ? match[1]
    : "";

}


/* =====================================================
   ICON
===================================================== */

function getIcon(type) {

  const value =
    String(
      type || ""
    ).toLowerCase();

  switch (value) {

    case "video":
      return "fa-solid fa-circle-play";

    case "audio":
      return "fa-solid fa-headphones";

    case "pdf":
      return "fa-solid fa-file-pdf";

    case "text":
    case "article":
      return "fa-solid fa-file-lines";

    case "live":
      return "fa-solid fa-video";

    default:
      return "fa-solid fa-file";

  }

}


/* =====================================================
   FORMAT TEXT
===================================================== */

function formatText(value) {

  if (!value) {

    return "";

  }

  return String(value)
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .replace(
      /\b\w/g,
      letter =>
        letter.toUpperCase()
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message,
  signIn = false
) {

  pageContent.innerHTML = `

    <div class="error">

      <i
        class="fa-solid fa-circle-exclamation"
      ></i>

      <h2>
        Unable to Open Lesson
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>

      ${
        signIn
          ? `
            <button
              class="retry-btn"
              type="button"
              onclick="
                window.location.href =
                'index-auth.html';
              "
            >

              <i
                class="fa-solid fa-right-to-bracket"
              ></i>

              Sign In

            </button>
          `
          : `
            <button
              class="retry-btn"
              type="button"
              onclick="
                window.location.reload();
              "
            >

              <i
                class="fa-solid fa-rotate"
              ></i>

              Retry

            </button>
          `
      }

    </div>

  `;

}
