<style>
:root{
  --ink:#0d1b2a;--ink-2:#16293f;--paper:#f2f5f9;--card:#fff;--line:#dde4ec;
  --mute:#5b6b7e;--brand:#0a7c66;--brand-soft:#e2f4ef;--amber:#f2a93b;
  --head:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.i{width:17px;height:17px;min-width:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,4%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:20px;font-weight:700;letter-spacing:-.3px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--amber);display:grid;place-items:center;font-size:16px}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:600}
.back-btn:hover{background:var(--ink-2)}
.back-btn .i{width:15px;height:15px;transform:rotate(180deg)}

.page{flex:1;width:min(1100px,92%);margin:0 auto;padding:26px 0 60px}

/* HEADER */
.course-link{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:700;font-size:14.5px}
.course-link:hover{text-decoration:underline}
.lesson-header{margin:10px 0 20px}
.lesson-header h1{font-family:var(--head);font-size:clamp(28px,4.6vw,44px);line-height:1.1;letter-spacing:-1px;margin:8px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13.5px;font-weight:600;color:#3b4a5d}

/* PLAYER */
.stage{position:relative;background:var(--ink);border-radius:22px;overflow:hidden}
.stage.ratio{aspect-ratio:16/9;background:#000}
.stage.ratio iframe,.stage.ratio video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.stage.ratio video{object-fit:contain}
.stage.audio{padding:36px 24px;display:grid;justify-items:center;gap:16px;color:#fff;text-align:center}
.stage.audio audio{width:min(640px,100%)}
.stage.pdf iframe{display:block;width:100%;height:min(75vh,720px);border:0;background:#fff}
.stage.text{background:var(--card);border:1px solid var(--line);padding:clamp(22px,4vw,40px);color:#344054;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:16.5px}
.stage.note{padding:clamp(34px,6vw,60px) 24px;display:grid;justify-items:center;gap:14px;text-align:center;color:#fff}
.stage.note .big{width:68px;height:68px;border-radius:20px;background:rgba(242,169,59,.15);color:var(--amber);display:grid;place-items:center}
.stage.note .big .i{width:32px;height:32px}
.stage.note h2{font-family:var(--head);font-size:26px;letter-spacing:-.4px}
.stage.note p{color:#b6c3d2;max-width:46ch}
.pdf-link{display:inline-flex;margin-top:10px;color:var(--brand);font-weight:700;font-size:14.5px}

/* CONTROLS */
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 24px}
.controls .sp{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:11px 18px;background:#fff;color:var(--ink);font:700 14.5px var(--body);cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.btn:hover:not([aria-disabled="true"]){border-color:var(--ink)}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.amber{background:var(--amber);border-color:var(--amber)}
.btn.amber:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(242,169,59,.35)}
.btn.done{background:var(--brand-soft);border-color:#bfe5da;color:var(--brand)}
.btn.prev .i{transform:rotate(180deg)}
.btn.solid{background:var(--amber);border-color:var(--amber)}

/* BODY */
.lesson-body{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.content-card,.sidebar-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.content-card h2,.sidebar-card h3{font-family:var(--head);font-size:21px;letter-spacing:-.3px;margin-bottom:12px}
.description{color:#3b4a5d;white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.sidebar-item{padding:12px 0;border-bottom:1px solid #edf1f5}
.sidebar-item:first-of-type{padding-top:0}
.sidebar-item:last-of-type{border-bottom:0;padding-bottom:0}
.sidebar-label{font-size:12.5px;color:var(--mute);font-weight:600;margin-bottom:2px}
.sidebar-value{font-weight:700;word-break:break-word}
.bar{height:6px;border-radius:20px;background:#e6ebf1;overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;background:var(--amber);border-radius:20px;transition:width .4s}

/* STATES */
.state{max-width:540px;margin:50px auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:46px 28px;text-align:center;color:var(--mute)}
.state h2{font-family:var(--head);font-size:23px;color:var(--ink);margin-bottom:6px}
.state-icon{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:#fee2e2;color:#b91c1c}
.state-icon .i{width:27px;height:27px}
.state .btn{margin-top:18px}
@keyframes sh{to{background-position:-200% 0}}
.sk{border-radius:20px;background:linear-gradient(90deg,#e6ebf1 25%,#f4f7fa 50%,#e6ebf1 75%) 0 0/200% 100%;animation:sh 1.4s linear infinite}

.footer{text-align:center;padding:30px 20px;color:var(--mute);font-size:14px}

@media(max-width:850px){.lesson-body{grid-template-columns:1fr}}
@media(max-width:560px){
  .page{padding:18px 0 44px}
  .controls .btn{flex:1 1 calc(50% - 10px)}
  .controls .sp{margin-left:0;flex-basis:100%}
  .content-card,.sidebar-card{padding:20px}
  .stage{border-radius:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE (no sign-in needed) */
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const db = getFirestore(initializeApp(firebaseConfig));

const $ = (id) => document.getElementById(id);
const pageContent = $("pageContent");
$("year").textContent = new Date().getFullYear();

const params = new URLSearchParams(window.location.search);
const lessonId = (params.get("id") || params.get("lessonId") || "").trim();

let currentLesson = null, currentCourse = null, relatedLessons = [], currentIndex = -1, courseId = "";

/* HELPERS */
const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const esc = (v) => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
function first(data, keys){
  for(const k of keys){
    const v = data?.[k];
    if(v !== undefined && v !== null && String(v).trim() !== "") return String(v).trim();
  }
  return "";
}
const getCourseId = (l) => first(l, ["courseId","courseID","course"]);
const isVisible = (d) => { const s = String(d.status || "").toLowerCase().trim(); return !s || s === "published" || s === "active"; };
const keyDone = (id) => `lessonCompleted_${courseId}_${id}`;
const keyPos = (id) => `lessonPosition_${courseId}_${id}`;
const isDone = (id) => { try{ return localStorage.getItem(keyDone(id)) === "true"; }catch(e){ return false; } };
const setDone = (id, v) => { try{ v ? localStorage.setItem(keyDone(id), "true") : localStorage.removeItem(keyDone(id)); }catch(e){} };

/* Only real web links are ever used */
function safeUrl(value){
  try{
    const u = new URL(String(value || ""), window.location.href);
    return /^https?:$/.test(u.protocol) ? u.href : "";
  }catch(e){ return ""; }
}
const hostOf = (u) => { try{ return new URL(u).hostname.replace(/^www\./, ""); }catch(e){ return ""; } };
const isYouTube = (u) => /(^|\.)(youtube\.com|youtu\.be|youtube-nocookie\.com)$/.test(hostOf(u));
const isVimeo = (u) => /(^|\.)vimeo\.com$/.test(hostOf(u));
function getYouTubeId(u){
  try{
    const x = new URL(u);
    let id = x.hostname.endsWith("youtu.be") ? x.pathname.slice(1).split("/")[0] : x.searchParams.get("v");
    if(!id){ const m = x.pathname.match(/\/(?:embed|shorts|live|v)\/([\w-]+)/); id = m ? m[1] : ""; }
    return /^[\w-]{6,}$/.test(id || "") ? id : "";
  }catch(e){ return ""; }
}
const getVimeoId = (u) => { const m = String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/i); return m ? m[1] : ""; };
const extOf = (u) => { try{ return new URL(u).pathname.split(".").pop().toLowerCase(); }catch(e){ return ""; } };

const MEDIA_KEYS = ["videoUrl","videoURL","video_url","contentUrl","contentURL","video","videoLink","mediaUrl","mediaURL"];
const PDF_KEYS = ["pdfUrl","pdfURL","pdf","fileUrl","fileURL","documentUrl"];
const AUDIO_KEYS = ["audioUrl","audioURL","audio"];
const LIVE_KEYS = ["liveUrl","liveURL","liveLink","meetingUrl","meetingLink","joinUrl"];
const LINK_KEYS = ["url","resourceUrl","link","externalUrl"];
const TEXT_KEYS = ["content","text","body","article"];

/* BACK: all lessons of this course */
function setBack(){
  const a = $("backBtn");
  if(courseId) a.href = `course-lesson.html?courseId=${encodeURIComponent(courseId)}&lessonId=${encodeURIComponent(lessonId)}`;
}

/* ERROR */
function showError(message){
  pageContent.innerHTML = `
    <div class="state"><div class="state-icon">${icon("alert")}</div>
      <h2>Unable to open this lesson</h2>
      <p>${esc(message)}</p>
      <a class="btn amber" href="courses.html">Browse courses</a>
    </div>`;
}

/* LOAD */
loadLesson();

async function loadLesson(){
  if(!lessonId){ showError("Lesson ID is missing."); return; }
  try{
    const snap = await getDoc(doc(db, "lessons", lessonId));
    if(!snap.exists()){ showError("Lesson not found."); return; }
    currentLesson = { id: snap.id, ...snap.data() };
    if(!isVisible(currentLesson)){ showError("This lesson is not currently available."); return; }

    courseId = getCourseId(currentLesson) || (params.get("courseId") || "").trim();
    if(!courseId){ showError("This lesson is not linked to a course."); return; }
    setBack();

    await Promise.all([loadCourse(), loadRelatedLessons()]);
    renderPage();
  }catch(error){
    console.error("Lesson loading error:", error);
    showError(error.message || "Unable to load this lesson.");
  }
}

async function loadCourse(){
  currentCourse = { id: courseId, title: "Course" };
  try{
    const s = await getDoc(doc(db, "courses", courseId));
    if(s.exists()) currentCourse = { id: s.id, ...s.data() };
  }catch(e){ console.warn("Course loading failed:", e); }
}

/* Only this course's lessons are requested */
async function loadRelatedLessons(){
  relatedLessons = [];
  try{
    const snap = await getDocs(query(collection(db, "lessons"), where("courseId", "==", courseId)));
    snap.forEach((d) => {
      const data = d.data() || {};
      if(isVisible(data)) relatedLessons.push({ id: d.id, ...data });
    });
  }catch(e){ console.warn("Related lessons failed:", e); }

  if(!relatedLessons.some(l => l.id === lessonId)) relatedLessons.push(currentLesson);

  const num = (l, keys) => Number(keys.map(k => l[k]).find(v => v !== undefined && v !== null && v !== "") ?? 0) || 0;
  relatedLessons.sort((a, b) =>
    num(a, ["moduleOrder","modulePosition"]) - num(b, ["moduleOrder","modulePosition"]) ||
    num(a, ["order","lessonOrder","position"]) - num(b, ["order","lessonOrder","position"]));
  currentIndex = relatedLessons.findIndex(l => l.id === lessonId);
}

/* PLAYER: picks the right viewer for the lesson content */
function notice(kind, title, text, url, label){
  return { cls: "note", html: `
    <div class="big">${icon(kind)}</div>
    <h2>${esc(title)}</h2>
    <p>${esc(text)}</p>
    <a class="btn solid" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${icon("ext")}${esc(label)}</a>` };
}

function buildPlayer(l){
  const type = String(first(l, ["type","lessonType"])).toLowerCase();
  const media = safeUrl(first(l, MEDIA_KEYS)), pdf = safeUrl(first(l, PDF_KEYS)), audio = safeUrl(first(l, AUDIO_KEYS));
  const live = safeUrl(first(l, LIVE_KEYS)), link = safeUrl(first(l, LINK_KEYS)), text = first(l, TEXT_KEYS);

  if(live && (type.includes("live") || !media)) return notice("live", "Live lesson", "Join the live lesson using the button below.", live, "Join live lesson");

  const src = media || (link && /^(mp4|webm|ogg|mov|m4v)$/.test(extOf(link)) ? link : "");
  if(src){
    if(isYouTube(src)){
      const id = getYouTubeId(src);
      if(id) return { cls: "ratio", kind: "frame", html: `<iframe src="https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&playsinline=1" title="Lesson video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>` };
    }else if(isVimeo(src)){
      const id = getVimeoId(src);
      if(id) return { cls: "ratio", kind: "frame", html: `<iframe src="https://player.vimeo.com/video/${id}" title="Lesson video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>` };
    }else if(type.includes("audio") || /^(mp3|wav|m4a|aac)$/.test(extOf(src))){
      return { cls: "audio", html: `${icon("audio")}<audio controls preload="metadata" src="${esc(src)}"></audio>` };
    }else{
      return { cls: "ratio", kind: "video", html: `<video id="lessonVideo" controls playsinline preload="metadata" src="${esc(src)}"></video>` };
    }
  }

  if(audio) return { cls: "audio", html: `${icon("audio")}<audio controls preload="metadata" src="${esc(audio)}"></audio>` };

  const pdfUrl = pdf || (link && (type.includes("pdf") || extOf(link) === "pdf") ? link : "");
  if(pdfUrl) return { cls: "pdf", html: `<iframe src="${esc(pdfUrl)}" title="Lesson PDF"></iframe>`, after: `<a class="pdf-link" href="${esc(pdfUrl)}" target="_blank" rel="noopener noreferrer">Open the PDF in a new tab</a>` };

  if(text && !link) return { cls: "text", html: esc(text) };
  if(link) return notice("link", "Lesson resource", "Open the lesson resource below.", link, "Open resource");
  if(live) return notice("live", "Live lesson", "Join the live lesson using the button below.", live, "Join live lesson");
  if(text) return { cls: "text", html: esc(text) };
  return { cls: "note", html: `<div class="big">${icon("book")}</div><h2>No lesson content</h2><p>This lesson doesn't have content available yet.</p>` };
}

/* RENDER */
function lessonUrl(l){ return `lesson-watch.html?id=${encodeURIComponent(l.id)}&courseId=${encodeURIComponent(courseId)}`; }

function renderPage(){
  const l = currentLesson;
  const title = first(l, ["title","name","lessonTitle"]) || "Untitled lesson";
  const description = first(l, ["description","summary"]);
  const type = first(l, ["type","lessonType"]) || "Lesson";
  const duration = first(l, ["duration","length"]);
  const moduleName = first(l, ["moduleTitle","moduleName"]);
  const courseTitle = first(currentCourse, ["title","name","courseTitle","courseName"]) || "Course";
  const prev = relatedLessons[currentIndex - 1], next = relatedLessons[currentIndex + 1];
  const player = buildPlayer(l);
  const done = relatedLessons.filter(x => isDone(x.id)).length;
  const pct = relatedLessons.length ? Math.round(done / relatedLessons.length * 100) : 0;

  document.title = `${title} | LetsStudy Pro`;

  pageContent.innerHTML = `
    <div class="lesson-header">
      <a class="course-link" href="course-learn.html?courseId=${encodeURIComponent(courseId)}">${icon("book")}${esc(courseTitle)}</a>
      <h1>${esc(title)}</h1>
      <div class="chips">
        <span class="chip">${icon("play")}${esc(type)}</span>
        ${duration ? `<span class="chip">${icon("clock")}${esc(duration)}</span>` : ""}
        ${currentIndex >= 0 ? `<span class="chip">Lesson ${currentIndex + 1} of ${relatedLessons.length}</span>` : ""}
      </div>
    </div>

    <div class="stage ${player.cls}">${player.html}</div>
    ${player.after || ""}

    <div class="controls">
      <a class="btn prev" ${prev ? `href="${lessonUrl(prev)}"` : 'aria-disabled="true"'}>${icon("arrow")}Previous</a>
      <a class="btn amber" ${next ? `href="${lessonUrl(next)}"` : 'aria-disabled="true"'}>Next lesson${icon("arrow")}</a>
      <button class="btn sp" id="completeBtn" type="button" aria-pressed="false">${icon("check")}<span id="completeText">Mark as complete</span></button>
    </div>

    <div class="lesson-body">
      <section class="content-card">
        <h2>About this lesson</h2>
        <p class="description">${description ? esc(description) : "No description available for this lesson."}</p>
      </section>
      <aside class="sidebar-card">
        <h3>Lesson details</h3>
        <div class="sidebar-item"><div class="sidebar-label">Course</div><div class="sidebar-value">${esc(courseTitle)}</div></div>
        ${moduleName ? `<div class="sidebar-item"><div class="sidebar-label">Module</div><div class="sidebar-value">${esc(moduleName)}</div></div>` : ""}
        <div class="sidebar-item"><div class="sidebar-label">Type</div><div class="sidebar-value">${esc(type)}</div></div>
        ${duration ? `<div class="sidebar-item"><div class="sidebar-label">Duration</div><div class="sidebar-value">${esc(duration)}</div></div>` : ""}
        <div class="sidebar-item"><div class="sidebar-label">Your progress</div><div class="sidebar-value" id="courseProgressText">${done} of ${relatedLessons.length} lessons completed</div><div class="bar"><i id="courseBar" style="width:${pct}%"></i></div></div>
      </aside>
    </div>`;

  updateComplete();
  $("completeBtn").addEventListener("click", () => markDone(!isDone(lessonId)));
  if(player.kind === "video") wireVideo($("lessonVideo"));
}

/* COMPLETION */
function updateComplete(){
  const d = isDone(lessonId), btn = $("completeBtn");
  btn.classList.toggle("done", d);
  btn.setAttribute("aria-pressed", String(d));
  $("completeText").textContent = d ? "Completed" : "Mark as complete";
  const count = relatedLessons.filter(x => isDone(x.id)).length;
  $("courseProgressText").textContent = `${count} of ${relatedLessons.length} lessons completed`;
  $("courseBar").style.width = relatedLessons.length ? `${Math.round(count / relatedLessons.length * 100)}%` : "0%";
}
function markDone(v){ setDone(lessonId, v); updateComplete(); }

/* DIRECT VIDEO: resumes where you stopped and completes the lesson at 90% */
function wireVideo(video){
  let last = 0;
  video.addEventListener("loadedmetadata", () => {
    let t = 0;
    try{ t = Number(localStorage.getItem(keyPos(lessonId))) || 0; }catch(e){}
    if(t > 5 && video.duration && t < video.duration - 5) video.currentTime = t;
  });
  video.addEventListener("timeupdate", () => {
    if(!video.duration) return;
    const now = Date.now();
    if(now - last > 2000){
      last = now;
      try{ localStorage.setItem(keyPos(lessonId), String(Math.floor(video.currentTime))); }catch(e){}
    }
    if(video.currentTime / video.duration >= 0.9 && !isDone(lessonId)) markDone(true);
  });
  video.addEventListener("ended", () => { if(!isDone(lessonId)) markDone(true); });
}
</script>
</body>
</html>
