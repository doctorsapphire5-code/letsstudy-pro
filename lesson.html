<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Lesson | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.topbar-inner{
  max-width:1450px;
  min-height:64px;
  margin:auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#2563eb;
}

.logo span{
  color:#111827;
}

.back-btn{
  border:1px solid #e5e7eb;
  background:#fff;
  color:#374151;
  padding:9px 14px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.page{
  width:100%;
  max-width:1450px;
  margin:auto;
  padding:24px 20px 40px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:22px;
}

.card,
.sidebar,
.loading,
.error{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(15,23,42,.05);
}

.player{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  position:relative;
  overflow:hidden;
}

.player iframe,
.player video{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.player video{
  object-fit:contain;
  background:#000;
}

.player-message{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  background:#111827;
  color:#fff;
}

.player-message-inner{
  max-width:520px;
}

.player-message-icon{
  font-size:42px;
  margin-bottom:12px;
}

.player-message h3{
  margin:0 0 8px;
}

.player-message p{
  margin:0;
  color:#cbd5e1;
  line-height:1.6;
  font-size:14px;
}

.lesson-header{
  padding:25px;
  border-bottom:1px solid #e5e7eb;
}

.lesson-title{
  margin:0 0 10px;
  font-size:clamp(23px,3vw,34px);
  line-height:1.25;
  color:#111827;
}

.description{
  margin:0;
  color:#64748b;
  line-height:1.7;
  font-size:15px;
  white-space:pre-wrap;
}

.meta{
  padding:16px 25px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  border-bottom:1px solid #e5e7eb;
}

.badge{
  padding:7px 11px;
  border-radius:8px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  color:#475569;
  font-size:12px;
  font-weight:700;
}

.badge.status{
  background:#f0fdf4;
  border-color:#bbf7d0;
  color:#166534;
}

.info{
  padding:25px;
}

.info h2{
  margin:0 0 16px;
  font-size:19px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.info-box{
  padding:14px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:10px;
  min-width:0;
}

.info-box small{
  display:block;
  color:#64748b;
  font-size:11px;
  margin-bottom:6px;
}

.info-box strong{
  display:block;
  color:#111827;
  font-size:13px;
  overflow-wrap:anywhere;
}

.sidebar{
  position:sticky;
  top:85px;
  max-height:calc(100vh - 105px);
  display:flex;
  flex-direction:column;
}

.sidebar-header{
  padding:18px;
  border-bottom:1px solid #e5e7eb;
}

.sidebar-header h2{
  margin:0;
  font-size:17px;
}

.sidebar-header p{
  margin:5px 0 0;
  color:#64748b;
  font-size:12px;
}

.lesson-list{
  padding:10px;
  overflow-y:auto;
}

.lesson-item{
  width:100%;
  text-align:left;
  padding:13px;
  margin-bottom:7px;
  border:1px solid transparent;
  border-radius:10px;
  background:#f8fafc;
  cursor:pointer;
}

.lesson-item:hover{
  background:#eff6ff;
  border-color:#bfdbfe;
}

.lesson-item.active{
  background:#eff6ff;
  border-color:#2563eb;
}

.lesson-number{
  display:block;
  color:#64748b;
  font-size:10px;
  font-weight:800;
  margin-bottom:5px;
  text-transform:uppercase;
}

.lesson-item.active .lesson-number{
  color:#2563eb;
}

.lesson-name{
  display:block;
  color:#111827;
  font-size:13px;
  font-weight:750;
  line-height:1.4;
}

.lesson-meta{
  display:block;
  margin-top:5px;
  color:#64748b;
  font-size:11px;
}

.loading,
.error{
  padding:55px 25px;
  text-align:center;
}

.loader{
  width:42px;
  height:42px;
  margin:0 auto 15px;
  border:4px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loading h2,
.error h2{
  margin:0 0 8px;
}

.loading p,
.error p{
  color:#64748b;
  margin:0;
}

.hidden{
  display:none!important;
}

footer{
  text-align:center;
  padding:25px;
  color:#64748b;
  font-size:12px;
}

@media(max-width:1000px){

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:static;
    max-height:none;
  }

  .lesson-list{
    max-height:400px;
  }
}

@media(max-width:650px){

  .topbar-inner{
    padding:0 13px;
  }

  .logo{
    font-size:18px;
  }

  .page{
    padding:12px 0 30px;
  }

  .card{
    border-radius:0;
    border-left:0;
    border-right:0;
  }

  .lesson-header{
    padding:19px 16px;
  }

  .meta{
    padding:14px 16px;
  }

  .info{
    padding:20px 16px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .sidebar{
    margin:0 10px;
  }
}
</style>
</head>

<script type="module">

/* =====================================================
   FIREBASE SDK
===================================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXKbljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
  initializeApp(
    firebaseConfig
  );

const db =
  getFirestore(
    app
  );


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "errorBox"
  );

const layout =
  document.getElementById(
    "layout"
  );

const player =
  document.getElementById(
    "player"
  );

const lessonList =
  document.getElementById(
    "lessonList"
  );


/* =====================================================
   STATE
===================================================== */

const lessonsMap =
  new Map();

let currentLessonId =
  null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value){
    return "—";
  }

  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value
        .toDate()
        .toLocaleString(
          "en-US",
          {
            dateStyle:"medium",
            timeStyle:"short"
          }
        );

    }


    const date =
      new Date(value);


    if(
      !isNaN(
        date.getTime()
      )
    ){

      return date.toLocaleString(
        "en-US",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );

    }

  }catch(error){

    console.warn(
      "Date error:",
      error
    );

  }

  return String(value);

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(url){

  try{

    const parsed =
      new URL(url);

    const host =
      parsed.hostname.toLowerCase();


    if(
      host.includes("youtube.com")
    ){

      const id =
        parsed.searchParams.get("v");

      if(id){
        return id;
      }


      if(
        parsed.pathname.startsWith(
          "/embed/"
        )
      ){

        return parsed.pathname
          .split("/embed/")[1]
          .split("/")[0];

      }


      if(
        parsed.pathname.startsWith(
          "/shorts/"
        )
      ){

        return parsed.pathname
          .split("/shorts/")[1]
          .split("/")[0];

      }

    }


    if(
      host === "youtu.be"
    ){

      return parsed.pathname
        .replace("/","")
        .split("/")[0];

    }

  }catch(error){

    console.warn(
      "YouTube URL error:",
      error
    );

  }

  return null;

}


/* =====================================================
   PLAYER MESSAGE
===================================================== */

function showPlayerMessage(message){

  player.innerHTML = `

    <div class="player-message">

      <div class="player-message-inner">

        <div class="player-message-icon">
          ▶
        </div>

        <h3>
          Lesson Content
        </h3>

        <p>
          ${escapeHtml(message)}
        </p>

      </div>

    </div>

  `;

}


/* =====================================================
   CREATE VIDEO
===================================================== */

function createVideoPlayer(url){

  const cleanUrl =
    String(
      url || ""
    ).trim();


  if(!cleanUrl){

    showPlayerMessage(
      "No contentUrl was found in this Firestore lesson."
    );

    return;

  }


  /* ================================================
     YOUTUBE
  ================================================ */

  const youtubeId =
    getYouTubeId(
      cleanUrl
    );


  if(youtubeId){

    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.src =
      `https://www.youtube.com/embed/${
        encodeURIComponent(
          youtubeId
        )
      }?rel=0&modestbranding=1&playsinline=1`;


    iframe.title =
      "LetsStudy Pro Lesson";


    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";


    iframe.allowFullscreen =
      true;


    player.replaceChildren(
      iframe
    );

    return;

  }


  /* ================================================
     DIRECT VIDEO
     
     Example:
     https://example.com/video.mp4
  ================================================ */

  const video =
    document.createElement(
      "video"
    );


  video.src =
    cleanUrl;


  video.controls =
    true;


  video.playsInline =
    true;


  video.preload =
    "metadata";


  video.addEventListener(
    "error",
    () => {

      showPlayerMessage(
        "Unable to play this video. Check the contentUrl saved in Firestore."
      );

    }
  );


  player.replaceChildren(
    video
  );

}


/* =====================================================
   LOAD CONTENT
===================================================== */

function loadContent(data){

  const url =
    String(
      data.contentUrl || ""
    ).trim();


  const type =
    String(
      data.type || "video"
    )
    .trim()
    .toLowerCase();


  if(!url){

    showPlayerMessage(
      "This lesson does not have a contentUrl."
    );

    return;

  }


  if(
    type === "video" ||
    type === "mp4" ||
    type === "webm"
  ){

    createVideoPlayer(
      url
    );

    return;

  }


  if(
    type === "pdf" ||
    type === "document"
  ){

    const iframe =
      document.createElement(
        "iframe"
      );

    iframe.src = url;

    iframe.title =
      "Lesson PDF";

    player.replaceChildren(
      iframe
    );

    return;

  }


  if(type === "audio"){

    const audio =
      document.createElement(
        "audio"
      );

    audio.src = url;

    audio.controls = true;

    audio.style.width =
      "100%";

    audio.style.position =
      "absolute";

    audio.style.left =
      "0";

    audio.style.right =
      "0";

    audio.style.top =
      "50%";

    audio.style.transform =
      "translateY(-50%)";

    audio.style.padding =
      "20px";

    player.replaceChildren(
      audio
    );

    return;

  }


  /* FALLBACK */

  createVideoPlayer(
    url
  );

}


/* =====================================================
   DISPLAY LESSON
===================================================== */

function displayLesson(
  lessonId,
  data
){

  currentLessonId =
    lessonId;


  document.title =
    `${
      data.title ||
      "Lesson"
    } | LetsStudy Pro`;


  document.getElementById(
    "title"
  ).textContent =
    data.title ||
    "Untitled Lesson";


  document.getElementById(
    "description"
  ).textContent =
    data.description ||
    "No description available.";


  document.getElementById(
    "lessonId"
  ).textContent =
    lessonId;


  document.getElementById(
    "courseId"
  ).textContent =
    data.courseId ||
    "—";


  document.getElementById(
    "moduleId"
  ).textContent =
    data.moduleId ||
    "—";


  document.getElementById(
    "createdBy"
  ).textContent =
    data.createdBy ||
    "—";


  document.getElementById(
    "createdAt"
  ).textContent =
    formatDate(
      data.createdAt
    );


  document.getElementById(
    "updatedAt"
  ).textContent =
    formatDate(
      data.updatedAt
    );


  document.getElementById(
    "meta"
  ).innerHTML = `

    <span class="badge">
      ${escapeHtml(
        data.type || "lesson"
      )}
    </span>

    <span class="badge">
      Duration:
      ${escapeHtml(
        data.duration || "—"
      )}
    </span>

    <span class="badge">
      Order:
      ${escapeHtml(
        data.order ?? "—"
      )}
    </span>

    <span class="badge status">
      ${escapeHtml(
        data.status || "unknown"
      )}
    </span>

  `;


  loadContent(
    data
  );


  document
    .querySelectorAll(
      ".lesson-item"
    )
    .forEach(
      item => {

        item.classList.toggle(
          "active",
          item.dataset.id ===
          lessonId
        );

      }
    );

}


/* =====================================================
   OPEN LESSON FROM FIRESTORE
===================================================== */

async function openLesson(
  lessonId
){

  try{

    const ref =
      doc(
        db,
        "lessons",
        lessonId
      );


    const snap =
      await getDoc(
        ref
      );


    if(
      !snap.exists()
    ){

      showPlayerMessage(
        "Lesson not found in Firestore."
      );

      return;

    }


    const data =
      snap.data();


    lessonsMap.set(
      lessonId,
      data
    );


    displayLesson(
      lessonId,
      data
    );

  }catch(error){

    console.error(
      "Failed to load lesson:",
      error
    );


    showPlayerMessage(
      "Failed to load this lesson from Firestore."
    );

  }

}


/* =====================================================
   RENDER LESSONS
===================================================== */

function renderLessons(){

  lessonList.innerHTML =
    "";


  const lessons =
    Array.from(
      lessonsMap.entries()
    )
    .sort(
      (a,b) =>
        Number(
          a[1].order ?? 999999
        ) -
        Number(
          b[1].order ?? 999999
        )
    );


  lessons.forEach(
    (
      [lessonId,data],
      index
    ) => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "lesson-item";


      button.dataset.id =
        lessonId;


      button.innerHTML = `

        <span class="lesson-number">
          Lesson ${
            escapeHtml(
              data.order ??
              index + 1
            )
          }
        </span>

        <span class="lesson-name">
          ${escapeHtml(
            data.title ||
            "Untitled Lesson"
          )}
        </span>

        <span class="lesson-meta">
          ${escapeHtml(
            data.type ||
            "lesson"
          )}

          ${
            data.duration
              ? `
                •
                ${escapeHtml(
                  data.duration
                )}
              `
              : ""
          }
        </span>

      `;


      button.addEventListener(
        "click",
        () => {

          openLesson(
            lessonId
          );

        }
      );


      lessonList.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   LOAD FIRESTORE COLLECTION
===================================================== */

/* =====================================================
   LOAD FIRESTORE COLLECTION
===================================================== */

async function loadLessons(){

  try{

    console.log(
      "Loading lessons collection..."
    );


    /* =================================================
       GET ALL LESSON DOCUMENTS
       Collection:
       lessons/{lessonId}
    ================================================= */

    const lessonsRef =
      collection(
        db,
        "lessons"
      );


    const snapshot =
      await getDocs(
        lessonsRef
      );


    console.log(
      "Firestore lessons:",
      snapshot.size
    );


    lessonsMap.clear();


    /* =================================================
       READ EACH DOCUMENT
    ================================================= */

    snapshot.forEach(
      lessonDoc => {

        /*
         * Firestore document ID
         */

        const lessonId =
          lessonDoc.id;


        /*
         * Complete document data
         */

        const data =
          lessonDoc.data();


        console.log(
          "Loaded lesson:",
          lessonId,
          data
        );


        lessonsMap.set(
          lessonId,
          data
        );

      }
    );


    /* =================================================
       STOP LOADING
    ================================================= */

    loading.classList.add(
      "hidden"
    );


    /* =================================================
       CHECK EMPTY COLLECTION
    ================================================= */

    if(
      lessonsMap.size === 0
    ){

      layout.classList.add(
        "hidden"
      );


      errorBox.classList.remove(
        "hidden"
      );


      errorBox.innerHTML = `

        <div>

          <div
            style="
              font-size:44px;
              margin-bottom:12px;
            "
          >
            📚
          </div>

          <h2>
            No Lessons Found
          </h2>

          <p>
            No documents were found in the
            <strong>lessons</strong>
            Firestore collection.
          </p>

        </div>

      `;


      return;

    }


    /* =================================================
       SHOW CONTENT
    ================================================= */

    errorBox.classList.add(
      "hidden"
    );


    layout.classList.remove(
      "hidden"
    );


    /* =================================================
       RENDER LESSON LIST
    ================================================= */

    renderLessons();


    /* =================================================
       SORT LESSONS BY ORDER
    ================================================= */

    const sortedLessons =
      Array.from(
        lessonsMap.entries()
      )
      .sort(
        (
          a,
          b
        ) => {

          const orderA =
            Number(
              a[1].order ?? 999999
            );


          const orderB =
            Number(
              b[1].order ?? 999999
            );


          return (
            orderA -
            orderB
          );

        }
      );


    /* =================================================
       DISPLAY FIRST LESSON
    ================================================= */

    if(
      sortedLessons.length > 0
    ){

      const [
        lessonId,
        lessonData
      ] =
        sortedLessons[0];


      console.log(
        "Opening lesson:",
        lessonId
      );


      displayLesson(
        lessonId,
        lessonData
      );

    }

  }catch(error){

    console.error(
      "Failed to load lessons:",
      error
    );


    /* =================================================
       STOP LOADING
    ================================================= */

    loading.classList.add(
      "hidden"
    );


    layout.classList.add(
      "hidden"
    );


    errorBox.classList.remove(
      "hidden"
    );


    /* =================================================
       FIRESTORE ERROR
    ================================================= */

    let errorMessage =
      error?.message ||
      "Unable to load lessons from Firestore.";


    if(
      error?.code ===
      "permission-denied"
    ){

      errorMessage =
        "Firestore permission denied. Please check your Firestore Security Rules.";

    }


    if(
      error?.code ===
      "unavailable"
    ){

      errorMessage =
        "Firestore is temporarily unavailable. Please check your internet connection.";

    }


    errorBox.innerHTML = `

      <div>

        <div
          style="
            font-size:44px;
            margin-bottom:12px;
          "
        >
          ⚠️
        </div>

        <h2>
          Failed to Load Lessons
        </h2>

        <p>
          ${escapeHtml(
            errorMessage
          )}
        </p>

        <button
          id="retryLessons"
          type="button"
          style="
            margin-top:18px;
            border:0;
            background:#2563eb;
            color:#fff;
            padding:11px 18px;
            border-radius:9px;
            cursor:pointer;
            font-weight:700;
          "
        >
          Retry
        </button>

      </div>

    `;


    /* =================================================
       RETRY
    ================================================= */

    const retryButton =
      document.getElementById(
        "retryLessons"
      );


    if(retryButton){

      retryButton.addEventListener(
        "click",
        () => {

          errorBox.classList.add(
            "hidden"
          );


          loading.classList.remove(
            "hidden"
          );


          loadLessons();

        }
      );

    }

  }

}


/* =====================================================
   BACK BUTTON
===================================================== */

const backButton =
  document.getElementById(
    "backBtn"
  );


if(backButton){

  backButton.addEventListener(
    "click",
    () => {

      if(
        window.history.length > 1
      ){

        window.history.back();

      }else{

        window.location.href =
          "courses.html";

      }

    }
  );

}


/* =====================================================
   START LESSON PAGE
===================================================== */

loadLessons();


/* =====================================================
   PREVENT PAGE FROM STAYING ON LOADING FOREVER
===================================================== */

setTimeout(
  () => {

    if(
      !loading.classList.contains(
        "hidden"
      )
    ){

      console.warn(
        "Lesson loading is taking longer than expected."
      );

    }

  },
  10000
);

</script>

</body>
</html>
