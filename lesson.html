<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lesson | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

.container{
max-width:1000px;
margin:auto;
padding:18px;
}

/* HEADER */

.header{
background:#fff;
padding:18px;
border-radius:16px;
margin-bottom:18px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.back{
display:inline-flex;
align-items:center;
gap:8px;
color:#2563eb;
text-decoration:none;
font-size:13px;
margin-bottom:15px;
}

.lesson-title{
font-size:27px;
margin:0;
line-height:1.3;
}

.lesson-meta{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

.badge{
background:#f1f5f9;
color:#475569;
padding:6px 10px;
border-radius:20px;
font-size:11px;
}

.badge.active{
background:#dcfce7;
color:#166534;
}

/* CONTENT */

.content-card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:18px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.description{
font-size:15px;
line-height:1.8;
color:#475569;
white-space:pre-line;
}

/* VIDEO */

.video-wrapper{
position:relative;
width:100%;
background:#000;
border-radius:14px;
overflow:hidden;
margin-bottom:20px;
aspect-ratio:16/9;
}

.video-wrapper video{
width:100%;
height:100%;
display:block;
}

.video-wrapper iframe{
width:100%;
height:100%;
border:0;
}

/* CONTENT LINK */

.content-link{
display:inline-flex;
align-items:center;
gap:8px;
background:#2563eb;
color:#fff;
text-decoration:none;
padding:12px 17px;
border-radius:9px;
font-weight:bold;
font-size:13px;
margin-top:12px;
}

/* NAVIGATION */

.navigation{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:20px;
}

.nav-btn{
display:inline-flex;
align-items:center;
gap:8px;
padding:12px 16px;
background:#f1f5f9;
color:#334155;
border-radius:9px;
text-decoration:none;
font-size:13px;
font-weight:bold;
}

.nav-btn:hover{
background:#e2e8f0;
}

/* LOADING */

.loading,
.error,
.empty{
background:#fff;
border-radius:16px;
padding:50px 20px;
text-align:center;
box-shadow:0 4px 18px rgba(0,0,0,.06);
color:#64748b;
}

.loading i,
.error i{
font-size:38px;
margin-bottom:15px;
}

.error{
color:#991b1b;
}

.error button{
border:0;
background:#2563eb;
color:#fff;
padding:11px 16px;
border-radius:8px;
cursor:pointer;
margin-top:15px;
}

/* MOBILE */

@media(max-width:600px){

.container{
padding:10px;
}

.lesson-title{
font-size:22px;
}

.content-card{
padding:15px;
}

.navigation{
flex-direction:column;
}

.nav-btn{
justify-content:center;
}

}

</style>

</head>

<body>

<div class="container">


<!-- LOADING -->

<div id="loading" class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<br><br>

Loading lesson...

</div>


<!-- ERROR -->

<div
id="error"
class="error"
style="display:none">

<i class="fa-solid fa-triangle-exclamation"></i>

<h3>Unable to load lesson</h3>

<p id="errorText"></p>

<button onclick="location.reload()">
Try Again
</button>

</div>


<!-- LESSON -->

<div
id="lessonPage"
style="display:none">


<!-- HEADER -->

<div class="header">

<a
href="javascript:history.back()"
class="back">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>


<h1
id="lessonTitle"
class="lesson-title">
Lesson
</h1>


<div
id="lessonMeta"
class="lesson-meta">
</div>

</div>


<!-- CONTENT -->

<div class="content-card">


<!-- VIDEO / CONTENT -->

<div
id="lessonContent">
</div>


<!-- DESCRIPTION -->

<div>

<h3>
About this lesson
</h3>


<div
id="lessonDescription"
class="description">
</div>

</div>


</div>


<!-- NAVIGATION -->

<div class="content-card">

<div class="navigation">

<a
id="previousLesson"
class="nav-btn"
href="#"
style="display:none">

<i class="fa-solid fa-arrow-left"></i>

Previous Lesson

</a>


<a
id="nextLesson"
class="nav-btn"
href="#"
style="display:none">

Next Lesson

<i class="fa-solid fa-arrow-right"></i>

</a>

</div>

</div>


</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
getFirestore,
doc,
getDoc,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(
firebaseConfig
);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
document.getElementById(
"loading"
);

const errorBox =
document.getElementById(
"error"
);

const errorText =
document.getElementById(
"errorText"
);

const lessonPage =
document.getElementById(
"lessonPage"
);

const lessonTitle =
document.getElementById(
"lessonTitle"
);

const lessonMeta =
document.getElementById(
"lessonMeta"
);

const lessonDescription =
document.getElementById(
"lessonDescription"
);

const lessonContent =
document.getElementById(
"lessonContent"
);

const previousLesson =
document.getElementById(
"previousLesson"
);

const nextLesson =
document.getElementById(
"nextLesson"
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   GET LESSON ID
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

const lessonId =
params.get("id");


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(text){

loading.style.display =
"none";

lessonPage.style.display =
"none";

errorBox.style.display =
"block";

errorText.textContent =
text;

}


/* =====================================================
   RENDER CONTENT
===================================================== */

function renderLessonContent(lesson){

const type =
String(
lesson.type || ""
)
.toLowerCase();

const url =
lesson.contentUrl ||
"";


if(!url){

lessonContent.innerHTML = `

<div class="empty">

<i class="fa-solid fa-file-circle-question"></i>

<br><br>

No lesson content available.

</div>

`;

return;

}


/* VIDEO */

if(
type === "video"
){

const safeUrl =
escapeHTML(url);


if(
url.includes("youtube.com") ||
url.includes("youtu.be")
){

let videoId = "";


if(
url.includes("youtu.be/")
){

videoId =
url.split("youtu.be/")[1]
.split(/[?&]/)[0];

}
else{

const match =
url.match(
/[?&]v=([^&]+)/
);

videoId =
match
?
match[1]
:
"";

}


if(videoId){

lessonContent.innerHTML = `

<div class="video-wrapper">

<iframe
src="https://www.youtube.com/embed/${escapeHTML(videoId)}"
allowfullscreen>
</iframe>

</div>

`;

return;

}

}


lessonContent.innerHTML = `

<div class="video-wrapper">

<video
controls
playsinline
preload="metadata">

<source
src="${safeUrl}">

Your browser does not support video playback.

</video>

</div>

`;

return;

}


/* PDF */

if(type === "pdf"){

lessonContent.innerHTML = `

<div class="video-wrapper"
style="aspect-ratio:auto;height:650px">

<iframe
src="${escapeHTML(url)}"
style="width:100%;height:100%;border:0">
</iframe>

</div>

<a
class="content-link"
href="${escapeHTML(url)}"
target="_blank"
rel="noopener">

<i class="fa-solid fa-file-pdf"></i>

Open PDF

</a>

`;

return;

}


/* AUDIO */

if(type === "audio"){

lessonContent.innerHTML = `

<audio
controls
style="width:100%;margin-bottom:20px">

<source
src="${safeUrl}">

Your browser does not support audio.

</audio>

`;

return;

}


/* OTHER / TEXT */

lessonContent.innerHTML = `

<a
class="content-link"
href="${safeUrl}"
target="_blank"
rel="noopener">

<i class="fa-solid fa-external-link"></i>

Open Lesson Content

</a>

`;

}


/* =====================================================
   LOAD PREVIOUS / NEXT
===================================================== */

async function loadNavigation(lesson){

try{

const snap =
await getDocs(
collection(
db,
"lessons"
)
);


let lessons =
snap.docs.map(
item => ({

id:item.id,

...item.data()

})
);


lessons =
lessons
.filter(
item =>
item.courseId ===
lesson.courseId
)
.sort(
(a,b) =>
Number(a.order || 0) -
Number(b.order || 0)
);


const index =
lessons.findIndex(
item =>
item.id ===
lessonId
);


if(index > 0){

const previous =
lessons[index - 1];

previousLesson.href =
"lesson.html?id=" +
encodeURIComponent(
previous.id
);

previousLesson.style.display =
"inline-flex";

}


if(
index !== -1 &&
index <
lessons.length - 1
){

const next =
lessons[index + 1];

nextLesson.href =
"lesson.html?id=" +
encodeURIComponent(
next.id
);

nextLesson.style.display =
"inline-flex";

}

}
catch(error){

console.error(
"Navigation error:",
error
);

}

}


/* =====================================================
   LOAD LESSON
===================================================== */

async function loadLesson(){

if(!lessonId){

showError(
"Lesson ID is missing from the URL."
);

return;

}


try{

const lessonRef =
doc(
db,
"lessons",
lessonId
);


const snapshot =
await getDoc(
lessonRef
);


if(!snapshot.exists()){

showError(
"Lesson not found."
);

return;

}


const lesson =
snapshot.data();


/* TITLE */

document.title =
(
lesson.title ||
"Lesson"
) +
" | LetsStudy Pro";


lessonTitle.textContent =
lesson.title ||
"Untitled Lesson";


/* META */

lessonMeta.innerHTML = `

<span class="badge">

<i class="fa-solid fa-list-ol"></i>

Lesson ${
Number(lesson.order) || 1
}

</span>


<span class="badge">

<i class="fa-solid fa-layer-group"></i>

${escapeHTML(
lesson.type ||
"Lesson"
)}

</span>


${
lesson.duration
?
`
<span class="badge">

<i class="fa-regular fa-clock"></i>

${escapeHTML(
lesson.duration
)}

</span>
`
:
""
}


<span
class="badge ${
String(
lesson.status || ""
).toLowerCase() ===
"published"
?
"active"
:
""
}">

${escapeHTML(
lesson.status ||
""
)}

</span>

`;


/* DESCRIPTION */

lessonDescription.textContent =
lesson.description ||
"No description available.";


/* CONTENT */

renderLessonContent(
lesson
);


/* NAVIGATION */

await loadNavigation(
lesson
);


/* SHOW */

loading.style.display =
"none";

errorBox.style.display =
"none";

lessonPage.style.display =
"block";


}
catch(error){

console.error(
"Load lesson error:",
error
);

showError(
error.message ||
"Failed to load lesson."
);

}

}


/* =====================================================
   START
===================================================== */

loadLesson();

</script>

</body>
</html>
