<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lesson | LetsStudy Pro</title>

  <meta
    name="description"
    content="Learn with LetsStudy Pro. Watch lessons, track your progress and continue your course."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.6;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */
    .header {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      color: #2563eb;
    }

    .back-btn {
      border: none;
      background: #eef2ff;
      color: #2563eb;
      padding: 9px 15px;
      border-radius: 8px;
      font-weight: 600;
    }

    .back-btn:hover {
      background: #dbeafe;
    }

    /* PAGE */
    .page {
      max-width: 1200px;
      margin: auto;
      padding: 28px 20px 60px;
    }

    .breadcrumb {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .breadcrumb span {
      color: #2563eb;
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 25px;
      align-items: start;
    }

    /* MAIN CARD */
    .main-card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .lesson-header {
      padding: 25px;
    }

    .lesson-type {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .lesson-title {
      font-size: 30px;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .lesson-meta {
      color: #64748b;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      font-size: 14px;
    }

    /* CONTENT */
    .content-area {
      background: #0f172a;
      min-height: 450px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-area iframe,
    .content-area video {
      width: 100%;
      height: 500px;
      border: 0;
      display: block;
    }

    .pdf-frame {
      width: 100%;
      height: 650px;
      border: 0;
      background: white;
    }

    .text-content {
      background: #ffffff;
      padding: 30px;
      min-height: 300px;
      white-space: pre-wrap;
    }

    .content-placeholder {
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    .content-placeholder h3 {
      margin-bottom: 8px;
    }

    /* DESCRIPTION */
    .description {
      padding: 25px;
      border-top: 1px solid #e5e7eb;
    }

    .description h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .description p {
      color: #475569;
      white-space: pre-wrap;
    }

    /* ACTIONS */
    .actions {
      padding: 20px 25px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 11px 18px;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* SIDEBAR */
    .sidebar {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      position: sticky;
      top: 85px;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .sidebar-header h3 {
      margin-bottom: 5px;
    }

    .sidebar-header p {
      color: #64748b;
      font-size: 13px;
    }

    .progress-box {
      padding: 18px 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width 0.3s ease;
    }

    .lesson-list {
      max-height: 500px;
      overflow-y: auto;
    }

    .lesson-item {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid #f1f5f9;
      transition: 0.2s;
    }

    .lesson-item:hover {
      background: #f8fafc;
    }

    .lesson-item.active {
      background: #eff6ff;
      border-left: 4px solid #2563eb;
    }

    .lesson-number {
      min-width: 28px;
      height: 28px;
      background: #e2e8f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .lesson-item.active .lesson-number {
      background: #2563eb;
      color: white;
    }

    .lesson-item-info {
      min-width: 0;
    }

    .lesson-item-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .lesson-item-meta {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
    }

    .completed-icon {
      margin-left: auto;
      color: #16a34a;
      font-weight: bold;
    }

    /* LOADING */
    .loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loading-box {
      text-align: center;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: auto auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ERROR */
    .error-page {
      display: none;
      min-height: 70vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .error-page h2 {
      margin-bottom: 10px;
    }

    .error-page p {
      color: #64748b;
      margin-bottom: 20px;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .lesson-list {
        max-height: 400px;
      }
    }

    @media (max-width: 600px) {
      .header {
        padding: 0 14px;
      }

      .page {
        padding: 18px 10px 40px;
      }

      .lesson-header {
        padding: 20px;
      }

      .lesson-title {
        font-size: 24px;
      }

      .content-area iframe,
      .content-area video {
        height: 230px;
      }

      .pdf-frame {
        height: 500px;
      }

      .actions {
        padding: 15px;
      }

      .actions .btn {
        width: 100%;
      }

      .description {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div class="loading" id="loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <p>Loading lesson...</p>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header">
    <button class="back-btn" onclick="goBack()">
      ← Back
    </button>

    <div class="brand">
      LetsStudy Pro
    </div>
  </header>

  <!-- ERROR -->
  <section class="error-page" id="errorPage">
    <div>
      <h2>Lesson Not Found</h2>
      <p id="errorMessage">
        This lesson could not be loaded.
      </p>

      <button class="btn btn-primary" onclick="goBack()">
        Go Back
      </button>
    </div>
  </section>

  <!-- MAIN -->
  <main class="page" id="lessonPage" style="display:none;">

    <div class="breadcrumb">
      <span id="courseName">Course</span>
      /
      <span id="moduleName">Module</span>
      /
      Lesson
    </div>

    <div class="layout">

      <!-- MAIN LESSON -->
      <section class="main-card">

        <div class="lesson-header">

          <span class="lesson-type" id="lessonType">
            Lesson
          </span>

          <h1 class="lesson-title" id="lessonTitle">
            Lesson Title
          </h1>

          <div class="lesson-meta">

            <span id="lessonDuration">
              ⏱ 00:00
            </span>

            <span id="lessonOrder">
              Lesson 1
            </span>

            <span id="lessonStatus">
              Published
            </span>

          </div>

        </div>

        <!-- CONTENT -->
        <div class="content-area" id="contentArea">
        </div>

        <!-- DESCRIPTION -->
        <div class="description">

          <h2>About this lesson</h2>

          <p id="lessonDescription">
            Loading lesson description...
          </p>

        </div>

        <!-- ACTIONS -->
        <div class="actions">

          <button
            class="btn btn-secondary"
            id="previousBtn"
            onclick="previousLesson()"
          >
            ← Previous
          </button>

          <button
            class="btn btn-success"
            id="completeBtn"
            onclick="markCompleted()"
          >
            ✓ Mark as Completed
          </button>

          <button
            class="btn btn-primary"
            id="nextBtn"
            onclick="nextLesson()"
          >
            Next →
          </button>

        </div>

      </section>

      <!-- SIDEBAR -->
      <aside class="sidebar">

        <div class="sidebar-header">

          <h3 id="sidebarCourseName">
            Course
          </h3>

          <p id="sidebarModuleName">
            Module
          </p>

        </div>

        <div class="progress-box">

          <div class="progress-top">
            <span>Your Progress</span>
            <strong id="progressText">0%</strong>
          </div>

          <div class="progress-bar">
            <div
              class="progress-fill"
              id="progressFill"
            ></div>
          </div>

        </div>

        <div
          class="lesson-list"
          id="lessonList"
        ></div>

      </aside>

    </div>

  </main>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      query,
      where,
      orderBy,
      getDocs,
      updateDoc,
      setDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    import {
      getAuth,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


    /* ==========================================
       FIREBASE CONFIG
    ========================================== */

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const auth = getAuth(app);


    /* ==========================================
       GET LESSON ID
    ========================================== */

    const params =
      new URLSearchParams(window.location.search);

    const lessonId =
      params.get("id");


    if (!lessonId) {

      showError(
        "No lesson ID was provided."
      );

    }


    /* ==========================================
       GLOBAL DATA
    ========================================== */

    let currentLesson = null;

    let currentLessons = [];

    let currentIndex = -1;

    let currentUser = null;

    let courseId = null;

    let moduleId = null;


    /* ==========================================
       AUTH
    ========================================== */

    onAuthStateChanged(auth, async user => {

      currentUser = user;

      if (lessonId) {

        await loadLesson();

      }

    });


    /* ==========================================
       LOAD LESSON
    ========================================== */

    async function loadLesson() {

      try {

        showLoading(true);

        const lessonRef =
          doc(db, "lessons", lessonId);

        const lessonSnap =
          await getDoc(lessonRef);


        if (!lessonSnap.exists()) {

          showError(
            "This lesson does not exist."
          );

          return;

        }


        currentLesson = {
          id: lessonSnap.id,
          ...lessonSnap.data()
        };


        /*
         * ONLY PUBLISHED LESSON
         */

        if (
          currentLesson.status &&
          currentLesson.status !== "published"
        ) {

          showError(
            "This lesson is not currently available."
          );

          return;

        }


        courseId =
          currentLesson.courseId || null;

        moduleId =
          currentLesson.moduleId || null;


        renderLesson();


        await loadCourse();

        await loadModuleLessons();

        await loadProgress();


        showLoading(false);

        document.getElementById(
          "lessonPage"
        ).style.display = "block";


      } catch (error) {

        console.error(
          "Load lesson error:",
          error
        );

        showError(
          "Unable to load this lesson."
        );

      }

    }


    /* ==========================================
       RENDER LESSON
    ========================================== */

    function renderLesson() {

      document.title =
        `${currentLesson.title || "Lesson"} | LetsStudy Pro`;


      document.getElementById(
        "lessonTitle"
      ).textContent =
        currentLesson.title || "Untitled Lesson";


      document.getElementById(
        "lessonDescription"
      ).textContent =
        currentLesson.description ||
        "No description available.";


      document.getElementById(
        "lessonDuration"
      ).textContent =
        `⏱ ${currentLesson.duration || "00:00"}`;


      document.getElementById(
        "lessonOrder"
      ).textContent =
        `Lesson ${currentLesson.order || 1}`;


      document.getElementById(
        "lessonStatus"
      ).textContent =
        currentLesson.status || "Published";


      const type =
        (currentLesson.type || "lesson")
          .toLowerCase();


      document.getElementById(
        "lessonType"
      ).textContent =
        type;


      renderContent(type);

    }


    /* ==========================================
       CONTENT RENDERER
    ========================================== */

    function renderContent(type) {

      const area =
        document.getElementById(
          "contentArea"
        );

      const url =
        currentLesson.contentUrl || "";


      area.innerHTML = "";


      /*
       * VIDEO
       */

      if (
        type === "video" &&
        url
      ) {

        const iframe =
          document.createElement("iframe");

        iframe.src =
          convertVideoUrl(url);

        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";

        iframe.allowFullscreen = true;

        area.appendChild(iframe);

        return;

      }


      /*
       * PDF
       */

      if (
        type === "pdf" &&
        url
      ) {

        const iframe =
          document.createElement("iframe");

        iframe.src = url;

        iframe.className =
          "pdf-frame";

        area.style.background =
          "#ffffff";

        area.appendChild(iframe);

        return;

      }


      /*
       * AUDIO
       */

      if (
        type === "audio" &&
        url
      ) {

        area.style.background =
          "#ffffff";

        const audio =
          document.createElement("audio");

        audio.controls = true;

        audio.src = url;

        audio.style.width =
          "90%";

        area.appendChild(audio);

        return;

      }


      /*
       * TEXT
       */

      if (
        type === "text"
      ) {

        area.style.background =
          "#ffffff";

        const div =
          document.createElement("div");

        div.className =
          "text-content";

        div.textContent =
          currentLesson.content ||
          currentLesson.description ||
          "No content available.";

        area.appendChild(div);

        return;

      }


      /*
       * EXTERNAL LINK
       */

      if (url) {

        const div =
          document.createElement("div");

        div.className =
          "content-placeholder";

        div.innerHTML = `
          <h3>Lesson Content</h3>
          <p>Open the lesson content below.</p>
          <br>
          <a
            href="${escapeAttribute(url)}"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-primary"
          >
            Open Content
          </a>
        `;

        area.appendChild(div);

        return;

      }


      /*
       * NO CONTENT
       */

      const div =
        document.createElement("div");

      div.className =
        "content-placeholder";

      div.innerHTML = `
        <h3>Content unavailable</h3>
        <p>This lesson does not have content yet.</p>
      `;

      area.appendChild(div);

    }


    /* ==========================================
       LOAD COURSE
    ========================================== */

    async function loadCourse() {

      if (!courseId) return;


      try {

        const courseRef =
          doc(db, "courses", courseId);

        const courseSnap =
          await getDoc(courseRef);


        if (
          courseSnap.exists()
        ) {

          const course =
            courseSnap.data();


          const name =
            course.title ||
            course.name ||
            "Course";


          document.getElementById(
            "courseName"
          ).textContent = name;


          document.getElementById(
            "sidebarCourseName"
          ).textContent = name;

        }

      } catch (error) {

        console.error(
          "Course error:",
          error
        );

      }

    }


    /* ==========================================
       LOAD MODULE LESSONS
    ========================================== */

    async function loadModuleLessons() {

      if (!moduleId) return;


      try {

        const lessonsRef =
          collection(db, "lessons");


        const q =
          query(
            lessonsRef,
            where(
                    "moduleId",
      "==",
      moduleId
    ),
    orderBy(
      "order",
      "asc"
    )
  );

  const snapshot =
    await getDocs(q);

  currentLessons = [];

  snapshot.forEach(item => {

    const data = item.data();

    if (
      !data.status ||
      data.status === "published"
    ) {
      currentLessons.push({
        id: item.id,
        ...data
      });
    }

  });

  currentIndex =
    currentLessons.findIndex(
      lesson =>
        lesson.id === lessonId
    );

  renderLessonList();

  updateNavigation();

} catch (error) {

  console.error(
    "Lessons error:",
    error
  );

  // Firestore index inaweza kuhitajika
  if (
    error.code ===
    "failed-precondition"
  ) {
    console.error(
      "Create the required Firestore index for moduleId + order."
    );
  }

}
}

/* ==========================================
   LESSON LIST
========================================== */

function renderLessonList() {

  const list =
    document.getElementById(
      "lessonList"
    );

  if (!list) return;

  list.innerHTML = "";

  currentLessons.forEach(
    (lesson, index) => {

      const item =
        document.createElement("a");

      item.href =
        `lesson.html?id=${encodeURIComponent(
          lesson.id
        )}`;

      item.className =
        "lesson-item";

      if (
        lesson.id === lessonId
      ) {
        item.classList.add(
          "active"
        );
      }

      item.innerHTML = `

        <div class="lesson-number">
          ${index + 1}
        </div>

        <div class="lesson-item-info">

          <div class="lesson-item-title">
            ${escapeHTML(
              lesson.title ||
              "Untitled Lesson"
            )}
          </div>

          <div class="lesson-item-meta">
            ${escapeHTML(
              lesson.duration ||
              ""
            )}
          </div>

        </div>

      `;

      list.appendChild(item);

    }
  );

}

/* ==========================================
   PREVIOUS LESSON
========================================== */

window.previousLesson =
  function () {

    if (
      currentIndex <= 0
    ) {
      return;
    }

    const previous =
      currentLessons[
        currentIndex - 1
      ];

    if (!previous) {
      return;
    }

    window.location.href =
      `lesson.html?id=${encodeURIComponent(
        previous.id
      )}`;

  };

/* ==========================================
   NEXT LESSON
========================================== */

window.nextLesson =
  function () {

    if (
      currentIndex < 0 ||
      currentIndex >=
      currentLessons.length - 1
    ) {
      return;
    }

    const next =
      currentLessons[
        currentIndex + 1
      ];

    if (!next) {
      return;
    }

    window.location.href =
      `lesson.html?id=${encodeURIComponent(
        next.id
      )}`;

  };

/* ==========================================
   NAVIGATION
========================================== */

function updateNavigation() {

  const previous =
    document.getElementById(
      "previousBtn"
    );

  const next =
    document.getElementById(
      "nextBtn"
    );

  if (previous) {
    previous.disabled =
      currentIndex <= 0;
  }

  if (next) {
    next.disabled =
      currentIndex < 0 ||
      currentIndex >=
      currentLessons.length - 1;
  }

}

/* ==========================================
   MARK COMPLETED
========================================== */

window.markCompleted =
  async function () {

    if (!currentUser) {

      alert(
        "Please sign in to save your lesson progress."
      );

      return;
    }

    if (!lessonId) {
      return;
    }

    const button =
      document.getElementById(
        "completeBtn"
      );

    try {

      button.disabled = true;

      button.textContent =
        "Saving...";

      const progressRef =
        doc(
          db,
          "users",
          currentUser.uid,
          "lessonProgress",
          lessonId
        );

      await setDoc(
        progressRef,
        {
          lessonId: lessonId,
          courseId: courseId || "",
          moduleId: moduleId || "",
          completed: true,
          completedAt:
            serverTimestamp(),
          updatedAt:
            serverTimestamp()
        },
        {
          merge: true
        }
      );

      button.textContent =
        "✓ Completed";

      button.classList.remove(
        "btn-success"
      );

      button.classList.add(
        "btn-secondary"
      );

      await loadProgress();

    } catch (error) {

      console.error(
        "Progress error:",
        error
      );

      button.disabled = false;

      button.textContent =
        "✓ Mark as Completed";

      alert(
        "Could not save your progress."
      );

    }

  };

/* ==========================================
   LOAD PROGRESS
========================================== */

async function loadProgress() {

  if (!currentUser) {

    updateProgress(0);

    return;
  }

  try {

    if (!lessonId) {
      return;
    }

    const currentProgressRef =
      doc(
        db,
        "users",
        currentUser.uid,
        "lessonProgress",
        lessonId
      );

    const currentProgressSnap =
      await getDoc(
        currentProgressRef
      );

    const button =
      document.getElementById(
        "completeBtn"
      );

    if (
      currentProgressSnap.exists() &&
      currentProgressSnap.data().completed
    ) {

      button.textContent =
        "✓ Completed";

      button.classList.remove(
        "btn-success"
      );

      button.classList.add(
        "btn-secondary"
      );

    }

    if (
      currentLessons.length === 0
    ) {

      updateProgress(0);

      return;
    }

    let completed = 0;

    for (
      const lesson
      of currentLessons
    ) {

      const progressRef =
        doc(
          db,
          "users",
          currentUser.uid,
          "lessonProgress",
          lesson.id
        );

      const progressSnap =
        await getDoc(
          progressRef
        );

      if (
        progressSnap.exists() &&
        progressSnap.data().completed
      ) {

        completed++;

      }

    }

    const percentage =
      Math.round(
        (
          completed /
          currentLessons.length
        ) * 100
      );

    updateProgress(
      percentage
    );

  } catch (error) {

    console.error(
      "Progress loading error:",
      error
    );

  }

}

/* ==========================================
   UPDATE PROGRESS UI
========================================== */

function updateProgress(
  percentage
) {

  const fill =
    document.getElementById(
      "progressFill"
    );

  const text =
    document.getElementById(
      "progressText"
    );

  if (fill) {

    fill.style.width =
      `${percentage}%`;

  }

  if (text) {

    text.textContent =
      `${percentage}%`;

  }

}

/* ==========================================
   VIDEO URL CONVERTER
========================================== */

function convertVideoUrl(url) {

  try {

    const parsed =
      new URL(url);

    /*
     * YouTube
     */

    if (
      parsed.hostname.includes(
        "youtube.com"
      )
    ) {

      const videoId =
        parsed.searchParams.get(
          "v"
        );

      if (videoId) {

        return (
          "https://www.youtube.com/embed/" +
          videoId
        );

      }

    }

    if (
      parsed.hostname.includes(
        "youtu.be"
      )
    ) {

      const videoId =
        parsed.pathname
          .substring(1);

      if (videoId) {

        return (
          "https://www.youtube.com/embed/" +
          videoId
        );

      }

    }

    /*
     * Vimeo
     */

    if (
      parsed.hostname.includes(
        "vimeo.com"
      )
    ) {

      const parts =
        parsed.pathname
          .split("/")
          .filter(Boolean);

      const videoId =
        parts[parts.length - 1];

      if (videoId) {

        return (
          "https://player.vimeo.com/video/" +
          videoId
        );

      }

    }

    return url;

  } catch {

    return url;

  }

}

/* ==========================================
   LOADING
========================================== */

function showLoading(show) {

  const loading =
    document.getElementById(
      "loading"
    );

  if (!loading) return;

  loading.style.display =
    show ? "flex" : "none";

}

/* ==========================================
   ERROR
========================================== */

function showError(message) {

  showLoading(false);

  const page =
    document.getElementById(
      "lessonPage"
    );

  const errorPage =
    document.getElementById(
      "errorPage"
    );

  const errorMessage =
    document.getElementById(
      "errorMessage"
    );

  if (page) {
    page.style.display =
      "none";
  }

  if (errorPage) {
    errorPage.style.display =
      "flex";
  }

  if (errorMessage) {
    errorMessage.textContent =
      message;
  }

}

/* ==========================================
   BACK BUTTON
========================================== */

window.goBack =
  function () {

    if (
      document.referrer
    ) {

      history.back();

    } else {

      window.location.href =
        "courses.html";

    }

  };

/* ==========================================
   SECURITY HELPERS
========================================== */

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

function escapeAttribute(value) {

  return escapeHTML(value);

}
