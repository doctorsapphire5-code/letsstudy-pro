<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Lesson | LetsStudy Pro</title>

<meta
  name="description"
  content="Learn through structured lessons on LetsStudy Pro."
>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.55;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:14px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  color:#172033;
  text-decoration:none;
  font-weight:800;
  font-size:21px;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1050px;
  margin:28px auto;
}

.breadcrumb{
  color:#64748b;
  font-size:13px;
  margin-bottom:14px;
}

.lesson{
  background:#fff;
  border-radius:17px;
  padding:24px;
  box-shadow:0 5px 25px #00000008;
}

h1{
  font-size:30px;
  line-height:1.2;
  margin-bottom:8px;
}

.meta{
  color:#64748b;
  font-size:13px;
  margin-bottom:20px;
}

.video{
  width:100%;
  aspect-ratio:16/9;
  background:#111827;
  border-radius:13px;
  overflow:hidden;
  margin-bottom:22px;
}

.video video,
.video iframe{
  width:100%;
  height:100%;
  border:0;
}

.video-placeholder{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  text-align:center;
  padding:20px;
}

.content{
  font-size:15px;
  color:#334155;
}

.content h2,
.content h3{
  margin:20px 0 8px;
  color:#172033;
}

.content p{
  margin-bottom:12px;
}

.content img{
  max-width:100%;
  border-radius:10px;
}

.resources{
  margin-top:25px;
  border-top:1px solid #e5e7eb;
  padding-top:20px;
}

.resources h2{
  font-size:19px;
  margin-bottom:12px;
}

.resource{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid #e5e7eb;
  border-radius:9px;
  margin-bottom:8px;
}

.resource-name{
  font-weight:700;
  font-size:14px;
}

.download{
  text-decoration:none;
  background:#eef2f7;
  color:#172033;
  padding:8px 11px;
  border-radius:7px;
  font-size:12px;
  white-space:nowrap;
}

.actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:25px;
  border-top:1px solid #e5e7eb;
  padding-top:20px;
}

.btn{
  border:0;
  padding:11px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2f7;
  color:#172033;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.loading,
.error{
  background:#fff;
  border-radius:15px;
  padding:50px 20px;
  text-align:center;
}

.error{
  color:#b91c1c;
}

.success{
  background:#ecfdf5;
  color:#047857;
  padding:12px;
  border-radius:8px;
  margin-top:15px;
  display:none;
}

@media(max-width:600px){

  .lesson{
    padding:17px;
  }

  h1{
    font-size:25px;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

}
</style>
</head>

<body>

<header>

  <a
    href="index.html"
    class="logo"
  >
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <div
    id="page"
    class="loading"
  >
    Loading lesson...
  </div>

</main>


<script>

/*
==================================================
LESSON.HTML

URL:

lesson.html
?courseId=COURSE_ID
&moduleId=MODULE_ID
&lessonId=LESSON_ID

API:

GET /api/data?collection=lessons&id=LESSON_ID

COMPLETE:

POST /api/learning/complete

NO DIRECT FIREBASE
==================================================
*/

const params =
  new URLSearchParams(
    location.search
  );


const courseId =
  params.get("courseId") || "";


const moduleId =
  params.get("moduleId") || "";


const lessonId =
  params.get("lessonId") ||
  params.get("id") ||
  params.get("documentId") ||
  "";


const userId =
  params.get("userId") ||
  params.get("uid") ||
  "";


const page =
  document.getElementById(
    "page"
  );


let lesson = null;


/* =========================
   VALIDATE
========================= */

if(!lessonId){

  showError(
    "No lesson was selected."
  );

}else{

  loadLesson();

}


/* =========================
   LOAD LESSON
========================= */

async function loadLesson(){

  try{

    const response =
      await fetch(
        "/api/data?collection=lessons&id=" +
        encodeURIComponent(
          lessonId
        )
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load lesson."
      );

    }


    lesson =
      result.data ||
      result.lesson;


    if(!lesson){

      throw new Error(
        "Lesson not found."
      );

    }


    renderLesson();


  }catch(error){

    console.error(
      "LESSON:",
      error
    );

    showError(
      error.message
    );

  }

}


/* =========================
   RENDER
========================= */

function renderLesson(){

  const title =
    lesson.title ||
    lesson.name ||
    "Lesson";


  const description =
    lesson.description ||
    "";


  const duration =
    lesson.duration ||
    "";


  const moduleName =
    lesson.moduleName ||
    lesson.moduleTitle ||
    "";


  const courseName =
    lesson.courseName ||
    lesson.courseTitle ||
    "";


  page.className =
    "lesson";


  page.innerHTML = `

    <div class="breadcrumb">

      ${escapeHTML(courseName)}

      ${
        moduleName
        ? " • " +
          escapeHTML(moduleName)
        : ""
      }

    </div>


    <h1>

      ${escapeHTML(title)}

    </h1>


    <div class="meta">

      ${
        duration
        ? "Duration: " +
          escapeHTML(duration)
        : ""
      }

    </div>


    ${renderVideo()}


    <div class="content">

      ${
        lesson.content ||
        lesson.body ||
        lesson.description
        ? sanitizeContent(
            lesson.content ||
            lesson.body ||
            lesson.description
          )
        : "<p>No lesson content available.</p>"
      }

    </div>


    ${renderResources()}


    <div
      id="success"
      class="success"
    >
      Lesson completed successfully.
    </div>


    <div class="actions">

      <button
        class="btn secondary"
        onclick="history.back()"
      >
        Previous
      </button>


      <button
        id="complete"
        class="btn primary"
      >
        Mark Lesson Complete
      </button>

    </div>

  `;


  document
    .getElementById("complete")
    .addEventListener(
      "click",
      completeLesson
    );

}


/* =========================
   VIDEO
========================= */

function renderVideo(){

  const url =
    lesson.videoUrl ||
    lesson.videoURL ||
    lesson.video ||
    "";


  if(!url){

    return `

      <div class="video">

        <div class="video-placeholder">

          No video available for this lesson.

        </div>

      </div>

    `;

  }


  const safe =
    safeURL(url);


  if(!safe){

    return "";

  }


  if(
    /\.(mp4|webm|ogg)(\?.*)?$/i
      .test(safe)
  ){

    return `

      <div class="video">

        <video
          controls
          preload="metadata"
          src="${safe}"
        ></video>

      </div>

    `;

  }


  if(
    safe.includes(
      "youtube.com"
    ) ||
    safe.includes(
      "youtu.be"
    )
  ){

    const embed =
      youtubeEmbed(
        safe
      );


    if(embed){

      return `

        <div class="video">

          <iframe
            src="${embed}"
            title="Lesson video"
            allowfullscreen
            loading="lazy"
          ></iframe>

        </div>

      `;

    }

  }


  return `

    <div class="video">

      <div class="video-placeholder">

        Video available externally.

        <br><br>

        <a
          href="${safe}"
          target="_blank"
          rel="noopener noreferrer"
          style="color:white"
        >
          Open Video
        </a>

      </div>

    </div>

  `;

}


/* =========================
   RESOURCES
========================= */

function renderResources(){

  const resources =
    Array.isArray(
      lesson.resources
    )
    ? lesson.resources
    : [];


  if(!resources.length){

    return "";

  }


  return `

    <section class="resources">

      <h2>
        Lesson Resources
      </h2>

      ${
        resources
          .map(
            resource => {

              const name =
                resource.name ||
                resource.title ||
                "Download Resource";


              const url =
                safeURL(
                  resource.url ||
                  resource.fileUrl ||
                  resource.downloadURL ||
                  ""
                );


              if(!url){

                return "";

              }


              return `

                <div class="resource">

                  <span class="resource-name">

                    ${escapeHTML(name)}

                  </span>


                  <a
                    class="download"
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >

                    Download

                  </a>

                </div>

              `;

            }
          )
          .join("")
      }

    </section>

  `;

}


/* =========================
   COMPLETE LESSON
========================= */

async function completeLesson(){

  const button =
    document.getElementById(
      "complete"
    );


  if(!button) return;


  button.disabled = true;

  button.textContent =
    "Saving...";


  try{

    /*
      Your API should verify the
      authenticated user server-side.
    */

    const response =
      await fetch(
        "/api/learning/complete",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({

            userId,
            lessonId,
            courseId,
            moduleId

          })
        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to save progress."
      );

    }


    const success =
      document.getElementById(
        "success"
      );


    if(success){

      success.style.display =
        "block";

    }


    button.textContent =
      "Completed ✓";


  }catch(error){

    console.error(
      "COMPLETE LESSON:",
      error
    );


    button.disabled = false;

    button.textContent =
      "Mark Lesson Complete";


    alert(
      error.message
    );

  }

}


/* =========================
   YOUTUBE
========================= */

function youtubeEmbed(
  url
){

  try{

    const parsed =
      new URL(url);


    let id = "";


    if(
      parsed.hostname.includes(
        "youtu.be"
      )
    ){

      id =
        parsed.pathname
          .replace("/","");

    }else{

      id =
        parsed.searchParams.get(
          "v"
        );

    }


    if(
      !id &&
      parsed.pathname.includes(
        "/embed/"
      )
    ){

      id =
        parsed.pathname
          .split("/embed/")[1]
          .split("/")[0];

    }


    if(!id) return "";


    return (
      "https://www.youtube.com/embed/" +
      encodeURIComponent(id)
    );

  }catch(error){

    return "";

  }

}


/* =========================
   CONTENT
========================= */

function sanitizeContent(
  value
){

  /*
    Keep lesson content safe.
    Plain text is converted to HTML.
    Basic line breaks are preserved.
  */

  return escapeHTML(
    String(value)
  ).replace(
    /\n/g,
    "<br>"
  );

}


/* =========================
   SAFE URL
========================= */

function safeURL(
  value
){

  if(!value) return "";


  try{

    const url =
      new URL(
        String(value),
        location.origin
      );


    if(
      url.protocol === "https:" ||
      url.protocol === "http:"
    ){

      return escapeAttr(
        url.href
      );

    }

  }catch(error){}


  return "";

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  page.className =
    "error";


  page.innerHTML = `

    <h2>
      Unable to open lesson
    </h2>

    <p style="margin-top:10px">

      ${escapeHTML(message)}

    </p>

    <button
      class="btn secondary"
      style="margin-top:20px"
      onclick="history.back()"
    >
      Go Back
    </button>

  `;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  ).replace(
    /`/g,
    "&#096;"
  );

}

</script>

</body>
</html>
