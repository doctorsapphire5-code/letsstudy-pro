<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Lesson | LetsStudy Pro</title>

<meta name="description"
content="Learn with LetsStudy Pro online courses, lessons and learning resources.">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:#f5f7fb;
color:#101828
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #eaecf0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
position:sticky;
top:0;
z-index:50
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef
}

.header-actions{
display:flex;
gap:8px
}

button{
border:0;
cursor:pointer;
font-weight:700;
border-radius:9px;
padding:10px 14px
}

.primary{
background:#155eef;
color:white
}

.secondary{
background:#eef4ff;
color:#155eef
}

.container{
max-width:1200px;
margin:auto;
padding:22px 16px 60px
}

.breadcrumb{
font-size:13px;
color:#667085;
margin-bottom:15px
}

.breadcrumb a{
color:#155eef;
text-decoration:none
}

.layout{
display:grid;
grid-template-columns:minmax(0,1fr) 350px;
gap:20px
}

.main{
min-width:0
}

.player{
background:#000;
border-radius:16px;
overflow:hidden;
aspect-ratio:16/9;
display:flex;
align-items:center;
justify-content:center;
position:relative
}

.player iframe,
.player video{
width:100%;
height:100%;
border:0
}

.player-placeholder{
color:#fff;
text-align:center;
padding:30px
}

.player-placeholder .icon{
font-size:50px;
margin-bottom:10px
}

.lesson-card{
background:#fff;
border:1px solid #eaecf0;
border-radius:16px;
padding:22px;
margin-top:15px
}

.lesson-type{
display:inline-block;
font-size:11px;
font-weight:800;
padding:5px 9px;
border-radius:20px;
background:#eef4ff;
color:#155eef;
margin-bottom:10px;
text-transform:uppercase
}

h1{
font-size:28px;
margin:5px 0 10px
}

.description{
color:#667085;
line-height:1.7;
white-space:pre-wrap
}

.meta{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:16px
}

.badge{
background:#f2f4f7;
padding:7px 10px;
border-radius:20px;
font-size:12px;
color:#475467
}

.sidebar{
background:#fff;
border:1px solid #eaecf0;
border-radius:16px;
overflow:hidden;
height:max-content;
position:sticky;
top:85px
}

.sidebar-head{
padding:17px;
border-bottom:1px solid #eaecf0
}

.sidebar-head h2{
font-size:16px;
margin:0
}

.sidebar-head p{
font-size:12px;
color:#667085;
margin:6px 0 0
}

.lesson-list{
max-height:600px;
overflow:auto
}

.lesson-item{
display:flex;
gap:10px;
padding:13px 15px;
border-bottom:1px solid #f2f4f7;
text-decoration:none;
color:#344054
}

.lesson-item:hover{
background:#f9fafb
}

.lesson-item.active{
background:#eef4ff;
color:#155eef
}

.lesson-number{
width:28px;
height:28px;
border-radius:8px;
background:#f2f4f7;
display:grid;
place-items:center;
font-size:11px;
font-weight:800;
flex-shrink:0
}

.lesson-item.active .lesson-number{
background:#155eef;
color:#fff
}

.lesson-name{
font-size:13px;
font-weight:700;
line-height:1.4
}

.lesson-duration{
font-size:11px;
color:#98a2b3;
margin-top:4px
}

.navigation{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:15px
}

.navigation button{
flex:1
}

.info-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:18px
}

.info{
background:#f9fafb;
border-radius:11px;
padding:13px
}

.info-label{
font-size:11px;
color:#667085;
display:block;
margin-bottom:4px
}

.info-value{
font-size:13px;
font-weight:700
}

.error{
background:#fef3f2;
border:1px solid #fecdca;
color:#b42318;
padding:15px;
border-radius:12px;
margin-bottom:15px
}

.loading{
padding:50px;
text-align:center;
color:#667085
}

.empty{
padding:30px;
text-align:center;
color:#667085
}

.resource{
margin-top:18px
}

.resource a{
display:inline-block;
background:#155eef;
color:white;
padding:11px 15px;
border-radius:9px;
text-decoration:none;
font-size:13px;
font-weight:700
}

footer{
text-align:center;
color:#667085;
font-size:12px;
padding:30px
}

@media(max-width:900px){

.layout{
grid-template-columns:1fr
}

.sidebar{
position:static
}

.lesson-list{
max-height:400px
}

}

@media(max-width:600px){

header{
padding:0 12px
}

.logo{
font-size:17px
}

.container{
padding:15px 10px 40px
}

h1{
font-size:23px
}

.lesson-card{
padding:17px
}

.info-grid{
grid-template-columns:1fr
}

.navigation{
flex-direction:column
}

}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<div class="header-actions">

<button class="secondary"
onclick="history.back()">
← Back
</button>

</div>

</header>


<main class="container">

<div id="error"></div>

<div id="loading" class="loading">
Loading lesson...
</div>

<div id="content" style="display:none">

<div class="breadcrumb">

<a href="index.html">Home</a>
<span> / </span>

<a id="courseLink" href="#">
Course
</a>

<span> / </span>

<span id="moduleName">
Module
</span>

<span> / </span>

<span id="breadcrumbLesson">
Lesson
</span>

</div>


<div class="layout">


<section class="main">

<div class="player" id="player">

<div class="player-placeholder">

<div class="icon">
▶
</div>

<div>
Preparing lesson...
</div>

</div>

</div>


<div class="lesson-card">

<span id="lessonType"
class="lesson-type">
LESSON
</span>

<h1 id="lessonTitle">
Lesson Title
</h1>

<div id="lessonDescription"
class="description">
</div>


<div class="meta">

<span class="badge">
⏱ <span id="duration">—</span>
</span>

<span class="badge">
Status: <span id="status">—</span>
</span>

<span class="badge">
Lesson <span id="lessonOrder">—</span>
</span>

</div>


<div id="resourceBox"
class="resource"
style="display:none">

<a id="contentLink"
target="_blank"
rel="noopener">
Open Lesson Content ↗
</a>

</div>


<div class="navigation">

<button
id="previousBtn"
class="secondary">
← Previous
</button>

<button
id="nextBtn"
class="primary">
Next Lesson →
</button>

</div>

</div>

</section>


<aside class="sidebar">

<div class="sidebar-head">

<h2 id="moduleTitle">
Course Lessons
</h2>

<p id="courseTitle">
Loading...
</p>

</div>

<div id="lessonList"
class="lesson-list">

<div class="empty">
Loading lessons...
</div>

</div>

</aside>


</div>

</div>

</main>


<footer>
© <span id="year"></span> LetsStudy Pro
</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/*
==================================================
FIREBASE
==================================================
*/

const firebaseConfig={

apiKey:"AIzaSyBcKXbAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/*
==================================================
ELEMENTS
==================================================
*/

const loading=
document.getElementById("loading");

const content=
document.getElementById("content");

const errorBox=
document.getElementById("error");

const player=
document.getElementById("player");


/*
==================================================
URL
==================================================
*/

const params=
new URLSearchParams(location.search);

const lessonId=
params.get("lessonId");


/*
==================================================
STATE
==================================================
*/

let lesson=null;

let course=null;

let module=null;

let lessons=[];

let currentIndex=-1;


/*
==================================================
ESCAPE
==================================================
*/

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
==================================================
ERROR
==================================================
*/

function showError(message){

loading.style.display="none";

errorBox.innerHTML=
`<div class="error">${esc(message)}</div>`;

}


/*
==================================================
LOAD LESSON
==================================================
*/

async function loadLesson(){

if(!lessonId){

showError(
"Lesson ID is missing. Use lesson.html?lessonId=YOUR_LESSON_ID"
);

return;

}


try{

/*
GET LESSON DIRECTLY
*/

const lessonSnap=
await getDoc(
doc(db,"lessons",lessonId)
);


if(!lessonSnap.exists()){

showError("Lesson was not found.");

return;

}


lesson={
id:lessonSnap.id,
...lessonSnap.data()
};


/*
COURSE
*/

if(lesson.courseId){

const courseSnap=
await getDoc(
doc(db,"courses",lesson.courseId)
);

if(courseSnap.exists()){

course={
id:courseSnap.id,
...courseSnap.data()
};

}

}


/*
MODULE
*/

if(lesson.moduleId){

const moduleSnap=
await getDoc(
doc(db,"modules",lesson.moduleId)
);

if(moduleSnap.exists()){

module={
id:moduleSnap.id,
...moduleSnap.data()
};

}

}


/*
ALL LESSONS IN SAME MODULE
*/

const q=query(

collection(db,"lessons"),

where(
"courseId",
"==",
lesson.courseId
)

);


const snap=
await getDocs(q);


lessons=
snap.docs.map(d=>({

id:d.id,
...d.data()

}));


/*
SORT
*/

lessons.sort((a,b)=>
Number(a.order||0)-
Number(b.order||0)
);


/*
CURRENT INDEX
*/

currentIndex=
lessons.findIndex(
x=>x.id===lesson.id
);


/*
RENDER
*/

render();


}catch(error){

console.error(error);

showError(error.message);

}

}


/*
==================================================
RENDER
==================================================
*/

function render(){

loading.style.display="none";

content.style.display="block";


const courseTitle=
course?.title||
"Course";


const moduleTitle=
module?.title||
"Course Lessons";


document.title=
`${lesson.title||"Lesson"} | LetsStudy Pro`;


/*
BREADCRUMB
*/

document.getElementById(
"courseTitle"
).textContent=courseTitle;

document.getElementById(
"moduleTitle"
).textContent=moduleTitle;

document.getElementById(
"moduleName"
).textContent=moduleTitle;

document.getElementById(
"breadcrumbLesson"
).textContent=
lesson.title||"Lesson";


document.getElementById(
"courseLink"
).href=
`course.html?courseId=${encodeURIComponent(
lesson.courseId||""
)}`;


/*
TITLE
*/

document.getElementById(
"lessonTitle"
).textContent=
lesson.title||"Untitled Lesson";


/*
DESCRIPTION
*/

document.getElementById(
"lessonDescription"
).textContent=
lesson.description||
"No description available.";


/*
TYPE
*/

document.getElementById(
"lessonType"
).textContent=
lesson.type||
"LESSON";


/*
DURATION
*/

document.getElementById(
"duration"
).textContent=
lesson.duration||
"Not specified";


/*
STATUS
*/

document.getElementById(
"status"
).textContent=
lesson.status||
"published";


/*
ORDER
*/

document.getElementById(
"lessonOrder"
).textContent=
lesson.order??
"—";


/*
PLAYER
*/

renderPlayer(
lesson.contentUrl,
lesson.type
);


/*
SIDEBAR
*/

renderLessonList();


/*
NAVIGATION
*/

setupNavigation();

}


/*
==================================================
CONTENT PLAYER
==================================================
*/

function renderPlayer(url,type){

if(!url){

player.innerHTML=`

<div class="player-placeholder">

<div class="icon">📚</div>

<div>
No lesson content has been added yet.
</div>

</div>

`;

return;

}


const safeUrl=esc(url);

const lower=
url.toLowerCase();


/*
YOUTUBE
*/

const youtube=
url.match(
/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/
);


if(youtube){

const videoId=youtube[1];

player.innerHTML=`

<iframe

src="https://www.youtube.com/embed/${esc(videoId)}"

title="${esc(lesson.title||"Lesson video")}"

allow=
"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

allowfullscreen>

</iframe>

`;

return;

}


/*
VIDEO FILE
*/

if(
type?.toLowerCase()==="video"||
/\.(mp4|webm|ogg)(\?|$)/i.test(lower)
){

player.innerHTML=`

<video
controls
playsinline
preload="metadata">

<source
src="${safeUrl}">

Your browser does not support video playback.

</video>

`;

return;

}


/*
PDF
*/

if(
/\.pdf(\?|$)/i.test(lower)
){

player.innerHTML=`

<iframe
src="${safeUrl}"
title="PDF Lesson">

</iframe>

`;

return;

}


/*
GENERAL EMBED
*/

player.innerHTML=`

<iframe
src="${safeUrl}"
title="${esc(lesson.title||"Lesson")}"
loading="lazy"
allowfullscreen>

</iframe>

`;


/*
OPEN CONTENT LINK
*/

document.getElementById(
"resourceBox"
).style.display="block";

document.getElementById(
"contentLink"
).href=url;

}


/*
==================================================
LESSON LIST
==================================================
*/

function renderLessonList(){

const list=
document.getElementById("lessonList");


if(!lessons.length){

list.innerHTML=
`<div class="empty">No lessons found.</div>`;

return;

}


list.innerHTML=
lessons.map((l,index)=>{

const active=
l.id===lesson.id;

return`

<a

class="lesson-item ${active?"active":""}"

href=
"lesson.html?lessonId=${encodeURIComponent(l.id)}"

>

<div class="lesson-number">
${index+1}
</div>

<div>

<div class="lesson-name">
${esc(l.title||"Untitled Lesson")}
</div>

<div class="lesson-duration">
${esc(l.duration||"Lesson")}
</div>

</div>

</a>

`;

}).join("");

}


/*
==================================================
NAVIGATION
==================================================
*/

function setupNavigation(){

const previous=
document.getElementById("previousBtn");

const next=
document.getElementById("nextBtn");


/*
PREVIOUS
*/

if(currentIndex>0){

previous.disabled=false;

previous.onclick=()=>{

const previousLesson=
lessons[currentIndex-1];

location.href=
`lesson.html?lessonId=${encodeURIComponent(
previousLesson.id
)}`;

};

}else{

previous.disabled=true;

previous.style.opacity=".5";

}


/*
NEXT
*/

if(
currentIndex>=0 &&
currentIndex<lessons.length-1
){

next.disabled=false;

next.onclick=()=>{

const nextLesson=
lessons[currentIndex+1];

location.href=
`lesson.html?lessonId=${encodeURIComponent(
nextLesson.id
)}`;

};

}else{

next.textContent="Course Complete";

next.disabled=true;

next.style.opacity=".6";

}

}


/*
==================================================
YEAR
==================================================
*/

document.getElementById(
"year"
).textContent=
new Date().getFullYear();


/*
==================================================
START
==================================================
*/

loadLesson();

</script>

</body>
</html>
