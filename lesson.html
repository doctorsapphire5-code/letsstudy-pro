<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Lesson | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a
}

a{text-decoration:none;color:inherit}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:14px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
position:sticky;
top:0;
z-index:20
}

.logo{
font-weight:900;
font-size:19px;
color:#2563eb
}

nav{
display:flex;
gap:7px;
flex-wrap:wrap
}

nav a{
font-size:11px;
font-weight:800;
padding:8px 10px;
border-radius:8px
}

nav a:hover{
background:#eff6ff;
color:#2563eb
}

.container{
max-width:900px;
margin:auto;
padding:25px 15px
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:16px;
padding:22px;
margin-bottom:15px
}

.back{
font-size:11px;
font-weight:800;
color:#2563eb;
display:inline-block;
margin-bottom:15px
}

.badge{
display:inline-block;
font-size:9px;
font-weight:900;
background:#dbeafe;
color:#1d4ed8;
padding:5px 9px;
border-radius:20px;
margin-bottom:10px
}

h1{
font-size:27px;
margin-bottom:10px
}

.course{
font-size:11px;
color:#64748b;
margin-bottom:20px
}

.content{
font-size:13px;
line-height:1.85;
color:#475569
}

.content h2{
font-size:18px;
color:#0f172a;
margin:18px 0 8px
}

.content h3{
font-size:15px;
color:#0f172a;
margin:16px 0 7px
}

.progress{
margin-top:20px
}

.progress-head{
display:flex;
justify-content:space-between;
font-size:11px;
font-weight:800;
margin-bottom:7px
}

.bar{
height:8px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden
}

.fill{
height:100%;
background:#2563eb;
width:0;
transition:.3s
}

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px
}

.btn{
display:flex;
align-items:center;
justify-content:center;
padding:12px;
border-radius:9px;
font-size:11px;
font-weight:900;
border:0;
cursor:pointer
}

.primary{
background:#2563eb;
color:#fff
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.success{
background:#16a34a;
color:#fff
}

.loading{
text-align:center;
padding:60px;
color:#64748b
}

.message{
display:none;
padding:11px;
border-radius:9px;
font-size:11px;
font-weight:800;
margin-bottom:15px
}

.error{
display:block;
background:#fee2e2;
color:#991b1b
}

.ok{
display:block;
background:#dcfce7;
color:#166534
}

footer{
margin-top:25px;
border-top:1px solid #e2e8f0;
padding:20px 0;
font-size:10px;
color:#64748b;
display:flex;
justify-content:space-between
}

footer a{
color:#2563eb;
font-weight:800
}

@media(max-width:650px){

header{
flex-direction:column;
align-items:flex-start
}

nav{
width:100%
}

.actions{
grid-template-columns:1fr
}

h1{
font-size:23px
}

footer{
flex-direction:column;
gap:8px
}

}
</style>
</head>

<body>

<header>

<a href="dashboard.html" class="logo">
LetsStudy Pro
</a>

<nav>

<a id="learningLink" href="course-learning.html">
Course
</a>

<a id="progressLink" href="course-progress.html">
Progress
</a>

<a id="quizLink" href="quiz.html">
Quiz
</a>

<a href="dashboard.html">
Dashboard
</a>

</nav>

</header>


<main class="container">

<div id="loading" class="loading">
Loading lesson...
</div>


<div id="app" style="display:none">

<div id="message" class="message"></div>


<section class="card">

<a id="backLink"
href="course-learning.html"
class="back">
← Back to Course
</a>

<div>

<span class="badge">
LESSON
</span>

<h1 id="title">
Lesson
</h1>

<div id="courseName" class="course">
Course
</div>

</div>


<div id="content" class="content">
Loading content...
</div>


<div class="progress">

<div class="progress-head">

<span>
Course Progress
</span>

<span id="percent">
0%
</span>

</div>

<div class="bar">

<div id="fill" class="fill">
</div>

</div>

</div>

</section>


<section class="card">

<div class="actions">

<button
id="completeBtn"
class="btn success">

✓ Mark Lesson Complete

</button>

<a
id="quizBtn"
href="quiz.html"
class="btn primary">

Take Quiz

</a>

<a
id="progressBtn"
href="course-progress.html"
class="btn secondary">

View Progress

</a>

<a
id="courseBtn"
href="course-learning.html"
class="btn secondary">

All Lessons

</a>

</div>

</section>


</div>


<footer>

<div>
© <span id="year"></span> LetsStudy Pro
</div>

<div>

<a href="course-learning.html">
Course
</a>

&nbsp;•&nbsp;

<a href="course-progress.html">
Progress
</a>

&nbsp;•&nbsp;

<a href="quiz.html">
Quiz
</a>

</div>

</footer>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
serverTimestamp,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
FIREBASE
========================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAXKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* ==========================================
PARAMETERS
========================================== */

const params=
new URLSearchParams(location.search);

const courseId=
params.get("courseId");

const lessonId=
params.get("id");


/* ==========================================
ELEMENTS
========================================== */

const loading=
document.getElementById("loading");

const appBox=
document.getElementById("app");

const message=
document.getElementById("message");

const title=
document.getElementById("title");

const content=
document.getElementById("content");

const courseName=
document.getElementById("courseName");

const completeBtn=
document.getElementById("completeBtn");

const percent=
document.getElementById("percent");

const fill=
document.getElementById("fill");

const learningLink=
document.getElementById("learningLink");

const progressLink=
document.getElementById("progressLink");

const quizLink=
document.getElementById("quizLink");

const backLink=
document.getElementById("backLink");

const quizBtn=
document.getElementById("quizBtn");

const progressBtn=
document.getElementById("progressBtn");

const courseBtn=
document.getElementById("courseBtn");


let user=null;
let lesson=null;
let course=null;
let completedLessons=[];


/* ==========================================
AUTH
========================================== */

onAuthStateChanged(
auth,
async currentUser=>{

if(!currentUser){

const redirect=
"lesson.html?id="+
encodeURIComponent(lessonId||"")+
"&courseId="+
encodeURIComponent(courseId||"");

location.href=
"login.html?redirect="+
encodeURIComponent(redirect);

return;

}

user=currentUser;

await loadPage();

}
);


/* ==========================================
LOAD PAGE
========================================== */

async function loadPage(){

if(!courseId || !lessonId){

showError(
"Course ID au Lesson ID haipo."
);

return;

}

try{

await loadCourse();

await checkAccess();

await loadLesson();

await loadProgress();

setLinks();

loading.style.display="none";

appBox.style.display="block";

}catch(error){

console.error(error);

showError(
"Imeshindikana kufungua lesson."
);

}

}


/* ==========================================
COURSE
========================================== */

async function loadCourse(){

const snap=
await getDoc(
doc(db,"courses",courseId)
);

if(!snap.exists()){

throw new Error(
"Course not found"
);

}

course={
id:snap.id,
...snap.data()
};

courseName.textContent=
course.title||
"Course";

}


/* ==========================================
ACCESS
========================================== */

async function checkAccess(){

const ref=
doc(
db,
"enrollments",
user.uid+"_"+courseId
);

const snap=
await getDoc(ref);

if(snap.exists()){

const data=snap.data();

if(
data.status &&
data.status!=="active"
){

throw new Error(
"Course access is not active."
);

}

return;

}

const premium=
String(course.type||"free")
.toLowerCase()==="premium";

if(premium){

throw new Error(
"You do not have access to this premium course."
);

}

}


/* ==========================================
LESSON
========================================== */

async function loadLesson(){

const ref=
doc(
db,
"courses",
courseId,
"lessons",
lessonId
);

const snap=
await getDoc(ref);

if(!snap.exists()){

throw new Error(
"Lesson not found"
);

}

lesson={
id:snap.id,
...snap.data()
};

title.textContent=
lesson.title||
"Lesson";

content.innerHTML=
safeContent(
lesson.content||
lesson.description||
"No lesson content available."
);

}


/* ==========================================
PROGRESS
========================================== */

async function loadProgress(){

const ref=
doc(
db,
"courseProgress",
user.uid+"_"+courseId
);

const snap=
await getDoc(ref);

if(snap.exists()){

const data=snap.data();

completedLessons=
Array.isArray(
data.completedLessons
)
?data.completedLessons
:[];

}

await calculateProgress();

if(
completedLessons.includes(lessonId)
){

completeBtn.textContent=
"✓ Lesson Completed";

completeBtn.disabled=true;

}

}


/* ==========================================
CALCULATE PROGRESS
========================================== */

async function calculateProgress(){

const snap=
await getDocs(
collection(
db,
"courses",
courseId,
"lessons"
)
);

const total=
snap.size;

const completed=
completedLessons.length;

const value=
total
?Math.min(
100,
Math.round(
(completed/total)*100
)
)
:0;

percent.textContent=
value+"%";

fill.style.width=
value+"%";

}


/* ==========================================
COMPLETE LESSON
========================================== */

completeBtn.addEventListener(
"click",
async()=>{

if(
completedLessons.includes(
lessonId
)
){

return;

}

try{

completeBtn.disabled=true;

completeBtn.textContent=
"Saving...";


completedLessons.push(
lessonId
);


/*
Remove duplicates
*/

completedLessons=[
...new Set(
completedLessons
)
];


const progressRef=
doc(
db,
"courseProgress",
user.uid+"_"+courseId
);


const totalSnap=
await getDocs(
collection(
db,
"courses",
courseId,
"lessons"
)
);


const total=
totalSnap.size;

const progress=
total
?Math.min(
100,
Math.round(
(completedLessons.length/total)*100
)
)
:0;


await setDoc(

progressRef,

{

userId:
user.uid,

courseId:
courseId,

completedLessons:
completedLessons,

progress:
progress,

lastLessonId:
lessonId,

updatedAt:
serverTimestamp()

},

{
merge:true
}

);


await calculateProgress();


completeBtn.textContent=
"✓ Lesson Completed";


showSuccess(
"Lesson imekamilika."
);


/*
Next workflow page
*/

setTimeout(
()=>{

location.href=
"lesson-complete.html?id="+
encodeURIComponent(lessonId)+
"&courseId="+
encodeURIComponent(courseId);

},
700
);


}catch(error){

console.error(error);

completeBtn.disabled=false;

completeBtn.textContent=
"✓ Mark Lesson Complete";

showError(
"Imeshindikana kuhifadhi progress."
);

}

});


/* ==========================================
LINKS
========================================== */

function setLinks(){

const courseQuery=
"?id="+
encodeURIComponent(courseId);

const lessonQuery=
"?id="+
encodeURIComponent(lessonId)+
"&courseId="+
encodeURIComponent(courseId);

learningLink.href=
"course-learning.html"+
courseQuery;

progressLink.href=
"course-progress.html"+
courseQuery;

quizLink.href=
"quiz.html"+
courseQuery;

backLink.href=
"course-learning.html"+
courseQuery;

quizBtn.href=
"quiz.html"+
courseQuery;

progressBtn.href=
"course-progress.html"+
courseQuery;

courseBtn.href=
"course-learning.html"+
courseQuery;

}


/* ==========================================
MESSAGES
========================================== */

function showError(text){

loading.style.display=
"none";

appBox.style.display=
"block";

message.className=
"message error";

message.textContent=
text;

}

function showSuccess(text){

message.className=
"message ok";

message.textContent=
text;

}


/* ==========================================
SAFE CONTENT
========================================== */

function safeContent(value){

return escapeHTML(
value
).replaceAll(
"\n",
"<br>"
);

}

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==========================================
YEAR
========================================== */

document.getElementById("year")
.textContent=
new Date().getFullYear();

</script>

</body>
</html>
