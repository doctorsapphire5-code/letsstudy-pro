<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="LetsStudy Pro Lesson">
<title>Lesson | LetsStudy Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,Arial,sans-serif;
  background:#f8fafc;
  color:#0f172a;
}
button,a{font-family:inherit}
a{text-decoration:none;color:inherit}

.topbar{
  height:68px;background:#fff;border-bottom:1px solid #e5e7eb;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;position:sticky;top:0;z-index:50
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800}
.brand-icon{
  width:38px;height:38px;border-radius:10px;background:#2563eb;color:#fff;
  display:grid;place-items:center
}
.brand span{color:#2563eb}
.top-actions{display:flex;gap:8px}
.top-btn{
  width:40px;height:40px;border:1px solid #e5e7eb;background:#fff;
  border-radius:10px;cursor:pointer;color:#475569
}
.top-btn:hover{background:#f1f5f9}

.container{max-width:1200px;margin:auto;padding:25px}

.breadcrumb{
  display:flex;align-items:center;gap:8px;color:#64748b;
  font-size:11px;margin-bottom:18px;flex-wrap:wrap
}
.breadcrumb a:hover{color:#2563eb}
.breadcrumb i{font-size:9px}

.lesson-card{
  background:#fff;border:1px solid #e5e7eb;border-radius:16px;
  overflow:hidden;margin-bottom:20px
}

.video-wrap{
  width:100%;background:#020617;aspect-ratio:16/9;
  max-height:650px;display:flex;align-items:center;justify-content:center
}
.video-wrap iframe,
.video-wrap video{
  width:100%;height:100%;border:0;display:block
}
.video-placeholder{
  color:#94a3b8;text-align:center;padding:40px
}
.video-placeholder i{font-size:45px;margin-bottom:12px;display:block}

.lesson-body{padding:25px}

.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:7px;
  background:#eff6ff;color:#2563eb;font-size:10px;font-weight:800;
  margin-bottom:12px
}

h1{font-size:27px;line-height:1.3;margin-bottom:10px}
.description{
  color:#64748b;font-size:13px;line-height:1.8;margin-bottom:18px;
  white-space:pre-line
}

.meta{
  display:flex;flex-wrap:wrap;gap:15px;color:#64748b;font-size:10px
}
.meta span{display:flex;align-items:center;gap:6px}
.meta i{color:#2563eb}

.actions{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;
  padding-top:20px;border-top:1px solid #eef2f7
}
.btn{
  border:0;border-radius:9px;padding:11px 15px;font-size:11px;
  font-weight:700;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:7px
}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-light{background:#fff;color:#475569;border:1px solid #e5e7eb}
.btn-light:hover{background:#f8fafc}
.btn-success{background:#16a34a;color:#fff}

.grid{
  display:grid;grid-template-columns:1.5fr .7fr;gap:20px
}
.panel{
  background:#fff;border:1px solid #e5e7eb;border-radius:15px;
  padding:20px
}
.panel h2{font-size:15px;margin-bottom:15px}

.info-row{
  display:flex;justify-content:space-between;gap:15px;
  padding:12px 0;border-bottom:1px solid #f1f5f9;font-size:11px
}
.info-row:last-child{border-bottom:0}
.info-row span:first-child{color:#64748b}
.info-row strong{text-align:right;word-break:break-word}

.navigation{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px
}
.nav-btn{
  border:1px solid #e5e7eb;background:#fff;padding:13px;
  border-radius:10px;text-align:left;cursor:pointer
}
.nav-btn:hover{border-color:#2563eb}
.nav-btn small{display:block;color:#94a3b8;font-size:9px;margin-bottom:5px}
.nav-btn strong{font-size:10px}

.loading,.empty{
  min-height:350px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;color:#64748b;padding:30px
}
.loading i{font-size:30px;color:#2563eb;margin-bottom:12px}
.empty i{font-size:40px;color:#94a3b8;margin-bottom:14px}
.empty h2{color:#0f172a;font-size:18px;margin-bottom:8px}
.empty p{font-size:11px;max-width:450px;line-height:1.7}

.toast{
  position:fixed;right:20px;bottom:20px;background:#0f172a;color:#fff;
  padding:12px 16px;border-radius:9px;font-size:11px;
  transform:translateY(100px);opacity:0;transition:.3s;z-index:999
}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:#dc2626}

@media(max-width:850px){
  .grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .container{padding:15px}
  .topbar{padding:0 15px}
  h1{font-size:21px}
  .lesson-body{padding:18px}
  .navigation{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <div class="brand-icon">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    LetsStudy <span>Pro</span>
  </a>

  <div class="top-actions">
    <button class="top-btn" onclick="goBack()" title="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <button class="top-btn" onclick="location.href='courses.html'" title="Courses">
      <i class="fa-solid fa-book-open"></i>
    </button>
  </div>
</header>

<main class="container">

  <div class="breadcrumb">
    <a href="courses.html">Courses</a>
    <i class="fa-solid fa-chevron-right"></i>

    <a id="courseLink" href="#">Course</a>
    <i class="fa-solid fa-chevron-right"></i>

    <span id="moduleCrumb">Module</span>
    <i class="fa-solid fa-chevron-right"></i>

    <span id="lessonCrumb">Lesson</span>
  </div>

  <section id="loading" class="lesson-card loading">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Loading lesson...</p>
  </section>

  <section id="content" style="display:none">

    <article class="lesson-card">

      <div id="videoContainer" class="video-wrap"></div>

      <div class="lesson-body">

        <div id="typeBadge" class="badge">
          <i class="fa-solid fa-play"></i>
          LESSON
        </div>

        <h1 id="lessonTitle">Lesson</h1>

        <p id="lessonDescription" class="description"></p>

        <div class="meta">

          <span>
            <i class="fa-solid fa-clock"></i>
            <b id="lessonDuration">--</b>
          </span>

          <span>
            <i class="fa-solid fa-list-ol"></i>
            Lesson <b id="lessonOrder">--</b>
          </span>

          <span>
            <i class="fa-solid fa-circle-check"></i>
            <b id="lessonStatus">--</b>
          </span>

        </div>

        <div class="actions">

          <button class="btn btn-primary" id="completeBtn">
            <i class="fa-solid fa-check"></i>
            Mark as Complete
          </button>

          <button class="btn btn-light" onclick="goBack()">
            <i class="fa-solid fa-arrow-left"></i>
            Back
          </button>

        </div>

      </div>
    </article>

    <div class="grid">

      <section class="panel">

        <h2>
          <i class="fa-solid fa-circle-info"></i>
          Lesson Information
        </h2>

        <div class="info-row">
          <span>Lesson ID</span>
          <strong id="lessonIdText">--</strong>
        </div>

        <div class="info-row">
          <span>Course ID</span>
          <strong id="courseIdText">--</strong>
        </div>

        <div class="info-row">
          <span>Module ID</span>
          <strong id="moduleIdText">--</strong>
        </div>

        <div class="info-row">
          <span>Type</span>
          <strong id="typeText">--</strong>
        </div>

        <div class="info-row">
          <span>Duration</span>
          <strong id="durationText">--</strong>
        </div>

        <div class="info-row">
          <span>Status</span>
          <strong id="statusText">--</strong>
        </div>

      </section>

      <aside class="panel">

        <h2>
          <i class="fa-solid fa-arrows-left-right"></i>
          Lesson Navigation
        </h2>

        <div class="navigation">

          <button class="nav-btn" id="previousBtn">
            <small>
              <i class="fa-solid fa-arrow-left"></i>
              PREVIOUS
            </small>
            <strong id="previousTitle">
              Previous Lesson
            </strong>
          </button>

          <button class="nav-btn" id="nextBtn">
            <small>
              NEXT
              <i class="fa-solid fa-arrow-right"></i>
            </small>
            <strong id="nextTitle">
              Next Lesson
            </strong>
          </button>

        </div>

      </aside>

    </div>

  </section>

  <section id="empty" class="lesson-card empty" style="display:none">

    <i class="fa-solid fa-book-open"></i>

    <h2>Lesson Not Found</h2>

    <p id="errorText">
      The requested lesson could not be found.
    </p>

    <button class="btn btn-primary" onclick="goBack()">
      <i class="fa-solid fa-arrow-left"></i>
      Go Back
    </button>

  </section>

</main>

<div id="toast" class="toast"></div>

<script type="module">

import {
  initializeApp,
  getApps,
  getApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  orderBy,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBcOXKXbVkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app =
  getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);


/* =====================================================
   URL
===================================================== */

const params =
  new URLSearchParams(location.search);

const lessonId =
  params.get("lessonId");

const courseIdFromUrl =
  params.get("courseId");

const moduleIdFromUrl =
  params.get("moduleId");


/* =====================================================
   STATE
===================================================== */

let lesson = null;
let lessons = [];
let currentUser = null;


/* =====================================================
   ELEMENT
===================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   LOAD LESSON
===================================================== */

async function loadLesson(){

  if(!lessonId){

    showError(
      "Lesson ID is missing. Open the lesson using ?lessonId=..."
    );

    return;
  }

  try{

    /*
     * Direct Firestore document:
     *
     * lessons/{lessonId}
     */

    const ref =
      doc(
        db,
        "lessons",
        lessonId
      );

    const snap =
      await getDoc(ref);

    if(!snap.exists()){

      showError(
        "No lesson exists with this lesson ID."
      );

      return;
    }

    lesson = {
      id: snap.id,
      ...snap.data()
    };


    /*
     * Optional URL courseId is NOT used
     * to identify the lesson.
     *
     * courseId comes directly from
     * the Firestore lesson document.
     */

    renderLesson();

    await loadRelatedLessons();

  }catch(error){

    console.error(
      "Lesson loading error:",
      error
    );

    showError(
      error.message ||
      "Unable to load lesson."
    );

  }

}


/* =====================================================
   RENDER LESSON
===================================================== */

function renderLesson(){

  $("loading").style.display =
    "none";

  $("empty").style.display =
    "none";

  $("content").style.display =
    "block";


  const courseId =
    lesson.courseId || "";

  const moduleId =
    lesson.moduleId || "";

  const title =
    lesson.title || "Untitled Lesson";

  const description =
    lesson.description || "";

  const type =
    lesson.type || "Video";

  const duration =
    lesson.duration || "--";

  const status =
    lesson.status || "Published";

  const contentUrl =
    lesson.contentUrl || "";


  $("lessonTitle").textContent =
    title;

  $("lessonDescription").textContent =
    description;

  $("lessonDuration").textContent =
    duration;

  $("durationText").textContent =
    duration;

  $("lessonOrder").textContent =
    lesson.order ?? "--";

  $("lessonStatus").textContent =
    status;

  $("lessonIdText").textContent =
    lesson.id;

  $("courseIdText").textContent =
    courseId || "--";

  $("moduleIdText").textContent =
    moduleId || "--";

  $("typeText").textContent =
    type;


  $("lessonCrumb").textContent =
    title;

  $("moduleCrumb").textContent =
    moduleId
      ? `Module ${moduleId}`
      : "Module";


  if(courseId){

    $("courseLink").href =
      `course.html?courseId=${encodeURIComponent(courseId)}`;

  }


  renderTypeBadge(type);

  renderContent(contentUrl,type);

}


/* =====================================================
   TYPE BADGE
===================================================== */

function renderTypeBadge(type){

  const value =
    String(type).toLowerCase();

  let icon =
    "fa-play";

  if(value.includes("video"))
    icon = "fa-video";

  else if(value.includes("pdf"))
    icon = "fa-file-pdf";

  else if(value.includes("audio"))
    icon = "fa-headphones";

  else if(value.includes("text"))
    icon = "fa-file-lines";

  else if(value.includes("document"))
    icon = "fa-file";

  $("typeBadge").innerHTML = `
    <i class="fa-solid ${icon}"></i>
    ${escapeHtml(type)}
  `;

}


/* =====================================================
   CONTENT
===================================================== */

function renderContent(url,type){

  const box =
    $("videoContainer");

  if(!url){

    box.innerHTML = `
      <div class="video-placeholder">
        <i class="fa-solid fa-file-circle-question"></i>
        <p>No lesson content URL available.</p>
      </div>
    `;

    return;
  }


  const value =
    String(type || "").toLowerCase();


  /*
   * YouTube
   */

  if(
    url.includes("youtube.com") ||
    url.includes("youtu.be")
  ){

    const embed =
      youtubeEmbed(url);

    if(embed){

      box.innerHTML = `
        <iframe
          src="${escapeHtml(embed)}"
          title="${escapeHtml(lesson.title || "Lesson")}"
          allow="accelerometer; autoplay; clipboard-write;
                 encrypted-media; gyroscope; picture-in-picture;
                 web-share"
          allowfullscreen>
        </iframe>
      `;

      return;
    }
  }


  /*
   * Direct video
   */

  if(
    value.includes("video") ||
    /\.(mp4|webm|ogg)(\?.*)?$/i.test(url)
  ){

    box.innerHTML = `
      <video
        controls
        playsinline
        preload="metadata"
      >
        <source src="${escapeHtml(url)}">
        Your browser does not support video playback.
      </video>
    `;

    return;
  }


  /*
   * PDF
   */

  if(
    value.includes("pdf") ||
    /\.pdf(\?.*)?$/i.test(url)
  ){

    box.innerHTML = `
      <iframe
        src="${escapeHtml(url)}"
        title="PDF Lesson"
        style="background:#fff"
      ></iframe>
    `;

    return;
  }


  /*
   * Generic external content
   */

  box.innerHTML = `
    <iframe
      src="${escapeHtml(url)}"
      title="${escapeHtml(lesson.title || "Lesson")}"
      allowfullscreen>
    </iframe>
  `;

}


/* =====================================================
   YOUTUBE EMBED
===================================================== */

function youtubeEmbed(url){

  try{

    const parsed =
      new URL(url);

    let id = "";


    if(
      parsed.hostname.includes("youtu.be")
    ){

      id =
        parsed.pathname
          .replace("/","");

    }else if(
      parsed.searchParams.get("v")
    ){

      id =
        parsed.searchParams.get("v");

    }else{

      const match =
        parsed.pathname.match(
          /\/(?:embed|shorts)\/([^/?]+)/
        );

      if(match)
        id = match[1];

    }


    if(!id)
      return null;


    return `https://www.youtube.com/embed/${encodeURIComponent(id)}`;

  }catch{

    return null;

  }

}


/* =====================================================
   RELATED LESSONS
===================================================== */

async function loadRelatedLessons(){

  if(!lesson?.courseId)
    return;

  try{

    const q =
      query(
        collection(db,"lessons"),
        where(
          "courseId",
          "==",
          lesson.courseId
        ),
        orderBy("order","asc")
      );

    const snap =
      await getDocs(q);

    lessons =
      snap.docs.map(d => ({
        id:d.id,
        ...d.data()
      }));

    renderNavigation();

  }catch(error){

    /*
     * If Firestore requires an index,
     * fallback to courseId query without
     * orderBy and sort locally.
     */

    console.warn(
      "Ordered lessons query failed:",
      error
    );

    try{

      const q =
        query(
          collection(db,"lessons"),
          where(
            "courseId",
            "==",
            lesson.courseId
          )
        );

      const snap =
        await getDocs(q);

      lessons =
        snap.docs.map(d => ({
          id:d.id,
          ...d.data()
        }));

      lessons.sort(
        (a,b) =>
          Number(a.order || 0) -
          Number(b.order || 0)
      );

      renderNavigation();

    }catch(fallbackError){

      console.error(
        "Related lessons error:",
        fallbackError
      );

    }

  }

}


/* =====================================================
   NAVIGATION
===================================================== */

function renderNavigation(){

  const index =
    lessons.findIndex(
      x => x.id === lesson.id
    );

  if(index === -1)
    return;


  const previous =
    lessons[index - 1];

  const next =
    lessons[index + 1];


  if(previous){

    $("previousTitle").textContent =
      previous.title || "Previous Lesson";

    $("previousBtn").onclick =
      () => openLesson(previous.id);

    $("previousBtn").disabled =
      false;

  }else{

    $("previousTitle").textContent =
      "First Lesson";

    $("previousBtn").disabled =
      true;

  }


  if(next){

    $("nextTitle").textContent =
      next.title || "Next Lesson";

    $("nextBtn").onclick =
      () => openLesson(next.id);

    $("nextBtn").disabled =
      false;

  }else{

    $("nextTitle").textContent =
      "Last Lesson";

    $("nextBtn").disabled =
      true;

  }

}


/* =====================================================
   OPEN LESSON
===================================================== */

function openLesson(id){

  if(!id)
    return;

  const courseId =
    lesson?.courseId || courseIdFromUrl || "";

  const moduleId =
    lesson?.moduleId || moduleIdFromUrl || "";

  const queryParts =
    [
      `lessonId=${encodeURIComponent(id)}`,
      courseId
        ? `courseId=${encodeURIComponent(courseId)}`
        : "",
      moduleId
        ? `moduleId=${encodeURIComponent(moduleId)}`
        : ""
    ]
    .filter(Boolean)
    .join("&");

  location.href =
    `lesson.html?${queryParts}`;

}


/* ====================
/* ====================
   BACK
==================== */

window.goBack = function () {

  if (history.length > 1) {
    history.back();
    return;
  }

  if (courseIdFromUrl) {
    location.href =
      `modules.html?courseId=${encodeURIComponent(courseIdFromUrl)}`;
  } else {
    location.href = "courses.html";
  }
};


/* ====================
   ERROR
==================== */

function showError(message) {

  $("loading").style.display = "none";
  $("content").style.display = "none";
  $("empty").style.display = "flex";

  $("errorText").textContent =
    message || "Unable to load this lesson.";
}


/* ====================
   ESCAPE HTML
==================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ====================
   TOAST
==================== */

let toastTimer;

function showToast(message, isError = false) {

  const toast = $("toast");

  if (!toast) return;

  toast.textContent = message;

  toast.className =
    "toast show" +
    (isError ? " error" : "");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {

    toast.className = "toast";

  }, 3000);
}


/* ====================
   AUTH STATE
==================== */

onAuthStateChanged(
  auth,
  user => {

    currentUser = user || null;

  }
);


/* ====================
   KEYBOARD NAVIGATION
==================== */

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "ArrowLeft") {

      const button =
        $("previousBtn");

      if (
        button &&
        !button.disabled
      ) {
        button.click();
      }

    }

    if (event.key === "ArrowRight") {

      const button =
        $("nextBtn");

      if (
        button &&
        !button.disabled
      ) {
        button.click();
      }

    }

  }
);


/* ====================
   START
==================== */

loadLesson();


/* ====================
   GLOBAL ERROR HANDLING
==================== */

window.addEventListener(
  "error",
  event => {

    console.error(
      "Page error:",
      event.error || event.message
    );

  }
);

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Promise error:",
      event.reason
    );

  }
);

</script>

</body>
</html>
