<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin Login | Let'sStudy Pro</title>

<meta
  name="description"
  content="Secure Let'sStudy Pro administrator portal login."
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef4ff,
      #f8fafc 50%,
      #eef2ff
    );

  color:#172033;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.container{
  width:100%;
  max-width:460px;
}

.card{
  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:24px;

  padding:32px;

  box-shadow:
    0 25px 70px
    rgba(15,23,42,.12);
}

/* BRAND */

.brand{
  text-align:center;

  margin-bottom:25px;
}

.logo{
  width:68px;
  height:68px;

  margin:0 auto 13px;

  border-radius:19px;

  background:#111827;

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;
}

.brand h1{
  font-size:25px;

  font-weight:900;
}

.brand p{
  color:#64748b;

  font-size:13px;

  margin-top:5px;
}

.title{
  font-size:20px;

  font-weight:850;

  margin-bottom:6px;
}

.description{
  color:#64748b;

  font-size:13px;

  line-height:1.5;

  margin-bottom:20px;
}

/* MESSAGE */

.message{
  display:none;

  padding:12px 14px;

  border-radius:10px;

  margin-bottom:16px;

  font-size:13px;

  line-height:1.45;
}

.message.show{
  display:block;
}

.message.error{
  background:#fef2f2;

  border:1px solid #fecaca;

  color:#b91c1c;
}

.message.success{
  background:#f0fdf4;

  border:1px solid #bbf7d0;

  color:#15803d;
}

/* TABS */

.tabs{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:5px;

  background:#f1f5f9;

  padding:5px;

  border-radius:11px;

  margin-bottom:20px;
}

.tab{
  border:0;

  background:transparent;

  padding:10px 5px;

  border-radius:8px;

  font-size:12px;

  font-weight:750;

  color:#64748b;
}

.tab.active{
  background:white;

  color:#111827;

  box-shadow:
    0 1px 4px
    rgba(0,0,0,.08);
}

/* FORMS */

.login-panel{
  display:none;
}

.login-panel.active{
  display:block;
}

.field{
  margin-bottom:15px;
}

label{
  display:block;

  font-size:13px;

  font-weight:750;

  color:#334155;

  margin-bottom:7px;
}

input{
  width:100%;

  height:49px;

  border:1px solid #cbd5e1;

  border-radius:10px;

  padding:0 13px;

  font-size:14px;

  outline:none;
}

input:focus{
  border-color:#2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.10);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:65px;
}

.toggle{
  position:absolute;

  right:9px;
  top:50%;

  transform:translateY(-50%);

  border:0;

  background:transparent;

  color:#2563eb;

  font-size:12px;

  font-weight:800;
}

/* BUTTON */

.primary-btn{
  width:100%;

  height:50px;

  border:0;

  border-radius:11px;

  background:#111827;

  color:white;

  font-size:14px;

  font-weight:850;

  margin-top:4px;
}

.primary-btn:hover{
  background:#1f2937;
}

.primary-btn:disabled{
  opacity:.6;

  cursor:not-allowed;
}

/* GOOGLE */

.google-btn{
  width:100%;

  height:50px;

  border:1px solid #cbd5e1;

  border-radius:11px;

  background:white;

  color:#111827;

  font-size:14px;

  font-weight:800;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;
}

.google-icon{
  font-size:19px;

  font-weight:900;
}

/* DIVIDER */

.divider{
  display:flex;

  align-items:center;

  gap:10px;

  margin:17px 0;

  color:#94a3b8;

  font-size:11px;
}

.divider::before,
.divider::after{
  content:"";

  height:1px;

  background:#e5e7eb;

  flex:1;
}

/* LINKS */

.links{
  display:flex;

  justify-content:space-between;

  gap:10px;

  margin-top:17px;
}

.links button{
  border:0;

  background:transparent;

  color:#2563eb;

  font-size:12px;

  font-weight:700;
}

/* OTP */

#recaptcha-container{
  margin:12px 0;
}

.security{
  margin-top:24px;

  padding-top:18px;

  border-top:1px solid #e5e7eb;

  text-align:center;

  color:#64748b;

  font-size:11px;

  line-height:1.5;
}

.footer{
  text-align:center;

  margin-top:16px;

  color:#94a3b8;

  font-size:11px;
}

@media(max-width:500px){

  .card{
    padding:25px 20px;

    border-radius:19px;
  }

  .tabs{
    gap:3px;
  }

  .tab{
    font-size:11px;
  }

}

</style>

</head>


<body>


<div class="container">

  <div class="card">


    <!-- BRAND -->

    <div class="brand">

      <div class="logo">
        🛡️
      </div>

      <h1>
        Let'sStudy Pro
      </h1>

      <p>
        Administrator Portal
      </p>

    </div>


    <div class="title">
      Secure Login
    </div>

    <div class="description">
      Sign in to access your Let'sStudy Pro management ecosystem.
    </div>


    <div
      id="message"
      class="message"
    ></div>


    <!-- LOGIN METHODS -->

    <div class="tabs">

      <button
        class="tab active"
        data-tab="emailPanel"
      >
        Email
      </button>

      <button
        class="tab"
        data-tab="googlePanel"
      >
        Google
      </button>

      <button
        class="tab"
        data-tab="phonePanel"
      >
        Phone
      </button>

    </div>


    <!-- =====================
         EMAIL
    ====================== -->

    <div
      id="emailPanel"
      class="login-panel active"
    >

      <form id="emailForm">


        <div class="field">

          <label>
            Email Address
          </label>

          <input
            id="email"
            type="email"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label>
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              type="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="toggle"
            >
              Show
            </button>

          </div>

        </div>


        <button
          id="emailBtn"
          class="primary-btn"
          type="submit"
        >
          Login with Email
        </button>


      </form>


      <div class="links">

        <button id="forgotBtn">
          Forgot Password?
        </button>

        <button id="registerBtn">
          Create Account
        </button>

      </div>

    </div>


    <!-- =====================
         GOOGLE
    ====================== -->

    <div
      id="googlePanel"
      class="login-panel"
    >

      <button
        id="googleBtn"
        class="google-btn"
        type="button"
      >

        <span class="google-icon">
          G
        </span>

        Continue with Google

      </button>

    </div>


    <!-- =====================
         PHONE
    ====================== -->

    <div
      id="phonePanel"
      class="login-panel"
    >

      <div class="field">

        <label>
          Phone Number
        </label>

        <input
          id="phone"
          type="tel"
          placeholder="+255712345678"
          autocomplete="tel"
        >

      </div>


      <button
        id="sendOtpBtn"
        class="primary-btn"
        type="button"
      >
        Send Verification Code
      </button>


      <div
        id="recaptcha-container"
      ></div>


      <div
        id="otpArea"
        style="display:none"
      >

        <div class="field">

          <label>
            Verification Code
          </label>

          <input
            id="otp"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="Enter 6-digit code"
          >

        </div>


        <button
          id="verifyOtpBtn"
          class="primary-btn"
          type="button"
        >
          Verify & Login
        </button>

      </div>

    </div>


    <div class="security">

      🔒 Authentication is handled by Firebase.
      No administrator role field is required.

    </div>

  </div>


  <div class="footer">
    © 2026 Let'sStudy Pro
  </div>

</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signInWithPopup,
  GoogleAuthProvider,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  sendPasswordResetEmail,
  createUserWithEmailAndPassword,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


/* =========================================
   PROVIDER
========================================= */

const googleProvider =
  new GoogleAuthProvider();


/* =========================================
   ELEMENTS
========================================= */

const message =
  document.getElementById(
    "message"
  );

const tabs =
  document.querySelectorAll(
    ".tab"
  );

const panels =
  document.querySelectorAll(
    ".login-panel"
  );


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type="error"
){

  message.textContent =
    text;

  message.className =
    "message show " + type;

}


function clearMessage(){

  message.textContent =
    "";

  message.className =
    "message";

}


/* =========================================
   FIREBASE ERROR
========================================= */

function firebaseError(error){

  switch(error.code){

    case "auth/invalid-credential":
      return "Invalid email or password.";

    case "auth/user-not-found":
      return "No account was found with this email.";

    case "auth/wrong-password":
      return "Incorrect password.";

    case "auth/invalid-email":
      return "Please enter a valid email address.";

    case "auth/email-already-in-use":
      return "This email is already registered.";

    case "auth/weak-password":
      return "Password is too weak.";

    case "auth/popup-closed-by-user":
      return "Google login was cancelled.";

    case "auth/popup-blocked":
      return "Your browser blocked the Google login popup.";

    case "auth/too-many-requests":
      return "Too many attempts. Please try again later.";

    case "auth/network-request-failed":
      return "Network error. Check your connection.";

    case "auth/invalid-phone-number":
      return "Enter a valid phone number with country code.";

    case "auth/invalid-verification-code":
      return "Invalid verification code.";

    default:
      return error.message ||
        "Authentication failed.";

  }

}


/* =========================================
   TABS
========================================= */

tabs.forEach(
  tab => {

    tab.addEventListener(
      "click",
      () => {

        tabs.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );

        panels.forEach(
          panel =>
            panel.classList.remove(
              "active"
            )
        );


        tab.classList.add(
          "active"
        );


        document
          .getElementById(
            tab.dataset.tab
          )
          .classList.add(
            "active"
          );


        clearMessage();

      }
    );

  }
);


/* =========================================
   PASSWORD
========================================= */

document
  .getElementById(
    "togglePassword"
  )
  .addEventListener(
    "click",
    () => {

      const input =
        document.getElementById(
          "password"
        );


      if(
        input.type ===
        "password"
      ){

        input.type =
          "text";

        document
          .getElementById(
            "togglePassword"
          )
          .textContent =
          "Hide";

      }

      else{

        input.type =
          "password";

        document
          .getElementById(
            "togglePassword"
          )
          .textContent =
          "Show";

      }

    }
  );


/* =========================================
   EMAIL LOGIN
========================================= */

document
  .getElementById(
    "emailForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearMessage();


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      const button =
        document
          .getElementById(
            "emailBtn"
          );


      button.disabled =
        true;

      button.textContent =
        "Signing in...";


      try{

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        showMessage(
          "Login successful. Opening Admin Portal...",
          "success"
        );


        window.location.replace(
          "admin-dashboard.html"
        );

      }

      catch(error){

        console.error(error);

        showMessage(
          firebaseError(error)
        );

        button.disabled =
          false;

        button.textContent =
          "Login with Email";

      }

    }
  );


/* =========================================
   GOOGLE LOGIN
========================================= */

document
  .getElementById(
    "googleBtn"
  )
  .addEventListener(
    "click",
    async () => {

      clearMessage();


      const button =
        document.getElementById(
          "googleBtn"
        );


      button.disabled =
        true;

      button.textContent =
        "Connecting to Google...";


      try{

        await signInWithPopup(
          auth,
          googleProvider
        );


        showMessage(
          "Google login successful. Opening Admin Portal...",
          "success"
        );


        window.location.replace(
          "admin-dashboard.html"
        );

      }

      catch(error){

        console.error(error);

        showMessage(
          firebaseError(error)
        );

        button.disabled =
          false;

        button.innerHTML = `
          <span class="google-icon">G</span>
          Continue with Google
        `;

      }

    }
  );


/* =========================================
   RECAPTCHA
========================================= */

let recaptchaVerifier = null;

let confirmationResult = null;


function setupRecaptcha(){

  if(
    recaptchaVerifier
  ){

    return;

  }


  recaptchaVerifier =
    new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {
        size:"normal"
      }
    );


  recaptchaVerifier.render();

}


/* =========================================
   PHONE OTP
========================================= */

document
  .getElementById(
    "sendOtpBtn"
  )
  .addEventListener(
    "click",
    async () => {

      clearMessage();


      const phone =
        document
          .getElementById(
            "phone"
          )
          .value
          .trim();


      if(!phone){

        showMessage(
          "Enter your phone number first."
        );

        return;

      }


      const button =
        document
          .getElementById(
            "sendOtpBtn"
          );


      button.disabled =
        true;

      button.textContent =
        "Sending code...";


      try{

        setupRecaptcha();


        confirmationResult =
          await signInWithPhoneNumber(
            auth,
            phone,
            recaptchaVerifier
          );


        document
          .getElementById(
            "otpArea"
          )
          .style.display =
          "block";


        showMessage(
          "Verification code sent to your phone.",
          "success"
        );


        button.textContent =
          "Code Sent";

      }

      catch(error){

        console.error(error);

        showMessage(
          firebaseError(error)
        );


        button.disabled =
          false;

        button.textContent =
          "Send Verification Code";

      }

    }
  );


/* =========================================
   VERIFY OTP
========================================= */

document
  .getElementById(
    "verifyOtpBtn"
  )
  .addEventListener(
    "click",
    async () => {

      clearMessage();


      const code =
        document
          .getElementById(
            "otp"
          )
          .value
          .trim();


      if(!confirmationResult){

        showMessage(
          "Request a verification code first."
        );

        return;

      }


      if(code.length !== 6){

        showMessage(
          "Enter the 6-digit verification code."
        );

        return;

      }


      const button =
        document
          .getElementById(
            "verifyOtpBtn"
          );


      button.disabled =
        true;

      button.textContent =
        "Verifying...";


      try{

        await confirmationResult.confirm(
          code
        );


        showMessage(
          "Phone verified. Opening Admin Portal...",
          "success"
        );


        window.location.replace(
          "admin-dashboard.html"
        );

      }

      catch(error){

        console.error(error);

        showMessage(
          firebaseError(error)
        );


        button.disabled =
          false;

        button.textContent =
          "Verify & Login";

      }

    }
  );


/* =========================================
   FORGOT PASSWORD
========================================= */

document
  .getElementById(
    "forgotBtn"
  )
  .addEventListener(
    "click",
    async () => {

      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();


      if(!email){

        showMessage(
          "Enter your email address first."
        );

        return;

      }


      try{

        await sendPasswordResetEmail(
          auth,
          email
        );


        showMessage(
          "Password reset email sent. Check your inbox.",
          "success"
        );

      }

      catch(error){

        showMessage(
          firebaseError(error)
        );

      }

    }
  );


/* =========================================
   CREATE ACCOUNT
========================================= */

document
  .getElementById(
    "registerBtn"
  )
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "register-admin.html";

    }
  );


/* =========================================
   EXISTING SESSION
========================================= */

/*
     * EXISTING SESSION
     */

    onAuthStateChanged(
      auth,
      user => {

        if (!user) {
          return;
        }

        /*
         * No role check.
         * No Firestore admin check.
         *
         * Any successfully authenticated
         * Firebase user can continue.
         */

        window.location.replace(
          "admin-dashboard.html"
        );

      }
    );

  </script>

</body>
</html>
