<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Admin Login | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Secure administrator login for Let'sStudy Pro."
  >

  <meta name="robots" content="noindex,nofollow">

  <link rel="preconnect" href="https://www.gstatic.com">

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #687386;
      --border: #e2e7ef;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #15803d;
      --shadow: 0 20px 50px rgba(15, 23, 42, .10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 7px;
      font-size: 21px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .13);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      min-height: 36px;
      padding: 6px 9px;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 650;
      cursor: pointer;
    }

    button {
      font: inherit;
    }

    .login-btn {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, transform .1s ease;
    }

    .login-btn:hover {
      background: var(--primary-dark);
    }

    .login-btn:active {
      transform: translateY(1px);
    }

    .login-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin: 0 0 18px;
      padding: 12px 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
    }

    .forgot {
      display: block;
      margin-top: 16px;
      text-align: center;
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .security {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f8fafc;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 22px 18px;
        border-radius: 17px;
      }

      .brand h1 {
        font-size: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="brand">
      <div class="brand-icon" aria-hidden="true">🛡️</div>

      <h1>Let'sStudy Pro</h1>

      <p>Administrator Portal</p>
    </header>

    <section class="card" aria-labelledby="login-title">

      <h2 id="login-title">Admin Login</h2>

      <p class="subtitle">
        Sign in with an authorized administrator account.
      </p>

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>

      <form id="adminLoginForm" novalidate>

        <div class="field">
          <label for="email">Admin Email</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            placeholder="admin@example.com"
            required
            aria-required="true"
          >
        </div>

        <div class="field">

          <label for="password">Password</label>

          <div class="password-wrap">

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
              aria-required="true"
            >

            <button
              type="button"
              id="togglePassword"
              class="show-password"
              aria-label="Show password"
            >
              Show
            </button>

          </div>

        </div>

        <button
          type="submit"
          id="loginBtn"
          class="login-btn"
        >
          Sign In
        </button>

      </form>

      <a
        href="#"
        id="forgotPassword"
        class="forgot"
      >
        Forgot password?
      </a>

      <div class="security">
        🔒 This area is restricted to authorized administrators.
      </div>

    </section>

    <footer class="footer">
      © <span id="year"></span> Let'sStudy Pro
    </footer>

  </main>


  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      sendPasswordResetEmail,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
    };


    /* =========================
       INITIALIZE FIREBASE
    ========================== */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* =========================
       DOM
    ========================== */

    const form =
      document.getElementById("adminLoginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");

    const togglePassword =
      document.getElementById("togglePassword");

    const forgotPassword =
      document.getElementById("forgotPassword");

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* =========================
       MESSAGE
    ========================== */

    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className =
        `message ${type}`;
    }


    function clearMessage() {

      message.textContent = "";

      message.className = "message";
    }


    /* =========================
       PASSWORD VISIBILITY
    ========================== */

    togglePassword.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword ? "text" : "password";

        togglePassword.textContent =
          isPassword ? "Hide" : "Show";

        togglePassword.setAttribute(
          "aria-label",
          isPassword
            ? "Hide password"
            : "Show password"
        );
      }
    );


    /* =========================
       ADMIN ROLE CHECK
    ========================== */

    async function verifyAdmin(user) {

      if (!user) {
        return false;
      }

      try {

        const userRef =
          doc(db, "users", user.uid);

        const snapshot =
          await getDoc(userRef);

        if (!snapshot.exists()) {
          return false;
        }

        const data =
          snapshot.data();

        return data.role === "admin";

      } catch (error) {

        console.error(
          "Admin verification error:",
          error
        );

        return false;
      }
    }


    /* =========================
       LOGIN
    ========================== */

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessage();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email) {

          showMessage(
            "Please enter your admin email."
          );

          emailInput.focus();

          return;
        }

        if (!password) {

          showMessage(
            "Please enter your password."
          );

          passwordInput.focus();

          return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
          "Signing in...";


        try {

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );

          const isAdmin =
            await verifyAdmin(
              credential.user
            );


          if (!isAdmin) {

            await signOut(auth);

            showMessage(
              "Access denied. This account is not an administrator."
            );

            return;
          }


          showMessage(
            "Admin authentication successful. Redirecting...",
            "success"
          );


          /*
           * CHANGE THIS URL if your
           * actual admin dashboard has
           * another filename.
           */

          window.location.replace(
            "admin-dashboard.html"
          );


        } catch (error) {

          console.error(
            "Admin login error:",
            error
          );


          let text =
            "Unable to sign in. Please check your credentials.";

          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            text =
              "Invalid email or password.";

          } else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            text =
              "Too many login attempts. Please try again later.";

          } else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            text =
              "Network error. Check your internet connection.";

          }


          showMessage(text);

        } finally {

          loginBtn.disabled = false;

          loginBtn.textContent =
            "Sign In";
        }

      }
    );


    /* =========================
       FORGOT PASSWORD
    ========================== */

    forgotPassword.addEventListener(
      "click",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "Enter your admin email first."
          );

          emailInput.focus();

          return;
        }


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );

          showMessage(
            "Password reset instructions have been sent to your email.",
            "success"
          );

        } catch (error) {

          console.error(
            "Password reset error:",
            error
          );

          showMessage(
            "Unable to send password reset email."
          );
        }

      }
    );


    /* =========================
       EXISTING SESSION CHECK
    ========================== */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {
          return;
        }


        const isAdmin =
          await verifyAdmin(user);


        if (isAdmin) {

          window.location.replace(
            "admin-dashboard.html"
          );

        } else {

          await signOut(auth);

        }

      }
    );

  </script>

</body>
</html>
