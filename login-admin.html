<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Secure administrator login for the Let'sStudy Pro platform."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;

      background: linear-gradient(
        135deg,
        #eef4ff 0%,
        #f8fafc 50%,
        #eef2ff 100%
      );

      color: #172033;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 22px;

      padding: 34px;

      box-shadow:
        0 20px 60px rgba(15, 23, 42, 0.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .shield {
      width: 68px;
      height: 68px;

      margin: 0 auto 14px;

      border-radius: 18px;

      background: #111827;
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 800;

      margin-bottom: 5px;
    }

    .brand p {
      color: #64748b;
      font-size: 14px;
    }

    .title {
      font-size: 19px;
      font-weight: 750;

      margin-bottom: 6px;
    }

    .description {
      color: #64748b;

      font-size: 14px;
      line-height: 1.5;

      margin-bottom: 23px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      font-size: 14px;
      font-weight: 650;

      color: #334155;

      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 49px;

      border: 1px solid #cbd5e1;

      border-radius: 11px;

      padding: 0 14px;

      font-size: 15px;

      outline: none;

      background: #ffffff;

      transition: 0.2s ease;
    }

    input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 75px;
    }

    .toggle {
      position: absolute;

      right: 10px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;

      background: transparent;

      color: #2563eb;

      font-weight: 700;

      cursor: pointer;

      padding: 6px;
    }

    .message {
      display: none;

      border-radius: 11px;

      padding: 12px 14px;

      margin-bottom: 18px;

      font-size: 14px;

      line-height: 1.45;
    }

    .message.error {
      display: block;

      background: #fef2f2;

      border: 1px solid #fecaca;

      color: #b91c1c;
    }

    .message.success {
      display: block;

      background: #f0fdf4;

      border: 1px solid #bbf7d0;

      color: #15803d;
    }

    .login-btn {
      width: 100%;
      height: 50px;

      border: 0;

      border-radius: 12px;

      background: #111827;
      color: #ffffff;

      font-size: 15px;
      font-weight: 750;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .login-btn:hover {
      background: #1f2937;
    }

    .login-btn:disabled {
      opacity: 0.65;

      cursor: not-allowed;
    }

    .links {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      margin-top: 20px;
    }

    .links a {
      color: #2563eb;

      text-decoration: none;

      font-size: 13px;

      font-weight: 650;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .security {
      margin-top: 24px;

      padding-top: 20px;

      border-top: 1px solid #e5e7eb;

      text-align: center;

      color: #64748b;

      font-size: 12px;

      line-height: 1.5;
    }

    .footer {
      text-align: center;

      margin-top: 18px;

      color: #94a3b8;

      font-size: 12px;
    }

    @media (max-width: 520px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 25px 20px;

        border-radius: 18px;
      }

      .links {
        flex-direction: column;

        text-align: center;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <div class="card">

      <div class="brand">

        <div class="shield">
          🛡️
        </div>

        <h1>
          Let'sStudy Pro
        </h1>

        <p>
          Administrator Portal
        </p>

      </div>


      <div class="title">
        Admin Login
      </div>

      <div class="description">
        Sign in with your authorized Let'sStudy Pro administrator account.
      </div>


      <div
        id="message"
        class="message"
      ></div>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            Admin Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle"
              id="togglePassword"
            >
              Show
            </button>

          </div>

        </div>


        <button
          id="loginBtn"
          type="submit"
          class="login-btn"
        >
          Login to Admin Portal
        </button>

      </form>


      <div class="links">

        <a href="register-admin.html">
          Register Admin
        </a>

        <a href="forgot-admin-password.html">
          Forgot Password?
        </a>

      </div>


      <div class="security">

        🔒 This area is restricted to authorized
        Let'sStudy Pro administrators only.

      </div>

    </div>


    <div class="footer">
      © 2026 Let'sStudy Pro
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /*
     * LETSSTUDY PRO FIREBASE CONFIG
     */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

      measurementId:
        "G-85B7V5H5J0"

    };


    /*
     * INITIALIZE FIREBASE
     */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /*
     * ELEMENTS
     */

    const form =
      document.getElementById(
        "loginForm"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const loginBtn =
      document.getElementById(
        "loginBtn"
      );

    const message =
      document.getElementById(
        "message"
      );

    const togglePassword =
      document.getElementById(
        "togglePassword"
      );


    /*
     * MESSAGE
     */

    function showMessage(
      text,
      type = "error"
    ) {

      message.className =
        "message " + type;

      message.textContent =
        text;

    }


    function clearMessage() {

      message.className =
        "message";

      message.textContent =
        "";

    }


    /*
     * FIREBASE ERROR HANDLING
     */

    function getFirebaseError(error) {

      switch (error.code) {

        case "auth/invalid-credential":

          return "Invalid admin email or password.";

        case "auth/invalid-login-credentials":

          return "Invalid admin email or password.";

        case "auth/user-not-found":

          return "No account exists with this email address.";

        case "auth/wrong-password":

          return "Incorrect password.";

        case "auth/invalid-email":

          return "Please enter a valid email address.";

        case "auth/user-disabled":

          return "This account has been disabled.";

        case "auth/too-many-requests":

          return "Too many login attempts. Please try again later.";

        case "auth/network-request-failed":

          return "Network error. Check your internet connection.";

        case "permission-denied":

          return "Firestore denied access to the admin record.";

        default:

          return error.message ||
            "Unable to login.";

      }

    }


    /*
     * SHOW / HIDE PASSWORD
     */

    togglePassword.addEventListener(
      "click",
      () => {

        if (
          passwordInput.type ===
          "password"
        ) {

          passwordInput.type =
            "text";

          togglePassword.textContent =
            "Hide";

        } else {

          passwordInput.type =
            "password";

          togglePassword.textContent =
            "Show";

        }

      }
    );


    /*
     * LOGIN
     */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        clearMessage();


        const email =
          emailInput.value
            .trim()
            .toLowerCase();


        const password =
          passwordInput.value;


        if (!email) {

          showMessage(
            "Please enter your admin email."
          );

          emailInput.focus();

          return;

        }


        if (!password) {

          showMessage(
            "Please enter your password."
          );

          passwordInput.focus();

          return;

        }


        loginBtn.disabled =
          true;

        loginBtn.textContent =
          "Signing in...";


        try {

          /*
           * 1. FIREBASE AUTHENTICATION
           */

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          /*
           * 2. GET ADMINS/{UID}
           */

          const adminRef =
            doc(
              db,
              "admins",
              user.uid
            );


          const adminSnap =
            await getDoc(
              adminRef
            );


          /*
           * ADMIN RECORD MUST EXIST
           */

          if (
            !adminSnap.exists()
          ) {

            await signOut(auth);

            throw new Error(
              "ADMIN_RECORD_NOT_FOUND"
            );

          }


          const admin =
            adminSnap.data();


          /*
           * ROLE CHECK
           */

          if (
            admin.role !==
            "admin"
          ) {

            await signOut(auth);

            throw new Error(
              "NOT_ADMIN"
            );

          }


          /*
           * STATUS CHECK
           */

          if (
            admin.status &&
            admin.status !==
            "active"
          ) {

            await signOut(auth);

            throw new Error(
              "ADMIN_DISABLED"
            );

          }


          /*
           * SUCCESS
           */

          showMessage(
            "Login successful. Opening Admin Portal...",
            "success"
          );


          loginBtn.textContent =
            "Access Granted";


          setTimeout(
            () => {

              window.location.replace(
                "admin-dashboard.html"
              );

            },
            800
          );

        }

        catch (error) {

          console.error(
            "Admin login error:",
            error
          );


          let text;


          if (
            error.message ===
            "ADMIN_RECORD_NOT_FOUND"
          ) {

            text =
              "Access denied. This account is not registered as an administrator.";

          }

          else if (
            error.message ===
            "NOT_ADMIN"
          ) {

            text =
              "Access denied. This account does not have administrator privileges.";

          }

          else if (
            error.message ===
            "ADMIN_DISABLED"
          ) {

            text =
              "This administrator account is inactive.";

          }

          else {

            text =
              getFirebaseError(error);

          }


          showMessage(text);


          loginBtn.disabled =
            false;

          loginBtn.textContent =
            "Login to Admin Portal";

        }

      }
    );


    /*
     * EXISTING SESSION CHECK
     */

    onAuthStateChanged(
      auth,
      async user => {

        if (!user) {
          return;
        }


        try {

          const adminSnap =
            await getDoc(
              doc(
                db,
                "admins",
                user.uid
              )
            );


          if (
            adminSnap.exists()
          ) {

            const admin =
              adminSnap.data();


            if (
              admin.role === "admin" &&
              (
                !admin.status ||
                admin.status === "active"
              )
            ) {

              window.location.replace(
                "admin-dashboard.html"
              );

            }

          }

        }

        catch (error) {

          console.error(
            "Admin session check error:",
            error
          );

        }

      }
    );

  </script>

</body>
</html>
