<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Admin Login | LetsStudy Pro</title>

  <meta
    name="description"
    content="Secure administrator access to LetsStudy Pro."
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <link
    rel="icon"
    href="https://letsstudy.pro/favicon.ico"
  >

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
      background:
        linear-gradient(
          135deg,
          #07111f,
          #10243d,
          #06101d
        );
      color:#fff;
    }

    .container{
      width:100%;
      max-width:430px;
    }

    .card{
      width:100%;
      padding:30px;
      border-radius:22px;
      background:
        rgba(255,255,255,.08);
      border:1px solid
        rgba(255,255,255,.15);
      box-shadow:
        0 25px 70px
        rgba(0,0,0,.45);
      backdrop-filter:blur(18px);
    }

    .logo{
      width:64px;
      height:64px;
      margin:0 auto 16px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:900;
      background:
        linear-gradient(
          135deg,
          #38bdf8,
          #2563eb
        );
      box-shadow:
        0 12px 30px
        rgba(37,99,235,.35);
    }

    h1{
      text-align:center;
      font-size:27px;
      margin-bottom:8px;
    }

    .subtitle{
      text-align:center;
      color:#b9c7d8;
      font-size:14px;
      line-height:1.6;
      margin-bottom:25px;
    }

    label{
      display:block;
      margin-bottom:7px;
      font-size:13px;
      font-weight:700;
      color:#dbe7f4;
    }

    input{
      width:100%;
      height:50px;
      padding:0 14px;
      border-radius:12px;
      border:1px solid
        rgba(255,255,255,.16);
      outline:none;
      color:#fff;
      background:
        rgba(0,0,0,.22);
      font-size:15px;
      margin-bottom:16px;
    }

    input:focus{
      border-color:#38bdf8;
      box-shadow:
        0 0 0 3px

    }

    .password-wrap{
      position:relative;
    }

    .password-wrap input{
      padding-right:75px;
    }

    .show-btn{
      position:absolute;
      right:8px;
      top:7px;
      height:36px;
      padding:0 11px;
      border:0;
      border-radius:9px;
      background:
        rgba(255,255,255,.10);
      color:#dbeafe;
      cursor:pointer;
      font-weight:700;
    }

      font-family:inherit;

      border:0;
      border-radius:12px;

        linear-gradient(

          #2563eb,
          #0ea5e9

      color:#fff;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
      transition:.2s;
    }

    .primary-btn:hover{
      transform:translateY(-1px);
    }

    .primary-btn:disabled{
      opacity:.65;
      cursor:not-allowed;
      transform:none;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:22px 0;
      color:#8fa2b8;
      font-size:12px;
      font-weight:700;
    }

    .divider::before,
    .divider::after{
      content:"";
      flex:1;
      height:1px;
      background:
        rgba(255,255,255,.12);
    }

    .google-btn{
      width:100%;
      min-height:50px;
      border-radius:12px;
      border:1px solid
        rgba(255,255,255,.16);
      background:#fff;
      color:#111827;
      font-weight:800;
      font-size:15px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;

    .google-btn:disabled{
      opacity:.65;
      cursor:not-allowed;
    }

    .google-icon{

      border-radius:50%;

      align-items:center;

      font-weight:900;
      color:#4285f4;
      background:#fff;

    .message{
      display:none;

    .message.error{

    .message.success{

        rgba(34,197,94,.14);

        rgba(59,130,246,.35);

    }

    .actions{

    .secondary-btn{

    }

    .secondary-btn.dashboard{

      font-size:12px;

    }

    .links a:hover{

        rgba(255,255,255,.10);
    }

    .security{

      text-align:center;
      color:#9fb0c2;
      font-size:11px;
      line-height:1.7;
    }

    .security strong{

    }

    footer{
      text-align:center;
      margin-top:18px;
      color:#718198;
      font-size:11px;
    }

    .debug{
      display:none;
      margin-top:15px;
      padding:12px;
      border-radius:10px;
      background:#020617;
      border:1px solid
        rgba(255,255,255,.12);
      color:#94a3b8;
      font-family:
        monospace;
      font-size:10px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break:break-word;
    }

    @media(max-width:480px){

      body{
        padding:12px;
      }

      .card{
        padding:23px 18px;
      }

      h1{
        font-size:24px;
      }

    }

  </style>

</head>

<body>

<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


  import {
    getAuth,
    signInWithEmailAndPassword,
    signInWithPopup,
    GoogleAuthProvider,
    signOut,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  import {
    getFirestore,
    doc,
    getDoc
  } from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"

  };


  /* =========================================
     INITIALIZE FIREBASE
  ========================================= */

  const app =
    initializeApp(
      firebaseConfig
    );

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================================
     GOOGLE PROVIDER
  ========================================= */

  const googleProvider =
    new GoogleAuthProvider();

  googleProvider.addScope(
    "profile"
  );

  googleProvider.addScope(
    "email"
  );


  /* =========================================
     DOM ELEMENTS
  ========================================= */

  const loginForm =
    document.getElementById(
      "loginForm"
    );

  const emailInput =
    document.getElementById(
      "email"
    );

  const passwordInput =
    document.getElementById(
      "password"
    );

  const showPassword =
    document.getElementById(
      "showPassword"
    );

  const loginBtn =
    document.getElementById(
      "loginBtn"
    );

  const googleLoginBtn =
    document.getElementById(
      "googleLoginBtn"
    );

  const googleText =
    document.getElementById(
      "googleText"
    );

  const errorMessage =
    document.getElementById(
      "errorMessage"
    );

  const successMessage =
    document.getElementById(
      "successMessage"
    );

  const infoMessage =
    document.getElementById(
      "infoMessage"
    );

  const dashboardBtn =
    document.getElementById(
      "dashboardBtn"
    );

  const loginAgainBtn =
    document.getElementById(
      "loginAgainBtn"
    );

  const debugBox =
    document.getElementById(
      "debugBox"
    );


  /* =========================================
     MESSAGE HELPERS
  ========================================= */

  function hideMessages(){

    errorMessage.style.display =
      "none";

    successMessage.style.display =
      "none";

    infoMessage.style.display =
      "none";

  }


  function showError(message){

    hideMessages();

    errorMessage.textContent =
      message;

    errorMessage.style.display =
      "block";

  }


  function showSuccess(message){

    hideMessages();

    successMessage.textContent =
      message;

    successMessage.style.display =
      "block";

  }


  function showInfo(message){

    hideMessages();

    infoMessage.textContent =
      message;

    infoMessage.style.display =
      "block";

  }


  /* =========================================
     DEBUG
  ========================================= */

  function showDebug(lines){

    debugBox.textContent =
      lines.join("\n");

    debugBox.style.display =
      "block";

  }


  function hideDebug(){

    debugBox.textContent =
      "";

    debugBox.style.display =
      "none";

  }


  /* =========================================
     LOADING
  ========================================= */

  function setLoading(loading){

    loginBtn.disabled =
      loading;

    googleLoginBtn.disabled =
      loading;

    if(loading){

      loginBtn.textContent =
        "Signing in...";

    }else{

      loginBtn.textContent =
        "Sign In";

    }

  }


  /* =========================================
     SESSION
  ========================================= */

  function saveAdminSession(user, adminData){

    sessionStorage.setItem(
      "letsStudyAdminSession",
      JSON.stringify({

        authenticated:true,

        uid:user.uid,

        email:user.email || "",

        name:
          adminData?.name ||
          user.displayName ||
          "Administrator",

        role:
          adminData?.role ||
          "admin",

        status:
          adminData?.status ||
          "active",

        loginAt:
          new Date().toISOString()

      })
    );

  }


  function clearAdminSession(){

    sessionStorage.removeItem(
      "letsStudyAdminSession"
    );

  }


  /* =========================================
     ADMIN VERIFICATION
  ========================================= */

  async function verifyAdmin(user){

    if(!user){

      return {

        allowed:false,

        reason:
          "No authenticated Firebase user."

      };

    }


    try{

      const uid =
        String(
          user.uid || ""
        ).trim();


      const email =
        String(
          user.email || ""
        ).trim()
        .toLowerCase();


      if(!uid){

        return {

          allowed:false,

          reason:
            "Firebase Authentication UID is missing."

        };

      }


      /*
        IMPORTANT:

        Firestore path MUST be:

        admins/{Firebase Auth UID}
      */

      const adminRef =
        doc(
          db,
          "admins",
          uid
        );


      const adminSnap =
        await getDoc(
          adminRef
        );


      /* =====================================
         DEBUG
      ===================================== */

      const debugLines = [

        "========== ADMIN DEBUG ==========",

        `Auth UID: ${uid}`,

        `Auth Email: ${email}`,

        `Firestore Path: admins/${uid}`,

        `Document Exists: ${adminSnap.exists()}`

      ];


      if(
        !adminSnap.exists()
      ){

        console.error(
          "ADMIN DOCUMENT NOT FOUND:",
          `admins/${uid}`
        );


        showDebug(
          debugLines
        );


        return {

          allowed:false,

          code:
            "ADMIN_DOCUMENT_NOT_FOUND",

          reason:
            "Login successful, but this Firebase account is not registered as an administrator.",

          uid:uid,

          email:email

        };

      }


      const adminData =
        adminSnap.data() || {};


      const adminUid =
        String(
          adminData.uid || ""
        ).trim();


      const adminEmail =
        String(
          adminData.email || ""
        ).trim()
        .toLowerCase();


      const role =
        String(
          adminData.role || ""
        ).trim()
        .toLowerCase();


      const status =
        String(
          adminData.status || ""
        ).trim()
        .toLowerCase();


      debugLines.push(
        `Admin UID: ${adminUid}`
      );

      debugLines.push(
        `Admin Email: ${adminEmail}`
      );

      debugLines.push(
        `Admin Role: ${role}`
      );

      debugLines.push(
        `Admin Status: ${status}`
      );


      showDebug(
        debugLines
      );


      /* =====================================
         UID CHECK
      ===================================== */

      if(
        adminUid &&
        adminUid !== uid
      ){

        return {

          allowed:false,

          code:
            "ADMIN_UID_MISMATCH",

          reason:
            "Administrator UID does not match the Firebase Authentication UID.",

          uid:uid,

          adminUid:adminUid

        };

      }


      /* =====================================
         ROLE CHECK
      ===================================== */

      const validRoles = [

        "admin",

        "administrator",

        "superadmin"

      ];


      if(
        !validRoles.includes(
          role
        )
      ){

        return {

          allowed:false,

          code:
            "INVALID_ADMIN_ROLE",

          reason:
            "This account does not have a valid administrator role.",

          role:role

        };

      }


      /* =====================================
         STATUS CHECK
      ===================================== */

      if(
        status !== "active"
      ){

        return {

          allowed:false,

          code:
            "ADMIN_NOT_ACTIVE",

          reason:
            `Administrator account status is "${adminData.status || "unknown"}".`,

          status:status

        };

      }


      /* =====================================
         EMAIL CHECK
      ===================================== */

      if(
        adminEmail &&
        email &&
        adminEmail !== email
      ){

        return {

          allowed:false,

          code:
            "ADMIN_EMAIL_MISMATCH",

          reason:
            "Administrator email does not match the authenticated Firebase account.",

          authEmail:email,

          adminEmail:adminEmail

        };

      }


      console.log(
        "ADMIN VERIFIED:",
        {
          uid,
          email,
          role,
          status
        }
      );


      return {

        allowed:true,

        uid:uid,

        email:email,

        adminData:adminData

      };

    }catch(error){

      console.error(
        "ADMIN VERIFICATION ERROR:",
        error
      );


      if(
      error?.code ===
      "permission-denied"
    ){

      return {

        allowed:false,

        permissionError:true,

        code:
          "FIRESTORE_PERMISSION_DENIED",

        reason:
          "Firebase Authentication succeeded, but Firestore denied access to the administrator document."

      };

    }


    /* =========================================
       NETWORK / FIRESTORE UNAVAILABLE
    ========================================= */

    if(
      error?.code ===
        "unavailable"
    ){

      return {

        allowed:false,

        code:
          "FIRESTORE_UNAVAILABLE",

        reason:
          "Cloud Firestore is temporarily unavailable. Check your internet connection and try again."

      };

    }


    /* =========================================
       FAILED PRECONDITION
    ========================================= */

    if(
      error?.code ===
        "failed-precondition"
    ){

      return {

        allowed:false,

        code:
          "FIRESTORE_FAILED_PRECONDITION",

        reason:
          "Firestore could not complete the administrator verification."

      };

    }


    /* =========================================
       GENERIC VERIFICATION ERROR
    ========================================= */

    return {

      allowed:false,

      code:
        error?.code ||
        "ADMIN_VERIFICATION_ERROR",

      reason:
        error?.message ||
        "Unable to verify administrator."

    };

  }

}


/* =========================================
   SHOW DASHBOARD BUTTON
========================================= */

function showDashboardButton(){

  dashboardBtn.style.display =
    "block";

  loginAgainBtn.style.display =
    "none";

}


/* =========================================
   SHOW LOGIN AGAIN
========================================= */

function showLoginAgain(){

  dashboardBtn.style.display =
    "none";

  loginAgainBtn.style.display =
    "block";

}


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

showPassword.addEventListener(
  "click",
  () => {

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      showPassword.textContent =
        "Hide";

    }else{

      passwordInput.type =
        "password";

      showPassword.textContent =
        "Show";

    }

  }
);


/* =========================================
   LOGIN AGAIN
========================================= */

loginAgainBtn.addEventListener(
  "click",
  async () => {

    clearAdminSession();

    hideMessages();

    hideDebug();

    dashboardBtn.style.display =
      "none";

    loginAgainBtn.style.display =
      "none";

    try{

      await signOut(auth);

    }catch(error){

      console.warn(
        "Sign out error:",
        error
      );

    }

    passwordInput.value =
      "";

    emailInput.focus();

  }
);


/* =========================================
   MANUAL DASHBOARD
   NO AUTOMATIC REDIRECT
========================================= */

dashboardBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "admin-dashboard.html";

  }
);


/* =========================================
   EMAIL / PASSWORD LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    hideMessages();

    hideDebug();

    dashboardBtn.style.display =
      "none";

    loginAgainBtn.style.display =
      "none";


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    if(!email){

      showError(
        "Please enter your administrator email."
      );

      return;

    }


    if(!password){

      showError(
        "Please enter your password."
      );

      return;

    }


    setLoading(true);


    try{

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        credential.user;


      console.log(
        "Firebase Authentication successful:",
        {
          uid:user.uid,
          email:user.email
        }
      );


      const result =
        await verifyAdmin(
          user
        );


      if(
        !result.allowed
      ){

        clearAdminSession();

        try{

          await signOut(auth);

        }catch(signOutError){

          console.warn(
            "Sign out error:",
            signOutError
          );

        }


        showError(
          result.reason ||
          "This account is not authorized as an administrator."
        );


        showLoginAgain();

        setLoading(false);

        return;

      }


      /* =====================================
         ADMIN VERIFIED
      ===================================== */

      saveAdminSession(
        user,
        result.adminData
      );


      showSuccess(
        "Administrator verified successfully. You can now open the Admin Dashboard."
      );


      showDashboardButton();

      setLoading(false);

    }catch(error){

      console.error(
        "EMAIL LOGIN ERROR:",
        error
      );


      let message =
        "Unable to sign in.";


      switch(
        error?.code
      ){

        case "auth/invalid-credential":

          message =
            "Invalid email or password.";

          break;


        case "auth/user-not-found":

          message =
            "No Firebase Authentication account was found with this email.";

          break;


        case "auth/wrong-password":

          message =
            "Incorrect password.";

          break;


        case "auth/invalid-email":

          message =
            "Please enter a valid email address.";

          break;


        case "auth/user-disabled":

          message =
            "This Firebase account has been disabled.";

          break;


        case "auth/too-many-requests":

          message =
            "Too many login attempts. Please wait and try again.";

          break;


        case "auth/network-request-failed":

          message =
            "Network error. Check your internet connection.";

          break;


        case "auth/operation-not-allowed":

          message =
            "Email/password authentication is not enabled in Firebase Authentication.";

          break;


        default:

          message =
            error?.message ||
            "Unable to sign in.";

      }


      showError(
        message
      );

      showLoginAgain();

      setLoading(false);

    }

  }
);


/* =========================================
   GOOGLE LOGIN
========================================= */

googleLoginBtn.addEventListener(
  "click",
  async () => {

    hideMessages();

    hideDebug();

    dashboardBtn.style.display =
      "none";

    loginAgainBtn.style.display =
      "none";


    googleLoginBtn.disabled =
      true;


    googleText.textContent =
      "Connecting to Google...";


    try{

      const googleResult =
        await signInWithPopup(
          auth,
          googleProvider
        );


      const user =
        googleResult.user;


      console.log(
        "Google Authentication successful:",
        {
          uid:user.uid,
          email:user.email,
          name:user.displayName
        }
      );


      const result =
        await verifyAdmin(
          user
        );


      if(
        !result.allowed
      ){

        clearAdminSession();


        try{

          await signOut(auth);

        }catch(signOutError){

          console.warn(
            "Google sign out error:",
            signOutError
          );

        }


        showError(
          result.reason ||
          "This Google account is not registered as an administrator."
        );


        showLoginAgain();


        googleLoginBtn.disabled =
          false;

        googleText.textContent =
          "Continue with Google";

        return;

      }


      /* =====================================
         GOOGLE ADMIN VERIFIED
      ===================================== */

      saveAdminSession(
        user,
        result.adminData
      );


      showSuccess(
        "Google administrator verified successfully. You can now open the Admin Dashboard."
      );


      showDashboardButton();


      googleLoginBtn.disabled =
        false;

      googleText.textContent =
        "Google Administrator Verified";


    }catch(error){

      console.error(
        "GOOGLE LOGIN ERROR:",
        error
      );


      let message =
        "Unable to sign in with Google.";


      switch(
        error?.code
      ){

        case "auth/popup-closed-by-user":

          message =
            "Google sign-in was cancelled.";

          break;


        case "auth/popup-blocked":

          message =
            "Google sign-in popup was blocked. Please allow popups and try again.";

          break;


        case "auth/cancelled-popup-request":

          message =
            "Another Google sign-in request is already running.";

          break;


        case "auth/unauthorized-domain":

          message =
            "This website domain is not authorized for Firebase Authentication.";

          break;


        case "auth/operation-not-allowed":

          message =
            "Google Sign-In is not enabled in Firebase Authentication.";

          break;


        case "auth/network-request-failed":

          message =
            "Network error. Check your internet connection.";

          break;


        case "auth/account-exists-with-different-credential":

          message =
            "This email already has a Firebase account using another sign-in method.";

          break;


        default:

          message =
            error?.message ||
            message;

      }


      showError(
        message
      );


      showLoginAgain();


      googleLoginBtn.disabled =
        false;

      googleText.textContent =
        "Continue with Google";

    }

  }
);


/* =========================================
   INITIAL UI STATE
========================================= */

dashboardBtn.style.display =
  "none";

loginAgainBtn.style.display =
  "none";

googleLoginBtn.disabled =
  false;


/* =========================================
   AUTH STATE MONITOR
========================================= */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      console.log(
        "Firebase Auth user:",
        {
          uid:user.uid,

          email:
            user.email || "",

          providers:
            user.providerData?.map(
              provider =>
                provider.providerId
            ) || []

        }
      );

    }else{

      console.log(
        "No Firebase Auth user currently signed in."
      );

    }

  }
);

</script>
