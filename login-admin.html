<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin Login | Let'sStudy Pro</title>

<meta
  name="description"
  content="Secure Let'sStudy Pro administrator portal login."
>

<meta
  name="robots"
  content="noindex,nofollow"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef4ff,
      #f8fafc 50%,
      #eef2ff
    );

  color:#172033;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

}

.container{

  width:100%;

  max-width:460px;

}

.card{

  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:24px;

  padding:32px;

  box-shadow:
    0 25px 70px
    rgba(15,23,42,.12);

}


/* =========================
   BRAND
========================= */

.brand{

  text-align:center;

  margin-bottom:25px;

}

.logo{

  width:68px;

  height:68px;

  margin:0 auto 13px;

  border-radius:19px;

  background:#111827;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:31px;

  box-shadow:
    0 10px 25px
    rgba(17,24,39,.20);

}

.brand h1{

  font-size:25px;

  font-weight:900;

}

.brand p{

  color:#64748b;

  font-size:13px;

  margin-top:5px;

}


/* =========================
   TITLES
========================= */

.title{

  font-size:20px;

  font-weight:850;

  margin-bottom:6px;

}

.description{

  color:#64748b;

  font-size:13px;

  line-height:1.5;

  margin-bottom:20px;

}


/* =========================
   MESSAGE
========================= */

.message{

  display:none;

  padding:12px 14px;

  border-radius:10px;

  margin-bottom:16px;

  font-size:13px;

  line-height:1.45;

}

.message.show{

  display:block;

}

.message.error{

  background:#fef2f2;

  border:1px solid #fecaca;

  color:#b91c1c;

}

.message.success{

  background:#f0fdf4;

  border:1px solid #bbf7d0;

  color:#15803d;

}


/* =========================
   TABS
========================= */

.tabs{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:5px;

  background:#f1f5f9;

  padding:5px;

  border-radius:11px;

  margin-bottom:20px;

}

.tab{

  border:0;

  background:transparent;

  padding:10px 5px;

  border-radius:8px;

  font-size:12px;

  font-weight:750;

  color:#64748b;

  cursor:pointer;

}

.tab.active{

  background:white;

  color:#111827;

  box-shadow:
    0 1px 4px
    rgba(0,0,0,.08);

}


/* =========================
   FORMS
========================= */

.login-panel{

  display:none;

}

.login-panel.active{

  display:block;

}

.field{

  margin-bottom:15px;

}

label{

  display:block;

  font-size:13px;

  font-weight:750;

  color:#334155;

  margin-bottom:7px;

}

input{

  width:100%;

  height:49px;

  border:1px solid #cbd5e1;

  border-radius:10px;

  padding:0 13px;

  font-size:14px;

  outline:none;

  background:#fff;

  color:#172033;

}

input:focus{

  border-color:#2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.10);

}

input::placeholder{

  color:#94a3b8;

}


/* =========================
   PASSWORD
========================= */

.password-wrap{

  position:relative;

}

.password-wrap input{

  padding-right:65px;

}

.toggle{

  position:absolute;

  right:9px;

  top:50%;

  transform:translateY(-50%);

  border:0;

  background:transparent;

  color:#2563eb;

  font-size:12px;

  font-weight:800;

  cursor:pointer;

}


/* =========================
   PRIMARY BUTTON
========================= */

.primary-btn{

  width:100%;

  min-height:50px;

  border:0;

  border-radius:11px;

  background:#111827;

  color:white;

  font-size:14px;

  font-weight:850;

  margin-top:4px;

  cursor:pointer;

  transition:.2s ease;

}

.primary-btn:hover{

  background:#1f2937;

  transform:translateY(-1px);

}

.primary-btn:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;

}


/* =========================
   GOOGLE
========================= */

.google-btn{

  width:100%;

  height:50px;

  border:1px solid #cbd5e1;

  border-radius:11px;

  background:white;

  color:#111827;

  font-size:14px;

  font-weight:800;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  cursor:pointer;

}

.google-btn:hover{

  background:#f8fafc;

}

.google-btn:disabled{

  opacity:.6;

  cursor:not-allowed;

}

.google-icon{

  font-size:19px;

  font-weight:900;

}


/* =========================
   LINKS
========================= */

.links{

  display:flex;

  justify-content:space-between;

  gap:10px;

  margin-top:17px;

}

.links button{

  border:0;

  background:transparent;

  color:#2563eb;

  font-size:12px;

  font-weight:700;

  cursor:pointer;

}

.links button:hover{

  text-decoration:underline;

}


/* =========================
   OTP
========================= */

#recaptcha-container{

  margin:12px 0;

  min-height:0;

}

#otpArea{

  margin-top:10px;

}


/* =========================
   SECURITY
========================= */

.security{

  margin-top:24px;

  padding-top:18px;

  border-top:1px solid #e5e7eb;

  text-align:center;

  color:#64748b;

  font-size:11px;

  line-height:1.6;

}


/* =========================
   FOOTER
========================= */

.footer{

  text-align:center;

  margin-top:16px;

  color:#94a3b8;

  font-size:11px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  body{

    padding:14px;

  }

  .card{

    padding:25px 20px;

    border-radius:19px;

  }

  .tabs{

    gap:3px;

  }

  .tab{

    font-size:11px;

  }

}

</style>

</head>


<body>


<div class="container">

  <div class="card">


    <!-- =========================
         BRAND
    ========================== -->

    <div class="brand">

      <div class="logo">
        🛡️
      </div>

      <h1>
        Let'sStudy Pro
      </h1>

      <p>
        Administrator Portal
      </p>

    </div>


    <!-- =========================
         TITLE
    ========================== -->

    <div class="title">
      Secure Login
    </div>

    <div class="description">

      Sign in to access your
      Let'sStudy Pro management ecosystem.

    </div>


    <!-- =========================
         MESSAGE
    ========================== -->

    <div
      id="message"
      class="message"
      role="alert"
      aria-live="polite"
    ></div>


    <!-- =========================
         LOGIN METHODS
    ========================== -->

    <div class="tabs">

      <button
        class="tab active"
        type="button"
        data-tab="emailPanel"
      >
        Email
      </button>

      <button
        class="tab"
        type="button"
        data-tab="googlePanel"
      >
        Google
      </button>

      <button
        class="tab"
        type="button"
        data-tab="phonePanel"
      >
        Phone
      </button>

    </div>


    <!-- =========================
         EMAIL LOGIN
    ========================== -->

    <div
      id="emailPanel"
      class="login-panel active"
    >

      <form id="emailForm">


        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            id="email"
            type="email"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              type="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="toggle"
            >
              Show
            </button>

          </div>

        </div>


        <button
          id="emailBtn"
          class="primary-btn"
          type="submit"
        >
          Login with Email
        </button>


      </form>


      <div class="links">

        <button
          id="forgotBtn"
          type="button"
        >
          Forgot Password?
        </button>

        <button
          id="registerBtn"
          type="button"
        >
          Create Account
        </button>

      </div>

    </div>


    <!-- =========================
         GOOGLE LOGIN
    ========================== -->

    <div
      id="googlePanel"
      class="login-panel"
    >

      <button
        id="googleBtn"
        class="google-btn"
        type="button"
      >

        <span class="google-icon">
          G
        </span>

        Continue with Google

      </button>

    </div>


    <!-- =========================
         PHONE LOGIN
    ========================== -->

    <div
      id="phonePanel"
      class="login-panel"
    >

      <div class="field">

        <label for="phone">
          Phone Number
        </label>

        <input
          id="phone"
          type="tel"
          placeholder="+255712345678"
          autocomplete="tel"
        >

      </div>


      <button
        id="sendOtpBtn"
        class="primary-btn"
        type="button"
      >
        Send Verification Code
      </button>


      <div
        id="recaptcha-container"
      ></div>


      <div
        id="otpArea"
        style="display:none"
      >

        <div class="field">

          <label for="otp">
            Verification Code
          </label>

          <input
            id="otp"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="Enter 6-digit code"
          >

        </div>


        <button
          id="verifyOtpBtn"
          class="primary-btn"
          type="button"
        >
          Verify & Login
        </button>

      </div>

    </div>


    <!-- =========================
         SECURITY
    ========================== -->

    <div class="security">

      🔒 Authentication is handled by Firebase.

      <br>

      Administrator access is verified through
      the <strong>admins</strong> Firestore collection.

    </div>


  </div>


  <!-- =========================
       FOOTER
  ========================== -->

  <div class="footer">

    © 2026 Let'sStudy Pro

  </div>

</div>



<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signInWithPopup,
  GoogleAuthProvider,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  sendPasswordResetEmail,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


const googleProvider =
  new GoogleAuthProvider();


/* =========================================
   ELEMENTS
========================================= */

const message =
  document.getElementById(
    "message"
  );


const tabs =
  document.querySelectorAll(
    ".tab"
  );


const panels =
  document.querySelectorAll(
    ".login-panel"
  );


/* =========================================
   DASHBOARD BUTTON
   MANUAL NAVIGATION ONLY
========================================= */

let dashboardButton = null;


function createDashboardButton(){

  if(dashboardButton){

    dashboardButton.style.display =
      "block";

    return;

  }


  dashboardButton =
    document.createElement(
      "button"
    );


  dashboardButton.type =
    "button";


  dashboardButton.className =
    "primary-btn";


  dashboardButton.textContent =
    "Open Admin Dashboard";


  dashboardButton.style.marginTop =
    "12px";


  dashboardButton.addEventListener(
    "click",
    () => {

      /*
       * Manual navigation.
       * No automatic redirect.
       */

      window.location.href =
        "admin-dashboard.html";

    }
  );


  message.insertAdjacentElement(
    "afterend",
    dashboardButton
  );

}


/* =========================================
   HIDE DASHBOARD BUTTON
========================================= */

function hideDashboardButton(){

  if(dashboardButton){

    dashboardButton.style.display =
      "none";

  }

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type = "error"
){

  message.textContent =
    text;

  message.className =
    "message show " + type;

}


function clearMessage(){

  message.textContent =
    "";

  message.className =
    "message";

  hideDashboardButton();

}


/* =========================================
   FIREBASE ERROR HANDLER
========================================= */

function firebaseError(error){

  switch(error.code){

    case "auth/invalid-credential":

      return "Invalid email or password.";

    case "auth/user-not-found":

      return "No account was found with this email.";

    case "auth/wrong-password":

      return "Incorrect password.";

    case "auth/invalid-email":

      return "Please enter a valid email address.";

    case "auth/email-already-in-use":

      return "This email is already registered.";

    case "auth/weak-password":

      return "Password is too weak.";

    case "auth/popup-closed-by-user":

      return "Google login was cancelled.";

    case "auth/popup-blocked":

      return "Your browser blocked the Google login popup.";

    case "auth/account-exists-with-different-credential":

      return "An account already exists using another sign-in method.";

    case "auth/too-many-requests":

      return "Too many attempts. Please try again later.";

    case "auth/network-request-failed":

      return "Network error. Check your connection.";

    case "auth/invalid-phone-number":

      return "Enter a valid phone number with country code.";

    case "auth/invalid-verification-code":

      return "Invalid verification code.";

    case "auth/code-expired":

      return "The verification code has expired.";

    case "auth/operation-not-allowed":

      return "This sign-in method is not enabled in Firebase Authentication.";

    case "auth/quota-exceeded":

      return "Firebase authentication quota has been exceeded.";

    default:

      return error.message ||
        "Authentication failed.";

  }

}


/* =========================================
   CHECK ADMIN
========================================= */

async function checkAdmin(user){

  if(!user){

    return {

      allowed:false,

      reason:
        "No administrator session was found."

    };

  }


  try{

    /*
     * Admin document:
     *
     * admins/{uid}
     */

    const adminRef =
      doc(
        db,
        "admins",
        user.uid
      );


    const adminSnap =
      await getDoc(
        adminRef
      );


    /*
     * DOCUMENT MUST EXIST
     */

    if(!adminSnap.exists()){

      return {

        allowed:false,

        reason:
          "This account is not registered as a Let'sStudy Pro administrator."

      };

    }


    const admin =
      adminSnap.data();


    /*
     * ROLE CHECK
     */

    if(
      admin.role &&
      admin.role !== "admin"
    ){

      return {

        allowed:false,

        reason:
          "This account does not have administrator privileges."

      };

    }


    /*
     * STATUS CHECK
     */

    if(
      admin.status &&
      admin.status !== "active"
    ){

      return {

        allowed:false,

        reason:
          "This administrator account is not active."

      };

    }


    return {

      allowed:true,

      data:admin

    };

  }

  catch(error){

    console.error(
      "Admin verification error:",
      error
    );


    return {

      allowed:false,

      reason:
        "Unable to verify administrator permissions. Check Firestore rules."

    };

  }

}


/* =========================================
   HANDLE LOGIN SUCCESS
   NO AUTOMATIC REDIRECT
========================================= */

async function handleSuccessfulLogin(user){

  const result =
    await checkAdmin(
      user
    );


  /*
   * NOT ADMIN
   */

  if(!result.allowed){

    try{

      await signOut(
        auth
      );

    }

    catch(error){

      console.error(
        "Sign out error:",
        error
      );

    }


    showMessage(
      result.reason,
      "error"
    );


    return false;

  }


  /*
   * ADMIN VERIFIED
   */

  const adminName =
    result.data?.name ||
    user.displayName ||
    "Administrator";


  showMessage(

    `Welcome ${adminName}. Login successful. Click "Open Admin Dashboard" to continue.`,

    "success"

  );


  /*
   * Manual dashboard button
   */

  createDashboardButton();


  return true;

}


/* =========================================
   TABS
========================================= */

tabs.forEach(
  tab => {

    tab.addEventListener(
      "click",
      () => {

        tabs.forEach(
          item => {

            item.classList.remove(
              "active"
            );

          }
        );


        panels.forEach(
          panel => {

            panel.classList.remove(
              "active"
            );

          }
        );


        tab.classList.add(
          "active"
        );


        const selectedPanel =
          document.getElementById(
            tab.dataset.tab
          );


        if(selectedPanel){

          selectedPanel.classList.add(
            "active"
          );

        }


        clearMessage();

      }
    );

  }
);


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

document
  .getElementById(
    "togglePassword"
  )
  .addEventListener(
    "click",
    () => {

      const input =
        document.getElementById(
          "password"
        );


      const button =
        document.getElementById(
          "togglePassword"
        );


      if(
        input.type ===
        "password"
      ){

        input.type =
          "text";


        button.textContent =
          "Hide";

      }

      else{

        input.type =
          "password";


        button.textContent =
          "Show";

      }

    }
  );


/* =========================================
   EMAIL LOGIN
========================================= */

document
  .getElementById(
    "emailForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      clearMessage();


      const email =
  document
    .getElementById(
      "email"
    )
    .value
    .trim()
    .toLowerCase();

const password =
  document
    .getElementById(
      "password"
    )
    .value;

const status = document.getElementById("status");
const loginButton = document.getElementById("loginButton");

if (!email || !password) {
  status.textContent = "Please enter your email and password.";
  status.className = "error";
  return;
}

if (loginButton) {
  loginButton.disabled = true;
  loginButton.textContent = "Signing in...";
}

status.textContent = "Authenticating administrator...";
status.className = "info";

try {
  const credential =
    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  const user = credential.user;

  /*
   * Verify administrator account
   * using admins/{uid}
   */
  const adminRef =
    doc(
      db,
      "admins",
      user.uid
    );

  const adminSnap =
    await getDoc(adminRef);

  if (!adminSnap.exists()) {
    await signOut(auth);

    status.textContent =
      "Access denied. This account is not registered as an administrator.";

    status.className = "error";

    if (loginButton) {
      loginButton.disabled = false;
      loginButton.textContent = "Sign In";
    }

    return;
  }

  const adminData =
    adminSnap.data();

  if (
    adminData.role !== "admin"
  ) {
    await signOut(auth);

    status.textContent =
      "Access denied. Your account does not have administrator privileges.";

    status.className = "error";

    if (loginButton) {
      loginButton.disabled = false;
      loginButton.textContent = "Sign In";
    }

    return;
  }

  if (
    adminData.status &&
    adminData.status !== "active"
  ) {
    await signOut(auth);

    status.textContent =
      "Your administrator account is currently inactive.";

    status.className = "error";

    if (loginButton) {
      loginButton.disabled = false;
      loginButton.textContent = "Sign In";
    }

    return;
  }

  /*
   * Successful admin login
   * NO automatic redirect.
   */
  status.textContent =
    `Welcome, ${adminData.name || user.displayName || "Administrator"}! Login successful.`;

  status.className = "success";

  if (loginButton) {
    loginButton.disabled = false;
    loginButton.textContent = "Sign In";
  }

  /*
   * Create manual dashboard button
   */
  let dashboardButton =
    document.getElementById(
      "dashboardButton"
    );

  if (!dashboardButton) {
    dashboardButton =
      document.createElement("button");

    dashboardButton.id =
      "dashboardButton";

    dashboardButton.type =
      "button";

    dashboardButton.textContent =
      "Open Admin Dashboard";

    dashboardButton.style.marginTop =
      "15px";

    dashboardButton.style.width =
      "100%";

    dashboardButton.style.padding =
      "13px";

    dashboardButton.style.border =
      "none";

    dashboardButton.style.borderRadius =
      "10px";

    dashboardButton.style.cursor =
      "pointer";

    dashboardButton.style.fontWeight =
      "700";

    dashboardButton.addEventListener(
      "click",
      () => {
        window.location.href =
          "admin-dashboard.html";
      }
    );

    status.parentElement.appendChild(
      dashboardButton
    );
  }

  dashboardButton.style.display =
    "block";

} catch (error) {

  console.error(
    "Admin login error:",
    error
  );

  let message =
    "Unable to sign in. Please try again.";

  switch (error.code) {

    case "auth/invalid-credential":
      message =
        "Invalid email or password.";
      break;

    case "auth/invalid-email":
      message =
        "Please enter a valid email address.";
      break;

    case "auth/user-disabled":
      message =
        "This account has been disabled.";
      break;

    case "auth/too-many-requests":
      message =
        "Too many attempts. Please wait and try again later.";
      break;

    case "auth/network-request-failed":
      message =
        "Network error. Check your internet connection.";
      break;

    case "auth/operation-not-allowed":
      message =
        "Email/password authentication is not enabled in Firebase.";
      break;

    case "permission-denied":
      message =
        "Permission denied while checking administrator access.";
      break;

    case "failed-precondition":
      message =
        "Firebase configuration requires attention.";
      break;
  }

  status.textContent =
    message;

  status.className =
    "error";

  if (loginButton) {
    loginButton.disabled = false;
    loginButton.textContent =
      "Sign In";
  }

  const dashboardButton =
    document.getElementById(
      "dashboardButton"
    );

  if (dashboardButton) {
  dashboardButton.style.display = "none";
}

} // end catch


/*
 * ==========================================
 * EXISTING ADMIN SESSION CHECK
 * ==========================================
 */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    return;
  }

  try {

    const adminRef = doc(
      db,
      "admins",
      user.uid
    );

    const adminSnap = await getDoc(
      adminRef
    );

    if (!adminSnap.exists()) {
      await signOut(auth);

      status.textContent =
        "This account does not have administrator access.";

      status.className = "error";

      return;
    }

    const adminData =
      adminSnap.data();

    if (
      adminData.role !== "admin" ||
      (
        adminData.status &&
        adminData.status !== "active"
      )
    ) {
      await signOut(auth);

      status.textContent =
        "Administrator access is not active.";

      status.className = "error";

      return;
    }

    status.textContent =
      `You are already signed in as ${
        adminData.name ||
        user.displayName ||
        "Administrator"
      }.`;

    status.className =
      "success";

    let dashboardButton =
      document.getElementById(
        "dashboardButton"
      );

    if (!dashboardButton) {

      dashboardButton =
        document.createElement("button");

      dashboardButton.id =
        "dashboardButton";

      dashboardButton.type =
        "button";

      dashboardButton.textContent =
        "Open Admin Dashboard";

      dashboardButton.style.display =
        "block";

      dashboardButton.style.width =
        "100%";

      dashboardButton.style.marginTop =
        "15px";

      dashboardButton.style.padding =
        "13px";

      dashboardButton.style.border =
        "none";

      dashboardButton.style.borderRadius =
        "10px";

      dashboardButton.style.cursor =
        "pointer";

      dashboardButton.style.fontWeight =
        "700";

      dashboardButton.addEventListener(
        "click",
        () => {
          window.location.href =
            "admin-dashboard.html";
        }
      );

      status.parentElement.appendChild(
        dashboardButton
      );

    } else {

      dashboardButton.style.display =
        "block";
    }

  } catch (error) {

    console.error(
      "Session check error:",
      error
    );

    status.textContent =
      "Unable to verify administrator session.";

    status.className =
      "error";
  }
});


/*
 * ==========================================
 * CREATE ADMIN ACCOUNT
 * ==========================================
 */

const createAccountButton =
  document.getElementById(
    "createAccount"
  );

if (createAccountButton) {

  createAccountButton.addEventListener(
    "click",
    () => {

      window.location.href =
        "register-admin.html";

    }
  );

}


/*
 * ==========================================
 * FORGOT PASSWORD
 * ==========================================
 */

const forgotPassword =
  document.getElementById(
    "forgotPassword"
  );

if (forgotPassword) {

  forgotPassword.addEventListener(
    "click",
    async (event) => {

      event.preventDefault();

      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();

      if (!email) {

        status.textContent =
          "Enter your administrator email first.";

        status.className =
          "error";

        return;
      }

      try {

        await sendPasswordResetEmail(
          auth,
          email
        );

        status.textContent =
          "Password reset email sent. Check your inbox.";

        status.className =
          "success";

      } catch (error) {

        console.error(
          "Password reset error:",
          error
        );

        status.textContent =
          "Unable to send password reset email.";

        status.className =
          "error";
      }

    }
  );

}


/*
 * ==========================================
 * SHOW / HIDE PASSWORD
 * ==========================================
 */

const togglePassword =
  document.getElementById(
    "togglePassword"
  );

if (togglePassword) {

  togglePassword.addEventListener(
    "click",
    () => {

      const password =
        document.getElementById(
          "password"
        );

      if (!password) return;

      if (
        password.type ===
        "password"
      ) {

        password.type =
          "text";

        togglePassword.textContent =
          "🙈";

      } else {

        password.type =
          "password";

        togglePassword.textContent =
          "👁️";
      }

    }
  );

}


/*
 * ==========================================
 * GOOGLE ADMIN LOGIN
 * ==========================================
 */

const googleButton =
  document.getElementById(
    "googleLogin"
  );

if (googleButton) {

  googleButton.addEventListener(
    "click",
    async () => {

      try {

        status.textContent =
          "Signing in with Google...";

        status.className =
          "info";

        const provider =
          new GoogleAuthProvider();

        const result =
          await signInWithPopup(
            auth,
            provider
          );

        const user =
          result.user;

        const adminRef =
          doc(
            db,
            "admins",
            user.uid
          );

        const adminSnap =
          await getDoc(
            adminRef
          );

        if (
          !adminSnap.exists()
        ) {

          await signOut(auth);

          status.textContent =
            "This Google account is not registered as an administrator.";

          status.className =
            "error";

          return;
        }

        const adminData =
          adminSnap.data();

        if (
          adminData.role !==
          "admin"
        ) {

          await signOut(auth);

          status.textContent =
            "Access denied. Administrator privileges are required.";

          status.className =
            "error";

          return;
        }

        if (
          adminData.status &&
          adminData.status !== "active"
        ) {

          await signOut(auth);

          status.textContent =
            "This administrator account is inactive.";

          status.className =
            "error";

          return;
        }

        status.textContent =
          "Google administrator login successful.";

        status.className =
          "success";

        showDashboardButton();

      } catch (error) {

        console.error(
          "Google login error:",
          error
        );

        status.textContent =
          "Google administrator login failed.";

        status.className =
          "error";
      }

    }
  );

}


/*
 * ==========================================
 * DASHBOARD BUTTON HELPER
 * ==========================================
 */

function showDashboardButton() {

  let button =
    document.getElementById(
      "dashboardButton"
    );

  if (button) {

    button.style.display =
      "block";

    return;
  }

  button =
    document.createElement(
      "button"
    );

  button.id =
    "dashboardButton";

  button.type =
    "button";

  button.textContent =
    "Open Admin Dashboard";

  button.style.display =
    "block";

  button.style.width =
    "100%";

  button.style.marginTop =
    "15px";

  button.style.padding =
    "13px";

  button.style.border =
    "none";

  button.style.borderRadius =
    "10px";

  button.style.cursor =
    "pointer";

  button.style.fontWeight =
    "700";

  button.addEventListener(
    "click",
    () => {

      window.location.href =
        "admin-dashboard.html";

    }
  );

  status.parentElement.appendChild(
    button
  );
}


/*
 * ==========================================
 * PREVENT ACCIDENTAL FORM RELOAD
 * ==========================================
 */

const form =
  document.getElementById(
    "loginForm"
  );

if (form) {

  form.addEventListener(
    "submit",
    (event) => {
      event.preventDefault();
    }
  );

}

</script>
