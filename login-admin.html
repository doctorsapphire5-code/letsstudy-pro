<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | LetsStudy Pro</title>

<meta
  name="description"
  content="Secure administrator login for LetsStudy Pro."
>

<meta name="robots" content="noindex,nofollow">

<link
  rel="icon"
  href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgQHmJO8e8twONhRhp3I6pP4NFDh-LPcqVtAmQ9R9XjOGaVMKShfSLmxeK0fVzJsybBBOXKb"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle at top left,
      #2563eb 0,
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #020617,
      #0f172a,
      #1e3a8a
    );

  color:#111827;
}

.container{
  width:100%;
  max-width:440px;
}

.card{
  background:rgba(255,255,255,.97);
  border-radius:24px;
  padding:35px 30px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.35);

  border:1px solid rgba(255,255,255,.4);
}

.logo{
  width:76px;
  height:76px;

  margin:0 auto 20px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #4f46e5
    );

  color:white;

  font-size:36px;
  font-weight:900;

  box-shadow:
    0 12px 30px rgba(37,99,235,.35);
}

h1{
  text-align:center;

  font-size:27px;
  font-weight:800;

  color:#111827;

  margin-bottom:8px;
}

.subtitle{
  text-align:center;

  color:#6b7280;

  font-size:14px;
  line-height:1.6;

  margin-bottom:28px;
}

.field{
  margin-bottom:18px;
}

label{
  display:block;

  margin-bottom:8px;

  font-size:14px;

  font-weight:700;

  color:#374151;
}

.input-wrap{
  position:relative;
}

input{
  width:100%;

  padding:14px 15px;

  border:1px solid #d1d5db;

  border-radius:12px;

  background:#fff;

  color:#111827;

  font-size:15px;

  outline:none;

  transition:.2s;
}

input:focus{
  border-color:#2563eb;

  box-shadow:
    0 0 0 4px
    rgba(37,99,235,.12);
}

.password-toggle{
  position:absolute;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  border:0;

  background:none;

  color:#6b7280;

  cursor:pointer;

  font-size:13px;

  padding:5px;
}

button.login{
  width:100%;

  margin-top:5px;

  padding:15px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #4f46e5
    );

  color:#fff;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

  transition:.2s;
}

button.login:hover{
  transform:translateY(-1px);

  box-shadow:
    0 10px 25px
    rgba(37,99,235,.3);
}

button.login:disabled{
  opacity:.65;

  cursor:not-allowed;

  transform:none;
}

.message{
  display:none;

  margin-top:18px;

  padding:13px 14px;

  border-radius:11px;

  font-size:13px;

  line-height:1.5;
}

.error{
  background:#fee2e2;

  color:#991b1b;

  border:1px solid #fecaca;
}

.success{
  background:#dcfce7;

  color:#166534;

  border:1px solid #bbf7d0;
}

.info{
  background:#dbeafe;

  color:#1e40af;

  border:1px solid #bfdbfe;
}

.links{
  display:flex;

  justify-content:space-between;

  gap:15px;

  margin-top:20px;
}

.links a{
  color:#2563eb;

  text-decoration:none;

  font-size:13px;

  font-weight:600;
}

.links a:hover{
  text-decoration:underline;
}

.security{
  text-align:center;

  margin-top:26px;

  padding-top:20px;

  border-top:1px solid #e5e7eb;

  color:#6b7280;

  font-size:12px;

  line-height:1.6;
}

.status{
  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  margin-top:10px;

  font-size:11px;

  color:#16a34a;
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#22c55e;
}

.footer{
  text-align:center;

  color:rgba(255,255,255,.7);

  font-size:11px;

  margin-top:18px;
}

@media(max-width:480px){

  body{
    padding:14px;
  }

  .card{
    padding:30px 22px;
  }

  h1{
    font-size:24px;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      L
    </div>

    <h1>
      Admin Login
    </h1>

    <p class="subtitle">
      Secure administrator access to
      <strong>LetsStudy Pro</strong>.
    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm">

      <div class="field">

        <label for="email">
          Administrator Email
        </label>

        <div class="input-wrap">

          <input
            id="email"
            type="email"
            placeholder="support@letsstudy.pro"
            autocomplete="username"
            required
          >

        </div>

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="input-wrap">

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="password-toggle"
            id="togglePassword"
          >
            Show
          </button>

        </div>

      </div>


      <button
        class="login"
        id="loginBtn"
        type="submit"
      >
        Sign In
      </button>

    </form>


    <!-- ERROR -->

    <div
      id="errorBox"
      class="message error"
    ></div>


    <!-- SUCCESS -->

    <div
      id="successBox"
      class="message success"
    ></div>


    <!-- INFO -->

    <div
      id="infoBox"
      class="message info"
    ></div>


    <div class="links">

      <a href="forgot-password-admin.html">
        Forgot password?
      </a>

      <a href="index-auth.html">
        Back to main
      </a>

    </div>


    <div class="security">

      🔒 Protected by Firebase Authentication

      <div class="status">

        <span class="status-dot"></span>

        Secure connection

      </div>

    </div>

  </div>


  <div class="footer">

    © 2026 LetsStudy Pro · Administrator Portal

  </div>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const togglePassword =
  document.getElementById("togglePassword");

const errorBox =
  document.getElementById("errorBox");

const successBox =
  document.getElementById("successBox");

const infoBox =
  document.getElementById("infoBox");


/* =========================================
   MESSAGE FUNCTIONS
========================================= */

function hideMessages(){

  errorBox.style.display = "none";

  successBox.style.display = "none";

  infoBox.style.display = "none";

}


function showError(message){

  hideMessages();

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";
}


function showSuccess(message){

  hideMessages();

  successBox.textContent =
    message;

  successBox.style.display =
    "block";
}


function showInfo(message){

  hideMessages();

  infoBox.textContent =
    message;

  infoBox.style.display =
    "block";
}


/* =========================================
   LOADING STATE
========================================= */

function setLoading(loading){

  loginBtn.disabled =
    loading;

  loginBtn.textContent =
    loading
      ? "Verifying..."
      : "Sign In";

}


/* =========================================
   PASSWORD VISIBILITY
========================================= */

togglePassword.addEventListener(
  "click",
  () => {

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      togglePassword.textContent =
        "Hide";

    }else{

      passwordInput.type =
        "password";

      togglePassword.textContent =
        "Show";

    }

  }
);


/* =========================================
   VERIFY ADMIN
========================================= */

async function verifyAdmin(user){

  if(!user){

    return {
      allowed:false,
      reason:"No authenticated user."
    };

  }


  try{

    const adminRef =
      doc(
        db,
        "admins",
        user.uid
      );


    const adminSnap =
      await getDoc(adminRef);


    /*
      ADMIN DOCUMENT DOES NOT EXIST
    */

    if(
      !adminSnap.exists()
    ){

      return {
        allowed:false,
        reason:
          "This account does not have an administrator record."
      };

    }


    const adminData =
      adminSnap.data();


    const role =
      String(
        adminData.role || ""
      ).trim().toLowerCase();


    const active =
      adminData.active === true;


    /*
      ALLOWED ADMIN ROLES
    */

    const validRole =
      role === "admin" ||
      role === "superadmin" ||
      role === "administrator";


    if(!validRole){

      return {
        allowed:false,
        reason:
          "Your account does not have administrator privileges."
      };

    }


    if(!active){

      return {
        allowed:false,
        reason:
          "Your administrator account is inactive."
      };

    }


    return {
      allowed:true,
      data:adminData
    };


  }catch(error){

    console.error(
      "Admin verification error:",
      error
    );


    if(
      error.code ===
      "permission-denied"
    ){

      return {
        allowed:false,
        permissionError:true,
        reason:
          "Permission denied while checking your administrator record."
      };

    }


    return {
      allowed:false,
      reason:
        error.message ||
        "Unable to verify administrator account."
    };

  }

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    hideMessages();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if(!email){

      showError(
        "Please enter your administrator email."
      );

      return;
    }


    if(!password){

      showError(
        "Please enter your password."
      );

      return;
    }


    setLoading(true);


    try{

      /*
        FIREBASE AUTHENTICATION
      */

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        credential.user;


      /*
        VERIFY FIRESTORE ADMIN RECORD
      */

      const result =
        await verifyAdmin(user);


      if(!result.allowed){

        await signOut(auth);


        if(
          result.permissionError
        ){

          showError(
            "Permission denied while checking your administrator record. Make sure Firestore Rules allow the signed-in UID to read admins/{uid}."
          );

        }else{

          showError(
            result.reason
          );

        }


        setLoading(false);

        return;

      }


      /*
        ADMIN VERIFIED
      */

      sessionStorage.setItem(
        "adminVerified",
        "true"
      );

      sessionStorage.setItem(
        "adminUid",
        user.uid
      );

      sessionStorage.setItem(
        "adminEmail",
        user.email || ""
      );


      showSuccess(
        "Administrator verified successfully. Redirecting..."
      );


      /*
        REDIRECT
      */

      setTimeout(
        () => {

          window.location.href =
            "admin-dashboard.html";

        },
        700
      );


    }catch(error){

      console.error(
        "Login error:",
        error
      );


      let message =
        "Unable to sign in.";


      switch(error.code){

        case "auth/invalid-credential":

          message =
            "Invalid email or password.";

          break;


        case "auth/user-not-found":

          message =
            "No Firebase account was found with this email.";

          break;


        case "auth/wrong-password":

          message =
            "Incorrect password.";

          break;


        case "auth/invalid-email":

          message =
            "Please enter a valid email address.";

          break;


        case "auth/too-many-requests":

          message =
            "Too many login attempts. Please wait and try again.";

          break;


        case "auth/user-disabled":

          message =
            "This Firebase account has been disabled.";

          break;


        case "auth/network-request-failed":

          message =
            "Network error. Check your internet connection.";

          break;


        case "auth/operation-not-allowed":

          message =
            "Email/password authentication is not enabled in Firebase Authentication.";

          break;


        default:

          message =
            error.message ||
            "An unexpected error occurred.";

      }


      showError(message);

      setLoading(false);

    }

  }
);


/* =========================================
   EXISTING SESSION CHECK
========================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      return;

    }


    /*
      Do not automatically redirect
      while the login form is being submitted.
    */

    if(
      sessionStorage.getItem(
        "adminVerified"
      ) === "true"
    ){

      return;

    }


    try{

      const result =
        await verifyAdmin(user);


      if(result.allowed){

        sessionStorage.setItem(
          "adminVerified",
          "true"
        );

        sessionStorage.setItem(
          "adminUid",
          user.uid
        );

        sessionStorage.setItem(
          "adminEmail",
          user.email || ""
        );


        showInfo(
          "Active administrator session found. Redirecting..."
        );


        setTimeout(
          () => {

            window.location.href =
              "admin-dashboard.html";

          },
          700
        );

      }

    }catch(error){

      console.error(
        "Session verification error:",
        error
      );

    }

  }
);

</script>

</body>
</html>
