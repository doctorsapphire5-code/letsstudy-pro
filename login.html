<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login | LetsStudy Pro</title>

<meta name="description"
      content="Login to your LetsStudy Pro account and continue learning.">

<meta name="robots"
      content="index,follow">

<meta name="theme-color"
      content="#2563eb">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #f8fafc
    );

  color:#0f172a;

  display:flex;

  flex-direction:column;

}


/* =========================
   NAVBAR
========================= */

.navbar{

  height:68px;

  background:#fff;

  border-bottom:
    1px solid #e2e8f0;

}

.nav-container{

  max-width:1100px;

  height:100%;

  margin:auto;

  padding:
    0 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.logo{

  display:flex;

  align-items:center;

  gap:9px;

  color:#2563eb;

  text-decoration:none;

  font-weight:800;

  font-size:19px;

}

.logo-icon{

  width:38px;

  height:38px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#2563eb;

  color:#fff;

  border-radius:10px;

  font-size:13px;

  font-weight:900;

}

.home-link{

  color:#475569;

  text-decoration:none;

  font-size:13px;

  font-weight:600;

}

.home-link:hover{

  color:#2563eb;

}


/* =========================
   LOGIN AREA
========================= */

.main{

  flex:1;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:
    40px 20px;

}

.login-card{

  width:100%;

  max-width:430px;

  background:#fff;

  border:
    1px solid #e2e8f0;

  border-radius:18px;

  padding:30px;

  box-shadow:
    0 15px 45px
    rgba(15,23,42,.08);

}

.login-icon{

  width:58px;

  height:58px;

  margin:
    0 auto 18px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#dbeafe;

  color:#2563eb;

  border-radius:15px;

  font-size:27px;

}

h1{

  text-align:center;

  font-size:27px;

  margin-bottom:7px;

}

.subtitle{

  text-align:center;

  color:#64748b;

  font-size:13px;

  margin-bottom:25px;

}


/* =========================
   MESSAGE
========================= */

.message{

  display:none;

  padding:12px;

  border-radius:9px;

  margin-bottom:17px;

  font-size:13px;

  line-height:1.5;

}

.message.error{

  display:block;

  background:#fee2e2;

  color:#991b1b;

}

.message.success{

  display:block;

  background:#dcfce7;

  color:#166534;

}


/* =========================
   FORM
========================= */

.form-group{

  margin-bottom:17px;

}

label{

  display:block;

  font-size:12px;

  font-weight:700;

  color:#334155;

  margin-bottom:7px;

}

.input-wrap{

  position:relative;

}

input{

  width:100%;

  padding:
    12px 43px 12px 13px;

  border:
    1px solid #cbd5e1;

  border-radius:9px;

  outline:none;

  background:#fff;

  color:#0f172a;

}

input:focus{

  border-color:#2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.1);

}

.password-toggle{

  position:absolute;

  right:10px;

  top:50%;

  transform:
    translateY(-50%);

  border:0;

  background:none;

  color:#64748b;

  cursor:pointer;

  font-size:17px;

}


/* =========================
   OPTIONS
========================= */

.options{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:20px;

}

.remember{

  display:flex;

  align-items:center;

  gap:7px;

  color:#64748b;

  font-size:12px;

}

.remember input{

  width:auto;

  padding:0;

}

.forgot{

  color:#2563eb;

  text-decoration:none;

  font-size:12px;

  font-weight:700;

}

.forgot:hover{

  text-decoration:underline;

}


/* =========================
   BUTTON
========================= */

.login-btn{

  width:100%;

  border:0;

  border-radius:9px;

  padding:13px;

  background:#2563eb;

  color:#fff;

  font-size:14px;

  font-weight:800;

  cursor:pointer;

}

.login-btn:hover{

  background:#1d4ed8;

}

.login-btn:disabled{

  opacity:.7;

  cursor:not-allowed;

}


/* =========================
   DIVIDER
========================= */

.divider{

  display:flex;

  align-items:center;

  gap:10px;

  margin:
    22px 0;

  color:#94a3b8;

  font-size:11px;

}

.divider::before,
.divider::after{

  content:"";

  flex:1;

  height:1px;

  background:#e2e8f0;

}


/* =========================
   REGISTER
========================= */

.register{

  text-align:center;

  color:#64748b;

  font-size:13px;

}

.register a{

  color:#2563eb;

  font-weight:800;

  text-decoration:none;

}

.register a:hover{

  text-decoration:underline;

}


/* =========================
   FOOTER
========================= */

footer{

  text-align:center;

  padding:
    18px;

  color:#94a3b8;

  font-size:11px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .login-card{

    padding:23px;

  }

  h1{

    font-size:24px;

  }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

<div class="nav-container">

<a
  href="/"
  class="logo">

  <div class="logo-icon">
    LS
  </div>

  LetsStudy Pro

</a>


<a
  href="/"
  class="home-link">

  ← Home

</a>

</div>

</header>



<!-- =========================
     LOGIN
========================= -->

<main class="main">

<div class="login-card">


<div class="login-icon">
  🔐
</div>


<h1>
  Welcome Back
</h1>


<p class="subtitle">
  Login to your LetsStudy Pro account
</p>


<div
  id="message"
  class="message">
</div>



<form id="loginForm">


<!-- EMAIL -->

<div class="form-group">

<label for="email">
  Email Address
</label>

<input
  type="email"
  id="email"
  placeholder="you@example.com"
  autocomplete="email"
  required>

</div>



<!-- PASSWORD -->

<div class="form-group">

<label for="password">
  Password
</label>


<div class="input-wrap">

<input
  type="password"
  id="password"
  placeholder="Enter your password"
  autocomplete="current-password"
  required>


<button
  type="button"
  class="password-toggle"
  id="togglePassword"
  aria-label="Show password">

  👁

</button>

</div>

</div>



<!-- OPTIONS -->

<div class="options">


<label class="remember">

<input
  type="checkbox"
  id="remember">

<span>
  Remember me
</span>

</label>


<a
  href="/forgot-password.html"
  class="forgot">

  Forgot password?

</a>

</div>



<!-- LOGIN BUTTON -->

<button
  type="submit"
  class="login-btn"
  id="loginBtn">

  Login

</button>


</form>



<div class="divider">
  OR
</div>



<div class="register">

Don't have an account?

<a href="/register.html">
  Create Account
</a>

</div>


</div>

</main>



<footer>

© 2026 LetsStudy Pro.
All rights reserved.

</footer>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};



/* =========================
   INITIALIZE
========================= */

const app =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(app);



/* =========================
   ELEMENTS
========================= */

const loginForm =
  document.getElementById(
    "loginForm"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const remember =
  document.getElementById(
    "remember"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const message =
  document.getElementById(
    "message"
  );

const togglePassword =
  document.getElementById(
    "togglePassword"
  );



/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type="error"
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}



/* =========================
   SHOW / HIDE PASSWORD
========================= */

togglePassword.addEventListener(
  "click",
  () => {

    const isPassword =
      passwordInput.type ===
      "password";


    passwordInput.type =
      isPassword
        ? "text"
        : "password";


    togglePassword.textContent =
      isPassword
        ? "🙈"
        : "👁";

  }
);



/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const email =
      emailInput.value
        .trim();

    const password =
      passwordInput.value;


    if(!email || !password){

      showMessage(
        "Please enter your email and password."
      );

      return;

    }


    try{

      loginBtn.disabled =
        true;

      loginBtn.textContent =
        "Logging in...";


      /* =========================
         PERSISTENCE
      ========================= */

      await setPersistence(
        auth,
        remember.checked
          ? browserLocalPersistence
          : browserSessionPersistence
      );


      /* =========================
         SIGN IN
      ========================= */

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      showMessage(
        "Login successful. Redirecting...",
        "success"
      );


      setTimeout(
        () => {

          window.location.href =
            "/profile.html";

        },
        500
      );


    }catch(error){

      console.error(
        "Login error:",
        error
      );


      let errorMessage =
        "Unable to login. Please try again.";


      switch(error.code){

        case "auth/invalid-email":

          errorMessage =
            "Please enter a valid email address.";

          break;


        case "auth/invalid-credential":

          errorMessage =
            "Incorrect email or password.";

          break;


        case "auth/user-not-found":

          errorMessage =
            "No account was found with this email.";

          break;


        case "auth/wrong-password":

          errorMessage =
            "Incorrect email or password.";

          break;


        case "auth/user-disabled":

          errorMessage =
            "This account has been disabled.";

          break;


        case "auth/too-many-requests":

          errorMessage =
            "Too many login attempts. Please try again later.";

          break;


        case "auth/network-request-failed":

          errorMessage =
            "Network error. Check your internet connection.";

          break;

      }


      showMessage(
        errorMessage
      );


    }finally{

      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "Login";

    }

  }
);



/* =========================
   ALREADY LOGGED IN
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      /*
       * User already has an active session.
       * Do not force redirect immediately
       * while submitting the login form.
       */

    }

  }
);

</script>

</body>

</html>
