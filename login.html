

  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | LetsStudy Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fb;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #2563eb;
      font-size: 28px;
    }

    .logo p {
      color: #6b7280;
      margin-top: 6px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #111827;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      outline: none;
      margin-bottom: 17px;
      font-size: 15px;
    }

    input:focus {
      border-color: #2563eb;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 50px;
    }

    .toggle {
      position: absolute;
      right: 12px;
      top: 12px;
      cursor: pointer;
      color: #6b7280;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      text-align: center;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #9ca3af;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>LetsStudy Pro</h1>
      <p>Learn. Grow. Succeed.</p>
    </div>

    <h2>Welcome Back</h2>

    <form id="loginForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <div class="password-box">
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <span class="toggle" id="togglePassword">
          👁
        </span>
      </div>

      <button type="submit" id="loginBtn">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">
      <a href="#" id="forgotPassword">
        Forgot Password?
      </a>
    </div>

    <div class="links">
      <a href="register.html">
        Don't have an account? Register
      </a>
    </div>

    <div class="footer">
      © 2026 LetsStudy Pro
    </div>

  </div>


  <!-- Firebase -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* ============================================
       FIREBASE CONFIG
    ============================================ */

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

    /* ============================================
       ELEMENTS
    ============================================ */

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");

    const password =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");

    const forgotPassword =
      document.getElementById("forgotPassword");


    /* ============================================
       MESSAGE
    ============================================ */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";
    }


    /* ============================================
       SHOW / HIDE PASSWORD
    ============================================ */

    togglePassword.addEventListener(
      "click",
      () => {

        if (password.type === "password") {

          password.type = "text";

          togglePassword.textContent = "🙈";

        } else {

          password.type = "password";

          togglePassword.textContent = "👁";

        }

      }
    );


    /* ============================================
       LOGIN
    ============================================ */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          document.getElementById("email")
          .value
          .trim();

        const pass =
          password.value;


        loginBtn.disabled = true;

        loginBtn.textContent =
          "Logging in...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            pass
          );


          showMessage(
            "Login successful. Redirecting...",
            "success"
          );


          setTimeout(() => {

            window.location.href =
              "dashboard.html";

          }, 800);


        } catch (error) {

          console.error(error);

          let errorMessage =
            "Login failed. Please try again.";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            errorMessage =
              "Incorrect email or password.";

          }

          else if (
            error.code ===
            "auth/user-not-found"
          ) {

            errorMessage =
              "No account found with this email.";

          }

          else if (
            error.code ===
            "auth/wrong-password"
          ) {

            errorMessage =
              "Incorrect password.";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            errorMessage =
              "Please enter a valid email.";

          }

          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            errorMessage =
              "Too many attempts. Try again later.";

          }


          showMessage(
            errorMessage,
            "error"
          );


          loginBtn.disabled = false;

          loginBtn.textContent =
            "Login";

        }

      }
    );


    /* ============================================
       FORGOT PASSWORD
    ============================================ */

    forgotPassword.addEventListener(
      "click",
      async (event) => {

        event.preventDefault();


        const email =
          document.getElementById("email")
          .value
          .trim();


        if (!email) {

          showMessage(
            "Enter your email first.",
            "error"
          );

          return;
        }


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );


          showMessage(
            "Password reset email sent. Check your inbox.",
            "success"
          );


        } catch (error) {

          console.error(error);

          showMessage(
            "Unable to send password reset email.",
            "error"
          );

        }

      }
    );

  </script>

</body>
</html>
