<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Login | LetsStudy Pro</title>

<meta name="description"
content="Login to LetsStudy Pro and access courses, resources, community, AI and your learning dashboard.">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:450px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:32px 28px;
  box-shadow:0 12px 40px rgba(0,0,0,.08);
}

.logo{
  width:64px;
  height:64px;
  margin:0 auto 18px;
  border-radius:16px;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:800;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:28px;
}

.subtitle{
  text-align:center;
  color:#667085;
  font-size:14px;
  line-height:1.6;
  margin:0 0 25px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}

.field{
  margin-bottom:17px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:52px;
}

.show-password{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:48px;
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  font-size:13px;
}

.remember{
  display:flex;
  align-items:center;
  gap:7px;
}

.remember input{
  width:auto;
  margin:0;
}

a{
  color:#2563eb;
  text-decoration:none;
  font-weight:600;
}

a:hover{
  text-decoration:underline;
}

.login-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  background:#2563eb;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.login-btn:hover{
  background:#1d4ed8;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.alert{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:18px;
  font-size:14px;
  line-height:1.5;
}

.alert.error{
  display:block;
  color:#b42318;
  background:#fef3f2;
  border:1px solid #fecdca;
}

.alert.success{
  display:block;
  color:#067647;
  background:#ecfdf3;
  border:1px solid #abefc6;
}

.alert.info{
  display:block;
  color:#175cd3;
  background:#eff8ff;
  border:1px solid #b2ddff;
}

.register{
  text-align:center;
  margin-top:22px;
  color:#667085;
  font-size:14px;
}

.home{
  text-align:center;
  margin-top:18px;
  font-size:13px;
}

.spinner{
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.45);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
  margin-right:7px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#98a2b3;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      LS
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to your LetsStudy Pro account
      and continue your learning journey.
    </p>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm">

      <div class="field">

        <label for="email">
          Email Address
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="password-wrap">

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            minlength="6"
            required
          >

          <button
            id="showPassword"
            class="show-password"
            type="button"
            aria-label="Show password">
            👁
          </button>

        </div>

      </div>


      <div class="row">

        <label class="remember">
          <input
            id="remember"
            type="checkbox"
          >
          Remember me
        </label>

        <a href="reset-password.html">
          Forgot password?
        </a>

      </div>


      <button
        id="loginBtn"
        class="login-btn"
        type="submit">

        Login

      </button>

    </form>


    <div class="register">
      Don't have an account?
      <a href="register.html">
        Create account
      </a>
    </div>


    <div class="home">
      <a href="index.html">
        ← Back to LetsStudy Pro
      </a>
    </div>

  </div>


  <div class="footer">
    © 2026 LetsStudy Pro. All rights reserved.
  </div>

</div>


<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  reload
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"
};


/* =========================
   INITIALIZE
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "loginForm"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const rememberInput =
  document.getElementById(
    "remember"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const alertBox =
  document.getElementById(
    "alertBox"
  );

const showPassword =
  document.getElementById(
    "showPassword"
  );


/* =========================
   ALERT
========================= */

function showAlert(
  message,
  type = "error"
){

  alertBox.textContent =
    message;

  alertBox.className =
    "alert " + type;
}


/* =========================
   GET REDIRECT
========================= */

function getRedirect(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const redirect =
    params.get("redirect");

  /*
   * Only allow local relative
   * HTML destinations.
   *
   * This prevents external
   * redirect abuse.
   */

  if(
    redirect &&
    !redirect.startsWith("http") &&
    !redirect.startsWith("//") &&
    redirect.endsWith(".html")
  ){

    return redirect;
  }

  return "dashboard.html";
}


/* =========================
   GET USER PROFILE
========================= */

async function getUserProfile(
  user
){

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );

  const snapshot =
    await getDoc(userRef);

  return {
    ref:userRef,
    exists:snapshot.exists(),
    data:snapshot.exists()
      ? snapshot.data()
      : null
  };
}


/* =========================
   CREATE USER PROFILE
========================= */

async function createBasicProfile(
  user
){

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );

  await setDoc(
    userRef,
    {

      uid:user.uid,

      email:
        user.email || "",

      displayName:
        user.displayName || "",

      photoURL:
        user.photoURL || "",

      role:"student",

      status:"active",

      emailVerified:
        user.emailVerified,

      createdAt:
        serverTimestamp(),

      updatedAt:
        serverTimestamp(),

      lastLoginAt:
        serverTimestamp(),

      points:0,
      level:1,
      xp:0,

      walletBalance:0,

      premium:false,
      premiumPlan:"",
      premiumExpiresAt:null

    }
  );

}


/* =========================
   UPDATE LAST LOGIN
========================= */

async function updateLoginData(
  user
){

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );

  await setDoc(
    userRef,
    {

      emailVerified:
        user.emailVerified,

      lastLoginAt:
        serverTimestamp(),

      updatedAt:
        serverTimestamp()

    },
    {
      merge:true
    }
  );

}


/* =========================
   REDIRECT USER
========================= */

async function redirectUser(
  user
){

  const redirect =
    getRedirect();


  /*
   * Email verification
   */

  if(!user.emailVerified){

    window.location.href =
      "email-verification.html";

    return;
  }


  /*
   * Get Firestore profile
   */

  let profile =
    await getUserProfile(
      user
    );


  /*
   * If profile does not exist,
   * create the basic user profile.
   */

  if(!profile.exists){

    await createBasicProfile(
      user
    );

    profile =
      await getUserProfile(
        user
      );
  }


  const data =
    profile.data || {};

  const role =
    data.role || "student";


  /*
   * Update login timestamp.
   */

  await updateLoginData(
    user
  );


  /*
   * IMPORTANT:
   *
   * Normal users can follow
   * their requested redirect.
   */

  if(
    role === "student" ||
    role === "instructor" ||
    role === "support" ||
    role === "contentAdmin" ||
    role === "courseAdmin" ||
    role === "paymentAdmin" ||
    role === "admin" ||
    role === "superAdmin" ||
    role === "super_admin"
  ){

    window.location.href =
      redirect;

    return;
  }


  /*
   * Unknown role:
   * safely return dashboard.
   */

  window.location.href =
    "dashboard.html";

}


/* =========================
   LOGIN
========================= */

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;


    if(!email){

      showAlert(
        "Please enter your email address."
      );

      return;
    }


    if(!password){

      showAlert(
        "Please enter your password."
      );

      return;
    }


    loginBtn.disabled =
      true;

    loginBtn.innerHTML =
      `<span class="spinner"></span>Signing in...`;


    try{

      /*
       * Remember me:
       *
       * checked
       * → browserLocalPersistence
       *
       * unchecked
       * → browserSessionPersistence
       */

      await setPersistence(
        auth,
        rememberInput.checked
          ? browserLocalPersistence
          : browserSessionPersistence
      );


      /*
       * Firebase Authentication
       */

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        credential.user;


      /*
       * Refresh user data so
       * emailVerified is current.
       */

      await reload(user);


      showAlert(
        "Login successful. Redirecting...",
        "success"
      );


      loginBtn.innerHTML =
        "Success";


      await redirectUser(
        user
      );


    }catch(error){

      console.error(
        "Login error:",
        error
      );


      let message =
        "Unable to login. Please check your email and password.";


      switch(error.code){

        case "auth/invalid-email":

          message =
            "Please enter a valid email address.";

          break;


        case "auth/invalid-credential":

          message =
            "Incorrect email or password.";

          break;


        case "auth/wrong-password":

          message =
            "Incorrect email or password.";

          break;


        case "auth/user-not-found":

          message =
            "Incorrect email or password.";

          break;


        case "auth/user-disabled":

          message =
            "This account has been disabled. Please contact support.";

          break;


        case "auth/too-many-requests":

          message =
            "Too many failed login attempts. Please wait and try again later.";

          break;


        case "auth/network-request-failed":

          message =
            "Network error. Please check your internet connection.";

          break;


        case "auth/operation-not-allowed":

          message =
            "Email/password login is not enabled in Firebase Authentication.";

          break;


        default:

          message =
            error.message ||
            message;

      }


      showAlert(
        message,
        "error"
      );


      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "Login";

    }

  }
);


/* =========================
   SHOW / HIDE PASSWORD
========================= */

showPassword.addEventListener(
  "click",
  () => {

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      showPassword.textContent =
        "🙈";

    }else{

      passwordInput.type =
        "password";

      showPassword.textContent =
        "👁";

    }

  }
);


/* =========================
   AUTO-FILL REDIRECT EMAIL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

if(
  params.get("email")
){

  emailInput.value =
    params.get("email");

}


/* =========================
   PASSWORD RESET MESSAGE
========================= */

if(
  params.get("reset") ===
  "sent"
){

  showAlert(
    "Password reset email sent. Check your inbox and follow the link to create a new password.",
    "success"
  );

}

</script>

</body>
</html>
