<body>

<div class="card">

  <h1>Welcome back</h1>
  <p>Login to your LetsStudy Pro account.</p>

  <input
    id="email"
    type="email"
    placeholder="Email address"
    autocomplete="email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <div class="row">

    <label>
      <input id="remember" type="checkbox" checked>
      Remember me
    </label>

    <button
      type="button"
      class="link"
      id="forgot"
    >
      Forgot password?
    </button>

  </div>

  <button
    type="button"
    class="login"
    id="loginBtn"
  >
    Sign in
  </button>

  <button
    type="button"
    class="google"
    id="googleBtn"
  >
    Continue with Google
  </button>

  <button
    type="button"
    class="link"
    onclick="location.href='register.html'"
  >
    Create an account
  </button>

  <div id="msg"></div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig={
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const email=document.getElementById("email");
const password=document.getElementById("password");
const msg=document.getElementById("msg");
const loginBtn=document.getElementById("loginBtn");


function message(text,type="error"){
  msg.textContent=text;
  msg.className=type;
  msg.style.display="block";
}


/* =========================
   SAVE USER PROFILE
========================= */

async function saveUser(user){

  const userId=user.uid;

  localStorage.setItem("userId",userId);
  localStorage.setItem("userEmail",user.email||"");
  localStorage.setItem(
    "userName",
    user.displayName||"Student"
  );

  const ref=doc(db,"users",userId);
  const snap=await getDoc(ref);

  if(snap.exists()){

    await setDoc(ref,{
      uid:userId,
      userId:userId,
      email:user.email||"",
      displayName:user.displayName||snap.data().displayName||"",
      photoURL:user.photoURL||snap.data().photoURL||"",
      emailVerified:user.emailVerified,
      lastLoginAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    },{merge:true});

  }else{

    await setDoc(ref,{
      uid:userId,
      userId:userId,
      displayName:user.displayName||"Student",
      email:user.email||"",
      phone:user.phoneNumber||"",
      photoURL:user.photoURL||"",
      provider:user.providerData?.[0]?.providerId||"password",
      role:"student",
      accountStatus:"active",
      premium:false,
      premiumPlan:null,
      walletBalance:0,
      points:0,
      level:1,
      emailVerified:user.emailVerified,
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp(),
      lastLoginAt:serverTimestamp()
    });
  }

  return userId;
}


/* =========================
   EMAIL LOGIN
========================= */

loginBtn.onclick=async()=>{

  msg.style.display="none";

  const e=email.value.trim();
  const p=password.value;

  if(!e)
    return message("Please enter your email.");

  if(!p)
    return message("Please enter your password.");

  loginBtn.disabled=true;
  loginBtn.textContent="Signing in...";

  try{

    const remember=
      document.getElementById("remember").checked;

    await setPersistence(
      auth,
      remember
        ? browserLocalPersistence
        : browserSessionPersistence
    );

    const result=
      await signInWithEmailAndPassword(
        auth,e,p
      );

    await saveUser(result.user);

    message(
      "Login successful. Redirecting...",
      "success"
    );

    setTimeout(()=>{
      location.href="dashboard.html";
    },500);

  }catch(error){

    console.error(error);

    const errors={
      "auth/invalid-credential":
        "Invalid email or password.",
      "auth/user-not-found":
        "No account found with this email.",
      "auth/wrong-password":
        "Invalid email or password.",
      "auth/invalid-email":
        "Please enter a valid email.",
      "auth/too-many-requests":
        "Too many attempts. Please try again later.",
      "auth/network-request-failed":
        "Network error. Check your internet connection."
    };

    message(
      errors[error.code]||
      "Login failed. Please try again."
    );

  }finally{

    loginBtn.disabled=false;
    loginBtn.textContent="Sign in";
  }
};


/* =========================
   GOOGLE LOGIN
========================= */

document.getElementById("googleBtn").onclick=
async()=>{

  try{

    const provider=
      new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:"select_account"
    });

    const result=
      await signInWithPopup(
        auth,
        provider
      );

    await saveUser(result.user);

    message(
      "Google login successful. Redirecting...",
      "success"
    );

    setTimeout(()=>{
      location.href="dashboard.html";
    },500);

  }catch(error){

    console.error(error);

    message(
      error.code==="auth/popup-closed-by-user"
      ? "Google login cancelled."
      : "Google login failed."
    );
  }
};


/* =========================
   FORGOT PASSWORD
========================= */

document.getElementById("forgot").onclick=
async()=>{

  const e=email.value.trim();

  if(!e)
    return message(
      "Enter your email first."
    );

  try{

    await sendPasswordResetEmail(
      auth,
      e
    );

    message(
      "Password reset email sent. Check your inbox.",
      "success"
    );

  }catch(error){

    if(error.code==="auth/user-not-found"){
      message(
        "No account found with this email."
      );
    }else{
      message(
        "Unable to send reset email."
      );
    }
  }
};


/* =========================
   IF ALREADY LOGGED IN
========================= */

onAuthStateChanged(
  auth,
  user=>{

    if(user){

      localStorage.setItem(
        "userId",
        user.uid
      );

      console.log(
        "Current User ID:",
        user.uid
      );
    }
  }
);


/* =========================
   GLOBAL USER ID
========================= */

window.getLetsStudyUserId=()=>{
  return auth.currentUser?.uid||
    localStorage.getItem("userId");
};

</script>
