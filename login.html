<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import{
getAuth,
onAuthStateChanged,
signInWithEmailAndPassword,

GoogleAuthProvider,

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import{
getFirestore,
collection,
query,
where,
getDocs,
limit
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* Firebase configuration */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const HOME="dashboard.html";


const $=id=>
document.getElementById(id);


/*
Initialize Firebase
*/

let app;
let auth;
let db;

try{

app=
initializeApp(firebaseConfig);

auth=
getAuth(app);

db=
getFirestore(app);

}catch(error){

console.error(
"Firebase initialization error:",
error
);

$("message").textContent=
"Firebase could not be initialized. Check your Firebase configuration.";

$("message").className=
"message show error";

}


/*
Next page
*/

function nextUrl(){

try{

const params=
new URLSearchParams(
location.search
);

const next=
params.get("next");

if(
next&&
!next.startsWith("http")&&
!next.startsWith("//")&&
!next.includes("javascript:")
){

return next;
}

}catch(_){}

return HOME;

}


function go(){

location.replace(
nextUrl()
);

}


/*
Save basic Auth information.

IMPORTANT:
The ID used by the application
will be read from Firestore below.
*/

function saveUser(user){

if(!user){
return;
}

localStorage.setItem(
"authUid",
user.uid
);

localStorage.setItem(
"userEmail",
user.email||""
);

localStorage.setItem(
"userName",
user.displayName||""
);

console.log(
"Firebase Authentication UID:",
user.uid
);

}


/*
Read existing ID from:

users/{document}

The query searches the
users collection by Firebase UID.

NO NEW ID IS CREATED.
*/

async function readUserIdFromFirebase(user){

if(!user||!db){
return null;
}

try{

/*
First try the normal structure:

users
  document
    userId: Firebase Auth UID
    id: existing application ID
*/

const q=
query(
collection(db,"users"),
where(
"userId",
"==",
user.uid
),
limit(1)
);

const snapshot=
await getDocs(q);


if(!snapshot.empty){

const userDoc=
snapshot.docs[0];

const data=
userDoc.data();


/*
Read the existing "id"
from the collection.
*/

const firebaseId=
data.id||
data.userId||
userDoc.id||
null;


if(firebaseId){

localStorage.setItem(
"userId",
firebaseId
);

window.currentUserId=
firebaseId;

console.log(
"LetsStudy Pro collection id:",
firebaseId
);

return firebaseId;

}

}


/*
Fallback:
some existing users may have
the Firebase Auth UID stored
as "uid" instead of "userId".
*/

const q2=
query(
collection(db,"users"),
where(
"uid",
"==",
user.uid
),
limit(1)
);

const snapshot2=
await getDocs(q2);


if(!snapshot2.empty){

const userDoc=
snapshot2.docs[0];

const data=
userDoc.data();

const firebaseId=
data.id||
data.userId||
userDoc.id||
null;


if(firebaseId){

localStorage.setItem(
"userId",
firebaseId
);

window.currentUserId=
firebaseId;

console.log(
"LetsStudy Pro collection id:",
firebaseId
);

return firebaseId;

}

}


/*
Final fallback:
If the document ID itself
is the Firebase UID, use it.
*/

try{

const directRef=
await getDocs(
query(
collection(db,"users"),
where(
"email",
"==",
user.email
),
limit(1)
)
);


if(!directRef.empty){

const userDoc=
directRef.docs[0];

const data=
userDoc.data();

const firebaseId=
data.id||
userDoc.id||
null;


if(firebaseId){

localStorage.setItem(
"userId",
firebaseId
);

window.currentUserId=
firebaseId;

console.log(
"User ID from Firebase document:",
firebaseId
);

return firebaseId;

}

}

}catch(error){

console.warn(
"Email fallback failed:",
error
);

}


console.warn(
"No existing ID found in users collection for:",
user.uid
);

return null;


}catch(error){

console.error(
"Could not read user ID from Firebase:",
error
);

return null;

}

}


/*
Clear saved user information
*/

function clearSavedUser(){

localStorage.removeItem(
"userId"
);

localStorage.removeItem(
"authUid"
);

localStorage.removeItem(
"userEmail"
);

localStorage.removeItem(
"userName"
);

window.currentUserId=
null;

}


/*
Friendly Firebase errors
*/

function friendly(e){

console.error(
"Firebase error:",
e
);

const code=
e&&e.code
?e.code
:"";


if(
code==="auth/invalid-credential"||
code==="auth/wrong-password"||
code==="auth/user-not-found"||
code==="auth/invalid-login-credentials"
){

return "Incorrect email or password.";

}

if(
code==="auth/invalid-email"
){

return "Please enter a valid email address.";

}

if(
code==="auth/email-already-in-use"
){

return "This email is already registered. Sign in instead.";

}

if(
code==="auth/weak-password"
){

return "Password should be at least 6 characters.";

}

if(
code==="auth/too-many-requests"
){

return "Too many attempts. Please try again later.";

}

if(
code==="auth/network-request-failed"
){

return "Network error. Check your internet connection.";

}

if(
code==="auth/user-disabled"
){

return "This account has been disabled.";

}

if(
code==="auth/operation-not-allowed"
){

return "This sign-in method is not enabled in Firebase Authentication.";

}

if(
code==="auth/unauthorized-domain"
){

return "This domain is not authorized in Firebase Authentication.";

}

if(
code==="auth/invalid-api-key"
){

return "Firebase API key is invalid.";

}

if(
code==="auth/app-not-authorized"
){

return "This application is not authorized for Firebase Authentication.";

}

if(
code==="auth/configuration-not-found"
){

return "Firebase Authentication configuration was not found.";

}

if(
code==="auth/popup-blocked"
){

return "The Google sign-in popup was blocked by your browser.";

}

if(
code==="auth/popup-closed-by-user"||
code==="auth/cancelled-popup-request"
){

return "";

}

return e&&
(e.message||e.code)
?e.message||e.code
:"Something went wrong. Try again in a moment.";

}


/*
Message
*/

function show(kind,text){

const box=
$("message");

box.textContent=
text||"";

box.className=
"message";

if(text){

box.classList.add(
"show",
kind
);

}

}


/*
Loading
*/

function loading(on,label){

const b=
$("submit");

if(on){

b.disabled=
true;

b.innerHTML=
'<span class="spinner"></span>'+
(label||"Please wait...");

}else{

b.disabled=
false;

b.textContent=
mode==="signin"
?"Sign in"
:mode==="signup"
?"Create account"
:"Send reset link";

}

}


/*
Modes
*/

let mode=
"signin";


function setMode(m){

mode=m;

show(
"",
""
);


$("nameField").classList.toggle(
"hidden",
m!=="signup"
);

$("row").classList.toggle(

);

);

);

$("password");

password.required=
m!=="reset";

password.autocomplete=
m==="signup"
?"new-password"

if(m==="signin"){

$("title").textContent=

$("subtitle").textContent=

$("submit").textContent=

$("switchText").textContent=

$("submit").textContent=

input.type=

/*

*/

$("switch").addEventListener(
"click",
()=>{

if(mode==="signin"){

setMode("signup");

}else{

}

});

$("forgot").addEventListener(

/*
Remember me persistence
*/

async function persist(){

const persistence=
$("remember").checked
?browserLocalPersistence
:browserSessionPersistence;

await setPersistence(
auth,
persistence
);

}


/*
Email login
*/

$("form").addEventListener(
"submit",
async e=>{

e.preventDefault();

show(
"",
""
);


const email=
$("email").value.trim();

const password=
$("password").value;

const name=
$("name").value.trim();


if(!email){

show(
"error",
"Please enter your email address."
);

$("email").focus();

return;

}


if(mode==="signup"&&name.length<2){

show(
"error",
"Please enter your name."
);

$("name").focus();

return;

}


if(
mode!=="reset"&&
password.length<6
){

show(
"error",
"Please enter your password."
);

$("password").focus();

return;

}


try{

loading(
true,
mode==="reset"
?"Sending reset link..."
:mode==="signup"
?"Creating account..."
:"Signing in..."
);


if(mode==="reset"){

await sendPasswordResetEmail(
auth,
email
);

show(
"ok",
"Password reset link sent. Check your email."
);

loading(false);

return;

}


await persist();


if(mode==="signup"){

const credential=
await createUserWithEmailAndPassword(
auth,
email,
password
);


if(name){

await updateProfile(
credential.user,
{
displayName:name
}
);

}


saveUser(
credential.user
);


/*
Read existing collection ID.

This does NOT create a new ID.
*/

const firebaseId=
await readUserIdFromFirebase(
credential.user
);


/*
Send verification email.
*/

try{

await sendEmailVerification(
credential.user
);

}catch(error){

console.warn(
"Verification email could not be sent:",
error
);

}


console.log(
"Signup Auth UID:",
credential.user.uid
);

console.log(
"Signup collection ID:",
firebaseId
);


go();

return;

}


/*
Normal sign in
*/

const credential=
await signInWithEmailAndPassword(
auth,
email,
password
);


saveUser(
credential.user
);


/*
IMPORTANT:
Read ID from Firebase
users collection.
*/

const firebaseId=
await readUserIdFromFirebase(
credential.user
);


console.log(
"Login Auth UID:",
credential.user.uid
);

console.log(
"Login Firebase collection ID:",
firebaseId
);


go();


}catch(e){

loading(false);

const message=
friendly(e);

if(message){

show(
"error",
message
);

}

}

});


/*
Google login
*/

$("google").addEventListener(
"click",
async()=>{

show(
"",
""
);

try{

await persist();


const provider=
new GoogleAuthProvider();

provider.setCustomParameters({
prompt:"select_account"
});


const result=
await signInWithPopup(
auth,
provider
);


saveUser(
result.user
);


/*
Read the existing ID from
Firebase users collection.

The ID is NOT generated here.
*/

const firebaseId=
await readUserIdFromFirebase(
result.user
);


console.log(
"Google Authentication UID:",
result.user.uid
);

console.log(
"Google Firebase collection ID:",
firebaseId
);


/*
Continue to the requested page.
*/

go();


}catch(e){

const message=
friendly(e);

if(message){

show(
"error",
message
);

}

}

});


/*
Firebase authentication state
*/

if(auth){

onAuthStateChanged(
auth,
async user=>{

if(user){

console.log(
"Firebase Authentication UID:",
user.uid
);


/*
Save Firebase Auth information.
*/

saveUser(user);


/*
Read existing ID from
Firebase users collection.
*/

const firebaseId=
await readUserIdFromFirebase(
user
);


console.log(
"LetsStudy Pro Firebase collection ID:",
firebaseId
);


/*
If the user is already logged in,
continue to the requested page.
*/

if(
location.pathname.endsWith(
"/login.html"
)||
location.pathname.endsWith(
"login.html"
)
){

go();

}

}else{

clearSavedUser();

}

});


}


/*
Initial login mode
*/

setMode("signin");


/*
Debug information
*/

console.log(
"LetsStudy Pro Firebase login initialized"
);

console.log(
"Firebase project:",
firebaseConfig.projectId
);

console.log(
"Firebase Auth domain:",
firebaseConfig.authDomain
);

console.log(
"Stored Firebase collection userId:",
localStorage.getItem("userId")
);

console.log(
"Stored Authentication UID:",
localStorage.getItem("authUid")
);

</script>
