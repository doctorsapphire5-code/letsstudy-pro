<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Login | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Login to your Let'sStudy Pro account."
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 12px 16px;

      background: #fff;

      border-bottom: 1px solid #e5e7eb;
    }

    .brand {
      display: inline-flex;
      align-items: center;

      gap: 10px;

      text-decoration: none;

      font-weight: 800;
    }

    .logo {
      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: #2563eb;
      color: #fff;

      font-size: 19px;
      font-weight: 800;
    }

    .brand-name {
      font-size: 18px;
    }

    /* MAIN */

    main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .heading {
      margin-bottom: 20px;

      text-align: center;
    }

    .heading h1 {
      margin: 0 0 7px;

      font-size: 28px;
      line-height: 1.2;

      letter-spacing: -.6px;
    }

    .heading p {
      margin: 0;

      color: #667085;

      font-size: 14px;
    }

    /* CARD */

    .card {
      padding: 25px;

      background: #fff;

      border: 1px solid #e2e7ef;

      border-radius: 18px;

      box-shadow:
        0 12px 35px rgba(15, 23, 42, .07);
    }

    /* STATUS */

    .status {
      display: none;

      margin-bottom: 17px;

      padding: 11px 13px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #b91c1c;

      background: #fef2f2;

      border: 1px solid #fecaca;
    }

    .status.success {
      color: #15803d;

      background: #f0fdf4;

      border: 1px solid #bbf7d0;
    }

    /* FORM */

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #344054;

      font-size: 13px;

      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 50px;

      padding: 0 13px;

      border: 1px solid #d8dee8;

      border-radius: 10px;

      background: #fff;

      color: #172033;

      outline: none;
    }

    input::placeholder {
      color: #98a2b3;
    }

    input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, .12);
    }

    /* PASSWORD */

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 80px;
    }

    .toggle-password {
      position: absolute;

      top: 50%;
      right: 7px;

      transform: translateY(-50%);

      min-height: 36px;

      padding: 0 9px;

      border: 0;

      border-radius: 7px;

      background: transparent;

      color: #2563eb;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;
    }

    .toggle-password:focus-visible {
      outline: 2px solid #2563eb;
    }

    /* BUTTON */

    .login-btn {
      width: 100%;
      min-height: 51px;

      margin-top: 3px;

      border: 0;

      border-radius: 10px;

      background: #2563eb;

      color: #fff;

      font-size: 14px;

      font-weight: 750;

      cursor: pointer;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .login-btn:focus-visible {
      outline: 3px solid rgba(37, 99, 235, .25);

      outline-offset: 2px;
    }

    .login-btn:disabled {
      opacity: .65;

      cursor: not-allowed;
    }

    /* LINKS */

    .links {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      margin-top: 18px;
    }

    .links a {
      color: #2563eb;

      font-size: 13px;

      font-weight: 650;

      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .register {
      margin-top: 21px;

      padding-top: 19px;

      border-top: 1px solid #e5e7eb;

      text-align: center;

      color: #667085;

      font-size: 13px;
    }

    .register a {
      color: #2563eb;

      font-weight: 750;

      text-decoration: none;
    }

    /* FOOTER */

    footer {
      padding: 18px 16px;

      color: #667085;

      text-align: center;

      font-size: 12px;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      main {
        padding: 22px 13px;
      }

      .card {
        padding: 21px 17px;

        border-radius: 16px;
      }

      .heading h1 {
        font-size: 25px;
      }

      .links {
        flex-direction: column;

        align-items: center;
      }
    }

    /* REDUCED MOTION */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>


<body>

<div class="page">

  <!-- HEADER -->

  <header>

    <a
      href="index-auth.html"
      class="brand"
      aria-label="Let'sStudy Pro authentication"
    >

      <span
        class="logo"
        aria-hidden="true"
      >
        L
      </span>

      <span class="brand-name">
        Let'sStudy Pro
      </span>

    </a>

  </header>


  <!-- MAIN -->

  <main>

    <div class="container">

      <section class="heading">

        <h1>
          Welcome Back
        </h1>

        <p>
          Login to your Let'sStudy Pro account.
        </p>

      </section>


      <section class="card">

        <!-- STATUS -->

        <div
          id="status"
          class="status"
          role="alert"
          aria-live="polite"
        ></div>


        <!-- LOGIN FORM -->

        <form
          id="loginForm"
          novalidate
        >

          <div class="field">

            <label for="email">
              Email address
            </label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              placeholder="you@example.com"
              required
            >

          </div>


          <div class="field">

            <label for="password">
              Password
            </label>

            <div class="password-wrap">

              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                minlength="6"
                required
              >

              <button
                type="button"
                id="togglePassword"
                class="toggle-password"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>

            </div>

          </div>


          <button
            id="loginButton"
            class="login-btn"
            type="submit"
          >
            Login
          </button>

        </form>


        <!-- LINKS -->

        <nav
          class="links"
          aria-label="Account links"
        >

          <a href="forgot-password.html">
            Forgot password?
          </a>

          <a href="index-auth.html">
            Change account
          </a>

        </nav>


        <!-- REGISTER -->

        <div class="register">

          Don't have an account?

          <a href="register.html">
            Create account
          </a>

        </div>

      </section>

    </div>

  </main>


  <!-- FOOTER -->

  <footer>
    © <span id="year"></span> Let'sStudy Pro
  </footer>

</div>


<script type="module">

  /* =========================================
     FIREBASE SDK
  ========================================== */

  import {
    initializeApp
  } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged
  } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0rodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"
  };


  /* =========================================
     INITIALIZE FIREBASE
  ========================================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================================
     ELEMENTS
  ========================================== */

  const form =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const status =
    document.getElementById("status");

  const togglePassword =
    document.getElementById("togglePassword");

  const year =
    document.getElementById("year");


  year.textContent =
    new Date().getFullYear();


  /* =========================================
     STATUS
  ========================================== */

  function showStatus(
    message,
    type = "error"
  ) {

    status.textContent =
      message;

    status.className =
      `status show ${type}`;
  }


  function clearStatus() {

    status.textContent =
      "";

    status.className =
      "status";
  }


  /* =========================================
     PASSWORD TOGGLE
  ========================================== */

  togglePassword.addEventListener(
    "click",
    () => {

      const isHidden =
        passwordInput.type === "password";


      passwordInput.type =
        isHidden
          ? "text"
          : "password";


      togglePassword.textContent =
        isHidden
          ? "Hide"
          : "Show";


      togglePassword.setAttribute(
        "aria-label",
        isHidden
          ? "Hide password"
          : "Show password"
      );


      togglePassword.setAttribute(
        "aria-pressed",
        String(isHidden)
      );
    }
  );


  /* =========================================
     FIREBASE ERROR MESSAGE
  ========================================== */

  function getErrorMessage(error) {

    switch (error.code) {

      case "auth/invalid-email":
        return "Please enter a valid email address.";

      case "auth/user-not-found":
        return "No account was found with this email.";

      case "auth/wrong-password":
      case "auth/invalid-credential":
        return "Incorrect email or password.";

      case "auth/user-disabled":
        return "This account has been disabled.";

      case "auth/too-many-requests":
        return "Too many attempts. Please wait and try again.";

      case "auth/network-request-failed":
        return "Network error. Check your internet connection.";

      default:
        return "Login failed. Please try again.";
    }
  }


  /* =========================================
     CHECK USER ROLE
  ========================================== */

  async function getUserRole(uid) {

    const userDocument =
      await getDoc(
        doc(
          db,
          "users",
          uid
        )
      );


    if (!userDocument.exists()) {
      return null;
    }


    return userDocument.data().role || null;
  }


  /* =========================================
     REDIRECT USER
  ========================================== */

  async function redirectUser(user) {

    try {

      const role =
        await getUserRole(user.uid);


      /*
       * ADMIN MUST USE ADMIN LOGIN.
       */

      if (role === "admin") {

        showStatus(
          "This is an administrator account. Please use Admin Login."
        );

        return false;
      }


      /*
       * NORMAL USER
       *
       * Login → index.html
       */

      if (
        role === "user" ||
        role === "student" ||
        role === null
      ) {

        window.location.replace(
          "index.html"
        );

        return true;
      }


      showStatus(
        "Your account role could not be verified."
      );

      return false;

    } catch (error) {

      console.error(
        "Role verification failed:",
        error
      );

      showStatus(
        "Your account could not be verified. Please try again."
      );

      return false;
    }
  }


  /* =========================================
     EXISTING AUTH SESSION
  ========================================== */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {
        return;
      }


      await redirectUser(user);
    }
  );


  /* =========================================
     LOGIN
  ========================================== */

  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      clearStatus();


      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      /* VALIDATION */

      if (!email) {

        showStatus(
          "Please enter your email address."
        );

        emailInput.focus();

        return;
      }


      if (!emailInput.validity.valid) {

        showStatus(
          "Please enter a valid email address."
        );

        emailInput.focus();

        return;
      }


      if (!password) {

        showStatus(
          "Please enter your password."
        );

        passwordInput.focus();

        return;
      }


      if (password.length < 6) {

        showStatus(
          "Password must contain at least 6 characters."
        );

        passwordInput.focus();

        return;
      }


      /* LOADING */

      loginButton.disabled =
        true;

      loginButton.textContent =
        "Signing in...";


      try {

        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        showStatus(
          "Login successful. Opening Let'sStudy Pro...",
          "success"
        );


        await redirectUser(
          credential.user
        );


        /*
         * If redirect did not happen,
         * restore the button.
         */

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";


      } catch (error) {

        console.error(
          "Login error:",
          error
        );


        showStatus(
          getErrorMessage(error)
        );


        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";
      }

    }
  );

</script>

</body>
</html>
