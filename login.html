<body>
<div class="card">

<h1>Welcome back</h1>
<p>Login to your LetsStudy Pro account.</p>

<form id="loginForm">
<input type="email" id="email" placeholder="Email address" required>
<input type="password" id="password" placeholder="Password" required>

<div class="row">
<label><input type="checkbox" id="remember" checked> Remember me</label>
<button type="button" class="link" id="forgot" style="width:auto;margin:0">Forgot password?</button>
</div>

<button class="login" type="submit" id="loginBtn">Sign in</button>
</form>

<button class="google" id="googleBtn">Continue with Google</button>
<button class="link" id="createBtn">Create an account</button>
<button class="link" id="profileBtn">Create a Profile</button>

<div id="msg"></div>
</div>

<script type="module">
import {initializeApp}
 from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
 getAuth,
 setPersistence,
 browserLocalPersistence,
 browserSessionPersistence,
 signInWithEmailAndPassword,
 createUserWithEmailAndPassword,
 sendPasswordResetEmail,
 GoogleAuthProvider,
 signInWithRedirect,
 getRedirectResult,
 onAuthStateChanged,
 updateProfile
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyB4NKq6cVRJO4kDxmEHBsae2rbQo2Ed0iA",
 authDomain: "vorix-account.firebaseapp.com",
 projectId: "vorix-account",
 storageBucket: "vorix-account.firebasestorage.app",
 messagingSenderId: "815715027906",
 appId: "1:815715027906:web:43a4c0fc0285136f72a45b",
 measurementId: "G-044DNRL5PL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const $ = id => document.getElementById(id);
const msg = $("msg");

function showMessage(text,type="error"){
 msg.textContent=text;
 msg.className=type;
 msg.style.display="block";
}

function getRedirect(){
 return new URLSearchParams(location.search).get("redirect")
 || "index.html";
}

function goToApp(){
 location.replace(getRedirect());
}

function readableError(error){
 const messages={
  "auth/invalid-credential":"Email or password is incorrect.",
  "auth/user-not-found":"Account not found.",
  "auth/wrong-password":"Incorrect password.",
  "auth/invalid-email":"Invalid email address.",
  "auth/email-already-in-use":"Email already registered.",
  "auth/weak-password":"Password must be at least 6 characters.",
  "auth/unauthorized-domain":"This domain is not authorized in Firebase.",
  "auth/popup-blocked":"Google login popup was blocked.",
  "auth/popup-closed-by-user":"Google login was cancelled.",
  "auth/operation-not-allowed":"Enable this sign-in method in Firebase.",
  "auth/network-request-failed":"Check your internet connection.",
  "auth/too-many-requests":"Too many attempts. Try again later."
 };
 return messages[error.code] || error.message || "Login failed.";
}

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const email=$("email").value.trim();
 const password=$("password").value;

 try{
  $("loginBtn").disabled=true;

  await setPersistence(
   auth,
   $("remember").checked
    ? browserLocalPersistence
    : browserSessionPersistence
  );

  await signInWithEmailAndPassword(auth,email,password);
  showMessage("Login successful!","success");
  goToApp();

 }catch(error){
  showMessage(readableError(error));
  console.error("Email login:",error.code,error.message);
 }finally{
  $("loginBtn").disabled=false;
 }
});

$("googleBtn").addEventListener("click",async()=>{
 try{
  await setPersistence(
   auth,
   $("remember").checked
    ? browserLocalPersistence
    : browserSessionPersistence
  );

  await signInWithRedirect(auth,provider);

 }catch(error){
  showMessage(readableError(error));
  console.error("Google login:",error.code,error.message);
 }
});

try{
 const result=await getRedirectResult(auth);
 if(result){
  showMessage("Google login successful!","success");
  goToApp();
 }
}catch(error){
 showMessage(readableError(error));
 console.error("Google redirect:",error.code,error.message);
}

$("createBtn").addEventListener("click",async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email||!password){
  showMessage("Enter email and password to create an account.");
  return;
 }

 try{
  await createUserWithEmailAndPassword(auth,email,password);
  showMessage("Account created successfully!","success");
  goToApp();
 }catch(error){
  showMessage(readableError(error));
  console.error("Create account:",error.code,error.message);
 }
});

$("forgot").addEventListener("click",async()=>{
 const email=$("email").value.trim();

 if(!email){
  showMessage("Enter your email address first.");
  return;
 }

 try{
  await sendPasswordResetEmail(auth,email);
  showMessage("Password reset email sent!","success");
 }catch(error){
  showMessage(readableError(error));
 }
});

$("profileBtn").addEventListener("click",()=>{
 location.href="profile.html";
});

onAuthStateChanged(auth,user=>{
 if(user){
  // User already signed in.
  // Avoid automatically redirecting here.
 }
});
</script>
</body>
