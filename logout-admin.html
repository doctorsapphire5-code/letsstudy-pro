<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Admin Logout | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Securely sign out of the Let'sStudy Pro administrator portal."
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 390px;

      padding: 30px;

      text-align: center;

      background: #ffffff;

      border: 1px solid #e2e7ef;

      border-radius: 20px;

      box-shadow:
        0 20px 50px rgba(15, 23, 42, .10);
    }

    .icon {
      width: 64px;
      height: 64px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: #2563eb;

      color: #ffffff;

      font-size: 28px;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 22px;
    }

    p {
      margin: 0;

      color: #687386;

      font-size: 14px;

      line-height: 1.5;
    }

    .status {
      margin-top: 20px;

      font-size: 14px;

      font-weight: 600;

      line-height: 1.5;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #15803d;
    }

    .login {
      display: inline-block;

      margin-top: 20px;

      padding: 11px 18px;

      border-radius: 10px;

      background: #2563eb;

      color: #ffffff;

      text-decoration: none;

      font-size: 14px;

      font-weight: 700;
    }

    .login:hover {
      background: #1d4ed8;
    }

    .retry {
      display: inline-block;

      margin-top: 10px;

      padding: 10px 17px;

      border: 1px solid #fecaca;

      border-radius: 10px;

      background: #fef2f2;

      color: #dc2626;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;
    }

    footer {
      margin-top: 20px;

      color: #687386;

      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div
      class="icon"
      aria-hidden="true"
    >
      🔐
    </div>

    <h1>Admin Logout</h1>

    <p>
      Securely sign out of your Let'sStudy Pro administrator account.
    </p>

    <div
      id="status"
      class="status"
      aria-live="polite"
    >
      Signing out...
    </div>

    <!-- MANUAL LOGIN BUTTON -->
    <a
      id="loginLink"
      class="login"
      href="login-admin.html"
      hidden
    >
      Admin Login
    </a>

    <!-- MANUAL RETRY BUTTON -->
    <button
      id="retryBtn"
      class="retry"
      type="button"
      hidden
    >
      Try Logout Again
    </button>

    <footer>
      © <span id="year"></span> Let'sStudy Pro
    </footer>

  </main>


  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
    ========================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
    };


    /* =========================
       INITIALIZE FIREBASE
    ========================== */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    /* =========================
       DOM
    ========================== */

    const status =
      document.getElementById("status");

    const loginLink =
      document.getElementById("loginLink");

    const retryBtn =
      document.getElementById("retryBtn");


    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* =========================
       LOGOUT
    ========================== */

    async function logoutAdmin() {

      /*
       * Reset UI
       */

      status.textContent =
        "Signing out...";

      status.className =
        "status";

      loginLink.hidden =
        true;

      retryBtn.hidden =
        true;


      try {

        /*
         * Firebase sign out
         */

        await signOut(auth);


        /*
         * SUCCESS
         */

        status.textContent =
          "You have been securely logged out.";

        status.className =
          "status success";


        /*
         * IMPORTANT:
         *
         * NO automatic redirect.
         *
         * The page remains here.
         */

        loginLink.hidden =
          false;


      } catch (error) {

        console.error(
          "Admin logout error:",
          error
        );


        status.textContent =
          "Logout failed. Please try again.";

        status.className =
          "status error";


        /*
         * Show manual retry.
         */

        retryBtn.hidden =
          false;

      }

    }


    /* =========================
       RETRY
    ========================== */

    retryBtn.addEventListener(
      "click",
      logoutAdmin
    );


    /* =========================
       START LOGOUT
    ========================== */

    logoutAdmin();

  </script>

</body>
</html>
