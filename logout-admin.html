<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Logging Out | Let'sStudy Pro</title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 390px;

      padding: 30px;

      text-align: center;

      background: #ffffff;

      border: 1px solid #e2e7ef;

      border-radius: 20px;

      box-shadow:
        0 20px 50px rgba(15, 23, 42, .10);
    }

    .icon {
      width: 64px;
      height: 64px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: #2563eb;

      color: #ffffff;

      font-size: 28px;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 22px;
    }

    p {
      margin: 0;

      color: #687386;

      font-size: 14px;

      line-height: 1.5;
    }

    .status {
      margin-top: 20px;

      font-size: 14px;

      font-weight: 600;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #15803d;
    }

    .login {
      display: inline-block;

      margin-top: 20px;

      padding: 11px 18px;

      border-radius: 10px;

      background: #2563eb;

      color: #ffffff;

      text-decoration: none;

      font-size: 14px;

      font-weight: 700;
    }

    footer {
      margin-top: 20px;

      color: #687386;

      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div
      class="icon"
      aria-hidden="true"
    >
      🔐
    </div>

    <h1>Logging Out</h1>

    <p>
      Please wait while we securely sign you out.
    </p>

    <div
      id="status"
      class="status"
      aria-live="polite"
    >
      Signing out...
    </div>

    <a
      id="loginLink"
      class="login"
      href="login-admin.html"
      hidden
    >
      Admin Login
    </a>

    <footer>
      © <span id="year"></span> Let'sStudy Pro
    </footer>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
    ========================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
    };


    /* =========================
       INITIALIZE FIREBASE
    ========================== */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    /* =========================
       DOM
    ========================== */

    const status =
      document.getElementById("status");

    const loginLink =
      document.getElementById("loginLink");

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* =========================
       LOGOUT
    ========================== */

    async function logoutAdmin() {

      try {

        await signOut(auth);


        status.textContent =
          "You have been securely logged out.";

        status.className =
          "status success";


        /*
         * Small delay so the admin
         * can see the success message.
         */

        setTimeout(() => {

          window.location.replace(
            "login-admin.html"
          );

        }, 800);


      } catch (error) {

        console.error(
          "Admin logout error:",
          error
        );


        status.textContent =
          "Logout failed. Please try again.";

        status.className =
          "status error";


        loginLink.hidden = false;
      }
    }


    logoutAdmin();

  </script>

</body>
</html>
