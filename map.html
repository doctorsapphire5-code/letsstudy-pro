<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Google Maps | LetsStudy Pro</title>

<meta name="description"
content="Explore locations with embedded Google Maps on LetsStudy Pro.">

<link rel="icon"
href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgQHmJO8e8twONhRhp3I6pP4NFDh-LPcqVtAmQ9R9XjOGaVMKShfSLmxeK0fVzJsybBBOXKbA8LIhjgTgko83C-UPVhwgXeLtvTfjtVv6aVGgQgniOF-gMC28bY78HryXZ-5OqCwdBpKGqjEfTta5jLjT1mpvtBi2DQKyu35rkxsZNoVvl0nhvxUUn1gDP0/s1600/Untitled%20design_20260717_144337_0000.jpg">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#f5f7fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif;
}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 padding:0 5%;
 position:sticky;
 top:0;
 z-index:20;
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:900;
}

.container{
 max-width:1200px;
 margin:28px auto;
 padding:0 18px;
}

.header{
 margin-bottom:18px;
}

h1{
 margin:0 0 7px;
 font-size:28px;
}

.subtitle{
 color:#667085;
 font-size:13px;
 line-height:1.6;
}

.search{
 display:flex;
 gap:8px;
 margin:18px 0;
}

.search input{
 flex:1;
 padding:13px 14px;
 border:1px solid #d0d5dd;
 border-radius:10px;
 outline:none;
 font-size:13px;
 background:#fff;
}

.btn{
 border:0;
 background:#155eef;
 color:#fff;
 padding:13px 18px;
 border-radius:10px;
 font-size:12px;
 font-weight:800;
 cursor:pointer;
}

.btn:hover{
 background:#073bba;
}

.map-card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:17px;
 overflow:hidden;
 box-shadow:0 5px 20px rgba(16,24,40,.06);
}

.map{
 width:100%;
 height:620px;
 border:0;
 display:block;
}

.bottom{
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
}

.info{
 color:#667085;
 font-size:11px;
}

.open{
 background:#155eef;
 color:#fff;
 padding:10px 14px;
 border-radius:8px;
 font-size:11px;
 font-weight:800;
}

@media(max-width:600px){

 .search{
  flex-direction:column;
 }

 .map{
  height:500px;
 }

 h1{
  font-size:24px;
 }

}
</style>
</head>

<body>

<header class="top">

<div class="logo">
LetsStudy Pro
</div>

</header>


<main class="container">

<div class="header">

<h1>
<i class="fa fa-map-location-dot"></i>
Google Maps
</h1>

<div class="subtitle">
Search and explore locations directly inside LetsStudy Pro.
</div>

</div>


<div class="search">

<input
id="location"
value="Dar es Salaam, Tanzania"
placeholder="Search city, country or location...">

<button
class="btn"
onclick="searchMap()">

<i class="fa fa-search"></i>
Search

</button>

</div>


<section class="map-card">

<iframe
id="map"
class="map"
src="https://www.google.com/maps?q=Dar%20es%20Salaam%2C%20Tanzania&output=embed"
loading="lazy"
allowfullscreen
referrerpolicy="no-referrer-when-downgrade">
</iframe>


<div class="bottom">

<div class="info">

<i class="fa fa-circle-info"></i>

Google Maps embedded inside LetsStudy Pro.

</div>

<a
id="openMap"
class="open"
href="https://www.google.com/maps/search/?api=1&query=Dar%20es%20Salaam%2C%20Tanzania"
target="_blank"
rel="noopener">

<i class="fa fa-arrow-up-right-from-square"></i>
Open in Google Maps

</a>

</div>

</section>

</main>


<script>

function searchMap(){

 const location=
 document
 .getElementById("location")
 .value
 .trim();


 if(!location){

  alert(
   "Please enter a location."
  );

  return;
 }


 const encoded=
 encodeURIComponent(location);


 document
 .getElementById("map")
 .src=
 "https://www.google.com/maps?q="+
 encoded+
 "&output=embed";


 document
 .getElementById("openMap")
 .href=
 "https://www.google.com/maps/search/?api=1&query="+
 encoded;

}


document
.getElementById("location")
.addEventListener(
 "keydown",
 function(e){

  if(e.key==="Enter"){
   searchMap();
  }

 }
);

</script>

</body>
</html>
