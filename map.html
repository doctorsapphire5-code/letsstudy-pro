<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Maps | LetsStudy Pro</title>

<meta
  name="description"
  content="Explore places around the world with LetsStudy Pro Maps."
>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:
    Inter,
    Arial,
    sans-serif;
  background:#f5f7fb;
}

body{
  overflow:hidden;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:68px;
  min-height:68px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 20px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  z-index:10;
}

.logo{
  text-decoration:none;
  color:#111827;
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}

.logo span{
  color:#2563eb;
}

.search{
  flex:1;
  max-width:800px;
  margin:auto;
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  height:46px;
  border:1px solid #d1d5db;
  border-radius:12px;
  outline:none;
  padding:0 16px;
  font-size:15px;
  background:#f9fafb;
}

.search input:focus{
  border-color:#2563eb;
  background:#fff;
  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.1);
}

.search button{
  height:46px;
  padding:0 20px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.search button:hover{
  background:#1d4ed8;
}

/* MAP */

.map{
  position:relative;
  flex:1;
  min-height:0;
}

.map iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

/* LOCATION BUTTON */

.location{
  position:absolute;
  right:20px;
  top:20px;
  z-index:5;
  border:0;
  border-radius:12px;
  padding:13px 17px;
  background:#fff;
  color:#111827;
  font-weight:800;
  cursor:pointer;
  box-shadow:
    0 4px 18px
    rgba(0,0,0,.18);
}

.location:hover{
  background:#f3f4f6;
}

/* INFO */

.info{
  position:absolute;
  left:20px;
  bottom:20px;
  z-index:5;
  padding:11px 15px;
  background:#fff;
  border-radius:10px;
  color:#4b5563;
  font-size:13px;
  box-shadow:
    0 4px 18px
    rgba(0,0,0,.15);
}

/* MOBILE */

@media(max-width:700px){

  .header{
    height:auto;
    min-height:62px;
    padding:10px;
  }

  .logo{
    display:none;
  }

  .search{
    width:100%;
  }

  .search input{
    min-width:0;
  }

  .search button{
    padding:0 15px;
  }

  .location{
    right:10px;
    top:10px;
  }

  .info{
    left:10px;
    bottom:10px;
  }

}

</style>

</head>

<body>

<div class="app">

  <header class="header">

    <a
      href="index.html"
      class="logo"
    >
      LetsStudy <span>Pro</span>
    </a>

    <form
      class="search"
      id="searchForm"
    >

      <input
        id="searchInput"
        type="search"
        placeholder="Search any place in the world..."
        autocomplete="off"
      >

      <button type="submit">
        Search
      </button>

    </form>

  </header>


  <main class="map">

    <iframe
      id="mapFrame"
      title="Google Maps"
      src="https://www.google.com/maps?q=World&output=embed"
      loading="lazy"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>


    <button
      id="locationButton"
      class="location"
      type="button"
    >
      📍 My Location
    </button>


    <div class="info">
      🌍 Explore locations around the world
    </div>

  </main>

</div>


<script>

const form =
  document.getElementById(
    "searchForm"
  );

const input =
  document.getElementById(
    "searchInput"
  );

const frame =
  document.getElementById(
    "mapFrame"
  );

const locationButton =
  document.getElementById(
    "locationButton"
  );


/* SEARCH */

form.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    const query =
      input.value.trim();

    if(!query){
      return;
    }

    const encoded =
      encodeURIComponent(query);

    frame.src =
      "https://www.google.com/maps?q=" +
      encoded +
      "&output=embed";

  }
);


/* CURRENT LOCATION */

locationButton.addEventListener(
  "click",
  function(){

    if(
      !navigator.geolocation
    ){

      alert(
        "Geolocation is not supported by your browser."
      );

      return;

    }

    locationButton.textContent =
      "📍 Finding...";

    navigator.geolocation.getCurrentPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;

        frame.src =
          "https://www.google.com/maps?q=" +
          lat +
          "," +
          lng +
          "&output=embed";

        locationButton.textContent =
          "📍 My Location";

      },

      function(){

        alert(
          "Unable to get your location."
        );

        locationButton.textContent =
          "📍 My Location";

      }

    );

  }
);

</script>

</body>
</html>
