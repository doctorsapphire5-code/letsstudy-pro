<body>

  <main class="container">
    <div class="logo">V</div>

    <h1>Forgot Password?</h1>

    <p class="description">
      Enter your registered administrator email address.
      We will send you a password reset link if the account is eligible.
    </p>

    <div id="message" class="message" role="status"></div>

    <form id="resetForm">
      <label for="email">Administrator Email</label>

      <input type="email" id="email" placeholder="Enter your registered email" autocomplete="email" required="">

      <button type="submit" id="submitBtn">
        Send Reset Link
      </button>
    </form>

    <div class="links">
      <a href="market-admin-login.html">Back to Admin Login</a>
      <br>
      <a href="market-admin-register.html">Create Admin Account</a>
    </div>

    <div class="footer">
      © 2026 Vorix Market. All rights reserved.
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBTMnT-PhJ44Hamu2EHyqnbP5EBoiFwGqY",
      authDomain: "vorix-market.firebaseapp.com",
      databaseURL: "https://vorix-market-default-rtdb.firebaseio.com",
      projectId: "vorix-market",
      storageBucket: "vorix-market.firebasestorage.app",
      messagingSenderId: "686555609094",
      appId: "1:686555609094:web:61f3e1853c0fca143a2b87",
      measurementId: "G-2KNWRG4X08"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    const form = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("message");

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.textContent = loading
        ? "Sending..."
        : "Send Reset Link";
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = emailInput.value.trim().toLowerCase();

      if (!email) {
        showMessage("Please enter your administrator email.", "error");
        return;
      }

      setLoading(true);
      messageBox.className = "message";

      try {
        /*
          Firebase Authentication sends the password reset email.
          Firestore is not used to retrieve or store passwords.
        */

        await auth.sendPasswordResetEmail(email, {
          url: window.location.origin +
              window.location.pathname.replace(
                "market-admin-forgot-password.html",
                "market-admin-login.html"
              ),
          handleCodeInApp: false
        });

        showMessage(
          "If an account is registered with this email, a password reset link has been sent. Please check your inbox and spam folder.",
          "success"
        );

        form.reset();

      } catch (error) {
        console.error("Password reset error:", error);

        // Avoid exposing whether an administrator email exists.
        if (
          error.code === "auth/invalid-email" ||
          error.code === "auth/missing-email"
        ) {
          showMessage(
            "Please enter a valid email address.",
            "error"
          );
        } else if (
          error.code === "auth/too-many-requests"
        ) {
          showMessage(
            "Too many attempts. Please wait and try again later.",
            "error"
          );
        } else if (
          error.code === "auth/network-request-failed"
        ) {
          showMessage(
            "Network error. Check your internet connection and try again.",
            "error"
          );
        } else {
          showMessage(
            "If an account is registered with this email, a password reset link has been sent. Please check your inbox and spam folder.",
            "success"
          );
        }

      } finally {
        setLoading(false);
      }
    });
  </script>
