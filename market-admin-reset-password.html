  <main class="container">

    <h1>Reset Password</h1>

    <p class="description" id="description">
      Create a new secure password for your administrator account.
    </p>

    <div id="message" class="message" role="status"></div>

    <form id="resetForm" class="hidden">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" minlength="8" required="">

      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required="">

      <button type="submit" id="submitBtn">
        Reset Password
      </button>
    </form>

    <div class="links">
      <a href="market-admin-login.html">Back to Admin Login</a>
    </div>

    <div class="footer">
      © 2026 Vorix Market. All rights reserved.
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBTMnT-PhJ44Hamu2EHyqnbP5EBoiFwGqY",
      authDomain: "vorix-market.firebaseapp.com",
      databaseURL: "https://vorix-market-default-rtdb.firebaseio.com",
      projectId: "vorix-market",
      storageBucket: "vorix-market.firebasestorage.app",
      messagingSenderId: "686555609094",
      appId: "1:686555609094:web:61f3e1853c0fca143a2b87",
      measurementId: "G-2KNWRG4X08"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();

    const form = document.getElementById("resetForm");
    const messageBox = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");
    const description = document.getElementById("description");

    // Get Firebase password reset code from URL
    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");
    const actionCode = params.get("oobCode");
    const continueUrl = params.get("continueUrl");

    let verifiedCode = null;

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.textContent = loading
        ? "Updating..."
        : "Reset Password";
    }

    function getFirebaseError(error) {
      switch (error.code) {
        case "auth/expired-action-code":
          return "This password reset link has expired. Request a new reset link.";

        case "auth/invalid-action-code":
          return "This password reset link is invalid or has already been used.";

        case "auth/user-disabled":
          return "This account has been disabled.";

        case "auth/user-not-found":
          return "The account associated with this link could not be found.";

        case "auth/weak-password":
          return "Your password is too weak. Use at least 8 characters.";

        case "auth/network-request-failed":
          return "Network error. Check your internet connection.";

        default:
          return "Unable to reset your password. Please request a new reset link.";
      }
    }

    async function verifyResetLink() {
      if (mode !== "resetPassword" || !actionCode) {
        showMessage(
          "Invalid reset link. Please request a new password reset email.",
          "error"
        );
        description.textContent =
          "The password reset link is missing or invalid.";
        return;
      }

      try {
        // Verify the reset code before showing the form
        await auth.verifyPasswordResetCode(actionCode);

        verifiedCode = actionCode;
        form.classList.remove("hidden");

        showMessage(
          "Reset link verified. You can now create a new password.",
          "success"
        );

      } catch (error) {
        console.error(error);

        showMessage(getFirebaseError(error), "error");

        description.textContent =
          "This reset link cannot be used. Request another reset email.";
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const password =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (!verifiedCode) {
        showMessage(
          "Your reset link has not been verified.",
          "error"
        );
        return;
      }

      if (password.length < 8) {
        showMessage(
          "Password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match.",
          "error"
        );
        return;
      }

      setLoading(true);
      messageBox.className = "message";

      try {
        // Update password through Firebase Authentication
        await auth.confirmPasswordReset(
          verifiedCode,
          password
        );

        verifiedCode = null;
        form.reset();
        form.classList.add("hidden");

        description.textContent =
          "Your administrator password has been successfully updated.";

        showMessage(
          "Password reset successful. You can now log in using your new password.",
          "success"
        );

        // Remove sensitive reset code from browser URL
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

      } catch (error) {
        console.error("Password reset failed:", error);

        showMessage(
          getFirebaseError(error),
          "error"
        );

      } finally {
        setLoading(false);
      }
    });

    // Verify the reset link when page loads
    verifyResetLink();
  </script>
