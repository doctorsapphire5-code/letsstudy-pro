<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Market Research | LetsStudy Pro</title>

<meta name="description"
content="Explore market research, industry insights, trends and business opportunities on LetsStudy Pro.">

<meta name="robots" content="index,follow">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.5
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer
}

.container{
  width:92%;
  max-width:1100px;
  margin:30px auto
}

.hero{
  background:#fff;
  padding:32px 24px;
  border-radius:18px;
  margin-bottom:18px
}

.hero h1{
  font-size:32px;
  margin-bottom:8px
}

.hero p{
  color:#64748b;
  max-width:700px
}

.search{
  margin-top:22px;
  width:100%;
  padding:13px 15px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  font-size:15px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:18px
}

.stat strong{
  display:block;
  font-size:24px
}

.stat span{
  color:#64748b;
  font-size:12px
}

.filters{
  background:#fff;
  padding:15px;
  border-radius:13px;
  margin-bottom:16px
}

select{
  padding:10px 12px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  background:#fff;
  min-width:190px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:14px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:19px;
  display:flex;
  flex-direction:column
}

.tag{
  display:inline-block;
  background:#eff6ff;
  color:#2563eb;
  padding:5px 8px;
  border-radius:6px;
  font-size:11px;
  margin-bottom:10px;
  width:max-content
}

.card h2{
  font-size:18px;
  margin-bottom:7px
}

.description{
  color:#64748b;
  font-size:13px;
  flex:1
}

.meta{
  color:#64748b;
  font-size:11px;
  margin-top:15px
}

.view{
  display:inline-block;
  margin-top:14px;
  text-align:center;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:9px 12px;
  border-radius:8px;
  font-size:13px;
  font-weight:700
}

.loading,
.empty,
.error{
  background:#fff;
  border-radius:14px;
  padding:50px 20px;
  text-align:center;
  color:#64748b
}

.error{
  color:#b91c1c
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr
  }

  .hero h1{
    font-size:27px
  }

  select{
    width:100%
  }
}
</style>
</head>

<body>

<header>

  <a
    href="index.html"
    class="logo"
  >
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      Market Research
    </h1>

    <p>
      Explore market insights, industry trends,
      opportunities and research reports.
    </p>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search market research..."
      autocomplete="off"
    >

  </section>


  <section class="stats">

    <div class="stat">
      <strong id="total">
        0
      </strong>
      <span>
        Research Reports
      </span>
    </div>

    <div class="stat">
      <strong id="categories">
        0
      </strong>
      <span>
        Categories
      </span>
    </div>

    <div class="stat">
      <strong id="featured">
        0
      </strong>
      <span>
        Featured
      </span>
    </div>

  </section>


  <section class="filters">

    <select id="category">

      <option value="">
        All Categories
      </option>

    </select>

  </section>


  <section
    id="grid"
    class="grid"
  >

    <div class="loading">
      Loading market research...
    </div>

  </section>

</main>


<script>

/*
==================================================
MARKET-RESEARCH.HTML

PUBLIC PAGE

API:
GET /api/data?collection=marketResearch&limit=100

SUPPORTED FIELDS:

title
description
category
industry
summary
url
researchUrl
documentId
id
featured
published
createdAt
updatedAt

NO DIRECT FIREBASE
==================================================
*/


const grid =
  document.getElementById(
    "grid"
  );

const search =
  document.getElementById(
    "search"
  );

const category =
  document.getElementById(
    "category"
  );

const total =
  document.getElementById(
    "total"
  );

const categories =
  document.getElementById(
    "categories"
  );

const featured =
  document.getElementById(
    "featured"
  );


let research = [];


/* =========================
   LOAD DATA
========================= */

loadResearch();


async function loadResearch(){

  try{

    const response =
      await fetch(
        "/api/data?collection=marketResearch&limit=100"
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load market research."
      );

    }


    research =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    populateCategories();

    updateStats();

    render();

  }catch(error){

    console.error(
      "MARKET RESEARCH:",
      error
    );


    grid.innerHTML = `

      <div class="error">

        Unable to load market research.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   CATEGORIES
========================= */

function populateCategories(){

  const values =
    research
      .map(
        item =>
          item.category ||
          item.industry
      )
      .filter(Boolean);


  const unique =
    [...new Set(
      values
        .map(
          value =>
            String(value)
              .trim()
        )
    )]
    .sort();


  categories.textContent =
    unique.length;


  category.innerHTML =
    `<option value="">
      All Categories
    </option>` +
    unique
      .map(
        value => `

          <option
            value="${escapeAttr(value)}"
          >
            ${escapeHTML(value)}
          </option>

        `
      )
      .join("");

}


/* =========================
   STATS
========================= */

function updateStats(){

  total.textContent =
    research.length;


  featured.textContent =
    research.filter(
      item =>
        item.featured === true
    ).length;

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const selected =
    category.value
      .trim()
      .toLowerCase();


  const filtered =
    research.filter(
      item => {

        const title =
          item.title ||
          "";


        const description =
          item.description ||
          item.summary ||
          "";


        const industry =
          item.industry ||
          "";


        const itemCategory =
          item.category ||
          "";


        const text =
          (
            title +
            " " +
            description +
            " " +
            industry +
            " " +
            itemCategory
          ).toLowerCase();


        const matchesSearch =
          !keyword ||
          text.includes(
            keyword
          );


        const matchesCategory =
          !selected ||
          itemCategory
            .toLowerCase() ===
            selected ||
          industry
            .toLowerCase() ===
            selected;


        return (
          matchesSearch &&
          matchesCategory
        );

      }
    );


  if(!filtered.length){

    grid.innerHTML = `

      <div class="empty">

        ${
          research.length
          ? "No matching research found."
          : "No market research is available yet."
        }

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered
      .map(
        createCard
      )
      .join("");

}


/* =========================
   CARD
========================= */

function createCard(
  item
){

  const title =
    item.title ||
    "Market Research";


  const description =
    item.description ||
    item.summary ||
    "Explore this market research report.";


  const tag =
    item.category ||
    item.industry ||
    "Research";


  const id =
    item.documentId ||
    item.id ||
    "";


  const external =
    item.researchUrl ||
    item.url ||
    "";


  const link =
    id
    ? "market-research-details.html?id=" +
      encodeURIComponent(id)
    : safeURL(
        external
      );


  return `

    <article class="card">

      <span class="tag">

        ${escapeHTML(tag)}

      </span>


      <h2>

        ${escapeHTML(title)}

      </h2>


      <p class="description">

        ${escapeHTML(
          description
        )}

      </p>


      ${
        item.featured === true
        ? `
          <div class="meta">
            Featured research
          </div>
        `
        : ""
      }


      ${
        link
        ? `

          <a
            class="view"
            href="${link}"
          >
            View Research
          </a>

        `
        : ""
      }

    </article>

  `;

}


/* =========================
   EVENTS
========================= */

search.addEventListener(
  "input",
  render
);


category.addEventListener(
  "change",
  render
);


/* =========================
   SAFE URL
========================= */

function safeURL(
  value
){

  if(!value) return "";


  try{

    const url =
      new URL(
        String(value),
        location.origin
      );


    if(
      url.protocol === "https:" ||
      url.protocol === "http:"
    ){

      return escapeAttr(
        url.href
      );

    }

  }catch(error){}


  return "";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  ).replace(
    /`/g,
    "&#096;"
  );

}

</script>

</body>
</html>
