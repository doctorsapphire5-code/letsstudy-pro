<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Marketing Dashboard | LetsStudy Pro</title>

<meta name="description"
content="Manage your marketing orders, campaigns and marketing activity on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  text-decoration:none;
  color:#172033;
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1100px;
  margin:30px auto;
}

.hero{
  background:#fff;
  border-radius:17px;
  padding:28px 23px;
  margin-bottom:18px;
}

.hero h1{
  font-size:29px;
  margin-bottom:6px;
}

.hero p{
  color:#64748b;
}

.actions{
  margin-top:18px;
}

.primary{
  display:inline-block;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:10px 15px;
  border-radius:8px;
  font-weight:700;
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:18px;
}

.stat strong{
  display:block;
  font-size:23px;
  margin-bottom:4px;
}

.stat span{
  color:#64748b;
  font-size:12px;
}

.toolbar{
  background:#fff;
  border-radius:13px;
  padding:15px;
  margin-bottom:15px;
}

.search{
  width:100%;
  padding:12px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none;
}

.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:18px;
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.title{
  font-size:17px;
  font-weight:800;
}

.meta{
  color:#64748b;
  font-size:12px;
  margin-top:5px;
}

.status{
  padding:5px 9px;
  border-radius:7px;
  font-size:11px;
  height:max-content;
  white-space:nowrap;
  background:#eff6ff;
  color:#2563eb;
}

.status.completed{
  background:#ecfdf5;
  color:#047857;
}

.status.cancelled{
  background:#fef2f2;
  color:#b91c1c;
}

.amount{
  margin-top:15px;
  font-size:18px;
  font-weight:800;
}

.details{
  margin-top:12px;
  color:#64748b;
  font-size:13px;
}

.loading,
.empty,
.error{
  background:#fff;
  padding:50px 20px;
  text-align:center;
  border-radius:14px;
  color:#64748b;
}

.error{
  color:#b91c1c;
}

@media(max-width:750px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .card-top{
    flex-direction:column;
  }

}

@media(max-width:450px){

  .stats{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>

  <a
    href="index.html"
    class="logo"
  >
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      Marketing Dashboard
    </h1>

    <p>
      Manage your marketing orders and track campaign activity.
    </p>

    <div class="actions">

      <a
        href="marketing.html"
        class="primary"
      >
        Explore Marketing
      </a>

    </div>

  </section>


  <section class="stats">

    <div class="stat">

      <strong id="total">
        0
      </strong>

      <span>
        Total Orders
      </span>

    </div>


    <div class="stat">

      <strong id="active">
        0
      </strong>

      <span>
        Active
      </span>

    </div>


    <div class="stat">

      <strong id="completed">
        0
      </strong>

      <span>
        Completed
      </span>

    </div>


    <div class="stat">

      <strong id="spent">
        0
      </strong>

      <span>
        Total Spent
      </span>

    </div>

  </section>


  <section class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search marketing orders..."
      autocomplete="off"
    >

  </section>


  <section
    id="list"
    class="list"
  >

    <div class="loading">
      Loading marketing dashboard...
    </div>

  </section>

</main>


<script>

/*
==================================================
MARKETING-DASHBOARD.HTML

URL:

marketing-dashboard.html?userId=USER_ID

API:

GET
/api/data?collection=marketingOrders
&userId=USER_ID
&limit=100

SUPPORTED FIELDS:

id
orderId
userId
itemId
itemName
campaignName
amount
currency
status
description
createdAt
updatedAt

NO DIRECT FIREBASE
==================================================
*/


const params =
  new URLSearchParams(
    location.search
  );


const userId =
  params.get("userId") ||
  params.get("uid") ||
  "";


const list =
  document.getElementById(
    "list"
  );

const search =
  document.getElementById(
    "search"
  );

const total =
  document.getElementById(
    "total"
  );

const active =
  document.getElementById(
    "active"
  );

const completed =
  document.getElementById(
    "completed"
  );

const spent =
  document.getElementById(
    "spent"
  );


let orders = [];


/* =========================
   VALIDATE
========================= */

if(!userId){

  list.innerHTML = `

    <div class="empty error">

      No user was selected.

      <br><br>

      Open this page using:

      <br>

      marketing-dashboard.html?userId=USER_ID

    </div>

  `;

}else{

  loadOrders();

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  try{

    const response =
      await fetch(
        "/api/data?collection=marketingOrders&userId=" +
        encodeURIComponent(
          userId
        ) +
        "&limit=100"
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load marketing orders."
      );

    }


    orders =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    updateStats();

    render();

  }catch(error){

    console.error(
      "MARKETING DASHBOARD:",
      error
    );


    list.innerHTML = `

      <div class="error">

        Unable to load marketing dashboard.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  total.textContent =
    orders.length;


  active.textContent =
    orders.filter(
      item => {

        const status =
          String(
            item.status ||
            ""
          ).toLowerCase();


        return (
          status === "pending" ||
          status === "processing" ||
          status === "active" ||
          status === "in_progress"
        );

      }
    ).length;


  completed.textContent =
    orders.filter(
      item =>
        String(
          item.status ||
          ""
        ).toLowerCase()
        === "completed"
    ).length;


  const amount =
    orders.reduce(
      (sum,item) =>
        sum +
        Number(
          item.amount ||
          item.total ||
          0
        ),
      0
    );


  spent.textContent =
    formatMoney(
      amount
    );

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    orders.filter(
      item => {

        const text = (

          item.itemName ||
          "" +

          " " +

          item.campaignName ||
          "" +

          " " +

          item.status ||
          "" +

          " " +

          item.orderId ||
          ""

        ).toLowerCase();


        return (
          !keyword ||
          text.includes(
            keyword
          )
        );

      }
    );


  if(!filtered.length){

    list.innerHTML = `

      <div class="empty">

        ${
          orders.length
          ? "No matching marketing orders."
          : "You have no marketing orders yet."
        }

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered
      .map(
        createCard
      )
      .join("");

}


/* =========================
   CARD
========================= */

function createCard(
  item
){

  const title =
    item.itemName ||
    item.campaignName ||
    "Marketing Order";


  const orderId =
    item.orderId ||
    item.id ||
    "";


  const status =
    String(
      item.status ||
      "pending"
    ).toLowerCase();


  const amount =
    Number(
      item.amount ||
      item.total ||
      0
    );


  const currency =
    item.currency ||
    "TZS";


  const date =
    formatDate(
      item.createdAt ||
      item.updatedAt
    );


  const statusClass =
    status === "completed"
      ? "completed"
      : status === "cancelled" ||
        status === "failed"
        ? "cancelled"
        : "";


  return `

    <article class="card">

      <div class="card-top">

        <div>

          <div class="title">

            ${escapeHTML(title)}

          </div>


          <div class="meta">

            ${
              orderId
              ? "Order #" +
                escapeHTML(orderId)
              : "Marketing order"
            }

            ${
              date
              ? " • " +
                escapeHTML(date)
              : ""
            }

          </div>

        </div>


        <div
          class="status ${statusClass}"
        >

          ${escapeHTML(
            formatStatus(status)
          )}

        </div>

      </div>


      <div class="amount">

        ${escapeHTML(currency)}
        ${formatNumber(amount)}

      </div>


      ${
        item.description
        ? `

          <div class="details">

            ${escapeHTML(
              item.description
            )}

          </div>

        `
        : ""
      }

    </article>

  `;

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  render
);


/* =========================
   STATUS
========================= */

function formatStatus(
  status
){

  return String(
    status
  )
  .replace(
    /_/g,
    " "
  )
  .replace(
    /\b\w/g,
    char =>
      char.toUpperCase()
  );

}


/* =========================
   NUMBER
========================= */

function formatNumber(
  value
){

  return new Intl.NumberFormat(
    undefined,
    {
      maximumFractionDigits:0
    }
  ).format(
    Number(value) || 0
  );

}


function formatMoney(
  value
){

  return new Intl.NumberFormat(
    undefined,
    {
      style:"currency",
      currency:"TZS",
      maximumFractionDigits:0
    }
  ).format(
    Number(value) || 0
  );

}


/* =========================
   DATE
========================= */

function formatDate(
  value
){

  if(!value) return "";

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return String(value);

  }

  return date.toLocaleDateString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
