<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Marketing Service | LetsStudy Pro</title>

<meta name="description"
      content="View marketing service details and place an order on LetsStudy Pro.">

<meta name="robots"
      content="index,follow">

<link rel="canonical"
      href="https://letsstudy.pro/marketing-details.html">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    Arial,
    sans-serif;

  background:#f5f7fb;

  color:#172033;

  line-height:1.55;
}

header{

  background:#fff;

  border-bottom:
    1px solid #e5e7eb;

  padding:
    15px 6%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  position:sticky;

  top:0;

  z-index:20;
}

.logo{

  color:#172033;

  text-decoration:none;

  font-size:21px;

  font-weight:800;
}

.logo span{

  color:#2563eb;
}

.back{

  border:0;

  background:#eef2f7;

  color:#172033;

  padding:
    9px 14px;

  border-radius:8px;

  cursor:pointer;

  font-weight:700;
}

.container{

  width:92%;

  max-width:950px;

  margin:
    30px auto;
}

.card{

  background:#fff;

  border:
    1px solid #e5e7eb;

  border-radius:17px;

  padding:25px;

  margin-bottom:16px;

  box-shadow:
    0 8px 30px rgba(15,23,42,.04);
}

.hero{

  padding:
    32px 25px;
}

.tag{

  display:inline-block;

  background:#eff6ff;

  color:#2563eb;

  padding:
    6px 9px;

  border-radius:7px;

  font-size:11px;

  font-weight:700;

  margin-bottom:12px;

  text-transform:uppercase;
}

h1{

  font-size:32px;

  line-height:1.2;

  margin-bottom:9px;

  word-break:break-word;
}

.description{

  color:#64748b;

  max-width:750px;
}

.price{

  font-size:27px;

  font-weight:800;

  margin-top:20px;

  color:#172033;
}

.free-price{

  color:#16a34a;
}

.buy{

  display:inline-block;

  margin-top:18px;

  background:#2563eb;

  color:#fff;

  text-decoration:none;

  padding:
    12px 18px;

  border-radius:9px;

  font-weight:800;

  transition:.2s;
}

.buy:hover{

  background:#1d4ed8;

  transform:
    translateY(-1px);
}

.free-buy{

  background:#16a34a;
}

.free-buy:hover{

  background:#15803d;
}

.section-title{

  font-size:19px;

  margin-bottom:13px;
}

.content{

  color:#475569;

  font-size:14px;

  word-break:break-word;
}

.features{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-top:15px;
}

.feature{

  border:
    1px solid #e5e7eb;

  padding:12px;

  border-radius:9px;

  font-size:13px;

  color:#334155;
}

.meta{

  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:18px;

  color:#64748b;

  font-size:12px;
}

.meta span{

  background:#f8fafc;

  border:
    1px solid #e5e7eb;

  padding:
    6px 9px;

  border-radius:7px;
}

.service-id{

  font-family:
    monospace;

  color:#475569;
}

.loading{

  background:#fff;

  padding:
    55px 20px;

  border-radius:15px;

  text-align:center;

  border:
    1px solid #e5e7eb;
}

.spinner{

  width:35px;

  height:35px;

  border:
    4px solid #e5e7eb;

  border-top-color:
    #2563eb;

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin:
    0 auto 15px;
}

@keyframes spin{

  to{
    transform:
      rotate(360deg);
  }

}

.error{

  background:#fff;

  padding:
    55px 20px;

  border-radius:15px;

  text-align:center;

  color:#b91c1c;

  border:
    1px solid #fecaca;
}

.error button{

  border:0;

  background:#eef2f7;

  padding:
    10px 15px;

  border-radius:8px;

  margin-top:20px;

  cursor:pointer;

  font-weight:700;
}

.empty-features{

  color:#64748b;

  font-size:14px;
}

footer{

  text-align:center;

  color:#64748b;

  font-size:12px;

  padding:
    20px;
}

@media(max-width:600px){

  .hero{

    padding:
      23px 18px;
  }

  h1{

    font-size:27px;
  }

  .features{

    grid-template-columns:1fr;
  }

  .card{

    padding:20px;
  }

}

</style>

</head>


<body>


<header>

  <a
    href="index.html"
    class="logo"
  >

    LetsStudy
    <span>Pro</span>

  </a>


  <button
    class="back"
    type="button"
    onclick="history.back()"
  >

    ← Back

  </button>

</header>


<main class="container">

  <div
    id="page"
    class="loading"
  >

    <div class="spinner"></div>

    Loading marketing service...

  </div>

</main>


<footer>

  © <span id="year"></span>
  LetsStudy Pro

</footer>


<script>

"use strict";


/* ==================================================
   URL
================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


/*
  THIS IS THE REAL FIREBASE
  FIRESTORE DOCUMENT ID.
*/

const firebaseId =
  params.get("id") ||
  params.get("marketingId") ||
  params.get("documentId") ||
  "";


const page =
  document.getElementById(
    "page"
  );


document.getElementById(
  "year"
).textContent =
  new Date().getFullYear();


let service = null;


/* ==================================================
   VALIDATE ID
================================================== */

if(!firebaseId){

  showError(
    "No marketing service ID was provided."
  );

}else{

  loadService();

}


/* ==================================================
   LOAD FROM API
================================================== */

async function loadService(){

  try{

    const response =
      await fetch(

        "/api/data?collection=marketing&id=" +

        encodeURIComponent(
          firebaseId
        )

      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(

        result.error ||

        "Unable to load marketing service."

      );

    }


    /*
      API may return:

      data
      item
      service
    */

    service =
      result.data ||
      result.item ||
      result.service;


    if(!service){

      throw new Error(
        "Marketing service not found."
      );

    }


    renderService();


  }catch(error){

    console.error(
      "MARKETING DETAILS:",
      error
    );


    showError(

      error.message ||

      "Unable to load marketing service."

    );

  }

}


/* ==================================================
   RENDER
================================================== */

function renderService(){

  const title =
    service.title ||
    service.name ||
    "Marketing Service";


  const description =
    service.description ||
    service.summary ||
    "Professional marketing service.";


  const category =
    service.category ||
    "Marketing";


  const price =
    Number(

      service.price ??

      service.amount ??

      service.cost ??

      service.marketingPrice ??

      0

    ) || 0;


  const currency =
    service.currency ||
    "USD";


  /*
    ACCESS / PLAN
  */

  const access =
    String(

      service.access ??

      service.accessType ??

      service.membership ??

      service.planType ??

      service.plan ??

      ""

    )
    .toLowerCase()
    .trim();


  /*
    Determine FREE.

    Any of these means free:
    - isFree true
    - free true
    - access = free
    - price = 0
  */

  const isFree =

    service.isFree === true ||

    service.free === true ||

    access === "free" ||

    price <= 0;


  /*
    ALWAYS use Firebase document ID.

    Never generate a new ID.
  */

  const id =
    firebaseId;


  /*
    FREE:

    marketing-free.html?id=FIREBASE_ID

    PLAN:

    marketing-order.html?id=FIREBASE_ID
  */

  const actionUrl =

    isFree

      ? "marketing-free.html?id=" +
        encodeURIComponent(id)

      : "marketing-order.html?id=" +
        encodeURIComponent(id);


  const actionText =

    isFree

      ? "Get Free Service"

      : "Order This Service";


  const buttonClass =

    isFree

      ? "buy free-buy"

      : "buy";


  const features =

    Array.isArray(
      service.features
    )

      ? service.features

      : [];


  /*
    MAIN HERO
  */

  page.className =
    "card hero";


  page.innerHTML = `

    <span class="tag">

      ${escapeHTML(category)}

    </span>


    <h1>

      ${escapeHTML(title)}

    </h1>


    <p class="description">

      ${escapeHTML(description)}

    </p>


    ${
      isFree

        ? `

          <div class="price free-price">

            FREE

          </div>

        `

        : `

          <div class="price">

            ${escapeHTML(currency)}

            ${formatNumber(price)}

          </div>

        `
    }


    <a
      class="${buttonClass}"
      href="${actionUrl}"
    >

      ${actionText}

    </a>


    <div class="meta">


      ${
        service.duration

          ? `

            <span>

              Duration:
              ${escapeHTML(
                service.duration
              )}

            </span>

          `

          : ""

      }


      ${
        service.delivery

          ? `

            <span>

              Delivery:
              ${escapeHTML(
                service.delivery
              )}

            </span>

          `

          : ""

      }


      ${
        service.type

          ? `

            <span>

              Type:
              ${escapeHTML(
                service.type
              )}

            </span>

          `

          : ""

      }


      <span class="service-id">

        ID:
        ${escapeHTML(id)}

      </span>


    </div>

  `;


  /*
    ABOUT
  */

  const content =

    service.content ||

    service.details ||

    service.longDescription;


  if(content){

    appendSection(`

      <section class="card">

        <h2 class="section-title">

          About This Service

        </h2>


        <div class="content">

          ${escapeHTML(content)
            .replace(/\n/g,"<br>")}

        </div>

      </section>

    `);

  }


  /*
    FEATURES
  */

  if(features.length){

    appendSection(`

      <section class="card">

        <h2 class="section-title">

          What's Included

        </h2>


        <div class="features">

          ${

            features
              .map(feature => `

                <div class="feature">

                  ✓

                  ${escapeHTML(

                    typeof feature === "object"

                      ? feature.title ||
                        feature.name ||
                        feature.description ||
                        ""

                      : feature

                  )}

                </div>

              `)
              .join("")

          }

        </div>

      </section>

    `);

  }


  /*
    FINAL CTA
  */

  appendSection(`

    <section class="card">

      <h2 class="section-title">

        ${
          isFree

            ? "Get Started for Free"

            : "Ready to Order?"

        }

      </h2>


      <p class="description">

        ${
          isFree

            ? "Continue to access this free marketing service."

            : "Continue to checkout to submit your marketing requirements."

        }

      </p>


      <a
        class="${buttonClass}"
        href="${actionUrl}"
      >

        ${actionText}

      </a>

    </section>

  `);


  /*
    SEO canonical for this Firebase ID
  */

  updateSEO(
    title,
    description,
    id
  );

}


/* ==================================================
   APPEND SECTION
================================================== */

function appendSection(
  html
){

  document
    .querySelector("main")
    .insertAdjacentHTML(
      "beforeend",
      html
    );

}


/* ==================================================
   SEO
================================================== */

function updateSEO(
  title,
  description,
  id
){

  document.title =
    title +
    " | LetsStudy Pro";


  const meta =
    document.querySelector(
      'meta[name="description"]'
    );


  if(meta){

    meta.setAttribute(
      "content",
      description
    );

  }


  /*
    Keep Firebase ID in canonical URL.
  */

  let canonical =
    document.querySelector(
      'link[rel="canonical"]'
    );


  if(!canonical){

    canonical =
      document.createElement(
        "link"
      );

    canonical.rel =
      "canonical";

    document.head.appendChild(
      canonical
    );

  }


  canonical.href =
    location.origin +
    location.pathname +
    "?id=" +
    encodeURIComponent(id);

}


/* ==================================================
   ERROR
================================================== */

function showError(
  message
){

  page.className =
    "error";


  page.innerHTML = `

    <h2>

      Unable to Open Service

    </h2>


    <p style="margin-top:10px">

      ${escapeHTML(message)}

    </p>


    <button
      type="button"
      onclick="history.back()"
    >

      ← Go Back

    </button>

  `;

}


/* ==================================================
   NUMBER FORMAT
================================================== */

function formatNumber(
  value
){

  return new Intl.NumberFormat(

    undefined,

    {
      maximumFractionDigits:0
    }

  ).format(

    Number(value) || 0

  );

}


/* ==================================================
   SECURITY
================================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>
</html>
