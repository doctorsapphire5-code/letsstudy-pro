  const category = text(s.category) || "Marketing";
  const price = Number(s.price ?? s.amount ?? s.cost ?? s.marketingPrice ?? 0) || 0;
  const access = text(s.access ?? s.accessType ?? s.membership ?? s.planType ?? s.plan).toLowerCase();
  const isFree = s.isFree === true || s.free === true || access === "free" || price <= 0;

  const url = (isFree ? "marketing-free.html" : "marketing-order.html") + "?id=" + encodeURIComponent(serviceId);
  const actionText = isFree ? "Get free service" : "Order this service";
  const btnClass = isFree ? "buy free-buy" : "buy";

  document.title = title + " | LetsStudy Pro";
  $("tag").textContent = category;
  $("title").textContent = title;
  $("description").textContent = description;

  const priceEl = $("price");
  priceEl.textContent = isFree ? "FREE" : formatTZS(price);
  priceEl.className = isFree ? "price free-price" : "price";

  [$("actionBtn"), $("ctaBtn")].forEach(a => { a.href = url; a.textContent = actionText; a.className = btnClass; });
  $("ctaTitle").textContent = isFree ? "Get started for free" : "Ready to order?";
  $("ctaText").textContent = isFree
    ? "Continue to access this free marketing service."
    : "Continue to checkout to submit your marketing requirements.";

  /* Meta chips (the internal document ID is no longer shown to visitors) */
  const meta = $("meta");
  meta.replaceChildren();
  [["Duration", s.duration], ["Delivery", s.delivery], ["Type", s.type]].forEach(([k, v]) => {
    if(text(v)) meta.appendChild(el("span","", k + ": " + text(v)));
  });
  meta.style.display = meta.children.length ? "flex" : "none";

  const about = text(s.content || s.details || s.longDescription);
  $("about").textContent = about;
  $("aboutCard").style.display = about ? "block" : "none";

  const feats = (Array.isArray(s.features) ? s.features : []).map(f =>
    (f && typeof f === "object") ? text(f.title || f.name || f.description) : text(f)
  ).filter(Boolean);
  const fbox = $("features");
  fbox.replaceChildren();
  feats.forEach(f => fbox.appendChild(el("div","feature", f)));
  $("featuresCard").style.display = feats.length ? "block" : "none";

  const desc = clip(description, 155);
  setMeta('meta[name="description"]',"content",desc);
  setMeta('meta[property="og:title"]',"content",document.title);
  setMeta('meta[property="og:description"]',"content",desc);
  setMeta("#canonicalLink","href",location.origin + location.pathname + "?id=" + encodeURIComponent(serviceId));

  errorBox.style.display = "none";
  page.classList.remove("is-loading");
  page.classList.add("ready");
}

function showError(message){
  page.style.display = "none";
  errorBox.replaceChildren(el("h2","","Unable to open service"), el("p","",message));
  const b = el("button","","← Go back"); b.type = "button";
  b.addEventListener("click", () => { if(history.length > 1) history.back(); else location.href = "index.html"; });
  errorBox.appendChild(b);
  errorBox.style.display = "block";
}

function readCache(){
  try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); return c && c.data ? c : null; }catch(e){ return null; }
}
function writeCache(data){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); }catch(e){}
}

async function init(){
  if(!serviceId){ showError("No marketing service was selected."); return; }

  const cached = readCache();
  if(cached) render(cached.data);
  if(cached && Date.now() - cached.t < 60000) return;

  try{
    const snap = await getDoc(doc(db, "marketing", serviceId));
    if(!snap.exists()){
      try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
      showError("This marketing service was not found.");
      return;
    }
    const data = JSON.parse(JSON.stringify(snap.data() || {}));
    if(!cached || JSON.stringify(cached.data) !== JSON.stringify(data)) render(data);
    writeCache(data);
  }catch(err){
    console.error("Marketing details error:", err);
    if(!cached) showError("Could not load this service. Check your connection and try again.");
  }
}

/* Share: native sheet on phones, copy link elsewhere */
const toast = el("div","toast"); toast.setAttribute("role","status");
document.body.appendChild(toast);
let toastTimer;
function notify(msg){
  toast.textContent = msg; toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}
async function copyLink(url){
  try{ await navigator.clipboard.writeText(url); }
  catch(e){
    const t = document.createElement("textarea");
    t.value = url; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); }catch(_){}
    t.remove();
  }
  notify("Link copied");
}
$("shareBtn").addEventListener("click", async () => {
  const url = location.origin + location.pathname + "?id=" + encodeURIComponent(serviceId);
  const data = {
    title: ($("title").textContent || "Marketing service") + " | LetsStudy Pro",
    text: clip($("description").textContent || "Marketing service on LetsStudy Pro", 120),
    url
  };
  if(navigator.share){
    try{ await navigator.share(data); }
    catch(e){ if(e.name !== "AbortError") copyLink(url); }
  }else{
    copyLink(url);
  }
});

init();
