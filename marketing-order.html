<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Marketing Order | LetsStudy Pro</title>

<meta name="description"
content="View your marketing order details and status on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.5;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:900px;
  margin:30px auto;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:23px;
  margin-bottom:16px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

h1{
  font-size:27px;
  margin-bottom:5px;
}

.muted{
  color:#64748b;
  font-size:13px;
}

.status{
  padding:7px 11px;
  border-radius:8px;
  background:#eff6ff;
  color:#2563eb;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}

.status.completed{
  background:#ecfdf5;
  color:#047857;
}

.status.cancelled,
.status.failed{
  background:#fef2f2;
  color:#b91c1c;
}

.status.processing{
  background:#fff7ed;
  color:#c2410c;
}

.section-title{
  font-size:18px;
  margin-bottom:15px;
}

.rows{
  display:flex;
  flex-direction:column;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:12px 0;
  border-bottom:1px solid #eef0f3;
  font-size:14px;
}

.row:last-child{
  border-bottom:0;
}

.label{
  color:#64748b;
}

.value{
  text-align:right;
  font-weight:700;
  max-width:60%;
  overflow-wrap:anywhere;
}

.total{
  margin-top:8px;
  padding-top:16px;
  border-top:1px solid #dbe2ea;
  font-size:19px;
  font-weight:800;
}

.timeline{
  display:flex;
  flex-direction:column;
  gap:0;
}

.step{
  display:flex;
  gap:13px;
  position:relative;
  padding-bottom:22px;
}

.step:last-child{
  padding-bottom:0;
}

.dot{
  width:12px;
  height:12px;
  min-width:12px;
  border-radius:50%;
  background:#cbd5e1;
  margin-top:5px;
}

.step.active .dot{
  background:#2563eb;
}

.step.done .dot{
  background:#16a34a;
}

.step:not(:last-child)::after{
  content:"";
  position:absolute;
  left:5px;
  top:17px;
  width:2px;
  height:calc(100% - 5px);
  background:#e2e8f0;
}

.step-title{
  font-weight:700;
  font-size:14px;
}

.step-date{
  color:#64748b;
  font-size:11px;
  margin-top:3px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  text-decoration:none;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2f7;
  color:#172033;
}

.loading,
.error{
  background:#fff;
  border-radius:15px;
  padding:50px 20px;
  text-align:center;
}

.error{
  color:#b91c1c;
}

@media(max-width:600px){

  .header{
    flex-direction:column;
  }

  .status{
    align-self:flex-start;
  }

  .row{
    flex-direction:column;
    gap:4px;
  }

  .value{
    text-align:left;
    max-width:100%;
  }

}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <div id="page" class="loading">
    Loading order...
  </div>

</main>


<script>

/*
==================================================
MARKETING-ORDER.HTML

URL:

marketing-order.html?orderId=ORDER_ID

OPTIONAL:

&userId=USER_ID

API:

GET
/api/data?collection=marketingOrders&id=ORDER_ID

NO DIRECT FIREBASE
==================================================
*/


const params =
  new URLSearchParams(
    location.search
  );


const orderId =
  params.get("orderId") ||
  params.get("id") ||
  "";


const userId =
  params.get("userId") ||
  params.get("uid") ||
  "";


const page =
  document.getElementById(
    "page"
  );


let order = null;


/* =========================
   VALIDATE
========================= */

if(!orderId){

  showError(
    "No marketing order was selected."
  );

}else{

  loadOrder();

}


/* =========================
   LOAD ORDER
========================= */

async function loadOrder(){

  try{

    const response =
      await fetch(
        "/api/data?collection=marketingOrders&id=" +
        encodeURIComponent(
          orderId
        )
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load order."
      );

    }


    order =
      result.data ||
      result.order ||
      result.item;


    if(!order){

      throw new Error(
        "Marketing order not found."
      );

    }


    renderOrder();

  }catch(error){

    console.error(
      "MARKETING ORDER:",
      error
    );

    showError(
      error.message
    );

  }

}


/* =========================
   RENDER
========================= */

function renderOrder(){

  const title =
    order.itemName ||
    order.campaignName ||
    "Marketing Order";


  const id =
    order.orderId ||
    order.id ||
    orderId;


  const status =
    String(
      order.status ||
      "pending"
    ).toLowerCase();


  const amount =
    Number(
      order.amount ||
      order.total ||
      0
    );


  const currency =
    order.currency ||
    "TZS";


  page.className =
    "";


  page.innerHTML = `

    <section class="card">

      <div class="header">

        <div>

          <h1>
            ${escapeHTML(title)}
          </h1>

          <p class="muted">

            Order #${escapeHTML(id)}

          </p>

        </div>


        <div
          class="status ${statusClass(status)}"
        >

          ${escapeHTML(
            formatStatus(status)
          )}

        </div>

      </div>

    </section>


    <section class="card">

      <h2 class="section-title">
        Order Details
      </h2>


      <div class="rows">

        <div class="row">

          <span class="label">
            Service
          </span>

          <strong class="value">
            ${escapeHTML(title)}
          </strong>

        </div>


        <div class="row">

          <span class="label">
            Order ID
          </span>

          <strong class="value">
            ${escapeHTML(id)}
          </strong>

        </div>


        <div class="row">

          <span class="label">
            Payment
          </span>

          <strong class="value">
            ${escapeHTML(
              formatStatus(
                order.paymentStatus ||
                order.payment_status ||
                "pending"
              )
            )}
          </strong>

        </div>


        <div class="row">

          <span class="label">
            Payment Method
          </span>

          <strong class="value">
            ${escapeHTML(
              formatStatus(
                order.paymentMethod ||
                "Not specified"
              )
            )}
          </strong>

        </div>


        <div class="row">

          <span class="label">
            Created
          </span>

          <strong class="value">
            ${escapeHTML(
              formatDate(
                order.createdAt
              )
            )}
          </strong>

        </div>


        <div class="row total">

          <span>
            Total
          </span>

          <span>
            ${escapeHTML(currency)}
            ${formatNumber(amount)}
          </span>

        </div>

      </div>

    </section>


    <section class="card">

      <h2 class="section-title">
        Customer
      </h2>


      <div class="rows">

        <div class="row">

          <span class="label">
            Name
          </span>

          <strong class="value">
            ${escapeHTML(
              order.customer?.name ||
              order.customerName ||
              "—"
            )}
          </strong>

        </div>


        <div class="row">

          <span class="label">
            Email
          </span>

          <strong class="value">
            ${escapeHTML(
              order.customer?.email ||
              order.email ||
              "—"
            )}
          </strong>

        </div>


        <div class="row">

          <span class="label">
            Phone
          </span>

          <strong class="value">
            ${escapeHTML(
              order.customer?.phone ||
              order.phone ||
              "—"
            )}
          </strong>

        </div>

      </div>

    </section>


    ${
      order.notes
      ? `

        <section class="card">

          <h2 class="section-title">
            Requirements
          </h2>

          <p class="muted">
            ${escapeHTML(
              order.notes
            )}
          </p>

        </section>

      `
      : ""
    }


    <section class="card">

      <h2 class="section-title">
        Order Progress
      </h2>


      <div class="timeline">

        ${timeline(
          status,
          order
        )}

      </div>

    </section>


    <section class="card">

      <div class="actions">

        <a
          href="marketing-dashboard.html${
            userId
            ? "?userId=" +
              encodeURIComponent(userId)
            : ""
          }"
          class="btn secondary"
        >
          Marketing Dashboard
        </a>


        <a
          href="marketing.html"
          class="btn primary"
        >
          Marketing Services
        </a>

      </div>

    </section>

  `;

}


/* =========================
   TIMELINE
========================= */

function timeline(
  status,
  data
){

  const stages = [

    {
      key:"pending",
      title:"Order Received",
      date:data.createdAt
    },

    {
      key:"processing",
      title:"Processing",
      date:data.processingAt
    },

    {
      key:"active",
      title:"Marketing In Progress",
      date:data.startedAt
    },

    {
      key:"completed",
      title:"Completed",
      date:data.completedAt
    }

  ];


  const orderIndex =
    stages.findIndex(
      stage =>
        stage.key === status
    );


  return stages
    .map(
      (stage,index) => {

        let state = "";


        if(
          status === "cancelled" ||
          status === "failed"
        ){

          state =
            index === 0
            ? "done"
            : "";

        }else if(
          index < orderIndex
        ){

          state = "done";

        }else if(
          index === orderIndex
        ){

          state = "active";

        }


        return `

          <div class="step ${state}">

            <div class="dot"></div>

            <div>

              <div class="step-title">

                ${escapeHTML(
                  stage.title
                )}

              </div>

              ${
                stage.date
                ? `

                  <div class="step-date">

                    ${escapeHTML(
                      formatDate(
                        stage.date
                      )
                    )}

                  </div>

                `
                : ""
              }

            </div>

          </div>

        `;

      }
    )
    .join("");

}


/* =========================
   STATUS CLASS
========================= */

function statusClass(
  status
){

  if(status === "completed")
    return "completed";

  if(
    status === "cancelled" ||
    status === "failed"
  )
    return "cancelled";

  if(
    status === "processing" ||
    status === "active"
  )
    return "processing";

  return "";

}


/* =========================
   FORMAT STATUS
========================= */

function formatStatus(
  value
){

  return String(
    value || ""
  )
  .replace(
    /_/g,
    " "
  )
  .replace(
    /\b\w/g,
    char =>
      char.toUpperCase()
  );

}


/* =========================
   NUMBER
========================= */

function formatNumber(
  value
){

  return new Intl.NumberFormat(
    undefined,
    {
      maximumFractionDigits:0
    }
  ).format(
    Number(value) || 0
  );

}


/* =========================
   DATE
========================= */

function formatDate(
  value
){

  if(!value)
    return "—";


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return String(value);

  }


  return date.toLocaleString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   ERROR
========================= */

function showError(
  text
){

  page.className =
    "error";


  page.innerHTML = `

    <h2>
      Unable to open order
    </h2>

    <p style="margin-top:10px">
      ${escapeHTML(text)}
    </p>

    <button
      class="btn secondary"
      style="margin-top:20px"
      onclick="history.back()"
    >
      Go Back
    </button>

  `;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
