<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Promotion | LetsStudy Pro</title>

<meta name="description"
content="View promotion details and continue to order on LetsStudy Pro.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

a{
 text-decoration:none;
 color:inherit
}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 padding:0 6%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:800
}

.nav{
 display:flex;
 gap:18px;
 font-size:13px;
 font-weight:700
}

.container{
 max-width:1100px;
 margin:30px auto;
 padding:0 20px
}

.back{
 display:inline-flex;
 align-items:center;
 gap:7px;
 color:#667085;
 font-size:13px;
 font-weight:700;
 margin-bottom:18px
}

.view{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:18px;
 overflow:hidden;
 display:grid;
 grid-template-columns:1.05fr 1fr
}

.image{
 min-height:430px;
 background:#eef2f6
}

.image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.content{
 padding:35px
}

.badge{
 display:inline-block;
 background:#fff3cd;
 color:#9a6700;
 padding:6px 11px;
 border-radius:20px;
 font-size:10px;
 font-weight:800;
 text-transform:uppercase
}

.type{
 margin-top:18px;
 color:#155eef;
 font-size:11px;
 font-weight:800;
 text-transform:uppercase
}

h1{
 font-size:32px;
 line-height:1.25;
 margin:9px 0 15px
}

.description{
 color:#667085;
 line-height:1.8;
 font-size:14px;
 white-space:pre-line
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin:20px 0
}

.tag{
 background:#f2f4f7;
 color:#475467;
 padding:7px 10px;
 border-radius:20px;
 font-size:11px
}

.info{
 border-top:1px solid #eaecf0;
 border-bottom:1px solid #eaecf0;
 padding:16px 0;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin:20px 0
}

.info-item{
 font-size:12px;
 color:#667085
}

.info-item strong{
 display:block;
 color:#172033;
 font-size:13px;
 margin-top:4px
}

.price{
 font-size:26px;
 font-weight:800;
 margin:20px 0
}

.price small{
 font-size:11px;
 color:#667085;
 font-weight:500
}

.actions{
 display:flex;
 gap:9px
}

.btn{
 flex:1;
 padding:13px 16px;
 border-radius:9px;
 text-align:center;
 font-size:12px;
 font-weight:800
}

.primary{
 background:#155eef;
 color:#fff
}

.secondary{
 background:#eef2f6
}

.loading,
.error{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:16px;
 padding:70px 20px;
 text-align:center;
 color:#667085
}

.error i{
 font-size:28px;
 margin-bottom:10px
}

@media(max-width:750px){

 .nav{
  display:none
 }

 .view{
  grid-template-columns:1fr
 }

 .image{
  min-height:250px
 }

 .content{
  padding:24px
 }

 h1{
  font-size:26px
 }

 .info{
  grid-template-columns:1fr
 }

 .actions{
  flex-direction:column
 }
}
</style>
</head>

<body>

<header class="top">

<a href="marketing.html" class="logo">
LetsStudy Pro
</a>

<nav class="nav">
<a href="course.html">Courses</a>
<a href="marketplace.html">Marketplace</a>
<a href="scholarships.html">Scholarships</a>
<a href="careers.html">Careers</a>
</nav>

</header>

<main class="container">

<a href="marketing.html" class="back">
<i class="fa fa-arrow-left"></i>
Back to Marketing
</a>

<div id="view">

<div class="loading">
<i class="fa fa-spinner fa-spin"></i>
<p>Loading promotion...</p>
</div>

</div>

</main>

<script type="module">

import {
 initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 doc,
 getDoc,
 updateDoc,
 increment
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXKbljsYrgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const view=document.getElementById("view");

const params=
new URLSearchParams(
window.location.search
);

const id=params.get("id");


function esc(value=""){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function money(c){

const price=Number(c.price||0);

if(!price){
 return "Free";
}

return `${esc(c.currency||"TZS")} ${price.toLocaleString()}`;

}


async function loadPromotion(){

if(!id){

showError(
"Promotion not found",
"Missing promotion ID."
);

return;
}


try{

const ref=
doc(
db,
"marketingCampaigns",
id
);

const snap=
await getDoc(ref);


if(!snap.exists()){

showError(
"Promotion not found",
"This promotion may have been removed."
);

return;
}


const c={
 id:snap.id,
 ...snap.data()
};


if(c.status!=="published"){

showError(
"Promotion unavailable",
"This promotion is no longer available."
);

return;
}


/* IMPRESSION */

try{

await updateDoc(
ref,
{
impressions:
increment(1)
}
);

}catch(e){

console.log(
"Impression tracking unavailable",
e
);

}


render(c);


}catch(error){

console.error(error);

showError(
"Unable to load promotion",
"Please try again later."
);

}

}


function render(c){

const image=
c.imageUrl||
"https://via.placeholder.com/900x600?text=Promotion";


const tags=[];


if(c.audience)
 tags.push(c.audience);

if(c.coupon)
 tags.push("Coupon: "+c.coupon);

if(c.duration)
 tags.push(c.duration);


view.innerHTML=`

<section class="view">

<div class="image">

<img
src="${esc(image)}"
alt="${esc(c.title||"Promotion")}">

</div>


<div class="content">


${
c.featured
?
`
<span class="badge">
<i class="fa fa-star"></i>
Featured
</span>
`
:""
}


<div class="type">

${esc(
c.type||
"Promotion"
)}

</div>


<h1>

${esc(
c.title||
"Promotion"
)}

</h1>


<div class="description">

${esc(
c.description||
"Discover this opportunity from LetsStudy Pro."
)}

</div>


<div class="tags">

${
tags.map(
tag=>`
<span class="tag">
${esc(tag)}
</span>
`
).join("")
}

</div>


<div class="info">


<div class="info-item">

Audience

<strong>
${esc(
c.audience||
"Everyone"
)}
</strong>

</div>


<div class="info-item">

Promotion Type

<strong>
${esc(
c.type||
"Promotion"
)}
</strong>

</div>


<div class="info-item">

Views

<strong>
${Number(
c.impressions||0
).toLocaleString()}
</strong>

</div>


<div class="info-item">

Clicks

<strong>
${Number(
c.clicks||0
).toLocaleString()}
</strong>

</div>


</div>


<div class="price">

${money(c)}

${
c.price
?
`<small>promotion price</small>`
:""
}

</div>


<div class="actions">


<a
class="btn primary"
href="marketing-order.html?id=${encodeURIComponent(c.id)}">

Continue

<i class="fa fa-arrow-right"></i>

</a>


<a
class="btn secondary"
href="marketing.html">

Back

</a>


</div>


</div>

</section>

`;

}


function showError(title,text){

view.innerHTML=`

<div class="error">

<i class="fa fa-circle-exclamation"></i>

<h2>
${esc(title)}
</h2>

<p>
${esc(text)}
</p>

<a
href="marketing.html"
class="btn primary"
style="display:inline-block;margin-top:10px">

Back to Marketing

</a>

</div>

`;

}


loadPromotion();

</script>

</body>
</html>
