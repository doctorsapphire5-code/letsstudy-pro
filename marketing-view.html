<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Promotion | LetsStudy Pro</title>

<meta name="description"
content="View LetsStudy Pro promotion details and explore this opportunity.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

a{
 text-decoration:none;
 color:inherit
}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 padding:0 6%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:800
}

.nav{
 display:flex;
 gap:18px;
 font-size:13px;
 font-weight:700
}

.container{
 max-width:1100px;
 margin:30px auto;
 padding:0 20px
}

.back{
 display:inline-flex;
 align-items:center;
 gap:7px;
 color:#155eef;
 font-size:13px;
 font-weight:700;
 margin-bottom:18px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 10px 30px #00000008
}

.image{
 width:100%;
 height:380px;
 background:#eef2f6
}

.image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.content{
 padding:30px
}

.badge{
 display:inline-block;
 background:#fff3cd;
 color:#9a6700;
 padding:7px 11px;
 border-radius:20px;
 font-size:10px;
 font-weight:800;
 text-transform:uppercase
}

.type{
 margin-top:15px;
 color:#155eef;
 font-size:11px;
 font-weight:800;
 text-transform:uppercase
}

h1{
 margin:8px 0 14px;
 font-size:34px
}

.description{
 color:#667085;
 line-height:1.8;
 font-size:14px;
 white-space:pre-line
}

.meta{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin:20px 0
}

.tag{
 background:#f2f4f7;
 padding:8px 11px;
 border-radius:20px;
 font-size:11px;
 color:#475467
}

.cta{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:8px;
 background:#155eef;
 color:#fff;
 padding:13px 20px;
 border-radius:9px;
 font-size:13px;
 font-weight:800;
 border:0;
 cursor:pointer
}

.stats{
 display:flex;
 gap:20px;
 margin-top:20px;
 padding-top:18px;
 border-top:1px solid #eee;
 color:#667085;
 font-size:12px
}

.loading,
.error{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:60px 20px;
 text-align:center;
 color:#667085
}

@media(max-width:600px){

 .nav{
  display:none
 }

 .container{
  padding:0 15px
 }

 .image{
  height:230px
 }

 .content{
  padding:20px
 }

 h1{
  font-size:27px
 }

}
</style>
</head>

<body>

<header class="top">

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<nav class="nav">

<a href="course.html">
Courses
</a>

<a href="marketplace.html">
Marketplace
</a>

<a href="scholarships.html">
Scholarships
</a>

<a href="careers.html">
Careers
</a>

</nav>

</header>


<main class="container">

<a href="marketing.html" class="back">

<i class="fa fa-arrow-left"></i>

Back to Marketing

</a>


<div id="page">

<div class="loading">

<i class="fa fa-spinner fa-spin"></i>

<p>
Loading promotion...
</p>

</div>

</div>

</main>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 doc,
 getDoc,
 updateDoc,
 increment
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
 FIREBASE
========================= */

const firebaseConfig={

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsYrgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

 measurementId:
 "G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =========================
 DOM
========================= */

const page=
document.getElementById("page");


/* =========================
 ESCAPE
========================= */

function esc(value=""){

 return String(value)

 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* =========================
 GET ID
========================= */

const params=
new URLSearchParams(
location.search
);

const id=
params.get("id");


/* =========================
 LOAD
========================= */

async function load(){

 if(!id){

  page.innerHTML=`

   <div class="error">

    <i class="fa fa-circle-exclamation"
       style="font-size:35px">
    </i>

    <h2>
     Promotion not found
    </h2>

    <p>
     Campaign ID is missing.
    </p>

    <a
     href="marketing.html"
     class="cta">

     Back to Marketing

    </a>

   </div>

  `;

  return;

 }


 try{

  const snap=
   await getDoc(
    doc(
     db,
     "marketingCampaigns",
     id
    )
   );


  if(!snap.exists()){

   showError(
    "Promotion not found",
    "This promotion does not exist or has been removed."
   );

   return;

  }


  const c={
   id:snap.id,
   ...snap.data()
  };


  if(c.status!=="published"){

   showError(
    "Promotion unavailable",
    "This promotion is currently not available."
   );

   return;

  }


  render(c);


 }catch(error){

  console.error(error);

  showError(
   "Unable to load promotion",
   "Please try again later."
  );

 }

}


/* =========================
 RENDER
========================= */

function render(c){

 page.innerHTML=`

 <article class="card">


  <div class="image">

   <img
    src="${esc(
     c.imageUrl||
     "https://via.placeholder.com/1000x600?text=Promotion"
    )}"

    alt="${esc(
     c.title||
     "Promotion"
    )}"

    onerror="
     this.src='https://via.placeholder.com/1000x600?text=Promotion'
    "
   >

  </div>


  <div class="content">


   ${
    c.featured

    ?

    `<span class="badge">

      <i class="fa fa-star"></i>

      Featured Promotion

     </span>`

    :

    ""

   }


   <div class="type">

    ${esc(
     c.type||
     "Promotion"
    )}

   </div>


   <h1>

    ${esc(
     c.title||
     "Promotion"
    )}

   </h1>


   <div class="description">

    ${esc(
     c.description||
     c.shortDescription||
     "Discover this opportunity from LetsStudy Pro."
    )}

   </div>


   <div class="meta">


    <span class="tag">

     <i class="fa fa-users"></i>

     ${esc(
      c.audience||
      "Everyone"
     )}

    </span>


    ${
     c.coupon

     ?

     `<span class="tag">

       <i class="fa fa-ticket"></i>

       Coupon:
       ${esc(c.coupon)}

      </span>`

     :

     ""

    }


    ${
     c.startDate

     ?

     `<span class="tag">

       <i class="fa fa-calendar"></i>

       ${esc(c.startDate)}

      </span>`

     :

     ""

    }


    ${
     c.endDate

     ?

     `<span class="tag">

       <i class="fa fa-calendar-xmark"></i>

       ${esc(c.endDate)}

      </span>`

     :

     ""

    }


   </div>


   <button
    class="cta"
    onclick="openTarget()">

    Explore Now

    <i class="fa fa-arrow-right"></i>

   </button>


   <div class="stats">


    <span>

     <i class="fa fa-eye"></i>

     ${Number(
      c.impressions||0
     ).toLocaleString()}

     views

    </span>


    <span>

     <i class="fa fa-mouse-pointer"></i>

     ${Number(
      c.clicks||0
     ).toLocaleString()}

     clicks

    </span>


   </div>


  </div>

 </article>

 `;


 window.currentTarget=
  c.targetUrl||"#";

 window.currentCampaignId=
  c.id;

}


/* =========================
 OPEN TARGET
========================= */

window.openTarget=
async function(){

 const target=
  window.currentTarget;


 const campaignId=
  window.currentCampaignId;


 try{

  await updateDoc(

   doc(
    db,
    "marketingCampaigns",
    campaignId
   ),

   {
    clicks:
     increment(1)
   }

  );

 }catch(error){

  console.log(
   "Click tracking unavailable",
   error
  );

 }


 if(target && target!=="#"){

  location.href=target;

 }else{

  alert(
   "This promotion does not have a target link."
  );

 }

};


/* =========================
 ERROR
========================= */

function showError(title,text){

 page.innerHTML=`

 <div class="error">

  <i
   class="fa fa-triangle-exclamation"
   style="font-size:35px">
  </i>

  <h2>
   ${esc(title)}
  </h2>

  <p>
   ${esc(text)}
  </p>

  <a
   href="marketing.html"
   class="cta">

   Back to Marketing

  </a>

 </div>

 `;

}


/* =========================
 START
========================= */

load();

</script>

</body>
</html>
