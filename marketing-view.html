<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Marketing Service | LetsStudy Pro</title>

<meta name="description"
content="View marketing service details and place an order on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.55;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:950px;
  margin:30px auto;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:17px;
  padding:25px;
  margin-bottom:16px;
}

.hero{
  padding:32px 25px;
}

.tag{
  display:inline-block;
  background:#eff6ff;
  color:#2563eb;
  padding:6px 9px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
  margin-bottom:12px;
}

h1{
  font-size:32px;
  line-height:1.2;
  margin-bottom:9px;
}

.description{
  color:#64748b;
  max-width:750px;
}

.price{
  font-size:27px;
  font-weight:800;
  margin-top:20px;
}

.buy{
  display:inline-block;
  margin-top:18px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:12px 18px;
  border-radius:9px;
  font-weight:800;
}

.section-title{
  font-size:19px;
  margin-bottom:13px;
}

.content{
  color:#475569;
  font-size:14px;
}

.features{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.feature{
  border:1px solid #e5e7eb;
  padding:12px;
  border-radius:9px;
  font-size:13px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin-top:18px;
  color:#64748b;
  font-size:12px;
}

.loading,
.error{
  background:#fff;
  padding:55px 20px;
  border-radius:15px;
  text-align:center;
}

.error{
  color:#b91c1c;
}

@media(max-width:600px){

  .hero{
    padding:23px 18px;
  }

  h1{
    font-size:27px;
  }

  .features{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>

  <a
    href="index.html"
    class="logo"
  >
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <div
    id="page"
    class="loading"
  >
    Loading marketing service...
  </div>

</main>


<script>

/*
==================================================
MARKETING-VIEW.HTML

URL:

marketing-view.html?id=MARKETING_ID

API:

GET
/api/data?collection=marketing&id=MARKETING_ID

NO DIRECT FIREBASE
==================================================
*/


const params =
  new URLSearchParams(
    location.search
  );


const id =
  params.get("id") ||
  params.get("marketingId") ||
  params.get("documentId") ||
  "";


const page =
  document.getElementById(
    "page"
  );


let service = null;


/* =========================
   VALIDATE
========================= */

if(!id){

  showError(
    "No marketing service was selected."
  );

}else{

  loadService();

}


/* =========================
   LOAD
========================= */

async function loadService(){

  try{

    const response =
      await fetch(
        "/api/data?collection=marketing&id=" +
        encodeURIComponent(
          id
        )
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load marketing service."
      );

    }


    service =
      result.data ||
      result.item ||
      result.service;


    if(!service){

      throw new Error(
        "Marketing service not found."
      );

    }


    render();

  }catch(error){

    console.error(
      "MARKETING VIEW:",
      error
    );


    showError(
      error.message
    );

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const title =
    service.title ||
    service.name ||
    "Marketing Service";


  const description =
    service.description ||
    service.summary ||
    "Professional marketing service.";


  const category =
    service.category ||
    "Marketing";


  const price =
    Number(
      service.price ||
      service.amount ||
      0
    );


  const currency =
    service.currency ||
    "TZS";


  const features =
    Array.isArray(
      service.features
    )
    ? service.features
    : [];


  const checkout =
    "checkout-marketing.html?id=" +
    encodeURIComponent(
      service.documentId ||
      service.id ||
      id
    );


  page.className = "";


  page.innerHTML = `

    <section class="card hero">

      <span class="tag">

        ${escapeHTML(category)}

      </span>


      <h1>

        ${escapeHTML(title)}

      </h1>


      <p class="description">

        ${escapeHTML(description)}

      </p>


      ${
        price > 0
        ? `

          <div class="price">

            ${escapeHTML(currency)}
            ${formatNumber(price)}

          </div>

        `
        : ""
      }


      <a
        class="buy"
        href="${checkout}"
      >

        Get Started

      </a>


      <div class="meta">

        ${
          service.duration
          ? `
            <span>
              Duration:
              ${escapeHTML(
                service.duration
              )}
            </span>
          `
          : ""
        }


        ${
          service.delivery
          ? `
            <span>
              Delivery:
              ${escapeHTML(
                service.delivery
              )}
            </span>
          `
          : ""
        }


        ${
          service.type
          ? `
            <span>
              Type:
              ${escapeHTML(
                service.type
              )}
            </span>
          `
          : ""
        }

      </div>

    </section>


    ${
      service.content ||
      service.details ||
      service.longDescription
      ? `

        <section class="card">

          <h2 class="section-title">
            About This Service
          </h2>

          <div class="content">

            ${escapeHTML(
              service.content ||
              service.details ||
              service.longDescription
            ).replace(
              /\n/g,
              "<br>"
            )}

          </div>

        </section>

      `
      : ""
    }


    ${
      features.length
      ? `

        <section class="card">

          <h2 class="section-title">
            What's Included
          </h2>


          <div class="features">

            ${
              features
                .map(
                  feature => `

                    <div class="feature">

                      ✓
                      ${escapeHTML(
                        typeof feature ===
                        "object"
                        ? feature.title ||
                          feature.name ||
                          ""
                        : feature
                      )}

                    </div>

                  `
                )
                .join("")
            }

          </div>

        </section>

      `
      : ""
    }


    <section class="card">

      <h2 class="section-title">
        Ready to Start?
      </h2>

      <p class="description">
        Continue to checkout to submit your marketing requirements.
      </p>

      <a
        class="buy"
        href="${checkout}"
      >
        Continue to Checkout
      </a>

    </section>

  `;

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  page.className =
    "error";


  page.innerHTML = `

    <h2>
      Unable to open service
    </h2>

    <p style="margin-top:10px">
      ${escapeHTML(message)}
    </p>

    <button
      class="back"
      style="margin-top:20px"
      onclick="history.back()"
    >
      Go Back
    </button>

  `;

}


/* =========================
   FORMAT
========================= */

function formatNumber(
  value
){

  return new Intl.NumberFormat(
    undefined,
    {
      maximumFractionDigits:0
    }
  ).format(
    Number(value) || 0
  );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
