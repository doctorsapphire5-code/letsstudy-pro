<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Marketing Services | LetsStudy Pro</title>

<meta name="description"
content="Discover professional marketing services on LetsStudy Pro. Explore services, compare offers and get started.">

<meta name="robots" content="index,follow">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.5;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1150px;
  margin:30px auto;
}

.hero{
  background:#fff;
  border-radius:18px;
  padding:32px 25px;
  margin-bottom:18px;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  color:#64748b;
  max-width:720px;
}

.search{
  width:100%;
  margin-top:20px;
  padding:13px 15px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  font-size:15px;
}

.toolbar{
  background:#fff;
  padding:14px;
  border-radius:13px;
  margin-bottom:17px;
}

select{
  padding:10px 12px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  background:#fff;
  min-width:200px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(255px,1fr));
  gap:15px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:19px;
  display:flex;
  flex-direction:column;
  min-height:245px;
}

.tag{
  display:inline-block;
  width:max-content;
  background:#eff6ff;
  color:#2563eb;
  padding:5px 9px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
  margin-bottom:11px;
}

.card h2{
  font-size:18px;
  margin-bottom:7px;
}

.description{
  color:#64748b;
  font-size:13px;
  flex:1;
}

.price{
  margin-top:15px;
  font-size:19px;
  font-weight:800;
}

.meta{
  color:#64748b;
  font-size:11px;
  margin-top:7px;
}

.view{
  display:block;
  text-align:center;
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}

.featured{
  border-color:#bfdbfe;
}

.featured-label{
  font-size:10px;
  color:#2563eb;
  font-weight:700;
  margin-bottom:8px;
}

.loading,
.empty,
.error{
  background:#fff;
  border-radius:15px;
  padding:55px 20px;
  text-align:center;
  color:#64748b;
}

.error{
  color:#b91c1c;
}

@media(max-width:600px){

  .hero h1{
    font-size:27px;
  }

  select{
    width:100%;
  }

}
</style>
</head>

<body>

<header>

  <a
    href="index.html"
    class="logo"
  >
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      Marketing Services
    </h1>

    <p>
      Explore marketing services designed to help
      businesses, creators and organizations grow.
    </p>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search marketing services..."
      autocomplete="off"
    >

  </section>


  <section class="toolbar">

    <select id="category">

      <option value="">
        All Categories
      </option>

    </select>

  </section>


  <section
    id="grid"
    class="grid"
  >

    <div class="loading">
      Loading marketing services...
    </div>

  </section>

</main>


<script>

/*
==================================================
MARKETING.HTML

PUBLIC PAGE

API:

GET
/api/data?collection=marketing&limit=100

SERVICE DETAILS:

marketing-view.html?id=SERVICE_ID

NO DIRECT FIREBASE
==================================================
*/


const grid =
  document.getElementById(
    "grid"
  );

const search =
  document.getElementById(
    "search"
  );

const category =
  document.getElementById(
    "category"
  );


let services = [];


/* =========================
   LOAD SERVICES
========================= */

loadServices();


async function loadServices(){

  try{

    const response =
      await fetch(
        "/api/data?collection=marketing&limit=100"
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load marketing services."
      );

    }


    services =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    populateCategories();

    render();

  }catch(error){

    console.error(
      "MARKETING:",
      error
    );


    grid.innerHTML = `

      <div class="error">

        Unable to load marketing services.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   CATEGORIES
========================= */

function populateCategories(){

  const values =
    services
      .map(
        service =>
          service.category
      )
      .filter(Boolean);


  const unique =
    [
      ...new Set(
        values.map(
          value =>
            String(value).trim()
        )
      )
    ].sort();


  category.innerHTML =
    `
      <option value="">
        All Categories
      </option>
    ` +
    unique
      .map(
        value => `

          <option
            value="${escapeAttr(value)}"
          >
            ${escapeHTML(value)}
          </option>

        `
      )
      .join("");

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const selected =
    category.value
      .trim()
      .toLowerCase();


  const filtered =
    services.filter(
      service => {

        const title =
          service.title ||
          service.name ||
          "";


        const description =
          service.description ||
          service.summary ||
          "";


        const categoryName =
          service.category ||
          "";


        const text =
          (
            title +
            " " +
            description +
            " " +
            categoryName
          ).toLowerCase();


        const matchesSearch =
          !keyword ||
          text.includes(
            keyword
          );


        const matchesCategory =
          !selected ||
          categoryName
            .toLowerCase() ===
            selected;


        return (
          matchesSearch &&
          matchesCategory
        );

      }
    );


  if(!filtered.length){

    grid.innerHTML = `

      <div class="empty">

        ${
          services.length
          ? "No matching marketing services found."
          : "No marketing services are available yet."
        }

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered
      .map(
        createCard
      )
      .join("");

}


/* =========================
   CARD
========================= */

function createCard(
  service
){

  const id =
    service.documentId ||
    service.id ||
    "";


  const title =
    service.title ||
    service.name ||
    "Marketing Service";


  const description =
    service.description ||
    service.summary ||
    "Professional marketing service.";


  const categoryName =
    service.category ||
    "Marketing";


  const price =
    Number(
      service.price ||
      service.amount ||
      0
    );


  const currency =
    service.currency ||
    "TZS";


  const featured =
    service.featured === true;


  const link =
    id
    ? "marketing-view.html?id=" +
      encodeURIComponent(id)
    : "";


  return `

    <article
      class="card ${
        featured
        ? "featured"
        : ""
      }"
    >

      ${
        featured
        ? `
          <div class="featured-label">
            FEATURED SERVICE
          </div>
        `
        : ""
      }


      <span class="tag">

        ${escapeHTML(
          categoryName
        )}

      </span>


      <h2>

        ${escapeHTML(
          title
        )}

      </h2>


      <p class="description">

        ${escapeHTML(
          description
        )}

      </p>


      ${
        price > 0
        ? `

          <div class="price">

            ${escapeHTML(currency)}
            ${formatNumber(price)}

          </div>

        `
        : ""
      }


      ${
        service.duration
        ? `

          <div class="meta">

            Duration:
            ${escapeHTML(
              service.duration
            )}

          </div>

        `
        : ""
      }


      ${
        link
        ? `

          <a
            class="view"
            href="${link}"
          >
            View Service
          </a>

        `
        : ""
      }

    </article>

  `;

}


/* =========================
   EVENTS
========================= */

search.addEventListener(
  "input",
  render
);

category.addEventListener(
  "change",
  render
);


/* =========================
   FORMAT NUMBER
========================= */

function formatNumber(
  value
){

  return new Intl.NumberFormat(
    undefined,
    {
      maximumFractionDigits:0
    }
  ).format(
    Number(value) || 0
  );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  ).replace(
    /`/g,
    "&#096;"
  );

}

</script>

</body>
</html>
