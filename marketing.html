<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing | LetsStudy Pro</title>
<meta name="description"
content="Discover the latest LetsStudy Pro courses, scholarships, marketplace offers and promotions.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

a{text-decoration:none;color:inherit}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 padding:0 6%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:800
}

.nav{
 display:flex;
 gap:18px;
 font-size:13px;
 font-weight:700
}

.hero{
 background:linear-gradient(135deg,#155eef,#073bba);
 color:#fff;
 padding:55px 20px
}

.hero-inner{
 max-width:1100px;
 margin:auto
}

.hero h1{
 margin:0 0 10px;
 font-size:37px
}

.hero p{
 max-width:650px;
 line-height:1.7;
 color:#dbe7ff
}

.container{
 max-width:1100px;
 margin:25px auto;
 padding:0 20px
}

.toolbar{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:14px;
 display:grid;
 grid-template-columns:2fr 1fr auto;
 gap:10px;
 margin-bottom:20px
}

input,select{
 width:100%;
 padding:11px;
 border:1px solid #d9dee8;
 border-radius:9px;
 outline:none;
 background:#fff
}

.featured{
 margin-bottom:25px
}

.section-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:12px
}

.section-title h2{
 margin:0;
 font-size:20px
}

.featured-card{
 background:#fff;
 border-radius:16px;
 overflow:hidden;
 border:1px solid #e5e7eb;
 display:grid;
 grid-template-columns:1fr 1fr
}

.featured-image{
 min-height:280px
}

.featured-image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.featured-body{
 padding:28px
}

.badge{
 display:inline-block;
 background:#fff3cd;
 color:#9a6700;
 padding:6px 10px;
 border-radius:20px;
 font-size:10px;
 font-weight:800;
 text-transform:uppercase
}

.featured-body h2{
 font-size:28px;
 margin:12px 0 8px
}

.featured-body p{
 color:#667085;
 line-height:1.7;
 font-size:13px
}

.type{
 color:#155eef;
 font-size:11px;
 font-weight:800;
 text-transform:uppercase
}

.cta{
 display:inline-flex;
 align-items:center;
 gap:7px;
 background:#155eef;
 color:#fff;
 padding:11px 16px;
 border-radius:9px;
 font-size:12px;
 font-weight:700;
 margin-top:10px
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:16px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 overflow:hidden;
 transition:.2s
}

.card:hover{
 transform:translateY(-3px);
 box-shadow:0 12px 30px #00000012
}

.image{
 height:175px;
 background:#eef2f6;
 position:relative
}

.image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.card-featured{
 position:absolute;
 top:10px;
 left:10px;
 background:#f59e0b;
 color:#fff;
 padding:5px 9px;
 border-radius:20px;
 font-size:10px;
 font-weight:700
}

.body{
 padding:15px
}

.body h3{
 margin:6px 0;
 font-size:17px
}

.description{
 color:#667085;
 font-size:12px;
 line-height:1.6;
 min-height:42px
}

.meta{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin:10px 0
}

.tag{
 background:#f2f4f7;
 padding:5px 8px;
 border-radius:20px;
 font-size:10px;
 color:#475467
}

.stats{
 display:flex;
 gap:15px;
 color:#667085;
 font-size:11px;
 margin-top:10px
}

.actions{
 display:flex;
 gap:7px;
 margin-top:13px
}

.actions a{
 flex:1;
 text-align:center;
 padding:10px;
 border-radius:8px;
 background:#eef2f6;
 font-size:11px;
 font-weight:700
}

.actions .primary{
 background:#155eef;
 color:#fff
}

.empty{
 grid-column:1/-1;
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:14px;
 padding:55px;
 text-align:center;
 color:#667085
}

.loading{
 text-align:center;
 padding:60px;
 color:#667085
}

@media(max-width:800px){

 .featured-card{
  grid-template-columns:1fr
 }

 .grid{
  grid-template-columns:repeat(2,1fr)
 }

 .toolbar{
  grid-template-columns:1fr 1fr
 }

}

@media(max-width:550px){

 .nav{
  display:none
 }

 .hero h1{
  font-size:29px
 }

 .container{
  padding:0 15px
 }

 .toolbar,
 .grid{
  grid-template-columns:1fr
 }

}
</style>
</head>

<body>

<header class="top">

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<nav class="nav">
<a href="course.html">Courses</a>
<a href="marketplace.html">Marketplace</a>
<a href="scholarships.html">Scholarships</a>
<a href="careers.html">Careers</a>
</nav>

</header>


<section class="hero">

<div class="hero-inner">

<h1>
Discover What's New
</h1>

<p>
Explore the latest promotions, courses,
marketplace offers, scholarships, careers
and opportunities across the LetsStudy Pro ecosystem.
</p>

</div>

</section>


<main class="container">


<!-- FILTER -->

<section class="toolbar">

<input
id="search"
placeholder="Search promotions...">

<select id="type">

<option value="">
All Promotions
</option>

</select>

<button
id="clear">

<i class="fa fa-xmark"></i>
Clear

</button>

</section>


<!-- FEATURED -->

<section
id="featuredSection"
class="featured">

<div class="section-title">

<h2>
Featured
</h2>

</div>

<div id="featuredBox">

<div class="loading">
<i class="fa fa-spinner fa-spin"></i>
Loading...
</div>

</div>

</section>


<!-- ALL -->

<section>

<div class="section-title">

<h2>
Latest Promotions
</h2>

<span
id="count"
style="font-size:12px;color:#667085">
Loading...
</span>

</div>


<div
id="campaigns"
class="grid">

<div class="loading">
<i class="fa fa-spinner fa-spin"></i>
Loading campaigns...
</div>

</div>

</section>

</main>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
doc,
increment
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


let campaigns=[];

const campaignsEl=
document.getElementById("campaigns");

const featuredBox=
document.getElementById("featuredBox");

const searchEl=
document.getElementById("search");

const typeEl=
document.getElementById("type");

const countEl=
document.getElementById("count");


function esc(value=""){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
LOAD
========================= */

async function loadCampaigns(){

try{

const snap=
await getDocs(
collection(
db,
"marketingCampaigns"
)
);

campaigns=[];

snap.forEach(item=>{

campaigns.push({

id:item.id,
...item.data()

});

});


/* PUBLIC CAMPAIGNS */

campaigns=
campaigns.filter(
c=>c.status==="published"
);


/* TYPES */

const types=
[
...new Set(
campaigns
.map(c=>c.type)
.filter(Boolean)
)
].sort();


typeEl.innerHTML=
`<option value="">
All Promotions
</option>`+

types.map(type=>`

<option value="${esc(type)}">
${esc(type)}
</option>

`).join("");


render();

}catch(error){

console.error(error);

campaignsEl.innerHTML=`

<div class="empty">

<i class="fa fa-triangle-exclamation"></i>

<h3>
Unable to load promotions
</h3>

<p>
Please try again later.
</p>

</div>

`;

}

}


/* =========================
RENDER
========================= */

function render(){

const keyword=
searchEl.value
.toLowerCase()
.trim();

const selectedType=
typeEl.value;


const data=
campaigns.filter(c=>{

const text=`

${c.title||""}
${c.description||""}
${c.type||""}
${c.audience||""}

`.toLowerCase();


return(

text.includes(keyword)

&&

(
!selectedType ||
c.type===selectedType
)

);

});


countEl.textContent=
`${data.length} promotion${
data.length===1?"":"s"
}`;


/* FEATURED */

const featured=
data.find(
c=>c.featured===true
);


if(featured){

featuredBox.innerHTML=
featuredCard(featured);

}else{

featuredBox.innerHTML=`
<div class="empty">
No featured promotion available.
</div>
`;

}


/* REMOVE FEATURED FROM LIST */

const normal=
data.filter(
c=>c.id!==
(featured?.id||"")
);


if(!normal.length){

campaignsEl.innerHTML=`
<div class="empty">
No other promotions available.
</div>
`;

return;

}


campaignsEl.innerHTML=
normal
.map(card)
.join("");

}


/* =========================
FEATURED CARD
========================= */

function featuredCard(c){

return`

<div class="featured-card">

<div class="featured-image">

<img
src="${esc(
c.imageUrl||
"https://via.placeholder.com/800x500?text=Promotion"
)}"
alt="${esc(c.title)}">

</div>


<div class="featured-body">

<span class="badge">

<i class="fa fa-star"></i>
Featured

</span>

<div class="type" style="margin-top:15px">

${esc(c.type||"Promotion")}

</div>

<h2>
${esc(c.title||"Promotion")}
</h2>

<p>
${esc(
c.description||
"Discover this special opportunity from LetsStudy Pro."
)}
</p>

<div class="meta">

<span class="tag">
${esc(c.audience||"Everyone")}
</span>

${
c.coupon
?
`<span class="tag">
Coupon: ${esc(c.coupon)}
</span>`
:""
}

</div>

<a
class="cta"
href="${esc(
c.targetUrl||"#"
)}"
onclick="trackClick('${c.id}')">

Explore Now
<i class="fa fa-arrow-right"></i>

</a>

<a
href="marketplace.html">

Details

</a>

</div>

</div>

`;

}


/* =========================
NORMAL CARD
========================= */

function card(c){

return`

<article class="card">

<div class="image">

<img
src="${esc(
c.imageUrl||
"https://via.placeholder.com/700x400?text=Promotion"
)}"
alt="${esc(c.title)}"
loading="lazy">


${
c.featured
?
`<span class="card-featured">
★ Featured
</span>`
:""
}

</div>


<div class="body">

<div class="type">
${esc(c.type||"Promotion")}
</div>

<h3>
${esc(
c.title||
"Promotion"
)}
</h3>

<div class="description">
${esc(
c.description||
"Discover this opportunity."
)}
</div>


<div class="meta">

<span class="tag">
${esc(
c.audience||
"Everyone"
)}
</span>

${
c.coupon
?
`<span class="tag">
${esc(c.coupon)}
</span>`
:""
}

</div>


<div class="stats">

<span>
<i class="fa fa-eye"></i>
${Number(
c.impressions||0
).toLocaleString()}
</span>

<span>
<i class="fa fa-mouse-pointer"></i>
${Number(
c.clicks||0
).toLocaleString()}
</span>

</div>


<div class="actions">

<a
href="${esc(
c.targetUrl||"#"
)}"
onclick="trackClick('${c.id}')"
class="primary">

Explore
<i class="fa fa-arrow-right"></i>

</a>

<a
href="marketplace.html">

Details

</a>

</div>

</div>

</article>

`;

}


/* =========================
TRACK CLICK
========================= */

window.trackClick=
async function(id){

try{

await updateDoc(

doc(
db,
"marketingCampaigns",
id
),

{

clicks:
increment(1)

}

);

}catch(error){

console.log(
"Click tracking unavailable",
error
);

}

};


/* =========================
EVENTS
========================= */

searchEl.addEventListener(
"input",
render
);

typeEl.addEventListener(
"change",
render
);


document
.getElementById("clear")
.addEventListener(
"click",
()=>{

searchEl.value="";
typeEl.value="";

render();

}
);


/* =========================
START
========================= */

loadCampaigns();

</script>

</body>
</html>
