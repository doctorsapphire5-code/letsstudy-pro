<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace | LetsStudy Pro</title>
<meta name="description" content="Discover study notes, templates and learning products on the LetsStudy Pro Marketplace.">
<link rel="canonical" id="canon" href="https://letsstudy.pro/marketplace-details.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="LetsStudy Pro">
<meta property="og:title" id="ogT" content="Marketplace | LetsStudy Pro">
<meta property="og:description" id="ogD" content="Study notes, templates and learning products.">
<meta property="og:image" id="ogI" content="https://letsstudy.pro/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--brand:#4f46e5;--brand2:#7c3aed;--ok:#059669;--warn:#d97706;--bad:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.08);--r:18px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#131a2e;--ink:#e8ecf6;--mut:#94a3b8;--line:#243049;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}.logo b{background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav a.lnk{color:var(--mut);font-weight:600;font-size:14px;margin-left:18px}.nav a.lnk:hover{color:var(--brand)}
#app{opacity:0;transform:translateY(8px);transition:.45s}
#app.on{opacity:1;transform:none}
.crumb{font-size:13px;color:var(--mut);padding:22px 0 14px}.crumb a:hover{color:var(--brand)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:26px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.media{aspect-ratio:16/9;border-radius:var(--r) var(--r) 0 0;overflow:hidden;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:64px;position:relative}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.pad{padding:26px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.b{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);text-transform:capitalize}
.b.f{background:#fef3c7;color:#92400e}.b.d{background:#fee2e2;color:#b91c1c}.b.g{background:#d1fae5;color:#047857}
h1{font-size:clamp(26px,4vw,36px);line-height:1.2;letter-spacing:-.6px;margin-bottom:10px}
.sub{color:var(--mut);font-size:17px;margin-bottom:16px}
.meta{display:flex;flex-wrap:wrap;gap:18px;font-size:14px;color:var(--mut);align-items:center}
.stars{color:#f59e0b;letter-spacing:1px}.meta strong{color:var(--ink)}
h2{font-size:20px;margin:30px 0 12px;letter-spacing:-.3px}
.desc{color:var(--ink);opacity:.9;white-space:normal;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td{padding:11px 0;border-bottom:1px solid var(--line)}td:first-child{color:var(--mut);width:40%}tr:last-child td{border:0}
.buy{position:sticky;top:78px;padding:24px}
.price{font-size:34px;font-weight:800;letter-spacing:-1px}
.old{color:var(--mut);text-decoration:line-through;font-size:16px;margin-left:8px;font-weight:500}
.off{display:inline-block;margin-left:8px;font-size:12px;font-weight:800;color:#fff;background:var(--bad);padding:3px 9px;border-radius:99px;vertical-align:middle}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:14px;font-weight:700;margin-top:14px;transition:.2s}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.35)}
.btn.p:hover{transform:translateY(-2px)}
.btn.s{border:1.5px solid var(--line);background:var(--card)}.btn.s:hover{border-color:var(--brand);color:var(--brand)}
.perks{list-style:none;margin:18px 0 0;font-size:14px;color:var(--mut)}.perks li{padding:5px 0}.perks li:before{content:"✓";color:var(--ok);font-weight:800;margin-right:9px}
.share{display:flex;gap:8px;margin-top:16px}.share button{flex:1;padding:10px;border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:600}.share button:hover{border-color:var(--brand);color:var(--brand)}
.seller{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}
.seller a{display:block;color:var(--brand);font-weight:600;padding:3px 0;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:34px 0 16px;scrollbar-width:none}
.tabs button{white-space:nowrap;padding:9px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.it{overflow:hidden;transition:.25s;display:block}.it:hover{transform:translateY(-4px)}
.it .th{aspect-ratio:16/10;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:38px}
.it .th img{width:100%;height:100%;object-fit:cover}
.it .bd{padding:14px 16px}.it h3{font-size:15px;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .pr{font-weight:800;color:var(--brand)}.it small{color:var(--mut);display:block;font-size:12.5px}
.empty{text-align:center;padding:90px 20px}.empty h1{margin:14px 0 8px}.empty p{color:var(--mut);margin-bottom:20px}.empty .btn{max-width:260px;margin:auto}
.prev{background:#fffbeb;color:#92400e;border:1px solid #fde68a;padding:10px 16px;border-radius:12px;font-size:13.5px;margin-bottom:16px}
footer{margin-top:70px;border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:14px;text-align:center}
.mbar{display:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:920px){.grid{grid-template-columns:1fr}.buy{position:static}body{padding-bottom:78px}
.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));align-items:center;gap:14px}
.mbar .price{font-size:22px;flex:1}.mbar .btn{margin:0;width:auto;padding:12px 26px}}
@media(max-width:560px){.pad{padding:20px}.nav a.lnk{display:none}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="logo" href="index.html">LetsStudy<b>Pro</b></a><nav><a class="lnk" href="marketplace.html">Marketplace</a><a class="lnk" href="courses.html">Courses</a><a class="lnk" href="resources.html">Resources</a><a class="lnk" href="search.html">Search</a></nav></div></header>
<main class="wrap"><h1>Marketplace</h1><div id="app"></div></main>
<footer><div class="wrap">© <span id="yr"></span> LetsStudy Pro · letsstudy.pro</div></footer>
<div id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getFirestore,doc,getDoc,getDocs,collection,query,where,limit}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// LETSSTUDY PRO FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyBcOYDfAVKXbKXjsyRgI_0rjodBn678tCc",
    authDomain: "let-s-study-pro-course.firebaseapp.com",
    databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId: "let-s-study-pro-course",
    storageBucket: "let-s-study-pro-course.firebasestorage.app",
    messagingSenderId: "474928293390",
    appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId: "G-85B7V5H5J0"
  };
const db=getFirestore(initializeApp(firebaseConfig));

const $=s=>document.querySelector(s),app=$("#app");
$("#yr").textContent=new Date().getFullYear();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=u=>/^https?:\/\//i.test(u||"")?u:"";
const ICON={notes:"📝",ebook:"📚",template:"🧩",course:"🎓",software:"💻",bundle:"🎁",video:"🎬"};
const icon=t=>ICON[String(t).toLowerCase()]||"🛍️";
const num=v=>Number(v)||0;
const date=v=>{try{const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?"":d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}catch{return""}};
const ts=v=>{try{return(v?.toDate?v.toDate():new Date(v)).getTime()||0}catch{return 0}};
const money=(n,c)=>`${esc(c||"TZS")} ${num(n).toLocaleString("en-US")}`;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)};
const live=p=>["published","active","approved"].includes(String(p.status||"").toLowerCase());
const eff=p=>{const pr=num(p.price),d=num(p.discountPrice);return d>0&&d<pr?d:pr};
const free=p=>eff(p)===0;
const pid=p=>p.id;
const stars=r=>{r=Math.max(0,Math.min(5,num(r)));const f=Math.round(r);return"★".repeat(f)+"☆".repeat(5-f)};
const thumb=p=>url(p.thumbnail)||url(p.imageUrl);
const media=(p,cls)=>{const s=thumb(p);return s?`<img src="${esc(s)}" alt="${esc(p.title)}" loading="lazy" onerror="this.remove()">`:icon(p.type)};

function notFound(){
  document.title="Product not found | LetsStudy Pro";
  app.innerHTML=`<div class="empty"><div style="font-size:64px">🔎</div><h1>Product not found</h1><p>This item may have been removed or the link is incorrect.</p><a class="btn p" href="marketplace.html">Browse Marketplace</a></div>`;
  app.classList.add("on");
}

async function load(){
  const q=new URLSearchParams(location.search);
  const id=q.get("id"),slug=q.get("slug");
  try{
    let p=null;
    if(id){const s=await getDoc(doc(db,"marketplace",id));if(s.exists())p={id:s.id,...s.data()}}
    else if(slug){const s=await getDocs(query(collection(db,"marketplace"),where("slug","==",slug),limit(1)));if(!s.empty)p={id:s.docs[0].id,...s.docs[0].data()}}
    if(!p)return notFound();
    render(p);
    more(p);
  }catch(e){console.error(e);notFound()}
}

function seo(p){
  const t=`${p.title||"Product"} | LetsStudy Pro Marketplace`,d=p.shortDescription||String(p.description||"").slice(0,155)||"Study products on LetsStudy Pro.";
  document.title=t;
  $('meta[name="description"]').content=d;$("#ogT").content=t;$("#ogD").content=d;
  if(thumb(p))$("#ogI").content=thumb(p);
  $("#canon").href=location.origin+location.pathname+"?id="+encodeURIComponent(p.id);
}

function render(p){
  seo(p);
  const f=free(p),e=eff(p),pr=num(p.price),disc=e<pr&&pr>0?Math.round((1-e/pr)*100):0;
  const cur=p.currency||"TZS";
  const link=location.origin+location.pathname+"?id="+encodeURIComponent(p.id);
  const phone=String(p.phone||"").trim(),email=String(p.email||"").trim(),wa=phone.replace(/\D/g,"");
  const tel=phone?`tel:${phone.replace(/[^\d+]/g,"")}`:"";
  const toMail=email||"support@letsstudy.pro",toWa=wa||"255610983928";
  const msg=`Hello, I would like to order "${p.title||"this product"}" (${f?"Free":money(e,cur)}) from LetsStudy Pro Marketplace.\n${link}`;
  const mail=`mailto:${toMail}?subject=${encodeURIComponent("Order: "+(p.title||"Marketplace product"))}&body=${encodeURIComponent(msg)}`;
  const waUrl=`https://wa.me/${toWa}?text=${encodeURIComponent(msg)}`;
  const go=f?`marketplace-free.html?id=${encodeURIComponent(p.id)}`:waUrl;
  const label=f?"Get it free":"Order via WhatsApp";
  const ext=f?"":` target="_blank" rel="noopener noreferrer"`;
  const priceHtml=f?`<span class="price" style="color:var(--ok)">Free</span>`:`<span class="price">${money(e,cur)}</span>${disc?`<span class="old">${money(pr,cur)}</span><span class="off">-${disc}%</span>`:""}`;
  const rc=num(p.ratingCount),published=date(p.publishedAt)||date(p.createdAt);
  const prod=url(p.productUrl);
  const preview=live(p)?"":`<div class="prev">Preview mode — this item is currently "${esc(p.status||"draft")}" and is not visible to the public.</div>`;
  const rows=[["Type",p.type],["Category",p.category],["Published",published],["Last updated",date(p.updatedAt)],["Sales",num(p.salesCount).toLocaleString("en-US")],["Currency",cur],["Product ID",p.slug||p.id]].filter(r=>r[1]);
  app.innerHTML=`
  <nav class="crumb"><a href="index.html">Home</a> / <a href="marketplace.html">Marketplace</a>${p.category?` / <span>${esc(p.category)}</span>`:""}</nav>
  ${preview}
  <div class="grid">
    <article class="card">
      <div class="media">${media(p)}</div>
      <div class="pad">
        <div class="badges">${p.featured===true||p.featured==="true"?'<span class="b f">★ Featured</span>':""}<span class="b">${esc(p.type||"product")}</span>${p.category?`<span class="b g">${esc(p.category)}</span>`:""}${disc?`<span class="b d">${disc}% OFF</span>`:""}</div>
        <h1>${esc(p.title||"Untitled product")}</h1>
        ${p.shortDescription?`<p class="sub">${esc(p.shortDescription)}</p>`:""}
        <div class="meta"><span><span class="stars">${stars(p.rating)}</span> <strong>${num(p.rating).toFixed(1)}</strong> (${rc.toLocaleString("en-US")} ${rc===1?"rating":"ratings"})</span><span><strong>${num(p.salesCount).toLocaleString("en-US")}</strong> sold</span>${published?`<span>Published ${esc(published)}</span>`:""}</div>
        <h2>About this product</h2>
        <div class="desc">${esc(p.description||"No description provided yet.").replace(/\n/g,"<br>")}</div>
        <h2>Details</h2>
        <table>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>
      </div>
    </article>
    <aside class="card buy">
      <div>${priceHtml}</div>
      <a class="btn p" href="${go}"${ext}>${f?"⬇":"💬"} ${label}</a>
      ${f?"":`${tel?`<a class="btn s" href="${esc(tel)}">📞 Call seller</a>`:""}<a class="btn s" href="${esc(mail)}">✉ Email seller</a>`}
      ${prod?`<a class="btn s" href="${esc(prod)}" target="_blank" rel="noopener noreferrer">🔗 Visit product link</a>`:""}
      <ul class="perks"><li>${f?"Instant access once you claim it":"Order by WhatsApp, phone or email"}</li><li>Confirm payment details directly with the seller</li><li>Support at support@letsstudy.pro</li></ul>
      <div class="share"><button id="shr">↗ Share</button><button id="cpy">⧉ Copy link</button><button id="wa">WhatsApp</button></div>
      ${email||phone?`<div class="seller"><strong>Contact seller</strong>${email?`<a href="mailto:${esc(email)}">✉ ${esc(email)}</a>`:""}${phone?`<a href="tel:${esc(phone)}">☎ ${esc(phone)}</a>`:""}${wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noopener noreferrer">💬 Chat on WhatsApp</a>`:""}</div>`:""}
    </aside>
  </div>
  <div class="tabs" id="tabs"></div><div class="list" id="list"></div>
  <div class="mbar"><div class="price">${f?"Free":money(e,cur)}</div><a class="btn p" href="${go}"${ext}>${label}</a></div>`;
  requestAnimationFrame(()=>app.classList.add("on"));

  const text=`${p.title||"Product"} — LetsStudy Pro Marketplace`;
  $("#shr").onclick=async()=>{try{if(navigator.share)await navigator.share({title:text,text,url:link});else{await navigator.clipboard.writeText(link);toast("Link copied")}}catch{}};
  $("#cpy").onclick=async()=>{try{await navigator.clipboard.writeText(link);toast("Link copied")}catch{toast("Could not copy")}};
  $("#wa").onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(text+"\n"+link),"_blank","noopener");
}

async function more(p){
  try{
    const s=await getDocs(query(collection(db,"marketplace"),limit(120)));
    const all=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.id!==p.id&&live(x));
    if(!all.length)return;
    const by=(fn)=>[...all].sort(fn).slice(0,8);
    const sets={
      Related:[...all.filter(x=>(x.category&&x.category===p.category)||(x.type&&x.type===p.type))].slice(0,8),
      Trending:by((a,b)=>num(b.salesCount)-num(a.salesCount)||ts(b.createdAt)-ts(a.createdAt)),
      Recent:by((a,b)=>ts(b.publishedAt||b.createdAt)-ts(a.publishedAt||a.createdAt)),
      Featured:all.filter(x=>x.featured===true||x.featured==="true").slice(0,8),
      "Most popular":by((a,b)=>num(b.ratingCount)-num(a.ratingCount)||num(b.rating)-num(a.rating))
    };
    const names=Object.keys(sets).filter(k=>sets[k].length);
    if(!names.length)return;
    const tabs=$("#tabs"),list=$("#list");
    const show=k=>{
      tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
      list.innerHTML=sets[k].map(x=>`<a class="card it" href="marketplace-details.html?id=${encodeURIComponent(x.id)}"><div class="th">${media(x)}</div><div class="bd"><h3>${esc(x.title||"Untitled")}</h3><div class="pr">${free(x)?"Free":money(eff(x),x.currency)}</div><small>${esc(x.type||"")}${x.category?" · "+esc(x.category):""}</small></div></a>`).join("");
    };
    tabs.innerHTML=names.map(k=>`<button data-k="${esc(k)}">${esc(k)}</button>`).join("");
    tabs.onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.k)};
    show(names[0]);
  }catch(e){console.error(e)}
}
load();
</script>


</body></html>
