  <style>

    body{

    .error{

    .cover{

    .badges{

      flex-wrap:wrap;
      gap:8px;

    .badge{
      display:inline-flex;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      background:#dcfce7;
      color:#166534;
    }

    .badge.plan{
      background:#ede9fe;
      color:#6d28d9;
    }

    .badge.status{
      background:#e0f2fe;
      color:#0369a1;
    }

    h1{
      font-size:clamp(30px,5vw,52px);
      line-height:1.1;
      margin:16px 0 10px;
    }

    .tagline{
      color:#2563eb;
      font-size:18px;
      font-weight:700;
      margin:0 0 14px;
    }

    .description{
      color:#64748b;
      line-height:1.75;

    }

    .layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 340px;
      gap:24px;

    .card{
      background:#fff;

    .card + .card{

    .card h2{
      margin:0 0 15px;
      font-size:21px;
    }

    .list{
      padding:0;
      margin:0;
      list-style:none;
    }

    .list li{
      position:relative;
      padding:11px 0 11px 27px;
      color:#475569;
      line-height:1.6;
      border-bottom:1px solid #eef1f5;
    }

    .list li:last-child{
      border-bottom:0;
    }

    .list li::before{
      content:"✓";
      position:absolute;
      left:0;
      top:11px;
      color:#2563eb;
      font-weight:900;
    }

    .info{
      display:flex;
      justify-content:space-between;
      gap:15px;
      padding:13px 0;
      border-bottom:1px solid #edf0f4;
    }

    .info:last-child{
      border-bottom:0;
    }

    .info span{
      color:#64748b;
    }

    .info strong{
      text-align:right;
    }

    .price{
      margin:20px 0;
      padding:18px;
      background:#f8fafc;
      border-radius:14px;
      text-align:center;
    }

    .price-label{
      color:#64748b;
      font-size:13px;
    }

    .price-value{
      margin-top:5px;
      font-size:30px;
      font-weight:900;
    }

    .action{
      display:block;
      width:100%;
      padding:15px 18px;
      border:0;
      border-radius:13px;
      background:#2563eb;
      color:#fff;
      text-align:center;
      text-decoration:none;
      font-weight:900;
      cursor:pointer;
      font-size:15px;
    }

    .action:hover{
      background:#1d4ed8;
    }

    .secondary{
      display:block;
      width:100%;
      margin-top:10px;
      padding:13px;
      border-radius:13px;
      border:1px solid #dbe2ea;

    @media(max-width:850px){

<body>

<header class="topbar">

<main class="container">

  <div id="loading" class="loading">

  <section id="content" style="display:none">

    <div class="layout">

      <div>

</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVK5XbkljsyRgI_0rj0odBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const params =
  new URLSearchParams(location.search);

const marketplaceId =
  params.get("id");

const $ =
  id => document.getElementById(id);

function firstValue(
  data,
  keys,
  fallback = ""
){

  for(const key of keys){

    const value =
      data?.[key];

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){
      return value;
    }

  }

  return fallback;

}

function toArray(value){

  if(Array.isArray(value)){

    return value
      .map(item => {

        if(
          typeof item === "object" &&
          item !== null
        ){

          return firstValue(
            item,
            [
              "title",
              "name",
              "text",
              "description"
            ],
            ""
          );

        }

        return String(item);

      })
      .map(item => item.trim())
      .filter(Boolean);

  }

  if(typeof value === "string"){

    return value
      .split(/\r?\n|,/)
      .map(item => item.trim())
      .filter(Boolean);

  }

  return [];

}

function getAccess(data){

  const access =
    String(
      firstValue(
        data,
        [
          "access",
          "accessType",
          "membership",
          "plan"
        ],
        ""
      )
    )
    .toLowerCase()
    .trim();

  const plan =
    data?.isPremium === true ||
    data?.premium === true ||
    data?.paid === true ||
    [
      "plan",
      "premium",
      "paid",
      "pro"
    ].includes(access);

  return plan
    ? "plan"
    : "free";

}

function getPrice(data){

  const value =
    firstValue(
      data,
      [
        "price",
        "amount",
        "cost",
        "marketplacePrice"
      ],
      0
    );

  const number =
    Number(
      String(value)
        .replace(/[^0-9.-]/g,"")
    );

  return Number.isFinite(number)
    ? number
    : 0;

}

function formatPrice(amount){

  return new Intl.NumberFormat(
    undefined,
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  ).format(amount);

}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function renderList(
  element,
  values
){

  if(!values.length){
    return false;
  }

  element.innerHTML =
    values
      .map(
        item =>
          `<li>${escapeHtml(item)}</li>`
      )
      .join("");

  return true;

}

function addToMarketplaceCart(id){

  let cart = [];

  try{

    const stored =
      JSON.parse(
        localStorage.getItem(
          "marketplaceCart"
        ) || "[]"
      );

    if(Array.isArray(stored)){

      cart =
        stored
          .map(item => {

            if(typeof item === "string"){
              return item;
            }

            if(
              item &&
              typeof item === "object"
            ){

              return (
                item.id ||
                item.marketplaceId ||
                ""
              );

            }

            return "";

          })
          .filter(Boolean);

    }

  }catch{

    cart = [];

  }

  if(!cart.includes(id)){
    cart.push(id);
  }

  /*
    Store marketplace IDs only.
    IDs are never displayed.
  */

  localStorage.setItem(
    "marketplaceCart",
    JSON.stringify([
      ...new Set(cart)
    ])
  );

  location.href =
    "marketplace-cart.html";

}

async function loadMarketplace(){

  if(!marketplaceId){

    throw new Error(
      "Marketplace item information is missing."
    );

  }

  const snapshot =
    await getDoc(
      doc(
        db,
        "marketplace",
        marketplaceId
      )
    );

  if(!snapshot.exists()){

    throw new Error(
      "This marketplace item could not be found."
    );

  }

  const data =
    snapshot.data();

  const title =
    firstValue(
      data,
      [
        "title",
        "name",
        "productTitle",
        "productName",
        "itemTitle"
      ],
      "Marketplace Item"
    );

  const tagline =
    firstValue(
      data,
      [
        "tagline",
        "slogan",
        "shortDescription",
        "summary"
      ],
      ""
    );

  const description =
    firstValue(
      data,
      [
        "description",
        "summary",
        "shortDescription",
        "overview",
        "content"
      ],
      ""
    );

  const about =
    firstValue(
      data,
      [
        "about",
        "overview",
        "description",
        "details",
        "content"
      ],
      description
    );

  const category =
    firstValue(
      data,
      [
        "category",
        "marketplaceCategory",
        "productCategory",
        "type",
        "field"
      ],
      "Marketplace"
    );

  const type =
    firstValue(
      data,
      [
        "productType",
        "itemType",
        "type"
      ],
      "Item"
    );

  const seller =
    firstValue(
      data,
      [
        "seller",
        "sellerName",
        "vendor",
        "vendorName",
        "provider",
        "providerName"
      ],
      "Marketplace Seller"
    );

  const availability =
    firstValue(
      data,
      [
        "availability",
        "stock",
        "status",
        "itemStatus"
      ],
      "Available"
    );

  const image =
    firstValue(
      data,
      [
        "image",
        "imageUrl",
        "thumbnail",
        "thumbnailUrl",
        "cover",
        "coverImage"
      ],
      ""
    );

  const features =
    toArray(
      firstValue(
        data,
        [
          "features",
          "included",
          "benefits",
          "highlights",
          "whatYouGet"
        ],
        []
      )
    );

  const requirements =
    toArray(
      firstValue(
        data,
        [
          "requirements",
          "needed",
          "prerequisites"
        ],
        []
      )
    );

  const access =
    getAccess(data);

  const price =
    getPrice(data);

  $("title").textContent =
    title;

  $("description").textContent =
    description;

  $("about").textContent =
    about;

  $("category").textContent =
    category;

  $("type").textContent =
    type;

  $("seller").textContent =
    seller;

  $("availability").textContent =
    availability;

  $("price").textContent =
    formatPrice(price);

  if(tagline){

    $("tagline").textContent =
      tagline;

    $("tagline").style.display =
      "block";

  }

  if(image){

    $("cover").src =
      image;

    $("cover").style.display =
      "block";

  }

  if(!renderList(
    $("features"),
    features
  )){

    $("featuresCard").style.display =
      "none";

  }

  if(!renderList(
    $("requirements"),
    requirements
  )){

    $("requirementsCard").style.display =
      "none";

  }

  /*
    FREE MARKETPLACE
    → marketplace-free.html
  */

  if(access === "free"){

    $("accessBadge").textContent =
      "FREE MARKETPLACE";

    $("accessBadge").className =
      "badge";

    $("actionBtn").textContent =
      "Get Item";

    $("actionBtn").href =
      `marketplace-free.html?id=${encodeURIComponent(
        marketplaceId
      )}`;

  }

  /*
    PLAN MARKETPLACE
    → marketplace-cart.html
  */

  else{

    $("accessBadge").textContent =
      "PLAN MARKETPLACE";

    $("accessBadge").className =
      "badge plan";

    $("actionBtn").textContent =
      "Add to Marketplace Cart";

    $("actionBtn").href =
      "#";

    $("actionBtn").addEventListener(
      "click",
      event => {

        event.preventDefault();

        addToMarketplaceCart(
          marketplaceId
        );

      }
    );

  }

  $("loading").style.display =
    "none";

  $("content").style.display =
    "block";

}

loadMarketplace().catch(error => {

  console.error(
    "Marketplace details error:",
    error
  );

  $("loading").style.display =
    "none";

  $("error").textContent =
    error.message ||
    "Unable to load marketplace details.";

  $("error").style.display =
    "block";

});

</script>

</body>
