<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  limit,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


/* =========================================
   ELEMENTS
========================================= */

const grid =
  document.getElementById(
    "grid"
  );


const search =
  document.getElementById(
    "search"
  );


const category =
  document.getElementById(
    "category"
  );


let items = [];


/* =========================================
   LOAD MARKETPLACE
========================================= */

loadMarketplace();


async function loadMarketplace(){

  try{

    grid.innerHTML = `

      <div class="loading">

        Loading marketplace...

      </div>

    `;


    /*
      Direct Firestore collection:

      marketplace
    */

    const marketplaceRef =
      collection(
        db,
        "marketplace"
      );


    /*
      Limit to 100 documents.

      No API is used.
    */

    const marketplaceQuery =
      query(
        marketplaceRef,
        limit(100)
      );


    const snapshot =
      await getDocs(
        marketplaceQuery
      );


    items =
      snapshot.docs.map(
        documentSnapshot => {

          return {

            id:
              documentSnapshot.id,

            ...documentSnapshot.data()

          };

        }
      );


    /*
      Optional client-side sorting.
      Featured items first.
    */

    items.sort(
      (a,b) => {

        const featuredA =
          a.featured === true ||
          a.featured === "true"
            ? 1
            : 0;


        const featuredB =
          b.featured === true ||
          b.featured === "true"
            ? 1
            : 0;


        return featuredB -
               featuredA;

      }
    );


    populateCategories();

    render();


  }catch(error){

    console.error(
      "MARKETPLACE FIRESTORE ERROR:",
      error
    );


    grid.innerHTML = `

      <div class="error">

        Unable to load marketplace.

        <br><br>

        ${escapeHTML(
          getFirebaseErrorMessage(
            error
          )
        )}

      </div>

    `;

  }

}


/* =========================================
   CATEGORIES
========================================= */

function populateCategories(){

  const values =
    items
      .map(
        item =>
          item &&
          item.category
      )
      .filter(
        Boolean
      );


  const unique =
    [
      ...new Set(
        values
          .map(
            value =>
              String(
                value
              ).trim()
          )
          .filter(
            Boolean
          )
      )
    ]
    .sort(
      (a,b) =>
        a.localeCompare(
          b
        )
    );


  category.innerHTML = `

    <option value="">
      All Categories
    </option>

  `;


  unique.forEach(
    value => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        value;


      option.textContent =
        value;


      category.appendChild(
        option
      );

    }
  );

}


/* =========================================
   RENDER
========================================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const selected =
    category.value
      .trim()
      .toLowerCase();


  const filtered =
    items.filter(
      item => {

        if(!item){
          return false;
        }


        /*
          If published field exists,
          show only published items.

          If the field doesn't exist,
          item remains visible.
        */

        if(
          Object.prototype.hasOwnProperty.call(
            item,
            "published"
          )
        ){

          const published =
            item.published === true ||
            item.published === "true";


          if(!published){

            return false;

          }

        }


        const title =
          item.title ||
          item.name ||
          "";


        const description =
          item.description ||
          item.summary ||
          "";


        const categoryName =
          item.category ||
          "";


        const type =
          item.type ||
          "";


        const text =
          (
            String(title) +
            " " +
            String(description) +
            " " +
            String(categoryName) +
            " " +
            String(type)
          )
          .toLowerCase();


        return (

          (
            !keyword ||
            text.includes(
              keyword
            )
          )

          &&

          (
            !selected ||
            String(
              categoryName
            )
              .trim()
              .toLowerCase() ===
            selected
          )

        );

      }
    );


  if(!filtered.length){

    grid.innerHTML = `

      <div class="empty">

        ${
          items.length
            ? "No matching marketplace items found."
            : "The marketplace is currently empty."
        }

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered
      .map(
        createCard
      )
      .join("");

}


/* =========================================
   CREATE CARD
========================================= */

function createCard(
  item
){

  /*
    IMPORTANT:

    document.id is now the marketplace
    item ID.

    Example:

    marketplace/ABC123

    becomes:

    marketplace-view.html?id=ABC123
  */

  const id =
    item.id ||
    "";


  const title =
    item.title ||
    item.name ||
    "Marketplace Item";


  const description =
    item.description ||
    item.summary ||
    "View this marketplace item for more information.";


  const categoryName =
    item.category ||
    "Marketplace";


  const type =
    item.type ||
    "";


  const rawPrice =
    item.price ??
    item.amount ??
    0;


  const price =
    parsePrice(
      rawPrice
    );


  const currency =
    item.currency ||
    "TZS";


  const featured =
    item.featured === true ||
    item.featured === "true";


  const availability =
    item.availability ||
    "";


  const link =
    id
      ? "marketplace-view.html?id=" +
        encodeURIComponent(
          String(id)
        )
      : "";


  return `

    <article
      class="card ${
        featured
          ? "featured"
          : ""
      }"
    >


      ${
        featured
          ? `

            <div class="featured-label">

              FEATURED

            </div>

          `
          : ""
      }


      <span class="tag">

        ${escapeHTML(
          categoryName
        )}

      </span>


      <h2>

        ${escapeHTML(
          title
        )}

      </h2>


      <p class="description">

        ${escapeHTML(
          description
        )}

      </p>


      ${
        price > 0

          ? `

            <div class="price">

              ${escapeHTML(
                currency
              )}

              ${formatNumber(
                price
              )}

            </div>

          `

          : `

            <div class="price">

              Contact for price

            </div>

          `
      }


      ${
        type

          ? `

            <div class="meta">

              Type:
              ${escapeHTML(
                type
              )}

            </div>

          `

          : ""
      }


      ${
        availability

          ? `

            <div class="meta">

              ${escapeHTML(
                availability
              )}

            </div>

          `

          : ""
      }


      ${
        link

          ? `

            <a
              href="${escapeAttr(
                link
              )}"
              class="view"
              aria-label="View marketplace item"
            >

              View Item

            </a>

          `

          : ""
      }


    </article>

  `;

}


/* =========================================
   SEARCH
========================================= */

search.addEventListener(
  "input",
  render
);


/* =========================================
   CATEGORY
========================================= */

category.addEventListener(
  "change",
  render
);


/* =========================================
   FORMAT NUMBER
========================================= */

function formatNumber(
  value
){

  const number =
    parsePrice(
      value
    );


  return new Intl.NumberFormat(
    "en-TZ",
    {
      maximumFractionDigits:0
    }
  ).format(
    number
  );

}


/* =========================================
   PARSE PRICE
========================================= */

function parsePrice(
  value
){

  if(
    typeof value ===
    "number"
  ){

    return Number.isFinite(
      value
    )
      ? value
      : 0;

  }


  const cleaned =
    String(
      value ?? ""
    )
      .replace(
        /,/g,
        ""
      )
      .replace(
        /[^\d.-]/g,
        ""
      )
      .trim();


  const number =
    Number(
      cleaned
    );


  return Number.isFinite(
    number
  )
    ? number
    : 0;

}


/* =========================================
   FIREBASE ERROR MESSAGE
========================================= */

function getFirebaseErrorMessage(
  error
){

  if(
    error &&
    error.code ===
    "permission-denied"
  ){

    return (
      "Permission denied. " +
      "Check Firestore rules for the marketplace collection."
    );

  }


  if(
    error &&
    error.code ===
    "failed-precondition"
  ){

    return (
      "Firestore configuration requires attention."
    );

  }


  if(
    error &&
    error.message
  ){

    return error.message;

  }


  return (
    "Unable to read marketplace data."
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   ESCAPE ATTRIBUTE
========================================= */

function escapeAttr(
  value
){

  return escapeHTML(
    value
  )
  .replace(
    /`/g,
    "&#096;"
  );

}

</script>
