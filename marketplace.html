<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community - Lets Study Pro</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  background:#111827;
  color:white;
  padding:20px 14px;
  z-index:1000;
  overflow-y:auto;
  transition:.3s;
}

.logo{
  font-size:21px;
  font-weight:800;
  padding:10px;
  margin-bottom:20px;
}

.logo span{
  color:#60a5fa;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  color:#d1d5db;
  text-decoration:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:5px;
  font-size:14px;
}

.sidebar a:hover,
.sidebar a.active{
  background:#2563eb;
  color:white;
}

.close-sidebar{
  display:none;
  position:absolute;
  right:15px;
  top:10px;
  background:none;
  border:0;
  color:white;
  font-size:26px;
}

/* ================= MAIN ================= */

.main{
  margin-left:250px;
  min-height:100vh;
}

.topbar{
  height:65px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:100;
}

.menu-btn{
  display:none;
  background:#2563eb;
  color:white;
  border:0;
  border-radius:7px;
  padding:9px 12px;
  font-size:18px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 18px;
}

/* ================= HERO ================= */

.hero{
  background:linear-gradient(
    135deg,
    #2563eb,
    #4f46e5
  );
  color:white;
  padding:32px;
  border-radius:17px;
  margin-bottom:20px;
}

.hero h1{
  font-size:29px;
  margin-bottom:8px;
}

.hero p{
  opacity:.9;
  line-height:1.5;
}

/* ================= QUICK LINKS ================= */

.quick-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  margin-bottom:22px;
}

.quick-card{
  background:white;
  padding:18px;
  border-radius:13px;
  text-decoration:none;
  color:#172033;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
  transition:.2s;
}

.quick-card:hover{
  transform:translateY(-3px);
}

.quick-icon{
  font-size:28px;
  margin-bottom:10px;
}

.quick-card h3{
  margin-bottom:5px;
}

.quick-card p{
  color:#64748b;
  font-size:13px;
}

/* ================= CARD ================= */

.card{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

/* ================= SEARCH ================= */

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search{
  flex:1;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e2e8f0;
  color:#334155;
}

/* ================= POSTS ================= */

.post{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
  margin-top:12px;
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#dbeafe;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#2563eb;
  font-weight:bold;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.author{
  font-weight:bold;
}

.date{
  color:#64748b;
  font-size:11px;
  margin-top:3px;
}

.post-text{
  margin:14px 0;
  line-height:1.6;
  white-space:pre-wrap;
}

.post-image{
  max-width:100%;
  max-height:400px;
  border-radius:10px;
  display:block;
  margin-bottom:12px;
}

.post-footer{
  display:flex;
  gap:15px;
  padding-top:11px;
  border-top:1px solid #e5e7eb;
}

.post-footer a{
  text-decoration:none;
  color:#475569;
  font-size:13px;
  font-weight:bold;
}

.post-footer a:hover{
  color:#2563eb;
}

/* ================= GROUPS ================= */

.group-list{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.group-card{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
}

.group-card h3{
  margin-bottom:7px;
}

.group-card p{
  color:#64748b;
  font-size:13px;
  line-height:1.5;
}

.group-meta{
  color:#2563eb;
  font-size:12px;
  margin:10px 0;
}

/* ================= EMPTY ================= */

.loading,
.empty{
  text-align:center;
  padding:35px;
  color:#64748b;
}

/* ================= OVERLAY ================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:900;
}

.overlay.show{
  display:block;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .close-sidebar{
    display:block;
  }

}

@media(max-width:500px){

  .hero{
    padding:23px;
  }

  .hero h1{
    font-size:24px;
  }

  .search-box{
    flex-direction:column;
  }

}

</style>

</head>
