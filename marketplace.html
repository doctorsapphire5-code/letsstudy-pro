<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="LetsStudy Pro Marketplace - Discover courses, study materials and digital learning products.">
<title>Marketplace | LetsStudy Pro</title><style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
header{
height:64px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
gap:14px;
padding:0 18px;
position:sticky;
top:0;
z-index:20
}
.logo{
font-weight:800;
font-size:20px;
color:#2563eb;
white-space:nowrap
}
.search{
flex:1;
max-width:550px;
position:relative
}
.search input{
width:100%;
padding:11px 14px 11px 40px;
border:1px solid #dbe1e8;
border-radius:10px;
outline:none;
background:#f8fafc
}
.search span{
position:absolute;
left:14px;
top:11px
}
.nav{
display:flex;
align-items:center;
gap:8px;
margin-left:auto
}
.nav button{
background:#eef2ff;
color:#1d4ed8;
padding:9px 12px;
border-radius:9px
}
.cart{
position:relative;
background:#2563eb!important;
color:#fff!important
}
.cart-count{
position:absolute;
right:-5px;
top:-7px;
background:#ef4444;
color:white;
width:19px;
height:19px;
border-radius:50%;
font-size:10px;
display:flex;
align-items:center;
justify-content:center
}

main{
max-width:1250px;
margin:auto;
padding:22px
}

.hero{
background:linear-gradient(120deg,#2563eb,#4f46e5);
color:#fff;
border-radius:20px;
padding:35px;
display:flex;
align-items:center;
justify-content:space-between;
gap:25px;
margin-bottom:22px
}
.hero h1{
font-size:34px;
margin:0 0 10px
}
.hero p{
margin:0;
opacity:.9;
max-width:650px;
line-height:1.6
}
.hero button{
margin-top:18px;
background:#fff;
color:#1d4ed8;
padding:11px 16px;
border-radius:9px;
font-weight:bold
}

.layout{
display:grid;
grid-template-columns:220px 1fr;
gap:18px
}

.sidebar{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:15px;
height:max-content;
position:sticky;
top:82px
}
.sidebar h3{
font-size:13px;
margin:5px 0 12px
}
.category{
display:block;
width:100%;
text-align:left;
background:none;
padding:10px 8px;
border-radius:8px;
color:#475569
}
.category:hover,
.category.selected{
background:#eef2ff;
color:#2563eb;
font-weight:bold
}

.content-top{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px
}
.content-top h2{
flex:1;
font-size:18px;
margin:0
}
.sort{
padding:9px;
border:1px solid #dbe1e8;
border-radius:9px;
background:#fff
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}

.product{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
overflow:hidden;
transition:.2s;
display:flex;
flex-direction:column
}
.product:hover{
transform:translateY(-2px);
box-shadow:0 8px 25px #0000000d
}
.product-img{
height:175px;
background:#e5e7eb;
overflow:hidden;
position:relative
}
.product-img img{
width:100%;
height:100%;
object-fit:cover
}
.featured{
position:absolute;
left:10px;
top:10px;
background:#f59e0b;
color:white;
font-size:9px;
padding:5px 8px;
border-radius:20px;
font-weight:bold
}
.product-body{
padding:14px;
display:flex;
flex-direction:column;
flex:1
}
.product-category{
font-size:9px;
color:#2563eb;
font-weight:bold;
text-transform:uppercase
}
.product h3{
font-size:15px;
margin:7px 0;
line-height:1.4
}
.description{
font-size:11px;
color:#64748b;
line-height:1.5;
margin-bottom:10px
}
.rating{
font-size:11px;
color:#f59e0b
}
.price{
font-size:18px;
font-weight:800;
margin:10px 0
}
.old-price{
font-size:11px;
text-decoration:line-through;
color:#94a3b8;
margin-left:5px
}
.actions{
display:flex;
gap:7px;
margin-top:auto
}
.actions button{
flex:1;
padding:9px;
border-radius:8px
}
.view{
background:#eef2ff;
color:#1d4ed8
}
.add{
background:#2563eb;
color:#fff
}

.empty{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:50px 20px;
text-align:center;
color:#64748b;
grid-column:1/-1
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:50;
align-items:center;
justify-content:center;
padding:15px
}
.modal.show{display:flex}
.modal-box{
width:100%;
max-width:600px;
max-height:90vh;
overflow:auto;
background:#fff;
border-radius:16px;
padding:20px
}
.modal-head{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px
}
.modal-head h2{flex:1;font-size:18px}
.close{
background:#f1f5f9;
padding:8px 11px;
border-radius:8px
}
.detail-img{
width:100%;
height:240px;
object-fit:cover;
border-radius:12px
}
.detail-price{
font-size:24px;
font-weight:800;
margin:15px 0
}
.buy{
width:100%;
background:#2563eb;
color:white;
padding:13px;
border-radius:10px;
font-weight:bold
}

.cart-item{
display:flex;
gap:10px;
padding:12px 0;
border-bottom:1px solid #edf0f4
}
.cart-item img{
width:70px;
height:55px;
object-fit:cover;
border-radius:8px
}
.cart-info{flex:1}
.cart-info strong{
font-size:12px;
display:block
}
.cart-info small{
color:#64748b
}
.remove{
background:#fee2e2;
color:#b91c1c;
padding:6px 8px;
border-radius:7px;
height:max-content
}
.total{
display:flex;
justify-content:space-between;
font-weight:bold;
font-size:17px;
padding:15px 0
}

.toast{
position:fixed;
bottom:20px;
right:20px;
background:#172033;
color:white;
padding:12px 15px;
border-radius:9px;
font-size:12px;
display:none;
z-index:100
}
.toast.show{display:block}

@media(max-width:900px){
.grid{grid-template-columns:repeat(2,1fr)}
.layout{grid-template-columns:180px 1fr}
}
@media(max-width:700px){
header{padding:0 10px}
.logo{font-size:16px}
.search{max-width:none}
.nav button:not(.cart){display:none}
main{padding:12px}
.hero{padding:23px}
.hero h1{font-size:25px}
.layout{display:block}
.sidebar{
position:static;
display:flex;
gap:5px;
overflow:auto;
margin-bottom:15px
}
.sidebar h3{display:none}
.category{white-space:nowrap;width:auto}
.grid{grid-template-columns:1fr}
.content-top{align-items:flex-start}
}
</style></head><body><header><div class="logo">
LetsStudy Pro
</div><div class="search">
<span>🔎</span>
<input
id="search"
type="search"
placeholder="Search courses, books, materials..."
>
</div><nav class="nav"><button onclick="location.href='dashboard.html'">
Dashboard
</button><button
class="cart"
onclick="openCart()">

🛒 Cart

<span
id="cartCount"
class="cart-count">
0
</span>

</button></nav></header><main><section class="hero"><div><h1>Learn. Shop. Grow.</h1><p>
Discover premium courses, study materials,
digital resources and educational products
from LetsStudy Pro.
</p><button onclick="document.getElementById('products').scrollIntoView()">
Explore Marketplace
</button></div><div style="font-size:75px">
🛍️
</div></section><div class="layout"><aside class="sidebar"><h3>Categories</h3><button
class="category selected"
data-category="all">
All Products
</button>

<button
class="category"
data-category="courses">
Courses
</button>

<button
class="category"
data-category="notes">
Notes & PDFs
</button>

<button
class="category"
data-category="books">
Books
</button>

<button
class="category"
data-category="past-papers">
Past Papers
</button>

<button
class="category"
data-category="software">
Digital Tools
</button>

</aside><section id="products"><div class="content-top"><h2 id="resultTitle">
All Products
</h2><select
id="sort"
class="sort">

<option value="newest">
Newest
</option><option value="low">
Price: Low → High
</option><option value="high">
Price: High → Low
</option><option value="rating">
Top Rated
</option></select></div><div
id="grid"
class="grid"><div class="empty">
Loading marketplace...
</div></div></section></div></main><!-- PRODUCT MODAL --><div
id="productModal"
class="modal"><div class="modal-box"><div class="modal-head"><h2>Product Details</h2><button
class="close"
onclick="closeModal('productModal')">
✕
</button>

</div><div id="productDetails"></div></div></div><!-- CART MODAL --><div
id="cartModal"
class="modal"><div class="modal-box"><div class="modal-head"><h2>🛒 Your Cart</h2><button
class="close"
onclick="closeModal('cartModal')">
✕
</button>

</div><div id="cartItems"></div><div class="total"><span>Total</span>

<span id="cartTotal">
TZS 0
</span></div><button
class="buy"
onclick="checkout()">
Proceed to Checkout
</button>

</div></div><div
id="toast"
class="toast">
Added to cart
</div><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
getDocs,
query,
where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig={

apiKey:"YOUR_API_KEY",

authDomain:
"YOUR_PROJECT.firebaseapp.com",

projectId:
"YOUR_PROJECT_ID",

storageBucket:
"YOUR_PROJECT.firebasestorage.app",

messagingSenderId:
"YOUR_MESSAGING_SENDER_ID",

appId:
"YOUR_APP_ID"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
   STATE
========================================= */

let products=[];

let selectedCategory="all";

let currentUser=null;

let cart=
JSON.parse(
localStorage.getItem("letsstudy_cart")||"[]"
);


/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
auth,
user=>{

currentUser=user;

}
);


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

const grid=
document.getElementById("grid");

try{

const snap=
await getDocs(
collection(db,"marketplace")
);

products=
snap.docs.map(
doc=>({

id:doc.id,
...doc.data()

})
);

render();

}catch(error){

console.error(error);

grid.innerHTML=`
<div class="empty">
<h3>Marketplace unavailable</h3>
<p>Please check your Firebase configuration.</p>
</div>`;

}

}


/* =========================================
   RENDER
========================================= */

function render(){

const search=
document
.getElementById("search")
.value
.toLowerCase()
.trim();

const sort=
document
.getElementById("sort")
.value;


let data=
products.filter(p=>{

const categoryMatch=
selectedCategory==="all"||
p.category===selectedCategory;

const text=
`${p.title||""} ${p.description||""} ${p.category||""}`
.toLowerCase();

return categoryMatch&&text.includes(search);

});


if(sort==="low")
data.sort(
(a,b)=>
Number(a.price||0)-
Number(b.price||0)
);

if(sort==="high")
data.sort(
(a,b)=>
Number(b.price||0)-
Number(a.price||0)
);

if(sort==="rating")
data.sort(
(a,b)=>
Number(b.rating||0)-
Number(a.rating||0)
);


document.getElementById("resultTitle")
.textContent=
selectedCategory==="all"
?"All Products"
:selectedCategory
.replace("-"," ")
.replace(/\b\w/g,c=>c.toUpperCase());


const grid=
document.getElementById("grid");


if(!data.length){

grid.innerHTML=`
<div class="empty">

<h3>No products found</h3>

<p>
Try another search or category.
</p>

</div>`;

return;

}


grid.innerHTML=
data.map(productCard).join("");

}


/* =========================================
   PRODUCT CARD
========================================= */

function productCard(p){

const price=
Number(p.price||0);

const old=
Number(p.oldPrice||0);

return`

<article class="product">

<div class="product-img">

<img
src="${esc(p.image||"https://via.placeholder.com/600x400?text=LetsStudy+Pro")}"
alt="${esc(p.title||"Product")}"
loading="lazy"
onerror="this.src='https://via.placeholder.com/600x400?text=LetsStudy+Pro'"
>

${p.featured?
`<span class="featured">FEATURED</span>`
:""}

</div>

<div class="product-body">

<span class="product-category">
${esc(p.category||"Product")}
</span>

<h3>
${esc(p.title||"Untitled Product")}
</h3>

<div class="description">
${esc(
(p.description||"Premium educational product.")
.substring(0,100)
)}
</div>

<div class="rating">
⭐ ${Number(p.rating||0).toFixed(1)}
</div>

<div class="price">

TZS ${price.toLocaleString()}

${old>price?
`<span class="old-price">
TZS ${old.toLocaleString()}
</span>`:""}

</div>

<div class="actions">

<button
class="view"
onclick="viewProduct('${p.id}')">
View
</button>

<button
class="add"
onclick="addToCart('${p.id}')">
🛒 Add
</button>

</div>

</div>

</article>

`;

}


/* =========================================
   VIEW PRODUCT
========================================= */

window.viewProduct=function(id){

const p=
products.find(x=>x.id===id);

if(!p)return;

document.getElementById(
"productDetails"
).innerHTML=`

<img
class="detail-img"
src="${esc(p.image||"https://via.placeholder.com/700x400?text=LetsStudy+Pro")}"
alt="${esc(p.title||"Product")}"
>

<div style="margin-top:15px">

<span class="product-category">
${esc(p.category||"Product")}
</span>

<h2>
${esc(p.title||"Product")}
</h2>

<div class="rating">
⭐ ${Number(p.rating||0).toFixed(1)}
</div>

<div class="detail-price">
TZS ${Number(p.price||0).toLocaleString()}
</div>

<p style="line-height:1.7;color:#64748b">
${esc(p.description||"No description available.")}
</p>

<button
class="buy"
onclick="addToCart('${p.id}');closeModal('productModal')">

🛒 Add to Cart

</button>

</div>

`;

openModal("productModal");

};


/* =========================================
   CART
========================================= */

window.addToCart=function(id){

const product=
products.find(p=>p.id===id);

if(!product)return;

const exists=
cart.find(x=>x.id===id);

if(exists){

exists.quantity++;

}else{

cart.push({
id:product.id,
title:product.title,
price:Number(product.price||0),
image:product.image||"",
quantity:1
});

}

saveCart();

toast("Added to cart");

};


function saveCart(){

localStorage.setItem(
"letsstudy_cart",
JSON.stringify(cart)
);

updateCartCount();

}


function updateCartCount(){

const count=
cart.reduce(
(a,x)=>a+Number(x.quantity||1),
0
);

document.getElementById(
"cartCount"
).textContent=count;

}


window.openCart=function(){

renderCart();

openModal("cartModal");

};


function renderCart(){

const box=
document.getElementById("cartItems");

if(!cart.length){

box.innerHTML=`
<div class="empty">
Your cart is empty.
</div>`;

document.getElementById(
"cartTotal"
).textContent="TZS 0";

return;

}


box.innerHTML=
cart.map((item,index)=>`

<div class="cart-item">

<img
src="${esc(item.image||"https://via.placeholder.com/100")}"
alt="${esc(item.title)}"
>

<div class="cart-info">

<strong>
${esc(item.title)}
</strong>

<small>
TZS ${Number(item.price).toLocaleString()}
× ${item.quantity}
</small>

</div>

<button
class="remove"
onclick="removeCart(${index})">
✕
</button>

</div>

`).join("");


const total=
cart.reduce(
(a,x)=>
a+
(Number(x.price)||0)*
(Number(x.quantity)||1),
0
);


document.getElementById(
"cartTotal"
).textContent=
"TZS "+total.toLocaleString();

}


window.removeCart=function(index){

cart.splice(index,1);

saveCart();

renderCart();

};


/* =========================================
   CHECKOUT
========================================= */

window.checkout=function(){

if(!cart.length){

toast("Your cart is empty");

return;

}

if(!currentUser){

location.href=
"login.html?redirect=marketplace.html";

return;

}

localStorage.setItem(
"checkout_cart",
JSON.stringify(cart)
);

location.href="checkout.html";

};


/* =========================================
   CATEGORY
========================================= */

document
.querySelectorAll(".category")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

document
.querySelectorAll(".category")
.forEach(x=>
x.classList.remove("selected")
);

button.classList.add("selected");

selectedCategory=
button.dataset.category;

render();

}
);

});


/* =========================================
   SEARCH / SORT
========================================= */

document
.getElementById("search")
.addEventListener(
"input",
render
);

document
.getElementById("sort")
.addEventListener(
"change",
render
);


/* =========================================
   MODAL
========================================= */

window.openModal=function(id){

document
.getElementById(id)
.classList.add("show");

};

window.closeModal=function(id){

document
.getElementById(id)
.classList.remove("show");

};


/* =========================================
   TOAST
========================================= */

function toast(text){

const el=
document.getElementById("toast");

el.textContent=text;

el.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>el.classList.remove("show"),
2500
);

}


/* =========================================
   SECURITY ESCAPE
========================================= */

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
   INIT
========================================= */

updateCartCount();

loadProducts();

</script></body>
</html>
