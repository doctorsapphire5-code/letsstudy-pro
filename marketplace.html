<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketplace | LetsStudy Pro</title>

<meta name="description"
content="Discover courses, digital products and learning resources on LetsStudy Pro.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f8fb;
  color:#172033;
  font-family:Inter,Arial,sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
input,
select{
  font:inherit;
}

.top{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#155eef;
}

.cart-link{
  font-size:13px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:7px;
}

.cart-count{
  min-width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#155eef;
  color:#fff;
  border-radius:50%;
  font-size:10px;
}

.hero{
  background:linear-gradient(135deg,#155eef,#073bba);
  color:#fff;
  padding:48px 20px;
}

.hero-inner{
  max-width:1100px;
  margin:auto;
}

.hero h1{
  margin:0 0 10px;
  font-size:36px;
}

.hero p{
  margin:0;
  max-width:680px;
  color:#dbe7ff;
  line-height:1.7;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 20px;
}

.toolbar{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:10px;
  margin-bottom:18px;
}

input,
select{
  width:100%;
  padding:11px 12px;
  border:1px solid #d9dee8;
  border-radius:9px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus{
  border-color:#155eef;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#155eef;
  color:#fff;
}

.count{
  color:#667085;
  font-size:13px;
  margin-bottom:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px #00000012;
}

.thumb{
  height:190px;
  background:#e9eef7;
  position:relative;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.featured{
  position:absolute;
  top:11px;
  left:11px;
  background:#f59e0b;
  color:#fff;
  padding:6px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
}

.discount{
  position:absolute;
  top:11px;
  right:11px;
  background:#d92d20;
  color:#fff;
  padding:6px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
}

.body{
  padding:16px;
}

.type{
  color:#155eef;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
}

.body h2{
  margin:6px 0 7px;
  font-size:17px;
  line-height:1.4;
}

.description{
  color:#667085;
  font-size:12px;
  line-height:1.6;
  min-height:40px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:11px 0;
}

.tag{
  background:#f2f4f7;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  color:#475467;
}

.rating{
  color:#f59e0b;
  font-size:12px;
}

.rating span{
  color:#667085;
}

.price{
  margin:12px 0 6px;
}

.old{
  color:#98a2b3;
  text-decoration:line-through;
  font-size:12px;
  margin-right:6px;
}

.current{
  font-size:18px;
  font-weight:800;
}

.sales{
  color:#667085;
  font-size:11px;
  margin-top:5px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.actions a,
.actions button{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}

.view{
  background:#eef2f6;
  color:#344054;
}

.buy{
  background:#155eef;
  color:#fff;
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  text-align:center;
  padding:60px 20px;
  color:#667085;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:70px;
  color:#667085;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#101828;
  color:#fff;
  padding:13px 17px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transform:translateY(15px);
  transition:.25s;
  z-index:999;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .hero h1{
    font-size:28px;
  }

  .container{
    padding:0 15px;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>


<body>

<!-- HEADER -->

<header class="top">

  <a href="index.html" class="logo">
    LetsStudy Pro
  </a>

  <a href="cart.html" class="cart-link">

    <i class="fa-solid fa-cart-shopping"></i>

    Cart

    <span
      id="cartCount"
      class="cart-count">
      0
    </span>

  </a>

</header>


<!-- HERO -->

<section class="hero">

  <div class="hero-inner">

    <h1>
      LetsStudy Marketplace
    </h1>

    <p>
      Discover courses, digital products,
      learning resources and educational
      products from the LetsStudy Pro ecosystem.
    </p>

  </div>

</section>


<!-- CONTENT -->

<main class="container">

  <!-- FILTERS -->

  <section class="toolbar">

    <input
      id="search"
      type="search"
      placeholder="Search products, courses..."
    >

    <select id="category">

      <option value="">
        All Categories
      </option>

    </select>


    <select id="type">

      <option value="">
        All Types
      </option>

    </select>


    <button
      class="primary"
      id="clear">

      <i class="fa-solid fa-filter-circle-xmark"></i>

      Clear

    </button>

  </section>


  <div
    id="count"
    class="count">

    Loading products...

  </div>


  <!-- PRODUCTS -->

  <section
    id="products"
    class="grid">

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>
        Loading marketplace...
      </p>

    </div>

  </section>

</main>


<!-- TOAST -->

<div
  id="toast"
  class="toast">
</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const firebaseApp =
  initializeApp(firebaseConfig);


const db =
  getFirestore(firebaseApp);


/* =========================================
   STATE
========================================= */

let products = [];


/* =========================================
   DOM
========================================= */

const productsEl =
  document.getElementById("products");

const searchEl =
  document.getElementById("search");

const categoryEl =
  document.getElementById("category");

const typeEl =
  document.getElementById("type");

const countEl =
  document.getElementById("count");

const cartCountEl =
  document.getElementById("cartCount");

const toastEl =
  document.getElementById("toast");


/* =========================================
   ESCAPE
========================================= */

function esc(value = ""){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "marketplace"
        )
      );


    products = [];


    snapshot.forEach(docSnap => {

      products.push({

        id:docSnap.id,

        ...docSnap.data()

      });

    });


    /*
      Public marketplace
      only shows published items.
    */

    products =
      products.filter(
        product =>

          product.status === "published"

          ||

          product.status === undefined

      );


    buildFilters();

    renderProducts();

    updateCartCount();


  }catch(error){

    console.error(
      "Marketplace error:",
      error
    );


    countEl.textContent =
      "Unable to load products.";


    productsEl.innerHTML = `

      <div class="empty">

        <i
          class="fa-solid fa-triangle-exclamation">
        </i>

        <h3>
          Marketplace unavailable
        </h3>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


/* =========================================
   FILTER OPTIONS
========================================= */

function buildFilters(){

  const categories =

    [
      ...new Set(

        products

          .map(
            product =>
              product.category
          )

          .filter(Boolean)

      )

    ].sort();


  const types =

    [
      ...new Set(

        products

          .map(
            product =>
              product.type
          )

          .filter(Boolean)

      )

    ].sort();


  categoryEl.innerHTML = `

    <option value="">
      All Categories
    </option>

    ${
      categories.map(
        category => `

          <option
            value="${esc(category)}">

            ${esc(category)}

          </option>

        `
      ).join("")
    }

  `;


  typeEl.innerHTML = `

    <option value="">
      All Types
    </option>

    ${
      types.map(
        type => `

          <option
            value="${esc(type)}">

            ${esc(type)}

          </option>

        `
      ).join("")
    }

  `;

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

  const keyword =

    searchEl.value
      .toLowerCase()
      .trim();


  const selectedCategory =
    categoryEl.value;


  const selectedType =
    typeEl.value;


  let filtered =

    products.filter(
      product => {


        const searchableText = `

          ${product.title || ""}

          ${product.description || ""}

          ${product.shortDescription || ""}

          ${product.category || ""}

          ${product.type || ""}

        `.toLowerCase();


        const matchesSearch =

          searchableText
            .includes(keyword);


        const matchesCategory =

          !selectedCategory

          ||

          product.category ===
            selectedCategory;


        const matchesType =

          !selectedType

          ||

          product.type ===
            selectedType;


        return (

          matchesSearch

          &&

          matchesCategory

          &&

          matchesType

        );

      }

    );


  /*
    Featured products first.
  */

  filtered.sort(

    (a,b) =>

      Number(
        b.featured || false
      )

      -

      Number(
        a.featured || false
      )

  );


  countEl.textContent =

    `${filtered.length} product${
      filtered.length === 1
        ? ""
        : "s"
    } found`;


  if(!filtered.length){

    productsEl.innerHTML = `

      <div class="empty">

        <i
          class="fa-solid fa-store">
        </i>

        <h3>
          No products found
        </h3>

        <p>
          Try another search or category.
        </p>

      </div>

    `;

    return;

  }


  productsEl.innerHTML =

    filtered
      .map(
        createProductCard
      )
      .join("");

}


/* =========================================
   PRODUCT CARD
========================================= */

function createProductCard(product){

  const image =

    product.thumbnail

    ||

    product.imageUrl

    ||

    "https://via.placeholder.com/700x400?text=Product";


  const price =

    Number(
      product.price || 0
    );


  const discountPrice =

    Number(
      product.discountPrice || 0
    );


  const hasDiscount =

    discountPrice > 0

    &&

    discountPrice < price;


  const finalPrice =

    hasDiscount

      ? discountPrice

      : price;


  const currency =

    product.currency || "TZS";


  const rating =

    Number(
      product.rating || 0
    );


  const ratingCount =

    Number(
      product.ratingCount || 0
    );


  const salesCount =

    Number(
      product.salesCount || 0
    );


  const stars =

    Math.max(
      0,
      Math.min(
        5,
        Math.round(rating)
      )
    );


  return `

    <article class="card">

      <!-- IMAGE -->

      <div class="thumb">

        <img
          src="${esc(image)}"
          alt="${esc(
            product.title ||
            "Product"
          )}"
          loading="lazy"
        >


        ${
          product.featured

          ?

          `

            <span class="featured">

              <i
                class="fa-solid fa-star">
              </i>

              Featured

            </span>

          `

          :

          ""

        }


        ${
          hasDiscount

          ?

          `

            <span class="discount">

              Sale

            </span>

          `

          :

          ""

        }

      </div>


      <!-- BODY -->

      <div class="body">


        <div class="type">

          ${esc(
            product.type ||
            "Product"
          )}

        </div>


        <h2>

          ${esc(
            product.title ||
            "Untitled Product"
          )}

        </h2>


        <div class="description">

          ${esc(
            product.shortDescription ||

            product.description ||

            "Educational product available on LetsStudy Pro."
          )}

        </div>


        <!-- TAGS -->

        <div class="tags">

          ${
            product.category

            ?

            `

              <span class="tag">

                ${esc(
                  product.category
                )}

              </span>

            `

            :

            ""

          }


          ${
            product.courseId

            ?

            `

              <span class="tag">

                <i
                  class="fa-solid fa-graduation-cap">
                </i>

                Course

              </span>

            `

            :

            ""

          }

        </div>


        <!-- RATING -->

        <div class="rating">

          ${
            "★".repeat(stars)
          }${
            "☆".repeat(
              5 - stars
            )
          }

          <span>

            ${rating.toFixed(1)}

            ·

            ${ratingCount.toLocaleString()}

            reviews

          </span>

        </div>


        <!-- PRICE -->

        <div class="price">

          ${
            hasDiscount

            ?

            `

              <span class="old">

                ${esc(currency)}

                ${price.toLocaleString()}

              </span>

            `

            :

            ""

          }


          <span class="current">

            ${esc(currency)}

            ${finalPrice.toLocaleString()}

          </span>

        </div>


        <!-- SALES -->

        <div class="sales">

          <i
            class="fa-solid fa-bag-shopping">
          </i>

          ${salesCount.toLocaleString()}

          sales

        </div>


        <!-- ACTIONS -->

        <div class="actions">


          <a
            class="view"
            href="product.html?productId=${encodeURIComponent(
              product.id
            )}">

            <i
              class="fa-solid fa-eye">
            </i>

            View

          </a>


          <button
            class="buy"
            onclick="addToCart('${esc(
              product.id
            )}')">

            <i
              class="fa-solid fa-cart-plus">
            </i>

            Add to Cart

          </button>


        </div>


      </div>

    </article>

  `;

}


/* =========================================
   ADD TO CART
========================================= */

window.addToCart = function(productId){

  try{

    let cart =

      JSON.parse(

        localStorage.getItem(
          "letsStudyCart"
        )

        ||

        "[]"

      );


    /*
      Check existing product.
    */

    const existing =

      cart.find(
        item =>
          item.productId ===
          productId
      );


    if(existing){

      existing.quantity =

        Number(
          existing.quantity || 1
        )

        +

        1;

    }else{

      cart.push({

        productId:

          productId,

        quantity:

          1,

        addedAt:

          Date.now()

      });

    }


    /*
      Save cart.
    */

    localStorage.setItem(

      "letsStudyCart",

      JSON.stringify(cart)

    );


    updateCartCount();


    showToast(
      "Product added to cart"
    );


    /*
      Directly go to cart.html.
    */

    setTimeout(
      ()=>{

        window.location.href =
          "cart.html";

      },
      350
    );


  }catch(error){

    console.error(
      "Cart error:",
      error
    );


    showToast(
      "Unable to add product"
    );

  }

};


/* =========================================
   CART COUNT
========================================= */

function updateCartCount(){

  try{

    const cart =

      JSON.parse(

        localStorage.getItem(
          "letsStudyCart"
        )

        ||

        "[]"

      );


    const count =

      cart.reduce(

        (total,item)=>

          total +

          Number(
            item.quantity || 1
          ),

        0

      );


    cartCountEl.textContent =
      count;


  }catch{

    cartCountEl.textContent =
      "0";

  }

}


/* =========================================
   TOAST
========================================= */

function showToast(message){

  toastEl.textContent =
    message;


  toastEl.classList.add(
    "show"
  );


  setTimeout(
    ()=>{

      toastEl.classList.remove(
        "show"
      );

    },
    1800
  );

}


/* =========================================
   EVENTS
========================================= */

searchEl.addEventListener(
  "input",
  renderProducts
);


categoryEl.addEventListener(
  "change",
  renderProducts
);


typeEl.addEventListener(
  "change",
  renderProducts
);


document
  .getElementById("clear")
  .addEventListener(
    "click",
    ()=>{

      searchEl.value = "";

      categoryEl.value = "";

      typeEl.value = "";

      renderProducts();

    }
  );


/* =========================================
   START
========================================= */

loadProducts();

</script>

</body>
</html>
