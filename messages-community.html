<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Messages | LetsStudy Pro</title>

<meta name="description"
content="Send and manage community messages on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  height:62px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:10
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:20px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer
}

.container{
  width:94%;
  max-width:1000px;
  margin:20px auto
}

.layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:15px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  overflow:hidden
}

.search{
  width:100%;
  border:0;
  border-bottom:1px solid #e5e7eb;
  padding:14px;
  outline:none
}

.users{
  max-height:620px;
  overflow:auto
}

.user{
  display:flex;
  gap:11px;
  padding:13px;
  cursor:pointer;
  border-bottom:1px solid #f0f2f5
}

.user:hover,
.user.active{
  background:#f8fafc
}

.avatar{
  width:40px;
  height:40px;
  min-width:40px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700
}

.user-name{
  font-size:14px;
  font-weight:700
}

.user-email{
  font-size:11px;
  color:#64748b;
  overflow:hidden;
  text-overflow:ellipsis
}

.chat{
  display:flex;
  flex-direction:column;
  min-height:620px
}

.chat-header{
  padding:16px;
  border-bottom:1px solid #e5e7eb;
  font-weight:800
}

.messages{
  flex:1;
  padding:18px;
  overflow:auto;
  min-height:470px;
  max-height:550px;
  background:#f8fafc
}

.message{
  max-width:75%;
  margin-bottom:10px;
  padding:10px 12px;
  border-radius:12px;
  font-size:13px;
  overflow-wrap:anywhere
}

.message.mine{
  margin-left:auto;
  background:#2563eb;
  color:#fff
}

.message.theirs{
  margin-right:auto;
  background:#fff;
  border:1px solid #e5e7eb
}

.time{
  display:block;
  font-size:9px;
  opacity:.7;
  margin-top:4px
}

.composer{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #e5e7eb;
  background:#fff
}

.composer textarea{
  flex:1;
  resize:none;
  border:1px solid #dbe2ea;
  border-radius:9px;
  padding:10px;
  outline:none;
  min-height:42px
}

.send{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:0 17px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed
}

.empty{
  text-align:center;
  color:#64748b;
  padding:50px 15px;
  font-size:13px
}

.notice{
  font-size:12px;
  color:#64748b;
  padding:12px;
  text-align:center
}

.error{
  color:#b91c1c
}

@media(max-width:700px){

  .layout{
    grid-template-columns:1fr
  }

  .users{
    max-height:230px
  }

  .chat{
    min-height:550px
  }

  .messages{
    min-height:380px
  }

}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <div class="layout">

    <!-- USERS -->

    <section class="card">

      <input
        id="userSearch"
        class="search"
        placeholder="Search people..."
        autocomplete="off"
      >

      <div
        id="users"
        class="users"
      >
        <div class="notice">
          Loading conversations...
        </div>
      </div>

    </section>


    <!-- CHAT -->

    <section class="card chat">

      <div
        id="chatHeader"
        class="chat-header"
      >
        Select a conversation
      </div>


      <div
        id="messages"
        class="messages"
      >

        <div class="empty">
          Select a person to start messaging.
        </div>

      </div>


      <form
        id="form"
        class="composer"
      >

        <textarea
          id="input"
          placeholder="Write a message..."
          maxlength="5000"
          disabled
        ></textarea>

        <button
          id="send"
          class="send"
          type="submit"
          disabled
        >
          Send
        </button>

      </form>

    </section>

  </div>

</main>


<script>

/*
==================================================
MESSAGE-COMMUNITY.HTML

QUERY:

message-community.html?userId=USER_ID
message-community.html?conversationId=CONVERSATION_ID

API ENDPOINTS EXPECTED:

GET
/api/community/users

GET
/api/community/messages?conversationId=ID

POST
/api/community/messages

BODY:

{
  conversationId,
  senderId,
  receiverId,
  text
}

NO DIRECT FIREBASE
==================================================
*/


const params =
  new URLSearchParams(
    location.search
  );


const currentUserId =
  params.get("userId") ||
  localStorage.getItem(
    "userId"
  ) ||
  "";


const usersBox =
  document.getElementById(
    "users"
  );

const messagesBox =
  document.getElementById(
    "messages"
  );

const chatHeader =
  document.getElementById(
    "chatHeader"
  );

const input =
  document.getElementById(
    "input"
  );

const send =
  document.getElementById(
    "send"
  );

const form =
  document.getElementById(
    "form"
  );

const userSearch =
  document.getElementById(
    "userSearch"
  );


let users = [];
let selectedUser = null;
let selectedConversation = null;


/* =========================
   LOAD USERS
========================= */

loadUsers();


async function loadUsers(){

  try{

    const response =
      await fetch(
        "/api/community/users"
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load users."
      );

    }


    users =
      Array.isArray(
        result.users
      )
      ? result.users
      : Array.isArray(
          result.results
        )
        ? result.results
        : [];


    renderUsers();

  }catch(error){

    console.error(error);

    usersBox.innerHTML = `

      <div class="notice error">

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   USERS
========================= */

function renderUsers(){

  const keyword =
    userSearch.value
      .trim()
      .toLowerCase();


  const filtered =
    users.filter(
      user => {

        const id =
          user.id ||
          user.uid;


        if(
          currentUserId &&
          id === currentUserId
        ){

          return false;

        }


        const text =
          (
            user.name ||
            user.displayName ||
            "" +
            " " +
            user.email ||
            ""
          ).toLowerCase();


        return (
          !keyword ||
          text.includes(
            keyword
          )
        );

      }
    );


  if(!filtered.length){

    usersBox.innerHTML = `

      <div class="notice">
        No people found.
      </div>

    `;

    return;

  }


  usersBox.innerHTML =
    filtered
      .map(
        user => {

          const id =
            user.id ||
            user.uid ||
            "";


          const name =
            user.name ||
            user.displayName ||
            "User";


          const initial =
            name
              .trim()
              .charAt(0)
              .toUpperCase();


          return `

            <div
              class="user ${
                selectedUser &&
                (
                  selectedUser.id ||
                  selectedUser.uid
                ) === id
                ? "active"
                : ""
              }"
              data-id="${escapeAttr(id)}"
            >

              <div class="avatar">

                ${escapeHTML(
                  initial
                )}

              </div>


              <div>

                <div class="user-name">

                  ${escapeHTML(
                    name
                  )}

                </div>


                <div class="user-email">

                  ${escapeHTML(
                    user.email ||
                    ""
                  )}

                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");


  document
    .querySelectorAll(
      ".user"
    )
    .forEach(
      element => {

        element.addEventListener(
          "click",
          () => {

            const id =
              element.dataset.id;


            const user =
              users.find(
                item =>
                  (
                    item.id ||
                    item.uid
                  ) === id
              );


            if(user){

              openConversation(
                user
              );

            }

          }
        );

      }
    );

}


/* =========================
   OPEN CONVERSATION
========================= */

async function openConversation(
  user
){

  selectedUser =
    user;


  selectedConversation =
    null;


  const name =
    user.name ||
    user.displayName ||
    "User";


  chatHeader.textContent =
    name;


  input.disabled = false;
  send.disabled = false;


  messagesBox.innerHTML = `

    <div class="empty">
      Loading messages...
    </div>

  `;


  renderUsers();


  try{

    const otherUserId =
      user.id ||
      user.uid;


    const response =
      await fetch(
        "/api/community/conversation?" +
        new URLSearchParams({

          userId:
            currentUserId,

          otherUserId:
            otherUserId

        })
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to open conversation."
      );

    }


    selectedConversation =
      result.conversationId ||
      result.id;


    await loadMessages();

  }catch(error){

    messagesBox.innerHTML = `

      <div class="empty error">

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(!selectedConversation)
    return;


  try{

    const response =
      await fetch(
        "/api/community/messages?" +
        new URLSearchParams({

          conversationId:
            selectedConversation

        })
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load messages."
      );

    }


    const messages =
      Array.isArray(
        result.messages
      )
      ? result.messages
      : Array.isArray(
          result.results
        )
        ? result.results
        : [];


    renderMessages(
      messages
    );

  }catch(error){

    console.error(
      error
    );

  }

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(
  messages
){

  if(!messages.length){

    messagesBox.innerHTML = `

      <div class="empty">
        No messages yet. Say hello!
      </div>

    `;

    return;

  }


  messagesBox.innerHTML =
    messages
      .map(
        message => {

          const mine =
            (
              message.senderId ||
              message.sender_id
            ) === currentUserId;


          return `

            <div
              class="message ${
                mine
                ? "mine"
                : "theirs"
              }"
            >

              ${escapeHTML(
                message.text ||
                message.message ||
                ""
              ).replace(
                /\n/g,
                "<br>"
              )}


              <span class="time">

                ${escapeHTML(
                  formatDate(
                    message.createdAt ||
                    message.timestamp
                  )
                )}

              </span>

            </div>

          `;

        }
      )
      .join("");


  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}


/* =========================
   SEND
========================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const text =
      input.value.trim();


    if(
      !text ||
      !selectedUser ||
      !selectedConversation
    ){

      return;

    }


    send.disabled = true;


    try{

      const receiverId =
        selectedUser.id ||
        selectedUser.uid;


      const response =
        await fetch(
          "/api/community/messages",
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              conversationId:
                selectedConversation,

              senderId:
                currentUserId,

              receiverId:
                receiverId,

              text:
                text

            })

          }
        );


      const result =
        await response.json();


      if(!response.ok){

        throw new Error(
          result.error ||
          "Message could not be sent."
        );

      }


      input.value = "";


      await loadMessages();

    }catch(error){

      alert(
        error.message
      );

    }finally{

      send.disabled = false;

      input.focus();

    }

  }
);


/* =========================
   SEARCH
========================= */

userSearch.addEventListener(
  "input",
  renderUsers
);


/* =========================
   POLLING
========================= */

setInterval(
  () => {

    if(
      selectedConversation
    ){

      loadMessages();

    }

  },
  5000
);


/* =========================
   DATE
========================= */

function formatDate(
  value
){

  if(!value)
    return "";


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return date.toLocaleString(
    undefined,
    {
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  ).replace(
    /`/g,
    "&#096;"
  );

}

</script>

</body>
</html>
