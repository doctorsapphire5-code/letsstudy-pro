<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Messages | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="Community messaging on Let'sStudy Pro."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
  --danger:#b91c1c;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);

  display:flex;
  flex-direction:column;
}


/* =========================
   HEADER
========================= */

.topbar{
  height:64px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  position:sticky;
  top:0;
  z-index:50;

  background:
    rgba(255,255,255,.97);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);
}

.header-left{
  min-width:0;

  display:flex;
  align-items:center;

  gap:10px;
}

.back-btn{
  width:38px;
  height:38px;

  border:0;

  border-radius:10px;

  background:var(--soft);

  color:var(--text);

  font-size:18px;

  cursor:pointer;
}

.avatar{
  width:38px;
  height:38px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border-radius:50%;

  background:var(--soft);

  font-size:11px;
  font-weight:850;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.header-info{
  min-width:0;
}

.header-name{
  font-size:13px;
  font-weight:850;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-type{
  margin-top:2px;

  color:var(--muted);

  font-size:9px;

  text-transform:capitalize;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:5px;
}

.icon-btn{
  width:35px;
  height:35px;

  border:0;

  border-radius:9px;

  background:var(--soft);

  color:var(--text);

  cursor:pointer;
}


/* =========================
   MESSAGES AREA
========================= */

.chat{
  width:100%;
  max-width:850px;

  margin:auto;

  flex:1;

  display:flex;
  flex-direction:column;

  min-height:
    calc(100vh - 64px);
}

.messages{
  flex:1;

  overflow-y:auto;

  padding:
    20px 15px
    110px;

  display:flex;
  flex-direction:column;

  gap:9px;
}


/* =========================
   MESSAGE
========================= */

.message-row{
  display:flex;

  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-bubble{
  max-width:75%;

  padding:
    9px 12px;

  border-radius:15px;

  background:#fff;

  border:
    1px solid var(--border);

  box-shadow:
    0 1px 2px
    rgba(15,23,42,.03);
}

.mine .message-bubble{
  background:var(--primary);
  color:#fff;

  border-color:
    var(--primary);

  border-bottom-right-radius:4px;
}

.theirs .message-bubble{
  border-bottom-left-radius:4px;
}

.sender{
  margin-bottom:4px;

  color:var(--muted);

  font-size:9px;
  font-weight:800;
}

.mine .sender{
  color:#cbd5e1;
}

.text{
  font-size:12px;

  line-height:1.55;

  white-space:pre-wrap;

  overflow-wrap:anywhere;
}

.message-meta{
  display:flex;

  justify-content:flex-end;

  margin-top:4px;

  color:var(--muted);

  font-size:8px;
}

.mine .message-meta{
  color:#cbd5e1;
}


/* =========================
   EMPTY
========================= */

.empty-chat{
  flex:1;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:40px 20px;
}

.empty-chat-icon{
  font-size:45px;

  margin-bottom:10px;
}

.empty-chat h2{
  font-size:17px;
}

.empty-chat p{
  margin-top:5px;

  color:var(--muted);

  font-size:11px;
}


/* =========================
   COMPOSER
========================= */

.composer-wrap{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:40;

  padding:
    10px 15px;

  background:
    rgba(255,255,255,.97);

  backdrop-filter:blur(12px);

  border-top:
    1px solid var(--border);
}

.composer{
  width:100%;
  max-width:820px;

  margin:auto;

  display:flex;

  align-items:flex-end;

  gap:8px;
}

.message-input{
  flex:1;

  min-height:43px;
  max-height:120px;

  resize:none;

  padding:
    12px 13px;

  border:
    1px solid var(--border);

  border-radius:12px;

  outline:none;

  background:#fff;

  color:var(--text);

  font-family:inherit;

  font-size:12px;
}

.message-input:focus{
  border-color:#64748b;
}

.send-btn{
  width:45px;
  height:43px;

  flex-shrink:0;

  border:0;

  border-radius:11px;

  background:var(--primary);

  color:#fff;

  font-size:17px;

  cursor:pointer;
}

.send-btn:disabled{
  opacity:.5;

  cursor:not-allowed;
}


/* =========================
   LOADING
========================= */

.loading{
  min-height:100vh;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

.spinner{
  width:30px;
  height:30px;

  margin:
    0 auto
    10px;

  border:
    3px solid var(--border);

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   ERROR
========================= */

.error{
  display:none;

  position:fixed;

  top:75px;
  left:50%;

  z-index:100;

  transform:
    translateX(-50%);

  width:
    min(90%,
    450px);

  padding:11px 13px;

  border:
    1px solid #fecaca;

  border-radius:10px;

  background:#fef2f2;

  color:var(--danger);

  font-size:11px;
}

.error.show{
  display:block;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{
    padding:0 10px;
  }

  .messages{
    padding:
      15px 10px
      100px;
  }

  .message-bubble{
    max-width:84%;
  }

  .composer-wrap{
    padding:
      8px 9px;
    padding-bottom:
      max(
        8px,
        env(safe-area-inset-bottom)
      );
  }

}

</style>

</head>


<body>


<div
  id="loading"
  class="loading"
>

  <div>

    <div class="spinner"></div>

    <p>
      Loading conversation...
    </p>

  </div>

</div>


<div
  id="error"
  class="error"
></div>


<header
  id="topbar"
  class="topbar"
  style="display:none;"
>

  <div class="header-left">


    <button
      class="back-btn"
      type="button"
      onclick="goBack()"
      aria-label="Back"
    >
      ←
    </button>


    <div
      id="headerAvatar"
      class="avatar"
    >
      💬
    </div>


    <div class="header-info">

      <div
        id="headerName"
        class="header-name"
      >
        Conversation
      </div>


      <div
        id="headerType"
        class="header-type"
      >
        Community
      </div>

    </div>

  </div>


  <div class="header-actions">

    <button
      class="icon-btn"
      type="button"
      onclick="goBack()"
      aria-label="Close"
    >
      ×
    </button>

  </div>

</header>


<main
  id="chat"
  class="chat"
  style="display:none;"
>


  <section
    id="messages"
    class="messages"
  ></section>


  <section
    id="emptyChat"
    class="empty-chat"
    style="display:none;"
  >

    <div>

      <div class="empty-chat-icon">
        💬
      </div>

      <h2>
        Start a conversation
      </h2>

      <p>
        Send the first message.
      </p>

    </div>

  </section>


</main>


<div
  id="composerWrap"
  class="composer-wrap"
  style="display:none;"
>

  <form
    id="composer"
    class="composer"
  >

    <textarea
      id="messageInput"
      class="message-input"
      rows="1"
      maxlength="5000"
      placeholder="Write a message..."
    ></textarea>


    <button
      id="sendBtn"
      class="send-btn"
      type="submit"
      aria-label="Send"
    >
      ➤
    </button>

  </form>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();

const auth =
  firebase.auth();


/* =========================
   STATE
========================= */

let currentUser =
  null;

let conversationId =
  null;

let conversation =
  null;

let unsubscribeMessages =
  null;


/* =========================
   URL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


conversationId =
  params.get(
    "conversationId"
  ) ||
  params.get(
    "id"
  );


/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function getInitials(
  name
){

  return String(
    name ||
    "Member"
  )
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(
    word =>
      word
        .charAt(0)
        .toUpperCase()
  )
  .join("");

}


function formatTime(
  timestamp
){

  if(!timestamp){

    return "";

  }


  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);


    return date.toLocaleTimeString(
      undefined,
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }

  catch{

    return "";

  }

}


function showError(
  message
){

  const error =
    document.getElementById(
      "error"
    );

  error.textContent =
    message;

  error.classList.add(
    "show"
  );


  setTimeout(
    () => {

      error.classList.remove(
        "show"
      );

    },
    5000
  );

}


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
  async user => {

    currentUser =
      user;


    if(!user){

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      showError(
        "Please sign in to use messages."
      );

      return;

    }


    if(!conversationId){

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      showError(
        "Conversation ID is missing."
      );

      return;

    }


    await initializeConversation();

  }
);


/* =========================
   INITIALIZE
========================= */

async function initializeConversation(){

  try{

    await loadConversation();

    await setupHeader();

    listenForMessages();


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "topbar"
    ).style.display =
      "flex";


    document.getElementById(
      "chat"
    ).style.display =
      "flex";


    document.getElementById(
      "composerWrap"
    ).style.display =
      "block";

  }

  catch(error){

    console.error(
      "Conversation initialization error:",
      error
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    showError(
      "Unable to open this conversation."
    );

  }

}


/* =========================
   LOAD CONVERSATION
========================= */

async function loadConversation(){

  const snapshot =
    await db
      .collection(
        "conversations"
      )
      .doc(
        conversationId
      )
      .get();


  if(
    !snapshot.exists
  ){

    throw new Error(
      "Conversation not found."
    );

  }


  conversation =
    snapshot.data();


  const memberIds =
    Array.isArray(
      conversation.memberIds
    )
      ? conversation.memberIds
      : [];


  if(
    !memberIds.includes(
      currentUser.uid
    )
  ){

    throw new Error(
      "You are not a member of this conversation."
    );

  }

}


/* =========================
   HEADER
========================= */

async function setupHeader(){

  const type =
    conversation.type ||
    "direct";


  document.getElementById(
    "headerType"
  ).textContent =
    type;


  if(
    type ===
    "group"
  ){

    document.getElementById(
      "headerName"
    ).textContent =
      conversation.name ||
      "Group Conversation";


    document.getElementById(
      "headerAvatar"
    ).textContent =
      "👥";


    return;

  }


  const memberIds =
    Array.isArray(
      conversation.memberIds
    )
      ? conversation.memberIds
      : [];


  const otherId =
    memberIds.find(
      id =>
        id !==
        currentUser.uid
    );


  if(!otherId){

    document.getElementById(
      "headerName"
    ).textContent =
      "Direct Conversation";

    return;

  }


  try{

    const snapshot =
      await db
        .collection(
          "users"
        )
        .doc(
          otherId
        )
        .get();


    if(
      snapshot.exists
    ){

      const user =
        snapshot.data();


      const name =
        user.displayName ||
        user.username ||
        "Community Member";


      document.getElementById(
        "headerName"
      ).textContent =
        name;


      const avatar =
        document.getElementById(
          "headerAvatar"
        );


      if(
        user.photoURL
      ){

        avatar.innerHTML =
          `
            <img
              src="${escapeHTML(
                user.photoURL
              )}"
              alt="${escapeHTML(
                name
              )}"
              referrerpolicy="no-referrer"
            >
          `;

      }

      else{

        avatar.textContent =
          getInitials(
            name
          );

      }

    }

  }

  catch(error){

    console.error(
      "Header user error:",
      error
    );

  }

}


/* =========================
   REALTIME MESSAGES
========================= */

function listenForMessages(){

  if(
    unsubscribeMessages
  ){

    unsubscribeMessages();

  }


  unsubscribeMessages =
    db
      .collection(
        "messages"
      )
      .where(
        "conversationId",
        "==",
        conversationId
      )
      .orderBy(
        "createdAt",
        "asc"
      )
      .onSnapshot(

        snapshot => {

          renderMessages(
            snapshot
          );

        },

        error => {

          console.error(
            "Messages listener error:",
            error
          );


          showError(
            "Unable to load messages."
          );

        }

      );

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(
  snapshot
){

  const container =
    document.getElementById(
      "messages"
    );


  const empty =
    document.getElementById(
      "emptyChat"
    );


  container.innerHTML =
    "";


  if(
    snapshot.empty
  ){

    empty.style.display =
      "flex";

    return;

  }


  empty.style.display =
    "none";


  snapshot.forEach(
    doc => {

      renderMessage(
        doc.id,
        doc.data()
      );

    }
  );


  requestAnimationFrame(
    scrollToBottom
  );

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(
  messageId,
  data
){

  const container =
    document.getElementById(
      "messages"
    );


  const mine =
    data.senderId ===
    currentUser.uid;


  const row =
    document.createElement(
      "div"
    );


  row.className =
    mine
      ? "message-row mine"
      : "message-row theirs";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "message-bubble";


  const senderName =
    mine
      ? "You"
      : (
          data.senderName ||
          "Community Member"
        );


  const text =
    data.text ||
    "";


  bubble.innerHTML =
    `
      <div class="sender">

        ${escapeHTML(
          senderName
        )}

      </div>


      <div class="text">

        ${escapeHTML(
          text
        )}

      </div>


      <div class="message-meta">

        ${escapeHTML(
          formatTime(
            data.createdAt
          )
        )}

      </div>
    `;


  if(mine){

    bubble.title =
      "Click to delete";


    bubble.addEventListener(
      "click",
      () => {

        deleteMessage(
          messageId
        );

      }
    );

  }


  row.appendChild(
    bubble
  );


  container.appendChild(
    row
  );

}


/* =========================
   SEND MESSAGE
========================= */

document
  .getElementById(
    "composer"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      await sendMessage();

    }
  );


async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );


  const button =
    document.getElementById(
      "sendBtn"
    );


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(!currentUser){

    return;

  }


  if(!conversationId){

    return;

  }


  button.disabled =
    true;


  input.disabled =
    true;


  try{

    const now =
      firebase.firestore
        .FieldValue
        .serverTimestamp();


    const messageRef =
      db
        .collection(
          "messages"
        )
        .doc();


    const batch =
      db.batch();


    batch.set(
      messageRef,
      {

        conversationId:
          conversationId,

        senderId:
          currentUser.uid,

        senderName:
          currentUser.displayName ||
          currentUser.email ||
          "Community Member",

        senderPhoto:
          currentUser.photoURL ||
          "",

        text:
          text,

        type:
          "text",

        status:
          "sent",

        createdAt:
          now,

        updatedAt:
          now

      }
    );


    batch.update(
      db
        .collection(
          "conversations"
        )
        .doc(
          conversationId
        ),
      {

        lastMessage:
          text,

        lastMessageAt:
          now,

        updatedAt:
          now

      }
    );


    await batch.commit();


    input.value =
      "";


    autoResize();

    scrollToBottom();

  }

  catch(error){

    console.error(
      "Send message error:",
      error
    );


    showError(
      "Message could not be sent."
    );

  }

  finally{

    button.disabled =
      false;

    input.disabled =
      false;

    input.focus();

  }

}


/* =========================
   DELETE MESSAGE
========================= */

async function deleteMessage(
  messageId
){

  if(!currentUser){

    return;

  }


  const confirmed =
    window.confirm(
      "Delete this message?"
    );


  if(!confirmed){

    return;

  }


  try{

    const snapshot =
      await db
        .collection(
          "messages"
        )
        .doc(
          messageId
        )
        .get();


    if(
      !snapshot.exists
    ){

      return;

    }


    const data =
      snapshot.data();


    if(
      data.senderId !==
      currentUser.uid
    ){

      showError(
        "You can only delete your own messages."
            );

    }


    /* =========================
       REALTIME MESSAGES
    ========================= */

    function listenForMessages(){

      if(
        unsubscribeMessages
      ){

        unsubscribeMessages();

      }


      unsubscribeMessages =
        db
          .collection(
            "messages"
          )
          .where(
            "conversationId",
            "==",
            conversationId
          )
          .orderBy(
            "createdAt",
            "asc"
          )
          .onSnapshot(

            snapshot => {

              renderMessages(
                snapshot
              );

            },

            error => {

              console.error(
                "Messages listener error:",
                error
              );

              showError(
                "Unable to load messages."
              );

            }

          );

    }


    /* =========================
       RENDER MESSAGES
    ========================= */

    function renderMessages(
      snapshot
    ){

      const container =
        document.getElementById(
          "messages"
        );

      const empty =
        document.getElementById(
          "emptyChat"
        );


      container.innerHTML =
        "";


      if(
        snapshot.empty
      ){

        empty.style.display =
          "flex";

        return;

      }


      empty.style.display =
        "none";


      snapshot.forEach(
        doc => {

          renderMessage(
            doc.id,
            doc.data()
          );

        }
      );


      requestAnimationFrame(
        scrollToBottom
      );

    }


    /* =========================
       RENDER MESSAGE
    ========================= */

    function renderMessage(
      messageId,
      data
    ){

      const container =
        document.getElementById(
          "messages"
        );


      const mine =
        data.senderId ===
        currentUser.uid;


      const row =
        document.createElement(
          "div"
        );


      row.className =
        mine
          ? "message-row mine"
          : "message-row theirs";


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message-bubble";


      const senderName =
        mine
          ? "You"
          : (
              data.senderName ||
              "Community Member"
            );


      const text =
        data.text ||
        "";


      bubble.innerHTML =
        `
          <div class="sender">

            ${escapeHTML(
              senderName
            )}

          </div>

          <div class="text">

            ${escapeHTML(
              text
            )}

          </div>

          <div class="message-meta">

            ${escapeHTML(
              formatTime(
                data.createdAt
              )
            )}

          </div>
        `;


      if(mine){

        bubble.title =
          "Click to delete";


        bubble.addEventListener(
          "click",
          () => {

            deleteMessage(
              messageId
            );

          }
        );

      }


      row.appendChild(
        bubble
      );


      container.appendChild(
        row
      );

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    document
      .getElementById(
        "composer"
      )
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          await sendMessage();

        }
      );


    async function sendMessage(){

      const input =
        document.getElementById(
          "messageInput"
        );


      const button =
        document.getElementById(
          "sendBtn"
        );


      const text =
        input.value.trim();


      if(!text){

        return;

      }


      if(!currentUser){

        return;

      }


      if(!conversationId){

        return;

      }


      button.disabled =
        true;

      input.disabled =
        true;


      try{

        const now =
          firebase.firestore
            .FieldValue
            .serverTimestamp();


        const messageRef =
          db
            .collection(
              "messages"
            )
            .doc();


        const conversationRef =
          db
            .collection(
              "conversations"
            )
            .doc(
              conversationId
            );


        const batch =
          db.batch();


        batch.set(
          messageRef,
          {

            conversationId:
              conversationId,

            senderId:
              currentUser.uid,

            senderName:
              currentUser.displayName ||
              currentUser.email ||
              "Community Member",

            senderPhoto:
              currentUser.photoURL ||
              "",

            text:
              text,

            type:
              "text",

            status:
              "sent",

            createdAt:
              now,

            updatedAt:
              now

          }
        );


        batch.update(
          conversationRef,
          {

            lastMessage:
              text,

            lastMessageAt:
              now,

            updatedAt:
              now

          }
        );


        await batch.commit();


        input.value =
          "";


        autoResize();

        scrollToBottom();

      }

      catch(error){

        console.error(
          "Send message error:",
          error
        );


        showError(
          "Message could not be sent."
        );

      }

      finally{

        button.disabled =
          false;

        input.disabled =
          false;

        input.focus();

      }

    }


    /* =========================
       DELETE MESSAGE
    ========================= */

    async function deleteMessage(
      messageId
    ){

      if(!currentUser){

        return;

      }


      const confirmed =
        window.confirm(
          "Delete this message?"
        );


      if(!confirmed){

        return;

      }


      try{

        const messageRef =
          db
            .collection(
              "messages"
            )
            .doc(
              messageId
            );


        const snapshot =
          await messageRef.get();


        if(
          !snapshot.exists
        ){

          return;

        }


        const data =
          snapshot.data();


        if(
          data.senderId !==
          currentUser.uid
        ){

          showError(
            "You can only delete your own messages."
          );

          return;

        }


        await messageRef.delete();

      }

      catch(error){

        console.error(
          "Delete message error:",
          error
        );


        showError(
          "Unable to delete message."
        );

      }

    }


    /* =========================
       TEXTAREA
    ========================= */

    const input =
      document.getElementById(
        "messageInput"
      );


    input.addEventListener(
      "input",
      autoResize
    );


    function autoResize(){

      input.style.height =
        "auto";


      input.style.height =
        Math.min(
          input.scrollHeight,
          120
        ) + "px";

    }


    input.addEventListener(
      "keydown",
      event => {

        if(
          event.key ===
          "Enter" &&
          !event.shiftKey
        ){

          event.preventDefault();


          document
            .getElementById(
              "composer"
            )
            .requestSubmit();

        }

      }
    );


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom(){

      const container =
        document.getElementById(
          "messages"
        );


      container.scrollTop =
        container.scrollHeight;

    }


    /* =========================
       BACK
    ========================= */

    function goBack(){

      if(
        unsubscribeMessages
      ){

        unsubscribeMessages();

      }


      if(
        document.referrer &&
        document.referrer.startsWith(
          window.location.origin
        )
      ){

        window.history.back();

      }

      else{

        window.location.href =
          "community.html";

      }

    }


    /* =========================
       CLEANUP
    ========================= */

    window.addEventListener(
      "beforeunload",
      () => {

        if(
          unsubscribeMessages
        ){

          unsubscribeMessages();

        }

      }
    );


    /* =========================
       GLOBAL ERROR
    ========================= */

    window.addEventListener(
      "unhandledrejection",
      event => {

        console.error(
          "Unhandled Community error:",
          event.reason
        );

      }
    );


  </script>

</body>
