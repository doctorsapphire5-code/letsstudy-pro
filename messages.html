<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:2px;border-radius:4px}
.hd{background:#0f172a;flex:none}
.hd>div{width:min(1200px,94%);margin:auto;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.app{flex:1;min-height:0;width:min(1200px,100%);margin:0 auto;display:grid;grid-template-columns:340px 1fr;background:var(--paper);border-inline:1px solid var(--line)}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side h1{margin:0;padding:16px 18px 8px;font-size:22px;letter-spacing:-.02em;color:var(--ink)}
.search{margin:0 14px 10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:15px}
.search:focus{outline:none;border-color:var(--p)}
.cl{flex:1;overflow-y:auto}
.c{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:var(--text)}
.c:hover{background:var(--soft)}
.c.on{background:color-mix(in srgb,var(--p) 12%,transparent)}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800;font-size:17px;overflow:hidden}
.c:hover .av{background:var(--paper)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.bd{min-width:0;flex:1}
.nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm b{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm time{flex:none;font-size:12px;color:var(--muted)}
.lm{margin:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g{display:inline-block;margin-right:6px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:800;background:var(--soft);color:var(--muted)}
.thread{display:flex;flex-direction:column;min-height:0;min-width:0}
.th{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.th .av{width:40px;height:40px;font-size:15px}
.th b{display:block;color:var(--ink);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th small{color:var(--muted);font-size:13px}
.back{display:none;border:0;background:var(--soft);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.day{align-self:center;margin:12px 0 6px;font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);padding:2px 12px;border-radius:999px}
.m{max-width:min(78%,520px);padding:8px 12px;border-radius:16px 16px 16px 4px;background:var(--paper);border:1px solid var(--line);align-self:flex-start;margin-top:6px}
.m.cont{margin-top:1px}
.m.me{align-self:flex-end;background:var(--p);border-color:var(--p);color:#fff;border-radius:16px 16px 4px 16px}
@media(prefers-color-scheme:dark){.m.me{color:#0b1220}}
.m .who{font-size:12px;font-weight:800;color:var(--p);margin-bottom:1px}
.m .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.m .tx a{color:inherit;text-decoration:underline}
.m .ft{display:flex;justify-content:flex-end;gap:10px;font-size:11px;opacity:.7;margin-top:2px}
.m .ft button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.m.del .tx{font-style:italic;opacity:.7}
.comp{flex:none;display:flex;align-items:flex-end;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.comp textarea{flex:1;resize:none;max-height:140px;min-height:44px;padding:11px 14px;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;line-height:1.4}
.comp textarea:focus{outline:none;border-color:var(--p)}
.send{flex:none;border:0;background:var(--p);color:#fff;height:44px;padding:0 20px;border-radius:22px;font:inherit;font-weight:700;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
@media(prefers-color-scheme:dark){.send{color:#0b1220}}
.empty{margin:auto;text-align:center;color:var(--muted);padding:30px}
.empty h2{margin:0 0 6px;color:var(--ink);font-size:20px}
.btn{display:inline-block;margin-top:14px;border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
@media(max-width:800px){
  .app{grid-template-columns:1fr;border:0}
  .app.chat .side{display:none}
  .app:not(.chat) .thread{display:none}
  .back{display:grid;place-items:center}
  .hd nav a{margin-left:12px}
  .m{max-width:86%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="app" id="app" hidden="">

  <aside class="side">

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,onSnapshot,serverTimestamp,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

/* Settings. Change these if your message collection uses other names. */
const CONV="conservations";          /* conversations, spelled as in Firestore */
const MSG="messages";                /* collection that holds the chat messages */
const LINK="conservationId";         /* field in each message that points to its conversation */

const $=s=>document.querySelector(s);
const qp=new URLSearchParams(location.search);
const startId=(qp.get("conversationId")||qp.get("id")||"").trim(),withUser=(qp.get("with")||"").trim();

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
const d0=n=>new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
function stamp(x){
  if(!x)return "";
  const diff=Math.round((d0(new Date())-d0(x))/864e5);
  if(diff===0)return x.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  if(diff===1)return "Yesterday";
  if(diff<7)return x.toLocaleDateString(undefined,{weekday:"short"});
  return x.toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
function dayLabel(x){
  const diff=Math.round((d0(new Date())-d0(x))/864e5);
  return diff===0?"Today":diff===1?"Yesterday":x.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:diff>300?"numeric":undefined});
}
const linkify=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,u=>{const s=safe(u.replace(/&amp;/g,"&"));return s?`<a href="${esc(s)}" target="_blank" rel="noopener">${u}</a>`:u});

let user=null,convs=[],prof={},cur=null,msgs=[],unsubList=null,unsubMsgs=null,started=false;
const members=c=>Array.isArray(c.memberIds)?c.memberIds:String(c.memberIds||"").split(/[,\s]+/).filter(Boolean);
const others=c=>members(c).filter(i=>i!==user.uid);
const isGroup=c=>/group/i.test(c.type||"")||members(c).length>2;
const when=c=>toD(c.lastMessageAt)||toD(c.updatedAt)||toD(c.createdAt);
const P=id=>prof[id]||{};
const nameOf=id=>{const p=P(id);return p.name||p.displayName||p.fullName||p.username||"Member"};
const photoOf=id=>safe(P(id).photoURL||P(id).photo||P(id).avatar||P(id).profilePicture);
const title=c=>{
  if(c.name||c.title)return c.name||c.title;
  const o=others(c).map(nameOf);
  return !o.length?"You":o.length>2?`${o.slice(0,2).join(", ")} +${o.length-2}`:o.join(", ");
};
function avatar(c){
  if(isGroup(c))return `<div class="av" aria-hidden="true">${members(c).length}</div>`;
  const id=others(c)[0],n=(id?nameOf(id):"Y")[0].toUpperCase(),ph=id?photoOf(id):"";
  return `<div class="av" aria-hidden="true">${ph?`<img src="${esc(ph)}" alt="" loading="lazy" data-n="${esc(n)}">`:esc(n)}</div>`;
}
async function loadProfiles(ids){
  const need=[...new Set(ids)].filter(id=>id&&!(id in prof));
  await Promise.all(need.map(async id=>{try{const s=await getDoc(doc(db,"users",id));prof[id]=s.exists()?s.data():{}}catch{prof[id]={}}}));
}

/* ---------------- conversation list ---------------- */
function renderList(){
  const q=$("#search").value.toLowerCase().trim();
  const items=convs.filter(c=>!q||(title(c)+" "+(c.lastMessage||"")).toLowerCase().includes(q));
  $("#cl").innerHTML=items.length?items.map(c=>`<button class="c${cur&&cur.id===c.id?" on":""}" type="button" data-id="${esc(c.id)}">${avatar(c)}<div class="bd">
      <div class="nm"><b>${isGroup(c)?`<span class="g">Group</span>`:""}${esc(title(c))}</b><time>${esc(stamp(when(c)))}</time></div>
      <p class="lm">${esc(c.lastMessage||"No messages yet")}</p></div></button>`).join("")
    :`<div class="empty"><h2>${convs.length?"No matches":"No conversations"}</h2><p>${convs.length?"Try a different search.":"Start a chat from someone's profile or from your network."}</p><a class="btn" href="connections.html">My network</a></div>`;
}
$("#search").addEventListener("input",renderList);
$("#cl").addEventListener("click",e=>{const b=e.target.closest(".c");if(b)open(b.dataset.id)});

function listen(){
  if(unsubList)unsubList();
  unsubList=onSnapshot(query(collection(db,CONV),where("memberIds","array-contains",user.uid)),async snap=>{
    convs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(when(b)||0)-(when(a)||0));
    await loadProfiles(convs.flatMap(others));
    $("#app").hidden=false;$("#gate").hidden=true;
    renderList();
    if(cur){const f=convs.find(c=>c.id===cur.id);if(f){cur=f;renderHead()}}
    if(!started){started=true;if(withUser)startWith();else if(startId)open(startId)}
  },err=>{console.error(err);gate("Unable to load messages",esc(err.message||"Please check your connection."),`<button class="btn" id="retry" type="button">Try again</button>`);$("#retry").addEventListener("click",listen)});
}

/* ---------------- thread ---------------- */
function renderHead(){
  $("#tname").textContent=title(cur);
  $("#tav").outerHTML=avatar(cur).replace('class="av"','class="av" id="tav"');
  $("#tsub").textContent=isGroup(cur)?`${members(cur).length} members`:"";
}
function open(id){
  const c=convs.find(x=>x.id===id);
  if(!c){toast("Conversation not found");return}
  cur=c;msgs=[];
  history.replaceState(null,"",`messages.html?conversationId=${encodeURIComponent(id)}`);
  $("#app").classList.add("chat");$("#blank").hidden=true;$("#chat").hidden=false;
  renderHead();renderList();renderMsgs();
  if(unsubMsgs)unsubMsgs();
  unsubMsgs=onSnapshot(query(collection(db,MSG),where(LINK,"==",id)),async snap=>{
    msgs=snap.docs.map(d=>({id:d.id,...d.data()}));
    await loadProfiles(msgs.map(m=>m.senderId||m.userId));
    renderMsgs();
  },err=>{console.error(err);$("#msgs").innerHTML=`<div class="empty"><h2>Unable to load messages</h2><p>${esc(err.message||"")}</p></div>`});
  $("#box").focus();
}
$("#back").addEventListener("click",()=>{
  $("#app").classList.remove("chat");history.replaceState(null,"","messages.html");
  if(unsubMsgs){unsubMsgs();unsubMsgs=null}cur=null;renderList();$("#blank").hidden=false;$("#chat").hidden=true;
});

const sender=m=>m.senderId||m.userId;
const textOf=m=>String(m.text??m.message??m.content??"");
const timeOf=m=>toD(m.createdAt)||new Date();   /* pending writes have no server time yet */
function renderMsgs(){
  const box=$("#msgs"),atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  const list=[...msgs].sort((a,b)=>timeOf(a)-timeOf(b));
  if(!list.length){box.innerHTML=`<div class="empty"><h2>No messages yet</h2><p>Say hello and start the conversation.</p></div>`;return}
  let html="",lastDay="",lastSender="",lastT=0;
  for(const m of list){
    const x=timeOf(m),label=dayLabel(x),sid=sender(m),mine=sid===user.uid,gone=m.status==="deleted"||m.deleted===true;
    if(label!==lastDay){html+=`<div class="day">${esc(label)}</div>`;lastDay=label;lastSender=""}
    const cont=sid===lastSender&&x-lastT<300000;
    html+=`<div class="m${mine?" me":""}${cont?" cont":""}${gone?" del":""}">
      ${!mine&&isGroup(cur)&&!cont?`<div class="who">${esc(m.senderName||nameOf(sid))}</div>`:""}
      <div class="tx">${gone?"This message was deleted":linkify(textOf(m))}</div>
      <div class="ft"><span>${esc(x.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}))}</span>${mine&&!gone?`<button type="button" data-del="${esc(m.id)}">Delete</button>`:""}</div></div>`;
    lastSender=sid;lastT=+x;
  }
  box.innerHTML=html;
  if(atEnd||box.dataset.first!==cur.id){box.scrollTop=box.scrollHeight;box.dataset.first=cur.id}
}
$("#msgs").addEventListener("click",async e=>{
  const d=e.target.closest("[data-del]");if(!d||!confirm("Delete this message?"))return;
  try{await updateDoc(doc(db,MSG,d.dataset.del),{status:"deleted",text:""})}
  catch(err){console.error(err);toast("Could not delete the message")}
});

/* ---------------- send ---------------- */
async function send(){
  const box=$("#box"),text=box.value.trim();
  if(!text||!cur)return;
  const btn=$("#send");btn.disabled=true;box.value="";box.style.height="auto";
  try{
    const ref=doc(collection(db,MSG)),iso=new Date().toISOString();
    await setDoc(ref,{messageId:ref.id,[LINK]:cur.id,senderId:user.uid,senderName:user.displayName||(user.email||"").split("@")[0]||"Member",
      senderPhoto:user.photoURL||"",text,status:"sent",createdAt:serverTimestamp()});
    updateDoc(doc(db,CONV,cur.id),{lastMessage:text.slice(0,200),lastMessageAt:iso,updatedAt:iso}).catch(e=>console.warn(e));
  }catch(err){console.error(err);box.value=text;toast("Message not sent. Please try again.")}
  btn.disabled=false;box.focus();
}
$("#send").addEventListener("click",send);
$("#box").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$("#box").addEventListener("input",e=>{const t=e.target;t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"});
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"&&i.dataset.n)i.replaceWith(document.createTextNode(i.dataset.n))},true);

/* ?with=UID : open (or create) a direct conversation with that member */
async function startWith(){
  if(withUser===user.uid){startId&&open(startId);return}
  const ex=convs.find(c=>!isGroup(c)&&others(c).includes(withUser));
  if(ex){open(ex.id);return}
  try{
    const id=[user.uid,withUser].sort().join("_"),iso=new Date().toISOString(),ref=doc(db,CONV,id);
    if(!(await getDoc(ref)).exists())await setDoc(ref,{conservationId:id,createdAt:iso,lastMessage:"",lastMessageAt:"",memberIds:[user.uid,withUser],type:"direct",updatedAt:iso});
    await loadProfiles([withUser]);
    if(!convs.find(c=>c.id===id))convs.unshift({id,conservationId:id,memberIds:[user.uid,withUser],type:"direct",createdAt:iso,updatedAt:iso,lastMessage:""});
    open(id);
  }catch(err){console.error(err);toast("Could not start the conversation")}
}

function gate(t,p,extra){
  $("#app").hidden=true;const g=$("#gate");g.hidden=false;
  g.innerHTML=`<h2>${t}</h2><p>${p}</p>${extra||""}`;
}
onAuthStateChanged(auth,u=>{
  user=u;started=false;
  if(unsubList){unsubList();unsubList=null}if(unsubMsgs){unsubMsgs();unsubMsgs=null}cur=null;
  if(!u)return gate("Sign in to see your messages","Your conversations are private to your account.",`<a class="btn" href="login.html">Sign in</a>`);
  listen();
});
</script>
