<script type="module">

import {
 initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 doc,
 getDoc,
 updateDoc,
 increment
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsYrgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


const $=id=>
document.getElementById(id);


function esc(value=""){

 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/*
 IMPORTANT:
 URL:
 video.html?id=FIRESTORE_DOCUMENT_ID

 Firebase document ID is used directly.
*/

const params=
new URLSearchParams(
window.location.search
);

const videoId=
params.get("id");


let currentVideo=null;


/* LOAD VIDEO */

async function loadVideo(){

 if(!videoId){

  showError(
   "No signal."
  );

  return;

 }


 try{

  const ref=
  doc(
   db,
   "videos",
   videoId
  );

  const snap=
  await getDoc(ref);


  if(!snap.exists()){

   showError(
    "This video does not exist."
   );

   return;

  }


  /*
   doc.id = actual Firebase ID
  */

  currentVideo={
   id:snap.id,
   ...snap.data()
  };


  if(
   currentVideo.status &&
   currentVideo.status!=="published"
  ){

   showError(
    "This video is not currently available."
   );

   return;

  }


  renderVideo(currentVideo);


  /*
   Increase views.
  */

  await updateDoc(
   ref,
   {
    views:increment(1)
   }
  );


 }catch(error){

  console.error(error);

  showError(
   error.message||
   "Unable to load video."
  );

 }

}


/* RENDER */

function renderVideo(v){

 document.title=
 `${v.title||"Video"} | LetsStudy Pro`;


 $("title").textContent=
 v.title||
 "Untitled Video";


 $("category").textContent=
 v.category||
 "Video";


 $("description").textContent=
 v.description||
 "No description available.";


 $("views").textContent=
 Number(v.views||0).toLocaleString();


 $("sideViews").textContent=
 Number(v.views||0).toLocaleString();


 $("likes").textContent=
 Number(v.likes||0).toLocaleString();


 $("comments").textContent=
 Number(v.commentsCount||0).toLocaleString();


 $("duration").textContent=
 v.duration||"-";


 $("sideDuration").textContent=
 v.duration||"-";


 $("sideCategory").textContent=
 v.category||"-";


 if(v.createdAt?.toDate){

  $("date").textContent=
  v.createdAt
  .toDate()
  .toLocaleDateString();

 }


 /* CREATOR */

 const creator=
 v.creatorName||
 "LetsStudy Pro";


 $("creatorName").textContent=
 creator;


 $("creatorMeta").textContent=
 v.category||
 "Video Creator";


 if(v.creatorImage){

  $("creatorImage").src=
  v.creatorImage;

  $("creatorImage").style.display=
  "block";

  $("creatorInitial").style.display=
  "none";

 }else{

  $("creatorInitial").textContent=
  creator
  .trim()
  .charAt(0)
  .toUpperCase();

 }


 /* TAGS */

 const tags=
 Array.isArray(v.tags)
 ?v.tags
 :[];


 $("tags").innerHTML=
 tags.map(tag=>
 `<span class="tag">
 ${esc(tag)}
 </span>`
 ).join("");


 /* ACCESS */

 if(v.isFree){

  $("accessBox").innerHTML=`
  <div class="free">
  <i class="fa fa-unlock"></i>
  Free Video
  </div>`;

 }else{

  $("accessBox").innerHTML=`
  <div class="paid">
  <i class="fa fa-lock"></i>
  Premium Video
  </div>`;

 }


 /* PLAYER */

 renderPlayer(v);


 $("loading").style.display=
 "none";

 $("videoPage").style.display=
 "block";

}


/* PLAYER */

function renderPlayer(v){

 const url=
 v.videoUrl||"";


 if(!url){

  $("player").innerHTML=`
  <div class="play-message">
  <i class="fa fa-video-slash"></i>
  <div>Video unavailable</div>
  </div>`;

  return;

 }


 if(v.videoType==="youtube"){

  const id=
  getYouTubeId(url);

  if(id){

   $("player").innerHTML=`
   <iframe
   src="https://www.youtube.com/embed/${id}"
   title="${esc(v.title||"Video")}"
   allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
   allowfullscreen>
   </iframe>`;

   return;

  }

 }


 if(v.videoType==="vimeo"){

  const id=
  getVimeoId(url);

  if(id){

   $("player").innerHTML=`
   <iframe
   src="https://player.vimeo.com/video/${id}"
   title="${esc(v.title||"Video")}"
   allow="autoplay; fullscreen; picture-in-picture"
   allowfullscreen>
   </iframe>`;

   return;

  }

 }


 /*
 Firebase Storage
 or external direct MP4
 */

 $("player").innerHTML=`
 <video
 controls
 playsinline
 poster="${esc(v.thumbnail||"")}">

 <source
 src="${esc(url)}"
 type="video/mp4">

 Your browser does not support video playback.

 </video>`;

}


/* YOUTUBE ID */

function getYouTubeId(url){

 try{

  const u=
  new URL(url);

  if(
   u.hostname.includes("youtu.be")
  ){

   return u.pathname.slice(1);

  }

  if(
   u.hostname.includes("youtube.com")
  ){

   return u.searchParams.get("v");

  }

 }catch(e){}

 return null;

}


/* VIMEO ID */

function getVimeoId(url){

 const match=
 url.match(
  /vimeo\.com\/(?:video\/)?(\d+)/
 );

 return match
 ?match[1]
 :null;

}


/* LIKE */

window.likeVideo=
async()=>{

 if(!currentVideo)return;

 try{

  await updateDoc(

   doc(
    db,
    "videos",
    currentVideo.id
   ),

   {
    likes:increment(1)
   }

  );

  currentVideo.likes=
  Number(currentVideo.likes||0)+1;

  $("likes").textContent=
  currentVideo.likes;

 }catch(e){

  alert(e.message);

 }

};


/* SHARE */

window.shareVideo=
async()=>{

 const url=
 window.location.href;


 try{

  if(navigator.share){

   await navigator.share({

    title:
    currentVideo?.title||
    "LetsStudy Pro Video",

    url:url

   });

  }else{

   await navigator.clipboard.writeText(
    url
   );

   alert(
    "Video link copied."
   );

  }

 }catch(e){}

};


/* ERROR */

function showError(message){

 $("loading").style.display=
 "none";

 $("videoPage").style.display=
 "none";

 $("error").style.display=
 "block";

 $("errorMessage").textContent=
 message;

}


/* START */

loadVideo();

</script>
