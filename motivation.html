<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video | LetsStudy Pro</title>

<meta name="description"
content="Watch educational videos on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.5
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer
}

.container{
  width:92%;
  max-width:1050px;
  margin:28px auto
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:22px;
  margin-bottom:16px
}

.player{
  padding:0;
  overflow:hidden;
  background:#000
}

video,
iframe{
  width:100%;
  display:block;
  border:0;
  aspect-ratio:16/9;
  background:#000
}

h1{
  font-size:29px;
  line-height:1.25;
  margin-bottom:9px
}

.description{
  color:#64748b;
  font-size:14px
}

.tag{
  display:inline-block;
  background:#eff6ff;
  color:#2563eb;
  padding:5px 9px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
  margin-bottom:12px
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px 20px;
  color:#64748b;
  font-size:12px;
  margin-top:15px
}

.progress{
  height:6px;
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden;
  margin-top:14px
}

.progress-bar{
  height:100%;
  width:0;
  background:#2563eb
}

.related{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px
}

.related-card{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:14px;
  text-decoration:none;
  color:#172033
}

.related-card strong{
  display:block;
  margin-bottom:5px
}

.related-card small{
  color:#64748b
}

.loading,
.error{
  background:#fff;
  border-radius:15px;
  padding:55px 20px;
  text-align:center
}

.loading{
  color:#64748b
}

.error{
  color:#b91c1c
}

@media(max-width:600px){
  h1{
    font-size:25px
  }

  .card{
    padding:17px
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <div id="page" class="loading">
    Loading video...
  </div>

</main>


<script>

/*
==================================================
VIDEO.HTML

URL:

video.html?id=VIDEO_ID

API:

GET
/api/data?collection=videos&id=VIDEO_ID

EXPECTED VIDEO FIELDS:

id
documentId
title
name
description
category
duration
videoUrl
url
youtubeUrl
embedUrl
thumbnail
published
featured

RELATED:

GET
/api/data?collection=videos&category=CATEGORY&limit=6

NO DIRECT FIREBASE
==================================================
*/


const params =
  new URLSearchParams(
    location.search
  );


const videoId =
  params.get("id") ||
  params.get("videoId") ||
  params.get("documentId") ||
  "";


const page =
  document.getElementById(
    "page"
  );


let currentVideo = null;


/* =========================
   VALIDATE
========================= */

if(!videoId){

  showError(
    "No video was selected."
  );

}else{

  loadVideo();

}


/* =========================
   LOAD VIDEO
========================= */

async function loadVideo(){

  try{

    const response =
      await fetch(
        "/api/data?collection=videos&id=" +
        encodeURIComponent(
          videoId
        )
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load video."
      );

    }


    currentVideo =
      result.data ||
      result.video ||
      result.item;


    if(!currentVideo){

      throw new Error(
        "Video not found."
      );

    }


    renderVideo();

    loadRelated();

  }catch(error){

    console.error(
      "VIDEO:",
      error
    );

    showError(
      error.message
    );

  }

}


/* =========================
   RENDER
========================= */

function renderVideo(){

  const title =
    currentVideo.title ||
    currentVideo.name ||
    "Educational Video";


  const description =
    currentVideo.description ||
    currentVideo.summary ||
    "";


  const category =
    currentVideo.category ||
    "Education";


  const duration =
    currentVideo.duration ||
    "";


  const videoUrl =
    currentVideo.videoUrl ||
    currentVideo.url ||
    "";


  const youtubeUrl =
    currentVideo.youtubeUrl ||
    "";


  const embedUrl =
    currentVideo.embedUrl ||
    "";


  page.className = "";


  page.innerHTML = `

    <section
      id="playerCard"
      class="card player"
    >

      ${createPlayer(
        videoUrl,
        youtubeUrl,
        embedUrl
      )}

    </section>


    <section class="card">

      <span class="tag">

        ${escapeHTML(
          category
        )}

      </span>


      <h1>

        ${escapeHTML(
          title
        )}

      </h1>


      ${
        description
        ? `

          <p class="description">

            ${escapeHTML(
              description
            )}

          </p>

        `
        : ""
      }


      <div class="meta">

        ${
          duration
          ? `

            <span>
              Duration:
              ${escapeHTML(
                duration
              )}
            </span>

          `
          : ""
        }


        ${
          currentVideo.level
          ? `

            <span>
              Level:
              ${escapeHTML(
                currentVideo.level
              )}
            </span>

          `
          : ""
        }


        ${
          currentVideo.instructor
          ? `

            <span>
              Instructor:
              ${escapeHTML(
                currentVideo.instructor
              )}
            </span>

          `
          : ""
        }

      </div>


      <div class="progress">

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>

    </section>


    <section class="card">

      <h2 style="margin-bottom:10px">
        About this video
      </h2>

      <p class="description">

        ${escapeHTML(
          description ||
          "Watch this lesson and continue your learning journey with LetsStudy Pro."
        )}

      </p>

    </section>


    <section
      id="relatedSection"
      class="card"
      style="display:none"
    >

      <h2 style="margin-bottom:13px">
        Related Videos
      </h2>

      <div
        id="related"
        class="related"
      ></div>

    </section>

  `;


  setupProgress();

}


/* =========================
   PLAYER
========================= */

function createPlayer(
  videoUrl,
  youtubeUrl,
  embedUrl
){

  if(videoUrl){

    return `

      <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
        ${
          currentVideo.thumbnail
          ? `poster="${escapeAttr(
              currentVideo.thumbnail
            )}"`
          : ""
        }
      >

        <source
          src="${escapeAttr(
            videoUrl
          )}"
        >

        Your browser does not support video playback.

      </video>

    `;

  }


  if(embedUrl){

    return `

      <iframe
        src="${escapeAttr(
          embedUrl
        )}"
        title="LetsStudy Pro video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>

    `;

  }


  if(youtubeUrl){

    const embed =
      convertYouTube(
        youtubeUrl
      );


    if(embed){

      return `

        <iframe
          src="${escapeAttr(
            embed
          )}"
          title="LetsStudy Pro video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>

      `;

    }

  }


  return `

    <div
      style="
        color:#fff;
        padding:70px 20px;
        text-align:center
      "
    >
      Video source is unavailable.
    </div>

  `;

}


/* =========================
   PROGRESS
========================= */

function setupProgress(){

  const player =
    document.getElementById(
      "videoPlayer"
    );


  const bar =
    document.getElementById(
      "progressBar"
    );


  if(!player || !bar)
    return;


  const storageKey =
    "video-progress-" +
    videoId;


  const saved =
    Number(
      localStorage.getItem(
        storageKey
      ) || 0
    );


  if(
    saved > 0 &&
    saved < player.duration
  ){

    player.addEventListener(
      "loadedmetadata",
      () => {

        player.currentTime =
          saved;

      },
      {
        once:true
      }
    );

  }


  player.addEventListener(
    "timeupdate",
    () => {

      if(
        player.duration
      ){

        const percent =
          (
            player.currentTime /
            player.duration
          ) * 100;


        bar.style.width =
          percent + "%";


        localStorage.setItem(
          storageKey,
          String(
            Math.floor(
              player.currentTime
            )
          )
        );

      }

    }
  );


  player.addEventListener(
    "ended",
    () => {

      localStorage.setItem(
        storageKey,
        "completed"
      );

      bar.style.width =
        "100%";

    }
  );

}


/* =========================
   RELATED
========================= */

async function loadRelated(){

  const category =
    currentVideo.category;


  if(!category)
    return;


  try{

    const response =
      await fetch(
        "/api/data?collection=videos&category=" +
        encodeURIComponent(
          category
        ) +
        "&limit=6"
      );


    if(!response.ok)
      return;


    const result =
      await response.json();


    const list =
      Array.isArray(
        result.results
      )
      ? result.results
      : [];


    const related =
      list.filter(
        item => {

          const id =
            item.documentId ||
            item.id ||
            "";

          return id !== videoId;

        }
      );


    if(!related.length)
      return;


    const section =
      document.getElementById(
        "relatedSection"
      );


    const box =
      document.getElementById(
        "related"
      );


    section.style.display =
      "block";


    box.innerHTML =
      related
        .slice(0,6)
        .map(
          item => {

            const id =
              item.documentId ||
              item.id ||
              "";


            const title =
              item.title ||
              item.name ||
              "Video";


            return `

              <a
                class="related-card"
                href="video.html?id=${encodeURIComponent(
                  id
                )}"
              >

                <strong>

                  ${escapeHTML(
                    title
                  )}

                </strong>


                <small>

                  ${escapeHTML(
                    item.duration ||
                    item.category ||
                    "Video"
                  )}

                </small>

              </a>

            `;

          }
        )
        .join("");

  }catch(error){

    console.error(
      "RELATED VIDEOS:",
      error
    );

  }

}


/* =========================
   YOUTUBE
========================= */

function convertYouTube(
  url
){

  try{

    const parsed =
      new URL(
        url
      );


    let id = "";


    if(
      parsed.hostname.includes(
        "youtu.be"
      )
    ){

      id =
        parsed.pathname
          .replace(
            "/",
            ""
          );

    }else if(
      parsed.hostname.includes(
        "youtube.com"
      )
    ){

      id =
        parsed.searchParams.get(
          "v"
        ) || "";


      if(
        parsed.pathname.includes(
          "/embed/"
        )
      ){

        id =
          parsed.pathname
            .split(
              "/embed/"
            )[1]
            .split(
              "/"
            )[0];

      }

    }


    if(!id)
      return "";


    return (
      "https://www.youtube.com/embed/" +
      encodeURIComponent(id)
    );

  }catch{

    return "";

  }

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  page.className =
    "error";


  page.innerHTML = `

    <h2>
      Unable to open video
    </h2>

    <p style="margin-top:10px">

      ${escapeHTML(
        message
      )}

    </p>


    <button
      class="back"
      style="margin-top:20px"
      onclick="history.back()"
    >
      Go Back
    </button>

  `;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  ).replace(
    /`/g,
    "&#096;"
  );

}

</script>

</body>
</html>
