<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Videos | Let'sStudy Pro</title>

<meta
    name="description"
    content="Watch educational videos, tutorials and premium content on Let'sStudy Pro."
>

<meta
    name="theme-color"
    content="#0f172a"
>

<link rel="icon" href="/favicon.ico">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f5f7fb;

    color:#172033;

    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    display:block;
    max-width:100%;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    position:sticky;

    top:0;

    z-index:1000;

    min-height:64px;

    background:#fff;

    border-bottom:
        1px solid #e5e7eb;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        10px 22px;
}


.logo{

    display:flex;

    align-items:center;

    gap:10px;

    font-size:20px;

    font-weight:800;

    white-space:nowrap;
}


.logo i{
    color:#2563eb;
}


.header-actions{

    display:flex;

    align-items:center;

    gap:10px;
}


.icon-btn{

    width:40px;

    height:40px;

    border:0;

    border-radius:50%;

    background:#f1f5f9;

    color:#172033;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.2s;
}


.icon-btn:hover{

    background:#e2e8f0;

    transform:translateY(-1px);
}


.admin{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    padding:
        10px 14px;

    border-radius:8px;

    background:#111827;

    color:#fff;

    font-size:13px;

    font-weight:700;

    transition:.2s;
}


.admin:hover{
    background:#1f2937;
}


/* =====================================================
   SEARCH
===================================================== */

.search-area{

    background:#fff;

    border-bottom:
        1px solid #e5e7eb;

    padding:20px;
}


.search-box{

    max-width:850px;

    margin:auto;

    display:flex;

    gap:10px;
}


.search-box input{

    flex:1;

    min-width:0;

    height:46px;

    border:
        1px solid #d1d5db;

    border-radius:8px;

    padding:
        0 15px;

    background:#fff;

    color:#172033;

    outline:none;
}


.search-box input:focus{

    border-color:#2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.10);
}


.search-btn{

    width:50px;

    height:46px;

    border:0;

    border-radius:8px;

    background:#2563eb;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;
}


.search-btn:hover{
    background:#1d4ed8;
}


/* =====================================================
   MAIN
===================================================== */

.container{

    max-width:1400px;

    margin:auto;

    padding:
        25px 20px 60px;
}


.page-title{

    margin-bottom:20px;
}


.page-title h1{

    font-size:28px;

    line-height:1.2;
}


.page-title p{

    color:#64748b;

    margin-top:7px;

    font-size:14px;
}


/* =====================================================
   FILTERS
===================================================== */

.filters{

    display:flex;

    gap:10px;

    overflow-x:auto;

    margin-bottom:25px;

    padding-bottom:5px;

    scrollbar-width:none;
}


.filters::-webkit-scrollbar{
    display:none;
}


.filter{

    border:
        1px solid #dbe2ea;

    background:#fff;

    color:#172033;

    padding:
        9px 15px;

    border-radius:20px;

    white-space:nowrap;

    transition:.2s;
}


.filter:hover{

    border-color:#2563eb;

    color:#2563eb;
}


.filter.active{

    background:#2563eb;

    color:#fff;

    border-color:#2563eb;
}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    display:none;

    background:#fff;

    border:
        1px solid #fecaca;

    color:#991b1b;

    padding:18px;

    border-radius:10px;

    margin-bottom:20px;

    line-height:1.5;
}


.retry-btn{

    margin-top:12px;

    border:0;

    background:#2563eb;

    color:#fff;

    padding:
        9px 14px;

    border-radius:7px;
}


.retry-btn:hover{
    background:#1d4ed8;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:
        70px 20px;

    color:#64748b;
}


.spinner{

    width:35px;

    height:35px;

    border:
        4px solid #e2e8f0;

    border-top-color:#2563eb;

    border-radius:50%;

    animation:
        spin 1s linear infinite;

    margin:
        0 auto 12px;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   VIDEO GRID
===================================================== */

.video-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:22px;
}


/* =====================================================
   VIDEO CARD
===================================================== */

.video-card{

    background:#fff;

    border-radius:12px;

    overflow:hidden;

    border:
        1px solid #e5e7eb;

    cursor:pointer;

    transition:.2s;
}


.video-card:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 8px 25px
        rgba(15,23,42,.08);
}


/* =====================================================
   THUMBNAIL
===================================================== */

.thumbnail{

    position:relative;

    aspect-ratio:16/9;

    background:#e2e8f0;

    overflow:hidden;
}


.thumbnail img{

    width:100%;

    height:100%;

    object-fit:cover;
}


/* =====================================================
   PLAY BUTTON
===================================================== */

.play-overlay{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.15);

    opacity:0;

    transition:.2s;
}


.video-card:hover
.play-overlay{

    opacity:1;
}


.play-button{

    width:52px;

    height:52px;

    border-radius:50%;

    background:#2563eb;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.25);
}


/* =====================================================
   BADGES
===================================================== */

.badge{

    position:absolute;

    left:8px;

    top:8px;

    padding:
        5px 8px;

    border-radius:5px;

    font-size:10px;

    font-weight:700;

    text-transform:uppercase;
}


.free{

    background:#16a34a;

    color:#fff;
}


.premium{

    background:#f59e0b;

    color:#111827;
}


.featured{

    position:absolute;

    right:8px;

    top:8px;

    background:#111827;

    color:#fff;

    padding:
        5px 8px;

    border-radius:5px;

    font-size:10px;

    font-weight:700;
}


.verified{

    position:absolute;

    right:8px;

    bottom:8px;

    width:25px;

    height:25px;

    border-radius:50%;

    background:#2563eb;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:11px;
}


/* =====================================================
   DURATION
===================================================== */

.duration{

    position:absolute;

    right:8px;

    bottom:8px;

    background:
        rgba(0,0,0,.82);

    color:#fff;

    padding:
        4px 7px;

    border-radius:4px;

    font-size:11px;
}


/* =====================================================
   VIDEO INFO
===================================================== */

.video-info{

    padding:13px;
}


.video-title{

    font-size:15px;

    font-weight:700;

    line-height:1.4;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}


.description{

    color:#64748b;

    font-size:12px;

    line-height:1.5;

    margin-top:7px;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}


/* =====================================================
   CREATOR
===================================================== */

.channel{

    display:flex;

    align-items:center;

    gap:8px;

    margin-top:12px;

    min-width:0;
}


.channel img{

    width:30px;

    height:30px;

    flex:none;

    border-radius:50%;

    object-fit:cover;

    background:#e2e8f0;
}


.channel-info{

    min-width:0;
}


.channel-name{

    font-size:12px;

    color:#475569;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =====================================================
   META
===================================================== */

.meta{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    margin-top:10px;

    color:#64748b;

    font-size:11px;
}


.meta-left{

    display:flex;

    gap:9px;

    min-width:0;
}


.category{

    max-width:100px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    display:none;

    text-align:center;

    padding:
        80px 20px;

    color:#64748b;
}


.empty i{

    font-size:45px;

    margin-bottom:15px;
}


.empty h3{

    color:#172033;

    margin-bottom:7px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:1100px){

    .video-grid{

        grid-template-columns:
            repeat(3,1fr);

    }

}


@media(max-width:750px){

    .video-grid{

        grid-template-columns:
            repeat(2,1fr);

        gap:13px;

    }


    .container{

        padding:
            18px 12px 40px;

    }


    .page-title h1{

        font-size:22px;

    }


    .admin{

        padding:
            9px 10px;

    }


    .admin span{

        display:none;

    }

}


@media(max-width:480px){

    .video-grid{

        grid-template-columns:1fr;

    }


    .header{

        padding:
            10px 12px;

    }


    .logo{

        font-size:17px;

    }


    .header-actions{

        gap:6px;

    }


    .icon-btn{

        width:36px;

        height:36px;

    }


    .search-area{

        padding:
            15px 12px;

    }


    .video-title{

        font-size:16px;

    }

}

</style>

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

    initializeApp

}

from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";


import {

    getFirestore,
    collection,
    getDocs,
    query,
    orderBy

}

from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
        "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
        "let-s-study-pro-course",

    storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
        "474928293390",

    appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
        "G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* =====================================================
   DOM
===================================================== */

const videoGrid =
    document.getElementById(
        "videoGrid"
    );


const loading =
    document.getElementById(
        "loading"
    );


const empty =
    document.getElementById(
        "empty"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const retryBtn =
    document.getElementById(
        "retryBtn"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchBtn =
    document.getElementById(
        "searchBtn"
    );


const filters =
    document.querySelectorAll(
        ".filter"
    );


/* =====================================================
   STATE
===================================================== */

let videos = [];

let currentCategory = "all";

let searchTerm = "";


/* =====================================================
   LOAD FIRESTORE COLLECTION
===================================================== */

async function loadVideos(){

    loading.style.display =
        "block";


    empty.style.display =
        "none";


    errorBox.style.display =
        "none";


    videoGrid.innerHTML =
        "";


    try{


        const videosRef =
            collection(
                db,
                "videos"
            );


        let snapshot;


        /*
         * Try loading newest videos
         * using createdAt.
         */

        try{


            const q =
                query(

                    videosRef,

                    orderBy(
                        "createdAt",
                        "desc"
                    )

                );


            snapshot =
                await getDocs(q);


        }catch(orderError){


            /*
             * If ordering fails,
             * load the collection directly.
             */

            console.warn(
                "createdAt ordering failed.",
                orderError
            );


            snapshot =
                await getDocs(
                    videosRef
                );

        }


        videos = [];


        snapshot.forEach(
            doc => {


                const data =
                    doc.data();


                /*
                 * IMPORTANT
                 *
                 * Firestore document ID.
                 */

                videos.push({

                    videoId:
                        doc.id,

                    ...data

                });


                        }
        );

        renderVideos();

    } catch (error) {

        console.error(
            "Error loading videos:",
            error
        );

        videoGrid.innerHTML = "";

        empty.style.display = "block";

        empty.innerHTML = `
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3>Unable to load videos</h3>
            <p>There was a problem loading videos from Firestore.</p>
            <button
                onclick="location.reload()"
                style="
                    margin-top:15px;
                    padding:10px 18px;
                    border:0;
                    border-radius:8px;
                    background:#2563eb;
                    color:#fff;
                    cursor:pointer;
                    font-weight:700;
                "
            >
                Try Again
            </button>
        `;

    } finally {

        loading.style.display = "none";

    }

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos() {

    videoGrid.innerHTML = "";

    const filteredVideos = videos.filter(video => {

        const category =
            String(video.category || "")
                .trim()
                .toLowerCase();

        const categoryMatch =
            currentCategory === "all" ||
            category ===
            currentCategory.toLowerCase();

        const tags =
            Array.isArray(video.tags)
                ? video.tags.join(" ")
                : String(video.tags || "");

        const searchableText = `
            ${video.title || ""}
            ${video.description || ""}
            ${video.category || ""}
            ${tags}
            ${video.creatorName || ""}
        `.toLowerCase();

        const searchMatch =
            !searchTerm ||
            searchableText.includes(searchTerm);

        return categoryMatch && searchMatch;

    });


    if (filteredVideos.length === 0) {

        empty.style.display = "block";

        return;

    }

    empty.style.display = "none";


    filteredVideos.forEach(video => {

        const card =
            createVideoCard(video);

        videoGrid.appendChild(card);

    });

}


/* =====================================================
   CREATE VIDEO CARD
===================================================== */

function createVideoCard(video) {

    const card =
        document.createElement("article");

    card.className = "video-card";


    const title =
        escapeHTML(
            video.title ||
            "Untitled Video"
        );


    const description =
        escapeHTML(
            video.description ||
            ""
        );


    const thumbnail =
        video.thumbnail ||
        "https://via.placeholder.com/640x360?text=LetsStudy+Pro";


    const creatorName =
        escapeHTML(
            video.creatorName ||
            "Let'sStudy Pro"
        );


    const creatorImage =
        video.creatorImage ||
        `https://ui-avatars.com/api/?name=${encodeURIComponent(
            video.creatorName ||
            "Let'sStudy Pro"
        )}&background=2563eb&color=fff`;


    const duration =
        escapeHTML(
            video.duration ||
            ""
        );


    const category =
        escapeHTML(
            video.category ||
            "Video"
        );


    const views =
        formatNumber(
            video.views || 0
        );


    const likes =
        formatNumber(
            video.likes || 0
        );


    const isFree =
        video.isFree === true;


    const price =
        Number(video.price || 0);


    const currency =
        escapeHTML(
            video.currency ||
            "TZS"
        );


    card.innerHTML = `

        <div class="thumbnail">

            <img
                src="${escapeAttribute(thumbnail)}"
                alt="${escapeAttribute(title)}"
                loading="lazy"
                onerror="
                    this.src='https://via.placeholder.com/640x360?text=Video'
                "
            >

            <div class="play-overlay">
                <i class="fa-solid fa-play"></i>
            </div>

            <span
                class="badge ${isFree ? "free" : "premium"}"
            >
                ${isFree ? "FREE" : "PLAN"}
            </span>

            ${
                duration
                ? `
                    <span class="duration">
                        ${duration}
                    </span>
                `
                : ""
            }

        </div>


        <div class="video-info">

            <h2 class="video-title">
                ${title}
            </h2>

            <p class="video-description">
                ${description}
            </p>


            <div class="channel">

                <img
                    src="${escapeAttribute(creatorImage)}"
                    alt="${escapeAttribute(creatorName)}"
                    loading="lazy"
                    onerror="
                        this.src='https://ui-avatars.com/api/?name=Creator'
                    "
                >

                <div>

                    <div class="channel-name">
                        ${creatorName}
                    </div>

                    <div class="verified-row">

                        ${
                            video.verified === true
                            ? `
                                <i
                                    class="fa-solid fa-circle-check"
                                    title="Verified"
                                ></i>
                            `
                            : ""
                        }

                        ${
                            video.category
                            ? category
                            : ""
                        }

                    </div>

                </div>

            </div>


            <div class="meta">

                <span>
                    <i class="fa-regular fa-eye"></i>
                    ${views}
                </span>

                <span>
                    <i class="fa-regular fa-thumbs-up"></i>
                    ${likes}
                </span>

                <span>
                    ${category}
                </span>

            </div>


            <div class="card-action">

                ${
                    isFree
                    ? `
                        <button
                            class="watch-btn free-btn"
                            type="button"
                        >
                            <i class="fa-solid fa-play"></i>
                            Watch Free
                        </button>
                    `
                    : `
                        <button
                            class="watch-btn plan-btn"
                            type="button"
                        >
                            <i class="fa-solid fa-lock"></i>
                            ${
                                price > 0
                                ? `${formatNumber(price)} ${currency}`
                                : "View Plan"
                            }
                        </button>
                    `
                }

            </div>

        </div>

    `;


    const actionButton =
        card.querySelector(".watch-btn");


    if (actionButton) {

        actionButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openVideo(video);

            }
        );

    }


    card.addEventListener(
        "click",
        () => {

            openVideo(video);

        }
    );


    return card;

}


/* =====================================================
   VIDEO OPEN FLOW
===================================================== */

function openVideo(video) {

    if (!video || !video.videoId) {

        console.error(
            "Video document ID is missing.",
            video
        );

        return;

    }


    /*
     * IMPORTANT:
     *
     * The Firestore document ID is passed
     * to the destination page.
     *
     * FREE
     * → watch.html
     *
     * PLAN / PAID
     * → video-checkout.html
     */


    if (video.isFree === true) {

        window.location.href =
            "watch.html?id=" +
            encodeURIComponent(
                video.videoId
            );

        return;

    }


    window.location.href =
        "video-checkout.html?id=" +
        encodeURIComponent(
            video.videoId
        );

}


/* =====================================================
   SEARCH
===================================================== */

function performSearch() {

    searchTerm =
        searchInput.value
            .trim()
            .toLowerCase();

    renderVideos();

}


searchInput.addEventListener(
    "input",
    performSearch
);


searchBtn.addEventListener(
    "click",
    performSearch
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            performSearch();

        }

    }
);


/* =====================================================
   CATEGORY FILTER
===================================================== */

filters.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            filters.forEach(
                btn => {

                    btn.classList.remove(
                        "active"
                    );

                }
            );


            button.classList.add(
                "active"
            );


            currentCategory =
                button.dataset.category ||
                "all";


            renderVideos();

        }
    );

});


/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(value) {

    const number =
        Number(value) || 0;


    if (number >= 1000000) {

        return (
            number / 1000000
        ).toFixed(1) + "M";

    }


    if (number >= 1000) {

        return (
            number / 1000
        ).toFixed(1) + "K";

    }


    return number.toString();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value) {

    return escapeHTML(value);

}


/* =====================================================
   START APPLICATION
===================================================== */

loadVideos();

</script>
