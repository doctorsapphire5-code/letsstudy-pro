<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>My Courses | LetsStudy Pro</title>

<meta name="description"
content="Manage your enrolled courses and learning progress on LetsStudy Pro.">

<meta name="robots" content="noindex,nofollow">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer
}

.container{
  width:92%;
  max-width:1150px;
  margin:30px auto
}

.hero{
  background:#fff;
  border-radius:17px;
  padding:28px 24px;
  margin-bottom:18px
}

.hero h1{
  font-size:30px;
  margin-bottom:7px
}

.hero p{
  color:#64748b
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:20px
}

.stat{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:13px
}

.stat strong{
  display:block;
  font-size:21px
}

.stat span{
  color:#64748b;
  font-size:11px
}

.search{
  width:100%;
  padding:13px 14px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  margin-bottom:18px;
  font-size:14px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:15px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:18px;
  display:flex;
  flex-direction:column;
  min-height:245px
}

.badge{
  width:max-content;
  padding:5px 9px;
  border-radius:7px;
  background:#eff6ff;
  color:#2563eb;
  font-size:10px;
  font-weight:800;
  margin-bottom:10px
}

.card h2{
  font-size:18px;
  margin-bottom:7px
}

.description{
  color:#64748b;
  font-size:13px;
  flex:1
}

.progress-wrap{
  margin-top:15px
}

.progress-info{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#64748b;
  margin-bottom:6px
}

.progress{
  height:6px;
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden
}

.progress-bar{
  height:100%;
  width:0;
  background:#2563eb
}

.continue{
  margin-top:15px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-size:13px;
  font-weight:800
}

.loading,
.empty,
.error{
  background:#fff;
  border-radius:15px;
  padding:55px 20px;
  text-align:center;
  color:#64748b
}

.error{
  color:#b91c1c
}

@media(max-width:650px){

  .stats{
    grid-template-columns:1fr
  }

  .hero h1{
    font-size:26px
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      My Courses
    </h1>

    <p>
      Continue learning and track your course progress.
    </p>


    <div class="stats">

      <div class="stat">
        <strong id="total">0</strong>
        <span>Enrolled Courses</span>
      </div>

      <div class="stat">
        <strong id="progress">0%</strong>
        <span>Average Progress</span>
      </div>

      <div class="stat">
        <strong id="completed">0</strong>
        <span>Completed</span>
      </div>

    </div>

  </section>


  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search my courses..."
    autocomplete="off"
  >


  <section
    id="courses"
    class="grid"
  >

    <div class="loading">
      Loading your courses...
    </div>

  </section>

</main>


<script>

/*
==================================================
MY-COURSE.HTML

API:

GET
/api/my-courses?userId=USER_ID

EXPECTED RESPONSE:

{
  "courses":[
    {
      "id":"",
      "courseId":"",
      "title":"",
      "description":"",
      "progress":45,
      "status":"in-progress",
      "lastLessonId":"",
      "lastLessonTitle":""
    }
  ]
}

FALLBACK:

localStorage userId

NO DIRECT FIREBASE
==================================================
*/


const coursesBox =
  document.getElementById(
    "courses"
  );

const search =
  document.getElementById(
    "search"
  );

const total =
  document.getElementById(
    "total"
  );

const progress =
  document.getElementById(
    "progress"
  );

const completed =
  document.getElementById(
    "completed"
  );


const params =
  new URLSearchParams(
    location.search
  );


const userId =
  params.get("userId") ||
  localStorage.getItem(
    "userId"
  ) ||
  "";


let courses = [];


/* =========================
   LOAD
========================= */

if(!userId){

  showError(
    "Please sign in to view your courses."
  );

}else{

  loadCourses();

}


/* =========================
   LOAD COURSES
========================= */

async function loadCourses(){

  try{

    const response =
      await fetch(
        "/api/my-courses?userId=" +
        encodeURIComponent(
          userId
        )
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load your courses."
      );

    }


    courses =
      Array.isArray(
        result.courses
      )
      ? result.courses
      : Array.isArray(
          result.results
        )
        ? result.results
        : [];


    updateStats();

    renderCourses();

  }catch(error){

    console.error(
      "MY COURSES:",
      error
    );


    showError(
      error.message
    );

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  total.textContent =
    courses.length;


  if(!courses.length){

    progress.textContent =
      "0%";

    completed.textContent =
      "0";

    return;

  }


  const values =
    courses.map(
      course =>
        normalizeProgress(
          course.progress
        )
    );


  const average =
    values.reduce(
      (a,b) => a + b,
      0
    ) / values.length;


  progress.textContent =
    Math.round(
      average
    ) + "%";


  completed.textContent =
    values.filter(
      value =>
        value >= 100
    ).length;

}


/* =========================
   RENDER
========================= */

function renderCourses(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    courses.filter(
      course => {

        const title =
          course.title ||
          course.name ||
          "";


        const description =
          course.description ||
          "";


        return (
          !keyword ||
          (
            title +
            " " +
            description
          )
          .toLowerCase()
          .includes(
            keyword
          )
        );

      }
    );


  if(!filtered.length){

    coursesBox.innerHTML = `

      <div class="empty">

        ${
          courses.length
          ? "No matching courses found."
          : "You have not enrolled in any courses yet."
        }

      </div>

    `;

    return;

  }


  coursesBox.innerHTML =
    filtered
      .map(
        createCourseCard
      )
      .join("");

}


/* =========================
   COURSE CARD
========================= */

function createCourseCard(
  course
){

  const id =
    course.courseId ||
    course.id ||
    course.documentId ||
    "";


  const title =
    course.title ||
    course.name ||
    "Course";


  const description =
    course.description ||
    course.summary ||
    "Continue your learning journey.";


  const value =
    normalizeProgress(
      course.progress
    );


  let status =
    course.status ||
    "";


  if(
    value >= 100
  ){

    status =
      "Completed";

  }else if(
    value > 0
  ){

    status =
      "In Progress";

  }else{

    status =
      "Not Started";

  }


  const lessonId =
    course.lastLessonId ||
    "";


  let continueUrl =
    id
    ? "course.html?courseId=" +
      encodeURIComponent(id)
    : "course.html";


  if(lessonId){

    continueUrl =
      "lesson.html?courseId=" +
      encodeURIComponent(id) +
      "&lessonId=" +
      encodeURIComponent(
        lessonId
      );

  }


  return `

    <article class="card">

      <span class="badge">

        ${escapeHTML(
          status
        )}

      </span>


      <h2>

        ${escapeHTML(
          title
        )}

      </h2>


      <p class="description">

        ${escapeHTML(
          description
        )}

      </p>


      ${
        course.lastLessonTitle
        ? `

          <div
            style="
              font-size:11px;
              color:#64748b;
              margin-top:10px
            "
          >

            Last lesson:
            ${escapeHTML(
              course.lastLessonTitle
            )}

          </div>

        `
        : ""
      }


      <div class="progress-wrap">

        <div class="progress-info">

          <span>
            Progress
          </span>

          <strong>
            ${value}%
          </strong>

        </div>


        <div class="progress">

          <div
            class="progress-bar"
            style="width:${value}%"
          ></div>

        </div>

      </div>


      <a
        href="${continueUrl}"
        class="continue"
      >

        ${
          value >= 100
          ? "Review Course"
          : value > 0
            ? "Continue Learning"
            : "Start Course"
        }

      </a>

    </article>

  `;

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  renderCourses
);


/* =========================
   PROGRESS
========================= */

function normalizeProgress(
  value
){

  if(
    typeof value ===
    "string" &&
    value.includes("%")
  ){

    value =
      value.replace(
        "%",
        ""
      );

  }


  value =
    Number(value);


  if(
    Number.isNaN(value)
  ){

    return 0;

  }


  return Math.max(
    0,
    Math.min(
      100,
      Math.round(value)
    )
  );

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  coursesBox.className =
    "error";


  coursesBox.innerHTML = `

    <h2>
      My Courses
    </h2>

    <p style="margin-top:10px">

      ${escapeHTML(
        message
      )}

    </p>

  `;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
