<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>My Courses | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a
}

a{text-decoration:none}

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:14px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb
}

.nav{
display:flex;
gap:7px;
flex-wrap:wrap
}

.nav a{
font-size:9px;
font-weight:900;
color:#334155;
background:#f1f5f9;
padding:8px 10px;
border-radius:8px
}

.container{
max-width:1000px;
margin:auto;
padding:25px 15px
}

.hero{
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:white;
border-radius:20px;
padding:25px;
margin-bottom:18px
}

.hero .label{
color:#dbeafe
}

.label{
font-size:9px;
font-weight:900;
margin-bottom:7px;
color:#2563eb
}

.hero h1{
font-size:27px;
margin-bottom:8px
}

.hero p{
font-size:11px;
line-height:1.7;
opacity:.9
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:18px
}

.stat{
background:rgba(255,255,255,.14);
border-radius:12px;
padding:12px
}

.stat strong{
display:block;
font-size:19px
}

.stat span{
font-size:8px
}

.toolbar{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:13px;
margin-bottom:15px;
display:flex;
gap:10px;
flex-wrap:wrap
}

input,select{
border:1px solid #cbd5e1;
border-radius:9px;
padding:10px;
font-size:10px;
outline:none
}

input{
flex:1;
min-width:180px
}

select{
min-width:130px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:16px;
overflow:hidden
}

.cover{
height:130px;
background:linear-gradient(135deg,#dbeafe,#ede9fe);
display:flex;
align-items:center;
justify-content:center;
font-size:40px
}

.content{
padding:15px
}

.title{
font-size:14px;
font-weight:900;
line-height:1.4;
margin-bottom:7px
}

.meta{
font-size:9px;
color:#64748b;
line-height:1.6
}

.progress-wrap{
margin-top:12px
}

.progress-head{
display:flex;
justify-content:space-between;
font-size:9px;
font-weight:900;
margin-bottom:5px
}

.progress{
height:7px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden
}

.progress-bar{
height:100%;
background:#2563eb;
width:0
}

.status{
display:inline-block;
margin-top:10px;
padding:5px 8px;
border-radius:6px;
font-size:8px;
font-weight:900;
background:#eff6ff;
color:#2563eb
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-top:13px
}

.btn{
display:flex;
justify-content:center;
align-items:center;
padding:9px 5px;
border-radius:8px;
font-size:8px;
font-weight:900;
text-align:center
}

.primary{
background:#2563eb;
color:white
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.certificate{
background:#f0fdf4;
color:#166534
}

.empty{
background:#fff;
border:1px solid #e2e8f0;
border-radius:16px;
padding:45px 20px;
text-align:center;
grid-column:1/-1
}

.empty-icon{
font-size:35px;
margin-bottom:10px
}

.empty h2{
font-size:16px;
margin-bottom:6px
}

.empty p{
font-size:10px;
color:#64748b;
margin-bottom:15px
}

.loading{
padding:70px;
text-align:center;
color:#64748b;
font-size:12px
}

.message{
display:none;
padding:10px;
border-radius:9px;
font-size:10px;
font-weight:900;
margin-bottom:12px;
background:#fee2e2;
color:#991b1b
}

footer{
text-align:center;
padding:30px;
font-size:10px;
color:#64748b
}

@media(max-width:800px){
.grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:550px){

header{
flex-direction:column;
align-items:flex-start
}

.nav{
width:100%
}

.nav a{
flex:1;
text-align:center
}

.grid{
grid-template-columns:1fr
}

.stats{
grid-template-columns:1fr 1fr 1fr
}

.hero h1{
font-size:23px
}

}
</style>
</head>

<body>

<header>

<a href="dashboard.html" class="logo">
LetsStudy Pro
</a>

<nav class="nav">

<a href="courses.html">
Courses
</a>

<a href="dashboard.html">
Dashboard
</a>

<a href="certificate.html">
Certificates
</a>

</nav>

</header>


<main class="container">

<section class="hero">

<div class="label">
MY LEARNING
</div>

<h1>
My Courses
</h1>

<p>
Continue learning, track your progress and complete your courses.
</p>

<div class="stats">

<div class="stat">
<strong id="totalCourses">0</strong>
<span>Enrolled</span>
</div>

<div class="stat">
<strong id="completedCourses">0</strong>
<span>Completed</span>
</div>

<div class="stat">
<strong id="averageProgress">0%</strong>
<span>Progress</span>
</div>

</div>

</section>


<div id="message" class="message"></div>


<section class="toolbar">

<input
id="search"
type="search"
placeholder="Search your courses...">

<select id="filter">

<option value="all">
All Courses
</option>

<option value="progress">
In Progress
</option>

<option value="completed">
Completed
</option>

</select>

</section>


<div id="loading" class="loading">
Loading your courses...
</div>


<section
id="coursesGrid"
class="grid"
style="display:none">
</section>

</main>


<footer>

© <span id="year"></span> LetsStudy Pro

</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const loading=
document.getElementById("loading");

const grid=
document.getElementById("coursesGrid");

const search=
document.getElementById("search");

const filter=
document.getElementById("filter");

const totalCourses=
document.getElementById("totalCourses");

const completedCourses=
document.getElementById("completedCourses");

const averageProgress=
document.getElementById("averageProgress");

const message=
document.getElementById("message");


let currentUser=null;
let enrolledCourses=[];


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

const redirect=
"my-courses.html";

location.href=
"login.html?redirect="+
encodeURIComponent(redirect);

return;

}

currentUser=user;

await loadMyCourses();

}
);


/* =========================================
LOAD MY COURSES
========================================= */

async function loadMyCourses(){

try{

/*
Expected enrollment structure:

enrollments
 └── document
     userId
     courseId
     progress
     completed
*/

const q=
query(

collection(
db,
"enrollments"
),

where(
"userId",
"==",
currentUser.uid
)

);

const snap=
await getDocs(q);

enrolledCourses=[];

for(
const enrollmentDoc
of snap.docs
){

const enrollment=
enrollmentDoc.data();

if(!enrollment.courseId){
continue;
}

const courseSnap=
await getDoc(
doc(
db,
"courses",
enrollment.courseId
)
);

if(!courseSnap.exists()){
continue;
}

enrolledCourses.push({

id:courseSnap.id,

course:
courseSnap.data(),

enrollment:enrollment

});

}

updateStats();

renderCourses();

loading.style.display="none";

grid.style.display="grid";

}catch(error){

console.error(error);

loading.textContent=
"Unable to load your courses.";

}

}


/* =========================================
STATS
========================================= */

function updateStats(){

const total=
enrolledCourses.length;

const completed=
enrolledCourses.filter(
item=>
isCompleted(item)
).length;

let progressTotal=0;

enrolledCourses.forEach(
item=>{

progressTotal+=
getProgress(item);

});

const average=
total
?
Math.round(
progressTotal/total
)
:
0;

totalCourses.textContent=
total;

completedCourses.textContent=
completed;

averageProgress.textContent=
average+"%";

}


/* =========================================
PROGRESS
========================================= */

function getProgress(item){

let value=
item.enrollment.progress;

if(
typeof value==="number"
){

return clamp(value);

}

if(
typeof item.enrollment.progressPercent==="number"
){

return clamp(
item.enrollment.progressPercent
);

}

if(
item.enrollment.completed===true
){

return 100;

}

return 0;

}


function clamp(value){

return Math.max(
0,
Math.min(
100,
Number(value)||0
)
);

}


function isCompleted(item){

return (
item.enrollment.completed===true
||
getProgress(item)>=100
);

}


/* =========================================
RENDER
========================================= */

function renderCourses(){

const keyword=
search.value
.trim()
.toLowerCase();

const selected=
filter.value;

let data=
enrolledCourses.filter(
item=>{

const title=
String(
item.course.title||
""
).toLowerCase();

const matchesSearch=
title.includes(keyword);

const progress=
getProgress(item);

let matchesFilter=true;

if(selected==="progress"){

matchesFilter=
progress>0 &&
progress<100;

}

if(selected==="completed"){

matchesFilter=
progress>=100;

}

return (
matchesSearch &&
matchesFilter
);

}
);


grid.innerHTML="";


if(!data.length){

grid.innerHTML=`

<div class="empty">

<div class="empty-icon">
📚
</div>

<h2>
No courses found
</h2>

<p>
You have no courses matching this filter.
</p>

<a
href="courses.html"
class="btn primary"
style="display:inline-flex">

Explore Courses

</a>

</div>

`;

return;

}


data.forEach(
item=>{

const course=
item.course;

const enrollment=
item.enrollment;

const progress=
getProgress(item);

const completed=
progress>=100;

const title=
escapeHTML(
course.title||
"Untitled Course"
);

const description=
escapeHTML(
course.description||
"Continue your learning journey."
);

const image=
course.image||
course.thumbnail||
"";

const queryString=
"?courseId="+
encodeURIComponent(
item.id
);

const card=
document.createElement("article");

card.className="card";

card.innerHTML=`

<div class="cover"
style="${
image
?
"background-image:url('"+
escapeAttribute(image)+
"');background-size:cover;background-position:center;"
:
""
}">

${
image
?
""
:
"📚"
}

</div>

<div class="content">

<div class="title">
${title}
</div>

<div class="meta">
${description.substring(0,110)}
${description.length>110?"...":""}
</div>

<div class="progress-wrap">

<div class="progress-head">

<span>
Progress
</span>

<span>
${progress}%
</span>

</div>

<div class="progress">

<div
class="progress-bar"
style="width:${progress}%">
</div>

</div>

</div>

<div class="status">

${
completed
?
"✓ Completed"
:
progress>0
?
"● In Progress"
:
"Not Started"
}

</div>

<div class="actions">

<a
href="course-learning.html${queryString}"
class="btn primary">

${
completed
?
"Review Course"
:
"Continue Learning"
}

</a>

<a
href="course-progress.html${queryString}"
class="btn secondary">

Progress

</a>

${
completed
?
`
<a
href="certificate.html${queryString}"
class="btn certificate">

🎓 Certificate

</a>
`
:
`
<a
href="courses.html"
class="btn secondary">

More Courses

</a>
`
}

</div>

</div>

`;

grid.appendChild(card);

});

}


/* =========================================
SEARCH / FILTER
========================================= */

search.addEventListener(
"input",
renderCourses
);

filter.addEventListener(
"change",
renderCourses
);


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function escapeAttribute(value){

return String(value)
.replaceAll("'","%27")
.replaceAll('"',"%22");

}


/* =========================================
YEAR
========================================= */

document.getElementById(
"year"
).textContent=
new Date().getFullYear();

</script>

</body>
</html>
