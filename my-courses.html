<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Courses | LetsStudy Pro</title><style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
gap:12px;
padding:0 16px;
position:sticky;
top:0;
z-index:20;
}

.logo{
font-weight:900;
font-size:16px;
color:#2563eb;
}

.title{
flex:1;
font-weight:700;
font-size:16px;
}

.head-btn{
border:0;
background:#eff6ff;
color:#2563eb;
padding:9px 11px;
border-radius:9px;
cursor:pointer;
}

main{
max-width:1150px;
margin:auto;
padding:18px;
}

.hero{
background:linear-gradient(135deg,#172554,#2563eb);
color:#fff;
border-radius:20px;
padding:26px;
margin-bottom:18px;
}

.hero h1{
margin:0 0 7px;
font-size:25px;
}

.hero p{
margin:0;
color:#dbeafe;
font-size:12px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:18px;
}

.stat{
background:#ffffff18;
border:1px solid #ffffff22;
border-radius:11px;
padding:12px;
}

.stat strong{
display:block;
font-size:20px;
}

.stat span{
font-size:9px;
color:#dbeafe;
}

.search{
background:#fff;
border:1px solid #e5e7eb;
border-radius:12px;
padding:9px;
margin-bottom:14px;
}

.search input{
width:100%;
border:0;
outline:0;
padding:10px;
font-size:12px;
}

.filters{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:15px;
}

.filter{
border:1px solid #e5e7eb;
background:#fff;
padding:9px 14px;
border-radius:20px;
font-size:10px;
white-space:nowrap;
cursor:pointer;
}

.filter.active{
background:#2563eb;
color:#fff;
border-color:#2563eb;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
overflow:hidden;
}

.image{
height:155px;
background:#e2e8f0;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.image img{
width:100%;
height:100%;
object-fit:cover;
}

.placeholder{
font-size:45px;
}

.body{
padding:14px;
}

.badge{
display:inline-block;
font-size:9px;
padding:5px 8px;
background:#eff6ff;
color:#1d4ed8;
border-radius:6px;
margin-bottom:8px;
}

.course-title{
font-size:14px;
font-weight:800;
line-height:1.4;
}

.description{
font-size:10px;
color:#64748b;
margin:6px 0 12px;
line-height:1.5;
height:30px;
overflow:hidden;
}

.progress-row{
display:flex;
justify-content:space-between;
font-size:9px;
color:#64748b;
margin-bottom:6px;
}

.progress{
height:7px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:#2563eb;
border-radius:20px;
}

.bottom{
display:flex;
align-items:center;
gap:8px;
margin-top:13px;
}

.status{
flex:1;
font-size:10px;
font-weight:700;
}

.continue{
border:0;
background:#2563eb;
color:#fff;
padding:9px 11px;
border-radius:8px;
font-size:10px;
font-weight:700;
cursor:pointer;
}

.loading,
.empty{
grid-column:1/-1;
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:45px 20px;
text-align:center;
color:#64748b;
font-size:12px;
}

@media(max-width:900px){
.grid{grid-template-columns:1fr 1fr}
}

@media(max-width:600px){
main{padding:10px}
.grid{grid-template-columns:1fr}
.stats{grid-template-columns:1fr 1fr 1fr}
.hero{padding:20px}
}
</style></head><body><header><div class="logo">
LETSSTUDY PRO
</div><div class="title">
My Courses
</div><button
class="head-btn"
onclick="location.href='explore.html'">
🔎
</button>

<button
class="head-btn"
onclick="location.href='dashboard.html'">
🏠
</button>

</header><main><section class="hero"><h1>
My Learning 🎓
</h1><p>
Continue learning from where you stopped.
</p><div class="stats"><div class="stat">
<strong id="total">0</strong>
<span>Enrolled</span>
</div><div class="stat">
<strong id="active">0</strong>
<span>In Progress</span>
</div><div class="stat">
<strong id="completed">0</strong>
<span>Completed</span>
</div></div></section><div class="search"><input
id="search"
type="search"
placeholder="Search my courses..."
oninput="render()">

</div><div class="filters"><button
class="filter active"
onclick="setFilter(this,'all')">
All
</button>

<button
class="filter"
onclick="setFilter(this,'progress')">
In Progress
</button>

<button
class="filter"
onclick="setFilter(this,'completed')">
Completed
</button>

</div><section
id="courses"
class="grid"><div class="loading">
📚 Loading your courses...
</div></section></main><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
query,
where,
getDocs,
documentId
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

let currentUser=null;
let myCourses=[];
let selectedFilter="all";


onAuthStateChanged(auth,user=>{

if(!user){

location.href="login.html";
return;

}

currentUser=user;

loadMyCourses();

});


async function loadMyCourses(){

const container=
document.getElementById("courses");

try{

/*
Expected enrollment structure:

enrollments/{id}

userId
courseId
status
progress
completed
enrolledAt
*/

const q=query(
collection(db,"enrollments"),
where("userId","==",currentUser.uid)
);

const enrollmentSnap=
await getDocs(q);

if(enrollmentSnap.empty){

myCourses=[];

updateStats();

render();

return;

}


const enrollments=
enrollmentSnap.docs.map(doc=>({
id:doc.id,
...doc.data()
}));


/*
Load courses individually.
This avoids requiring a composite Firestore index.
*/

const result=[];

for(const enrollment of enrollments){

if(!enrollment.courseId)
continue;

try{

const courseSnap=
await getDocs(
query(
collection(db,"courses"),
where(
documentId(),
"==",
enrollment.courseId
)
)
);

if(!courseSnap.empty){

const courseDoc=
courseSnap.docs[0];

result.push({

enrollmentId:enrollment.id,

...courseDoc.data(),

id:courseDoc.id,

progress:
Number(enrollment.progress||0),

completed:
enrollment.completed===true||
Number(enrollment.progress||0)>=100,

status:
enrollment.status||
"active"

});

}

}catch(error){

console.error(
"Course loading error:",
error
);

}

}


myCourses=result;

updateStats();

render();

}catch(error){

console.error(error);

container.innerHTML=`

<div class="empty">

⚠️ Unable to load your courses.

<br><br>

${escapeHTML(error.message)}

</div>

`;

}

}


function updateStats(){

const total=
myCourses.length;

const completed=
myCourses.filter(
course=>course.completed
).length;

const active=
total-completed;

document.getElementById(
"total"
).textContent=total;

document.getElementById(
"active"
).textContent=active;

document.getElementById(
"completed"
).textContent=completed;

}


window.setFilter=function(
button,
filter
){

selectedFilter=filter;

document
.querySelectorAll(".filter")
.forEach(item=>{
item.classList.remove("active");
});

button.classList.add("active");

render();

};


window.render=function(){

const container=
document.getElementById("courses");

const search=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();


let result=
myCourses.filter(course=>{

const title=
String(
course.title||
course.name||
""
).toLowerCase();

const category=
String(
course.category||
""
).toLowerCase();


const matchesSearch=
!search||
title.includes(search)||
category.includes(search);


const matchesFilter=
selectedFilter==="all"||
(
selectedFilter==="completed"&&
course.completed
)||
(
selectedFilter==="progress"&&
!course.completed
);


return(
matchesSearch&&
matchesFilter
);

});


if(!result.length){

container.innerHTML=`

<div class="empty">

${
myCourses.length
?
"🔎 No matching courses."
:
"📚 You have not enrolled in any course yet."
}

<br><br>

<button
class="continue"
onclick="location.href='explore.html'">

Explore Courses

</button>

</div>

`;

return;

}


container.innerHTML=
result.map(course=>{

const title=
course.title||
course.name||
"Untitled Course";

const image=
course.thumbnail||
course.image||
course.imageUrl||
"";

const progress=
Math.max(
0,
Math.min(
100,
Number(course.progress||0)
)
);


return`

<article class="card">

<div class="image">

${
image
?
`
<img
src="${escapeHTML(image)}"
alt="${escapeHTML(title)}"
onerror="this.style.display='none'">
`
:
`
<div class="placeholder">
📚
</div>
`
}

</div>


<div class="body">

<div class="badge">

${escapeHTML(
course.category||
"Course"
)}

</div>


<div class="course-title">

${escapeHTML(title)}

</div>


<div class="description">

${escapeHTML(
course.description||
"Continue your learning journey."
)}

</div>


<div class="progress-row">

<span>
Progress
</span>

<strong>
${progress}%
</strong>

</div>


<div class="progress">

<div
class="progress-bar"
style="width:${progress}%">
</div>

</div>


<div class="bottom">

<div class="status">

${
progress>=100
?
"✅ Completed"
:
progress>0
?
"▶️ In Progress"
:
"Not Started"
}

</div>


<button
class="continue"
onclick="continueCourse('${escapeAttr(course.id)}')">

${
progress>=100
?
"Review"
:
"Continue"
}

</button>

</div>

</div>

</article>

`;

}).join("");

}


window.continueCourse=function(
courseId
){

location.href=
"course-learning.html?courseId="+
encodeURIComponent(courseId);

};


function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(value){

return String(value??"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}

</script></body>
</html>
