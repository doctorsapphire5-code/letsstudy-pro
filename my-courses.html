<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Courses | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#f6f8fb;
  color:#172033
}
a{text-decoration:none;color:inherit}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid #e8ebf0
}

.nav{
  max-width:1200px;
  margin:auto;
  min-height:68px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  color:#059669;
  font-weight:950;
  font-size:21px
}

.navlinks{
  display:flex;
  gap:18px;
  align-items:center;
  font-size:13px;
  font-weight:800;
  color:#667085
}

.navlinks a:hover{color:#059669}

.cart{
  padding:9px 12px;
  border-radius:9px;
  background:#ecfdf5;
  color:#047857
}

main{
  max-width:1200px;
  margin:auto;
  padding:30px 18px 70px
}

.hero{
  padding:30px;
  border-radius:22px;
  color:#fff;
  background:
  radial-gradient(circle at 90% 0,#34d39955,transparent 30%),
  linear-gradient(135deg,#064e3b,#059669)
}

.hero h1{
  margin:0;
  font-size:34px
}

.hero p{
  margin:9px 0 0;
  max-width:650px;
  line-height:1.7;
  color:#d1fae5
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:650px;
  margin-top:24px
}

.stat{
  padding:14px;
  border:1px solid #ffffff25;
  border-radius:12px;
  background:#ffffff12
}

.stat strong{
  display:block;
  font-size:24px
}

.stat span{
  font-size:11px;
  color:#d1fae5
}

.toolbar{
  margin:25px 0 18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

input,select{
  padding:12px;
  border:1px solid #dce1e8;
  border-radius:10px;
  background:#fff;
  outline:none
}

input{
  flex:1;
  min-width:230px
}

input:focus,select:focus{
  border-color:#059669;
  box-shadow:0 0 0 3px #05966915
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.card{
  overflow:hidden;
  background:#fff;
  border:1px solid #e6e9ef;
  border-radius:17px;
  box-shadow:0 5px 20px #17203308;
  transition:.2s
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px #17203312
}

.image{
  height:175px;
  position:relative;
  background:#e5e7eb
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover
}

.badge{
  position:absolute;
  top:12px;
  left:12px;
  padding:6px 9px;
  border-radius:20px;
  background:#fff;
  font-size:10px;
  font-weight:950
}

.badge.active{color:#047857}
.badge.done{color:#1d4ed8}

.content{padding:17px}

.category{
  color:#059669;
  font-size:10px;
  font-weight:950;
  text-transform:uppercase
}

h2{
  margin:7px 0;
  font-size:17px;
  line-height:1.35
}

.instructor{
  color:#667085;
  font-size:11px;
  margin-bottom:16px
}

.progress-info{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  font-weight:800;
  margin-bottom:7px
}

.progress{
  height:7px;
  background:#e8edf1;
  border-radius:20px;
  overflow:hidden
}

.progress span{
  display:block;
  height:100%;
  background:#059669
}

.meta{
  display:flex;
  justify-content:space-between;
  margin:13px 0;
  font-size:10px;
  color:#667085
}

.actions{
  display:flex;
  gap:8px
}

.btn{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:9px;
  font-size:11px;
  font-weight:950
}

.primary{
  background:#059669;
  color:#fff
}

.secondary{
  background:#ecfdf5;
  color:#047857
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #e6e9ef;
  border-radius:17px;
  text-align:center;
  padding:65px 20px
}

.empty-icon{
  font-size:42px
}

.empty h2{
  margin:10px 0 5px
}

.empty p{
  color:#667085;
  font-size:13px
}

.empty a{
  display:inline-block;
  margin-top:10px;
  padding:11px 17px;
  border-radius:9px;
  background:#059669;
  color:#fff;
  font-size:12px;
  font-weight:900
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:60px;
  color:#667085
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:650px){
  .navlinks a:not(.cart){display:none}
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:27px}
}
</style>
</head>

<body>

<header>
<nav class="nav">

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<div class="navlinks">
<a href="courses.html">Courses</a>
<a href="resources.html">Resources</a>
<a href="dashboard.html">Dashboard</a>
<a href="cart.html" class="cart">🛒 Cart</a>
</div>

</nav>
</header>


<main>

<section class="hero">

<h1>My Courses</h1>

<p>
Your personal learning space. Continue where you
stopped, track your progress and complete your
courses at your own pace.
</p>

<div class="stats">

<div class="stat">
<strong id="total">0</strong>
<span>My Courses</span>
</div>

<div class="stat">
<strong id="learning">0</strong>
<span>In Progress</span>
</div>

<div class="stat">
<strong id="completed">0</strong>
<span>Completed</span>
</div>

</div>

</section>


<div class="toolbar">

<input
id="search"
type="search"
placeholder="Search my courses...">

<select id="filter">

<option value="all">
All Courses
</option>

<option value="learning">
In Progress
</option>

<option value="completed">
Completed
</option>

</select>

</div>


<section id="courses" class="grid">

<div class="loading">
Loading your courses...
</div>

</section>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAXKXbkljsyRgI_0rj0odBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let myCourses=[];


const $=id=>
document.getElementById(id);


function esc(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function progress(item){

let p=Number(item.progress||0);

if(p>0&&p<=1)p*=100;

return Math.max(
0,
Math.min(
100,
Math.round(p)
)
);

}


/* ================================
AUTH
================================ */




/* ================================
LOAD ENROLLMENTS
================================ */

async function loadMyCourses(){

const user=auth.currentUser;

try{

const q=query(
collection(db,"enrollments"),
where("userId","==",user.uid)
);

const snap=await getDocs(q);

const enrollments=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);


/*
  Load latest course information
  from courses collection.
*/

myCourses=[];

for(
const enrollment of enrollments
){

let course={
...enrollment
};

if(enrollment.courseId){

try{

const courseSnap=
await getDoc(
doc(
db,
"courses",
enrollment.courseId
)
);

if(courseSnap.exists()){

course={
...courseSnap.data(),
...enrollment,
courseId:
enrollment.courseId
};

}

}catch(error){

console.warn(
"Course lookup failed",
error
);

}

}

myCourses.push(course);

}


updateStats();
render();

}catch(error){

console.error(error);

$("courses").innerHTML=`

<div class="empty">

<div class="empty-icon">
⚠️
</div>

<h2>
Unable to load courses
</h2>

<p>
Please refresh the page and try again.
</p>

</div>

`;

}

}


/* ================================
STATS
================================ */

function updateStats(){

$("total").textContent=
myCourses.length;

$("completed").textContent=
myCourses.filter(
c=>c.status==="completed"
).length;

$("learning").textContent=
myCourses.filter(
c=>c.status!=="completed"
).length;

}


/* ================================
RENDER
================================ */

function render(){

const search=
$("search")
.value
.toLowerCase()
.trim();

const filter=
$("filter").value;


const list=
myCourses.filter(course=>{

const title=
String(
course.title ||
course.courseTitle ||
""
).toLowerCase();

const done=
course.status==="completed";

return(
(!search||title.includes(search))
&&
(
filter==="all"
||
filter==="learning"&&!done
||
filter==="completed"&&done
)
);

});


if(!list.length){

$("courses").innerHTML=`

<div class="empty">

<div class="empty-icon">
📚
</div>

<h2>
No courses found
</h2>

<p>
Explore our courses and start learning today.
</p>

<a href="courses.html">
Explore Courses
</a>

</div>

`;

return;

}


$("courses").innerHTML=
list.map(
course=>card(course)
).join("");

}


/* ================================
CARD
================================ */

function card(course){

const p=progress(course);

const done=
course.status==="completed";

const id=
course.courseId ||
course.id ||
"";


const title=
course.title ||
course.courseTitle ||
"Untitled Course";


const image=
course.thumbnail ||
course.courseThumbnail ||
course.banner ||
"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=900";


return `

<article class="card">

<div class="image">

<img
src="${esc(image)}"
alt="${esc(title)}">

<span class="badge ${
done?"done":"active"
}">

${
done
?"✓ Completed"
:"● In Progress"
}

</span>

</div>


<div class="content">

<div class="category">

${esc(
course.categoryName||
course.category||
"Course"
)}

</div>


<h2>
${esc(title)}
</h2>


<div class="instructor">

${esc(
course.instructorName||
"LetsStudy Pro"
)}

</div>


<div class="progress-info">

<span>
Progress
</span>

<strong>
${p}%
</strong>

</div>


<div class="progress">

<span style="width:${p}%"></span>

</div>


<div class="meta">

<span>
${Number(
course.completedLessons||0
)}
/
${Number(
course.totalLessons||
course.lessonCount||
0
)}
 lessons
</span>

<span>
${
course.duration||
"Self-paced"
}
</span>

</div>


<div class="actions">

<a
class="btn primary"
href="course-details.html?id=${encodeURIComponent(id)}">

${
done
?"Review Course"
:"Continue Learning"
}

</a>


<a
class="btn secondary"
href="course-details.html?id=${encodeURIComponent(id)}">

Details

</a>

</div>

</div>

</article>

`;

}


/* ================================
FILTERS
================================ */

$("search")
.addEventListener(
"input",
render
);

$("filter")
.addEventListener(
"change",
render
);

</script>

</body>
</html>
