<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Plugins</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

.container{
  width:min(1180px,94%);
  margin:auto
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:15px 0
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  color:#2563eb;
  font-size:19px;
  font-weight:900
}

.actions{
  display:flex;
  gap:7px
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  cursor:pointer;
  font-size:9px;
  font-weight:900;
  text-decoration:none
}

.primary{
  background:#2563eb;
  color:#fff
}

.gray{
  background:#f1f5f9;
  color:#334155
}

main{
  padding:28px 0 60px
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:20px
}

h1{
  font-size:29px;
  margin-bottom:6px
}

.subtitle{
  color:#64748b;
  font-size:10px
}

.filters{
  display:flex;
  gap:7px
}

input,
select{
  border:1px solid #dbe2ea;
  border-radius:8px;
  background:#fff;
  padding:10px;
  font-size:9px;
  outline:none
}

.search{
  width:220px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:17px
}

.label{
  color:#64748b;
  font-size:8px;
  font-weight:900;
  margin-bottom:7px
}

.value{
  font-size:24px;
  font-weight:900
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.plugin{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  overflow:hidden;
  transition:.2s
}

.plugin:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(15,23,42,.07)
}

.plugin-top{
  height:110px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:43px
}

.plugin-body{
  padding:15px
}

.plugin-title{
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:8px
}

.plugin-name{
  font-size:13px;
  font-weight:900;
  margin-bottom:5px
}

.version{
  color:#94a3b8;
  font-size:7px
}

.status{
  padding:5px 7px;
  border-radius:20px;
  font-size:7px;
  font-weight:900;
  white-space:nowrap
}

.active{
  background:#dcfce7;
  color:#166534
}

.pending{
  background:#fef3c7;
  color:#92400e
}

.draft{
  background:#e2e8f0;
  color:#475569
}

.description{
  color:#64748b;
  font-size:8px;
  line-height:1.5;
  margin:12px 0
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid #eef2f7;
  border-bottom:1px solid #eef2f7;
  padding:10px 0;
  margin-bottom:12px
}

.meta-item{
  text-align:center;
  border-right:1px solid #eef2f7
}

.meta-item:last-child{
  border-right:0
}

.meta strong{
  display:block;
  font-size:10px;
  margin-bottom:3px
}

.meta span{
  color:#94a3b8;
  font-size:7px
}

.card-actions{
  display:flex;
  gap:6px
}

.small-btn{
  flex:1;
  border:0;
  border-radius:7px;
  padding:9px 5px;
  font-size:8px;
  font-weight:900;
  cursor:pointer
}

.manage{
  background:#2563eb;
  color:#fff
}

.settings{
  background:#f1f5f9;
  color:#334155
}

.delete{
  background:#fee2e2;
  color:#991b1b
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:55px 20px;
  text-align:center;
  color:#64748b
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px
}

.empty h2{
  color:#172033;
  font-size:15px;
  margin-bottom:6px
}

.empty p{
  font-size:9px;
  margin-bottom:15px
}

.message{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#172033;
  color:#fff;
  padding:11px 15px;
  border-radius:8px;
  font-size:9px;
  font-weight:800;
  display:none;
  z-index:50
}

.message.show{
  display:block
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .stats{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:650px){
  .head{
    flex-direction:column;
    align-items:start;
    gap:12px
  }

  .filters{
    width:100%;
    flex-direction:column
  }

  .search{
    width:100%
  }

  .grid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">
🔌 My Plugins
</div>

<div class="actions">

<a
href="plugin-upload.html"
class="btn gray">
Upload
</a>

<a
href="plugin-submission.html"
class="btn primary">
+ Submit Plugin
</a>

</div>

</div>
</header>


<main class="container">

<section class="head">

<div>

<h1>My Plugins</h1>

<p class="subtitle">
Manage your uploaded plugins, versions, installs, users and revenue.
</p>

</div>

<div class="filters">

<input
id="search"
class="search"
placeholder="Search plugins..."
oninput="render()">

<select
id="status"
onchange="render()">

<option value="all">
All Status
</option>

<option value="Active">
Active
</option>

<option value="Pending Review">
Pending Review
</option>

<option value="Draft">
Draft
</option>

</select>

</div>

</section>


<section class="stats">

<div class="stat">

<div class="label">
TOTAL PLUGINS
</div>

<div
id="totalPlugins"
class="value">
0
</div>

</div>


<div class="stat">

<div class="label">
TOTAL INSTALLS
</div>

<div
id="totalInstalls"
class="value">
0
</div>

</div>


<div class="stat">

<div class="label">
ACTIVE USERS
</div>

<div
id="totalUsers"
class="value">
0
</div>

</div>


<div class="stat">

<div class="label">
TOTAL REVENUE
</div>

<div
id="totalRevenue"
class="value">
$0
</div>

</div>

</section>


<section
id="pluginGrid"
class="grid">
</section>

</main>


<div
id="message"
class="message">
</div>


<script>

const defaultPlugins=[

{
id:"analytics",
name:"Analytics Pro",
version:"2.4.0",
category:"Analytics",
description:"Powerful analytics and reporting tools for your website.",
installs:5240,
users:3840,
sales:184,
revenue:5336,
status:"Active",
icon:"📊"
},

{
id:"payments",
name:"Payment Gateway",
version:"1.8.2",
category:"Commerce",
description:"Accept online payments with multiple payment methods.",
installs:3180,
users:2140,
sales:96,
revenue:3744,
status:"Active",
icon:"💳"
},

{
id:"seo",
name:"SEO Toolkit",
version:"2.1.0",
category:"SEO",
description:"Optimize your website for search engines and improve rankings.",
installs:2270,
users:1640,
sales:72,
revenue:1368,
status:"Active",
icon:"🔍"
},

{
id:"forms",
name:"Smart Forms",
version:"1.5.3",
category:"Productivity",
description:"Create powerful forms and collect customer information.",
installs:1180,
users:820,
sales:43,
revenue:645,
status:"Pending Review",
icon:"📝"
},

{
id:"chat",
name:"Live Chat",
version:"1.2.1",
category:"Communication",
description:"Connect with customers through real-time website chat.",
installs:610,
users:502,
sales:31,
revenue:372,
status:"Draft",
icon:"💬"
}

];


let plugins=
JSON.parse(
localStorage.getItem("plugins")||"null"
);

if(!Array.isArray(plugins)||!plugins.length){

plugins=defaultPlugins;

}


function money(value){

return "$"+
Number(value||0).toLocaleString(
"en-US",
{
minimumFractionDigits:0,
maximumFractionDigits:0
}
);

}


function number(value){

return Number(value||0).toLocaleString();

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function updateStats(){

document.getElementById(
"totalPlugins"
).textContent=
number(plugins.length);


document.getElementById(
"totalInstalls"
).textContent=
number(
plugins.reduce(
(sum,p)=>
sum+Number(p.installs||0),
0
)
);


document.getElementById(
"totalUsers"
).textContent=
number(
plugins.reduce(
(sum,p)=>
sum+Number(p.users||0),
0
)
);


document.getElementById(
"totalRevenue"
).textContent=
money(
plugins.reduce(
(sum,p)=>
sum+Number(p.revenue||0),
0
)
);

}


function render(){

const grid=
document.getElementById(
"pluginGrid"
);

const search=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

const status=
document.getElementById(
"status"
).value;


const filtered=
plugins.filter(plugin=>{

const matchesSearch=
(plugin.name||"")
.toLowerCase()
.includes(search) ||

(plugin.category||"")
.toLowerCase()
.includes(search) ||

(plugin.description||"")
.toLowerCase()
.includes(search);


const matchesStatus=
status==="all" ||
(plugin.status||"Draft")===status;


return matchesSearch&&matchesStatus;

});


grid.innerHTML="";


if(!filtered.length){

grid.innerHTML=`

<div class="empty">

<div class="empty-icon">
🔌
</div>

<h2>
No plugins found
</h2>

<p>
Upload or submit your first plugin to get started.
</p>

<a
href="plugin-upload.html"
class="btn primary">
Upload Plugin
</a>

</div>

`;

updateStats();

return;

}


filtered.forEach(plugin=>{

const statusClass=
(plugin.status||"Draft")
.toLowerCase()
.includes("active")
?"active":
(plugin.status||"")
.toLowerCase()
.includes("pending")
?"pending":
"draft";


const card=
document.createElement("article");

card.className="plugin";

card.innerHTML=`

<div class="plugin-top">

${escapeHTML(plugin.icon||"🔌")}

</div>


<div class="plugin-body">

<div class="plugin-title">

<div>

<div class="plugin-name">

${escapeHTML(
plugin.name||"Untitled Plugin"
)}

</div>

<div class="version">

v${escapeHTML(
plugin.version||"1.0.0"
)}
•
${escapeHTML(
plugin.category||"Plugin"
)}

</div>

</div>


<span
class="status ${statusClass}">
${escapeHTML(
plugin.status||"Draft"
)}
</span>

</div>


<div class="description">

${escapeHTML(
plugin.description||
"No description available."
)}

</div>


<div class="meta">

<div class="meta-item">

<strong>
${number(plugin.installs)}
</strong>

<span>
Installs
</span>

</div>


<div class="meta-item">

<strong>
${number(plugin.users)}
</strong>

<span>
Users
</span>

</div>


<div class="meta-item">

<strong>
${money(plugin.revenue)}
</strong>

<span>
Revenue
</span>

</div>

</div>


<div class="card-actions">

<button
class="small-btn manage"
onclick="managePlugin('${escapeHTML(plugin.id)}')">
Manage
</button>

<button
class="small-btn settings"
onclick="editPlugin('${escapeHTML(plugin.id)}')">
Edit
</button>

<button
class="small-btn delete"
onclick="deletePlugin('${escapeHTML(plugin.id)}')">
Delete
</button>

</div>

</div>

`;

grid.appendChild(card);

});


updateStats();

}


function managePlugin(id){

const plugin=
plugins.find(p=>p.id===id);

if(!plugin)return;

showMessage(
"Opening "+plugin.name+"..."
);

localStorage.setItem(
"selectedPlugin",
JSON.stringify(plugin)
);

setTimeout(
()=>{
window.location.href=
"plugin-details.html";
},
500
);

}


function editPlugin(id){

const plugin=
plugins.find(p=>p.id===id);

if(!plugin)return;

localStorage.setItem(
"editingPlugin",
JSON.stringify(plugin)
);

showMessage(
"Opening plugin editor..."
);

setTimeout(
()=>{
window.location.href=
"plugin-edit.html";
},
500
);

}


function deletePlugin(id){

const plugin=
plugins.find(p=>p.id===id);

if(!plugin)return;

const confirmed=
confirm(
`Delete "${plugin.name}"? This action cannot be undone.`
);

if(!confirmed)return;


plugins=
plugins.filter(
p=>p.id!==id
);

localStorage.setItem(
"plugins",
JSON.stringify(plugins)
);

render();

showMessage(
"Plugin deleted."
);

}


function showMessage(text){

const message=
document.getElementById("message");

message.textContent=text;

message.classList.add("show");

setTimeout(
()=>{
message.classList.remove("show");
},
2500
);

}


render();

</script>

</body>
</html>
