<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Themes</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
.container{width:min(1150px,94%);margin:auto}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:15px 0
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.logo{
  color:#2563eb;
  font-size:20px;
  font-weight:900
}

.actions{
  display:flex;
  gap:8px
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-size:10px;
  font-weight:900;
  text-decoration:none;
  cursor:pointer
}

.primary{background:#2563eb;color:#fff}
.gray{background:#f1f5f9;color:#334155}

main{padding:30px 0 60px}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:22px
}

h1{font-size:30px;margin-bottom:7px}
.subtitle{font-size:11px;color:#64748b}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:16px
}

.label{
  color:#64748b;
  font-size:9px;
  margin-bottom:7px
}

.value{
  font-size:22px;
  font-weight:900
}

.toolbar{
  display:flex;
  gap:9px;
  background:#fff;
  border:1px solid #e2e8f0;
  padding:12px;
  border-radius:12px;
  margin-bottom:18px
}

.search{flex:1}

input,select{
  width:100%;
  padding:10px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none;
  font-size:10px;
  background:#fff
}

select{width:160px}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  overflow:hidden
}

.preview{
  height:170px;
  padding:13px;
  position:relative
}

.browser{
  height:100%;
  background:#fff;
  border-radius:7px 7px 0 0;
  overflow:hidden;
  box-shadow:0 5px 15px #0001
}

.top{
  height:20px;
  background:#f8fafc;
  display:flex;
  gap:4px;
  align-items:center;
  padding-left:8px
}

.dot{
  width:5px;
  height:5px;
  background:#cbd5e1;
  border-radius:50%
}

.navbar{
  height:28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 9px;
  border-bottom:1px solid #eef2f7
}

.logoFake{
  width:45px;
  height:6px;
  border-radius:5px
}

.links{
  width:60px;
  height:4px;
  background:#cbd5e1;
  border-radius:5px
}

.heroFake{
  height:65px;
  display:flex;
  justify-content:center;
  align-items:center
}

.titleFake{
  width:75px;
  height:8px;
  background:#172033;
  border-radius:5px
}

.boxes{
  display:flex;
  gap:5px;
  padding:8px
}

.box{
  height:28px;
  flex:1;
  border:1px solid #e2e8f0;
  border-radius:4px
}

.status{
  position:absolute;
  right:9px;
  top:9px;
  padding:5px 7px;
  border-radius:20px;
  font-size:8px;
  font-weight:900;
  z-index:2
}

.published{
  background:#dcfce7;
  color:#166534
}

.draft{
  background:#fef3c7;
  color:#92400e
}

.pending{
  background:#dbeafe;
  color:#1d4ed8
}

.rejected{
  background:#fee2e2;
  color:#991b1b
}

.info{padding:15px}

.name{
  font-size:14px;
  font-weight:900;
  margin-bottom:5px
}

.description{
  color:#64748b;
  font-size:9px;
  line-height:1.5;
  min-height:27px
}

.meta{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid #eef2f7;
  color:#64748b;
  font-size:9px
}

.cardActions{
  display:flex;
  gap:5px;
  margin-top:12px
}

.cardActions button{
  flex:1;
  border:0;
  border-radius:7px;
  padding:9px 5px;
  cursor:pointer;
  font-size:9px;
  font-weight:900
}

.edit{background:#eff6ff;color:#1d4ed8}
.previewBtn{background:#f1f5f9;color:#334155}
.delete{background:#fee2e2;color:#b91c1c}

.empty{
  display:none;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:60px 20px;
  text-align:center
}

.empty h2{font-size:18px;margin:10px 0 6px}
.empty p{font-size:10px;color:#64748b;margin-bottom:15px}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  .hero{align-items:start;flex-direction:column;gap:12px}
  .toolbar{flex-direction:column}
  select{width:100%}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">🎨 My Themes</div>

<div class="actions">
<a href="theme-upload.html" class="btn primary">
+ Upload Theme
</a>

<a href="theme-sale.html" class="btn gray">
Theme Marketplace
</a>
</div>

</div>
</header>


<main class="container">

<section class="hero">

<div>
<h1>My Themes</h1>
<p class="subtitle">
Manage your uploaded, published and draft themes.
</p>
</div>

<a href="theme-submission.html" class="btn primary">
Submit New Theme
</a>

</section>


<section class="stats">

<div class="stat">
<div class="label">TOTAL THEMES</div>
<div class="value" id="total">0</div>
</div>

<div class="stat">
<div class="label">PUBLISHED</div>
<div class="value" id="published">0</div>
</div>

<div class="stat">
<div class="label">DRAFTS</div>
<div class="value" id="drafts">0</div>
</div>

<div class="stat">
<div class="label">TOTAL SALES</div>
<div class="value" id="sales">0</div>
</div>

</section>


<section class="toolbar">

<div class="search">
<input
id="search"
placeholder="Search my themes...">
</div>

<select id="filter">
<option value="all">All Themes</option>
<option value="published">Published</option>
<option value="draft">Drafts</option>
<option value="pending">Pending</option>
<option value="rejected">Rejected</option>
</select>

<select id="sort">
<option value="newest">Newest</option>
<option value="oldest">Oldest</option>
<option value="name">Name</option>
<option value="sales">Sales</option>
</select>

</section>


<section
class="grid"
id="themes">
</section>


<section
class="empty"
id="empty">

<div style="font-size:42px">🎨</div>

<h2>No themes found</h2>

<p>
Upload your first theme to start building your theme library.
</p>

<a href="theme-upload.html" class="btn primary">
Upload Theme
</a>

</section>

</main>


<script>

const STORAGE_KEY="themeUploads";

let themes=JSON.parse(
localStorage.getItem(STORAGE_KEY)||"[]"
);


/* Demo themes only when there are no uploads */

if(themes.length===0){

themes=[
{
id:"demo1",
name:"Modern Business",
category:"Business",
description:"Clean professional business website theme.",
version:"1.0.0",
price:29,
status:"published",
sales:124,
color:"#2563eb",
createdAt:new Date().toISOString()
},
{
id:"demo2",
name:"Creative Portfolio",
category:"Portfolio",
description:"Modern portfolio theme for designers.",
version:"1.2.0",
price:24,
status:"draft",
sales:0,
color:"#7c3aed",
createdAt:new Date(Date.now()-86400000).toISOString()
}
];

}


/* RENDER */

function render(){

const container=document.getElementById("themes");

const query=document.getElementById("search")
.value.toLowerCase().trim();

const filter=document.getElementById("filter").value;

const sort=document.getElementById("sort").value;

let list=themes.filter(theme=>{

const text=(
(theme.name||"")+" "+
(theme.category||"")+" "+
(theme.description||"")
).toLowerCase();

const searchMatch=text.includes(query);

const status=(theme.status||"draft").toLowerCase();

const filterMatch=
filter==="all" ||
status===filter;

return searchMatch && filterMatch;

});


if(sort==="newest"){
list.sort((a,b)=>
new Date(b.createdAt||0)-
new Date(a.createdAt||0)
);
}

if(sort==="oldest"){
list.sort((a,b)=>
new Date(a.createdAt||0)-
new Date(b.createdAt||0)
);
}

if(sort==="name"){
list.sort((a,b)=>
(a.name||"").localeCompare(b.name||"")
);
}

if(sort==="sales"){
list.sort((a,b)=>
Number(b.sales||0)-Number(a.sales||0)
);
}


container.innerHTML="";


if(!list.length){

container.style.display="none";
document.getElementById("empty").style.display="block";

}else{

container.style.display="grid";
document.getElementById("empty").style.display="none";

list.forEach(theme=>{
container.appendChild(createCard(theme));
});

}

updateStats();

}


/* CARD */

function createCard(theme){

const card=document.createElement("article");

card.className="card";

const status=(theme.status||"draft").toLowerCase();

const statusClass=
["published","draft","pending","rejected"]
.includes(status)
?status:"draft";

const color=theme.color||"#2563eb";

const date=theme.createdAt
?new Date(theme.createdAt).toLocaleDateString()
:"—";


card.innerHTML=`

<div
class="preview"
style="background:${escapeHTML(color)}18">

<div class="status ${statusClass}">
${escapeHTML(
status.toUpperCase()
)}
</div>

<div class="browser">

<div class="top">
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>

<div class="navbar">

<div
class="logoFake"
style="background:${escapeHTML(color)}">
</div>

<div class="links"></div>

</div>

<div
class="heroFake"
style="background:${escapeHTML(color)}15">

<div class="titleFake"></div>

</div>

<div class="boxes">
<div class="box"></div>
<div class="box"></div>
<div class="box"></div>
</div>

</div>

</div>


<div class="info">

<div class="name">
${escapeHTML(theme.name||"Untitled Theme")}
</div>

<div class="description">
${escapeHTML(
theme.description||"No description"
)}
</div>

<div class="meta">

<span>
${escapeHTML(
theme.category||"Website"
)}
</span>

<span>
${format(theme.sales||0)} sales
</span>

</div>

<div class="meta">

<span>
v${escapeHTML(
theme.version||"1.0.0"
)}
</span>

<span>
${date}
</span>

</div>


<div class="cardActions">

<button
class="previewBtn"
onclick="previewTheme('${escapeJS(theme.id)}')">
Preview
</button>

<button
class="edit"
onclick="editTheme('${escapeJS(theme.id)}')">
Edit
</button>

<button
class="delete"
onclick="deleteTheme('${escapeJS(theme.id)}')">
Delete
</button>

</div>

</div>
`;

return card;

}


/* STATS */

function updateStats(){

const total=themes.length;

const published=themes.filter(
t=>(t.status||"").toLowerCase()==="published"
).length;

const drafts=themes.filter(
t=>(t.status||"").toLowerCase()==="draft"
).length;

const sales=themes.reduce(
(sum,t)=>sum+Number(t.sales||0),0
);

document.getElementById("total").textContent=
format(total);

document.getElementById("published").textContent=
format(published);

document.getElementById("drafts").textContent=
format(drafts);

document.getElementById("sales").textContent=
format(sales);

}


/* PREVIEW */

function previewTheme(id){

const theme=themes.find(t=>t.id===id);

if(!theme)return;

localStorage.setItem(
"selectedTheme",
JSON.stringify(theme)
);

window.location.href="theme-preview.html";

}


/* EDIT */

function editTheme(id){

const theme=themes.find(t=>t.id===id);

if(!theme)return;

localStorage.setItem(
"selectedTheme",
JSON.stringify(theme)
);

window.location.href="theme-editor.html";

}


/* DELETE */

function deleteTheme(id){

const theme=themes.find(t=>t.id===id);

if(!theme)return;

if(!confirm(
`Delete "${theme.name}"?`
))return;

themes=themes.filter(t=>t.id!==id);

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(themes)
);

render();

}


/* SEARCH */

document.getElementById("search")
.addEventListener("input",render);

document.getElementById("filter")
.addEventListener("change",render);

document.getElementById("sort")
.addEventListener("change",render);


/* HELPERS */

function format(value){
return Number(value).toLocaleString();
}

function escapeHTML(value){
return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function escapeJS(value){
return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");
}


/* START */

render();

</script>

</body>
</html>
