<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:#fff;
padding:30px 18px
}

.container{
max-width:1250px;
margin:auto;
padding:20px
}

header h1{
margin:0 0 8px;
font-size:30px
}

header p{
margin:0;
opacity:.9
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-bottom:20px
}

.stat{
background:#fff;
padding:18px;
border-radius:14px;
box-shadow:0 3px 14px #00000010
}

.stat small{
color:#64748b
}

.stat strong{
display:block;
font-size:26px;
margin-top:6px
}

.filters{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:10px;
margin-bottom:20px
}

input,select{
width:100%;
padding:13px;
border:1px solid #d1d5db;
border-radius:9px;
font-size:14px;
background:#fff
}

.section{
margin-bottom:28px
}

.section-title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:12px
}

.section-title h2{
margin:0
}

.country-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.country{
background:#fff;
padding:15px;
border-radius:12px;
cursor:pointer;
box-shadow:0 2px 10px #0000000d;
transition:.2s
}

.country:hover{
transform:translateY(-2px)
}

.country.active{
outline:2px solid #2563eb
}

.flag{
font-size:27px
}

.country-name{
font-weight:bold;
margin-top:7px
}

.continent-name{
font-size:12px;
color:#64748b;
margin-top:4px
}

.institutions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px
}

.card{
background:#fff;
padding:18px;
border-radius:14px;
box-shadow:0 3px 15px #00000010
}

.card-top{
display:flex;
align-items:center;
gap:12px
}

.logo{
width:55px;
height:55px;
border-radius:10px;
background:#eef2ff;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
flex-shrink:0
}

.card h3{
margin:0
}

.short{
color:#2563eb;
font-size:13px;
font-weight:bold;
margin-top:4px
}

.meta{
color:#64748b;
font-size:13px;
margin-top:10px
}

.description{
font-size:14px;
line-height:1.5;
color:#64748b
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#dcfce7;
color:#166534;
font-size:11px;
font-weight:bold
}

.exams{
display:flex;
flex-wrap:wrap;
gap:5px;
margin:12px 0
}

.exam{
padding:5px 8px;
background:#f1f5f9;
border-radius:6px;
font-size:11px
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:14px
}

.btn{
text-decoration:none;
padding:10px 13px;
border-radius:8px;
background:#2563eb;
color:#fff;
font-size:13px;
font-weight:bold
}

.btn.secondary{
background:#7c3aed
}

.btn.green{
background:#16a34a
}

.empty{
background:#fff;
padding:45px;
text-align:center;
border-radius:14px;
grid-column:1/-1;
color:#64748b
}

footer{
margin-top:40px;
background:#111827;
color:#fff;
padding:25px;
text-align:center;
font-size:13px
}

@media(max-width:1000px){
.country-grid{
grid-template-columns:repeat(3,1fr)
}

.institutions{
grid-template-columns:repeat(2,1fr)
}
}

@media(max-width:700px){
.stats{
grid-template-columns:1fr 1fr
}

.filters{
grid-template-columns:1fr
}

.country-grid{
grid-template-columns:repeat(2,1fr)
}
}

@media(max-width:500px){
.country-grid,
.institutions{
grid-template-columns:1fr
}

.stats{
grid-template-columns:1fr 1fr
}
}
</style>
</head>

const countryFilter=
document.getElementById("countryFilter");


/* =====================================================
   STATS
===================================================== */

document.getElementById("countryCount")
.textContent=countries.length;

document.getElementById("continentCount")
.textContent=
new Set(countries.map(x=>x[0])).size;

document.getElementById("institutionCount")
.textContent=institutions.length;

document.getElementById("linkCount")
.textContent=institutions.length*2;


/* =====================================================
   CONTINENTS
===================================================== */

const continentList=[
...new Set(
countries.map(x=>x[0])
)
];

continentList.forEach(item=>{

const option=
document.createElement("option");

option.value=item;
option.textContent=item;

continentFilter.appendChild(option);

});


/* =====================================================
   COUNTRY FILTER
===================================================== */

function updateCountryFilter(){

const selected=
continentFilter.value;

countryFilter.innerHTML=
`
<option value="">
🌎 All Countries
</option>
`;

countries
.filter(
x =>
!selected ||
x[0] === selected
)
.sort(
(a,b) =>
a[1].localeCompare(b[1])
)
.forEach(item => {

const option =
document.createElement("option");

option.value = item[1];

option.textContent =
`${item[2]} ${item[1]}`;

countryFilter.appendChild(option);

});

}


/* =====================================================
   RENDER COUNTRIES
===================================================== */

function renderCountries(){

const query =
search.value
.toLowerCase()
.trim();

const selectedContinent =
continentFilter.value;

const selectedCountry =
countryFilter.value;


const list =
countries.filter(item => {

const text =
`${item[1]} ${item[0]}`
.toLowerCase();

return (
(!query || text.includes(query)) &&
(!selectedContinent ||
 item[0] === selectedContinent) &&
(!selectedCountry ||
 item[1] === selectedCountry)
);

});


countriesBox.innerHTML = "";


if(!list.length){

countriesBox.innerHTML = `

<div class="empty">

<h3>🔎 No country found</h3>

<p>
Try another country, continent or search term.
</p>

</div>

`;

return;

}


list
.sort(
(a,b) =>
a[1].localeCompare(b[1])
)
.forEach(item => {

const div =
document.createElement("div");

div.className = "country";

div.innerHTML = `

<div class="flag">
${item[2]}
</div>

<div class="country-name">
${escapeHtml(item[1])}
</div>

<div class="continent-name">
🌍 ${escapeHtml(item[0])}
</div>

`;

div.addEventListener(
"click",
() => {

countryFilter.value =
item[1];

renderCountries();

renderInstitutions();

document
.querySelector(".section:nth-of-type(2)")
.scrollIntoView({
behavior:"smooth",
block:"start"
});

});

countriesBox.appendChild(div);

});


document.getElementById(
"countryInfo"
).textContent =
`${list.length} countries`;

}


/* =====================================================
   RENDER INSTITUTIONS
===================================================== */

function renderInstitutions(){

const query =
search.value
.toLowerCase()
.trim();

const selectedContinent =
continentFilter.value;

const selectedCountry =
countryFilter.value;


const list =
institutions.filter(item => {

const text = `
${item.country}
${item.continent}
${item.short}
${item.name}
${item.exams.join(" ")}
`.toLowerCase();

return (

(!query ||
text.includes(query))

&&

(!selectedContinent ||
item.continent === selectedContinent)

&&

(!selectedCountry ||
item.country === selectedCountry)

);

});


institutionsBox.innerHTML = "";


if(!list.length){

institutionsBox.innerHTML = `

<div class="empty">

<h3>🏛️ No institution found</h3>

<p>
There is currently no examination institution
listed for this selection.
</p>

</div>

`;

return;

}


list.forEach(item => {

const card =
document.createElement("article");

card.className = "card";


card.innerHTML = `

<div class="card-top">

<div class="logo">
${item.flag}
</div>

<div>

<h3>
${escapeHtml(item.short)}
</h3>

<div class="short">
${escapeHtml(item.name)}
</div>

</div>

</div>


<div class="meta">

🌍 ${escapeHtml(item.continent)}

<br>

📍 ${escapeHtml(item.country)}

</div>


<p class="description">

${escapeHtml(item.description)}

</p>


<span class="badge">

✓ Official Institution

</span>


<div class="exams">

${item.exams.map(
exam => `

<span class="exam">
${escapeHtml(exam)}
</span>

`
).join("")}

</div>


<div class="actions">

<a
class="btn"
href="${item.results}"
target="_blank"
rel="noopener noreferrer"
>
📊 Results
</a>


<a
class="btn secondary"
href="${item.website}"
target="_blank"
rel="noopener noreferrer"
>
🌐 Official Website
</a>

</div>

`;

institutionsBox.appendChild(card);

});

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value || "")

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   EVENTS
===================================================== */

search.addEventListener(
"input",
() => {

renderCountries();

renderInstitutions();

}
);


continentFilter.addEventListener(
"change",
() => {

updateCountryFilter();

renderCountries();

renderInstitutions();

}
);


countryFilter.addEventListener(
"change",
() => {

renderCountries();

renderInstitutions();

}
);


/* =====================================================
   INITIALIZE
===================================================== */

document.getElementById(
"year"
).textContent =
new Date().getFullYear();


updateCountryFilter();

renderCountries();

renderInstitutions();

</script>

</body>
</html>
