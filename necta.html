<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NECTA | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.logo{
  color:#155eef;
  font-size:20px;
  font-weight:900;
}

.home{
  border:0;
  background:#155eef;
  color:#fff;
  padding:10px 16px;
  border-radius:22px;
  cursor:pointer;
  font-weight:700;
}

.frame{
  width:100%;
  height:calc(100vh - 64px);
  border:0;
  display:block;
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    LetsStudy Pro
  </div>

  <button
    class="home"
    onclick="location.href='index.html'">
    ← Home
  </button>

</header>

<iframe
  class="frame"
  src="https://www.necta.go.tz/"
  title="NECTA"
  loading="eager">
</iframe>

</body>
</html>
