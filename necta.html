<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NECTA | LetsStudy Pro</title>

<meta name="description"
content="Access NECTA examinations, results, past papers and official education resources through LetsStudy Pro.">

<link rel="icon"
href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgQHmJO8e8twONhRhp3I6pP4NFDh-LPcqVtAmQ9R9XjOGaVMKShfSLmxeK0fVzJsybBBOXKbA8LIhjgTgko83C-UPVhwgXeLtvTfjtVv6aVGgQgniOF-gMC28bY78HryXZ-5OqCwdBpKGqjEfTta5jLjT1mpvtBi2DQKyu35rkxsZNoVvl0nhvxUUn1gDP0/s1600/Untitled%20design_20260717_144337_0000.jpg">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
box-sizing:border-box;
}

html,
body{
margin:0;
width:100%;
height:100%;
font-family:Inter,Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

.top{
height:64px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5%;
position:relative;
z-index:10;
}

.logo{
display:flex;
align-items:center;
gap:10px;
color:#155eef;
font-size:21px;
font-weight:900;
text-decoration:none;
}

.logo-icon{
width:36px;
height:36px;
border-radius:10px;
background:#155eef;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.actions{
display:flex;
gap:8px;
}

.btn{
display:inline-flex;
align-items:center;
gap:7px;
border:1px solid #d0d5dd;
background:#fff;
color:#344054;
padding:9px 12px;
border-radius:8px;
font-size:11px;
font-weight:800;
text-decoration:none;
}

.btn:hover{
border-color:#155eef;
color:#155eef;
}

.main{
height:calc(100vh - 64px);
padding:14px;
}

.card{
width:100%;
height:100%;
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
overflow:hidden;
box-shadow:0 5px 25px rgba(16,24,40,.06);
position:relative;
}

.loading{
position:absolute;
inset:0;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:2;
color:#667085;
font-size:13px;
}

.loading i{
font-size:28px;
color:#155eef;
margin-bottom:12px;
}

.loading strong{
color:#172033;
font-size:15px;
margin-bottom:5px;
}

.frame{
width:100%;
height:100%;
border:0;
display:block;
}

.fallback{
display:none;
position:absolute;
inset:0;
background:#fff;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
z-index:3;
}

.fallback-box{
max-width:450px;
}

.icon{
width:64px;
height:64px;
border-radius:50%;
background:#eef4ff;
color:#155eef;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 15px;
font-size:25px;
}

.fallback h2{
margin:0 0 8px;
font-size:22px;
}

.fallback p{
color:#667085;
font-size:13px;
line-height:1.7;
}

.open{
display:inline-flex;
align-items:center;
gap:8px;
background:#155eef;
color:#fff;
padding:12px 18px;
border-radius:9px;
font-size:12px;
font-weight:800;
text-decoration:none;
margin-top:8px;
}

.open:hover{
background:#073bba;
}

@media(max-width:600px){

.top{
height:58px;
padding:0 14px;
}

.logo{
font-size:17px;
}

.logo-icon{
width:32px;
height:32px;
}

.actions .btn span{
display:none;
}

.main{
height:calc(100vh - 58px);
padding:7px;
}

.card{
border-radius:10px;
}

}

</style>
</head>

<body>

<header class="top">

<a href="index.html" class="logo">

<div class="logo-icon">
<i class="fa fa-graduation-cap"></i>
</div>

LetsStudy Pro

</a>

<div class="actions">

<a href="index.html" class="btn">
<i class="fa fa-house"></i>
<span>Home</span>
</a>

<a
href="https://www.necta.go.tz/"
target="_blank"
rel="noopener"
class="btn">

<i class="fa fa-up-right-from-square"></i>
<span>Open NECTA</span>

</a>

</div>

</header>


<main class="main">

<section class="card">

<div id="loading" class="loading">

<i class="fa fa-spinner fa-spin"></i>

<strong>
Loading NECTA
</strong>

<span>
Please wait...
</span>

</div>


<iframe
id="nectaFrame"
class="frame"
src="https://www.necta.go.tz/"
title="NECTA Official Website"
loading="eager"
allowfullscreen>
</iframe>


<div id="fallback" class="fallback">

<div class="fallback-box">

<div class="icon">
<i class="fa fa-graduation-cap"></i>
</div>

<h2>
NECTA
</h2>

<p>
The official NECTA website does not allow
embedded display in this page. Open it directly
to access examinations, results and official resources.
</p>

<a
href="https://www.necta.go.tz/"
target="_blank"
rel="noopener"
class="open">

<i class="fa fa-up-right-from-square"></i>

Open NECTA

</a>

</div>

</div>

</section>

</main>


<script>

const frame=
document.getElementById("nectaFrame");

const loading=
document.getElementById("loading");

const fallback=
document.getElementById("fallback");

frame.addEventListener(
"load",
()=>{

loading.style.display="none";

});

setTimeout(()=>{

loading.style.display="none";

},8000);

</script>

</body>
</html>
