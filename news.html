<body>

<header class="top">

<div class="logo">
LetsStudy Pro
</div>

<nav class="nav">

<a href="index.html">Home</a>

</header>


<main class="container">

<section class="hero">

<h1>
<i class="fa fa-newspaper"></i>
World News
</h1>

<p>
Stay informed with the latest international news,
education, technology, business and world events.
</p>

<div class="categories">

<button class="category"
onclick="loadNews('https://feeds.bbci.co.uk/news/rss.xml')">
World
</button>

<button class="category"
onclick="loadNews('https://feeds.bbci.co.uk/news/technology/rss.xml')">
Technology
</button>

<button class="category"
onclick="loadNews('https://feeds.bbci.co.uk/news/business/rss.xml')">
Business
</button>

<button class="category"
onclick="loadNews('https://feeds.bbci.co.uk/news/science_and_environment/rss.xml')">
Science
</button>

</div>

</section>


<div class="news-layout">


<section class="card">

<div class="card-header">

<h2>
Latest Stories
</h2>

<button
class="refresh"
onclick="loadNews(currentFeed)">

<i class="fa fa-rotate"></i>
Refresh

</button>

</div>


<div id="newsList"
class="news-list">

<div class="loading">

<i class="fa fa-spinner fa-spin fa-2x"></i>

<p>
Loading latest news...
</p>

</div>

</div>

</section>


<aside class="card">

<div class="card-header">

<h2>
Top Stories
</h2>

</div>

<div id="topStories"
class="side">

<div class="loading">
Loading...
</div>

</div>

</aside>

</div>

</main>


<script>

let currentFeed=
"https://feeds.bbci.co.uk/news/rss.xml";


/*
  RSS → XML
  No API key
*/

async function loadNews(feed){

currentFeed=feed;


const list=
document.getElementById("newsList");


const top=
document.getElementById("topStories");


list.innerHTML=`
<div class="loading">
<i class="fa fa-spinner fa-spin"></i>
<p>Loading latest news...</p>
</div>
`;

try{

/*
 RSS feeds may not allow direct browser
 requests because of CORS.

 We use Google's public RSS-to-XML
 translation endpoint.
*/

const url=
"https://api.allorigins.win/raw?url="+
encodeURIComponent(feed);


const response=
await fetch(url);


if(!response.ok)
throw new Error(
"Unable to load news."
);


const xmlText=
await response.text();


const parser=
new DOMParser();


const xml=
parser.parseFromString(
xmlText,
"text/xml"
);


const items=
Array.from(
xml.querySelectorAll("item")
);


if(!items.length){

throw new Error(
"No news stories available."
);

}


const stories=
items.slice(0,20);


list.innerHTML=
stories
.map(createNews)
.join("");


top.innerHTML=
stories
.slice(0,7)
.map(
item=>{

const title=
getText(item,"title");

const link=
getText(item,"link");

return`

<div class="side-item">

<a
href="${escapeAttr(link)}"
target="_blank"
rel="noopener">

${escapeHTML(title)}

</a>

</div>

`;

}
)
.join("");


}catch(error){

console.error(error);


list.innerHTML=`

<div class="error">

<i class="fa fa-circle-exclamation"></i>

<strong>
News could not be loaded.
</strong>

<br><br>

${escapeHTML(error.message)}

</div>

`;


top.innerHTML=`
<div class="error">
News unavailable.
</div>
`;

}

}


function createNews(item){

const title=
getText(item,"title");

const description=
getText(item,"description");

const link=
getText(item,"link");

const date=
getText(item,"pubDate");


return`

<article class="news">

<h3>

<a
href="${escapeAttr(link)}"
target="_blank"
rel="noopener">

${escapeHTML(title)}

</a>

</h3>

<p>
${escapeHTML(
cleanDescription(description)
)}
</p>

<div class="date">

<i class="fa fa-clock"></i>

${escapeHTML(
formatDate(date)
)}

</div>

</article>

`;

}


function getText(
item,
tag
){

const element=
item.querySelector(tag);

return element
?
element.textContent.trim()
:"";

}


function cleanDescription(
text
){

return text
.replace(/<[^>]*>/g,"")
.replace(/\s+/g," ")
.trim()
.slice(0,220);

}


function formatDate(date){

if(!date)
return "Latest";

const d=
new Date(date);

if(isNaN(d))
return date;

return d.toLocaleString(
"en-US",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}


function escapeHTML(
value
){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(
value
){

return escapeHTML(value);

}


/*
 Start
*/

loadNews(currentFeed);

</script>
