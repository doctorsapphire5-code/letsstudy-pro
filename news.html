<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#f6f8fb;
}

.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:relative;
  z-index:10;
}

.logo{
  color:#155eef;
  font-size:20px;
  font-weight:900;
}

.home{
  border:0;
  background:#155eef;
  color:#fff;
  padding:10px 16px;
  border-radius:22px;
  cursor:pointer;
  font-weight:700;
}

.home:hover{
  opacity:.9;
}

.news-frame{
  width:100%;
  height:calc(100vh - 64px);
  border:0;
  display:block;
  background:#fff;
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    LetsStudy Pro News
  </div>

  <button
    class="home"
    onclick="location.href='index.html'">
    ← Home
  </button>

</header>

<iframe
  class="news-frame"
  src="https://www.bbc.com/news"
  title="BBC News"
  loading="eager"
  allow="fullscreen">
</iframe>
