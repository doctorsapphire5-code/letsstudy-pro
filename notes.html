body{

.logo-icon{

}

.nav-links a{

  font-weight:600;
}

.menu-btn{

  border:0;

main{

.hero{

.filters{
  background:#fff;

  padding:17px;

  2fr
  1fr
  1fr

}

.filters input,

  width:100%;

  padding:11px;

  outline:none;

  background:#fff;

}

.filters input:focus,
.filters select:focus{
  border-color:#2563eb;
}

.stats{
  display:flex;
  gap:10px;

  margin-bottom:18px;
}

.stat{

  border-radius:10px;

  padding:10px 14px;

  color:#64748b;
}

.stat strong{
  color:#0f172a;
  margin-right:4px;
}

.grid{
  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:15px;
}

.note-card{
  background:#fff;

  border:1px solid #e2e8f0;

  border-radius:15px;

  padding:17px;

  transition:.2s;
}

.note-card:hover{
  transform:translateY(-2px);

  box-shadow:
  0 10px 25px
  rgba(15,23,42,.07);
}

.note-icon{
  width:45px;
  height:45px;

  border-radius:11px;

  background:#eff6ff;
  color:#2563eb;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;

  margin-bottom:13px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;

  margin-bottom:10px;
}

.badge{
  background:#f1f5f9;
  color:#475569;

  padding:5px 7px;

  border-radius:6px;

  font-size:7px;
  font-weight:800;
}

.note-title{
  font-size:14px;

  line-height:1.4;

  margin-bottom:7px;
}

.note-description{
  color:#64748b;

  font-size:9px;

  line-height:1.6;

  min-height:43px;

  margin-bottom:13px;
}

.note-meta{
  color:#94a3b8;

  font-size:8px;

  margin-bottom:13px;
}

.download{
  display:block;

  text-align:center;

  padding:10px;

  border-radius:8px;

  background:#2563eb;

  color:#fff;

  font-size:9px;
  font-weight:800;
}

.download:hover{
  background:#1d4ed8;
}

.empty{
  grid-column:1/-1;

  background:#fff;

  border:1px solid #e2e8f0;

  border-radius:15px;

  padding:55px 20px;

  text-align:center;

  color:#94a3b8;

  font-size:10px;
}

.loading{
  grid-column:1/-1;

  text-align:center;

  padding:60px;

  color:#64748b;

  font-size:10px;
}

footer{
  text-align:center;

  padding:30px;

  color:#94a3b8;

  font-size:9px;
}

@media(max-width:850px){

  .grid{
    grid-template-columns:
    repeat(2,1fr);
  }

  .filters{
    grid-template-columns:
    1fr 1fr;
  }

}

@media(max-width:650px){

  .nav-links{
    display:none;
  }

  .menu-btn{
    display:block;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .stats{
    flex-wrap:wrap;
  }

  .hero h1{
    font-size:23px;
  }

}

</style>

</head>

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getDatabase,
  ref,
  get,
  update
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(
  firebaseConfig
);

const db =
getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const notesContainer =
document.getElementById(
  "notes"
);

const searchInput =
document.getElementById(
  "search"
);

const levelFilter =
document.getElementById(
  "level"
);

const subjectFilter =
document.getElementById(
  "subject"
);

const yearFilter =
document.getElementById(
  "year"
);

const totalNotes =
document.getElementById(
  "totalNotes"
);

const visibleNotes =
document.getElementById(
  "visibleNotes"
);


let allNotes = [];


/* =========================
   LOAD NOTES
========================= */

async function loadNotes(){

  try{

    const snapshot =
    await get(
      ref(
        db,
        "notes"
      )
    );


    if(
      !snapshot.exists()
    ){

      allNotes = [];

      renderNotes([]);

      return;

    }


    const data =
    snapshot.val();


    allNotes =
    Object.entries(
      data
    )
    .map(
      ([id,note]) => ({

        id,

        ...note

      })
    )
    .sort(
      (a,b) =>
      Number(
        b.year || 0
      ) -
      Number(
        a.year || 0
      )
    );


    totalNotes.textContent =
    allNotes.length;


    renderNotes(
      allNotes
    );


  }catch(error){

    console.error(
      "Notes error:",
      error
    );


    notesContainer.innerHTML = `

      <div class="empty">

        Unable to load notes.
        Please try again.

      </div>

    `;

  }

}


/* =========================
   RENDER NOTES
========================= */

function renderNotes(
notes
){

  notesContainer.innerHTML =
  "";


  visibleNotes.textContent =
  notes.length;


  if(
    notes.length === 0
  ){

    notesContainer.innerHTML = `

      <div class="empty">

        <div style="font-size:30px;margin-bottom:10px;">
          📚
        </div>

        No notes found.

      </div>

    `;

    return;

  }


  notes.forEach(
    note => {

      const card =
      document.createElement(
        "article"
      );


      card.className =
      "note-card";


      const title =
      note.title ||
      note.name ||
      "Study Notes";


      const level =
      note.level ||
      note.form ||
      "All Levels";


      const subject =
      note.subject ||
      "General";


      const year =
      note.year ||
      "N/A";


      const description =
      note.description ||
      "Study notes and revision material from LetsStudy Pro.";


      const downloads =
      Number(
        note.downloads ||
        0
      );


      card.innerHTML = `

        <div class="note-icon">
          📘
        </div>


        <div class="badges">

          <span class="badge">
            ${escapeHTML(level)}
          </span>

          <span class="badge">
            ${escapeHTML(subject)}
          </span>

          <span class="badge">
            ${escapeHTML(String(year))}
          </span>

        </div>


        <h2 class="note-title">

          ${escapeHTML(title)}

        </h2>


        <p class="note-description">

          ${escapeHTML(description)}

        </p>


        <div class="note-meta">

          Downloads:
          ${downloads}

        </div>


        <a
          class="download"
          href="/download.html?id=${encodeURIComponent(note.id)}"
          data-id="${escapeHTML(note.id)}">

          ⬇ Download PDF

        </a>

      `;


      notesContainer.appendChild(
        card
      );

    }
  );


  document
  .querySelectorAll(
    ".download"
  )
  .forEach(
    link => {

      link.addEventListener(
        "click",
        () => {

          incrementDownload(
            link.dataset.id
          );

        }
      );

    }
  );

}


/* =========================
   FILTER
========================= */

function filterNotes(){

  const search =
  searchInput.value
  .toLowerCase()
  .trim();


  const level =
  levelFilter.value
  .toLowerCase();


  const subject =
  subjectFilter.value
  .toLowerCase();


  const year =
  yearFilter.value;


  const filtered =
  allNotes.filter(
    note => {

      const searchable = (

        String(
          note.title ||
          ""
        ) +

        " " +

        String(
          note.subject ||
          ""
        ) +

        " " +

        String(
          note.level ||
          note.form ||
          ""
        ) +

        " " +

        String(
          note.year ||
          ""
        ) +

        " " +

        String(
          note.description ||
          ""
        )

      ).toLowerCase();


      const noteLevel =
      String(
        note.level ||
        note.form ||
        ""
      ).toLowerCase();


      const noteSubject =
      String(
        note.subject ||
        ""
      ).toLowerCase();


      const noteYear =
      String(
        note.year ||
        ""
      );


      return (

        (!search ||
        searchable.includes(
          search
        ))

        &&

        (!level ||
        noteLevel === level)

        &&

        (!subject ||
        noteSubject === subject)

        &&

        (!year ||
        noteYear === year)

      );

    }
  );


  renderNotes(
    filtered
  );

}


/* =========================
   DOWNLOAD COUNTER
========================= */

async function incrementDownload(
id
){

  try{

    const note =
    allNotes.find(
      item =>
      item.id === id
    );


    if(!note){
      return;
    }


    const current =
    Number(
      note.downloads ||
      0
    );


    note.downloads =
    current + 1;


    await update(
      ref(
        db,
        "notes/" +
        id
      ),
      {
        downloads:
        current + 1
      }
    );


  }catch(error){

    console.error(
      "Download counter error:",
      error
    );

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   FILTER EVENTS
========================= */

searchInput.addEventListener(
  "input",
  filterNotes
);

levelFilter.addEventListener(
  "change",
  filterNotes
);

subjectFilter.addEventListener(
  "change",
  filterNotes
);

yearFilter.addEventListener(
  "change",
  filterNotes
);


/* =========================
   MOBILE MENU
========================= */

document
.getElementById(
"menuBtn"
)
.addEventListener(
"click",
function(){

  document
  .querySelector(
    ".nav-links"
  )
  .classList.toggle(
    "active"
  );

});


/* =========================
   START
========================= */

loadNotes();

</script>

</body>
