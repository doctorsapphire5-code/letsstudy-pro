<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Notes | LetsStudy Pro</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a;
}

a{
text-decoration:none;
}

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:14px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb;
}

nav{
display:flex;
gap:7px;
flex-wrap:wrap;
}

nav a{
font-size:9px;
font-weight:900;
color:#334155;
background:#f1f5f9;
padding:8px 10px;
border-radius:8px;
}

.container{
max-width:1050px;
margin:auto;
padding:22px 15px;
}

.hero{
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:#fff;
border-radius:20px;
padding:25px;
margin-bottom:16px;
}

.hero small{
font-size:9px;
font-weight:900;
}

.hero h1{
font-size:27px;
margin:8px 0;
}

.hero p{
font-size:11px;
line-height:1.7;
opacity:.9;
}

.toolbar{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:13px;
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:15px;
}

input,
select{
padding:10px;
border:1px solid #cbd5e1;
border-radius:9px;
font-size:10px;
outline:none;
}

input{
flex:1;
min-width:180px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:16px;
overflow:hidden;
}

.cover{
height:120px;
background:linear-gradient(135deg,#dbeafe,#ede9fe);
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
background-size:cover;
background-position:center;
}

.content{
padding:15px;
}

.tag{
font-size:8px;
font-weight:900;
color:#2563eb;
margin-bottom:7px;
}

.title{
font-size:14px;
font-weight:900;
line-height:1.4;
margin-bottom:7px;
}

.description{
font-size:10px;
line-height:1.6;
color:#64748b;
}

.meta{
font-size:8px;
color:#94a3b8;
margin-top:8px;
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:12px;
}

.btn{
border:0;
padding:9px 11px;
border-radius:8px;
font-size:8px;
font-weight:900;
cursor:pointer;
display:inline-flex;
align-items:center;
justify-content:center;
}

.primary{
background:#2563eb;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.saved{
background:#fef3c7;
color:#92400e;
}

.empty{
grid-column:1/-1;
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:45px 20px;
text-align:center;
font-size:11px;
color:#64748b;
}

.loading{
grid-column:1/-1;
padding:65px;
text-align:center;
font-size:12px;
color:#64748b;
}

.message{
display:none;
padding:10px;
border-radius:9px;
font-size:10px;
font-weight:900;
margin-bottom:12px;
}

.success{
background:#dcfce7;
color:#166534;
}

.error{
background:#fee2e2;
color:#991b1b;
}

footer{
text-align:center;
padding:30px;
font-size:10px;
color:#64748b;
}

@media(max-width:800px){
.grid{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:550px){

header{
flex-direction:column;
align-items:flex-start;
}

nav{
width:100%;
}

nav a{
flex:1;
text-align:center;
}

.grid{
grid-template-columns:1fr;
}

.hero h1{
font-size:23px;
}

}
</style>
</head>


<body>

<header>

<a href="dashboard.html" class="logo">
LetsStudy Pro
</a>

<nav>

<a href="resources.html">
Resources
</a>

<a href="notes-papers.html">
Notes & Papers
</a>

<a href="bookmarks.html">
Bookmarks
</a>

<a href="dashboard.html">
Dashboard
</a>

</nav>

</header>


<main class="container">

<section class="hero">

<small>
STUDY MATERIALS
</small>

<h1>
Notes Library
</h1>

<p>
Find subject notes and study materials designed to help you learn faster.
</p>

</section>


<div id="message" class="message"></div>


<section class="toolbar">

<input
id="search"
type="search"
placeholder="Search notes...">

<select id="subject">

<option value="all">
All Subjects
</option>

<option value="mathematics">
Mathematics
</option>

<option value="physics">
Physics
</option>

<option value="chemistry">
Chemistry
</option>

<option value="biology">
Biology
</option>

<option value="geography">
Geography
</option>

<option value="english">
English
</option>

<option value="kiswahili">
Kiswahili
</option>

</select>


<select id="level">

<option value="all">
All Levels
</option>

<option value="o-level">
O-Level
</option>

<option value="a-level">
A-Level
</option>

<option value="university">
University
</option>

</select>

</section>


<section
id="notesGrid"
class="grid">

<div class="loading">
Loading notes...
</div>

</section>

</main>


<footer>

© <span id="year"></span> LetsStudy Pro

</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
setDoc,
deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const grid=
document.getElementById("notesGrid");

const search=
document.getElementById("search");

const subject=
document.getElementById("subject");

const level=
document.getElementById("level");

const message=
document.getElementById("message");


let user=null;
let notes=[];
let bookmarks=new Set();


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
auth,
async currentUser=>{

if(!currentUser){

location.href=
"login.html?redirect="+
encodeURIComponent("notes.html");

return;

}

user=currentUser;

await loadNotes();

await loadBookmarks();

render();

}
);


/* =========================================
LOAD NOTES
========================================= */

async function loadNotes(){

try{

/*
Notes are stored in:

resources

with:

category = notes
or
type = notes
*/

const snap=
await getDocs(
collection(db,"resources")
);

notes=
snap.docs
.map(
d=>({
id:d.id,
...d.data()
})
)
.filter(
item=>{

const category=
String(
item.category||""
).toLowerCase();

const type=
String(
item.type||""
).toLowerCase();

return(
category==="notes"||
type==="notes"||
item.isNote===true
);

}
);

}catch(error){

console.error(error);

grid.innerHTML=`

<div class="empty">
Unable to load notes.
</div>

`;

}

}


/* =========================================
LOAD BOOKMARKS
========================================= */

async function loadBookmarks(){

try{

const snap=
await getDocs(
collection(
db,
"users",
user.uid,
"bookmarks"
)
);

bookmarks=
new Set(
snap.docs.map(
d=>d.id
)
);

}catch(error){

console.warn(error);

}

}


/* =========================================
RENDER
========================================= */

function render(){

const keyword=
search.value
.trim()
.toLowerCase();

const selectedSubject=
subject.value;

const selectedLevel=
level.value;


const filtered=
notes.filter(
note=>{

const title=
String(
note.title||""
).toLowerCase();

const description=
String(
note.description||""
).toLowerCase();

const noteSubject=
String(
note.subject||
""
).toLowerCase();

const noteLevel=
String(
note.level||
""
).toLowerCase();

const matchesSearch=
!keyword||
title.includes(keyword)||
description.includes(keyword)||
noteSubject.includes(keyword);

const matchesSubject=
selectedSubject==="all"||
noteSubject===selectedSubject;

const matchesLevel=
selectedLevel==="all"||
noteLevel===selectedLevel;

return(
matchesSearch&&
matchesSubject&&
matchesLevel
);

}
);


grid.innerHTML="";


if(!filtered.length){

grid.innerHTML=`

<div class="empty">

📚<br><br>

No notes found.

<br><br>

<a
href="resources.html"
class="btn primary">

Browse All Resources

</a>

</div>

`;

return;

}


filtered.forEach(
note=>{

const card=
document.createElement("article");

card.className="card";


const title=
escapeHTML(
note.title||
"Study Notes"
);

const description=
escapeHTML(
note.description||
"Study notes from LetsStudy Pro."
);

const noteSubject=
escapeHTML(
note.subject||
"General"
);

const noteLevel=
escapeHTML(
note.level||
"All Levels"
);

const image=
note.image||
note.thumbnail||
"";

const details=
"resources-details.html?id="+
encodeURIComponent(note.id);

const download=
"download.html?id="+
encodeURIComponent(note.id);

const saved=
bookmarks.has(note.id);


card.innerHTML=`

<div
class="cover"
${
image
?
`style="background-image:url('${escapeAttribute(image)}')"`
:
""
}>

${image?"":"📝"}

</div>


<div class="content">

<div class="tag">
${noteSubject}
</div>

<div class="title">
${title}
</div>

<div class="description">

${description.substring(0,120)}
${description.length>120?"...":""}

</div>

<div class="meta">
${noteLevel} • Notes
</div>


<div class="actions">

<a
href="${details}"
class="btn primary">

View

</a>

<a
href="${download}"
class="btn secondary">

Download

</a>

<button
class="btn ${saved?"saved":"secondary"}"
data-bookmark="${note.id}">

${saved?"★ Saved":"☆ Bookmark"}

</button>

</div>

</div>

`;


grid.appendChild(card);

}
);


/* =========================================
BOOKMARK EVENTS
========================================= */

document
.querySelectorAll(
"[data-bookmark]"
)
.forEach(
button=>{

button.addEventListener(
"click",
()=>toggleBookmark(
button.dataset.bookmark
)
);

}
);

}


/* =========================================
TOGGLE BOOKMARK
========================================= */

async function toggleBookmark(id){

try{

const ref=
doc(
db,
"users",
user.uid,
"bookmarks",
id
);

if(bookmarks.has(id)){

await deleteDoc(ref);

bookmarks.delete(id);

showMessage(
"Removed from bookmarks.",
"success"
);

}else{

const note=
notes.find(
item=>item.id===id
);

await setDoc(
ref,
{

resourceId:id,

title:
note?.title||
"Study Notes",

createdAt:
new Date()

}
);

bookmarks.add(id);

showMessage(
"Note saved to bookmarks ✓",
"success"
);

}

render();

}catch(error){

console.error(error);

showMessage(
"Unable to update bookmark.",
"error"
);

}

}


/* =========================================
FILTERS
========================================= */

search.addEventListener(
"input",
render
);

subject.addEventListener(
"change",
render
);

level.addEventListener(
"change",
render
);


/* =========================================
MESSAGE
========================================= */

function showMessage(text,type){

message.textContent=text;

message.className=
"message "+
type;

message.style.display="block";

setTimeout(
()=>{
message.style.display="none";
},
2500
);

}


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function escapeAttribute(value){

return String(value)
.replaceAll("'","%27")
.replaceAll('"',"%22");

}


/* =========================================
YEAR
========================================= */

document.getElementById("year")
.textContent=
new Date().getFullYear();

</script>

</body>
</html>
