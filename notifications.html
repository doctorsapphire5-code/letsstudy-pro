<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notifications | LetsStudy Pro</title><style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
gap:12px;
padding:0 16px;
position:sticky;
top:0;
z-index:20;
}

.logo{
font-size:16px;
font-weight:900;
color:#2563eb;
}

.title{
flex:1;
font-size:16px;
font-weight:700;
}

.header-btn{
border:0;
background:#eff6ff;
color:#2563eb;
padding:9px 11px;
border-radius:9px;
cursor:pointer;
}

main{
max-width:850px;
margin:auto;
padding:16px;
}

.hero{
background:linear-gradient(135deg,#172554,#2563eb);
color:#fff;
padding:22px;
border-radius:18px;
margin-bottom:15px;
}

.hero h1{
margin:0 0 6px;
font-size:23px;
}

.hero p{
margin:0;
font-size:11px;
color:#dbeafe;
}

.actions{
display:flex;
gap:8px;
margin:15px 0;
}

.action{
border:1px solid #e5e7eb;
background:#fff;
color:#2563eb;
padding:9px 12px;
border-radius:9px;
font-size:10px;
cursor:pointer;
}

.search{
background:#fff;
border:1px solid #e5e7eb;
border-radius:11px;
padding:9px;
margin-bottom:10px;
}

.search input{
width:100%;
border:0;
outline:0;
padding:10px;
font-size:11px;
}

.filters{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:13px;
}

.filter{
white-space:nowrap;
border:1px solid #e5e7eb;
background:#fff;
padding:8px 13px;
border-radius:20px;
font-size:10px;
cursor:pointer;
}

.filter.active{
background:#2563eb;
color:#fff;
border-color:#2563eb;
}

.notification{
background:#fff;
border:1px solid #e5e7eb;
border-radius:13px;
padding:14px;
display:flex;
gap:12px;
margin-bottom:9px;
transition:.2s;
}

.notification.unread{
background:#eff6ff;
border-color:#bfdbfe;
}

.icon{
width:42px;
height:42px;
border-radius:11px;
background:#dbeafe;
display:flex;
align-items:center;
justify-content:center;
font-size:19px;
flex-shrink:0;
}

.content{
flex:1;
min-width:0;
}

.top{
display:flex;
gap:8px;
align-items:center;
}

.notification-title{
font-size:12px;
font-weight:800;
flex:1;
}

.time{
font-size:8px;
color:#94a3b8;
white-space:nowrap;
}

.text{
font-size:10px;
line-height:1.5;
color:#64748b;
margin-top:5px;
}

.notification.unread .text{
color:#475569;
}

.notification-actions{
display:flex;
gap:5px;
margin-top:8px;
}

.small{
border:0;
background:#f1f5f9;
color:#475569;
padding:6px 8px;
border-radius:6px;
font-size:8px;
cursor:pointer;
}

.delete{
color:#dc2626;
}

.empty{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:50px 20px;
text-align:center;
color:#64748b;
font-size:12px;
}

.count{
font-size:10px;
color:#64748b;
margin:10px 0;
}
</style></head><body><header><div class="logo">
LETSSTUDY PRO
</div><div class="title">
Notifications
</div><button
class="header-btn"
onclick="location.href='dashboard.html'">
🏠
</button>

<button
class="header-btn"
onclick="location.href='account-notifications.html'">
⚙️
</button>

</header><main><section class="hero"><h1>
Notifications 🔔
</h1><p>
Stay updated with your courses, community, payments and account.
</p></section><div class="actions"><button
class="action"
onclick="markAllRead()">
✓ Mark all as read
</button>

<button
class="action"
onclick="loadNotifications()">
↻ Refresh
</button>

</div><div class="search"><input
id="search"
type="search"
placeholder="Search notifications..."
oninput="render()">

</div><div class="filters"><button
class="filter active"
onclick="setFilter(this,'all')">
All
</button>

<button
class="filter"
onclick="setFilter(this,'unread')">
Unread
</button>

<button
class="filter"
onclick="setFilter(this,'read')">
Read
</button>

</div><div
id="count"
class="count">
Loading...
</div><section id="notifications"><div class="empty">
🔔 Loading notifications...
</div></section></main><script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
query,
where,
getDocs,
doc,
updateDoc,
deleteDoc,
writeBatch
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

let currentUser=null;
let notifications=[];
let selectedFilter="all";


onAuthStateChanged(auth,user=>{

if(!user){

location.href="login.html";
return;

}

currentUser=user;

loadNotifications();

});


window.loadNotifications=
async function(){

try{

const q=query(
collection(db,"notifications"),
where("userId","==",currentUser.uid)
);

const snap=
await getDocs(q);

notifications=
snap.docs.map(item=>({

id:item.id,
...item.data()

}));


/*
Newest first.
*/

notifications.sort(
(a,b)=>
getTime(b.createdAt)-
getTime(a.createdAt)
);

render();

}catch(error){

console.error(error);

document.getElementById(
"notifications"
).innerHTML=`

<div class="empty">

⚠️ Unable to load notifications.

<br><br>

${escapeHTML(error.message)}

</div>

`;

}

};


window.setFilter=
function(button,filter){

selectedFilter=filter;

document
.querySelectorAll(".filter")
.forEach(item=>
item.classList.remove("active")
);

button.classList.add("active");

render();

};


window.render=function(){

const container=
document.getElementById(
"notifications"
);

const search=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();


const filtered=
notifications.filter(item=>{

const title=
String(
item.title||
item.subject||
"Notification"
).toLowerCase();

const message=
String(
item.message||
item.text||
""
).toLowerCase();

const isRead=
item.read===true;


const matchesSearch=
!search||
title.includes(search)||
message.includes(search);

const matchesFilter=
selectedFilter==="all"||
(
selectedFilter==="read"&&
isRead
)||
(
selectedFilter==="unread"&&
!isRead
);


return(
matchesSearch&&
matchesFilter
);

});


const unread=
notifications.filter(
item=>item.read!==true
).length;


document.getElementById(
"count"
).textContent=
`${filtered.length} notifications • ${unread} unread`;


if(!filtered.length){

container.innerHTML=`

<div class="empty">

🔔

<br><br>

No notifications found.

</div>

`;

return;

}


container.innerHTML=
filtered.map(item=>{

const title=
item.title||
item.subject||
"Notification";

const message=
item.message||
item.text||
"";

const icon=
item.icon||
getIcon(item.type);

const unreadClass=
item.read===true
?
""
:
"unread";


return`

<article
class="notification ${unreadClass}"
onclick="openNotification('${escapeAttr(item.id)}')">

<div class="icon">
${escapeHTML(icon)}
</div>

<div class="content">

<div class="top">

<div class="notification-title">
${escapeHTML(title)}
</div>

<div class="time">
${formatDate(item.createdAt)}
</div>

</div>

<div class="text">
${escapeHTML(message)}
</div>

<div class="notification-actions">

${
item.read===true
?
""
:
`
<button
class="small"
onclick="event.stopPropagation();markRead('${escapeAttr(item.id)}')">

✓ Mark read

</button>
`
}

<button
class="small delete"
onclick="event.stopPropagation();removeNotification('${escapeAttr(item.id)}')">

Delete

</button>

</div>

</div>

</article>

`;

}).join("");

};


window.markRead=
async function(id){

try{

await updateDoc(
doc(db,"notifications",id),
{
read:true
}
);

const item=
notifications.find(
n=>n.id===id
);

if(item)
item.read=true;

render();

}catch(error){

console.error(error);

alert(
"Unable to update notification."
);

}

};


window.markAllRead=
async function(){

const unread=
notifications.filter(
item=>item.read!==true
);

if(!unread.length){

alert("All notifications are already read.");

return;

}

try{

const batch=
writeBatch(db);

unread.forEach(item=>{

batch.update(
doc(db,"notifications",item.id),
{
read:true
}
);

});

await batch.commit();

notifications.forEach(
item=>{
item.read=true;
}
);

render();

}catch(error){

console.error(error);

alert(
"Unable to mark notifications as read."
);

}

};


window.removeNotification=
async function(id){

if(!confirm(
"Delete this notification?"
))
return;

try{

await deleteDoc(
doc(db,"notifications",id)
);

notifications=
notifications.filter(
item=>item.id!==id
);

render();

}catch(error){

console.error(error);

alert(
"Unable to delete notification."
);

}

};


window.openNotification=
async function(id){

const item=
notifications.find(
n=>n.id===id
);

if(!item)
return;


if(item.read!==true){

await markRead(id);

}


/*
Optional notification link.

Example:
link: "course.html?courseId=ABC"
*/

if(item.link){

location.href=item.link;
return;

}


/*
Fallback destination.
*/

if(item.type==="course"){

location.href="my-courses.html";

}else if(item.type==="community"){

location.href="community.html";

}else if(item.type==="payment"){

location.href="payments.html";

}else if(item.type==="certificate"){

location.href="certificates.html";

}

};


function getIcon(type){

switch(type){

case"course":
return"📚";

case"community":
return"👥";

case"payment":
return"💳";

case"certificate":
return"🎓";

case"career":
return"💼";

case"scholarship":
return"🎯";

case"message":
return"💬";

case"security":
return"🔐";

default:
return"🔔";

}

}


function getTime(timestamp){

if(!timestamp)
return 0;

try{

if(timestamp.toMillis)
return timestamp.toMillis();

if(timestamp.toDate)
return timestamp.toDate().getTime();

return new Date(timestamp).getTime();

}catch{

return 0;

}

}


function formatDate(timestamp){

const time=
getTime(timestamp);

if(!time)
return"";

const date=
new Date(time);

return date.toLocaleDateString(
[],
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}


function escapeHTML(value){

return String(value??"")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(value){

return String(value??"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}

</script></body>
</html>
