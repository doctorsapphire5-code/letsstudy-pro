<meta charset="UTF-8">

<title>Notifications | LetsStudy Pro</title>

<meta name="description"
content="View your latest LetsStudy Pro notifications and updates.">

<meta name="robots" content="noindex,nofollow">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  min-height:100vh
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  color:#172033;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600
}

.container{
  width:92%;
  max-width:850px;
  margin:28px auto
}

.hero{
  background:#fff;
  border-radius:17px;
  padding:25px;
  margin-bottom:15px;
  border:1px solid #e5e7eb
}

.hero h1{
  font-size:29px
}

.hero p{
  color:#64748b;
  font-size:13px;
  margin-top:6px;
  line-height:1.6
}

.count{
  color:#2563eb
}

.toolbar{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:12px;
  display:flex;
  gap:8px;
  margin-bottom:15px
}

.search{
  flex:1;
  padding:11px 13px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none;
  font:inherit;
  min-width:0
}

.search:focus{
  border-color:#2563eb
}

select,
.button{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font:inherit
}

.button{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
  font-weight:700
}

.button:disabled{
  opacity:.6;
  cursor:not-allowed
}

.list{
  display:flex;
  flex-direction:column;
  gap:9px
}

.notification{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:15px;
  display:flex;
  gap:12px;
  transition:.2s
}

.notification:hover{
  border-color:#cbd5e1;
  transform:translateY(-1px)
}

.notification.unread{
  border-left:4px solid #2563eb;
  background:#f8fbff
}

.icon{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px
}

.content{
  flex:1;
  min-width:0
}

.title{
  font-size:14px;
  font-weight:800;
  line-height:1.4
}

.message{
  color:#64748b;
  font-size:13px;
  margin-top:4px;
  line-height:1.5;
  word-break:break-word
}

.time{
  display:block;
  color:#94a3b8;
  font-size:10px;
  margin-top:7px
}

.actions{
  display:flex;
  gap:7px;
  margin-top:9px;
  flex-wrap:wrap
}

.action{
  border:0;
  background:#eef2f7;
  padding:7px 10px;
  border-radius:7px;
  font-size:10px;
  cursor:pointer;
  text-decoration:none;
  color:#172033
}

.action.open{
  background:#2563eb;
  color:#fff
}

.loading,
.empty,
.error{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:55px 20px;
  text-align:center;
  color:#64748b
}

.error{
  color:#b91c1c
}

.empty h3{
  color:#172033;
  margin-bottom:7px
}

@media(max-width:650px){

  .container{
    width:94%;
    margin:20px auto
  }

  .toolbar{
    flex-direction:column
  }

  select,
  .button{
    width:100%
  }

  .hero h1{
    font-size:24px
  }

  .notification{
    padding:13px
  }
}

</head>

<body>

<header>

  <a href="index.html" class="logo">
    LetsStudy <span>Pro</span>
  </a>

  <button
    type="button"
    class="back"
    id="backBtn">
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      Notifications
      <span id="count" class="count">0</span>
    </h1>

    <p>
      Updates from your learning, courses,
      marketplace and LetsStudy Pro account.
    </p>

  </section>


  <section class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search notifications..."
      autocomplete="off"
    >

    <select id="filter">

      <option value="all">All</option>
      <option value="unread">Unread</option>
      <option value="read">Read</option>

    </select>

    <button
      type="button"
      id="markAll"
      class="button">
      Mark all read
    </button>

  </section>


  <section id="list" class="list">

    <div class="loading">
      Loading notifications...
    </div>

  </section>

</main>


<script>
"use strict";

/*
==================================================
LETSSTUDY PRO NOTIFICATIONS

USER ID:

notifications.html?userId=FIREBASE_USER_ID

OR:

localStorage.userId

API:

GET
/api/notifications?userId=USER_ID

PATCH
/api/notifications/:id/read

POST
/api/notifications/read-all

EXPECTED NOTIFICATION:

{
  id:"",
  title:"",
  message:"",
  type:"",
  read:false,
  createdAt:"",
  link:""
}

NO DIRECT FIREBASE SDK
==================================================
*/


/* =========================
   DOM
========================= */

const params =
  new URLSearchParams(location.search);

const list =
  document.getElementById("list");

const search =
  document.getElementById("search");

const filter =
  document.getElementById("filter");

const count =
  document.getElementById("count");

const markAll =
  document.getElementById("markAll");

const backBtn =
  document.getElementById("backBtn");


/* =========================
   USER ID
========================= */

const userId =
  params.get("userId") ||
  localStorage.getItem("userId") ||
  "";


/* =========================
   STATE
========================= */

let notifications = [];

let loading = false;


/* =========================
   BACK
========================= */

backBtn.addEventListener(
  "click",
  function(){
    if(
      document.referrer &&
      document.referrer.startsWith(
        location.origin
      )
    ){
      history.back();
    }else{
      location.href = "index.html";
    }
  }
);


/* =========================
   START
========================= */

if(!userId){

  showError(
    "Please sign in to view your notifications."
  );

}else{

  loadNotifications();

}


/* =========================
   LOAD NOTIFICATIONS
========================= */

async function loadNotifications(){

  if(loading || !userId)
    return;

  loading = true;

  try{

    const response =
      await fetch(
        "/api/notifications?userId=" +
        encodeURIComponent(userId),
        {
          method:"GET",
          headers:{
            "Accept":"application/json"
          },
          cache:"no-store"
        }
      );


    let result = {};

    try{
      result = await response.json();
    }catch{
      result = {};
    }


    if(!response.ok){

      throw new Error(
        result.error ||
        result.message ||
        "Unable to load notifications."
      );

    }


    notifications =
      Array.isArray(
        result.notifications
      )
      ? result.notifications

      : Array.isArray(
          result.results
        )
        ? result.results

        : Array.isArray(
            result.data
          )
          ? result.data

          : Array.isArray(
              result
            )
            ? result

            : [];


    /*
      Sort newest first.
    */

    notifications.sort(
      function(a,b){

        return (
          getTime(b.createdAt || b.timestamp) -
          getTime(a.createdAt || a.timestamp)
        );

      }
    );


    render();


  }catch(error){

    console.error(
      "Notifications error:",
      error
    );

    showError(
      error.message ||
      "Unable to load notifications."
    );


  }finally{

    loading = false;

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const selected =
    filter.value;


  const unread =
    notifications.filter(
      function(notification){
        return !isRead(notification);
      }
    ).length;


  count.textContent =
    unread;


  /*
    FIXED SEARCH BUG:
    Previously operator precedence
    caused title/message search to
    behave incorrectly.

    Now both fields are combined safely.
  */

  const filtered =
    notifications.filter(
      function(notification){

        const title =
          String(
            notification.title || ""
          ).toLowerCase();

        const message =
          String(
            notification.message ||
            notification.body ||
            ""
          ).toLowerCase();

        const text =
          title +
          " " +
          message;


        const read =
          isRead(notification);


        const matchesSearch =
          !keyword ||
          text.includes(keyword);


        const matchesFilter =
          selected === "all" ||

          (
            selected === "unread" &&
            !read
          ) ||

          (
            selected === "read" &&
            read
          );


        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );


  if(!filtered.length){

    list.className = "list";

    list.innerHTML = `

      <div class="empty">

        <h3>
          ${
            notifications.length
            ? "No matching notifications"
            : "No notifications yet"
          }
        </h3>

        <p>
          ${
            notifications.length
            ? "Try another search or filter."
            : "New updates will appear here."
          }
        </p>

      </div>

    `;

    return;

  }


  list.className = "list";

  list.innerHTML =
    filtered
      .map(createNotification)
      .join("");


  bindActions();

}


/* =========================
   CREATE NOTIFICATION
========================= */

function createNotification(
  notification
){

  const id =
    getNotificationId(
      notification
    );


  const read =
    isRead(
      notification
    );


  const type =
    notification.type ||
    "system";


  const icon =
    getIcon(type);


  const link =
    notification.link ||
    notification.url ||
    notification.actionUrl ||
    "";


  const title =
    notification.title ||
    "LetsStudy Pro";


  const message =
    notification.message ||
    notification.body ||
    "";


  const createdAt =
    notification.createdAt ||
    notification.timestamp ||
    "";


  return `

    <article
      class="notification ${
        read ? "" : "unread"
      }"
      data-id="${escapeAttr(id)}"
    >

      <div class="icon">
        ${icon}
      </div>


      <div class="content">

        <div class="title">
          ${escapeHTML(title)}
        </div>


        <div class="message">
          ${escapeHTML(message)}
        </div>


        <span class="time">
          ${escapeHTML(
            formatDate(createdAt)
          )}
        </span>


        <div class="actions">

          ${
            link
            ? `
              <a
                href="${safeLink(link)}"
                class="action open"
                data-id="${escapeAttr(id)}"
              >
                Open
              </a>
            `
            : ""
          }


          ${
            !read && id
            ? `
              <button
                type="button"
                class="action mark-read"
                data-id="${escapeAttr(id)}"
              >
                Mark as read
              </button>
            `
            : ""
          }

        </div>

      </div>

    </article>

  `;

}


/* =========================
   GET NOTIFICATION ID
========================= */

function getNotificationId(
  notification
){

  return String(
    notification.id ||
    notification.documentId ||
    notification.notificationId ||
    ""
  );

}


/* =========================
   BIND ACTIONS
========================= */

function bindActions(){

  document
    .querySelectorAll(".mark-read")
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            markRead(
              button.dataset.id
            );

          }
        );

      }
    );


  document
    .querySelectorAll(".open")
    .forEach(
      function(link){

        link.addEventListener(
          "click",
          function(){

            /*
              Mark read before navigation.
            */

            const id =
              link.dataset.id;

            if(id){

              markRead(
                id,
                true
              );

            }

          }
        );

      }
    );

}


/* =========================
   MARK ONE READ
========================= */

async function markRead(
  id,
  silent = false
){

  if(!id || !userId)
    return;


  try{

    const response =
      await fetch(
        "/api/notifications/" +
        encodeURIComponent(id) +
        "/read",
        {
          method:"PATCH",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:JSON.stringify({
            userId:userId
          })
        }
      );


    let result = {};

    try{
      result = await response.json();
    }catch{}


    if(!response.ok){

      throw new Error(
        result.error ||
        result.message ||
        "Unable to mark notification as read."
      );

    }


    const notification =
      notifications.find(
        function(n){

          return (
            getNotificationId(n) ===
            String(id)
          );

        }
      );


    if(notification){

      notification.read = true;
      notification.isRead = true;
      notification.status = "read";

    }


    render();


  }catch(error){

    console.error(
      error
    );

    if(!silent){

      alert(
        error.message ||
        "Unable to mark notification as read."
      );

    }

  }

}


/* =========================
   MARK ALL READ
========================= */

markAll.addEventListener(
  "click",
  async function(){

    if(!userId)
      return;


    const unread =
      notifications.filter(
        function(n){
          return !isRead(n);
        }
      );


    if(!unread.length){

      alert(
        "All notifications are already read."
      );

      return;

    }


    markAll.disabled = true;

    markAll.textContent =
      "Updating...";


    try{

      const response =
        await fetch(
          "/api/notifications/read-all",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body:JSON.stringify({
              userId:userId
            })
          }
        );


      let result = {};

      try{
        result = await response.json();
      }catch{}


      if(!response.ok){

        throw new Error(
          result.error ||
          result.message ||
          "Unable to mark all as read."
        );

      }


      notifications.forEach(
        function(n){

          n.read = true;
          n.isRead = true;
          n.status = "read";

        }
      );


      render();


    }catch(error){

      console.error(
        error
      );

      alert(
        error.message ||
        "Unable to mark all as read."
      );


    }finally{

      markAll.disabled = false;

      markAll.textContent =
        "Mark all read";

    }

  }
);


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  function(){
    render();
  }
);


filter.addEventListener(
  "change",
  function(){
    render();
  }
);


/* =========================
   AUTO REFRESH
========================= */

setInterval(
  function(){

    if(
      document.visibilityState ===
      "visible"
    ){

      loadNotifications();

    }

  },
  30000
);


/* =========================
   ICONS
========================= */

function getIcon(
  type
){

  switch(
    String(type)
      .toLowerCase()
      .trim()
  ){

    case "course":
      return "📚";

    case "lesson":
      return "▶️";

    case "assignment":
      return "📝";

    case "certificate":
      return "🏆";

    case "message":
      return "💬";

    case "comment":
      return "💭";

    case "follow":
      return "👤";

    case "marketplace":
      return "🛒";

    case "payment":
      return "💳";

    case "event":
      return "📅";

    case "success":
      return "✅";

    case "warning":
      return "⚠️";

    case "error":
      return "❌";

    case "system":
      return "⚙️";

    default:
      return "🔔";

  }

}


/* =========================
   READ STATE
========================= */

function isRead(
  notification
){

  return (
    notification.read === true ||

    notification.isRead === true ||

    String(
      notification.status || ""
    ).toLowerCase() === "read"
  );

}


/* =========================
   DATE
========================= */

function getTime(
  value
){

  if(!value)
    return 0;


  /*
    Firebase Timestamp support.
  */

  if(
    typeof value === "object" &&
    value.seconds
  ){

    return Number(
      value.seconds
    ) * 1000;

  }


  const date =
    new Date(value);


  const time =
    date.getTime();


  return Number.isNaN(time)
    ? 0
    : time;

}


function formatDate(
  value
){

  const time =
    getTime(value);


  if(!time)
    return "";


  const date =
    new Date(time);


  return date.toLocaleString(
    undefined,
    {
      month:"short",
      day:"numeric",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   SAFE URL
========================= */

function safeLink(
  url
){

  try{

    const parsed =
      new URL(
        String(url),
        location.origin
      );


    if(
      parsed.protocol === "http:" ||
      parsed.protocol === "https:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch(error){

    console.warn(
      "Invalid notification URL:",
      url
    );

  }


  return "#";

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  list.className = "error";

  list.innerHTML = `

    <h2>
      Notifications
    </h2>

    <p style="margin-top:10px">
      ${escapeHTML(
        message ||
        "Something went wrong."
      )}
    </p>

  `;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  ).replace(
    /`/g,
    "&#096;"
  );

}

</script>
