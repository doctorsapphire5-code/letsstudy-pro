<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Notifications | LetsStudy Pro</title>

<meta name="description"
content="Read the latest announcements, updates, opportunities and notifications from LetsStudy Pro.">

<meta name="robots" content="index,follow">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.6;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1150px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  color:#2563eb;
  font-size:21px;
  font-weight:800;
  text-decoration:none;
}

nav{
  display:flex;
  align-items:center;
  gap:16px;
}

nav a{
  text-decoration:none;
  color:#475569;
  font-size:14px;
  font-weight:600;
}

nav a:hover{
  color:#2563eb;
}

.container{
  max-width:950px;
  margin:auto;
  padding:25px 16px 50px;
}

.hero{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;
  padding:35px 28px;
  border-radius:20px;
  margin-bottom:20px;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  opacity:.92;
  max-width:700px;
}

.toolbar{
  background:#fff;
  border:1px solid #e5e7eb;
  padding:15px;
  border-radius:14px;
  margin-bottom:18px;
}

.search{
  width:100%;
  padding:12px 14px;
  border:1px solid #dbe1ea;
  border-radius:9px;
  outline:none;
  font-size:14px;
}

.search:focus{
  border-color:#2563eb;
}

.notification{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 5px 20px #00000008;
}

.notification:hover{
  box-shadow:0 8px 25px #00000010;
}

.notification-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.notification-title{
  font-size:19px;
  font-weight:800;
  color:#172033;
}

.notification-date{
  color:#64748b;
  font-size:12px;
  white-space:nowrap;
}

.notification-message{
  margin-top:10px;
  color:#475569;
  white-space:pre-wrap;
  word-break:break-word;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:14px;
}

.badge{
  padding:4px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.info{
  background:#dbeafe;
  color:#1d4ed8;
}

.success{
  background:#dcfce7;
  color:#15803d;
}

.warning{
  background:#fef3c7;
  color:#92400e;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.loading,
.empty,
.error{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:45px 20px;
  text-align:center;
  color:#64748b;
}

.error{
  color:#b91c1c;
}

.retry{
  margin-top:15px;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  color:#64748b;
  font-size:13px;
}

footer{
  background:#fff;
  border-top:1px solid #e5e7eb;
  padding:25px 18px;
  text-align:center;
  color:#64748b;
  font-size:13px;
}

@media(max-width:650px){

  .header-inner{
    padding:13px 14px;
  }

  nav{
    gap:10px;
  }

  nav a{
    font-size:12px;
  }

  .container{
    padding:18px 12px 40px;
  }

  .hero{
    padding:25px 20px;
  }

  .hero h1{
    font-size:26px;
  }

  .notification-head{
    flex-direction:column;
    gap:5px;
  }

  .notification-date{
    white-space:normal;
  }

}

</style>

</head>

<body>


<header>

  <div class="header-inner">

    <a
      href="index.html"
      class="logo">

      LetsStudy Pro

    </a>


    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="businesses.html">
        Businesses
      </a>

      <a href="notifications.html">
        🔔 Notifications
      </a>

    </nav>

  </div>

</header>


<main class="container">


  <section class="hero">

    <h1>
      🔔 Notifications
    </h1>

    <p>
      Stay updated with the latest announcements,
      learning opportunities, courses, events and
      important updates from LetsStudy Pro.
    </p>

  </section>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search notifications...">

  </div>


  <div class="stats">

    <span id="resultCount">
      Loading notifications...
    </span>

  </div>


  <section id="notificationList">

    <div class="loading">

      Loading notifications...

    </div>

  </section>


</main>


<footer>

  © <span id="year"></span>
  LetsStudy Pro.
  All rights reserved.

</footer>


<script type="module">


/* =====================================
   FIREBASE
===================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  orderBy
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXKbljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =====================================
   VARIABLES
===================================== */

const list =
document.getElementById(
  "notificationList"
);

const resultCount =
document.getElementById(
  "resultCount"
);

let notifications = [];


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================
   FORMAT DATE
===================================== */

function formatDate(value){

  if(!value){
    return "";
  }

  try{

    let date;

    if(
      typeof value.toDate ===
      "function"
    ){

      date =
      value.toDate();

    }else{

      date =
      new Date(value);

    }

    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "";

    }

    return date.toLocaleString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch(error){

    return "";

  }

}


/* =====================================
   BADGE
===================================== */

function getBadge(type){

  const value =
  String(type || "info")
  .toLowerCase();


  let className =
  "info";


  if(value === "success"){
    className = "success";
  }

  else if(
    value === "warning"
  ){
    className = "warning";
  }

  else if(
    value === "danger" ||
    value === "error"
  ){
    className = "danger";
  }


  return `

    <span class="badge ${className}">
      ${escapeHTML(value)}
    </span>

  `;

}


/* =====================================
   LOAD NOTIFICATIONS
===================================== */

async function loadNotifications(){

  list.innerHTML = `

    <div class="loading">
      Loading notifications...
    </div>

  `;


  try{

    /*
      PUBLIC MODE

      Only published notifications
      are displayed to visitors.
    */

    const q =
    query(

      collection(
        db,
        "notifications"
      ),

      where(
        "status",
        "==",
        "published"
      ),

      orderBy(
        "createdAt",
        "desc"
      )

    );


    const snapshot =
    await getDocs(q);


    notifications =
    snapshot.docs.map(
      doc => ({

        id:doc.id,
        ...doc.data()

      })
    );


    render(
      notifications
    );


  }catch(error){

    console.error(
      "Notifications error:",
      error
    );


    /*
      Fallback in case Firestore
      requires an index.
    */

    try{

      const snapshot =
      await getDocs(
        collection(
          db,
          "notifications"
        )
      );


      notifications =
      snapshot.docs
        .map(
          doc => ({
            id:doc.id,
            ...doc.data()
          })
        )
        .filter(
          item =>
          item.status ===
          "published"
        );


      notifications.sort(
        (a,b) => {

          const aTime =
          a.createdAt?.seconds || 0;

          const bTime =
          b.createdAt?.seconds || 0;

          return bTime - aTime;

        }
      );


      render(
        notifications
      );


    }catch(fallbackError){

      console.error(
        fallbackError
      );


      list.innerHTML = `

        <div class="error">

          <h3>
            Unable to Load Notifications
          </h3>

          <p style="margin-top:8px">

            ${escapeHTML(
              fallbackError.message
            )}

          </p>


          <button
            class="retry"
            onclick="loadNotifications()">

            Try Again

          </button>

        </div>

      `;


      resultCount.textContent =
      "Unable to load notifications";

    }

  }

}


/* =====================================
   RENDER
===================================== */

function render(items){

  resultCount.textContent =
  items.length === 1
  ? "1 notification"
  : `${items.length} notifications`;


  if(!items.length){

    list.innerHTML = `

      <div class="empty">

        <h3>
          No Notifications
        </h3>

        <p style="margin-top:8px">

          There are currently no published
          notifications.

        </p>

      </div>

    `;

    return;

  }


  list.innerHTML =
  items.map(
    notification => {

      const title =
      notification.title ||
      "LetsStudy Pro Update";


      const message =
      notification.message ||
      notification.description ||
      "";


      const date =
      formatDate(
        notification.createdAt
      );


      return `

        <article
          class="notification">

          <div class="notification-head">

            <div class="notification-title">

              🔔
              ${escapeHTML(title)}

            </div>


            ${
              date
              ?`

                <div
                  class="notification-date">

                  ${escapeHTML(date)}

                </div>

              `
              :""
            }

          </div>


          ${
            message
            ?`

              <div
                class="notification-message">

                ${escapeHTML(message)}

              </div>

            `
            :""
          }


          <div class="badges">

            ${getBadge(
              notification.type
            )}


            ${
              notification.category
              ?`

                <span class="badge info">

                  ${escapeHTML(
                    notification.category
                  )}

                </span>

              `
              :""
            }


            ${
              notification.priority
              ?`

                <span class="badge warning">

                  ${escapeHTML(
                    notification.priority
                  )}

                </span>

              `
              :""
            }

          </div>

        </article>

      `;

    }
  ).join("");

}


/* =====================================
   SEARCH
===================================== */

document.getElementById(
  "search"
).addEventListener(
  "input",
  function(){

    const search =
    this.value
      .toLowerCase()
      .trim();


    if(!search){

      render(
        notifications
      );

      return;

    }


    const filtered =
    notifications.filter(
      notification => {

        const text = [

          notification.title,

          notification.message,

          notification.description,

          notification.category,

          notification.type,

          notification.priority

        ]
        .join(" ")
        .toLowerCase();


        return text.includes(
          search
        );

      }
    );


    render(
      filtered
    );

  }
);


/* =====================================
   YEAR
===================================== */

document.getElementById(
  "year"
).textContent =
new Date().getFullYear();


/* =====================================
   START
===================================== */

loadNotifications();


</script>

</body>
</html>
