<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Notifications | LetsStudy Pro</title>

<meta name="description"
content="View your latest LetsStudy Pro notifications and updates.">

<meta name="robots" content="noindex,nofollow">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer
}

.container{
  width:92%;
  max-width:850px;
  margin:28px auto
}

.hero{
  background:#fff;
  border-radius:17px;
  padding:25px;
  margin-bottom:15px
}

.hero h1{
  font-size:29px
}

.hero p{
  color:#64748b;
  font-size:13px;
  margin-top:5px
}

.count{
  color:#2563eb
}

.toolbar{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:12px;
  display:flex;
  gap:8px;
  margin-bottom:15px
}

.search{
  flex:1;
  padding:11px 13px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none
}

select,
.button{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:10px;
  border-radius:8px;
  cursor:pointer
}

.button{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
  font-weight:700
}

.list{
  display:flex;
  flex-direction:column;
  gap:9px
}

.notification{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:15px;
  display:flex;
  gap:12px
}

.notification.unread{
  border-left:4px solid #2563eb;
  background:#f8fbff
}

.icon{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px
}

.content{
  flex:1
}

.title{
  font-size:14px;
  font-weight:800
}

.message{
  color:#64748b;
  font-size:13px;
  margin-top:4px
}

.time{
  display:block;
  color:#94a3b8;
  font-size:10px;
  margin-top:7px
}

.actions{
  display:flex;
  gap:7px;
  margin-top:9px
}

.action{
  border:0;
  background:#eef2f7;
  padding:6px 9px;
  border-radius:7px;
  font-size:10px;
  cursor:pointer;
  text-decoration:none;
  color:#172033
}

.open{
  background:#2563eb;
  color:#fff
}

.loading,
.empty,
.error{
  background:#fff;
  border-radius:15px;
  padding:55px 20px;
  text-align:center;
  color:#64748b
}

.error{
  color:#b91c1c
}

@media(max-width:650px){

  .toolbar{
    flex-direction:column
  }

  select,
  .button{
    width:100%
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      Notifications
      <span
        id="count"
        class="count"
      >
        0
      </span>
    </h1>

    <p>
      Updates from your learning, courses,
      marketplace and LetsStudy Pro account.
    </p>

  </section>


  <section class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search notifications..."
    >


    <select id="filter">

      <option value="all">
        All
      </option>

      <option value="unread">
        Unread
      </option>

      <option value="read">
        Read
      </option>

    </select>


    <button
      id="markAll"
      class="button"
    >
      Mark all read
    </button>

  </section>


  <section
    id="list"
    class="list"
  >

    <div class="loading">
      Loading notifications...
    </div>

  </section>

</main>


<script>

/*
==================================================
LETSSTUDY PRO NOTIFICATIONS

USER:

localStorage.userId

OR:

notifications.html?userId=USER_ID


GET:

/api/notifications?userId=USER_ID


PATCH:

/api/notifications/:id/read


POST:

/api/notifications/read-all


EXPECTED:

{
  id:"",
  title:"",
  message:"",
  type:"",
  read:false,
  createdAt:"",
  link:""
}

NO DIRECT FIREBASE
==================================================
*/


const params =
  new URLSearchParams(
    location.search
  );


const userId =
  params.get("userId") ||
  localStorage.getItem(
    "userId"
  ) ||
  "";


const list =
  document.getElementById(
    "list"
  );

const search =
  document.getElementById(
    "search"
  );

const filter =
  document.getElementById(
    "filter"
  );

const count =
  document.getElementById(
    "count"
  );

const markAll =
  document.getElementById(
    "markAll"
  );


let notifications = [];


/* =========================
   START
========================= */

if(!userId){

  showError(
    "Please sign in to view your notifications."
  );

}else{

  loadNotifications();

}


/* =========================
   LOAD
========================= */

async function loadNotifications(){

  try{

    const response =
      await fetch(
        "/api/notifications?userId=" +
        encodeURIComponent(
          userId
        )
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load notifications."
      );

    }


    notifications =
      Array.isArray(
        result.notifications
      )
      ? result.notifications
      : Array.isArray(
          result.results
        )
        ? result.results
        : [];


    render();

  }catch(error){

    console.error(
      error
    );

    showError(
      error.message
    );

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const selected =
    filter.value;


  const unread =
    notifications.filter(
      n => !isRead(n)
    ).length;


  count.textContent =
    unread;


  const filtered =
    notifications.filter(
      notification => {

        const text =
          (
            notification.title ||
            "" +
            " " +
            notification.message ||
            ""
          ).toLowerCase();


        const read =
          isRead(
            notification
          );


        return (

          (
            !keyword ||
            text.includes(
              keyword
            )
          )

          &&

          (
            selected === "all" ||
            (
              selected === "unread" &&
              !read
            ) ||
            (
              selected === "read" &&
              read
            )
          )

        );

      }
    );


  if(!filtered.length){

    list.innerHTML = `

      <div class="empty">

        ${
          notifications.length
          ? "No matching notifications."
          : "No notifications yet."
        }

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered
      .map(
        createNotification
      )
      .join("");


  bindActions();

}


/* =========================
   CARD
========================= */

function createNotification(
  notification
){

  const id =
    notification.id ||
    notification.documentId ||
    "";


  const read =
    isRead(
      notification
    );


  const type =
    notification.type ||
    "system";


  const icon =
    getIcon(
      type
    );


  const link =
    notification.link ||
    "";


  return `

    <article
      class="notification ${
        read
        ? ""
        : "unread"
      }"
    >

      <div class="icon">

        ${icon}

      </div>


      <div class="content">

        <div class="title">

          ${escapeHTML(
            notification.title ||
            "LetsStudy Pro"
          )}

        </div>


        <div class="message">

          ${escapeHTML(
            notification.message ||
            notification.body ||
            ""
          )}

        </div>


        <span class="time">

          ${escapeHTML(
            formatDate(
              notification.createdAt ||
              notification.timestamp
            )
          )}

        </span>


        <div class="actions">

          ${
            link
            ? `

              <a
                href="${safeLink(link)}"
                class="action open"
                data-id="${escapeAttr(id)}"
              >
                Open
              </a>

            `
            : ""
          }


          ${
            !read
            ? `

              <button
                class="action mark-read"
                data-id="${escapeAttr(id)}"
              >
                Mark as read
              </button>

            `
            : ""
          }

        </div>

      </div>

    </article>

  `;

}


/* =========================
   ACTIONS
========================= */

function bindActions(){

  document
    .querySelectorAll(
      ".mark-read"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            markRead(
              button.dataset.id
            )
        );

      }
    );


  document
    .querySelectorAll(
      ".open"
    )
    .forEach(
      link => {

        link.addEventListener(
          "click",
          () => {

            markRead(
              link.dataset.id,
              true
            );

          }
        );

      }
    );

}


/* =========================
   MARK READ
========================= */

async function markRead(
  id,
  silent=false
){

  if(!id)
    return;


  try{

    const response =
      await fetch(
        "/api/notifications/" +
        encodeURIComponent(id) +
        "/read",
        {
          method:"PATCH",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            userId:userId
          })
        }
      );


    if(!response.ok){

      throw new Error(
        "Unable to mark notification as read."
      );

    }


    const notification =
      notifications.find(
        n =>
          (
            n.id ||
            n.documentId
          ) === id
      );


    if(notification){

      notification.read =
        true;

    }


    render();

  }catch(error){

    if(!silent){

      alert(
        error.message
      );

    }

  }

}


/* =========================
   MARK ALL
========================= */

markAll.addEventListener(
  "click",
  async () => {

    markAll.disabled =
      true;


    try{

      const response =
        await fetch(
          "/api/notifications/read-all",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json"
            },
            body:JSON.stringify({
              userId:userId
            })
          }
        );


      if(!response.ok){

        throw new Error(
          "Unable to mark all as read."
        );

      }


      notifications.forEach(
        n => {
          n.read = true;
        }
      );


      render();

    }catch(error){

      alert(
        error.message
      );

    }finally{

      markAll.disabled =
        false;

    }

  }
);


/* =========================
   FILTER
========================= */

search.addEventListener(
  "input",
  render
);

filter.addEventListener(
  "change",
  render
);


/* =========================
   AUTO REFRESH
========================= */

setInterval(
  loadNotifications,
  30000
);


/* =========================
   ICONS
========================= */

function getIcon(
  type
){

  switch(
    String(type)
      .toLowerCase()
  ){

    case "course":
      return "📚";

    case "lesson":
      return "▶️";

    case "assignment":
      return "📝";

    case "certificate":
      return "🏆";

    case "message":
      return "💬";

    case "comment":
      return "💭";

    case "follow":
      return "👤";

    case "marketplace":
      return "🛒";

    case "payment":
      return "💳";

    case "event":
      return "📅";

    case "system":
      return "⚙️";

    default:
      return "🔔";

  }

}


/* =========================
   READ
========================= */

function isRead(
  notification
){

  return (
    notification.read === true ||
    notification.isRead === true ||
    notification.status === "read"
  );

}


/* =========================
   DATE
========================= */

function formatDate(
  value
){

  if(!value)
    return "";


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return date.toLocaleString(
    undefined,
    {
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   SAFE URL
========================= */

function safeLink(
  url
){

  try{

    const parsed =
      new URL(
        url,
        location.origin
      );


    if(
      parsed.protocol ===
      "http:" ||
      parsed.protocol ===
      "https:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch{}

  return "#";

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  list.className =
    "error";


  list.innerHTML = `

    <h2>
      Notifications
    </h2>

    <p style="margin-top:10px">

      ${escapeHTML(
        message
      )}

    </p>

  `;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  ).replace(
    /`/g,
    "&#096;"
  );

}

</script>

</body>
</html>
