<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(780px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 12px}
.lead{font-size:18px;color:var(--muted);margin:0 0 28px;max-width:600px}
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px}
.search:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
#count{color:var(--muted);font-size:14px;margin:18px 0 12px;min-height:21px}
.n{--c:#2563eb;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:20px 22px;margin-bottom:14px}
.t-general,.t-info{--c:#475569}.t-course{--c:#2563eb}.t-payment,.t-success{--c:#16a34a}.t-community{--c:#7c3aed}.t-system{--c:#0e7490}.t-announcement,.t-warning{--c:#b45309}.t-danger{--c:#dc2626}
@media(prefers-color-scheme:dark){.t-general,.t-info{--c:#94a3b8}.t-course{--c:#60a5fa}.t-payment,.t-success{--c:#4ade80}.t-community{--c:#a78bfa}.t-system{--c:#22d3ee}.t-announcement,.t-warning{--c:#fbbf24}.t-danger{--c:#f87171}}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.n h2{font-size:19px;line-height:1.35;margin:0;color:var(--ink);letter-spacing:-.01em}
.n time{color:var(--muted);font-size:13px;white-space:nowrap}
.msg{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;color:var(--p);font:inherit;font-weight:700;font-size:14px;padding:6px 0 0;cursor:pointer}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.b{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.b[class*=" t-"]{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.b.new{background:var(--ink);color:var(--paper)}
.hint{margin:-14px 0 22px;font-size:14px;color:var(--muted)}
.go{display:inline-block;margin-top:14px;font-weight:700;text-decoration:none}
.go:hover{text-decoration:underline}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.retry{margin-top:14px;border:0;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.top{flex-direction:column;gap:4px}.hd nav a{margin-left:12px}.n{padding:18px}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="businesses.html">Businesses</a>
    <a href="blog.html">Blog</a>
    <a href="notifications.html" aria-current="page">Notifications</a>
  </nav>

<main class="wrap">
  <h1>Notifications</h1>
  <p class="lead">Announcements, learning opportunities, courses, events and important updates from LetsStudy Pro.</p>

  <p class="hint" id="hint"></p>

  <div class="tools">
    <input id="search" class="search" type="search" placeholder="Search notifications" aria-label="Search notifications">
    <div class="chips" id="chips" hidden></div>
  </div>

  <div id="count" role="status"></div>
  <section id="list"></section>
</main>

<footer>&copy; <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,getDoc,doc,query,where}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const list=$("#list"),count=$("#count"),chipBox=$("#chips"),hint=$("#hint");
const SEEN="ls_notifications_seen";
const TYPES={general:"General",course:"Course",payment:"Payment",community:"Community",system:"System",announcement:"Announcement"};
const AUD={all:"Everyone",student:"Students",instructor:"Instructors",admin:"Admins",user:"For you"};
let all=[],cat="",user=null,role="student";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim(),location.href);return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const secs=n=>{const x=toD(n.createdAt);return x?x.getTime()/1000:0};
const kind=t=>{t=String(t||"general").toLowerCase();return t==="error"?"danger":/^(general|course|payment|community|system|announcement|info|success|warning|danger)$/.test(t)?t:"general"};
const tLabel=t=>TYPES[t]||t[0].toUpperCase()+t.slice(1);

const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}

/* Who may see a notification (audience set in the admin form) */
function visible(n){
  if(/^(draft|archived|deleted|disabled|inactive|cancelled|canceled)$/i.test(n.status||"")||n.published===false||n.active===false||n.deleted===true)return false;
  const a=String(n.audience||"all").toLowerCase();
  if(a==="all")return true;
  if(!user)return false;
  if(a==="user")return n.userId===user.uid;
  return a===role;
}

async function getRole(u){
  try{
    const s=await getDoc(doc(db,"users",u.uid));
    const r=s.exists()?String(s.data().role||"").toLowerCase():"";
    if(r)return r;
  }catch{}
  return "student";
}

/* Targeted queries: only what this visitor is allowed to read */
async function fetchAll(){
  const col=collection(db,"notifications");
  const qs=[query(col,where("audience","==","all")),query(col,where("status","==","published"))];
  if(user)qs.push(query(col,where("audience","==",role)),query(col,where("userId","==",user.uid)));
  const res=await Promise.allSettled(qs.map(q=>getDocs(q)));
  const ok=res.filter(r=>r.status==="fulfilled");
  if(!ok.length)throw res[0].reason;
  const map=new Map();
  ok.forEach(r=>r.value.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()})));
  return [...map.values()];
}

function card(n){
  const t=kind(n.type),x=toD(n.createdAt),m=String(n.message||n.description||"");
  const link=safe(n.link||n.url),long=m.length>240,a=String(n.audience||"all").toLowerCase();
  return `<article class="n t-${t}">
    <div class="top"><h2>${esc(n.title||"LetsStudy Pro Update")}</h2>${x?`<time datetime="${x.toISOString()}" title="${esc(x.toLocaleString())}">${esc(ago(x))}</time>`:""}</div>
    ${m?`<p class="msg${long?" clamp":""}">${esc(m)}</p>${long?`<button class="more" type="button">Read more</button>`:""}`:""}
    <div class="badges">
      ${n._new?`<span class="b new">New</span>`:""}
      <span class="b t-${t}">${esc(tLabel(t))}</span>
      ${a!=="all"?`<span class="b">${esc(AUD[a]||a)}</span>`:""}
      ${n.category?`<span class="b">${esc(n.category)}</span>`:""}
      ${n.priority?`<span class="b ${/high|urgent/i.test(n.priority)?"t-warning":""}">${esc(n.priority)}</span>`:""}
    </div>
    ${link?`<a class="go" href="${esc(link)}">${esc(n.linkText||"Open")}</a>`:""}
  </article>`;
}

function render(items){
  count.textContent=items.length===1?"1 notification":`${items.length} notifications`;
  list.innerHTML=items.length?items.map(card).join(""):
    `<div class="state"><h2>No notifications found</h2><p>${all.length?"Try a different search or type.":"You have no notifications yet. Check back soon."}</p></div>`;
}

function apply(){
  const q=$("#search").value.toLowerCase().trim();
  render(all.filter(n=>(!cat||kind(n.type)===cat)&&
    (!q||[n.title,n.message,n.description,n.category,n.type,n.priority].join(" ").toLowerCase().includes(q))));
}

function buildChips(){
  const types=[...new Set(all.map(n=>kind(n.type)))];
  if(types.length<2){chipBox.hidden=true;return}
  chipBox.innerHTML=["",...types].map(c=>`<button class="chip" type="button" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c?tLabel(c):"All")}</button>`).join("");
  chipBox.hidden=false;
}

chipBox.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  cat=b.dataset.c;
  chipBox.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  apply();
});

list.addEventListener("click",e=>{
  const b=e.target.closest(".more");if(!b)return;
  const open=b.previousElementSibling.classList.toggle("clamp");
  b.textContent=open?"Read more":"Show less";
});

$("#search").addEventListener("input",apply);

function fail(err){
  console.error(err);
  count.textContent="";
  list.innerHTML=`<div class="state err"><h2>Unable to load notifications</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="retry" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",load);
}

async function load(){
  hint.innerHTML=user?"":`<a href="login.html">Sign in</a> to see notifications meant for your account.`;
  try{all=(await fetchAll()).filter(visible).sort((a,b)=>secs(b)-secs(a))}
  catch(e){return fail(e)}

  const key=SEEN+(user?"_"+user.uid:"");
  let seen=0;
  try{seen=Number(localStorage.getItem(key))||0}catch{}
  all.forEach(n=>n._new=seen>0&&secs(n)>seen);
  try{if(all.length)localStorage.setItem(key,String(Math.max(...all.map(secs))))}catch{}

  cat="";
  buildChips();
  apply();
}

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,async u=>{
  user=u;
  role=u?await getRole(u):"student";
  load();
});
</script>
</body>
