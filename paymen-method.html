<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Payment Method | LetsStudy Pro</title>

<meta name="description"
content="Choose your preferred payment method on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10
}

.logo{
  text-decoration:none;
  color:#172033;
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer
}

.container{
  width:92%;
  max-width:650px;
  margin:30px auto
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:22px;
  margin-bottom:15px
}

h1{
  font-size:28px;
  margin-bottom:6px
}

.subtitle{
  color:#64748b;
  font-size:13px;
  margin-bottom:22px
}

.method{
  display:flex;
  align-items:center;
  gap:13px;
  border:1px solid #dbe2ea;
  padding:15px;
  border-radius:11px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.2s
}

.method:hover{
  border-color:#2563eb
}

.method.selected{
  border:2px solid #2563eb;
  background:#f8fbff
}

.radio{
  width:19px;
  height:19px;
  accent-color:#2563eb
}

.icon{
  width:40px;
  height:40px;
  border-radius:9px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px
}

.info{
  flex:1
}

.info strong{
  display:block;
  font-size:14px
}

.info small{
  color:#64748b;
  font-size:11px
}

.summary{
  border-top:1px solid #e5e7eb;
  padding-top:16px;
  margin-top:18px
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:9px;
  font-size:13px
}

.total{
  font-size:18px;
  font-weight:800
}

.continue{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:13px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
  margin-top:10px
}

.continue:disabled{
  opacity:.5;
  cursor:not-allowed
}

.notice{
  font-size:11px;
  color:#64748b;
  margin-top:12px;
  text-align:center
}

.error{
  color:#b91c1c
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="card">

    <h1>
      Payment Method
    </h1>

    <p class="subtitle">
      Choose how you would like to pay.
    </p>


    <div id="methods">

      <label class="method">

        <input
          class="radio"
          type="radio"
          name="payment"
          value="mobile_money"
        >

        <div class="icon">
          📱
        </div>

        <div class="info">
          <strong>Mobile Money</strong>
          <small>
            Pay using your supported mobile wallet.
          </small>
        </div>

      </label>


      <label class="method">

        <input
          class="radio"
          type="radio"
          name="payment"
          value="card"
        >

        <div class="icon">
          💳
        </div>

        <div class="info">
          <strong>Debit / Credit Card</strong>
          <small>
            Secure card payment.
          </small>
        </div>

      </label>


      <label class="method">

        <input
          class="radio"
          type="radio"
          name="payment"
          value="bank"
        >

        <div class="icon">
          🏦
        </div>

        <div class="info">
          <strong>Bank Transfer</strong>
          <small>
            Complete payment through your bank.
          </small>
        </div>

      </label>

    </div>


    <div class="summary">

      <div class="row">

        <span>
          Item
        </span>

        <strong id="item">
          Checkout
        </strong>

      </div>


      <div class="row">

        <span>
          Amount
        </span>

        <strong id="amount">
          —
        </strong>

      </div>


      <div class="row total">

        <span>
          Total
        </span>

        <span id="total">
          —
        </span>

      </div>


      <button
        id="continue"
        class="continue"
        disabled
      >
        Continue to Payment
      </button>


      <div
        id="notice"
        class="notice"
      >
        Select a payment method to continue.
      </div>

    </div>

  </section>

</main>


<script>

/*
==================================================
PAYMENT-METHOD.HTML

SUPPORTED URL:

payment-method.html
payment-method.html?type=course&id=COURSE_ID
payment-method.html?type=marketplace&id=ITEM_ID
payment-method.html?type=service&id=SERVICE_ID

OPTIONAL:

?amount=30000
?currency=TZS
?name=Course%20Name

PAYMENT METHODS:

mobile_money
card
bank

IMPORTANT:
This page only selects the payment method.
Actual payment must be confirmed by your secure
backend/payment provider.

NEVER put payment secrets/API secrets in this page.
==================================================
*/


const params =
  new URLSearchParams(
    location.search
  );


const type =
  params.get("type") ||
  "checkout";


const itemId =
  params.get("id") ||
  params.get("documentId") ||
  "";


const itemName =
  params.get("name") ||
  getSaved(
    "checkoutName"
  ) ||
  "Checkout";


const amount =
  params.get("amount") ||
  getSaved(
    "checkoutAmount"
  ) ||
  "";


const currency =
  params.get("currency") ||
  getSaved(
    "checkoutCurrency"
  ) ||
  "TZS";


const item =
  document.getElementById(
    "item"
  );

const amountBox =
  document.getElementById(
    "amount"
  );

const total =
  document.getElementById(
    "total"
  );

const continueBtn =
  document.getElementById(
    "continue"
  );

const notice =
  document.getElementById(
    "notice"
  );


/* =========================
   DISPLAY CHECKOUT
========================= */

item.textContent =
  itemName;


if(amount){

  amountBox.textContent =
    formatMoney(
      amount,
      currency
    );

  total.textContent =
    formatMoney(
      amount,
      currency
    );

}


/* =========================
   SELECT METHOD
========================= */

document
  .querySelectorAll(
    ".method"
  )
  .forEach(
    method => {

      method.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".method"
            )
            .forEach(
              element =>
                element.classList
                  .remove(
                    "selected"
                  )
            );


          method.classList.add(
            "selected"
          );


          const radio =
            method.querySelector(
              "input"
            );


          radio.checked =
            true;


          continueBtn.disabled =
            false;


          notice.textContent =
            "Payment method selected.";

        }
      );

    }
  );


/* =========================
   CONTINUE
========================= */

continueBtn.addEventListener(
  "click",
  async () => {

    const selected =
      document.querySelector(
        'input[name="payment"]:checked'
      );


    if(!selected){

      return;

    }


    const paymentMethod =
      selected.value;


    /*
      Save temporarily so checkout
      pages can use the selection.
    */

    localStorage.setItem(
      "paymentMethod",
      paymentMethod
    );


    localStorage.setItem(
      "checkoutType",
      type
    );


    if(itemId){

      localStorage.setItem(
        "checkoutId",
        itemId
      );

    }


    continueBtn.disabled =
      true;


    continueBtn.textContent =
      "Opening checkout...";


    /*
      Route to the correct checkout page.
    */

    let destination =
      "checkout.html";


    if(type === "course"){

      destination =
        "checkout-course.html";

    }else if(
      type === "marketplace"
    ){

      destination =
        "checkout-marketplace.html";

    }else if(
      type === "service"
    ){

      destination =
        "checkout-service.html";

    }else if(
      type === "marketing"
    ){

      destination =
        "checkout-marketing.html";

    }


    const query =
      new URLSearchParams();


    if(itemId){

      query.set(
        "id",
        itemId
      );

    }


    query.set(
      "method",
      paymentMethod
    );


    if(amount){

      query.set(
        "amount",
        amount
      );

    }


    if(currency){

      query.set(
        "currency",
        currency
      );

    }


    if(itemName){

      query.set(
        "name",
        itemName
      );

    }


    location.href =
      destination +
      "?" +
      query.toString();

  }
);


/* =========================
   RESTORE
========================= */

const savedMethod =
  localStorage.getItem(
    "paymentMethod"
  );


if(savedMethod){

  const radio =
    document.querySelector(
      `input[value="${CSS.escape(
        savedMethod
      )}"]`
    );


  if(radio){

    radio.checked =
      true;


    radio
      .closest(
        ".method"
      )
      .classList.add(
        "selected"
      );


    continueBtn.disabled =
      false;

  }

}


/* =========================
   MONEY
========================= */

function formatMoney(
  value,
  currency
){

  const number =
    Number(
      String(value)
        .replace(
          /[^0-9.-]/g,
          ""
        )
    );


  if(
    Number.isNaN(
      number
    )
  ){

    return (
      String(value) +
      " " +
      currency
    );

  }


  return (
    new Intl.NumberFormat(
      undefined,
      {
        maximumFractionDigits:0
      }
    ).format(
      number
    ) +
    " " +
    currency
  );

}


/* =========================
   STORAGE
========================= */

function getSaved(
  key
){

  return localStorage.getItem(
    key
  ) || "";

}

</script>

</body>
</html>
