<!DOCTYPE html>
<html>

<head>

<title>Payment Success | LetsStudy Pro</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
text-align:center;
}

.box{

background:white;
max-width:500px;
margin:100px auto;
padding:40px;
border-radius:20px;

}

button{

background:#0b57d0;
color:white;
border:0;
padding:12px 20px;
border-radius:8px;

}

</style>

</head>


<body>


<div class="box">

<h1>
✅ Payment Successful
</h1>


<p>
Your course access is being activated...
</p>


<button onclick="goCourses()">

Start Learning

</button>


</div>





<script type="module">


import {

auth,
db

}

from "./assets/js/firebase.js";


import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";




const params =
new URLSearchParams(
location.search
);


const courseId =
params.get("courseId");


const amount =
Number(
params.get("amount") || 0
);



onAuthStateChanged(

auth,

async(user)=>{


if(!user){

location.href="login.html";

return;

}



const payment = await addDoc(

collection(
db,
"payments"
),

{

userId:user.uid,

courseId,

amount,

status:"success",

createdAt:
serverTimestamp()

}

);






await addDoc(

collection(
db,
"orders"
),

{

userId:user.uid,

courseId,

amount,

paymentId:
payment.id,

status:"completed",

createdAt:
serverTimestamp()

}

);






await addDoc(

collection(
db,
"enrollments"
),

{

userId:user.uid,

courseId,

status:"active",

createdAt:
serverTimestamp()

}

);



});






window.goCourses=function(){

location.href="my-courses.html";

}


</script>


</body>

</html>
