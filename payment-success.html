<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Payment Success | LetsStudy Pro</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.card{
width:100%;
max-width:620px;
background:#fff;
border-radius:22px;
overflow:hidden;
box-shadow:0 20px 60px rgba(15,23,42,.12);
border:1px solid #e5e7eb;
}

.header{
background:linear-gradient(135deg,#047857,#10b981);
color:white;
padding:35px 25px;
text-align:center;
}

.icon{
width:72px;
height:72px;
margin:auto;
border-radius:50%;
background:#ffffff22;
border:2px solid #ffffff66;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
}

.header h1{
margin:15px 0 7px;
font-size:27px;
}

.header p{
margin:0;
font-size:12px;
color:#d1fae5;
}

.body{
padding:25px;
}

.status{
padding:14px;
border-radius:12px;
text-align:center;
font-size:12px;
font-weight:bold;
margin-bottom:18px;
}

.status.pending{
background:#fff7ed;
color:#c2410c;
}

.status.approved{
background:#dcfce7;
color:#15803d;
}

.status.failed{
background:#fee2e2;
color:#b91c1c;
}

.details{
border:1px solid #e5e7eb;
border-radius:14px;
overflow:hidden;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:13px;
border-bottom:1px solid #f1f5f9;
font-size:11px;
}

.row:last-child{
border-bottom:0;
}

.label{
color:#64748b;
}

.value{
font-weight:bold;
text-align:right;
word-break:break-word;
}

.amount{
font-size:16px;
color:#047857;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

button{
border:0;
border-radius:10px;
padding:12px;
font-size:11px;
font-weight:bold;
cursor:pointer;
}

.primary{
background:#2563eb;
color:white;
}

.secondary{
background:#eff6ff;
color:#1d4ed8;
}

.retry{
background:#fff7ed;
color:#c2410c;
}

.message{
font-size:10px;
color:#64748b;
text-align:center;
margin-top:15px;
line-height:1.6;
}

.loader{
width:32px;
height:32px;
border:4px solid #dbeafe;
border-top-color:#2563eb;
border-radius:50%;
animation:spin .8s linear infinite;
margin:15px auto;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.hidden{
display:none;
}

@media(max-width:600px){

body{
padding:10px;
}

.actions{
grid-template-columns:1fr;
}

.body{
padding:18px;
}

.header{
padding:30px 18px;
}

.row{
font-size:10px;
}

}

</style></head><body><div class="card"><div class="header"><div class="icon" id="icon">
✓
</div><h1 id="title">
Payment Successful
</h1><p id="subtitle">
We are confirming your payment.
</p></div><div class="body"><div
id="statusBox"
class="status pending">Checking payment status...

<div class="loader"></div></div><div
id="details"
class="details hidden"><div class="row"><span class="label">
Course
</span><span
id="courseName"
class="value">

</span></div><div class="row"><span class="label">
Amount
</span><span
id="amount"
class="value amount">

</span></div><div class="row"><span class="label">
Payment Method
</span><span
id="method"
class="value">

</span></div><div class="row"><span class="label">
Transaction ID
</span><span
id="transaction"
class="value">

</span></div><div class="row"><span class="label">
Payment Status
</span><span
id="paymentStatus"
class="value">

</span></div><div class="row"><span class="label">
Date
</span><span
id="date"
class="value">

</span></div></div><div
id="actions"
class="actions hidden"><button
class="primary"
id="courseBtn">

📚 Start Course

</button><button
class="secondary"
onclick="location.href='dashboard.html'">

🏠 Dashboard

</button></div><div
id="pendingActions"
class="actions"><button
class="secondary"
onclick="checkPayment()">

↻ Check Again

</button><button
class="secondary"
onclick="location.href='dashboard.html'">

🏠 Dashboard

</button></div><div
id="message"
class="message">Please wait while we confirm your payment.

</div></div></div><script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
 FIREBASE CONFIG
========================================= */

const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};


/* =========================================
 INITIALIZE FIREBASE
========================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================================
 URL PARAMETERS
========================================= */

const params =
new URLSearchParams(
window.location.search
);


const paymentId =
params.get("paymentId") ||
params.get("payment_id") ||
params.get("orderId") ||
params.get("order_id") ||
params.get("transactionId") ||
params.get("transaction_id");


const courseId =
params.get("courseId") ||
params.get("course_id");


/* =========================================
 STATE
========================================= */

let currentUser = null;

let payment = null;

let checking = false;

let checkCount = 0;


/* =========================================
 AUTH
========================================= */

onAuthStateChanged(
auth,
async user => {

if(!user){

location.href =
"login.html";

return;

}

currentUser = user;

await checkPayment();

}
);


/* =========================================
 CHECK PAYMENT
========================================= */

window.checkPayment =
async function(){

if(checking)
return;

if(!currentUser)
return;

if(!paymentId){

showFailed(
"Payment reference was not found."
);

return;

}


checking = true;

setCheckingUI();


try{

const paymentRef =
doc(
db,
"payments",
paymentId
);


const snap =
await getDoc(paymentRef);


if(!snap.exists()){

showFailed(
"Payment record was not found."
);

checking = false;

return;

}


payment = {

id:snap.id,

...snap.data()

};


/* =====================================
 SECURITY CHECK
===================================== */

if(
payment.userId &&
payment.userId !==
currentUser.uid
){

showFailed(
"You are not authorized to view this payment."
);

checking = false;

return;

}


/* =====================================
 SHOW DETAILS
===================================== */

showPaymentDetails();


/* =====================================
 STATUS
===================================== */

const status =
String(
payment.status ||
payment.paymentStatus ||
"pending"
)
.toLowerCase();


if(
status === "approved" ||
status === "completed" ||
status === "success" ||
status === "successful"
){

showApproved();

}else if(
status === "failed" ||
status === "cancelled" ||
status === "canceled" ||
status === "rejected"
){

showFailed(
"Your payment was not approved."
);

}else{

showPending();

}


/* =====================================
 STOP
===================================== */

checking = false;

}catch(error){

console.error(
"Payment check error:",
error
);

showFailed(
"Unable to verify payment right now."
);

checking = false;

}

};


/* =========================================
 SHOW PAYMENT DETAILS
========================================= */

function showPaymentDetails(){

document
.getElementById("details")
.classList.remove("hidden");


const amount =
Number(
payment.amount ||
payment.total ||
payment.price ||
0
);


const currency =
payment.currency ||
"TZS";


document
.getElementById("courseName")
.textContent =
payment.courseName ||
payment.courseTitle ||
"Course";


document
.getElementById("amount")
.textContent =
currency +
" " +
amount.toLocaleString();


document
.getElementById("method")
.textContent =
payment.paymentMethod ||
payment.method ||
"Online Payment";


document
.getElementById("transaction")
.textContent =
payment.transactionId ||
payment.reference ||
payment.orderId ||
payment.id;


document
.getElementById("paymentStatus")
.textContent =
payment.status ||
payment.paymentStatus ||
"Pending";


document
.getElementById("date")
.textContent =
formatDate(
payment.createdAt ||
payment.paidAt ||
payment.updatedAt
);

}


/* =========================================
 APPROVED
========================================= */

function showApproved(){

const statusBox =
document.getElementById(
"statusBox"
);


statusBox.className =
"status approved";


statusBox.innerHTML =
"✓ Payment Approved";


document
.getElementById("icon")
.textContent =
"✓";


document
.getElementById("title")
.textContent =
"Payment Approved!";


document
.getElementById("subtitle")
.textContent =
"Your payment has been successfully confirmed.";


document
.getElementById(
"pendingActions"
)
.classList.add("hidden");


document
.getElementById(
"actions"
)
.classList.remove("hidden");


document
.getElementById(
"message"
)
.textContent =
"Your course access is now available.";


/* =====================================
 COURSE LINK
===================================== */

const id =
payment.courseId ||
courseId;


const button =
document.getElementById(
"courseBtn"
);


if(id){

button.onclick =
()=>{

location.href =
"course-learning.html?courseId="+
encodeURIComponent(id);

};

}else{

button.textContent =
"📚 My Courses";

button.onclick =
()=>{

location.href =
"my-courses.html";

};

}

}


/* =========================================
 PENDING
========================================= */

function showPending(){

const statusBox =
document.getElementById(
"statusBox"
);


statusBox.className =
"status pending";


statusBox.innerHTML =
"⏳ Payment Pending";


document
.getElementById("icon")
.textContent =
"⏳";


document
.getElementById("title")
.textContent =
"Payment Being Confirmed";


document
.getElementById("subtitle")
.textContent =
"We received your payment request.";


document
.getElementById(
"pendingActions"
)
.classList.remove("hidden");


document
.getElementById(
"actions"
)
.classList.add("hidden");


document
.getElementById(
"message"
)
.textContent =
"Automatic approval will happen after the payment gateway confirms the transaction.";

}


/* =========================================
 FAILED
========================================= */

function showFailed(message){

const statusBox =
document.getElementById(
"statusBox"
);


statusBox.className =
"status failed";


statusBox.innerHTML =
"✕ Payment Not Approved";


document
.getElementById("icon")
.textContent =
"✕";


document
.getElementById("title")
.textContent =
"Payment Not Approved";


document
.getElementById("subtitle")
.textContent =
"Please check your payment details.";


document
.getElementById(
"actions"
)
.classList.add("hidden");


document
.getElementById(
"pendingActions"
)
.classList.remove("hidden");


document
.getElementById(
"message"
)
.textContent =
message;

}


/* =========================================
 CHECKING UI
========================================= */

function setCheckingUI(){

const box =
document.getElementById(
"statusBox"
);


box.className =
"status pending";


box.innerHTML = `
Checking payment status...
<div class="loader"></div>
`;

}


/* =========================================
 AUTO CHECK
========================================= */

/*
If payment is still pending,
check automatically every 5 seconds.

Maximum 12 attempts = about 1 minute.
*/

const autoCheck =
setInterval(
async ()=>{

if(!currentUser)
return;

if(!payment)
return;

const status =
String(
payment.status ||
payment.paymentStatus ||
"pending"
)
.toLowerCase();


if(
status === "approved" ||
status === "completed" ||
status === "success" ||
status === "successful"
){

clearInterval(autoCheck);

return;

}


if(checkCount >= 12){

clearInterval(autoCheck);

document
.getElementById("message")
.textContent =
"Payment confirmation is taking longer than expected. You can check again later.";

return;

}


checkCount++;

await checkPayment();

},
5000
);


/* =========================================
 DATE
========================================= */

function formatDate(value){

if(!value)
return "-";


try{

let date;


if(
typeof value.toDate ===
"function"
){

date =
value.toDate();

}else if(
typeof value.toMillis ===
"function"
){

date =
new Date(
value.toMillis()
);

}else{

date =
new Date(value);

}


if(
isNaN(date.getTime())
)
return "-";


return date.toLocaleString(
[],
{
day:"2-digit",
month:"short",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);


}catch{

return "-";

}

}

</script></body>
</html>
