  <meta charset="UTF-8">

  <meta
    name="viewport"

  >

  <title>LetsStudy Pro - Secure Payment</title>

  <meta
    name="description"
    content="Secure payment for LetsStudy Pro"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    body {
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }

    .subtitle {
      margin-top: 6px;
      color: #6b7280;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    .title {
      margin: 0 0 20px;
      font-size: 22px;
      font-weight: 800;
    }

    .details {
      display: grid;
      gap: 14px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 13px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .label {
      color: #6b7280;
      font-size: 14px;
    }

    .value {
      text-align: right;
      font-weight: 700;
      word-break: break-word;
    }

    .email-value {
      color: #2563eb;
    }

    .status {
      display: none;
      padding: 14px 16px;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.info {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
    }

    .status.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
    }

    .email-box {
      display: none;
      margin-top: 20px;
    }

    .email-box.show {
      display: block;
    }

    .email-box label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .email-input {
      width: 100%;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
    }

    .email-input:focus {
      border-color: #2563eb;
      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 18px;
      margin-top: 20px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .payment-frame {
      display: none;
      width: 100%;
      height: 760px;
      border: 0;
      border-radius: 14px;
      background: #ffffff;
    }

    .frame-wrapper {
      display: none;
      margin-top: 20px;
    }

    .frame-wrapper.show {
      display: block;
    }

    .secure-note {
      text-align: center;
      margin-top: 14px;
      color: #6b7280;
      font-size: 13px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 18px;
      }

      .row {
        flex-direction: column;
        gap: 5px;
      }

      .value {
        text-align: left;
      }

      .payment-frame {
        height: 700px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="header">
      <div class="brand">
        LetsStudy Pro
      </div>

      <div class="subtitle">
        Secure Payment
      </div>
    </header>

    <section class="card">

      <h1 class="title">
        Order Details
      </h1>

      <div class="details">

        <div class="row">
          <span class="label">
            Order
          </span>

          <span
            class="value"
            id="orderDisplay"
          >
            -
          </span>
        </div>

        <div class="row">
          <span class="label">
            Product
          </span>

          <span
            class="value"
            id="productDisplay"
          >
            -
          </span>
        </div>

        <div class="row">
          <span class="label">
            Amount
          </span>

          <span
            class="value"
            id="amountDisplay"
          >
            -
          </span>
        </div>

        <div class="row">
          <span class="label">
            Currency
          </span>

          <span
            class="value"
            id="currencyDisplay"
          >
            -
          </span>
        </div>

        <div class="row">
          <span class="label">
            Email
          </span>

          <span
            class="value email-value"
            id="emailDisplay"
          >
            -
          </span>
        </div>

      </div>

      <div
        id="emailBox"
        class="email-box"
      >
        <label for="emailInput">
          Enter your email
        </label>

        <input
          id="emailInput"
          class="email-input"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
        >
      </div>

      <div
        id="status"
        class="status"
      ></div>

      <button
        id="payButton"
        class="button"
        type="button"
      >
        Continue to Secure Payment
      </button>

    </section>


    <section
      id="frameSection"
      class="card frame-wrapper"
    >

      <h2 class="title">
        Complete Payment
      </h2>

      <iframe
        id="paymentFrame"
        class="payment-frame"
        title="Pesapal Secure Payment"
        allow="payment"
        allowpaymentrequest
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>

      <div class="secure-note">
        Payment is processed securely by Pesapal.
      </div>

    </section>

  </main>


  <script type="module">

    /*
     * ============================================================
     * CONFIGURATION
     * ============================================================
     */

    const API_BASE =
      "https://api.letsstudy.pro";


    /*
     * ============================================================
     * DOM
     * ============================================================
     */

    const orderDisplay =
      document.getElementById("orderDisplay");

    const productDisplay =
      document.getElementById("productDisplay");

    const amountDisplay =
      document.getElementById("amountDisplay");

    const currencyDisplay =
      document.getElementById("currencyDisplay");

    const emailDisplay =
      document.getElementById("emailDisplay");

    const emailBox =
      document.getElementById("emailBox");

    const emailInput =
      document.getElementById("emailInput");

    const payButton =
      document.getElementById("payButton");

    const statusBox =
      document.getElementById("status");

    const frameSection =
      document.getElementById("frameSection");

    const paymentFrame =
      document.getElementById("paymentFrame");


    /*
     * ============================================================
     * HELPERS
     * ============================================================
     */

    function getParam(...names) {

      const params =
        new URLSearchParams(
          window.location.search
        );

      for (const name of names) {

        const value =
          params.get(name);

        if (
          value !== null &&
          String(value).trim() !== ""
        ) {
          return String(value).trim();
        }
      }

      return "";
    }


    function clean(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value).trim();
    }


    function isValidEmail(email) {

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email);
    }


    function formatAmount(amount) {

      const number =
        Number(
          String(amount)
            .replace(/,/g, "")
        );

      if (
        Number.isNaN(number)
      ) {
        return amount;
      }

      return number.toLocaleString(
        "en-US"
      );
    }


    function showStatus(
      message,
      type = "info"
    ) {

      statusBox.textContent =
        message;

      statusBox.className =
        "status " + type;
    }


    function setLoading(
      loading
    ) {

      if (loading) {

        payButton.disabled = true;

        payButton.innerHTML =
          '<span class="spinner"></span>' +
          'Creating Secure Payment...';

      } else {

        payButton.disabled = false;

        payButton.textContent =
          "Continue to Secure Payment";
      }
    }


    /*
     * ============================================================
     * READ ORDER
     * ============================================================
     */

    const orderId =
      clean(
        getParam(
          "orderId",
          "id",
          "merchantReference",
          "reference"
        )
      );


    const product =
      clean(
        getParam(
          "product",
          "productName",
          "name"
        )
      ) ||
      "LetsStudy Pro Product";


    const amount =
      clean(
        getParam(
          "amount",
          "price",
          "total"
        )
      );


    const currency =
      clean(
        getParam(
          "currency"
        )
      ) ||
      "TZS";


    const firstName =
      clean(
        getParam(
          "firstName",
          "firstname",
          "first_name"
        )
      );


    const lastName =
      clean(
        getParam(
          "lastName",
          "lastname",
          "last_name"
        )
      );


    const phoneNumber =
      clean(
        getParam(
          "phone",
          "phoneNumber",
          "phone_number",
          "mobile"
        )
      );


    /*
     * IMPORTANT:
     *
     * We check ALL common email parameter names.
     *
     * This prevents:
     *
     * payment.html?customerEmail=...
     *
     * from becoming:
     *
     * Email -
     *
     */

    let email =
      clean(
        getParam(
          "email",
          "customerEmail",
          "customer_email",
          "userEmail",
          "user_email",
          "buyerEmail",
          "buyer_email"
        )
      );


    /*
     * ============================================================
     * DISPLAY ORDER
     * ============================================================
     */

    orderDisplay.textContent =
      orderId || "-";

    productDisplay.textContent =
      product;

    amountDisplay.textContent =
      formatAmount(amount);

    currencyDisplay.textContent =
      currency;


    /*
     * ============================================================
     * FIREBASE AUTH EMAIL
     *
     * This is a secondary fallback.
     * URL email remains the first source.
     * ============================================================
     */

    async function getFirebaseAuthEmail() {

      try {

        const {
          initializeApp,
          getApps
        } = await import(
          "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js"
        );


        const {
          getAuth,
          onAuthStateChanged
        } = await import(
          "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js"
        );


        const firebaseConfig = {

          apiKey:
            "AIzaSyBcOYDfAVKXbkljsyRgI0rjodBn678tCc",

          authDomain:
            "let-s-study-pro-course.firebaseapp.com",

          databaseURL:
            "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

          projectId:
            "let-s-study-pro-course",

          storageBucket:
            "let-s-study-pro-course.firebasestorage.app",

          messagingSenderId:
            "104334849153",

          appId:
            "1:104334849153:web:letsstudypro"

        };


        const app =
          getApps().length
            ? getApps()[0]
            : initializeApp(
                firebaseConfig
              );


        const auth =
          getAuth(app);


        return new Promise(
          resolve => {

            let finished = false;


            const unsubscribe =
              onAuthStateChanged(
                auth,
                user => {

                  if (finished) {
                    return;
                  }

                  finished = true;

                  unsubscribe();

                  resolve(
                    user?.email || ""
                  );
                }
              );


            setTimeout(
              () => {

                if (finished) {
                  return;
                }

                finished = true;

                unsubscribe();

                resolve("");

              },
              2500
            );

          }
        );

      } catch (error) {

        console.warn(
          "Firebase Auth email lookup failed:",
          error
        );

        return "";

      }

    }


    /*
     * ============================================================
     * INITIAL EMAIL
     * ============================================================
     */

    async function resolveEmail() {

      /*
       * 1. URL email
       */

      if (
        isValidEmail(email)
      ) {

        emailDisplay.textContent =
          email;

        emailInput.value =
          email;

        return email;
      }


      /*
       * 2. Firebase Auth email
       */

      const authEmail =
        await getFirebaseAuthEmail();


      if (
        isValidEmail(authEmail)
      ) {

        email =
          authEmail;

        emailDisplay.textContent =
          email;

        emailInput.value =
          email;

        return email;
      }


      /*
       * 3. No email found
       */

      emailDisplay.textContent =
        "Required";

      emailBox.classList.add(
        "show"
      );

      return "";

    }


    await resolveEmail();


    /*
     * ============================================================
     * LOCAL STORAGE FALLBACK
     * ============================================================
     */

    if (
      !isValidEmail(email)
    ) {

      try {

        const previous =
          JSON.parse(
            localStorage.getItem(
              "letsStudyPayment"
            ) || "null"
          );


        if (
          previous &&
          isValidEmail(
            previous.email
          )
        ) {

          email =
            previous.email;

          emailDisplay.textContent =
            email;

          emailInput.value =
            email;

          emailBox.classList.remove(
            "show"
          );

        }

      } catch (error) {

        console.warn(
          "Local payment recovery failed:",
          error
        );

      }

    }


    /*
     * ============================================================
     * REQUIRE ORDER
     * ============================================================
     */

    if (!orderId) {

      payButton.disabled = true;

      showStatus(
        "Order ID is missing. Please return to the order page and try again.",
        "error"
      );

    }


    /*
     * ============================================================
     * CREATE PESAPAL ORDER
     * ============================================================
     */

    let currentOrderTrackingId =
      "";


    async function createPesapalOrder() {

      if (!orderId) {

        showStatus(
          "Order ID is missing.",
          "error"
        );

        return;

      }


      /*
       * Get email from input if necessary.
       */

      if (
        !isValidEmail(email)
      ) {

        const typedEmail =
          clean(
            emailInput.value
          );


        if (
          isValidEmail(typedEmail)
        ) {

          email =
            typedEmail;

        }

      }


      /*
       * EMAIL IS MANDATORY.
       */

      if (
        !isValidEmail(email)
      ) {

        emailBox.classList.add(
          "show"
        );

        emailInput.focus();

        showStatus(
          "Email is required. Enter a valid email address to continue.",
          "error"
        );

        return;

      }


      /*
       * Validate amount.
       */

      const numericAmount =
        Number(
          String(amount)
            .replace(/,/g, "")
        );


      if (
        !numericAmount ||
        numericAmount <= 0
      ) {

        showStatus(
          "Invalid payment amount.",
          "error"
        );

        return;

      }


      setLoading(true);

      showStatus(
        "Creating your secure Pesapal payment...",
        "info"
      );


      try {

        const payload = {

          orderId:
            orderId,

          product:
            product,

          description:
            product,

          amount:
            numericAmount,

          currency:
            currency,

          email:
            email,

          firstName:
            firstName ||
            "LetsStudy",

          lastName:
            lastName ||
            "Pro",

          phoneNumber:
            phoneNumber

        };


        console.log(
          "Sending payment order:",
          payload
        );


        const response =
          await fetch(
            API_BASE +
            "/api/pesapal/create-order",
            {
              method: "POST",

              headers: {
                "Accept":
                  "application/json",

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  payload
                )
            }
          );


        const text =
          await response.text();


        let result;

        try {

          result =
            JSON.parse(text);

        } catch {

          throw new Error(
            "Payment API returned invalid JSON: " +
            text
          );

        }


        console.log(
          "Pesapal create-order response:",
          result
        );


        if (
          !response.ok
        ) {

          throw new Error(
            result.message ||
            result.error ||
            "Unable to create payment order."
          );

        }


        if (
          !result.success
        ) {

          throw new Error(
            result.message ||
            result.error ||
            "Pesapal order creation failed."
          );

        }


        /*
         * ========================================================
         * THIS IS THE IMPORTANT PART
         *
         * Pesapal gives us OrderTrackingId.
         *
         * The iframe URL MUST come from the API response.
         * ========================================================
         */

        const orderTrackingId =
  result.orderTrackingId ||
  result.OrderTrackingId ||
  result.order_tracking_id ||
  "";

const iframeUrl =
  result.iframeUrl ||
  result.redirectUrl ||
  result.redirect_url ||
  result.iframe ||
  "";

if (!orderTrackingId) {
  throw new Error(
    "Pesapal did not return OrderTrackingId."
  );
}

if (!iframeUrl) {
  throw new Error(
    "Pesapal did not return payment iframe URL."
  );
}

currentOrderTrackingId =
  orderTrackingId;

/* =========================================================
   SAVE PAYMENT SESSION
   ========================================================= */

localStorage.setItem(
  "letsStudyPayment",
  JSON.stringify({
    orderId: orderId,
    orderTrackingId: orderTrackingId,
    merchantReference:
      result.merchantReference ||
      result.merchant_reference ||
      orderId,
    product: product,
    amount: numericAmount,
    currency: currency,
    email: email,
    firstName: firstName,
    lastName: lastName,
    phoneNumber: phoneNumber,
    createdAt: Date.now()
  })
);

/* =========================================================
   UPDATE EMAIL DISPLAY
   ========================================================= */

emailDisplay.textContent =
  email;

/* =========================================================
   OPEN REAL PESAPAL PAYMENT FRAME
   ========================================================= */

paymentFrame.src =
  iframeUrl;

frameSection.classList.add(
  "show"
);

/* Hide create-payment button */
payButton.style.display =
  "none";

emailBox.classList.remove(
  "show"
);

showStatus(
  "Payment created successfully. Complete your payment below.",
  "success"
);

/* =========================================================
   SCROLL TO PAYMENT
   ========================================================= */

setTimeout(() => {

  frameSection.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}, 300);

/* =========================================================
   START PAYMENT VERIFICATION
   ========================================================= */

startPaymentVerification(
  orderTrackingId
);

} catch (error) {

  console.error(
    "Payment creation error:",
    error
  );

  showStatus(
    error.message ||
    "Unable to create payment.",
    "error"
  );

  setLoading(false);
}

}


/* ============================================================
   PAYMENT VERIFICATION
   ============================================================ */

let verificationTimer = null;

function startPaymentVerification(
  orderTrackingId
) {

  if (verificationTimer) {

    clearInterval(
      verificationTimer
    );

  }

  let attempts = 0;

  const maxAttempts = 240;

  async function checkPaymentStatus() {

    attempts++;

    try {

      const response =
        await fetch(
          API_BASE +
          "/api/pesapal/payment-status" +
          "?orderTrackingId=" +
          encodeURIComponent(
            orderTrackingId
          ),
          {
            method: "GET",

            headers: {
              "Accept":
                "application/json"
            },

            cache: "no-store"
          }
        );

      const responseText =
        await response.text();

      let result;

      try {

        result =
          JSON.parse(
            responseText
          );

      } catch {

        console.warn(
          "Invalid payment status response:",
          responseText
        );

        return;
      }

      console.log(
        "Payment status:",
        result
      );

      const status =
        String(
          result.status ||
          result.paymentStatus ||
          ""
        ).toUpperCase();


      /* ======================================================
         PAYMENT COMPLETED
         ====================================================== */

      if (
        result.verified === true ||
        status === "COMPLETED" ||
        status === "COMPLETED_PAYMENT" ||
        status === "1"
      ) {

        if (verificationTimer) {

          clearInterval(
            verificationTimer
          );

          verificationTimer =
            null;
        }

        const finalEmail =
          result.email ||
          email;

        const merchantReference =
          result.merchantReference ||
          result.merchant_reference ||
          orderId;

        showStatus(
          "Payment verified successfully. Redirecting...",
          "success"
        );

        const successParams =
          new URLSearchParams();

        successParams.set(
          "orderId",
          orderId
        );

        successParams.set(
          "OrderTrackingId",
          orderTrackingId
        );

        successParams.set(
          "merchantReference",
          merchantReference
        );

        successParams.set(
          "email",
          finalEmail
        );

        successParams.set(
          "amount",
          String(
            numericAmountSafe()
          )
        );

        successParams.set(
          "currency",
          currency
        );

        setTimeout(() => {

          window.location.href =
            "success.html?" +
            successParams.toString();

        }, 1000);

        return;
      }


      /* ======================================================
         PAYMENT FAILED
         ====================================================== */

      if (
        status === "FAILED" ||
        status === "REVERSED" ||
        status === "INVALID" ||
        status === "CANCELLED" ||
        status === "0" ||
        status === "2" ||
        status === "3"
      ) {

        if (verificationTimer) {

          clearInterval(
            verificationTimer
          );

          verificationTimer =
            null;
        }

        showStatus(
          "Payment was not completed. Please try again.",
          "error"
        );

        return;
      }


      /* ======================================================
         PAYMENT STILL PENDING
         ====================================================== */

      if (
        attempts % 3 === 0
      ) {

        showStatus(
          "Waiting for Pesapal payment confirmation...",
          "info"
        );

      }


      /* ======================================================
         STOP VERY LONG POLLING
         ====================================================== */

      if (
        attempts >= maxAttempts
      ) {

        if (verificationTimer) {

          clearInterval(
            verificationTimer
          );

          verificationTimer =
            null;
        }

        showStatus(
          "Payment verification is taking longer than expected. Your payment can still be checked using the Order Tracking ID.",
          "info"
        );

      }

    } catch (error) {

      console.warn(
        "Payment verification error:",
        error
      );

    }

  }


  /*
   * Check immediately.
   */

  checkPaymentStatus();


  /*
   * Then check every 5 seconds.
   */

  verificationTimer =
    setInterval(
      checkPaymentStatus,
      5000
    );

}


/* ============================================================
   SAFE AMOUNT
   ============================================================ */

function numericAmountSafe() {

  const value =
    Number(
      String(amount)
        .replace(/,/g, "")
    );

  if (
    Number.isFinite(value)
  ) {

    return value;

  }

  return 0;
}


/* ============================================================
   PAY BUTTON
   ============================================================ */

payButton.addEventListener(
  "click",
  createPesapalOrder
);


/* ============================================================
   EMAIL INPUT
   ============================================================ */

emailInput.addEventListener(
  "input",
  function () {

    const value =
      clean(
        emailInput.value
      );

    if (
      isValidEmail(value)
    ) {

      email =
        value;

      emailDisplay.textContent =
        value;

      statusBox.className =
        "status";

    }

  }
);


/* ============================================================
   ENTER KEY FOR EMAIL
   ============================================================ */

emailInput.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      createPesapalOrder();

    }

  }
);


/* ============================================================
   RECOVER PREVIOUS PAYMENT
   ============================================================ */

try {

  const savedPayment =
    JSON.parse(
      localStorage.getItem(
        "letsStudyPayment"
      ) || "null"
    );

  if (
    savedPayment &&
    savedPayment.orderId === orderId &&
    savedPayment.orderTrackingId
  ) {

    currentOrderTrackingId =
      savedPayment.orderTrackingId;

    if (
      isValidEmail(
        savedPayment.email
      ) &&
      !isValidEmail(email)
    ) {

      email =
        savedPayment.email;

      emailDisplay.textContent =
        email;

      emailInput.value =
        email;

    }

  }

} catch (error) {

  console.warn(
    "Payment recovery failed:",
    error
  );

}


/* ============================================================
   PAGE INITIALIZATION
   ============================================================ */

if (
  !orderId
) {

  payButton.disabled =
    true;

  showStatus(
    "Order ID is missing. Please return to the order page and try again.",
    "error"
  );

}


/* ============================================================
   FINAL DEBUG INFORMATION
   ============================================================ */

console.log(
  "LetsStudy Pro Payment initialized",
  {
    orderId: orderId,
    product: product,
    amount: amount,
    currency: currency,
    email: email
  }
);
