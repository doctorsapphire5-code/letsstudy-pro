<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>
  Payment | LetsStudy Pro
</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

.header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:18px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  text-decoration:none;
  color:#111827;
  font-size:22px;
  font-weight:900;
}

.logo span{
  color:#2563eb;
}

.back{
  text-decoration:none;
  color:#2563eb;
  font-weight:700;
  font-size:14px;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 18px;
}

.title{
  margin-bottom:20px;
}

.title h1{
  font-size:30px;
}

.title p{
  margin-top:7px;
  color:#6b7280;
}

.payment-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:
    0 10px 30px
    rgba(0,0,0,.06);
}

.payment-header{
  padding:18px 20px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.payment-header strong{
  font-size:15px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#6b7280;
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#f59e0b;
}

.iframe-wrap{
  position:relative;
  width:100%;
  min-height:700px;
  background:#fff;
}

#pesapalFrame{
  display:block;
  width:100%;
  height:700px;
  border:0;
}

.loader{
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  flex-direction:column;
  gap:12px;
}

.spinner{
  width:38px;
  height:38px;
  border:4px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.error{
  display:none;
  margin:20px;
  padding:15px;
  border-radius:10px;
  background:#fee2e2;
  color:#991b1b;
  font-size:14px;
}

@media(max-width:600px){

  .container{
    margin:15px auto;
    padding:0 10px;
  }

  .title h1{
    font-size:25px;
  }

  .payment-card{
    border-radius:12px;
  }

  #pesapalFrame{
    height:720px;
  }

}

</style>

</head>


<body>


<header class="header">

  <a
    href="index.html"
    class="logo"
  >
    LetsStudy <span>Pro</span>
  </a>

  <a
    href="cart.html"
    class="back"
  >
    ← Cart
  </a>

</header>



<main class="container">

  <div class="title">

    <h1>
      Complete Payment
    </h1>

    <p>
      Choose your preferred payment
      method below.
    </p>

  </div>


  <section class="payment-card">


    <div class="payment-header">

      <strong>
        Secure Payment
      </strong>


      <div class="status">

        <span
          id="statusDot"
          class="dot"
        ></span>

        <span id="statusText">
          Loading payment...
        </span>

      </div>

    </div>


    <div class="iframe-wrap">


      <div
        id="loader"
        class="loader"
      >

        <div class="spinner"></div>

        <span>
          Loading secure payment...
        </span>

      </div>


      <iframe
        id="pesapalFrame"
        title="Pesapal Secure Payment"
        allow="payment"
        allowpaymentrequest
        loading="eager"
      ></iframe>


    </div>


    <div
      id="errorBox"
      class="error"
    ></div>


  </section>

</main>



<script>

/* =========================================
   PESAPAL PAYMENT URL
========================================= */

const PESAPAL_PAYMENT_URL =
  "https://cybqa.pesapal.com/pesapaliframe/PesapalIframe3/Index?OrderTrackingId=1b94d3d2-c618-4c03-b142-da043951e0fd";


const iframe =
  document.getElementById(
    "pesapalFrame"
  );


const loader =
  document.getElementById(
    "loader"
  );


const statusText =
  document.getElementById(
    "statusText"
  );


const statusDot =
  document.getElementById(
    "statusDot"
  );


const errorBox =
  document.getElementById(
    "errorBox"
  );


/* =========================================
   OPEN PESAPAL IN BACKGROUND
========================================= */

iframe.src =
  PESAPAL_PAYMENT_URL;


/* =========================================
   IFRAME LOADED
========================================= */

iframe.addEventListener(
  "load",
  () => {

    loader.style.display =
      "none";


    statusText.textContent =
      "Payment ready";


    statusDot.style.background =
      "#16a34a";

  }
);


/* =========================================
   IFRAME ERROR
========================================= */

iframe.addEventListener(
  "error",
  () => {

    loader.style.display =
      "none";


    statusText.textContent =
      "Payment unavailable";


    statusDot.style.background =
      "#dc2626";


    errorBox.textContent =
      "Unable to load the Pesapal payment page. Please try again.";


    errorBox.style.display =
      "block";

  }
);

</script>


</body>

</html>
