<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LetsStudy Pro - Secure Payment</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#f5f7fb;
  font-family:Arial,Helvetica,sans-serif;
  color:#111827
}
.container{
  width:100%;
  max-width:850px;
  margin:auto
}
.header{
  text-align:center;
  margin-bottom:20px
}
.brand{
  font-size:28px;
  font-weight:800
}
.subtitle{
  color:#6b7280;
  margin-top:5px
}
.card{
  background:#fff;
  border-radius:18px;
  padding:24px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
  margin-bottom:20px
}
h1,h2{
  margin-top:0
}
.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:14px 0;
  border-bottom:1px solid #eee
}
.label{
  color:#6b7280
}
.value{
  font-weight:700;
  text-align:right;
  word-break:break-word
}
.email{
  color:#2563eb
}
input{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  outline:none
}
input:focus{
  border-color:#2563eb
}
.emailBox{
  margin-top:20px
}
button{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:15px;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:20px
}
button:disabled{
  opacity:.6
}
.status{
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  display:none;
  line-height:1.5
}
.status.show{
  display:block
}
.info{
  background:#eff6ff;
  color:#1d4ed8
}
.success{
  background:#ecfdf5;
  color:#047857
}
.error{
  background:#fef2f2;
  color:#b91c1c
}
.frameCard{
  display:none
}
.frameCard.show{
  display:block
}
iframe{
  width:100%;
  height:720px;
  border:0;
  border-radius:12px;
  background:#fff
}
.note{
  text-align:center;
  color:#6b7280;
  font-size:13px;
  margin-top:10px
}
@media(max-width:600px){
  body{padding:10px}
  .card{padding:18px}
  .row{
    flex-direction:column;
    gap:5px
  }
  .value{text-align:left}
  iframe{height:700px}
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="brand">LetsStudy Pro</div>
    <div class="subtitle">Secure Payment</div>
  </div>

  <div class="card">

    <h1>Order Details</h1>

    <div class="row">
      <span class="label">Order</span>
      <span class="value" id="order">-</span>
    </div>

    <div class="row">
      <span class="label">Product</span>
      <span class="value" id="product">-</span>
    </div>

    <div class="row">
      <span class="label">Amount</span>
      <span class="value" id="amount">-</span>
    </div>

    <div class="row">
      <span class="label">Currency</span>
      <span class="value" id="currency">TZS</span>
    </div>

    <div class="row">
      <span class="label">Email</span>
      <span class="value email" id="email">-</span>
    </div>

    <div class="emailBox" id="emailBox">
      <label for="emailInput">
        Email address
      </label>

      <input
        id="emailInput"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
      >
    </div>

    <div id="status" class="status"></div>

    <button id="payButton">
      Continue to Secure Payment
    </button>

  </div>


  <div class="card frameCard" id="frameCard">

    <h2>Complete Payment</h2>

    <iframe
      id="paymentFrame"
      title="Pesapal Secure Payment"
      allow="payment"
      allowpaymentrequest
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <div class="note">
      Payment is processed securely by Pesapal.
    </div>

  </div>

</div>


<script>

const API =
  "https://api.letsstudy.pro";


/* =========================================================
   GET URL PARAMETERS
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const orderId =
  params.get("orderId") ||
  params.get("id") ||
  "";


const product =
  params.get("product") ||
  "LetsStudy Pro Product";


const amount =
  params.get("amount") ||
  "0";


const currency =
  params.get("currency") ||
  "TZS";


let email =
  params.get("email") ||
  params.get("customerEmail") ||
  params.get("userEmail") ||
  "";


const firstName =
  params.get("firstName") ||
  "LetsStudy";


const lastName =
  params.get("lastName") ||
  "Pro";


const phoneNumber =
  params.get("phone") ||
  params.get("phoneNumber") ||
  "";


/* =========================================================
   ELEMENTS
   ========================================================= */

const orderEl =
  document.getElementById("order");

const productEl =
  document.getElementById("product");

const amountEl =
  document.getElementById("amount");

const currencyEl =
  document.getElementById("currency");

const emailEl =
  document.getElementById("email");

const emailBox =
  document.getElementById("emailBox");

const emailInput =
  document.getElementById("emailInput");

const statusEl =
  document.getElementById("status");

const payButton =
  document.getElementById("payButton");

const frameCard =
  document.getElementById("frameCard");

const paymentFrame =
  document.getElementById("paymentFrame");


/* =========================================================
   DISPLAY
   ========================================================= */

orderEl.textContent =
  orderId || "-";

productEl.textContent =
  product;

amountEl.textContent =
  Number(
    String(amount).replace(/,/g,"")
  ).toLocaleString();

currencyEl.textContent =
  currency;


/* =========================================================
   EMAIL
   ========================================================= */

function validEmail(value){

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(value);

}


if(validEmail(email)){

  emailEl.textContent =
    email;

  emailInput.value =
    email;

  emailBox.style.display =
    "none";

}else{

  emailEl.textContent =
    "Required";

  emailBox.style.display =
    "block";

}


/* =========================================================
   STATUS
   ========================================================= */

function status(message,type){

  statusEl.textContent =
    message;

  statusEl.className =
    "status show " + type;

}


/* =========================================================
   CREATE ORDER
   ========================================================= */

let orderTrackingId =
  "";

let verificationTimer =
  null;


async function createPayment(){

  if(!validEmail(email)){

    email =
      emailInput.value.trim();

  }


  if(!validEmail(email)){

    emailBox.style.display =
      "block";

    emailInput.focus();

    status(
      "Email is required.",
      "error"
    );

    return;

  }


  const numericAmount =
    Number(
      String(amount).replace(/,/g,"")
    );


  if(!numericAmount || numericAmount <= 0){

    status(
      "Invalid payment amount.",
      "error"
    );

    return;

  }


  payButton.disabled =
    true;

  payButton.textContent =
    "Creating Payment...";


  status(
    "Creating your secure Pesapal payment...",
    "info"
  );


  try{

    const response =
      await fetch(
        API +
        "/api/pesapal/create-order",
        {
          method:"POST",

          headers:{
            "Accept":
              "application/json",

            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            orderId:
              orderId,

            product:
              product,

            description:
              product,

            amount:
              numericAmount,

            currency:
              currency,

            email:
              email,

            firstName:
              firstName,

            lastName:
              lastName,

            phoneNumber:
              phoneNumber

          })
        }
      );


    const result =
      await response.json();


    console.log(
      "Pesapal order:",
      result
    );


    if(!response.ok){

      throw new Error(
        result.message ||
        result.error ||
        "Unable to create payment."
      );

    }


    /*
     * IMPORTANT
     */

    orderTrackingId =
      result.orderTrackingId ||
      result.OrderTrackingId ||
      result.order_tracking_id ||
      "";


    const iframeUrl =
      result.iframeUrl ||
      result.redirectUrl ||
      result.redirect_url ||
      result.iframe ||
      "";


    if(!orderTrackingId){

      throw new Error(
        "Pesapal did not return OrderTrackingId."
      );

    }


    if(!iframeUrl){

      throw new Error(
        "Pesapal did not return the payment URL."
      );

    }


    /* =====================================================
       SAVE SESSION
       ===================================================== */

    localStorage.setItem(
      "letsStudyPayment",
      JSON.stringify({

        orderId:
          orderId,

        orderTrackingId:
          orderTrackingId,

        merchantReference:
          result.merchantReference ||
          result.merchant_reference ||
          orderId,

        product:
          product,

        amount:
          numericAmount,

        currency:
          currency,

        email:
          email,

        firstName:
          firstName,

        lastName:
          lastName,

        phoneNumber:
          phoneNumber,

        createdAt:
          Date.now()

      })
    );


    /* =====================================================
       OPEN PESAPAL
       ===================================================== */

    emailEl.textContent =
      email;


    paymentFrame.src =
      iframeUrl;


    frameCard.classList.add(
      "show"
    );


    payButton.style.display =
      "none";

    emailBox.style.display =
      "none";


    status(
      "Payment created. Complete your payment below.",
      "success"
    );


    setTimeout(function(){

      frameCard.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    },300);


    /*
     * Start checking payment
     */

    verifyPayment(
      orderTrackingId
    );


  }catch(error){

    console.error(
      error
    );

    status(
      error.message ||
      "Payment creation failed.",
      "error"
    );

    payButton.disabled =
      false;

    payButton.textContent =
      "Continue to Secure Payment";

  }

}


/* =========================================================
   VERIFY PAYMENT
   ========================================================= */

function verifyPayment(
  trackingId
){

  if(verificationTimer){

    clearInterval(
      verificationTimer
    );

  }


  let attempts =
    0;


  async function check(){

    attempts++;


    try{

      const response =
        await fetch(
          API +
          "/api/pesapal/payment-status" +
          "?orderTrackingId=" +
          encodeURIComponent(
            trackingId
          ),
          {
            method:"GET",
            cache:"no-store",
            headers:{
              "Accept":
                "application/json"
            }
          }
        );


      const result =
        await response.json();


      console.log(
        "Payment status:",
        result
      );


      const paymentStatus =
        String(
          result.status ||
          result.paymentStatus ||
          ""
        ).toUpperCase();


      /*
       * COMPLETED
       */

      if(
        result.verified === true ||
        paymentStatus === "COMPLETED" ||
        paymentStatus === "COMPLETED_PAYMENT" ||
        paymentStatus === "1"
      ){

        clearInterval(
          verificationTimer
        );


        const finalEmail =
          result.email ||
          email;


        const merchantReference =
          result.merchantReference ||
          result.merchant_reference ||
          orderId;


        status(
          "Payment verified successfully.",
          "success"
        );


        const success =
          new URLSearchParams();


        success.set(
          "orderId",
          orderId
        );

        success.set(
          "OrderTrackingId",
          trackingId
        );

        success.set(
          "merchantReference",
          merchantReference
        );

        success.set(
          "email",
          finalEmail
        );

        success.set(
          "amount",
          String(amount)
        );

        success.set(
          "currency",
          currency
        );


        window.location.href =
          "success.html?" +
          success.toString();


        return;

      }


      /*
       * FAILED
       */

      if(
        paymentStatus === "FAILED" ||
        paymentStatus === "REVERSED" ||
        paymentStatus === "CANCELLED" ||
        paymentStatus === "INVALID" ||
        paymentStatus === "2" ||
        paymentStatus === "3"
      ){

        clearInterval(
          verificationTimer
        );


        status(
          "Payment was not completed.",
          "error"
        );


        return;

      }


      /*
       * PENDING
       */

      status(
        "Waiting for Pesapal payment confirmation...",
        "info"
      );


      /*
       * Maximum 20 minutes
       */

      if(
        attempts >= 240
      ){

        clearInterval(
          verificationTimer
        );

        status(
          "Payment verification is taking longer than expected. Your Order Tracking ID is " +
          trackingId,
          "info"
        );

      }

    }catch(error){

      console.error(
        "Verification error:",
        error
      );

    }

  }


  check();


  verificationTimer =
    setInterval(
      check,
      5000
    );

}


/* =========================================================
   BUTTON
   ========================================================= */

payButton.addEventListener(
  "click",
  createPayment
);


/* =========================================================
   EMAIL INPUT
   ========================================================= */

emailInput.addEventListener(
  "input",
  function(){

    const value =
      emailInput.value.trim();

    if(validEmail(value)){

      email =
        value;

      emailEl.textContent =
        email;

    }

  }
);


/* =========================================================
   INITIAL VALIDATION
   ========================================================= */

if(!orderId){

  payButton.disabled =
    true;

  status(
    "Order ID is missing.",
    "error"
  );

}

</script>

</body>
</html>
