<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Payment | LetsStudy Pro</title>

<meta
  name="description"
  content="Secure payment checkout for LetsStudy Pro."
>

<meta
  name="robots"
  content="noindex,nofollow"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
}

body{
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#f5f7fb;
  color:#172033;

  min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{
  height:64px;

  background:#fff;

  border-bottom:1px solid #e5e7eb;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 6%;

  position:sticky;

  top:0;

  z-index:50;
}

.logo{
  text-decoration:none;

  color:#172033;

  font-size:21px;

  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;

  background:#eef2f7;

  color:#172033;

  padding:9px 14px;

  border-radius:8px;

  cursor:pointer;

  font-size:13px;

  font-weight:600;
}

.back:hover{
  background:#e2e8f0;
}


/* =========================
   MAIN
========================= */

.container{
  width:94%;

  max-width:1100px;

  margin:24px auto;
}


/* =========================
   TOP
========================= */

.top{
  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:16px;

  padding:20px;

  margin-bottom:15px;
}

.top h1{
  font-size:25px;

  line-height:1.25;
}

.top p{
  margin-top:6px;

  color:#64748b;

  font-size:13px;

  line-height:1.5;
}


/* =========================
   CHECKOUT INFO
========================= */

.checkout-info{
  display:none;

  margin-top:15px;

  padding-top:15px;

  border-top:1px solid #e5e7eb;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:10px;
}

.checkout-item{
  background:#f8fafc;

  border:1px solid #e5e7eb;

  border-radius:10px;

  padding:11px;
}

.checkout-item small{
  display:block;

  color:#64748b;

  font-size:10px;

  margin-bottom:4px;
}

.checkout-item strong{
  display:block;

  font-size:13px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}


/* =========================
   PAYMENT BOX
========================= */

.payment-box{
  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:16px;

  overflow:hidden;
}


/* =========================
   STATUS
========================= */

.status{
  display:flex;

  align-items:center;

  gap:10px;

  padding:12px 16px;

  background:#f8fafc;

  border-bottom:1px solid #e5e7eb;

  font-size:12px;

  color:#64748b;
}

.dot{
  width:9px;

  height:9px;

  min-width:9px;

  border-radius:50%;

  background:#f59e0b;

  animation:pulse 1.4s infinite;
}

.dot.ready{
  background:#16a34a;

  animation:none;
}

.dot.error{
  background:#dc2626;

  animation:none;
}

.dot.success{
  background:#16a34a;

  animation:none;
}

@keyframes pulse{

  0%,
  100%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }

}


/* =========================
   IFRAME
========================= */

.iframe-wrap{
  position:relative;

  width:100%;

  min-height:720px;

  background:#fff;
}

#pesapalFrame{
  width:100%;

  height:720px;

  border:0;

  display:block;

  background:#fff;
}


/* =========================
   LOADING
========================= */

.loading{
  position:absolute;

  inset:0;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  background:#fff;

  z-index:2;

  padding:25px;

  text-align:center;
}

.spinner{
  width:38px;

  height:38px;

  border:4px solid #e5e7eb;

  border-top-color:#2563eb;

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin-bottom:13px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.loading strong{
  font-size:14px;
}

.loading small{
  margin-top:5px;

  color:#64748b;

  font-size:12px;
}


/* =========================
   ERROR / RESULT
========================= */

.error{
  width:100%;

  max-width:520px;

  padding:40px 20px;

  text-align:center;

  color:#172033;
}

.error-icon{
  width:52px;

  height:52px;

  margin:0 auto 15px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:#fee2e2;

  color:#b91c1c;

  font-size:24px;

  font-weight:800;
}

.success-icon{
  width:52px;

  height:52px;

  margin:0 auto 15px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:#dcfce7;

  color:#15803d;

  font-size:24px;

  font-weight:800;
}

.error h2{
  margin-bottom:8px;

  font-size:20px;
}

.error p{
  color:#64748b;

  font-size:13px;

  line-height:1.6;
}

.actions{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:8px;

  margin-top:18px;
}

.retry,
.open-payment{
  display:inline-block;

  border:0;

  text-decoration:none;

  padding:10px 16px;

  border-radius:8px;

  font-size:12px;

  font-weight:700;

  cursor:pointer;
}

.retry{
  background:#2563eb;

  color:#fff;
}

.open-payment{
  background:#eef2f7;

  color:#172033;
}


/* =========================
   FOOTER NOTE
========================= */

.note{
  padding:15px;

  text-align:center;

  color:#64748b;

  font-size:11px;

  line-height:1.5;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  header{
    padding:0 4%;
  }

  .logo{
    font-size:19px;
  }

  .container{
    width:100%;

    margin:0;
  }

  .top{
    border-radius:0;

    margin-bottom:8px;

    padding:18px 16px;
  }

  .top h1{
    font-size:22px;
  }

  .payment-box{
    border-radius:0;

    border-left:0;

    border-right:0;
  }

  .checkout-info{
    grid-template-columns:1fr;
  }

  .iframe-wrap{
    min-height:680px;
  }

  #pesapalFrame{
    height:680px;
  }

}


@media(max-width:380px){

  header{
    height:60px;
  }

  .logo{
    font-size:18px;
  }

  .back{
    padding:8px 11px;
  }

  .status{
    padding:11px 12px;
  }

}

</style>

</head>


<body>


<header>

  <a
    href="index.html"
    class="logo"
    aria-label="LetsStudy Pro home"
  >
    LetsStudy <span>Pro</span>
  </a>


  <button
    type="button"
    class="back"
    id="backButton"
  >
    Back
  </button>

</header>


<main class="container">


  <section class="top">

    <h1>
      Secure Payment
    </h1>

    <p>
      Complete your payment securely through
      LetsStudy Pro.
    </p>


    <div
      id="checkoutInfo"
      class="checkout-info"
    >

      <div class="checkout-item">

        <small>
          Item
        </small>

        <strong id="checkoutType">
          —
        </strong>

      </div>


      <div class="checkout-item">

        <small>
          Amount
        </small>

        <strong id="checkoutAmount">
          —
        </strong>

      </div>


      <div class="checkout-item">

        <small>
          Reference
        </small>

        <strong id="checkoutId">
          —
        </strong>

      </div>

    </div>

  </section>


  <section class="payment-box">


    <div class="status">

      <span
        id="statusDot"
        class="dot"
      ></span>

      <span id="statusText">
        Preparing secure payment...
      </span>

    </div>


    <div class="iframe-wrap">


      <div
        id="loading"
        class="loading"
      >

        <div class="spinner"></div>

        <strong>
          Opening secure payment
        </strong>

        <small>
          Please wait...
        </small>

      </div>


      <iframe

        id="pesapalFrame"

        title="LetsStudy Pro Secure Payment"

        loading="eager"

        allow="payment; camera; microphone"

        referrerpolicy="strict-origin-when-cross-origin"

        sandbox="
          allow-forms
          allow-modals
          allow-popups
          allow-popups-to-escape-sandbox
          allow-same-origin
          allow-scripts
          allow-top-navigation-by-user-activation
        "

      ></iframe>


    </div>


    <div class="note">

      Your payment is processed securely by
      Pesapal. Never share your payment details
      with anyone.

    </div>


  </section>


</main>


<script>

"use strict";


/*
==================================================
ELEMENTS
==================================================
*/

const frame =
  document.getElementById(
    "pesapalFrame"
  );


const loading =
  document.getElementById(
    "loading"
  );


const statusText =
  document.getElementById(
    "statusText"
  );


const statusDot =
  document.getElementById(
    "statusDot"
  );


const backButton =
  document.getElementById(
    "backButton"
  );


const checkoutInfo =
  document.getElementById(
    "checkoutInfo"
  );


const checkoutType =
  document.getElementById(
    "checkoutType"
  );


const checkoutAmount =
  document.getElementById(
    "checkoutAmount"
  );


const checkoutId =
  document.getElementById(
    "checkoutId"
  );


/*
==================================================
URL PARAMETERS
==================================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );


const type =
  params.get("type") ||

  localStorage.getItem(
    "checkoutType"
  ) ||

  "";


const itemId =
  params.get("id") ||

  params.get("documentId") ||

  localStorage.getItem(
    "checkoutId"
  ) ||

  "";


const amount =
  params.get("amount") ||

  localStorage.getItem(
    "checkoutAmount"
  ) ||

  "";


const currency =
  params.get("currency") ||

  localStorage.getItem(
    "checkoutCurrency"
  ) ||

  "TZS";


/*
==================================================
ORDER TRACKING ID
==================================================
*/

const orderTrackingId =
  params.get(
    "orderTrackingId"
  ) ||

  params.get(
    "OrderTrackingId"
  ) ||

  sessionStorage.getItem(
    "pesapalOrderTrackingId"
  ) ||

  localStorage.getItem(
    "pesapalOrderTrackingId"
  ) ||

  "";


/*
==================================================
REDIRECT URL

This comes from the backend response.

Do NOT construct the Pesapal URL
from the frontend.
==================================================
*/

const redirectUrl =
  params.get(
    "redirectUrl"
  ) ||

  params.get(
    "redirect_url"
  ) ||

  "";


/*
==================================================
BACK BUTTON
==================================================
*/

backButton.addEventListener(
  "click",
  function(){

    if(
      window.history.length > 1
    ){

      window.history.back();

    }else{

      window.location.href =
        "resources-cart.html";

    }

  }
);


/*
==================================================
LOCAL CHECKOUT STATE
==================================================
*/

if(type){

  localStorage.setItem(
    "checkoutType",
    type
  );

}


if(itemId){

  localStorage.setItem(
    "checkoutId",
    itemId
  );

}


if(amount){

  localStorage.setItem(
    "checkoutAmount",
    amount
  );

}


if(currency){

  localStorage.setItem(
    "checkoutCurrency",
    currency
  );

}


localStorage.setItem(
  "paymentPending",
  "true"
);


/*
==================================================
DISPLAY CHECKOUT INFO
==================================================
*/

if(
  type ||
  amount ||
  itemId
){

  checkoutInfo.style.display =
    "grid";

}


if(type){

  checkoutType.textContent =
    type.charAt(0).toUpperCase() +
    type.slice(1);

}


if(amount){

  const numericAmount =
    Number(
      String(amount)
        .replace(
          /,/g,
          ""
        )
    );


  if(
    Number.isFinite(
      numericAmount
    )
  ){

    checkoutAmount.textContent =
      numericAmount.toLocaleString(
        "en-US"
      ) +
      " " +
      currency;

  }else{

    checkoutAmount.textContent =
      amount +
      " " +
      currency;

  }

}


if(itemId){

  checkoutId.textContent =
    itemId;

}


/*
==================================================
STATUS
==================================================
*/

function setStatus(
  text,
  state = "loading"
){

  statusText.textContent =
    text;


  statusDot.className =
    "dot";


  if(
    state === "ready"
  ){

    statusDot.classList.add(
      "ready"
    );

  }


  if(
    state === "success"
  ){

    statusDot.classList.add(
      "success"
    );

  }


  if(
    state === "error"
  ){

    statusDot.classList.add(
      "error"
    );

  }

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHTML(
  value
){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*
==================================================
ERROR
==================================================
*/

function showError(
  text
){

  setStatus(
    "Unable to load payment.",
    "error"
  );


  loading.innerHTML = `

    <div class="error">

      <div class="error-icon">
        !
      </div>

      <h2>
        Payment unavailable
      </h2>

      <p>
        ${escapeHTML(text)}
      </p>

      <div class="actions">

        <button
          type="button"
          class="retry"
          id="retryPayment"
        >
          Try Again
        </button>

        <a
          href="resources-cart.html"
          class="open-payment"
        >
          Return to Cart
        </a>

      </div>

    </div>

  `;


  loading.style.display =
    "flex";


  const retry =
    document.getElementById(
      "retryPayment"
    );


  if(retry){

    retry.addEventListener(
      "click",
      function(){

        window.location.reload();

      }
    );

  }

}


/*
==================================================
SUCCESS SCREEN
==================================================
*/

function showSuccess(){

  setStatus(
    "Payment completed successfully.",
    "success"
  );


  loading.innerHTML = `

    <div class="error">

      <div class="success-icon">
        ✓
      </div>

      <h2>
        Payment Successful
      </h2>

      <p>
        Your payment has been confirmed.
        Your resource access will be updated
        shortly.
      </p>

      <div class="actions">

        <a
          href="resources.html"
          class="retry"
        >
          Continue
        </a>

        <a
          href="index.html"
          class="open-payment"
        >
          Home
        </a>

      </div>

    </div>

  `;


  loading.style.display =
    "flex";

}


/*
==================================================
FAILURE SCREEN
==================================================
*/

function showFailure(
  text
){

  showError(
    text ||
    "The payment was not completed."
  );

}


/*
==================================================
VALIDATE REDIRECT URL
==================================================
*/

function validPaymentURL(
  value
){

  if(
    !value
  ){

    return false;

  }


  try{

    const url =
      new URL(
        value
      );


    /*
    Only allow HTTPS URLs.
    */

    if(
      url.protocol !==
      "https:"
    ){

      return false;

    }


    return true;

  }catch(error){

    return false;

  }

}


/*
==================================================
OPEN PESAPAL
==================================================
*/

function openPayment(){

  if(
    !redirectUrl
  ){

    showError(
      "No secure payment URL was returned by the payment server."
    );

    return;

  }


  if(
    !validPaymentURL(
      redirectUrl
    )
  ){

    showError(
      "The payment server returned an invalid secure payment URL."
    );

    return;

  }


  setStatus(
    "Connecting to secure payment..."
  );


  frame.addEventListener(
    "load",
    function(){

      loading.style.display =
        "none";


      setStatus(
        "Secure payment is ready.",
        "ready"
      );

    },
    {
      once:true
    }
  );


  frame.addEventListener(
    "error",
    function(){

      showError(
        "We couldn't load the secure payment page. Please try again."
      );

    },
    {
      once:true
    }
  );


  frame.src =
    redirectUrl;


  /*
  ================================================
  FALLBACK TIMEOUT

  The iframe may load slowly depending on the
  payment provider/network.
  ================================================
  */

  setTimeout(
    function(){

      if(
        loading.style.display !==
        "none"
      ){

        /*
        Do not immediately claim failure.
        Give the customer an option to retry.
        */

        showError(
          "The secure payment page is taking too long to respond. Please try again."
        );

      }

    },
    45000
  );

}


/*
==================================================
CHECK PAYMENT STATUS

IMPORTANT:

The endpoint must verify the transaction
server-side with Pesapal.

Frontend must NEVER mark a payment successful
just because the iframe returned.
==================================================
*/

async function checkPaymentStatus(){

  if(
    !orderTrackingId &&
    !itemId
  ){

    return;

  }


  /*
  ================================================
  BACKEND STATUS ENDPOINT

  Example:

  /api/pesapal/payment-status?orderId=...

  ================================================
  */

  const query =
    new URLSearchParams();


  if(
    itemId
  ){

    query.set(
      "orderId",
      itemId
    );

  }


  if(
    orderTrackingId
  ){

    query.set(
      "orderTrackingId",
      orderTrackingId
    );

  }


  try{

    const response =
      await fetch(
        "/api/pesapal/payment-status?" +
        query.toString(),
        {

          method:
            "GET",

          headers: {

            "Accept":
              "application/json"

          },

          cache:
            "no-store"

        }
      );


    if(
      !response.ok
    ){

      return null;

    }


    const data =
      await response.json();


    return data;

  }catch(error){

    console.warn(
      "Payment status check failed:",
      error
    );


    return null;

  }

}


/*
==================================================
HANDLE VERIFIED STATUS
==================================================
*/

function handlePaymentStatus(
  result
){

  if(
    !result
  ){

    return;

  }


  const status =
    String(
      result.status ||
      result.paymentStatus ||
      ""
    )
    .toUpperCase();


  if(
    status ===
    "COMPLETED" ||

    status ===
    "SUCCESS" ||

    status ===
    "PAID"
  ){

    localStorage.removeItem(
      "paymentPending"
    );


    localStorage.removeItem(
      "pesapalOrderTrackingId"
    );


    sessionStorage.removeItem(
      "pesapalOrderTrackingId"
    );


    localStorage.removeItem(
      "pendingResourceOrder"
    );


    /*
    ==============================================
    IMPORTANT

    Cart is cleared only after backend confirms
    successful payment.
    ==============================================
    */

    localStorage.removeItem(
      "resourceCart"
    );


    showSuccess();

    return true;

  }


  if(
    status ===
    "FAILED" ||

    status ===
    "INVALID" ||

    status ===
    "CANCELLED" ||

    status ===
    "CANCELED"
  ){

    showFailure(
      result.message ||
      "The payment was not completed."
    );

    return true;

  }


  return false;

}


/*
==================================================
STATUS POLLING
==================================================
*/

let statusTimer =
  null;


let statusAttempts =
  0;


const MAX_STATUS_ATTEMPTS =
  120;


async function pollPaymentStatus(){

  if(
    statusAttempts >=
    MAX_STATUS_ATTEMPTS
  ){

        clearInterval(statusTimer);

    statusTimer = null;

    setStatus(
      "Payment verification timed out. " +
      "Please wait a moment and check your payment status again.",
      "warning"
    );

    setButtonState(false);

    return;
  }

  statusAttempts++;

  try {

    const params = new URLSearchParams();

    if(orderId){
      params.set("orderId", orderId);
    }

    if(orderTrackingId){
      params.set(
        "orderTrackingId",
        orderTrackingId
      );
    }

    const response = await fetch(
      `/api/pesapal/payment-status?${params.toString()}`,
      {
        method: "GET",
        headers: {
          "Accept": "application/json"
        },
        cache: "no-store"
      }
    );

    const data = await response.json()
      .catch(() => ({}));

    if(!response.ok){
      throw new Error(
        data.message ||
        data.error ||
        "Unable to verify payment status."
      );
    }

    const status = String(
      data.status ||
      data.paymentStatus ||
      data.orderStatus ||
      ""
    )
      .trim()
      .toUpperCase();

    if(
      status === "COMPLETED" ||
      status === "SUCCESS" ||
      status === "PAID"
    ){

      clearInterval(statusTimer);
      statusTimer = null;

      localStorage.removeItem("paymentPending");
      localStorage.removeItem(
        "pesapalOrderTrackingId"
      );
      localStorage.removeItem(
        "pendingResourceOrder"
      );
      localStorage.removeItem(
        "resourceCart"
      );

      sessionStorage.removeItem(
        "paymentPending"
      );
      sessionStorage.removeItem(
        "pesapalOrderTrackingId"
      );

      setStatus(
        "Payment completed successfully.",
        "success"
      );

      showSuccess(data);

      return;
    }

    if(
      status === "FAILED" ||
      status === "CANCELLED" ||
      status === "INVALID" ||
      status === "REJECTED"
    ){

      clearInterval(statusTimer);
      statusTimer = null;

      setStatus(
        data.message ||
        "Payment was not completed.",
        "error"
      );

      showFailed(data);

      return;
    }

    setStatus(
      data.message ||
      "Waiting for payment confirmation...",
      "pending"
    );

  } catch(error){

    console.error(
      "Payment verification error:",
      error
    );

    setStatus(
      "Payment verification is temporarily unavailable. " +
      "We will keep checking automatically.",
      "warning"
    );
  }
}


function showSuccess(data = {}){

  const successBox =
    document.getElementById("successBox");

  const paymentBox =
    document.getElementById("paymentBox");

  if(paymentBox){
    paymentBox.style.display = "none";
  }

  if(successBox){
    successBox.style.display = "block";
  }

  const successMessage =
    document.getElementById("successMessage");

  if(successMessage){

    successMessage.textContent =
      data.message ||
      "Your payment has been verified successfully. " +
      "Your resource order is now confirmed.";
  }

  const continueBtn =
    document.getElementById("continueBtn");

  if(continueBtn){

    continueBtn.style.display = "inline-flex";

    continueBtn.onclick = () => {

      if(type === "resource"){
        window.location.href =
          "resources.html";
      }else{
        window.location.href =
          "index.html";
      }
    };
  }
}


function showFailed(data = {}){

  const failedBox =
    document.getElementById("failedBox");

  const paymentBox =
    document.getElementById("paymentBox");

  if(paymentBox){
    paymentBox.style.display = "none";
  }

  if(failedBox){
    failedBox.style.display = "block";
  }

  const failedMessage =
    document.getElementById("failedMessage");

  if(failedMessage){

    failedMessage.textContent =
      data.message ||
      "The payment could not be completed.";
  }

  const retryBtn =
    document.getElementById("retryBtn");

  if(retryBtn){

    retryBtn.onclick = () => {

      if(redirectUrl){

        frame.style.display = "block";

        if(paymentBox){
          paymentBox.style.display = "block";
        }

        if(failedBox){
          failedBox.style.display = "none";
        }

        frame.src = redirectUrl;

        setStatus(
          "Opening payment again...",
          "pending"
        );
      }
    };
  }
}


function setButtonState(disabled){

  const btn =
    document.getElementById("refreshStatusBtn");

  if(!btn) return;

  btn.disabled = disabled;

  btn.textContent =
    disabled
      ? "Checking..."
      : "Check Payment Status";
}


function setStatus(message, type = "pending"){

  const status =
    document.getElementById("paymentStatus");

  if(!status) return;

  status.textContent = message;

  status.className =
    "payment-status " + type;
}


function startStatusPolling(){

  if(statusTimer){
    clearInterval(statusTimer);
  }

  statusAttempts = 0;

  checkPaymentStatus();

  statusTimer = setInterval(
    checkPaymentStatus,
    STATUS_INTERVAL
  );
}


const refreshStatusBtn =
  document.getElementById(
    "refreshStatusBtn"
  );

if(refreshStatusBtn){

  refreshStatusBtn.addEventListener(
    "click",
    async () => {

      refreshStatusBtn.disabled = true;

      await checkPaymentStatus();

      refreshStatusBtn.disabled = false;
    }
  );
}


window.addEventListener(
  "beforeunload",
  () => {

    if(statusTimer){
      clearInterval(statusTimer);
      statusTimer = null;
    }
  }
);


async function initializePayment(){

  if(!orderId && !orderTrackingId){

    setStatus(
      "No active payment order was found.",
      "error"
    );

    setButtonState(false);

    return;
  }

  if(amount){

    const amountElement =
      document.getElementById("paymentAmount");

    if(amountElement){

      amountElement.textContent =
        `${currency} ${Number(amount).toLocaleString(
          undefined,
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        )}`;
    }
  }

  if(orderId){

    const orderElement =
      document.getElementById("orderId");

    if(orderElement){
      orderElement.textContent =
        orderId;
    }
  }

  if(orderTrackingId){

    const trackingElement =
      document.getElementById(
        "orderTrackingId"
      );

    if(trackingElement){

      trackingElement.textContent =
        orderTrackingId;
    }
  }

  if(!redirectUrl){

    setStatus(
      "The payment gateway URL is missing.",
      "error"
    );

    return;
  }

  try{

    const parsedUrl =
      new URL(redirectUrl);

    if(parsedUrl.protocol !== "https:"){

      throw new Error(
        "Invalid payment gateway URL."
      );
    }

  }catch(error){

    console.error(error);

    setStatus(
      "Invalid payment gateway URL.",
      "error"
    );

    return;
  }

  if(frame){

    frame.src = redirectUrl;

    frame.style.display = "block";
  }

  setStatus(
    "Waiting for payment confirmation...",
    "pending"
  );

  startStatusPolling();
}


initializePayment();
</script>

</body>
</html>
