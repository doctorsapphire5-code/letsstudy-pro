<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Payment | LetsStudy Pro</title>

<meta
  name="description"
  content="Secure payment checkout for LetsStudy Pro."
>

<meta
  name="robots"
  content="noindex,nofollow"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
}

body{
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#f5f7fb;
  color:#172033;
  min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{
  height:64px;

  background:#fff;

  border-bottom:1px solid #e5e7eb;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 6%;

  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  text-decoration:none;
  color:#172033;

  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;

  background:#eef2f7;
  color:#172033;

  padding:9px 14px;

  border-radius:8px;

  cursor:pointer;

  font-size:13px;
  font-weight:600;

  transition:.2s;
}

.back:hover{
  background:#e2e8f0;
}


/* =========================
   MAIN
========================= */

.container{
  width:94%;
  max-width:1100px;

  margin:24px auto;
}


/* =========================
   TOP
========================= */

.top{
  background:#fff;

  border:1px solid #e5e7eb;
  border-radius:16px;

  padding:20px;

  margin-bottom:15px;
}

.top h1{
  font-size:25px;
  line-height:1.25;
}

.top p{
  margin-top:6px;

  color:#64748b;

  font-size:13px;
  line-height:1.5;
}


/* =========================
   CHECKOUT INFO
========================= */

.checkout-info{
  display:none;

  margin-top:15px;

  padding-top:15px;

  border-top:1px solid #e5e7eb;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:10px;
}

.checkout-item{
  background:#f8fafc;

  border:1px solid #e5e7eb;

  border-radius:10px;

  padding:11px;
}

.checkout-item small{
  display:block;

  color:#64748b;

  font-size:10px;

  margin-bottom:4px;
}

.checkout-item strong{
  display:block;

  font-size:13px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}


/* =========================
   PAYMENT BOX
========================= */

.payment-box{
  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:16px;

  overflow:hidden;
}


/* =========================
   STATUS
========================= */

.status{
  display:flex;
  align-items:center;

  gap:10px;

  padding:12px 16px;

  background:#f8fafc;

  border-bottom:1px solid #e5e7eb;

  font-size:12px;

  color:#64748b;
}

.dot{
  width:9px;
  height:9px;

  min-width:9px;

  border-radius:50%;

  background:#f59e0b;

  animation:pulse 1.4s infinite;
}

.dot.ready{
  background:#16a34a;
  animation:none;
}

.dot.error{
  background:#dc2626;
  animation:none;
}

@keyframes pulse{

  0%,
  100%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }

}


/* =========================
   IFRAME
========================= */

.iframe-wrap{
  position:relative;

  width:100%;

  min-height:720px;

  background:#fff;
}

#pesapalFrame{
  width:100%;

  height:720px;

  border:0;

  display:block;

  background:#fff;
}


/* =========================
   LOADING
========================= */

.loading{
  position:absolute;

  inset:0;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  background:#fff;

  z-index:2;

  padding:25px;

  text-align:center;
}

.spinner{
  width:38px;
  height:38px;

  border:4px solid #e5e7eb;

  border-top-color:#2563eb;

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin-bottom:13px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.loading strong{
  font-size:14px;
}

.loading small{
  margin-top:5px;

  color:#64748b;

  font-size:12px;
}


/* =========================
   ERROR
========================= */

.error{
  width:100%;

  max-width:500px;

  padding:40px 20px;

  text-align:center;

  color:#172033;
}

.error-icon{
  width:52px;
  height:52px;

  margin:0 auto 15px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#fee2e2;

  color:#b91c1c;

  font-size:24px;

  font-weight:800;
}

.error h2{
  margin-bottom:8px;

  font-size:20px;
}

.error p{
  color:#64748b;

  font-size:13px;

  line-height:1.6;
}

.actions{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:8px;

  margin-top:18px;
}

.retry,
.open-payment{
  display:inline-block;

  border:0;

  text-decoration:none;

  padding:10px 16px;

  border-radius:8px;

  font-size:12px;

  font-weight:700;

  cursor:pointer;
}

.retry{
  background:#2563eb;
  color:#fff;
}

.open-payment{
  background:#eef2f7;
  color:#172033;
}


/* =========================
   FOOTER NOTE
========================= */

.note{
  padding:15px;

  text-align:center;

  color:#64748b;

  font-size:11px;

  line-height:1.5;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  header{
    padding:0 4%;
  }

  .logo{
    font-size:19px;
  }

  .container{
    width:100%;

    margin:0;
  }

  .top{
    border-radius:0;

    margin-bottom:8px;

    padding:18px 16px;
  }

  .top h1{
    font-size:22px;
  }

  .payment-box{
    border-radius:0;

    border-left:0;
    border-right:0;
  }

  .checkout-info{
    grid-template-columns:1fr;
  }

  .iframe-wrap{
    min-height:680px;
  }

  #pesapalFrame{
    height:680px;
  }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

  header{
    height:60px;
  }

  .logo{
    font-size:18px;
  }

  .back{
    padding:8px 11px;
  }

  .status{
    padding:11px 12px;
  }

}

</style>

</head>


<body>


<header>

  <a
    href="index.html"
    class="logo"
    aria-label="LetsStudy Pro home"
  >
    LetsStudy <span>Pro</span>
  </a>


  <button
    type="button"
    class="back"
    id="backButton"
  >
    Back
  </button>

</header>



<main class="container">


  <section class="top">

    <h1>
      Secure Payment
    </h1>

    <p>
      Complete your payment securely through
      LetsStudy Pro.
    </p>


    <div
      id="checkoutInfo"
      class="checkout-info"
    >

      <div class="checkout-item">

        <small>
          Item
        </small>

        <strong id="checkoutType">
          —
        </strong>

      </div>


      <div class="checkout-item">

        <small>
          Amount
        </small>

        <strong id="checkoutAmount">
          —
        </strong>

      </div>


      <div class="checkout-item">

        <small>
          Reference
        </small>

        <strong id="checkoutId">
          —
        </strong>

      </div>

    </div>

  </section>



  <section class="payment-box">


    <div class="status">

      <span
        id="statusDot"
        class="dot"
      ></span>

      <span id="statusText">
        Preparing secure payment...
      </span>

    </div>



    <div class="iframe-wrap">


      <div
        id="loading"
        class="loading"
      >

        <div class="spinner"></div>

        <strong>
          Opening secure payment
        </strong>

        <small>
          Please wait...
        </small>

      </div>



      <iframe

        id="pesapalFrame"

        title="LetsStudy Pro Secure Payment"

        loading="eager"

        allow="payment; camera; microphone"

        referrerpolicy="strict-origin-when-cross-origin"

        sandbox="
          allow-forms
          allow-modals
          allow-popups
          allow-popups-to-escape-sandbox
          allow-same-origin
          allow-scripts
          allow-top-navigation-by-user-activation
        "

      ></iframe>


    </div>



    <div class="note">

      Your payment is processed securely by
      Pesapal. Never share your payment details
      with anyone.

    </div>


  </section>


</main>



<script>

/*
==================================================
LETSSTUDY PRO
SECURE PAYMENT PAGE
==================================================

SUPPORTED URL:

payment.html?
type=course&
id=COURSE123&
amount=30000&
currency=TZS&
orderTrackingId=YOUR_ORDER_ID

IMPORTANT:

The Pesapal OrderTrackingId should be created
by your backend/payment integration.

Do NOT hard-code a real production OrderTrackingId
inside this page.
==================================================
*/


"use strict";


/*
==================================================
ELEMENTS
==================================================
*/

const frame =
  document.getElementById(
    "pesapalFrame"
  );


const loading =
  document.getElementById(
    "loading"
  );


const statusText =
  document.getElementById(
    "statusText"
  );


const statusDot =
  document.getElementById(
    "statusDot"
  );


const backButton =
  document.getElementById(
    "backButton"
  );


const checkoutInfo =
  document.getElementById(
    "checkoutInfo"
  );


const checkoutType =
  document.getElementById(
    "checkoutType"
  );


const checkoutAmount =
  document.getElementById(
    "checkoutAmount"
  );


const checkoutId =
  document.getElementById(
    "checkoutId"
  );


/*
==================================================
URL PARAMETERS
==================================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );


const type =
  params.get("type") ||
  localStorage.getItem(
    "checkoutType"
  ) ||
  "";


const itemId =
  params.get("id") ||
  params.get("documentId") ||
  localStorage.getItem(
    "checkoutId"
  ) ||
  "";


const amount =
  params.get("amount") ||
  localStorage.getItem(
    "checkoutAmount"
  ) ||
  "";


const currency =
  params.get("currency") ||
  localStorage.getItem(
    "checkoutCurrency"
  ) ||
  "TZS";


/*
==================================================
PESAPAL ORDER TRACKING ID
==================================================

Priority:

1. URL
2. sessionStorage
3. localStorage

The ID should normally come from your backend.
==================================================
*/

const orderTrackingId =
  params.get("orderTrackingId") ||
  params.get("OrderTrackingId") ||
  sessionStorage.getItem(
    "pesapalOrderTrackingId"
  ) ||
  localStorage.getItem(
    "pesapalOrderTrackingId"
  ) ||
  "";


/*
==================================================
PESAPAL ENVIRONMENT
==================================================
*/

const PESAPAL_BASE_URL =
  "https://cybqa.pesapal.com/pesapaliframe/PesapalIframe3/Index";


/*
==================================================
SAVE CHECKOUT STATE
==================================================
*/

if(type){

  localStorage.setItem(
    "checkoutType",
    type
  );

}


if(itemId){

  localStorage.setItem(
    "checkoutId",
    itemId
  );

}


if(amount){

  localStorage.setItem(
    "checkoutAmount",
    amount
  );

}


if(currency){

  localStorage.setItem(
    "checkoutCurrency",
    currency
  );

}


localStorage.setItem(
  "paymentPending",
  "true"
);


/*
==================================================
DISPLAY CHECKOUT INFORMATION
==================================================
*/

if(
  type ||
  amount ||
  itemId
){

  checkoutInfo.style.display =
    "grid";

}


if(type){

  checkoutType.textContent =
    type.charAt(0).toUpperCase() +
    type.slice(1);

}


if(amount){

  let formattedAmount =
    amount;

  const numericAmount =
    Number(
      String(amount)
        .replace(/,/g,"")
    );

  if(
    Number.isFinite(
      numericAmount
    )
  ){

    formattedAmount =
      numericAmount.toLocaleString(
        "en-US"
      );

  }

  checkoutAmount.textContent =
    `${formattedAmount} ${currency}`;

}


if(itemId){

  checkoutId.textContent =
    itemId;

}


/*
==================================================
BACK BUTTON
==================================================
*/

backButton.addEventListener(
  "click",
  function(){

    if(
      window.history.length > 1
    ){

      window.history.back();

    }else{

      window.location.href =
        "index.html";

    }

  }
);


/*
==================================================
STATUS HELPERS
==================================================
*/

function setStatus(
  message,
  state = "loading"
){

  statusText.textContent =
    message;


  statusDot.className =
    "dot";


  if(
    state === "ready"
  ){

    statusDot.classList.add(
      "ready"
    );

  }


  if(
    state === "error"
  ){

    statusDot.classList.add(
      "error"
    );

  }

}


/*
==================================================
ERROR SCREEN
==================================================
*/

function showError(
  message
){

  setStatus(
    "Unable to load payment.",
    "error"
  );


  loading.innerHTML = `

    <div class="error">

      <div class="error-icon">
        !
      </div>

      <h2>
        Payment unavailable
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>

      <div class="actions">

        <button
          type="button"
          class="retry"
          id="retryPayment"
        >
          Try Again
        </button>

        <a
          href="index.html"
          class="open-payment"
        >
          Return Home
        </a>

      </div>

    </div>

  `;


  loading.style.display =
    "flex";


  const retry =
    document.getElementById(
      "retryPayment"
    );


  if(retry){

    retry.addEventListener(
      "click",
      function(){

        location.reload();

      }
    );

  }

}


/*
==================================================
HTML ESCAPE
==================================================
*/

function escapeHTML(
  value
){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/*
==================================================
BUILD PESAPAL URL
==================================================
*/

function buildPesapalURL(){

  if(
    !orderTrackingId
  ){

    return "";

  }


  const url =
    new URL(
      PESAPAL_BASE_URL
    );


  url.searchParams.set(
    "OrderTrackingId",
    orderTrackingId
  );


  return url.toString();

}


/*
==================================================
VALIDATE PAYMENT CONTEXT
==================================================
*/

if(
  !orderTrackingId
){

  showError(
    "No active payment order was found. Please return to checkout and try again."
  );

}else{

  /*
  ================================================
  PAYMENT URL
  ================================================
  */

  const paymentURL =
    buildPesapalURL();


  /*
  ================================================
  OPEN PAYMENT
  ================================================
  */

  setStatus(
    "Connecting to secure payment..."
  );


  frame.src =
    paymentURL;


  /*
  ================================================
  IFRAME LOAD
  ================================================
  */

  frame.addEventListener(
    "load",
    function(){

      loading.style.display =
        "none";


      setStatus(
        "Secure payment is ready.",
        "ready"
      );

    }
  );


  /*
  ================================================
  IFRAME ERROR
  ================================================
  */

  frame.addEventListener(
    "error",
    function(){

      showError(
        "We couldn't load the secure payment page. Please try again."
      );

    }
  );


  /*
  ================================================
  TIMEOUT
  ================================================
  */

  setTimeout(
    function(){

      if(
        loading.style.display !==
        "none"
      ){

        showError(
          "The payment page is taking too long to respond. Please try again."
        );

      }

    },
    30000
  );

}


/*
==================================================
PAYMENT PAGE VISIBILITY
==================================================
*/

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.visibilityState ===
      "visible"
    ){

      if(
        localStorage.getItem(
          "paymentPending"
        ) === "true"
      ){

        setStatus(
          "Payment session is active..."
        );

      }

    }

  }
);


/*
==================================================
NOTE

Payment success must NOT be confirmed only
from this frontend page.

Your backend should verify the Pesapal
transaction before changing:

paymentPending
order status
course access
subscription
wallet
etc.

Recommended flow:

Checkout
   ↓
Create Pesapal Order
   ↓
Receive OrderTrackingId
   ↓
payment.html
   ↓
Pesapal
   ↓
Callback / IPN
   ↓
Backend verifies transaction
   ↓
Firestore updated
   ↓
Payment success
==================================================
*/

</script>

</body>
</html>
