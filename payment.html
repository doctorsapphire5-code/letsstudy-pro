<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LetsStudy Pro - Secure Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      width: min(
        1100px,
        calc(100% - 20px)
      );

      margin: 20px auto;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, .08);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #6b7280;
    }

    .order-box {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px, 1fr)
        );

      gap: 12px;

      margin-bottom: 20px;
    }

    .info {
      padding: 15px;
      background: #f8fafc;
      border-radius: 12px;
    }

    .label {
      display: block;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .value {
      display: block;
      font-weight: 700;
      word-break: break-word;
    }

    #loading {
      text-align: center;
      padding: 30px;
      color: #374151;
    }

    #frameSection {
      display: none;
      margin-top: 20px;
    }

    .frame-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .frame-wrapper {
      width: 100%;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #fff;
    }

    #pesapalFrame {
      display: block;
      width: 100%;
      height: 720px;
      min-height: 720px;
      border: 0;
    }

    #error {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #fee2e2;
      color: #991b1b;
    }

    #success {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #dcfce7;
      color: #166534;
      text-align: center;
    }

    .small {
      margin-top: 12px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      .container {
        width: calc(100% - 12px);
        margin: 6px auto;
      }

      .card {
        padding: 14px;
        border-radius: 12px;
      }

      #pesapalFrame {
        height: 760px;
        min-height: 760px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="header">

        <h1>
          LetsStudy Pro
        </h1>

        <p>
          Secure Payment
        </p>

      </div>


      <div class="order-box">

        <div class="info">

          <span class="label">
            Order
          </span>

          <span
            class="value"
            id="orderId"
          >
            -
          </span>

        </div>


        <div class="info">

          <span class="label">
            Product
          </span>

          <span
            class="value"
            id="product"
          >
            -
          </span>

        </div>


        <div class="info">

          <span class="label">
            Amount
          </span>

          <span
            class="value"
            id="amount"
          >
            -
          </span>

        </div>


        <div class="info">

          <span class="label">
            Currency
          </span>

          <span
            class="value"
            id="currency"
          >
            -
          </span>

        </div>


        <div class="info">

          <span class="label">
            Email
          </span>

          <span
            class="value"
            id="email"
          >
            -
          </span>

        </div>

      </div>


      <div id="loading">
        Creating secure Pesapal payment...
      </div>


      <div id="error"></div>


      <div id="success">
        Payment completed. Verifying payment...
      </div>


      <section
        id="frameSection"
      >

        <div class="frame-title">
          Complete your payment
        </div>

        <div class="frame-wrapper">

          <iframe
            id="pesapalFrame"
            title="Pesapal Secure Payment"
            allow="payment *"
            loading="eager"
          ></iframe>

        </div>

        <div class="small">
          Your payment is processed securely
          through Pesapal.
        </div>

      </section>

    </section>

  </main>


<script>

const API =
  "https://api.letsstudy.pro";


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const orderId =
  params.get("orderId") ||
  params.get("id");


const product =
  params.get("product") ||
  "LetsStudy Pro Product";


const amount =
  Number(
    params.get("amount") || 0
  );


const currency =
  (
    params.get("currency") ||
    "TZS"
  ).toUpperCase();


/*
 * IMPORTANT:
 * Email is simply "email".
 */

const email =
  params.get("email") ||
  "";


const firstName =
  params.get("firstName") ||
  "LetsStudy";


const lastName =
  params.get("lastName") ||
  "Pro";


const phoneNumber =
  params.get("phone") ||
  params.get("phoneNumber") ||
  "";


/* =====================================================
   DISPLAY ORDER
===================================================== */

document.getElementById(
  "orderId"
).textContent =
  orderId || "-";


document.getElementById(
  "product"
).textContent =
  product;


document.getElementById(
  "amount"
).textContent =
  amount.toLocaleString();


document.getElementById(
  "currency"
).textContent =
  currency;


document.getElementById(
  "email"
).textContent =
  email || "-";


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  const error =
    document.getElementById(
      "error"
    );


  error.textContent =
    message;


  error.style.display =
    "block";

}


/* =====================================================
   CREATE ORDER
===================================================== */

async function createPesapalOrder() {

  if (!orderId) {

    throw new Error(
      "Order ID is missing."
    );

  }


  if (
    !amount ||
    amount <= 0
  ) {

    throw new Error(
      "Invalid payment amount."
    );

  }


  if (!email) {

    throw new Error(
      "Email is required."
    );

  }


  const response =
    await fetch(
      `${API}/api/pesapal/create-order`,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            orderId:

              orderId,

            product:

              product,

            description:

              product,

            amount:

              amount,

            currency:

              currency,

            email:

              email,

            firstName:

              firstName,

            lastName:

              lastName,

            phoneNumber:

              phoneNumber,

            countryCode:

              "TZ"

          })

      }
    );


  let result;


  try {

    result =
      await response.json();

  }

  catch (error) {

    throw new Error(
      "Invalid response from payment API."
    );

  }


  console.log(
    "PESAPAL CREATE ORDER:",
    result
  );


  if (
    !response.ok ||
    !result.success
  ) {

    throw new Error(
      result.message ||
      "Failed to create Pesapal order."
    );

  }


  /*
   * REAL PESAPAL ORDER TRACKING ID
   */

  const orderTrackingId =
    result.orderTrackingId;


  if (!orderTrackingId) {

    throw new Error(
      "Pesapal did not return OrderTrackingId."
    );

  }


  /*
   * REAL PESAPAL CHECKOUT URL
   */

  const iframeUrl =
    result.iframeUrl ||
    result.redirectUrl;


  if (!iframeUrl) {

    throw new Error(
      "Pesapal did not return payment URL."
    );

  }


  console.log(
    "ORDER TRACKING ID:",
    orderTrackingId
  );


  console.log(
    "PESAPAL FRAME:",
    iframeUrl
  );


  /* =================================================
     OPEN FRAME
  ================================================= */

  const frame =
    document.getElementById(
      "pesapalFrame"
    );


  frame.onload =
    function () {

      console.log(
        "Pesapal frame loaded."
      );

    };


  frame.src =
    iframeUrl;


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "frameSection"
  ).style.display =
    "block";


  /*
   * START VERIFICATION
   */

  startPaymentVerification(
    orderTrackingId
  );

}


/* =====================================================
   PAYMENT STATUS
===================================================== */

async function checkPaymentStatus(
  orderTrackingId
) {

  const response =
    await fetch(
      `${API}/api/pesapal/payment-status?orderTrackingId=${encodeURIComponent(
        orderTrackingId
      )}`,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (!response.ok) {

    return null;

  }


  const result =
    await response.json();


  console.log(
    "PAYMENT STATUS:",
    result
  );


  return result;

}


/* =====================================================
   VERIFY PAYMENT
===================================================== */

function startPaymentVerification(
  orderTrackingId
) {

  let attempts = 0;

  const maxAttempts =
    240;


  const timer =
    setInterval(
      async () => {

        attempts++;


        try {

          const result =
            await checkPaymentStatus(
              orderTrackingId
            );


          if (!result) {

            return;

          }


          const status =
            String(
              result.paymentStatus ||
              result.status ||
              result.payment_status_description ||
              ""
            ).toUpperCase();


          console.log(
            "PAYMENT STATUS:",
            status
          );


          /* =========================================
             COMPLETED
          ========================================= */

          if (
            status === "COMPLETED" ||
            status === "1"
          ) {

            clearInterval(
              timer
            );


            document.getElementById(
              "success"
            ).style.display =
              "block";


            const merchantReference =
              result.merchantReference ||
              result.merchant_reference ||
              orderId;


            const successUrl =
              new URL(
                "success.html",
                window.location.origin
              );


            successUrl.searchParams.set(
              "orderId",
              orderId
            );


            successUrl.searchParams.set(
              "merchantReference",
              merchantReference
            );


            successUrl.searchParams.set(
              "OrderTrackingId",
              orderTrackingId
            );


            successUrl.searchParams.set(
              "email",
              email
            );


            setTimeout(
              () => {

                window.location.href =
                  successUrl.toString();

              },
              1200
            );


            return;

          }


          /* =========================================
             FAILED
          ========================================= */

          if (
            status === "FAILED" ||
            status === "REVERSED" ||
            status === "INVALID" ||
            status === "2" ||
            status === "3" ||
            status === "0"
          ) {

            clearInterval(
              timer
            );


            showError(
              "Payment was not completed. Please try again."
            );


            return;

          }

        }

        catch (error) {

          console.error(
            "PAYMENT VERIFICATION ERROR:",
            error
          );

        }


        if (
          attempts >=
          maxAttempts
        ) {

          clearInterval(
            timer
          );

        }

      },
      5000
    );

}


/* =====================================================
   START
===================================================== */

createPesapalOrder()
  .catch(
    error => {

      console.error(
        "PAYMENT ERROR:",
        error
      );


      showError(
        error.message ||
        "Unable to start payment."
      );

    }
  );

</script>

</body>
</html>
