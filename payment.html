<!DOCTYPE html>
<html lang="en">
<head>

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3RD5Z87VF0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-3RD5Z87VF0');

<!-- Google AdSense -->
<script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9557927842145806"
  crossorigin="anonymous"></script>


  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LetsStudy Pro - Secure Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f5f7fb;

      color:
        #111827;
    }

    .container {
      width: min(
        1100px,
        calc(100% - 30px)
      );

      margin:
        30px auto;
    }

    .card {
      background: #ffffff;

      border-radius: 18px;

      padding: 25px;

      box-shadow:
        0 10px 40px
        rgba(0,0,0,.08);
    }

    .header {
      text-align: center;

      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 8px;

      font-size: 28px;
    }

    .header p {
      margin: 0;

      color: #6b7280;
    }

    .order-box {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px, 1fr)
        );

      gap: 15px;

      margin-bottom: 25px;
    }

    .info {
      background:
        #f8fafc;

      border-radius: 12px;

      padding: 15px;
    }

    .label {
      display: block;

      font-size: 12px;

      color: #6b7280;

      margin-bottom: 5px;
    }

    .value {
      font-weight: 700;

      word-break: break-word;
    }

    #loading {
      text-align: center;

      padding: 30px;
    }

    #frameSection {
      display: none;

      margin-top: 20px;
    }

    .frame-title {
      font-weight: 700;

      margin-bottom: 12px;
    }

    .frame-wrapper {
      width: 100%;

      overflow: hidden;

      border:
        1px solid #e5e7eb;

      border-radius: 14px;

      background: #fff;
    }

    #pesapalFrame {
      display: block;

      width: 100%;

      min-height: 720px;

      height: 720px;

      border: 0;
    }

    #error {
      display: none;

      background: #fee2e2;

      color: #991b1b;

      padding: 15px;

      border-radius: 10px;

      margin-top: 20px;
    }

    #success {
      display: none;

      background: #dcfce7;

      color: #166534;

      padding: 15px;

      border-radius: 10px;

      margin-top: 20px;

      text-align: center;
    }

    .small {
      margin-top: 12px;

      text-align: center;

      font-size: 13px;

      color: #6b7280;
    }

    @media(max-width:600px) {

      .container {
        width:
          calc(100% - 16px);

        margin:
          10px auto;
      }

      .card {
        padding: 15px;

        border-radius: 12px;
      }

      #pesapalFrame {
        min-height: 760px;

        height: 760px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="header">

        <h1>
          LetsStudy Pro
        </h1>

        <p>
          Secure Payment
        </p>

      </div>

      <div class="order-box">

        <div class="info">

          <span class="label">
            Order
          </span>

          <span
            class="value"
            id="orderId"
          >
            -
          </span>

        </div>

        <div class="info">

          <span class="label">
            Product
          </span>

          <span
            class="value"
            id="product"
          >
            -
          </span>

        </div>

        <div class="info">

          <span class="label">
            Amount
          </span>

          <span
            class="value"
            id="amount"
          >
            -
          </span>

        </div>

        <div class="info">

          <span class="label">
            Currency
          </span>

          <span
            class="value"
            id="currency"
          >
            -
          </span>

        </div>

      </div>

      <div id="loading">

        Creating secure Pesapal payment...

      </div>

      <div id="error"></div>

      <div id="success">

        Payment completed.
        Verifying your payment...

      </div>

      <section
        id="frameSection"
      >

        <div class="frame-title">

          Complete your payment below

        </div>

        <div class="frame-wrapper">

          <iframe
            id="pesapalFrame"
            title="Pesapal Secure Payment"
            allow="payment *"
            loading="eager"
          ></iframe>

        </div>

        <div class="small">

          Your payment is processed securely
          through Pesapal.

        </div>

      </section>

    </section>

  </main>

<script>

const API =
  "https://api.letsstudy.pro";

const params =
  new URLSearchParams(
    window.location.search
  );

const orderId =
  params.get("orderId") ||
  params.get("id");

const product =
  params.get("product") ||
  "LetsStudy Pro Product";

const amount =
  Number(
    params.get("amount") || 0
  );

const currency =
  (
    params.get("currency") ||
    "TZS"
  ).toUpperCase();

const email =
  params.get("email") ||
  "";

const firstName =
  params.get("firstName") ||
  "LetsStudy";

const lastName =
  params.get("lastName") ||
  "Pro";

const phoneNumber =
  params.get("phone") ||
  params.get("phoneNumber") ||
  "";

document.getElementById(
  "orderId"
).textContent =
  orderId || "-";

document.getElementById(
  "product"
).textContent =
  product;

document.getElementById(
  "amount"
).textContent =
  amount.toLocaleString();

document.getElementById(
  "currency"
).textContent =
  currency;


function showError(message) {

  document.getElementById(
    "loading"
  ).style.display = "none";

  const error =
    document.getElementById(
      "error"
    );

  error.textContent =
    message;

  error.style.display =
    "block";
}


async function createPesapalOrder() {

  if (!orderId) {

    throw new Error(
      "Order ID is missing."
    );

  }

  if (!amount || amount <= 0) {

    throw new Error(
      "Invalid payment amount."
    );

  }

  if (!email) {

    throw new Error(
      "Customer email is required."
    );

  }

  document.getElementById(
    "loading"
  ).style.display =
    "block";

  const response =
    await fetch(
      `${API}/api/pesapal/create-order`,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            orderId,

            amount,

            currency,

            description:
              product,

            email,

            firstName,

            lastName,

            phoneNumber,

            countryCode:
              "TZ"

          })
      }
    );

  let result;

  try {

    result =
      await response.json();

  } catch {

    throw new Error(
      "Invalid response from payment server."
    );

  }

  console.log(
    "CREATE ORDER RESULT:",
    result
  );

  if (
    !response.ok ||
    !result.success
  ) {

    throw new Error(
      result.message ||
      "Failed to create Pesapal order."
    );

  }

  const orderTrackingId =
    result.orderTrackingId;

  const iframeUrl =
    result.iframeUrl ||
    result.redirectUrl;

  if (!orderTrackingId) {

    throw new Error(
      "Pesapal did not return OrderTrackingId."
    );

  }

  if (!iframeUrl) {

    throw new Error(
      "Pesapal did not return payment URL."
    );

  }

  /*
   * THIS IS THE IMPORTANT PART.
   *
   * Use the redirect_url returned
   * by Pesapal itself.
   */

  const frame =
    document.getElementById(
      "pesapalFrame"
    );

  frame.src =
    iframeUrl;

  document.getElementById(
    "loading"
  ).style.display =
    "none";

  document.getElementById(
    "frameSection"
  ).style.display =
    "block";

  startPaymentVerification(
    orderTrackingId
  );

}


async function checkPaymentStatus(
  orderTrackingId
) {

  const response =
    await fetch(
      `${API}/api/pesapal/payment-status?orderTrackingId=${encodeURIComponent(
        orderTrackingId
      )}`
    );

  if (!response.ok) {

    return null;

  }

  const result =
    await response.json();

  console.log(
    "PAYMENT STATUS:",
    result
  );

  return result;

}


function startPaymentVerification(
  orderTrackingId
) {

  let attempts = 0;

  const maxAttempts = 240;

  const timer =
    setInterval(
      async () => {

        attempts++;

        try {

          const result =
            await checkPaymentStatus(
              orderTrackingId
            );

          if (!result) {
            return;
          }

          const status =
            String(
              result.paymentStatus ||
              result.payment_status_description ||
              result.status ||
              ""
            ).toUpperCase();

          console.log(
            "STATUS:",
            status
          );

          if (
            status === "COMPLETED" ||
            status === "1"
          ) {

            clearInterval(timer);

            document.getElementById(
              "success"
            ).style.display =
              "block";

            const merchantReference =
              result.merchantReference ||
              result.merchant_reference ||
              orderId;

            setTimeout(
              () => {

                const successUrl =
                  new URL(
                    "success.html",
                    window.location.origin
                  );

                successUrl.searchParams.set(
                  "orderId",
                  orderId
                );

                successUrl.searchParams.set(
                  "merchantReference",
                  merchantReference
                );

                successUrl.searchParams.set(
                  "OrderTrackingId",
                  orderTrackingId
                );

                successUrl.searchParams.set(
                  "email",
                  email
                );

                window.location.href =
                  successUrl.toString();

              },
              1200
            );

            return;
          }

          if (
            status === "FAILED" ||
            status === "REVERSED" ||
            status === "INVALID" ||
            status === "2" ||
            status === "3" ||
            status === "0"
          ) {

            clearInterval(timer);

            showError(
              "Payment was not completed. Please try again."
            );

            return;

          }

        } catch (error) {

          console.error(
            "STATUS CHECK ERROR:",
            error
          );

        }

        if (
          attempts >= maxAttempts
        ) {

          clearInterval(timer);

        }

      },
      5000
    );

}


createPesapalOrder()
  .catch(
    error => {

      console.error(
        "PAYMENT ERROR:",
        error
      );

      showError(
        error.message ||
        "Unable to start payment."
      );

    }
  );

</script>

</body>
</html>
