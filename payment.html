<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Secure Payment — LetsStudy Pro</title>

  <meta
    name="description"
    content="Secure payment for LetsStudy Pro courses and digital products."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .payment-container {
      width: 100%;
      max-width: 850px;
    }

    .payment-card {
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .header {
      padding: 25px;
      background: #ffffff;
      border-bottom: 1px solid #edf0f5;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
    }

    .subtitle {
      margin-top: 6px;
      color: #687386;
      font-size: 14px;
    }

    .order-summary {
      padding: 22px 25px;
      border-bottom: 1px solid #edf0f5;
    }

    .summary-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 8px 0;
      font-size: 14px;
    }

    .summary-label {
      color: #687386;
    }

    .summary-value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }

    .amount {
      font-size: 22px;
      font-weight: 800;
    }

    .payment-area {
      padding: 20px;
    }

    .frame-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .frame-wrap {
      position: relative;
      width: 100%;
      min-height: 700px;
      border: 1px solid #e2e7ef;
      border-radius: 14px;
      overflow: hidden;
      background: #ffffff;
    }

    #paymentFrame {
      display: block;
      width: 100%;
      height: 700px;
      border: 0;
      background: #ffffff;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: #ffffff;
      text-align: center;
      padding: 25px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #e6eaf0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-title {
      font-weight: 700;
      font-size: 16px;
    }

    .loading-text {
      color: #6b7280;
      font-size: 13px;
      max-width: 400px;
      line-height: 1.6;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.info {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
    }

    .status.success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
    }

    .footer {
      padding: 18px 25px;
      border-top: 1px solid #edf0f5;
      text-align: center;
      color: #7b8494;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .payment-card {
        border-radius: 12px;
      }

      .header,
      .order-summary {
        padding: 18px;
      }

      .payment-area {
        padding: 10px;
      }

      .frame-wrap {
        min-height: 680px;
        border-radius: 10px;
      }

      #paymentFrame {
        height: 680px;
      }

      .summary-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      .summary-value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <main class="payment-container">

    <section class="payment-card">

      <header class="header">
        <div class="brand">LetsStudy Pro</div>

        <div class="subtitle">
          Secure Payment
        </div>
      </header>


      <section class="order-summary">

        <div class="summary-title">
          Complete Payment
        </div>

        <div class="summary-row">
          <span class="summary-label">
            Order
          </span>

          <span
            class="summary-value"
            id="orderId"
          >
            Preparing...
          </span>
        </div>


        <div class="summary-row">
          <span class="summary-label">
            Product
          </span>

          <span
            class="summary-value"
            id="productName"
          >
            Preparing...
          </span>
        </div>


        <div class="summary-row">
          <span class="summary-label">
            Amount
          </span>

          <span
            class="summary-value amount"
            id="amount"
          >
            Preparing...
          </span>
        </div>


        <div class="summary-row">
          <span class="summary-label">
            Currency
          </span>

          <span
            class="summary-value"
            id="currency"
          >
            TZS
          </span>
        </div>

      </section>


      <section class="payment-area">

        <div class="frame-title">
          Pay securely below
        </div>


        <div class="frame-wrap">

          <div
            class="loading"
            id="loading"
          >

            <div class="spinner"></div>

            <div class="loading-title">
              Preparing your secure payment...
            </div>

            <div class="loading-text">
              Please wait while we connect your order
              to the secure Pesapal payment page.
            </div>

          </div>


          <iframe
            id="paymentFrame"
            title="Pesapal Secure Payment"
            allow="payment"
            scrolling="auto"
            frameborder="0"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>

        </div>


        <div
          id="status"
          class="status"
        ></div>

      </section>


      <footer class="footer">
        Your payment is processed securely through Pesapal.
      </footer>

    </section>

  </main>


<script>
"use strict";

/* =====================================================
   CONFIGURATION
===================================================== */

const PAYMENT_API = "https://api.letsstudy.pro";

const SUCCESS_PAGE = "success.html";

const CREATE_ORDER_ENDPOINT =
  PAYMENT_API + "/api/pesapal/create-order";

const PAYMENT_STATUS_ENDPOINT =
  PAYMENT_API + "/api/pesapal/payment-status";

const PESAPAL_FRAME_BASE =
  "https://cybqa.pesapal.com/pesapaliframe/PesapalIframe3/Index/?OrderTrackingId=";


/* =====================================================
   DOM
===================================================== */

const orderIdElement =
  document.getElementById("orderId");

const productNameElement =
  document.getElementById("productName");

const amountElement =
  document.getElementById("amount");

const currencyElement =
  document.getElementById("currency");

const paymentFrame =
  document.getElementById("paymentFrame");

const loading =
  document.getElementById("loading");

const statusElement =
  document.getElementById("status");


/* =====================================================
   STATE
===================================================== */

let orderTrackingId = null;

let merchantReference = null;

let expectedAmount = null;

let expectedCurrency = null;

let statusTimer = null;

let redirecting = false;


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
  new URLSearchParams(window.location.search);


/*
  Supported parameter names.
*/

const orderId =
  params.get("orderId") ||
  params.get("orderID") ||
  params.get("order");

const productName =
  params.get("product") ||
  params.get("productName") ||
  params.get("course") ||
  params.get("courseName") ||
  "LetsStudy Pro Product";

const amount =
  params.get("amount") ||
  params.get("total") ||
  params.get("price");

const currency =
  (
    params.get("currency") ||
    "TZS"
  ).toUpperCase();

const email =
  params.get("email") ||
  "";

const phone =
  params.get("phone") ||
  params.get("phoneNumber") ||
  "";

const firstName =
  params.get("firstName") ||
  params.get("first_name") ||
  "";

const lastName =
  params.get("lastName") ||
  params.get("last_name") ||
  "";


/* =====================================================
   VALIDATE AMOUNT
===================================================== */

function normalizeAmount(value) {

  const number =
    Number(
      String(value || "")
        .replace(/,/g, "")
        .trim()
    );

  if (!Number.isFinite(number)) {
    return null;
  }

  if (number <= 0) {
    return null;
  }

  return Number(
    number.toFixed(2)
  );
}


/* =====================================================
   FORMAT AMOUNT
===================================================== */

function formatAmount(value, curr) {

  const number =
    normalizeAmount(value);

  if (number === null) {
    return "-";
  }

  return (
    new Intl.NumberFormat(
      "en-US",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    ).format(number)
    + " "
    + curr
  );
}


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(
  message,
  type = "info"
) {

  statusElement.textContent =
    message;

  statusElement.className =
    "status " + type;
}


/* =====================================================
   HIDE LOADING
===================================================== */

function hideLoading() {

  loading.style.display =
    "none";
}


/* =====================================================
   SHOW LOADING
===================================================== */

function showLoading(
  title,
  message
) {

  loading.style.display =
    "flex";

  loading.innerHTML = `
    <div class="spinner"></div>

    <div class="loading-title">
      ${escapeHTML(title)}
    </div>

    <div class="loading-text">
      ${escapeHTML(message)}
    </div>
  `;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   DISPLAY ORDER
===================================================== */

function displayOrder() {

  orderIdElement.textContent =
    orderId || "Pending";

  productNameElement.textContent =
    productName;

  amountElement.textContent =
    formatAmount(
      amount,
      currency
    );

  currencyElement.textContent =
    currency;
}


/* =====================================================
   CREATE PESAPAL ORDER
===================================================== */

async function createPesapalOrder() {

  const normalizedAmount =
    normalizeAmount(amount);

  if (!orderId) {
    throw new Error(
      "Missing order ID."
    );
  }

  if (normalizedAmount === null) {
    throw new Error(
      "Invalid payment amount."
    );
  }

  expectedAmount =
    normalizedAmount;

  expectedCurrency =
    currency;


  /*
    Payload sent to backend.
  */

  const payload = {

    orderId: orderId,

    merchantReference:
      orderId,

    amount:
      normalizedAmount,

    currency:
      currency,

    description:
      productName,

    email:
      email,

    phone:
      phone,

    firstName:
      firstName,

    lastName:
      lastName
  };


  const response =
    await fetch(
      CREATE_ORDER_ENDPOINT,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(payload)
      }
    );


  let data;

  try {

    data =
      await response.json();

  } catch (error) {

    throw new Error(
      "Invalid response from payment server."
    );
  }


  if (
    !response.ok ||
    !data
  ) {

    throw new Error(
      data?.message ||
      "Unable to create payment order."
    );
  }


  /*
    Backend should return
    OrderTrackingId.
  */

  orderTrackingId =
    data.orderTrackingId ||
    data.OrderTrackingId ||
    data.orderTrackingID ||
    data.trackingId;


  merchantReference =
    data.merchantReference ||
    data.merchant_reference ||
    orderId;


  if (!orderTrackingId) {

    throw new Error(
      "Pesapal OrderTrackingId was not returned."
    );
  }


  return data;
}


/* =====================================================
   OPEN PESAPAL FRAME
===================================================== */

function openPesapalFrame() {

  if (!orderTrackingId) {

    throw new Error(
      "Missing Pesapal OrderTrackingId."
    );
  }


  const frameUrl =
    PESAPAL_FRAME_BASE +
    encodeURIComponent(
      orderTrackingId
    );


  /*
    Open Pesapal automatically.
  */

  paymentFrame.src =
    frameUrl;


  showLoading(
    "Opening secure payment...",
    "Connecting to Pesapal. Please wait."
  );


  showStatus(
    "Secure Pesapal payment is loading...",
    "info"
  );
}


/* =====================================================
   VERIFY PAYMENT WITH BACKEND
===================================================== */

async function checkPaymentStatus() {

  if (
    !orderTrackingId ||
    redirecting
  ) {
    return;
  }


  try {

    const url =
      PAYMENT_STATUS_ENDPOINT +
      "?OrderTrackingId=" +
      encodeURIComponent(
        orderTrackingId
      );


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    /*
      IMPORTANT:
      Backend must verify:
      - Pesapal status
      - merchant reference
      - amount
      - currency
    */


    const paid =
      data.paid === true ||
      data.success === true &&
      (
        data.status === "COMPLETED" ||
        data.payment_status === "COMPLETED"
      );


    const amountVerified =
      data.amountVerified === true ||
      data.amount_verified === true;


    const currencyVerified =
      data.currencyVerified === true ||
      data.currency_verified === true;


    const referenceVerified =
      data.referenceVerified === true ||
      data.reference_verified === true;


    /*
      Do NOT redirect merely because
      Pesapal returned a tracking ID.
    */

    if (
      paid &&
      amountVerified &&
      currencyVerified &&
      referenceVerified
    ) {

      redirectToSuccess(
        data
      );

      return;
    }


    /*
      Some backends return the verified
      payment status directly.
    */

    if (
      data.status === "COMPLETED" &&
      amountVerified &&
      currencyVerified &&
      referenceVerified
    ) {

      redirectToSuccess(
        data
      );

      return;
    }

  } catch (error) {

    /*
      Silent retry.

      Payment verification is allowed
      to continue in the background.
    */

    console.warn(
      "Payment status check failed:",
      error
    );
  }
}


/* =====================================================
   SUCCESS REDIRECT
===================================================== */

function redirectToSuccess(
  paymentData
) {

  if (redirecting) {
    return;
  }

  redirecting = true;


  if (statusTimer) {

    clearInterval(
      statusTimer
    );

    statusTimer = null;
  }


  showLoading(
    "Payment confirmed",
    "Your payment has been verified. Redirecting..."
  );


  showStatus(
    "Payment successfully verified.",
    "success"
  );


  /*
    Give the browser a moment
    to display the confirmation.
  */

  setTimeout(
    function () {

      const successParams =
        new URLSearchParams();

      successParams.set(
        "orderId",
        orderId
      );

      successParams.set(
        "merchantReference",
        merchantReference || orderId
      );

      successParams.set(
        "OrderTrackingId",
        orderTrackingId
      );


      window.location.href =
        SUCCESS_PAGE +
        "?" +
        successParams.toString();

    },
    900
  );
}


/* =====================================================
   START PAYMENT STATUS POLLING
===================================================== */

function startPaymentVerification() {

  /*
    Check immediately.
  */

  checkPaymentStatus();


  /*
    Continue checking every 4 seconds.
  */

  statusTimer =
    setInterval(
      function () {

        checkPaymentStatus();

      },
      4000
    );


  /*
    Safety stop after 30 minutes.
  */

  setTimeout(
    function () {

      if (statusTimer) {

        clearInterval(
          statusTimer
        );

        statusTimer = null;
      }

    },
    30 * 60 * 1000
  );
}


/* =====================================================
   IFRAME LOAD
===================================================== */

paymentFrame.addEventListener(
  "load",
  function () {

    hideLoading();

    showStatus(
      "Pesapal payment page is ready. Complete your payment securely below.",
      "info"
    );

  }
);


/* =====================================================
   IFRAME ERROR
===================================================== */

paymentFrame.addEventListener(
  "error",
  function () {

    hideLoading();

    showStatus(
      "Unable to load the Pesapal payment page. Please try again.",
      "error"
    );

  }
);


/* =====================================================
   START
===================================================== */

async function startPayment() {

  displayOrder();


  try {

    showLoading(
      "Preparing your secure payment...",
      "Creating your Pesapal order."
    );


    /*
      STEP 1
      Create order.
    */

    await createPesapalOrder();


    /*
      STEP 2
      Open Pesapal frame automatically.
    */

    openPesapalFrame();


    /*
      STEP 3
      Verify payment in background.
    */

    startPaymentVerification();

  } catch (error) {

    console.error(
      "Payment initialization error:",
      error
    );


    hideLoading();


    showStatus(
      error.message ||
      "Unable to prepare payment.",
      "error"
    );
  }
}


/* =====================================================
   RUN
===================================================== */

startPayment();

</script>

</body>
</html>
