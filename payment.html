<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Secure Payment - LetsStudy Pro</title>
  <meta name="description" content="Secure payment for LetsStudy Pro">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    body {
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 5px;
      color: #667085;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .title {
      margin: 0 0 20px;
      font-size: 21px;
    }

    .details {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 11px;
      border-bottom: 1px solid #edf0f4;
    }

    .label {
      color: #667085;
      font-size: 14px;
    }

    .value {
      text-align: right;
      font-weight: 600;
      font-size: 14px;
      word-break: break-word;
    }

    .amount {
      font-size: 20px;
    }

    .field {
      margin-top: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .field input:focus {
      border-color: #2563eb;
    }

    .button {
      width: 100%;
      height: 48px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.info {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .message.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 18px 0 0;
      color: #667085;
      font-size: 14px;
    }

    .frame-section {
      display: none;
    }

    .frame-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
    }

    .frame-box {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 8px;
      overflow: hidden;
    }

    #pesapalFrame {
      display: block;
      width: 100%;
      height: 720px;
      border: 0;
      border-radius: 10px;
      background: #ffffff;
    }

    .secure-note {
      text-align: center;
      margin-top: 12px;
      color: #667085;
      font-size: 13px;
    }

    .success-loading {
      display: none;
      text-align: center;
      padding: 25px 10px;
    }

    .success-loading strong {
      display: block;
      margin-bottom: 6px;
      font-size: 18px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .header,
      .card {
        padding: 16px;
        border-radius: 12px;
      }

      .row {
        flex-direction: column;
        gap: 4px;
      }

      .value {
        text-align: left;
      }

      #pesapalFrame {
        height: 700px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- HEADER -->
    <header class="header">
      <div class="brand">LetsStudy Pro</div>
      <div class="subtitle">Secure Payment</div>
    </header>

    <!-- ORDER -->
    <section class="card" id="orderCard">

      <h1 class="title">Complete Payment</h1>

      <div class="details">

        <div class="row">
          <span class="label">Order</span>
          <span class="value" id="orderIdDisplay">-</span>
        </div>

        <div class="row">
          <span class="label">Product</span>
          <span class="value" id="productDisplay">
            LetsStudy Pro Product
          </span>
        </div>

        <div class="row">
          <span class="label">Amount</span>
          <span class="value amount" id="amountDisplay">
            -
          </span>
        </div>

        <div class="row">
          <span class="label">Currency</span>
          <span class="value" id="currencyDisplay">
            TZS
          </span>
        </div>

      </div>

      <!-- EMAIL -->
      <form id="paymentForm">

        <div class="field">
          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <button
          type="submit"
          class="button"
          id="payButton"
        >
          Continue to Payment
        </button>

      </form>

      <div
        class="loading"
        id="loading"
      >
        Creating secure payment...
      </div>

      <div
        class="message"
        id="message"
      ></div>

    </section>


    <!-- PESAPAL FRAME -->
    <section
      class="card frame-section"
      id="frameSection"
    >

      <h2 class="frame-title">
        Secure Pesapal Payment
      </h2>

      <div class="frame-box">

        <iframe
          id="pesapalFrame"
          title="Pesapal Secure Payment"
          allow="payment"
          loading="eager"
        ></iframe>

      </div>

      <div class="secure-note">
        Your payment is processed securely through Pesapal.
      </div>

    </section>


    <!-- VERIFICATION -->
    <section
      class="card success-loading"
      id="verificationBox"
    >
      <strong>Verifying Payment</strong>
      <span>
        Please wait while we confirm your payment.
      </span>
    </section>

  </main>


  <script>

    /* =====================================================
       CONFIGURATION
    ===================================================== */

    const API_BASE_URL =
      "https://api.letsstudy.pro";


    /* =====================================================
       URL PARAMETERS
    ===================================================== */

    const params =
      new URLSearchParams(window.location.search);

    const orderId =
      params.get("orderId") ||
      params.get("orderID") ||
      "";

    const productName =
      params.get("product") ||
      params.get("productName") ||
      "LetsStudy Pro Product";

    const amount =
      Number(params.get("amount") || 0);

    const currency =
      (
        params.get("currency") ||
        "TZS"
      ).toUpperCase();

    let email =
      params.get("email") ||
      params.get("customerEmail") ||
      "";

    const firstName =
      params.get("firstName") ||
      "";

    const lastName =
      params.get("lastName") ||
      "";

    const phoneNumber =
      params.get("phoneNumber") ||
      params.get("phone") ||
      "";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const orderIdDisplay =
      document.getElementById("orderIdDisplay");

    const productDisplay =
      document.getElementById("productDisplay");

    const amountDisplay =
      document.getElementById("amountDisplay");

    const currencyDisplay =
      document.getElementById("currencyDisplay");

    const paymentForm =
      document.getElementById("paymentForm");

    const emailInput =
      document.getElementById("email");

    const payButton =
      document.getElementById("payButton");

    const loading =
      document.getElementById("loading");

    const message =
      document.getElementById("message");

    const frameSection =
      document.getElementById("frameSection");

    const pesapalFrame =
      document.getElementById("pesapalFrame");

    const verificationBox =
      document.getElementById("verificationBox");


    /* =====================================================
       PAYMENT VARIABLES
    ===================================================== */

    let orderTrackingId = "";

    let merchantReference = "";

    let verificationTimer = null;

    let verificationInProgress = false;

    let paymentCompleted = false;


    /* =====================================================
       DISPLAY ORDER
    ===================================================== */

    orderIdDisplay.textContent =
      orderId || "-";

    productDisplay.textContent =
      productName;

    amountDisplay.textContent =
      amount > 0
        ? `${new Intl.NumberFormat("en-TZ").format(amount)} ${currency}`
        : "-";

    currencyDisplay.textContent =
      currency;

    if (email) {
      emailInput.value = email;
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(
      text,
      type = "info"
    ) {

      message.textContent = text;

      message.className =
        `message ${type}`;

    }


    /* =====================================================
       EMAIL VALIDATION
    ===================================================== */

    function validEmail(value) {

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(value);

    }


    /* =====================================================
       VALIDATE ORDER
    ===================================================== */

    if (
      !orderId ||
      !Number.isFinite(amount) ||
      amount <= 0
    ) {

      paymentForm.style.display =
        "none";

      showMessage(
        "Invalid payment order.",
        "error"
      );

    }


    /* =====================================================
       CREATE PESAPAL ORDER
    ===================================================== */

    async function createPesapalOrder() {

      if (!orderId) {
        return;
      }

      if (
        !Number.isFinite(amount) ||
        amount <= 0
      ) {

        showMessage(
          "Invalid payment amount.",
          "error"
        );

        return;
      }

      email =
        emailInput.value.trim();

      if (!validEmail(email)) {

        showMessage(
          "Please enter a valid email address.",
          "error"
        );

        emailInput.focus();

        return;
      }


      payButton.disabled =
        true;

      loading.style.display =
        "block";

      showMessage(
        "Creating secure payment...",
        "info"
      );


      try {

        const response =
          await fetch(
            `${API_BASE_URL}/api/pesapal/create-order`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json"
              },

              body: JSON.stringify({

                orderId:
                  orderId,

                amount:
                  amount,

                currency:
                  currency,

                description:
                  `${productName} - LetsStudy Pro`,

                email:
                  email,

                firstName:
                  firstName,

                lastName:
                  lastName,

                phoneNumber:
                  phoneNumber,

                countryCode:
                  "TZ"

              })
            }
          );


        let result;

        try {

          result =
            await response.json();

        } catch {

          throw new Error(
            "Payment API returned an invalid response."
          );

        }


        console.log(
          "Pesapal create-order:",
          result
        );


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Unable to create Pesapal payment."
          );

        }


        /*
         * BACKEND MUST RETURN:
         *
         * iframeUrl
         * orderTrackingId
         * merchantReference
         */

        const paymentUrl =
          result.iframeUrl ||
          result.redirectUrl;


        if (!paymentUrl) {

          throw new Error(
            "Pesapal payment URL was not returned."
          );

        }


        orderTrackingId =
          result.orderTrackingId ||
          "";


        merchantReference =
          result.merchantReference ||
          result.orderId ||
          orderId;


        if (!orderTrackingId) {

          throw new Error(
            "Pesapal OrderTrackingId was not returned."
          );

        }


        /*
         * HIDE ORDER FORM
         */

        paymentForm.style.display =
          "none";

        loading.style.display =
          "none";


        /*
         * OPEN PESAPAL FRAME
         */

        pesapalFrame.src =
          paymentUrl;

        frameSection.style.display =
          "block";


        showMessage(
          "Complete the payment in the Pesapal window.",
          "info"
        );


        /*
         * START VERIFICATION
         */

        startPaymentVerification();


      } catch (error) {

        console.error(
          "Create payment error:",
          error
        );

        loading.style.display =
          "none";

        payButton.disabled =
          false;

        showMessage(
          error.message ||
          "Unable to create payment.",
          "error"
        );

      }

    }


    /* =====================================================
       VERIFY PAYMENT
    ===================================================== */

    function startPaymentVerification() {

      if (!orderTrackingId) {
        return;
      }

      if (verificationTimer) {

        clearInterval(
          verificationTimer
        );

      }


      checkPaymentStatus();


      verificationTimer =
        setInterval(
          checkPaymentStatus,
          4000
        );

    }


    async function checkPaymentStatus() {

      if (
        !orderTrackingId ||
        paymentCompleted ||
        verificationInProgress
      ) {

        return;

      }


      verificationInProgress =
        true;


      try {

        const response =
          await fetch(
            `${API_BASE_URL}/api/pesapal/payment-status?orderTrackingId=${encodeURIComponent(orderTrackingId)}`,
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              cache:
                "no-store"
            }
          );


        let result;

        try {

          result =
            await response.json();

        } catch {

          verificationInProgress =
            false;

          return;

        }


        console.log(
          "Pesapal payment status:",
          result
        );


        if (
          !response.ok ||
          !result.success
        ) {

          verificationInProgress =
            false;

          return;

        }


        const paymentStatus =
          String(
            result.paymentStatus ||
            result.status ||
            ""
          ).toUpperCase();


        const data =
          result.data ||
          {};


        /*
         * PESAPAL COMPLETED
         */

        if (
          paymentStatus ===
          "COMPLETED"
        ) {

          const paidAmount =
            Number(
              data.amount ??
              result.amount ??
              amount
            );


          const paidCurrency =
            String(
              data.currency ??
              result.currency ??
              currency
            ).toUpperCase();


          const returnedReference =
            String(
              data.merchant_reference ??
              data.merchantReference ??
              result.merchantReference ??
              merchantReference
            );


          const amountMatches =
            Number.isFinite(
              paidAmount
            ) &&
            Math.abs(
              paidAmount - amount
            ) < 0.01;


          const currencyMatches =
            paidCurrency ===
            currency;


          const referenceMatches =
            !returnedReference ||
            returnedReference === merchantReference ||
            returnedReference === orderId;


          if (
            amountMatches &&
            currencyMatches &&
            referenceMatches
          ) {

            paymentCompleted =
              true;


            if (verificationTimer) {

              clearInterval(
                verificationTimer
              );

              verificationTimer =
                null;

            }


            frameSection.style.display =
              "none";


            verificationBox.style.display =
              "block";


            showMessage(
              "Payment completed successfully.",
              "success"
            );


            /*
             * SUCCESS PAGE
             */

            const successUrl =
              new URL(
                "success.html",
                window.location.origin
              );


            successUrl.searchParams.set(
              "orderId",
              orderId
            );


            successUrl.searchParams.set(
              "merchantReference",
              merchantReference
            );


            successUrl.searchParams.set(
              "OrderTrackingId",
              orderTrackingId
            );


            successUrl.searchParams.set(
              "email",
              email
            );


            setTimeout(
              () => {

                window.location.href =
                  successUrl.toString();

              },
              1000
            );


            return;

          }


          /*
           * COMPLETED BUT DOES NOT
           * MATCH THIS ORDER
           */

          if (verificationTimer) {

            clearInterval(
              verificationTimer
            );

            verificationTimer =
              null;

          }


          showMessage(
            "Payment could not be verified for this order.",
            "error"
          );


          verificationInProgress =
            false;

          return;

        }


        /*
         * FAILED
         */

        if (
          paymentStatus ===
            "FAILED" ||
          paymentStatus ===
            "REVERSED"
        ) {

          if (verificationTimer) {

            clearInterval(
              verificationTimer
            );

            verificationTimer =
              null;

          }


          showMessage(
            "Payment was not completed. Please try again.",
            "error"
          );

        }


        /*
         * STILL WAITING
         */

                if (
          paymentStatus !==
            "COMPLETED" &&
          paymentStatus !==
            "FAILED" &&
          paymentStatus !==
            "REVERSED"
        ) {

          showMessage(
            "Complete the payment in the Pesapal window.",
            "info"
          );
        }

      } catch (error) {

        console.error(
          "Payment verification error:",
          error
        );

      }

      verificationInProgress = false;
    }


    /* =====================================================
       FORM SUBMIT
    ===================================================== */

    paymentForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        await createPesapalOrder();

      }
    );


    /* =====================================================
       IFRAME LOAD
    ===================================================== */

    pesapalFrame.addEventListener(
      "load",
      function() {

        console.log(
          "Pesapal payment frame loaded."
        );

      }
    );


    /* =====================================================
       CLEANUP
    ===================================================== */

    window.addEventListener(
      "beforeunload",
      function() {

        if (verificationTimer) {

          clearInterval(
            verificationTimer
          );

          verificationTimer = null;

        }

      }
    );


    /* =====================================================
       INITIALIZATION
    ===================================================== */

    (function initialize() {

      if (!orderId) {

        paymentForm.style.display =
          "none";

        showMessage(
          "Invalid payment order.",
          "error"
        );

        return;

      }


      if (
        !Number.isFinite(amount) ||
        amount <= 0
      ) {

        paymentForm.style.display =
          "none";

        showMessage(
          "Invalid payment amount.",
          "error"
        );

        return;

      }


      if (email) {

        emailInput.value =
          email;

      }

    })();

  </script>

</body>
</html>
