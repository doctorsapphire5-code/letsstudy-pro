<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Payment | LetsStudy Pro</title>

<meta
  name="description"
  content="Secure payment checkout for LetsStudy Pro."
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 6%;

  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  text-decoration:none;
  color:#172033;
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  color:#172033;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
}


/* =========================
   MAIN
========================= */

.container{
  width:94%;
  max-width:1100px;
  margin:24px auto;
}


/* =========================
   TOP
========================= */

.top{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
}

.top h1{
  font-size:25px;
}

.top p{
  margin-top:5px;
  color:#64748b;
  font-size:13px;
}


/* =========================
   PAYMENT BOX
========================= */

.payment-box{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  overflow:hidden;
}


/* =========================
   STATUS
========================= */

.status{
  display:flex;
  align-items:center;
  gap:10px;

  padding:12px 16px;

  background:#f8fafc;
  border-bottom:1px solid #e5e7eb;

  font-size:12px;
  color:#64748b;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#f59e0b;

  animation:pulse 1.4s infinite;
}

@keyframes pulse{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }

}


/* =========================
   IFRAME
========================= */

.iframe-wrap{
  position:relative;
  width:100%;
  min-height:720px;
  background:#fff;
}

#pesapalFrame{
  width:100%;
  height:720px;
  border:0;
  display:block;
}


/* =========================
   LOADING
========================= */

.loading{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:#fff;

  z-index:2;
}

.spinner{
  width:38px;
  height:38px;

  border:4px solid #e5e7eb;
  border-top-color:#2563eb;

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin-bottom:13px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.loading strong{
  font-size:14px;
}

.loading small{
  margin-top:5px;
  color:#64748b;
}


/* =========================
   FOOTER NOTE
========================= */

.note{
  padding:15px;
  text-align:center;
  color:#64748b;
  font-size:11px;
  line-height:1.5;
}


/* =========================
   ERROR
========================= */

.error{
  padding:50px 20px;
  text-align:center;
  color:#b91c1c;
}

.error h2{
  margin-bottom:8px;
}

.retry{
  display:inline-block;
  margin-top:15px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:10px 16px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  header{
    padding:0 4%;
  }

  .container{
    width:100%;
    margin:0;
  }

  .top{
    border-radius:0;
    margin-bottom:8px;
  }

  .payment-box{
    border-radius:0;
    border-left:0;
    border-right:0;
  }

  .iframe-wrap{
    min-height:680px;
  }

  #pesapalFrame{
    height:680px;
  }

}

</style>

</head>


<body>


<header>

  <a
    href="index.html"
    class="logo"
  >
    LetsStudy <span>Pro</span>
  </a>


  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>



<main class="container">


  <section class="top">

    <h1>
      Secure Payment
    </h1>

    <p>
      Complete your payment securely without
      leaving LetsStudy Pro.
    </p>

  </section>



  <section class="payment-box">


    <div class="status">

      <span class="dot"></span>

      <span id="statusText">
        Connecting to secure payment...
      </span>

    </div>



    <div class="iframe-wrap">


      <div
        id="loading"
        class="loading"
      >

        <div class="spinner"></div>

        <strong>
          Opening secure payment
        </strong>

        <small>
          Please wait...
        </small>

      </div>



      <iframe

        id="pesapalFrame"

        title="LetsStudy Pro Secure Payment"

        loading="eager"

        allow="
          payment;
          camera;
          microphone
        "

        referrerpolicy="strict-origin-when-cross-origin"

      ></iframe>


    </div>



    <div class="note">

      Your payment is processed securely by
      Pesapal. Do not close this page while
      completing your payment.

    </div>


  </section>


</main>



<script>

/*
==================================================
LETSSTUDY PRO PAYMENT

PESAPAL PAYMENT URL
==================================================
*/


const PESAPAL_PAYMENT_URL =
  "https://cybqa.pesapal.com/pesapaliframe/PesapalIframe3/Index?OrderTrackingId=1b94d3d2-c618-4c03-b142-da043951e0fd";


/*
==================================================
ELEMENTS
==================================================
*/

const frame =
  document.getElementById(
    "pesapalFrame"
  );


const loading =
  document.getElementById(
    "loading"
  );


const statusText =
  document.getElementById(
    "statusText"
  );


/*
==================================================
OPEN PESAPAL IN BACKGROUND
==================================================

The Pesapal page is loaded INSIDE the iframe.

The user remains on:

payment.html

instead of being redirected away.
==================================================
*/

frame.src =
  PESAPAL_PAYMENT_URL;


/*
==================================================
IFRAME LOADED
==================================================
*/

frame.addEventListener(
  "load",
  function(){

    loading.style.display =
      "none";

    statusText.textContent =
      "Secure payment is ready.";

  }
);


/*
==================================================
IFRAME ERROR
==================================================
*/

frame.addEventListener(
  "error",
  function(){

    loading.innerHTML = `

      <div class="error">

        <h2>
          Payment unavailable
        </h2>

        <p>
          We couldn't load the payment page.
          Please try again.
        </p>

        <a
          href="${PESAPAL_PAYMENT_URL}"
          class="retry"
          target="_blank"
          rel="noopener"
        >
          Open Payment
        </a>

      </div>

    `;

    statusText.textContent =
      "Unable to load payment.";

  }
);


/*
==================================================
OPTIONAL PAYMENT CONTEXT
==================================================

Example:

payment.html?
type=course&
id=COURSE123&
amount=30000&
currency=TZS
==================================================
*/

const params =
  new URLSearchParams(
    location.search
  );


const type =
  params.get("type") ||
  localStorage.getItem(
    "checkoutType"
  ) ||
  "";


const itemId =
  params.get("id") ||
  params.get("documentId") ||
  localStorage.getItem(
    "checkoutId"
  ) ||
  "";


const amount =
  params.get("amount") ||
  localStorage.getItem(
    "checkoutAmount"
  ) ||
  "";


const currency =
  params.get("currency") ||
  localStorage.getItem(
    "checkoutCurrency"
  ) ||
  "TZS";


/*
==================================================
SAVE PAYMENT STATE
==================================================
*/

localStorage.setItem(
  "paymentPending",
  "true"
);


if(type){

  localStorage.setItem(
    "checkoutType",
    type
  );

}


if(itemId){

  localStorage.setItem(
    "checkoutId",
    itemId
  );

}


if(amount){

  localStorage.setItem(
    "checkoutAmount",
    amount
  );

}


if(currency){

  localStorage.setItem(
    "checkoutCurrency",
    currency
  );

}

</script>

</body>
</html>
