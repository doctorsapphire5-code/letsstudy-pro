<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Secure Payment - LetsStudy Pro</title>

  <meta
    name="description"
    content="Secure payment for LetsStudy Pro"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    body {
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #e5e7eb;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #667085;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      padding: 20px;
      margin-bottom: 16px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 18px;
    }

    .details {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #edf0f4;
    }

    .label {
      color: #667085;
      font-size: 14px;
    }

    .value {
      text-align: right;
      font-weight: 600;
      font-size: 14px;
      word-break: break-word;
    }

    .amount {
      font-size: 20px;
      font-weight: 700;
    }

    .field {
      margin-top: 18px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }

    .field input:focus {
      border-color: #2563eb;
    }

    .button {
      width: 100%;
      height: 48px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.info {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    .status.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
    }

    .frame-container {
      display: none;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      padding: 10px;
      overflow: hidden;
    }

    .frame-container iframe {
      display: block;
      width: 100%;
      height: 720px;
      border: 0;
      border-radius: 10px;
      background: #ffffff;
    }

    .secure-note {
      margin-top: 12px;
      text-align: center;
      color: #667085;
      font-size: 13px;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #667085;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .header,
      .card {
        padding: 16px;
        border-radius: 12px;
      }

      .frame-container {
        padding: 4px;
      }

      .frame-container iframe {
        height: 700px;
      }

      .row {
        flex-direction: column;
        gap: 4px;
      }

      .value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="header">
      <div class="brand">
        LetsStudy Pro
      </div>

      <div class="subtitle">
        Secure Payment
      </div>
    </header>


    <section
      class="card"
      id="paymentCard"
    >

      <h1 class="title">
        Complete Payment
      </h1>

      <div class="details">

        <div class="row">
          <span class="label">
            Order
          </span>

          <span
            class="value"
            id="orderDisplay"
          >
            -
          </span>
        </div>


        <div class="row">
          <span class="label">
            Product
          </span>

          <span
            class="value"
            id="productDisplay"
          >
            LetsStudy Pro Product
          </span>
        </div>


        <div class="row">
          <span class="label">
            Amount
          </span>

          <span
            class="value amount"
            id="amountDisplay"
          >
            -
          </span>
        </div>


        <div class="row">
          <span class="label">
            Currency
          </span>

          <span
            class="value"
            id="currencyDisplay"
          >
            TZS
          </span>
        </div>

      </div>


      <form id="emailForm">

        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <button
          type="submit"
          class="button"
          id="payButton"
        >
          Continue to Payment
        </button>

      </form>


      <div
        class="loading"
        id="loading"
      >
        Creating secure payment...
      </div>


      <div
        class="status"
        id="status"
      ></div>

    </section>


    <section
      class="frame-container"
      id="frameContainer"
    >

      <iframe
        id="paymentFrame"
        title="Pesapal Secure Payment"
        allow="payment"
        loading="eager"
      ></iframe>

      <div class="secure-note">
        Your payment is processed securely through Pesapal.
      </div>

    </section>

  </main>


  <script>
    /* =====================================================
       CONFIGURATION
    ===================================================== */

    const API_BASE_URL =
      "https://api.letsstudy.pro";


    /* =====================================================
       URL DATA
    ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const orderId =
      params.get("orderId") ||
      params.get("orderID") ||
      "";


    const productName =
      params.get("product") ||
      params.get("productName") ||
      "LetsStudy Pro Product";


    const amount =
      Number(
        params.get("amount") || 0
      );


    const currency =
      (
        params.get("currency") ||
        "TZS"
      ).toUpperCase();


    let email =
      params.get("email") ||
      params.get("customerEmail") ||
      "";


    const firstName =
      params.get("firstName") ||
      "";


    const lastName =
      params.get("lastName") ||
      "";


    const phoneNumber =
      params.get("phoneNumber") ||
      params.get("phone") ||
      "";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const orderDisplay =
      document.getElementById(
        "orderDisplay"
      );


    const productDisplay =
      document.getElementById(
        "productDisplay"
      );


    const amountDisplay =
      document.getElementById(
        "amountDisplay"
      );


    const currencyDisplay =
      document.getElementById(
        "currencyDisplay"
      );


    const emailForm =
      document.getElementById(
        "emailForm"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const payButton =
      document.getElementById(
        "payButton"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const statusBox =
      document.getElementById(
        "status"
      );


    const frameContainer =
      document.getElementById(
        "frameContainer"
      );


    const paymentFrame =
      document.getElementById(
        "paymentFrame"
      );


    /* =====================================================
       PAYMENT STATE
    ===================================================== */

    let orderTrackingId =
      "";


    let merchantReference =
      "";


    let verificationTimer =
      null;


    let paymentCompleted =
      false;


    /* =====================================================
       HELPERS
    ===================================================== */

    function setStatus(
      message,
      type = "info"
    ) {

      statusBox.textContent =
        message;

      statusBox.className =
        `status ${type}`;
    }


    function formatAmount(value) {

      return new Intl.NumberFormat(
        "en-TZ"
      ).format(value);

    }


    function isValidEmail(value) {

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(value);

    }


    /* =====================================================
       INITIAL DATA
    ===================================================== */

    orderDisplay.textContent =
      orderId || "-";


    productDisplay.textContent =
      productName;


    amountDisplay.textContent =
      amount > 0
        ? `${formatAmount(amount)} ${currency}`
        : "-";


    currencyDisplay.textContent =
      currency;


    if (email) {
      emailInput.value =
        email;
    }


    /* =====================================================
       VALIDATE ORDER
    ===================================================== */

    if (
      !orderId ||
      !Number.isFinite(amount) ||
      amount <= 0
    ) {

      emailForm.style.display =
        "none";

      setStatus(
        "Invalid payment order.",
        "error"
      );

    }


    /* =====================================================
       CREATE PESAPAL ORDER
    ===================================================== */

    async function createPesapalOrder() {

      if (!orderId) {
        return;
      }


      if (
        !Number.isFinite(amount) ||
        amount <= 0
      ) {

        setStatus(
          "Invalid payment amount.",
          "error"
        );

        return;
      }


      if (!isValidEmail(email)) {

        setStatus(
          "Please enter a valid email address.",
          "error"
        );

        emailInput.focus();

        return;
      }


      payButton.disabled =
        true;


      loading.style.display =
        "block";


      setStatus(
        "Creating secure payment...",
        "info"
      );


      try {

        const response =
          await fetch(
            `${API_BASE_URL}/api/pesapal/create-order`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                orderId:
                  orderId,

                amount:
                  amount,

                currency:
                  currency,

                description:
                  `${productName} - LetsStudy Pro`,

                email:
                  email,

                firstName:
                  firstName,

                lastName:
                  lastName,

                phoneNumber:
                  phoneNumber,

                countryCode:
                  "TZ"
              })
            }
          );


        let result;

        try {

          result =
            await response.json();

        } catch {

          throw new Error(
            "Payment API returned an invalid response."
          );

        }


        console.log(
          "Pesapal create-order:",
          result
        );


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Unable to create payment order."
          );

        }


        const paymentUrl =
          result.redirectUrl ||
          result.iframeUrl;


        if (!paymentUrl) {

          throw new Error(
            "Pesapal did not return a payment URL."
          );

        }


        orderTrackingId =
          result.orderTrackingId ||
          "";


        merchantReference =
          result.merchantReference ||
          result.orderId ||
          orderId;


        if (!orderTrackingId) {

          throw new Error(
            "Pesapal order tracking ID was not returned."
          );

        }


        /*
         * Hide the email form.
         */

        emailForm.style.display =
          "none";


        /*
         * Hide loading message.
         */

        loading.style.display =
          "none";


        /*
         * Open Pesapal inside the frame.
         */

        paymentFrame.src =
          paymentUrl;


        frameContainer.style.display =
          "block";


        setStatus(
          "Complete your payment below.",
          "info"
        );


        /*
         * Start background verification.
         */

        startVerification();


      } catch (error) {

        console.error(
          "Pesapal create-order error:",
          error
        );


        loading.style.display =
          "none";


        payButton.disabled =
          false;


        setStatus(
          error.message ||
          "Failed to create payment.",
          "error"
        );

      }

    }


    /* =====================================================
       PAYMENT VERIFICATION
    ===================================================== */

    function startVerification() {

      if (
        !orderTrackingId
      ) {
        return;
      }


      if (
        verificationTimer
      ) {
        clearInterval(
          verificationTimer
        );
      }


      checkPaymentStatus();


      verificationTimer =
        setInterval(
          checkPaymentStatus,
          4000
        );

    }


    async function checkPaymentStatus() {

      if (
        !orderTrackingId ||
        paymentCompleted
      ) {
        return;
      }


      try {

        const response =
          await fetch(
            `${API_BASE_URL}/api/pesapal/payment-status?orderTrackingId=${encodeURIComponent(
              orderTrackingId
            )}`,
            {
              method: "GET",
              headers: {
                "Accept":
                  "application/json"
              },
              cache: "no-store"
            }
          );


        const result =
          await response.json();


        console.log(
          "Pesapal payment status:",
          result
        );


        if (
          !response.ok ||
          !result.success
        ) {
          return;
        }


        const paymentStatus =
          String(
            result.paymentStatus ||
            ""
          ).toUpperCase();


        const data =
          result.data ||
          {};


        const statusCode =
          Number(
            data.status_code
          );


        /*
         * Pesapal status 1 = COMPLETED
         */

        if (
          paymentStatus ===
            "COMPLETED" &&
          statusCode === 1
        ) {

          const paidAmount =
            Number(
              data.amount
            );


          const paidCurrency =
            String(
              data.currency ||
              ""
            ).toUpperCase();


          const returnedReference =
            String(
              data.merchant_reference ||
              data.merchantReference ||
              merchantReference ||
              ""
            );


          /*
           * Verify amount.
           */

          const amountMatches =
            Number.isFinite(
              paidAmount
            ) &&
            Math.abs(
              paidAmount - amount
            ) < 0.01;


          /*
           * Verify currency.
           */

          const currencyMatches =
            paidCurrency ===
            currency;


          /*
           * Verify merchant reference.
           */

          const referenceMatches =
            !returnedReference ||
            returnedReference ===
              merchantReference ||
            returnedReference ===
              orderId;


          if (
            amountMatches &&
            currencyMatches &&
            referenceMatches
          ) {

            clearInterval(
              verificationTimer
            );

            verificationTimer =
              null;

            paymentCompleted =
              true;


            setStatus(
              "Payment completed successfully. Redirecting...",
              "success"
            );


            setTimeout(
              () => {

                const successUrl =
                  new URL(
                    "success.html",
                    window.location.origin
                  );


                successUrl.searchParams.set(
                  "orderId",
                  orderId
                );


                successUrl.searchParams.set(
                  "merchantReference",
                  merchantReference
                );


                successUrl.searchParams.set(
                  "OrderTrackingId",
                  orderTrackingId
                );


                if (email) {

                  successUrl.searchParams.set(
                    "email",
                    email
                  );

                }


                window.location.href =
                  successUrl.toString();

              },
              1200
            );


            return;

          }


          /*
           * Payment completed at Pesapal,
           * but order details do not match.
           */

          clearInterval(
            verificationTimer
          );

          verificationTimer =
            null;


          setStatus(
            "Payment could not be verified for this order.",
            "error"
          );


          return;

        }


        if (
          paymentStatus ===
            "FAILED" ||
          paymentStatus ===
            "REVERSED"
        ) {

          clearInterval(
            verificationTimer
          );

          verificationTimer =
            null;


          setStatus(
            "Payment was not completed. Please try again.",
            "error"
          );


          return;

        }


        setStatus(
          "Complete the payment in the Pesapal window.",
          "info"
        );


      } catch (error) {

        console.error(
          "Payment verification error:",
          error
        );

      }

    }


    /* =====================================================
       EMAIL FORM
    ===================================================== */

    emailForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        email =
          emailInput.value.trim();


        if (
          !isValidEmail(email)
        ) {

          setStatus(
            "Please enter a valid email address.",
            "error"
          );

          emailInput.focus();

          return;

        }


        await createPesapalOrder();

      }
    );


    /* =====================================================
       CLEANUP
    ===================================================== */

    /* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  () => {

    if (verificationTimer) {

      clearInterval(
        verificationTimer
      );

      verificationTimer =
        null;
    }

  }
);


/* =====================================================
   PAGE INITIALIZATION
===================================================== */

(function initialize() {

  if (!orderId) {

    setStatus(
      "Invalid payment order.",
      "error"
    );

    return;
  }


  if (
    !Number.isFinite(amount) ||
    amount <= 0
  ) {

    setStatus(
      "Invalid payment amount.",
      "error"
    );

    return;
  }


  if (email) {

    emailInput.value =
      email;

  }

})();

</script>

</body>
</html>
