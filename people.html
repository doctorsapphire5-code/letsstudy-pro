<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>People | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="Discover people and community members on Let'sStudy Pro."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
}


/* =========================
   HEADER
========================= */

.topbar{
  height:64px;

  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;

  font-weight:800;
}

.brand-icon{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--primary);
  color:#fff;
}

.back-btn{
  border:0;

  padding:9px 13px;

  border-radius:10px;

  background:var(--soft);

  color:var(--text);

  font-weight:700;

  cursor:pointer;
}


/* =========================
   MAIN
========================= */

.container{
  width:100%;
  max-width:1050px;

  margin:auto;

  padding:28px 15px 70px;
}

.hero{
  margin-bottom:22px;
}

.hero h1{
  font-size:30px;
  font-weight:850;
  letter-spacing:-.5px;
}

.hero p{
  margin-top:6px;

  color:var(--muted);

  font-size:14px;
}


/* =========================
   CONTROLS
========================= */

.controls{
  display:flex;
  gap:10px;

  margin-bottom:22px;
}

.search{
  position:relative;
  flex:1;
}

.search input{
  width:100%;

  height:45px;

  padding:
    0 15px 0 42px;

  border:
    1px solid var(--border);

  border-radius:12px;

  outline:none;

  background:#fff;

  color:var(--text);
}

.search input:focus{
  border-color:#94a3b8;
}

.search-icon{
  position:absolute;

  left:14px;
  top:50%;

  transform:translateY(-50%);

  color:var(--muted);
}

select{
  height:45px;

  border:
    1px solid var(--border);

  border-radius:12px;

  padding:0 13px;

  background:#fff;

  color:var(--text);

  outline:none;
}


/* =========================
   COUNT
========================= */

.result-info{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:13px;

  color:var(--muted);

  font-size:13px;
}


/* =========================
   PEOPLE GRID
========================= */

.people-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:15px;
}

.person{
  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:18px;

  padding:20px;

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.person:hover{
  transform:translateY(-2px);

  box-shadow:
    0 10px 28px
    rgba(15,23,42,.06);
}

.person-top{
  display:flex;

  align-items:center;

  gap:12px;
}

.avatar{
  width:52px;
  height:52px;

  border-radius:50%;

  overflow:hidden;

  background:var(--soft);

  display:flex;

  align-items:center;
  justify-content:center;

  flex-shrink:0;

  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.person-name{
  font-size:15px;

  font-weight:800;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.username{
  margin-top:3px;

  color:var(--muted);

  font-size:12px;
}

.bio{
  margin-top:15px;

  min-height:42px;

  color:#475569;

  font-size:13px;

  line-height:1.55;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;
}

.meta{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:13px;
}

.badge{
  padding:5px 8px;

  border-radius:7px;

  background:var(--soft);

  color:var(--muted);

  font-size:10px;

  font-weight:700;
}

.status-online{
  color:#047857;

  background:#ecfdf5;
}

.status-offline{
  color:#64748b;
}

.location{
  margin-top:11px;

  color:var(--muted);

  font-size:11px;
}

.person-actions{
  display:flex;

  gap:8px;

  margin-top:17px;
}

.person-actions button{
  flex:1;

  border:0;

  border-radius:9px;

  padding:9px;

  font-size:12px;

  font-weight:750;

  cursor:pointer;

  background:var(--soft);

  color:var(--text);
}

.person-actions button.primary{
  background:var(--primary);

  color:#fff;
}


/* =========================
   LOADING
========================= */

.loading{
  text-align:center;

  padding:55px 10px;

  color:var(--muted);
}

.spinner{
  width:34px;
  height:34px;

  margin:0 auto 12px;

  border:
    3px solid var(--border);

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   EMPTY
========================= */

.empty{
  display:none;

  text-align:center;

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:18px;

  padding:45px 20px;

  color:var(--muted);
}

.empty.show{
  display:block;
}

.empty-icon{
  font-size:35px;

  margin-bottom:10px;
}


/* =========================
   LOAD MORE
========================= */

.load-more{
  display:block;

  margin:25px auto 0;

  border:0;

  border-radius:11px;

  padding:11px 20px;

  background:var(--primary);

  color:#fff;

  font-weight:750;

  cursor:pointer;
}

.load-more:disabled{
  opacity:.5;

  cursor:not-allowed;
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .people-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:600px){

  .topbar{
    padding:0 12px;
  }

  .brand{
    font-size:13px;
  }

  .container{
    padding:
      22px 11px 60px;
  }

  .hero h1{
    font-size:26px;
  }

  .controls{
    flex-direction:column;
  }

  select{
    width:100%;
  }

  .people-grid{
    grid-template-columns:1fr;
  }

  .person{
    padding:17px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      👥
    </div>

    <span>
      Let'sStudy Pro Community
    </span>

  </div>


  <button
    class="back-btn"
    type="button"
    onclick="goCommunity()"
  >
    ← Community
  </button>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


  <section class="hero">

    <h1>
      People
    </h1>

    <p>
      Discover and connect with people
      in the Let'sStudy Pro Community.
    </p>

  </section>


  <!-- CONTROLS -->

  <section class="controls">

    <div class="search">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="searchInput"
        type="search"
        placeholder="Search people by name or username..."
        autocomplete="off"
      >

    </div>


    <select
      id="statusFilter"
    >

      <option value="all">
        All status
      </option>

      <option value="active">
        Active
      </option>

      <option value="online">
        Online
      </option>

    </select>


    <select
      id="roleFilter"
    >

      <option value="all">
        All roles
      </option>

      <option value="student">
        Student
      </option>

      <option value="creator">
        Creator
      </option>

      <option value="teacher">
        Teacher
      </option>

      <option value="member">
        Member
      </option>

    </select>

  </section>


  <!-- RESULT INFO -->

  <div class="result-info">

    <span id="resultText">
      Loading people...
    </span>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <p>
      Loading community members...
    </p>

  </div>


  <!-- PEOPLE -->

  <section
    id="peopleGrid"
    class="people-grid"
  ></section>


  <!-- EMPTY -->

  <div
    id="empty"
    class="empty"
  >

    <div class="empty-icon">
      👥
    </div>

    <h3>
      No people found
    </h3>

    <p>
      Try another name, username or filter.
    </p>

  </div>


  <button
    id="loadMore"
    class="load-more"
    type="button"
    style="display:none"
  >
    Load More
  </button>


</main>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();


/* =========================
   STATE
========================= */

let allPeople = [];

let visiblePeople = [];

let lastDocument = null;

const PAGE_SIZE = 24;


/* =========================
   ELEMENTS
========================= */

const loading =
  document.getElementById(
    "loading"
  );

const peopleGrid =
  document.getElementById(
    "peopleGrid"
  );

const empty =
  document.getElementById(
    "empty"
  );

const resultText =
  document.getElementById(
    "resultText"
  );

const loadMore =
  document.getElementById(
    "loadMore"
  );


/* =========================
   ESCAPE
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================
   LOAD PEOPLE
========================= */

async function loadPeople(
  append = false
){

  try{

    if(!append){

      loading.style.display =
        "block";

    }


    let query =
      db
        .collection(
          "users"
        )
        .orderBy(
          "createdAt",
          "desc"
        )
        .limit(
          PAGE_SIZE
        );


    if(
      append &&
      lastDocument
    ){

      query =
        query.startAfter(
          lastDocument
        );

    }


    const snapshot =
      await query.get();


    if(
      snapshot.empty &&
      !append
    ){

      loading.style.display =
        "none";

      showEmpty();

      resultText.textContent =
        "0 people";

      return;

    }


    if(
      !snapshot.empty
    ){

      lastDocument =
        snapshot.docs[
          snapshot.docs.length - 1
        ];

    }


    const newPeople =
      [];


    snapshot.forEach(
      doc => {

        const data =
          doc.data();


        newPeople.push({

          id:
            doc.id,

          uid:
            data.uid ||
            doc.id,

          email:
            data.email ||
            "",

          displayName:
            data.displayName ||
            "Community Member",

          photoURL:
            data.photoURL ||
            "",

          username:
            data.username ||
            "",

          bio:
            data.bio ||
            "",

          location:
            data.location ||
            "",

          role:
            data.role ||
            "member",

          status:
            data.status ||
            "active",

          createdAt:
            data.createdAt ||
            null,

          lastActiveAt:
            data.lastActiveAt ||
            null

        });

      }
    );


    allPeople =
      append
        ? allPeople.concat(
            newPeople
          )
        : newPeople;


    loading.style.display =
      "none";


    applyFilters();


    if(
      snapshot.size <
      PAGE_SIZE
    ){

      loadMore.style.display =
        "none";

    }

    else{

      loadMore.style.display =
        "block";

    }

  }

  catch(error){

    console.error(
      "Load people error:",
      error
    );


    loading.style.display =
      "none";


    resultText.textContent =
      "Unable to load people";


    peopleGrid.innerHTML =
      `
        <div
          style="
            grid-column:1/-1;
            text-align:center;
            padding:40px;
            color:#64748b;
          "
        >
          Unable to load community members.
          Please refresh and try again.
        </div>
      `;

  }

}


/* =========================
   FILTERS
========================= */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const role =
    document
      .getElementById(
        "roleFilter"
      )
      .value;


  visiblePeople =
    allPeople.filter(
      person => {

        const name =
          String(
            person.displayName
          )
          .toLowerCase();


        const username =
          String(
            person.username
          )
          .toLowerCase();


        const matchesSearch =
          !search ||
          name.includes(search) ||
          username.includes(search);


        const matchesStatus =
          status === "all" ||
          person.status === status;


        const matchesRole =
          role === "all" ||
          person.role === role;


        return (
          matchesSearch &&
          matchesStatus &&
          matchesRole
        );

      }
    );


  renderPeople();

}


/* =========================
   RENDER
========================= */

function renderPeople(){

  peopleGrid.innerHTML =
    "";


  resultText.textContent =
    `${visiblePeople.length} people`;


  if(
    visiblePeople.length === 0
  ){

    showEmpty();

    return;

  }


  empty.classList.remove(
    "show"
  );


  visiblePeople.forEach(
    person => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "person";


      const avatar =
        person.photoURL

          ? `
            <img
              src="${escapeHTML(person.photoURL)}"
              alt="${escapeHTML(person.displayName)}"
              loading="lazy"
              referrerpolicy="no-referrer"
            >
          `

          : `
            ${getInitials(
              person.displayName
            )}
          `;


      const username =
        person.username
          ? "@" +
            person.username
          : "";


      const statusClass =
        person.status === "online"
          ? "status-online"
          : "status-offline";


      const location =
        person.location
          ? `
            <div class="location">
              📍 ${escapeHTML(
                person.location
              )}
            </div>
          `
          : "";


      card.innerHTML =
        `
          <div class="person-top">

            <div class="avatar">
              ${avatar}
            </div>

            <div>

              <div class="person-name">
                ${escapeHTML(
                  person.displayName
                )}
              </div>

              <div class="username">
                ${escapeHTML(
                  username
                )}
              </div>

            </div>

          </div>


          <div class="bio">

            ${escapeHTML(
              person.bio ||
              "Community member"
            )}

          </div>


          <div class="meta">

            <span class="badge">
              ${escapeHTML(
                person.role
              )}
            </span>

            <span
              class="badge ${statusClass}"
            >
              ${escapeHTML(
                person.status
              )}
            </span>

          </div>


          ${location}


          <div class="person-actions">

            <button
              type="button"
              onclick="viewProfile('${encodeURIComponent(person.uid)}')"
            >
              View Profile
            </button>

            <button
              class="primary"
              type="button"
              onclick="messageUser('${encodeURIComponent(person.uid)}')"
            >
              Message
            </button>

          </div>
        `;


      peopleGrid.appendChild(
        card
      );

    }
  );

}


/* =========================
   INITIALS
========================= */

function getInitials(
  name
){

  const words =
    String(
      name || "User"
    )
    .trim()
    .split(/\s+/);


  return escapeHTML(
    words
      .slice(0,2)
      .map(
        word =>
          word
            .charAt(0)
            .toUpperCase()
      )
      .join("")
  );

}


/* =========================
   EMPTY
========================= */

function showEmpty(){

  empty.classList.add(
    "show"
  );

  peopleGrid.innerHTML =
    "";

}


/* =========================
   SEARCH
========================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    applyFilters
  );


/* =========================
   STATUS FILTER
========================= */

document
  .getElementById(
    "statusFilter"
  )
  .addEventListener(
    "change",
    applyFilters
  );


/* =========================
   ROLE FILTER
========================= */

document
  .getElementById(
    "roleFilter"
  )
  .addEventListener(
    "change",
    applyFilters
  );


/* =========================
   LOAD MORE
========================= */

loadMore.addEventListener(
  "click",
  async () => {

    loadMore.disabled =
      true;

    loadMore.textContent =
      "Loading...";


    await loadPeople(
      true
    );


    loadMore.disabled =
      false;

    loadMore.textContent =
      "Load More";

  }
);


/* =========================
   PROFILE
========================= */

function viewProfile(
  uid
){

  window.location.href =
    "/profile-community.html?id=" +
    uid;

}


/* =========================
   MESSAGE
========================= */

function messageUser(
  uid
){

  window.location.href =
    "/messages.html?user=" +
    uid;

}


/* =========================
   COMMUNITY
========================= */

function goCommunity(){

  window.location.href =
    "/community.html";

}


/* =========================
   START
========================= */

loadPeople();

</script>

</body>

</html>
