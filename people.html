<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>People | LetsStudy Pro</title>

<meta name="description"
content="Discover people and connect with learners on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:14px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer
}

.container{
  width:92%;
  max-width:900px;
  margin:25px auto
}

.hero{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:22px;
  margin-bottom:15px
}

.hero h1{
  font-size:27px
}

.hero p{
  color:#64748b;
  font-size:13px;
  margin-top:5px
}

.tools{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:12px;
  display:flex;
  gap:8px;
  margin-bottom:15px
}

.search{
  flex:1;
  border:1px solid #dbe2ea;
  padding:11px 13px;
  border-radius:8px;
  outline:none
}

select{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:10px;
  border-radius:8px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}

.person{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
  display:flex;
  gap:13px
}

.avatar{
  width:52px;
  height:52px;
  min-width:52px;
  border-radius:50%;
  background:#eaf2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-weight:800;
  color:#2563eb
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.info{
  flex:1;
  min-width:0
}

.name{
  font-size:15px;
  font-weight:800
}

.username{
  color:#64748b;
  font-size:11px;
  margin-top:2px
}

.bio{
  color:#64748b;
  font-size:12px;
  margin-top:7px;
  line-height:1.4
}

.actions{
  display:flex;
  gap:6px;
  margin-top:10px
}

.btn{
  border:0;
  padding:7px 10px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  display:inline-block
}

.follow{
  background:#2563eb;
  color:#fff
}

.following{
  background:#e2e8f0;
  color:#172033
}

.profile{
  background:#eef2f7;
  color:#172033
}

.loading,
.empty,
.error{
  grid-column:1/-1;
  background:#fff;
  border-radius:14px;
  padding:45px 20px;
  text-align:center;
  color:#64748b
}

.error{
  color:#b91c1c
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr
  }

  .tools{
    flex-direction:column
  }

  select{
    width:100%
  }
}
</style>
</head>

<body>

<header>

  <a
    href="index.html"
    class="logo"
  >
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      People
    </h1>

    <p>
      Discover learners, educators and members
      of the LetsStudy Pro community.
    </p>

  </section>


  <section class="tools">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search people..."
    >


    <select id="filter">

      <option value="all">
        Everyone
      </option>

      <option value="student">
        Students
      </option>

      <option value="teacher">
        Teachers
      </option>

      <option value="creator">
        Creators
      </option>

    </select>

  </section>


  <section
    id="people"
    class="grid"
  >

    <div class="loading">
      Loading people...
    </div>

  </section>

</main>


<script>

/*
==================================================
LETSSTUDY PRO PEOPLE

GET:

/api/community/people

OPTIONAL:

/api/users/search?q=...


EXPECTED USER:

{
  id:"",
  name:"",
  username:"",
  photoURL:"",
  bio:"",
  role:"",
  following:false
}

FOLLOW:

POST /api/community/follow

{
  followerId:"",
  followingId:""
}

UNFOLLOW:

POST /api/community/unfollow

{
  followerId:"",
  followingId:""
}
==================================================
*/


const params =
  new URLSearchParams(
    location.search
  );


const currentUserId =
  params.get("userId") ||
  localStorage.getItem(
    "userId"
  ) ||
  "";


const peopleBox =
  document.getElementById(
    "people"
  );

const search =
  document.getElementById(
    "search"
  );

const filter =
  document.getElementById(
    "filter"
  );


let people = [];


/* =========================
   LOAD
========================= */

loadPeople();


async function loadPeople(){

  try{

    const response =
      await fetch(
        "/api/community/people"
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load people."
      );

    }


    people =
      Array.isArray(
        result.people
      )
      ? result.people
      : Array.isArray(
          result.users
        )
        ? result.users
        : [];


    render();

  }catch(error){

    console.error(
      error
    );

    peopleBox.innerHTML = `

      <div class="error">

        <h3>
          Unable to load people
        </h3>

        <p style="margin-top:7px">
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const role =
    filter.value;


  const filtered =
    people.filter(
      person => {

        const text =
          (
            person.name ||
            "" +
            " " +
            person.username ||
            "" +
            " " +
            person.bio ||
            ""
          ).toLowerCase();


        const personRole =
          String(
            person.role ||
            ""
          ).toLowerCase();


        return (

          (
            !keyword ||
            text.includes(
              keyword
            )
          )

          &&

          (
            role === "all" ||
            personRole === role
          )

        );

      }
    );


  if(!filtered.length){

    peopleBox.innerHTML = `

      <div class="empty">

        ${
          people.length
          ? "No people found."
          : "No people available yet."
        }

      </div>

    `;

    return;

  }


  peopleBox.innerHTML =
    filtered
      .map(
        personCard
      )
      .join("");


  bindActions();

}


/* =========================
   CARD
========================= */

function personCard(
  person
){

  const id =
    person.id ||
    person.documentId ||
    "";


  const name =
    person.name ||
    person.displayName ||
    "LetsStudy Member";


  const username =
    person.username ||
    person.handle ||
    "";


  const photo =
    person.photoURL ||
    person.photo ||
    person.avatar ||
    "";


  const role =
    person.role ||
    "";


  const following =
    person.following === true ||
    person.isFollowing === true;


  const initials =
    getInitials(
      name
    );


  return `

    <article class="person">

      <div class="avatar">

        ${
          photo
          ? `
            <img
              src="${safeURL(photo)}"
              alt="${escapeAttr(name)}"
              loading="lazy"
            >
          `
          : escapeHTML(
              initials
            )
        }

      </div>


      <div class="info">

        <div class="name">

          ${escapeHTML(name)}

        </div>


        ${
          username
          ? `
            <div class="username">
              @${escapeHTML(username)}
            </div>
          `
          : ""
        }


        ${
          role
          ? `
            <div class="username">
              ${escapeHTML(
                capitalize(role)
              )}
            </div>
          `
          : ""
        }


        ${
          person.bio
          ? `
            <div class="bio">
              ${escapeHTML(
                person.bio
              )}
            </div>
          `
          : ""
        }


        <div class="actions">

          <a
            class="btn profile"
            href="profile.html?id=${encodeURIComponent(id)}"
          >
            Profile
          </a>


          ${
            id &&
            id !== currentUserId
            ? `

              <button
                class="btn ${
                  following
                  ? "following"
                  : "follow"
                } follow-btn"
                data-id="${escapeAttr(id)}"
                data-following="${following}"
              >
                ${
                  following
                  ? "Following"
                  : "Follow"
                }
              </button>

            `
            : ""
          }

        </div>

      </div>

    </article>

  `;

}


/* =========================
   FOLLOW ACTION
========================= */

function bindActions(){

  document
    .querySelectorAll(
      ".follow-btn"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            toggleFollow(
              button
            )
        );

      }
    );

}


async function toggleFollow(
  button
){

  const targetId =
    button.dataset.id;


  const following =
    button.dataset.following ===
    "true";


  if(!currentUserId){

    alert(
      "Please sign in to follow people."
    );

    return;

  }


  if(
    !targetId ||
    targetId === currentUserId
  ){

    return;

  }


  button.disabled =
    true;


  const endpoint =
    following
    ? "/api/community/unfollow"
    : "/api/community/follow";


  try{

    const response =
      await fetch(
        endpoint,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            followerId:
              currentUserId,

            followingId:
              targetId

          })

        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to update follow."
      );

    }


    const person =
      people.find(
        p =>
          (
            p.id ||
            p.documentId
          ) === targetId
      );


    if(person){

      person.following =
        !following;

    }


    render();

  }catch(error){

    alert(
      error.message
    );

    button.disabled =
      false;

  }

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  render
);

filter.addEventListener(
  "change",
  render
);


/* =========================
   HELPERS
========================= */

function getInitials(
  name
){

  return String(
    name
  )
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(
    word =>
      word.charAt(0)
  )
  .join("")
  .toUpperCase();

}


function capitalize(
  value
){

  return String(
    value
  )
  .charAt(0)
  .toUpperCase() +
  String(
    value
  ).slice(1);

}


function safeURL(
  url
){

  try{

    const parsed =
      new URL(
        url,
        location.origin
      );


    if(
      parsed.protocol ===
        "https:" ||
      parsed.protocol ===
        "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch{}

  return "";

}


function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  );

}

</script>

</body>
</html>
