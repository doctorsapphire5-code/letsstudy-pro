<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography Skills</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    header {
      padding: 70px 0;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          #0f172a,
          #0f766e,
          #14b8a6
        );
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      margin-bottom: 18px;
      border-radius: 30px;
      background: rgba(255,255,255,.15);
      font-size: .85rem;
      font-weight: 700;
    }

    header h1 {
      margin: 0 0 15px;
      font-size: clamp(2.3rem, 6vw, 4rem);
    }

    header p {
      max-width: 760px;
      margin: 0;
      line-height: 1.7;
      color: #ecfeff;
    }

    main {
      padding: 40px 0;
    }

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
      padding: 20px;
      margin-bottom: 25px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .filter-group label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: var(--muted);
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: #fff;
      font-size: .95rem;
    }

    .input-wrap input {
      padding-left: 40px;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15,118,110,.1);
    }

    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .result-bar select {
      width: auto;
      min-width: 180px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .skill-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .skill-card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 15px 35px rgba(15,23,42,.12);
    }

    .skill-cover {
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 4rem;
    }

    .cover-fundamentals {
      background: linear-gradient(135deg,#334155,#0f172a);
    }

    .cover-portrait {
      background: linear-gradient(135deg,#db2777,#831843);
    }

    .cover-landscape {
      background: linear-gradient(135deg,#0ea5e9,#075985);
    }

    .cover-street {
      background: linear-gradient(135deg,#f59e0b,#92400e);
    }

    .cover-lighting {
      background: linear-gradient(135deg,#7c3aed,#4c1d95);
    }

    .cover-editing {
      background: linear-gradient(135deg,#14b8a6,#115e59);
    }

    .cover-commercial {
      background: linear-gradient(135deg,#2563eb,#1e3a8a);
    }

    .cover-advanced {
      background: linear-gradient(135deg,#ef4444,#7f1d1d);
    }

    .skill-content {
      padding: 20px;
    }

    .skill-content h3 {
      margin: 10px 0;
      line-height: 1.35;
    }

    .skill-content p {
      color: var(--muted);
      line-height: 1.6;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #f0fdfa;
      color: #0f766e;
      font-size: .78rem;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 700;
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--muted);
    }

    .empty i {
      margin-bottom: 15px;
      font-size: 3rem;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15,23,42,.72);
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      position: relative;
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      border-radius: 16px;
      background: #fff;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 16px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 30px;
      cursor: pointer;
    }

    .modal-box li {
      margin: 10px 0;
      color: var(--muted);
      line-height: 1.5;
    }

    footer {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 750px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .result-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .result-bar select {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">

    <div class="eyebrow">
      <i class="fa-solid fa-camera"></i>
      Career Skills
    </div>

    <h1>Photography Skills</h1>

    <p>
      Build practical photography skills for portraits,
      landscapes, street photography, lighting, editing,
      commercial work, and professional visual storytelling.
    </p>

  </div>
</header>


<main class="container">

  <!-- FILTERS -->
  <section class="filters">

    <div class="filter-group">

      <label for="search">
        Search Skills
      </label>

      <div class="input-wrap">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="search"
          id="search"
          placeholder="Search photography skills..."
        >

      </div>

    </div>


    <div class="filter-group">

      <label for="level">
        Level
      </label>

      <select id="level">

        <option value="all">
          All Levels
        </option>

        <option value="Beginner">
          Beginner
        </option>

        <option value="Intermediate">
          Intermediate
        </option>

        <option value="Advanced">
          Advanced
        </option>

      </select>

    </div>


    <div class="filter-group">

      <label for="category">
        Category
      </label>

      <select id="category">

        <option value="all">
          All Categories
        </option>

        <option value="Photography">
          Photography
        </option>

        <option value="Portrait">
          Portrait
        </option>

        <option value="Landscape">
          Landscape
        </option>

        <option value="Street Photography">
          Street Photography
        </option>

        <option value="Lighting">
          Lighting
        </option>

        <option value="Photo Editing">
          Photo Editing
        </option>

        <option value="Commercial">
          Commercial
        </option>

        <option value="Advanced Photography">
          Advanced Photography
        </option>

      </select>

    </div>

  </section>


  <!-- RESULTS -->
  <div class="result-bar">

    <strong id="resultCount">
      0 skills
    </strong>

    <select id="sort">

      <option value="popularity">
        Most Popular
      </option>

      <option value="az">
        A-Z
      </option>

      <option value="level">
        Level
      </option>

    </select>

  </div>


  <!-- SKILLS -->
  <section
    class="skills-grid"
    id="skillsGrid"
  ></section>

</main>


<!-- MODAL -->
<div
  class="modal"
  id="detailsModal"
>

  <div class="modal-box">

    <button
      type="button"
      class="close"
      id="closeModal"
      aria-label="Close"
    >
      &times;
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<footer>
  <p>
    © 2026 Photography Skills Platform
  </p>
</footer>


<script>

  /* =========================================
     PHOTOGRAPHY SKILLS
  ========================================= */

  const photographySkills = [

    {
      id: 1,
      title: "Photography Fundamentals",
      category: "Photography",
      level: "Beginner",
      duration: "4 weeks",
      popularity: 99,
      icon: "fa-solid fa-camera",
      cover: "fundamentals",
      description:
        "Learn the fundamentals of photography, camera settings, composition, exposure, and creative control.",
      skills: [
        "Camera controls",
        "Exposure triangle",
        "Composition",
        "Focus techniques",
        "Image framing"
      ]
    },


    {
      id: 2,
      title: "Portrait Photography",
      category: "Portrait",
      level: "Intermediate",
      duration: "6 weeks",
      popularity: 98,
      icon: "fa-solid fa-user",
      cover: "portrait",
      description:
        "Learn how to create compelling portraits using composition, posing, lighting, and creative direction.",
      skills: [
        "Portrait composition",
        "Posing",
        "Natural lighting",
        "Studio portraits",
        "Subject direction"
      ]
    },


    {
      id: 3,
      title: "Landscape Photography",
      category: "Landscape",
      level: "Intermediate",
      duration: "5 weeks",
      popularity: 94,
      icon: "fa-solid fa-mountain-sun",
      cover: "landscape",
      description:
        "Capture landscapes with strong composition, depth, natural light, and professional exposure techniques.",
      skills: [
        "Landscape composition",
        "Golden hour",
        "Depth and perspective",
        "Long exposure",
        "Outdoor shooting"
      ]
    },


    {
      id: 4,
      title: "Street Photography",
      category: "Street Photography",
      level: "Intermediate",
      duration: "5 weeks",
      popularity: 91,
      icon: "fa-solid fa-street-view",
      cover: "street",
      description:
        "Develop observation and timing skills for authentic street photography and visual storytelling.",
      skills: [
        "Observation",
        "Timing",
        "Candid photography",
        "Urban composition",
        "Visual storytelling"
      ]
    },


    {
      id: 5,
      title: "Photography Lighting",
      category: "Lighting",
      level: "Intermediate",
      duration: "7 weeks",
      popularity: 96,
      icon: "fa-solid fa-lightbulb",
      cover: "lighting",
      description:
        "Master natural and artificial lighting to create controlled and expressive photographs.",
      skills: [
        "Natural light",
        "Studio lighting",
        "Light modifiers",
        "Three-point lighting",
        "Creative lighting"
      ]
    },


    {
      id: 6,
      title: "Photo Editing",
      category: "Photo Editing",
      level: "Intermediate",
      duration: "6 weeks",
      popularity: 97,
      icon: "fa-solid fa-sliders",
      cover: "editing",
      description:
        "Learn professional photo editing techniques for color, exposure, retouching, and image enhancement.",
      skills: [
        "RAW processing",
        "Color correction",
        "Retouching",
        "Exposure adjustment",
        "Image enhancement"
      ]
    },


    {
      id: 7,
      title: "Commercial Photography",
      category: "Commercial",
      level: "Advanced",
      duration: "8 weeks",
      popularity: 89,
      icon: "fa-solid fa-bag-shopping",
      cover: "commercial",
      description:
        "Build professional photography skills for products, advertising, brands, and commercial clients.",
      skills: [
        "Product photography",
        "Advertising photography",
        "Client briefs",
        "Studio workflow",
        "Commercial lighting"
      ]
    },


    {
      id: 8,
      title: "Advanced Photography",
      category: "Advanced Photography",
      level: "Advanced",
      duration: "10 weeks",
      popularity: 87,
      icon: "fa-solid fa-aperture",
      cover: "advanced",
      description:
        "Develop advanced creative and technical photography skills for professional-level projects.",
      skills: [
        "Advanced exposure",
        "Creative techniques",
        "Professional workflow",
        "Advanced composition",
        "Photography projects"
      ]
    }

  ];


  /* =========================================
     DOM ELEMENTS
  ========================================= */

  const skillsGrid =
    document.getElementById("skillsGrid");

  const searchInput =
    document.getElementById("search");

  const levelSelect =
    document.getElementById("level");

  const categorySelect =
    document.getElementById("category");

  const sortSelect =
    document.getElementById("sort");

  const resultCount =
    document.getElementById("resultCount");

  const modal =
    document.getElementById("detailsModal");

  const modalContent =
    document.getElementById("modalContent");

  const closeModal =
    document.getElementById("closeModal");


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     RENDER SKILLS
  ========================================= */

  function renderSkills(list) {

    if (!list.length) {

      skillsGrid.innerHTML = `

        <div class="empty">

          <i class="fa-solid fa-camera"></i>

          <h2>
            No skills found
          </h2>

          <p>
            Try another search term or change your filters.
          </p>

        </div>

      `;

      resultCount.textContent =
        "0 skills";

      return;
    }


    skillsGrid.innerHTML =
      list.map(skill => `

        <article class="skill-card">

          <div
            class="skill-cover cover-${skill.cover}"
          >

            <i class="${skill.icon}"></i>

          </div>


          <div class="skill-content">

            <div class="meta">

              <span class="badge">
                ${escapeHTML(skill.level)}
              </span>

              <span class="badge">
                ${escapeHTML(skill.category)}
              </span>

            </div>


            <h3>
              ${escapeHTML(skill.title)}
            </h3>


            <p>
              ${escapeHTML(skill.description)}
            </p>


            <div class="meta">

              <span class="badge">

                <i class="fa-regular fa-clock"></i>

                ${escapeHTML(skill.duration)}

              </span>


              <span class="badge">

                <i class="fa-solid fa-fire"></i>

                ${skill.popularity}%

              </span>

            </div>


            <button
              type="button"
              class="btn btn-primary"
              onclick="showDetails(${skill.id})"
            >
              View Details
            </button>

          </div>

        </article>

      `).join("");


    resultCount.textContent =
      `${list.length} skill${list.length === 1 ? "" : "s"}`;

  }


  /* =========================================
     FILTER SKILLS
  ========================================= */

  function filterSkills() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    const level =
      levelSelect.value;

    const category =
      categorySelect.value;


    let filtered =
      photographySkills.filter(skill => {

        const searchableText = [

          skill.title,
          skill.category,
          skill.level,
          skill.description,
          skill.duration,
          ...skill.skills

        ]
          .join(" ")
          .toLowerCase();


        const matchesSearch =
          !search ||
          searchableText.includes(search);


        const matchesLevel =
          level === "all" ||
          skill.level === level;


        const matchesCategory =
          category === "all" ||
          skill.category === category;


        return (
          matchesSearch &&
          matchesLevel &&
          matchesCategory
        );

      });


    /* =====================================
       SORT
    ===================================== */

    if (sortSelect.value === "az") {

      filtered.sort(
        (a, b) =>
          a.title.localeCompare(b.title)
      );

    }

    else if (sortSelect.value === "level") {

      const levelOrder = {
        Beginner: 1,
        Intermediate: 2,
        Advanced: 3
      };

      filtered.sort(
        (a, b) =>
          levelOrder[a.level] -
          levelOrder[b.level]
      );

    }

    else {

      filtered.sort(
        (a, b) =>
          b.popularity -
          a.popularity
      );

    }


    renderSkills(filtered);

  }


  /* =========================================
     SHOW DETAILS
  ========================================= */

  function showDetails(id) {

    const skill =
      photographySkills.find(
        item => item.id === id
      );

    if (!skill) {
      return;
    }


    modalContent.innerHTML = `

      <div
        class="skill-cover cover-${skill.cover}"
        style="
          border-radius:12px;
          margin-bottom:20px;
        "
      >

        <i class="${skill.icon}"></i>

      </div>


      <span class="badge">
        ${escapeHTML(skill.category)}
      </span>


      <h2>
        ${escapeHTML(skill.title)}
      </h2>


      <p>
        ${escapeHTML(skill.description)}
      </p>


      <p>
        <strong>Level:</strong>
        ${escapeHTML(skill.level)}
      </p>


      <p>
        <strong>Duration:</strong>
        ${escapeHTML(skill.duration)}
      </p>


      <h3>
        Key Skills
      </h3>


      <ul>

        ${skill.skills.map(item => `

          <li>

            <i
              class="fa-solid fa-check"
              style="
                color:#16a34a;
                margin-right:7px;
              "
            ></i>

            ${escapeHTML(item)}

          </li>

        `).join("")}

      </ul>


      <button
        type="button"
        class="btn btn-primary"
        onclick="startLearning(${skill.id})"
      >
        Start Learning
      </button>

    `;


    modal.classList.add("active");

    document.body.style.overflow =
      "hidden";

  }


  /* =========================================
     START LEARNING
  =============
/* =========================================
     START LEARNING
  ========================================= */

  function startLearning(id) {

    const skill =
      photographySkills.find(
        item => item.id === id
      );

    if (!skill) {
      return;
    }

    modalContent.innerHTML = `

      <div
        class="skill-cover cover-${skill.cover}"
        style="
          border-radius:12px;
          margin-bottom:20px;
        "
      >
        <i class="${skill.icon}"></i>
      </div>

      <span class="badge">
        ${escapeHTML(skill.category)}
      </span>

      <h2>
        Start Learning:
        ${escapeHTML(skill.title)}
      </h2>

      <p>
        Follow this learning path to develop
        practical photography skills.
      </p>

      <h3>
        Learning Path
      </h3>

      <ol>
        ${skill.skills.map((item, index) => `

          <li>
            <strong>
              Step ${index + 1}:
            </strong>
            ${escapeHTML(item)}
          </li>

        `).join("")}
      </ol>

      <div
        style="
          margin-top:20px;
          padding:15px;
          border-radius:10px;
          background:#f0fdfa;
          color:#115e59;
        "
      >
        <strong>
          Recommended Level:
        </strong>
        ${escapeHTML(skill.level)}
      </div>

      <button
        type="button"
        class="btn btn-primary"
        style="margin-top:20px;"
        onclick="closeDetails()"
      >
        Begin Course
      </button>

    `;

  }


  /* =========================================
     CLOSE MODAL
  ========================================= */

  function closeDetails() {

    modal.classList.remove("active");

    document.body.style.overflow = "";

  }


  closeModal.addEventListener(
    "click",
    closeDetails
  );


  modal.addEventListener(
    "click",
    function(event) {

      if (event.target === modal) {
        closeDetails();
      }

    }
  );


  /* =========================================
     ESC KEY
  ========================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {
        closeDetails();
      }

    }
  );


  /* =========================================
     EVENTS
  ========================================= */

  searchInput.addEventListener(
    "input",
    filterSkills
  );

  levelSelect.addEventListener(
    "change",
    filterSkills
  );

  categorySelect.addEventListener(
    "change",
    filterSkills
  );

  sortSelect.addEventListener(
    "change",
    filterSkills
  );


  /* =========================================
     KEYBOARD SEARCH
  ========================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "/" &&
        document.activeElement.tagName !== "INPUT" &&
        document.activeElement.tagName !== "SELECT"
      ) {

        event.preventDefault();

        searchInput.focus();

      }

    }
  );


  /* =========================================
     RESET FILTERS
  ========================================= */

  function resetFilters() {

    searchInput.value = "";
    levelSelect.value = "all";
    categorySelect.value = "all";
    sortSelect.value = "popularity";

    filterSkills();

  }


  /* =========================================
     INITIAL LOAD
  ========================================= */

  renderSkills(
    [...photographySkills].sort(
      (a, b) =>
        b.popularity -
        a.popularity
    )
  );

</script>

</body>
</html>
