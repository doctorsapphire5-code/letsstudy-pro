<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Product | LetsStudy Pro</title>
<meta id="metaDescription" name="description"
      content="View product on LetsStudy Pro Marketplace">

<meta property="og:type" content="product">
<meta id="ogTitle" property="og:title" content="Product | LetsStudy Pro">
<meta id="ogDescription" property="og:description" content="">
<meta id="ogImage" property="og:image" content="">
<meta id="ogUrl" property="og:url" content="">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    height:65px;
    background:#fff;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    position:sticky;
    top:0;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:900;
}

.logo{
    width:40px;
    height:40px;
    border-radius:10px;
    background:#172033;
    color:#fff;
    display:grid;
    place-items:center;
    font-size:11px;
}

.btn{
    border:0;
    border-radius:8px;
    padding:10px 14px;
    font-weight:800;
    cursor:pointer;
}

.primary{
    background:#2563eb;
    color:#fff;
}

.light{
    background:#eef2f7;
    color:#172033;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 18px;
}

.back{
    margin-bottom:18px;
}

.product{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:15px;
    padding:20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.image{
    height:430px;
    border-radius:13px;
    background:#eef2ff;
    display:grid;
    place-items:center;
    overflow:hidden;
    font-size:100px;
}

.image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.category{
    color:#2563eb;
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
}

h1{
    font-size:32px;
    margin:8px 0;
}

.price{
    font-size:27px;
    font-weight:900;
    margin:15px 0;
}

.description{
    color:#64748b;
    line-height:1.7;
    font-size:14px;
}

.info{
    margin-top:20px;
    border-top:1px solid #e2e8f0;
    padding-top:15px;
}

.info div{
    padding:7px 0;
    font-size:12px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:20px;
}

.actions .btn{
    flex:1;
}

.loading,
.error{
    background:#fff;
    border-radius:12px;
    padding:50px;
    text-align:center;
    color:#64748b;
}

.share{
    margin-top:20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

footer{
    text-align:center;
    padding:30px;
    color:#64748b;
    font-size:11px;
}

@media(max-width:700px){

    .product{
        grid-template-columns:1fr;
    }

    .image{
        height:300px;
    }

    h1{
        font-size:25px;
    }

}

</style>
</head>

<body>

<header>

<a href="physical-products.html"
   class="brand">

    <div class="logo">
        LSP
    </div>

    <span>
        LetsStudy Pro
    </span>

</a>

<a href="physical-products.html"
   class="btn light">

    Marketplace

</a>

</header>


<main class="container">

<button
    class="btn light back"
    onclick="history.back()">

    ← Back

</button>


<div id="loading"
     class="loading">

    Loading product...

</div>


<div id="error"
     class="error"
     style="display:none">

    Product not found.

</div>


<section
    id="product"
    class="product"
    style="display:none">


    <div
        id="productImage"
        class="image">

    </div>


    <div>

        <div
            id="productCategory"
            class="category">

        </div>


        <h1 id="productName">
        </h1>


        <div
            id="productPrice"
            class="price">

        </div>


        <p
            id="productDescription"
            class="description">

        </p>


        <div class="info">

            <div>
                <strong>
                    Seller:
                </strong>

                <span id="productSeller">
                </span>
            </div>


            <div>
                <strong>
                    Stock:
                </strong>

                <span id="productStock">
                </span>
            </div>


            <div>
                <strong>
                    Product ID:
                </strong>

                <span id="productId">
                </span>
            </div>

        </div>


        <div class="actions">

            <button
                id="cartButton"
                class="btn primary"
                onclick="addToCart()">

                🛒 Add to Cart

            </button>


            <button
                class="btn light"
                onclick="shareProduct()">

                ↗ Share

            </button>

        </div>


        <div class="share">

            <a
                id="whatsapp"
                class="btn light"
                target="_blank">

                WhatsApp

            </a>


            <button
                class="btn light"
                onclick="copyLink()">

                🔗 Copy Link

            </button>

        </div>

    </div>

</section>

</main>


<footer>

© <span id="year"></span>
LetsStudy Pro Marketplace

</footer>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
        "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
        "let-s-study-pro-course",

    messagingSenderId:
        "474928293390",

    appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
        "G-85B7V5H5J0"

};

const app =
    initializeApp(
        firebaseConfig
    );

const db =
    getFirestore(app);


/* =========================
   HELPERS
========================= */

function get(id){

    return document.getElementById(id);

}

function money(value){

    return (
        "TZS " +
        Number(value || 0)
        .toLocaleString()
    );

}


/* =========================
   PRODUCT ID
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const productId =
    params.get("id");


/* =========================
   LOAD PRODUCT
========================= */

async function loadProduct(){

    if(!productId){

        showError(
            "No product ID was provided."
        );

        return;

    }


    try{

        const productRef =
            doc(
                db,
                "products",
                productId
            );


        const snapshot =
            await getDoc(
                productRef
            );


        if(
            !snapshot.exists()
        ){

            showError(
                "This product does not exist."
            );

            return;

        }


        const data =
            snapshot.data();


        renderProduct(
            data
        );


    }catch(error){

        console.error(
            error
        );

        showError(
            "Unable to load product."
        );

    }

}


/* =========================
   RENDER
========================= */

function renderProduct(data){

    const name =
        data.name ||
        data.title ||
        "Product";


    const description =
        data.description ||
        "No description available.";


    const category =
        data.category ||
        "Other";


    const price =
        Number(
            data.price || 0
        );


    const stock =
        Number(
            data.stock || 0
        );


    const seller =
        data.sellerName ||
        data.seller ||
        "Seller";


    const image =
        data.imageUrl ||
        data.image ||
        "";


    get(
        "productCategory"
    ).textContent =
        category;


    get(
        "productName"
    ).textContent =
        name;


    get(
        "productPrice"
    ).textContent =
        money(price);


    get(
        "productDescription"
    ).textContent =
        description;


    get(
        "productSeller"
    ).textContent =
        seller;


    get(
        "productStock"
    ).textContent =
        stock > 0
        ? stock + " available"
        : "Out of stock";


    get(
        "productId"
    ).textContent =
        productId;


    /* =====================
       IMAGE URL ONLY
       NO FIREBASE STORAGE
    ===================== */

    if(image){

        get(
            "productImage"
        ).innerHTML = `

            <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(name)}">

        `;

    }else{

        get(
            "productImage"
        ).textContent =
            data.icon || "📦";

    }


    if(stock <= 0){

        const button =
            get(
                "cartButton"
            );

        button.disabled =
            true;

        button.textContent =
            "Out of Stock";

        button.style.opacity =
            ".5";

    }


    /* =====================
       SEO
    ===================== */

    document.title =
        name +
        " | LetsStudy Pro";


    get(
        "metaDescription"
    ).content =
        description;


    get(
        "ogTitle"
    ).content =
        name;


    get(
        "ogDescription"
    ).content =
        description;


    get(
        "ogImage"
    ).content =
        image;


    get(
        "ogUrl"
    ).content =
        window.location.href;


    /* =====================
       WHATSAPP
    ===================== */

    const shareText =
        name +
        " - " +
        money(price) +
        "\n\n" +
        description +
        "\n\n" +
        "View product:\n" +
        window.location.href;


    get(
        "whatsapp"
    ).href =
        "https://wa.me/?text=" +
        encodeURIComponent(
            shareText
        );


    get(
        "loading"
    ).style.display =
        "none";


    get(
        "product"
    ).style.display =
        "grid";

}


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   ERROR
========================= */

function showError(message){

    get(
        "loading"
    ).style.display =
        "none";


    get(
        "error"
    ).style.display =
        "block";


    get(
        "error"
    ).textContent =
        message;

}


/* =========================
   CART
========================= */

function addToCart(){

    const cart =
        JSON.parse(
            localStorage.getItem(
                "letsstudy_physical_cart"
            ) || "[]"
        );


    const item =
        cart.find(
            item =>
                item.id ===
                productId
        );


    if(item){

        item.quantity++;

    }else{

        cart.push({

            id:
                productId,

            quantity:
                1

        });

    }


    localStorage.setItem(

        "letsstudy_physical_cart",

        JSON.stringify(
            cart
        )

    );


    alert(
        "Product added to cart."
    );

}


/* =========================
   SHARE
========================= */

async function shareProduct(){

    const url =
        window.location.href;


    const title =
        document.title;


    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:title,

                text:
                    "Check this product on LetsStudy Pro.",

                url:url

            });

        }catch(error){

            if(
                error.name !==
                "AbortError"
            ){

                console.error(
                    error
                );

            }

        }

        return;

    }


    await copyLink();

}


async function copyLink(){

    try{

        await navigator.clipboard
            .writeText(
                window.location.href
            );


        alert(
            "Product link copied."
        );

    }catch(error){

        alert(
            "Copy failed."
        );

    }

}


window.addToCart =
    addToCart;

window.shareProduct =
    shareProduct;

window.copyLink =
    copyLink;


get("year")
    .textContent =
    new Date()
    .getFullYear();


loadProduct();

</script>

</body>
</html>
