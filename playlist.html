.loader{

.spinner{

@keyframes spin{
 to{transform:rotate(360deg)}
}

.modal{

.field{margin-bottom:15px}

.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 background:#111827;
 color:#fff;

 transform:translateY(20px);
 transition:.2s;
 z-index:2000;
}

.toast.show{
 opacity:1;
 transform:translateY(0);
}

@media(max-width:1050px){

}

@media(max-width:600px){
 .stats{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
}

import {
 initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 updateDoc,
 deleteDoc,
 doc,
 query,
 where,
 serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==============================
 FIREBASE
============================== */

const firebaseConfig={
 apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
 authDomain:"let-s-study-pro-course.firebaseapp.com",
 databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
 projectId:"let-s-study-pro-course",
 storageBucket:"let-s-study-pro-course.firebasestorage.app",
 messagingSenderId:"474928293390",
 appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
 measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* ==============================
 STATE
============================== */

let currentUser=null;
let playlists=[];
let editingId=null;


/* ==============================
 HELPERS
============================== */

const $=id=>document.getElementById(id);

function esc(value){

 return String(value??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

function formatDate(value){

 if(!value)return "—";

 try{

  if(value.toDate)
   return value.toDate().toLocaleDateString();

  return new Date(value).toLocaleDateString();

 }catch{

  return "—";

 }

}

function toast(message){

 $("toast").textContent=message;
 $("toast").classList.add("show");

 setTimeout(()=>{
  $("toast").classList.remove("show");
 },2200);

}

function formatNumber(value){

 return Number(value||0).toLocaleString();

}


/* ==============================
 AUTH
============================== */

onAuthStateChanged(auth,async user=>{

 if(!user){

  $("userName").textContent="Guest";
  $("userEmail").textContent="Not signed in";

  $("playlistGrid").innerHTML=`
   <div class="empty">

    <h3>Login required</h3>

    <p style="margin-top:6px">
     Sign in to manage your playlists.
    </p>

   </div>
  `;

  return;

 }

 currentUser=user;

 $("userName").textContent=
  user.displayName||"Creator";

 $("userEmail").textContent=
  user.email||"";

 $("avatar").textContent=
  (user.displayName||user.email||"U")
  .charAt(0)
  .toUpperCase();

 await loadPlaylists();

});


/* ==============================
 LOAD PLAYLISTS
============================== */

window.loadPlaylists=async function(){

 if(!currentUser)return;

 $("playlistGrid").innerHTML=`
  <div class="loader">
   <div class="spinner"></div>
   Loading playlists...
  </div>
 `;

 try{

  const q=query(
   collection(db,"playlists"),
   where("ownerId","==",currentUser.uid)
  );

  const snap=await getDocs(q);

  playlists=[];

  snap.forEach(d=>{

   playlists.push({
    id:d.id,
    ...d.data()
   });

  });

  playlists.sort((a,b)=>{

   const da=a.createdAt?.toMillis?
    a.createdAt.toMillis():0;

   const db=b.createdAt?.toMillis?
    b.createdAt.toMillis():0;

   return db-da;

  });

  updateStats();
  render();

 }catch(error){

  console.error(error);

  $("playlistGrid").innerHTML=`
   <div class="empty">
    <h3>Unable to load playlists</h3>
    <p style="margin-top:6px">
     ${esc(error.message)}
    </p>
   </div>
  `;

 }

};


/* ==============================
 STATS
============================== */

function updateStats(){

 let publicCount=0;
 let privateCount=0;
 let videos=0;

 playlists.forEach(p=>{

  const visibility=
   String(p.visibility||"public")
   .toLowerCase();

  if(visibility==="public")
   publicCount++;

  if(visibility==="private")
   privateCount++;

  videos+=Number(p.videosCount||0);

 });

 $("totalPlaylists").textContent=
  formatNumber(playlists.length);

 $("publicPlaylists").textContent=
  formatNumber(publicCount);

 $("privatePlaylists").textContent=
  formatNumber(privateCount);

 $("totalVideos").textContent=
  formatNumber(videos);

}


/* ==============================
 RENDER
============================== */

window.render=function(){

 const search=
  $("search").value
   .trim()
   .toLowerCase();

 const visibility=
  $("visibilityFilter").value;

 const filtered=
  playlists.filter(p=>{

   const text=[
    p.name,
    p.description,
    p.channelId,
    p.ownerId
   ]
   .join(" ")
   .toLowerCase();

   const matchSearch=
    !search||text.includes(search);

   const matchVisibility=
    visibility==="all"||
    String(p.visibility||"public")
     .toLowerCase()===visibility;

   return matchSearch&&matchVisibility;

  });

 const grid=$("playlistGrid");

 if(!filtered.length){

  grid.innerHTML=`
   <div class="empty">

    <div style="font-size:40px">
     📁
    </div>

    <h3>No playlists found</h3>

    <p style="margin-top:5px">
     Create your first playlist.
    </p>

    <button
     class="btn btn-primary"
     style="margin-top:14px"
     onclick="openCreate()">
     + Create Playlist
    </button>

   </div>
  `;

  return;

 }

 grid.innerHTML=
  filtered.map(p=>{

   const thumbnail=
    p.thumbnail||
    "https://images.unsplash.com/photo-1492619375914-88005aa9e8fb?auto=format&fit=crop&w=900&q=80";

   const visibility=
    String(p.visibility||"public");

   return `

    <article class="card">

     <div class="thumbnail">

      <img
       src="${esc(thumbnail)}"
       alt="${esc(p.name||"Playlist")}"
       loading="lazy">

      <span class="visibility">
       ${esc(visibility)}
      </span>

     </div>


     <div class="card-body">

      <div class="card-title">
       ${esc(p.name||"Untitled Playlist")}
      </div>

      <div class="description">

       ${esc(
        p.description||
        "No playlist description."
       )}

      </div>


      <div class="meta">

       <span>
        🎬 ${formatNumber(p.videosCount)} videos
       </span>

       <span>
        ${formatDate(p.createdAt)}
       </span>

      </div>


      <div class="card-actions">

       <button
        class="small-btn primary"
        onclick="openPlaylist('${p.id}')">
        Open
       </button>

       <button
        class="small-btn"
        onclick="editPlaylist('${p.id}')">
        Edit
       </button>

       <button
        class="small-btn danger"
        onclick="removePlaylist('${p.id}')">
        Delete
       </button>

      </div>

     </div>

    </article>

   `;

  }).join("");

};


/* ==============================
 CREATE
============================== */

window.openCreate=function(){

 editingId=null;

 $("modalTitle").textContent=
  "Create Playlist";

 $("saveBtn").textContent=
  "Create Playlist";

 $("playlistName").value="";
 $("playlistDescription").value="";
 $("playlistThumbnail").value="";
 $("playlistVisibility").value="public";
 $("playlistChannelId").value="";

 $("modal").classList.add("show");

};


/* ==============================
 EDIT
============================== */

window.editPlaylist=function(id){

 const playlist=
  playlists.find(p=>p.id===id);

 if(!playlist)return;

 editingId=id;

 $("modalTitle").textContent=
  "Edit Playlist";

 $("saveBtn").textContent=
  "Save Changes";

 $("playlistName").value=
  playlist.name||"";

 $("playlistDescription").value=
  playlist.description||"";

 $("playlistThumbnail").value=
  playlist.thumbnail||"";

 $("playlistVisibility").value=
  playlist.visibility||"public";

 $("playlistChannelId").value=
  playlist.channelId||"";

 $("modal").classList.add("show");

};


/* ==============================
 SAVE
============================== */

window.savePlaylist=async function(){

 if(!currentUser){
  toast("Please sign in first");
  return;
 }

 const name=
  $("playlistName").value.trim();

 if(!name){

  toast("Playlist name is required");
  $("playlistName").focus();
  return;

 }

 const data={

  ownerId:currentUser.uid,

  channelId:
   $("playlistChannelId").value.trim(),

  name:name,

  description:
   $("playlistDescription").value.trim(),

  thumbnail:
   $("playlistThumbnail").value.trim(),

  visibility:
   $("playlistVisibility").value,

  videosCount:
   editingId
    ? Number(
       playlists.find(
        p=>p.id===editingId
       )?.videosCount||0
      )
    : 0,

  updatedAt:serverTimestamp()

 };


 try{

  $("saveBtn").disabled=true;
  $("saveBtn").textContent="Saving...";

  if(editingId){

   await updateDoc(
    doc(db,"playlists",editingId),
    data
   );

   toast("Playlist updated");

  }else{

   data.createdAt=
    serverTimestamp();

   await addDoc(
    collection(db,"playlists"),
    data
   );

   toast("Playlist created");

  }

  closeModal();

  await loadPlaylists();

 }catch(error){

  console.error(error);

  toast(
   error.message||
   "Failed to save playlist"
  );

 }finally{

  $("saveBtn").disabled=false;

  $("saveBtn").textContent=
   editingId
    ?"Save Changes"
    :"Create Playlist";

 }

};


/* ==============================
 DELETE
============================== */

<script>
/* ==============================
   DELETE
============================== */

window.removePlaylist = async function(id){

    const playlist = playlists.find(p => p.id === id);

    if(!playlist){
        showToast("Playlist haijapatikana");
        return;
    }

    const confirmed = confirm(
        `Una uhakika unataka kufuta playlist "${playlist.name || "Unnamed"}"?`
    );

    if(!confirmed) return;

    try{

        await deleteDoc(
            doc(db, "playlists", id)
        );

        showToast("Playlist imefutwa");

        await loadPlaylists();

    }catch(error){

        console.error(
            "Delete playlist error:",
            error
        );

        showToast(
            "Imeshindikana kufuta playlist"
        );

    }

};


/* ==============================
   EDIT
============================== */

window.editPlaylist = function(id){

    const playlist =
        playlists.find(p => p.id === id);

    if(!playlist) return;

    editingId = id;

    document.getElementById("playlistId").value =
        playlist.id || "";

    document.getElementById("playlistName").value =
        playlist.name || "";

    document.getElementById("playlistDescription").value =
        playlist.description || "";

    document.getElementById("playlistThumbnail").value =
        playlist.thumbnail || "";

    document.getElementById("playlistVisibility").value =
        playlist.visibility || "public";

    document.getElementById("formTitle").textContent =
        "Edit Playlist";

    document.getElementById("saveBtn").textContent =
        "Update Playlist";

    document.getElementById("playlistForm").scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

};


/* ==============================
   CANCEL EDIT
============================== */

window.cancelEdit = function(){

    editingId = null;

    const form =
        document.getElementById("playlistForm");

    if(form){
        form.reset();
    }

    const idField =
        document.getElementById("playlistId");

    if(idField){
        idField.value = "";
    }

    document.getElementById("formTitle").textContent =
        "Create Playlist";

    document.getElementById("saveBtn").textContent =
        "Create Playlist";

};


/* ==============================
   VIEW PLAYLIST
============================== */

window.viewPlaylist = function(id){

    const playlist =
        playlists.find(p => p.id === id);

    if(!playlist) return;

    const videos =
        Array.isArray(playlist.videoIds)
            ? playlist.videoIds
            : [];

    document.getElementById("viewTitle").textContent =
        playlist.name || "Unnamed Playlist";

    document.getElementById("viewDescription").textContent =
        playlist.description || "No description";

    document.getElementById("viewOwner").textContent =
        playlist.ownerId || "—";

    document.getElementById("viewChannel").textContent =
        playlist.channelId || "—";

    document.getElementById("viewVisibility").textContent =
        playlist.visibility || "public";

    document.getElementById("viewVideos").textContent =
        playlist.videosCount ??
        videos.length ??
        0;

    document.getElementById("viewModal").classList.add("show");

};


/* ==============================
   CLOSE VIEW
============================== */

window.closeView = function(){

    document
        .getElementById("viewModal")
        .classList.remove("show");

};


/* ==============================
   SEARCH
============================== */

window.searchPlaylists = function(){

    const input =
        document.getElementById("searchInput");

    searchTerm =
        (input?.value || "")
        .trim()
        .toLowerCase();

    renderPlaylists();

};


/* ==============================
   FILTER VISIBILITY
============================== */

window.filterVisibility = function(){

    visibilityFilter =
        document.getElementById(
            "visibilityFilter"
        )?.value || "all";

    renderPlaylists();

};


/* ==============================
   CLEAR FILTERS
============================== */

window.clearFilters = function(){

    const search =
        document.getElementById("searchInput");

    const filter =
        document.getElementById("visibilityFilter");

    if(search){
        search.value = "";
    }

    if(filter){
        filter.value = "all";
    }

    searchTerm = "";

    visibilityFilter = "all";

    renderPlaylists();

};


/* ==============================
   COPY ID
============================== */

window.copyId = async function(id){

    try{

        await navigator.clipboard.writeText(
            String(id)
        );

        showToast(
            "Playlist ID copied"
        );

    }catch(error){

        console.error(
            "Copy error:",
            error
        );

    }

};


/* ==============================
   COPY FIELD
============================== */

window.copyField = async function(value){

    if(!value) return;

    try{

        await navigator.clipboard.writeText(
            String(value)
        );

        showToast("Copied");

    }catch(error){

        console.error(
            "Copy field error:",
            error
        );

    }

};


/* ==============================
   TOAST
============================== */

function showToast(message){

    let toast =
        document.getElementById("toast");

    if(!toast){

        toast =
            document.createElement("div");

        toast.id = "toast";

        toast.style.cssText = `
            position:fixed;
            right:20px;
            bottom:20px;
            z-index:9999;
            background:#111827;
            color:#fff;
            padding:12px 16px;
            border-radius:10px;
            font-size:13px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
            transition:.25s;
        `;

        document.body.appendChild(toast);

    }

    toast.textContent = message;

    toast.style.opacity = "1";
    toast.style.transform = "translateY(0)";

    clearTimeout(toast._timer);

    toast._timer =
        setTimeout(() => {

            toast.style.opacity = "0";
            toast.style.transform =
                "translateY(10px)";

        }, 2500);

}


/* ==============================
   SIDEBAR
============================== */

window.toggleSidebar = function(){

    const sidebar =
        document.getElementById("sidebar");

    if(sidebar){
        sidebar.classList.toggle("open");
    }

};


/* ==============================
   MODAL OUTSIDE CLICK
============================== */

document.addEventListener(
    "click",
    function(event){

        const modal =
            document.getElementById("viewModal");

        if(
            modal &&
            event.target === modal
        ){

            closeView();

        }

    }
);


/* ==============================
   ESCAPE
============================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeView();

        }

    }
);


/* ==============================
   AUTH
============================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            updateUserUI(null);

            await loadPublicPlaylists();

            return;

        }

        updateUserUI(user);

        currentUser = user;

        await loadPlaylists();

    }
);


/* ==============================
   USER UI
============================== */

function updateUserUI(user){

    const name =
        document.getElementById("userName");

    const email =
        document.getElementById("userEmail");

    const avatar =
        document.getElementById("userAvatar");

    if(!user){

        if(name)
            name.textContent = "Guest";

        if(email)
            email.textContent = "Not signed in";

        if(avatar)
            avatar.textContent = "G";

        return;

    }

    const displayName =
        user.displayName ||
        user.email?.split("@")[0] ||
        "User";

    if(name)
        name.textContent = displayName;

    if(email)
        email.textContent =
            user.email || "";

    if(avatar){

        avatar.textContent =
            displayName
                .charAt(0)
                .toUpperCase();

    }

}


/* ==============================
   INITIAL LOAD
============================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const form =
            document.getElementById("playlistForm");

        if(form){

            form.addEventListener(
                "submit",
                savePlaylist
            );

        }

        loadPublicPlaylists();

    }
);


/* ==============================
   GLOBAL ERROR HANDLER
============================== */

window.addEventListener(
    "error",
    function(error){

        console.error(
            "Playlist page error:",
            error.error || error.message
        );

    }
);


/* ==============================
   FIREBASE ERROR HANDLER
============================== */

window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "Unhandled Firebase/Promise error:",
            event.reason
        );

    }
);

</script>
