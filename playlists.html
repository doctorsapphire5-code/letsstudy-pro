<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Playlists | LetsStudy Pro</title>

<meta name="description"
content="Explore learning playlists on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  text-decoration:none;
  color:#172033;
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer
}

.container{
  width:92%;
  max-width:1000px;
  margin:25px auto
}

.hero{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:23px;
  margin-bottom:15px
}

.hero h1{
  font-size:27px
}

.hero p{
  color:#64748b;
  font-size:13px;
  margin-top:6px
}

.tools{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:12px;
  display:flex;
  gap:8px;
  margin-bottom:15px
}

input,
select{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:11px 12px;
  border-radius:8px;
  outline:none
}

input{
  flex:1
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:hidden
}

.cover{
  height:145px;
  background:#eaf2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  color:#2563eb
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover
}

.content{
  padding:16px
}

.title{
  font-size:16px;
  font-weight:800
}

.description{
  color:#64748b;
  font-size:12px;
  line-height:1.5;
  margin-top:6px
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:11px
}

.badge{
  background:#f1f5f9;
  color:#475569;
  padding:5px 8px;
  border-radius:6px;
  font-size:10px
}

.progress{
  margin-top:13px
}

.progress-top{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:#64748b
}

.bar{
  height:6px;
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px
}

.bar span{
  display:block;
  height:100%;
  background:#2563eb
}

.actions{
  display:flex;
  gap:7px;
  margin-top:14px
}

.btn{
  flex:1;
  text-align:center;
  text-decoration:none;
  border:0;
  padding:10px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  cursor:pointer
}

.primary{
  background:#2563eb;
  color:#fff
}

.secondary{
  background:#eef2f7;
  color:#172033
}

.loading,
.empty,
.error{
  grid-column:1/-1;
  background:#fff;
  border-radius:14px;
  padding:45px 20px;
  text-align:center;
  color:#64748b
}

.error{
  color:#b91c1c
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr
  }

  .tools{
    flex-direction:column
  }

  select{
    width:100%
  }
}
</style>
</head>

<body>

<header>

  <a
    href="index.html"
    class="logo"
  >
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <section class="hero">

    <h1>
      Learning Playlists
    </h1>

    <p>
      Organize and continue your learning with
      curated video and course playlists.
    </p>

  </section>


  <section class="tools">

    <input
      id="search"
      type="search"
      placeholder="Search playlists..."
    >


    <select id="category">

      <option value="all">
        All Categories
      </option>

      <option value="programming">
        Programming
      </option>

      <option value="business">
        Business
      </option>

      <option value="marketing">
        Marketing
      </option>

      <option value="education">
        Education
      </option>

      <option value="other">
        Other
      </option>

    </select>

  </section>


  <section
    id="playlists"
    class="grid"
  >

    <div class="loading">
      Loading playlists...
    </div>

  </section>

</main>


<script>

/*
==================================================
LETSSTUDY PRO PLAYLISTS

GET:

/api/playlists

EXPECTED:

{
  playlists:[
    {
      id:"",
      title:"",
      description:"",
      thumbnail:"",
      category:"",
      lessons:12,
      duration:"4h 30m",
      progress:45
    }
  ]
}

OPTIONAL:

/api/playlists?userId=...

PLAYLIST VIEW:

playlist.html?id=PLAYLIST_ID
==================================================
*/


const params =
  new URLSearchParams(
    location.search
  );


const userId =
  params.get("userId") ||
  localStorage.getItem(
    "userId"
  ) ||
  "";


const playlistsBox =
  document.getElementById(
    "playlists"
  );

const search =
  document.getElementById(
    "search"
  );

const category =
  document.getElementById(
    "category"
  );


let playlists = [];


/* =========================
   LOAD
========================= */

loadPlaylists();


async function loadPlaylists(){

  try{

    const endpoint =
      userId
      ? "/api/playlists?userId=" +
        encodeURIComponent(userId)
      : "/api/playlists";


    const response =
      await fetch(
        endpoint
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load playlists."
      );

    }


    playlists =
      Array.isArray(
        result.playlists
      )
      ? result.playlists
      : [];


    render();

  }catch(error){

    console.error(
      error
    );

    playlistsBox.innerHTML = `

      <div class="error">

        <h3>
          Unable to load playlists
        </h3>

        <p style="margin-top:7px">
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const selected =
    category.value;


  const filtered =
    playlists.filter(
      playlist => {

        const text =
          (
            String(
              playlist.title ||
              ""
            ) +
            " " +
            String(
              playlist.description ||
              ""
            ) +
            " " +
            String(
              playlist.category ||
              ""
            )
          ).toLowerCase();


        const playlistCategory =
          String(
            playlist.category ||
            ""
          ).toLowerCase();


        return (

          (
            !keyword ||
            text.includes(
              keyword
            )
          )

          &&

          (
            selected === "all" ||
            playlistCategory === selected
          )

        );

      }
    );


  if(!filtered.length){

    playlistsBox.innerHTML = `

      <div class="empty">

        ${
          playlists.length
          ? "No playlists found."
          : "No playlists available yet."
        }

      </div>

    `;

    return;

  }


  playlistsBox.innerHTML =
    filtered
      .map(
        playlistCard
      )
      .join("");

}


/* =========================
   CARD
========================= */

function playlistCard(
  playlist
){

  const id =
    playlist.id ||
    playlist.documentId ||
    "";


  const title =
    playlist.title ||
    "Untitled Playlist";


  const description =
    playlist.description ||
    "Continue learning with this playlist.";


  const thumbnail =
    playlist.thumbnail ||
    playlist.cover ||
    "";


  const lessons =
    Number(
      playlist.lessons ||
      playlist.lessonCount ||
      0
    );


  const duration =
    playlist.duration ||
    "Self-paced";


  let progress =
    Number(
      playlist.progress ||
      0
    );


  if(
    !Number.isFinite(
      progress
    )
  ){

    progress = 0;

  }


  progress =
    Math.max(
      0,
      Math.min(
        100,
        progress
      )
    );


  const categoryName =
    playlist.category ||
    "Other";


  return `

    <article class="card">

      <div class="cover">

        ${
          thumbnail
          ? `
            <img
              src="${safeURL(thumbnail)}"
              alt="${escapeAttr(title)}"
              loading="lazy"
            >
          `
          : "▶"
        }

      </div>


      <div class="content">

        <div class="title">
          ${escapeHTML(title)}
        </div>


        <div class="description">
          ${escapeHTML(description)}
        </div>


        <div class="meta">

          <span class="badge">
            ${escapeHTML(categoryName)}
          </span>


          <span class="badge">
            ${lessons} Lessons
          </span>


          <span class="badge">
            ${escapeHTML(duration)}
          </span>

        </div>


        <div class="progress">

          <div class="progress-top">

            <span>
              Progress
            </span>

            <strong>
              ${progress}%
            </strong>

          </div>


          <div class="bar">

            <span
              style="width:${progress}%"
            ></span>

          </div>

        </div>


        <div class="actions">

          <a
            class="btn primary"
            href="playlist.html?id=${encodeURIComponent(id)}"
          >
            ${
              progress > 0
              ? "Continue"
              : "Start Learning"
            }
          </a>


          <a
            class="btn secondary"
            href="playlist.html?id=${encodeURIComponent(id)}"
          >
            View
          </a>

        </div>

      </div>

    </article>

  `;

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  render
);


category.addEventListener(
  "change",
  render
);


/* =========================
   HELPERS
========================= */

function safeURL(
  url
){

  try{

    const parsed =
      new URL(
        url,
        location.origin
      );


    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return escapeAttr(
        parsed.href
      );

    }

  }catch{}

  return "";

}


function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  );

}

</script>

</body>
</html>
