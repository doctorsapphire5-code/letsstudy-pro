<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(1000px,92%);margin:0 auto;padding:44px 0 70px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 8px}
.lead{font-size:18px;color:var(--muted);margin:0;max-width:560px}
.btn{border:0;background:var(--p);color:#fff;padding:11px 20px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:9px}
.btn.bad{background:#dc2626;color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}.btn.bad{color:#fff}}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.tools{display:flex;gap:10px;margin-bottom:8px}
.search,.sort{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px}
.search{flex:1;min-width:0}
.search:focus,.sort:focus,.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.ban{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
#count{color:var(--muted);font-size:14px;margin:14px 0;min-height:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pl{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.th{position:relative;display:block;aspect-ratio:16/9;background:var(--soft);color:var(--p);text-decoration:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ph{width:100%;height:100%;display:grid;place-items:center;font-size:34px;font-weight:800}
.th .n{position:absolute;right:8px;bottom:8px;background:rgba(15,23,42,.85);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.in h2{margin:0;font-size:17px;line-height:1.35;letter-spacing:-.01em}
.in h2 a{color:var(--ink);text-decoration:none}
.in h2 a:hover{color:var(--p)}
.ds{margin:0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--muted);margin-top:auto;padding-top:4px}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.act{display:flex;gap:8px;margin-top:10px}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,94vw);background:var(--paper);color:var(--text);box-shadow:0 25px 60px rgba(2,6,23,.4)}
dialog::backdrop{background:rgba(2,6,23,.6)}
.f{padding:22px}
.f h2{margin:0 0 6px;font-size:22px;color:var(--ink)}
.f label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:12px 0 6px}
.f input,.f select,.f textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.f textarea{min-height:90px;resize:vertical}
.f .act{justify-content:flex-end;margin-top:20px}
.state{grid-column:1/-1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.tools{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="channels.html">Channels</a>
    <a href="playlists.html" aria-current="page">Playlists</a>
  </nav>
</div></header>

<main class="wrap">
  <div class="head">
    <div><h1>Playlists</h1><p class="lead">Curated collections of lessons and videos from LetsStudy Pro channels.</p></div>
    <button class="btn" id="newBtn" type="button" hidden="">New playlist</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="explore" aria-selected="true">Explore</button>
    <button class="tab" role="tab" data-v="mine" aria-selected="false">My playlists</button>
  </div>
  <div id="ban" class="ban" hidden=""></div>
  <div class="tools">
    <input id="search" class="search" type="search" placeholder="Search playlists" aria-label="Search playlists">
    <select id="sort" class="sort" aria-label="Sort playlists">
      <option value="upd">Recently updated</option>
      <option value="videos">Most videos</option>
      <option value="az">A to Z</option>
    </select>
  </div>
  <div id="count" role="status"></div>
  <section id="grid" class="grid"></section>
</main>

<dialog id="dlg">
  <div class="f">
    <h2 id="dt">New playlist</h2>
    <label for="fn">Name</label><input id="fn" maxlength="100" placeholder="e.g. Physics revision">
    <label for="fd">Description</label><textarea id="fd" maxlength="500" placeholder="What is this playlist about?"></textarea>
    <label for="ft">Thumbnail URL (optional)</label><input id="ft" type="url" placeholder="https://...">
    <label for="fv">Visibility</label>
    <select id="fv"><option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select>
    <label for="fc">Channel (optional)</label><select id="fc"><option value="">No channel</option></select>
    <div class="act"><button class="btn alt" id="cancel" type="button">Cancel</button><button class="btn" id="save" type="button">Save</button></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>
<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,query,where,limit}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const grid=$("#grid"),countEl=$("#count"),COL="playlists";
const channelParam=(new URLSearchParams(location.search).get("channelId")||"").trim();
/* Where a playlist opens. Change if your page is named differently. */
const OPEN=id=>`playlist-details.html?id=${encodeURIComponent(id)}`;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const cap=s=>s?String(s)[0].toUpperCase()+String(s).slice(1):s;
const num=v=>Number(v)||0;
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}

let user=null,view="explore",pub=null,mine=null,chName={},myChannels=[],editing=null;
const owner=p=>p.owerId||p.ownerId; /* field is spelled "owerId" in Firestore */
const SORTS={upd:(a,b)=>(toD(b.updatedAt||b.createdAt)||0)-(toD(a.updatedAt||a.createdAt)||0),
  videos:(a,b)=>num(b.videosCount)-num(a.videosCount),az:(a,b)=>String(a.name||"").localeCompare(String(b.name||""))};

function card(p){
  const th=safe(p.thumbnail),x=toD(p.updatedAt||p.createdAt),own=user&&owner(p)===user.uid,n=num(p.videosCount);
  const vis=String(p.visibility||"public").toLowerCase();
  return `<article class="pl"><a class="th" href="${OPEN(p.id)}" aria-label="${esc(p.name||"Playlist")}">
      ${th?`<img src="${esc(th)}" alt="" loading="lazy">`:`<div class="ph">${esc((p.name||"P")[0].toUpperCase())}</div>`}
      <span class="n">${n} ${n===1?"video":"videos"}</span></a>
    <div class="in"><h2><a href="${OPEN(p.id)}">${esc(p.name||"Untitled playlist")}</a></h2>
      ${p.description?`<p class="ds">${esc(p.description)}</p>`:""}
      <div class="meta">${p.channelId&&chName[p.channelId]?`<span>${esc(chName[p.channelId])}</span>`:""}${x?`<span>Updated ${esc(ago(x))}</span>`:""}
        ${own&&vis!=="public"?`<span class="b">${esc(cap(vis))}</span>`:""}</div>
      ${own?`<div class="act"><button class="btn alt sm" type="button" data-edit="${esc(p.id)}">Edit</button><button class="btn bad sm" type="button" data-del="${esc(p.id)}">Delete</button></div>`:""}
    </div></article>`;
}

function render(){
  const src=view==="mine"?(mine||[]):(pub||[]),q=$("#search").value.toLowerCase().trim();
  const items=src.filter(p=>(view==="mine"||!channelParam||p.channelId===channelParam)&&
    (!q||[p.name,p.description,chName[p.channelId]].join(" ").toLowerCase().includes(q))).sort(SORTS[$("#sort").value]);
  countEl.textContent=items.length===1?"1 playlist":`${items.length} playlists`;
  grid.innerHTML=items.length?items.map(card).join(""):
    `<div class="state"><h2>${src.length?"No matches":view==="mine"?"You have no playlists yet":"No playlists yet"}</h2><p>${src.length?"Try a different search.":view==="mine"?"Create a playlist to organise your lessons and videos.":"Check back soon."}</p>${view==="mine"&&!src.length?`<button class="btn" type="button" data-new="1">New playlist</button>`:""}</div>`;
}

async function names(list){
  const need=[...new Set(list.map(p=>p.channelId).filter(id=>id&&!(id in chName)))];
  await Promise.all(need.map(async id=>{
    try{const s=await getDoc(doc(db,"channels",id));chName[id]=s.exists()?(s.data().name||s.data().title||""):""}catch{chName[id]=""}
  }));
}

function fail(err){
  console.error(err);countEl.textContent="";
  grid.innerHTML=`<div class="state err"><h2>Unable to load playlists</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").addEventListener("click",()=>show(view,true));
}

async function show(v,force){
  view=v;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.v===v)));
  if(v==="mine"&&!user){
    countEl.textContent="";
    grid.innerHTML=`<div class="state"><h2>Sign in to see your playlists</h2><p>Create and manage playlists with your account.</p><a class="btn" href="login.html">Sign in</a></div>`;
    return;
  }
  const have=v==="mine"?mine:pub;
  if(!have||force){
    try{
      const col=collection(db,COL);
      if(v==="mine"){
        const rs=await Promise.allSettled([getDocs(query(col,where("owerId","==",user.uid))),getDocs(query(col,where("ownerId","==",user.uid)))]);
        if(rs.every(r=>r.status==="rejected"))throw rs[0].reason;
        const m=new Map();
        rs.forEach(r=>r.status==="fulfilled"&&r.value.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()})));
        mine=[...m.values()];
      }else{
        const s=await getDocs(query(col,where("visibility","==","public"),limit(100)));
        pub=s.docs.map(d=>({id:d.id,...d.data()}));
      }
    }catch(e){return fail(e)}
    await names(v==="mine"?mine:pub);
  }
  render();
}

grid.addEventListener("click",async e=>{
  if(e.target.closest("[data-new]"))return openEditor();
  const ed=e.target.closest("[data-edit]");if(ed)return openEditor(mine.find(p=>p.id===ed.dataset.edit));
  const dl=e.target.closest("[data-del]");
  if(dl&&confirm("Delete this playlist?")){
    try{
      await deleteDoc(doc(db,COL,dl.dataset.del));
      mine=mine.filter(p=>p.id!==dl.dataset.del);if(pub)pub=pub.filter(p=>p.id!==dl.dataset.del);
      render();toast("Playlist deleted");
    }catch(err){console.error(err);toast("Could not delete the playlist")}
  }
});
document.addEventListener("error",e=>{
  const i=e.target;
  if(i.tagName==="IMG"&&i.closest(".th"))i.replaceWith(Object.assign(document.createElement("div"),{className:"ph",textContent:"P"}));
},true);
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>show(t.dataset.v)));
$("#search").addEventListener("input",render);
$("#sort").addEventListener("change",render);

/* ---- editor ---- */
async function loadMyChannels(){
  try{
    const s=await getDocs(query(collection(db,"channels"),where("ownerId","==",user.uid)));
    myChannels=s.docs.map(d=>({id:d.id,name:d.data().name||d.data().title||d.id}));
  }catch{myChannels=[]}
}
function openEditor(p){
  editing=p||null;
  $("#dt").textContent=p?"Edit playlist":"New playlist";
  $("#fn").value=p?.name||"";$("#fd").value=p?.description||"";$("#ft").value=p?.thumbnail||"";
  $("#fv").value=p?.visibility||"public";
  $("#fc").innerHTML=`<option value="">No channel</option>`+myChannels.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  $("#fc").value=p?.channelId||"";
  $("#dlg").showModal();$("#fn").focus();
}
$("#newBtn").addEventListener("click",()=>openEditor());
$("#cancel").addEventListener("click",()=>$("#dlg").close());
$("#save").addEventListener("click",async e=>{
  const name=$("#fn").value.trim(),thumb=$("#ft").value.trim();
  if(!name){toast("Enter a playlist name");return}
  if(thumb&&!safe(thumb)){toast("Thumbnail URL must start with https://");return}
  const b=e.currentTarget,now=new Date().toISOString();
  const data={channelId:$("#fc").value,description:$("#fd").value.trim(),name,thumbnail:thumb,visibility:$("#fv").value,updatedAt:now};
  b.disabled=true;
  try{
    if(editing){await updateDoc(doc(db,COL,editing.id),data);Object.assign(editing,data)}
    else{
      const ref=doc(collection(db,COL));
      const full={playlistId:ref.id,createdAt:now,owerId:user.uid,videosCount:"0",...data};
      await setDoc(ref,full);(mine=mine||[]).unshift({id:ref.id,...full});
      if(full.visibility==="public"&&pub)pub.unshift({id:ref.id,...full});
    }
    await names(mine);
    $("#dlg").close();render();toast("Playlist saved");
  }catch(err){console.error(err);toast("Could not save the playlist")}
  b.disabled=false;
});

$("#year").textContent=new Date().getFullYear();
let first=true;
onAuthStateChanged(auth,async u=>{
  user=u;mine=null;$("#newBtn").hidden=!u;
  if(u)await loadMyChannels();
  if(channelParam){
    $("#ban").hidden=false;
    $("#ban").innerHTML=`Showing playlists from one channel. <a href="playlists.html">Show all playlists</a>`;
    try{const s=await getDoc(doc(db,"channels",channelParam));const n=s.exists()&&(s.data().name||s.data().title);if(n)$("#ban").innerHTML=`Showing playlists from <b>${esc(n)}</b>. <a href="playlists.html">Show all playlists</a>`}catch{}
  }
  show(first?"explore":view,!first&&view==="mine");first=false;
});
</script>
