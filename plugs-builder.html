<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plugin Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.container{width:min(1200px,94%);margin:auto}
header{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 0}
.nav{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:900;color:#2563eb}
.actions{display:flex;gap:7px}
button,a{font-family:inherit}
.btn{border:0;border-radius:8px;padding:10px 13px;font-size:9px;font-weight:900;cursor:pointer;text-decoration:none}
.primary{background:#2563eb;color:#fff}
.gray{background:#f1f5f9;color:#334155}
main{padding:25px 0 60px}
.head{margin-bottom:18px}
h1{font-size:27px;margin:0 0 6px}
.subtitle{font-size:10px;color:#64748b}
.layout{display:grid;grid-template-columns:280px 1fr 300px;gap:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:17px}
.title{font-size:12px;font-weight:900;margin-bottom:13px}
.field{margin-bottom:12px}
label{display:block;font-size:8px;font-weight:900;margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid #dbe2ea;border-radius:8px;padding:10px;font-size:9px;outline:0;background:#fff}
textarea{min-height:100px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:#2563eb}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tabs{display:flex;gap:5px;border-bottom:1px solid #e2e8f0;margin-bottom:16px;overflow:auto}
.tab{border:0;background:none;padding:9px 10px;font-size:8px;font-weight:900;color:#64748b;cursor:pointer;white-space:nowrap}
.tab.active{color:#2563eb;border-bottom:2px solid #2563eb}
.panel{display:none}
.panel.active{display:block}
.code{width:100%;min-height:410px;background:#0f172a;color:#e2e8f0;border:0;border-radius:9px;padding:14px;font:11px/1.6 Consolas,monospace;resize:vertical;outline:0}
.toolbar{display:flex;justify-content:space-between;gap:7px;margin-bottom:8px}
.small{font-size:8px;padding:7px 9px}
.preview{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;background:#fff}
.preview-head{background:#eff6ff;padding:20px;text-align:center}
.plugin-icon{font-size:42px;margin-bottom:7px}
.preview-name{font-size:14px;font-weight:900}
.preview-category{font-size:7px;color:#64748b;margin-top:4px}
.preview-body{padding:14px}
.preview-desc{font-size:8px;color:#64748b;line-height:1.6;margin-bottom:12px}
.preview-btn{display:block;text-align:center;background:#2563eb;color:#fff;border-radius:7px;padding:9px;font-size:8px;font-weight:900}
.check{display:flex;gap:7px;align-items:flex-start;margin:9px 0;font-size:8px;color:#475569;line-height:1.5}
.check input{width:auto;margin-top:1px}
.status{padding:5px 7px;border-radius:20px;background:#fef3c7;color:#92400e;font-size:7px;font-weight:900}
.footer-actions{display:flex;gap:7px;margin-top:15px}
.footer-actions button{flex:1}
.message{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:11px 15px;border-radius:8px;font-size:9px;font-weight:800;display:none;z-index:20}
.message.show{display:block}
@media(max-width:1000px){.layout{grid-template-columns:240px 1fr}}
@media(max-width:750px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<div class="container nav">
<div class="logo">🔌 Plugin Builder</div>
<div class="actions">
<a href="my-plugins.html" class="btn gray">My Plugins</a>
<a href="plugin-upload.html" class="btn primary">Upload</a>
</div>
</div>
</header>

<main class="container">

<section class="head">
<h1>Plugin Builder</h1>
<p class="subtitle">Create, configure, preview and save your plugin.</p>
</section>

<div class="layout">

<!-- SETTINGS -->
<aside class="card">

<div class="title">Plugin Settings</div>

<div class="field">
<label>PLUGIN NAME</label>
<input id="pluginName" value="My New Plugin" maxlength="60">
</div>

<div class="row">

<div class="field">
<label>VERSION</label>
<input id="version" value="1.0.0">
</div>

<div class="field">
<label>PRICE USD</label>
<input id="price" type="number" min="0" step=".01" value="0">
</div>

</div>

<div class="field">
<label>CATEGORY</label>
<select id="category">
<option>Business</option>
<option>Analytics</option>
<option>Commerce</option>
<option>Marketing</option>
<option>SEO</option>
<option>Productivity</option>
<option>Communication</option>
<option>Security</option>
</select>
</div>

<div class="field">
<label>ICON</label>
<select id="icon">
<option>🔌</option>
<option>📊</option>
<option>💳</option>
<option>🔍</option>
<option>🛒</option>
<option>📈</option>
<option>💬</option>
<option>⚡</option>
<option>🛡️</option>
<option>📝</option>
</select>
</div>

<div class="field">
<label>DESCRIPTION</label>
<textarea id="description">A powerful plugin for your website.</textarea>
</div>

<div class="title">Publishing</div>

<label class="check">
<input id="publicPlugin" type="checkbox">
<span>Make plugin visible in the marketplace</span>
</label>

<label class="check">
<input id="autoUpdate" type="checkbox" checked>
<span>Enable automatic updates</span>
</label>

</aside>


<!-- BUILDER -->
<section class="card">

<div class="tabs">

<button class="tab active" data-panel="codePanel">
Code
</button>

<button class="tab" data-panel="htmlPanel">
HTML
</button>

<button class="tab" data-panel="cssPanel">
CSS
</button>

<button class="tab" data-panel="jsPanel">
JavaScript
</button>

</div>


<div id="codePanel" class="panel active">

<div class="toolbar">
<div class="title">Plugin JavaScript</div>
<button class="btn gray small" onclick="formatCode()">Format</button>
</div>

<textarea id="code" class="code">function activatePlugin() {
  console.log("Plugin activated");

  const button = document.getElementById("pluginButton");

  if (button) {
    button.addEventListener("click", function () {
      alert("Plugin is working!");
    });
  }
}

activatePlugin();</textarea>

</div>


<div id="htmlPanel" class="panel">

<div class="toolbar">
<div class="title">Plugin HTML</div>
</div>

<textarea id="htmlCode" class="code">&lt;div class="plugin-widget"&gt;
  &lt;h2&gt;My Plugin&lt;/h2&gt;
  &lt;p&gt;Plugin content goes here.&lt;/p&gt;
  &lt;button id="pluginButton"&gt;Run Plugin&lt;/button&gt;
&lt;/div&gt;</textarea>

</div>


<div id="cssPanel" class="panel">

<div class="toolbar">
<div class="title">Plugin CSS</div>
</div>

<textarea id="cssCode" class="code">.plugin-widget {
  padding: 20px;
  border-radius: 12px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
}

.plugin-widget button {
  padding: 9px 12px;
  border: 0;
  border-radius: 7px;
  background: #2563eb;
  color: white;
}</textarea>

</div>


<div id="jsPanel" class="panel">

<div class="toolbar">
<div class="title">Advanced JavaScript</div>
</div>

<textarea id="jsCode" class="code">document.addEventListener("DOMContentLoaded", () => {
  console.log("Advanced plugin code loaded");
});</textarea>

</div>


<div class="footer-actions">

<button class="btn gray" onclick="saveDraft()">
Save Draft
</button>

<button class="btn primary" onclick="buildPlugin()">
Build Plugin
</button>

</div>

</section>


<!-- PREVIEW -->
<aside class="card">

<div class="title">
Live Preview
</div>

<div class="preview">

<div class="preview-head">

<div id="previewIcon" class="plugin-icon">🔌</div>

<div id="previewName" class="preview-name">
My New Plugin
</div>

<div id="previewCategory" class="preview-category">
Business
</div>

</div>

<div class="preview-body">

<div id="previewDescription" class="preview-desc">
A powerful plugin for your website.
</div>

<div class="preview-btn">
Run Plugin
</div>

</div>

</div>

<div style="margin-top:15px">

<div class="title">Build Status</div>

<div>
<span id="buildStatus" class="status">Not Built</span>
</div>

</div>

</aside>

</div>
</main>

<div id="message" class="message"></div>

<script>

/* TABS */

document.querySelectorAll(".tab").forEach(tab => {

tab.addEventListener("click", () => {

document.querySelectorAll(".tab")
.forEach(item => item.classList.remove("active"));

document.querySelectorAll(".panel")
.forEach(panel => panel.classList.remove("active"));

tab.classList.add("active");

document.getElementById(
tab.dataset.panel
).classList.add("active");

});

});


/* LIVE PREVIEW */

const fields = [
"pluginName",
"category",
"icon",
"description"
];

fields.forEach(id => {

document.getElementById(id)
.addEventListener("input", updatePreview);

document.getElementById(id)
.addEventListener("change", updatePreview);

});


function updatePreview(){

document.getElementById(
"previewName"
).textContent =
document.getElementById("pluginName").value ||
"My New Plugin";

document.getElementById(
"previewCategory"
).textContent =
document.getElementById("category").value;

document.getElementById(
"previewIcon"
).textContent =
document.getElementById("icon").value;

document.getElementById(
"previewDescription"
).textContent =
document.getElementById("description").value ||
"A powerful plugin for your website.";

}


/* COLLECT BUILDER DATA */

function getPluginData(){

return {

id:"plugin_"+Date.now(),

name:document.getElementById("pluginName").value.trim(),

version:document.getElementById("version").value.trim(),

price:Number(
document.getElementById("price").value || 0
),

category:document.getElementById("category").value,

icon:document.getElementById("icon").value,

description:document.getElementById("description").value.trim(),

publicPlugin:document.getElementById("publicPlugin").checked,

autoUpdate:document.getElementById("autoUpdate").checked,

code:document.getElementById("code").value,

html:document.getElementById("htmlCode").value,

css:document.getElementById("cssCode").value,

javascript:document.getElementById("jsCode").value,

status:"Draft",

sales:0,

installs:0,

users:0,

revenue:0,

createdAt:new Date().toISOString(),

updatedAt:new Date().toISOString()

};

}


/* SAVE DRAFT */

function saveDraft(){

const data=getPluginData();

data.status="Draft";

localStorage.setItem(
"pluginBuilderDraft",
JSON.stringify(data)
);

showMessage("Plugin draft saved.");

}


/* BUILD */

function buildPlugin(){

const data=getPluginData();

if(!data.name){

showMessage("Enter a plugin name.");

return;

}

if(!/^\d+\.\d+\.\d+$/.test(data.version)){

showMessage("Version must look like 1.0.0.");

return;

}


/*
  Basic code validation.
  This does not execute user code.
*/

if(
data.code.includes("<script") ||
data.javascript.includes("<script")
){

showMessage(
"Remove HTML script tags from JavaScript fields."
);

return;

}


/* Save plugin */

data.status="Active";

localStorage.setItem(
"lastBuiltPlugin",
JSON.stringify(data)
);


/* Add to plugin library */

let plugins =
JSON.parse(
localStorage.getItem("plugins") || "[]"
);

const existingIndex =
plugins.findIndex(
plugin => plugin.id === data.id
);

if(existingIndex >= 0){

plugins[existingIndex]={
...plugins[existingIndex],
...data
};

}else{

plugins.unshift(data);

}

localStorage.setItem(
"plugins",
JSON.stringify(plugins)
);


/* Status */

const status =
document.getElementById("buildStatus");

status.textContent="Built";

status.style.background="#dcfce7";
status.style.color="#166534";

showMessage(
"Plugin built and saved successfully."
);

}


/* FORMAT */

function formatCode(){

const editor=
document.getElementById("code");

let code=editor.value;

/*
  Lightweight formatting.
  It intentionally avoids executing code.
*/

code=code
.replace(/\{\s*/g,"{\n  ")
.replace(/;\s*/g,";\n  ")
.replace(/\}\s*/g,"\n}\n")
.replace(/\n\s*\n/g,"\n");

editor.value=code.trim();

showMessage("Code formatted.");

}


/* LOAD DRAFT */

function loadDraft(){

const draft =
JSON.parse(
localStorage.getItem(
"pluginBuilderDraft"
) || "null"
);

if(!draft)return;

document.getElementById("pluginName").value=
draft.name || "My New Plugin";

document.getElementById("version").value=
draft.version || "1.0.0";

document.getElementById("price").value=
draft.price || 0;

document.getElementById("category").value=
draft.category || "Business";

document.getElementById("icon").value=
draft.icon || "🔌";

document.getElementById("description").value=
draft.description || "";

document.getElementById("publicPlugin").checked=
Boolean(draft.publicPlugin);

document.getElementById("autoUpdate").checked=
draft.autoUpdate !== false;

document.getElementById("code").value=
draft.code || "";

document.getElementById("htmlCode").value=
draft.html || "";

document.getElementById("cssCode").value=
draft.css || "";

document.getElementById("jsCode").value=
draft.javascript || "";

updatePreview();

}


/* MESSAGE */

function showMessage(text){

const message=
document.getElementById("message");

message.textContent=text;

message.classList.add("show");

setTimeout(() => {
message.classList.remove("show");
},2500);

}


/* START */

loadDraft();

updatePreview();

</script>

</body>
</html>
