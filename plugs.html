<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plugins</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  width:min(1200px,94%);
  margin:auto;
}

/* HEADER */

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:14px 0;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  color:#2563eb;
  font-size:18px;
  font-weight:900;
}

.nav-actions{
  display:flex;
  gap:7px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  font-size:9px;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.gray{
  background:#f1f5f9;
  color:#334155;
}

/* MAIN */

main{
  padding:28px 0 60px;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:15px;
  margin-bottom:20px;
}

h1{
  font-size:28px;
  margin-bottom:6px;
}

.subtitle{
  color:#64748b;
  font-size:10px;
}

.controls{
  display:flex;
  gap:7px;
}

input,
select{
  border:1px solid #dbe2ea;
  border-radius:8px;
  padding:10px;
  background:#fff;
  font-size:9px;
  outline:none;
}

input{
  width:210px;
}

input:focus,
select:focus{
  border-color:#2563eb;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:18px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:15px;
}

.stat strong{
  display:block;
  font-size:19px;
  margin-bottom:5px;
}

.stat span{
  color:#64748b;
  font-size:7px;
}

/* PLUGIN GRID */

.plugins{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
}

.plugin{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:16px;
  transition:.15s;
}

.plugin:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(15,23,42,.07);
}

.plugin-top{
  display:flex;
  align-items:flex-start;
  gap:11px;
}

.plugin-icon{
  width:48px;
  height:48px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:10px;
  background:#eff6ff;
  font-size:24px;
  flex:none;
}

.plugin-name{
  font-size:12px;
  font-weight:900;
  margin-bottom:4px;
}

.plugin-meta{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.badge{
  padding:4px 7px;
  border-radius:20px;
  background:#f1f5f9;
  color:#64748b;
  font-size:6px;
  font-weight:900;
}

.badge.active{
  background:#dcfce7;
  color:#166534;
}

.badge.update{
  background:#fef3c7;
  color:#92400e;
}

.plugin-description{
  color:#64748b;
  font-size:8px;
  line-height:1.6;
  margin:14px 0;
  min-height:40px;
}

.plugin-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:12px;
}

.plugin-stat{
  background:#f8fafc;
  border-radius:7px;
  padding:8px;
  text-align:center;
}

.plugin-stat strong{
  display:block;
  font-size:10px;
  margin-bottom:3px;
}

.plugin-stat span{
  font-size:5px;
  color:#64748b;
}

.plugin-actions{
  display:flex;
  gap:6px;
}

.plugin-actions button{
  flex:1;
  border:0;
  border-radius:7px;
  padding:9px 6px;
  font-size:7px;
  font-weight:900;
  cursor:pointer;
}

.view{
  background:#eff6ff;
  color:#2563eb;
}

.preview{
  background:#f1f5f9;
  color:#334155;
}

.settings{
  background:#f1f5f9;
  color:#334155;
}

/* EMPTY */

.empty{
  display:none;
  text-align:center;
  background:#fff;
  border:1px dashed #cbd5e1;
  border-radius:13px;
  padding:45px 20px;
}

.empty-icon{
  font-size:35px;
  margin-bottom:10px;
}

.empty h2{
  font-size:14px;
  margin-bottom:6px;
}

.empty p{
  color:#64748b;
  font-size:8px;
  margin-bottom:14px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(480px,100%);
  background:#fff;
  border-radius:13px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h2{
  font-size:15px;
}

.close{
  border:0;
  background:#f1f5f9;
  border-radius:6px;
  width:28px;
  height:28px;
  cursor:pointer;
}

.modal-content{
  color:#64748b;
  font-size:9px;
  line-height:1.7;
}

.modal-actions{
  display:flex;
  gap:7px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
}

/* TOAST */

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#172033;
  color:#fff;
  padding:11px 15px;
  border-radius:8px;
  font-size:9px;
  font-weight:800;
  display:none;
  z-index:200;
}

.toast.show{
  display:block;
}

/* RESPONSIVE */

@media(max-width:900px){
  .plugins{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  .page-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .controls{
    width:100%;
  }

  input{
    width:100%;
  }

  .plugins{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">
🔌 Plugins
</div>

<div class="nav-actions">

<a href="dashboard.html" class="btn gray">
Dashboard
</a>

<a href="plugin-builder.html" class="btn primary">
+ Build Plugin
</a>

</div>

</div>
</header>


<main class="container">

<section class="page-head">

<div>
<h1>My Plugins</h1>
<p class="subtitle">
Manage, preview, configure and monitor your plugins.
</p>
</div>

<div class="controls">

<input
id="search"
type="search"
placeholder="Search plugins..."
autocomplete="off">

<select id="categoryFilter">
<option value="all">All Categories</option>
<option value="Business">Business</option>
<option value="Analytics">Analytics</option>
<option value="Commerce">Commerce</option>
<option value="Marketing">Marketing</option>
<option value="SEO">SEO</option>
<option value="Productivity">Productivity</option>
<option value="Security">Security</option>
</select>

</div>

</section>


<!-- STATS -->

<section class="stats">

<div class="stat">
<strong id="totalPlugins">0</strong>
<span>TOTAL PLUGINS</span>
</div>

<div class="stat">
<strong id="activePlugins">0</strong>
<span>ACTIVE</span>
</div>

<div class="stat">
<strong id="totalInstalls">0</strong>
<span>TOTAL INSTALLS</span>
</div>

<div class="stat">
<strong id="totalRevenue">$0</strong>
<span>TOTAL REVENUE</span>
</div>

</section>


<!-- PLUGINS -->

<section id="pluginGrid" class="plugins"></section>


<!-- EMPTY -->

<section id="empty" class="empty">

<div class="empty-icon">
🔌
</div>

<h2>
No plugins found
</h2>

<p>
Create your first plugin or change your search filters.
</p>

<a
href="plugin-builder.html"
class="btn primary">
Build Plugin
</a>

</section>

</main>


<!-- DETAILS MODAL -->

<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
Plugin Details
</h2>

<button
class="close"
onclick="closeModal()">
×
</button>

</div>

<div
id="modalContent"
class="modal-content">
</div>

<div class="modal-actions">

<button
class="btn gray"
onclick="closeModal()">
Close
</button>

<button
class="btn primary"
onclick="openSelected()">
Open Details
</button>

</div>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

/*
  PLUGINS PAGE
  ------------

  Storage used:

  plugins
  selectedPlugin
  installedPlugins

  This page does not execute arbitrary plugin JavaScript.
*/


const demoPlugins = [

{
id:"analytics-pro",
name:"Analytics Pro",
version:"2.4.0",
category:"Analytics",
icon:"📊",
description:
"Powerful analytics, reports and performance insights for your website.",
status:"Active",
installs:1248,
users:932,
sales:84,
revenue:1260,
price:15,
updatedAt:"2026-08-10"
},

{
id:"sales-manager",
name:"Sales Manager",
version:"3.1.2",
category:"Business",
icon:"💼",
description:
"Manage sales, customers, invoices and business performance.",
status:"Active",
installs:842,
users:611,
sales:53,
revenue:795,
price:15,
updatedAt:"2026-08-08"
},

{
id:"seo-boost",
name:"SEO Boost",
version:"1.8.0",
category:"SEO",
icon:"🔍",
description:
"Improve search visibility with SEO tools and website optimization.",
status:"Active",
installs:723,
users:508,
sales:41,
revenue:410,
price:10,
updatedAt:"2026-08-05"
},

{
id:"shop-tools",
name:"Shop Tools",
version:"2.0.1",
category:"Commerce",
icon:"🛒",
description:
"Useful tools for managing products, orders and online stores.",
status:"Update",
installs:521,
users:390,
sales:29,
revenue:435,
price:15,
updatedAt:"2026-08-01"
}

];


/* STORAGE */

function getPlugins(){

let plugins =
JSON.parse(
localStorage.getItem("plugins") || "null"
);

if(!Array.isArray(plugins)){

plugins = demoPlugins;

localStorage.setItem(
"plugins",
JSON.stringify(plugins)
);

}

return plugins;

}


/* MONEY */

function money(value){

return new Intl.NumberFormat(
"en-US",
{
style:"currency",
currency:"USD",
maximumFractionDigits:2
}
).format(Number(value || 0));

}


/* RENDER */

function renderPlugins(){

const plugins = getPlugins();

const search =
document.getElementById("search")
.value
.toLowerCase()
.trim();

const category =
document.getElementById("categoryFilter")
.value;


const filtered =
plugins.filter(plugin=>{

const matchesSearch =
(plugin.name || "")
.toLowerCase()
.includes(search) ||

(plugin.description || "")
.toLowerCase()
.includes(search) ||

(plugin.category || "")
.toLowerCase()
.includes(search);

const matchesCategory =
category === "all" ||
plugin.category === category;

return matchesSearch &&
matchesCategory;

});


const grid =
document.getElementById("pluginGrid");

grid.innerHTML = "";


filtered.forEach(plugin=>{

const card =
document.createElement("article");

card.className = "plugin";


const statusClass =
plugin.status === "Active"
? "active"
: "update";


card.innerHTML = `

<div class="plugin-top">

<div class="plugin-icon">
${escapeHTML(plugin.icon || "🔌")}
</div>

<div>

<div class="plugin-name">
${escapeHTML(plugin.name || "Untitled Plugin")}
</div>

<div class="plugin-meta">

<span class="badge ${statusClass}">
${escapeHTML(plugin.status || "Draft")}
</span>

<span class="badge">
${escapeHTML(plugin.category || "Other")}
</span>

<span class="badge">
v${escapeHTML(plugin.version || "1.0.0")}
</span>

</div>

</div>

</div>


<div class="plugin-description">
${escapeHTML(
plugin.description ||
"No description available."
)}
</div>


<div class="plugin-stats">

<div class="plugin-stat">
<strong>
${Number(plugin.installs || 0).toLocaleString()}
</strong>
<span>INSTALLS</span>
</div>

<div class="plugin-stat">
<strong>
${Number(plugin.users || 0).toLocaleString()}
</strong>
<span>USERS</span>
</div>

<div class="plugin-stat">
<strong>
${money(plugin.revenue || 0)}
</strong>
<span>REVENUE</span>
</div>

</div>


<div class="plugin-actions">

<button
class="view"
onclick="viewPlugin('${safeId(plugin.id)}')">
Details
</button>

<button
class="preview"
onclick="previewPlugin('${safeId(plugin.id)}')">
Preview
</button>

<button
class="settings"
onclick="settingsPlugin('${safeId(plugin.id)}')">
Settings
</button>

</div>

`;


grid.appendChild(card);

});


document.getElementById(
"empty"
).style.display =
filtered.length
? "none"
: "block";


updateStats(plugins);

}


/* STATS */

function updateStats(plugins){

const active =
plugins.filter(
plugin => plugin.status === "Active"
).length;


const installs =
plugins.reduce(
(sum,plugin)=>
sum + Number(plugin.installs || 0),
0
);


const revenue =
plugins.reduce(
(sum,plugin)=>
sum + Number(plugin.revenue || 0),
0
);


document.getElementById(
"totalPlugins"
).textContent =
plugins.length;


document.getElementById(
"activePlugins"
).textContent =
active;


document.getElementById(
"totalInstalls"
).textContent =
installs.toLocaleString();


document.getElementById(
"totalRevenue"
).textContent =
money(revenue);

}


/* SELECT */

function findPlugin(id){

return getPlugins().find(
plugin => String(plugin.id) === String(id)
);

}


function selectPlugin(id){

const plugin =
findPlugin(id);

if(!plugin){

showToast(
"Plugin not found."
);

return null;

}

localStorage.setItem(
"selectedPlugin",
JSON.stringify(plugin)
);

return plugin;

}


/* DETAILS */

function viewPlugin(id){

const plugin =
selectPlugin(id);

if(!plugin)
return;


document.getElementById(
"modalTitle"
).textContent =
plugin.name || "Plugin Details";


document.getElementById(
"modalContent"
).innerHTML = `

<strong>Version:</strong>
${escapeHTML(plugin.version || "1.0.0")}
<br>

<strong>Category:</strong>
${escapeHTML(plugin.category || "Other")}
<br>

<strong>Status:</strong>
${escapeHTML(plugin.status || "Draft")}
<br>

<strong>Installs:</strong>
${Number(plugin.installs || 0).toLocaleString()}
<br>

<strong>Users:</strong>
${Number(plugin.users || 0).toLocaleString()}
<br>

<strong>Sales:</strong>
${Number(plugin.sales || 0).toLocaleString()}
<br>

<strong>Revenue:</strong>
${money(plugin.revenue || 0)}

`;


document.getElementById(
"modal"
).classList.add("show");

}


/* OPEN DETAILS */

function openSelected(){

const plugin =
JSON.parse(
localStorage.getItem(
"selectedPlugin"
) || "null"
);

if(!plugin)
return;

window.location.href =
"plugin-details.html";

}


/* PREVIEW */

function previewPlugin(id){

const plugin =
selectPlugin(id);

if(!plugin)
return;

window.location.href =
"plugin-preview.html";

}


/* SETTINGS */

function settingsPlugin(id){

const plugin =
selectPlugin(id);

if(!plugin)
return;

window.location.href =
"plugin-settings.html";

}


/* CLOSE MODAL */

function closeModal(){

document.getElementById(
"modal"
).classList.remove("show");

}


/* SEARCH */

document.getElementById(
"search"
).addEventListener(
"input",
renderPlugins
);


/* CATEGORY */

document.getElementById(
"categoryFilter"
).addEventListener(
"change",
renderPlugins
);


/* SAFE HTML */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* SAFE ID */

function safeId(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


/* TOAST */

function showToast(text){

const toast =
document.getElementById("toast");

toast.textContent = text;

toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2300);

}


/* CLOSE MODAL ON BACKDROP */

document.getElementById(
"modal"
).addEventListener(
"click",
event=>{

if(event.target.id === "modal"){
closeModal();
}

});


/* START */

renderPlugins();

</script>

</body>
</html>
