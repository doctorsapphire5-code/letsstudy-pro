<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Post | LetsStudy Pro Community</title>

<meta name="description"
content="View and interact with a LetsStudy Pro community post.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  text-decoration:none;
  color:#172033;
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

.back{
  border:0;
  background:#eef2f7;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer
}

.container{
  width:92%;
  max-width:700px;
  margin:25px auto
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  overflow:hidden
}

.post{
  padding:18px
}

.author{
  display:flex;
  align-items:center;
  gap:11px
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#eaf2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#2563eb;
  font-weight:800;
  overflow:hidden
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.author-info{
  flex:1
}

.name{
  font-size:14px;
  font-weight:800
}

.username{
  color:#64748b;
  font-size:11px;
  margin-top:3px
}

.date{
  color:#94a3b8;
  font-size:10px;
  margin-top:2px
}

.content{
  margin-top:18px;
  font-size:15px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.post-image{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:12px;
  margin-top:15px
}

.actions{
  display:flex;
  gap:7px;
  border-top:1px solid #eef2f7;
  margin-top:18px;
  padding-top:12px
}

.action{
  flex:1;
  border:0;
  background:#f8fafc;
  color:#475569;
  padding:10px 6px;
  border-radius:8px;
  cursor:pointer;
  font-size:11px;
  font-weight:700
}

.action.active{
  background:#eaf2ff;
  color:#2563eb
}

.comments{
  border-top:1px solid #e5e7eb;
  padding:18px
}

.comments h2{
  font-size:16px;
  margin-bottom:12px
}

.comment-form{
  display:flex;
  gap:8px;
  margin-bottom:15px
}

.comment-form input{
  flex:1;
  border:1px solid #dbe2ea;
  padding:11px;
  border-radius:8px;
  outline:none
}

.comment-form button{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:0 14px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer
}

.comment{
  display:flex;
  gap:9px;
  padding:12px 0;
  border-bottom:1px solid #f1f5f9
}

.comment:last-child{
  border-bottom:0
}

.comment-avatar{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:50%;
  background:#eef2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:800
}

.comment-body{
  flex:1
}

.comment-name{
  font-size:12px;
  font-weight:800
}

.comment-text{
  margin-top:4px;
  font-size:12px;
  color:#475569;
  line-height:1.5
}

.comment-date{
  color:#94a3b8;
  font-size:9px;
  margin-top:4px
}

.loading,
.empty,
.error{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:50px 20px;
  text-align:center;
  color:#64748b
}

.error{
  color:#b91c1c
}

@media(max-width:600px){

  .container{
    width:100%;
    margin:0
  }

  .card{
    border-left:0;
    border-right:0;
    border-radius:0
  }

  header{
    padding:0 4%
  }
}
</style>
</head>

<body>

<header>

  <a
    href="community.html"
    class="logo"
  >
    LetsStudy <span>Pro</span>
  </a>

  <button
    class="back"
    onclick="history.back()"
  >
    Back
  </button>

</header>


<main class="container">

  <div
    id="postContainer"
  >

    <div class="loading">
      Loading post...
    </div>

  </div>

</main>


<script>

/*
==================================================
LETSSTUDY PRO COMMUNITY POST

URL:

post.html?id=POST_ID

API:

GET
/api/community/posts/:id

LIKE:

POST
/api/community/posts/:id/like

UNLIKE:

POST
/api/community/posts/:id/unlike

COMMENTS:

GET
/api/community/posts/:id/comments

POST
/api/community/posts/:id/comments

SHARE:

POST
/api/community/posts/:id/share

SAVE:

POST
/api/community/posts/:id/save

EXPECTED POST:

{
  id:"",
  content:"",
  image:"",
  createdAt:"",
  likes:0,
  comments:0,
  shares:0,
  liked:false,
  saved:false,
  author:{
    id:"",
    name:"",
    username:"",
    photoURL:""
  }
}
==================================================
*/


const params =
  new URLSearchParams(
    location.search
  );


const postId =
  params.get("id") ||
  params.get("postId") ||
  params.get("documentId") ||
  "";


const currentUserId =
  localStorage.getItem(
    "userId"
  ) ||
  "";


const box =
  document.getElementById(
    "postContainer"
  );


let post = null;
let comments = [];


/* =========================
   VALIDATE
========================= */

if(!postId){

  box.innerHTML = `

    <div class="error">

      <h3>
        Post not found
      </h3>

      <p style="margin-top:7px">
        A valid post ID is required.
      </p>

    </div>

  `;

}else{

  loadPost();

}


/* =========================
   LOAD POST
========================= */

async function loadPost(){

  try{

    const response =
      await fetch(
        "/api/community/posts/" +
        encodeURIComponent(
          postId
        )
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load post."
      );

    }


    post =
      result.post ||
      result;


    renderPost();

    loadComments();

  }catch(error){

    console.error(
      error
    );

    box.innerHTML = `

      <div class="error">

        <h3>
          Unable to load post
        </h3>

        <p style="margin-top:7px">
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


/* =========================
   RENDER POST
========================= */

function renderPost(){

  const author =
    post.author ||
    {};


  const name =
    author.name ||
    author.displayName ||
    "LetsStudy Member";


  const username =
    author.username ||
    "";


  const photo =
    author.photoURL ||
    author.photo ||
    "";


  const content =
    post.content ||
    post.text ||
    "";


  const image =
    post.image ||
    post.imageURL ||
    post.mediaURL ||
    "";


  const likes =
    Number(
      post.likes ||
      post.likeCount ||
      0
    );


  const commentsCount =
    Number(
      post.comments ||
      post.commentCount ||
      0
    );


  const shares =
    Number(
      post.shares ||
      post.shareCount ||
      0
    );


  const liked =
    post.liked === true ||
    post.isLiked === true;


  const saved =
    post.saved === true ||
    post.isSaved === true;


  const initials =
    getInitials(
      name
    );


  box.innerHTML = `

    <article class="card">

      <section class="post">


        <div class="author">

          <a
            href="profile.html?id=${encodeURIComponent(
              author.id ||
              ""
            )}"
            class="avatar"
          >

            ${
              photo
              ? `
                <img
                  src="${safeURL(photo)}"
                  alt="${escapeAttr(name)}"
                >
              `
              : escapeHTML(
                  initials
                )
            }

          </a>


          <div class="author-info">

            <div class="name">
              ${escapeHTML(name)}
            </div>


            ${
              username
              ? `
                <div class="username">
                  @${escapeHTML(username)}
                </div>
              `
              : ""
            }


            <div class="date">
              ${formatDate(
                post.createdAt ||
                post.timestamp
              )}
            </div>

          </div>

        </div>


        <div class="content">

          ${escapeHTML(
            content
          )}

        </div>


        ${
          image
          ? `
            <img
              class="post-image"
              src="${safeURL(image)}"
              alt="Community post"
              loading="lazy"
            >
          `
          : ""
        }


        <div class="actions">


          <button
            id="likeButton"
            class="action ${
              liked
              ? "active"
              : ""
            }"
          >
            ${
              liked
              ? "♥"
              : "♡"
            }
            Like
            (<span id="likeCount">
              ${likes}
            </span>)
          </button>


          <button
            id="commentButton"
            class="action"
          >
            💬 Comment
            (<span id="commentCount">
              ${commentsCount}
            </span>)
          </button>


          <button
            id="shareButton"
            class="action"
          >
            ↗ Share
            (<span id="shareCount">
              ${shares}
            </span>)
          </button>


          <button
            id="saveButton"
            class="action ${
              saved
              ? "active"
              : ""
            }"
          >
            ${
              saved
              ? "★"
              : "☆"
            }
            Save
          </button>


        </div>

      </section>


      <section
        id="commentsSection"
        class="comments"
      >

        <h2>
          Comments
        </h2>


        <form
          id="commentForm"
          class="comment-form"
        >

          <input
            id="commentInput"
            type="text"
            maxlength="1000"
            placeholder="Write a comment..."
            autocomplete="off"
          >


          <button
            type="submit"
          >
            Post
          </button>

        </form>


        <div
          id="commentsList"
        >
          Loading comments...
        </div>

      </section>

    </article>

  `;


  document
    .getElementById(
      "likeButton"
    )
    .addEventListener(
      "click",
      toggleLike
    );


  document
    .getElementById(
      "commentButton"
    )
    .addEventListener(
      "click",
      () => {

        document
          .getElementById(
            "commentInput"
          )
          .focus();

      }
    );


  document
    .getElementById(
      "shareButton"
    )
    .addEventListener(
      "click",
      sharePost
    );


  document
    .getElementById(
      "saveButton"
    )
    .addEventListener(
      "click",
      toggleSave
    );


  document
    .getElementById(
      "commentForm"
    )
    .addEventListener(
      "submit",
      submitComment
    );

}


/* =========================
   LIKE
========================= */

async function toggleLike(){

  if(!requireLogin()) return;


  const button =
    document.getElementById(
      "likeButton"
    );


  const liked =
    post.liked === true ||
    post.isLiked === true;


  button.disabled =
    true;


  try{

    const response =
      await fetch(
        "/api/community/posts/" +
        encodeURIComponent(
          postId
        ) +
        (
          liked
          ? "/unlike"
          : "/like"
        ),
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            userId:
              currentUserId

          })

        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to update like."
      );

    }


    post.liked =
      !liked;


    post.likes =
      Number(
        result.likes ??
        post.likes ??
        0
      );


    renderLikeState();

  }catch(error){

    alert(
      error.message
    );

  }finally{

    button.disabled =
      false;

  }

}


function renderLikeState(){

  const button =
    document.getElementById(
      "likeButton"
    );


  const count =
    document.getElementById(
      "likeCount"
    );


  const liked =
    post.liked === true;


  button.classList.toggle(
    "active",
    liked
  );


  button.firstChild.textContent =
    liked
    ? "♥ "
    : "♡ ";


  count.textContent =
    Number(
      post.likes || 0
    );

}


/* =========================
   SAVE
========================= */

async function toggleSave(){

  if(!requireLogin()) return;


  const button =
    document.getElementById(
      "saveButton"
    );


  const saved =
    post.saved === true;


  button.disabled =
    true;


  try{

    const response =
      await fetch(
        "/api/community/posts/" +
        encodeURIComponent(
          postId
        ) +
        "/save",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            userId:
              currentUserId,

            saved:
              !saved

          })

        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to save post."
      );

    }


    post.saved =
      !saved;


    button.classList.toggle(
      "active",
      post.saved
    );


    button.innerHTML =
      post.saved
      ? "★ Save"
      : "☆ Save";

  }catch(error){

    alert(
      error.message
    );

  }finally{

    button.disabled =
      false;

  }

}


/* =========================
   SHARE
========================= */

async function sharePost(){

  const url =
    location.href;


  try{

    if(
      navigator.share
    ){

      await navigator.share({

        title:
          "LetsStudy Pro Community",

        text:
          post.content ||
          "Check out this post.",

        url:url

      });

    }else{

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Post link copied."
      );

    }


    try{

      await fetch(
        "/api/community/posts/" +
        encodeURIComponent(
          postId
        ) +
        "/share",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            userId:
              currentUserId

          })

        }
      );

    }catch{}

  }catch(error){

    console.error(
      error
    );

  }

}


/* =========================
   COMMENTS
========================= */

async function loadComments(){

  const list =
    document.getElementById(
      "commentsList"
    );


  if(!list) return;


  try{

    const response =
      await fetch(
        "/api/community/posts/" +
        encodeURIComponent(
          postId
        ) +
        "/comments"
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to load comments."
      );

    }


    comments =
      Array.isArray(
        result.comments
      )
      ? result.comments
      : [];


    renderComments();

  }catch(error){

    list.innerHTML = `

      <div class="error">
        ${escapeHTML(
          error.message
        )}
      </div>

    `;

  }

}


function renderComments(){

  const list =
    document.getElementById(
      "commentsList"
    );


  if(!comments.length){

    list.innerHTML = `

      <div class="empty"
        style="
          padding:25px;
          border:0;
        "
      >
        No comments yet.
        Be the first to comment.
      </div>

    `;

    return;

  }


  list.innerHTML =
    comments
      .map(
        commentCard
      )
      .join("");

}


function commentCard(
  comment
){

  const author =
    comment.author ||
    {};


  const name =
    author.name ||
    author.displayName ||
    comment.userName ||
    "Member";


  const photo =
    author.photoURL ||
    author.photo ||
    "";


  const initials =
    getInitials(
      name
    );


  return `

    <div class="comment">

      <div class="comment-avatar">

        ${
          photo
          ? `
            <img
              src="${safeURL(photo)}"
              alt="${escapeAttr(name)}"
              style="
                width:100%;
                height:100%;
                object-fit:cover;
                border-radius:50%;
              "
            >
          `
          : escapeHTML(
              initials
            )
        }

      </div>


      <div class="comment-body">

        <div class="comment-name">
          ${escapeHTML(name)}
        </div>


        <div class="comment-text">
          ${escapeHTML(
            comment.text ||
            comment.content ||
            ""
          )}
        </div>


        <div class="comment-date">
          ${formatDate(
            comment.createdAt
          )}
        </div>

      </div>

    </div>

  `;

}


/* =========================
   SUBMIT COMMENT
========================= */

async function submitComment(
  event
){

  event.preventDefault();


  if(!requireLogin()) return;


  const input =
    document.getElementById(
      "commentInput"
    );


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  const submit =
    event.target.querySelector(
      "button"
    );


  submit.disabled =
    true;

  submit.textContent =
    "Posting...";


  try{

    const response =
      await fetch(
        "/api/community/posts/" +
        encodeURIComponent(
          postId
        ) +
        "/comments",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            userId:
              currentUserId,

            text:text

          })

        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Unable to post comment."
      );

    }


    input.value =
      "";


    const newComment =
      result.comment;


    if(newComment){

      comments.unshift(
        newComment
      );

    }else{

      await loadComments();

    }


    if(newComment){

      renderComments();

    }


    post.comments =
      Number(
        post.comments || 0
      ) + 1;


    const count =
      document.getElementById(
        "commentCount"
      );


    if(count){

      count.textContent =
        post.comments;

    }

  }catch(error){

    alert(
      error.message
    );

  }finally{

    submit.disabled =
      false;

    submit.textContent =
      "Post";

  }

}


/* =========================
   LOGIN
========================= */

function requireLogin(){

  if(
    currentUserId
  ){

    return true;

  }


  alert(
    "Please sign in to interact with this post."
  );


  location.href =
    "login.html?redirect=" +
    encodeURIComponent(
      location.href
    );


  return false;

}


/* =========================
   HELPERS
========================= */

function getInitials(
  name
){

  return String(
    name
  )
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(
    x =>
      x.charAt(0)
  )
  .join("")
  .toUpperCase();

}


function formatDate(
  value
){

  if(!value){

    return "";

  }


  const date =
    new Date(
      value
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return date.toLocaleString(
    undefined,
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


function safeURL(
  value
){

  try{

    const url =
        new URL(
          value,
          location.origin
        );


      /*
      ------------------------------------------
      ALLOW ONLY HTTP / HTTPS
      ------------------------------------------
      */

      if(
        url.protocol !== "https:" &&
        url.protocol !== "http:"
      ){

        return "";

      }


      /*
      ------------------------------------------
      RETURN SAFE URL
      ------------------------------------------
      */

      return escapeAttr(
        url.href
      );

    }catch(error){

      console.warn(
        "Invalid URL:",
        value
      );

      return "";

    }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   ESCAPE ATTRIBUTE
========================================= */

function escapeAttr(
  value
){

  return escapeHTML(
    value
  );

}


/* =========================================
   INITIALIZE
========================================= */

console.log(
  "LetsStudy Pro Community Post loaded:",
  postId
);


/* =========================================
   OPTIONAL AUTO REFRESH
   Refresh comments every 30 seconds
========================================= */

setInterval(
  () => {

    if(
      postId &&
      document.visibilityState ===
      "visible"
    ){

      loadComments();

    }

  },
  30000
);


/* =========================================
   PAGE VISIBILITY
========================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState ===
      "visible" &&
      postId
    ){

      loadPost();

    }

  }
);


/* =========================================
   HANDLE ENTER ON COMMENT INPUT
========================================= */

document.addEventListener(
  "keydown",
  event => {

    const input =
      document.getElementById(
        "commentInput"
      );


    if(
      event.target === input &&
      event.key === "Enter"
    ){

      event.preventDefault();

      const form =
        document.getElementById(
          "commentForm"
        );


      if(form){

        form.requestSubmit();

      }

    }

  }
);


/* =========================================
   COPY POST LINK
========================================= */

async function copyPostLink(){

  try{

    await navigator.clipboard.writeText(
      location.href
    );

    alert(
      "Post link copied."
    );

  }catch{

    alert(
      "Unable to copy post link."
    );

  }

}


/* =========================================
   GLOBAL POST SHARE SUPPORT
========================================= */

window.LetsStudyPost = {

  id:
    postId,

  share:
    sharePost,

  copy:
