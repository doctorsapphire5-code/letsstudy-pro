<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Community Post | Let'sStudy Pro</title>

<meta
  name="description"
  id="metaDescription"
  content="View a community post on Let'sStudy Pro."
>

<meta
  name="robots"
  content="index,follow"
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
  --danger:#dc2626;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
}

button{
  font:inherit;
  cursor:pointer;
}

.topbar{
  height:64px;

  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;

  font-weight:800;
}

.brand-icon{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--primary);
  color:#fff;
}

.back-btn{
  border:0;

  background:var(--soft);

  border-radius:10px;

  padding:9px 13px;

  color:var(--text);

  font-weight:700;
}

.container{
  width:100%;
  max-width:760px;

  margin:auto;

  padding:25px 14px 70px;
}

.loading{
  text-align:center;

  padding:60px 20px;

  color:var(--muted);
}

.spinner{
  width:35px;
  height:35px;

  margin:0 auto 13px;

  border:
    3px solid var(--border);

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.error{
  display:none;

  text-align:center;

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:18px;

  padding:35px 20px;
}

.error.show{
  display:block;
}

.error-icon{
  font-size:38px;
  margin-bottom:10px;
}

.error h2{
  font-size:20px;
  margin-bottom:7px;
}

.error p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}


/* POST */

.post{
  display:none;

  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0 8px 30px rgba(15,23,42,.04);
}

.post.show{
  display:block;
}

.post-header{
  display:flex;

  align-items:center;

  gap:12px;

  padding:20px 20px 12px;
}

.avatar{
  width:45px;
  height:45px;

  border-radius:50%;

  overflow:hidden;

  background:var(--soft);

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.author{
  min-width:0;
}

.author-name{
  font-size:14px;
  font-weight:800;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.post-date{
  margin-top:3px;

  font-size:11px;

  color:var(--muted);
}

.post-type{
  margin-left:auto;

  background:var(--soft);

  padding:6px 9px;

  border-radius:8px;

  font-size:10px;

  font-weight:750;

  text-transform:capitalize;
}

.post-body{
  padding:5px 20px 20px;
}

.post-text{
  font-size:16px;

  line-height:1.7;

  white-space:pre-wrap;

  overflow-wrap:anywhere;
}

.media{
  margin-top:18px;
}

.media img{
  display:block;

  width:100%;
  max-height:520px;

  object-fit:cover;

  border-radius:14px;

  border:
    1px solid var(--border);
}

.media-link{
  display:block;

  padding:13px;

  background:var(--soft);

  border-radius:12px;

  color:var(--text);

  text-decoration:none;

  font-size:13px;

  overflow-wrap:anywhere;
}

.visibility{
  margin-top:17px;

  font-size:11px;

  color:var(--muted);
}


/* STATS */

.stats{
  display:flex;

  gap:20px;

  padding:
    13px 20px;

  border-top:
    1px solid var(--border);

  border-bottom:
    1px solid var(--border);

  color:var(--muted);

  font-size:12px;
}

.stats strong{
  color:var(--text);
}


/* ACTIONS */

.actions{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;

  padding:12px 20px;
}

.action{
  border:0;

  background:var(--soft);

  border-radius:10px;

  padding:10px 7px;

  color:var(--text);

  font-size:12px;

  font-weight:700;

  transition:.15s;
}

.action:hover{
  transform:translateY(-1px);
}

.action.active{
  background:#e5e7eb;
}


/* COMMENTS */

.comments{
  margin-top:18px;

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:18px;

  padding:20px;
}

.comments h2{
  font-size:17px;
  margin-bottom:15px;
}

.comment-form{
  display:flex;
  gap:9px;
}

.comment-form input{
  flex:1;

  min-width:0;

  border:
    1px solid var(--border);

  border-radius:10px;

  padding:11px;

  outline:none;
}

.comment-form button{
  border:0;

  background:var(--primary);

  color:#fff;

  border-radius:10px;

  padding:0 15px;

  font-weight:700;
}

.comment-list{
  margin-top:18px;
}

.comment-empty{
  text-align:center;

  padding:20px 5px;

  color:var(--muted);

  font-size:13px;
}


/* MOBILE */

@media(max-width:600px){

  .brand{
    font-size:13px;
  }

  .topbar{
    padding:0 11px;
  }

  .container{
    padding:
      15px 10px 60px;
  }

  .post{
    border-radius:16px;
  }

  .post-header{
    padding:
      16px 15px 10px;
  }

  .post-body{
    padding:
      5px 15px 17px;
  }

  .stats{
    padding:
      12px 15px;
  }

  .actions{
    padding:
      10px 15px;
  }

  .comments{
    padding:16px;
  }

  .post-type{
    display:none;
  }

}

</style>

</head>


<body>


<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      👥
    </div>

    <span>
      Let'sStudy Pro Community
    </span>

  </div>


  <button
    class="back-btn"
    type="button"
    onclick="goCommunity()"
  >
    ← Community
  </button>

</header>


<main class="container">


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <p>
      Loading post...
    </p>

  </div>


  <!-- ERROR -->

  <section
    id="error"
    class="error"
  >

    <div class="error-icon">
      ⚠️
    </div>

    <h2>
      Post not found
    </h2>

    <p id="errorMessage">
      This post may have been removed
      or is no longer available.
    </p>

  </section>


  <!-- POST -->

  <article
    id="post"
    class="post"
  >

    <header class="post-header">

      <div
        id="authorAvatar"
        class="avatar"
      >
        👤
      </div>


      <div class="author">

        <div
          id="authorName"
          class="author-name"
        >
          Community Member
        </div>

        <div
          id="postDate"
          class="post-date"
        >
          —
        </div>

      </div>


      <div
        id="postType"
        class="post-type"
      >
        discussion
      </div>

    </header>


    <div class="post-body">

      <div
        id="postText"
        class="post-text"
      ></div>


      <div
        id="mediaContainer"
        class="media"
      ></div>


      <div
        id="visibility"
        class="visibility"
      ></div>

    </div>


    <!-- STATS -->

    <div class="stats">

      <span>
        ❤️
        <strong id="likeCount">
          0
        </strong>
        likes
      </span>

      <span>
        💬
        <strong id="commentCount">
          0
        </strong>
        comments
      </span>

      <span>
        🔄
        <strong id="shareCount">
          0
        </strong>
        shares
      </span>

      <span>
        🔖
        <strong id="saveCount">
          0
        </strong>
        saves
      </span>

    </div>


    <!-- ACTIONS -->

    <div class="actions">

      <button
        id="likeButton"
        class="action"
        type="button"
      >
        ❤️ Like
      </button>


      <button
        id="commentButton"
        class="action"
        type="button"
      >
        💬 Comment
      </button>


      <button
        id="shareButton"
        class="action"
        type="button"
      >
        🔄 Share
      </button>


      <button
        id="saveButton"
        class="action"
        type="button"
      >
        🔖 Save
      </button>

    </div>

  </article>


  <!-- COMMENTS -->

  <section
    id="commentsSection"
    class="comments"
    style="display:none"
  >

    <h2>
      Comments
    </h2>


    <form
      id="commentForm"
      class="comment-form"
    >

      <input
        id="commentInput"
        type="text"
        maxlength="1000"
        placeholder="Write a comment..."
        required
      >

      <button
        type="submit"
      >
        Send
      </button>

    </form>


    <div
      id="commentList"
      class="comment-list"
    >

      <div class="comment-empty">
        Comments will appear here.
      </div>

    </div>

  </section>


</main>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();


const auth =
  firebase.auth();


/* =========================
   POST ID
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const postId =
  params.get("id");


let currentUser =
  null;

let postData =
  null;


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
  user => {

    currentUser =
      user || null;

  }
);


/* =========================
   ELEMENTS
========================= */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const postElement =
  document.getElementById(
    "post"
  );


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(
  timestamp
){

  if(
    !timestamp ||
    !timestamp.toDate
  ){

    return "Just now";

  }


  const date =
    timestamp.toDate();


  return new Intl.DateTimeFormat(
    "en",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  ).format(date);

}


/* =========================
   LOAD POST
========================= */

async function loadPost(){

  if(!postId){

    showError(
      "No post ID was provided."
    );

    return;

  }


  try{

    const snapshot =
      await db
        .collection(
          "posts"
        )
        .doc(
          postId
        )
        .get();


    if(
      !snapshot.exists
    ){

      showError(
        "The requested post does not exist."
      );

      return;

    }


    postData =
      snapshot.data();


    if(
      postData.status !==
      "published"
    ){

      showError(
        "This post is no longer available."
      );

      return;

    }


    renderPost(
      postData
    );


  }

  catch(error){

    console.error(
      "Load post error:",
      error
    );


    showError(
      "Unable to load this post. Please try again."
    );

  }

}


/* =========================
   RENDER POST
========================= */

function renderPost(
  data
){

  loading.style.display =
    "none";


  postElement.classList.add(
    "show"
  );


  /*
   * Author
   */

  const authorName =
    data.authorName ||
    "Community Member";


  document.getElementById(
    "authorName"
  ).textContent =
    authorName;


  /*
   * Avatar
   */

  const avatar =
    document.getElementById(
      "authorAvatar"
    );


  if(data.authorPhoto){

    avatar.innerHTML =
      `
        <img
          src="${escapeHTML(data.authorPhoto)}"
          alt="${escapeHTML(authorName)}"
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      `;

  }


  /*
   * Type
   */

  document.getElementById(
    "postType"
  ).textContent =
    data.type ||
    "discussion";


  /*
   * Date
   */

  document.getElementById(
    "postDate"
  ).textContent =
    formatDate(
      data.createdAt
    );


  /*
   * Text
   */

  document.getElementById(
    "postText"
  ).textContent =
    data.text ||
    "";


  /*
   * Visibility
   */

  document.getElementById(
    "visibility"
  ).textContent =
    "Visibility: " +
    (
      data.visibility ||
      "public"
    );


  /*
   * Counts
   */

  document.getElementById(
    "likeCount"
  ).textContent =
    Number(
      data.likeCount || 0
    );


  document.getElementById(
    "commentCount"
  ).textContent =
    Number(
      data.commentCount || 0
    );


  document.getElementById(
    "shareCount"
  ).textContent =
    Number(
      data.shareCount || 0
    );


  document.getElementById(
    "saveCount"
  ).textContent =
    Number(
      data.saveCount || 0
    );


  /*
   * Media
   */

  renderMedia(
    data.media
  );


  /*
   * SEO
   */

  updateSEO(
    data
  );

}


/* =========================
   MEDIA
========================= */

function renderMedia(
  media
){

  const container =
    document.getElementById(
      "mediaContainer"
    );


  container.innerHTML =
    "";


  if(
    !Array.isArray(media) ||
    media.length === 0
  ){

    return;

  }


  media.forEach(
    url => {

      if(
        typeof url !==
        "string" ||
        !url.trim()
      ){

        return;

      }


      const cleanURL =
        url.trim();


      /*
       * Image
       */

      if(
        /\.(jpg|jpeg|png|gif|webp|avif)(\?.*)?$/i
          .test(cleanURL)
      ){

        const img =
          document.createElement(
            "img"
          );


        img.src =
          cleanURL;

        img.alt =
          "Community post media";

        img.loading =
          "lazy";

        img.decoding =
          "async";

        img.referrerPolicy =
          "no-referrer";


        container.appendChild(
          img
        );


        return;

      }


      /*
       * Other media / URL
       */

      const link =
        document.createElement(
          "a"
        );


      link.className =
        "media-link";

      link.href =
        cleanURL;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

      link.textContent =
        "Open media";


      container.appendChild(
        link
      );

    }
  );

}


/* =========================
   SEO
========================= */

function updateSEO(
  data
){

  const title =
    data.authorName
      ? `${data.authorName} | Let'sStudy Pro Community`
      : "Community Post | Let'sStudy Pro";


  document.title =
    title;


  const description =
    String(
      data.text || ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .slice(
      0,
      155
    );


  document
    .getElementById(
      "metaDescription"
    )
    .setAttribute(
      "content",
      description ||
      "Community discussion on Let'sStudy Pro."
    );

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  loading.style.display =
    "none";

  postElement.classList.remove(
    "show"
  );


  errorBox.classList.add(
    "show"
  );


  document.getElementById(
    "errorMessage"
  ).textContent =
    message;

}


/* =========================
   LIKE
========================= */

document
  .getElementById(
    "likeButton"
  )
  .addEventListener(
    "click",
    async () => {

      if(!currentUser){

        alert(
          "Please login to like this post."
        );

        return;

      }


      if(!postId){

        return;

      }


      const ref =
        db
          .collection(
            "posts"
          )
          .doc(
            postId
          );


      try{

        await db.runTransaction(
          async transaction => {

            const snapshot =
              await transaction.get(
                ref
              );


            if(
              !snapshot.exists
            ){

              throw new Error(
                "Post not found"
              );

            }


            const data =
              snapshot.data();


            const current =
              Number(
                data.likeCount || 0
              );


            transaction.update(
              ref,
              {

                likeCount:
                  current + 1,

                updatedAt:
                  firebase.firestore
                    .FieldValue
                    .serverTimestamp()

              }
            );

          }
        );


        const count =
          Number(
            document
              .getElementById(
                "likeCount"
              )
              .textContent
          );


        document.getElementById(
          "likeCount"
        ).textContent =
          count + 1;


        document
          .getElementById(
            "likeButton"
          )
          .classList.add(
            "active"
          );

      }

      catch(error){

        console.error(
          "Like error:",
          error
        );

      }

    }
  );


/* =========================
   SHARE
========================= */

document
  .getElementById(
    "shareButton"
  )
  .addEventListener(
    "click",
    async () => {

      const shareURL =
        window.location.href;


      try{

        if(
          navigator.share
        ){

          await navigator.share({

            title:
              document.title,

            text:
              postData?.text ||
              "Check out this community post.",

            url:
              shareURL

          });

        }

        else{

          await navigator.clipboard.writeText(
            shareURL
          );

          alert(
            "Post link copied."
          );

        }


        if(currentUser){

          const ref =
            db
              .collection(
                "posts"
              )
              .doc(
                postId
              );


          await ref.update({

            shareCount:
              firebase.firestore
                .FieldValue
                .increment(1),

            updatedAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          });


          const count =
            Number(
              document
                .getElementById(
                  "shareCount"
                )
                .textContent
            );


          document.getElementById(
            "shareCount"
          ).textContent =
            count + 1;

        }

      }

      catch(error){

        console.error(
          "Share error:",
          error
        );

      }

    }
  );


/* ===================
/* =========================
   SAVE
========================= */

document
  .getElementById(
    "saveButton"
  )
  .addEventListener(
    "click",
    async () => {

      if(!currentUser){

        alert(
          "Please login to save this post."
        );

        return;

      }

      if(!postId){

        return;

      }

      try{

        const ref =
          db
            .collection("posts")
            .doc(postId);


        await ref.update({

          saveCount:
            firebase.firestore
              .FieldValue
              .increment(1),

          updatedAt:
            firebase.firestore
              .FieldValue
              .serverTimestamp()

        });


        const count =
          Number(
            document
              .getElementById(
                "saveCount"
              )
              .textContent
          );


        document.getElementById(
          "saveCount"
        ).textContent =
          count + 1;


        document
          .getElementById(
            "saveButton"
          )
          .classList.add(
            "active"
          );

      }

      catch(error){

        console.error(
          "Save error:",
          error
        );

      }

    }
  );


/* =========================
   COMMENTS BUTTON
========================= */

document
  .getElementById(
    "commentButton"
  )
  .addEventListener(
    "click",
    () => {

      const section =
        document.getElementById(
          "commentsSection"
        );


      section.style.display =
        "block";


      section.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

      document
        .getElementById(
          "commentInput"
        )
        .focus();

    }
  );


/* =========================
   CREATE COMMENT
========================= */

document
  .getElementById(
    "commentForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if(!currentUser){

        alert(
          "Please login to comment."
        );

        return;

      }


      if(!postId){

        return;

      }


      const input =
        document.getElementById(
          "commentInput"
        );


      const text =
        input.value.trim();


      if(!text){

        return;

      }


      const button =
        event.submitter;


      try{

        if(button){

          button.disabled =
            true;

          button.textContent =
            "Sending...";

        }


        const commentRef =
          db
            .collection("posts")
            .doc(postId)
            .collection("comments")
            .doc();


        await commentRef.set({

          authorId:
            currentUser.uid,

          authorName:
            currentUser.displayName ||
            "Community Member",

          authorPhoto:
            currentUser.photoURL ||
            "",

          text:
            text,

          status:
            "published",

          createdAt:
            firebase.firestore
              .FieldValue
              .serverTimestamp()

        });


        await db
          .collection("posts")
          .doc(postId)
          .update({

            commentCount:
              firebase.firestore
                .FieldValue
                .increment(1),

            updatedAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          });


        input.value =
          "";


        const count =
          Number(
            document
              .getElementById(
                "commentCount"
              )
              .textContent
          );


        document.getElementById(
          "commentCount"
        ).textContent =
          count + 1;


        await loadComments();

      }

      catch(error){

        console.error(
          "Comment error:",
          error
        );

        alert(
          "Unable to add comment. Please try again."
        );

      }

      finally{

        if(button){

          button.disabled =
            false;

          button.textContent =
            "Send";

        }

      }

    }
  );


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

  if(!postId){

    return;

  }


  const list =
    document.getElementById(
      "commentList"
    );


  try{

    const snapshot =
      await db
        .collection("posts")
        .doc(postId)
        .collection("comments")
        .where(
          "status",
          "==",
          "published"
        )
        .orderBy(
          "createdAt",
          "desc"
        )
        .limit(30)
        .get();


    if(snapshot.empty){

      list.innerHTML =
        `
          <div class="comment-empty">
            No comments yet.
          </div>
        `;

      return;

    }


    list.innerHTML =
      "";


    snapshot.forEach(
      doc => {

        const data =
          doc.data();


        const item =
          document.createElement(
            "div"
          );


        item.style.padding =
          "13px 0";


        item.style.borderBottom =
          "1px solid #e2e8f0";


        const name =
          escapeHTML(
            data.authorName ||
            "Community Member"
          );


        const text =
          escapeHTML(
            data.text ||
            ""
          );


        item.innerHTML =
          `
            <div
              style="
                display:flex;
                align-items:center;
                gap:9px;
              "
            >

              <div
                style="
                  width:34px;
                  height:34px;
                  border-radius:50%;
                  background:#f1f5f9;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  font-size:14px;
                  flex-shrink:0;
                "
              >
                👤
              </div>

              <div>

                <strong
                  style="
                    font-size:13px;
                  "
                >
                  ${name}
                </strong>

                <p
                  style="
                    margin-top:4px;
                    color:#475569;
                    font-size:13px;
                    line-height:1.55;
                    overflow-wrap:anywhere;
                  "
                >
                  ${text}
                </p>

              </div>

            </div>
          `;


        list.appendChild(
          item
        );

      }
    );

  }

  catch(error){

    console.error(
      "Load comments error:",
      error
    );


    list.innerHTML =
      `
        <div class="comment-empty">
          Unable to load comments.
        </div>
      `;

  }

}


/* =========================
   START
========================= */

loadPost();


/* =========================
   LOAD COMMENTS
   AFTER POST LOAD
========================= */

setTimeout(
  () => {

    loadComments();

  },
  500
);


/* =========================
   KEYBOARD SUPPORT
========================= */

document
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Escape"
      ){

        goCommunity();

      }

    }
  );
