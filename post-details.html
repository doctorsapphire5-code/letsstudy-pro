  <style>

<script type="module">

  import {
    initializeApp
  }
  from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    limit,
    addDoc,
    updateDoc,
    increment,
    serverTimestamp,
    orderBy
  }
  from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  import {
    getAuth,
    onAuthStateChanged
  }
  from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  /* =====================================================
     FIREBASE
  ===================================================== */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
  


  const firebaseApp =
    initializeApp(
      firebaseConfig
    );


  const db =
    getFirestore(
      firebaseApp
    );


  const auth =
    getAuth(
      firebaseApp
    );


  /* =====================================================
     STATE
  ===================================================== */

  let currentUser = null;

  let currentPost = null;

  let currentPostId = "";

  let currentPostType =
    "community";


  /* =====================================================
     URL
  ===================================================== */

  const params =
    new URLSearchParams(
      location.search
    );


  const requestedId =
    params.get("id") ||
    params.get("postId") ||
    "";


  function getSlug() {

    const parts =
      location.pathname
        .split("/")
        .filter(Boolean);

    if (!parts.length) {
      return "";
    }

    return parts[
      parts.length - 1
    ]
      .replace(
        /\.html$/i,
        ""
      )
      .trim()
      .toLowerCase();

  }


  const requestedSlug =
    getSlug();


  /* =====================================================
     SLUG CREATOR
  ===================================================== */

  function createSlug(
    value
  ) {

    return String(
      value || ""
    )

      .normalize("NFD")

      .replace(
        /[\u0300-\u036f]/g,
        ""
      )

      .toLowerCase()

      .trim()

      .replace(
        /[^a-z0-9]+/g,
        "-"
      )

      .replace(
        /^-+|-+$/g,
        "");

  }


  /* =====================================================
     RESOLVE COMMUNITY POST
  ===================================================== */

  async function resolveCommunityPost() {

    if (!requestedId) {
      return null;
    }


    try {

      const postRef =
        doc(
          db,
          "posts",
          requestedId
        );


      const snap =
        await getDoc(
          postRef
        );


      if (
        snap.exists()
      ) {

        return {

          id: snap.id,

          data:
            snap.data(),

          type:
            "community"

        };

      }

    } catch(error) {

      console.error(
        "Community post lookup failed:",
        error
      );

    }


    return null;

  }


  /* =====================================================
     RESOLVE BY SLUG
  ===================================================== */

  async function resolveBySlug() {

    if (!requestedSlug) {
      return null;
    }


    /*
     * Main community collection
     */

    try {

      const q =
        query(
          collection(
            db,
            "posts"
          ),

          where(
            "slug",
            "==",
            requestedSlug
          ),

          limit(1)
        );


      const snap =
        await getDocs(q);


      if (
        !snap.empty
      ) {

        const item =
          snap.docs[0];


        return {

          id:
            item.id,

          data:
            item.data(),

          type:
            item.data()?.groupId
              ? "group"
              : "community"

        };

      }

    } catch(error) {

      console.warn(
        "Slug query failed:",
        error
      );

    }


    /*
     * Legacy fallback:
     * compare generated title slug.
     */

    try {

      const q =
        query(
          collection(
            db,
            "posts"
          ),

          limit(500)
        );


      const snap =
        await getDocs(q);


      const matched =
        snap.docs.find(
          item => {

            const data =
              item.data();


            const savedSlug =
              String(
                data.slug || ""
              )
                .toLowerCase();


            const titleSlug =
              createSlug(
                data.title ||
                data.name ||
                ""
              );


            const seoUrl =
              String(
                data.seoUrl ||
                ""
              )
                .toLowerCase();


            return (

              savedSlug ===
              requestedSlug

              ||

              titleSlug ===
              requestedSlug

              ||

              seoUrl ===
              "/" +
              requestedSlug +
              ".html"

              ||

              seoUrl.endsWith(
                "/" +
                requestedSlug +
                ".html"
              )

            );

          }
        );


      if (matched) {

        return {

          id:
            matched.id,

          data:
            matched.data(),

          type:
            matched.data()?.groupId
              ? "group"
              : "community"

        };

      }

    } catch(error) {

      console.warn(
        "Legacy slug fallback failed:",
        error
      );

    }


    return null;

  }


  /* =====================================================
     RESOLVE GROUP POST
  ===================================================== */

  async function resolveGroupPost() {

    /*
     * If post is already in posts
     * with groupId, it was resolved above.
     *
     * This section supports nested
     * group post structures.
     */

    if (!requestedSlug) {
      return null;
    }


    try {

      const groupsSnap =
        await getDocs(
          query(
            collection(
              db,
              "groups"
            ),
            limit(200)
          )
        );


      for (
        const groupDoc
        of groupsSnap.docs
      ) {

        const groupId =
          groupDoc.id;


        const postsRef =
          collection(
            db,
            "groups",
            groupId,
            "posts"
          );


        const postsSnap =
  await getDocs(
    query(
      postsRef,
      limit(200)
    )
  );

const matched =
  postsSnap.docs.find(
    item => {

      const data =
        item.data();

      const savedSlug =
        String(
          data.slug || ""
        )
          .trim()
          .toLowerCase();

      const titleSlug =
        createSlug(
          data.title ||
          data.name ||
          data.content ||
          ""
        );

      const seoUrl =
        String(
          data.seoUrl || ""
        )
          .trim()
          .toLowerCase();

      return (
        savedSlug === requestedSlug ||

        titleSlug === requestedSlug ||

        seoUrl ===
          "/" +
          requestedSlug +
          ".html" ||

        seoUrl.endsWith(
          "/" +
          requestedSlug +
          ".html"
        )
      );

    }
  );

if (matched) {

  return {

    id:
      matched.id,

    data: {

      ...matched.data(),

      groupId:
        groupId,

      groupName:
        groupDoc.data()?.name ||
        groupDoc.data()?.title ||
        "Community Group"

    },

    type:
      "group"

  };

}

}

} catch (error) {

  console.warn(
    "Nested group post lookup failed:",
    error
  );

}

return null;

}


/* =====================================================
   UNIVERSAL COMMUNITY + GROUP POST RESOLVER
===================================================== */

async function resolvePost() {

  let result =
    await resolveCommunityPost();

if (result) {

  return result;

}


result =
  await resolveBySlug();

if (result) {

  return result;

}


result =
  await resolveGroupPost();

return result;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   CREATE CLEAN SLUG
===================================================== */

function createSlug(text) {

  return String(
    text || ""
  )

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase()

    .trim()

    .replace(
      /[^a-z0-9]+/g,
      "-"
    )

    .replace(
      /^-+|-+$/g,
      "");

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value) {

  if (!value) {

    return "Recently";

  }

  try {

    const date =
      typeof value.toDate ===
      "function"

        ? value.toDate()

        : new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "Recently";

    }

    return new Intl.DateTimeFormat(
      "en",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    ).format(date);

  } catch {

    return "Recently";

  }

}


/* =====================================================
   AVATAR
===================================================== */

function getAvatar(data) {

  return (
    data.authorPhoto ||
    data.authorImage ||
    data.photoURL ||
    data.photoUrl ||
    data.avatar ||
    data.imageUrl ||
    ""
  );

}


/* =====================================================
   RENDER POST
===================================================== */

function renderPost(result) {

  const data =
    result.data || {};

  currentPost =
    data;

  currentPostId =
    result.id;

  currentPostType =
    result.type;


  const title =
    data.title ||
    "";


  const content =
    data.content ||
    data.body ||
    data.text ||
    data.description ||
    "";


  const authorName =
    data.authorName ||
    data.displayName ||
    data.userName ||
    "LetsStudy Pro Member";


  const avatar =
    getAvatar(data);


  const groupId =
    data.groupId ||
    "";


  const groupName =
    data.groupName ||
    data.groupTitle ||
    "";


  const imageUrl =
    data.imageUrl ||
    data.imageURL ||
    data.image ||
    data.mediaUrl ||
    "";


  const videoUrl =
    data.videoUrl ||
    data.videoURL ||
    "";


  const likes =
    Number(
      data.likesCount ??
      data.likes ??
      0
    );


  const comments =
    Number(
      data.commentsCount ??
      data.commentCount ??
      0
    );


  const shares =
    Number(
      data.sharesCount ??
      data.shareCount ??
      0
    );


  const views =
    Number(
      data.viewsCount ??
      data.views ??
      0
    );


  document.title =
    (
      title ||
      "Community Post"
    ) +
    " | LetsStudy Pro";


  document
    .getElementById(
      "metaDescription"
    )
    ?.setAttribute(
      "content",
      String(
        content || title
      )
        .replace(
          /<[^>]*>/g,
          ""
        )
        .slice(
          0,
          160
        )
    );


  const app =
    document.getElementById(
      "app"
    );


  app.innerHTML = `

    <div class="page">

      <div class="breadcrumb">

        <a href="community.html">
          Community
        </a>

        <span>›</span>

        ${
          groupId
            ? `
              <a href="groups.html">
                Groups
              </a>

              <span>›</span>
            `
            : ""
        }

        <span>
          Post
        </span>

      </div>


      <article class="post-card">

        <header class="post-header">

          <div class="author-row">

            <div class="author">

              ${
                avatar
                  ? `
                    <img
                      class="avatar"
                      src="${escapeHTML(
                        avatar
                      )}"
                      alt="${escapeHTML(
                        authorName
                      )}"
                    >
                  `
                  : `
                    <div
                      class="avatar"
                      style="
                        display:grid;
                        place-items:center;
                        background:#eaf1ff;
                        color:#155eef;
                      "
                    >
                      <i
                        class="fa-solid fa-user"
                      ></i>
                    </div>
                  `
              }


              <div class="author-info">

                <div class="author-name">

                  ${escapeHTML(
                    authorName
                  )}

                </div>


                <div class="post-meta">

                  ${escapeHTML(
                    formatDate(
                      data.createdAt
                    )
                  )}

                  ·

                  ${
                    result.type ===
                    "group"
                      ? "Group post"
                      : "Community post"
                  }

                </div>

              </div>

            </div>


            <button
              class="more-button"
              id="moreButton"
              type="button"
            >

              <i
                class="fa-solid fa-ellipsis"
              ></i>

            </button>

          </div>


          ${
            groupId
              ? `
                <a
                  class="group-box"
                  href="group-details.html?id=${encodeURIComponent(
                    groupId
                  )}"
                >

                  <div class="group-icon">

                    <i
                      class="fa-solid fa-user-group"
                    ></i>

                  </div>


                  <div>

                    <div class="group-name">

                      ${escapeHTML(
                        groupName ||
                        "Community Group"
                      )}

                    </div>


                    <div class="group-label">

                      Group post

                    </div>

                  </div>

                </a>
              `
              : ""
          }

        </header>


        <div class="post-body">

          ${
            title
              ? `
                <h1 class="post-title">

                  ${escapeHTML(
                    title
                  )}

                </h1>
              `
              : ""
          }


          <div
            class="post-content"
            id="postContent"
          >

            ${safePostHTML(
              content
            )}

          </div>


          ${
            imageUrl
              ? `
                <div class="media">

                  <img
                    src="${escapeHTML(
                      imageUrl
                    )}"
                    alt="${escapeHTML(
                      title ||
                      "Community post"
                    )}"
                    loading="lazy"
                  >

                </div>
              `
              : ""
          }


          ${
            videoUrl
              ? `
                <div class="media">

                  <video
                    controls
                    preload="metadata"
                  >

                    <source
                      src="${escapeHTML(
                        videoUrl
                      )}"
                    >

                    Your browser does
                    not support video.

                  </video>

                </div>
              `
              : ""
          }

        </div>


        <div class="post-stats">

          <div class="stats-left">

            <span>

              <i
                class="fa-regular fa-heart"
              ></i>

              <span id="likesCount">
                ${likes}
              </span>

              likes

            </span>


            <span>

              <i
                class="fa-regular fa-comment"
              ></i>

              <span id="commentsCount">
                ${comments}
              </span>

              comments

            </span>


            <span>

              <i
                class="fa-solid fa-eye"
              ></i>

              <span id="viewsCount">
                ${views}
              </span>

              views

            </span>

          </div>


          <span>

            <span id="sharesCount">
              ${shares}
            </span>

            shares

          </span>

        </div>


        <div class="post-actions">

          <button
            class="post-action"
            id="likeButton"
            type="button"
          >

            <i
              class="fa-regular fa-heart"
            ></i>

            <span>
              Like
            </span>

          </button>


          <button
            class="post-action"
            id="commentButton"
            type="button"
          >

            <i
              class="fa-regular fa-comment"
            ></i>

            <span>
              Comment
            </span>

          </button>


          <button
            class="post-action"
            id="shareButton"
            type="button"
          >

            <i
              class="fa-solid fa-share"
            ></i>

            <span>
              Share
            </span>

          </button>


          <button
            class="post-action"
            id="copyButton"
            type="button"
          >

            <i
              class="fa-regular fa-copy"
            ></i>

            <span>
              Copy link
            </span>

          </button>

        </div>

      </article>


      <section
        class="comments-section"
        id="commentsSection"
      >

        <h2 class="comments-title">

          Comments

          <span
            id="commentHeadingCount"
          >
            (${comments})
          </span>

        </h2>


        <form
          class="comment-form"
          id="commentForm"
        >

          <input
            class="comment-input"
            id="commentInput"
            type="text"
            maxlength="1000"
            placeholder="Write a comment..."
            autocomplete="off"
          >


          <button
            class="send-comment"
            type="submit"
          >
            Send
          </button>

        </form>


        <div
          id="commentsList"
        >

          <div
            style="
              text-align:center;
              padding:20px;
              color:#98a2b3;
            "
          >
            Loading comments...
          </div>

        </div>

      </section>

    </div>

  `;


  bindPostActions();

  loadComments();

  incrementViews();

}


/* =====================================================
   SAFE CONTENT
===================================================== */

function safePostHTML(
  value
) {

  const text =
    String(
      value || ""
    );


  return escapeHTML(
    text
  )

    .replace(
      /\n\n+/g,
      "</p><p>"
    )

    .replace(
      /\n/g,
      "<br>"
    )

    .replace(
      /^/,
      "<p>"
    )

    .replace(
      /$/,
      "</p>"
    );

}


/* =====================================================
   POST ACTIONS
===================================================== */

function bindPostActions() {

  document
    .getElementById(
      "likeButton"
    )
    ?.addEventListener(
      "click",
      likePost
    );


  document
    .getElementById(
      "commentButton"
    )
    ?.addEventListener(
      "click",
      () => {

        document
          .getElementById(
            "commentInput"
          )
          ?.focus();

      }
    );


  document
    .getElementById(
      "shareButton"
    )
    ?.addEventListener(
      "click",
      sharePost
    );


  document
    .getElementById(
      "copyButton"
    )
    ?.addEventListener(
      "click",
      copyLink
    );


  document
    .getElementById(
      "commentForm"
    )
    ?.addEventListener(
      "submit",
      submitComment
    );


  document
    .getElementById(
      "moreButton"
    )
    ?.addEventListener(
      "click",
      reportPost
    );

}


/* =====================================================
   LIKE POST
===================================================== */

async function likePost() {

  if (!currentUser) {

    showToast(
      "Please sign in to like this post."
    );

    return;

  }


  try {

    await updateDoc(

      doc(
        db,
        "posts",
        currentPostId
      ),

      {
        likesCount:
          increment(1)
      }

    );


    const counter =
      document.getElementById(
        "likesCount"
      );


    counter.textContent =
      Number(
        counter.textContent || 0
      ) + 1;


    const button =
      document.getElementById(
        "likeButton"
      );


    button.classList.add(
      "liked"
    );


    button.innerHTML = `

      <i
        class="fa-solid fa-heart"
      ></i>

      <span>
        Liked
      </span>

    `;

  } catch(error) {

    console.error(
      error
    );

    showToast(
      "Could not like post."
    );

  }

}


/* =====================================================
   INCREMENT VIEWS
===================================================== */

async function incrementViews() {

  try {

    await updateDoc(

      doc(
        db,
        "posts",
        currentPostId
      ),

      {
        viewsCount:
          increment(1)
      }

    );


    const counter =
      document.getElementById(
        "viewsCount"
      );


    if (counter) {

      counter.textContent =
        Number(
          counter.textContent || 0
        ) + 1;

    }

  } catch(error) {

    console.warn(
      "View update failed",
      error
    );

  }

}


/* =====================================================
   SHARE
===================================================== */

async function sharePost() {

  const url =
    window.location.href;


  const title =
    currentPost?.title ||
    "LetsStudy Pro Community Post";


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title,

        text:
          "Check out this post on LetsStudy Pro.",

        url

      });

    } catch {}

    return;

  }


  await copyLink();

}


/* =====================================================
   COPY
===================================================== */

async function copyLink() {

  try {

    await navigator.clipboard
      .writeText(
        location.href
      );


    showToast(
      "Post link copied."
    );

  } catch(error) {

    showToast(
      "Could not copy link."
    );

  }

}


/* =====================================================
   COMMENTS
===================================================== */

async function loadComments() {

  const list =
    document.getElementById(
      "commentsList"
    );


  if (!list) {
    return;
  }


  try {

    const commentsSnap =
      await getDocs(

        query(

          collection(
            db,
            "posts",
            currentPostId,
            "comments"
          ),

          orderBy(
            "createdAt",
            "desc"
          ),

          limit(100)

        )

      );


    if (
      commentsSnap.empty
    ) {

      list.innerHTML = `

        <div
          style="
            text-align:center;
            padding:25px;
            color:#98a2b3;
          "
        >

          No comments yet.
          Be the first to comment.

        </div>

      `;

      return;

    }


    list.innerHTML =
      commentsSnap.docs
        .map(
          item =>
            renderComment(
              item.data()
            )
        )
        .join("");


  } catch(error) {

    console.error(
      "Comments error:",
      error
    );


    list.innerHTML = `

      <div
        style="
          text-align:center;
          padding:20px;
          color:#98a2b3;
        "
      >

        Comments could not be loaded.

      </div>

    `;

  }

}


/* =====================================================
   COMMENT RENDER
===================================================== */

function renderComment(
  data
) {

  const name =
    data.authorName ||
    data.displayName ||
    "Member";


  const text =
    data.text ||
    data.content ||
    "";


  const avatar =
    data.authorPhoto ||
    data.photoURL ||
    data.avatar ||
    "";


  return `

    <div class="comment">

      ${
        avatar
          ? `
            <img
              class="comment-avatar"
              src="${escapeHTML(
                avatar
              )}"
              alt=""
            >
          `
          : `
            <div
              class="comment-avatar"
              style="
                display:grid;
                place-items:center;
                background:#eaf1ff;
                color:#155eef;
              "
            >
              <i
                class="fa-solid fa-user"
              ></i>
            </div>
          `
      }


      <div class="comment-content">

        <div class="comment-author">

          ${escapeHTML(
            name
          )}

        </div>


        <div class="comment-text">

          ${escapeHTML(
            text
          )}

        </div>


        <div class="comment-time">

          ${formatDate(
            data.createdAt
          )}

        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   SUBMIT COMMENT
===================================================== */

async function submitComment(event) {

  event.preventDefault();

  if (!currentUser) {
    showToast("Please sign in to comment.");
    return;
  }

  const input =
    document.getElementById("commentInput");

  if (!input) return;

  const text =
    input.value.trim();

  if (!text) {
    input.focus();
    return;
  }

  const submitButton =
    event.submitter ||
    document.querySelector(
      "#commentForm button[type='submit']"
    );

  try {

    if (submitButton) {
      submitButton.disabled = true;
      submitButton.textContent = "Posting...";
    }

    await addDoc(
      collection(
        db,
        "posts",
        currentPostId,
        "comments"
      ),
      {
        text: text,

        authorId:
          currentUser.uid,

        authorName:
          currentUser.displayName ||
          currentUser.email ||
          "LetsStudy Pro Member",

        authorPhoto:
          currentUser.photoURL ||
          "",

        createdAt:
          serverTimestamp()
      }
    );

    await updateDoc(
      doc(
        db,
        "posts",
        currentPostId
      ),
      {
        commentsCount:
          increment(1)
      }
    );

    input.value = "";

    await loadComments();

    const counter =
      document.getElementById(
        "commentsCount"
      );

    if (counter) {
      counter.textContent =
        Number(
          counter.textContent || 0
        ) + 1;
    }

    const headingCounter =
      document.getElementById(
        "commentHeadingCount"
      );

    if (headingCounter) {
      const current =
        Number(
          headingCounter.textContent
            .replace(/\D/g, "") || 0
        );

      headingCounter.textContent =
        `(${current + 1})`;
    }

    showToast(
      "Comment posted successfully."
    );

  } catch (error) {

    console.error(
      "SUBMIT COMMENT ERROR:",
      error
    );

    showToast(
      "Unable to post comment."
    );

  } finally {

    if (submitButton) {
      submitButton.disabled = false;
      submitButton.textContent = "Send";
    }

  }

}


/* =====================================================
   REPORT POST
===================================================== */

function reportPost() {

  if (!currentPostId) {
    showToast("Post information is unavailable.");
    return;
  }

  const confirmed =
    window.confirm(
      "Do you want to report this post?"
    );

  if (!confirmed) {
    return;
  }

  showToast(
    "Thank you. Your report has been received."
  );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;

function showToast(message) {

  const toast =
    document.getElementById("toast");

  if (!toast) {
    return;
  }

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {
        toast.classList.remove("show");
      },
      2800
    );

}


/* =====================================================
   PAGE INITIALIZATION
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    currentUser =
      user || null;

    try {

      const result =
        await resolvePost();

      if (!result) {

        const app =
          document.getElementById("app");

        if (app) {

          app.innerHTML = `

            <div class="error">

              <div class="error-icon">
                <i class="fa-regular fa-file-circle-xmark"></i>
              </div>

              <h2>
                Post Not Found
              </h2>

              <p>
                The Community or Group post
                you are looking for could not
                be found.
              </p>

              <div class="error-actions">

                <a
                  href="community.html"
                  class="back-button"
                >
                  <i class="fa-solid fa-arrow-left"></i>
                  Back to Community
                </a>

                <a
                  href="groups.html"
                  class="secondary-button"
                >
                  <i class="fa-solid fa-user-group"></i>
                  Browse Groups
                </a>

              </div>

            </div>

          `;

        }

        return;
      }

      renderPost(
        result
      );

    } catch (error) {

      console.error(
        "POST DETAILS ERROR:",
        error
      );

      const app =
        document.getElementById("app");

      if (app) {

        app.innerHTML = `

          <div class="error">

            <div class="error-icon">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <h2>
              Something went wrong
            </h2>

            <p>
              We couldn't load this post.
              Please refresh the page and try again.
            </p>

            <div class="error-actions">

              <button
                class="back-button"
                onclick="location.reload()"
              >
                <i class="fa-solid fa-rotate"></i>
                Try Again
              </button>

              <a
                href="community.html"
                class="secondary-button"
              >
                Community
              </a>

            </div>

          </div>

        `;

      }

    }

  }
);


/* =====================================================
   GLOBAL SAFETY
===================================================== */

window.addEventListener(
  "error",
  event => {

    console.error(
      "Page error:",
      event.error ||
      event.message
    );

  }
);

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled promise rejection:",
      event.reason
    );

  }
);

</script>
