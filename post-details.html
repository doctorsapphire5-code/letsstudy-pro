<style>

*{

/* =========================
   POST
========================= */

.post-card{

  border:1px solid #e2e8f0;

  border-radius:17px;

  overflow:hidden;
}

.post-image{
  width:100%;
  max-height:430px;

  object-fit:cover;

}

.post-body{

.category{
  display:inline-block;

  background:#eff6ff;
  color:#2563eb;

  padding:6px 10px;

  font-size:8px;
  font-weight:800;

  margin-bottom:12px;

.post-title{

  line-height:1.25;

  margin-bottom:14px;
}

.author{
  display:flex;
  align-items:center;
  gap:10px;

  padding-bottom:17px;
  margin-bottom:20px;

  border-bottom:1px solid #f1f5f9;
}

.avatar{
  width:38px;
  height:38px;

  border-radius:50%;

  background:#dbeafe;
  color:#2563eb;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:11px;
  font-weight:800;
}

.author-name{
  font-size:10px;
  font-weight:800;
}

.post-date{
  color:#94a3b8;
  font-size:8px;
  margin-top:3px;
}

.post-content{
  color:#334155;

  font-size:12px;

  line-height:1.85;

  white-space:pre-wrap;

  word-break:break-word;
}

.actions{
  display:flex;
  gap:9px;

  padding-top:22px;
  margin-top:22px;

  border-top:1px solid #f1f5f9;
}

.action-btn{
  border:1px solid #e2e8f0;

  background:#fff;

  color:#475569;

  padding:9px 13px;

  border-radius:8px;

  font-size:9px;
  font-weight:800;

  cursor:pointer;
}

.action-btn.liked{
  background:#eff6ff;
  color:#2563eb;
  border-color:#bfdbfe;
}


/* =========================
   COMMENTS
========================= */

.comments-card{
  background:#fff;

  border:1px solid #e2e8f0;

  border-radius:15px;

  padding:20px;

  margin-top:18px;
}

.comments-title{
  font-size:15px;
  margin-bottom:17px;
}

.comment-form{
  margin-bottom:20px;
}

.comment-form textarea{
  width:100%;

  min-height:80px;

  padding:11px;

  border:1px solid #cbd5e1;

  border-radius:9px;

  outline:none;

  resize:vertical;

  font-size:10px;
}

.comment-btn{
  margin-top:8px;

  border:0;

  background:#2563eb;
  color:#fff;

  padding:9px 14px;

  border-radius:8px;

  font-size:9px;
  font-weight:800;

  cursor:pointer;
}

.comment{
  display:flex;

  gap:10px;

  padding:15px 0;

  border-top:1px solid #f1f5f9;
}

.comment-avatar{
  width:32px;
  height:32px;

  flex-shrink:0;

  border-radius:50%;

  background:#f1f5f9;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:9px;
  font-weight:800;
}

.comment-author{
  font-size:9px;
  font-weight:800;
}

.comment-date{
  color:#94a3b8;
  font-size:7px;
  margin-top:2px;
}

.comment-text{
  color:#475569;

  font-size:10px;

  line-height:1.6;

  margin-top:6px;

  white-space:pre-wrap;
}

.empty{
  text-align:center;

  padding:35px 10px;

  color:#94a3b8;

  font-size:10px;
}

.loading{
  text-align:center;

  padding:70px;

  color:#64748b;

  font-size:11px;
}

footer{
  text-align:center;

  padding:30px;

  color:#94a3b8;

  font-size:9px;
}


@media(max-width:650px){

  .nav-links{
    display:none;
  }

  .menu-btn{
    display:block;
  }

  .post-title{
    font-size:22px;
  }

  .post-body{
    padding:19px;
  }

}

</style>

</head>

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  set,
  push,
  remove
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById(
  "loading"
);

const content =
document.getElementById(
  "content"
);

const message =
document.getElementById(
  "message"
);

const postImage =
document.getElementById(
  "postImage"
);

const postTitle =
document.getElementById(
  "postTitle"
);

const postCategory =
document.getElementById(
  "postCategory"
);

const postContent =
document.getElementById(
  "postContent"
);

const authorName =
document.getElementById(
  "authorName"
);

const authorAvatar =
document.getElementById(
  "authorAvatar"
);

const postDate =
document.getElementById(
  "postDate"
);

const likeBtn =
document.getElementById(
  "likeBtn"
);

const likeCount =
document.getElementById(
  "likeCount"
);

const commentCount =
document.getElementById(
  "commentCount"
);

const commentsNumber =
document.getElementById(
  "commentsNumber"
);

const comments =
document.getElementById(
  "comments"
);

const commentForm =
document.getElementById(
  "commentForm"
);

const commentText =
document.getElementById(
  "commentText"
);

const commentBtn =
document.getElementById(
  "commentBtn"
);

const commentScrollBtn =
document.getElementById(
  "commentScrollBtn"
);


let currentUser =
null;

let currentPost =
null;


/* =========================
   POST ID
========================= */

const params =
new URLSearchParams(
window.location.search
);

const postId =
params.get(
"postId"
) ||
params.get(
"id"
);


/* =========================
   MESSAGE
========================= */

function showMessage(
text,
type
){

  message.textContent =
  text;

  message.className =
  "message " +
  type;

  setTimeout(
    () => {

      message.className =
      "message";

    },
    3500
  );

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(
value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   DATE
========================= */

function formatDate(
value
){

  if(!value){
    return "Recently";
  }

  const date =
  new Date(
    Number(value)
  );

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "Recently";

  }

  return date.toLocaleString(
    "en-TZ",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* =========================
   LOAD POST
========================= */

async function loadPost(){

  if(!postId){

    loading.textContent =
    "Post ID is missing.";

    return;

  }


  try{

    const snapshot =
    await get(
      ref(
        db,
        "posts/" +
        postId
      )
    );


    if(
      !snapshot.exists()
    ){

      loading.textContent =
      "Post not found.";

      return;

    }


    currentPost =
    snapshot.val();


    renderPost();

    await loadComments();

    updateLikeButton();


    loading.style.display =
    "none";

    content.style.display =
    "block";


  }catch(error){

    console.error(
      "Load post error:",
      error
    );

    loading.textContent =
    "Unable to load post.";

  }

}


/* =========================
   RENDER POST
========================= */

function renderPost(){

  document.title =
  (
    currentPost.title ||
    "Post"
  ) +
  " | LetsStudy Pro";


  postTitle.textContent =
  currentPost.title ||
  "Untitled Post";


  postCategory.textContent =
  currentPost.category ||
  "General";


  postContent.textContent =
  currentPost.content ||
  "";


  const email =
  currentPost.authorEmail ||
  "Student";


  const name =
  email.split("@")[0];


  authorName.textContent =
  name;


  authorAvatar.textContent =
  name
  .substring(0,2)
  .toUpperCase();


  postDate.textContent =
  formatDate(
    currentPost.createdAt
  );


  const imageUrl =
  currentPost.imageUrl ||
  "";


  if(imageUrl){

    postImage.src =
    imageUrl;

    postImage.style.display =
    "block";

  }


  likeCount.textContent =
  Number(
    currentPost.likes ||
    0
  );

}


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

  const snapshot =
  await get(
    ref(
      db,
      "posts/" +
      postId +
      "/comments"
    )
  );


  comments.innerHTML =
  "";


  if(
    !snapshot.exists()
  ){

    comments.innerHTML =
    `<div class="empty">
       No comments yet. Be the first to comment.
     </div>`;

    commentCount.textContent =
    "0";

    commentsNumber.textContent =
    "0";

    return;

  }


  const data =
  snapshot.val();


  const entries =
  Object.entries(
    data
  )
  .map(
    ([id,comment]) => ({
      id,
      ...comment
    })
  )
  .sort(
    (a,b) =>
    Number(
      a.createdAt || 0
    ) -
    Number(
      b.createdAt || 0
    )
  );


  commentCount.textContent =
  entries.length;

  commentsNumber.textContent =
  entries.length;


  entries.forEach(
    comment => {

      const item =
      document.createElement(
        "div"
      );

      item.className =
      "comment";


      const email =
      comment.userEmail ||
      "Student";


      const name =
      email.split("@")[0];


      const initials =
      name
      .substring(0,2)
      .toUpperCase();


      item.innerHTML = `

        <div class="comment-avatar">
          ${escapeHTML(
            initials
          )}
        </div>

        <div>

          <div class="comment-author">
            ${escapeHTML(
              name
            )}
          </div>

          <div class="comment-date">
            ${escapeHTML(
              formatDate(
                comment.createdAt
              )
            )}
          </div>

          <div class="comment-text">
            ${escapeHTML(
              comment.text
            )}
          </div>

        </div>

      `;


      comments.appendChild(
        item
      );

    }
  );

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
    user;


    if(user){

      commentForm.style.display =
      "block";

    }else{

      commentForm.style.display =
      "none";

    }


    updateLikeButton();

  }
);


/* =========================
   LIKE
========================= */

function updateLikeButton(){

  if(!currentUser){

    likeBtn.classList.remove(
      "liked"
    );

    likeBtn.innerHTML =
    `♡ Like <span id="likeCount">${
      Number(
        currentPost?.likes || 0
      )
    }</span>`;

    return;

  }


  const likes =
  currentPost?.likedBy ||
  {};


  const liked =
  Boolean(
    likes[
      currentUser.uid
    ]
  );


  likeBtn.classList.toggle(
    "liked",
    liked
  );


  likeBtn.innerHTML =
  `${liked ? "♥" : "♡"} Like
  <span id="likeCount">${
    Number(
      currentPost?.likes || 0
    )
  }</span>`;

}


likeBtn.addEventListener(
  "click",
  async function(){

    if(!currentUser){

      window.location.href =
      "/login.html?redirect=" +
      encodeURIComponent(
        "post-details.html?id=" +
        postId
      );

      return;

    }


    try{

      const likeRef =
      ref(
        db,
        "posts/" +
        postId +
        "/likedBy/" +
        currentUser.uid
      );


      const snapshot =
      await get(
        likeRef
      );


      let likes =
      Number(
        currentPost.likes ||
        0
      );


      if(
        snapshot.exists()
      ){

        await remove(
          likeRef
        );

        likes =
        Math.max(
          0,
          likes - 1
        );

      }else{

        await set(
          likeRef,
          true
        );

        likes++;

      }


      await set(
        ref(
          db,
          "posts/" +
          postId +
          "/likes"
        ),
        likes
      );


      currentPost.likes =
      likes;


      if(
        !currentPost.likedBy
      ){

        currentPost.likedBy =
        {};

      }


      if(
        snapshot.exists()
      ){

        delete currentPost.likedBy[
          currentUser.uid
        ];

      }else{

        currentPost.likedBy[
          currentUser.uid
        ] =
        true;

      }


      updateLikeButton();


    }catch(error){

      console.error(
        "Like error:",
        error
      );

      showMessage(
        "Unable to update like.",
        "error"
      );

    }

  }
);


/* =========================
   ADD COMMENT
========================= */

commentBtn.addEventListener(
  "click",
  async function(){

    if(!currentUser){

      showMessage(
        "Please login to comment.",
        "error"
      );

      return;

    }


    const text =
    commentText.value.trim();


    if(!text){

      showMessage(
        "Write a comment first.",
        "error"
      );

      return;

    }


    commentBtn.disabled =
    true;

    commentBtn.textContent =
    "Posting...";


    try{

      const commentRef =
      push(
        ref(
          db,
          "posts/" +
          postId +
          "/comments"
        )
      );


      await set(
        commentRef,
        {

          userId:
          currentUser.uid,

          userEmail:
          currentUser.email ||
          "",

          text:
          text,

          createdAt:
          Date.now()

        }
      );


      const count =
      Number(
        currentPost.commentsCount ||
        0
      ) + 1;


      await set(
        ref(
          db,
          "posts/" +
          postId +
          "/commentsCount"
        ),
        count
      );


      currentPost.commentsCount =
      count;


      commentText.value =
      "";


      showMessage(
        "Comment posted successfully.",
        "success"
      );


      await loadComments();


    }catch(error){

      console.error(
        "Comment error:",
        error
      );

      showMessage(
        "Unable to post comment. Please try again.",
        "error"
      );

    }


    commentBtn.disabled =
    false;

    commentBtn.textContent =
    "Post Comment";

  }
);


/* =========================
   SCROLL COMMENTS
========================= */

commentScrollBtn.addEventListener(
  "click",
  function(){

    document
    .getElementById(
      "commentsSection"
    )
    .scrollIntoView({
      behavior:"smooth"
    });

  }
);


/* =========================
   MOBILE MENU
========================= */

document
.getElementById(
"menuBtn"
)
.addEventListener(
"click",
function(){

  document
  .querySelector(
    ".nav-links"
  )
  .classList.toggle(
    "active"
  );

});


/* =========================
   START
========================= */

loadPost();

</script>

</body>
