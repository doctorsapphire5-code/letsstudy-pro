<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Post Details | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a
}

a{text-decoration:none;color:inherit}

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:13px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb
}

nav{
display:flex;
gap:7px;
flex-wrap:wrap
}

nav a{
font-size:9px;
font-weight:900;
background:#f1f5f9;
padding:8px 10px;
border-radius:8px
}

.container{
max-width:950px;
margin:auto;
padding:20px 15px
}

.card{
background:#fff;
border:1px solid #e2e8f0;
border-radius:17px;
padding:18px;
margin-bottom:15px
}

.post-header{
display:flex;
align-items:center;
gap:11px;
margin-bottom:18px
}

.avatar{
width:46px;
height:46px;
border-radius:50%;
background:#dbeafe;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
overflow:hidden;
flex-shrink:0
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.author{
font-size:11px;
font-weight:900
}

.meta{
font-size:8px;
color:#64748b;
margin-top:4px
}

.category{
display:inline-block;
background:#dbeafe;
color:#1d4ed8;
padding:5px 8px;
border-radius:7px;
font-size:8px;
font-weight:900;
margin-bottom:10px
}

h1{
font-size:25px;
line-height:1.3;
margin-bottom:12px
}

.content{
font-size:11px;
line-height:1.9;
color:#334155;
white-space:pre-wrap;
word-break:break-word
}

.post-image{
width:100%;
max-height:500px;
object-fit:cover;
border-radius:12px;
margin-top:16px
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:18px
}

.btn{
border:0;
cursor:pointer;
padding:10px 13px;
border-radius:9px;
font-size:9px;
font-weight:900;
display:inline-flex;
align-items:center;
justify-content:center
}

.primary{
background:#2563eb;
color:#fff
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.danger{
background:#fee2e2;
color:#991b1b
}

.info{
background:#eff6ff;
color:#1d4ed8
}

.grid{
display:grid;
grid-template-columns:1fr 280px;
gap:15px
}

.side-title{
font-size:12px;
font-weight:900;
margin-bottom:12px
}

.side-link{
display:block;
background:#f8fafc;
padding:11px;
border-radius:9px;
font-size:9px;
font-weight:900;
margin-bottom:7px
}

.side-link:hover{
background:#eff6ff
}

.loading,
.empty{
text-align:center;
padding:40px 15px;
font-size:10px;
color:#64748b
}

.message{
display:none;
padding:11px;
border-radius:9px;
font-size:10px;
font-weight:900;
margin-bottom:12px
}

.message.show{
display:block
}

.success{
background:#dcfce7;
color:#166534
}

.error{
background:#fee2e2;
color:#991b1b
}

footer{
text-align:center;
padding:30px;
font-size:10px;
color:#64748b
}

@media(max-width:750px){
.grid{grid-template-columns:1fr}

header{
flex-direction:column;
align-items:flex-start
}

nav{
width:100%
}

nav a{
flex:1;
text-align:center
}

h1{
font-size:21px
}
}
</style>
</head>

<body>

<header>

<a href="community.html" class="logo">
LetsStudy Pro
</a>

<nav>
<a href="community.html">Community</a>
<a href="groups.html">Groups</a>
<a href="dashboard.html">Dashboard</a>
</nav>

</header>

<main class="container">

<div id="message" class="message"></div>

<div id="loading" class="loading">
Loading post...
</div>

<div id="contentArea" style="display:none">

<div class="grid">

<section>

<article class="card">

<div class="post-header">

<div id="avatar" class="avatar">
U
</div>

<div>

<div id="author" class="author">
Community Member
</div>

<div id="meta" class="meta">
Loading...
</div>

</div>

</div>

<div id="category" class="category">
General
</div>

<h1 id="title">
Post
</h1>

<div id="content" class="content">
</div>

<img
id="postImage"
class="post-image"
style="display:none"
alt="Post image">

<div class="actions">

<a
href="community.html"
class="btn secondary">

← Community

</a>

<a
id="groupButton"
href="#"
class="btn info"
style="display:none">

Study Group

</a>

<a
id="chatButton"
href="#"
class="btn primary">

💬 Private Chat

</a>

<button
id="reportPost"
class="btn danger">

⚑ Report Post

</button>

<button
id="reportUser"
class="btn danger">

⚑ Report User

</button>

</div>

</article>

</section>


<aside>

<div class="card">

<div class="side-title">
Community Navigation
</div>

<a
href="community.html"
class="side-link">

🌐 Community Home

</a>

<a
href="groups.html"
class="side-link">

👥 Study Groups

</a>

<a
href="create-post.html"
class="side-link">

✏️ Create Post

</a>

<a
href="community-chat.html"
class="side-link">

💬 Community Chat

</a>

<a
href="dashboard.html"
class="side-link">

📊 Dashboard

</a>

</div>


<div class="card">

<div class="side-title">
Post Information
</div>

<div
id="postInfo"
style="
font-size:9px;
line-height:1.8;
color:#64748b">

Loading...

</div>

</div>

</aside>

</div>

</div>

</main>

<footer>
© <span id="year"></span> LetsStudy Pro
</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const loading=
document.getElementById("loading");

const contentArea=
document.getElementById("contentArea");

const message=
document.getElementById("message");

const avatar=
document.getElementById("avatar");

const author=
document.getElementById("author");

const meta=
document.getElementById("meta");

const category=
document.getElementById("category");

const title=
document.getElementById("title");

const content=
document.getElementById("content");

const postImage=
document.getElementById("postImage");

const groupButton=
document.getElementById("groupButton");

const chatButton=
document.getElementById("chatButton");

const reportPost=
document.getElementById("reportPost");

const reportUser=
document.getElementById("reportUser");

const postInfo=
document.getElementById("postInfo");


/* =========================================
POST ID
========================================= */

const params=
new URLSearchParams(
location.search
);

const postId=
params.get("id")||
params.get("postId");

let currentUser=null;
let post=null;


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href=
"login.html?redirect="+
encodeURIComponent(
location.pathname+
location.search
);

return;

}

currentUser=user;

if(!postId){

showError(
"Post ID is missing."
);

return;

}

await loadPost();

});


/* =========================================
LOAD POST
========================================= */

async function loadPost(){

try{

const snap=
await getDoc(
doc(
db,
"posts",
postId
)
);

if(!snap.exists()){

showError(
"This post does not exist or has been removed."
);

return;

}

post={
id:snap.id,
...snap.data()
};

renderPost();

}catch(error){

console.error(
"Post loading error:",
error
);

showError(
"Unable to load this post."
);

}

}


/* =========================================
RENDER POST
========================================= */

function renderPost(){

const authorName=
post.authorName||
post.userName||
"Community Member";

const authorPhoto=
post.authorPhoto||
post.userPhoto||
post.photoURL||
"";

const postTitle=
post.title||
"Untitled Post";

const postContent=
post.content||
post.body||
"";

const postCategory=
post.category||
post.type||
"general";

const groupId=
post.groupId||
"";

const groupName=
post.groupName||
"Study Group";


author.textContent=
authorName;

title.textContent=
postTitle;

content.textContent=
postContent;

category.textContent=
formatCategory(postCategory);


if(authorPhoto){

avatar.innerHTML=
`<img
src="${escapeAttribute(authorPhoto)}"
alt="">`;

}else{

avatar.textContent=
getInitials(authorName);

}


meta.textContent=
authorName+
" • "+
formatDate(post.createdAt);


if(post.image){

postImage.src=
post.image;

postImage.style.display=
"block";

postImage.onerror=
()=>{

postImage.style.display=
"none";

};

}


/* =========================================
GROUP
========================================= */

if(groupId){

groupButton.style.display=
"inline-flex";

groupButton.textContent=
"👥 "+groupName;

groupButton.href=
"community-group.html?id="+
encodeURIComponent(groupId);

}


/* =========================================
PRIVATE CHAT
========================================= */

const authorId=
post.uid||
post.userId||
post.authorId||
"";

if(
authorId &&
authorId!==currentUser.uid
){

chatButton.href=
"private-chat.html?userId="+
encodeURIComponent(authorId);

}else{

chatButton.style.display=
"none";

}


/* =========================================
REPORT LINKS
========================================= */

reportPost.addEventListener(
"click",
()=>{

location.href=
"report-post.html?id="+
encodeURIComponent(postId);

});


if(authorId){

reportUser.addEventListener(
"click",
()=>{

location.href=
"report-user.html?userId="+
encodeURIComponent(authorId)+
"&postId="+
encodeURIComponent(postId);

});

}else{

reportUser.style.display=
"none";

}


/* =========================================
POST INFO
========================================= */

postInfo.innerHTML=`

<strong>Category:</strong>
${escapeHTML(
formatCategory(postCategory)
)}
<br>

<strong>Visibility:</strong>
${escapeHTML(
post.visibility||
"Public"
)}
<br>

<strong>Published:</strong>
${escapeHTML(
formatDate(post.createdAt)
)}

${
groupId
?
`
<br>
<strong>Group:</strong>
${escapeHTML(groupName)}
`
:
""
}

`;


loading.style.display=
"none";

contentArea.style.display=
"block";

}


/* =========================================
ERROR
========================================= */

function showError(text){

loading.className=
"empty";

loading.innerHTML=`

<div style="
font-size:25px;
margin-bottom:10px">

⚠️

</div>

<strong>
${escapeHTML(text)}
</strong>

<br><br>

<a
href="community.html"
class="btn primary">

← Back to Community

</a>

`;

contentArea.style.display=
"none";

}


/* =========================================
DATE
========================================= */

function getTime(value){

if(!value)
return 0;

if(
typeof value.toMillis==="function"
){

return value.toMillis();

}

if(value.seconds){

return value.seconds*1000;

}

const time=
new Date(value).getTime();

return Number.isNaN(time)
?0
:time;

}


function formatDate(value){

const time=
getTime(value);

if(!time)
return "Recently";

return new Intl.DateTimeFormat(
undefined,
{
dateStyle:"medium",
timeStyle:"short"
}
).format(
new Date(time)
);

}


/* =========================================
CATEGORY
========================================= */

function formatCategory(value){

return String(value||"general")
.replaceAll("-"," ")
.replace(/\b\w/g,
char=>char.toUpperCase()
);

}


/* =========================================
INITIALS
========================================= */

function getInitials(name){

return String(name)
.trim()
.split(/\s+/)
.slice(0,2)
.map(
x=>
x.charAt(0).toUpperCase()
)
.join("")||
"U";

}


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttribute(value){

return String(value)
.replaceAll("'","%27")
.replaceAll('"',"%22")
.replaceAll("&","%26");

}


/* =========================================
YEAR
========================================= */

document.getElementById("year")
.textContent=
new Date().getFullYear();

</script>

</body>
</html>
