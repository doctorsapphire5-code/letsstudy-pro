<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Post Likes | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="View people who liked a community post on Let'sStudy Pro."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
}

body{

  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);

}


/* =========================
   HEADER
========================= */

.topbar{

  height:64px;

  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);

}

.brand{

  display:flex;
  align-items:center;
  gap:10px;

  font-weight:800;

}

.brand-icon{

  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--primary);
  color:#fff;

}

.back-btn{

  border:0;

  padding:9px 13px;

  border-radius:10px;

  background:var(--soft);

  color:var(--text);

  font-weight:700;

  cursor:pointer;

}


/* =========================
   MAIN
========================= */

.container{

  width:100%;
  max-width:650px;

  margin:auto;

  padding:25px 15px 70px;

}

.heading{

  margin-bottom:18px;

}

.heading h1{

  font-size:26px;
  font-weight:850;

}

.heading p{

  margin-top:5px;

  color:var(--muted);

  font-size:13px;

}


/* =========================
   USER CARD
========================= */

.like-card{

  display:flex;

  align-items:center;

  gap:12px;

  padding:14px;

  margin-bottom:9px;

  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:14px;

}

.avatar{

  width:46px;
  height:46px;

  border-radius:50%;

  overflow:hidden;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-shrink:0;

  background:var(--soft);

  font-size:13px;
  font-weight:800;

}

.avatar img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.user-info{

  min-width:0;

  flex:1;

}

.user-name{

  font-size:13px;
  font-weight:800;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}

.like-date{

  margin-top:4px;

  color:var(--muted);

  font-size:10px;

}

.like-icon{

  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#fef2f2;

}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  padding:45px 10px;

  color:var(--muted);

}

.spinner{

  width:31px;
  height:31px;

  margin:
    0 auto
    11px;

  border:
    3px solid var(--border);

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   EMPTY
========================= */

.empty{

  text-align:center;

  padding:50px 20px;

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:16px;

  color:var(--muted);

}

.empty-icon{

  font-size:38px;

  margin-bottom:9px;

}

.empty h3{

  color:var(--text);

  margin-bottom:5px;

}


/* =========================
   ERROR
========================= */

.error{

  display:none;

  margin-bottom:15px;

  padding:12px;

  border-radius:10px;

  background:#fef2f2;

  border:
    1px solid #fecaca;

  color:#b91c1c;

  font-size:12px;

}

.error.show{

  display:block;

}


/* =========================
   LOAD MORE
========================= */

.load-more{

  display:block;

  margin:18px auto;

  border:0;

  border-radius:10px;

  padding:10px 18px;

  background:var(--primary);

  color:#fff;

  font-size:12px;

  font-weight:750;

  cursor:pointer;

}

.load-more:disabled{

  opacity:.5;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{

    padding:0 12px;

  }

  .brand{

    font-size:13px;

  }

  .container{

    padding:
      20px 11px 60px;

  }

  .heading h1{

    font-size:23px;

  }

}

</style>

</head>


<body>


<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      ❤️
    </div>

    <span>
      Let'sStudy Pro Community
    </span>

  </div>


  <button
    class="back-btn"
    type="button"
    onclick="goBack()"
  >
    ← Back
  </button>

</header>


<main class="container">


  <section class="heading">

    <h1>
      People who liked this post
    </h1>

    <p id="subtitle">
      Loading likes...
    </p>

  </section>


  <div
    id="errorBox"
    class="error"
  ></div>


  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <p>
      Loading likes...
    </p>

  </div>


  <section id="likes"></section>


  <div
    id="empty"
    class="empty"
    style="display:none"
  >

    <div class="empty-icon">
      🤍
    </div>

    <h3>
      No likes yet
    </h3>

    <p>
      No one has liked this post yet.
    </p>

  </div>


  <button
    id="loadMore"
    class="load-more"
    type="button"
    style="display:none"
  >
    Load More
  </button>


</main>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};

firebase.initializeApp(
  firebaseConfig
);

const db =
  firebase.firestore();


/* =========================
   URL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const postId =
  params.get("postId") ||
  params.get("id");


/* =========================
   STATE
========================= */

let lastDocument =
  null;

const PAGE_SIZE =
  30;


/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function initials(
  name
){

  return String(
    name ||
    "User"
  )
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(
    word =>
      word
        .charAt(0)
        .toUpperCase()
  )
  .join("");

}


function formatDate(
  timestamp
){

  if(!timestamp){

    return "Recently";

  }

  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);


    return date.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

  }

  catch{

    return "Recently";

  }

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent =
    message;


  box.classList.add(
    "show"
  );

}


/* =========================
   LOAD LIKES
========================= */

async function loadLikes(
  append = false
){

  const loading =
    document.getElementById(
      "loading"
    );


  try{

    if(!append){

      loading.style.display =
        "block";

    }


    let query =
      db
        .collection("postLikes")
        .where(
          "postId",
          "==",
          postId
        )
        .orderBy(
          "createdAt",
          "desc"
        )
        .limit(
          PAGE_SIZE
        );


    if(
      append &&
      lastDocument
    ){

      query =
        query.startAfter(
          lastDocument
        );

    }


    const snapshot =
      await query.get();


    loading.style.display =
      "none";


    if(
      snapshot.empty &&
      !append
    ){

      document.getElementById(
        "empty"
      ).style.display =
        "block";


      document.getElementById(
        "subtitle"
      ).textContent =
        "0 people liked this post.";

      return;

    }


    if(
      !snapshot.empty
    ){

      lastDocument =
        snapshot.docs[
          snapshot.docs.length - 1
        ];

    }


    /*
     * postLikes only stores:
     *
     * postId
     * userId
     * createdAt
     *
     * Therefore user profile information
     * is loaded from users/{userId}.
     */

    for(
      const likeDoc of snapshot.docs
    ){

      const likeData =
        likeDoc.data();


      await renderLike(
        likeDoc.id,
        likeData
      );

    }


    const total =
      document.querySelectorAll(
        ".like-card"
      ).length;


    document.getElementById(
      "subtitle"
    ).textContent =
      `${total} ${
        total === 1
          ? "person has"
          : "people have"
      } liked this post.`;


    if(
      snapshot.size <
      PAGE_SIZE
    ){

      document.getElementById(
        "loadMore"
      ).style.display =
        "none";

    }

    else{

      document.getElementById(
        "loadMore"
      ).style.display =
        "block";

    }

  }

  catch(error){

    console.error(
      "Load likes error:",
      error
    );


    loading.style.display =
      "none";


    showError(
      "Unable to load post likes. A Firestore index may be required."
    );

  }

}


/* =========================
   RENDER LIKE
========================= */

async function renderLike(
  likeId,
  data
){

  const container =
    document.getElementById(
      "likes"
    );


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "like-card";


  let userData =
    {};


  try{

    const userSnapshot =
      await db
        .collection("users")
        .doc(data.userId)
        .get();


    if(
      userSnapshot.exists
    ){

      userData =
        userSnapshot.data();

    }

  }

  catch(error){

    console.error(
      "User lookup error:",
      error
    );

  }


  const name =
    userData.displayName ||
    userData.username ||
    "Community Member";


  const photo =
    userData.photoURL ||
    "";


  const avatar =
    photo

      ? `
        <img
          src="${escapeHTML(photo)}"
          alt="${escapeHTML(name)}"
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      `

      : initials(name);


  card.innerHTML =
    `

      <div class="avatar">
        ${avatar}
      </div>


      <div class="user-info">

        <div class="user-name">
          ${escapeHTML(name)}
        </div>

        <div class="like-date">
          Liked on
          ${formatDate(
            data.createdAt
          )}
        </div>

      </div>


      <div class="like-icon">
        ❤️
      </div>

    `;


  container.appendChild(
    card
  );

}


/* =========================
   LOAD MORE
========================= */

document
  .getElementById(
    "loadMore"
  )
  .addEventListener(
    "click",
    async () => {

      const button =
        document.getElementById(
          "loadMore"
        );


      button.disabled =
        true;


      button.textContent =
        "Loading...";


      try{

        await loadLikes(
          true
        );

      }

      catch(error){

        console.error(
          "Load more error:",
          error
        );

      }

      finally{

        button.disabled =
          false;

        button.textContent =
          "Load More";

      }

    }
  );


/* =========================
   BACK
========================= */

function goBack(){

  if(
    document.referrer &&
    document.referrer
      .startsWith(
        window.location.origin
      )
  ){

    window.history.back();

  }

  else{

    window.location.href =
      "/community.html";

  }

}


/* =========================
   INITIALIZATION
========================= */

async function init(){

  if(!postId){

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    showError(
      "Missing post ID. Use post-likes-community.html?postId=POST_ID"
    );

    return;

  }


  await loadLikes();

}


init();

</script>

</body>

</html>
