<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Saved Post | Let'sStudy Pro Community</title>

<meta
  name="description"
  content="View community members who saved this post on Let'sStudy Pro."
>

<link
  rel="icon"
  href="/favicon.ico"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#111827;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
}


/* =========================
   HEADER
========================= */

.topbar{

  height:64px;

  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:blur(12px);

  border-bottom:
    1px solid var(--border);

}

.brand{

  display:flex;
  align-items:center;
  gap:10px;

  font-weight:800;

}

.brand-icon{

  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--primary);
  color:#fff;

}

.back-btn{

  border:0;

  padding:9px 13px;

  border-radius:10px;

  background:var(--soft);

  color:var(--text);

  font-weight:700;

  cursor:pointer;

}


/* =========================
   MAIN
========================= */

.container{

  width:100%;
  max-width:680px;

  margin:auto;

  padding:25px 15px 70px;

}

.heading{

  margin-bottom:18px;

}

.heading h1{

  font-size:27px;

  font-weight:850;

}

.heading p{

  margin-top:5px;

  color:var(--muted);

  font-size:13px;

}


/* =========================
   SUMMARY
========================= */

.summary{

  display:flex;
  align-items:center;

  gap:12px;

  padding:16px;

  margin-bottom:15px;

  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:16px;

}

.save-icon{

  width:44px;
  height:44px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:var(--soft);

  font-size:21px;

}

.summary strong{

  display:block;

  font-size:14px;

}

.summary span{

  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:11px;

}


/* =========================
   USER CARD
========================= */

.user{

  display:flex;

  align-items:center;

  gap:12px;

  padding:14px;

  margin-bottom:9px;

  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:15px;

}

.avatar{

  width:46px;
  height:46px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border-radius:50%;

  background:var(--soft);

  font-size:13px;

  font-weight:800;

}

.avatar img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.user-info{

  min-width:0;

  flex:1;

}

.user-name{

  font-size:13px;

  font-weight:800;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}

.user-meta{

  margin-top:3px;

  color:var(--muted);

  font-size:10px;

}

.save-date{

  color:var(--muted);

  font-size:10px;

  white-space:nowrap;

}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  padding:45px 15px;

  color:var(--muted);

}

.spinner{

  width:31px;
  height:31px;

  margin:
    0 auto
    10px;

  border:
    3px solid var(--border);

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   EMPTY
========================= */

.empty{

  text-align:center;

  padding:50px 20px;

  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:16px;

  color:var(--muted);

}

.empty-icon{

  font-size:40px;

  margin-bottom:10px;

}

.empty h3{

  color:var(--text);

  margin-bottom:5px;

  font-size:16px;

}


/* =========================
   ERROR
========================= */

.error{

  display:none;

  padding:12px;

  margin-bottom:15px;

  border-radius:10px;

  background:#fef2f2;

  border:
    1px solid #fecaca;

  color:#b91c1c;

  font-size:12px;

}

.error.show{

  display:block;

}


/* =========================
   LOAD MORE
========================= */

.load-more{

  display:block;

  margin:18px auto;

  padding:10px 18px;

  border:0;

  border-radius:10px;

  background:var(--primary);

  color:#fff;

  font-size:12px;

  font-weight:750;

  cursor:pointer;

}

.load-more:disabled{

  opacity:.5;

  cursor:not-allowed;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{

    padding:0 12px;

  }

  .brand{

    font-size:13px;

  }

  .container{

    padding:
      20px 11px 60px;

  }

  .heading h1{

    font-size:23px;

  }

  .save-date{

    display:none;

  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      🔖
    </div>

    <span>
      Let'sStudy Pro Community
    </span>

  </div>


  <button
    class="back-btn"
    type="button"
    onclick="goBack()"
  >
    ← Back
  </button>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


  <section class="heading">

    <h1>
      Saved Post
    </h1>

    <p>
      Community members who saved
      this post.
    </p>

  </section>


  <div
    id="errorBox"
    class="error"
  ></div>


  <!-- SUMMARY -->

  <section class="summary">

    <div class="save-icon">
      🔖
    </div>

    <div>

      <strong id="saveCount">
        0 Saves
      </strong>

      <span>
        People who saved this post
      </span>

    </div>

  </section>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <p>
      Loading saved users...
    </p>

  </div>


  <!-- USERS -->

  <section
    id="users"
  ></section>


  <!-- EMPTY -->

  <section
    id="empty"
    class="empty"
    style="display:none"
  >

    <div class="empty-icon">
      🔖
    </div>

    <h3>
      No saves yet
    </h3>

    <p>
      Nobody has saved this post yet.
    </p>

  </section>


  <!-- LOAD MORE -->

  <button
    id="loadMore"
    class="load-more"
    type="button"
    style="display:none"
  >
    Load More
  </button>


</main>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();


/* =========================
   URL PARAMETERS
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const postId =
  params.get("postId") ||
  params.get("id");


/* =========================
   STATE
========================= */

let lastDocument =
  null;


const PAGE_SIZE =
  30;


/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function getInitials(
  name
){

  return String(
    name ||
    "Member"
  )
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(
    word =>
      word
        .charAt(0)
        .toUpperCase()
  )
  .join("");

}


function formatDate(
  timestamp
){

  if(!timestamp){

    return "Recently";

  }


  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);


    return date.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

  }

  catch{

    return "Recently";

  }

}


/* =========================
   ERROR
========================= */

function showError(
  message
){

  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent =
    message;


  box.classList.add(
    "show"
  );

}


/* =========================
   LOAD POST SAVE COUNT
========================= */

async function loadSaveCount(){

  if(!postId){

    return;

  }


  try{

    const snapshot =
      await db
        .collection("posts")
        .doc(postId)
        .get();


    if(snapshot.exists){

      const data =
        snapshot.data();


      const count =
        Number(
          data.saveCount || 0
        );


      document.getElementById(
        "saveCount"
      ).textContent =
        `${count} ${
          count === 1
            ? "Save"
            : "Saves"
        }`;

    }

  }

  catch(error){

    console.error(
      "Save count error:",
      error
    );

  }

}


/* =========================
   LOAD SAVES
========================= */

async function loadSaves(
  append = false
){

  const loading =
    document.getElementById(
      "loading"
    );


  try{

    if(!append){

      loading.style.display =
        "block";

    }


    let query =
      db
        .collection("postSaves")
        .where(
          "postId",
          "==",
          postId
        )
        .orderBy(
          "createdAt",
          "desc"
        )
        .limit(
          PAGE_SIZE
        );


    if(
      append &&
      lastDocument
    ){

      query =
        query.startAfter(
          lastDocument
        );

    }


    const snapshot =
      await query.get();


    loading.style.display =
      "none";


    if(
      snapshot.empty &&
      !append
    ){

      document.getElementById(
        "empty"
      ).style.display =
        "block";

      return;

    }


    if(
      !snapshot.empty
    ){

      lastDocument =
        snapshot.docs[
          snapshot.docs.length - 1
        ];

    }


    for(
      const doc of snapshot.docs
    ){

      await renderSave(
        doc.data()
      );

    }


    if(
      snapshot.size <
      PAGE_SIZE
    ){

      document.getElementById(
        "loadMore"
      ).style.display =
        "none";

    }

    else{

      document.getElementById(
        "loadMore"
      ).style.display =
        "block";

    }

  }

  catch(error){

    console.error(
      "Load saves error:",
      error
    );


    loading.style.display =
      "none";


    showError(
      "Unable to load saved users. Firestore may require a composite index."
    );

  }

}


/* =========================
   RENDER SAVE
========================= */

async function renderSave(
  data
){

  const users =
    document.getElementById(
      "users"
    );


  let displayName =
    "Community Member";


  let photoURL =
    "";


  try{

    if(data.userId){

      const snapshot =
        await db
          .collection("users")
          .doc(data.userId)
          .get();


      if(snapshot.exists){

        const user =
          snapshot.data();


        displayName =
          user.displayName ||
          user.username ||
          "Community Member";


        photoURL =
          user.photoURL ||
          "";

      }

    }

  }

  catch(error){

    console.error(
      "User lookup error:",
      error
    );

  }


  const element =
    document.createElement(
      "article"
    );


  element.className =
    "user";


  const avatar =
    photoURL

      ? `
        <img
          src="${escapeHTML(
            photoURL
          )}"
          alt="${escapeHTML(
            displayName
          )}"
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      `

      : getInitials(
          displayName
        );


  element.innerHTML =
    `
      <div class="avatar">

        ${avatar}

      </div>


      <div class="user-info">

        <div class="user-name">

          ${escapeHTML(
            displayName
          )}

        </div>


        <div class="user-meta">

          Community member

        </div>

      </div>


      <div class="save-date">

        ${formatDate(
          data.createdAt
        )}

      </div>
    `;


  users.appendChild(
    element
  );

}


/* =========================
   LOAD MORE
========================= */

document
  .getElementById(
    "loadMore"
  )
  .addEventListener(
    "click",
    async () => {

      const button =
        document.getElementById(
          "loadMore"
        );


      button.disabled =
        true;


      button.textContent =
        "Loading...";


      try{

        await loadSaves(
          true
        );

      }

      catch(error){

        console.error(
          "Load more error:",
          error
        );

      }

      finally{

        button.disabled =
          false;

        button.textContent =
          "Load More";

      }

    }
  );


/* =========================
   BACK
========================= */

function goBack(){

  if(
    document.referrer &&
    document.referrer.startsWith(
      window.location.origin
    )
  ){

    window.history.back();

  }

  else{

    window.location.href =
      "/community.html";

  }

}


/* =========================
   INITIALIZATION
========================= */

async function init(){

  if(!postId){

    document.getElementById(
      "loading"
    ).style.display =
      "none";

    showError(
      "Missing post ID. Use post-saves-community.html?postId=POST_ID"
    );

    return;

  }


  await loadSaveCount();

  await loadSaves();

}


init();


/* =========================
   GLOBAL ERROR
========================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled community error:",
      event.reason
    );

  }
);

</script>

</body>

</html>
