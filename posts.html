<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8;--heart:#e11d48}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a;--heart:#fb7185}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(700px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 10px}
.lead{font-size:18px;color:var(--muted);margin:0 0 24px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:22px}
.box textarea,.box input,.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.search{background:var(--paper);margin-bottom:12px}
.box textarea{min-height:96px;resize:vertical}
.box input{margin-top:10px}
.box textarea:focus,.box input:focus,.search:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.row small{color:var(--muted)}
.btn{border:0;background:var(--p);color:#fff;padding:10px 20px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.back{display:inline-block;margin-bottom:14px;font-weight:600;font-size:14px;text-decoration:none}
.post{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.top{display:flex;align-items:center;gap:12px}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800}
.who b{display:block;color:var(--ink);line-height:1.3;overflow-wrap:anywhere}
.who span{font-size:13px;color:var(--muted)}
.tx{margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--p);cursor:pointer}
.img{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block;margin-top:12px}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.ab{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;text-decoration:none}
.ab:hover{background:var(--soft);color:var(--ink)}
.ab.on{color:var(--heart)}
.ab.on.sv{color:var(--p)}
.sp{margin-left:auto}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.more2{display:block;margin:20px auto 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.post{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="wrap">
  <h1>Posts</h1>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteDoc,updateDoc,writeBatch,increment,query,where,orderBy,limit}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const listEl=$("#list"),COL="posts",PAGE=15;
const single=(new URLSearchParams(location.search).get("postId")||"").trim();
const N=new Intl.NumberFormat(undefined,{notation:"compact",maximumFractionDigits:1});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const num=v=>Number(v)||0;
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}

let user=null,view="feed",shown=PAGE,feed=null,saved=null,mine=null;
const likes=new Map(),saves=new Map(); /* postId -> id of my postLikes / postSaves doc */
const newest=(a,b)=>(toD(b.createdAt)||0)-(toD(a.createdAt)||0);
const all=()=>[...(feed||[]),...(saved||[]),...(mine||[])];

function card(p){
  const x=toD(p.createdAt),own=user&&p.userId===user.uid,img=safe(p.image),liked=likes.has(p.id),sv=saves.has(p.id);
  const name=p.author||"Member",long=String(p.text||"").length>400;
  return `<article class="post" id="p-${esc(p.id)}">
    <div class="top"><div class="av" aria-hidden="true">${esc(name.trim()[0]?.toUpperCase()||"M")}</div>
      <div class="who"><b>${esc(name)}</b>${x?`<span><time datetime="${x.toISOString()}" title="${esc(x.toLocaleString())}">${esc(ago(x))}</time></span>`:""}</div></div>
    ${p.text?`<p class="tx${long?" clamp":""}">${esc(p.text)}</p>${long?`<button class="more" type="button" data-more="1">Read more</button>`:""}`:""}
    ${img?`<img class="img" src="${esc(img)}" alt="" loading="lazy">`:""}
    <div class="act">
      <button class="ab${liked?" on":""}" type="button" data-like="${esc(p.id)}" aria-pressed="${liked}">${liked?"Liked":"Like"} · ${N.format(num(p.likes))}</button>
      <a class="ab" href="comments.html?postId=${encodeURIComponent(p.id)}&back=${encodeURIComponent("posts.html?postId="+p.id)}">Comments</a>
      <button class="ab sv${sv?" on":""}" type="button" data-save="${esc(p.id)}" aria-pressed="${sv}">${sv?"Saved":"Save"}</button>
      <span class="sp"><button class="ab" type="button" data-share="${esc(p.id)}">Share</button>${own?`<button class="ab" type="button" data-del="${esc(p.id)}">Delete</button>`:""}</span>
    </div></article>`;
}

function render(){
  const src={feed,saved,mine}[view]||[],q=$("#search").value.toLowerCase().trim();
  const items=src.filter(p=>!q||[p.text,p.author].join(" ").toLowerCase().includes(q));
  listEl.innerHTML=items.length
    ?items.slice(0,shown).map(card).join("")+(items.length>shown?`<button class="btn alt more2" id="more2" type="button">Show more (${items.length-shown})</button>`:"")
    :`<div class="state"><h2>${src.length?"No matches":view==="saved"?"Nothing saved yet":view==="mine"?"You have not posted yet":"No posts yet"}</h2><p>${src.length?"Try a different search.":view==="saved"?"Tap Save on a post to keep it here.":view==="mine"?"Share something with the community above.":"Be the first to share something."}</p></div>`;
}

/* ---- composer ---- */
function composer(){
  $("#composer").innerHTML=!user?`<div class="state" style="margin-bottom:22px"><h2>Join the conversation</h2><p>Sign in to post, like and save.</p><a class="btn" href="login.html">Sign in</a></div>`
    :`<div class="box"><textarea id="pt" maxlength="2000" placeholder="What are you learning today?" aria-label="Post text"></textarea>
      <input id="pi" type="url" placeholder="Image URL (optional)" aria-label="Image URL">
      <div class="row"><small>Be respectful and keep it relevant.</small><button class="btn" id="pgo" type="button">Post</button></div></div>`;
}
$("#composer").addEventListener("click",async e=>{
  const b=e.target.closest("#pgo");if(!b)return;
  const text=$("#pt").value.trim(),img=$("#pi").value.trim();
  if(!text&&!img){toast("Write something first");return}
  if(img&&!safe(img)){toast("Image URL must start with https://");return}
  b.disabled=true;
  try{
    const ref=doc(collection(db,COL));
    const data={author:user.displayName||(user.email||"").split("@")[0]||"Member",image:img,userId:user.uid,likes:0,text,createdAt:new Date().toISOString()};
    await setDoc(ref,data);
    const p={id:ref.id,...data};
    feed=[p,...(feed||[])];if(mine)mine=[p,...mine];
    $("#pt").value="";$("#pi").value="";
    if(view==="feed"||view==="mine")render();toast("Posted");
  }catch(err){console.error(err);toast("Could not publish your post")}
  b.disabled=false;
});

/* ---- likes, saves, share, delete ---- */
async function toggle(kind,id){
  if(!user){location.href="login.html";return}
  const map=kind==="like"?likes:saves,col=kind==="like"?"postLikes":"postSaves",was=map.has(id),docId=map.get(id)||`${id}_${user.uid}`;
  const p=all().find(x=>x.id===id),prev=p?num(p.likes):0;
  if(was)map.delete(id);else map.set(id,docId);
  if(kind==="like"&&p)all().filter(x=>x.id===id).forEach(x=>x.likes=Math.max(0,prev+(was?-1:1)));
  render();
  try{
    const b=writeBatch(db),ref=doc(db,col,docId);
    if(was)b.delete(ref);else b.set(ref,{createdAt:new Date().toISOString(),postId:id,userId:user.uid});
    if(kind==="like")b.update(doc(db,COL,id),{likes:increment(was?-1:1)});
    await b.commit();
    if(kind==="save"&&was&&saved){saved=saved.filter(x=>x.id!==id);render()}
  }catch(err){
    console.error(err);toast("Something went wrong. Please try again.");
    if(was)map.set(id,docId);else map.delete(id);
    all().filter(x=>x.id===id).forEach(x=>x.likes=prev);render();
  }
}
listEl.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("#more2")){shown+=PAGE;render();return}
  const m=t.closest("[data-more]");
  if(m){const c=m.previousElementSibling.classList.toggle("clamp");m.textContent=c?"Read more":"Show less";return}
  const l=t.closest("[data-like]");if(l)return toggle("like",l.dataset.like);
  const s=t.closest("[data-save]");if(s)return toggle("save",s.dataset.save);
  const sh=t.closest("[data-share]");
  if(sh){
    const url=`${location.origin}/posts.html?postId=${encodeURIComponent(sh.dataset.share)}`;
    try{if(navigator.share)await navigator.share({title:"LetsStudy Pro",url});else{await navigator.clipboard.writeText(url);toast("Link copied")}}catch{}
    return;
  }
  const d=t.closest("[data-del]");
  if(d&&confirm("Delete this post?")){
    try{
      await deleteDoc(doc(db,COL,d.dataset.del));
      for(const k of ["feed","saved","mine"]){const v={feed,saved,mine}[k];if(v){const n=v.filter(x=>x.id!==d.dataset.del);if(k==="feed")feed=n;else if(k==="saved")saved=n;else mine=n}}
      render();toast("Post deleted");
    }catch(err){console.error(err);toast("Could not delete the post")}
  }
});

/* ---- data ---- */
function fail(err){
  console.error(err);
  const denied=err&&err.code==="permission-denied"&&!user;
  listEl.innerHTML=denied
    ?`<div class="state"><h2>Sign in to view posts</h2><a class="btn" href="login.html">Sign in</a></div>`
    :`<div class="state err"><h2>Unable to load posts</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry")?.addEventListener("click",()=>load(true));
}
async function myMarks(){
  likes.clear();saves.clear();
  if(!user)return;
  const f=async(col,map)=>{try{(await getDocs(query(collection(db,col),where("userId","==",user.uid)))).docs.forEach(d=>map.set(d.data().postId,d.id))}catch(e){console.warn(e)}};
  await Promise.all([f("postLikes",likes),f("postSaves",saves)]);
}
async function load(force){
  try{
    if(single){
      const s=await getDoc(doc(db,COL,single));
      feed=s.exists()?[{id:s.id,...s.data()}]:[];
    }else if(view==="feed"&&(!feed||force)){
      const col=collection(db,COL);
      let snap;
      try{snap=await getDocs(query(col,orderBy("createdAt","desc"),limit(60)))}catch{snap=await getDocs(query(col,limit(60)))}
      if(snap.empty&&!force)snap=await getDocs(query(col,limit(60)));
      feed=snap.docs.map(d=>({id:d.id,...d.data()})).sort(newest);
    }else if(view==="mine"&&(!mine||force)){
      if(!user){listEl.innerHTML=`<div class="state"><h2>Sign in to see your posts</h2><a class="btn" href="login.html">Sign in</a></div>`;return}
      mine=(await getDocs(query(collection(db,COL),where("userId","==",user.uid)))).docs.map(d=>({id:d.id,...d.data()})).sort(newest);
    }else if(view==="saved"&&(!saved||force)){
      if(!user){listEl.innerHTML=`<div class="state"><h2>Sign in to see saved posts</h2><a class="btn" href="login.html">Sign in</a></div>`;return}
      const ids=[...saves.keys()].slice(0,60);
      saved=(await Promise.all(ids.map(async id=>{try{const s=await getDoc(doc(db,COL,id));return s.exists()?{id:s.id,...s.data()}:null}catch{return null}}))).filter(Boolean).sort(newest);
    }
  }catch(e){return fail(e)}
  render();
}

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  view=t.dataset.v;shown=PAGE;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  load();
}));
$("#search").addEventListener("input",()=>{shown=PAGE;render()});

$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,async u=>{
  user=u;saved=null;mine=null;
  await myMarks();
  composer();
  if(single){$("#tabs").hidden=true;$("#composer").hidden=true;$("#search").hidden=true;$("#back").hidden=false}
  await load();
});
