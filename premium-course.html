<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Premium Course | LetsStudy Pro</title>

<meta
  name="description"
  content="Learn premium courses with LetsStudy Pro."
>

<meta
  name="robots"
  content="index,follow"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* HEADER */

.header{
  background:#fff;
  border-bottom:1px solid #e6e9ef;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:23px;
  font-weight:800;
  color:#2563eb;
}

.logo span{
  color:#111827;
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 17px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-secondary{
  background:#eef2ff;
  color:#1d4ed8;
}

/* HERO */

.hero{
  background:linear-gradient(
    135deg,
    #172554,
    #1d4ed8
  );
  color:#fff;
  padding:55px 0;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:40px;
  align-items:center;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:6px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.15);
  font-size:13px;
  font-weight:700;
}

.badge.featured{
  background:#f59e0b;
  color:#111827;
}

.hero h1{
  font-size:clamp(30px,5vw,52px);
  line-height:1.12;
  margin-bottom:18px;
}

.hero-description{
  max-width:750px;
  color:#dbeafe;
  font-size:17px;
}

.hero-meta{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin-top:25px;
  color:#dbeafe;
  font-size:14px;
}

.hero-image{
  background:#fff;
  padding:8px;
  border-radius:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.hero-image img{
  display:block;
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  border-radius:12px;
}

/* CONTENT */

.main{
  padding:45px 0 70px;
}

.content-grid{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:30px;
  align-items:start;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(15,23,42,.05);
}

.card-header{
  padding:22px;
  border-bottom:1px solid #e5e7eb;
}

.card-header h2{
  font-size:22px;
}

.card-body{
  padding:22px;
}

/* COURSE INFO */

.info-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.info-item{
  background:#f8fafc;
  padding:16px;
  border-radius:12px;
}

.info-label{
  font-size:12px;
  color:#64748b;
  margin-bottom:4px;
}

.info-value{
  font-weight:700;
}

/* LESSONS */

.lessons{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.lesson{
  border:1px solid #e5e7eb;
  border-radius:13px;
  overflow:hidden;
  background:#fff;
}

.lesson-head{
  padding:17px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
}

.lesson-number{
  width:40px;
  height:40px;
  min-width:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#eff6ff;
  color:#2563eb;
  font-weight:800;
}

.lesson-main{
  flex:1;
}

.lesson-title{
  font-weight:800;
  margin-bottom:3px;
}

.lesson-sub{
  font-size:13px;
  color:#64748b;
}

.lesson-arrow{
  font-size:18px;
  color:#64748b;
}

.lesson-content{
  display:none;
  padding:0 17px 20px 71px;
  border-top:1px solid #e5e7eb;
}

.lesson.open .lesson-content{
  display:block;
}

.lesson-description{
  margin:17px 0;
  color:#475569;
}

.video-wrapper{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#0f172a;
  border-radius:12px;
  overflow:hidden;
}

.video-wrapper iframe,
.video-wrapper video{
  width:100%;
  height:100%;
  border:0;
}

.video-placeholder{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#cbd5e1;
  text-align:center;
  padding:20px;
}

.video-placeholder div{
  font-size:45px;
  margin-bottom:10px;
}

.lesson-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

/* SIDEBAR */

.enroll-card{
  position:sticky;
  top:90px;
}

.price{
  font-size:30px;
  font-weight:900;
  color:#2563eb;
}

.price.free{
  color:#16a34a;
}

.enroll-btn{
  width:100%;
  margin-top:18px;
  padding:14px;
  font-size:16px;
}

.side-list{
  margin-top:22px;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.side-item{
  display:flex;
  gap:10px;
  color:#475569;
  font-size:14px;
}

/* LOADING */

.loading{
  min-height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:15px;
}

.spinner{
  width:45px;
  height:45px;
  border:4px solid #dbeafe;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ERROR */

.error-box{
  width:min(650px,92%);
  margin:80px auto;
  text-align:center;
  background:#fff;
  border:1px solid #e5e7eb;
  padding:35px;
  border-radius:18px;
}

.error-icon{
  font-size:55px;
  margin-bottom:15px;
}

/* FOOTER */

.footer{
  background:#111827;
  color:#cbd5e1;
  padding:35px 0;
  text-align:center;
}

.footer strong{
  color:#fff;
}

/* RESPONSIVE */

@media(max-width:850px){

  .hero-grid,
  .content-grid{
    grid-template-columns:1fr;
  }

  .enroll-card{
    position:static;
  }

}

@media(max-width:600px){

  .nav{
    min-height:62px;
  }

  .logo{
    font-size:19px;
  }

  .nav-actions .btn{
    padding:9px 12px;
    font-size:13px;
  }

  .hero{
    padding:35px 0;
  }

  .hero h1{
    font-size:32px;
  }

  .info-list{
    grid-template-columns:1fr;
  }

  .lesson-content{
    padding-left:17px;
  }

}

</style>

</head>

<body>

<header class="header">

  <div class="container nav">

    <a
      href="index.html"
      class="logo"
    >
      LetsStudy <span>Pro</span>
    </a>

    <div class="nav-actions">

      <a
        href="premium.html"
        class="btn btn-secondary"
      >
        ← Premium
      </a>

      <a
        href="login.html"
        class="btn btn-primary"
        id="loginBtn"
      >
        Login
      </a>

    </div>

  </div>

</header>


<main id="app">

  <div class="loading">

    <div class="spinner"></div>

    <strong>
      Loading Premium Course...
    </strong>

  </div>

</main>


<footer class="footer">

  <div class="container">

    <strong>LetsStudy Pro</strong>

    <p>
      Learn. Grow. Build your future.
    </p>

  </div>

</footer>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const params =
  new URLSearchParams(
    window.location.search
  );


const courseId =
  params.get("courseId");


const appContainer =
  document.getElementById("app");


let currentCourse = null;


/* SECURITY */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* PRICE */

function formatPrice(course){

  const price =
    Number(course?.price || 0);

  const currency =
    course?.currency || "USD";

  if(price <= 0){

    return `
      <div class="price free">
        Free
      </div>
    `;

  }

  return `
    <div class="price">
      ${new Intl.NumberFormat(
        "en-US",
        {
          minimumFractionDigits:0,
          maximumFractionDigits:2
        }
      ).format(price)}
      ${escapeHTML(currency)}
    </div>
  `;

}


/* VIDEO URL */

function getVideoEmbed(url){

  if(!url){

    return null;

  }

  const value =
    String(url).trim();


  /* YouTube */

  let match =
    value.match(
      /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/
    );

  if(match){

    return `
      <iframe
        src="https://www.youtube.com/embed/${encodeURIComponent(match[1])}"
        title="Course lesson video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    `;

  }


  /* Vimeo */

  match =
    value.match(
      /vimeo\.com\/(\d+)/
    );

  if(match){

    return `
      <iframe
        src="https://player.vimeo.com/video/${encodeURIComponent(match[1])}"
        title="Course lesson video"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
    `;

  }


  return `
    <video
      controls
      preload="metadata"
    >
      <source
        src="${escapeHTML(value)}"
      >
      Your browser does not support video playback.
    </video>
  `;

}


/* LESSONS */

function normalizeLessons(lessons){

  if(!Array.isArray(lessons)){

    return [];

  }

  return lessons
    .map((lesson,index) => ({

      title:
        lesson?.title ||
        `Lesson ${index + 1}`,

      description:
        lesson?.description ||
        "",

      videoUrl:
        lesson?.videoUrl ||
        "",

      duration:
        lesson?.duration ||
        "",

      order:
        Number(
          lesson?.order ||
          index + 1
        ),

      status:
        lesson?.status ||
        "published"

    }))
    .sort(
      (a,b) =>
        a.order - b.order
    );

}


/* RENDER */

function renderCourse(course){

  const lessons =
    normalizeLessons(
      course.lessons
    );


  const thumbnail =
    course.thumbnail ||
    "https://via.placeholder.com/900x550?text=Premium+Course";


  appContainer.innerHTML = `

    <section class="hero">

      <div class="container hero-grid">

        <div>

          <div class="badges">

            <span class="badge">
              ${escapeHTML(
                course.category ||
                "Premium Course"
              )}
            </span>

            <span class="badge">
              ${escapeHTML(
                course.level ||
                "All Levels"
              )}
            </span>

            ${
              course.featured
                ? `
                  <span class="badge featured">
                    ⭐ Featured
                  </span>
                `
                : ""
            }

          </div>


          <h1>
            ${escapeHTML(
              course.title ||
              "Premium Course"
            )}
          </h1>


          <p class="hero-description">

            ${escapeHTML(
              course.description ||
              "Start learning with LetsStudy Pro."
            )}

          </p>


          <div class="hero-meta">

            <span>
              👨‍🏫
              ${escapeHTML(
                course.instructor ||
                "LetsStudy Pro"
              )}
            </span>

            <span>
              📚
              ${lessons.length}
              lessons
            </span>

            <span>
              ⏱️
              ${escapeHTML(
                course.duration ||
                "Self-paced"
              )}
            </span>

          </div>

        </div>


        <div class="hero-image">

          <img
            src="${escapeHTML(thumbnail)}"
            alt="${escapeHTML(course.title)}"
            onerror="this.src='https://via.placeholder.com/900x550?text=Premium+Course'"
          >

        </div>

      </div>

    </section>


    <section class="main">

      <div class="container content-grid">


        <div>


          <div class="card">

            <div class="card-header">

              <h2>
                About This Course
              </h2>

            </div>


            <div class="card-body">

              <div class="info-list">

                <div class="info-item">

                  <div class="info-label">
                    Instructor
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      course.instructor ||
                      "LetsStudy Pro"
                    )}
                  </div>

                </div>


                <div class="info-item">

                  <div class="info-label">
                    Category
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      course.category ||
                      "General"
                    )}
                  </div>

                </div>


                <div class="info-item">

                  <div class="info-label">
                    Level
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      course.level ||
                      "All Levels"
                    )}
                  </div>

                </div>


                <div class="info-item">

                  <div class="info-label">
                    Duration
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      course.duration ||
                      "Self-paced"
                    )}
                  </div>

                </div>

              </div>

            </div>

          </div>


          <br>


          <div class="card">

            <div class="card-header">

              <h2>
                Course Lessons
              </h2>

            </div>


            <div class="card-body">

              <div class="lessons">

                ${
                  lessons.length
                    ? lessons.map(
                        (lesson,index) =>
                          renderLesson(
                            lesson,
                            index
                          )
                      ).join("")
                    : `
                      <div class="error-box"
                           style="margin:0">

                        <div class="error-icon">
                          📚
                        </div>

                        <h3>
                          No lessons available yet
                        </h3>

                        <p>
                          Lessons will be added soon.
                        </p>

                      </div>
                    `
                }

              </div>

            </div>

          </div>

        </div>


        <aside>

          <div class="card enroll-card">

            <div class="card-body">

              ${formatPrice(course)}


              <button
                class="btn btn-primary enroll-btn"
                onclick="startLearning()"
              >
                🚀 Start Learning
              </button>


              <div class="side-list">

                <div class="side-item">
                  ✅ Premium learning content
                </div>

                <div class="side-item">
                  ✅ Self-paced learning
                </div>

                <div class="side-item">
                  ✅ Lesson-based curriculum
                </div>

                <div class="side-item">
                  ✅ Learn from any device
                </div>

              </div>

            </div>

          </div>

        </aside>


      </div>

    </section>

  `;

}


/* LESSON HTML */

function renderLesson(lesson,index){

  const video =
    getVideoEmbed(
      lesson.videoUrl
    );


  return `

    <article
      class="lesson"
      id="lesson-${index}"
    >

      <div
        class="lesson-head"
        onclick="toggleLesson(${index})"
      >

        <div class="lesson-number">
          ${index + 1}
        </div>


        <div class="lesson-main">

          <div class="lesson-title">
            ${escapeHTML(
              lesson.title
            )}
          </div>

          <div class="lesson-sub">

            ${
              lesson.duration
                ? "⏱️ " +
                  escapeHTML(
                    lesson.duration
                  )
                : "Lesson"
            }

          </div>

        </div>


        <div class="lesson-arrow">
          ›
        </div>

      </div>


      <div class="lesson-content">

        ${
          lesson.description
            ? `
              <p class="lesson-description">
                ${escapeHTML(
                  lesson.description
                )}
              </p>
            `
            : ""
        }


        <div class="video-wrapper">

          ${
            video
              ? video
              : `
                <div class="video-placeholder">

                  <div>
                    ▶️
                  </div>

                  <strong>
                    Video coming soon
                  </strong>

                  <small>
                    This lesson does not have a video yet.
                  </small>

                </div>
              `
          }

        </div>


        ${
          lesson.videoUrl
            ? `
              <div class="lesson-actions">

                <a
                  href="${escapeHTML(lesson.videoUrl)}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="btn btn-secondary"
                >
                  🔗 Open Video
                </a>

              </div>
            `
            : ""
        }

      </div>

    </article>

  `;

}


/* TOGGLE LESSON */

window.toggleLesson =
  function(index){

    const lesson =
      document.getElementById(
        `lesson-${index}`
      );

    if(!lesson){
      return;
    }

    lesson.classList.toggle(
      "open"
    );

  };


/* START LEARNING */

window.startLearning =
  function(){

    const firstLesson =
      document.querySelector(
        ".lesson"
      );

    if(firstLesson){

      firstLesson.classList.add(
        "open"
      );

      firstLesson.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

      return;

    }

    alert(
      "Lessons are not available yet."
    );

  };


/* LOAD COURSE */

async function loadCourse(){

  if(!courseId){

    showError(
      "Missing Course ID",
      "Please open a valid Premium Course."
    );

    return;

  }


  try{

    const courseRef =
      doc(
        db,
        "premiumCourses",
        courseId
      );


    const snapshot =
      await getDoc(
        courseRef
      );


    if(!snapshot.exists()){

      showError(
        "Course Not Found",
        "The Premium Course you requested does not exist."
      );

      return;

    }


    currentCourse = {

      id:
        snapshot.id,

      ...snapshot.data()

    };


    if(
      String(
        currentCourse.status ||
        "draft"
      ).toLowerCase()
      !== "published"
    ){

      showError(
        "Course Unavailable",
        "This Premium Course is not currently published."
      );

      return;
    }


    currentCourse = {
      id: snapshot.id,
      ...snapshot.data()
    };


    renderCourse(currentCourse);


  }catch(error){

    console.error(
      "Course loading error:",
      error
    );

    showError(
      "Unable to Load Course",
      "Something went wrong while loading this course. Please try again."
    );

  }

}


/* ERROR */

function showError(title, message){

  appContainer.innerHTML = `

    <div class="error-box">

      <div class="error-icon">
        ⚠️
      </div>

      <h2>
        ${escapeHTML(title)}
      </h2>

      <p style="margin:12px 0 22px;color:#64748b">
        ${escapeHTML(message)}
      </p>

      <a
        href="premium.html"
        class="btn btn-primary"
      >
        ← Back to Premium
      </a>

    </div>

  `;

}


/* AUTH UI */

onAuthStateChanged(
  auth,
  user => {

    const loginBtn =
      document.getElementById("loginBtn");

    if(!loginBtn){
      return;
    }


    if(user){

      loginBtn.textContent =
        "My Account";

      loginBtn.href =
        "profile.html";

    }else{

      loginBtn.textContent =
        "Login";

      loginBtn.href =
        "login.html";

    }

  }
);


/* CLOSE LESSON WHEN ANOTHER OPENS */

document.addEventListener(
  "click",
  event => {

    const clickedLesson =
      event.target.closest(".lesson");

    if(!clickedLesson){
      return;
    }

    document
      .querySelectorAll(".lesson.open")
      .forEach(lesson => {

        if(lesson !== clickedLesson){

          lesson.classList.remove(
            "open"
          );

        }

      });

  }
);


/* RUN */

loadCourse();

</script>

</body>
</html>
