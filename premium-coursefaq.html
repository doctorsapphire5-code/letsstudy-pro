<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Course FAQ | LetsStudy Pro</title>

<meta name="description"
content="Frequently asked questions about LetsStudy Pro Premium Courses.">

<meta name="robots" content="index,follow">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f8fc;
  color:#172033;
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

.header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  max-width:1100px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  color:#2563eb;
  font-size:21px;
  font-weight:800;
}

.nav-links{
  display:flex;
  gap:8px;
}

.nav-links a{
  padding:8px 12px;
  border-radius:8px;
  color:#475569;
}

.nav-links a:hover{
  background:#eff6ff;
  color:#2563eb;
}

.hero{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:#fff;
  padding:55px 20px;
}

.hero-inner{
  max-width:1100px;
  margin:auto;
  text-align:center;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  color:#dbeafe;
  max-width:700px;
  margin:auto;
}

.container{
  max-width:900px;
  margin:35px auto;
  padding:0 20px;
}

.course-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
  margin-bottom:25px;
  display:flex;
  align-items:center;
  gap:18px;
}

.course-thumb{
  width:100px;
  height:70px;
  border-radius:10px;
  object-fit:cover;
  background:#e2e8f0;
}

.course-name{
  font-size:20px;
  font-weight:800;
}

.course-meta{
  color:#64748b;
  font-size:14px;
}

.search{
  margin-bottom:20px;
}

.search input{
  width:100%;
  padding:14px 16px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  background:#fff;
}

.search input:focus{
  border-color:#2563eb;
}

.faq{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
}

.faq-question{
  width:100%;
  border:0;
  background:#fff;
  padding:18px 20px;
  text-align:left;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  font-size:16px;
  font-weight:700;
  color:#172033;
}

.faq-question:hover{
  background:#f8fafc;
}

.icon{
  color:#2563eb;
  font-size:22px;
  transition:.2s;
}

.faq-answer{
  display:none;
  padding:0 20px 20px;
  color:#64748b;
}

.faq.open .faq-answer{
  display:block;
}

.faq.open .icon{
  transform:rotate(45deg);
}

.empty{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:45px 20px;
  text-align:center;
  color:#64748b;
}

.back{
  display:inline-block;
  margin-top:25px;
  background:#2563eb;
  color:#fff;
  padding:11px 17px;
  border-radius:9px;
  font-weight:700;
}

.back:hover{
  background:#1d4ed8;
}

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.94);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.spinner{
  width:45px;
  height:45px;
  border:4px solid #dbeafe;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:#fff;
  padding:13px 17px;
  border-radius:10px;
  display:none;
  z-index:1000;
}

.footer{
  margin-top:50px;
  padding:30px 20px;
  background:#111827;
  color:#cbd5e1;
  text-align:center;
}

@media(max-width:600px){

  .nav-links a{
    display:none;
  }

  .hero h1{
    font-size:29px;
  }

  .course-card{
    align-items:flex-start;
  }

  .course-thumb{
    width:80px;
    height:60px;
  }

}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
</div>

<header class="header">

  <nav class="nav">

    <a href="index.html" class="logo">
      LetsStudy Pro
    </a>

    <div class="nav-links">

      <a href="courses.html">
        Courses
      </a>

      <a href="premium.html">
        Premium
      </a>

      <a href="premium-lessons.html"
         id="lessonsLink">
        Lessons
      </a>

    </div>

  </nav>

</header>


<section class="hero">

  <div class="hero-inner">

    <h1>
      Frequently Asked Questions
    </h1>

    <p id="heroDescription">
      Find answers to common questions about this
      premium course.
    </p>

  </div>

</section>


<main class="container">

  <div
    class="course-card"
    id="courseCard">

    <img
      id="courseThumbnail"
      class="course-thumb"
      src="https://via.placeholder.com/300x200?text=Course"
      alt="Course">

    <div>

      <div
        class="course-name"
        id="courseName">
        Loading course...
      </div>

      <div
        class="course-meta"
        id="courseMeta">
        Please wait...
      </div>

    </div>

  </div>


  <div class="search">

    <input
      type="search"
      id="faqSearch"
      placeholder="Search frequently asked questions...">

  </div>


  <section id="faqList">

    <div class="empty">
      Loading FAQs...
    </div>

  </section>


  <div style="text-align:center;">

    <a
      href="premium-lessons.html"
      id="backLessons"
      class="back">
      ← Back to Lessons
    </a>

  </div>

</main>


<footer class="footer">

  © <span id="year"></span>
  LetsStudy Pro. All rights reserved.

</footer>


<div
  class="toast"
  id="toast">
</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   STATE
========================= */

let courseId = null;

let course = null;

let faqs = [];


/* =========================
   HELPERS
========================= */

const $ =
  id => document.getElementById(id);


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function hideLoading(){

  $("loading").style.display =
    "none";

}


function showToast(message){

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  setTimeout(() => {

    toast.style.display =
      "none";

  },3000);

}


/* =========================
   GET COURSE ID
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

courseId =
  params.get("courseId");


/* =========================
   LOAD COURSE
========================= */

async function loadCourse(){

  if(!courseId){

    $("courseName").textContent =
      "Course Not Selected";

    $("courseMeta").textContent =
      "No course ID was provided.";

    return;

  }


  try{

    const courseRef =
      doc(
        db,
        "premiumCourses",
        courseId
      );


    const snapshot =
      await getDoc(courseRef);


    if(!snapshot.exists()){

      $("courseName").textContent =
        "Course Not Found";

      $("courseMeta").textContent =
        "The requested course does not exist.";

      return;

    }


    course = {

      id:snapshot.id,

      ...snapshot.data()

    };


    const title =
      course.title ||
      "Premium Course";


    const instructor =
      course.instructor ||
      "LetsStudy Pro";


    const category =
      course.category ||
      "General";


    document.title =
      `${title} FAQ | LetsStudy Pro`;


    $("courseName").textContent =
      title;


    $("courseMeta").textContent =
      `${category} • Instructor: ${instructor}`;


    $("heroDescription").textContent =
      `Frequently asked questions about ${title}.`;


    if(course.thumbnail){

      $("courseThumbnail").src =
        course.thumbnail;

    }


    $("courseThumbnail").alt =
      title;


    $("lessonsLink").href =
      `premium-lessons.html?courseId=${encodeURIComponent(courseId)}`;


    $("backLessons").href =
      `premium-lessons.html?courseId=${encodeURIComponent(courseId)}`;


  }catch(error){

    console.error(
      "Course error:",
      error
    );

    showToast(
      "Unable to load course"
    );

  }

}


/* =========================
   LOAD FAQ
========================= */

async function loadFaqs(){

  if(!courseId){

    $("faqList").innerHTML = `

      <div class="empty">

        Please select a valid course
        to view its FAQs.

      </div>

    `;

    return;

  }


  try{

    let snapshot;


    try{

      const faqQuery =
        query(

          collection(
            db,
            "premiumCourseFAQs"
          ),

          where(
            "courseId",
            "==",
            courseId
          )

        );


      snapshot =
        await getDocs(
          faqQuery
        );

    }catch(error){

      console.warn(
        "Filtered FAQ query failed:",
        error
      );


      /*
        Fallback:
        Load all FAQs and filter
        on the client side.
      */

      const allSnapshot =
        await getDocs(
          collection(
            db,
            "premiumCourseFAQs"
          )
        );


      const filteredDocs =
        allSnapshot.docs.filter(
          item =>
            item.data().courseId ===
            courseId
        );


      faqs =
        filteredDocs.map(
          item => ({

            id:item.id,

            ...item.data()

          })
        );


      sortFaqs();

      renderFaqs();

      return;

    }


    faqs =
      snapshot.docs.map(
        item => ({

          id:item.id,

          ...item.data()

        })
      );


    sortFaqs();

    renderFaqs();


  }catch(error){

    console.error(
      "FAQ error:",
      error
    );


    $("faqList").innerHTML = `

      <div class="empty">

        Unable to load FAQs.
        Please try again later.

      </div>

    `;


    showToast(
      "Failed to load FAQs"
    );

  }

}


/* =========================
   SORT FAQ
========================= */

function sortFaqs(){

  faqs.sort(
    (a,b) =>
      Number(a.order || 999)
      -
      Number(b.order || 999)
  );

}


/* =========================
   RENDER FAQ
========================= */

function renderFaqs(){

  const search =
    $("faqSearch")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    faqs.filter(faq => {

      const status =
        String(
          faq.status || "published"
        ).toLowerCase();


      if(status !== "published"){
        return false;
      }


      const question =
        String(
          faq.question || ""
        ).toLowerCase();


      const answer =
        String(
          faq.answer || ""
        ).toLowerCase();


      return (

        !search ||

        question.includes(search) ||

        answer.includes(search)

      );

    });


  if(!filtered.length){

    $("faqList").innerHTML = `

      <div class="empty">

        ${
          search
            ? "No FAQ matches your search."
            : "No FAQs are available for this course yet."
        }

      </div>

    `;

    return;

  }


  $("faqList").innerHTML =
    filtered.map(
      (faq,index) => `

        <article class="faq">

          <button
            class="faq-question"
            type="button"
            onclick="toggleFaq(this)">

            <span>
              ${escapeHTML(
                faq.question ||
                `Question ${index + 1}`
              )}
            </span>

            <span class="icon">
              +
            </span>

          </button>


          <div class="faq-answer">

            ${escapeHTML(
              faq.answer || ""
            ).replace(
              /\n/g,
              "<br>"
            )}

          </div>

        </article>

      `
    ).join("");

}


/* =========================
   TOGGLE FAQ
========================= */

window.toggleFaq =
  function(button){

    const faq =
      button.closest(".faq");


    const wasOpen =
      faq.classList.contains(
        "open"
      );


    document
      .querySelectorAll(
        ".faq.open"
      )
      .forEach(item => {

        item.classList.remove(
          "open"
        );

      });


    document
      .querySelectorAll(
        ".faq .icon"
      )
      .forEach(icon => {

        icon.textContent =
          "+";

      });


    if(!wasOpen){

      faq.classList.add(
        "open"
      );

      button
        .querySelector(".icon")
        .textContent =
        "×";

    }

  };


/* =========================
   SEARCH
========================= */

$("faqSearch")
  .addEventListener(
    "input",
    renderFaqs
  );


/* =========================
   YEAR
========================= */

$("year").textContent =
  new Date().getFullYear();


/* =========================
   INIT
========================= */

async function init(){

  try{

    await loadCourse();

    await loadFaqs();

  }finally{

    hideLoading();

  }

}


init();

</script>

</body>
</html>
