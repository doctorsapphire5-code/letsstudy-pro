<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentation Templates</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f8fb;
    color:#172033;
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:17px;
    font-weight:900;
}

.logo{
    color:#7c3aed;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.btn{
    border:0;
    border-radius:8px;
    padding:9px 14px;
    cursor:pointer;
    font-size:12px;
    font-weight:800;
}

.btn:hover{
    opacity:.9;
}

.btn-primary{
    background:#7c3aed;
    color:#fff;
}

.btn-secondary{
    background:#f1f5f9;
    color:#334155;
}

.hero{
    padding:38px 24px 25px;
    text-align:center;
}

.hero h1{
    font-size:32px;
    margin-bottom:9px;
}

.hero p{
    color:#64748b;
    font-size:14px;
}

.controls{
    max-width:1100px;
    margin:0 auto 25px;
    padding:0 24px;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:230px;
    height:42px;
    border:1px solid #dbe2ea;
    border-radius:9px;
    background:#fff;
    padding:0 14px;
    outline:none;
}

.search:focus{
    border-color:#7c3aed;
}

.categories{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.category{
    border:1px solid #dbe2ea;
    background:#fff;
    color:#475569;
    border-radius:20px;
    padding:8px 13px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.category.active,
.category:hover{
    background:#ede9fe;
    color:#6d28d9;
    border-color:#c4b5fd;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:0 24px 50px;
}

.template-count{
    color:#64748b;
    font-size:12px;
    margin-bottom:14px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(245px,1fr));
    gap:18px;
}

.card{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:13px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:
        0 10px 25px rgba(15,23,42,.08);
}

.preview{
    height:145px;
    padding:13px;
    position:relative;
    overflow:hidden;
}

.preview-content{
    background:#fff;
    height:100%;
    border-radius:5px;
    padding:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.preview-title{
    font-size:14px;
    font-weight:900;
    margin-bottom:8px;
}

.preview-line{
    height:6px;
    width:70%;
    background:#cbd5e1;
    border-radius:5px;
    margin-bottom:6px;
}

.preview-line.short{
    width:42%;
}

.preview-boxes{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:6px;
    margin-top:12px;
}

.preview-box{
    height:32px;
    background:#e2e8f0;
    border-radius:3px;
}

.card-body{
    padding:15px;
}

.card-title{
    font-size:14px;
    font-weight:900;
    margin-bottom:6px;
}

.card-description{
    color:#64748b;
    font-size:11px;
    line-height:1.5;
    min-height:34px;
}

.card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
}

.tag{
    font-size:10px;
    font-weight:800;
    color:#6d28d9;
    background:#ede9fe;
    padding:5px 8px;
    border-radius:5px;
}

.use-btn{
    border:0;
    background:#7c3aed;
    color:#fff;
    padding:7px 11px;
    border-radius:6px;
    cursor:pointer;
    font-size:10px;
    font-weight:800;
}

.use-btn:hover{
    background:#6d28d9;
}

.empty{
    display:none;
    text-align:center;
    padding:60px 20px;
    color:#64748b;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);
    background:#fff;
    border-radius:14px;
    overflow:hidden;
}

.modal-head{
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #e2e8f0;
}

.modal-head h2{
    font-size:16px;
}

.close{
    border:0;
    background:#f1f5f9;
    width:32px;
    height:32px;
    border-radius:7px;
    cursor:pointer;
}

.modal-preview{
    padding:20px;
}

.large-slide{
    height:320px;
    background:#ede9fe;
    border-radius:10px;
    padding:35px;
}

.large-slide-inner{
    height:100%;
    background:#fff;
    border-radius:8px;
    padding:35px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.large-slide h3{
    font-size:30px;
    margin-bottom:15px;
}

.large-slide p{
    color:#64748b;
    max-width:450px;
    line-height:1.6;
}

.modal-footer{
    padding:15px 20px;
    border-top:1px solid #e2e8f0;
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

@media(max-width:600px){

    .header{
        padding:0 14px;
    }

    .header-actions .btn-secondary{
        display:none;
    }

    .hero{
        padding:28px 15px 20px;
    }

    .hero h1{
        font-size:26px;
    }

    .controls{
        padding:0 15px;
    }

    .container{
        padding:0 15px 35px;
    }

    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">
        <span class="logo">▣</span>
        <span>Presentation Studio</span>
    </div>

    <div class="header-actions">

        <button
            class="btn btn-secondary"
            onclick="showMyTemplates()">
            My Templates
        </button>

        <button
            class="btn btn-primary"
            onclick="createBlank()">
            + Blank Presentation
        </button>

    </div>

</header>


<section class="hero">

    <h1>Presentation Templates</h1>

    <p>
        Start with a professionally designed presentation
        and customize it for your project.
    </p>

</section>


<div class="controls">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="Search templates..."
        oninput="filterTemplates()"
    >

    <div class="categories">

        <button
            class="category active"
            data-category="All"
            onclick="setCategory('All',this)">
            All
        </button>

        <button
            class="category"
            data-category="Business"
            onclick="setCategory('Business',this)">
            Business
        </button>

        <button
            class="category"
            data-category="Startup"
            onclick="setCategory('Startup',this)">
            Startup
        </button>

        <button
            class="category"
            data-category="Marketing"
            onclick="setCategory('Marketing',this)">
            Marketing
        </button>

        <button
            class="category"
            data-category="Education"
            onclick="setCategory('Education',this)">
            Education
        </button>

        <button
            class="category"
            data-category="Portfolio"
            onclick="setCategory('Portfolio',this)">
            Portfolio
        </button>

    </div>

</div>


<main class="container">

    <div
        id="count"
        class="template-count">
        10 templates
    </div>

    <div
        id="grid"
        class="grid">
    </div>

    <div
        id="empty"
        class="empty">
        No templates found.
    </div>

</main>


<div
    id="modal"
    class="modal">

    <div class="modal-box">

        <div class="modal-head">

            <h2 id="modalTitle">
                Template Preview
            </h2>

            <button
                class="close"
                onclick="closePreview()">
                ×
            </button>

        </div>

        <div class="modal-preview">

            <div
                id="largeSlide"
                class="large-slide">

                <div class="large-slide-inner">

                    <h3 id="previewTitle">
                        Template
                    </h3>

                    <p id="previewDescription">
                        Presentation template preview.
                    </p>

                </div>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="btn btn-secondary"
                onclick="closePreview()">
                Cancel
            </button>

            <button
                id="useTemplateButton"
                class="btn btn-primary">
                Use Template
            </button>

        </div>

    </div>

</div>


<script>

const templates = [

    {
        id:1,
        title:"Business Pitch Deck",
        category:"Business",
        description:"Professional slides for presenting a business idea, strategy and financial plan.",
        color:"#dbeafe"
    },

    {
        id:2,
        title:"Startup Pitch",
        category:"Startup",
        description:"Tell your startup story with problem, solution, traction, market and funding slides.",
        color:"#ede9fe"
    },

    {
        id:3,
        title:"Company Profile",
        category:"Business",
        description:"Present your company, services, achievements, team and future direction.",
        color:"#dcfce7"
    },

    {
        id:4,
        title:"Marketing Strategy",
        category:"Marketing",
        description:"Plan campaigns, define audiences, present KPIs and communicate your marketing strategy.",
        color:"#fef3c7"
    },

    {
        id:5,
        title:"Project Proposal",
        category:"Business",
        description:"Explain objectives, scope, timeline, resources, budget and deliverables.",
        color:"#fee2e2"
    },

    {
        id:6,
        title:"Education Lesson",
        category:"Education",
        description:"Create clear lessons with objectives, concepts, examples, activities and summaries.",
        color:"#cffafe"
    },

    {
        id:7,
        title:"Creative Portfolio",
        category:"Portfolio",
        description:"Showcase your best work, skills, experience, projects and contact information.",
        color:"#fae8ff"
    },

    {
        id:8,
        title:"Sales Presentation",
        category:"Marketing",
        description:"Present products, benefits, pricing, customer value and your call to action.",
        color:"#fce7f3"
    },

    {
        id:9,
        title:"Financial Report",
        category:"Business",
        description:"Share financial performance, revenue, expenses, charts and forecasts.",
        color:"#e0f2fe"
    },

    {
        id:10,
        title:"Minimal Presentation",
        category:"Startup",
        description:"A clean and modern presentation for simple, focused storytelling.",
        color:"#f1f5f9"
    }

];


let activeCategory = "All";


function renderTemplates(){

    const grid =
        document.getElementById(
            "grid"
        );

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    const filtered =
        templates.filter(
            template => {

                const categoryMatch =
                    activeCategory === "All" ||
                    template.category === activeCategory;

                const searchMatch =
                    !search ||
                    template.title
                        .toLowerCase()
                        .includes(search) ||
                    template.description
                        .toLowerCase()
                        .includes(search) ||
                    template.category
                        .toLowerCase()
                        .includes(search);

                return (
                    categoryMatch &&
                    searchMatch
                );

            }
        );


    grid.innerHTML = "";


    filtered.forEach(
        template => {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "card";


            card.innerHTML = `

                <div
                    class="preview"
                    style="background:${template.color}">

                    <div class="preview-content">

                        <div class="preview-title">
                            ${template.title}
                        </div>

                        <div class="preview-line"></div>

                        <div class="preview-line short"></div>

                        <div class="preview-boxes">

                            <div class="preview-box"></div>
                            <div class="preview-box"></div>
                            <div class="preview-box"></div>

                        </div>

                    </div>

                </div>

                <div class="card-body">

                    <div class="card-title">
                        ${template.title}
                    </div>

                    <div class="card-description">
                        ${template.description}
                    </div>

                    <div class="card-footer">

                        <span class="tag">
                            ${template.category}
                        </span>

                        <button
                            class="use-btn"
                            onclick="previewTemplate(${template.id})">
                            Preview
                        </button>

                    </div>

                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );


    document.getElementById(
        "count"
    ).textContent =
        filtered.length +
        (
            filtered.length === 1
                ? " template"
                : " templates"
        );


    document.getElementById(
        "empty"
    ).style.display =
        filtered.length
            ? "none"
            : "block";

}


function setCategory(
    category,
    button
){

    activeCategory =
        category;


    document.querySelectorAll(
        ".category"
    ).forEach(
        item =>
            item.classList.remove(
                "active"
            )
    );


    button.classList.add(
        "active"
    );


    renderTemplates();

}


function filterTemplates(){

    renderTemplates();

}


function previewTemplate(id){

    const template =
        templates.find(
            item =>
                item.id === id
        );

    if(!template){

        return;

    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        template.title;


    document.getElementById(
        "previewTitle"
    ).textContent =
        template.title;


    document.getElementById(
        "previewDescription"
    ).textContent =
        template.description;


    document.getElementById(
        "largeSlide"
    ).style.background =
        template.color;


    document.getElementById(
        "useTemplateButton"
    ).onclick =
        function(){

            useTemplate(
                template
            );

        };


    document.getElementById(
        "modal"
    ).classList.add(
        "show"
    );

}


function closePreview(){

    document.getElementById(
        "modal"
    ).classList.remove(
        "show"
    );

}


function useTemplate(template){

    const presentation = {

        title:
            template.title,

        template:
            template.category,

        slides:[
            {
                title:
                    template.title,

                content:
                    template.description
            },
            {
                title:
                    "Overview",

                content:
                    "Add your presentation content here."
            },
            {
                title:
                    "Key Points",

                content:
                    "Add your main points, charts or images here."
            },
            {
                title:
                    "Conclusion",

                content:
                    "Summarize the presentation and add your call to action."
            }
        ]

    };


    localStorage.setItem(
        "presentation-draft",
        JSON.stringify(
            presentation
        )
    );


    closePreview();


    alert(
        "Template added to your presentation."
    );

}


function createBlank(){

    const presentation = {

        title:
            "Untitled Presentation",

        template:
            "Blank",

        slides:[
            {
                title:
                    "Title Slide",

                content:
                    "Add subtitle here."
            }
        ]

    };


    localStorage.setItem(
        "presentation-draft",
        JSON.stringify(
            presentation
        )
    );


    alert(
        "Blank presentation created."
    );

}


function showMyTemplates(){

    const saved =
        localStorage.getItem(
            "presentation-draft"
        );


    if(saved){

        alert(
            "You have a saved presentation draft."
        );

    }else{

        alert(
            "You don't have any saved templates yet."
        );

    }

}


document.getElementById(
    "modal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closePreview();

        }

    }
);


renderTemplates();

</script>

</body>
</html>
