<!-- private-chat.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Private Chat | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#eef2f7;
height:100vh;
overflow:hidden;
color:#172033
}

header{
height:64px;
position:fixed;
top:0;
left:0;
right:0;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
gap:10px;
padding:8px 14px;
z-index:10
}

.back,.menu-btn{
border:0;
background:#f1f5f9;
padding:9px 12px;
border-radius:10px;
cursor:pointer
}

.avatar{
width:43px;
height:43px;
border-radius:50%;
background:#2563eb;
color:white;
display:grid;
place-items:center;
font-weight:bold
}

.user-info{flex:1}

.user-info h1{
font-size:16px
}

.user-info p{
font-size:11px;
color:#16a34a;
margin-top:3px
}

#messages{
position:absolute;
top:64px;
bottom:70px;
left:0;
right:0;
overflow-y:auto;
padding:15px
}

.message{
display:flex;
margin-bottom:9px;
max-width:82%
}

.message.mine{
margin-left:auto;
justify-content:flex-end
}

.bubble{
background:#fff;
padding:9px 12px;
border-radius:14px;
box-shadow:0 1px 2px #0001
}

.mine .bubble{
background:#2563eb;
color:white
}

.text{
font-size:14px;
line-height:1.45;
white-space:pre-wrap;
word-break:break-word
}

.time{
font-size:9px;
opacity:.65;
text-align:right;
margin-top:4px
}

.composer{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:#fff;
border-top:1px solid #e5e7eb;
padding:9px;
display:flex;
gap:7px
}

#messageInput{
flex:1;
border:1px solid #dbe1e8;
border-radius:12px;
padding:10px 12px;
outline:none
}

.emoji,.send{
border:0;
border-radius:11px;
cursor:pointer
}

.emoji{
width:42px;
background:#f1f5f9;
font-size:18px
}

.send{
width:48px;
background:#2563eb;
color:white;
font-size:18px
}

.empty{
text-align:center;
color:#64748b;
padding:45px 15px
}
</style>
</head>

<body>

<header>

<button class="back" onclick="history.back()">←</button>

<div class="avatar" id="userAvatar">U</div>

<div class="user-info">

<h1 id="userName">Loading...</h1>

<p id="status">● Online</p>

</div>

<button class="menu-btn" onclick="viewProfile()">⋮</button>

</header>


<main id="messages">

<div class="empty" id="loading">
Loading conversation...
</div>

</main>


<div class="composer">

<button
class="emoji"
onclick="addEmoji('😊')">
😊
</button>

<input
id="messageInput"
type="text"
placeholder="Message..."
autocomplete="off"
>

<button
class="send"
onclick="sendMessage()">
➤
</button>

</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
orderBy,
limit,
addDoc,
deleteDoc,
onSnapshot,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ============================================
   FIREBASE
============================================ */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


/* ============================================
   CHAT USER
============================================ */

const params=
new URLSearchParams(location.search);

const otherUserId=
params.get("user") ||
params.get("uid") ||
localStorage.getItem("privateChatUser");


let currentUser=null;
let unsubscribe=null;


/* ============================================
   AUTH
============================================ */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="login.html";

return;

}

currentUser=user;


if(!otherUserId){

document.getElementById("loading")
.textContent=
"User not found.";

return;

}


/* Prevent chatting with yourself */

if(
currentUser.uid===
otherUserId
){

document.getElementById("loading")
.textContent=
"You cannot chat with yourself.";

return;

}


await loadUser();

listenMessages();

}
);


/* ============================================
   LOAD USER
============================================ */

async function loadUser(){

try{

const snap=
await getDoc(
doc(
db,
"users",
otherUserId
)
);


if(!snap.exists()){

document.getElementById("userName")
.textContent=
"User";

return;

}


const data=snap.data();

const name=
data.displayName ||
data.name ||
data.fullName ||
data.email ||
"User";


document.getElementById("userName")
.textContent=name;


document.getElementById("userAvatar")
.textContent=
name
.charAt(0)
.toUpperCase();


}catch(error){

console.error(error);

}

}


/* ============================================
   PRIVATE CHAT ID
============================================ */

function getChatId(){

return [
currentUser.uid,
otherUserId
]
.sort()
.join("_");

}


/* ============================================
   REAL-TIME MESSAGES
============================================ */

function listenMessages(){

const chatId=
getChatId();


const q=query(

collection(
db,
"privateMessages"
),

where(
"chatId",
"==",
chatId
),

orderBy(
"createdAt",
"asc"
),

limit(300)

);


unsubscribe=
onSnapshot(
q,
snapshot=>{

const container=
document.getElementById(
"messages"
);


container.innerHTML="";


if(snapshot.empty){

container.innerHTML=`

<div class="empty">

<h3>
No messages yet
</h3>

<p>
Start your private conversation 👋
</p>

</div>

`;

return;

}


snapshot.docs.forEach(
message=>{

renderMessage(
container,
message
);

});


scrollBottom();

},
error=>{

console.error(error);

document.getElementById(
"messages"
).innerHTML=`

<div class="empty">

Unable to load messages.

</div>

`;

}
);

}


/* ============================================
   RENDER
============================================ */

function renderMessage(
container,
messageDoc
){

const data=
messageDoc.data();


const mine=
data.senderId===
currentUser.uid;


const wrapper=
document.createElement("div");


wrapper.className=
"message"+
(
mine
?" mine"
:""
);


const bubble=
document.createElement("div");


bubble.className="bubble";


const text=
document.createElement("div");


text.className="text";

text.textContent=
data.text||"";


const time=
document.createElement("div");


time.className="time";

time.textContent=
formatTime(
data.createdAt
);


bubble.appendChild(text);

bubble.appendChild(time);


if(mine){

bubble.addEventListener(
"contextmenu",
event=>{

event.preventDefault();

deleteMessage(
messageDoc.id
);

}
);

}


wrapper.appendChild(
bubble
);

container.appendChild(
wrapper
);

}


/* ============================================
   SEND
============================================ */

window.sendMessage=
async function(){

const input=
document.getElementById(
"messageInput"
);


const text=
input.value.trim();


if(!text)
return;


const button=
document.querySelector(
".send"
);


button.disabled=true;


try{

const chatId=
getChatId();


await addDoc(
collection(
db,
"privateMessages"
),
{

chatId:

chatId,

senderId:

currentUser.uid,

receiverId:

otherUserId,

senderName:

currentUser.displayName ||
currentUser.email ||
"User",

text:

text,

createdAt:

serverTimestamp(),

read:false

}
);


input.value="";

input.focus();

scrollBottom();


}catch(error){

console.error(
"Send error:",
error
);

alert(
"Unable to send message."
);

}finally{

button.disabled=false;

}

};


/* ============================================
   ENTER
============================================ */

document
.getElementById(
"messageInput"
)
.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter"
){

event.preventDefault();

sendMessage();

}

}
);


/* ============================================
   DELETE
============================================ */

async function deleteMessage(
messageId
){

if(
!confirm(
"Delete this message?"
)
)
return;


try{

await deleteDoc(
doc(
db,
"privateMessages",
messageId
)
);

}catch(error){

console.error(error);

alert(
"Unable to delete message."
);

}

}


/* ============================================
   EMOJI
============================================ */

window.addEmoji=
function(emoji){

const input=
document.getElementById(
"messageInput"
);

input.value+=emoji;

input.focus();

};


/* ============================================
   PROFILE
============================================ */

window.viewProfile=
function(){

location.href=
"profile.html?uid="+
encodeURIComponent(
otherUserId
);

};


/* ============================================
   SCROLL
============================================ */

function scrollBottom(){

const box=
document.getElementById(
"messages"
);

setTimeout(
()=>{

box.scrollTop=
box.scrollHeight;

},
100
);

}


/* ============================================
   TIME
============================================ */

function formatTime(
timestamp
){

if(!timestamp)
return"Sending...";


try{

const date=
timestamp.toDate
?timestamp.toDate()
:new Date(timestamp);


return date.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return"";

}

}


/* ============================================
   CLEANUP
============================================ */

window.addEventListener(
"beforeunload",
()=>{

if(unsubscribe)
unsubscribe();

}
);

</script>

</body>
</html>
