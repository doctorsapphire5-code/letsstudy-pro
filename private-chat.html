<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --background:#f5f7fb;
  --white:#fff;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#667085;
  --soft:#f2f4f7;
  --success:#12b76a;
  --danger:#ef4444;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--background);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =====================================================
   APP
===================================================== */

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =====================================================
   TOPBAR
===================================================== */

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  flex-shrink:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  font-weight:800;
}

.brand-icon{
  width:39px;
  height:39px;
  border-radius:11px;
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(
    135deg,
    #2563eb,
    #7c3aed
  );
}

.brand span{
  color:var(--primary);
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:39px;
  height:39px;
  border:0;
  border-radius:11px;
  background:var(--soft);
  color:#344054;
  display:grid;
  place-items:center;
}

.icon-btn:hover{
  background:#e8edf5;
}

/* =====================================================
   CHAT
===================================================== */

.chat-page{
  flex:1;
  display:flex;
  min-height:0;
  max-width:1450px;
  width:100%;
  margin:auto;
  background:#fff;
}

/* =====================================================
   USER SIDEBAR
===================================================== */

.user-panel{
  width:330px;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  background:#fff;
}

.user-panel-head{
  padding:20px;
  border-bottom:1px solid var(--border);
}

.user-panel-head h1{
  font-size:21px;
  margin-bottom:14px;
}

.search{
  position:relative;
}

.search i{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:#98a2b3;
}

.search input{
  width:100%;
  height:43px;
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
  padding:0 12px 0 38px;
  background:#f9fafb;
}

.search input:focus{
  border-color:#84adff;
  background:#fff;
}

.users{
  flex:1;
  overflow-y:auto;
}

.user-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px 17px;
  border-bottom:1px solid #f2f4f7;
  cursor:pointer;
}

.user-item:hover{
  background:#f8fafc;
}

.user-item.active{
  background:#eef4ff;
}

.user-avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
}

.avatar-placeholder{
  width:44px;
  height:44px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#eaf1ff;
  color:var(--primary);
  flex-shrink:0;
}

.user-info{
  min-width:0;
  flex:1;
}

.user-name{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-status{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

/* =====================================================
   CHAT AREA
===================================================== */

.chat-area{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#f8fafc;
}

/* =====================================================
   CHAT HEADER
===================================================== */

.chat-header{
  height:72px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  flex-shrink:0;
}

.chat-person{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.chat-person-info{
  min-width:0;
}

.chat-name{
  font-size:14px;
  font-weight:700;
}

.chat-status{
  font-size:11px;
  color:var(--success);
  margin-top:4px;
}

.chat-actions{
  display:flex;
  gap:7px;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
  flex:1;
  display:grid;
  place-items:center;
  padding:30px;
  text-align:center;
}

.empty-icon{
  width:80px;
  height:80px;
  border-radius:24px;
  background:#eaf1ff;
  color:var(--primary);
  display:grid;
  place-items:center;
  font-size:30px;
  margin:auto;
}

.empty h2{
  font-size:22px;
  margin-top:18px;
}

.empty p{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
  max-width:430px;
  margin-top:8px;
}

/* =====================================================
   MESSAGES
===================================================== */

.messages{
  flex:1;
  overflow-y:auto;
  padding:25px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.message-row{
  display:flex;
  max-width:75%;
}

.message-row.mine{
  align-self:flex-end;
}

.message-row.other{
  align-self:flex-start;
}

.bubble{
  padding:10px 13px;
  border-radius:16px;
  font-size:13px;
  line-height:1.55;
  word-break:break-word;
}

.mine .bubble{
  background:var(--primary);
  color:#fff;
  border-bottom-right-radius:5px;
}

.other .bubble{
  background:#fff;
  border:1px solid var(--border);
  border-bottom-left-radius:5px;
}

.message-time{
  font-size:9px;
  margin-top:4px;
  opacity:.7;
  text-align:right;
}

.read{
  margin-left:4px;
}

/* =====================================================
   COMPOSER
===================================================== */

.composer{
  background:#fff;
  border-top:1px solid var(--border);
  padding:10px 14px;
  flex-shrink:0;
}

.composer-inner{
  display:flex;
  align-items:flex-end;
  gap:7px;
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:14px;
  padding:6px;
}

.tool{
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  color:#667085;
  border-radius:9px;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.tool:hover{
  background:#e9edf3;
}

#messageInput{
  flex:1;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  min-height:38px;
  max-height:120px;
  padding:9px 3px;
  line-height:1.45;
}

.send{
  width:40px;
  height:40px;
  border:0;
  border-radius:11px;
  background:var(--primary);
  color:#fff;
  display:grid;
  place-items:center;
}

.send:disabled{
  opacity:.5;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
  padding:35px 20px;
  text-align:center;
  color:#98a2b3;
  font-size:12px;
}

.spinner{
  width:25px;
  height:25px;
  border:3px solid #e5e7eb;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 10px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:#101828;
  color:#fff;
  padding:11px 17px;
  border-radius:10px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =====================================================
   MOBILE
===================================================== */

.mobile-back{
  display:none;
}

@media(max-width:800px){

  .brand-text{
    display:none;
  }

    position:relative;
  }

  .user-panel{
    width:100%;
  }

  .chat-area{
    display:none;
    width:100%;
  }

  .chat-page.chat-open .user-panel{
    display:none;
  }

  .chat-page.chat-open .chat-area{
    display:flex;
  }

  .mobile-back{
    display:grid;
  }

  .message-row{
    max-width:88%;
  }

  .messages{
    padding:16px 12px;
  }

}

</style>

/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

  try{

    const snap =
      await getDocs(
        query(
          collection(
            db,
            "users"
          ),
          limit(100)
        )
      );


    allUsers =
      snap.docs
        .map(
          item => ({
            uid:item.id,
            ...item.data()
          })
        )
        .filter(
          user =>
            user.uid !==
            currentUser.uid
        );


    renderUsers(
      allUsers
    );

  }catch(error){

    console.error(
      "LOAD USERS:",
      error
    );

    usersBox.innerHTML = `

      <div class="loading">
        Unable to load members.
      </div>

    `;

  }

}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(
  users
){

  if(!users.length){

    usersBox.innerHTML = `

      <div class="loading">
        No other members found.
      </div>

    `;

    return;

  }


  usersBox.innerHTML =
    users
      .map(
        user => {

          const name =
            user.displayName ||
            user.name ||
            user.email ||
            "Member";

          const avatar =
            user.photoURL ||
            user.photoUrl ||
            user.avatar ||
            user.imageUrl ||
            "";


          return `

            <div
              class="
                user-item
                ${
                  activeUser?.uid ===
                  user.uid
                    ? "active"
                    : ""
                }
              "
              data-uid="${escapeHTML(user.uid)}"
            >

              ${
                avatar

                  ? `

                    <img
                      class="user-avatar"
                      src="${escapeHTML(avatar)}"
                      alt=""
                    >

                  `

                  : `

                    <div
                      class="avatar-placeholder"
                    >
                      <i
                        class="fa-solid fa-user"
                      ></i>
                    </div>

                  `
              }


              <div class="user-info">

                <div class="user-name">

                  ${escapeHTML(name)}

                </div>

                <div class="user-status">

                  Private message

                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");


  document
    .querySelectorAll(
      ".user-item"
    )
    .forEach(
      item => {

        item.addEventListener(
          "click",
          () => {

            openChat(
              item.dataset.uid
            );

          }
        );

      }
    );

}


/* =====================================================
   SEARCH USERS
===================================================== */

userSearch.addEventListener(
  "input",
  () => {

    const value =
      userSearch.value
        .trim()
        .toLowerCase();


    const filtered =
      allUsers.filter(
        user => {

          const name =
            String(
              user.displayName ||
              user.name ||
              ""
            )
            .toLowerCase();

          const email =
            String(
              user.email ||
              ""
            )
            .toLowerCase();

          return (
            name.includes(value) ||
            email.includes(value)
          );

        }
      );


    renderUsers(
      filtered
    );

  }
);

  try{

    if(!activeUser){

  showToast(

empty.style.display =

}


/* =====================================================

const newUrl =

  );


history.replaceState(

/* =====================================================

/* =====================================================

listenMessages();


/* =====================================================

renderUsers(

setTimeout(

}catch(error){

  console.error(
    "OPEN PRIVATE CHAT ERROR:",
    error
  );

  showToast(
    "Unable to open private chat."
  );

}

}


/* =====================================================
   GET USER
===================================================== */

async function getUser(
  uid
){

  if(!uid){
    return null;
  }


  const userRef =
    doc(
      db,
      "users",
      uid
    );


  const userSnap =
    await getDoc(
      userRef
    );


  if(
    !userSnap.exists()
  ){

    return null;

  }


  return {

    uid:uid,

    ...userSnap.data()

  };

}


/* =====================================================
   CREATE STABLE CHAT ID
===================================================== */

function createChatId(
  uid1,
  uid2
){

  return [
    String(uid1),
    String(uid2)
  ]
  .sort()
  .join("_");

}


/* =====================================================
   ENSURE PRIVATE CHAT
===================================================== */

async function ensureChat(){

  if(
    !activeChatId ||
    !currentUser ||
    !activeUser
  ){

    return;

  }


  const chatRef =
    doc(
      db,
      "privateChats",
      activeChatId
    );


  const chatSnap =
    await getDoc(
      chatRef
    );


  if(
    !chatSnap.exists()
  ){

    await setDoc(
      chatRef,
      {

        participants:[
          currentUser.uid,
          activeUser.uid
        ],

        participantIds:[
          currentUser.uid,
          activeUser.uid
        ],

        lastMessage:"",

        lastMessageAt:
          serverTimestamp(),

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );

  }

}


/* =====================================================
   REAL-TIME MESSAGES
===================================================== */

function listenMessages(){

  if(
    messageUnsubscribe
  ){

    messageUnsubscribe();

    messageUnsubscribe =
      null;

  }


  if(!activeChatId){

    return;

  }


  messages.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Loading messages...

    </div>

  `;


  const messagesRef =
    collection(
      db,
      "privateChats",
      activeChatId,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      ),
      limit(500)
    );


  messageUnsubscribe =
    onSnapshot(
      messagesQuery,

      snapshot => {

        messages.innerHTML = "";


        if(
          snapshot.empty
        ){

          messages.innerHTML = `

            <div
              class="loading"
              style="margin:auto;"
            >

              <i
                class="fa-regular fa-comments"
                style="
                  font-size:30px;
                  display:block;
                  margin-bottom:12px;
                "
              ></i>

              No messages yet.

              <br>

              Start the conversation.

            </div>

          `;

          return;

        }


        snapshot.forEach(
          messageDoc => {

            renderMessage(
              messageDoc.id,
              messageDoc.data()
            );

          }
        );


        requestAnimationFrame(
          () => {

            messages.scrollTop =
              messages.scrollHeight;

          }
        );


        markMessagesRead(
          snapshot
        );

      },

      error => {

        console.error(
          "MESSAGE LISTENER ERROR:",
          error
        );


        messages.innerHTML = `

          <div class="loading">

            Unable to load messages.

          </div>

        `;

      }
    );

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(
  messageId,
  data
){

  const mine =
    data.senderId ===
    currentUser.uid;


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "message-row " +
    (
      mine
        ? "mine"
        : "other"
    );


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  const messageText =
    escapeHTML(
      data.text || ""
    )
    .replace(
      /\n/g,
      "<br>"
    );


  const time =
    formatTime(
      data.createdAt
    );


  bubble.innerHTML = `

    <div class="message-text">

      ${messageText}

    </div>

    <div class="message-time">

      ${time}

      ${
        mine

          ? `

            <span class="read">

              ${
                data.read
                  ? "✓✓"
                  : "✓"
              }

            </span>

          `

          : ""
      }

    </div>

  `;


  row.appendChild(
    bubble
  );


  messages.appendChild(
    row
  );

}


/* =====================================================
   MARK RECEIVED MESSAGES AS READ
===================================================== */

async function markMessagesRead(
  snapshot
){

  const tasks = [];


  snapshot.forEach(
    messageDoc => {

      const data =
        messageDoc.data();


      if(
        data.receiverId ===
        currentUser.uid &&
        data.read !== true
      ){

        tasks.push(
          updateDoc(
            messageDoc.ref,
            {
              read:true,
              readAt:
                serverTimestamp()
            }
          )
        );

      }

    }
  );


  if(tasks.length){

    try{

      await Promise.all(
        tasks
      );

    }catch(error){

      console.warn(
        "READ UPDATE:",
        error
      );

    }

  }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

messageForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(
      !currentUser ||
      !activeUser ||
      !activeChatId
    ){

      showToast(
        "Select a member first."
      );

      return;

    }


    const text =
      messageInput.value.trim();


    if(!text){

      return;

    }


    sendButton.disabled =
      true;


    try{

      const messageRef =
        collection(
          db,
          "privateChats",
          activeChatId,
          "messages"
        );


      await addDoc(
        messageRef,
        {

          senderId:
            currentUser.uid,

          receiverId:
            activeUser.uid,

          text:text,

          type:"text",

          read:false,

          createdAt:
            serverTimestamp()

        }
      );


      await updateDoc(
        doc(
          db,
          "privateChats",
          activeChatId
        ),
        {

          lastMessage:text,

          lastMessageSenderId:
            currentUser.uid,

          lastMessageAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }
      );


      messageInput.value =
        "";

      messageInput.style.height =
        "auto";


    }catch(error){

      console.error(
        "SEND MESSAGE ERROR:",
        error
      );

      showToast(
        "Message could not be sent."
      );

    }finally{

      sendButton.disabled =
        false;

      messageInput.focus();

    }

  }
);


/* =====================================================
   SAFE HTML
===================================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(
  timestamp
){

  if(!timestamp){

    return "";

  }


  try{

    const date =
      typeof timestamp.toDate ===
      "function"

        ? timestamp.toDate()

        : new Date(timestamp);


    return new Intl.DateTimeFormat(
      "en-US",
      {
        hour:"numeric",
        minute:"2-digit"
      }
    ).format(
      date
    );

  }catch{

    return "";

  }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer =
  null;


function showToast(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );


  if(!toast){

    return;

  }


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  () => {

    if(
      messageUnsubscribe
    ){

      messageUnsubscribe();

    }

  }
);


/* =====================================================
   END PRIVATE CHAT
===================================================== */

</script>
