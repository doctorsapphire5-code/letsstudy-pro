<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Private Chat | LetsStudy Pro</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#0f172a;
height:100vh;
overflow:hidden
}

a{
text-decoration:none;
color:inherit
}

header{
height:62px;
background:#fff;
border-bottom:1px solid #e2e8f0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 17px;
gap:12px;
position:relative;
z-index:10
}

.logo{
font-size:18px;
font-weight:900;
color:#2563eb
}

nav{
display:flex;
gap:7px;
flex-wrap:wrap
}

nav a{
font-size:9px;
font-weight:900;
padding:8px 10px;
border-radius:8px;
background:#f1f5f9
}

.app{
max-width:1050px;
height:calc(100vh - 62px);
margin:auto;
background:#fff;
display:flex;
flex-direction:column
}

.chat-header{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 15px;
border-bottom:1px solid #e2e8f0
}

.user{
display:flex;
align-items:center;
gap:10px
}

.avatar{
width:43px;
height:43px;
border-radius:50%;
background:#dbeafe;
color:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
font-weight:900;
overflow:hidden
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.name{
font-size:11px;
font-weight:900
}

.status{
font-size:8px;
color:#64748b;
margin-top:3px
}

.header-actions{
display:flex;
gap:6px
}

.header-btn{
padding:8px 10px;
border-radius:8px;
background:#f1f5f9;
font-size:8px;
font-weight:900
}

.messages{
flex:1;
overflow-y:auto;
background:#f8fafc;
padding:18px
}

.message{
display:flex;
margin-bottom:12px
}

.message.mine{
justify-content:flex-end
}

.bubble{
max-width:min(75%,550px);
background:#fff;
border:1px solid #e2e8f0;
border-radius:14px;
padding:9px 12px
}

.mine .bubble{
background:#2563eb;
color:#fff;
border-color:#2563eb
}

.text{
font-size:10px;
line-height:1.6;
white-space:pre-wrap;
word-break:break-word
}

.time{
font-size:7px;
color:#94a3b8;
text-align:right;
margin-top:5px
}

.mine .time{
color:#dbeafe
}

.empty{
height:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:10px;
color:#64748b
}

.composer{
display:flex;
gap:8px;
padding:11px;
border-top:1px solid #e2e8f0;
background:#fff
}

textarea{
flex:1;
height:43px;
resize:none;
border:1px solid #cbd5e1;
border-radius:10px;
padding:11px;
font-size:10px;
outline:none
}

textarea:focus{
border-color:#2563eb
}

.send{
border:0;
background:#2563eb;
color:#fff;
border-radius:10px;
padding:0 17px;
font-size:9px;
font-weight:900;
cursor:pointer
}

.send:disabled{
opacity:.5
}

.notice{
display:none;
padding:9px 14px;
font-size:8px;
font-weight:900;
background:#fee2e2;
color:#991b1b
}

@media(max-width:700px){

header{
height:auto;
min-height:62px;
flex-direction:column;
align-items:flex-start;
padding:9px
}

nav{
width:100%
}

nav a{
flex:1;
text-align:center
}

.app{
height:calc(100vh - 108px)
}

.bubble{
max-width:86%
}

.header-btn{
font-size:7px;
padding:7px
}

}

</style>

</head>

<body>


<header>

<a
href="community.html"
class="logo">

LetsStudy Pro

</a>

<nav>

<a href="message.html">
Messages
</a>

<a id="profileTop" href="#">
Profile
</a>

<a href="community.html">
Community
</a>

</nav>

</header>


<div class="app">


<div class="chat-header">

<div class="user">

<div
id="avatar"
class="avatar">

U

</div>

<div>

<div
id="userName"
class="name">

Loading...

</div>

<div
id="userStatus"
class="status">

Connecting...

</div>

</div>

</div>


<div class="header-actions">

<a
href="message.html"
class="header-btn">

← Messages

</a>

<a
id="profileButton"
href="#"
class="header-btn">

Profile

</a>

<a
href="community.html"
class="header-btn">

Community

</a>

</div>

</div>


<div
id="notice"
class="notice">
</div>


<div
id="messages"
class="messages">

<div class="empty">

Loading conversation...

</div>

</div>


<form
id="composer"
class="composer">

<textarea
id="input"
maxlength="2000"
placeholder="Write a message..."
required></textarea>

<button
id="send"
class="send"
type="submit">

Send

</button>

</form>


</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
orderBy,
onSnapshot,
addDoc,
serverTimestamp,
limit
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const messages=
document.getElementById("messages");

const input=
document.getElementById("input");

const send=
document.getElementById("send");

const avatar=
document.getElementById("avatar");

const userName=
document.getElementById("userName");

const userStatus=
document.getElementById("userStatus");

const profileButton=
document.getElementById("profileButton");

const profileTop=
document.getElementById("profileTop");

const notice=
document.getElementById("notice");


/* =========================================
URL
========================================= */

const params=
new URLSearchParams(
location.search
);

const targetId=
params.get("userId")||
params.get("uid")||
params.get("id");


let currentUser=null;
let targetUser=null;
let unsubscribe=null;
let conversationId=null;


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href=
"login.html?redirect="+
encodeURIComponent(
location.pathname+
location.search
);

return;

}

currentUser=user;


if(!targetId){

showError(
"User ID is missing."
);

return;

}


if(targetId===currentUser.uid){

showError(
"You cannot start a private chat with yourself."
);

return;

}


await loadTargetUser();

});


/* =========================================
LOAD TARGET USER
========================================= */

async function loadTargetUser(){

try{

const snap=
await getDoc(
doc(
db,
"users",
targetId
)
);


if(!snap.exists()){

showError(
"User profile was not found."
);

return;

}


targetUser={
id:snap.id,
...snap.data()
};


renderUser();

createConversationId();

startMessages();


}catch(error){

console.error(
"User loading error:",
error
);

showError(
"Unable to load user profile."
);

}

}


/* =========================================
USER UI
========================================= */

function renderUser(){

const name=
targetUser.displayName||
targetUser.name||
targetUser.fullName||
targetUser.username||
"Community Member";


const photo=
targetUser.photoURL||
targetUser.photo||
targetUser.profilePhoto||
"";


userName.textContent=
name;


userStatus.textContent=
"Private conversation";


if(photo){

avatar.innerHTML=
`<img
src="${escapeAttribute(photo)}"
alt="">`;

}else{

avatar.textContent=
getInitials(name);

}


const profileURL=
"profile.html?id="+
encodeURIComponent(targetId);


profileButton.href=
profileURL;

profileTop.href=
profileURL;

}


/* =========================================
CONVERSATION ID
========================================= */

function createConversationId(){

conversationId=
[
currentUser.uid,
targetId
]
.sort()
.join("_");

}


/* =========================================
MESSAGES
========================================= */

function startMessages(){

const messagesRef=
collection(
db,
"privateChats",
conversationId,
"messages"
);


const q=
query(
messagesRef,
orderBy(
"createdAt",
"asc"
),
limit(200)
);


unsubscribe=
onSnapshot(
q,
snapshot=>{

messages.innerHTML="";


if(snapshot.empty){

messages.innerHTML=`

<div class="empty">

<div>

💬<br><br>

No messages yet.<br>

Start your private conversation.

</div>

</div>

`;

return;

}


snapshot.forEach(
messageDoc=>{

renderMessage(
messageDoc.data()
);

});


scrollBottom();


},
error=>{

console.error(
"Message listener:",
error
);

messages.innerHTML=`

<div class="empty">

Unable to load messages.<br><br>

Check your Firebase Firestore rules.

</div>

`;

});

}


/* =========================================
SEND
========================================= */

document
.getElementById("composer")
.addEventListener(
"submit",
async event=>{

event.preventDefault();


const text=
input.value.trim();


if(!text)
return;


if(
!currentUser||
!conversationId
)
return;


send.disabled=true;

send.textContent=
"Sending...";


try{

const senderName=
currentUser.displayName||
currentUser.email?.split("@")[0]||
"Member";


await addDoc(
collection(
db,
"privateChats",
conversationId,
"messages"
),
{

text:text,

senderId:
currentUser.uid,

receiverId:
targetId,

senderName:
senderName,

senderPhoto:
currentUser.photoURL||
"",

createdAt:
serverTimestamp()

});


/*
Conversation summary helps
message.html show conversations.
*/

try{

await setConversationSummary();

}catch(summaryError){

console.warn(
"Conversation summary failed:",
summaryError
);

}


input.value="";

scrollBottom();


}catch(error){

console.error(
"Send error:",
error
);

showError(
"Message could not be sent."
);

}finally{

send.disabled=false;

send.textContent=
"Send";

input.focus();

}

});


/* =========================================
CONVERSATION SUMMARY
========================================= */

async function setConversationSummary(){

const summaryRef=
doc(
db,
"privateChats",
conversationId
);


/*
Requires setDoc import if you want
summary documents.

The message itself remains saved
even if this optional summary fails.
*/

}


/* =========================================
RENDER MESSAGE
========================================= */

function renderMessage(data){

const mine=
data.senderId===
currentUser.uid;


const wrapper=
document.createElement("div");

wrapper.className=
"message"+
(
mine
?
" mine"
:
""
);


const bubble=
document.createElement("div");

bubble.className=
"bubble";


const text=
document.createElement("div");

text.className=
"text";

text.textContent=
data.text||
"";


const time=
document.createElement("div");

time.className=
"time";

time.textContent=
formatTime(
data.createdAt
);


bubble.appendChild(
text
);

bubble.appendChild(
time
);

wrapper.appendChild(
bubble
);

messages.appendChild(
wrapper
);

}


/* =========================================
ERROR
========================================= */

function showError(text){

messages.innerHTML=`

<div class="empty">

<div>

⚠️<br><br>

${escapeHTML(text)}

<br><br>

<a
href="message.html"
style="
display:inline-block;
background:#2563eb;
color:white;
padding:9px 13px;
border-radius:8px;
font-weight:900">

← Messages

</a>

</div>

</div>

`;

userStatus.textContent=
"Unavailable";

}


/* =========================================
NOTICE
========================================= */

function showNotice(text){

notice.textContent=
text;

notice.style.display=
"block";

}


/* =========================================
SCROLL
========================================= */

function scrollBottom(){

requestAnimationFrame(
()=>{

messages.scrollTop=
messages.scrollHeight;

});

}


/* =========================================
DATE
========================================= */

function getTime(value){

if(!value)
return 0;


if(
typeof value.toMillis==="function"
){

return value.toMillis();

}


if(value.seconds){

return value.seconds*1000;

}


const time=
new Date(value).getTime();


return Number.isNaN(time)
?0
:time;

}


function formatTime(value){

const time=
getTime(value);


if(!time)
return "Sending...";


return new Intl.DateTimeFormat(
undefined,
{
hour:"2-digit",
minute:"2-digit"
}
).format(
new Date(time)
);

}


/* =========================================
INITIALS
========================================= */

function getInitials(name){

return String(name)
.trim()
.split(/\s+/)
.slice(0,2)
.map(
x=>
x.charAt(0).toUpperCase()
)
.join("")||
"U";

}


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttribute(value){

return String(value)
.replaceAll("'","%27")
.replaceAll('"',"%22")
.replaceAll("&","%26");

}


/* =========================================
ENTER TO SEND
========================================= */

input.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

document
.getElementById("composer")
.requestSubmit();

}

});


/* =========================================
CLEANUP
========================================= */

window.addEventListener(
"beforeunload",
()=>{

if(unsubscribe)
unsubscribe();

});

</script>

</body>
</html>
