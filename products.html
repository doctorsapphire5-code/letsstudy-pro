<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Product | LetsStudy Pro</title>

<meta name="description"
content="View product details, pricing, seller products and purchase options on LetsStudy Pro Marketplace.">

<style>

*{
  box-sizing:border-box;
}

:root{
  --primary:#059669;
  --primary-dark:#047857;
  --bg:#f5f7fa;
  --card:#fff;
  --text:#172033;
  --muted:#667085;
  --border:#e5e9ee;
  --warning:#f59e0b;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
  cursor:pointer;
}

.header{
  height:68px;
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  max-width:1200px;
  height:100%;
  margin:auto;
  padding:0 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:var(--primary);
  font-size:20px;
  font-weight:950;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:7px;
}

.nav-links a{
  padding:9px 11px;
  border-radius:8px;
  color:#475467;
  font-size:10px;
  font-weight:900;
}

.nav-links a:hover{
  background:#ecfdf5;
  color:var(--primary-dark);
}

.seller-btn{
  background:#172033!important;
  color:#fff!important;
}


/* =================================
PAGE
================================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 18px 70px;
}

.breadcrumb{
  margin-bottom:16px;

  color:#98a2b3;
  font-size:9px;
  font-weight:800;
}

.breadcrumb a:hover{
  color:var(--primary);
}


/* =================================
PRODUCT HERO
================================= */

.product-layout{
  display:grid;
  grid-template-columns:
    1.05fr .95fr;

  gap:22px;
}


/* =================================
GALLERY
================================= */

.gallery{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:12px;

  animation:
    fadeUp .6s ease both;
}

.main-image-wrap{
  position:relative;
  overflow:hidden;

  width:100%;
  height:450px;

  border-radius:13px;
  background:#ecfdf5;
}

.main-image{
  width:100%;
  height:100%;
  object-fit:cover;

  transition:
    transform .5s ease;
}

.main-image:hover{
  transform:scale(1.04);
}

.image-placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:80px;

  background:
    radial-gradient(
      circle at 30% 20%,
      #d1fae5,
      transparent 40%
    ),
    #ecfdf5;
}

.badge{
  position:absolute;
  left:15px;
  top:15px;

  padding:7px 9px;

  border-radius:7px;

  background:#fff7ed;
  color:#c2410c;

  font-size:8px;
  font-weight:950;

  box-shadow:0 4px 15px #00000010;
}

.thumbnails{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.thumb{
  width:60px;
  height:55px;

  object-fit:cover;

  border-radius:8px;
  border:2px solid transparent;

  cursor:pointer;
}

.thumb.active{
  border-color:var(--primary);
}


/* =================================
DETAILS
================================= */

.details{
  animation:
    fadeUp .7s ease .08s both;
}

.type{
  display:inline-flex;

  padding:6px 8px;

  border-radius:7px;

  background:#ecfdf5;
  color:var(--primary-dark);

  font-size:8px;
  font-weight:950;

  text-transform:uppercase;
}

.details h1{
  margin:13px 0 10px;

  font-size:31px;
  line-height:1.15;
  letter-spacing:-1px;
}

.short-description{
  margin:0;

  color:var(--muted);

  font-size:11px;
  line-height:1.75;
}


/* =================================
RATING
================================= */

.meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;

  gap:10px;

  margin:17px 0;
}

.rating{
  color:var(--warning);

  font-size:12px;
  font-weight:950;
}

.rating span{
  color:var(--muted);
  font-size:9px;
}

.meta-item{
  color:var(--muted);
  font-size:9px;
  font-weight:800;
}


/* =================================
PRICE
================================= */

.price-box{
  padding:17px;

  border:1px solid #dcefe8;
  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #f0fdf4,
      #fff
    );

  margin-bottom:15px;
}

.price{
  color:var(--primary);

  font-size:29px;
  font-weight:950;
}

.old-price{
  margin-left:8px;

  color:#98a2b3;

  font-size:12px;
  text-decoration:line-through;
}

.sale{
  display:inline-block;

  margin-left:7px;

  padding:5px 7px;

  border-radius:6px;

  background:#dcfce7;
  color:#166534;

  font-size:8px;
  font-weight:950;
}


/* =================================
ACTIONS
================================= */

.actions{
  display:grid;
  grid-template-columns:
    1fr 1fr;

  gap:8px;
}

.action-btn{
  min-height:45px;

  border:0;
  border-radius:9px;

  font-size:10px;
  font-weight:950;

  transition:
    transform .2s,
    box-shadow .2s;
}

.action-btn:hover{
  transform:translateY(-2px);
}

.cart-btn{
  background:#172033;
  color:#fff;
}

.buy-btn{
  background:var(--primary);
  color:#fff;

  box-shadow:
    0 8px 20px #05966930;
}

.seller-products{
  display:flex;
  align-items:center;
  justify-content:center;

  width:100%;

  margin-top:9px;
  padding:11px;

  border:1px solid var(--border);
  border-radius:9px;

  background:#fff;

  color:#475467;

  font-size:9px;
  font-weight:950;

  transition:.2s;
}

.seller-products:hover{
  border-color:var(--primary);
  color:var(--primary);
  background:#ecfdf5;
}


/* =================================
INFO CARDS
================================= */

.info-grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:9px;

  margin-top:14px;
}

.info{
  padding:12px;

  background:#fff;

  border:1px solid var(--border);
  border-radius:10px;
}

.info-icon{
  font-size:18px;
}

.info strong{
  display:block;

  margin-top:6px;

  font-size:10px;
}

.info span{
  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:8px;
}


/* =================================
DESCRIPTION
================================= */

.content-section{
  margin-top:25px;
}

.section-title{
  margin-bottom:11px;
}

.section-title h2{
  margin:0;
  font-size:19px;
}

.section-title p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:9px;
}

.description-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:22px;

  line-height:1.8;
  color:#475467;
  font-size:10px;
}


/* =================================
RELATED
================================= */

.related-grid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);

  gap:11px;
}

.related-card{
  overflow:hidden;

  background:#fff;

  border:1px solid var(--border);
  border-radius:13px;

  transition:.2s;
}

.related-card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px #17203312;
}

.related-image{
  width:100%;
  height:135px;
  object-fit:cover;
  background:#ecfdf5;
}

.related-body{
  padding:11px;
}

.related-body h3{
  margin:0 0 6px;
  font-size:10px;
  line-height:1.4;
}

.related-price{
  color:var(--primary);
  font-size:10px;
  font-weight:950;
}


/* =================================
LOADING
================================= */

.loading{
  min-height:500px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--muted);
  font-size:10px;
}

.spinner{
  width:30px;
  height:30px;

  margin-right:10px;

  border:3px solid #d1fae5;
  border-top-color:var(--primary);

  border-radius:50%;

  animation:spin .8s linear infinite;
}


/* =================================
TOAST
================================= */

.toast{
  position:fixed;

  right:20px;
  bottom:20px;

  z-index:999;

  padding:12px 15px;

  background:#172033;
  color:#fff;

  border-radius:9px;

  font-size:9px;
  font-weight:900;

  transform:
    translateY(100px);

  opacity:0;

  transition:.3s;
}

.toast.show{
  transform:
    translateY(0);

  opacity:1;
}


/* =================================
ANIMATIONS
================================= */

@keyframes fadeUp{

from{
  opacity:0;
  transform:translateY(18px);
}

to{
  opacity:1;
  transform:translateY(0);
}

}

@keyframes spin{

to{
  transform:rotate(360deg);
}

}


/* =================================
RESPONSIVE
================================= */

@media(max-width:900px){

.product-layout{
  grid-template-columns:1fr;
}

.main-image-wrap{
  height:400px;
}

.related-grid{
  grid-template-columns:
    repeat(3,1fr);
}

}

@media(max-width:700px){

.nav-links a:not(.seller-btn){
  display:none;
}

.container{
  padding-left:12px;
  padding-right:12px;
}

.details h1{
  font-size:26px;
}

.info-grid{
  grid-template-columns:1fr 1fr;
}

.related-grid{
  grid-template-columns:
    repeat(2,1fr);
}

}

@media(max-width:480px){

.main-image-wrap{
  height:300px;
}

.actions{
  grid-template-columns:1fr;
}

.info-grid{
  grid-template-columns:1fr;
}

.related-grid{
  grid-template-columns:1fr 1fr;
}

}

</style>
</head>


<body>


<header class="header">

<nav class="nav">

<a
href="index.html"
class="logo">

LetsStudy Pro

</a>


<div class="nav-links">

<a href="marketplace.html">
Marketplace
</a>

<a href="marketplace-search.html">
Search
</a>

<a href="cart.html">
Cart 🛒
</a>

<a
href="products.html"
class="seller-btn">

Seller · Products

</a>

</div>

</nav>

</header>



<main
class="container"
id="app">

<div class="loading">

<div class="spinner"></div>

Loading product...

</div>

</main>



<div
id="toast"
class="toast">
</div>



<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
getDocs,
query,
where,
limit
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =================================
FIREBASE
================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rj0odBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =================================
HELPERS
================================= */

const $=
id=>document.getElementById(id);


function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function money(
amount,
currency="USD"
){

const value=
Number(amount||0);

if(value===0)
return "Free";

try{

return new Intl.NumberFormat(
undefined,
{
style:"currency",
currency:currency||"USD",
maximumFractionDigits:2
}
).format(value);

}catch{

return `${currency||""} ${value}`;

}

}


function toast(message){

const el=$("toast");

el.textContent=message;

el.classList.add("show");

setTimeout(
()=>el.classList.remove("show"),
2500
);

}


/* =================================
PRODUCT ID
================================= */

const params=
new URLSearchParams(
location.search
);

const productId=
params.get("productId") ||
params.get("id");


/* =================================
LOAD PRODUCT
================================= */

async function loadProduct(){

if(!productId){

showError(
"Product not specified."
);

return;

}


try{

const ref=
doc(
db,
"marketplace",
productId
);

const snap=
await getDoc(ref);


if(!snap.exists()){

showError(
"Product not found."
);

return;

}


const product={
id:snap.id,
...snap.data()
};


if(
product.status &&
product.status!=="published"
){

showError(
"This product is currently unavailable."
);

return;

}


renderProduct(product);

loadRelated(product);

}catch(error){

console.error(error);

showError(
"Unable to load product."
);

}

}


/* =================================
RENDER PRODUCT
================================= */

function renderProduct(product){

const price=
Number(
product.price||0
);

const discount=
Number(
product.discountPrice||0
);

const hasDiscount=
discount>0 &&
discount<price;

const currentPrice=
hasDiscount
?discount
:price;

const rating=
Number(
product.rating||0
);

const ratingCount=
Number(
product.ratingCount||0
);

const sales=
Number(
product.salesCount||0
);

const image=
product.imageUrl ||
product.thumbnail ||
"";


$("app").innerHTML=`

<div class="breadcrumb">

<a href="index.html">
Home
</a>

&nbsp; / &nbsp;

<a href="marketplace.html">
Marketplace
</a>

&nbsp; / &nbsp;

${escapeHTML(
product.category||"Product"
)}

&nbsp; / &nbsp;

Product

</div>


<div class="product-layout">


<!-- =============================
GALLERY
============================= -->

<section class="gallery">

<div class="main-image-wrap">

${
image
?
`
<img
id="mainImage"
class="main-image"
src="${escapeHTML(image)}"
alt="${escapeHTML(product.title)}"
onerror="this.style.display='none'">
`
:
`
<div
class="image-placeholder">
🛍️
</div>
`
}


${
product.featured
?
`
<span class="badge">
★ Featured
</span>
`
:
""
}

</div>


<div class="thumbnails">

${
image
?
`
<img
class="thumb active"
src="${escapeHTML(image)}"
alt="Product image"
onclick="changeImage(this)">
`
:
""
}

${
product.thumbnail &&
product.thumbnail!==image
?
`
<img
class="thumb"
src="${escapeHTML(product.thumbnail)}"
alt="Product thumbnail"
onclick="changeImage(this)">
`
:
""
}

</div>

</section>



<!-- =============================
DETAILS
============================= -->

<section class="details">

<span class="type">

${escapeHTML(
product.type||"Digital Product"
)}

</span>


<h1>

${escapeHTML(
product.title ||
"Untitled Product"
)}

</h1>


<p class="short-description">

${escapeHTML(
product.shortDescription ||
"Explore this product from LetsStudy Pro Marketplace."
)}

</p>


<div class="meta">

<div class="rating">

${rating>0
?`★ ${rating.toFixed(1)}`
:"No rating"
}

<span>
(${ratingCount} reviews)
</span>

</div>


<div class="meta-item">
🔥 ${sales} sales
</div>


${
product.category
?
`
<div class="meta-item">
${escapeHTML(product.category)}
</div>
`
:""
}

</div>



<div class="price-box">

<span class="price">

${money(
currentPrice,
product.currency
)}

</span>


${
hasDiscount
?
`
<span class="old-price">

${money(
price,
product.currency
)}

</span>

<span class="sale">

${Math.round(
((price-discount)/price)*100
)}% OFF

</span>
`
:
""
}

</div>



<div class="actions">

<button
id="cartBtn"
class="action-btn cart-btn">

🛒 Add to Cart

</button>


<button
id="buyBtn"
class="action-btn buy-btn">

Buy Now →

</button>

</div>



<a
href="products.html"
class="seller-products">

🏪 Seller · Manage Products

</a>



<div class="info-grid">


<div class="info">

<div class="info-icon">
⚡
</div>

<strong>
Instant Access
</strong>

<span>
Access after purchase
</span>

</div>


<div class="info">

<div class="info-icon">
🔒
</div>

<strong>
Secure Checkout
</strong>

<span>
Protected payment
</span>

</div>


<div class="info">

<div class="info-icon">
📱
</div>

<strong>
Digital Friendly
</strong>

<span>
Works across devices
</span>

</div>


</div>


</section>

</div>



<!-- =============================
DESCRIPTION
============================= -->

<section class="content-section">

<div class="section-title">

<h2>
About this product
</h2>

<p>
Everything you need to know.
</p>

</div>


<div class="description-card">

${formatDescription(
product.description ||
product.shortDescription ||
"No description available."
)}

</div>

</section>



<!-- =============================
RELATED
============================= -->

<section class="content-section">

<div class="section-title">

<h2>
You may also like
</h2>

<p>
More products from the marketplace.
</p>

</div>


<div
id="relatedGrid"
class="related-grid">

</div>

</section>

`;


$("cartBtn")
.addEventListener(
"click",
()=>addToCart(product)
);


$("buyBtn")
.addEventListener(
"click",
()=>buyNow(product)
);

}


/* =================================
DESCRIPTION
================================= */

function formatDescription(
text
){

return escapeHTML(text)
.replace(/\n/g,"<br>");

}


/* =================================
CHANGE IMAGE
================================= */

window.changeImage=
function(img){

const main=
$("mainImage");

if(!main)
return;

main.src=
img.src;

document
.querySelectorAll(".thumb")
.forEach(
item=>
item.classList.remove(
"active"
)
);

img.classList.add(
"active"
);

};


/* =================================
CART
================================= */

function addToCart(product){

const cart=
JSON.parse(
localStorage.getItem(
"letsstudy_cart"
)||"[]"
);


const existing=
cart.find(
item=>
item.id===product.id
);


if(existing){

existing.quantity=
Number(
existing.quantity||1
)+1;

}else{

cart.push({

id:product.id,

title:
product.title,

price:
Number(
product.discountPrice>0 &&
product.discountPrice<
product.price
?
product.discountPrice
:
product.price||0
),

currency:
product.currency||"USD",

thumbnail:
product.thumbnail||
product.imageUrl||
"",

quantity:1,

type:
product.type||"product"

});

}


localStorage.setItem(
"letsstudy_cart",
JSON.stringify(cart)
);


toast(
"Product added to cart."
);

}


/* =================================
BUY NOW
================================= */

function buyNow(product){

addToCart(product);

setTimeout(
()=>{

location.href=
"checkout.html";

},
300
);

}


/* =================================
RELATED PRODUCTS
================================= */

async function loadRelated(product){

const grid=
$("relatedGrid");

if(!grid)
return;


try{

const snap=
await getDocs(
query(
collection(
db,
"marketplace"
),
where(
"status",
"==",
"published"
),
limit(12)
)
);


const related=
snap.docs
.map(
doc=>({

id:doc.id,
...doc.data()

})
)
.filter(
item=>
item.id!==product.id &&
(
!product.category ||
item.category===product.category
)
)
.slice(0,4);


if(!related.length){

grid.innerHTML=`
<div
style="
grid-column:1/-1;
padding:25px;
color:#667085;
font-size:10px;">
No related products found.
</div>
`;

return;

}


grid.innerHTML=
related
.map(
item=>{

const price=
Number(
item.discountPrice>0 &&
item.discountPrice<item.price
?
item.discountPrice
:
item.price||0
);


const img=
item.thumbnail||
item.imageUrl||
"";


return `

<a
class="related-card"
href="marketplace-product.html?productId=${encodeURIComponent(item.id)}">


${
img
?
`
<img
class="related-image"
src="${escapeHTML(img)}"
alt="${escapeHTML(item.title)}"
loading="lazy">
`
:
`
<div
class="related-image"
style="
display:flex;
align-items:center;
justify-content:center;
font-size:35px;">
🛍️
</div>
`
}


<div class="related-body">

<h3>

${escapeHTML(
item.title
)}

</h3>


<div class="related-price">

${money(
price,
item.currency
)}

</div>

</div>

</a>

`;

}
)
.join("");


}catch(error){

console.error(
"Related products:",
error
);

}

}


/* =================================
ERROR
================================= */

function showError(
message
){

$("app").innerHTML=`

<div
style="
min-height:450px;
display:flex;
align-items:center;
justify-content:center;
