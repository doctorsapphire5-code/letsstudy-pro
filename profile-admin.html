<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Admin Profile | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Administrator profile for Let'sStudy Pro."
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #687386;
      --border: #e2e7ef;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #15803d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    .header {
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 800;
      font-size: 18px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: var(--primary);
      color: white;
    }

    .back {
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;
    }

    .container {
      width: 100%;
      max-width: 850px;

      margin: 0 auto;

      padding: 30px 20px;
    }

    .title {
      margin-bottom: 22px;
    }

    .title h1 {
      margin: 0 0 6px;
      font-size: 27px;
    }

    .title p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .profile-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 15px 40px rgba(15, 23, 42, .08);
    }

    .profile-top {
      padding: 28px;

      display: flex;
      align-items: center;

      gap: 18px;

      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 82px;
      height: 82px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: var(--primary);
      color: white;

      font-size: 30px;
      font-weight: 800;
    }

    .profile-name {
      margin: 0 0 5px;
      font-size: 21px;
    }

    .profile-email {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 14px;
      word-break: break-word;
    }

    .badge {
      display: inline-flex;
      align-items: center;

      padding: 5px 10px;

      border-radius: 999px;

      background: #eff6ff;
      color: var(--primary);

      font-size: 12px;
      font-weight: 750;
    }

    .section {
      padding: 26px 28px;
    }

    .section + .section {
      border-top: 1px solid var(--border);
    }

    .section h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 47px;

      padding: 11px 13px;

      border: 1px solid var(--border);
      border-radius: 10px;

      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, .12);
    }

    input[readonly] {
      background: #f8fafc;
      color: var(--muted);
    }

    .save {
      min-height: 47px;

      padding: 10px 18px;

      border: 0;
      border-radius: 10px;

      background: var(--primary);
      color: white;

      font-weight: 700;

      cursor: pointer;
    }

    .save:hover {
      background: var(--primary-dark);
    }

    .save:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .info-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 15px;
    }

    .info {
      padding: 15px;

      border: 1px solid var(--border);

      border-radius: 12px;
    }

    .info-label {
      margin-bottom: 5px;

      color: var(--muted);

      font-size: 12px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 650;

      word-break: break-word;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .action {
      min-height: 44px;

      padding: 10px 16px;

      border-radius: 10px;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;
    }

    .action.primary {
      background: var(--primary);
      color: white;
    }

    .action.danger {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .message {
      display: none;

      margin-bottom: 18px;

      padding: 11px 13px;

      border-radius: 10px;

      font-size: 14px;
    }

    .message.success {
      display: block;

      background: #f0fdf4;
      color: var(--success);
    }

    .message.error {
      display: block;

      background: #fef2f2;
      color: var(--danger);
    }

    footer {
      padding: 25px;

      text-align: center;

      color: var(--muted);

      font-size: 12px;
    }

    @media (max-width: 600px) {

      .header {
        padding: 0 14px;
      }

      .container {
        padding: 22px 14px;
      }

      .profile-top {
        padding: 22px;

        flex-direction: column;

        text-align: center;
      }

      .section {
        padding: 22px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .action {
        text-align: center;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <div class="brand">

    <div
      class="brand-icon"
      aria-hidden="true"
    >
      🛡️
    </div>

    <span>Let'sStudy Pro</span>

  </div>

  <a
    href="admin-dashboard.html"
    class="back"
  >
    ← Dashboard
  </a>

</header>


<main class="container">

  <div class="title">

    <h1>Admin Profile</h1>

    <p>
      Manage your administrator account information.
    </p>

  </div>


  <section class="profile-card">

    <div class="profile-top">

      <div
        id="avatar"
        class="avatar"
        aria-label="Admin profile avatar"
      >
        A
      </div>

      <div>

        <h2
          id="profileName"
          class="profile-name"
        >
          Loading...
        </h2>

        <p
          id="profileEmail"
          class="profile-email"
        >
          Loading...
        </p>

        <span class="badge">
          🛡️ Administrator
        </span>

      </div>

    </div>


    <div class="section">

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>


      <h2>Personal Information</h2>

      <form id="profileForm">

        <div class="field">

          <label for="name">
            Full Name
          </label>

          <input
            id="name"
            type="text"
            autocomplete="name"
            required
          >

        </div>


        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            id="email"
            type="email"
            readonly
            aria-readonly="true"
          >

        </div>


        <button
          id="saveBtn"
          class="save"
          type="submit"
        >
          Save Changes
        </button>

      </form>

    </div>


    <div class="section">

      <h2>Account Information</h2>

      <div class="info-grid">

        <div class="info">

          <div class="info-label">
            Account Role
          </div>

          <div
            id="role"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            Account Status
          </div>

          <div
            id="status"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            Firebase UID
          </div>

          <div
            id="uid"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            Created
          </div>

          <div
            id="created"
            class="info-value"
          >
            —
          </div>

        </div>

      </div>

    </div>


    <div class="section">

      <h2>Security</h2>

      <div class="actions">

        <a
          href="forgot-password-admin.html"
          class="action primary"
        >
          🔐 Reset Password
        </a>

        <a
          href="logout-admin.html"
          class="action danger"
        >
          🚪 Logout
        </a>

      </div>

    </div>

  </section>


  <footer>
    © <span id="year"></span> Let'sStudy Pro
  </footer>

</main>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    updateDoc
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================
     FIREBASE
  ========================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================
     DOM
  ========================== */

  const nameInput =
    document.getElementById("name");

  const emailInput =
    document.getElementById("email");

  const profileName =
    document.getElementById("profileName");

  const profileEmail =
    document.getElementById("profileEmail");

  const avatar =
    document.getElementById("avatar");

  const role =
    document.getElementById("role");

  const status =
    document.getElementById("status");

  const uid =
    document.getElementById("uid");

  const created =
    document.getElementById("created");

  const form =
    document.getElementById("profileForm");

  const saveBtn =
    document.getElementById("saveBtn");

  const message =
    document.getElementById("message");


  document.getElementById("year").textContent =
    new Date().getFullYear();


  /* =========================
     MESSAGE
  ========================== */

  function showMessage(
    text,
    type
  ) {

    message.textContent = text;

    message.className =
      `message ${type}`;
  }


  /* =========================
     AVATAR
  ========================== */

  function setAvatar(name) {

    const clean =
      (name || "Admin").trim();

    const first =
      clean.charAt(0).toUpperCase();

    avatar.textContent =
      first || "A";
  }


  /* =========================
     DATE
  ========================== */

  function formatDate(timestamp) {

    if (!timestamp) {
      return "Not available";
    }

    try {

      return timestamp
        .toDate()
        .toLocaleDateString(
          undefined,
          {
            year: "numeric",
            month: "long",
            day: "numeric"
          }
        );

    } catch {

      return "Not available";
    }
  }


  /* =========================
     LOAD ADMIN PROFILE
  ========================== */

  async function loadProfile(user) {

    try {

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );

      const snapshot =
        await getDoc(userRef);


      const data =
        snapshot.exists()
          ? snapshot.data()
          : {};


      const displayName =
        data.name ||
        user.displayName ||
        "Administrator";


      profileName.textContent =
        displayName;

      profileEmail.textContent =
        user.email || "No email";

      nameInput.value =
        displayName;

      emailInput.value =
        user.email || "";


      role.textContent =
        data.role || "admin";


      status.textContent =
        data.status || "active";


      uid.textContent =
        user.uid;


      created.textContent =
        formatDate(data.createdAt);


      setAvatar(displayName);


      /* =========================
         SECURITY CHECK
      ========================== */

      if (
        data.role &&
        data.role !== "admin"
      ) {

        window.location.replace(
          "login-admin.html"
        );
      }


    } catch (error) {

      console.error(
        "Profile loading error:",
        error
      );

      showMessage(
        "Unable to load your profile.",
        "error"
      );
    }
  }


  /* =========================
     AUTH STATE
  ========================== */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        window.location.replace(
          "login-admin.html"
        );

        return;
      }


      await loadProfile(user);
    }
  );


  /* =========================
     UPDATE PROFILE
  ========================== */

  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const user =
        auth.currentUser;


      if (!user) {

        window.location.replace(
          "login-admin.html"
        );

        return;
      }


      const name =
        nameInput.value.trim();


      if (!name) {

        showMessage(
          "Please enter your full name.",
          "error"
        );

        nameInput.focus();

        return;
      }


      saveBtn.disabled = true;

      saveBtn.textContent =
        "Saving...";


      try {

        /* Update Firebase Auth */

        await updateProfile(
          user,
          {
            displayName: name
          }
        );


        /* Update Firestore */

        await updateDoc(
          doc(
            db,
            "users",
            user.uid
          ),
          {
            name: name
          }
        );


        profileName.textContent =
          name;

        setAvatar(name);


        showMessage(
          "Profile updated successfully.",
          "success"
        );


      } catch (error) {

        console.error(
          "Profile update error:",
          error
        );

        showMessage(
          "Unable to update your profile.",
          "error"
        );

      } finally {

        saveBtn.disabled = false;

        saveBtn.textContent =
          "Save Changes";
      }

    }
  );

</script>

</body>
</html>
