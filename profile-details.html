<style>
:root{--blue:#2563eb;--blue-d:#1d4ed8;--ink:#172033;--mute:#64748b;--line:#e5e7eb;--bg:#f5f7fb}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.nav{max-width:960px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:21px;font-weight:900;color:var(--blue);text-decoration:none;letter-spacing:-.02em}
.back{text-decoration:none;color:#475569;font-weight:700;padding:8px 14px;border-radius:999px}
.back:hover{background:#eff6ff;color:var(--blue-d)}

main{max-width:960px;margin:28px auto 60px;padding:0 20px}
.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,.07)}

.cover{height:clamp(140px,26vw,260px);background:linear-gradient(135deg,#1d4ed8,#7c3aed) center/cover no-repeat}
.head{padding:0 28px 26px;position:relative}
.avatar{width:120px;height:120px;border-radius:50%;border:5px solid #fff;margin-top:-60px;background:#dbeafe;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:var(--blue);box-shadow:0 6px 20px rgba(15,23,42,.15)}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:12px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere}
.user{color:var(--mute);font-weight:600;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#f1f5f9;color:#334155;border:1px solid var(--line)}
.btn.ghost:hover{background:#e2e8f0}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;color:var(--mute);font-size:14px}
.facts a{color:var(--blue-d);font-weight:700;text-decoration:none;overflow-wrap:anywhere}
.facts a:hover{text-decoration:underline}
.bio{margin-top:16px;font-size:16px;color:#334155;white-space:pre-line;overflow-wrap:anywhere}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.stat{padding:18px 8px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--mute);font-weight:700}

.section{padding:24px 28px;border-top:1px solid var(--line)}
.section h2{font-size:16px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#eff6ff;color:var(--blue-d);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:10px}
.link{padding:9px 15px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);text-decoration:none;font-size:14px;font-weight:700;color:#334155}
.link:hover{border-color:var(--blue);color:var(--blue-d)}

.state{background:#fff;padding:48px 20px;border-radius:20px;text-align:center;box-shadow:0 8px 30px rgba(15,23,42,.06)}
.state h2{margin-bottom:6px}
.state p{color:var(--mute);margin-bottom:16px}
.sk i{display:block;border-radius:8px;background:linear-gradient(90deg,#eceff4 25%,#f6f8fb 37%,#eceff4 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

.letsstudy-ad-container{width:100%;margin:24px auto;text-align:center}
.letsstudy-ad{width:100%;margin:0 auto;text-align:center}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:999}
footer{padding:30px 20px;text-align:center;color:var(--mute);font-size:14px}

@media(max-width:600px){
  main{margin-top:16px}
  .head{padding:0 18px 22px}
  .avatar{width:96px;height:96px;margin-top:-48px;font-size:38px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .section{padding:20px 18px}
  .actions,.actions .btn{width:100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body>

<main><h1>Profile · LetsStudy Pro</h1>

  <div id="loading" class="card sk" aria-hidden="true">
    <i style="height:200px;border-radius:0"></i>
    <div style="padding:0 28px 28px">
      <i style="width:110px;height:110px;border-radius:50%;margin-top:-55px;border:5px solid #fff"></i>
      <i style="width:50%;height:30px;margin-top:16px"></i>

  <article id="profile" class="card" hidden="">
    <div id="cover" class="cover" role="img" aria-label="Cover photo"></div>

    <div class="head">
      <div id="avatar" class="avatar" aria-hidden="true"></div>

      <div class="row">
        <div>
          <h1 id="name"></h1>
          <div id="username" class="user" hidden=""></div>
        </div>
        <div class="actions">
          <button id="shareBtn" class="btn" type="button">Share profile</button>
          <a id="siteBtn" class="btn ghost" href="#" target="_blank" rel="noopener noreferrer nofollow" hidden="">Visit website</a>
        </div>

      <div class="facts">

    </div>

    <div class="stats">
      <div class="stat"><b id="posts">0</b><span>Posts</span></div>
      <div class="stat"><b id="followers">0</b><span>Followers</span></div>
      <div class="stat"><b id="following">0</b><span>Following</span></div>
      <div class="stat"><b id="connections">0</b><span>Connections</span></div>
    </div>

    <section id="interestsBox" class="section" hidden="">
      <h2>Interests</h2>
      <div id="interests" class="chips"></div>
    </section>

  </article>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, limit, getDocs }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};
const db = getFirestore(initializeApp(firebaseConfig));

const $ = id => document.getElementById(id);
$("year").textContent = new Date().getFullYear();

const params = new URLSearchParams(location.search);
const key = (params.get("id") || params.get("username") || params.get("user") || "").trim();

/* ---------- helpers ---------- */
const text = v => String(v ?? "").trim();

function normUrl(v){
  const s = text(v);
  if (/^https?:\/\//i.test(s)) return s;
  if (/^(www\.)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(s)) return "https://" + s;
  return "";
}

function num(v){
  const n = Number(String(v ?? "").replace(/[, ]/g, ""));
  if (!Number.isFinite(n) || n < 0) return "0";
  return n >= 1e6 ? (n/1e6).toFixed(1).replace(".0","") + "M"
       : n >= 1e3 ? (n/1e3).toFixed(1).replace(".0","") + "K" : String(Math.floor(n));
}

function toDate(v){
  const s = text(v);
  if (!s) return null;
  const d = /^\d{10,13}$/.test(s) ? new Date(s.length === 10 ? Number(s) * 1000 : Number(s)) : new Date(s);
  return isNaN(d) ? null : d;
}

/* interests: JSON array, or comma / semicolon / new-line list */
function toList(v){
  const s = text(v);
  if (!s) return [];
  try{ const j = JSON.parse(s); if (Array.isArray(j)) return j.map(text).filter(Boolean); }catch{}
  return s.split(/[,;\n]+/).map(x => x.trim().replace(/^#/, "")).filter(Boolean);
}

const SITES = [["instagram","Instagram"],["facebook","Facebook"],["fb.com","Facebook"],["twitter","X"],["x.com","X"],
  ["linkedin","LinkedIn"],["youtube","YouTube"],["youtu.be","YouTube"],["tiktok","TikTok"],["github","GitHub"],
  ["wa.me","WhatsApp"],["whatsapp","WhatsApp"],["t.me","Telegram"],["telegram","Telegram"]];

function labelOf(url){
  const host = new URL(url).hostname.replace(/^www\./, "").toLowerCase();
  const hit = SITES.find(([k]) => host.includes(k));
  return hit ? hit[1] : host;
}

/* socialLinks: JSON object / array of links, or a plain list of URLs */
function parseLinks(v){
  const s = text(v);
  if (!s) return [];
  let raw;
  try{
    const j = JSON.parse(s);
    raw = Array.isArray(j) ? j : (j && typeof j === "object" ? Object.values(j) : [s]);
  }catch{ raw = s.split(/[\s,;]+/); }
  const seen = new Set();
  return raw.map(x => normUrl(typeof x === "object" ? (x?.url || x?.link) : x))
    .filter(u => u && !seen.has(u) && seen.add(u))
    .map(u => ({ url: u, label: labelOf(u) }));
}

function setMeta(sel, value){ const m = document.querySelector(sel); if (m) m.setAttribute("content", value); }

function showError(title, msg){
  $("loading").hidden = true;
  $("profile").hidden = true;
  $("errorTitle").textContent = title;
  $("errorText").textContent = msg;
  $("error").hidden = false;
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 2200);
}

/* ---------- load ---------- */
async function findProfile(k){
  const direct = await getDoc(doc(db, "profiles", k));
  if (direct.exists()) return direct.data();
  for (const field of ["userId", "username"]){
    const q = await getDocs(query(collection(db, "profiles"), where(field, "==", k), limit(1)));
    if (!q.empty) return q.docs[0].data();
  }
  return null;
}

async function load(){
  if (!key) return showError("Profile not found", "Open a profile from search or from a member's link.");

  try{
    const d = await findProfile(key);
    if (!d) return showError("Profile not found", "This profile doesn't exist or was removed.");

    const name = text(d.displayName) || text(d.username) || "LetsStudy Member";
    const username = text(d.username).replace(/^@/, "");
    const bio = text(d.bio);
    const photo = normUrl(d.photoURL);
    const cover = normUrl(d.coverPhoto);
    const site = normUrl(d.website);
    const links = parseLinks(d.socialLinks);
    const interests = toList(d.interests);
    const since = toDate(d.createdAt);

    /* header */
    $("name").textContent = name;
    if (username){ $("username").textContent = "@" + username; $("username").hidden = false; }

    const av = $("avatar");
    if (photo){
      const img = document.createElement("img");
      img.src = photo; img.alt = name; img.className = "avatar";
      img.addEventListener("error", () => img.replaceWith(av), { once: true });
      av.replaceWith(img);
      av.textContent = name.charAt(0).toUpperCase();
    }else{
      av.textContent = name.charAt(0).toUpperCase();
    }
    if (cover) $("cover").style.backgroundImage = `url("${cover.replace(/"/g, "%22")}")`;

    /* facts */
    if (text(d.location)){ $("location").textContent = "📍 " + text(d.location); $("location").hidden = false; }
    if (site){
      const w = $("website");
      w.href = site; w.textContent = "🔗 " + new URL(site).hostname.replace(/^www\./, ""); w.hidden = false;
      const b = $("siteBtn"); b.href = site; b.hidden = false;
    }
    if (since){
      $("since").textContent = "📅 Joined " + since.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
      $("since").hidden = false;
    }
    if (bio){ $("bio").textContent = bio; $("bio").hidden = false; }

    /* stats */
    $("posts").textContent = num(d.postCount);
    $("followers").textContent = num(d.followerCount);
    $("following").textContent = num(d.followingCount);
    $("connections").textContent = num(d.connectionCount);

    /* interests + links */
    if (interests.length){
      const box = $("interests");
      interests.slice(0, 20).forEach(t => { const s = document.createElement("span"); s.className = "chip"; s.textContent = t; box.appendChild(s); });
      $("interestsBox").hidden = false;
    }
    if (links.length){
      const box = $("links");
      links.slice(0, 12).forEach(l => {
        const a = document.createElement("a");
        a.className = "link"; a.href = l.url; a.textContent = l.label;
        a.target = "_blank"; a.rel = "noopener noreferrer nofollow";
        box.appendChild(a);
      });
      $("linksBox").hidden = false;
    }

    /* SEO + sharing */
    const title = `${name}${username ? " (@" + username + ")" : ""} · LetsStudy Pro`;
    const desc = (bio || `${name} on LetsStudy Pro`).replace(/\s+/g, " ").slice(0, 160);
    document.title = title;
    setMeta('meta[name="description"]', desc);
    setMeta('meta[property="og:title"]', title);
    setMeta('meta[property="og:description"]', desc);
    if (photo){ setMeta('meta[property="og:image"]', photo); setMeta('meta[name="twitter:image"]', photo); }

    const ld = document.createElement("script");
    ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org", "@type": "ProfilePage",
      mainEntity: { "@type": "Person", name, alternateName: username || undefined,
        description: bio || undefined, image: photo || undefined, url: site || undefined,
        sameAs: links.map(l => l.url) }
    });
    document.head.appendChild(ld);

    $("shareBtn").onclick = async () => {
      try{
        if (navigator.share){ await navigator.share({ title, text: desc, url: location.href }); return; }
        await navigator.clipboard.writeText(location.href);
        toast("Profile link copied");
      }catch(err){
        if (err?.name !== "AbortError") toast("Couldn't share this profile");
      }
    };

    $("loading").hidden = true;
    $("profile").hidden = false;

  }catch(err){
    console.error(err);
    showError("Unable to load this profile", "Check your connection and try again.");
  }
}

load();

</script>
