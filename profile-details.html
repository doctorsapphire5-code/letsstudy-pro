<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Profile | LetsStudy Pro</title>

<meta name="description" content="Profile details on LetsStudy Pro.">
<meta name="theme-color" content="#2563eb">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.6;
}

.header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  text-decoration:none;
  color:#111827;
  font-size:21px;
  font-weight:800;
}

.back{
  color:#2563eb;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.container{
  max-width:1000px;
  margin:35px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(15,23,42,.06);
}

.cover{
  height:190px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
}

.profile{
  padding:0 32px 30px;
}

.avatar{
  width:130px;
  height:130px;
  margin-top:-65px;
  border-radius:50%;
  background:#eef2f7;
  border:6px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:55px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name-row{
  margin-top:15px;
}

.badge{
  display:inline-block;
  background:#eff6ff;
  color:#2563eb;
  padding:5px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  margin-bottom:8px;
}

h1{
  font-size:30px;
  line-height:1.2;
  margin-bottom:6px;
}

.headline{
  color:#64748b;
  font-size:15px;
}

.content{
  padding:30px 32px;
  border-top:1px solid #edf0f4;
}

.section{
  margin-bottom:30px;
}

.section:last-child{
  margin-bottom:0;
}

.section h2{
  font-size:20px;
  margin-bottom:12px;
}

.bio{
  color:#475569;
  white-space:pre-line;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.info{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
}

.label{
  color:#64748b;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:4px;
}

.value{
  font-size:14px;
  font-weight:700;
  word-break:break-word;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.btn{
  display:inline-block;
  padding:11px 17px;
  border-radius:9px;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2ff;
  color:#3730a3;
}

.loading{
  min-height:350px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

.error{
  padding:50px 25px;
  text-align:center;
}

.error h2{
  margin-bottom:8px;
}

.error p{
  color:#64748b;
}

.footer{
  text-align:center;
  padding:30px 15px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){

  .header{
    padding:0 15px;
  }

  .container{
    margin:20px auto;
  }

  .cover{
    height:140px;
  }

  .profile{
    padding:0 22px 25px;
  }

  .avatar{
    width:110px;
    height:110px;
    margin-top:-55px;
  }

  h1{
    font-size:26px;
  }

  .content{
    padding:24px 22px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    LetsStudy Pro
  </a>

  <a href="search.html" class="back">
    ← Back to Search
  </a>

</header>


<main class="container">

  <article class="card" id="profileCard">

    <div class="loading">
      Loading profile...
    </div>

  </article>

</main>


<footer class="footer">
  © LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const profileCard =
  document.getElementById("profileCard");


const params =
  new URLSearchParams(
    window.location.search
  );

const profileId =
  params.get("id");


function first(data,fields){

  for(const field of fields){

    const value =
      data[field];

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value);

    }

  }

  return "";

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeURL(value){

  if(!value) return "";

  try{

    const url =
      new URL(
        value,
        window.location.href
      );

    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return url.href;

    }

  }catch(error){}

  return "";

}


function renderProfile(data){

  const name =
    first(data,[
      "name",
      "fullName",
      "displayName",
      "username",
      "title"
    ]) ||
    "Profile";


  const headline =
    first(data,[
      "headline",
      "profession",
      "role",
      "occupation",
      "position"
    ]);


  const bio =
    first(data,[
      "bio",
      "about",
      "description",
      "details",
      "content"
    ]) ||
    "Welcome to this profile on LetsStudy Pro.";


  const image =
    first(data,[
      "photoURL",
      "photo",
      "avatar",
      "avatarUrl",
      "image",
      "imageUrl",
      "profileImage",
      "profilePhoto"
    ]);


  const location =
    first(data,[
      "location",
      "country",
      "city",
      "address"
    ]);


  const organization =
    first(data,[
      "organization",
      "company",
      "school",
      "institution",
      "business"
    ]);


  const category =
    first(data,[
      "category",
      "field",
      "industry",
      "specialization"
    ]);


  const email =
    first(data,[
      "email",
      "contactEmail"
    ]);


  const website =
    safeURL(
      first(data,[
        "website",
        "websiteUrl",
        "url",
        "link"
      ])
    );


  const linkedin =
    safeURL(
      first(data,[
        "linkedin",
        "linkedinUrl"
      ])
    );


  const imageHTML = image

    ? `
      <img
        src="${escapeHTML(image)}"
        alt="${escapeHTML(name)}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        style="display:none;width:100%;height:100%;
        align-items:center;justify-content:center;"
      >
        👤
      </div>
    `

    : `
      <div>
        👤
      </div>
    `;


  let infoHTML = "";


  if(headline){

    infoHTML += `
      <div class="info">

        <div class="label">
          Profession / Role
        </div>

        <div class="value">
          ${escapeHTML(headline)}
        </div>

      </div>
    `;

  }


  if(organization){

    infoHTML += `
      <div class="info">

        <div class="label">
          Organization
        </div>

        <div class="value">
          ${escapeHTML(organization)}
        </div>

      </div>
    `;

  }


  if(category){

    infoHTML += `
      <div class="info">

        <div class="label">
          Field
        </div>

        <div class="value">
          ${escapeHTML(category)}
        </div>

      </div>
    `;

  }


  if(location){

    infoHTML += `
      <div class="info">

        <div class="label">
          Location
        </div>

        <div class="value">
          ${escapeHTML(location)}
        </div>

      </div>
    `;

  }


  if(email){

    infoHTML += `
      <div class="info">

        <div class="label">
          Email
        </div>

        <div class="value">
          ${escapeHTML(email)}
        </div>

      </div>
    `;

  }


  let actionsHTML = "";


  if(email){

    actionsHTML += `
      <a
        class="btn primary"
        href="mailto:${escapeHTML(email)}"
      >
        Contact
      </a>
    `;

  }


  if(website){

    actionsHTML += `
      <a
        class="btn secondary"
        href="${escapeHTML(website)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Website →
      </a>
    `;

  }


  if(linkedin){

    actionsHTML += `
      <a
        class="btn secondary"
        href="${escapeHTML(linkedin)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
      </a>
    `;

  }


  profileCard.innerHTML = `

    <div class="cover"></div>


    <section class="profile">

      <div class="avatar">
        ${imageHTML}
      </div>


      <div class="name-row">

        <span class="badge">
          PROFILE
        </span>

        <h1>
          ${escapeHTML(name)}
        </h1>

        ${
          headline
          ? `
            <div class="headline">
              ${escapeHTML(headline)}
            </div>
          `
          : ""
        }

      </div>

    </section>


    <section class="content">

      <div class="section">

        <h2>
          About
        </h2>

        <div class="bio">
          ${escapeHTML(bio)}
        </div>

      </div>


      ${
        infoHTML
        ? `
          <div class="section">

            <h2>
              Profile Information
            </h2>

            <div class="info-grid">
              ${infoHTML}
            </div>

          </div>
        `
        : ""
      }


      ${
        actionsHTML
        ? `
          <div class="section">

            <h2>
              Connect
            </h2>

            <div class="actions">
              ${actionsHTML}
            </div>

          </div>
        `
        : ""
      }

    </section>

  `;


  document.title =
    name + " | LetsStudy Pro";

}


async function loadProfile(){

  if(!profileId){

    profileCard.innerHTML = `

      <div class="error">

        <h2>
          Profile not found
        </h2>

        <p>
          No profile ID was provided.
        </p>

      </div>

    `;

    return;

  }


  try{

    const profileRef =
      doc(
        db,
        "profiles",
        profileId
      );


    const snapshot =
      await getDoc(profileRef);


    if(!snapshot.exists()){

      profileCard.innerHTML = `

        <div class="error">

          <h2>
            Profile not found
          </h2>

          <p>
            The requested profile could not be found.
          </p>

        </div>

      `;

      return;

    }


    renderProfile(
      snapshot.data()
    );


  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );


    profileCard.innerHTML = `

      <div class="error">

        <h2>
          Unable to load profile
        </h2>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


loadProfile();

</script>

</body>
</html>
