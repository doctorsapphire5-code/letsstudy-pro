<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Profile | LetsStudy Pro</title>

<meta name="description"
content="LetsStudy Pro user profile, videos, playlists, courses, certificates and activity.">

<link rel="icon" href="/favicon.ico">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#f5f7fb;
    color:#111827;
}

button{font:inherit;cursor:pointer}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 20px;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-weight:800;
    font-size:19px;
}

.header a{
    color:#374151;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1150px;
    margin:auto;
    padding:25px 18px;
}

.profile-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    overflow:hidden;
}

.cover{
    height:210px;
    background:linear-gradient(120deg,#111827,#2563eb);
    position:relative;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-main{
    padding:0 25px 25px;
}

.profile-row{
    display:flex;
    align-items:flex-end;
    gap:18px;
    margin-top:-55px;
    position:relative;
}

.avatar{
    width:115px;
    height:115px;
    border-radius:50%;
    border:5px solid white;
    background:#2563eb;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:800;
    object-fit:cover;
}

.profile-info{
    padding-bottom:10px;
}

.profile-info h1{
    font-size:25px;
}

.username{
    color:#6b7280;
    margin-top:3px;
}

.bio{
    margin-top:14px;
    color:#4b5563;
    max-width:700px;
    line-height:1.6;
}

.actions{
    margin-left:auto;
    padding-bottom:12px;
    display:flex;
    gap:8px;
}

.btn{
    border:1px solid #d1d5db;
    background:#fff;
    border-radius:9px;
    padding:9px 15px;
    font-weight:600;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
    border-color:#2563eb;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-top:25px;
}

.stat{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:11px;
    padding:14px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:20px;
}

.stat span{
    color:#6b7280;
    font-size:12px;
}

.tabs{
    display:flex;
    gap:8px;
    overflow:auto;
    margin:25px 0 18px;
}

.tab{
    border:0;
    background:#e5e7eb;
    padding:9px 16px;
    border-radius:20px;
    white-space:nowrap;
}

.tab.active{
    background:#111827;
    color:#fff;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
    gap:18px;
}

.card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
}

.thumb{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    background:#e5e7eb;
}

.card-body{
    padding:13px;
}

.card-title{
    font-weight:700;
    line-height:1.4;
}

.card-meta{
    color:#6b7280;
    font-size:12px;
    margin-top:6px;
}

.empty,
.loading{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:50px 20px;
    text-align:center;
    color:#6b7280;
}

.spinner{
    width:34px;
    height:34px;
    margin:auto auto 12px;
    border:4px solid #e5e7eb;
    border-top-color:#2563eb;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal.show{display:flex}

.modal-box{
    width:min(520px,100%);
    background:#fff;
    border-radius:15px;
    padding:22px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:18px;
}

.close{
    border:0;
    background:#f3f4f6;
    width:34px;
    height:34px;
    border-radius:8px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:10px;
    outline:none;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

@media(max-width:750px){

    .cover{
        height:150px;
    }

    .profile-row{
        align-items:center;
        flex-direction:column;
        margin-top:-55px;
        text-align:center;
    }

    .profile-info{
        padding:0;
    }

    .actions{
        margin:0;
        padding:0;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:450px){

    .header a{
        display:none;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .profile-main{
        padding:0 15px 20px;
    }
}
</style>
</head>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    getDocs,
    query,
    where,
    addDoc,
    deleteDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {
    apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
    authDomain:"let-s-study-pro-course.firebaseapp.com",
    databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId:"let-s-study-pro-course",
    storageBucket:"let-s-study-pro-course.firebasestorage.app",
    messagingSenderId:"474928293390",
    appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId:"G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


/* ==============================
   STATE
============================== */

let currentUser = null;
let profileUser = null;
let profileId = null;
let following = false;


/* ==============================
   GET PROFILE ID
============================== */

const params =
    new URLSearchParams(
        window.location.search
    );

profileId =
    params.get("id");


/* ==============================
   AUTH
============================== */

onAuthStateChanged(
    auth,
    async user => {

        currentUser = user;

        if(!profileId && user){
            profileId = user.uid;
        }

        if(!profileId){

            showError(
                "Profile ID haijapatikana."
            );

            return;
        }

        await loadProfile();

    }
);


/* ==============================
   LOAD PROFILE
============================== */

async function loadProfile(){

    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "users",
                    profileId
                )
            );

        if(!snap.exists()){

            showError(
                "User profile haijapatikana."
            );

            return;

        }

        profileUser = {
            id:snap.id,
            ...snap.data()
        };

        renderProfile();

        await Promise.all([
            loadVideos(),
            loadPlaylists(),
            loadCourses(),
            loadCertificates()
        ]);

        if(
            currentUser &&
            currentUser.uid !== profileId
        ){

            await checkFollowing();

        }

    }catch(error){

        console.error(
            "Profile loading error:",
            error
        );

        showError(
            "Imeshindikana kupakia profile."
        );

    }

}


/* ==============================
   RENDER PROFILE
============================== */

function renderProfile(){

    const data = profileUser;

    const name =
        data.displayName ||
        data.fullName ||
        data.name ||
        "User";

    const username =
        data.username ||
        data.handle ||
        name
            .toLowerCase()
            .replace(/\s+/g,"");

    document.getElementById(
        "profileName"
    ).textContent = name;

    document.getElementById(
        "username"
    ).textContent =
        "@" + username.replace(/^@/,"");

    document.getElementById(
        "bio"
    ).textContent =
        data.bio ||
        data.description ||
        "No biography available.";

    if(data.photoURL || data.avatar){

        document.getElementById(
            "avatar"
        ).src =
            data.photoURL ||
            data.avatar;

    }

    if(data.cover){

        const cover =
            document.getElementById(
                "coverImage"
            );

        cover.src = data.cover;
        cover.style.display = "block";

    }

    document.getElementById(
        "followersCount"
    ).textContent =
        data.followersCount || 0;

    document.getElementById(
        "followingCount"
    ).textContent =
        data.followingCount || 0;

    document.getElementById(
        "editBtn"
    ).style.display =
        currentUser &&
        currentUser.uid === profileId
            ? "inline-block"
            : "none";

    document.getElementById(
        "aboutContent"
    ).innerHTML = `
        <h3>About ${escapeHtml(name)}</h3>
        <p style="margin-top:10px;line-height:1.7">
            ${escapeHtml(
                data.bio ||
                data.description ||
                "No additional information."
            )}
        </p>
        <p style="margin-top:15px;font-size:12px">
            User ID:
            <strong>${escapeHtml(profileId)}</strong>
        </p>
    `;

    document.getElementById(
        "loading"
    ).style.display = "none";

    document.getElementById(
        "profileContent"
    ).style.display = "block";

}


/* ==============================
   VIDEOS
============================== */

async function loadVideos(){

    const grid =
        document.getElementById(
            "videosGrid"
        );

    try{

        const snap =
            await getDocs(
                query(
                    collection(db,"videos"),
                    where(
                        "creatorId",
                        "==",
                        profileId
                    )
                )
            );

        document.getElementById(
            "videoCount"
        ).textContent =
            snap.size;

        if(!snap.size){

            grid.innerHTML =
                empty("No videos yet.");

            return;

        }

        grid.innerHTML =
            snap.docs.map(d => {

                const v = d.data();

                return card(
                    d.id,
                    v,
                    "video"
                );

            }).join("");

    }catch(error){

        console.error(
            "Videos error:",
            error
        );

        grid.innerHTML =
            empty("Unable to load videos.");

    }

}


/* ==============================
   PLAYLISTS
============================== */

async function loadPlaylists(){

    const grid =
        document.getElementById(
            "playlistsGrid"
        );

    try{

        const snap =
            await getDocs(
                query(
                    collection(
                        db,
                        "playlists"
                    ),
                    where(
                        "ownerId",
                        "==",
                        profileId
                    )
                )
            );

        document.getElementById(
            "playlistCount"
        ).textContent =
            snap.size;

        if(!snap.size){

            grid.innerHTML =
                empty("No playlists yet.");

            return;

        }

        grid.innerHTML =
            snap.docs.map(d => {

                const p = d.data();

                return card(
                    d.id,
                    p,
                    "playlist"
                );

            }).join("");

    }catch(error){

        console.error(
            "Playlist error:",
            error
        );

        grid.innerHTML =
            empty("Unable to load playlists.");

    }

}


/* ==============================
   COURSES
============================== */

async function loadCourses(){

    const grid =
        document.getElementById(
            "coursesGrid"
        );

    try{

        const snap =
            await getDocs(
                query(
                    collection(
                        db,
                        "courses"
                    ),
                    where(
                        "instructorId",
                        "==",
                        profileId
                    )
                )
            );

        document.getElementById(
            "courseCount"
        ).textContent =
            snap.size;

        if(!snap.size){

            grid.innerHTML =
                empty("No courses yet.");

            return;

        }

        grid.innerHTML =
            snap.docs.map(d => {

                return card(
                    d.id,
                    d.data(),
                    "course"
                );

            }).join("");

    }catch(error){

        console.error(
            "Courses error:",
            error
        );

        grid.innerHTML =
            empty("Unable to load courses.");

    }

}

<script type="module">

import {
    initializeApp,
    getApps,
    getApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    deleteDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* ======================
   FIREBASE CONFIG
====================== */

const firebaseConfig = {
    apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
    authDomain: "let-s-study-pro-course.firebaseapp.com",
    databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId: "let-s-study-pro-course",
    storageBucket:
        "let-s-study-pro-course.firebasestorage.app",
    messagingSenderId: "474928293390",
    appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId: "G-85B7V5H5J0"
};


/* ======================
   INITIALIZE
====================== */

const app = getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);


/* ======================
   STATE
====================== */

let certificates = [];
let currentCertificate = null;


/* ======================
   AUTH
====================== */

onAuthStateChanged(auth, user => {

    if(user){

        const name =
            user.displayName ||
            user.email?.split("@")[0] ||
            "Admin";

        const nameEl =
            document.getElementById("adminName");

        const emailEl =
            document.getElementById("adminEmail");

        const avatar =
            document.getElementById("adminAvatar");

        if(nameEl)
            nameEl.textContent = name;

        if(emailEl)
            emailEl.textContent =
                user.email || "";

        if(avatar)
            avatar.textContent =
                name.charAt(0).toUpperCase();

    }

    loadCertificates();

});


/* ======================
   LOAD CERTIFICATES
====================== */

window.loadCertificates = async function(){

    const loading =
        document.getElementById(
            "certificateLoading"
        );

    const table =
        document.getElementById(
            "certificateTable"
        );

    const empty =
        document.getElementById(
            "certificateEmpty"
        );

    loading.style.display = "block";
    table.style.display = "none";
    empty.style.display = "none";

    try{

        /*
         * Main collection:
         * certificates/{certificateId}
         */

        const snapshot =
            await getDocs(
                collection(db, "certificates")
            );

        certificates = snapshot.docs.map(
            item => {

                const data = item.data();

                return {
                    id: item.id,
                    ...data
                };

            }
        );

        updateCertificateStats();

        renderCertificates();

    }catch(error){

        console.error(
            "Failed to load certificates:",
            error
        );

        loading.innerHTML = `
            <div style="padding:30px;text-align:center;color:#dc2626">
                ❌ Failed to load certificates.
                <br>
                <small>${escapeHtml(error.message)}</small>
            </div>
        `;

    }

};


/* ======================
   STATS
====================== */

function updateCertificateStats(){

    const total =
        certificates.length;

    const verified =
        certificates.filter(
            certificate =>
                String(
                    certificate.status ||
                    ""
                ).toLowerCase()
                === "verified"
        ).length;

    const pending =
        certificates.filter(
            certificate =>
                String(
                    certificate.status ||
                    ""
                ).toLowerCase()
                === "pending"
        ).length;

    document.getElementById(
        "certificateTotal"
    ).textContent = total;

    document.getElementById(
        "certificateVerified"
    ).textContent = verified;

    document.getElementById(
        "certificatePending"
    ).textContent = pending;

}


/* ======================
   RENDER
====================== */

window.renderCertificates = function(){

    const body =
        document.getElementById(
            "certificateBody"
        );

    const table =
        document.getElementById(
            "certificateTable"
        );

    const loading =
        document.getElementById(
            "certificateLoading"
        );

    const empty =
        document.getElementById(
            "certificateEmpty"
        );

    const search =
        String(
            document.getElementById(
                "certificateSearch"
            ).value || ""
        )
        .trim()
        .toLowerCase();

    const status =
        document.getElementById(
            "certificateStatus"
        ).value;


    const filtered =
        certificates.filter(
            certificate => {

                const text = [
                    certificate.id,
                    certificate.certificateId,
                    certificate.studentId,
                    certificate.userId,
                    certificate.studentName,
                    certificate.name,
                    certificate.email,
                    certificate.courseId,
                    certificate.courseName,
                    certificate.title
                ]
                .map(value =>
                    String(value || "")
                        .toLowerCase()
                )
                .join(" ");

                const matchesSearch =
                    !search ||
                    text.includes(search);

                const currentStatus =
                    String(
                        certificate.status ||
                        "pending"
                    ).toLowerCase();

                const matchesStatus =
                    status === "all" ||
                    currentStatus === status;

                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    body.innerHTML = "";

    loading.style.display = "none";


    if(!filtered.length){

        table.style.display = "none";
        empty.style.display = "block";
        return;

    }


    table.style.display = "table";
    empty.style.display = "none";


    filtered.forEach(
        certificate => {

            const row =
                document.createElement("tr");

            const studentName =
                certificate.studentName ||
                certificate.name ||
                certificate.fullName ||
                "Unknown Student";

            const email =
                certificate.email ||
                certificate.studentEmail ||
                "—";

            const course =
                certificate.courseName ||
                certificate.courseTitle ||
                certificate.title ||
                certificate.courseId ||
                "—";

            const userId =
                certificate.userId ||
                certificate.studentId ||
                "—";

            const statusValue =
                String(
                    certificate.status ||
                    "pending"
                ).toLowerCase();

            const issued =
                formatDate(
                    certificate.issuedAt ||
                    certificate.createdAt
                );


            row.innerHTML = `

                <td>
                    <strong
                        style="font-family:monospace;font-size:12px"
                    >
                        ${escapeHtml(
                            certificate.id
                        )}
                    </strong>

                    <button
                        class="copy-btn"
                        onclick="copyText('${escapeJs(
                            certificate.id
                        )}')"
                    >
                        Copy
                    </button>
                </td>

                <td>
                    <strong>
                        ${escapeHtml(studentName)}
                    </strong>
                </td>

                <td>
                    ${escapeHtml(email)}
                </td>

                <td>
                    ${escapeHtml(course)}
                </td>

                <td>
                    <span
                        style="font-family:monospace;font-size:11px"
                    >
                        ${escapeHtml(userId)}
                    </span>
                </td>

                <td>
                    <span class="badge ${
                        statusValue === "verified"
                            ? "success"
                            : statusValue === "revoked"
                                ? "danger"
                                : "pending"
                    }">
                        ${escapeHtml(
                            statusValue
                        )}
                    </span>
                </td>

                <td>
                    ${escapeHtml(issued)}
                </td>

                <td>

                    <button
                        class="action-btn"
                        onclick="viewCertificate('${escapeJs(
                            certificate.id
                        )}')"
                    >
                        👁 View
                    </button>

                    <button
                        class="action-btn"
                        onclick="copyText('${escapeJs(
                            certificate.id
                        )}')"
                    >
                        📋 ID
                    </button>

                    <button
                        class="action-btn"
                        onclick="deleteCertificate('${escapeJs(
                            certificate.id
                        )}')"
                    >
                        🗑
                    </button>

                </td>

            `;

            body.appendChild(row);

        }
    );

};

/* ======================
   DELETE
====================== */

window.deleteCertificate = async function(id){

    const certificate =
        certificates.find(
            item => item.id === id
        );

    if(!certificate)
        return;


    const name =
        certificate.studentName ||
        certificate.name ||
        certificate.id;


    const confirmed =
        confirm(
            `Delete certificate for ${name}?\n\nThis action cannot be undone.`
        );

    if(!confirmed)
        return;


    try{

        await deleteDoc(
            doc(
                db,
                "certificates",
                id
            )
        );


        certificates =
            certificates.filter(
                item => item.id !== id
            );


        updateCertificateStats();
        renderCertificates();

        showToast(
            "Certificate deleted"
        );


    }catch(error){

        console.error(error);

        alert(
            "Failed to delete certificate: " +
            error.message
        );

    }

};

/* ======================

====================== */

window.copyText = async function(text){

    try{

        await navigator.clipboard.writeText(
            text
        );

        showToast(
            "Copied to clipboard"
        );

    }catch(error){

        console.error(error);

        const area =
            document.createElement("textarea");

        area.value = text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        showToast("Copied");

    } catch (error) {

        console.error(
            "Copy failed:",
            error
        );

        showToast(
            "Failed to copy"
        );

    }

};

/* ======================
   EXPORT CSV
====================== */

window.exportCertificatesCSV =
function () {

    if (!certificates.length) {

        showToast(
            "No certificates to export"
        );

        return;

    }


    const headers = [
        "Certificate ID",
        "Document ID",
        "Student Name",
        "Email",
        "User ID",
        "Course ID",
        "Course Name",
        "Status",
        "Issuer",
        "Created At",
        "Issued At"
    ];


    const rows =
        certificates.map(
            certificate => [

                certificate.certificateId ||
                    certificate.id,

                certificate.id,

                certificate.studentName ||
                    certificate.name ||
                    certificate.fullName ||
                    "",

                certificate.email ||
                    certificate.studentEmail ||
                    "",

                certificate.userId ||
                    certificate.studentId ||
                    "",

                certificate.courseId ||
                    "",

                certificate.courseName ||
                    certificate.courseTitle ||
                    "",

                certificate.status ||
                    "pending",

                certificate.issuerName ||
                    certificate.createdByName ||
                    certificate.issuer ||
                    certificate.createdBy ||
                    "",

                formatDate(
                    certificate.createdAt
                ),

                formatDate(
                    certificate.issuedAt
                )

            ]
        );


    const csv = [

        headers,

        ...rows

    ]
    .map(row =>
        row.map(value =>
            `"${String(
                value ?? ""
            )
            .replaceAll(
                '"',
                '""'
            )}"`
        ).join(",")
    )
    .join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );

    link.href = url;

    link.download =
        `letsstudy-certificates-${Date.now()}.csv`;

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );


    showToast(
        "Certificates exported"
    );

};

/* ======================
   AUTO REFRESH
====================== */

let certificateRefreshTimer =
    null;


function startCertificateAutoRefresh(){

    if (
        certificateRefreshTimer
    ) {

        clearInterval(
            certificateRefreshTimer
        );

    }


    certificateRefreshTimer =
        setInterval(
            () => {

                /*
                 * Refresh every 60 seconds.
                 * This keeps the admin certificate
                 * list reasonably up to date.
                 */

                loadCertificates();

            },
            60000
        );

}


startCertificateAutoRefresh();


/* ======================
   CLEANUP
====================== */

window.addEventListener(
    "beforeunload",
    () => {

        if (
            certificateRefreshTimer
        ) {

            clearInterval(
                certificateRefreshTimer
            );

        }

    }
);
