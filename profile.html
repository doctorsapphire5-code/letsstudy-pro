<style>
:root{
  --blue:#2563eb;
  --blue-d:#1d4ed8;
  --ink:#172033;
  --mute:#64748b;
  --line:#e5e7eb;
  --bg:#f5f7fb
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

[hidden]{
  display:none!important
}

body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased
}

a{
  color:inherit
}

:focus-visible{
  outline:3px solid var(--blue);
  outline-offset:2px
}

header{
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:100
}

.nav{
  max-width:960px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px
}

.brand{
  font-size:21px;
  font-weight:900;
  color:var(--blue);
  text-decoration:none;
  letter-spacing:-.02em
}

.back{
  text-decoration:none;
  color:#475569;
  font-weight:700;
  padding:8px 14px;
  border-radius:999px
}

.back:hover{
  background:#eff6ff;
  color:var(--blue-d)
}

main{
  max-width:960px;
  margin:28px auto 60px;
  padding:0 20px
}

.card{
  background:#fff;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(15,23,42,.07)
}

.cover{
  height:clamp(140px,26vw,260px);
  background:linear-gradient(135deg,#1d4ed8,#7c3aed) center/cover no-repeat
}

.head{
  padding:0 28px 26px;
  position:relative
}

.avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  border:5px solid #fff;
  margin-top:-60px;
  background:#dbeafe;
  object-fit:cover;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  font-weight:900;
  color:var(--blue);
  box-shadow:0 6px 20px rgba(15,23,42,.15)
}

.row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-top:12px
}

h1{
  font-size:clamp(26px,4vw,36px);
  line-height:1.15;
  letter-spacing:-.02em;
  overflow-wrap:anywhere
}

.user{
  color:var(--mute);
  font-weight:600;
  overflow-wrap:anywhere
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:12px;
  padding:11px 18px;
  font:inherit;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  background:var(--blue);
  color:#fff
}

.btn:hover{
  background:var(--blue-d)
}

.btn.ghost{
  background:#f1f5f9;
  color:#334155;
  border:1px solid var(--line)
}

.btn.ghost:hover{
  background:#e2e8f0
}

.facts{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  margin-top:14px;
  color:var(--mute);
  font-size:14px
}

.facts a{
  color:var(--blue-d);
  font-weight:700;
  text-decoration:none;
  overflow-wrap:anywhere
}

.facts a:hover{
  text-decoration:underline
}

.bio{
  margin-top:16px;
  font-size:16px;
  color:#334155;
  white-space:pre-line;
  overflow-wrap:anywhere
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line)
}

.stat{
  padding:18px 8px;
  text-align:center;
  border-right:1px solid var(--line)
}

.stat:last-child{
  border-right:0
}

.stat b{
  display:block;
  font-size:22px;
  font-weight:900
}

.stat span{
  font-size:12px;
  color:var(--mute);
  font-weight:700
}

.section{
  padding:24px 28px;
  border-top:1px solid var(--line)
}

.section h2{
  font-size:16px;
  margin-bottom:12px

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px

.chip{
  background:#eff6ff;
  color:var(--blue-d);
  padding:7px 13px;
  border-radius:999px;
  font-size:13px;
  font-weight:700
}

.links{
  display:flex;
  flex-wrap:wrap;
  gap:10px

.link{

  border-radius:10px;
  background:#f8fafc;
  border:1px solid var(--line);
  text-decoration:none;
  font-size:14px;
  font-weight:700;
  color:#334155

.link:hover{

.form{
  display:grid;
  gap:14px;

.form label{
  display:grid;
  gap:6px;
  font-size:13px;
  font-weight:700;
  color:#334155
}

.form small{
  font-weight:600;
  color:var(--mute)
}

.form input,
.form textarea,
.form select{
  width:100%;
  font:inherit;
  font-size:15px;
  font-weight:400;
  padding:12px 14px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  background:#fff;
  color:var(--ink)
}

.form input:focus,
.form textarea:focus,
.form select:focus{
  border-color:var(--blue);
  outline:0
}

.form textarea{
  resize:vertical
}

.msg{
  color:#b91c1c;
  font-size:14px;
  font-weight:600

.state{
  background:#fff;
  padding:48px 20px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 30px rgba(15,23,42,.06)

.state h2{
  margin-bottom:6px

.state p{
  color:var(--mute);
  margin-bottom:16px

.sk i{
  display:block;
  border-radius:8px;
  background:linear-gradient(
    90deg,
    #eceff4 25%,
    #f6f8fb 37%,
    #eceff4 63%

@keyframes sh{
  0%{background-position:100% 50%}
  100%{background-position:0 50%}
}

.letsstudy-ad-container{
  width:100%;
  margin:24px auto;
  text-align:center

.letsstudy-ad{
  width:100%;
  margin:0 auto;
  text-align:center

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);

  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:700;
  z-index:999

footer{
  padding:30px 20px;
  text-align:center;
  color:var(--mute);
  font-size:14px

@media(max-width:600px){
  main{
    margin-top:16px

  .head{
    padding:0 18px 22px

  .avatar{
    width:96px;
    height:96px;
    margin-top:-48px;
    font-size:38px
  }

  .stats{
    grid-template-columns:repeat(2,1fr)

  .stat:nth-child(2){

  }

  .section{
    padding:20px 18px
  }

  .actions,
  .actions .btn{
    width:100%
  }
}

@media(prefers-reduced-motion:reduce){
  *{
    animation:none!important
  }
}
</style>
</head>

/* =========================================================

const $ = id => document.getElementById(id);

const params = new URLSearchParams(location.search);

  ).trim();

let docId = "";

const text = value =>
  String(value ?? "").trim();


function normUrl(value){

  const s = text(value);

  if(!s) return "";

  if(/^https?:\/\//i.test(s)){
    return s;
  }

  if(
    /^(www\.)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(s)
  ){
    return "https://" + s;
  }

  return "";
}


function num(value){

  const n = Number(
    String(value ?? "")
      .replace(/[, ]/g,"")
  );

  if(!Number.isFinite(n) || n < 0){
    return "0";
  }

  if(n >= 1e6){
    return (n/1e6)
      .toFixed(1)
      .replace(".0","") + "M";
  }

  if(n >= 1e3){
    return (n/1e3)
      .toFixed(1)
      .replace(".0","") + "K";
  }

  return String(Math.floor(n));
}


function toDate(value){

  const s = text(value);

  if(!s) return null;

  let d;

  if(/^\d{10,13}$/.test(s)){

    d = new Date(
      s.length === 10
        ? Number(s) * 1000
        : Number(s)
    );

  }else{

    d = new Date(s);

  }

  return isNaN(d) ? null : d;
}


/* Arrays / comma lists */

function toList(value){

  if(Array.isArray(value)){
    return value
      .map(text)
      .filter(Boolean);
  }

  const s = text(value);

  if(!s) return [];

  try{

    const j = JSON.parse(s);

    if(Array.isArray(j)){
      return j
        .map(text)
        .filter(Boolean);
    }

  }catch{}

  return s
    .split(/[,;\n]+/)
    .map(x => x.trim().replace(/^#/,""))
    .filter(Boolean);
}

      new URL(url)
        .hostname
        .replace(/^www\./,"")
        .toLowerCase();

    const hit =
      SITES.find(
        ([key]) => host.includes(key)
      );

    return hit ? hit[1] : host;

  }catch{

    return "Website";

  }
}


function parseLinks(value){

  if(Array.isArray(value)){
    value = value.join("\n");
  }

    const s = text(value);

  if(!s) return [];

  try{
    const j = JSON.parse(s);

    if(Array.isArray(j)){
      return j.map(text).filter(Boolean);
    }
  }catch{}

  return s
    .split(/[,;\n]+/)
    .map(x => x.trim().replace(/^#/,""))
    .filter(Boolean);
}


/* social links */
const SITES = [
  ["instagram","Instagram"],
  ["facebook","Facebook"],
  ["fb.com","Facebook"],
  ["twitter","X"],
  ["x.com","X"],
  ["linkedin","LinkedIn"],
  ["youtube","YouTube"],
  ["youtu.be","YouTube"],
  ["tiktok","TikTok"],
  ["github","GitHub"],
  ["wa.me","WhatsApp"],
  ["whatsapp","WhatsApp"],
  ["t.me","Telegram"],
  ["telegram","Telegram"]
];

function labelOf(url){
  try{
    const host = new URL(url)
      .hostname
      .replace(/^www\./,"")
      .toLowerCase();

    const hit = SITES.find(([k]) => host.includes(k));

    return hit ? hit[1] : host;
  }catch{
    return "Website";
  }
}


function parseLinks(value){

  if(Array.isArray(value)){
    value = value.join("\n");
  }

  const s = text(value);

  if(!s) return [];

  let raw;

  try{
    const j = JSON.parse(s);

    raw = Array.isArray(j)
      ? j
      : (
          j && typeof j === "object"
            ? Object.values(j)
            : [s]
        );

  }catch{
    raw = s.split(/[\s,;]+/);
  }

  const seen = new Set();

  return raw
    .map(x =>
      normUrl(
        typeof x === "object"
          ? (x?.url || x?.link)
          : x
      )
    )
    .filter(
      u => u && !seen.has(u) && seen.add(u)
    )
    .map(u => ({
      url:u,
      label:labelOf(u)
    }));
}


function setMeta(selector,value){
  const meta = document.querySelector(selector);

  if(meta){
    meta.setAttribute("content",value);
  }
}


function showError(title,msg){

  $("loading").hidden = true;
  $("profile").hidden = true;

  $("errorTitle").textContent = title;
  $("errorText").textContent = msg;

  $("error").hidden = false;
}


function toast(msg){

  const t = $("toast");

  t.textContent = msg;
  t.hidden = false;

  clearTimeout(t._t);

  t._t = setTimeout(() => {
    t.hidden = true;
  },2200);
}


/* =========================================================
   FIND PROFILE
========================================================= */

async function findProfile(k){

  /* Document ID */
  const direct = await getDoc(
    doc(db,"profiles",k)
  );

  if(direct.exists()){
    return {
      id:direct.id,
      d:direct.data()
    };
  }


  /* userId */
  const byUserId = await getDocs(
    query(
      collection(db,"profiles"),
      where("userId","==",k),
      limit(1)
    )
  );

  if(!byUserId.empty){
    return {
      id:byUserId.docs[0].id,
      d:byUserId.docs[0].data()
    };
  }


  /* username */
  const byUsername = await getDocs(
    query(
      collection(db,"profiles"),
      where("username","==",k),
      limit(1)
    )
  );

  if(!byUsername.empty){
    return {
      id:byUsername.docs[0].id,
      d:byUsername.docs[0].data()
    };
  }

  return null;
}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function load(){

  const user = await authReady;

  if(!key && user){
    key = user.uid;
  }


  if(!key){

    $("errorBtn").href = "login.html";
    $("errorBtn").textContent = "Sign in";

    return showError(
      "Sign in to see your profile",
      "Or open a profile from search or from a member's link."
    );
  }


  try{

    const found = await findProfile(key);

    let d = found?.d;

    docId = found?.id || key;


    /* New user without profile */
    if(!d){

      if(user && user.uid === key){

        d = {
          userId:user.uid,
          username:"",
          displayName:user.displayName || "",
          firstName:"",
          lastName:"",
          email:user.email || "",
          phone:"",
          photoURL:user.photoURL || "",
          coverPhoto:"",
          bio:"",
          gender:"",
          dateOfBirth:"",
          location:"",
          country:"",
          educationLevel:"",
          institution:"",
          fieldOfStudy:"",
          occupation:"",
          skills:[],
          interests:[],
          website:"",
          socialLinks:[],
          postCount:0,
          followerCount:0,
          followingCount:0,
          connectionCount:0,
          profileCompleted:false
        };

        isNew = true;

      }else{

        return showError(
          "Profile not found",
          "This profile doesn't exist or was removed."
        );
      }
    }


    profile = d;


    isOwner =
      !!user &&
      (
        text(d.userId) === user.uid ||
        docId === user.uid
      );


    /* =====================================================
       PROFILE DATA
    ===================================================== */

    const firstName = text(d.firstName);
    const lastName = text(d.lastName);

    const name =
      text(d.displayName) ||
      `${firstName} ${lastName}`.trim() ||
      text(d.username) ||
      "LetsStudy Member";

    const username =
      text(d.username).replace(/^@/,"");

    const bio = text(d.bio);

    const photo = normUrl(d.photoURL);

    const cover = normUrl(d.coverPhoto);

    const site = normUrl(d.website);

    const links = parseLinks(d.socialLinks);

    const interests = toList(d.interests);

    const since = toDate(d.createdAt);


    /* =====================================================
       HEADER
    ===================================================== */

    $("name").textContent = name;


    if(username){

      $("username").textContent =
        "@" + username;

      $("username").hidden = false;
    }


    /* Avatar */

    const av = $("avatar");

    if(photo){

      const img = document.createElement("img");

      img.src = photo;
      img.alt = name;
      img.className = "avatar";

      img.addEventListener(
        "error",
        () => {

          img.remove();

          av.textContent =
            name.charAt(0).toUpperCase();

        },
        {once:true}
      );

      av.replaceWith(img);

    }else{

      av.textContent =
        name.charAt(0).toUpperCase();

    }


    /* Cover */

    if(cover){

      $("cover").style.backgroundImage =
        `url("${cover.replace(/"/g,"%22")}")`;
    }


    /* Location */

    if(text(d.location)){

      $("location").textContent =
        "📍 " + text(d.location);

      $("location").hidden = false;
    }


    /* Website */

    if(site){

      const w = $("website");

      w.href = site;

      w.textContent =
        "🔗 " +
        new URL(site)
          .hostname
          .replace(/^www\./,"");

      w.hidden = false;


      const b = $("siteBtn");

      b.href = site;
      b.hidden = false;
    }


    /* Joined date */

    if(since){

      $("since").textContent =
        "📅 Joined " +
        since.toLocaleDateString(
          "en-GB",
          {
            month:"long",
            year:"numeric"
          }
        );

      $("since").hidden = false;
    }


    /* Bio */

    if(bio){

      $("bio").textContent = bio;
      $("bio").hidden = false;
    }


    /* =====================================================
       STATS
    ===================================================== */

    $("posts").textContent =
      num(d.postCount);

    $("followers").textContent =
      num(d.followerCount);

    $("following").textContent =
      num(d.followingCount);

    $("connections").textContent =
      num(d.connectionCount);


    /* =====================================================
       INTERESTS
    ===================================================== */

    if(interests.length){

      const box = $("interests");

      box.innerHTML = "";

      interests
        .slice(0,20)
        .forEach(item => {

          const chip =
            document.createElement("span");

          chip.className = "chip";

          chip.textContent = item;

          box.appendChild(chip);
        });

      $("interestsBox").hidden = false;
    }


    /* =====================================================
       SOCIAL LINKS
    ===================================================== */

    if(links.length){

      const box = $("links");

      box.innerHTML = "";

      links
        .slice(0,12)
        .forEach(item => {

          const a =
            document.createElement("a");

          a.className = "link";

          a.href = item.url;

          a.textContent = item.label;

          a.target = "_blank";

          a.rel =
            "noopener noreferrer nofollow";

          box.appendChild(a);
        });

      $("linksBox").hidden = false;
    }


    /* =====================================================
       SEO
    ===================================================== */

    const title =
      `${name}${
        username
          ? " (@" + username + ")"
          : ""
      } · LetsStudy Pro`;

    const desc =
      (
        bio ||
        `${name} on LetsStudy Pro`
      )
      .replace(/\s+/g," ")
      .slice(0,160);

    document.title = title;

    setMeta(
      'meta[name="description"]',
      desc
    );

    setMeta(
      'meta[property="og:title"]',
      title
    );

    setMeta(
      'meta[property="og:description"]',
      desc
    );


    if(photo){

      setMeta(
        'meta[property="og:image"]',
        photo
      );

      setMeta(
        'meta[name="twitter:image"]',
        photo
      );
    }


    /* =====================================================
       JSON-LD
    ===================================================== */

    const oldSchema =
      document.querySelector(
        'script[data-profile-schema="true"]'
      );

    if(oldSchema){
      oldSchema.remove();
    }


    const ld =
      document.createElement("script");

    ld.type = "application/ld+json";

    ld.dataset.profileSchema = "true";

    ld.textContent =
      JSON.stringify({
        "@context":"https://schema.org",
        "@type":"ProfilePage",

        mainEntity:{
          "@type":"Person",
          name:name,

          alternateName:
            username || undefined,

          description:
            bio || undefined,

          image:
            photo || undefined,

          url:
            site || undefined,

          sameAs:
            links.map(l => l.url)
        }
      });


    document.head.appendChild(ld);


    /* =====================================================
       SHARE
    ===================================================== */

    $("shareBtn").onclick =
      async () => {

        try{

          if(navigator.share){

            await navigator.share({
              title:title,
              text:desc,
              url:location.href
            });

            return;
          }


          await navigator.clipboard
            .writeText(location.href);

          toast("Profile link copied");

        }catch(err){

          if(err?.name !== "AbortError"){

            toast(
              "Couldn't share this profile"
            );
          }
        }
      };


    $("loading").hidden = true;

    $("profile").hidden = false;


    if(isOwner){

      setupEditor();
    }


  }catch(err){

    console.error(err);

    showError(
      "Unable to load this profile",
      "Check your connection and try again."
    );
  }
}


/* =========================================================
   PROFILE EDITOR
========================================================= */

function setupEditor(){

  const box = $("editBox");

  const editBtn = $("editBtn");

  const f = id => $(id);


  /* Bio counter */

  function updateBioCount(){

    $("bioCount").textContent =
      f("fBio").value.length +
      "/500";
  }


  /* Fill existing data */

  function fill(){

    f("fFirstName").value =
      text(profile.firstName);

    f("fLastName").value =
      text(profile.lastName);

    f("fName").value =
      text(profile.displayName);

    f("fUsername").value =
      text(profile.username)
        .replace(/^@/,"");

    f("fPhone").value =
      text(profile.phone);

    f("fBio").value =
      text(profile.bio);

    f("fGender").value =
      text(profile.gender);

    f("fDob").value =
      text(profile.dateOfBirth);

    f("fLoc").value =
      text(profile.location);

    f("fCountry").value =
      text(profile.country);

    f("fEducationLevel").value =
      text(profile.educationLevel);

    f("fInstitution").value =
      text(profile.institution);

    f("fFieldOfStudy").value =
      text(profile.fieldOfStudy);

    f("fOccupation").value =
      text(profile.occupation);

    f("fSkills").value =
      toList(profile.skills)
        .join(", ");

    f("fInt").value =
      toList(profile.interests)
        .join(", ");

    f("fSite").value =
      text(profile.website);

    f("fLinks").value =
      parseLinks(profile.socialLinks)
        .map(l => l.url)
        .join("\n");

    f("fPhoto").value =
      text(profile.photoURL);

    f("fCover").value =
      text(profile.coverPhoto);

    updateBioCount();
  }


  function showEditor(show){

    box.hidden = !show;

    editBtn.textContent =
      show
        ? "Close editor"
        : "Edit profile";


    if(show){

      fill();

      box.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

      f("fName").focus({
        preventScroll:true
      });
    }
  }


  editBtn.hidden = false;

  editBtn.onclick =
    () => showEditor(box.hidden);


  $("cancelBtn").onclick =
    () => showEditor(false);


  f("fBio").addEventListener(
    "input",
    updateBioCount
  );


  /* Automatically open editor for new user */

  if(isNew){

    showEditor(true);
  }


  /* =======================================================
     SAVE PROFILE
  ======================================================= */

  $("editForm").addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const message =
        $("formMsg");

      message.hidden = true;


      function fail(error){

        message.textContent =
          error;

        message.hidden = false;
      }


      /* URL validation */

      function getLink(id,label){

        const value =
          f(id).value.trim();

        if(!value){
          return "";
        }

        const url =
          normUrl(value);

        if(!url){

          throw new Error(
            label +
            " must be a valid link."
          );
        }

        return url;
      }


      let data;


      try{

        /* Social links */

        const socials =
          f("fLinks")
            .value
            .split(/[\n,]+/)
            .map(value => value.trim())
            .filter(Boolean)
            .map(value => {

              const url =
                normUrl(value);

              if(!url){

                throw new Error(
                  `"${value.slice(0,40)}" is not a valid link.`
                );
              }

              return url;
            });


        /* Username */

        const username =
          f("fUsername")
            .value
            .trim()
            .replace(/^@/,"")
            .replace(/\s+/g,"");


        /* Names */

        const firstName =
          f("fFirstName")
            .value
            .trim();

        const lastName =
          f("fLastName")
            .value
            .trim();


        let displayName =
          f("fName")
            .value
            .trim();


        if(!displayName){

          displayName =
            `${firstName} ${lastName}`.trim();
        }


        if(!displayName){

          throw new Error(
            "Please enter your display name."
          );
        }


        /* Skills */

        const skills =
          f("fSkills")
            .value
            .split(",")
            .map(value => value.trim())
            .filter(Boolean)
            .slice(0,30);


        /* Interests */

        const interests =
          f("fInt")
            .value
            .split(",")
            .map(value => value.trim())
            .filter(Boolean)
            .slice(0,20);


        /*
         * Profile completion
         */

        const completionFields = [

          displayName,

          f("fBio").value.trim(),

          f("fLoc").value.trim(),

          f("fCountry").value.trim(),

          f("fEducationLevel").value.trim(),

          f("fInstitution").value.trim(),

          f("fFieldOfStudy").value.trim(),

          f("fOccupation").value.trim(),

          f("fPhoto").value.trim()

        ];


        const profileCompleted =
          completionFields.filter(Boolean).length >= 5;


        data = {

          /* Personal */

          firstName:firstName,

          lastName:lastName,

          displayName:displayName,

          username:username,


          /* Contact */

          phone:
            f("fPhone")
              .value
              .trim(),


          /* About */

          bio:
            f("fBio")
              .value
              .trim(),


          gender:
            f("fGender")
              .value
              .trim(),


          dateOfBirth:
            f("fDob")
              .value
              .trim(),


          location:
            f("fLoc")
              .value
              .trim(),


          country:
            f("fCountry")
              .value
              .trim(),


          /* Education */

          educationLevel:
            f("fEducationLevel")
              .value
              .trim(),


          institution:
            f("fInstitution")
              .value
              .trim(),


          fieldOfStudy:
            f("fFieldOfStudy")
              .value
              .trim(),


          /* Career */

          occupation:
            f("fOccupation")
              .value
              .trim(),


          skills:skills,


          /* Interests */

          interests:interests,


          /* Website */

          website:
            getLink(
              "fSite",
              "Website"
            ),


          /* Social */

          socialLinks:
            socials.slice(0,12),


          /* Images */

          photoURL:
            getLink(
              "fPhoto",
              "Photo URL"
            ),


          coverPhoto:
            getLink(
              "fCover",
              "Cover photo URL"
            ),


          /* Status */

          profileCompleted:
            profileCompleted,


          updatedAt:
            new Date().toISOString()

        };


      }catch(error){

        return fail(
          error.message ||
          "Please check your information."
        );
      }


      const saveBtn =
        $("saveBtn");

      saveBtn.disabled = true;

      saveBtn.textContent =
        "Saving…";


      try{

        const currentUser =
          auth.currentUser;


        if(!currentUser){

          throw new Error(
            "You must be signed in to save your profile."
          );
        }


        /*
         * Always save using authenticated UID.
         *
         * profiles/{uid}
         */

        const profileRef =
          doc(
            db,
            "profiles",
            currentUser.uid
          );


        if(isNew){

          await setDoc(
            profileRef,
            {

              userId:
                currentUser.uid,

              email:
                currentUser.email || "",

              postCount:0,

              followerCount:0,

              followingCount:0,

              connectionCount:0,

              createdAt:
                new Date().toISOString(),

              ...data

            },
            {
              merge:true
            }
          );


        }else{

                    await updateDoc(
            profileRef,
            data
          );
        }

        /* Profile saved successfully */
        toast("Profile saved successfully");

        setTimeout(() => {
          location.reload();
        }, 700);

      }catch(error){

        console.error("Profile save error:", error);

        if(error?.code === "permission-denied"){

          fail(
            "You don't have permission to edit this profile."
          );

        }else if(error?.code === "unauthenticated"){

          fail(
            "Your session has expired. Please sign in again."
          );

        }else{

          fail(
            error?.message ||
            "Couldn't save your profile. Check your connection and try again."
          );
        }

        saveBtn.disabled = false;
        saveBtn.textContent = "Save changes";
      }

    }
  );
}


/* =========================================================
   START PAGE
========================================================= */

load();

</script>
