<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Profile | LetsStudy Pro</title>

<meta name="description"
      content="Manage your LetsStudy Pro profile, account information and learning details.">

<meta name="theme-color"
      content="#2563eb">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  background:#f8fafc;
  color:#0f172a;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
}


/* =========================
   NAVBAR
========================= */

.navbar{
  background:#fff;

  border-bottom:
    1px solid #e2e8f0;

  position:sticky;
  top:0;

  z-index:1000;
}

.nav-container{
  max-width:1100px;

  margin:auto;

  min-height:68px;

  padding:
    0 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.logo{
  display:flex;

  align-items:center;

  gap:10px;

  color:#2563eb;

  font-weight:800;

  font-size:19px;
}

.logo-icon{
  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:#2563eb;

  color:#fff;

  font-size:13px;

  font-weight:900;
}

.nav-links{
  display:flex;

  align-items:center;

  gap:20px;
}

.nav-links a{
  color:#475569;

  font-size:13px;

  font-weight:600;
}

.nav-links a:hover{
  color:#2563eb;
}

.menu-btn{
  display:none;

  border:0;

  background:none;

  font-size:25px;
}


/* =========================
   PAGE
========================= */

.page{
  max-width:1050px;

  margin:
    35px auto;

  padding:
    0 20px;
}


/* =========================
   PROFILE HEADER
========================= */

.profile-header{
  background:#fff;

  border:
    1px solid #e2e8f0;

  border-radius:16px;

  padding:28px;

  display:flex;

  align-items:center;

  gap:20px;

  margin-bottom:20px;
}

.avatar{
  width:85px;
  height:85px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#dbeafe;

  color:#2563eb;

  border-radius:50%;

  font-size:30px;

  font-weight:800;
}

.profile-header h1{
  font-size:24px;

  margin-bottom:4px;
}

.profile-header p{
  color:#64748b;

  font-size:13px;
}


/* =========================
   GRID
========================= */

.grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:20px;
}

.card{
  background:#fff;

  border:
    1px solid #e2e8f0;

  border-radius:16px;

  padding:22px;
}

.card h2{
  font-size:17px;

  margin-bottom:18px;
}


/* =========================
   FORM
========================= */

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;

  color:#475569;

  font-size:12px;

  font-weight:700;

  margin-bottom:6px;
}

.form-group input,
.form-group select{
  width:100%;

  padding:
    11px 12px;

  border:
    1px solid #cbd5e1;

  border-radius:8px;

  outline:none;

  background:#fff;
}

.form-group input:focus,
.form-group select:focus{
  border-color:#2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.1);
}

.form-group input:disabled{
  background:#f1f5f9;

  color:#64748b;
}

.btn{
  border:0;

  border-radius:8px;

  padding:
    11px 17px;

  font-size:13px;

  font-weight:800;
}

.btn-primary{
  background:#2563eb;

  color:#fff;
}

.btn-primary:hover{
  background:#1d4ed8;
}

.btn-danger{
  background:#fee2e2;

  color:#dc2626;
}


/* =========================
   ACCOUNT INFO
========================= */

.info-row{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  padding:
    13px 0;

  border-bottom:
    1px solid #f1f5f9;
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  color:#64748b;

  font-size:12px;
}

.info-value{
  font-size:13px;

  font-weight:700;

  text-align:right;

  word-break:break-word;
}

.badge{
  display:inline-block;

  padding:
    4px 9px;

  background:#dcfce7;

  color:#15803d;

  border-radius:999px;

  font-size:11px;

  font-weight:800;
}


/* =========================
   LOADING
========================= */

.loading{
  text-align:center;

  padding:50px 20px;

  color:#64748b;
}


/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  right:20px;
  bottom:20px;

  background:#0f172a;

  color:#fff;

  padding:
    13px 16px;

  border-radius:9px;

  font-size:13px;

  display:none;

  z-index:3000;
}

.toast.show{
  display:block;
}


/* =========================
   MOBILE
========================= */

@media(max-width:750px){

  .nav-links{
    display:none;

    position:absolute;

    left:0;
    right:0;
    top:68px;

    background:#fff;

    padding:18px 20px;

    border-bottom:
      1px solid #e2e8f0;

    flex-direction:column;

    align-items:flex-start;
  }

  .nav-links.active{
    display:flex;
  }

  .menu-btn{
    display:block;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .profile-header{
    padding:20px;
  }

  .avatar{
    width:65px;
    height:65px;
    font-size:23px;
  }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

<div class="nav-container">

<a
  href="/"
  class="logo">

  <div class="logo-icon">
    LS
  </div>

  LetsStudy Pro

</a>


<nav
  class="nav-links"
  id="navLinks">

  <a href="/">
    Home
  </a>

  <a href="/courses.html">
    Courses
  </a>

  <a href="/notes-papers.html">
    Notes & Papers
  </a>

  <a href="/resources.html">
    Resources
  </a>

  <a href="/profile.html">
    Profile
  </a>

</nav>


<button
  class="menu-btn"
  id="menuBtn">

  ☰

</button>

</div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="page">

<div id="loading"
     class="loading">

  Loading profile...

</div>


<div
  id="profileContent"
  style="display:none;">


<!-- PROFILE HEADER -->

<section class="profile-header">

<div
  class="avatar"
  id="avatar">

  U

</div>


<div>

<h1 id="displayName">
  Student
</h1>

<p id="displayEmail">
  Loading...
</p>

</div>

</section>



<div class="grid">


<!-- =========================
     EDIT PROFILE
========================= -->

<section class="card">

<h2>
  Edit Profile
</h2>


<form id="profileForm">


<div class="form-group">

<label>
  Full Name
</label>

<input
  type="text"
  id="name"
  placeholder="Your full name"
  required>

</div>


<div class="form-group">

<label>
  Email
</label>

<input
  type="email"
  id="email"
  disabled>

</div>


<div class="form-group">

<label>
  Phone Number
</label>

<input
  type="tel"
  id="phone"
  placeholder="+255...">

</div>


<div class="form-group">

<label>
  Form / Level
</label>

<select id="level">

<option value="">
  Select level
</option>

<option>
  Form 1
</option>

<option>
  Form 2
</option>

<option>
  Form 3
</option>

<option>
  Form 4
</option>

<option>
  Form 5
</option>

<option>
  Form 6
</option>

</select>

</div>


<div class="form-group">

<label>
  School
</label>

<input
  type="text"
  id="school"
  placeholder="Your school">

</div>


<button
  class="btn btn-primary"
  type="submit"
  id="saveBtn">

  Save Changes

</button>

</form>

</section>



<!-- =========================
     ACCOUNT
========================= -->

<section class="card">

<h2>
  Account Information
</h2>


<div class="info-row">

<span class="info-label">
  Account Status
</span>

<span
  class="badge">

  Active

</span>

</div>


<div class="info-row">

<span class="info-label">
  Account Type
</span>

<span
  class="info-value"
  id="accountType">

  Student

</span>

</div>


<div class="info-row">

<span class="info-label">
  User ID
</span>

<span
  class="info-value"
  id="userId">

  -

</span>

</div>


<div class="info-row">

<span class="info-label">
  Joined
</span>

<span
  class="info-value"
  id="joinedDate">

  -

</span>

</div>


<div class="info-row">

<span class="info-label">
  Email Verification
</span>

<span
  class="info-value"
  id="verification">

  -

</span>

</div>


<br>


<button
  class="btn btn-danger"
  id="logoutBtn">

  Logout

</button>

</section>


</div>

</div>

</main>



<div
  class="toast"
  id="toast">

</div>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  update
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rj0rj0dBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getDatabase(app);



/* =========================
   ELEMENTS
========================= */

const loading =
  document.getElementById(
    "loading"
  );

const profileContent =
  document.getElementById(
    "profileContent"
  );

const profileForm =
  document.getElementById(
    "profileForm"
  );

const toast =
  document.getElementById(
    "toast"
  );



/* =========================
   TOAST
========================= */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },
    3000
  );

}



/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.replace(
        "/login.html"
      );

      return;

    }


    document.getElementById(
      "email"
    ).value =
      user.email || "";


    document.getElementById(
      "displayEmail"
    ).textContent =
      user.email || "";


    document.getElementById(
      "userId"
    ).textContent =
      user.uid;


    document.getElementById(
      "verification"
    ).textContent =
      user.emailVerified
        ? "Verified"
        : "Not verified";


    if(user.metadata.createdAt){

      const date =
        new Date(
          user.metadata.createdAt
        );

      document.getElementById(
        "joinedDate"
      ).textContent =
        date.toLocaleDateString();

    }


    await loadProfile(
      user.uid
    );


    loading.style.display =
      "none";

    profileContent.style.display =
      "block";

  }
);



/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(uid){

  try{

    const snapshot =
      await get(
        ref(
          db,
          "users/" + uid
        )
      );


    if(
      !snapshot.exists()
    ){

      setDefaultProfile();

      return;

    }


    const data =
      snapshot.val();


    const name =
      data.name ||
      data.displayName ||
      "";


    document.getElementById(
      "name"
    ).value =
      name;


    document.getElementById(
      "phone"
    ).value =
      data.phone ||
      "";


    document.getElementById(
      "level"
    ).value =
      data.level ||
      data.form ||
      "";


    document.getElementById(
      "school"
    ).value =
      data.school ||
      "";


    updateHeader(
      name
    );


    document.getElementById(
      "accountType"
    ).textContent =
      data.role ||
      "Student";


  }catch(error){

    console.error(error);

    showToast(
      "Could not load profile."
    );

  }

}



/* =========================
   DEFAULT PROFILE
========================= */

function setDefaultProfile(){

  document.getElementById(
    "name"
  ).value =
    "";


  document.getElementById(
    "phone"
  ).value =
    "";


  document.getElementById(
    "level"
  ).value =
    "";


  document.getElementById(
    "school"
  ).value =
    "";

}



/* =========================
   UPDATE HEADER
========================= */

function updateHeader(name){

  const finalName =
    name.trim() ||
    "Student";


  document.getElementById(
    "displayName"
  ).textContent =
    finalName;


  document.getElementById(
    "avatar"
  ).textContent =
    finalName
      .charAt(0)
      .toUpperCase();

}



/* =========================
   SAVE PROFILE
========================= */

profileForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const user =
      auth.currentUser;


    if(!user){

      return;

    }


    const saveBtn =
      document.getElementById(
        "saveBtn"
      );


    const name =
      document.getElementById(
        "name"
      ).value.trim();


    const phone =
      document.getElementById(
        "phone"
      ).value.trim();


    const level =
      document.getElementById(
        "level"
      ).value;


    const school =
      document.getElementById(
        "school"
      ).value.trim();


    if(!name){

      showToast(
        "Please enter your name."
      );

      return;

    }


    try{

      saveBtn.disabled =
        true;

      saveBtn.textContent =
        "Saving...";


      await update(
        ref(
          db,
          "users/" + user.uid
        ),
        {

          name:
            name,

          displayName:
            name,

          phone:
            phone,

          level:
            level,

          school:
            school,

          updatedAt:
            Date.now()

        }
      );


      updateHeader(
        name
      );


      showToast(
        "Profile updated successfully."
      );


    }catch(error){

      console.error(error);

      showToast(
        "Failed to update profile."
      );


    }finally{

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "Save Changes";

    }

  }
);



/* =========================
   LOGOUT
========================= */

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async () => {

      try{

        await signOut(
          auth
        );

        window.location.replace(
          "/login.html"
        );

      }catch(error){

        console.error(error);

        showToast(
          "Logout failed."
        );

      }

    }
  );



/* =========================
   MOBILE NAV
========================= */

document
  .getElementById(
    "menuBtn"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "navLinks"
        )
        .classList.toggle(
          "active"
        );

    }
  );

</script>

</body>

</html>
