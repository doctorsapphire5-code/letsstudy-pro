    :root{
      --blue:#2563eb;
      --blue-d:#1d4ed8;

      --mute:#64748b;
      --line:#e5e7eb;

    *{

    }

    body{

      background:var(--bg);
      color:var(--ink);

    header{
      background:rgba(255,255,255,.92);

      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:100;
    }

    .nav{
      max-width:960px;
      margin:auto;
      padding:14px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      font-size:21px;
      font-weight:900;
      color:var(--blue);
      text-decoration:none;
      letter-spacing:-.02em;
    }

    .back{
      text-decoration:none;
      color:#475569;
      font-weight:700;
      padding:8px 14px;
      border-radius:999px;
    }

    .back:hover{
      background:#f1f5f9;
    }

    main{
      max-width:960px;
      margin:28px auto 60px;
      padding:0 20px;
    }

    .card{
      background:#fff;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 8px 30px rgba(15,23,42,.07);
    }

    .cover{
      height:clamp(140px,26vw,260px);
      background:linear-gradient(135deg,#1d4ed8,#7c3aed) center/cover no-repeat;
    }

    .head{
      padding:0 28px 26px;
      position:relative;
    }

    .avatar{
      width:120px;
      height:120px;
      border-radius:50%;
      border:5px solid #fff;
      margin-top:-60px;
      background:#dbeafe;
      object-fit:cover;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:48px;
      font-weight:900;
      color:var(--blue);
      box-shadow:0 6px 20px rgba(15,23,42,.15);
    }

    .row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    h1{
      font-size:clamp(26px,4vw,36px);
      line-height:1.15;
      letter-spacing:-.02em;
      overflow-wrap:anywhere;
      margin:0 0 5px;
    }

    .user{
      color:var(--mute);
      font-weight:600;
      overflow-wrap:anywhere;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:0;
      border-radius:12px;
      padding:11px 18px;
      font:inherit;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
      background:var(--blue);
      color:#fff;
    }

    .btn:hover{
      background:var(--blue-d);
    }

    .btn.ghost{
      background:#f1f5f9;
      color:#334155;
      border:1px solid var(--line);
    }

    .facts{
      display:flex;
      flex-wrap:wrap;
      gap:10px 18px;
      margin-top:16px;
      color:#475569;
      font-size:14px;
      font-weight:600;
    }

    .bio{
      margin:18px 0 0;
      color:#334155;
      line-height:1.7;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .links{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:16px;
    }

    .links a{
      color:var(--blue);
      text-decoration:none;
      font-weight:700;
      word-break:break-all;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      border-top:1px solid var(--line);
    }

    .stat{
      padding:18px;
      text-align:center;
      border-right:1px solid var(--line);
    }

    .stat:last-child{
      border-right:0;
    }

    .stat strong{
      display:block;
      font-size:22px;
    }

    .stat span{
      color:var(--mute);
      font-size:13px;
      font-weight:700;
    }

    .section{
      padding:26px 28px;
      border-top:1px solid var(--line);
    }

    .section h2{
      margin:0 0 18px;
      font-size:20px;
    }

    .interests{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .tag{
      background:#eff6ff;
      color:#1d4ed8;
      padding:7px 11px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
    }

    .form{
      display:grid;
      gap:15px;
    }

    .form label{
      display:grid;
      gap:7px;
      color:#334155;
      font-weight:800;
      font-size:14px;
    }

    .form small{
      color:var(--mute);
      font-weight:600;
    }

    .form input,
    .form textarea,
    .form select{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 14px;
      font:inherit;
      color:var(--ink);
      background:#fff;
      outline:none;
    }

    .form input:focus,
    .form textarea:focus,
    .form select:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 3px rgba(37,99,235,.10);
    }

    .form textarea{
      resize:vertical;
      min-height:100px;
    }

    .msg{
      margin:0;
      padding:11px 13px;
      border-radius:10px;
      background:#fef2f2;
      color:#b91c1c;
      font-size:14px;
      font-weight:700;
    }

    .empty{
      padding:35px 20px;
      text-align:center;
      color:var(--mute);
    }

    .ad{
      margin-top:20px;
      min-height:90px;
      border:1px dashed var(--line);
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#94a3b8;
      font-size:13px;
      font-weight:700;
    }

    footer{
      text-align:center;
      color:#94a3b8;
      font-size:13px;
      padding:25px 20px;
    }

    #toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%) translateY(20px);
      background:#172033;
      color:#fff;
      padding:12px 18px;
      border-radius:999px;
      font-size:14px;
      font-weight:700;
      opacity:0;
      pointer-events:none;
      transition:.25s;
      z-index:999;
    }

    #toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media(max-width:600px){

      main{
        margin-top:16px;

        width:96px;

      }

      .stats{
        grid-template-columns:repeat(2,1fr);

      }

      }

      .section{
        padding:20px 18px;
      }

      .actions,
      .actions .btn{
        width:100%;

/* =========================================================
   HELPERS
========================================================= */

function text(value){

  return String(value ?? "").trim();

}


function arrayValue(value){

  const s = text(value);

  if(!s) return [];

  try{

    const j = JSON.parse(s);

    if(Array.isArray(j)){

      return j
        .map(text)
        .filter(Boolean);

    }

  }catch{}

  return s
    .split(/[,;\n]+/)
    .map(x =>
      x
        .trim()
        .replace(/^#/,"")
    )
    .filter(Boolean);

}


function toast(message){

  toastBox.textContent = message;

  toastBox.classList.add("show");

  setTimeout(() => {

    toastBox.classList.remove("show");

  }, 2600);

}


function fail(message){

  formMsg.textContent = message;

  formMsg.hidden = false;

}


function clearError(){

  formMsg.textContent = "";

  formMsg.hidden = true;

}


function setValue(id,value){

  const el =
    document.getElementById(id);

  if(el){

    el.value = value ?? "";

  }

}


function setMeta(selector,value){

  const el =
    document.querySelector(selector);

  if(el && value){

    el.setAttribute("content",value);

  }

}

async function findProfile(uid){

  const profileRef =
    doc(db,"profiles",uid);

  const direct =
    await getDoc(profileRef);

  if(direct.exists()){

    return {
      id:uid,
      data:direct.data()
    };

  }

  return null;

}


/* =========================================================
   SHOW PROFILE
========================================================= */

function renderProfile(d){

  const data = d || {};

  currentProfile = data;

  displayName.textContent =
    data.displayName ||
    (
      `${text(data.firstName)} ${text(data.lastName)}`
    ).trim() ||
    "LetsStudy Pro User";

  username.textContent =
    data.username
      ? `@${data.username}`
      : "LetsStudy Pro User";

  const photo =
    text(data.photoURL);

  const coverPhoto =
    text(data.coverPhoto);


  if(photo){

    avatar.textContent = "";

    avatar.style.backgroundImage =
      `url("${photo}")`;

    avatar.style.backgroundSize =
      "cover";

    avatar.style.backgroundPosition =
      "center";

  }else{

        avatar.style.backgroundImage =
      "none";

    avatar.textContent =
      (
        data.displayName ||
        data.firstName ||
        "L"
      )
      .charAt(0)
      .toUpperCase();

  }


  /* =========================================================
     PROFILE FACTS
  ========================================================= */

  const factItems = [];

  if(data.location){
    factItems.push(
      `📍 ${data.location}`
    );
  }

  if(data.occupation){
    factItems.push(
      `💼 ${data.occupation}`
    );
  }

  if(data.educationLevel){
    factItems.push(
      `🎓 ${data.educationLevel}`
    );
  }

  if(data.institution){
    factItems.push(
      `🏫 ${data.institution}`
    );
  }

  facts.innerHTML =
    factItems
      .map(item => `<span>${item}</span>`)
      .join("");


  /* =========================================================
     BIO
  ========================================================= */

  bio.textContent =
    data.bio || "";


  /* =========================================================
     SOCIAL LINKS
  ========================================================= */

  const socialLinks =
    Array.isArray(data.socialLinks)
      ? data.socialLinks
      : arrayValue(data.socialLinks);

  const allLinks = [];

  if(data.website){
    allLinks.push(data.website);
  }

  allLinks.push(...socialLinks);


  links.innerHTML =
    allLinks
      .filter(Boolean)
      .map(url => {

        let href = text(url);

        if(
          !href.startsWith("http://") &&
          !href.startsWith("https://")
        ){
          href =
            "https://" + href;
        }

        return `
          <a
            href="${href}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${text(url)}
          </a>
        `;

      })
      .join("");


  /* =========================================================
     INTERESTS
  ========================================================= */

  const interestList =
    Array.isArray(data.interests)
      ? data.interests
      : arrayValue(data.interests);


  if(interestList.length){

    interestSection.hidden = false;

    interests.innerHTML =
      interestList
        .map(item =>
          `<span class="tag">${item}</span>`
        )
        .join("");

  }else{

    interestSection.hidden = true;

    interests.innerHTML = "";

  }


  /* =========================================================
     STATISTICS
  ========================================================= */

  document.getElementById("postCount")
    .textContent =
      data.postCount || 0;

  document.getElementById("followerCount")
    .textContent =
      data.followerCount || 0;

  document.getElementById("followingCount")
    .textContent =
      data.followingCount || 0;

  document.getElementById("connectionCount")
    .textContent =
      data.connectionCount || 0;


  /* =========================================================
     SOCIAL META
  ========================================================= */

  if(photo){

    setMeta(
      'meta[property="og:image"]',
      photo
    );

    setMeta(
      'meta[name="twitter:image"]',
      photo
    );

  }

}


/* =========================================================
   FILL ADD / EDIT FORM
========================================================= */

function fillForm(data = {}){

  setValue(
    "fFirstName",
    data.firstName
  );

  setValue(
    "fLastName",
    data.lastName
  );

  setValue(
    "fName",
    data.displayName
  );

  setValue(
    "fUsername",
    data.username
  );

  setValue(
    "fPhone",
    data.phone
  );

  setValue(
    "fBio",
    data.bio
  );

  setValue(
    "fGender",
    data.gender
  );

  setValue(
    "fDob",
    data.dateOfBirth
  );

  setValue(
    "fLoc",
    data.location
  );

  setValue(
    "fCountry",
    data.country
  );

  setValue(
    "fEducationLevel",
    data.educationLevel
  );

  setValue(
    "fInstitution",
    data.institution
  );

  setValue(
    "fFieldOfStudy",
    data.fieldOfStudy
  );

  setValue(
    "fOccupation",
    data.occupation
  );

  setValue(
    "fSkills",
    Array.isArray(data.skills)
      ? data.skills.join(", ")
      : data.skills
  );

  setValue(
    "fInt",
    Array.isArray(data.interests)
      ? data.interests.join(", ")
      : data.interests
  );

  setValue(
    "fSite",
    data.website
  );

  setValue(
    "fLinks",
    Array.isArray(data.socialLinks)
      ? data.socialLinks.join("\n")
      : data.socialLinks
  );

  setValue(
    "fPhoto",
    data.photoURL
  );

  setValue(
    "fCover",
    data.coverPhoto
  );

  updateBioCount();

}


/* =========================================================
   BIO COUNTER
========================================================= */

function updateBioCount(){

  const field =
    document.getElementById("fBio");

  if(!field) return;

  bioCount.textContent =
    `${field.value.length}/500`;

}


document
  .getElementById("fBio")
  .addEventListener(
    "input",
    updateBioCount
  );


/* =========================================================
   OPEN ADD PROFILE
========================================================= */

addBtn.addEventListener(
  "click",
  () => {

    clearError();

    formTitle.textContent =
      "Add your profile";

    saveBtn.textContent =
      "Add Profile";

    fillForm({});

    editBox.hidden = false;

    editBox.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }
);


/* =========================================================
   OPEN EDIT PROFILE
========================================================= */

editBtn.addEventListener(
  "click",
  () => {

    clearError();

    formTitle.textContent =
      "Edit your profile";

    saveBtn.textContent =
      "Save changes";

    fillForm(
      currentProfile || {}
    );

    editBox.hidden = false;

    editBox.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }
);


/* =========================================================
   CANCEL
========================================================= */

cancelBtn.addEventListener(
  "click",
  () => {

    editBox.hidden = true;

    clearError();

  }
);


/* =========================================================
   ADD / UPDATE PROFILE
========================================================= */

editForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    clearError();

    if(!currentUser){

      fail(
        "Please sign in before adding your profile."
      );

      return;

    }


    const firstName =
      text(
        document.getElementById(
          "fFirstName"
        ).value
      );

    const lastName =
      text(
        document.getElementById(
          "fLastName"
        ).value
      );

    const display =
      text(
        document.getElementById(
          "fName"
        ).value
      );

    const finalDisplayName =
      display ||
      `${firstName} ${lastName}`.trim();


    if(!finalDisplayName){

      fail(
        "Please enter your name."
      );

      return;

    }


    const usernameValue =
      text(
        document.getElementById(
          "fUsername"
        ).value
      )
      .replace(/^@/, "")
      .replace(/\s+/g, "")
      .toLowerCase();


    const data = {

      userId:
        currentUser.uid,

      email:
        currentUser.email || "",

      firstName:
        firstName,

      lastName:
        lastName,

      displayName:
        finalDisplayName,

      username:
        usernameValue,

      phone:
        text(
          document.getElementById(
            "fPhone"
          ).value
        ),

      bio:
        text(
          document.getElementById(
            "fBio"
          ).value
        ),

      gender:
        text(
          document.getElementById(
            "fGender"
          ).value
        ),

      dateOfBirth:
        text(
          document.getElementById(
            "fDob"
          ).value
        ),

      location:
        text(
          document.getElementById(
            "fLoc"
          ).value
        ),

      country:
        text(
          document.getElementById(
            "fCountry"
          ).value
        ),

      educationLevel:
        text(
          document.getElementById(
            "fEducationLevel"
          ).value
        ),

      institution:
        text(
          document.getElementById(
            "fInstitution"
          ).value
        ),

      fieldOfStudy:
        text(
          document.getElementById(
            "fFieldOfStudy"
          ).value
        ),

      occupation:
        text(
          document.getElementById(
            "fOccupation"
          ).value
        ),

      skills:
        arrayValue(
          document.getElementById(
            "fSkills"
          ).value
        ),

      interests:
        arrayValue(
          document.getElementById(
            "fInt"
          ).value
        ),

      website:
        text(
          document.getElementById(
            "fSite"
          ).value
        ),

      socialLinks:
        arrayValue(
          document.getElementById(
            "fLinks"
          ).value
        ),

      photoURL:
        text(
          document.getElementById(
            "fPhoto"
          ).value
        ),

      coverPhoto:
        text(
          document.getElementById(
            "fCover"
          ).value
        ),

      profileCompleted:
        true,

      updatedAt:
        serverTimestamp()

    };


    saveBtn.disabled = true;

    saveBtn.textContent =
      profileExists
        ? "Saving..."
        : "Adding...";


    try{

      const profileRef =
        doc(
          db,
          "profiles",
          currentUser.uid
        );


      if(profileExists){

        await updateDoc(
          profileRef,
          data
        );

        toast(
          "Profile updated successfully"
        );

      }else{

        await setDoc(
          profileRef,
          {

            ...data,

            postCount: 0,

            followerCount: 0,

            followingCount: 0,

            connectionCount: 0,

            createdAt:
              serverTimestamp()

          }
        );

        toast(
          "Profile added successfully"
        );

      }


      profileExists = true;

      currentProfileDocId =
        currentUser.uid;

      currentProfile = {
        ...(currentProfile || {}),
        ...data
      };


      renderProfile(
        currentProfile
      );


      editBox.hidden = true;

      addBtn.hidden = true;

      editBtn.hidden = false;


      saveBtn.disabled = false;

      saveBtn.textContent =
        "Save changes";


    }catch(error){

      console.error(
        "Profile save error:",
        error
      );


      if(
        error?.code ===
        "permission-denied"
      ){

        fail(
          "You don't have permission to add or edit this profile."
        );

      }else if(
        error?.code ===
        "unauthenticated"
      ){

        fail(
          "Your session has expired. Please sign in again."
        );

      }else{

        fail(
          error?.message ||
          "Couldn't save your profile. Please try again."
        );

      }


      saveBtn.disabled = false;

      saveBtn.textContent =
        profileExists
          ? "Save changes"
          : "Add Profile";

    }

  }
);


/* =========================================================
   AUTHENTICATION
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;


    if(!user){

      displayName.textContent =
        "Sign in to add your profile";

      username.textContent =
        "You must be signed in";

      addBtn.hidden = true;

      editBtn.hidden = true;

      editBox.hidden = true;

      return;

    }


    try{

      const result =
        await findProfile(
          user.uid
        );


      if(result){

        profileExists = true;

        currentProfileDocId =
          result.id;

        currentProfile =
          result.data;


        renderProfile(
          result.data
        );


        addBtn.hidden = true;

        editBtn.hidden = false;

        editBox.hidden = true;


      }else{

        profileExists = false;

        currentProfileDocId =
          null;

        currentProfile = null;


        displayName.textContent =
          "Add your profile";

        username.textContent =
          "Create your LetsStudy Pro profile";

        bio.textContent =
          "Add your details to create your LetsStudy Pro profile.";


        addBtn.hidden = false;

        editBtn.hidden = true;

        editBox.hidden = false;


        formTitle.textContent =
          "Add your profile";

        saveBtn.textContent =
          "Add Profile";


        fillForm({});

      }

    }catch(error){

      console.error(
        "Profile loading error:",
        error
      );

      toast(
        "Unable to load profile"
      );

    }

  }
);

</script>
