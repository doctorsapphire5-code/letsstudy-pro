<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | LetsStudy Pro</title>

<meta name="description"
content="Manage your LetsStudy Pro student profile, account information and profile views.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#2563eb;
}

.menu-btn{
  border:0;
  background:#2563eb;
  color:white;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  max-width:900px;
  margin:30px auto;
  padding:0 16px;
}

.profile-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 25px rgba(0,0,0,.07);
}

.cover{
  height:180px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.profile-content{
  padding:0 25px 30px;
}

.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  border:5px solid white;
  margin-top:-55px;
  object-fit:cover;
  background:#e5e7eb;
}

.name{
  margin-top:12px;
  font-size:26px;
  font-weight:800;
}

.email{
  color:#64748b;
  margin-top:5px;
}

.role{
  display:inline-block;
  margin-top:10px;
  padding:6px 12px;
  background:#eff6ff;
  color:#2563eb;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.bio{
  margin-top:20px;
  color:#475569;
  line-height:1.6;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:25px;
}

.stat{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:20px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
  color:#2563eb;
}

.stat span{
  display:block;
  margin-top:5px;
  color:#64748b;
  font-size:13px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:25px;
  flex-wrap:wrap;
}

button{
  border:0;
  cursor:pointer;
}

.primary{
  background:#2563eb;
  color:white;
  padding:12px 20px;
  border-radius:9px;
}

.secondary{
  background:#eef2f7;
  color:#172033;
  padding:12px 20px;
  border-radius:9px;
}

.loading{
  text-align:center;
  padding:50px;
  color:#64748b;
}

.hidden{
  display:none;
}

@media(max-width:600px){

  .cover{
    height:140px;
  }

  .profile-content{
    padding:0 18px 25px;
  }

  .avatar{
    width:90px;
    height:90px;
    margin-top:-45px;
  }

  .name{
    font-size:22px;
  }

  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    LetsStudy Pro
  </div>

  <button class="menu-btn" onclick="goDashboard()">
    Dashboard
  </button>

</header>


<main class="container">

  <div id="loading" class="loading">
    Loading profile...
  </div>


  <section id="profileCard" class="profile-card hidden">

    <div class="cover"></div>

    <div class="profile-content">

      <img
        id="avatar"
        class="avatar"
        src="https://via.placeholder.com/150"
        alt="Profile picture"
      >

      <h1 id="name" class="name">
        Student
      </h1>

      <div id="email" class="email">
        Loading...
      </div>

      <div id="role" class="role">
        Student
      </div>

      <p id="bio" class="bio">
        Welcome to my LetsStudy Pro profile.
      </p>


      <div class="stats">

        <div class="stat">
          <strong id="profileViews">
            0
          </strong>
          <span>
            Profile Views
          </span>
        </div>

        <div class="stat">
          <strong id="courses">
            0
          </strong>
          <span>
            Courses
          </span>
        </div>

        <div class="stat">
          <strong id="points">
            0
          </strong>
          <span>
            Points
          </span>
        </div>

      </div>


      <div class="actions">

        <button
          class="primary"
          onclick="editProfile()">
          Edit Profile
        </button>

        <button
          class="secondary"
          onclick="logout()">
          Logout
        </button>

      </div>

    </div>

  </section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  update,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbKxljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"
};


/* ==========================================
   INITIALIZE FIREBASE
========================================== */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);


/* ==========================================
   ELEMENTS
========================================== */

const loading =
  document.getElementById("loading");

const profileCard =
  document.getElementById("profileCard");

const avatar =
  document.getElementById("avatar");

const nameEl =
  document.getElementById("name");

const emailEl =
  document.getElementById("email");

const roleEl =
  document.getElementById("role");

const bioEl =
  document.getElementById("bio");

const viewsEl =
  document.getElementById("profileViews");

const coursesEl =
  document.getElementById("courses");

const pointsEl =
  document.getElementById("points");


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ==========================================
   LOAD PROFILE
========================================== */

async function loadProfile(user){

  try{

    const userRef =
      ref(db, "users/" + user.uid);

    const snapshot =
      await get(userRef);


    let data = {};

    if(snapshot.exists()){
      data = snapshot.val();
    }


    const name =
      data.name ||
      data.displayName ||
      user.displayName ||
      "Student";


    const email =
      data.email ||
      user.email ||
      "";


    const role =
      data.role ||
      "student";


    const bio =
      data.bio ||
      "Welcome to my LetsStudy Pro profile.";


    const photo =
      data.photoURL ||
      user.photoURL ||
      "https://via.placeholder.com/150";


    const views =
      data.profileViews || 0;


    const courses =
      data.coursesCount ||
      data.courses ||
      0;


    const points =
      data.points ||
      0;


    nameEl.textContent =
      name;

    emailEl.textContent =
      email;

    roleEl.textContent =
      role;

    bioEl.textContent =
      bio;

    avatar.src =
      photo;

    avatar.onerror = function(){

      this.src =
      "https://via.placeholder.com/150";

    };


    viewsEl.textContent =
      views;

    coursesEl.textContent =
      courses;

    pointsEl.textContent =
      points;


    loading.classList.add("hidden");

    profileCard.classList.remove("hidden");


  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );

    loading.textContent =
      "Failed to load profile.";

  }

}


/* ==========================================
   ADD PROFILE VIEW
========================================== */

async function addProfileView(uid){

  try{

    const userRef =
      ref(db, "users/" + uid);

    await update(userRef,{

      profileViews:
        increment(1)

    });

  }catch(error){

    console.error(
      "Profile view error:",
      error
    );

  }

}


/* ==========================================
   AUTH STATE
========================================== */

onAuthStateChanged(
  auth,
  async (user) => {

    if(!user){

      window.location.href =
        "login.html";

      return;

    }


    await loadProfile(user);

    await addProfileView(user.uid);

  }
);


/* ==========================================
   DASHBOARD
========================================== */

window.goDashboard =
function(){

  window.location.href =
    "dashboard.html";

};


/* ==========================================
   EDIT PROFILE
========================================== */

window.editProfile =
function(){

  window.location.href =
    "settings.html";

};


/* ==========================================
   LOGOUT
========================================== */

window.logout =
async function(){

  try{

    await signOut(auth);

    window.location.href =
      "login.html";

  }catch(error){

    console.error(error);

    alert(
      "Logout failed."
    );

  }

};

</script>

</body>
</html>
