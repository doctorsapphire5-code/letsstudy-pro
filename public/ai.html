<body>

<header>
  <div class="brand">LetsStudy <span>Pro AI</span></div>
  <button id="logoutBtn" class="secondary hidden">Logout</button>
</header>

<main><h1>LetsStudy Pro AI Assistant</h1>

  <section id="authPanel" class="panel">
    <h2>Welcome to LetsStudy Pro AI</h2>
    <p class="status">Sign in or create an account to use AI Assistant.</p>

    <input id="email" type="email" placeholder="Email address" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button id="loginBtn" class="primary">Login</button>
    <button id="registerBtn" class="secondary">Create Account</button>

    <p id="authStatus" class="status"></p>
  </section>

  <section id="chatPanel" class="panel hidden">
    <h2>AI Assistant</h2>
    <p class="status">Powered by Gemini AI</p>

    <div id="messages" aria-live="polite">
      <div class="message ai">
        Hello! Welcome to LetsStudy Pro AI.
        How can I help you today?
      </div>
    </div>

    <div class="composer">
      <textarea id="prompt" maxlength="4000" placeholder="Ask anything..."></textarea>
      <button id="sendBtn" class="primary">Send</button>
    </div>

    <p id="chatStatus" class="status"></p>
    <p id="error"></p>
    <button id="clearBtn" class="secondary">New Chat</button>
  </section>

</main>

<footer>
  © 2026 LetsStudy Pro. Learn. Build. Work. Grow.
</footer>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

  // REPLACE WITH YOUR FIREBASE PROJECT CONFIG
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBXbQQ1JH-reWiitVeXV59fdhJP-9BC6mk",
  authDomain: "vorix-al.firebaseapp.com",
  projectId: "vorix-al",
  storageBucket: "vorix-al.firebasestorage.app",
  messagingSenderId: "411010856829",
  appId: "1:411010856829:web:b07e080a4bbb1b2838fe14",
  measurementId: "G-45KFHPCBR7"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const $ = id => document.getElementById(id);

  let history = [];
  let busy = false;

  function showMessage(text, role) {
    const div = document.createElement("div");
    div.className = "message " + role;
    div.textContent = text;
    $("messages").appendChild(div);
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  $("loginBtn").onclick = async () => {
    try {
      $("authStatus").textContent = "Signing in...";
      await signInWithEmailAndPassword(
        auth, $("email").value.trim(), $("password").value
      );
      $("authStatus").textContent = "";
    } catch (e) {
      $("authStatus").textContent = e.message;
    }
  };

  $("registerBtn").onclick = async () => {
    try {
      $("authStatus").textContent = "Creating account...";
      await createUserWithEmailAndPassword(
        auth, $("email").value.trim(), $("password").value
      );
      $("authStatus").textContent = "";
    } catch (e) {
      $("authStatus").textContent = e.message;
    }
  };

  $("logoutBtn").onclick = () => signOut(auth);

  onAuthStateChanged(auth, user => {
    $("authPanel").classList.toggle("hidden", !!user);
    $("chatPanel").classList.toggle("hidden", !user);
    $("logoutBtn").classList.toggle("hidden", !user);
  });

  async function sendMessage() {
    if (busy) return;

    const prompt = $("prompt").value.trim();
    const user = auth.currentUser;

    if (!user) {
      $("error").textContent = "Please login first.";
      return;
    }

    if (!prompt) return;

    busy = true;
    $("sendBtn").disabled = true;
    $("error").textContent = "";
    $("chatStatus").textContent = "AI is thinking...";

    showMessage(prompt, "user");
    $("prompt").value = "";

    const updatedHistory = [
      ...history,
      { role: "user", text: prompt }
    ];

    try {
      const token = await user.getIdToken();

      const response = await fetch("/api/ai", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          messages: updatedHistory.slice(-12)
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "AI request failed.");
      }

      if (!data.reply) {
        throw new Error("No AI response received.");
      }

      history = [
        ...updatedHistory,
        { role: "model", text: data.reply }
      ];

      showMessage(data.reply, "ai");

    } catch (e) {
      $("error").textContent = e.message;
      showMessage("Sorry, the request failed. Please try again.", "ai");
    } finally {
      busy = false;
      $("sendBtn").disabled = false;
      $("chatStatus").textContent = "";
    }
  }

  $("sendBtn").onclick = sendMessage;

  $("prompt").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  $("clearBtn").onclick = () => {
    history = [];
    $("messages").innerHTML = "";
    $("error").textContent = "";
    showMessage("New conversation started. How can I help?", "ai");
  };
</script>
