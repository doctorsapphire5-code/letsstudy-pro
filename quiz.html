<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz | LetsStudy Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.6;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .header {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      color: #2563eb;
    }

    .back-btn {
      border: 0;
      background: #eff6ff;
      color: #2563eb;
      padding: 9px 15px;
      border-radius: 8px;
      font-weight: 700;
    }

    .page {
      max-width: 1000px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .quiz-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
    }

    .quiz-header {
      padding: 28px;
      border-bottom: 1px solid #e5e7eb;
    }

    .badge {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .quiz-title {
      font-size: 30px;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .description {
      color: #64748b;
      margin-bottom: 18px;
    }

    .quiz-info {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .info {
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      color: #475569;
      font-size: 14px;
    }

    .timer {
      background: #fff7ed;
      color: #c2410c;
      font-weight: 800;
    }

    .progress-section {
      padding: 20px 28px;
      border-bottom: 1px solid #e5e7eb;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .progress {
      height: 8px;
      background: #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: #2563eb;
      transition: width .25s;
    }

    .question-area {
      padding: 30px;
    }

    .question-number {
      color: #2563eb;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .question {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      border: 1px solid #dbe2ea;
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: .2s;
    }

    .option:hover {
      background: #f8fafc;
      border-color: #2563eb;
    }

    .option.selected {
      background: #eff6ff;
      border-color: #2563eb;
    }

    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .selected .option-letter {
      background: #2563eb;
      color: white;
    }

    .navigation {
      padding: 20px 30px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      border: 0;
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: 700;
    }

    .primary {
      background: #2563eb;
      color: #fff;
    }

    .primary:hover {
      background: #1d4ed8;
    }

    .secondary {
      background: #f1f5f9;
      color: #334155;
    }

    .submit {
      background: #16a34a;
      color: white;
    }

    .result {
      display: none;
      text-align: center;
      padding: 45px 25px;
    }

    .result-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .result h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .score {
      font-size: 45px;
      font-weight: 800;
      color: #2563eb;
      margin: 10px 0;
    }

    .result-message {
      color: #64748b;
      margin-bottom: 25px;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.97);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: auto auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      display: none;
      text-align: center;
      padding: 80px 20px;
    }

    .error p {
      color: #64748b;
      margin: 10px 0 20px;
    }

    @media(max-width:600px) {
      .page {
        padding: 15px 10px 40px;
      }

      .quiz-header,
      .question-area {
        padding: 20px;
      }

      .quiz-title {
        font-size: 24px;
      }

      .question {
        font-size: 19px;
      }

      .navigation {
        padding: 15px 20px;
      }

      .navigation .btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <div class="loading" id="loading">
    <div>
      <div class="spinner"></div>
      <p>Loading quiz...</p>
    </div>
  </div>

  <header class="header">
    <button class="back-btn" onclick="goBack()">
      ← Back
    </button>

    <div class="logo">
      LetsStudy Pro
    </div>
  </header>

  <main class="page">

    <div class="error" id="errorPage">
      <h2>Quiz Not Found</h2>
      <p id="errorMessage">
        This quiz could not be loaded.
      </p>
      <button class="btn primary" onclick="goBack()">
        Go Back
      </button>
    </div>

    <section class="quiz-card" id="quizCard" style="display:none;">

      <div class="quiz-header">

        <span class="badge">
          Quiz
        </span>

        <h1 class="quiz-title" id="quizTitle">
          Quiz
        </h1>

        <p class="description" id="quizDescription">
          Loading...
        </p>

        <div class="quiz-info">

          <div class="info">
            🎯 Passing:
            <strong id="passingScore">0%</strong>
          </div>

          <div class="info">
            🔄 Attempts:
            <strong id="attempts">0</strong>
          </div>

          <div class="info timer">
            ⏱ Time:
            <strong id="timer">--:--</strong>
          </div>

        </div>

      </div>

      <div class="progress-section">

        <div class="progress-top">
          <span id="questionProgress">
            Question 1 of 1
          </span>

          <strong id="percentage">
            0%
          </strong>
        </div>

        <div class="progress">
          <div
            class="progress-fill"
            id="progressFill"
          ></div>
        </div>

      </div>

      <div id="quizContent">

        <div class="question-area">

          <div class="question-number" id="questionNumber">
            Question 1
          </div>

          <div class="question" id="questionText">
            Loading question...
          </div>

          <div class="options" id="options">
          </div>

        </div>

        <div class="navigation">

          <button
            class="btn secondary"
            id="previousBtn"
            onclick="previousQuestion()"
          >
            ← Previous
          </button>

          <button
            class="btn primary"
            id="nextBtn"
            onclick="nextQuestion()"
          >
            Next →
          </button>

          <button
            class="btn submit"
            id="submitBtn"
            onclick="submitQuiz()"
            style="display:none;"
          >
            Submit Quiz
          </button>

        </div>

      </div>

      <div class="result" id="result">

        <div class="result-icon" id="resultIcon">
          🎉
        </div>

        <h2 id="resultTitle">
          Quiz Completed
        </h2>

        <div class="score" id="resultScore">
          0%
        </div>

        <p class="result-message" id="resultMessage">
          Your result is ready.
        </p>

        <button
          class="btn primary"
          id="retakeBtn"
          onclick="retakeQuiz()"
        >
          Retake Quiz
        </button>

      </div>

    </section>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      query,
      where,
      orderBy,
      getDocs,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


    /* ==========================================
       FIREBASE CONFIG
    ========================================== */

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);

    const auth =
      getAuth(app);


    /* ==========================================
       QUIZ ID
    ========================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const quizId =
      params.get("id");


    /* ==========================================
       VARIABLES
    ========================================== */

    let quiz = null;

    let questions = [];

    let answers = {};

    let currentIndex = 0;

    let currentUser = null;

    let timerInterval = null;

    let remainingSeconds = 0;

    let submitted = false;


    /* ==========================================
       AUTH
    ========================================== */

    onAuthStateChanged(
      auth,
      async user => {

        currentUser = user;

        if (!quizId) {

          showError(
            "No quiz ID was provided."
          );

          return;

        }

        await loadQuiz();

      }
    );


    /* ==========================================
       LOAD QUIZ
    ========================================== */

    async function loadQuiz() {

      try {

        const quizRef =
          doc(
            db,
            "quizzes",
            quizId
          );

        const snapshot =
          await getDoc(
            quizRef
          );


        if (!snapshot.exists()) {

          showError(
            "This quiz does not exist."
          );

          return;

        }


        quiz = {
          id: snapshot.id,
          ...snapshot.data()
        };


        renderQuiz();

        await loadQuestions();

        await checkAttempts();

        startTimer();

        showLoading(false);

        document.getElementById(
          "quizCard"
        ).style.display = "block";


      } catch (error) {

        console.error(
          "Quiz loading error:",
          error
        );

        showError(
          "Unable to load this quiz."
        );

      }

    }


    /* ==========================================
       RENDER QUIZ
    ========================================== */

    function renderQuiz() {

      document.getElementById(
        "quizTitle"
      ).textContent =
        quiz.title ||
        "Untitled Quiz";


      document.getElementById(
        "quizDescription"
      ).textContent =
        quiz.description ||
        "Complete this quiz to test your knowledge.";


      document.getElementById(
        "passingScore"
      ).textContent =
        `${Number(
          quiz.passingScore || 50
        )}%`;


      document.getElementById(
        "attempts"
      ).textContent =
        quiz.attempts || "Unlimited";

    }


    /* ==========================================
       LOAD QUESTIONS
    ========================================== */

    async function loadQuestions() {

      try {

        const questionsRef =
          collection(
            db,
            "quizQuestions"
          );


        const q =
          query(
            questionsRef,
            where(
              "quizId",
              "==",
              quizId
            ),
            orderBy(
              "order",
              "asc"
            )
          );


        const snapshot =
          await getDocs(q);


        questions = [];


        snapshot.forEach(
          item => {

            questions.push({
              id: item.id,
              ...item.data()
            });

          }
        );


        if (
          questions.length === 0
        ) {

          showError(
            "This quiz has no questions yet."
          );

          return;

        }


        renderQuestion();

      } catch (error) {

        console.error(
          "Questions error:",
          error
        );

        showError(
          "Unable to load quiz questions."
        );

      }

    }


    /* ==========================================
       RENDER QUESTION
    ========================================== */

    function renderQuestion() {

      if (
        !questions.length
      ) return;


      const question =
        questions[currentIndex];


      document.getElementById(
        "questionNumber"
      ).textContent =
        `Question ${currentIndex + 1}`;


      document.getElementById(
        "questionText"
      ).textContent =
        question.question ||
        "Question";


      document.getElementById(
        "questionProgress"
      ).textContent =
        `Question ${
          currentIndex + 1
        } of ${
          questions.length
        }`;


      const percent =
        Math.round(
          (
            (currentIndex + 1) /
            questions.length
          ) * 100
        );


      document.getElementById(
        "percentage"
      ).textContent =
        `${percent}%`;


      document.getElementById(
        "progressFill"
      ).style.width =
        `${percent}%`;


      renderOptions(
        question
      );


      updateButtons();

    }


    /* ==========================================
       OPTIONS
    ========================================== */

    function renderOptions(
      question
    ) {

      const container =
        document.getElementById(
          "options"
        );


      container.innerHTML = "";


      let options =
        question.options || [];


      /*
       * Supports:
       * ["A", "B", "C", "D"]
       *
       * OR
       *
       * {
       *   A: "Answer A",
       *   B: "Answer B"
       * }
       */

      if (
        !Array.isArray(options)
      ) {

        options =
          Object.entries(
            options
          ).map(
            ([key, value]) => ({
              key,
              value
            })
          );

      } else {

        options =
          options.map(
            (value, index) => ({
              key:
                String.fromCharCode(
                  65 + index
                ),
              value
            })
          );

      }


      options.forEach(
        option => {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "option";


          const selected =
            answers[
              question.id
            ] === option.key;


          if (selected) {

            button.classList.add(
              "selected"
            );

          }


          button.innerHTML = `

            <span class="option-letter">
              ${escapeHTML(
                option.key
              )}
            </span>

            <span>
              ${escapeHTML(
                option.value
              )}
            </span>

          `;


          button.onclick =
            () => {

              answers[
                question.id
              ] =
                option.key;

              renderOptions(
                question
              );

            };


          container.appendChild(
            button
          );

        }
      );

    }


    /* ==========================================
       NEXT
    ========================================== */

    window.nextQuestion =
      function () {

        if (
          currentIndex <
          questions.length - 1
        ) {

          currentIndex++;

          renderQuestion();

        }

      };


    /* ==========================================
       PREVIOUS
    ========================================== */

    window.previousQuestion =
      function () {

        if (
          currentIndex > 0
        ) {

          currentIndex--;

          renderQuestion();

        }

      };


    /* ==========================================
       BUTTONS
    ========================================== */

    function updateButtons() {

      const previous =
        document.getElementById(
          "previousBtn"
        );

      const next =
        document.getElementById(
          "nextBtn"
        );

      const submit =
        document.getElementById(
          "submitBtn"
        );


      previous.disabled =
        currentIndex === 0;


      if (
        currentIndex ===
        questions.length - 1
      ) {

        next.style.display =
          "none";

        submit.style.display =
          "block";

      } else {

        next.style.display =
          "block";

        submit.style.display =
          "none";

      }

    }


    /* ==========================================
       TIMER
    ========================================== */

    function startTimer() {

      const minutes =
        Number(
          quiz.timeLimit || 0
        );


      if (
        minutes <= 0
      ) {

        document.getElementById(
          "timer"
        ).textContent =
          "Unlimited";

        return;

      }


      remainingSeconds =
        minutes * 60;


      updateTimer();


      timerInterval =
        setInterval(
          () => {

            remainingSeconds--;

            updateTimer();


            if (
              remainingSeconds <= 0
            ) {

              clearInterval(
                timerInterval
              );

              alert(
                "Time is up. Your quiz will be submitted."
              );

              submitQuiz();

            }

          },
          1000
        );

    }


    function updateTimer() {

      const minutes =
        Math.floor(
          remainingSeconds / 60
        );


      const seconds =
        remainingSeconds % 60;


      document.getElementById(
        "timer"
      ).textContent =
        `${String(minutes).padStart(
          2,
          "0"
        )}:${String(seconds).padStart(
          2,
          "0"
        )}`;

    }


    /* ==========================================
       SUBMIT QUIZ
    ========================================== */

    window.submitQuiz =
      async function () {

        if (submitted) {
          return;
        }


        const unanswered =
          questions.filter(
            question =>
  answers[
    question.id
  ] === undefined
);

if (
  unanswered.length > 0
) {

  const confirmSubmit =
    confirm(
      `You have ${unanswered.length} unanswered question(s). Submit anyway?`
    );

  if (!confirmSubmit) {
    return;
  }
}

/* ==========================================
   PREVENT DOUBLE SUBMISSION
========================================== */

if (submitted) {
  return;
}

submitted = true;

if (timerInterval) {
  clearInterval(timerInterval);
  timerInterval = null;
}


/* ==========================================
   CALCULATE SCORE
========================================== */

let score = 0;
let totalPoints = 0;

questions.forEach(question => {

  const points =
    Number(question.points || 1);

  totalPoints += points;

  const selectedAnswer =
    answers[question.id];

  const correctAnswer =
    question.correctAnswer;

  if (
    selectedAnswer !== undefined &&
    String(selectedAnswer).trim().toLowerCase() ===
    String(correctAnswer).trim().toLowerCase()
  ) {
    score += points;
  }

});


const percentage =
  totalPoints > 0
    ? Math.round(
        (score / totalPoints) * 100
      )
    : 0;


const passingScore =
  Number(
    quiz.passingScore || 50
  );


const passed =
  percentage >= passingScore;


/* ==========================================
   SAVE RESULT
========================================== */

try {

  await saveAttempt(
    score,
    totalPoints,
    percentage,
    passed
  );

} catch (error) {

  console.error(
    "Failed to save quiz attempt:",
    error
  );

}


/* ==========================================
   SHOW RESULT
========================================== */

showResult(
  score,
  totalPoints,
  percentage,
  passed
);

};


/* ==========================================
   SAVE QUIZ ATTEMPT
========================================== */

async function saveAttempt(
  score,
  totalPoints,
  percentage,
  passed
) {

  /*
   * User lazima awe logged in
   * ili result ihifadhiwe.
   */

  if (!currentUser) {

    console.warn(
      "User is not logged in. Result was not saved."
    );

    return;

  }


  const attemptId =
    `${quizId}_${Date.now()}`;


  const attemptRef =
    doc(
      db,
      "users",
      currentUser.uid,
      "quizAttempts",
      attemptId
    );


  await setDoc(
    attemptRef,
    {
      quizId: quizId,

      courseId:
        quiz.courseId || "",

      score:
        score,

      totalPoints:
        totalPoints,

      percentage:
        percentage,

      passed:
        passed,

      answers:
        answers,

      submittedAt:
        serverTimestamp()

    }
  );

}


/* ==========================================
   SHOW RESULT
========================================== */

function showResult(
  score,
  totalPoints,
  percentage,
  passed
) {

  const quizContent =
    document.getElementById(
      "quizContent"
    );

  const result =
    document.getElementById(
      "result"
    );


  if (quizContent) {

    quizContent.style.display =
      "none";

  }


  if (result) {

    result.style.display =
      "block";

  }


  const icon =
    document.getElementById(
      "resultIcon"
    );

  const title =
    document.getElementById(
      "resultTitle"
    );

  const scoreElement =
    document.getElementById(
      "resultScore"
    );

  const message =
    document.getElementById(
      "resultMessage"
    );


  if (passed) {

    if (icon) {
      icon.textContent = "🎉";
    }

    if (title) {
      title.textContent =
        "Congratulations! You Passed";
    }

  } else {

    if (icon) {
      icon.textContent = "📚";
    }

    if (title) {
      title.textContent =
        "Quiz Not Passed";
    }

  }


  if (scoreElement) {

    scoreElement.textContent =
      `${percentage}%`;

  }


  if (message) {

    message.textContent =
      `You scored ${score} out of ${totalPoints} points. Passing score: ${quiz.passingScore || 50}%.`;

  }


  updateResultDetails(
    score,
    totalPoints,
    percentage,
    passed
  );

}


/* ==========================================
   RESULT DETAILS
========================================== */

function updateResultDetails(
  score,
  totalPoints,
  percentage,
  passed
) {

  const result =
    document.getElementById(
      "result"
    );

  if (!result) {
    return;
  }


  let details =
    document.getElementById(
      "resultDetails"
    );


  if (!details) {

    details =
      document.createElement(
        "div"
      );

    details.id =
      "resultDetails";

    details.style.marginTop =
      "20px";

    details.style.padding =
      "15px";

    details.style.background =
      "#f8fafc";

    details.style.borderRadius =
      "10px";

    result.appendChild(
      details
    );

  }


  details.innerHTML = `

    <div style="
      display:flex;
      justify-content:center;
      gap:25px;
      flex-wrap:wrap;
      color:#475569;
    ">

      <span>
        <strong>${score}</strong>
        Correct Points
      </span>

      <span>
        <strong>${totalPoints}</strong>
        Total Points
      </span>

      <span>
        <strong>${percentage}%</strong>
        Score
      </span>

      <span>
        <strong>
          ${passed ? "PASSED" : "FAILED"}
        </strong>
        Status
      </span>

    </div>

  `;

}


/* ==========================================
   RETAKE QUIZ
========================================== */

window.retakeQuiz =
  async function () {

    if (!quiz) {
      return;
    }


    /*
     * Check attempts again
     */

    if (currentUser) {

      try {

        const attemptsRef =
          collection(
            db,
            "users",
            currentUser.uid,
            "quizAttempts"
          );


        const q =
          query(
            attemptsRef,
            where(
              "quizId",
              "==",
              quizId
            )
          );


        const snapshot =
          await getDocs(q);


        const used =
          snapshot.size;


        const allowed =
          Number(
            quiz.attempts || 0
          );


        /*
         * 0 = unlimited
         */

        if (
          allowed > 0 &&
          used >= allowed
        ) {

          alert(
            "You have used all your allowed attempts."
          );

          return;

        }

      } catch (error) {

        console.error(
          "Attempt check error:",
          error
        );

      }

    }


    submitted = false;

    answers = {};

    currentIndex = 0;


    const result =
      document.getElementById(
        "result"
      );

    const quizContent =
      document.getElementById(
        "quizContent"
      );


    if (result) {

      result.style.display =
        "none";

    }


    if (quizContent) {

      quizContent.style.display =
        "block";

    }


    if (timerInterval) {

      clearInterval(
        timerInterval
      );

      timerInterval = null;

    }


    renderQuestion();

    startTimer();

  };


/* ==========================================
   CHECK USER ATTEMPTS
========================================== */

async function checkAttempts() {

  /*
   * Kama user haja-login,
   * quiz inaweza kuonekana,
   * lakini attempts haziwezi
   * kuhifadhiwa kwa user.
   */

  if (!currentUser) {
    return true;
  }


  /*
   * attempts = 0
   * maana yake unlimited.
   */

  const allowedAttempts =
    Number(
      quiz.attempts || 0
    );


  if (
    allowedAttempts <= 0
  ) {

    return true;

  }


  try {

    const attemptsRef =
      collection(
        db,
        "users",
        currentUser.uid,
        "quizAttempts"
      );


    const q =
      query(
        attemptsRef,
        where(
          "quizId",
          "==",
          quizId
        )
      );


    const snapshot =
      await getDocs(q);


    const usedAttempts =
      snapshot.size;


    document.getElementById(
      "attempts"
    ).textContent =
      `${usedAttempts}/${allowedAttempts}`;


    if (
      usedAttempts >=
      allowedAttempts
    ) {

      showNoAttempts();

      return false;

    }


    return true;

  } catch (error) {

    console.error(
      "Unable to check attempts:",
      error
    );

    return true;

  }

}


/* ==========================================
   NO ATTEMPTS
========================================== */

function showNoAttempts() {

  if (timerInterval) {

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }


  const quizContent =
    document.getElementById(
      "quizContent"
    );


  if (!quizContent) {
    return;
  }


  quizContent.innerHTML = `

    <div class="question-area"
         style="text-align:center">

      <div style="
        font-size:50px;
        margin-bottom:10px;
      ">
        🔒
      </div>

      <h2>
        No Attempts Remaining
      </h2>

      <p style="
        color:#64748b;
        margin-top:10px;
      ">
        You have used all your allowed
        attempts for this quiz.
      </p>

      <button
        class="btn primary"
        onclick="goBack()"
        style="margin-top:20px"
      >
        ← Back to Course
      </button>

    </div>

  `;

}


/* ==========================================
   TIMER
========================================== */

function startTimer() {

  if (timerInterval) {

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }


  const timeLimit =
    Number(
      quiz.timeLimit || 0
    );


  /*
   * 0 = unlimited
   */

  if (
    timeLimit <= 0
  ) {

    const timer =
      document.getElementById(
        "timer"
      );

    if (timer) {
      timer.textContent =
        "Unlimited";
    }

    return;

  }


  remainingSeconds =
    timeLimit * 60;


  updateTimer();


  timerInterval =
    setInterval(
      () => {

        remainingSeconds--;

        updateTimer();


        /*
         * Warning
         */

        if (
          remainingSeconds === 60
        ) {

          const timer =
            document.getElementById(
              "timer"
            );

          if (timer) {

            timer.style.background =
              "#fee2e2";

            timer.style.color =
              "#dc2626";

          }

        }


        /*
         * Time finished
         */

        if (
          remainingSeconds <= 0
        ) {

          clearInterval(
            timerInterval
          );

          timerInterval =
            null;


          alert(
            "Time is up. Your quiz will be submitted automatically."
          );


          submitQuiz();

        }

      },
      1000
    );

}


/* ==========================================
   UPDATE TIMER
========================================== */

function updateTimer() {

  const timer =
    document.getElementById(
      "timer"
    );


  if (!timer) {
    return;
  }


  if (
    remainingSeconds <= 0
  ) {

    timer.textContent =
      "00:00";

    return;

  }


  const minutes =
    Math.floor(
      remainingSeconds / 60
    );


  const seconds =
    remainingSeconds % 60;


  timer.textContent =
    `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

}


/* ==========================================
   PROGRESS
========================================== */

function updateQuestionProgress() {

  if (
    questions.length === 0
  ) {

    return;

  }


  const current =
    currentIndex + 1;


  const percentage =
    Math.round(
      (current /
        questions.length) *
      100
    );


  const text =
    document.getElementById(
      "questionProgress"
    );


  const percent =
    document.getElementById(
      "percentage"
    );


  const fill =
    document.getElementById(
      "progressFill"
    );


  if (text) {

    text.textContent =
      `Question ${current} of ${questions.length}`;

  }


  if (percent) {

    percent.textContent =
      `${percentage}%`;

  }


  if (fill) {

    fill.style.width =
      `${percentage}%`;

  }

}


/* ==========================================
   KEYBOARD SUPPORT
========================================== */

document.addEventListener(
  "keydown",
  event => {

    if (
      submitted ||
      !questions.length
    ) {

      return;

    }


    if (
      event.key === "ArrowRight"
    ) {

      nextQuestion();

    }


    if (
      event.key === "ArrowLeft"
    ) {

      previousQuestion();

    }

  }
);


/* ==========================================
   PREVENT ACCIDENTAL LEAVE
========================================== */

window.addEventListener(
  "beforeunload",
  event => {

    if (
      submitted ||
      !questions.length
    ) {

      return;

    }


    const answered =
      Object.keys(
        answers
      ).length;


    if (
      answered > 0
    ) {

      event.preventDefault();

      event.returnValue = "";

    }

  }
);


/* ==========================================
   BACK BUTTON
========================================== */

window.goBack =
  function () {

    if (
      document.referrer
    ) {

      history.back();

    } else {

      window.location.href =
        "courses.html";

    }

  };


/* ==========================================
   LOADING
========================================== */

function showLoading(
  show
) {

  const loading =
    document.getElementById(
      "loading"
    );


  if (!loading) {
    return;
  }


  loading.style.display =
    show
      ? "flex"
      : "none";

}


/* ==========================================
   ERROR
========================================== */

function showError(
  message
) {

  showLoading(false);


  const quizCard =
    document.getElementById(
      "quizCard"
    );


  const errorPage =
    document.getElementById(
      "errorPage"
    );


  const errorMessage =
    document.getElementById(
      "errorMessage"
    );


  if (quizCard) {

    quizCard.style.display =
      "none";

  }


  if (errorPage) {

    errorPage.style.display =
      "block";

  }


  if (errorMessage) {

    errorMessage.textContent =
      message;

  }

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
