<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Quizzes | LetsStudy Pro</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.topbar-inner{
  max-width:1400px;
  margin:auto;
  min-height:64px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#2563eb;
}

.logo span{
  color:#111827;
}

.back-btn{
  border:1px solid #e5e7eb;
  background:#fff;
  color:#374151;
  padding:9px 14px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.back-btn:hover{
  background:#f8fafc;
}

.page{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:25px 20px 40px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:22px;
}

.card,
.sidebar,
.loading,
.error{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(15,23,42,.05);
}

.card{
  overflow:hidden;
}

.quiz-header{
  padding:28px;
  border-bottom:1px solid #e5e7eb;
}

.quiz-title{
  margin:0 0 10px;
  font-size:clamp(24px,3vw,35px);
  line-height:1.25;
  color:#111827;
}

.quiz-description{
  margin:0;
  color:#64748b;
  line-height:1.7;
  white-space:pre-wrap;
}

.quiz-meta{
  padding:16px 28px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  border-bottom:1px solid #e5e7eb;
}

.badge{
  padding:7px 11px;
  border-radius:8px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  color:#475569;
  font-size:12px;
  font-weight:700;
}

.quiz-info{
  padding:28px;
}

.quiz-info h2{
  margin:0 0 18px;
  font-size:19px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.info-box{
  padding:14px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:10px;
  min-width:0;
}

.info-box small{
  display:block;
  color:#64748b;
  font-size:11px;
  margin-bottom:6px;
}

.info-box strong{
  display:block;
  color:#111827;
  font-size:13px;
  overflow-wrap:anywhere;
}

.sidebar{
  position:sticky;
  top:85px;
  max-height:calc(100vh - 105px);
  overflow:hidden;
}

.sidebar-header{
  padding:18px;
  border-bottom:1px solid #e5e7eb;
}

.sidebar-header h2{
  margin:0;
  font-size:17px;
}

.sidebar-header p{
  margin:5px 0 0;
  color:#64748b;
  font-size:12px;
}

.quiz-list{
  padding:10px;
  overflow-y:auto;
  max-height:calc(100vh - 205px);
}

.quiz-item{
  width:100%;
  text-align:left;
  border:1px solid transparent;
  background:#f8fafc;
  border-radius:10px;
  padding:14px;
  margin-bottom:8px;
  cursor:pointer;
}

.quiz-item:hover{
  background:#eff6ff;
  border-color:#bfdbfe;
}

.quiz-item.active{
  background:#eff6ff;
  border-color:#2563eb;
}

.quiz-item-title{
  display:block;
  color:#111827;
  font-size:13px;
  font-weight:750;
  line-height:1.4;
}

.quiz-item-meta{
  display:block;
  margin-top:7px;
  color:#64748b;
  font-size:11px;
}

.quiz-item-number{
  display:block;
  color:#2563eb;
  font-size:10px;
  font-weight:800;
  margin-bottom:5px;
  text-transform:uppercase;
}

.loading,
.error{
  padding:60px 25px;
  text-align:center;
}

.loader{
  width:42px;
  height:42px;
  margin:0 auto 16px;
  border:4px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loading h2,
.error h2{
  margin:0 0 9px;
}

.loading p,
.error p{
  margin:0;
  color:#64748b;
  line-height:1.6;
}

.error button{
  margin-top:18px;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:11px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.hidden{
  display:none!important;
}

footer{
  text-align:center;
  padding:25px;
  color:#64748b;
  font-size:12px;
}

@media(max-width:1000px){

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:static;
    max-height:none;
  }

  .quiz-list{
    max-height:420px;
  }
}

@media(max-width:650px){

  .topbar-inner{
    padding:0 13px;
  }

  .logo{
    font-size:18px;
  }

  .page{
    padding:12px 0 30px;
  }

  .card{
    border-radius:0;
    border-left:0;
    border-right:0;
  }

  .quiz-header{
    padding:20px 16px;
  }

  .quiz-meta{
    padding:14px 16px;
  }

  .quiz-info{
    padding:20px 16px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .sidebar{
    margin:0 10px;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <div class="logo">
      LetsStudy <span>Pro</span>
    </div>

    <button
      id="backBtn"
      class="back-btn"
      type="button"
    >
      ← Back
    </button>

  </div>

</header>


<main class="page">

  <!-- ================================================
       LOADING
  ================================================= -->

  <div
    id="loading"
    class="loading"
  >

    <div class="loader"></div>

    <h2>
      Loading Quizzes...
    </h2>

    <p>
      Loading quiz data from Firestore.
    </p>

  </div>


  <!-- ================================================
       ERROR
  ================================================= -->

  <div
    id="errorBox"
    class="error hidden"
  ></div>


  <!-- ================================================
       MAIN
  ================================================= -->

  <div
    id="layout"
    class="layout hidden"
  >

    <section>

      <article class="card">

        <div class="quiz-header">

          <h1
            id="quizTitle"
            class="quiz-title"
          >
            —
          </h1>

          <p
            id="quizDescription"
            class="quiz-description"
          >
            —
          </p>

        </div>


        <div
          id="quizMeta"
          class="quiz-meta"
        ></div>


        <div class="quiz-info">

          <h2>
            Quiz Information
          </h2>

          <div class="info-grid">

            <div class="info-box">

              <small>
                Quiz ID
              </small>

              <strong id="quizId">
                —
              </strong>

            </div>


            <div class="info-box">

              <small>
                Course ID
              </small>

              <strong id="courseId">
                —
              </strong>

            </div>


            <div class="info-box">

              <small>
                Passing Score
              </small>

              <strong id="passingScore">
                —
              </strong>

            </div>


            <div class="info-box">

              <small>
                Time Limit
              </small>

              <strong id="timeLimit">
                —
              </strong>

            </div>


            <div class="info-box">

              <small>
                Attempts
              </small>

              <strong id="attempts">
                —
              </strong>

            </div>


            <div class="info-box">

              <small>
                Created By
              </small>

              <strong id="createdBy">
                —
              </strong>

            </div>


            <div class="info-box">

              <small>
                Created At
              </small>

              <strong id="createdAt">
                —
              </strong>

            </div>

          </div>

        </div>

      </article>

    </section>


    <!-- ================================================
         QUIZ LIST
    ================================================= -->

    <aside class="sidebar">

      <div class="sidebar-header">

        <h2>
          Course Quizzes
        </h2>

        <p>
          Select a quiz to view its information.
        </p>

      </div>


      <div
        id="quizList"
        class="quiz-list"
      ></div>

    </aside>

  </div>

</main>


<footer>
  © 2026 LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

/* =====================================================
   FIREBASE SDK
===================================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXKbljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
  initializeApp(
    firebaseConfig
  );

const db =
  getFirestore(
    app
  );


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "errorBox"
  );

const layout =
  document.getElementById(
    "layout"
  );

const quizList =
  document.getElementById(
    "quizList"
  );


/* =====================================================
   STATE
===================================================== */

const quizzesMap =
  new Map();

let currentQuizId =
  null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value){
    return "—";
  }

  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value
        .toDate()
        .toLocaleString(
          "en-US",
          {
            dateStyle:"medium",
            timeStyle:"short"
          }
        );

    }


    const date =
      new Date(value);


    if(
      !isNaN(
        date.getTime()
      )
    ){

      return date.toLocaleString(
        "en-US",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );

    }

  }catch(error){

    console.warn(
      "Date formatting error:",
      error
    );

  }

  return String(value);

}


/* =====================================================
   DISPLAY QUIZ
===================================================== */

function displayQuiz(
  quizId,
  data
){

  currentQuizId =
    quizId;


  document.title =
    `${
      data.title ||
      "Quiz"
    } | LetsStudy Pro`;


  document.getElementById(
    "quizTitle"
  ).textContent =
    data.title ||
    "Untitled Quiz";


  document.getElementById(
    "quizDescription"
  ).textContent =
    data.description ||
    "No quiz description available.";


  document.getElementById(
    "quizId"
  ).textContent =
    quizId;


  document.getElementById(
    "courseId"
  ).textContent =
    data.courseId ||
    "—";


  document.getElementById(
    "passingScore"
  ).textContent =
    data.passingScore ??
    "—";


  document.getElementById(
    "timeLimit"
  ).textContent =
    data.timeLimit ??
    "—";


  document.getElementById(
    "attempts"
  ).textContent =
    data.attempts ??
    "—";


  document.getElementById(
    "createdBy"
  ).textContent =
    data.createdBy ||
    "—";


  document.getElementById(
    "createdAt"
  ).textContent =
    formatDate(
      data.createdAt
    );


  document.getElementById(
    "quizMeta"
  ).innerHTML = `

    <span class="badge">
      Passing Score:
      ${escapeHtml(
        data.passingScore ??
        "—"
      )}
    </span>

    <span class="badge">
      Time Limit:
      ${escapeHtml(
        data.timeLimit ??
        "—"
      )}
    </span>

    <span class="badge">
      Attempts:
      ${escapeHtml(
        data.attempts ??
        "—"
      )}
    </span>

  `;


  document
    .querySelectorAll(
      ".quiz-item"
    )
    .forEach(
      item => {

        item.classList.toggle(
          "active",
          item.dataset.id ===
          quizId
        );

      }
    );

}


/* =====================================================
   OPEN QUIZ DOCUMENT
===================================================== */

async function openQuiz(
  quizId
){

  try{

    const quizRef =
      doc(
        db,
        "quizzes",
        quizId
      );


    const quizSnap =
      await getDoc(
        quizRef
      );


    if(
      !quizSnap.exists()
    ){

      showError(
        "This quiz does not exist in Firestore."
      );

      return;

    }


    const data =
      quizSnap.data();


    quizzesMap.set(
      quizId,
      data
    );


    displayQuiz(
      quizId,
      data
    );


  }catch(error){

    console.error(
      "Failed to load quiz:",
      error
    );


    showError(
      error.message ||
      "Unable to load quiz from Firestore."
    );

  }

}


/* =====================================================
   RENDER QUIZ LIST
===================================================== */

function renderQuizList(){

  quizList.innerHTML =
    "";


  const quizzes =
    Array.from(
      quizzesMap.entries()
    );


  quizzes.forEach(
    (
      [quizId,data],
      index
    ) => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "quiz-item";


      button.dataset.id =
        quizId;


      button.innerHTML = `

        <span class="quiz-item-number">
          Quiz ${index + 1}
        </span>

        <span class="quiz-item-title">
          ${escapeHtml(
            data.title ||
            "Untitled Quiz"
          )}
        </span>

        <span class="quiz-item-meta">

          Passing:
          ${escapeHtml(
            data.passingScore ??
            "—"
          )}

          •

          Attempts:
          ${escapeHtml(
            data.attempts ??
            "—"
          )}

        </span>

      `;


      button.addEventListener(
        "click",
        () => {

          openQuiz(
            quizId
          );

        }
      );


      quizList.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
){

  loading.classList.add(
    "hidden"
  );

  layout.classList.add(
    "hidden"
  );

  errorBox.classList.remove(
    "hidden"
  );


  errorBox.innerHTML = `

    <h2>
      Failed to Load Quiz
    </h2>

    <p>
      ${escapeHtml(
        message
      )}
    </p>

    <button
      id="retryButton"
      type="button"
    >
      Retry
    </button>

  `;


  document
    .getElementById(
      "retryButton"
    )
    ?.addEventListener(
      "click",
      () => {

        errorBox.classList.add(
          "hidden"
        );

        loading.classList.remove(
          "hidden"
        );

        loadQuizzes();

      }
    );

}


/* =====================================================
   LOAD FIRESTORE COLLECTION
===================================================== */

async function loadQuizzes(){

  try{

    console.log(
      "Loading quizzes collection..."
    );


    /*
     * READ:
     *
     * quizzes/{quizId}
     */

    const quizzesRef =
      collection(
        db,
        "quizzes"
      );


    const snapshot =
      await getDocs(
        quizzesRef
      );


    console.log(
      "Quizzes found:",
      snapshot.size
    );


    quizzesMap.clear();


    /* =================================================
       READ EVERY DOCUMENT
    ================================================= */

    snapshot.forEach(
      quizDoc => {

        /*
         * REAL FIRESTORE DOCUMENT ID
         */

        const quizId =
          quizDoc.id;


        /*
         * ALL DOCUMENT DATA
         */

        const data =
          quizDoc.data();


        console.log(
          "Loaded quiz:",
          quizId,
          data
        );


        quizzesMap.set(
          quizId,
          data
        );

      }
    );


    /* =================================================
       STOP LOADING
    ================================================= */

    loading.classList.add(
      "hidden"
    );


    /* =================================================
       EMPTY COLLECTION
    ================================================= */

    if(
      quizzesMap.size === 0
    ){

      errorBox.classList.remove(
        "hidden"
      );


      errorBox.innerHTML = `

        <h2>
          No Quizzes Found
        </h2>

        <p>
          No documents were found in the
          <strong>quizzes</strong>
          Firestore collection.
        </p>

      `;

      return;

    }


    /* =================================================
       SHOW PAGE
    ================================================= */

    errorBox.classList.add(
      "hidden"
    );


    layout.classList.remove(
      "hidden"
    );


    /* =================================================
       RENDER LIST
    ================================================= */

    renderQuizList();


    /* =================================================
       OPEN FIRST QUIZ
    ================================================= */

    const firstQuiz =
      Array.from(
        quizzesMap.entries()
      )[0];


    if(firstQuiz){

      displayQuiz(
        firstQuiz[0],
        firstQuiz[1]
      );

    }

  }catch(error){

    console.error(
      "Failed to load quizzes:",
      error
    );


    showError(
      error.message ||
      "Unable to read quizzes from Firestore."
    );

  }

}


/* =====================================================
   BACK BUTTON
===================================================== */

document
  .getElementById(
    "backBtn"
  )
  .addEventListener(
    "click",
    () => {

      if(
        window.history.length > 1
      ){

        window.history.back();

      }else{

        window.location.href =
          "courses.html";

      }

    }
  );


/* =====================================================
   START
===================================================== */

loadQuizzes();

</script>

</body>
</html>
