<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Quiz | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#2563eb;
  text-decoration:none;
  font-size:13px;
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:27px;
}

.description{
  color:#64748b;
  line-height:1.7;
  margin-top:10px;
}

.meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:16px;
}

.badge{
  padding:7px 11px;
  border-radius:20px;
  background:#f1f5f9;
  color:#475569;
  font-size:12px;
}

.start-box{
  text-align:center;
  padding:30px 15px;
}

.start-box i{
  font-size:45px;
  color:#2563eb;
  margin-bottom:15px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#e2e8f0;
  color:#334155;
}

.question{
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:18px;
  margin-bottom:14px;
}

.question-number{
  color:#2563eb;
  font-weight:bold;
  font-size:12px;
  margin-bottom:8px;
}

.question-text{
  font-size:16px;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:15px;
}

.option{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:12px;
  margin:7px 0;
  border:1px solid #e2e8f0;
  border-radius:9px;
  cursor:pointer;
}

.option:hover{
  background:#f8fafc;
}

.option input{
  margin-top:3px;
}

.timer{
  position:sticky;
  top:10px;
  z-index:10;
  background:#172033;
  color:#fff;
  border-radius:12px;
  padding:13px;
  text-align:center;
  margin-bottom:15px;
  font-weight:bold;
}

.timer.warning{
  background:#dc2626;
}

.progress{
  height:8px;
  background:#e2e8f0;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progress-bar{
  height:100%;
  width:0;
  background:#2563eb;
  transition:.3s;
}

.result{
  text-align:center;
}

.score{
  font-size:42px;
  font-weight:bold;
  color:#2563eb;
  margin:10px 0;
}

.pass{
  color:#15803d;
  font-weight:bold;
}

.fail{
  color:#dc2626;
  font-weight:bold;
}

.loading,
.error{
  text-align:center;
  padding:60px 20px;
  color:#64748b;
}

.loading i,
.error i{
  font-size:38px;
  margin-bottom:15px;
}

.error{
  color:#991b1b;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .card{
    padding:16px;
  }

  h1{
    font-size:22px;
  }

  .question-text{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- LOADING -->
  <div id="loading" class="card loading">

    <i class="fa-solid fa-spinner fa-spin"></i>

    <br><br>

    Loading quiz...

  </div>


  <!-- ERROR -->
  <div id="error" class="card error hidden">

    <i class="fa-solid fa-triangle-exclamation"></i>

    <h3>Unable to load quiz</h3>

    <p id="errorText"></p>

  </div>


  <!-- QUIZ INFO -->
  <div id="quizPage" class="hidden">

    <div class="card">

      <a
        href="javascript:history.back()"
        class="back">

        <i class="fa-solid fa-arrow-left"></i>

        Back

      </a>


      <h1 id="quizTitle">
        Quiz
      </h1>


      <div
        id="quizDescription"
        class="description">
      </div>


      <div
        id="quizMeta"
        class="meta">
      </div>

    </div>


    <!-- START -->
    <div
      id="startBox"
      class="card start-box">

      <i class="fa-solid fa-circle-play"></i>

      <h2>
        Ready to start?
      </h2>

      <p>
        Answer all questions before submitting your quiz.
      </p>

      <button
        id="startBtn"
        class="btn primary">

        <i class="fa-solid fa-play"></i>

        Start Quiz

      </button>

    </div>


    <!-- QUIZ -->
    <div
      id="quizBox"
      class="hidden">

      <div
        id="timer"
        class="timer">

        <i class="fa-regular fa-clock"></i>

        <span id="time">
          --:--
        </span>

      </div>


      <div class="card">

        <div>
          <strong>
            Quiz Progress
          </strong>

          <span id="progressText">
            0 / 0
          </span>
        </div>


        <div class="progress">

          <div
            id="progressBar"
            class="progress-bar">
          </div>

        </div>


        <div id="questions"></div>


        <button
          id="submitBtn"
          class="btn primary">

          <i class="fa-solid fa-paper-plane"></i>

          Submit Quiz

        </button>

      </div>

    </div>


    <!-- RESULT -->
    <div
      id="resultBox"
      class="card result hidden">

      <i
        id="resultIcon"
        class="fa-solid fa-trophy"
        style="font-size:45px">
      </i>


      <h2>
        Quiz Result
      </h2>


      <div
        id="score"
        class="score">
        0%
      </div>


      <div id="resultStatus"></div>


      <p id="resultMessage"></p>


      <button
        onclick="location.reload()"
        class="btn secondary">

        <i class="fa-solid fa-rotate"></i>

        Try Again

      </button>

    </div>

  </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const errorText =
  document.getElementById("errorText");

const quizPage =
  document.getElementById("quizPage");

const quizTitle =
  document.getElementById("quizTitle");

const quizDescription =
  document.getElementById("quizDescription");

const quizMeta =
  document.getElementById("quizMeta");

const startBox =
  document.getElementById("startBox");

const startBtn =
  document.getElementById("startBtn");

const quizBox =
  document.getElementById("quizBox");

const questionsBox =
  document.getElementById("questions");

const submitBtn =
  document.getElementById("submitBtn");

const timerBox =
  document.getElementById("timer");

const timeText =
  document.getElementById("time");

const progressText =
  document.getElementById("progressText");

const progressBar =
  document.getElementById("progressBar");

const resultBox =
  document.getElementById("resultBox");

const scoreBox =
  document.getElementById("score");

const resultStatus =
  document.getElementById("resultStatus");

const resultMessage =
  document.getElementById("resultMessage");

const resultIcon =
  document.getElementById("resultIcon");


/* =====================================================
   QUIZ ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const quizId =
  params.get("id");


/* =====================================================
   STATE
===================================================== */

let quiz = null;

let questions = [];

let timeLeft = 0;

let timer = null;

let submitted = false;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

  loading.classList.add("hidden");

  quizPage.classList.add("hidden");

  errorBox.classList.remove("hidden");

  errorText.textContent = text;

}


/* =====================================================
   LOAD QUIZ
===================================================== */

async function loadQuiz(){

  if(!quizId){

    showError(
      "Quiz ID is missing. Use quiz.html?id=QUIZ_ID"
    );

    return;

  }


  try{

    const quizRef =
      doc(
        db,
        "quizzes",
        quizId
      );


    const snapshot =
      await getDoc(quizRef);


    if(!snapshot.exists()){

      showError(
        "Quiz not found."
      );

      return;

    }


    quiz = {

      id: snapshot.id,

      ...snapshot.data()

    };


    /* TITLE */

    quizTitle.textContent =
      quiz.title ||
      "Untitled Quiz";


    document.title =
      `${
        quiz.title ||
        "Quiz"
      } | LetsStudy Pro`;


    /* DESCRIPTION */

    quizDescription.textContent =
      quiz.description ||
      "No description available.";


    /* META */

    quizMeta.innerHTML = `

      <span class="badge">

        <i class="fa-solid fa-percent"></i>

        Passing Score:
        ${Number(
          quiz.passingScore || 0
        )}%

      </span>


      <span class="badge">

        <i class="fa-regular fa-clock"></i>

        Time:
        ${
          quiz.timeLimit
            ? escapeHTML(
                quiz.timeLimit
              )
            : "Unlimited"
        }

      </span>


      <span class="badge">

        <i class="fa-solid fa-rotate"></i>

        Attempts:
        ${
          quiz.attempts ||
          "Unlimited"
        }

      </span>

    `;


    await loadQuestions();


    loading.classList.add("hidden");

    quizPage.classList.remove("hidden");


  }
  catch(error){

    console.error(
      error
    );

    showError(
      error.message ||
      "Failed to load quiz."
    );

  }

}


/* =====================================================
   LOAD QUESTIONS
===================================================== */

/*
  This supports a questions collection like:

  questions/{questionId}

  quizId
  question
  options
  correctAnswer
  order

*/

async function loadQuestions(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "questions"
        )
      );


    questions =
      snapshot.docs
        .map(item => ({

          id:item.id,

          ...item.data()

        }))
        .filter(
          question =>
            question.quizId ===
            quizId
        )
        .sort(
          (a,b) =>
            Number(
              a.order || 0
            ) -
            Number(
              b.order || 0
            )
        );


    /*
      If there are no question
      documents, show empty quiz.
    */

    if(!questions.length){

      questionsBox.innerHTML = `

        <div class="loading">

          <i class="fa-solid fa-circle-info"></i>

          <br><br>

          No questions have been added to this quiz yet.

        </div>

      `;

      startBtn.disabled = true;

    }

  }
  catch(error){

    console.error(
      "Questions error:",
      error
    );

    /*
      Quiz model itself is still displayed.
      Questions can be added later.
    */

    questions = [];

  }

}


/* =====================================================
   START QUIZ
===================================================== */

startBtn.addEventListener(
  "click",
  () => {

    if(!questions.length){

      alert(
        "This quiz has no questions yet."
      );

      return;

    }


    startBox.classList.add(
      "hidden"
    );

    quizBox.classList.remove(
      "hidden"
    );


    renderQuestions();


    startTimer();

  }
);


/* =====================================================
   RENDER QUESTIONS
===================================================== */

function renderQuestions(){

  questionsBox.innerHTML =
    questions.map(
      (question,index) => {

        let options =
          question.options || [];


        /*
          Supports both:

          options: ["A","B","C"]

          and

          options: {
            A:"...",
            B:"..."
          }
        */

        if(
          !Array.isArray(options) &&
          typeof options === "object"
        ){

          options =
            Object.entries(
              options
            ).map(
              ([key,value]) => ({
                key,
                value
              })
            );

        }
        else{

          options =
            options.map(
              (value,i) => ({
                key:
                  String.fromCharCode(
                    65+i
                  ),
                value
              })
            );

        }


        return `

          <div
            class="question"
            data-question="${escapeHTML(
              question.id
            )}">

            <div class="question-number">

              QUESTION ${index + 1}

            </div>


            <div class="question-text">

              ${escapeHTML(
                question.question ||
                question.title ||
                "Question"
              )}

            </div>


            ${
              options.length

              ?

              options.map(
                option => `

                  <label class="option">

                    <input
                      type="radio"
                      name="question-${escapeHTML(
                        question.id
                      )}"
                      value="${escapeHTML(
                        option.key
                      )}">

                    <span>

                      <strong>
                        ${escapeHTML(
                          option.key
                        )}.
                      </strong>

                      ${escapeHTML(
                        option.value
                      )}

                    </span>

                  </label>

                `
              ).join("")

              :

              `

              <div class="description">

                No options available.

              </div>

              `
            }

          </div>

        `;

      }
    ).join("");


  updateProgress();

}


/* =====================================================
   PROGRESS
===================================================== */

questionsBox.addEventListener(
  "change",
  updateProgress
);


function updateProgress(){

  let answered = 0;


  questions.forEach(
    question => {

      const selected =
        document.querySelector(
          `input[name="question-${question.id}"]:checked`
        );


      if(selected)
        answered++;

    }
  );


  progressText.textContent =
    `${answered} / ${questions.length}`;


  const percent =
    questions.length
      ?
      (
        answered /
        questions.length
      ) * 100
      :
      0;


  progressBar.style.width =
    percent + "%";

}


/* =====================================================
   TIME LIMIT
===================================================== */

function parseTimeLimit(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return 0;

  }


  /*
    Supports:

    30
    "30"
    "30 minutes"
    "01:30"
    "90:00"
  */

  if(
    typeof value === "number"
  ){

    return value * 60;

  }


  const text =
    String(value)
      .trim()
      .toLowerCase();


  if(
    text.includes(":")
  ){

    const parts =
      text.split(":");


    const minutes =
      Number(parts[0]) || 0;

    const seconds =
      Number(parts[1]) || 0;


    return (
      minutes * 60
    ) + seconds;

  }


  const number =
    parseFloat(text);


  if(
    text.includes("hour")
  ){

    return number * 3600;

  }


  return number * 60;

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

  timeLeft =
    parseTimeLimit(
      quiz.timeLimit
    );


  if(
    !timeLeft ||
    timeLeft <= 0
  ){

    timerBox.innerHTML = `

      <i class="fa-regular fa-clock"></i>

      Unlimited Time

    `;

    return;

  }


  updateTimer();


  timer =
    setInterval(
      () => {

        timeLeft--;


        updateTimer();


        if(
          timeLeft <= 0
        ){

          clearInterval(timer);

          submitQuiz(true);

        }

      },
      1000
    );

}


/* =====================================================
   UPDATE TIMER
===================================================== */

function updateTimer(){

  const minutes =
    Math.floor(
      timeLeft / 60
    );

  const seconds =
    timeLeft % 60;


  timeText.textContent =
    `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;


  if(
    timeLeft <= 60
  ){

    timerBox.classList.add(
      "warning"
    );

  }

}


/* =====================================================
   SUBMIT
===================================================== */

submitBtn.addEventListener(
  "click",
  () => {

    submitQuiz(false);

  }
);


/* =====================================================
   CALCULATE RESULT
===================================================== */

function submitQuiz(autoSubmit){

  if(submitted)
    return;


  submitted = true;


  if(timer)
    clearInterval(timer);


  let correct = 0;

  let answered = 0;


  questions.forEach(
    question => {

      const selected =
        document.querySelector(
          `input[name="question-${question.id}"]:checked`
        );


      if(selected)
        answered++;


      const correctAnswer =
        question.correctAnswer;


      if(
        selected &&
        String(
          selected.value
        ) ===
        String(
          correctAnswer
        )
      ){

        correct++;

      }

    }
  );


  const score =
    questions.length
      ?
      Math.round(
        (
          correct /
          questions.length
        ) * 100
      )
      :
      0;


  const passingScore =
    Number(
      quiz.passingScore || 0
    );


  const passed =
    score >= passingScore;


  showResult(
    score,
    correct,
    answered,
    passed,
    autoSubmit
  );

}


/* =====================================================
   RESULT
===================================================== */

function showResult(
  score,
  correct,
  answered,
  passed,
  autoSubmit
){

  quizBox.classList.add(
    "hidden"
  );


  resultBox.classList.remove(
    "hidden"
  );


  scoreBox.textContent =
    `${score}%`;


  if(passed){

    resultStatus.innerHTML = `

      <div class="pass">

        <i class="fa-solid fa-circle-check"></i>

        PASSED

      </div>

    `;

    resultIcon.className =
      "fa-solid fa-trophy";

  }
  else{

    resultStatus.innerHTML = `

      <div class="fail">

        <i class="fa-solid fa-circle-xmark"></i>

        NOT PASSED

            </div>

    `;

    resultIcon.className =
      "fa-solid fa-circle-xmark";

  }


  resultMessage.textContent =
    `You answered ${answered} of ${questions.length} questions correctly: ${correct}/${questions.length}.`;


  if(autoSubmit){

    resultMessage.textContent +=
      " The time limit expired, so the quiz was submitted automatically.";

  }

}


/* =====================================================
   RESTART QUIZ
===================================================== */

window.restartQuiz = function(){

  submitted = false;

  if(timer){
    clearInterval(timer);
    timer = null;
  }

  resultBox.classList.add(
    "hidden"
  );

  quizBox.classList.add(
    "hidden"
  );

  startBox.classList.remove(
    "hidden"
  );

  progressBar.style.width =
    "0%";

  progressText.textContent =
    `0 / ${questions.length}`;

};


/* =====================================================
   START
===================================================== */

loadQuiz();

</script>

</body>
</html>
