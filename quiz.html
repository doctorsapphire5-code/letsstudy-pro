<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiz | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%
}

.logo{
  text-decoration:none;
  color:#172033;
  font-size:21px;
  font-weight:800
}

.logo span{color:#2563eb}

.timer{
  background:#eef2f7;
  padding:9px 13px;
  border-radius:8px;
  font-size:12px;
  font-weight:800
}

.container{
  width:92%;
  max-width:800px;
  margin:25px auto
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:22px;
  margin-bottom:15px
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px
}

.title{
  font-size:22px
}

.progress{
  height:7px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px
}

.progress span{
  display:block;
  height:100%;
  background:#2563eb;
  width:0
}

.question{
  font-size:17px;
  font-weight:800;
  line-height:1.5;
  margin-bottom:15px
}

.options{
  display:grid;
  gap:9px
}

.option{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:13px;
  border-radius:9px;
  cursor:pointer;
  font-size:12px;
  text-align:left
}

.option:hover{
  background:#f8fafc
}

.option.selected{
  border:2px solid #2563eb;
  background:#eef5ff
}

.actions{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:20px
}

.btn{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:11px 17px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  cursor:pointer
}

.btn.secondary{
  background:#eef2f7;
  color:#172033
}

.result{
  text-align:center;
  padding:35px 20px
}

.score{
  font-size:48px;
  font-weight:900;
  color:#2563eb;
  margin:12px 0
}

.result p{
  color:#64748b;
  font-size:12px;
  line-height:1.6
}

.hidden{
  display:none!important
}

.loading{
  text-align:center;
  padding:50px;
  color:#64748b
}

@media(max-width:550px){
  .container{width:94%}
  .question{font-size:15px}
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
LetsStudy <span>Pro</span>
</a>

<div id="timer" class="timer">
10:00
</div>

</header>


<main class="container">

<div id="loading" class="card loading">
Loading quiz...
</div>


<section id="quiz" class="card hidden">

<div class="top">

<div>

<div id="quizTitle" class="title">
Quiz
</div>

<div
id="questionNumber"
style="font-size:10px;color:#64748b;margin-top:5px">
Question 1
</div>

</div>

</div>


<div class="progress">
<span id="progressBar"></span>
</div>


<div
id="question"
class="question"
style="margin-top:22px">
Question
</div>


<div
id="options"
class="options">
</div>


<div class="actions">

<button
id="previous"
class="btn secondary">
Previous
</button>

<button
id="next"
class="btn">
Next
</button>

</div>

</section>


<section
id="result"
class="card result hidden">

<h2>
Quiz Complete
</h2>

<div
id="score"
class="score">
0%
</div>

<p id="resultText">
You completed the quiz.
</p>

<div
class="actions"
style="justify-content:center">

<button
id="retry"
class="btn">
Retry Quiz
</button>

<a
href="my-course.html"
class="btn secondary">
My Courses
</a>

</div>

</section>

</main>


<script>

/*
==================================================
LETSSTUDY PRO QUIZ SYSTEM
==================================================

URL EXAMPLE:

quiz.html?quizId=QUIZ_ID&courseId=COURSE_ID

API:

GET /api/quiz/QUIZ_ID

EXPECTED:

{
  title:"Biology Quiz",
  duration:10,
  questions:[
    {
      id:"q1",
      question:"What is photosynthesis?",
      options:[
        "Process A",
        "Process B",
        "Process C",
        "Process D"
      ],
      answer:1
    }
  ]
}

answer = correct option index.

SUBMIT:

POST /api/quiz/submit

{
  quizId,
  userId,
  answers,
  score,
  total
}

==================================================
*/


const params =
new URLSearchParams(location.search);

const quizId =
params.get("quizId") ||
params.get("id") ||
"demo";


const courseId =
params.get("courseId") ||
"";


const userId =
localStorage.getItem("userId") ||
"";


let quizData = null;

let questions = [];

let current = 0;

let answers = {};

let seconds = 600;

let timerInterval;


/* =========================
   START
========================= */

loadQuiz();


/* =========================
   LOAD QUIZ
========================= */

async function loadQuiz(){

try{

if(quizId === "demo"){

quizData = demoQuiz();

}else{

const response =
await fetch(
"/api/quiz/" +
encodeURIComponent(quizId)
);

if(!response.ok){

throw new Error(
"Unable to load quiz."
);

}

const result =
await response.json();

quizData =
result.quiz ||
result;

}


questions =
quizData.questions ||
[];


if(!questions.length){

throw new Error(
"This quiz has no questions."
);

}


seconds =
Number(
quizData.duration || 10
) * 60;


document.getElementById(
"quizTitle"
).textContent =
quizData.title ||
"Quiz";


document.getElementById(
"loading"
).classList.add(
"hidden"
);


document.getElementById(
"quiz"
).classList.remove(
"hidden"
);


renderQuestion();

startTimer();


}catch(error){

document.getElementById(
"loading"
).textContent =
error.message;

}

}


/* =========================
   QUESTION
========================= */

function renderQuestion(){

const q =
questions[current];


document.getElementById(
"questionNumber"
).textContent =
"Question " +
(current + 1) +
" of " +
questions.length;


document.getElementById(
"question"
).textContent =
q.question;


const options =
document.getElementById(
"options"
);


options.innerHTML = "";


(q.options || []).forEach(
(option,index)=>{

const button =
document.createElement(
"button"
);

button.className =
"option";


button.textContent =
option;


if(
answers[q.id] === index
){

button.classList.add(
"selected"
);

}


button.onclick =
()=>{
selectAnswer(
q.id,
index
);
};


options.appendChild(
button
);

}
);


const progress =
((current + 1) /
questions.length) *
100;


document.getElementById(
"progressBar"
).style.width =
progress + "%";


document.getElementById(
"previous"
).disabled =
current === 0;


document.getElementById(
"next"
).textContent =
current === questions.length - 1
? "Submit Quiz"
: "Next";

}


/* =========================
   ANSWER
========================= */

function selectAnswer(
questionId,
index
){

answers[
questionId
] = index;


renderQuestion();

}


/* =========================
   NEXT
========================= */

document.getElementById(
"next"
).onclick =
()=>{

if(
current <
questions.length - 1
){

current++;

renderQuestion();

}else{

finishQuiz();

}

};


/* =========================
   PREVIOUS
========================= */

document.getElementById(
"previous"
).onclick =
()=>{

if(current > 0){

current--;

renderQuestion();

}

};


/* =========================
   TIMER
========================= */

function startTimer(){

updateTimer();


timerInterval =
setInterval(
()=>{

seconds--;

updateTimer();


if(seconds <= 0){

clearInterval(
timerInterval
);

finishQuiz();

}

},
1000
);

}


function updateTimer(){

const min =
Math.floor(
seconds / 60
);

const sec =
seconds % 60;


document.getElementById(
"timer"
).textContent =
String(min).padStart(
2,"0"
) +
":" +
String(sec).padStart(
2,"0"
);

}


/* =========================
   FINISH
========================= */

async function finishQuiz(){

clearInterval(
timerInterval
);


let correct = 0;


questions.forEach(
q=>{

if(
answers[q.id] ===
q.answer
){

correct++;

}

}
);


const total =
questions.length;


const percentage =
Math.round(
(correct / total) * 100
);


document.getElementById(
"quiz"
).classList.add(
"hidden"
);


document.getElementById(
"result"
).classList.remove(
"hidden"
);


document.getElementById(
"score"
).textContent =
percentage + "%";


document.getElementById(
"resultText"
).textContent =
"You scored " +
correct +
" out of " +
total +
" questions.";


saveResult(
correct,
total,
percentage
);

}


/* =========================
   SAVE RESULT
========================= */

async function saveResult(
correct,
total,
score
){

try{

await fetch(
"/api/quiz/submit",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

quizId:
quizId,

courseId:
courseId,

userId:
userId,

answers:
answers,

correct:
correct,

total:
total,

score:
score

})

}
);

}catch(error){

console.warn(
"Result could not be saved.",
error
);

}

}


/* =========================
   RETRY
========================= */

document.getElementById(
"retry"
).onclick =
()=>{

current = 0;

answers = {};

seconds =
Number(
quizData.duration || 10
) * 60;


document.getElementById(
"result"
).classList.add(
"hidden"
);


document.getElementById(
"quiz"
).classList.remove(
"hidden"
);


renderQuestion();

startTimer();

};


/* =========================
   DEMO QUIZ
========================= */

function demoQuiz(){

return {

title:
"Sample Quiz",

duration:
10,

questions:[

{
id:"q1",

question:
"Which organelle is known as the powerhouse of the cell?",

options:[
"Nucleus",
"Mitochondria",
"Ribosome",
"Chloroplast"
],

answer:1
},

{
id:"q2",

question:
"What is the basic unit of life?",

options:[
"Tissue",
"Organ",
"Cell",
"System"
],

answer:2
},

{
id:"q3",

question:
"Which gas is mainly used during photosynthesis?",

options:[
"Oxygen",
"Nitrogen",
"Carbon dioxide",
"Hydrogen"
],

answer:2
}

]

};

}

</script>

</body>
</html>
