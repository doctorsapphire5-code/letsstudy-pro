<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:#f5f7fb;
color:#101828
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #eaecf0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
position:sticky;
top:0;
z-index:20
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef
}

.timer{
background:#fff4ed;
color:#c4320a;
padding:9px 13px;
border-radius:9px;
font-weight:800
}

.container{
max-width:850px;
margin:auto;
padding:25px 16px 60px
}

.quiz-header{
background:linear-gradient(135deg,#101828,#155eef);
color:#fff;
padding:26px;
border-radius:18px;
margin-bottom:18px
}

.quiz-header h1{
margin:0 0 8px;
font-size:27px
}

.quiz-header p{
margin:0;
opacity:.9;
line-height:1.6
}

.meta{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:15px
}

.badge{
background:#ffffff22;
border:1px solid #ffffff33;
padding:6px 10px;
border-radius:20px;
font-size:12px
}

.progress-wrap{
background:#fff;
border:1px solid #eaecf0;
padding:14px;
border-radius:12px;
margin-bottom:15px
}

.progress-top{
display:flex;
justify-content:space-between;
font-size:13px;
margin-bottom:8px
}

.progress{
height:8px;
background:#eaecf0;
border-radius:20px;
overflow:hidden
}

.progress-bar{
height:100%;
width:0;
background:#155eef;
transition:.3s
}

.question{
background:#fff;
border:1px solid #eaecf0;
border-radius:16px;
padding:22px;
margin-bottom:15px
}

.question-number{
font-size:12px;
font-weight:800;
color:#155eef;
margin-bottom:10px
}

.question h2{
font-size:19px;
line-height:1.5;
margin:0 0 18px
}

.option{
display:flex;
gap:12px;
align-items:flex-start;
border:1px solid #d0d5dd;
padding:14px;
border-radius:11px;
margin:9px 0;
cursor:pointer;
transition:.2s
}

.option:hover{
border-color:#155eef;
background:#f8faff
}

.option.selected{
border-color:#155eef;
background:#eef4ff
}

.option input{
width:auto;
margin-top:3px
}

.navigation{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:18px
}

button{
border:0;
border-radius:10px;
padding:12px 18px;
font-weight:800;
cursor:pointer
}

.primary{
background:#155eef;
color:#fff
}

.secondary{
background:#eef4ff;
color:#155eef
}

button:disabled{
opacity:.45;
cursor:not-allowed
}

.result{
display:none;
background:#fff;
border:1px solid #eaecf0;
border-radius:18px;
padding:30px;
text-align:center
}

.result.show{
display:block
}

.score{
font-size:48px;
font-weight:900;
color:#155eef;
margin:10px 0
}

.pass{
color:#027a48
}

.fail{
color:#b42318
}

.result-actions{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:20px
}

.loading{
background:#fff;
border-radius:15px;
padding:50px;
text-align:center;
color:#667085
}

.error{
background:#fef3f2;
color:#b42318;
border:1px solid #fecdca;
padding:15px;
border-radius:12px;
margin-bottom:15px
}

@media(max-width:600px){

.container{
padding:16px 12px 40px
}

.quiz-header h1{
font-size:23px
}

.question{
padding:17px
}

.navigation button{
flex:1
}

}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<div class="timer" id="timer">
--:--
</div>

</header>


<main class="container">

<div id="loading" class="loading">
Loading quiz...
</div>

<div id="error"></div>


<section id="quizArea" style="display:none">

<div class="quiz-header">

<h1 id="quizTitle">
Quiz
</h1>

<p id="quizDescription"></p>

<div class="meta">

<span class="badge">
Questions: <b id="questionCount">0</b>
</span>

<span class="badge">
Passing: <b id="passingScore">70%</b>
</span>

<span class="badge">
Attempts: <b id="attempts">1</b>
</span>

</div>

</div>


<div class="progress-wrap">

<div class="progress-top">

<span id="progressText">
Question 1
</span>

<span id="answeredText">
0 answered
</span>

</div>

<div class="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>

</div>


<div id="questionContainer"></div>


<div class="navigation">

<button
id="previousBtn"
class="secondary"
onclick="previousQuestion()">

← Previous

</button>

<button
id="nextBtn"
class="primary"
onclick="nextQuestion()">

Next →

</button>

</div>

</section>


<section
id="result"
class="result">

<div style="font-size:45px">
🏆
</div>

<h2>
Quiz Completed
</h2>

<div
class="score"
id="score">
0%
</div>

<h3 id="resultStatus"></h3>

<p id="resultMessage"></p>

<div class="result-actions">

<button
class="secondary"
onclick="location.reload()">

Try Again

</button>

<button
class="primary"
onclick="goBack()">

Back to Course

</button>

</div>

</section>

</main>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import{
getFirestore,
collection,
query,
where,
getDocs,
getDoc,
doc
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/*
==================================================
FIREBASE CONFIG
==================================================
*/

const firebaseConfig={

apiKey:
"AIzaSyBcKXbAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/*
==================================================
STATE
==================================================
*/

let quizId=null;

let courseId=null;

let quiz=null;

let questions=[];

let currentQuestion=0;

let answers={};

let timerSeconds=0;

let timerInterval=null;

let submitted=false;


/*
==================================================
URL
==================================================
*/

const params=
new URLSearchParams(
location.search
);

quizId=
params.get("quizId");


if(!quizId){

showError(
"Quiz ID is missing. Open the quiz using ?quizId=..."
);

}else{

loadQuiz();

}


/*
==================================================
HELPERS
==================================================
*/

const $=id=>
document.getElementById(id);


function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showError(message){

$("loading").style.display="none";

$("error").innerHTML=
`<div class="error">${esc(message)}</div>`;

}


/*
==================================================
LOAD QUIZ
==================================================
*/

async function loadQuiz(){

try{

const quizSnap=
await getDoc(
doc(
db,
"quizzes",
quizId
)
);


if(!quizSnap.exists()){

throw new Error(
"Quiz not found."
);

}


quiz={
id:quizSnap.id,
...quizSnap.data()
};


courseId=
quiz.courseId;


$("quizTitle").textContent=
quiz.title||
"Quiz";


$("quizDescription").textContent=
quiz.description||
"Complete this quiz to test your knowledge.";


$("passingScore").textContent=
`${quiz.passingScore??70}%`;


$("attempts").textContent=
quiz.attempts?
quiz.attempts:
"Unlimited";


/*
LOAD QUESTIONS
*/

const questionQuery=
query(

collection(
db,
"quizQuestions"
),

where(
"quizId",
"==",
quizId
),

where(
"courseId",
"==",
courseId
)

);


const snap=
await getDocs(
questionQuery
);


questions=
snap.docs.map(d=>({

id:d.id,
...d.data()

}));


questions.sort(
(a,b)=>
Number(a.order||0)-
Number(b.order||0)
);


if(!questions.length){

throw new Error(
"This quiz has no questions yet."
);

}


$("questionCount").textContent=
questions.length;


$("loading").style.display=
"none";

$("quizArea").style.display=
"block";


renderQuestion();

startTimer();

}catch(error){

console.error(error);

showError(
error.message||
"Unable to load quiz."
);

}

}


/*
==================================================
RENDER QUESTION
==================================================
*/

function renderQuestion(){

const q=
questions[currentQuestion];

if(!q)return;


const total=
questions.length;


const selected=
answers[q.id]||"";


const options=
q.options||{};


$("questionContainer").innerHTML=`

<div class="question">

<div class="question-number">

QUESTION ${currentQuestion+1} OF ${total}

</div>

<h2>
${esc(q.question)}
</h2>


<label class="option ${
selected==="A"?"selected":""
}">

<input
type="radio"
name="answer"
value="A"
${selected==="A"?"checked":""}
>

<span>
<strong>A.</strong>
${esc(options.A)}
</span>

</label>


<label class="option ${
selected==="B"?"selected":""
}">

<input
type="radio"
name="answer"
value="B"
${selected==="B"?"checked":""}
>

<span>
<strong>B.</strong>
${esc(options.B)}
</span>

</label>


<label class="option ${
selected==="C"?"selected":""}
">

<input
type="radio"
name="answer"
value="C"
${selected==="C"?"checked":""}
>

<span>
<strong>C.</strong>
${esc(options.C)}
</span>

</label>


<label class="option ${
selected==="D"?"selected":""}
">

<input
type="radio"
name="answer"
value="D"
${selected==="D"?"checked":""}
>

<span>
<strong>D.</strong>
${esc(options.D)}
</span>

</label>

</div>
`;


document
.querySelectorAll(
'input[name="answer"]'
)
.forEach(input=>{

input.addEventListener(
"change",
()=>{

answers[q.id]=
input.value;

renderQuestion();

}
);

});


updateProgress();


$("previousBtn").disabled=
currentQuestion===0;


if(currentQuestion===total-1){

$("nextBtn").textContent=
"Submit Quiz";

}else{

$("nextBtn").textContent=
"Next →";

}

}


/*
==================================================
PROGRESS
==================================================
*/

function updateProgress(){

const total=
questions.length;

const answered=
Object.keys(answers).length;


$("progressText").textContent=
`Question ${currentQuestion+1} of ${total}`;


$("answeredText").textContent=
`${answered} answered`;


$("progressBar").style.width=
`${((currentQuestion+1)/total)*100}%`;

}


/*
==================================================
NEXT
==================================================
*/

window.nextQuestion=function(){

if(submitted)return;


if(currentQuestion===
questions.length-1){

if(
!confirm(
"Submit your quiz now?"
)
)return;

submitQuiz();

return;

}


currentQuestion++;

renderQuestion();

window.scrollTo({
top:0,
behavior:"smooth"
});

};


/*
==================================================
PREVIOUS
==================================================
*/

window.previousQuestion=function(){

if(currentQuestion<=0)return;

currentQuestion--;

renderQuestion();

window.scrollTo({
top:0,
behavior:"smooth"
});

};


/*
==================================================
TIMER
==================================================
*/

function startTimer(){

const minutes=
Number(
quiz.timeLimit||0
);


if(minutes<=0){

$("timer").textContent=
"No limit";

return;

}


timerSeconds=
minutes*60;


updateTimer();


timerInterval=
setInterval(()=>{

timerSeconds--;

updateTimer();


if(timerSeconds<=0){

clearInterval(timerInterval);

alert(
"Time is up. Your quiz will be submitted."
);

submitQuiz();

}

},1000);

}


function updateTimer(){

const mins=
Math.floor(
timerSeconds/60
);

const secs=
timerSeconds%60;


$("timer").textContent=
`${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;

}


/*
==================================================
SUBMIT
==================================================
*/

function submitQuiz(){

if(submitted)return;

submitted=true;


if(timerInterval){

clearInterval(
timerInterval
);

}


let correct=0;


questions.forEach(q=>{

if(
answers[q.id] &&
answers[q.id]===
q.correctAnswer
){

correct++;

}

});


const percentage=
Math.round(
(correct/questions.length)*100
);


const passing=
Number(
quiz.passingScore??70
);


const passed=
percentage>=passing;


$("quizArea").style.display=
"none";


$("result").classList.add(
"show"
);


$("score").textContent=
`${percentage}%`;


$("resultStatus").textContent=
passed?
"Congratulations! You Passed":
"Quiz Not Passed";


$("resultStatus").className=
passed?
"pass":
"fail";


$("resultMessage").textContent=
`You scored ${correct} out of ${questions.length}. Passing score: ${passing}%.`;

}


/*
==================================================
BACK TO COURSE
==================================================
*/

window.goBack=function(){

if(courseId){

location.href=
`course.html?courseId=${encodeURIComponent(courseId)}`;

}else{

history.back();

}

};

</script>

</body>
</html>
