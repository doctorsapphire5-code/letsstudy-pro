<html lang="en">
<head>

<meta charset="UTF-8">

      content="width=device-width,initial-scale=1">

<title>Quiz | LetsStudy Pro</title>

<meta name="robots"
      content="index,follow">

<link rel="canonical"
      href="https://letsstudy.pro/quiz.html">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.55;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  color:#172033;
  text-decoration:none;
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  border:0;
  background:#eef2f7;
  color:#172033;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.container{
  width:92%;
  max-width:900px;
  margin:30px auto;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:17px;
  padding:25px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(15,23,42,.04);
}

.loading{
  padding:60px 20px;
  text-align:center;
}

.spinner{
  width:38px;
  height:38px;
  border:4px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.error{
  padding:55px 20px;
  text-align:center;
  color:#b91c1c;
  border-color:#fecaca;
}

.error button{
  border:0;
  background:#eef2f7;
  padding:10px 16px;
  border-radius:8px;
  margin-top:18px;
  cursor:pointer;
  font-weight:700;
}

.quiz-header{
  margin-bottom:22px;
}

.badge{
  display:inline-block;
  background:#eff6ff;
  color:#2563eb;
  padding:6px 10px;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  margin-bottom:12px;
}

h1{
  font-size:31px;
  line-height:1.2;
  margin-bottom:10px;
  word-break:break-word;
}

.description{
  color:#64748b;
  font-size:15px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:17px;
}

.meta span{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:7px 10px;
  color:#64748b;
  font-size:12px;
}

.progress-wrap{
  margin-top:22px;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  color:#64748b;
  font-size:12px;
  margin-bottom:7px;
}

.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0;
  background:#2563eb;
  transition:.25s;
}

.question-number{
  color:#2563eb;
  font-size:12px;
  font-weight:800;
  margin-bottom:9px;
  text-transform:uppercase;
}

.question{
  font-size:22px;
  font-weight:800;
  line-height:1.4;
  margin-bottom:20px;
}

.options{
  display:grid;
  gap:11px;
}

.option{
  width:100%;
  text-align:left;
  border:1px solid #dbe2ea;
  background:#fff;
  padding:15px;
  border-radius:11px;
  cursor:pointer;
  display:flex;
  align-items:flex-start;
  gap:12px;
  color:#172033;
  font-size:14px;
  transition:.18s;
}

.option:hover{
  border-color:#2563eb;
  background:#f8fbff;
}

.option.selected{
  border-color:#2563eb;
  background:#eff6ff;
}

.option-letter{
  min-width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:#eef2f7;
  font-weight:800;
}

.option.selected .option-letter{
  background:#2563eb;
  color:#fff;
}

.option-text{
  flex:1;
  padding-top:4px;
}

.navigation{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:24px;
}

.nav-btn{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:800;
}

.prev-btn{
  background:#eef2f7;
  color:#172033;
}

.next-btn{
  background:#2563eb;
  color:#fff;
}

.submit-btn{
  background:#16a34a;
  color:#fff;
}

.nav-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.result{
  text-align:center;
}

.result-icon{
  font-size:48px;
  margin-bottom:12px;
}

.score{
  font-size:45px;
  font-weight:900;
  color:#2563eb;
  margin:12px 0;
}

.result-message{
  color:#64748b;
  margin-bottom:20px;
}

.restart{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:800;
}

.hidden{
  display:none !important;
}

footer{
  text-align:center;
  color:#64748b;
  font-size:12px;
  padding:20px;
}

@media(max-width:600px){

  .container{
    width:94%;
    margin:20px auto;
  }

  .card{
    padding:20px;
  }

  h1{
    font-size:27px;
  }

  .question{
    font-size:19px;
  }

  .navigation{
    flex-direction:column;
  }

  .nav-btn{
    width:100%;
  }

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  where
}
from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRg0rj0odBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


/* ==================================================
   DOM
================================================== */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const errorMessage =
  document.getElementById(
    "errorMessage"
  );

const quizApp =
  document.getElementById(
    "quizApp"
  );

const quizTitle =
  document.getElementById(
    "quizTitle"
  );

const quizDescription =
  document.getElementById(
    "quizDescription"
  );

const quizMeta =
  document.getElementById(
    "quizMeta"
  );

const questionNumber =
  document.getElementById(
    "questionNumber"
  );

const questionText =
  document.getElementById(
    "questionText"
  );

const optionsBox =
  document.getElementById(
    "options"
  );

const prevBtn =
  document.getElementById(
    "prevBtn"
  );

const nextBtn =
  document.getElementById(
    "nextBtn"
  );

const submitBtn =
  document.getElementById(
    "submitBtn"
  );

const progressText =
  document.getElementById(
    "progressText"
  );

const progressPercent =
  document.getElementById(
    "progressPercent"
  );

const progressBar =
  document.getElementById(
    "progressBar"
  );

const resultCard =
  document.getElementById(
    "resultCard"
  );

const questionCard =
  document.getElementById(
    "questionCard"
  );

const scoreBox =
  document.getElementById(
    "score"
  );

const resultMessage =
  document.getElementById(
    "resultMessage"
  );

const restartBtn =
  document.getElementById(
    "restartBtn"
  );


document.getElementById(
  "year"
).textContent =
  new Date().getFullYear();


/* ==================================================
   URL
================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const quizId =
  params.get("id") ||
  params.get("quizId") ||
  params.get("documentId") ||
  "";


const courseIdFromUrl =
  params.get("courseId") ||
  "";


/* ==================================================
   STATE
================================================== */

let quiz = null;

let questions = [];

let answers = [];

let currentIndex = 0;

let courseName = "";


/* ==================================================
   START
================================================== */

if(!quizId){

  showError(
    "No quiz ID was provided."
  );

}else{

  loadQuiz();

}


/* ==================================================
   LOAD QUIZ
================================================== */

async function loadQuiz(){

  try{

    const quizRef =
      doc(
        db,
        "quizzes",
        quizId
      );


    const snapshot =
      await getDoc(
        quizRef
      );


    if(!snapshot.exists()){

      throw new Error(
        "Quiz not found."
      );

    }


    quiz = {

      id:
        snapshot.id,

      ...snapshot.data()

    };


    const status =
      String(
        quiz.status ??
        ""
      )
      .toLowerCase()
      .trim();


    const publicStatuses = [

      "",
      "published",
      "active",
      "available"

    ];


    if(
      !publicStatuses.includes(
        status
      )
    ){

      throw new Error(
        "This quiz is not currently available."
      );

    }


    questions =
      extractQuestions(
        quiz
      );


    /*
      If questions are not embedded
      inside the quiz document,
      try the quizQuestions collection.
    */

    if(
      questions.length === 0
    ){

      questions =
        await loadQuestionCollection();

    }


    if(
      questions.length === 0
    ){

      throw new Error(
        "No questions were found for this quiz."
      );

    }


    questions =
      normalizeQuestions(
        questions
      );


    answers =
      new Array(
        questions.length
      ).fill(null);


    await loadCourseName();


    renderQuiz();


    loading.classList.add(
      "hidden"
    );


    quizApp.classList.remove(
      "hidden"
    );


  }catch(error){

    console.error(
      "QUIZ:",
      error
    );


    showError(

      error.message ||
      "Unable to load quiz."

    );

  }

}


/* ==================================================
   EXTRACT EMBEDDED QUESTIONS
================================================== */

function extractQuestions(
  data
){

  const candidates = [

    data.questions,

    data.items,

    data.quizQuestions

  ];


  for(
    const candidate of candidates
  ){

    if(
      Array.isArray(candidate)
    ){

      return candidate;

    }

  }


  return [];

}


/* ==================================================
   LOAD QUESTIONS COLLECTION
================================================== */

async function loadQuestionCollection(){

  const result = [];


  /*
    First try quizQuestions
    using common quiz ID fields.
  */

  const fields = [

    "quizId",
    "quizID",
    "quiz"

  ];


  for(
    const field of fields
  ){

    try{

      const q =
        query(

          collection(
            db,
            "quizQuestions"
          ),

          where(
            field,
            "==",
            quizId
          )

        );


      const snapshot =
        await getDocs(q);


      if(
        !snapshot.empty
      ){

        snapshot.forEach(
          item => {

            result.push({

              id:
                item.id,

              ...item.data()

            });

          }
        );


        return result;

      }

    }catch(error){

      console.warn(
        "Question query failed:",
        field,
        error
      );

    }

  }


  /*
    Final fallback:
    read collection and filter
    locally.
  */

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "quizQuestions"
        )
      );


    snapshot.forEach(
      item => {

        const data =
          item.data();


        const id =
          data.quizId ||
          data.quizID ||
          data.quiz;


        if(
          String(id || "") ===
          String(quizId)
        ){

          result.push({

            id:
              item.id,

            ...data

          });

        }

      }
    );

  }catch(error){

    console.warn(
      "Question fallback failed:",
      error
    );

  }


  return result;

}


/* ==================================================
   NORMALIZE QUESTIONS
================================================== */

function normalizeQuestions(
  list
){

  return list
    .map(
      (item,index) => {

        const question =
          item.question ||
          item.questionText ||
          item.text ||
          item.title ||
          "";


        let rawOptions =
          item.options ||
          item.answers ||
          item.choices ||
          [];


        if(
          !Array.isArray(
            rawOptions
          )
        ){

          if(
            typeof rawOptions ===
            "object"
          ){

            rawOptions =
              Object.values(
                rawOptions
              );

          }else{

            rawOptions = [];

          }

        }


        const options =
          rawOptions.map(
            option => {

              if(
                typeof option ===
                "object"
              ){

                return {

                  label:
                    option.label ||
                    option.text ||
                    option.answer ||
                    option.value ||
                    "",

                  value:
                    option.value ||
                    option.id ||
                    option.label ||
                    option.text ||
                    ""

                };

              }


              return {

                label:
                  String(
                    option
                  ),

                value:
                  String(
                    option
                  )

              };

            }
          )
          .filter(
            option =>
              option.label
          );


        const correct =
          item.correctAnswer ??
          item.correct ??
          item.answer ??
          item.correctOption ??
          item.correctValue ??
          item.correctIndex;


        return {

          ...item,

          id:
            item.id ||
            `question-${index + 1}`,

          question:
            String(
              question
            ),

          options,

          correctAnswer:
            correct,

          hint:
            item.hint ||
            "",

          explanation:
            item.explanation ||
            item.feedback ||
            ""

        };

      }
    )
    .filter(
      item =>
        item.question &&
        item.options.length >= 2
    )
    .sort(
      (a,b) => {

        return (
          Number(
            a.order ??
            a.orderIndex ??
            a.position ??
            999999
          )
          -
          Number(
            b.order ??
            b.orderIndex ??
            b.position ??
            999999
          )
        );

      }
    );

}


/* ==================================================
   COURSE
================================================== */

async function loadCourseName(){

  const courseId =
    quiz.courseId ||
    quiz.courseID ||
    quiz.course ||
    courseIdFromUrl ||
    "";


  if(!courseId){

    courseName =
      quiz.courseName ||
      quiz.courseTitle ||
      "";

    return;

  }


  try{

    const courseRef =
      doc(
        db,
        "courses",
        String(courseId)
      );


    const snapshot =
      await getDoc(
        courseRef
      );


    if(
      snapshot.exists()
    ){

      const data =
        snapshot.data();


      courseName =
        data.title ||
        data.name ||
        data.courseTitle ||
        String(courseId);

    }else{

      courseName =
        quiz.courseName ||
        quiz.courseTitle ||
        String(courseId);

    }

  }catch(error){

    console.warn(
      "Course load failed:",
      error
    );


    courseName =
      quiz.courseName ||
      quiz.courseTitle ||
      "";

  }

}


/* ==================================================
   RENDER QUIZ
================================================== */

function renderQuiz(){

  const title =
    quiz.title ||
    quiz.name ||
    quiz.quizTitle ||
    "Quiz";


  const description =
    quiz.description ||
    quiz.details ||
    quiz.instructions ||
    "Test your knowledge with this interactive quiz.";


  quizTitle.textContent =
    title;


  quizDescription.textContent =
    description;


  const time =
    quiz.timeLimit ||
    quiz.duration ||
    quiz.time ||
    "";


  const passingScore =
    quiz.passingScore ??
    quiz.passScore ??
    "";


  const attempts =
    quiz.attempts ??
    quiz.maxAttempts ??
    quiz.attemptLimit ??
    "";


  quizMeta.innerHTML = "";


  addMeta(
    "Questions: " +
    questions.length
  );


  if(time){

    addMeta(
      "Time: " +
      formatTime(time)
    );

  }


  if(passingScore !== ""){

    addMeta(
      "Pass: " +
             escapeHTML(
        String(
          passingScore
        )
      ) +
      "%"
    );

  }


  if(attempts !== ""){

    addMeta(
      "Attempts: " +
      escapeHTML(
        String(
          attempts
        )
      )
    );

  }


  if(courseName){

    addMeta(
      "Course: " +
      escapeHTML(
        courseName
      )
    );

  }


  renderQuestion();

}


/* ==================================================
   META
================================================== */

function addMeta(text){

  const span =
    document.createElement("span");

  span.textContent =
    text;

  quizMeta.appendChild(span);

}


/* ==================================================
   RENDER QUESTION
================================================== */

function renderQuestion(){

  const item =
    questions[currentIndex];

  if(!item){
    return;
  }

  const total =
    questions.length;

  const number =
    currentIndex + 1;

  questionNumber.textContent =
    "Question " +
    number +
    " of " +
    total;

  questionText.textContent =
    item.question;

  progressText.textContent =
    "Question " +
    number +
    " of " +
    total;

  const percent =
    Math.round(
      (number / total) * 100
    );

  progressPercent.textContent =
    percent + "%";

  progressBar.style.width =
    percent + "%";

  optionsBox.innerHTML = "";

  item.options.forEach(
    (option,index) => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "option";

      if(
        answers[currentIndex] ===
        option.value
      ){

        button.classList.add(
          "selected"
        );

      }

      button.innerHTML = `

        <span class="option-letter">
          ${String.fromCharCode(65 + index)}
        </span>

        <span class="option-text">
          ${escapeHTML(option.label)}
        </span>

      `;

      button.addEventListener(
        "click",
        () => {

          selectAnswer(
            option.value
          );

        }
      );

      optionsBox.appendChild(
        button
      );

    }
  );


  prevBtn.disabled =
    currentIndex === 0;


  if(
    currentIndex === total - 1
  ){

    nextBtn.classList.add(
      "hidden"
    );

    submitBtn.classList.remove(
      "hidden"
    );

  }else{

    nextBtn.classList.remove(
      "hidden"
    );

    submitBtn.classList.add(
      "hidden"
    );

  }

}


/* ==================================================
   SELECT ANSWER
================================================== */

function selectAnswer(value){

  answers[currentIndex] =
    value;

  renderQuestion();

}


/* ==================================================
   NEXT
================================================== */

nextBtn.addEventListener(
  "click",
  () => {

    if(
      currentIndex <
      questions.length - 1
    ){

      currentIndex++;

      renderQuestion();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

  }
);


/* ==================================================
   PREVIOUS
================================================== */

prevBtn.addEventListener(
  "click",
  () => {

    if(currentIndex > 0){

      currentIndex--;

      renderQuestion();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

  }
);


/* ==================================================
   SUBMIT
================================================== */

submitBtn.addEventListener(
  "click",
  submitQuiz
);


function submitQuiz(){

  const unanswered =
    answers.filter(
      answer => answer === null
    ).length;


  if(unanswered > 0){

    const proceed =
      window.confirm(
        "You have " +
        unanswered +
        " unanswered question" +
        (unanswered === 1 ? "" : "s") +
        ". Submit anyway?"
      );

    if(!proceed){
      return;
    }

  }


  let correct = 0;


  questions.forEach(
    (item,index) => {

      if(
        isCorrectAnswer(
          item,
          answers[index]
        )
      ){

        correct++;

      }

    }
  );


  const total =
    questions.length;


  const percent =
    total
      ? Math.round(
          (correct / total) * 100
        )
      : 0;


  showResult(
    correct,
    total,
    percent
  );

}


/* ==================================================
   CHECK ANSWER
================================================== */

function isCorrectAnswer(
  item,
  selected
){

  if(
    selected === null ||
    selected === undefined
  ){

    return false;

  }


  const correct =
    item.correctAnswer;


  if(
    correct === undefined ||
    correct === null
  ){

    return false;

  }


  if(
    typeof correct === "number"
  ){

    const selectedIndex =
      item.options.findIndex(
        option =>
          String(option.value) ===
          String(selected)
      );

    return (
      selectedIndex ===
      Number(correct)
    );

  }


  const correctString =
    String(correct)
      .trim()
      .toLowerCase();


  const selectedString =
    String(selected)
      .trim()
      .toLowerCase();


  if(
    correctString ===
    selectedString
  ){

    return true;

  }


  const selectedOption =
    item.options.find(
      option =>
        String(option.value) ===
        String(selected)
    );


  if(
    selectedOption &&
    String(selectedOption.label)
      .trim()
      .toLowerCase() ===
      correctString
  ){

    return true;

  }


  const letterIndex =
    "abcd".indexOf(
      correctString
    );


  if(
    letterIndex >= 0 &&
    item.options[letterIndex]
  ){

    return (
      String(
        item.options[letterIndex].value
      )
      .trim()
      .toLowerCase() ===
      selectedString
    );

  }


  return false;

}


/* ==================================================
   RESULT
================================================== */

function showResult(
  correct,
  total,
  percent
){

  questionCard.classList.add(
    "hidden"
  );

  resultCard.classList.remove(
    "hidden"
  );


  scoreBox.textContent =
    correct +
    " / " +
    total +
    " (" +
    percent +
    "%)";


  const passScore =
    Number(
      quiz.passingScore ??
      quiz.passScore ??
      0
    );


  if(passScore > 0){

    if(percent >= passScore){

      resultMessage.textContent =
        "Congratulations! You passed the quiz.";

    }else{

      resultMessage.textContent =
        "You did not reach the passing score. You can try again.";

    }

  }else{

    resultMessage.textContent =
      "Quiz completed successfully.";

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ==================================================
   RETAKE
================================================== */

restartBtn.addEventListener(
  "click",
  () => {

    answers =
      new Array(
        questions.length
      ).fill(null);

    currentIndex = 0;

    resultCard.classList.add(
      "hidden"
    );

    questionCard.classList.remove(
      "hidden"
    );

    renderQuestion();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
);


/* ==================================================
   FORMAT TIME
================================================== */

function formatTime(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "";

  }


  if(
    typeof value === "number"
  ){

    if(value >= 60){

      const minutes =
        Math.floor(value / 60);

      const seconds =
        value % 60;

      return seconds
        ? minutes + "m " + seconds + "s"
        : minutes + " min";

    }

    return value + " min";

  }


  return String(value);

}


/* ==================================================
   ERROR
================================================== */

function showError(message){

  loading.classList.add(
    "hidden"
  );

  quizApp.classList.add(
    "hidden"
  );

  errorBox.classList.remove(
    "hidden"
  );

  errorMessage.textContent =
    message;

}


/* ==================================================
   BACK
================================================== */

function goBack(){

  if(courseIdFromUrl){

    window.location.href =
      "course-lessons.html?courseId=" +
      encodeURIComponent(
        courseIdFromUrl
      );

    return;

  }


  if(document.referrer){

    history.back();

    return;

  }


  window.location.href =
    "quizzes.html";

}


/* ==================================================
   SECURITY
================================================== */

function escapeHTML(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
