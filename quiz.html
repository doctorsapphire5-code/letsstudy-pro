<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiz | LetsStudy Pro</title>

<meta name="description"
content="Take online quizzes and track your learning progress with LetsStudy Pro.">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:#f5f7fb;
color:#101828
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #eaecf0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
position:sticky;
top:0;
z-index:50
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef
}

.timer{
background:#fff1f3;
color:#c01048;
padding:9px 13px;
border-radius:10px;
font-weight:800;
font-size:14px
}

.container{
max-width:1000px;
margin:auto;
padding:25px 15px 60px
}

.breadcrumb{
font-size:13px;
color:#667085;
margin-bottom:15px
}

.card{
background:#fff;
border:1px solid #eaecf0;
border-radius:16px;
padding:22px;
margin-bottom:15px
}

.hero{
background:linear-gradient(135deg,#101828,#155eef);
color:#fff
}

.hero h1{
margin:0 0 8px;
font-size:28px
}

.hero p{
margin:0;
line-height:1.6;
opacity:.9
}

.meta{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:18px
}

.badge{
background:#f2f4f7;
color:#475467;
padding:7px 10px;
border-radius:20px;
font-size:12px
}

.hero .badge{
background:#ffffff22;
color:#fff
}

.progress-wrap{
margin:15px 0
}

.progress-top{
display:flex;
justify-content:space-between;
font-size:12px;
color:#667085;
margin-bottom:7px
}

.progress{
height:8px;
background:#eaecf0;
border-radius:20px;
overflow:hidden
}

.progress-bar{
height:100%;
width:0;
background:#155eef;
transition:.25s
}

.question{
font-size:18px;
font-weight:800;
line-height:1.5;
margin-bottom:18px
}

.option{
display:flex;
align-items:flex-start;
gap:12px;
border:1px solid #d0d5dd;
border-radius:12px;
padding:13px;
margin:9px 0;
cursor:pointer;
transition:.2s
}

.option:hover{
background:#f9fafb;
border-color:#155eef
}

.option.selected{
background:#eef4ff;
border-color:#155eef
}

.option input{
width:auto;
margin-top:3px
}

.option span{
font-size:14px;
line-height:1.5
}

.navigation{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:20px
}

button{
border:0;
border-radius:9px;
padding:11px 16px;
font-weight:700;
cursor:pointer
}

.primary{
background:#155eef;
color:#fff
}

.secondary{
background:#eef4ff;
color:#155eef
}

.danger{
background:#fee4e2;
color:#b42318
}

button:disabled{
opacity:.5;
cursor:not-allowed
}

.loading,
.empty{
text-align:center;
padding:45px;
color:#667085
}

.error{
background:#fef3f2;
border:1px solid #fecdca;
color:#b42318;
padding:14px;
border-radius:11px;
margin-bottom:15px
}

.result{
text-align:center
}

.score{
font-size:55px;
font-weight:900;
color:#155eef;
margin:15px 0
}

.result-status{
display:inline-block;
padding:8px 14px;
border-radius:30px;
font-weight:800
}

.pass{
background:#ecfdf3;
color:#027a48
}

.fail{
background:#fef3f2;
color:#b42318
}

.review{
text-align:left;
margin-top:25px
}

.review-item{
border:1px solid #eaecf0;
border-radius:12px;
padding:14px;
margin:10px 0
}

.correct{
color:#027a48
}

.wrong{
color:#b42318
}

.hidden{
display:none!important
}

@media(max-width:600px){

header{
padding:0 12px
}

.logo{
font-size:17px
}

.container{
padding:15px 10px 40px
}

.card{
padding:17px
}

.hero h1{
font-size:23px
}

.navigation{
flex-direction:column
}

.navigation button{
width:100%
}

.score{
font-size:45px
}

}
</style>
</head>

<body>

<header>

<div class="logo">
LetsStudy Pro
</div>

<div id="timer" class="timer">
--:--
</div>

</header>


<main class="container">

<div id="error"></div>

<div id="loading" class="loading">
Loading quiz...
</div>


<section id="quizApp" class="hidden">

<div class="breadcrumb">
<a id="courseLink" href="#">Course</a>
/
<span id="quizBreadcrumb">Quiz</span>
</div>


<div class="card hero">

<h1 id="quizTitle">
Quiz
</h1>

<p id="quizDescription">
Loading...
</p>

<div class="meta">

<span class="badge">
Passing:
<span id="passingScore">0%</span>
</span>

<span class="badge">
Time:
<span id="timeLimit">No limit</span>
</span>

<span class="badge">
Attempts:
<span id="attempts">Unlimited</span>
</span>

</div>

</div>


<div id="startCard" class="card">

<h2>Ready to start?</h2>

<p>
Answer all questions before submitting your quiz.
</p>

<button
id="startBtn"
class="primary">
Start Quiz
</button>

</div>


<div id="questionArea" class="hidden">

<div class="card">

<div class="progress-wrap">

<div class="progress-top">

<span>
Question
<span id="currentNumber">1</span>
of
<span id="totalQuestions">0</span>
</span>

<span id="progressPercent">
0%
</span>

</div>

<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>

</div>


<div id="questionText"
class="question">
Question
</div>


<div id="options">
</div>


<div class="navigation">

<button
id="previousBtn"
class="secondary">
← Previous
</button>

<button
id="nextBtn"
class="primary">
Next →
</button>

</div>

</div>

</div>


<div id="resultArea" class="hidden">

<div class="card result">

<h2>Quiz Completed 🎉</h2>

<div id="score" class="score">
0%
</div>

<div id="resultStatus"
class="result-status">
Result
</div>

<p id="resultMessage"></p>

<button
class="primary"
onclick="location.reload()">
Try Again
</button>

<div id="review" class="review">
</div>

</div>

</div>

</section>

</main>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import{
getFirestore,
doc,
getDoc,
collection,
query,
where,
getDocs,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/*
==================================================
FIREBASE
==================================================
*/

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/*
==================================================
URL
==================================================
*/

const params=
new URLSearchParams(location.search);

const quizId=
params.get("quizId");


/*
==================================================
STATE
==================================================
*/

let quiz=null;

let course=null;

let questions=[];

let answers={};

let current=0;

let timeLeft=0;

let timerInterval=null;

let started=false;


/*
==================================================
ELEMENTS
==================================================
*/

const $=id=>
document.getElementById(id);


/*
==================================================
ERROR
==================================================
*/

function showError(message){

$("loading").style.display="none";

$("error").innerHTML=
`<div class="error">${escapeHtml(message)}</div>`;

}


/*
==================================================
ESCAPE
==================================================
*/

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
==================================================
LOAD QUIZ
==================================================
*/

async function loadQuiz(){

if(!quizId){

showError(
"Quiz ID is missing. Use quiz.html?quizId=YOUR_QUIZ_ID"
);

return;

}


try{

const quizSnap=
await getDoc(
doc(db,"quizzes",quizId)
);


if(!quizSnap.exists()){

showError("Quiz was not found.");

return;

}


quiz={
id:quizSnap.id,
...quizSnap.data()
};


/*
COURSE
*/

if(quiz.courseId){

const courseSnap=
await getDoc(
doc(db,"courses",quiz.courseId)
);

if(courseSnap.exists()){

course={
id:courseSnap.id,
...courseSnap.data()
};

}

}


/*
QUESTIONS

Expected collection:

quizQuestions/{questionId}

quizId
question
options
correctAnswer
order

*/

const q=query(

collection(db,"quizQuestions"),

where("quizId","==",quizId)

);


const snap=
await getDocs(q);


questions=
snap.docs.map(d=>({

id:d.id,
...d.data()

}));


questions.sort(
(a,b)=>
Number(a.order||0)-
Number(b.order||0)
);


/*
DISPLAY
*/

document.title=
`${quiz.title||"Quiz"} | LetsStudy Pro`;

$("quizTitle").textContent=
quiz.title||"Quiz";

$("quizBreadcrumb").textContent=
quiz.title||"Quiz";

$("quizDescription").textContent=
quiz.description||
"Test your knowledge.";

$("passingScore").textContent=
`${Number(quiz.passingScore??70)}%`;

$("timeLimit").textContent=
quiz.timeLimit
?
`${quiz.timeLimit} minutes`
:
"No limit";

$("attempts").textContent=
quiz.attempts??
"Unlimited";

$("courseLink").href=
`course.html?courseId=${encodeURIComponent(
quiz.courseId||""
)}`;


$("totalQuestions").textContent=
questions.length;


$("loading").style.display="none";

$("quizApp").classList.remove("hidden");


if(!questions.length){

$("startCard").innerHTML=
`<div class="empty">
No questions have been added to this quiz yet.
</div>`;

}


}catch(e){

console.error(e);

showError(e.message);

}

}


/*
==================================================
START
==================================================
*/

$("startBtn").addEventListener(
"click",
startQuiz
);


function startQuiz(){

if(!questions.length){

return;

}

started=true;

answers={};

current=0;


/*
TIME LIMIT

Assumes minutes.
*/

if(quiz.timeLimit){

timeLeft=
Number(quiz.timeLimit)*60;

startTimer();

}else{

$("timer").textContent=
"∞";

}


$("startCard").classList.add(
"hidden"
);

$("questionArea").classList.remove(
"hidden"
);

renderQuestion();

}


/*
==================================================
TIMER
==================================================
*/

function startTimer(){

updateTimer();

timerInterval=
setInterval(()=>{

timeLeft--;

updateTimer();

if(timeLeft<=0){

clearInterval(timerInterval);

submitQuiz();

}

},1000);

}


function updateTimer(){

const minutes=
Math.floor(timeLeft/60);

const seconds=
timeLeft%60;

$("timer").textContent=
`${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}


/*
==================================================
QUESTION
==================================================
*/

function renderQuestion(){

const q=
questions[current];


if(!q)return;


$("currentNumber").textContent=
current+1;


$("questionText").textContent=
q.question||
q.title||
"Question";


const percent=
Math.round(
((current+1)/questions.length)*100
);


$("progressPercent").textContent=
`${percent}%`;

$("progressBar").style.width=
`${percent}%`;


const options=
Array.isArray(q.options)
?
q.options
:
Object.values(q.options||{});


$("options").innerHTML=
options.map((option,index)=>{

const value=
typeof option==="object"
?
option.value??option.text??index
:
option;


const label=
typeof option==="object"
?
option.text??option.label??value
:
option;


const selected=
answers[q.id]===value;


return`

<label class="option ${selected?"selected":""}">

<input
type="radio"
name="question"
value="${escapeHtml(value)}"
${selected?"checked":""}>

<span>
${escapeHtml(label)}
</span>

</label>

`;

}).join("");


document
.querySelectorAll(
'input[name="question"]'
)
.forEach(input=>{

input.addEventListener(
"change",
()=>{

answers[q.id]=input.value;

renderQuestion();

}
);

});


$("previousBtn").disabled=
current===0;


if(current===questions.length-1){

$("nextBtn").textContent=
"Submit Quiz ✓";

}else{

$("nextBtn").textContent=
"Next →";

}

}


/*
==================================================
NEXT
==================================================
*/

$("nextBtn").addEventListener(
"click",
()=>{

if(!started)return;


if(current<questions.length-1){

current++;

renderQuestion();

}else{

submitQuiz();

}

}
);


/*
==================================================
PREVIOUS
==================================================
*/

$("previousBtn").addEventListener(
"click",
()=>{

if(current>0){

current--;

renderQuestion();

}

}
);


/*
==================================================
SUBMIT
==================================================
*/

async function submitQuiz(){

if(!started)return;

started=false;

if(timerInterval){

clearInterval(timerInterval);

}


$("timer").textContent=
"Done";


let correct=0;

let answered=0;


/*
CHECK ANSWERS
*/

questions.forEach(q=>{

const user=
answers[q.id];

if(
user!==undefined &&
user!==""
){

answered++;

}


const correctAnswer=
q.correctAnswer ??
q.answer ??
q.correctOption;


if(
String(user)===
String(correctAnswer)
){

correct++;

}

});


const total=
questions.length;

const percentage=
total
?
Math.round((correct/total)*100)
:
0;


const passing=
Number(
quiz.passingScore??70
);


const passed=
percentage>=passing;


/*
RESULT
*/

$("questionArea").classList.add(
"hidden"
);

$("resultArea").classList.remove(
"hidden"
);

$("score").textContent=
`${percentage}%`;


$("resultStatus").textContent=
passed
?
"PASSED ✓"
:
"NOT PASSED";


$("resultStatus").className=
`result-status ${passed?"pass":"fail"}`;


$("resultMessage").textContent=
passed
?
`Congratulations! You scored ${percentage}%, which is above the passing score of ${passing}%.`
:
`You scored ${percentage}%. You need ${passing}% to pass.`;


/*
REVIEW
*/

renderReview();


/*
SAVE RESULT

Collection:

quizResults/{resultId}

*/

try{

await addDoc(

collection(db,"quizResults"),

{

quizId:quizId,

courseId:quiz.courseId||"",

score:percentage,

correctAnswers:correct,

totalQuestions:total,

answeredQuestions:answered,

passed:passed,

passingScore:passing,

attemptedAt:
serverTimestamp()

}

);

}catch(e){

console.error(
"Could not save quiz result:",
e
);

}

}


/*
==================================================
REVIEW
==================================================
*/

function renderReview(){

$("review").innerHTML=
`<h3>Answer Review</h3>`;


questions.forEach(
(q,index)=>{

const user=
answers[q.id];

const correct=
q.correctAnswer ??
q.answer ??
q.correctOption;


const isCorrect=
String(user)===
String(correct);


const item=
document.createElement("div");

item.className=
"review-item";


item.innerHTML=`

<strong>
${index+1}. ${escapeHtml(
q.question||q.title||"Question"
)}
</strong>

<p class="${isCorrect?"correct":"wrong"}">

Your answer:
${escapeHtml(
user??"Not answered"
)}

</p>

<p class="correct">

Correct answer:
${escapeHtml(
correct??"Not specified"
)}

</p>

`;


$("review").appendChild(item);

});

}


/*
==================================================
START
==================================================
*/

loadQuiz();

</script>

</body>
</html>
