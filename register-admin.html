<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register Admin | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Create an authorized administrator account for the Let'sStudy Pro platform."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        linear-gradient(135deg, #eef4ff 0%, #f8fafc 50%, #eef2ff 100%);
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .shield {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .brand p {
      color: #64748b;
      font-size: 14px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 750;
      margin-bottom: 6px;
    }

    .section-description {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 650;
      margin-bottom: 7px;
      color: #334155;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      background: white;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    input:disabled {
      background: #f8fafc;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 82px;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #2563eb;
      font-weight: 700;
      cursor: pointer;
      padding: 6px;
    }

    .message {
      display: none;
      border-radius: 11px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }

    .message.info {
      display: block;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
    }

    .submit-btn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      transition: 0.2s ease;
      margin-top: 4px;
    }

    .submit-btn:hover {
      background: #1f2937;
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;
    }

    .security {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #94a3b8;
      font-size: 12px;
    }

    .error-details {
      display: none;
      margin-top: 9px;
      font-family: monospace;
      font-size: 11px;
      word-break: break-word;
      color: #7f1d1d;
    }

    @media (max-width: 520px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 25px 20px;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="brand">
        <div class="shield">🛡️</div>

        <h1>Let'sStudy Pro</h1>

        <p>Administrator Portal</p>
      </div>

      <div class="section-title">
        Register Admin
      </div>

      <div class="section-description">
        Create an administrator account for the Let'sStudy Pro platform.
      </div>

      <div id="message" class="message"></div>

      <form id="adminForm">

        <div class="field">
          <label for="name">
            Full Name
          </label>

          <input
            id="name"
            type="text"
            placeholder="Administrator full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="email">
            Admin Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              type="password"
              placeholder="Minimum 6 characters"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="toggle-password"
              data-target="password"
            >
              Show
            </button>

          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="password-wrap">

            <input
              id="confirmPassword"
              type="password"
              placeholder="Confirm password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="toggle-password"
              data-target="confirmPassword"
            >
              Show
            </button>

          </div>
        </div>

        <button
          id="registerBtn"
          type="submit"
          class="submit-btn"
        >
          Create Admin Account
        </button>

      </form>

      <a
        href="login-admin.html"
        class="back"
      >
        ← Back to Admin Login
      </a>

      <div class="security">
        🔒 Admin access should only be granted to authorized
        Let'sStudy Pro administrators.
      </div>

    </div>

    <div class="footer">
      © 2026 Let'sStudy Pro
    </div>

  </div>


  <!-- Firebase -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /*
     * IMPORTANT:
     * Use the SAME Firebase configuration
     * as the rest of your Let'sStudy Pro project.
     */

    const firebaseConfig = {

      apiKey:
        "YOUR_FIREBASE_API_KEY",

      authDomain:
        "YOUR_PROJECT.firebaseapp.com",

      projectId:
        "YOUR_PROJECT_ID",

      storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

      messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

      appId:
        "YOUR_FIREBASE_APP_ID"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    const form =
      document.getElementById("adminForm");

    const nameInput =
      document.getElementById("name");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmInput =
      document.getElementById("confirmPassword");

    const registerBtn =
      document.getElementById("registerBtn");

    const message =
      document.getElementById("message");


    function showMessage(
      text,
      type = "error",
      details = ""
    ) {

      message.className =
        "message " + type;

      message.innerHTML =
        text +
        (
          details
            ? `<div class="error-details" style="display:block">${details}</div>`
            : ""
        );

      message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }


    function clearMessage() {

      message.className =
        "message";

      message.innerHTML = "";

    }


    function getFirebaseError(error) {

      switch (error.code) {

        case "auth/email-already-in-use":
          return "This email address is already registered in Firebase Authentication.";

        case "auth/invalid-email":
          return "The administrator email address is invalid.";

        case "auth/weak-password":
          return "The password is too weak. Use at least 6 characters.";

        case "auth/network-request-failed":
          return "Network error. Check your internet connection and try again.";

        case "auth/operation-not-allowed":
          return "Email/Password Authentication is not enabled in Firebase Authentication.";

        case "auth/too-many-requests":
          return "Too many attempts. Please wait and try again later.";

        case "permission-denied":
        case "firestore/permission-denied":
          return "Firebase Firestore denied permission to create the admin record.";

        default:
          return error.message ||
            "Unable to create admin account.";

      }

    }


    document
      .querySelectorAll(".toggle-password")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const target =
              document.getElementById(
                button.dataset.target
              );

            if (
              target.type === "password"
            ) {

              target.type = "text";
              button.textContent = "Hide";

            } else {

              target.type = "password";
              button.textContent = "Show";

            }

          }
        );

      });


    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        clearMessage();


        const name =
          nameInput.value.trim();

        const email =
          emailInput.value.trim().toLowerCase();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmInput.value;


        if (!name) {

          showMessage(
            "Please enter the administrator name."
          );

          nameInput.focus();

          return;

        }


        if (!email) {

          showMessage(
            "Please enter the administrator email."
          );

          emailInput.focus();

          return;

        }


        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters."
          );

          passwordInput.focus();

          return;

        }


        if (
          password !== confirmPassword
        ) {

          showMessage(
            "Passwords do not match."
          );

          confirmInput.focus();

          return;

        }


        registerBtn.disabled = true;

        registerBtn.textContent =
          "Creating account...";


        try {

          /*
           * STEP 1
           * Create Firebase Authentication user
           */

          const credential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          /*
           * STEP 2
           * Save display name
           */

          await updateProfile(
            user,
            {
              displayName: name
            }
          );


          /*
           * STEP 3
           * Create admin Firestore document
           *
           * admins/{uid}
           */

          await setDoc(
            doc(
              db,
              "admins",
              user.uid
            ),
            {

              uid: user.uid,

              name: name,

              email: email,

              role: "admin",

              status: "active",

              createdAt:
                serverTimestamp()

            }
          );


          /*
           * SUCCESS
           */

          showMessage(
            "Admin account created successfully. Redirecting to login...",
            "success"
          );


          registerBtn.textContent =
            "Account Created";


          setTimeout(
            () => {

              window.location.replace(
                "login-admin.html"
              );

            },
            1500
          );

        }

        catch (error) {

          console.error(
            "Admin registration error:",
            error
          );


          const friendly =
            getFirebaseError(error);


          /*
           * Show both friendly error
           * and Firebase error code.
           */

          showMessage(
            friendly,
            "error",
            `Firebase error code: ${error.code || "unknown"}`
          );


          registerBtn.disabled = false;

          registerBtn.textContent =
            "Create Admin Account";

        }

      });

  </script>

</body>
</html>
