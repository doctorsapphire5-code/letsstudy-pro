<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Register Admin | LetsStudy Pro</title>

  <meta name="description"
        content="Authorized LetsStudy Pro administrator registration.">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f4f7fb;
    }

    .card{
      width:100%;
      max-width:460px;
      background:#fff;
      padding:30px;
      border-radius:18px;
      box-shadow:0 12px 40px rgba(0,0,0,.10);
    }

    h1{
      text-align:center;
      margin-bottom:8px;
      color:#111827;
    }

    .subtitle{
      text-align:center;
      color:#6b7280;
      margin-bottom:25px;
      font-size:14px;
    }

    label{
      display:block;
      margin:15px 0 7px;
      font-weight:600;
      color:#374151;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #d1d5db;
      border-radius:10px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#2563eb;
    }

    button{
      width:100%;
      margin-top:22px;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#2563eb;
      color:#fff;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .message{
      margin-top:18px;
      padding:12px;
      border-radius:10px;
      display:none;
      font-size:14px;
      line-height:1.5;
    }

    .success{
      display:block;
      background:#dcfce7;
      color:#166534;
    }

    .error{
      display:block;
      background:#fee2e2;
      color:#991b1b;
    }

    .login{
      display:block;
      text-align:center;
      margin-top:20px;
      color:#2563eb;
      text-decoration:none;
      font-weight:600;
    }

    .uid{
      margin-top:10px;
      padding:10px;
      background:#f3f4f6;
      border-radius:8px;
      font-size:12px;
      word-break:break-all;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Admin Registration</h1>

    <p class="subtitle">
      LetsStudy Pro Administrator
    </p>

    <form id="adminForm">

      <label for="name">Full Name</label>

      <input
        id="name"
        type="text"
        placeholder="Administrator name"
        required
      >

      <label for="email">Admin Email</label>

      <input
        id="email"
        type="email"
        placeholder="admin@example.com"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Minimum 6 characters"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Repeat password"
        minlength="6"
        required
      >

      <button id="registerBtn" type="submit">
        Create Administrator
      </button>

    </form>

    <div id="message" class="message"></div>

    <a class="login" href="login-admin.html">
      ← Go to Admin Login
    </a>

  </div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"
};


/* =====================================================
   INITIALIZE
===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById("adminForm");

const nameInput =
  document.getElementById("name");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const confirmPasswordInput =
  document.getElementById("confirmPassword");

const registerBtn =
  document.getElementById("registerBtn");

const message =
  document.getElementById("message");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type){

  message.textContent = text;

  message.className =
    "message " + type;
}


/* =====================================================
   REGISTER ADMIN
===================================================== */

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const name =
    nameInput.value.trim();

  const email =
    emailInput.value.trim().toLowerCase();

  const password =
    passwordInput.value;

  const confirmPassword =
    confirmPasswordInput.value;


  /* -----------------------------
     VALIDATION
  ----------------------------- */

  if(!name){

    showMessage(
      "Please enter the administrator name.",
      "error"
    );

    return;
  }


  if(password !== confirmPassword){

    showMessage(
      "Passwords do not match.",
      "error"
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "Password must contain at least 6 characters.",
      "error"
    );

    return;
  }


  registerBtn.disabled = true;

  registerBtn.textContent =
    "Creating administrator...";


  try{

    /* -----------------------------
       CREATE FIREBASE AUTH ACCOUNT
    ----------------------------- */

    const credential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user =
      credential.user;


    /* -----------------------------
       UPDATE AUTH PROFILE
    ----------------------------- */

    await updateProfile(user, {

      displayName: name

    });


    /* -----------------------------
       CREATE ADMIN DOCUMENT
    ----------------------------- */

    await setDoc(
      doc(db, "admins", user.uid),
      {

        uid:
          user.uid,

        name:
          name,

        email:
          email,

        role:
          "admin",

        status:
          "active",

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );


    /* -----------------------------
       SUCCESS
    ----------------------------- */

    showMessage(
      "Administrator created successfully.",
      "success"
    );


    /* -----------------------------
       SHOW UID
    ----------------------------- */

    const uidBox =
      document.createElement("div");

    uidBox.className = "uid";

    uidBox.textContent =
      "Admin UID: " + user.uid;

    message.appendChild(uidBox);


    /* -----------------------------
       SIGN OUT
    ----------------------------- */

    await signOut(auth);


    form.reset();

    registerBtn.disabled = false;

    registerBtn.textContent =
      "Create Administrator";


  }catch(error){

    console.error(
      "ADMIN REGISTRATION ERROR:",
      error
    );


    let errorMessage =
      "Unable to create administrator.";


    if(
      error.code ===
      "auth/email-already-in-use"
    ){

      errorMessage =
        "This email is already registered.";

    }

    else if(
      error.code ===
      "auth/invalid-email"
    ){

      errorMessage =
        "Invalid email address.";

    }

    else if(
      error.code ===
      "auth/weak-password"
    ){

      errorMessage =
        "Password is too weak.";

    }

    else if(
      error.code ===
      "permission-denied"
    ){

      errorMessage =
        "Firestore denied creation of the admin record. Check your admin registration authorization.";

    }

    else if(
      error.code ===
      "unavailable"
    ){

      errorMessage =
        "Firestore is temporarily unavailable. Please try again.";

    }


    showMessage(
      errorMessage,
      "error"
    );


    registerBtn.disabled = false;

    registerBtn.textContent =
      "Create Administrator";

  }

});

</script>

</body>
</html>
