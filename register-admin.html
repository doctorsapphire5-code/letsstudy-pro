<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register Admin | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Create an authorized administrator account for the Let'sStudy Pro platform."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fafc, #eef2ff);
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, .10);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .shield {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: #111827;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .brand p {
      color: #64748b;
      font-size: 14px;
    }

    .title {
      font-size: 19px;
      font-weight: 750;
      margin-bottom: 6px;
    }

    .description {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 23px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 650;
      color: #334155;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 49px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .10);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 75px;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #2563eb;
      font-weight: 700;
      cursor: pointer;
      padding: 6px;
    }

    .message {
      display: none;
      border-radius: 11px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }

    .register-btn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 12px;
      background: #111827;
      color: #fff;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
    }

    .register-btn:hover {
      background: #1f2937;
    }

    .register-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;
    }

    .security {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 25px 20px;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="brand">

        <div class="shield">🛡️</div>

        <h1>Let'sStudy Pro</h1>

        <p>Administrator Portal</p>

      </div>


      <div class="title">
        Register Admin
      </div>

      <div class="description">
        Create an administrator account for the Let'sStudy Pro platform.
      </div>


      <div id="message" class="message"></div>


      <form id="adminForm">

        <div class="field">

          <label for="name">
            Full Name
          </label>

          <input
            id="name"
            type="text"
            placeholder="Administrator full name"
            autocomplete="name"
            required
          >

        </div>


        <div class="field">

          <label for="email">
            Admin Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              type="password"
              placeholder="Minimum 6 characters"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="toggle"
              data-target="password"
            >
              Show
            </button>

          </div>

        </div>


        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="password-wrap">

            <input
              id="confirmPassword"
              type="password"
              placeholder="Confirm password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="toggle"
              data-target="confirmPassword"
            >
              Show
            </button>

          </div>

        </div>


        <button
          id="registerBtn"
          type="submit"
          class="register-btn"
        >
          Create Admin Account
        </button>

      </form>


      <a
        href="login-admin.html"
        class="back"
      >
        ← Back to Admin Login
      </a>


      <div class="security">
        🔒 Admin access should only be granted to authorized
        Let'sStudy Pro administrators.
      </div>

    </div>


    <div class="footer">
      © 2026 Let'sStudy Pro
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /*
     * LETSSTUDY PRO FIREBASE CONFIG
     */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

      measurementId:
        "G-85B7V5H5J0"

    };


    /*
     * INITIALIZE FIREBASE
     */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /*
     * ELEMENTS
     */

    const form =
      document.getElementById(
        "adminForm"
      );

    const nameInput =
      document.getElementById(
        "name"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const confirmInput =
      document.getElementById(
        "confirmPassword"
      );

    const registerBtn =
      document.getElementById(
        "registerBtn"
      );

    const message =
      document.getElementById(
        "message"
      );


    /*
     * MESSAGE
     */

    function showMessage(
      text,
      type = "error"
    ) {

      message.className =
        "message " + type;

      message.textContent =
        text;

    }


    function clearMessage() {

      message.className =
        "message";

      message.textContent =
        "";

    }


    /*
     * FIREBASE ERRORS
     */

    function getErrorMessage(error) {

      switch (error.code) {

        case "auth/email-already-in-use":

          return "This email address is already registered in Firebase Authentication.";

        case "auth/invalid-email":

          return "The administrator email address is invalid.";

        case "auth/weak-password":

          return "Password is too weak. Use at least 6 characters.";

        case "auth/operation-not-allowed":

          return "Email/Password Authentication is not enabled in Firebase Authentication.";

        case "auth/network-request-failed":

          return "Network error. Check your internet connection.";

        case "permission-denied":

          return "Firestore denied permission to create the administrator record.";

        case "unavailable":

          return "Firestore is temporarily unavailable. Please try again.";

        default:

          return error.message ||
            "Unable to create admin account.";

      }

    }


    /*
     * PASSWORD TOGGLE
     */

    document
      .querySelectorAll(".toggle")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const target =
              document.getElementById(
                button.dataset.target
              );


            if (
              target.type === "password"
            ) {

              target.type = "text";

              button.textContent =
                "Hide";

            } else {

              target.type = "password";

              button.textContent =
                "Show";

            }

          }
        );

      });


    /*
     * REGISTER ADMIN
     */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        clearMessage();


        const name =
          nameInput.value.trim();


        const email =
          emailInput.value
            .trim()
            .toLowerCase();


        const password =
          passwordInput.value;


        const confirmPassword =
          confirmInput.value;


        /*
         * VALIDATION
         */

        if (!name) {

          showMessage(
            "Please enter the administrator name."
          );

          nameInput.focus();

          return;

        }


        if (!email) {

          showMessage(
            "Please enter the administrator email."
          );

          emailInput.focus();

          return;

        }


        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters."
          );

          passwordInput.focus();

          return;

        }


        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "Passwords do not match."
          );

          confirmInput.focus();

          return;

        }


        /*
         * DISABLE BUTTON
         */

        registerBtn.disabled =
          true;

        registerBtn.textContent =
          "Creating account...";


        try {

          /*
           * 1. CREATE AUTH ACCOUNT
           */

          const credential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          /*
           * 2. UPDATE DISPLAY NAME
           */

          await updateProfile(
            user,
            {
              displayName:
                name
            }
          );


          /*
           * 3. CREATE ADMIN DOCUMENT
           *
           * admins/{uid}
           */

          await setDoc(
            doc(
              db,
              "admins",
              user.uid
            ),
            {

              uid:
                user.uid,

              name:
                name,

              email:
                email,

              role:
                "admin",

              status:
                "active",

              createdAt:
                serverTimestamp()

            }
          );


          /*
           * SUCCESS
           */

          showMessage(
            "Admin account created successfully. Redirecting to login...",
            "success"
          );


          registerBtn.textContent =
            "Account Created";


          setTimeout(
            () => {

              window.location.replace(
                "login-admin.html"
              );

            },
            1500
          );

        }

        catch (error) {

          console.error(
            "Admin registration error:",
            error
          );


          showMessage(
            getErrorMessage(error)
          );


          registerBtn.disabled =
            false;

          registerBtn.textContent =
            "Create Admin Account";

        }

      });

  </script>

</body>
</html>
