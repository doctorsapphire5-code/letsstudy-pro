<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Register Admin | Let'sStudy Pro</title>
  <meta name="robots" content="noindex,nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .icon {
      width: 62px;
      height: 62px;
      margin: auto;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      color: white;
      font-size: 28px;
    }

    .brand h1 {
      margin: 12px 0 5px;
      font-size: 24px;
    }

    .brand p {
      margin: 0;
      color: #687386;
      font-size: 14px;
    }

    .card {
      background: white;
      border: 1px solid #e2e7ef;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, .1);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .description {
      margin: 0 0 22px;
      color: #687386;
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 49px;
      padding: 12px 14px;
      border: 1px solid #e2e7ef;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .13);
    }

    button {
      width: 100%;
      min-height: 50px;
      margin-top: 4px;
      border: 0;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
    }

    .back {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .notice {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 12px;
      line-height: 1.5;
    }

    footer {
      margin-top: 18px;
      text-align: center;
      color: #687386;
      font-size: 12px;
    }
  </style>
</head>

<body>

<main class="container">

  <header class="brand">
    <div class="icon" aria-hidden="true">🛡️</div>

    <h1>Let'sStudy Pro</h1>

    <p>Administrator Portal</p>
  </header>

  <section class="card" aria-labelledby="register-title">

    <h2 id="register-title">Register Admin</h2>

    <p class="description">
      Create an administrator account for the Let'sStudy Pro platform.
    </p>

    <div
      id="message"
      class="message"
      role="alert"
      aria-live="polite"
    ></div>

    <form id="registerForm">

      <div class="field">
        <label for="name">Full Name</label>

        <input
          id="name"
          type="text"
          autocomplete="name"
          placeholder="Administrator name"
          required
        >
      </div>

      <div class="field">
        <label for="email">Admin Email</label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="admin@example.com"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Minimum 8 characters"
          required
        >
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Repeat password"
          required
        >
      </div>

      <button id="registerBtn" type="submit">
        Create Admin Account
      </button>

    </form>

    <a href="login-admin.html" class="back">
      ← Back to Admin Login
    </a>

    <div class="notice">
      🔒 Admin access should only be granted to authorized
      Let'sStudy Pro administrators.
    </div>

  </section>

  <footer>
    © <span id="year"></span> Let'sStudy Pro
  </footer>

</main>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  const form =
    document.getElementById("registerForm");

  const nameInput =
    document.getElementById("name");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const confirmInput =
    document.getElementById("confirmPassword");

  const registerBtn =
    document.getElementById("registerBtn");

  const message =
    document.getElementById("message");


  document.getElementById("year").textContent =
    new Date().getFullYear();


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      `message ${type}`;
  }


  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      message.className = "message";

      const name =
        nameInput.value.trim();

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      const confirmPassword =
        confirmInput.value;


      if (!name) {

        showMessage(
          "Please enter the administrator name.",
          "error"
        );

        nameInput.focus();

        return;
      }


      if (!email) {

        showMessage(
          "Please enter the administrator email.",
          "error"
        );

        emailInput.focus();

        return;
      }


      if (password.length < 8) {

        showMessage(
          "Password must contain at least 8 characters.",
          "error"
        );

        passwordInput.focus();

        return;
      }


      if (password !== confirmPassword) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        confirmInput.focus();

        return;
      }


      registerBtn.disabled = true;

      registerBtn.textContent =
        "Creating account...";


      try {

        const credential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          credential.user;


        await updateProfile(
          user,
          {
            displayName: name
          }
        );


        await setDoc(
          doc(db, "users", user.uid),
          {
            uid: user.uid,
            name: name,
            email: email,
            role: "admin",
            status: "active",
            createdAt: serverTimestamp()
          }
        );


        showMessage(
          "Admin account created successfully. Redirecting to login...",
          "success"
        );


        setTimeout(() => {

          window.location.replace(
            "login-admin.html"
          );

        }, 1200);


      } catch (error) {

        console.error(
          "Admin registration error:",
          error
        );


        let text =
          "Unable to create admin account.";


        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          text =
            "This email is already registered.";

        } else if (
          error.code ===
          "auth/invalid-email"
        ) {

          text =
            "Please enter a valid email address.";

        } else if (
          error.code ===
          "auth/weak-password"
        ) {

          text =
            "Password is too weak.";

        } else if (
          error.code ===
          "auth/network-request-failed"
        ) {

          text =
            "Network error. Check your internet connection.";
        }


        showMessage(
          text,
          "error"
        );

      } finally {

        registerBtn.disabled = false;

        registerBtn.textContent =
          "Create Admin Account";
      }

    }
  );

</script>

</body>
</html>
