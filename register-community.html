<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Register | Let'sStudy Pro Community</title>

  <meta
    name="description"
    content="Create your Let'sStudy Pro Community account."
  >

  <link rel="icon" href="/favicon.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #eef2ff
        );
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 25px;
    }

    .brand p {
      margin: 7px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 28px;
      box-shadow:
        0 18px 45px rgba(
          15,
          23,
          42,
          .08
        );
    }

    .card h2 {
      margin: 0 0 7px;
      font-size: 22px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #64748b;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 0 14px;
      outline: none;
      font-size: 15px;
      background: #fff;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow:
        0 0 0 3px
        rgba(79, 70, 229, .10);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 70px;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 8px;
      height: 32px;
      padding: 0 9px;
      border: 0;
      border-radius: 8px;
      background: #f1f5f9;
      color: #334155;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .hint {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 11px;
    }

    .error,
    .success {
      display: none;
      padding: 11px 13px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .success {
      color: #166534;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    .error.show,
    .success.show {
      display: block;
    }

    .submit {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 12px;
      background: #4f46e5;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit:hover {
      background: #4338ca;
    }

    .submit:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 14px;
    }

    .footer a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 700;
    }

    .terms {
      margin: 16px 0;
      color: #64748b;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 22px 18px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">

      <img
        src="/favicon.ico"
        alt="Let'sStudy Pro"
        class="brand-logo"
      >

      <h1>Let'sStudy Pro</h1>

      <p>
        Community
      </p>

    </div>


    <section class="card">

      <h2>Create your account</h2>

      <p class="subtitle">
        Join the Let'sStudy Pro learning community.
      </p>


      <div
        id="error"
        class="error"
      ></div>


      <div
        id="success"
        class="success"
      ></div>


      <form id="registerForm">

        <div class="field">

          <label for="displayName">
            Full name
          </label>

          <input
            id="displayName"
            type="text"
            placeholder="Your full name"
            autocomplete="name"
            required
          >

        </div>


        <div class="field">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            type="text"
            placeholder="e.g. john123"
            autocomplete="username"
            minlength="3"
            maxlength="30"
            required
          >

          <div class="hint">
            Use letters, numbers, underscore or dot.
          </div>

        </div>


        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              type="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="toggle-password"
            >
              Show
            </button>

          </div>

          <div class="hint">
            Minimum 6 characters.
          </div>

        </div>


        <div class="field">

          <label for="confirmPassword">
            Confirm password
          </label>

          <input
            id="confirmPassword"
            type="password"
            placeholder="Repeat your password"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <div class="terms">
          By creating an account, you agree to use the
          Let'sStudy Pro Community responsibly.
        </div>


        <button
          type="submit"
          id="submitButton"
          class="submit"
        >
          Create Community Account
        </button>

      </form>

    </section>


    <div class="footer">

      Already have an account?

      <a href="auth-community.html">
        Sign in
      </a>

    </div>

  </main>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script>

    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

      measurementId:
        "G-85B7V5H5J0"

    };


    firebase.initializeApp(
      firebaseConfig
    );


    const auth =
      firebase.auth();


    const db =
      firebase.firestore();


    /* =========================
       ELEMENTS
    ========================= */

    const form =
      document.getElementById(
        "registerForm"
      );


    const submitButton =
      document.getElementById(
        "submitButton"
      );


    const errorBox =
      document.getElementById(
        "error"
      );


    const successBox =
      document.getElementById(
        "success"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const confirmPasswordInput =
      document.getElementById(
        "confirmPassword"
      );


    const togglePassword =
      document.getElementById(
        "togglePassword"
      );


    /* =========================
       HELPERS
    ========================= */

    function showError(
      message
    ){

      successBox.classList.remove(
        "show"
      );

      errorBox.textContent =
        message;

      errorBox.classList.add(
        "show"
      );

    }


    function showSuccess(
      message
    ){

      errorBox.classList.remove(
        "show"
      );

      successBox.textContent =
        message;

      successBox.classList.add(
        "show"
      );

    }


    function normalizeUsername(
      username
    ){

      return username
        .trim()
        .toLowerCase();

    }


    function validUsername(
      username
    ){

      return /^[a-z0-9._]+$/.test(
        username
      );

    }


    function getFirebaseError(
      error
    ){

      switch(
        error.code
      ){

        case
          "auth/email-already-in-use":

          return "This email is already registered.";

        case
          "auth/invalid-email":

          return "Please enter a valid email address.";

        case
          "auth/weak-password":

          return "Password is too weak. Use at least 6 characters.";

        case
          "auth/network-request-failed":

          return "Network error. Please check your internet connection.";

        case
          "permission-denied":

          return "You do not have permission to create this profile.";

        default:

          return (
            error.message ||
            "Registration failed. Please try again."
          );

      }

    }


    /* =========================
       SHOW PASSWORD
    ========================= */

    togglePassword.addEventListener(
      "click",
      () => {

        const visible =
          passwordInput.type ===
          "text";


        passwordInput.type =
          visible
            ? "password"
            : "text";


        confirmPasswordInput.type =
          visible
            ? "password"
            : "text";


        togglePassword.textContent =
          visible
            ? "Show"
            : "Hide";

      }
    );


    /* =========================
       REGISTER
    ========================= */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        errorBox.classList.remove(
          "show"
        );

        successBox.classList.remove(
          "show"
        );


        const displayName =
          document
            .getElementById(
              "displayName"
            )
            .value
            .trim();


        const username =
          normalizeUsername(
            document
              .getElementById(
                "username"
              )
              .value
          );


        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim()
            .toLowerCase();


        const password =
          passwordInput.value;


        const confirmPassword =
          confirmPasswordInput.value;


        if(
          displayName.length <
          2
        ){

          showError(
            "Please enter your full name."
          );

          return;

        }


        if(
          username.length <
          3
        ){

          showError(
            "Username must contain at least 3 characters."
          );

          return;

        }


        if(
          !validUsername(
            username
          )
        ){

          showError(
            "Username can only contain letters, numbers, dots and underscores."
          );

          return;

        }


        if(
          password.length <
          6
        ){

          showError(
            "Password must contain at least 6 characters."
          );

          return;

        }


        if(
          password !==
          confirmPassword
        ){

          showError(
            "Passwords do not match."
          );

          return;

        }


        submitButton.disabled =
          true;

        submitButton.textContent =
          "Creating account...";


        let createdUser =
          null;


        try {

          /*
           * Check username first.
           */

          const usernameQuery =
            await db
              .collection(
                "profiles"
              )
              .where(
                "username",
                "==",
                username
              )
              .limit(
                1
              )
              .get();


          if(
            !usernameQuery.empty
          ){

            showError(
              "That username is already taken."
            );

            submitButton.disabled =
              false;

            submitButton.textContent =
              "Create Community Account";

            return;

          }


          /*
           * Create Firebase Auth account.
           */

          const credential =
            await auth
              .createUserWithEmailAndPassword(
                email,
                password
              );


          createdUser =
            credential.user;


          /*
           * Update Auth profile.
           */

          await createdUser
            .updateProfile({

              displayName:
                displayName,

              photoURL:
                ""

            });


          const now =
            firebase.firestore
              .FieldValue
              .serverTimestamp();


          /*
           * Create users/{userId}
           */

          await db
            .collection(
              "users"
            )
            .doc(
              createdUser.uid
            )
            .set({

              uid:
                createdUser.uid,

              email:
                email,

              displayName:
                displayName,

              photoURL:
                "",

              username:
                username,

              bio:
                "",

              location:
                "",

              role:
                "student",

              status:
                "active",

              createdAt:
                now,

              lastActiveAt:
                now

            });


          /*
           * Create profiles/{userId}
           */

          await db
            .collection(
              "profiles"
            )
            .doc(
              createdUser.uid
            )
            .set({

              userId:
                createdUser.uid,

              displayName:
                displayName,

              username:
                username,

              photoURL:
                "",

              coverPhoto:
                "",

              bio:
                "",

              location:
                "",

              website:
                "",

              interests:
                [],

              socialLinks:
                {},

              postCount:
                0,

              followerCount:
                0,

              followingCount:
                0,

              connectionCount:
                0,

              createdAt:
                now,

              updatedAt:
                now

            });


          showSuccess(
            "Account created successfully. Redirecting..."
          );


          form.reset();


          setTimeout(
            () => {

              window.location.href =
                "community.html";

            },
            1000
          );


        }

        catch(error){

          console.error(
            "Registration error:",
            error
          );


          /*
           * If Firestore creation failed after
           * Firebase Auth account was created,
           * remove the incomplete Auth account.
           */

          if(
            createdUser
          ){

            try {

              await createdUser.delete();

            }

            catch(deleteError){

              console.error(
                "Rollback error:",
                deleteError
              );

            }

          }


          showError(
            getFirebaseError(
              error
            )
          );


          submitButton.disabled =
            false;

          submitButton.textContent =
            "Create Community Account";

        }

      }
    );


    /* =========================
       AUTH CHECK
    ========================= */

    auth.onAuthStateChanged(
      user => {

        if(user){

          /*
           * Already signed in.
           * Keep the registration page accessible,
           * but avoid creating another account.
           */

          const notice =
            document.createElement(
              "div"
            );


          notice.style.cssText =
            `
              margin-bottom:16px;
              padding:11px 13px;
              border-radius:10px;
              background:#eff6ff;
              color:#1e40af;
              border:1px solid #bfdbfe;
              font-size:13px;
            `;


          notice.textContent =
            "You are already signed in.";


          form.parentNode.insertBefore(
            notice,
            form
          );

        }

      }
    );

  </script>

</body>
</html>
