<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Account | LetsStudy Pro</title>

<meta name="description"
      content="Create your LetsStudy Pro student account and start learning.">

<meta name="theme-color"
      content="#2563eb">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #f8fafc
    );

  color:#0f172a;

  display:flex;
  flex-direction:column;
}

.navbar{
  height:68px;

  background:#fff;

  border-bottom:
    1px solid #e2e8f0;
}

.nav-container{
  max-width:1100px;

  height:100%;

  margin:auto;

  padding:0 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.logo{
  display:flex;

  align-items:center;

  gap:9px;

  color:#2563eb;

  text-decoration:none;

  font-size:19px;

  font-weight:800;
}

.logo-icon{
  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#2563eb;

  color:#fff;

  border-radius:10px;

  font-size:13px;

  font-weight:900;
}

.home-link{
  color:#475569;

  text-decoration:none;

  font-size:13px;

  font-weight:600;
}

.home-link:hover{
  color:#2563eb;
}

.main{
  flex:1;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:40px 20px;
}

.register-card{
  width:100%;

  max-width:460px;

  background:#fff;

  border:
    1px solid #e2e8f0;

  border-radius:18px;

  padding:30px;

  box-shadow:
    0 15px 45px
    rgba(15,23,42,.08);
}

.register-icon{
  width:58px;
  height:58px;

  margin:
    0 auto 18px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#dbeafe;

  color:#2563eb;

  border-radius:15px;

  font-size:27px;
}

h1{
  text-align:center;

  font-size:27px;

  margin-bottom:7px;
}

.subtitle{
  text-align:center;

  color:#64748b;

  font-size:13px;

  margin-bottom:25px;
}

.message{
  display:none;

  padding:12px;

  border-radius:9px;

  margin-bottom:17px;

  font-size:13px;

  line-height:1.5;
}

.message.error{
  display:block;

  background:#fee2e2;

  color:#991b1b;
}

.message.success{
  display:block;

  background:#dcfce7;

  color:#166534;
}

.form-group{
  margin-bottom:16px;
}

label{
  display:block;

  font-size:12px;

  font-weight:700;

  color:#334155;

  margin-bottom:7px;
}

input,
select{
  width:100%;

  padding:12px 13px;

  border:
    1px solid #cbd5e1;

  border-radius:9px;

  outline:none;

  background:#fff;

  color:#0f172a;
}

input:focus,
select:focus{
  border-color:#2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.1);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:45px;
}

.toggle{
  position:absolute;

  right:10px;
  top:50%;

  transform:
    translateY(-50%);

  border:0;

  background:none;

  color:#64748b;

  cursor:pointer;

  font-size:17px;
}

.password-hint{
  color:#94a3b8;

  font-size:11px;

  margin-top:5px;
}

.terms{
  display:flex;

  align-items:flex-start;

  gap:8px;

  color:#64748b;

  font-size:11px;

  margin:
    4px 0 20px;
}

.terms input{
  width:auto;

  margin-top:2px;
}

.terms a{
  color:#2563eb;

  font-weight:700;

  text-decoration:none;
}

.register-btn{
  width:100%;

  border:0;

  border-radius:9px;

  padding:13px;

  background:#2563eb;

  color:#fff;

  font-size:14px;

  font-weight:800;

  cursor:pointer;
}

.register-btn:hover{
  background:#1d4ed8;
}

.register-btn:disabled{
  opacity:.7;

  cursor:not-allowed;
}

.divider{
  display:flex;

  align-items:center;

  gap:10px;

  margin:22px 0;

  color:#94a3b8;

  font-size:11px;
}

.divider::before,
.divider::after{
  content:"";

  flex:1;

  height:1px;

  background:#e2e8f0;
}

.login{
  text-align:center;

  color:#64748b;

  font-size:13px;
}

.login a{
  color:#2563eb;

  font-weight:800;

  text-decoration:none;
}

.login a:hover{
  text-decoration:underline;
}

footer{
  text-align:center;

  padding:18px;

  color:#94a3b8;

  font-size:11px;
}

@media(max-width:500px){

  .register-card{
    padding:23px;
  }

  h1{
    font-size:24px;
  }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

<div class="nav-container">

<a
  href="/"
  class="logo">

  <div class="logo-icon">
    LS
  </div>

  LetsStudy Pro

</a>

<a
  href="/"
  class="home-link">

  ← Home

</a>

</div>

</header>



<!-- =========================
     REGISTER
========================= -->

<main class="main">

<div class="register-card">


<div class="register-icon">
  🎓
</div>


<h1>
  Create Account
</h1>


<p class="subtitle">
  Join LetsStudy Pro and start learning
</p>


<div
  id="message"
  class="message">
</div>


<form id="registerForm">


<!-- NAME -->

<div class="form-group">

<label for="name">
  Full Name
</label>

<input
  type="text"
  id="name"
  placeholder="Enter your full name"
  autocomplete="name"
  required>

</div>


<!-- EMAIL -->

<div class="form-group">

<label for="email">
  Email Address
</label>

<input
  type="email"
  id="email"
  placeholder="you@example.com"
  autocomplete="email"
  required>

</div>


<!-- PHONE -->

<div class="form-group">

<label for="phone">
  Phone Number
</label>

<input
  type="tel"
  id="phone"
  placeholder="+255..."
  autocomplete="tel">

</div>


<!-- LEVEL -->

<div class="form-group">

<label for="level">
  Form / Level
</label>

<select id="level">

<option value="">
  Select your level
</option>

<option value="Form 1">
  Form 1
</option>

<option value="Form 2">
  Form 2
</option>

<option value="Form 3">
  Form 3
</option>

<option value="Form 4">
  Form 4
</option>

<option value="Form 5">
  Form 5
</option>

<option value="Form 6">
  Form 6
</option>

</select>

</div>


<!-- SCHOOL -->

<div class="form-group">

<label for="school">
  School
</label>

<input
  type="text"
  id="school"
  placeholder="Enter your school">

</div>


<!-- PASSWORD -->

<div class="form-group">

<label for="password">
  Password
</label>

<div class="password-wrap">

<input
  type="password"
  id="password"
  placeholder="Create a password"
  autocomplete="new-password"
  minlength="6"
  required>

<button
  type="button"
  class="toggle"
  id="togglePassword">

  👁

</button>

</div>

<p class="password-hint">
  Password must contain at least 6 characters.
</p>

</div>


<!-- CONFIRM PASSWORD -->

<div class="form-group">

<label for="confirmPassword">
  Confirm Password
</label>

<div class="password-wrap">

<input
  type="password"
  id="confirmPassword"
  placeholder="Repeat your password"
  autocomplete="new-password"
  required>

<button
  type="button"
  class="toggle"
  id="toggleConfirm">

  👁

</button>

</div>

</div>


<!-- TERMS -->

<label class="terms">

<input
  type="checkbox"
  id="terms"
  required>

<span>

I agree to the
<a href="/terms.html">
Terms & Conditions
</a>
and
<a href="/privacy.html">
Privacy Policy
</a>.

</span>

</label>


<!-- BUTTON -->

<button
  type="submit"
  class="register-btn"
  id="registerBtn">

  Create Account

</button>


</form>


<div class="divider">
  OR
</div>


<div class="login">

Already have an account?

<a href="/login.html">
  Login
</a>

</div>


</div>

</main>



<footer>

© 2026 LetsStudy Pro.
All rights reserved.

</footer>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  set
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


/* =========================
   INITIALIZE
========================= */

const app =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(app);

const db =
  getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "registerForm"
  );

const message =
  document.getElementById(
    "message"
  );

const registerBtn =
  document.getElementById(
    "registerBtn"
  );

const password =
  document.getElementById(
    "password"
  );

const confirmPassword =
  document.getElementById(
    "confirmPassword"
  );


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type="error"
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* =========================
   PASSWORD TOGGLE
========================= */

document
  .getElementById(
    "togglePassword"
  )
  .addEventListener(
    "click",
    () => {

      if(
        password.type ===
        "password"
      ){

        password.type =
          "text";

        document.getElementById(
          "togglePassword"
        ).textContent =
          "🙈";

      }else{

        password.type =
          "password";

        document.getElementById(
          "togglePassword"
        ).textContent =
          "👁";

      }

    }
  );


document
  .getElementById(
    "toggleConfirm"
  )
  .addEventListener(
    "click",
    () => {

      if(
        confirmPassword.type ===
        "password"
      ){

        confirmPassword.type =
          "text";

        document.getElementById(
          "toggleConfirm"
        ).textContent =
          "🙈";

      }else{

        confirmPassword.type =
          "password";

        document.getElementById(
          "toggleConfirm"
        ).textContent =
          "👁";

      }

    }
  );


/* =========================
   REGISTER
========================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const name =
      document.getElementById(
        "name"
      ).value.trim();


    const email =
      document.getElementById(
        "email"
      ).value.trim();


    const phone =
      document.getElementById(
        "phone"
      ).value.trim();


    const level =
      document.getElementById(
        "level"
      ).value;


    const school =
      document.getElementById(
        "school"
      ).value.trim();


    const passwordValue =
      password.value;


    const confirmValue =
      confirmPassword.value;


    const terms =
      document.getElementById(
        "terms"
      ).checked;


    /* =========================
       VALIDATION
    ========================= */

    if(!name){

      showMessage(
        "Please enter your full name."
      );

      return;

    }


    if(!email){

      showMessage(
        "Please enter your email address."
      );

      return;

    }


    if(passwordValue.length < 6){

      showMessage(
        "Password must contain at least 6 characters."
      );

      return;

    }


    if(
      passwordValue !==
      confirmValue
    ){

      showMessage(
        "Passwords do not match."
      );

      return;

    }


    if(!terms){

      showMessage(
        "Please accept the Terms & Conditions."
      );

      return;

    }


    try{

      registerBtn.disabled =
        true;

      registerBtn.textContent =
        "Creating Account...";


      /* =========================
         CREATE AUTH USER
      ========================= */

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          passwordValue
        );


      const user =
        credential.user;


      /* =========================
         UPDATE AUTH PROFILE
      ========================= */

      await updateProfile(
        user,
        {
          displayName:
            name
        }
      );


      /* =========================
         SAVE DATABASE PROFILE
      ========================= */

      await set(
        ref(
          db,
          "users/" +
          user.uid
        ),
        {

          uid:
            user.uid,

          name:
            name,

          displayName:
            name,

          email:
            email,

          phone:
            phone,

          level:
            level,

          school:
            school,

          role:
            "student",

          status:
            "active",

          createdAt:
            Date.now(),

          updatedAt:
            Date.now()

        }
      );


      /* =========================
         SUCCESS
      ========================= */

      showMessage(
        "Account created successfully. Redirecting...",
        "success"
      );


      setTimeout(
        () => {

          window.location.href =
            "/profile.html";

        },
        800
      );


    }catch(error){

      console.error(
        "Registration error:",
        error
      );


      let errorMessage =
        "Unable to create account. Please try again.";


      switch(error.code){

        case "auth/email-already-in-use":

          errorMessage =
            "An account with this email already exists.";

          break;


        case "auth/invalid-email":

          errorMessage =
            "Please enter a valid email address.";

          break;


        case "auth/weak-password":

          errorMessage =
            "Password is too weak. Use at least 6 characters.";

          break;


        case "auth/network-request-failed":

          errorMessage =
            "Network error. Check your internet connection.";

          break;


        case "auth/operation-not-allowed":

          errorMessage =
            "Email/password authentication is not enabled in Firebase.";

          break;

      }


      showMessage(
        errorMessage
      );


    }finally{

      registerBtn.disabled =
        false;

      registerBtn.textContent =
        "Create Account";

    }

  }
);

</script>

</body>

</html>
