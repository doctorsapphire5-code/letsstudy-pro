<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Reset Admin Password | Let'sStudy Pro</title>

  <meta
    name="description"
    content="Create a new password for your Let'sStudy Pro administrator account."
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;

      color: #172033;
    }


    .container {

      width: 100%;

      max-width: 430px;
    }


    .brand {

      text-align: center;

      margin-bottom: 22px;
    }


    .icon {

      width: 64px;
      height: 64px;

      margin: 0 auto;

      border-radius: 18px;

      background: #2563eb;

      color: #fff;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 29px;
    }


    .brand h1 {

      margin:
        12px 0 5px;

      font-size: 24px;
    }


    .brand p {

      margin: 0;

      color: #687386;

      font-size: 14px;
    }


    .card {

      background: #fff;

      border:
        1px solid #e2e7ef;

      border-radius: 20px;

      padding: 28px;

      box-shadow:
        0 20px 50px
        rgba(15, 23, 42, .10);
    }


    h2 {

      margin:
        0 0 8px;

      font-size: 21px;
    }


    .description {

      margin:
        0 0 22px;

      color: #687386;

      font-size: 14px;

      line-height: 1.5;
    }


    .field {

      margin-bottom: 17px;
    }


    label {

      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: 650;
    }


    .password-wrap {

      position: relative;
    }


    input {

      width: 100%;

      min-height: 49px;

      padding:
        12px 14px;

      border:
        1px solid #e2e7ef;

      border-radius: 11px;

      background: #fff;

      color: #172033;

      font-size: 16px;

      outline: none;
    }


    .password-wrap input {

      padding-right: 70px;
    }


    input:focus {

      border-color:
        #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, .13);
    }


    .toggle {

      position: absolute;

      top: 50%;
      right: 8px;

      transform:
        translateY(-50%);

      min-height: 36px;

      width: auto;

      margin: 0;

      padding:
        6px 9px;

      border: 0;

      background: transparent;

      color: #2563eb;

      font-weight: 650;

      cursor: pointer;
    }


    .toggle:hover {

      background: transparent;

      color: #1d4ed8;
    }


    .strength {

      margin-top: 7px;

      font-size: 12px;

      color: #687386;
    }


    .message {

      display: none;

      margin-bottom: 18px;

      padding:
        12px 13px;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.45;
    }


    .message.error {

      display: block;

      background: #fef2f2;

      color: #dc2626;

      border:
        1px solid #fecaca;
    }


    .message.success {

      display: block;

      background: #f0fdf4;

      color: #15803d;

      border:
        1px solid #bbf7d0;
    }


    .message.info {

      display: block;

      background: #eff6ff;

      color: #1d4ed8;

      border:
        1px solid #bfdbfe;
    }


    .primary-button,
    .secondary-button {

      width: 100%;

      min-height: 50px;

      margin-top: 4px;

      border: 0;

      border-radius: 11px;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;
    }


    .primary-button {

      background: #2563eb;

      color: #fff;
    }


    .primary-button:hover {

      background: #1d4ed8;
    }


    .secondary-button {

      margin-top: 10px;

      background: #111827;

      color: #fff;
    }


    .secondary-button:hover {

      background: #1f2937;
    }


    button:disabled {

      opacity: .65;

      cursor: not-allowed;
    }


    .back {

      display: block;

      margin-top: 18px;

      text-align: center;

      color: #2563eb;

      text-decoration: none;

      font-size: 14px;

      font-weight: 600;
    }


    .security {

      margin-top: 20px;

      padding: 12px;

      border-radius: 10px;

      background: #f8fafc;

      color: #687386;

      text-align: center;

      font-size: 12px;

      line-height: 1.5;
    }


    footer {

      margin-top: 18px;

      text-align: center;

      color: #687386;

      font-size: 12px;
    }


    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .card {
        padding: 22px 18px;
        border-radius: 17px;
      }

    }

  </style>

</head>


<body>


<main class="container">


  <header class="brand">

    <div
      class="icon"
      aria-hidden="true"
    >
      🔐
    </div>


    <h1>
      Let'sStudy Pro
    </h1>


    <p>
      Administrator Portal
    </p>

  </header>


  <section
    class="card"
    aria-labelledby="title"
  >


    <h2 id="title">
      Create New Password
    </h2>


    <p class="description">
      Enter a new secure password for your administrator account.
    </p>


    <div
      id="message"
      class="message"
      role="alert"
      aria-live="polite"
    ></div>


    <form id="resetForm">


      <div class="field">


        <label for="password">
          New Password
        </label>


        <div class="password-wrap">


          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="Minimum 8 characters"
            required
          >


          <button
            type="button"
            class="toggle"
            id="togglePassword"
            aria-label="Show password"
          >
            Show
          </button>


        </div>


        <div
          id="strength"
          class="strength"
          aria-live="polite"
        >
          Use at least 8 characters.
        </div>


      </div>


      <div class="field">


        <label for="confirmPassword">
          Confirm New Password
        </label>


        <div class="password-wrap">


          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="Repeat your new password"
            required
          >


          <button
            type="button"
            class="toggle"
            id="toggleConfirm"
            aria-label="Show password"
          >
            Show
          </button>


        </div>


      </div>


      <button
        id="resetBtn"
        class="primary-button"
        type="submit"
      >
        Update Password
      </button>


    </form>


    <!-- MANUAL LOGIN BUTTON -->

    <button
      id="loginButton"
      class="secondary-button"
      type="button"
      style="display:none;"
    >
      Go to Admin Login
    </button>


    <a
      href="login-admin.html"
      class="back"
    >
      ← Back to Admin Login
    </a>


    <div class="security">

      🔒 Your password is securely handled
      by Firebase Authentication.

    </div>


  </section>


  <footer>

    ©
    <span id="year"></span>
    Let'sStudy Pro

  </footer>


</main>



<script type="module">


  /* =========================================
     FIREBASE
  ========================================== */

  import {
    initializeApp
  }
  from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    verifyPasswordResetCode,
    confirmPasswordReset
  }
  from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
  };


  /* =========================================
     INITIALIZE
  ========================================== */

  const app =
    initializeApp(
      firebaseConfig
    );


  const auth =
    getAuth(app);


  /* =========================================
     DOM
  ========================================== */

  const form =
    document.getElementById(
      "resetForm"
    );


  const password =
    document.getElementById(
      "password"
    );


  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    );


  const resetBtn =
    document.getElementById(
      "resetBtn"
    );


  const loginButton =
    document.getElementById(
      "loginButton"
    );


  const message =
    document.getElementById(
      "message"
    );


  const strength =
    document.getElementById(
      "strength"
    );


  document
    .getElementById("year")
    .textContent =
    new Date().getFullYear();


  /* =========================================
     URL PARAMETERS
  ========================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const mode =
    params.get("mode");


  const actionCode =
    params.get("oobCode");


  /* =========================================
     STATE
  ========================================== */

  let resetCodeValid =
    false;


  let passwordResetCompleted =
    false;


  /* =========================================
     MESSAGE
  ========================================== */

  function showMessage(
    text,
    type = "info"
  ) {

    message.textContent =
      text;

    message.className =
      `message ${type}`;
  }


  function clearMessage() {

    message.textContent =
      "";

    message.className =
      "message";
  }


  /* =========================================
     VERIFY RESET LINK
  ========================================== */

  async function verifyResetLink() {


    if (
      mode !== "resetPassword" ||
      !actionCode
    ) {


      showMessage(
        "This password reset link is invalid or incomplete.",
        "error"
      );


      resetBtn.disabled =
        true;


      return;
    }


    try {


      await verifyPasswordResetCode(
        auth,
        actionCode
      );


      resetCodeValid =
        true;


      showMessage(
        "Reset link verified. You can now create a new password.",
        "info"
      );


    } catch (error) {


      console.error(
        "Reset code verification error:",
        error
      );


      resetCodeValid =
        false;


      resetBtn.disabled =
        true;


      if (
        error.code ===
        "auth/expired-action-code"
      ) {


        showMessage(
          "This password reset link has expired. Please request a new reset link.",
          "error"
        );


      } else if (
        error.code ===
        "auth/invalid-action-code"
      ) {


        showMessage(
          "This password reset link is invalid or has already been used.",
          "error"
        );


      } else {


        showMessage(
          "Unable to verify this password reset link.",
          "error"
        );

      }

    }

  }


  verifyResetLink();


  /* =========================================
     SHOW / HIDE PASSWORD
  ========================================== */

  document
    .getElementById(
      "togglePassword"
    )
    .addEventListener(
      "click",
      () => {


        const visible =
          password.type === "text";


        password.type =
          visible
            ? "password"
            : "text";


        document
          .getElementById(
            "togglePassword"
          )
          .textContent =
          visible
            ? "Show"
            : "Hide";


        document
          .getElementById(
            "togglePassword"
          )
          .setAttribute(
            "aria-label",
            visible
              ? "Show password"
              : "Hide password"
          );

      }
    );


  document
    .getElementById(
      "toggleConfirm"
    )
    .addEventListener(
      "click",
      () => {


        const visible =
          confirmPassword.type === "text";


        confirmPassword.type =
          visible
            ? "password"
            : "text";


        document
          .getElementById(
            "toggleConfirm"
          )
          .textContent =
          visible
            ? "Show"
            : "Hide";


        document
          .getElementById(
            "toggleConfirm"
          )
          .setAttribute(
            "aria-label",
            visible
              ? "Show password"
              : "Hide password"
          );

      }
    );


  /* =========================================
     PASSWORD STRENGTH
  ========================================== */

  password.addEventListener(
    "input",
    () => {


      const value =
        password.value;


      if (!value) {

        strength.textContent =
          "Use at least 8 characters.";

        return;
      }


      if (value.length < 8) {

        strength.textContent =
          "Password is too short.";

        return;
      }


      let score = 0;


      if (value.length >= 8)
        score++;


      if (/[A-Z]/.test(value))
        score++;


      if (/[a-z]/.test(value))
        score++;


      if (/[0-9]/.test(value))
        score++;


      if (/[^A-Za-z0-9]/.test(value))
        score++;


      if (score <= 2) {

        strength.textContent =
          "Password is acceptable, but could be stronger.";

      } else if (score <= 4) {

        strength.textContent =
          "Good password strength.";

      } else {

        strength.textContent =
          "Strong password.";

      }

    }
  );


  /* =========================================
     PASSWORD RESET
  ========================================== */

  form.addEventListener(
    "submit",
    async event => {


      event.preventDefault();


      clearMessage();


      if (!resetCodeValid) {

        showMessage(
          "This password reset link is not valid.",
          "error"
        );

        return;
      }


      if (passwordResetCompleted) {

        showMessage(
          "This password has already been updated.",
          "success"
        );

        return;
      }


      const newPassword =
        password.value;


      const confirm =
        confirmPassword.value;


      /* ---------------------------------------
         MINIMUM LENGTH
      --------------------------------------- */

      if (
        newPassword.length < 8
      ) {


        showMessage(
          "Password must contain at least 8 characters.",
          "error"
        );


        password.focus();

        return;
      }


      /* ---------------------------------------
         PASSWORD MATCH
      --------------------------------------- */

      if (
        newPassword !== confirm
      ) {


        showMessage(
          "Passwords do not match.",
          "error"
        );


        confirmPassword.focus();

        return;
      }


      /* ---------------------------------------
         UPDATE
      --------------------------------------- */

      resetBtn.disabled =
        true;


      resetBtn.textContent =
        "Updating...";


      try {


        await confirmPasswordReset(
          auth,
          actionCode,
          newPassword
        );


        passwordResetCompleted =
          true;


        resetCodeValid =
          false;


        form.reset();


        resetBtn.style.display =
          "none";


        showMessage(
          "Your administrator password has been updated successfully. You can now sign in with your new password.",
          "success"
        );


        /*
         * IMPORTANT:
         *
         * NO AUTOMATIC REDIRECT.
         *
         * User must manually click
         * "Go to Admin Login".
         */


        loginButton.style.display =
          "block";


      } catch (error) {


        console.error(
          "Password reset error:",
          error
        );


        let text =
          "Unable to reset the password.";


        switch (error.code) {


          case "auth/expired-action-code":

            text =
              "This reset link has expired. Please request a new password reset.";

            break;


          case "auth/invalid-action-code":

            text =
              "This reset link is invalid or has already been used.";

            break;


          case "auth/weak-password":

            text =
              "The new password is too weak. Please choose a stronger password.";

            break;


          case "auth/network-request-failed":

            text =
              "Network error. Check your internet connection and try again.";

            break;

        }


        showMessage(
          text,
          "error"
        );


        resetBtn.disabled =
          false;


        resetBtn.textContent =
          "Update Password";

      }

    }
  );


  /* =========================================
     MANUAL LOGIN NAVIGATION
  ========================================== */

  loginButton.addEventListener(
    "click",
    () => {


      loginButton.disabled =
        true;


      loginButton.textContent =
        "Opening Admin Login...";


      /*
       * Navigation occurs ONLY
       * because the administrator
       * clicked this button.
       */

      window.location.href =
        "login-admin.html";

    }
  );


</script>

</body>

</html>
