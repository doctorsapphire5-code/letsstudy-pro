<body>

<div class="card">
  <div class="logo">🔐</div>

  <h1>Forgot Password?</h1>

  <p class="subtitle">
    Enter the email address associated with your Vorix Resources
    Admin account. We will send you a password reset link.
  </p>

  <div id="message" class="message"></div>

  <form id="forgotForm">
    <label for="email">Admin Email Address</label>

    <input type="email" id="email" placeholder="Enter your admin email" autocomplete="email" required="">

    <button type="submit" id="submitBtn">
      Send Reset Link
    </button>
  </form>

  <div class="links">
    <a href="resources-admin-login.html">← Back to Login</a>
    <a href="resources-admin-register.html">Register Admin</a>
  </div>

  <div class="security">
    🔒 Secure password recovery powered by Firebase Authentication.
    <br>
    © <span id="year"></span> Vorix Resources
  </div>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuP13ggQsiZiZgoIf9nFK8hmw8Bx6KYr0",
  authDomain: "vorix-resources.firebaseapp.com",
  projectId: "vorix-resources",
  storageBucket: "vorix-resources.firebasestorage.app",
  messagingSenderId: "789688947048",
  appId: "1:789688947048:web:31598720b1e0cef9db06dd",
  measurementId: "G-VEYGNMJ6N1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("forgotForm");
const emailInput = document.getElementById("email");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

document.getElementById("year").textContent =
  new Date().getFullYear();

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim().toLowerCase();

  if (!email) {
    showMessage("Please enter your email address.", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Sending...";

  try {
    await sendPasswordResetEmail(auth, email, {
      url: window.location.origin + "/resources-admin-login.html",
      handleCodeInApp: false
    });

    showMessage(
      "If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder.",
      "success"
    );

    form.reset();

  } catch (error) {
    console.error("Password reset error:", error);

    if (
      error.code === "auth/invalid-email"
    ) {
      showMessage("Please enter a valid email address.", "error");
    } else if (
      error.code === "auth/too-many-requests"
    ) {
      showMessage(
        "Too many attempts. Please wait before trying again.",
        "error"
      );
    } else if (
      error.code === "auth/network-request-failed"
    ) {
      showMessage(
        "Network error. Check your internet connection.",
        "error"
      );
    } else {
      showMessage(
        "Unable to process your request. Please try again later.",
        "error"
      );
    }

  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Send Reset Link";
  }
});
</script>
