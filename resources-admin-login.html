<body>

<div class="login-card">

<div class="logo">

<div class="logo-icon">V</div>

<h1>Resources Admin</h1>

<p class="subtitle">
Secure administrator access
</p>

</div>

<form id="loginForm">

<label for="adminId">Admin ID</label>

<input id="adminId" type="text" placeholder="Enter your Admin ID" required="" autocomplete="username">

<label for="email">Email Address</label>

<input id="email" type="email" placeholder="Enter admin email" required="" autocomplete="email">

<label for="password">Password</label>

<div class="password-box">

<input id="password" type="password" placeholder="Enter password" required="" autocomplete="current-password">

<button type="button" class="toggle" id="togglePassword">
Show
</button>

</div>

<button type="submit" class="login" id="loginButton">
Sign In
</button>

<div id="message" class="message" role="alert" aria-live="polite"></div>

</form>

<div class="links">

<a href="resources-admin-forgot-password.html">
Forgot Password?
</a>

<br>

<a href="resources-admin-register.html">
Create Admin Account
</a>

<br>

<a href="resources-login.html">
User Login
</a>

</div>

<div class="security">
Protected administrator authentication powered by Firebase.
Only authorized and active administrators can access this dashboard.
</div>

<div class="footer">
Protected Admin Authentication
<br>
© <span id="year"></span> Vorix Resources
</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
updateDoc,
increment,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// FIREBASE CONFIGURATION
const firebaseConfig = {
apiKey: "AIzaSyBuP13ggQsiZiZgoIf9nFK8hmw8Bx6KYr0",
authDomain: "vorix-resources.firebaseapp.com",
projectId: "vorix-resources",
storageBucket: "vorix-resources.firebasestorage.app",
messagingSenderId: "789688947048",
appId: "1:789688947048:web:31598720b1e0cef9db06dd",
measurementId: "G-VEYGNMJ6N1"
};

// INITIALIZE FIREBASE
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

document.getElementById("year").textContent =
new Date().getFullYear();

// DISPLAY MESSAGE
function showMessage(text,type="error"){

message.textContent=text;
message.className="message "+type;

}

// PASSWORD VISIBILITY
document.getElementById("togglePassword")
.addEventListener("click",()=>{

const input=document.getElementById("password");
const visible=input.type==="password";

input.type=visible?"text":"password";

document.getElementById("togglePassword").textContent=
visible?"Hide":"Show";

});

// CLEAR SESSION
function clearSession(){

[
"resourcesAdminAuthenticated",
"resourcesAdminId",
"resourcesAdminUid",
"resourcesAdminName",
"resourcesAdminRole"
].forEach(key=>sessionStorage.removeItem(key));

}

// LOGIN
form.addEventListener("submit",async(event)=>{

event.preventDefault();

if(loginButton.disabled)return;

const adminId=document.getElementById("adminId")
.value.trim();

const email=document.getElementById("email")
.value.trim().toLowerCase();

const password=document.getElementById("password").value;

if(!adminId || !email || !password){

showMessage("Please complete all fields.");
return;

}

loginButton.disabled=true;
loginButton.textContent="Verifying...";

message.className="message";

let user=null;

try{

// 1. FIREBASE AUTHENTICATION
const credential=await signInWithEmailAndPassword(
auth,
email,
password
);

user=credential.user;

// 2. VERIFY EMAIL
if(!user.emailVerified){

await signOut(auth);
user=null;

showMessage(
"Please verify your email before accessing the administrator dashboard."
);

return;

}

// 3. GET ADMIN DOCUMENT
const adminRef=doc(db,"admins",adminId);

const adminSnapshot=await getDoc(adminRef);

if(!adminSnapshot.exists()){

throw new Error("INVALID_ADMIN_ID");

}

const admin=adminSnapshot.data();

// 4. VERIFY ADMIN ID
if(
admin.adminId!==adminId ||
adminSnapshot.id!==adminId
){

throw new Error("ADMIN_ID_MISMATCH");

}

// 5. VERIFY EMAIL AND UID
if(
String(admin.email || "").toLowerCase()!==user.email.toLowerCase() ||
admin.uid!==user.uid
){

throw new Error("ADMIN_CREDENTIAL_MISMATCH");

}

// 6. VERIFY ROLE
if(
String(admin.role || "").toLowerCase()!=="admin"
){

throw new Error("NOT_ADMIN");

}

// 7. VERIFY STATUS
if(
String(admin.status || "").toLowerCase()!=="active"
){

throw new Error("ADMIN_INACTIVE");

}

// 8. UPDATE LOGIN INFORMATION
await updateDoc(adminRef,{

lastLoginAt:serverTimestamp(),

loginCount:increment(1),

updatedAt:serverTimestamp()

});

// 9. SAVE SESSION DETAILS
sessionStorage.setItem(
"resourcesAdminAuthenticated",
"true"
);

sessionStorage.setItem(
"resourcesAdminId",
admin.adminId
);

sessionStorage.setItem(
"resourcesAdminUid",
user.uid
);

sessionStorage.setItem(
"resourcesAdminName",
admin.fullName || admin.displayName || ""
);

sessionStorage.setItem(
"resourcesAdminRole",
admin.role
);

// 10. SUCCESS
showMessage(
"Login successful. Redirecting to your dashboard...",
"success"
);

window.location.replace(
"resources-admin-dashboard.html"
);

}catch(error){

console.error("Admin login error:",error);

// SIGN OUT UNAUTHORIZED ACCOUNT
if(auth.currentUser){

try{
await signOut(auth);
}catch(signOutError){
console.error(signOutError);
}

}

clearSession();

const errors={

INVALID_ADMIN_ID:
"Invalid Admin ID. Please check your Admin ID.",

ADMIN_ID_MISMATCH:
"Administrator ID does not match the registered document.",

ADMIN_CREDENTIAL_MISMATCH:
"Admin credentials do not match the registered account.",

NOT_ADMIN:
"This account does not have administrator permissions.",

ADMIN_INACTIVE:
"Your administrator account is not active.",

"auth/invalid-credential":
"Incorrect email or password.",

"auth/user-not-found":
"Administrator account not found.",

"auth/wrong-password":
"Incorrect password.",

"auth/too-many-requests":
"Too many login attempts. Please try again later.",

"auth/network-request-failed":
"Network connection failed. Check your internet connection.",

"permission-denied":
"Access denied by Firestore Security Rules."

};

showMessage(
errors[error.message] ||
errors[error.code] ||
"Login failed. Please check your details and try again."
);

}finally{

loginButton.disabled=false;
loginButton.textContent="Sign In";

}

});

</script>



</body></html>
