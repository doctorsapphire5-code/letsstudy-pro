<body>
<div class="container">

<div class="header">
<div class="logo">V</div>
<h1>Resources Admin Registration</h1>
<p class="subtitle">Create your authorized administrator account</p>
</div>

<form id="registerForm">

<div class="section-title">Administrator Information</div>

<div class="grid">
<div class="field">
<label>Admin ID *</label>
<input id="adminId" required="" placeholder="Enter authorized Admin ID">
</div>

<div class="field">
<label>Username *</label>
<input id="username" required="" placeholder="Username">
</div>
</div>

<div class="grid">
<div class="field">
<label>First Name *</label>
<input id="firstName" required="" placeholder="First name">
</div>

<div class="field">
<label>Last Name *</label>
<input id="lastName" required="" placeholder="Last name">
</div>
</div>

<div class="field">
<label>Full Name *</label>
<input id="fullName" required="" placeholder="Full name">
</div>

<div class="section-title">Contact Information</div>

<div class="grid">
<div class="field">
<label>Email Address *</label>
<input id="email" type="email" required="" placeholder="admin@example.com">
</div>

<div class="field">
<label>Phone Number</label>
<input id="phoneNumber" type="tel" placeholder="+255...">
</div>
</div>

<div class="grid">
<div class="field">
<label>Country</label>
<input id="country" placeholder="Country">
</div>

<div class="field">
<label>Department</label>
<input id="department" placeholder="Resources Management">
</div>
</div>

<div class="section-title">Account Security</div>

<div class="grid">
<div class="field">
<label>Password *</label>
<div class="password">
<input id="password" type="password" minlength="8" required="" placeholder="Minimum 8 characters">
<button type="button" class="toggle" data-target="password">Show</button>
</div>
</div>

<div class="field">
<label>Confirm Password *</label>
<div class="password">
<input id="confirmPassword" type="password" required="" placeholder="Confirm password">
<button type="button" class="toggle" data-target="confirmPassword">Show</button>
</div>
</div>
</div>

<div class="section-title">Preferences</div>

<div class="grid">
<div class="field">
<label>Language</label>
<select id="language">
<option value="English">English</option>
<option value="Swahili">Swahili</option>
</select>
</div>

<div class="field">
<label>Timezone</label>
<select id="timezone">
<option value="Africa/Dar_es_Salaam">Africa/Dar_es_Salaam</option>
<option value="UTC">UTC</option>
<option value="Europe/London">Europe/London</option>
<option value="America/New_York">America/New_York</option>
</select>
</div>
</div>

<button type="submit" class="submit" id="submitButton">
Create Admin Account
</button>

<div id="message"></div>

</form>

<div class="footer">
Secure Administrator Registration<br>
© <span id="year"></span> Vorix Resources
</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
sendEmailVerification
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
updateDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// FIREBASE CONFIG
const firebaseConfig = {
apiKey: "AIzaSyBuP13ggQsiZiZgoIf9nFK8hmw8Bx6KYr0",
authDomain: "vorix-resources.firebaseapp.com",
projectId: "vorix-resources",
storageBucket: "vorix-resources.firebasestorage.app",
messagingSenderId: "789688947048",
appId: "1:789688947048:web:31598720b1e0cef9db06dd",
measurementId: "G-VEYGNMJ6N1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

document.getElementById("year").textContent = new Date().getFullYear();

function showMessage(text,type){
message.textContent = text;
message.className = type;
}

document.querySelectorAll(".toggle").forEach(button=>{
button.addEventListener("click",()=>{
const input = document.getElementById(button.dataset.target);
input.type = input.type === "password" ? "text" : "password";
button.textContent = input.type === "password" ? "Show" : "Hide";
});
});

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const data = {
adminId:document.getElementById("adminId").value.trim(),
username:document.getElementById("username").value.trim(),
firstName:document.getElementById("firstName").value.trim(),
lastName:document.getElementById("lastName").value.trim(),
fullName:document.getElementById("fullName").value.trim(),
email:document.getElementById("email").value.trim().toLowerCase(),
phoneNumber:document.getElementById("phoneNumber").value.trim(),
country:document.getElementById("country").value.trim(),
department:document.getElementById("department").value.trim(),
language:document.getElementById("language").value,
timezone:document.getElementById("timezone").value
};

const password = document.getElementById("password").value;
const confirmPassword = document.getElementById("confirmPassword").value;

if(password.length < 8){
showMessage("Password must contain at least 8 characters.","error");
return;
}

if(password !== confirmPassword){
showMessage("Passwords do not match.","error");
return;
}

submitButton.disabled = true;
submitButton.textContent = "Creating Account...";

try{

// 1. FIND PRE-AUTHORIZED ADMIN RECORD
const adminQuery = query(
collection(db,"admins"),
where("adminId","==",data.adminId)
);

const result = await getDocs(adminQuery);

if(result.empty){
throw new Error("INVALID_ADMIN_ID");
}

if(result.size !== 1){
throw new Error("ADMIN_CONFIGURATION_ERROR");
}

const adminDoc = result.docs[0];
const existing = adminDoc.data();

// 2. VERIFY PRE-REGISTERED EMAIL
if(existing.email?.toLowerCase() !== data.email){
throw new Error("EMAIL_MISMATCH");
}

// 3. ONLY UNUSED INVITATIONS CAN REGISTER
if(existing.uid || existing.status !== "invited"){
throw new Error("ADMIN_ALREADY_REGISTERED");
}

// 4. CREATE FIREBASE AUTH ACCOUNT
const credential = await createUserWithEmailAndPassword(
auth,data.email,password
);

const user = credential.user;

// 5. UPDATE EXISTING ADMIN DOCUMENT
await updateDoc(doc(db,"admins",adminDoc.id),{

adminId:data.adminId,
uid:user.uid,

username:data.username,
firstName:data.firstName,
lastName:data.lastName,
fullName:data.fullName,
displayName:data.fullName,

email:data.email,
phoneNumber:data.phoneNumber,
country:data.country,
department:data.department,

language:data.language,
timezone:data.timezone,

role:"admin",
adminType:existing.adminType || "admin",
accessLevel:existing.accessLevel || "admin",
permissions:existing.permissions || {},

status:"active",
emailVerified:false,
phoneVerified:false,
twoFactorEnabled:false,

loginCount:0,
createdAt:serverTimestamp(),
updatedAt:serverTimestamp(),
lastLoginAt:null,
lastLoginDevice:"",
lastLoginIP:"",
createdBy:existing.createdBy || "system"

});

// 6. SEND EMAIL VERIFICATION
await sendEmailVerification(user);

// 7. SUCCESS
showMessage(
"Registration successful! Please verify your email before logging in.",
"success"
);

form.reset();

setTimeout(()=>{
window.location.href="resources-admin-login.html";
},3500);

}catch(error){

console.error(error);

const errors = {
"INVALID_ADMIN_ID":"Invalid Admin ID. Contact your administrator.",
"EMAIL_MISMATCH":"This email is not authorized for this Admin ID.",
"ADMIN_ALREADY_REGISTERED":"This Admin ID has already been registered or is not available.",
"ADMIN_CONFIGURATION_ERROR":"Admin configuration error. Contact support.",
"auth/email-already-in-use":"This email already has an account.",
"auth/weak-password":"Please choose a stronger password.",
"auth/invalid-email":"Invalid email address.",
"permission-denied":"Registration permission denied. Check Firestore Security Rules."
};

showMessage(
errors[error.message] || errors[error.code] ||
"Registration failed. Please try again.",
"error"
);

}finally{

submitButton.disabled = false;
submitButton.textContent = "Create Admin Account";

}

});

</script>

</body></html>
