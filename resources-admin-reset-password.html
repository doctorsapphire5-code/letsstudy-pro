<body>

<div class="card">

  <div class="logo">🔐</div>

  <h1>Reset Your Password</h1>

  <p class="subtitle">
    Create a new secure password for your Vorix Resources
    Admin account.
  </p>

  <div id="message" class="message"></div>

  <form id="resetForm">

    <div class="field">
      <label for="email">Admin Email</label>
      <input type="email" id="email" autocomplete="email" readonly="" required="">
    </div>

    <div class="field">
      <label for="password">New Password</label>
      <input type="password" id="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Enter new password" required="">
      <p class="hint">Use at least 8 characters.</p>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Confirm your new password" required="">
    </div>

    <button type="submit" id="submitBtn">
      Reset Password
    </button>

  </form>

  <div class="links">
    <a href="resources-admin-login.html">← Back to Admin Login</a>
  </div>

  <div class="security">
    🔒 Secure password recovery powered by Firebase Authentication.
    <br>
    © <span id="year"></span> Vorix Resources
  </div>

</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  verifyPasswordResetCode,
  confirmPasswordReset
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuP13ggQsiZiZgoIf9nFK8hmw8Bx6KYr0",
  authDomain: "vorix-resources.firebaseapp.com",
  projectId: "vorix-resources",
  storageBucket: "vorix-resources.firebasestorage.app",
  messagingSenderId: "789688947048",
  appId: "1:789688947048:web:31598720b1e0cef9db06dd",
  measurementId: "G-VEYGNMJ6N1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("resetForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

document.getElementById("year").textContent =
  new Date().getFullYear();

const params = new URLSearchParams(window.location.search);
const actionCode = params.get("oobCode");
const mode = params.get("mode");

let verifiedCode = null;

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

function disableForm(text) {
  form.style.display = "none";
  showMessage(text, "error");
}

async function initializeReset() {
  if (mode !== "resetPassword" || !actionCode) {
    disableForm(
      "Invalid password reset link. Please request a new reset email."
    );
    return;
  }

  try {
    const email = await verifyPasswordResetCode(auth, actionCode);

    verifiedCode = actionCode;
    emailInput.value = email;

  } catch (error) {
    console.error(error);

    disableForm(
      "This password reset link is invalid, expired, or has already been used. Please request a new reset link."
    );
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!verifiedCode) {
    showMessage("Your reset link is not valid.", "error");
    return;
  }

  const password = passwordInput.value;
  const confirmPassword = confirmInput.value;

  if (password.length < 8) {
    showMessage(
      "Your password must contain at least 8 characters.",
      "error"
    );
    return;
  }

  if (password !== confirmPassword) {
    showMessage("Passwords do not match.", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Updating Password...";

  try {
    await confirmPasswordReset(auth, verifiedCode, password);

    verifiedCode = null;
    form.reset();
    form.style.display = "none";

    showMessage(
      "Your password has been reset successfully. You can now log in using your new password.",
      "success"
    );

    const link = document.createElement("a");
    link.href = "resources-admin-login.html";
    link.textContent = "Continue to Admin Login";
    link.style.display = "block";
    link.style.textAlign = "center";
    link.style.marginTop = "18px";

    document.querySelector(".links").replaceChildren(link);

  } catch (error) {
    console.error(error);

    if (error.code === "auth/weak-password") {
      showMessage(
        "This password is too weak. Please choose a stronger password.",
        "error"
      );
    } else if (
      error.code === "auth/expired-action-code" ||
      error.code === "auth/invalid-action-code"
    ) {
      showMessage(
        "Your reset link has expired or is invalid. Request a new link.",
        "error"
      );
    } else {
      showMessage(
        "Unable to reset password. Please try again.",
        "error"
      );
    }

  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Reset Password";
  }
});

initializeReset();
</script>
