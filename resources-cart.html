<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Resource Cart | LetsStudy Pro</title>
  <meta name="description" content="Review your selected LetsStudy Pro resources before checkout.">

  <link rel="icon" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f8fc;
      color: #172033;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 5%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #2563eb;
      text-decoration: none;
      font-size: 21px;
      font-weight: 900;
    }

    .back {
      color: #475569;
      text-decoration: none;
      font-weight: 700;
    }

    main {
      max-width: 1150px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 25px;
      align-items: start;
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .resource {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      display: flex;
      gap: 18px;
      box-shadow: 0 7px 25px rgba(0,0,0,.06);
    }

    .thumb {
      width: 145px;
      height: 105px;
      border-radius: 12px;
      overflow: hidden;
      background: #eef2f7;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      flex: 1;
    }

    .badge {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .description {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .price {
      font-weight: 900;
      font-size: 18px;
    }

    .remove {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .summary {
      background: #fff;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 7px 25px rgba(0,0,0,.06);
      position: sticky;
      top: 95px;
    }

    .summary h2 {
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      color: #64748b;
    }

    .total {
      border-top: 1px solid #e5e7eb;
      margin-top: 8px;
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 21px;
      font-weight: 900;
    }

    .checkout {
      display: block;
      text-align: center;
      margin-top: 22px;
      background: #2563eb;
      color: #fff;
      padding: 15px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
    }

    .clear {
      width: 100%;
      margin-top: 10px;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #dc2626;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .empty {
      background: #fff;
      border-radius: 18px;
      padding: 60px 25px;
      text-align: center;
      box-shadow: 0 7px 25px rgba(0,0,0,.05);
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty h2 {
      margin-bottom: 10px;
    }

    .empty p {
      color: #64748b;
      margin-bottom: 22px;
    }

    .browse {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      padding: 13px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 800;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: #64748b;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }
    }

    @media (max-width: 560px) {
      .resource {
        flex-direction: column;
      }

      .thumb {
        width: 100%;
        height: 180px;
      }

      h1 {
        font-size: 28px;
      }

      .bottom {
        align-items: flex-start;
        flex-direction: column;
      }

      .remove {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo">
      LetsStudy Pro
    </a>

    <a href="resources.html" class="back">
      Browse Resources
    </a>
  </div>
</header>

<main>

  <h1>Resource Cart</h1>
  <p class="subtitle">
    Review your selected plan resources before checkout.
  </p>

  <div id="loading" class="loading">
    Loading your resources...
  </div>

  <div id="content"></div>

</main>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


  /* =========================
     FIREBASE
  ========================= */

  const firebaseConfig = {
    apiKey: "AIzaSyBcOYDfAVK5XbkljsyRgI_0rj0odBn678tCc",
    authDomain: "let-s-study-pro-course.firebaseapp.com",
    databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId: "let-s-study-pro-course",
    storageBucket: "let-s-study-pro-course.firebasestorage.app",
    messagingSenderId: "474928293390",
    appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId: "G-85B7V5H5J0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  /* =========================
     ELEMENTS
  ========================= */

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");


  let resources = [];


  /* =========================
     CART
  ========================= */

  function getCart() {

    try {

      const stored =
        JSON.parse(
          localStorage.getItem("resourceCart") || "[]"
        );

      if (!Array.isArray(stored)) {
        return [];
      }

      /*
        Support old cart objects too,
        but normalize everything to IDs.
      */

      return [
        ...new Set(
          stored
            .map(item => {

              if (typeof item === "string") {
                return item;
              }

              if (
                item &&
                typeof item === "object"
              ) {

                return (
                  item.id ||
                  item.resourceId ||
                  null
                );

              }

              return null;

            })
            .filter(Boolean)
        )
      ];

    } catch (error) {

      console.error(
        "Cart error:",
        error
      );

      return [];

    }

  }


  function saveCart(ids) {

    localStorage.setItem(
      "resourceCart",
      JSON.stringify([
        ...new Set(ids)
      ])
    );

  }


  /* =========================
     RESOURCE HELPERS
  ========================= */

  function getTitle(data) {

    return (
      data.title ||
      data.name ||
      data.resourceTitle ||
      "Learning Resource"
    );

  }


  function getDescription(data) {

    return (
      data.description ||
      data.summary ||
      data.content ||
      data.details ||
      "Learning resource"
    );

  }


  function getCategory(data) {

    return (
      data.category ||
      data.subject ||
      data.type ||
      "Resource"
    );

  }


  function getPrice(data) {

    const value =
      data.price ??
      data.amount ??
      data.cost ??
      data.planPrice ??
      0;

    const number =
      Number(value);

    return Number.isFinite(number)
      ? number
      : 0;

  }


  function getAccess(data) {

    const value =
      data.access ||
      data.accessType ||
      data.membership ||
      data.plan ||
      "";

    const text =
      String(value).toLowerCase();

    if (
      text === "plan" ||
      text === "premium" ||
      text === "paid" ||
      text === "pro"
    ) {

      return "plan";

    }


    if (
      data.isPremium === true ||
      data.premium === true ||
      data.paid === true
    ) {

      return "plan";

    }


    return "free";

  }


  function getThumbnail(data) {

    return (
      data.thumbnail ||
      data.thumbnailUrl ||
      data.image ||
      data.imageUrl ||
      data.cover ||
      ""
    );

  }


  function formatPrice(value) {

    return (
      Number(value) || 0
    ).toLocaleString() + " TZS";

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================
     LOAD CART RESOURCES
  ========================= */

  async function loadCart() {

    const cartIds =
      getCart();


    if (!cartIds.length) {

      loading.style.display =
        "none";

      renderEmpty();

      return;

    }


    const loaded = [];


    for (const resourceId of cartIds) {

      try {

        const resourceRef =
          doc(
            db,
            "resources",
            resourceId
          );

        const snapshot =
          await getDoc(resourceRef);


        if (!snapshot.exists()) {
          continue;
        }


        const data =
          snapshot.data();


        /*
          Cart is for PLAN resources.
          Free resources are ignored here.
        */

        if (
          getAccess(data) !== "plan"
        ) {
          continue;
        }


        loaded.push({
          id: snapshot.id,
          ...data
        });


      } catch (error) {

        console.error(
          "Unable to load resource:",
          error
        );

      }

    }


    resources = loaded;


    /*
      Remove deleted/free resources
      from local cart automatically.
    */

    saveCart(
      resources.map(
        resource => resource.id
      )
    );


    loading.style.display =
      "none";


    if (!resources.length) {

      renderEmpty();

      return;

    }


    renderCart();

  }


  /* =========================
     RENDER CART
  ========================= */

  function renderCart() {

    let subtotal = 0;


    const itemsHTML =
      resources.map(
        (resource, index) => {

          const title =
            getTitle(resource);

          const description =
            getDescription(resource);

          const category =
            getCategory(resource);

          const price =
            getPrice(resource);

          const thumbnail =
            getThumbnail(resource);


          subtotal += price;


          const thumbnailHTML =
            thumbnail

              ? `
                <img
                  src="${thumbnail}"
                  alt="${escapeHtml(title)}"
                  loading="lazy"
                >
              `

              : `
                <div>
                  📚
                </div>
              `;


          return `

            <article
              class="resource"
              data-index="${index}"
            >

              <div class="thumb">
                ${thumbnailHTML}
              </div>


              <div class="info">

                <span class="badge">
                  PLAN
                </span>


                <div class="title">
                  ${escapeHtml(title)}
                </div>


                <div class="description">
                  ${escapeHtml(description)}
                </div>


                <div class="bottom">

                  <div>

                    <div class="price">
                      ${formatPrice(price)}
                    </div>

                    <small>
                      ${escapeHtml(category)}
                    </small>

                  </div>


                  <button
                    class="remove"
                    data-index="${index}"
                  >
                    Remove
                  </button>

                </div>

              </div>

            </article>

          `;

        }
      ).join("");


    content.innerHTML = `

      <div class="layout">

        <section class="items">

          ${itemsHTML}

        </section>


        <aside class="summary">

          <h2>
            Order Summary
          </h2>


          <div class="row">

            <span>
              Resources
            </span>

            <strong>
              ${resources.length}
            </strong>

          </div>


          <div class="row">

            <span>
              Subtotal
            </span>

            <strong>
              ${formatPrice(subtotal)}
            </strong>

          </div>


          <div class="total">

            <span>
              Total
            </span>

            <span>
              ${formatPrice(subtotal)}
            </span>

          </div>


          <a
            href="resources-checkout.html"
            class="checkout"
          >
            Proceed to Checkout
          </a>


          <button
            id="clearCart"
            class="clear"
          >
            Clear Cart
          </button>

        </aside>

      </div>

    `;


    /* Remove buttons */

    document
      .querySelectorAll(".remove")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const index =
              Number(
                button.dataset.index
              );

            removeResource(index);

          }
        );

      });


    /* Clear cart */

    const clearCart =
      document.getElementById(
        "clearCart"
      );


    clearCart.addEventListener(
      "click",
      clearResourceCart
    );

  }


  /* =========================
     REMOVE RESOURCE
  ========================= */

  function removeResource(index) {

    const resource =
      resources[index];


    if (!resource) {
      return;
    }


    const updated =
      resources
        .filter(
          (_, i) => i !== index
        )
        .map(
          item => item.id
        );


    saveCart(updated);


    resources =
      resources.filter(
        (_, i) => i !== index
      );


    if (!resources.length) {

      renderEmpty();

    } else {

      renderCart();

    }

  }


  /* =========================
     CLEAR CART
  ========================= */

  function clearResourceCart() {

    saveCart([]);

    resources = [];

    renderEmpty();

  }


  /* =========================
     EMPTY
  ========================= */

  function renderEmpty() {

    content.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛒
        </div>

        <h2>
          Your resource cart is empty
        </h2>

        <p>
          Browse available resources
          and add Plan resources to your cart.
        </p>

        <a
          href="resources.html"
          class="browse"
        >
          Browse Resources
        </a>

      </div>

    `;

  }


  /* =========================
     START
  ========================= */

  loadCart();

</script>

</body>
</html>
