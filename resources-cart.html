/* =====================================================
   HELPERS
===================================================== */

function text(value){

  if(
    value === undefined ||
    value === null
  ){

    return "";

  }

  return String(value).trim();

}


function escapeHtml(value){

  return text(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function number(value){

  const n =
    parseFloat(
      String(value ?? "")
        .replace(/,/g,"")
        .replace(/[^0-9.-]/g,"")
    );

  return Number.isFinite(n)
    ? n
    : 0;

}


function money(value){

  return (
    number(value)
      .toLocaleString(
        "en-TZ",
        {
          minimumFractionDigits:0,
          maximumFractionDigits:2
        }
      )
    +
    " TZS"
  );

}


function first(data,fields){

  for(
    const field of fields
  ){

    const value =
      text(data?.[field]);

    if(value){

      return value;

    }

  }

  return "";

}


/* =====================================================
   RESOURCE HELPERS
===================================================== */

function getTitle(data){

  return (
    first(
      data,
      [
        "title",
        "name",
        "resourceTitle"
      ]
    )
    ||
    "Learning Resource"
  );

}


function getDescription(data){

  return (
    first(
      data,
      [
        "description",
        "summary",
        "content",
        "details"
      ]
    )
    ||
    "Learning resource"
  );

}


function getCategory(data){

  return (
    first(
      data,
      [
        "category",
        "subject",
        "type"
      ]
    )
    ||
    "Resource"
  );

}


function getPrice(data){

  return number(
    first(
      data,
      [
        "price",
        "amount",
        "cost",
        "planPrice"
      ]
    )
  );

}


function getAccess(data){

  const value =
    first(
      data,
      [
        "access",
        "accessType",
        "membership",
        "plan"
      ]
    )
    .toLowerCase();


  if(
    [
      "plan",
      "premium",
      "paid",
      "pro"
    ].includes(value)
  ){

    return "plan";

  }


  if(
    data?.isPremium === true ||
    data?.premium === true ||
    data?.paid === true
  ){

    return "plan";

  }


  return "free";

}


function getThumbnail(data){

  return first(
    data,
    [
      "thumbnail",
      "thumbnailUrl",
      "image",
      "imageUrl",
      "cover"
    ]
  );

}


/* =====================================================
   CART
===================================================== */

function getCartIds(){

  try{

    const stored =
      JSON.parse(
        localStorage.getItem(
          "resourceCart"
        ) || "[]"
      );


    if(
      !Array.isArray(stored)
    ){

      return [];

    }


    return [
      ...new Set(
        stored
          .map(item => {

            if(
              typeof item === "string"
            ){

              return item;

            }


            if(
              item &&
              typeof item === "object"
            ){

              return (
                item.id ||
                item.resourceId ||
                ""
              );

            }


            return "";

          })
          .filter(Boolean)
      )
    ];

  }
  catch(error){

    console.error(
      "Resource cart parsing error:",
      error
    );

    return [];

  }

}


/* =====================================================
   CUSTOMER STORAGE
===================================================== */

function saveCustomer(){

  const customer = {

    firstName:
      text(
        document.getElementById(
          "firstName"
        )?.value
      ),

    lastName:
      text(
        document.getElementById(
          "lastName"
        )?.value
      ),

    email:
      text(
        document.getElementById(
          "email"
        )?.value
      ),

    phoneNumber:
      text(
        document.getElementById(
          "phoneNumber"
        )?.value
      ),

    country:
      text(
        document.getElementById(
          "country"
        )?.value
      )

  };


  localStorage.setItem(
    "resourceCustomer",
    JSON.stringify(customer)
  );

}


function restoreCustomer(){

  try{

    const customer =
      JSON.parse(
        localStorage.getItem(
          "resourceCustomer"
        ) || "null"
      );


    if(!customer){

      return;

    }


    [
      "firstName",
      "lastName",
      "email",
      "phoneNumber",
      "country"
    ].forEach(id => {

      const field =
        document.getElementById(id);


      if(
        field &&
        customer[id] !== undefined
      ){

        field.value =
          customer[id];

      }

    });

  }
  catch(error){

    console.error(
      "Customer restore error:",
      error
    );

  }

}


/* =====================================================
   SHOW EMPTY
===================================================== */

function showEmpty(){

  appContainer.innerHTML = `

    <div class="card empty">

      <div class="empty-icon">
        🛒

      <h2>
        Your resource cart is empty
      </h2>

      </p>

        Browse Resources
      </a>

    </div>

  `;

}


/* =====================================================
   LOAD RESOURCES
===================================================== */

async function loadResources(){

  const cartIds =
    getCartIds();


  if(!cartIds.length){

    showEmpty();

    return;

  }


  const loaded = [];


  for(
    const resourceId of cartIds
  ){

    try{

      const resourceRef =
        doc(
          db,
          "resources",
          resourceId
        );


      const snapshot =
        await getDoc(
          resourceRef
        );


      if(
        !snapshot.exists()
      ){

        console.warn(
          "Resource not found:",
          resourceId
        );

        continue;

      }


      const data =
        snapshot.data() || {};


      /*
       * Only Plan resources
       */

      if(
        getAccess(data) !== "plan"
      ){

        continue;

      }


      const price =
        getPrice(data);


      if(price <= 0){

        continue;

      }


      loaded.push({

        id:
          snapshot.id,

        ...data

      });

    }
    catch(error){

      console.error(
        "Unable to load resource:",
        resourceId,
        error
      );

    }

  }


  resources =
    loaded;


  /*
   * Keep only valid resources
   * inside the cart.
   */

  localStorage.setItem(
    "resourceCart",
    JSON.stringify(
      resources.map(
        resource =>
          resource.id
      )
    )
  );


  if(
    !resources.length
  ){

    showEmpty();

    return;

  }


  renderCheckout();

}

            </div>

          </div>


          <label class="terms">

function showStatus(

  type
){

    return;
  }

  status.textContent =
    message;

  status.className =
    "status " + type;

/* =====================================================
   CREATE PAYMENT
===================================================== */

async function createPayment(total){

  const form =
    document.getElementById(
      "checkoutForm"
    );

  const payButton =
    document.getElementById(
      "payButton"
    );


  if(!form.checkValidity()){

    form.reportValidity();

    return;

  }


  if(
    !resources.length ||
    total <= 0
  ){

    showStatus(
      "Your resource cart is invalid.",
      "error"
    );

    return;

  }


  const firstName =
    text(
      document.getElementById(
        "firstName"
      ).value
    );

  const lastName =
    text(
      document.getElementById(
        "lastName"
      ).value
    );

  const email =
    text(
      document.getElementById(
        "email"
      ).value
    );

  const phoneNumber =
    text(
      document.getElementById(
        "phoneNumber"
      ).value
    );

  const country =
    text(
      document.getElementById(
        "country"
      ).value
    );


  const orderId =
    "RES-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();


  const items =
    resources.map(
      resource => ({

        id:
          resource.id,

        name:
          getTitle(resource),

        quantity:
          1,

        price:
          Number(
            getPrice(resource)
          )

      })
    );


  const description =
    resources.length === 1
      ? getTitle(resources[0])
      : "LetsStudy Pro - " +
        resources.length +
        " Resources";


  const payload = {

    orderId,

    amount:
      Number(total),

    currency:
      "TZS",

    description,

    email,

    firstName,

    lastName,

    phoneNumber,

    country,

    paymentMethod:
      "pesapal",

    productType:
      "resource",

    items

  };


  saveCustomer();


  const pendingPayment = {

    ...payload,

    createdAt:
      new Date().toISOString()

  };


  localStorage.setItem(
    "pendingPayment",
    JSON.stringify(
      pendingPayment
    )
  );


  localStorage.setItem(
    "pendingResourcePayment",
    JSON.stringify(
      pendingPayment
    )
  );


  localStorage.setItem(
    "pendingResourceOrder",
    JSON.stringify(
      pendingPayment
    )
  );


  localStorage.setItem(
    "pendingCheckoutCustomer",
    JSON.stringify({

      firstName,

      lastName,

      email,

      phoneNumber,

      country

    })
  );


  sessionStorage.setItem(
    "resourcePayment",
    JSON.stringify(
      pendingPayment
    )
  );


  payButton.disabled =
    true;

  payButton.textContent =
    "Preparing Payment...";


  showStatus(
    "Preparing your secure Pesapal payment...",
    "loading"
  );


  try{

    const response =
      await fetch(
        CREATE_ORDER_ENDPOINT,
        {
          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload)
        }
      );


    let data = null;


    try{

      data =
        await response.json();

    }catch(error){

      data = null;

    }


    if(
      !response.ok ||
      !data ||
      data.success !== true
    ){

      throw new Error(
        data?.message ||
        data?.error ||
        "Unable to create payment order."
      );

    }


    const orderTrackingId =
      data.orderTrackingId ||
      data.order_tracking_id ||
      data.trackingId ||
      "";


    const merchantReference =
      data.merchantReference ||
      data.merchant_reference ||
      orderId;


    const redirectUrl =
      data.redirectUrl ||
      data.redirect_url ||
      data.iframeUrl ||
      "";


    if(!orderTrackingId){

      throw new Error(
        "Payment tracking ID was not returned."
      );

    }


    if(!redirectUrl){

      throw new Error(
        "Pesapal payment URL was not returned."
      );

    }


    pendingPayment.orderTrackingId =
      orderTrackingId;

    pendingPayment.merchantReference =
      merchantReference;

    pendingPayment.redirectUrl =
      redirectUrl;


    localStorage.setItem(
      "pendingPayment",
      JSON.stringify(
        pendingPayment
      )
    );


    localStorage.setItem(
      "pendingResourcePayment",
      JSON.stringify(
        pendingPayment
      )
    );


    localStorage.setItem(
      "pendingResourceOrder",
      JSON.stringify(
        pendingPayment
      )
    );


    sessionStorage.setItem(
      "resourcePayment",
      JSON.stringify(
        pendingPayment
      )
    );


    const paymentPage =
      new URL(
        PAYMENT_PAGE,
        window.location.href
      );


    paymentPage.searchParams.set(
      "orderId",
      orderId
    );


    paymentPage.searchParams.set(
      "merchantReference",
      merchantReference
    );


    paymentPage.searchParams.set(
      "productType",
      "resource"
    );


    paymentPage.searchParams.set(
      "type",
      "resource"
    );


    paymentPage.searchParams.set(
      "amount",
      String(total)
    );


    paymentPage.searchParams.set(
      "currency",
      "TZS"
    );


    paymentPage.searchParams.set(
      "orderTrackingId",
      orderTrackingId
    );


    paymentPage.searchParams.set(
      "redirectUrl",
      redirectUrl
    );


    payButton.textContent =
      "Opening Payment...";


    window.location.href =
      paymentPage.href;

  }
  catch(error){

    console.error(
      "RESOURCE PAYMENT ERROR:",
      error
    );


    showStatus(
      error?.message ||
      "Unable to start payment. Please try again.",
      "error"
    );


    payButton.disabled =
      false;

    payButton.textContent =
      "Continue to Pesapal";

  }

}

loadResources()
  .catch(error => {

    );


    appContainer.innerHTML = `

      <div class="card empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h2>
          Unable to load checkout
        </h2>

        <p>
          Please return to your Resource Cart and try again.
        </p>

        <a href="resource-cart.html">
          Back to Resource Cart
        </a>

      </div>

    `;

  });

</script>
