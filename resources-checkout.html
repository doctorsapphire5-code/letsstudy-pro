<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Resource Checkout | LetsStudy Pro</title>
  <meta name="description" content="Secure checkout for LetsStudy Pro Plan resources.">

  <link rel="icon" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f8fc;
      color: #172033;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 5%;
    }

    .nav {
      max-width: 1150px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #2563eb;
      text-decoration: none;
      font-size: 21px;
      font-weight: 900;
    }

    .back {
      color: #475569;
      text-decoration: none;
      font-weight: 700;
    }

    main {
      max-width: 1150px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
    }

    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr 370px;
      gap: 25px;
      align-items: start;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 7px 25px rgba(0,0,0,.06);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 14px;
      border: 1px solid #dbe1ea;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: #2563eb;
    }

    .payment-option {
      border: 1px solid #dbe1ea;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .payment-option input {
      margin-right: 8px;
    }

    .resource-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .resource-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 12px;
    }

    .resource-title {
      font-weight: 800;
      line-height: 1.4;
    }

    .resource-price {
      font-weight: 900;
      white-space: nowrap;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      color: #64748b;
    }

    .total {
      border-top: 1px solid #e5e7eb;
      margin-top: 8px;
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: 900;
    }

    .pay-btn {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .pay-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secure {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-top: 13px;
    }

    .message {
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      display: none;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #64748b;
    }

    .empty {
      max-width: 550px;
      margin: 80px auto;
      background: #fff;
      padding: 45px;
      text-align: center;
      border-radius: 18px;
    }

    .empty h2 {
      margin-bottom: 10px;
    }

    .empty p {
      color: #64748b;
      margin-bottom: 20px;
    }

    .empty a {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      padding: 13px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 800;
    }

    @media (max-width: 850px) {
      .checkout-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">

    <a href="index.html" class="logo">
      LetsStudy Pro
    </a>

    <a href="resources-cart.html" class="back">
      ← Resource Cart
    </a>

  </div>
</header>


<main>

  <h1>Resource Checkout</h1>

  <p class="subtitle">
    Complete your details and choose your preferred payment method.
  </p>


  <div id="loading" class="loading">
    Loading checkout...
  </div>


  <div id="checkoutContent" style="display:none;">

    <div class="message" id="message"></div>


    <div class="checkout-layout">


      <!-- CUSTOMER INFORMATION -->

      <section>

        <div class="card">

          <h2>
            Your Information
          </h2>


          <div class="field">

            <label for="fullName">
              Full Name
            </label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            >

          </div>


          <div class="field">

            <label for="email">
              Email Address
            </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email address"
              autocomplete="email"
              required
            >

          </div>

        </div>


        <!-- PAYMENT -->

        <div class="card">

          <h2>
            Payment Method
          </h2>


          <label class="payment-option">

            <input
              type="radio"
              name="paymentMethod"
              value="mobile"
              checked
            >

            Mobile Payment

          </label>


          <label class="payment-option">

            <input
              type="radio"
              name="paymentMethod"
              value="card"
            >

            Card Payment

          </label>


          <label class="payment-option">

            <input
              type="radio"
              name="paymentMethod"
              value="other"
            >

            Other Payment Method

          </label>

        </div>

      </section>


      <!-- ORDER SUMMARY -->

      <aside>

        <div class="card">

          <h2>
            Order Summary
          </h2>


          <div
            id="resourceList"
            class="resource-list"
          ></div>


          <div class="summary-row">

            <span>
              Resources
            </span>

            <strong id="resourceCount">
              0
            </strong>

          </div>


          <div class="summary-row">

            <span>
              Subtotal
            </span>

            <strong id="subtotal">
              0 TZS
            </strong>

          </div>


          <div class="total">

            <span>
              Total
            </span>

            <span id="total">
              0 TZS
            </span>

          </div>


          <button
            id="payBtn"
            class="pay-btn"
          >
            Continue to Payment
          </button>


          <div class="secure">
            Secure checkout
          </div>

        </div>

      </aside>


    </div>

  </div>

</main>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


  /* =========================
     FIREBASE
  ========================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVK5XbkljsyRgI_0rj0odBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);


  /* =========================
     ELEMENTS
  ========================= */

  const loading =
    document.getElementById("loading");

  const checkoutContent =
    document.getElementById(
      "checkoutContent"
    );

  const resourceList =
    document.getElementById(
      "resourceList"
    );

  const resourceCount =
    document.getElementById(
      "resourceCount"
    );

  const subtotalElement =
    document.getElementById(
      "subtotal"
    );

  const totalElement =
    document.getElementById(
      "total"
    );

  const payBtn =
    document.getElementById(
      "payBtn"
    );

  const message =
    document.getElementById(
      "message"
    );


  let resources = [];

  let totalAmount = 0;


  /* =========================
     CART
  ========================= */

  function getCart() {

    try {

      const stored =
        JSON.parse(
          localStorage.getItem(
            "resourceCart"
          ) || "[]"
        );


      if (!Array.isArray(stored)) {
        return [];
      }


      return [
        ...new Set(

          stored
            .map(item => {

              if (
                typeof item === "string"
              ) {
                return item;
              }


              if (
                item &&
                typeof item === "object"
              ) {

                return (
                  item.id ||
                  item.resourceId ||
                  null
                );

              }


              return null;

            })
            .filter(Boolean)

        )
      ];

    } catch {

      return [];

    }

  }


  function saveCart(ids) {

    localStorage.setItem(
      "resourceCart",
      JSON.stringify([
        ...new Set(ids)
      ])
    );

  }


  /* =========================
     HELPERS
  ========================= */

  function getTitle(data) {

    return (
      data.title ||
      data.name ||
      data.resourceTitle ||
      "Learning Resource"
    );

  }


  function getPrice(data) {

    const value =
      data.price ??
      data.amount ??
      data.cost ??
      data.planPrice ??
      0;


    const number =
      Number(value);


    return Number.isFinite(number)
      ? number
      : 0;

  }


  function getAccess(data) {

    const value =
      data.access ||
      data.accessType ||
      data.membership ||
      data.plan ||
      "";


    const text =
      String(value).toLowerCase();


    if (

      text === "plan" ||
      text === "premium" ||
      text === "paid" ||
      text === "pro"

    ) {

      return "plan";

    }


    if (

      data.isPremium === true ||
      data.premium === true ||
      data.paid === true

    ) {

      return "plan";

    }


    return "free";

  }


  function formatPrice(value) {

    return (
      Number(value) || 0
    ).toLocaleString() + " TZS";

  }


  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =========================
     SHOW MESSAGE
  ========================= */

  function showError(text) {

    message.textContent = text;

    message.className =
      "message error";

  }


  /* =========================
     LOAD RESOURCES
  ========================= */

  async function loadResources() {

    try {

      const cartIds =
        getCart();


      if (!cartIds.length) {

        showEmpty();

        return;

      }


      const loaded = [];


      for (
        const resourceId
        of cartIds
      ) {

        try {

          const resourceRef =
            doc(
              db,
              "resources",
              resourceId
            );


          const snapshot =
            await getDoc(
              resourceRef
            );


          if (
            !snapshot.exists()
          ) {
            continue;
          }


          const data =
            snapshot.data();


          /*
            Checkout only accepts
            PLAN resources.
          */

          if (
            getAccess(data) !== "plan"
          ) {
            continue;
          }


          loaded.push({

            id: snapshot.id,

            ...data

          });


        } catch (error) {

          console.error(
            "Resource loading error:",
            error
          );

        }

      }


      resources = loaded;


      /*
        Keep cart synchronized
        with valid Firebase resources.
      */

      saveCart(
        resources.map(
          resource =>
            resource.id
        )
      );


      if (!resources.length) {

        showEmpty();

        return;

      }


      renderCheckout();


    } catch (error) {

      console.error(error);

      showError(
        "Unable to load checkout."
      );

    }

  }


  /* =========================
     RENDER
  ========================= */

  function renderCheckout() {

    totalAmount = 0;


    resourceList.innerHTML = "";


    resources.forEach(
      resource => {

        const title =
          getTitle(resource);

        const price =
          getPrice(resource);


        totalAmount += price;


        const item =
          document.createElement(
            "div"
          );


        item.className =
          "resource-item";


        item.innerHTML = `

          <div class="resource-title">
            ${escapeHtml(title)}
          </div>

          <div class="resource-price">
            ${formatPrice(price)}
          </div>

        `;


        resourceList.appendChild(
          item
        );

      }
    );


    resourceCount.textContent =
      resources.length;


    subtotalElement.textContent =
      formatPrice(totalAmount);


    totalElement.textContent =
      formatPrice(totalAmount);


    loading.style.display =
      "none";


    checkoutContent.style.display =
      "block";

  }


  /* =========================
     EMPTY CART
  ========================= */

  function showEmpty() {

    loading.style.display =
      "none";


    checkoutContent.style.display =
      "block";


    checkoutContent.innerHTML = `

      <div class="empty">

        <h2>
          Your resource cart is empty
        </h2>

        <p>
          Add Plan resources to your cart
          before continuing to checkout.
        </p>

        <a href="resources.html">
          Browse Resources
        </a>

      </div>

    `;

  }


  /* =========================
     VALIDATE
  ========================= */

  function validateForm() {

    const fullName =
      document
        .getElementById(
          "fullName"
        )
        .value
        .trim();


    const email =
      document
        .getElementById(
          "email"
        )
        .value
        .trim();


    if (!fullName) {

      showError(
        "Please enter your full name."
      );

      return false;

    }


    if (!email) {

      showError(
        "Please enter your email address."
      );

      return false;

    }


    const emailPattern =
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (
      !emailPattern.test(email)
    ) {

      showError(
        "Please enter a valid email address."
      );

      return false;

    }


    return true;

  }


  /* =========================
     CHECKOUT
  ========================= */

  payBtn.addEventListener(
    "click",
    () => {

      message.className =
        "message";


      if (!validateForm()) {
        return;
      }


      if (!resources.length) {

        showError(
          "Your cart is empty."
        );

        return;

      }


      const fullName =
        document
          .getElementById(
            "fullName"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();


      const paymentMethod =
        document
          .querySelector(
            'input[name="paymentMethod"]:checked'
          )?.value ||
        "mobile";


      /*
        Generate a local order reference.
        This is NOT a payment confirmation.
      */

      const orderId =
        "RES-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2, 8)
          .toUpperCase();


      const pendingOrder = {

        orderId,

        customer: {

          name: fullName,

          email: email

        },


        resources:
          resources.map(
            resource => ({

              resourceId:
                resource.id,

              title:
                getTitle(resource),

              price:
                getPrice(resource)

            })
          ),


        total:
          totalAmount,


        paymentMethod,


        status:
          "pending",


        createdAt:
          new Date().toISOString()

      };


      /*
        Store order locally until
        real payment integration exists.
      */

      localStorage.setItem(

        "pendingResourceOrder",

        JSON.stringify(
          pendingOrder
        )

      );


      /*
        Move to payment page.
      */

      window.location.href =
        "payment.html";

    }
  );


  /* =========================
     START
  ========================= */

  loadResources();

</script>

</body>
</html>
