<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:#f3f6fb;

}
.container{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:30px;
  border-radius:17px;
  box-shadow:0 8px 35px rgba(0,0,0,.07);

.logo{
  width:58px;height:58px;
  display:flex;align-items:center;
  justify-content:center;
  background:#eaf1ff;color:#2563eb;
  border-radius:15px;
  font-size:25px;margin-bottom:20px;
}
h1{font-size:25px;margin-bottom:9px}
.subtitle{
  font-size:14px;color:#718096;
  line-height:1.6;margin-bottom:24px;
}
.field{margin-bottom:18px}
label{
  display:block;font-size:13px;
  font-weight:600;margin-bottom:8px;
}
input{
  width:100%;padding:14px;
  border:1px solid #dce3ed;
  border-radius:9px;font-size:14px;
  outline:none;
}
input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}
.password-wrap{position:relative}
.password-wrap input{padding-right:65px}
.toggle{
  position:absolute;right:12px;top:50%;
  transform:translateY(-50%);
  border:0;background:none;color:#2563eb;
  font-size:12px;font-weight:600;cursor:pointer;
}
.options{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;

.remember{
  display:flex;align-items:center;gap:7px;

}
.remember input{width:auto}
a{
  color:#2563eb;text-decoration:none;
  font-weight:600;
}
button.submit{
  width:100%;padding:14px;
  background:#2563eb;color:white;
  border:0;border-radius:9px;
  font-size:14px;font-weight:700;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
.message{
  display:none;padding:13px;
  border-radius:9px;font-size:13px;
  line-height:1.5;margin-bottom:18px;
}
.error{display:block;background:#fff0f0;color:#bd2525}
.success{display:block;background:#e7f8ee;color:#16733b}

<body>

<main class="container">

  <div class="logo">🔐</div>

  <h1>Welcome Back</h1>

  <p class="subtitle">
    Sign in to your Vorix Resources account and continue
    accessing your resources.
  </p>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" autocomplete="username" required="">
    </div>

    <div class="field">
      <label for="password">Password</label>

      <div class="password-wrap">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required="">
        <button type="button" class="toggle" id="togglePassword">Show</button>
      </div>
    </div>

    <div class="options">
      <label class="remember">
        <input type="checkbox" id="remember">
        Remember me
      </label>

      <a href="resources-forgot-password.html">
        Forgot Password?
      </a>
    </div>

    <button type="submit" class="submit" id="loginBtn">
      Sign In
    </button>

  </form>

  <div class="links">
    <a href="resources-register.html">Create Account</a>
    <a href="resources-admin-login.html">Admin Login</a>
  </div>

  <div class="divider">
    🔒 Secure authentication powered by Firebase.
    <br>
    © <span id="year"></span> Vorix Resources
  </div>

</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  signOut
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp,
  increment
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuP13ggQsiZiZgoIf9nFK8hmw8Bx6KYr0",
  authDomain: "vorix-resources.firebaseapp.com",
  projectId: "vorix-resources",
  storageBucket: "vorix-resources.firebasestorage.app",
  messagingSenderId: "789688947048",
  appId: "1:789688947048:web:31598720b1e0cef9db06dd",
  measurementId: "G-VEYGNMJ6N1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

document.getElementById("year").textContent =
  new Date().getFullYear();

function showMessage(text,type){
  message.textContent = text;
  message.className = "message " + type;
}

document.getElementById("togglePassword")
.addEventListener("click",()=>{
  const isPassword = passwordInput.type === "password";
  passwordInput.type = isPassword ? "text" : "password";
  document.getElementById("togglePassword").textContent =
    isPassword ? "Hide" : "Show";
});

form.addEventListener("submit",async(event)=>{
  event.preventDefault();

  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;
  const remember = document.getElementById("remember").checked;

  if(!email || !password){
    showMessage("Enter your email and password.","error");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Signing In...";

  let signedInUser = null;

  try{

    await setPersistence(
      auth,
      remember ? browserLocalPersistence : browserSessionPersistence
    );

    const credential = await signInWithEmailAndPassword(
      auth,email,password
    );

    signedInUser = credential.user;

    const userRef = doc(db,"users",signedInUser.uid);
    const userSnap = await getDoc(userRef);

    if(!userSnap.exists()){
      await signOut(auth);
      showMessage(
        "Your user profile was not found. Please contact support.",
        "error"
      );
      return;
    }

    const userData = userSnap.data();

    if(
      userData.userId !== signedInUser.uid ||
      (userData.email || "").toLowerCase() !==
      (signedInUser.email || "").toLowerCase()
    ){
      await signOut(auth);
      showMessage(
        "Your account information could not be verified.",
        "error"
      );
      return;
    }

    if(userData.status !== "active"){
      await signOut(auth);

      if(userData.status === "suspended"){
        showMessage(
          "Your account is suspended. Contact support for assistance.",
          "error"
        );
      }else if(userData.status === "banned"){
        showMessage(
          "Your account access has been restricted.",
          "error"
        );
      }else{
        showMessage(
          "Your account is not active yet. Please contact support.",
          "error"
        );
      }
      return;
    }

    await updateDoc(userRef,{
      lastLoginAt: serverTimestamp(),
      loginCount: increment(1),
      emailVerified: signedInUser.emailVerified,
      updatedAt: serverTimestamp()
    });

    showMessage("Login successful. Redirecting...","success");

    window.location.replace("resources-dashboard.html");

  }catch(error){

    console.error("Login error:",error);

    if(error.code === "auth/invalid-credential" ||
       error.code === "auth/wrong-password" ||
       error.code === "auth/user-not-found"){
      showMessage("Incorrect email or password.","error");

    }else if(error.code === "auth/too-many-requests"){
      showMessage(
        "Too many login attempts. Please try again later.",
        "error"
      );

    }else if(error.code === "auth/network-request-failed"){
      showMessage(
        "Network error. Check your internet connection.",
        "error"
      );

    }else{
      showMessage(
        "Unable to sign in. Please try again.",
        "error"
      );
    }

    if(signedInUser && auth.currentUser){
      try{
        await signOut(auth);
      }catch(signOutError){
        console.error(signOutError);
      }
    }

  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";
  }
});
</script>
