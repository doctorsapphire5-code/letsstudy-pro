<style>

body{
  min-height:100vh;
  padding:25px 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f6fb;
  color:#182235;
  font-family:Arial,sans-serif;
}
.container{
  width:100%;max-width:540px;
  padding:30px;background:#fff;
  border-radius:17px;
  box-shadow:0 8px 35px rgba(0,0,0,.07);
}
.logo{
  width:55px;height:55px;

.subtitle{
  color:#718096;font-size:14px;
  line-height:1.6;margin-bottom:23px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.field{margin-bottom:17px}
label{
  display:block;font-size:13px;

}

}

  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}
.password-wrap{position:relative}
.password-wrap input{padding-right:65px}
.toggle{
  position:absolute;right:12px;top:50%;
  transform:translateY(-50%);
  background:none;border:0;
  color:#2563eb;font-weight:600;
  cursor:pointer;font-size:12px;
}
.terms{
  display:flex;gap:9px;
  align-items:flex-start;
  font-size:12px;color:#64748b;
  line-height:1.5;margin:5px 0 20px;
}
.terms input{width:auto;margin-top:2px}
.submit{
  width:100%;padding:14px;
  background:#2563eb;color:#fff;
  border:0;border-radius:9px;
  font-size:14px;font-weight:700;
  cursor:pointer;
}
.submit:disabled{opacity:.6;cursor:not-allowed}
.message{
  display:none;padding:13px;
  border-radius:9px;font-size:13px;
  line-height:1.5;margin-bottom:18px;
}
.error{display:block;background:#fff0f0;color:#bd2525}
.success{display:block;background:#e7f8ee;color:#16733b}
.links{
  text-align:center;margin-top:22px;
  font-size:13px;color:#64748b;
}
a{color:#2563eb;text-decoration:none;font-weight:600}
.security{
  border-top:1px solid #edf0f5;
  margin-top:23px;padding-top:17px;
  text-align:center;color:#8792a3;
  font-size:12px;line-height:1.6;
}
@media(max-width:500px){
  .grid{grid-template-columns:1fr}
  .container{padding:23px}
}
</style>

<body>

<main class="container">

  <div class="logo">👤</div>

  <h1>Create Your Account</h1>

  <p class="subtitle">
    Join Vorix Resources to discover resources, opportunities
    and useful learning materials.
  </p>

  <div id="message" class="message"></div>

  <form id="registerForm">

    <div class="grid">
      <div class="field">
        <label for="firstName">First Name *</label>
        <input id="firstName" maxlength="60" autocomplete="given-name" required="">
      </div>

      <div class="field">
        <label for="lastName">Last Name *</label>
        <input id="lastName" maxlength="60" autocomplete="family-name" required="">
      </div>
    </div>

    <div class="field">
      <label for="displayName">Display Name *</label>
      <input id="displayName" maxlength="100" placeholder="Your display name" required="">
    </div>

    <div class="field">
      <label for="username">Username *</label>
      <input id="username" maxlength="30" placeholder="Choose a username" pattern="[A-Za-z0-9_]{3,30}" autocomplete="username" required="">
    </div>

    <div class="field">
      <label for="email">Email Address *</label>
      <input id="email" type="email" placeholder="example@email.com" autocomplete="email" required="">
    </div>

    <div class="field">
      <label for="phoneNumber">Phone Number</label>
      <input id="phoneNumber" type="tel" placeholder="+255..." autocomplete="tel">
    </div>

    <div class="grid">
      <div class="field">
        <label for="accountType">Account Type *</label>
        <select id="accountType" required="">
          <option value="individual">Individual</option>
          <option value="student">Student</option>
          <option value="professional">Professional</option>
          <option value="teacher">Teacher</option>
          <option value="creator">Creator</option>
          <option value="business">Business</option>
          <option value="organization">Organization</option>
        </select>
      </div>

      <div class="field">
        <label for="country">Country *</label>
        <input id="country" value="Tanzania" maxlength="80" required="">
      </div>
    </div>

    <div class="grid">
      <div class="field">
        <label for="language">Language</label>
        <select id="language">
          <option value="English">English</option>
          <option value="Swahili">Swahili</option>
        </select>
      </div>

      <div class="field">
        <label for="timezone">Timezone</label>
        <select id="timezone">
          <option value="Africa/Dar_es_Salaam">
            Africa/Dar_es_Salaam
          </option>
          <option value="UTC">UTC</option>
          <option value="Africa/Nairobi">Africa/Nairobi</option>
          <option value="Europe/London">Europe/London</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="password">Password *</label>
      <div class="password-wrap">
        <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Create a password" required="">
        <button type="button" class="toggle" data-target="password">Show</button>
      </div>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm Password *</label>
      <div class="password-wrap">
        <input id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Confirm your password" required="">
        <button type="button" class="toggle" data-target="confirmPassword">Show</button>
      </div>
    </div>

    <label class="terms">
      <input type="checkbox" id="agree" required="">
      <span>
        I agree to the Terms of Service and Privacy Policy.
      </span>
    </label>

    <button type="submit" class="submit" id="registerBtn">
      Create Account
    </button>

  </form>

  <div class="links">
    Already have an account?
    <a href="resources-login.html">Sign In</a>
  </div>

  <div class="security">
    🔒 Secure account registration powered by Firebase.
    <br>
    © <span id="year"></span> Vorix Resources
  </div>

</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile,
  sendEmailVerification
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuP13ggQsiZiZgoIf9nFK8hmw8Bx6KYr0",
  authDomain: "vorix-resources.firebaseapp.com",
  projectId: "vorix-resources",
  storageBucket: "vorix-resources.firebasestorage.app",
  messagingSenderId: "789688947048",
  appId: "1:789688947048:web:31598720b1e0cef9db06dd",
  measurementId: "G-VEYGNMJ6N1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("registerForm");
const registerBtn = document.getElementById("registerBtn");
const message = document.getElementById("message");

document.getElementById("year").textContent =
  new Date().getFullYear();

function showMessage(text,type){
  message.textContent = text;
  message.className = "message " + type;
}

document.querySelectorAll(".toggle").forEach(button=>{
  button.addEventListener("click",()=>{
    const input = document.getElementById(button.dataset.target);
    const visible = input.type === "password";
    input.type = visible ? "text" : "password";
    button.textContent = visible ? "Hide" : "Show";
  });
});

form.addEventListener("submit",async(event)=>{
  event.preventDefault();

  const firstName =
    document.getElementById("firstName").value.trim();

  const lastName =
    document.getElementById("lastName").value.trim();

  const displayName =
    document.getElementById("displayName").value.trim();

  const username =
    document.getElementById("username").value.trim();

  const email =
    document.getElementById("email").value.trim().toLowerCase();

  const phoneNumber =
    document.getElementById("phoneNumber").value.trim();

  const accountType =
    document.getElementById("accountType").value;

  const country =
    document.getElementById("country").value.trim();

  const language =
    document.getElementById("language").value;

  const timezone =
    document.getElementById("timezone").value;

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if(password.length < 8){
    showMessage(
      "Password must contain at least 8 characters.",
      "error"
    );
    return;
  }

  if(password !== confirmPassword){
    showMessage("Passwords do not match.","error");
    return;
  }

  if(!/^[A-Za-z0-9_]{3,30}$/.test(username)){
    showMessage(
      "Username must be 3–30 characters and contain only letters, numbers or underscores.",
      "error"
    );
    return;
  }

  if(!document.getElementById("agree").checked){
    showMessage("Please accept the terms to continue.","error");
    return;
  }

  registerBtn.disabled = true;
  registerBtn.textContent = "Creating Account...";

  let createdUser = null;

  try{

    const credential = await createUserWithEmailAndPassword(
      auth,email,password
    );

    createdUser = credential.user;

    await updateProfile(createdUser,{
      displayName: displayName
    });

    const userData = {
      userId: createdUser.uid,

      accountType: accountType,
      role: "user",
      status: "active",

      firstName: firstName,
      lastName: lastName,
      fullName: firstName + " " + lastName,
      displayName: displayName,
      username: username,

      email: createdUser.email,
      emailVerified: false,

      phoneNumber: phoneNumber,
      phoneVerified: false,

      address: "",
      city: "",
      region: "",
      country: country,
      postalCode: "",

      bio: "",
      dateOfBirth: "",
      gender: "",
      educationLevel: "",
      occupation: "",
      organizationName: "",

      interests: [],
      skills: [],
      preferences: {},
      socialLinks: {},

      language: language,
      timezone: timezone,
      notificationsEnabled: true,

      photoURL: createdUser.photoURL || "",

      provider: "password",
      providers: ["password"],

      adminId: "",

      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
      lastLoginAt: null,
      loginCount: 0,
      deletedAt: null
    };

    await setDoc(
      doc(db,"users",createdUser.uid),
      userData
    );

    await sendEmailVerification(createdUser);

    showMessage(
      "Your account has been created. Please check your email and verify your address before continuing.",
      "success"
    );

    form.reset();

    registerBtn.textContent = "Account Created";

    setTimeout(()=>{
      window.location.href = "resources-login.html";
    },3500);

  }catch(error){

    console.error("Registration error:",error);

    if(error.code === "auth/email-already-in-use"){
      showMessage("This email is already registered.","error");

    }else if(error.code === "auth/weak-password"){
      showMessage(
        "Your password is too weak. Choose a stronger password.",
        "error"
      );

    }else if(error.code === "auth/invalid-email"){
      showMessage("Enter a valid email address.","error");

    }else if(error.code === "auth/network-request-failed"){
      showMessage(
        "Network error. Check your internet connection.",
        "error"
      );

    }else if(error.code === "permission-denied"){
      showMessage(
        "Registration could not save your profile. Check Firestore Security Rules.",
        "error"
      );

    }else{
      showMessage(
        "Unable to complete registration. Please try again.",
        "error"
      );
    }

    // Do not silently delete the Firebase Auth account here.
    // A failed Firestore write requires a controlled recovery process.

  }finally{
    if(registerBtn.textContent !== "Account Created"){
      registerBtn.disabled = false;
      registerBtn.textContent = "Create Account";
    }
  }
});
</script>


</body></html>
