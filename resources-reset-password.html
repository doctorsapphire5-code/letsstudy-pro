<body>

<div class="container">

  <div class="logo">🔐</div>

  <h1>Reset Your Password</h1>

  <p class="subtitle" id="subtitle">
    Create a new secure password for your Vorix Resources account.
  </p>

  <div id="message" class="message" aria-live="polite"></div>

  <form id="resetForm" hidden="">

    <label for="newPassword">New Password</label>

    <div class="password-wrap">
      <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" minlength="8" required="">
      <button type="button" class="toggle" data-target="newPassword">
        Show
      </button>
    </div>

    <p class="password-hint">
      Use at least 8 characters. A combination of letters, numbers and symbols is recommended.
    </p>

    <label for="confirmPassword">Confirm New Password</label>

    <div class="password-wrap">
      <input type="password" id="confirmPassword" placeholder="Confirm your new password" autocomplete="new-password" minlength="8" required="">
      <button type="button" class="toggle" data-target="confirmPassword">
        Show
      </button>
    </div>

    <button type="submit" class="submit" id="submitBtn">
      Update Password
    </button>

  </form>

  <div class="links">
    <a href="resources-login.html">Back to Login</a>
  </div>

  <footer>
    © <span id="year"></span> Vorix Resources. All rights reserved.
  </footer>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  verifyPasswordResetCode,
  confirmPasswordReset
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuP13ggQsiZiZgoIf9nFK8hmw8Bx6KYr0",
  authDomain: "vorix-resources.firebaseapp.com",
  projectId: "vorix-resources",
  storageBucket: "vorix-resources.firebasestorage.app",
  messagingSenderId: "789688947048",
  appId: "1:789688947048:web:31598720b1e0cef9db06dd",
  measurementId: "G-VEYGNMJ6N1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

$("year").textContent = new Date().getFullYear();

const params = new URLSearchParams(window.location.search);

const mode = params.get("mode");
const actionCode = params.get("oobCode");

let verifiedEmail = null;
let codeIsValid = false;

function showMessage(message,type){
  $("message").textContent = message;
  $("message").className = "message " + type;
}

function getFirebaseError(code){

  const messages = {
    "auth/expired-action-code":
      "This password reset link has expired. Request a new link.",
    "auth/invalid-action-code":
      "This password reset link is invalid or has already been used.",
    "auth/user-disabled":
      "This account has been disabled. Contact support.",
    "auth/user-not-found":
      "The account associated with this reset link could not be found.",
    "auth/weak-password":
      "Please choose a stronger password.",
    "auth/network-request-failed":
      "Network error. Check your internet connection and try again."
  };

  return messages[code] ||
    "Unable to reset your password. Please request a new reset link.";
}

// Verify the Firebase password reset link.
async function verifyResetLink(){

  if(mode !== "resetPassword" || !actionCode){
    showMessage(
      "Invalid password reset link. Please request a new reset email.",
      "error"
    );
    return;
  }

  try{

    verifiedEmail = await verifyPasswordResetCode(auth,actionCode);
    codeIsValid = true;

    $("resetForm").hidden = false;

    $("subtitle").textContent =
      "Create a new password for: " + verifiedEmail;

    showMessage(
      "Reset link verified. You can now create a new password.",
      "info"
    );

  }catch(error){

    console.error(error);

    showMessage(
      getFirebaseError(error.code),
      "error"
    );

    $("resetForm").hidden = true;
  }
}

// Show/hide password.
document.querySelectorAll(".toggle").forEach(button=>{

  button.addEventListener("click",()=>{

    const input = $(button.dataset.target);

    if(input.type === "password"){
      input.type = "text";
      button.textContent = "Hide";
    }else{
      input.type = "password";
      button.textContent = "Show";
    }

  });

});

// Submit new password.
$("resetForm").addEventListener("submit",async event=>{

  event.preventDefault();

  if(!codeIsValid || !actionCode){
    showMessage(
      "Your reset link is not valid. Request a new link.",
      "error"
    );
    return;
  }

  const newPassword = $("newPassword").value;
  const confirmPassword = $("confirmPassword").value;

  if(newPassword.length < 8){
    showMessage(
      "Your password must contain at least 8 characters.",
      "error"
    );
    return;
  }

  if(newPassword !== confirmPassword){
    showMessage(
      "The passwords do not match.",
      "error"
    );
    return;
  }

  const button = $("submitBtn");
  button.disabled = true;
  button.textContent = "Updating...";

  try{

    await confirmPasswordReset(
      auth,
      actionCode,
      newPassword
    );

    codeIsValid = false;
    $("resetForm").hidden = true;

    showMessage(
      "Your password has been successfully reset. You can now log in using your new password.",
      "success"
    );

    $("subtitle").textContent =
      "Your account password has been updated.";

    // Remove sensitive reset code from the browser URL.
    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    setTimeout(()=>{
      window.location.href = "resources-login.html";
    },3000);

  }catch(error){

    console.error(error);

    showMessage(
      getFirebaseError(error.code),
      "error"
    );

  }finally{

    button.disabled = false;
    button.textContent = "Update Password";
  }

});

// Start verification.
verifyResetLink();

</script>


</body></html>
