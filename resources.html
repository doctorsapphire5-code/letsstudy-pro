<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resources | LetsStudy Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#0f172a}
a{text-decoration:none}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:900;font-size:19px;color:#2563eb}
nav{display:flex;gap:7px;flex-wrap:wrap}
nav a{font-size:9px;font-weight:900;color:#334155;background:#f1f5f9;padding:8px 10px;border-radius:8px}
.container{max-width:1050px;margin:auto;padding:22px 15px}
.hero{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:25px;border-radius:20px;margin-bottom:15px}
.hero small{font-size:9px;font-weight:900}
.hero h1{font-size:27px;margin:8px 0}
.hero p{font-size:11px;line-height:1.7;opacity:.9}
.toolbar{background:#fff;border:1px solid #e2e8f0;padding:13px;border-radius:14px;margin-bottom:15px;display:flex;gap:8px;flex-wrap:wrap}
input,select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;font-size:10px;outline:none}
input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;overflow:hidden}
.cover{height:120px;background:linear-gradient(135deg,#dbeafe,#ede9fe);display:flex;align-items:center;justify-content:center;font-size:38px}
.content{padding:15px}
.tag{font-size:8px;font-weight:900;color:#2563eb;margin-bottom:7px}
.title{font-size:14px;font-weight:900;margin-bottom:7px;line-height:1.4}
.desc{font-size:10px;color:#64748b;line-height:1.6}
.meta{font-size:8px;color:#94a3b8;margin-top:8px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;padding:9px 11px;border-radius:8px;font-size:8px;font-weight:900;cursor:pointer}
.primary{background:#2563eb;color:#fff}
.secondary{background:#e2e8f0;color:#0f172a}
.saved{background:#fef3c7;color:#92400e}
.empty,.loading{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:45px;text-align:center;color:#64748b;font-size:11px;grid-column:1/-1}
.message{display:none;padding:10px;border-radius:9px;font-size:10px;font-weight:900;margin-bottom:12px}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
footer{text-align:center;padding:30px;font-size:10px;color:#64748b}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){header{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<a href="dashboard.html" class="logo">LetsStudy Pro</a>

<nav>
<a href="search.html">Search</a>
<a href="bookmarks.html">Bookmarks</a>
<a href="notes.html">Notes</a>
<a href="dashboard.html">Dashboard</a>
</nav>
</header>

<main class="container">

<section class="hero">
<small>LEARNING RESOURCES</small>
<h1>Resources Library</h1>
<p>
Access notes, past papers, study materials and other learning resources.
</p>
</section>

<div id="message" class="message"></div>

<section class="toolbar">

<input
id="searchInput"
type="search"
placeholder="Search resources...">

<select id="categoryFilter">
<option value="all">All Categories</option>
<option value="notes">Notes</option>
<option value="papers">Past Papers</option>
<option value="books">Books</option>
<option value="guides">Guides</option>
<option value="videos">Videos</option>
</select>

<select id="levelFilter">
<option value="all">All Levels</option>
<option value="o-level">O-Level</option>
<option value="a-level">A-Level</option>
<option value="university">University</option>
</select>

</section>

<section id="resourceGrid" class="grid">

<div class="loading">
Loading resources...
</div>

</section>

</main>

<footer>
© <span id="year"></span> LetsStudy Pro
</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
orderBy,
getDocs,
doc,
setDoc,
deleteDoc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
FIREBASE
========================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* =========================================
ELEMENTS
========================================= */

const grid=
document.getElementById("resourceGrid");

const searchInput=
document.getElementById("searchInput");

const categoryFilter=
document.getElementById("categoryFilter");

const levelFilter=
document.getElementById("levelFilter");

const message=
document.getElementById("message");

let user=null;
let resources=[];
let bookmarks=new Set();


/* =========================================
AUTH
========================================= */

onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);


/* =========================================
LOAD RESOURCES
========================================= */

async function loadResources(){

try{

const q=
query(
collection(db,"resources"),
orderBy("createdAt","desc")
);

const snap=
await getDocs(q);

resources=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

}catch(error){

console.warn(error);

try{

const snap=
await getDocs(
collection(db,"resources")
);

resources=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

}catch(e){

console.error(e);

grid.innerHTML=`

<div class="empty">
Unable to load resources.
</div>

`;

}

}

}


/* =========================================
LOAD BOOKMARKS
========================================= */

async function loadBookmarks(){

try{

const snap=
await getDocs(
collection(
db,
"users",
user.uid,
"bookmarks"
)
);

bookmarks=new Set(
snap.docs.map(
d=>d.id
)
);

}catch(error){

console.warn(
"Bookmarks unavailable",
error
);

}

}


/* =========================================
RENDER
========================================= */

function render(){

const keyword=
searchInput.value
.trim()
.toLowerCase();

const category=
categoryFilter.value;

const level=
levelFilter.value;

const filtered=
resources.filter(
item=>{

const title=
String(
item.title||""
).toLowerCase();

const description=
String(
item.description||""
).toLowerCase();

const itemCategory=
String(
item.category||""
).toLowerCase();

const itemLevel=
String(
item.level||""
).toLowerCase();

const matchesSearch=
!keyword||
title.includes(keyword)||
description.includes(keyword);

const matchesCategory=
category==="all"||
itemCategory===category;

const matchesLevel=
level==="all"||
itemLevel===level;

return(
matchesSearch&&
matchesCategory&&
matchesLevel
);

}
);

grid.innerHTML="";

if(!filtered.length){

grid.innerHTML=`

<div class="empty">

📚<br><br>

No resources found.

</div>

`;

return;

}

filtered.forEach(
resource=>{

const card=
document.createElement("article");

card.className="card";

const title=
escapeHTML(
resource.title||
"Learning Resource"
);

const description=
escapeHTML(
resource.description||
"Study material from LetsStudy Pro."
);

const categoryName=
escapeHTML(
resource.category||
"Resource"
);

const levelName=
escapeHTML(
resource.level||
"All Levels"
);

const image=
resource.image||
resource.thumbnail||
"";

const details=
"resources-details.html?id="+
encodeURIComponent(resource.id);

const downloadUrl=
resource.downloadUrl||
resource.fileUrl||
resource.url||
"";

const isSaved=
bookmarks.has(resource.id);

card.innerHTML=`

<div class="cover"
${
image
?
`style="background-image:url('${escapeAttribute(image)}');background-size:cover;background-position:center"`
:
""
}>

${image?"":"📚"}

</div>

<div class="content">

<div class="tag">
${categoryName}
</div>

<div class="title">
${title}
</div>

<div class="desc">
${description.substring(0,120)}
${description.length>120?"...":""}
</div>

<div class="meta">
${levelName}
</div>

<div class="actions">

<a
href="${details}"
class="btn primary">

Details

</a>

${
downloadUrl
?
`
<a
href="download.html?id=${encodeURIComponent(resource.id)}"
class="btn secondary">

Download

</a>
`
:
""
}

<button
class="btn ${isSaved?"saved":"secondary"}"
data-bookmark="${resource.id}">

${isSaved?"★ Saved":"☆ Bookmark"}

</button>

</div>

</div>

`;

grid.appendChild(card);

}
);


/* Bookmark listeners */

document
.querySelectorAll("[data-bookmark]")
.forEach(button=>{

button.addEventListener(
"click",
()=>toggleBookmark(
button.dataset.bookmark
)
);

});

}


/* =========================================
BOOKMARK
========================================= */

async function toggleBookmark(resourceId){

if(!user)return;

try{

const bookmarkRef=
doc(
db,
"users",
user.uid,
"bookmarks",
resourceId
);

if(bookmarks.has(resourceId)){

await deleteDoc(bookmarkRef);

bookmarks.delete(resourceId);

showMessage(
"Removed from bookmarks.",
"success"
);

}else{

const resource=
resources.find(
x=>x.id===resourceId
);

await setDoc(
bookmarkRef,
{

resourceId,
title:
resource?.title||
"Resource",

createdAt:
new Date()

}
);

bookmarks.add(resourceId);

showMessage(
"Added to bookmarks ✓",
"success"
);

}

render();

}catch(error){

console.error(error);

showMessage(
"Unable to update bookmark.",
"error"
);

}

}


/* =========================================
FILTER EVENTS
========================================= */

searchInput.addEventListener(
"input",
render
);

categoryFilter.addEventListener(
"change",
render
);

levelFilter.addEventListener(
"change",
render
);


/* =========================================
MESSAGE
========================================= */

function showMessage(text,type){

message.textContent=text;

message.className=
"message "+
type;

message.style.display="block";

setTimeout(
()=>{
message.style.display="none";
},
2500
);

}


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function escapeAttribute(value){

return String(value)
.replaceAll("'","%27")
.replaceAll('"',"%22");

}


/* =========================================
YEAR
========================================= */

document.getElementById("year")
.textContent=
new Date().getFullYear();

</script>

</body>
</html>
