<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find notes, past papers, revision resources and study materials on LetsStudy Pro.">
<title>Resources | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}

header{
 background:#111827;
 color:white;
 padding:15px 5%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 position:sticky;
 top:0;
 z-index:10
}

.logo{
 font-size:20px;
 font-weight:800
}

nav a{
 color:white;
 text-decoration:none;
 margin-left:14px;
 font-size:14px
}

main{
 max-width:1150px;
 margin:auto;
 padding:20px
}

.hero{
 background:#2563eb;
 color:white;
 padding:30px 20px;
 border-radius:16px;
 margin-bottom:18px
}

.hero h1{
 margin:0 0 8px;
 font-size:32px
}

.search{
 display:flex;
 gap:8px;
 margin-top:20px
}

.search input{
 flex:1;
 padding:14px;
 border:0;
 border-radius:8px;
 font-size:15px
}

.search button{
 padding:14px 18px;
 border:0;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold
}

.filters{
 background:white;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:15px;
 display:grid;
 grid-template-columns:2fr 1fr 1fr 1fr;
 gap:10px;
 margin-bottom:20px
}

select{
 width:100%;
 padding:11px;
 border:1px solid #d1d5db;
 border-radius:7px;
 background:white
}

.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:22px 0 12px
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px
}

.card{
 background:white;
 border:1px solid #e5e7eb;
 border-radius:12px;
 overflow:hidden;
 transition:.2s
}

.card:hover{
 transform:translateY(-3px);
 box-shadow:0 8px 25px rgba(0,0,0,.08)
}

.thumb{
 width:100%;
 height:170px;
 object-fit:cover;
 background:#e5e7eb
}

.content{
 padding:15px
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 background:#dbeafe;
 color:#1e40af;
 font-size:11px;
 margin:2px
}

h3{
 margin:8px 0;
 font-size:18px
}

.meta{
 color:#667085;
 font-size:13px;
 line-height:1.7
}

.actions{
 display:flex;
 gap:6px;
 margin-top:12px
}

button,.btn{
 border:0;
 border-radius:7px;
 padding:9px 12px;
 cursor:pointer;
 text-decoration:none;
 font-size:13px
}

.primary{
 background:#2563eb;
 color:white
}

.green{
 background:#16a34a;
 color:white
}

.gray{
 background:#e5e7eb;
 color:#111827
}

.empty{
 background:white;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:30px;
 text-align:center;
 grid-column:1/-1
}

footer{
 margin-top:40px;
 background:#111827;
 color:#cbd5e1;
 padding:25px 5%;
 text-align:center
}

@media(max-width:850px){
 .grid{
  grid-template-columns:repeat(2,1fr)
 }
 .filters{
  grid-template-columns:1fr 1fr
 }
}

@media(max-width:550px){
 nav{display:none}
 .grid{
  grid-template-columns:1fr
 }
 .filters{
  grid-template-columns:1fr
 }
 .search{
  flex-direction:column
 }
}
</style>
</head>

<body>

<header>

<div class="logo">
📚 LetsStudy Pro
</div>

<nav>
<a href="index.html">Home</a>
<a href="resources.html">Resources</a>
<a href="notes.html">Notes</a>
<a href="notes-papers.html">Past Papers</a>
<a href="dashboard.html">Dashboard</a>
</nav>

</header>


<main>

<section class="hero">

<h1>Study Resources</h1>

<p>
Find notes, past papers, revision materials,
ebooks and other learning resources.
</p>

<div class="search">

<input
id="search"
type="search"
placeholder="Search Biology, Physics, Form 6, notes...">

<button
onclick="searchNow()">
Search
</button>

</div>

</section>


<div class="filters">

<select id="category">
<option value="">All Categories</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>Mathematics</option>
<option>Geography</option>
<option>History</option>
<option>English</option>
<option>Computer Science</option>
<option>Business</option>
<option>Other</option>
</select>


<select id="level">
<option value="">All Levels</option>
<option>O-Level</option>
<option>A-Level</option>
<option>University</option>
<option>Professional</option>
<option>All Levels</option>
</select>


<select id="type">
<option value="">All Types</option>
<option value="pdf">PDF</option>
<option value="notes">Notes</option>
<option value="past-paper">Past Paper</option>
<option value="ebook">E-Book</option>
<option value="document">Document</option>
<option value="video">Video</option>
</select>


<select id="sort">
<option value="latest">Latest</option>
<option value="popular">Most Downloaded</option>
<option value="views">Most Viewed</option>
</select>

</div>


<section>

<div class="section-title">

<h2>⭐ Featured Resources</h2>

<a
class="btn gray"
href="search.html">
View All
</a>

</div>

<div
id="featured"
class="grid">
Loading...
</div>

</section>


<section>

<div class="section-title">

<h2>📚 Latest Resources</h2>

<span id="count">
0 resources
</span>

</div>

<div
id="resources"
class="grid">
Loading...
</div>

</section>

</main>


<footer>

© 2026 LetsStudy Pro —
Study. Learn. Grow.

</footer>


<script type="module">

import{
 initializeApp
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
 getFirestore,
 collection,
 getDocs,
 updateDoc,
 doc,
 increment
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

let resources=[];


/* ELEMENT */

const $=id=>
document.getElementById(id);


/* ESCAPE */

function clean(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* LOAD RESOURCES */

async function load(){

try{

const snapshot=
await getDocs(
collection(db,"resources")
);

resources=
snapshot.docs
.map(d=>({

id:d.id,
...d.data()

}))
.filter(x=>
x.status==="published"
);

render();

}catch(error){

$("resources").innerHTML=
`
<div class="empty">
<h3>Unable to load resources</h3>
<p>${clean(error.message)}</p>
</div>
`;

}

}


/* FILTER */

function filtered(){

const q=
$("search").value
.toLowerCase()
.trim();

const category=
$("category").value;

const level=
$("level").value;

const type=
$("type").value;

const sort=
$("sort").value;


let result=
resources.filter(r=>{

const text=[

r.title,
r.description,
r.category,
r.subject,
r.form,
r.level,
r.type,
(r.tags||[]).join(" ")

]
.join(" ")
.toLowerCase();


return(

(!q||text.includes(q))&&

(!category||
r.category===category)&&

(!level||
r.level===level)&&

(!type||
r.type===type)

);

});


if(sort==="popular"){

result.sort(
(a,b)=>
Number(b.downloads||0)-
Number(a.downloads||0)
);

}

if(sort==="views"){

result.sort(
(a,b)=>
Number(b.views||0)-
Number(a.views||0)
);

}

if(sort==="latest"){

result.sort((a,b)=>{

const da=
a.createdAt?.toDate
?a.createdAt.toDate()
:new Date(a.createdAt||0);

const db=
b.createdAt?.toDate
?b.createdAt.toDate()
:new Date(b.createdAt||0);

return db-da;

});

}

return result;

}


/* CARD */

function card(r){

const image=
r.thumbnail||
"https://placehold.co/600x350?text=LetsStudy+Resource";


return`

<article class="card">

<img
class="thumb"
src="${clean(image)}"
alt="${clean(r.title)}"
onerror="this.src='https://placehold.co/600x350?text=Resource'">

<div class="content">

<span class="badge">
${clean(r.category||"Resource")}
</span>

<span class="badge">
${clean(r.type||"PDF")}
</span>

<h3>
${clean(r.title)}
</h3>

<div class="meta">

🎓 ${clean(r.level||"All Levels")}
<br>

📖 ${clean(r.subject||"General")}
<br>

⬇ ${Number(r.downloads||0)}
downloads

·

👁 ${Number(r.views||0)}
views

</div>

<p>
${clean(
(r.description||"")
.slice(0,120)
)}
${(r.description||"").length>120?"...":""}
</p>

<div class="actions">

<a
class="btn primary"
href="resources-details.html?id=${encodeURIComponent(r.id)}">
View Details
</a>

<a
class="btn green"
href="download.html?id=${encodeURIComponent(r.id)}">
📥 Download
</a>

</div>

</div>

</article>

`;

}


/* RENDER */

function render(){

const result=
filtered();


$("count").textContent=
`${result.length} resources`;


const featured=
result.filter(r=>
r.featured===true
).slice(0,6);


$("featured").innerHTML=
featured.length
?
featured.map(card).join("")
:
`
<div class="empty">
No featured resources available.
</div>
`;


$("resources").innerHTML=
result.length
?
result.map(card).join("")
:
`
<div class="empty">

<h3>No resources found</h3>

<p>
Try another search or filter.
</p>

</div>
`;

}


/* SEARCH */

window.searchNow=()=>{

const q=
$("search").value.trim();

if(q){

window.location.href=
"search.html?q="+
encodeURIComponent(q);

}

else{

render();

}

};


/* ENTER KEY */

$("search").addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
searchNow();

}
);


/* FILTERS */

$("category").onchange=render;

$("level").onchange=render;

$("type").onchange=render;

$("sort").onchange=render;


/* TRACK VIEW */

async function trackViews(){

const ids=
resources.slice(0,20);

for(const r of ids){

try{

await updateDoc(
doc(db,"resources",r.id),
{
views:
increment(1)
}
);

}catch{}

}

}


/* START */

load();

</script>

</body>
</html>
