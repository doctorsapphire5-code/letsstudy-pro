<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Resources | LetsStudy Pro</title>
<meta name="description" content="Access educational resources, notes, past papers, guides and learning materials on LetsStudy Pro.">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background:#f6f8fc;
  color:#111827
}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:17px
}
nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.logo{
  color:#2563eb;
  font-size:21px;
  font-weight:900
}
nav a{
  text-decoration:none;
  color:#374151;
  font-weight:700
}
main{
  max-width:1100px;
  margin:auto;
  padding:30px 16px
}
.hero{
  text-align:center;
  margin-bottom:22px
}
.hero h1{
  margin:0 0 8px;
  font-size:clamp(30px,5vw,46px)
}
.hero p{
  margin:0;
  color:#6b7280
}
.tools{
  display:grid;
  grid-template-columns:1fr 220px;
  gap:10px;
  margin:20px 0
}
.search,
select{
  width:100%;
  padding:14px 16px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#fff;
  font-size:15px;
  outline:none
}
.search:focus,
select:focus{
  border-color:#2563eb
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:18px
}
.card{
  overflow:hidden;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.05)
}
.card img{
  width:100%;
  height:165px;
  object-fit:cover;
  background:#e5e7eb
}
.content{
  padding:16px
}
.content h2{
  margin:0 0 8px;
  font-size:19px
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0
}
.meta span{
  padding:5px 8px;
  border-radius:7px;
  background:#eff6ff;
  color:#1d4ed8;
  font-size:11px;
  font-weight:700
}
.content p{
  color:#6b7280;
  font-size:13px;
  line-height:1.5
}
.btn{
  display:block;
  text-align:center;
  margin-top:14px;
  padding:11px;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  font-weight:800
}
.status{
  text-align:center;
  padding:25px;
  color:#6b7280
}
@media(max-width:650px){
  .tools{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<nav>
  <div class="logo">LetsStudy Pro</div>
  <a href="index.html">Home</a>
</nav>
</header>

<main>

<section class="hero">
  <h1>Learning Resources</h1>
  <p>Notes, past papers, guides and useful learning materials.</p>
</section>

<div class="tools">

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search resources..."
    aria-label="Search resources"
  >

  <select id="category">
    <option value="">All Categories</option>
  </select>

</div>

<div id="status" class="status">
  Loading resources...
</div>

<div id="resources" class="grid"></div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const container=document.getElementById("resources");
const status=document.getElementById("status");
const search=document.getElementById("search");
const category=document.getElementById("category");

let allResources=[];

async function loadResources(){

  try{

    const snap=await getDocs(
      collection(db,"resources")
    );

    allResources=snap.docs.map(doc=>({
      id:doc.id,
      ...doc.data()
    }));

    createCategories();
    render(allResources);

  }catch(error){

    console.error(error);
    status.textContent="Unable to load resources.";

  }

}

function createCategories(){

  const categories=[
    ...new Set(
      allResources
      .map(item=>item.category)
      .filter(Boolean)
    )
  ];

  categories.sort();

  categories.forEach(cat=>{

    const option=document.createElement("option");

    option.value=cat;
    option.textContent=cat;

    category.appendChild(option);

  });

}

function render(list){

  container.innerHTML="";

  if(!list.length){

    status.textContent="No resources found.";
    return;

  }

  status.textContent=
    `${list.length} resource${list.length>1?"s":""} available`;

  list.forEach(item=>{

    const title=
      item.title||
      item.name||
      "Learning Resource";

    const description=
      item.description||
      "Access this learning resource on LetsStudy Pro.";

    const image=
      item.thumbnail||
      item.image||
      "https://images.unsplash.com/photo-1456324504439-367cee3b3c32?auto=format&fit=crop&w=800&q=80";

    const cat=
      item.category||
      "";

    const type=
      item.type||
      item.resourceType||
      "";

    const card=document.createElement("article");

    card.className="card";

    card.innerHTML=`

      <img
        src="${image}"
        alt="${title}"
        loading="lazy"
        onerror="this.src='https://images.unsplash.com/photo-1456324504439-367cee3b3c32?auto=format&fit=crop&w=800&q=80'"
      >

      <div class="content">

        <h2>${title}</h2>

        <div class="meta">

          ${
            cat
            ? `<span>${cat}</span>`
            : ""
          }

          ${
            type
            ? `<span>${type}</span>`
            : ""
          }

        </div>

        <p>${description}</p>

        <a
          class="btn"
          href="resource-details.html?id=${encodeURIComponent(item.id)}"
        >
          View Resource
        </a>

      </div>

    `;

    container.appendChild(card);

  });

}

function filterResources(){

  const q=search.value.toLowerCase().trim();
  const cat=category.value;

  const filtered=allResources.filter(item=>{

    const text=[
      item.title,
      item.name,
      item.description,
      item.category,
      item.type,
      item.resourceType,
      item.subject,
      item.course,
      item.author
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    const matchesSearch=text.includes(q);

    const matchesCategory=
      !cat || item.category===cat;

    return matchesSearch && matchesCategory;

  });

  render(filtered);

}

search.addEventListener("input",filterResources);
category.addEventListener("change",filterResources);

loadResources();

</script>

</body>
</html>
