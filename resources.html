<body>

<header>
<nav>
  <div class="logo">LetsStudy Pro</div>
  <a href="index.html">Home</a>
</nav>
</header>

<main>

<section class="hero">
  <h1>Learning Resources</h1>
  <p>Notes, past papers, guides and useful learning materials.</p>
</section>

<div class="tools">

  <input id="search" class="search" type="search" placeholder="Search resources..." aria-label="Search resources">

  <select id="category">
    <option value="">All Categories</option>
  </select>

</div>

<div id="status" class="status">
  Loading resources...
</div>

<div id="resources" class="grid"></div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const container=document.getElementById("resources");
const status=document.getElementById("status");
const search=document.getElementById("search");
const category=document.getElementById("category");

let allResources=[];

async function loadResources(){

  try{

    const snap=await getDocs(
      collection(db,"resources")
    );

    allResources=snap.docs.map(doc=>({
      id:doc.id,
      ...doc.data()
    }));

    createCategories();
    render(allResources);

  }catch(error){

    console.error(error);
    status.textContent="Unable to load resources.";

  }

}

function createCategories(){

  const categories=[
    ...new Set(
      allResources
      .map(item=>item.category)
      .filter(Boolean)
    )
  ];

  categories.sort();

  categories.forEach(cat=>{

    const option=document.createElement("option");

    option.value=cat;
    option.textContent=cat;

    category.appendChild(option);

  });

}

function render(list){

  container.innerHTML="";

  if(!list.length){

    status.textContent="No resources found.";
    return;

  }

  status.textContent=
    `${list.length} resource${list.length>1?"s":""} available`;

  list.forEach(item=>{

    const title=
      item.title||
      item.name||
      "Learning Resource";

    const description=
      item.description||
      "Access this learning resource on LetsStudy Pro.";

    const image=
      item.thumbnail||
      item.image||
      "https://images.unsplash.com/photo-1456324504439-367cee3b3c32?auto=format&fit=crop&w=800&q=80";

    const cat=
      item.category||
      "";

    const type=
      item.type||
      item.resourceType||
      "";

    const card=document.createElement("article");

    card.className="card";

    card.innerHTML=`

      <img
        src="${image}"
        alt="${title}"
        loading="lazy"
        onerror="this.src='https://images.unsplash.com/photo-1456324504439-367cee3b3c32?auto=format&fit=crop&w=800&q=80'"
      >

      <div class="content">

        <h2>${title}</h2>

        <div class="meta">

          ${
            cat
            ? `<span>${cat}</span>`
            : ""
          }

          ${
            type
            ? `<span>${type}</span>`
            : ""
          }

        </div>

        <p>${description}</p>

        <a
          class="btn"
          href="resources-details.html?id=${encodeURIComponent(item.id)}"
        >
          View Resource
        </a>

      </div>

    `;

    container.appendChild(card);

  });

}

function filterResources(){

  const q=search.value.toLowerCase().trim();
  const cat=category.value;

  const filtered=allResources.filter(item=>{

    const text=[
      item.title,
      item.name,
      item.description,
      item.category,
      item.type,
      item.resourceType,
      item.subject,
      item.course,
      item.author
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    const matchesSearch=text.includes(q);

    const matchesCategory=
      !cat || item.category===cat;

    return matchesSearch && matchesCategory;

  });

  render(filtered);

}

search.addEventListener("input",filterResources);
category.addEventListener("change",filterResources);

loadResources();

</script>
