<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resources - Lets Study Pro</title>
<meta name="description" content="Access study notes, past papers, PDFs, videos and other learning resources on Lets Study Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span{
  color:#2563eb;
}

.menu{
  display:flex;
  gap:18px;
  align-items:center;
}

.menu a{
  text-decoration:none;
  color:#334155;
  font-size:14px;
}

.menu a:hover{
  color:#2563eb;
}

.profile{
  background:#2563eb;
  color:#fff;
  padding:9px 14px;
  border-radius:8px;
  text-decoration:none;
  font-size:13px;
}

.hero{
  background:#2563eb;
  color:#fff;
  padding:55px 20px;
  text-align:center;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero p{
  max-width:650px;
  margin:auto;
  line-height:1.6;
  opacity:.9;
}

.search-box{
  max-width:700px;
  margin:25px auto 0;
  display:flex;
}

.search-box input{
  flex:1;
  padding:15px;
  border:0;
  border-radius:9px 0 0 9px;
  outline:none;
  font-size:14px;
}

.search-box button{
  border:0;
  padding:0 20px;
  background:#111827;
  color:#fff;
  border-radius:0 9px 9px 0;
  cursor:pointer;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.filter{
  border:1px solid #d1d5db;
  background:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  color:#334155;
}

.filter.active,
.filter:hover{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.resource{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  transition:.2s;
}

.resource:hover{
  transform:translateY(-3px);
}

.resource-top{
  height:130px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}

.resource-body{
  padding:18px;
}

.resource-body h3{
  font-size:17px;
  margin-bottom:8px;
}

.resource-body p{
  color:#64748b;
  font-size:13px;
  line-height:1.5;
  margin-bottom:12px;
}

.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  font-size:11px;
}

.category{
  color:#2563eb;
  font-weight:bold;
}

.free{
  background:#dcfce7;
  color:#166534;
  padding:5px 8px;
  border-radius:15px;
}

.paid{
  background:#fef3c7;
  color:#92400e;
  padding:5px 8px;
  border-radius:15px;
}

.open-btn{
  display:block;
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:11px;
  border-radius:8px;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
  font-size:13px;
}

.locked{
  background:#64748b;
}

.empty{
  text-align:center;
  padding:50px;
  color:#64748b;
  grid-column:1/-1;
}

.loading{
  text-align:center;
  padding:50px;
  color:#64748b;
  grid-column:1/-1;
}

footer{
  margin-top:40px;
  padding:25px;
  background:#111827;
  color:#cbd5e1;
  text-align:center;
  font-size:13px;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  .menu a:not(.profile){
    display:none;
  }

  .hero h1{
    font-size:27px;
  }

  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    Lets <span>Study Pro</span>
  </div>

  <nav class="menu">
    <a href="dashboard.html">Dashboard</a>
    <a href="courses.html">Courses</a>
    <a href="resources.html">Resources</a>
    <a href="community.html">Community</a>
    <a class="profile" href="profile.html">Profile</a>
  </nav>

</header>


<section class="hero">

  <h1>Learning Resources</h1>

  <p>
    Find notes, past papers, PDFs, videos and other
    educational resources to support your studies.
  </p>

  <div class="search-box">

    <input
      id="search"
      type="search"
      placeholder="Search resources..."
    >

    <button id="searchBtn">
      Search
    </button>

  </div>

</section>


<main class="container">

  <div class="filters">

    <button
      class="filter active"
      data-category="all">
      All
    </button>

    <button
      class="filter"
      data-category="notes">
      Notes
    </button>

    <button
      class="filter"
      data-category="past-papers">
      Past Papers
    </button>

    <button
      class="filter"
      data-category="pdf">
      PDFs
    </button>

    <button
      class="filter"
      data-category="video">
      Videos
    </button>

    <button
      class="filter"
      data-category="free">
      Free
    </button>

  </div>


  <div
    class="grid"
    id="resourcesGrid">

    <div class="loading">
      Loading resources...
    </div>

  </div>

</main>


<footer>

  © 2026 Lets Study Pro.
  All rights reserved.

</footer>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  onValue
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"
};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


let resources = [];

let selectedCategory = "all";

let currentUser = null;


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
  auth,
  user => {

    currentUser = user;

    loadResources();

  }
);


/* =====================================================
   LOAD RESOURCES
===================================================== */

function loadResources(){

  const resourcesRef =
  ref(
    db,
    "resources"
  );


  onValue(
    resourcesRef,
    snapshot => {

      const data =
      snapshot.val();

      resources = [];


      if(data){

        Object.entries(data)
        .forEach(
          ([id,value]) => {

            resources.push({

              id,

              ...value

            });

          }
        );

      }


      renderResources();

    },

    error => {

      console.error(error);

      document.getElementById(
        "resourcesGrid"
      ).innerHTML = `

        <div class="empty">

          Unable to load resources.

        </div>

      `;

    }
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderResources(){

  const grid =
  document.getElementById(
    "resourcesGrid"
  );


  const search =
  document.getElementById(
    "search"
  )
  .value
  .toLowerCase()
  .trim();


  let list =
  resources.filter(
    resource => {

      const title =
      String(
        resource.title || ""
      ).toLowerCase();


      const description =
      String(
        resource.description || ""
      ).toLowerCase();


      const category =
      String(
        resource.category || ""
      ).toLowerCase();


      const isFree =
      resource.free === true ||
      resource.price === 0 ||
      String(
        resource.access || ""
      ).toLowerCase() === "free";


      const matchesSearch =
      !search ||
      title.includes(search) ||
      description.includes(search) ||
      category.includes(search);


      let matchesCategory = true;


      if(
        selectedCategory !==
        "all"
      ){

        if(
          selectedCategory ===
          "free"
        ){

          matchesCategory =
          isFree;

        }else{

          matchesCategory =
          category ===
          selectedCategory;

        }

      }


      return (
        matchesSearch &&
        matchesCategory
      );

    }
  );


  if(!list.length){

    grid.innerHTML = `

      <div class="empty">

        No resources found.

      </div>

    `;

    return;

  }


  grid.innerHTML =
  list.map(
    resourceCard
  ).join("");

}


/* =====================================================
   RESOURCE CARD
===================================================== */

function resourceCard(resource){

  const title =
  escapeHtml(
    resource.title ||
    "Untitled Resource"
  );


  const description =
  escapeHtml(
    resource.description ||
    "Educational resource"
  );


  const category =
  String(
    resource.category ||
    "resource"
  );


  const isFree =
  resource.free === true ||
  Number(
    resource.price || 0
  ) === 0 ||
  String(
    resource.access || ""
  ).toLowerCase() ===
  "free";


  const price =
  Number(
    resource.price || 0
  );


  let icon = "📚";


  if(
    category === "notes"
  )
    icon = "📝";


  if(
    category === "past-papers"
  )
    icon = "📄";


  if(
    category === "pdf"
  )
    icon = "📕";


  if(
    category === "video"
  )
    icon = "🎥";


  let button;


  if(isFree){

    button = `

      <a
        class="open-btn"
        href="${safeUrl(
          resource.url ||
          resource.fileUrl ||
          resource.link
        )}"
        target="_blank"
        rel="noopener">

        Open Resource

      </a>

    `;

  }else{

    button = `

      <a
        class="open-btn locked"
        href="checkout.html?resourceId=${encodeURIComponent(
          resource.id
        )}">

        🔒 Unlock Resource
        ${
          price
          ? " - TZS " +
            price.toLocaleString("en-TZ")
          : ""
        }

      </a>

    `;

  }


  return `

    <article class="resource">

      <div class="resource-top">

        ${icon}

      </div>


      <div class="resource-body">

        <h3>
          ${title}
        </h3>

        <p>
          ${description}
        </p>


        <div class="meta">

          <span class="category">

            ${escapeHtml(
              category
            )}

          </span>


          ${
            isFree

            ? `
              <span class="free">
                FREE
              </span>
            `

            : `
              <span class="paid">
                PAID
              </span>
            `
          }

        </div>


        ${button}

      </div>

    </article>

  `;

}


/* =====================================================
   FILTERS
===================================================== */

document
.querySelectorAll(".filter")
.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        document
        .querySelectorAll(
          ".filter"
        )
        .forEach(
          b =>
          b.classList.remove(
            "active"
          )
        );


        button.classList.add(
          "active"
        );


        selectedCategory =
        button.dataset.category;


        renderResources();

      }
    );

  }
);


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("search")
.addEventListener(
  "input",
  renderResources
);


document
.getElementById("searchBtn")
.addEventListener(
  "click",
  renderResources
);


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function safeUrl(url){

  if(!url)
    return "#";


  try{

    const parsed =
    new URL(
      url,
      window.location.origin
    );


    if(
      parsed.protocol ===
      "https:" ||
      parsed.protocol ===
      "http:"
    ){

      return parsed.href;

    }

  }catch(error){

    return "#";

  }


  return "#";

}

</script>

</body>
</html>
