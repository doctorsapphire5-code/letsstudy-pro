.lsp-related-trending-links {
  width: 100%;

}

.lsp-rtl-inner {
  max-width: 1200px;
  margin: auto;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 14px;
  flex-wrap: wrap;
}

/* BUTTON */

.lsp-rtl-button {
  position: relative;
  overflow: hidden;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 155px;
  padding: 13px 25px;

  border-radius: 999px;

  text-decoration: none;

  font-family: inherit;
  font-size: 15px;
  font-weight: 800;

  cursor: pointer;

  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease,
    background 0.3s ease;

  animation: lspButtonIn 0.7s ease both;
}

/* SHINE */

.lsp-rtl-button::before {
  content: "";

  position: absolute;

  top: 0;
  left: -130%;

  width: 70%;
  height: 100%;

  background: linear-gradient(
    110deg,
    transparent,
    rgba(255,255,255,0.4),
    transparent
  );

  transform: skewX(-20deg);

  transition: left 0.7s ease;
}

.lsp-rtl-button:hover::before {
  left: 140%;
}

/* HOVER */

.lsp-rtl-button:hover {
  transform:
    translateY(-5px)
    scale(1.03);

  box-shadow:
    0 12px 30px rgba(0,0,0,0.16);
}

/* CLICK */

.lsp-rtl-button:active {
  transform:
    translateY(-1px)
    scale(0.96);
}

/* RELATED */

.lsp-related-button {
  background: #111;
  color: #fff;

  animation-delay: 0.1s;
}

.lsp-related-button:hover {
  background: #222;
}

/* TRENDING */

.lsp-trending-button {
  background: #f3f3f3;
  color: #111;

  border: 1px solid #ddd;

  animation-delay: 0.25s;
}

.lsp-trending-button:hover {
  background: #fff;
}

/* TEXT */

.lsp-rtl-button span {
  position: relative;
  z-index: 2;

  transition:
    letter-spacing 0.3s ease;
}

.lsp-rtl-button:hover span {
  letter-spacing: 0.4px;
}

/* PAGE ANIMATION */

@keyframes lspFadeIn {

  from {
    opacity: 0;
    transform: translateY(25px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

/* BUTTON ANIMATION */

@keyframes lspButtonIn {

  from {
    opacity: 0;
    transform:
      translateY(20px)
      scale(0.9);
  }

  to {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }

}

/* MOBILE */

@media (max-width: 600px) {

  .lsp-related-trending-links {
    margin: 25px 0;
    padding: 0 12px;
  }

  .lsp-rtl-inner {
    width: 100%;
    gap: 10px;
  }

  .lsp-rtl-button {
    flex: 1;
    min-width: 130px;
    padding: 12px 16px;
    font-size: 14px;
  }

}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {

  .lsp-related-trending-links,
  .lsp-rtl-button {
    animation: none !important;
    transition: none !important;
  }

  .lsp-rtl-button:hover {
    transform: none;
  }

}

const params =

const scholarshipId =
  params.get("id");


function first(data,fields){

  for(const field of fields){

    const value =
      data[field];

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value);

    }

  }

  return "";

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeURL(value){

  if(!value) return "";

  try{

    const url =
      new URL(
        value,
        window.location.href
      );

    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return url.href;

    }

  }catch(error){}

  return "";

}


function renderScholarship(data){

  const title =
    first(data,[
      "title",
      "name",
      "scholarshipName",
      "programName"
    ]) ||
    "Scholarship";


  const provider =
    first(data,[
      "provider",
      "organization",
      "institution",
      "university",
      "sponsor",
      "offeredBy"
    ]);


  const description =
    first(data,[
      "description",
      "about",
      "details",
      "content",
      "summary"
    ]) ||
    "Discover this scholarship opportunity on LetsStudy Pro.";


  const image =
    first(data,[
      "image",
      "imageUrl",
      "logo",
      "logoUrl",
      "thumbnail",
      "thumbnailUrl"
    ]);


  const country =
    first(data,[
      "country",
      "countries",
      "destination",
      "location"
    ]);


  const level =
    first(data,[
      "level",
      "studyLevel",
      "educationLevel",
      "degree",
      "degreeLevel"
    ]);


  const field =
    first(data,[
      "field",
      "fieldOfStudy",
      "category",
      "subject",
      "discipline"
    ]);


  const funding =
    first(data,[
      "funding",
      "fundingType",
      "award",
      "benefits",
      "amount"
    ]);


  const deadline =
    first(data,[
      "deadline",
      "applicationDeadline",
      "closingDate",
      "date"
    ]);


  const eligibility =
    first(data,[
      "eligibility",
      "requirements",
      "qualifications",
      "whoCanApply"
    ]);


  const duration =
    first(data,[
      "duration",
      "studyDuration",
      "programDuration"
    ]);


  const website =
    safeURL(
      first(data,[
        "website",
        "websiteUrl",
        "url",
        "link"
      ])
    );


  const applicationURL =
    safeURL(
      first(data,[
        "applicationUrl",
        "applyUrl",
        "applicationLink",
        "applyLink"
      ])
    );


  const imageHTML = image

    ? `
      <img
        src="${escapeHTML(image)}"
        alt="${escapeHTML(title)}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="placeholder"
        style="display:none;"
      >
        🎓
      </div>
    `

    : `
      <div class="placeholder">
        🎓
      </div>
    `;


  let infoHTML = "";


  if(provider){

    infoHTML += `
      <div class="info">

        <div class="label">
          Provider
        </div>

        <div class="value">
          ${escapeHTML(provider)}
        </div>

      </div>
    `;

  }


  if(country){

    infoHTML += `
      <div class="info">

        <div class="label">
          Destination
        </div>

        <div class="value">
          ${escapeHTML(country)}
        </div>

      </div>
    `;

  }


  if(level){

    infoHTML += `
      <div class="info">

        <div class="label">

        </div>

        </div>

      </div>
    `;

  }


  if(field){

    infoHTML += `
      <div class="info">

        <div class="label">
          Field of Study
        </div>

        <div class="value">
          ${escapeHTML(field)}
        </div>

      </div>
    `;

  }


  if(funding){

    infoHTML += `
      <div class="info">

        <div class="label">
          Funding
        </div>

        <div class="value">

        </div>

      </div>
    `;

  }


  if(deadline){

    infoHTML += `
      <div class="info">

        <div class="label">
          Deadline
        </div>

        <div class="value">
          ${escapeHTML(deadline)}
        </div>

      </div>
    `;

  }


  if(duration){

    infoHTML += `
      <div class="info">

        <div class="label">
          Duration
        </div>

        <div class="value">
          ${escapeHTML(duration)}
        </div>

      </div>
    `;

  }


  let actionsHTML = "";


  if(applicationURL){

    actionsHTML += `
      <a
        class="btn primary"
        href="${escapeHTML(applicationURL)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Apply Now →
      </a>
    `;

  }


  if(website){

    actionsHTML += `
      <a
        class="btn secondary"
        href="${escapeHTML(website)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Official Website
      </a>
    `;

  }


  scholarshipCard.innerHTML = `

    <section class="hero">

      <div class="logo-box">
        ${imageHTML}
      </div>

      <div>

        <span class="badge">
          SCHOLARSHIP
        </span>

        <h1>
          ${escapeHTML(title)}
        </h1>

        ${
          provider
          ? `
            <div class="provider">
              Offered by ${escapeHTML(provider)}
            </div>
          `
          : ""
        }

      </div>

    </section>


    <section class="content">

      <div class="section">

        <h2>
          About This Scholarship
        </h2>

        <div class="description">
          ${escapeHTML(description)}
        </div>

      </div>


      ${
        eligibility
        ? `
          <div class="section">

            <h2>
              Eligibility & Requirements
            </h2>

            <div class="description">
              ${escapeHTML(eligibility)}
            </div>

          </div>
        `
        : ""
      }


      ${
        infoHTML
        ? `
          <div class="section">

            <h2>
              Scholarship Information
            </h2>

            <div class="info-grid">
              ${infoHTML}
            </div>

          </div>
        `
        : ""
      }


      ${
        actionsHTML
        ? `
          <div class="section">

            <h2>
              Application
            </h2>

            <div class="actions">
              ${actionsHTML}
            </div>

          </div>
        `
        : ""
      }

    </section>

  `;


  document.title =
    title + " | LetsStudy Pro";

}


async function loadScholarship(){

  if(!scholarshipId){

    scholarshipCard.innerHTML = `

      <div class="error">

        <h2>
          Scholarship not found
        </h2>

        <p>
          No scholarship ID was provided.
        </p>

      </div>

    `;

    return;

  }


  try{

    const scholarshipRef =
      doc(
        db,
        "scholarships",
        scholarshipId
      );


    const snapshot =
      await getDoc(
        scholarshipRef
      );


    if(!snapshot.exists()){

      scholarshipCard.innerHTML = `

        <div class="error">

          <h2>
            Scholarship not found
          </h2>

          <p>
            The requested scholarship
            could not be found.
          </p>

        </div>

      `;

      return;

    }


    renderScholarship(
      snapshot.data()
    );


  }catch(error){

    console.error(
      "Scholarship loading error:",
      error
    );


    scholarshipCard.innerHTML = `

      <div class="error">

        <h2>
          Unable to load scholarship
        </h2>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


loadScholarship();

</script>
