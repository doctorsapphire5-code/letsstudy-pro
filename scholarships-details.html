<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Scholarship | LetsStudy Pro</title>

<meta name="description" content="Scholarship details on LetsStudy Pro.">
<meta name="theme-color" content="#2563eb">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.6;
}

.header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  color:#111827;
  text-decoration:none;
  font-size:21px;
  font-weight:800;
}

.back{
  color:#2563eb;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.container{
  max-width:1050px;
  margin:35px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(15,23,42,.06);
}

.hero{
  padding:32px;
  display:flex;
  gap:25px;
  align-items:center;
  border-bottom:1px solid #edf0f4;
}

.logo-box{
  width:135px;
  height:135px;
  min-width:135px;
  border-radius:18px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.logo-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.placeholder{
  font-size:55px;
}

.badge{
  display:inline-block;
  background:#eff6ff;
  color:#2563eb;
  padding:5px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  margin-bottom:9px;
}

h1{
  font-size:31px;
  line-height:1.2;
  margin-bottom:8px;
}

.provider{
  color:#64748b;
  font-size:15px;
}

.content{
  padding:30px 32px;
}

.section{
  margin-bottom:30px;
}

.section:last-child{
  margin-bottom:0;
}

.section h2{
  font-size:20px;
  margin-bottom:12px;
}

.description{
  color:#475569;
  white-space:pre-line;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.info{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
}

.label{
  color:#64748b;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:4px;
}

.value{
  font-size:14px;
  font-weight:700;
  word-break:break-word;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.btn{
  display:inline-block;
  padding:12px 18px;
  border-radius:10px;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2ff;
  color:#3730a3;
}

.loading{
  min-height:350px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

.error{
  padding:50px 25px;
  text-align:center;
}

.error h2{
  margin-bottom:8px;
}

.error p{
  color:#64748b;
}

.footer{
  text-align:center;
  padding:30px 15px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){

  .header{
    padding:0 15px;
  }

  .container{
    margin:20px auto;
  }

  .hero{
    padding:24px;
    flex-direction:column;
    align-items:flex-start;
  }

  .logo-box{
    width:110px;
    height:110px;
    min-width:110px;
  }

  h1{
    font-size:26px;
  }

  .content{
    padding:24px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    LetsStudy Pro
  </a>

  <a href="search.html" class="back">
    ← Back to Search
  </a>

</header>


<main class="container">

  <article class="card" id="scholarshipCard">

    <div class="loading">
      Loading scholarship...
    </div>

  </article>

</main>


<footer class="footer">
  © LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const scholarshipCard =
  document.getElementById(
    "scholarshipCard"
  );


const params =
  new URLSearchParams(
    window.location.search
  );

const scholarshipId =
  params.get("id");


function first(data,fields){

  for(const field of fields){

    const value =
      data[field];

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value);

    }

  }

  return "";

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeURL(value){

  if(!value) return "";

  try{

    const url =
      new URL(
        value,
        window.location.href
      );

    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return url.href;

    }

  }catch(error){}

  return "";

}


function renderScholarship(data){

  const title =
    first(data,[
      "title",
      "name",
      "scholarshipName",
      "programName"
    ]) ||
    "Scholarship";


  const provider =
    first(data,[
      "provider",
      "organization",
      "institution",
      "university",
      "sponsor",
      "offeredBy"
    ]);


  const description =
    first(data,[
      "description",
      "about",
      "details",
      "content",
      "summary"
    ]) ||
    "Discover this scholarship opportunity on LetsStudy Pro.";


  const image =
    first(data,[
      "image",
      "imageUrl",
      "logo",
      "logoUrl",
      "thumbnail",
      "thumbnailUrl"
    ]);


  const country =
    first(data,[
      "country",
      "countries",
      "destination",
      "location"
    ]);


  const level =
    first(data,[
      "level",
      "studyLevel",
      "educationLevel",
      "degree",
      "degreeLevel"
    ]);


  const field =
    first(data,[
      "field",
      "fieldOfStudy",
      "category",
      "subject",
      "discipline"
    ]);


  const funding =
    first(data,[
      "funding",
      "fundingType",
      "award",
      "benefits",
      "amount"
    ]);


  const deadline =
    first(data,[
      "deadline",
      "applicationDeadline",
      "closingDate",
      "date"
    ]);


  const eligibility =
    first(data,[
      "eligibility",
      "requirements",
      "qualifications",
      "whoCanApply"
    ]);


  const duration =
    first(data,[
      "duration",
      "studyDuration",
      "programDuration"
    ]);


  const website =
    safeURL(
      first(data,[
        "website",
        "websiteUrl",
        "url",
        "link"
      ])
    );


  const applicationURL =
    safeURL(
      first(data,[
        "applicationUrl",
        "applyUrl",
        "applicationLink",
        "applyLink"
      ])
    );


  const imageHTML = image

    ? `
      <img
        src="${escapeHTML(image)}"
        alt="${escapeHTML(title)}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="placeholder"
        style="display:none;"
      >
        🎓
      </div>
    `

    : `
      <div class="placeholder">
        🎓
      </div>
    `;


  let infoHTML = "";


  if(provider){

    infoHTML += `
      <div class="info">

        <div class="label">
          Provider
        </div>

        <div class="value">
          ${escapeHTML(provider)}
        </div>

      </div>
    `;

  }


  if(country){

    infoHTML += `
      <div class="info">

        <div class="label">
          Destination
        </div>

        <div class="value">
          ${escapeHTML(country)}
        </div>

      </div>
    `;

  }


  if(level){

    infoHTML += `
      <div class="info">

        <div class="label">
          Study Level
        </div>

        <div class="value">
          ${escapeHTML(level)}
        </div>

      </div>
    `;

  }


  if(field){

    infoHTML += `
      <div class="info">

        <div class="label">
          Field of Study
        </div>

        <div class="value">
          ${escapeHTML(field)}
        </div>

      </div>
    `;

  }


  if(funding){

    infoHTML += `
      <div class="info">

        <div class="label">
          Funding
        </div>

        <div class="value">
          ${escapeHTML(funding)}
        </div>

      </div>
    `;

  }


  if(deadline){

    infoHTML += `
      <div class="info">

        <div class="label">
          Deadline
        </div>

        <div class="value">
          ${escapeHTML(deadline)}
        </div>

      </div>
    `;

  }


  if(duration){

    infoHTML += `
      <div class="info">

        <div class="label">
          Duration
        </div>

        <div class="value">
          ${escapeHTML(duration)}
        </div>

      </div>
    `;

  }


  let actionsHTML = "";


  if(applicationURL){

    actionsHTML += `
      <a
        class="btn primary"
        href="${escapeHTML(applicationURL)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Apply Now →
      </a>
    `;

  }


  if(website){

    actionsHTML += `
      <a
        class="btn secondary"
        href="${escapeHTML(website)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Official Website
      </a>
    `;

  }


  scholarshipCard.innerHTML = `

    <section class="hero">

      <div class="logo-box">
        ${imageHTML}
      </div>

      <div>

        <span class="badge">
          SCHOLARSHIP
        </span>

        <h1>
          ${escapeHTML(title)}
        </h1>

        ${
          provider
          ? `
            <div class="provider">
              Offered by ${escapeHTML(provider)}
            </div>
          `
          : ""
        }

      </div>

    </section>


    <section class="content">

      <div class="section">

        <h2>
          About This Scholarship
        </h2>

        <div class="description">
          ${escapeHTML(description)}
        </div>

      </div>


      ${
        eligibility
        ? `
          <div class="section">

            <h2>
              Eligibility & Requirements
            </h2>

            <div class="description">
              ${escapeHTML(eligibility)}
            </div>

          </div>
        `
        : ""
      }


      ${
        infoHTML
        ? `
          <div class="section">

            <h2>
              Scholarship Information
            </h2>

            <div class="info-grid">
              ${infoHTML}
            </div>

          </div>
        `
        : ""
      }


      ${
        actionsHTML
        ? `
          <div class="section">

            <h2>
              Application
            </h2>

            <div class="actions">
              ${actionsHTML}
            </div>

          </div>
        `
        : ""
      }

    </section>

  `;


  document.title =
    title + " | LetsStudy Pro";

}


async function loadScholarship(){

  if(!scholarshipId){

    scholarshipCard.innerHTML = `

      <div class="error">

        <h2>
          Scholarship not found
        </h2>

        <p>
          No scholarship ID was provided.
        </p>

      </div>

    `;

    return;

  }


  try{

    const scholarshipRef =
      doc(
        db,
        "scholarships",
        scholarshipId
      );


    const snapshot =
      await getDoc(
        scholarshipRef
      );


    if(!snapshot.exists()){

      scholarshipCard.innerHTML = `

        <div class="error">

          <h2>
            Scholarship not found
          </h2>

          <p>
            The requested scholarship
            could not be found.
          </p>

        </div>

      `;

      return;

    }


    renderScholarship(
      snapshot.data()
    );


  }catch(error){

    console.error(
      "Scholarship loading error:",
      error
    );


    scholarshipCard.innerHTML = `

      <div class="error">

        <h2>
          Unable to load scholarship
        </h2>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


loadScholarship();

</script>

</body>
</html>
