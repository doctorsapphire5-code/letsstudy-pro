<style>
:root{
  --navy:#0a1a3f;
  --blue:#2563eb;
  --blue-d:#1d4ed8;
  --tint:#eff6ff;
  --ink:#111827;
  --mute:#6b7280;
  --line:#e5e7eb;
  --bg:#f6f8fc;
  --warn:#b45309;
  --warn-bg:#fef3c7;
  --bad:#b91c1c;
  --bad-bg:#fee2e2;
  --ok:#047857;
  --ok-bg:#d1fae5;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased
}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 16px
}
nav{
  max-width:1160px;margin:auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px
}
.logo{
  color:var(--blue);font-size:21px;font-weight:900;
  text-decoration:none;letter-spacing:-.02em
}
nav a.home{
  text-decoration:none;color:#374151;font-weight:700;
  padding:8px 14px;border-radius:999px
}
nav a.home:hover{background:var(--tint);color:var(--blue-d)}

.hero{
  background:var(--navy);
  color:#fff;
  text-align:center;
  padding:56px 16px 92px
}
.hero h1{
  margin:0 auto 12px;
  max-width:760px;
  font-size:clamp(32px,6vw,56px);
  line-height:1.05;
  letter-spacing:-.03em;
  font-weight:900
}
.hero p{
  margin:0 auto;
  max-width:560px;
  color:#c7d2fe;
  font-size:clamp(15px,2.2vw,18px);
  line-height:1.55
}

main{
  max-width:1160px;margin:-56px auto 0;
  padding:0 16px 60px;
  position:relative
}

.searchbox{
  position:relative;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 18px 50px rgba(10,26,63,.18);
  padding:10px
}
.searchrow{display:flex;gap:10px;align-items:center}
.searchrow .field{position:relative;flex:1}
.searchrow svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;color:var(--mute);pointer-events:none
}
.search{
  width:100%;
  padding:15px 44px 15px 44px;
  border:1px solid transparent;
  border-radius:12px;
  font:inherit;font-size:16px;
  background:var(--bg);
  outline:none;
  -webkit-appearance:none;appearance:none
}
.search:focus{border-color:var(--blue);background:#fff}
.clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:0;background:#e5e7eb;color:#374151;
  width:28px;height:28px;border-radius:50%;
  font-size:16px;line-height:1;cursor:pointer;display:none
}
.clear.on{display:block}
.sort{
  font:inherit;font-size:14px;font-weight:700;
  padding:14px 12px;border:1px solid var(--line);
  border-radius:12px;background:#fff;color:#374151;cursor:pointer
}

.chips{
  display:flex;gap:8px;overflow-x:auto;
  padding:12px 4px 4px;
  scrollbar-width:none
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;
  font:inherit;font-size:13px;font-weight:700;
  padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);background:#fff;color:#374151;
  cursor:pointer;white-space:nowrap
}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip small{opacity:.7;font-weight:600;margin-left:4px}

.status{
  margin:26px 2px 16px;
  color:var(--mute);font-size:14px;font-weight:600;
  min-height:20px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(285px,1fr));
  gap:20px
}
.card{
  position:relative;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  transition:box-shadow .2s,border-color .2s
}
.card:hover,.card:focus-within{
  border-color:#bfdbfe;
  box-shadow:0 14px 34px rgba(37,99,235,.14)
}
.thumb{position:relative;aspect-ratio:16/9;background:#e5e7eb}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{
  position:absolute;left:12px;top:12px;
  padding:6px 10px;border-radius:999px;
  font-size:12px;font-weight:800;
  background:#fff;color:var(--ink);
  box-shadow:0 2px 8px rgba(0,0,0,.15)
}
.badge.soon{background:var(--warn-bg);color:var(--warn)}
.badge.closed{background:var(--bad-bg);color:var(--bad)}
.badge.open{background:var(--ok-bg);color:var(--ok)}

.content{display:flex;flex-direction:column;flex:1;padding:16px 16px 18px}
.org{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--blue-d)}
.content h2{margin:0 0 8px;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.content h2 a{text-decoration:none}
.content h2 a::after{content:"";position:absolute;inset:0}
.content p{
  margin:0;color:var(--mute);font-size:14px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden
}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding-top:14px;margin-top:auto}
.meta span{
  padding:5px 9px;border-radius:7px;
  background:var(--tint);color:var(--blue-d);
  font-size:12px;font-weight:700
}
.cta{
  margin-top:14px;
  display:block;text-align:center;
  padding:12px;border-radius:11px;
  background:var(--blue);color:#fff;font-weight:800;font-size:14px
}
.card:hover .cta{background:var(--blue-d)}

/* Skeleton placeholders (shown while data loads) */
.sk .thumb,.sk .line{
  background:linear-gradient(90deg,#eceff4 25%,#f6f8fb 37%,#eceff4 63%);
  background-size:400% 100%;
  animation:sh 1.3s ease infinite
}
.sk .line{height:12px;border-radius:6px;margin-bottom:10px}
.sk .line.w1{width:40%}.sk .line.w2{width:85%;height:18px}.sk .line.w3{width:100%}.sk .line.w4{width:70%}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

.empty{
  grid-column:1/-1;
  text-align:center;
  background:#fff;border:1px dashed #cbd5e1;border-radius:16px;
  padding:48px 20px
}
.empty h3{margin:0 0 6px;font-size:20px}
.empty p{margin:0 0 18px;color:var(--mute)}
.btn{
  display:inline-block;border:0;cursor:pointer;
  font:inherit;font-weight:800;font-size:14px;
  padding:12px 22px;border-radius:11px;
  background:var(--blue);color:#fff
}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue-d);border:1px solid #bfdbfe}
.more{text-align:center;margin-top:28px}

@media (max-width:560px){
  .searchrow{flex-direction:column;align-items:stretch}
  .sort{width:100%}
  .hero{padding:40px 16px 84px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<body>

<header>
  <nav aria-label="Main">
    <a class="logo" href="index.html">LetsStudy Pro</a>
    <a class="home" href="index.html">Home</a>
  </nav>
</header>

<section class="hero">
  <h1>Find the scholarship that fits your future</h1>
  <p>Funding opportunities from universities and organizations around the world, in one place.</p>
</section>

<main>

  <div class="searchbox">
    <div class="searchrow">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="search" class="search" type="search" placeholder="Search by name, university, country..." aria-label="Search scholarships" autocomplete="off">
        <button id="clear" class="clear" type="button" aria-label="Clear search">×</button>
      </div>
      <select id="sort" class="sort" aria-label="Sort scholarships">
        <option value="deadline">Closing soon</option>
        <option value="az">A to Z</option>
      </select>
    </div>
    <div id="chips" class="chips" role="group" aria-label="Filter by country"></div>
  </div>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <div id="scholarships" class="grid" aria-busy="true"></div>

  <div id="more" class="more" hidden="">
    <button id="moreBtn" class="btn ghost" type="button">Show more scholarships</button>
  </div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import { getFirestore, collection, getDocs }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f"
};

const db = getFirestore(initializeApp(firebaseConfig));

const $ = id => document.getElementById(id);
const grid = $("scholarships"), statusEl = $("status"), search = $("search");
const clearBtn = $("clear"), sortEl = $("sort"), chipsEl = $("chips");
const moreWrap = $("more"), moreBtn = $("moreBtn");

const PAGE = 12;
const FALLBACK_IMG =
  "https://www.unisq.edu.au/-/media/unisq/global-components/curved-directory-image-locations/curved-directory-image-toowoomba.ashx?rev=313ed564a65247eab74ddf34e6cc372d";

let all = [], shown = PAGE, country = "all", timer;

/* ---------- helpers ---------- */

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => (
  { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
));

const safeImg = u => /^https?:\/\//i.test(u || "") ? u : FALLBACK_IMG;

function toDate(v){
  if (!v) return null;
  if (typeof v.toDate === "function") return v.toDate();      // Firestore Timestamp
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

function deadlineInfo(raw, date){
  if (!raw) return null;
  if (!date) return { text: String(raw), cls: "", days: Infinity };
  const today = new Date(); today.setHours(0,0,0,0);
  const end = new Date(date); end.setHours(0,0,0,0);
  const days = Math.round((end - today) / 864e5);
  const fmt = date.toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
  if (days < 0)   return { text: "Closed", cls: "closed", days, fmt };
  if (days === 0) return { text: "Closes today", cls: "soon", days, fmt };
  if (days <= 30) return { text: days + (days === 1 ? " day left" : " days left"), cls: "soon", days, fmt };
  return { text: "Closes " + fmt, cls: "open", days, fmt };
}

function normalize(d){
  const date = toDate(d.deadline);
  const o = {
    id: d.id,
    title: d.title || d.name || "Scholarship Opportunity",
    desc: d.description || "Explore this scholarship opportunity.",
    img: d.imageUrl || d.image || "",
    org: d.university || d.provider || d.organization || "",
    country: d.country || "",
    level: d.level || d.category || "",
    dl: deadlineInfo(d.deadline, date)
  };
  o.text = [o.title, o.desc, o.org, o.country, o.level].join(" ").toLowerCase();
  return o;
}

/* ---------- loading / error states ---------- */

function skeletons(){
  grid.setAttribute("aria-busy", "true");
  grid.innerHTML = Array.from({ length: 6 }, () => `
    <article class="card sk" aria-hidden="true">
      <div class="thumb"></div>
      <div class="content">
        <div class="line w1"></div><div class="line w2"></div>
        <div class="line w3"></div><div class="line w4"></div>
      </div>
    </article>`).join("");
  statusEl.textContent = "";
}

function showError(){
  grid.setAttribute("aria-busy", "false");
  statusEl.textContent = "";
  moreWrap.hidden = true;
  grid.innerHTML = `
    <div class="empty">
      <h3>We couldn't load scholarships</h3>
      <p>Check your internet connection and try again.</p>
      <button class="btn" type="button" id="retry">Try again</button>
    </div>`;
  $("retry").addEventListener("click", load);
}

/* ---------- data ---------- */

async function load(){
  skeletons();
  try{
    const snap = await getDocs(collection(db, "scholarships"));
    all = snap.docs.map(d => normalize({ id: d.id, ...d.data() }));
    buildChips();
    const q = new URLSearchParams(location.search).get("q");
    if (q) { search.value = q; }
    update(true);
  }catch(err){
    console.error(err);
    showError();
  }
}

/* ---------- filtering, sorting, rendering ---------- */

function buildChips(){
  const counts = {};
  all.forEach(s => { if (s.country) counts[s.country] = (counts[s.country] || 0) + 1; });
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  chipsEl.hidden = names.length < 2;
  chipsEl.innerHTML =
    chip("all", "All countries", all.length) +
    names.map(n => chip(n, n, counts[n])).join("");
}

function chip(value, label, n){
  return `<button type="button" class="chip" data-v="${esc(value)}" aria-pressed="${value === country}">
    ${esc(label)}<small>${n}</small></button>`;
}

function filtered(){
  const q = search.value.toLowerCase().trim();
  let list = all.filter(s =>
    (country === "all" || s.country === country) && (!q || s.text.includes(q))
  );
  if (sortEl.value === "az") {
    list.sort((a, b) => a.title.localeCompare(b.title));
  } else {
    // open deadlines first (soonest first), then no deadline, then closed
    const rank = s => (!s.dl || !isFinite(s.dl.days)) ? 1e9 : s.dl.days < 0 ? 2e9 + s.dl.days : s.dl.days;
    list.sort((a, b) => rank(a) - rank(b));
  }
  return list;
}

function update(reset){
  if (reset) shown = PAGE;
  clearBtn.classList.toggle("on", !!search.value);

  const q = search.value.trim();
  const url = new URL(location.href);
  q ? url.searchParams.set("q", q) : url.searchParams.delete("q");
  history.replaceState(null, "", url);

  render(filtered());
}

function cardHTML(s){
  const dl = s.dl;
  return `
  <article class="card">
    <div class="thumb">
      <img src="${esc(safeImg(s.img))}" alt="" loading="lazy" decoding="async">
      ${dl ? `<span class="badge ${dl.cls}">${esc(dl.text)}</span>` : ""}
    </div>
    <div class="content">
      ${s.org ? `<p class="org">${esc(s.org)}</p>` : ""}
      <h2><a href="scholarships-details.html?id=${encodeURIComponent(s.id)}">${esc(s.title)}</a></h2>
      <p>${esc(s.desc)}</p>
      <div class="meta">
        ${s.country ? `<span>${esc(s.country)}</span>` : ""}
        ${s.level ? `<span>${esc(s.level)}</span>` : ""}
        ${dl && dl.fmt && dl.cls !== "closed" ? `<span>Deadline: ${esc(dl.fmt)}</span>` : ""}
      </div>
      <span class="cta">View scholarship</span>
    </div>
  </article>`;
}

function render(list){
  grid.setAttribute("aria-busy", "false");

  if (!list.length){
    statusEl.textContent = "";
    moreWrap.hidden = true;
    grid.innerHTML = `
      <div class="empty">
        <h3>No scholarships found</h3>
        <p>Try a different keyword or clear the filters.</p>
        <button class="btn" type="button" id="reset">Clear filters</button>
      </div>`;
    $("reset").addEventListener("click", () => {
      search.value = ""; country = "all"; buildChips(); update(true);
    });
    return;
  }

  const slice = list.slice(0, shown);
  statusEl.textContent =
    `${list.length} scholarship${list.length > 1 ? "s" : ""} available`;

  grid.innerHTML = slice.map(cardHTML).join("");

  grid.querySelectorAll(".thumb img").forEach(img =>
    img.addEventListener("error", () => { img.src = FALLBACK_IMG; }, { once: true })
  );

  moreWrap.hidden = list.length <= shown;
}

/* ---------- events ---------- */

search.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => update(true), 160);
});

clearBtn.addEventListener("click", () => { search.value = ""; search.focus(); update(true); });
sortEl.addEventListener("change", () => update(true));

chipsEl.addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  country = b.dataset.v;
  chipsEl.querySelectorAll(".chip").forEach(c =>
    c.setAttribute("aria-pressed", String(c.dataset.v === country))
  );
  update(true);
});

moreBtn.addEventListener("click", () => { shown += PAGE; update(false); });

load();

</script>



</body></html>
