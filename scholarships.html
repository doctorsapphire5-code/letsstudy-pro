<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Scholarships | LetsStudy Pro</title>

<meta name="description"
content="Discover scholarships, funding opportunities and study support on LetsStudy Pro.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  text-decoration:none;
  color:#172033;
  font-size:21px;
  font-weight:800
}

.logo span{
  color:#2563eb
}

nav{
  display:flex;
  gap:8px
}

nav a{
  text-decoration:none;
  color:#475569;
  font-size:11px;
  font-weight:700;
  padding:9px
}

.container{
  width:92%;
  max-width:1050px;
  margin:25px auto
}

.hero{
  background:#172033;
  color:#fff;
  padding:32px 25px;
  border-radius:18px;
  margin-bottom:15px
}

.hero small{
  color:#93c5fd;
  font-size:10px;
  font-weight:800
}

.hero h1{
  font-size:30px;
  margin-top:7px
}

.hero p{
  color:#cbd5e1;
  font-size:12px;
  margin-top:7px;
  line-height:1.5
}

.search{
  display:flex;
  gap:8px;
  margin-top:18px
}

.search input,
select{
  width:100%;
  border:0;
  outline:0;
  background:#fff;
  padding:12px;
  border-radius:8px;
  font-size:11px
}

.search input{
  flex:2
}

.search select{
  flex:1
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:15px
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px
}

.stat small{
  color:#64748b;
  font-size:10px
}

.stat strong{
  display:block;
  font-size:21px;
  margin-top:6px
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:18px;
  display:flex;
  flex-direction:column
}

.tag{
  display:inline-block;
  background:#eef5ff;
  color:#2563eb;
  padding:5px 7px;
  border-radius:6px;
  font-size:9px;
  font-weight:800;
  align-self:flex-start
}

.card h2{
  font-size:15px;
  margin-top:11px;
  line-height:1.35
}

.card p{
  color:#64748b;
  font-size:11px;
  line-height:1.5;
  margin-top:6px
}

.meta{
  margin-top:12px;
  display:grid;
  gap:5px;
  font-size:10px;
  color:#475569
}

.meta strong{
  color:#172033
}

.actions{
  display:flex;
  gap:7px;
  margin-top:auto;
  padding-top:15px
}

.btn{
  flex:1;
  text-align:center;
  text-decoration:none;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
  cursor:pointer
}

.secondary{
  background:#eef2f7;
  color:#172033
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:#64748b;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px
}

.loading{
  text-align:center;
  padding:45px;
  color:#64748b
}

.hidden{
  display:none!important
}

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

}

@media(max-width:600px){

  nav{
    display:none
  }

  .stats,
  .grid{
    grid-template-columns:1fr
  }

  .search{
    flex-direction:column
  }

  .container{
    width:94%
  }
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
LetsStudy <span>Pro</span>
</a>

<nav>
<a href="courses.html">Courses</a>
<a href="careers.html">Careers</a>
<a href="scholarships.html">Scholarships</a>
<a href="profile.html">Profile</a>
</nav>

</header>


<main class="container">

<section class="hero">

<small>
LETSSTUDY PRO
</small>

<h1>
Scholarships
</h1>

<p>
Discover scholarships and funding opportunities
for your education and future career.
</p>

<div class="search">

<input
id="search"
type="search"
placeholder="Search scholarships..."
>

<select id="category">

<option value="all">
All Categories
</option>

<option value="undergraduate">
Undergraduate
</option>

<option value="masters">
Masters
</option>

<option value="phd">
PhD
</option>

<option value="research">
Research
</option>

</select>

<select id="funding">

<option value="all">
All Funding
</option>

<option value="full">
Fully Funded
</option>

<option value="partial">
Partial
</option>

</select>

</div>

</section>


<section class="stats">

<div class="stat">

<small>
Scholarships
</small>

<strong id="total">
0
</strong>

</div>

<div class="stat">

<small>
Fully Funded
</small>

<strong id="fullyFunded">
0
</strong>

</div>

<div class="stat">

<small>
Closing Soon
</small>

<strong id="closingSoon">
0
</strong>

</div>

</section>


<section
id="loading"
class="card loading"
>
Loading scholarships...
</section>


<section
id="grid"
class="grid hidden"
>
</section>

</main>


<script>

/*
==================================================
LETSSTUDY PRO SCHOLARSHIPS

API:

GET /api/scholarships

EXPECTED:

{
  scholarships:[
    {
      id:"1",
      title:"Global Scholarship",
      provider:"Example University",
      category:"masters",
      funding:"full",
      amount:"Full tuition + stipend",
      deadline:"2026-10-30",
      location:"Worldwide",
      eligibility:"International students",
      description:"...",
      applyUrl:"https://..."
    }
  ]
}

==================================================
*/


const search =
document.getElementById("search");

const category =
document.getElementById("category");

const funding =
document.getElementById("funding");

const grid =
document.getElementById("grid");

const loading =
document.getElementById("loading");

let scholarships = [];


/* =========================
   LOAD
========================= */

loadScholarships();


async function loadScholarships(){

try{

const response =
await fetch(
"/api/scholarships"
);

if(!response.ok){

throw new Error(
"API unavailable"
);

}

const result =
await response.json();

scholarships =
result.scholarships ||
result.data ||
result ||
[];

}catch(error){

/*
Fallback demo data.
Remove this section when
your API is ready.
*/

scholarships =
demoScholarships();

}

loading.classList.add(
"hidden"
);

grid.classList.remove(
"hidden"
);

updateStats();

render();

}


/* =========================
   FILTERS
========================= */

search.addEventListener(
"input",
render
);

category.addEventListener(
"change",
render
);

funding.addEventListener(
"change",
render
);


/* =========================
   RENDER
========================= */

function render(){

const term =
search.value
.toLowerCase()
.trim();

const cat =
category.value;

const fund =
funding.value;


const filtered =
scholarships.filter(
item => {

const text =
(
(item.title || "") +
" " +
(item.provider || "") +
" " +
(item.description || "") +
" " +
(item.location || "")
)
.toLowerCase();


const matchesSearch =
!term ||
text.includes(term);


const matchesCategory =
cat === "all" ||
String(
item.category || ""
)
.toLowerCase() === cat;


const matchesFunding =
fund === "all" ||
String(
item.funding || ""
)
.toLowerCase() === fund;


return (
matchesSearch &&
matchesCategory &&
matchesFunding
);

}
);


if(!filtered.length){

grid.innerHTML = `

<div class="empty">

<h3>
No scholarships found
</h3>

<p style="margin-top:7px">
Try another search or category.
</p>

</div>

`;

return;

}


grid.innerHTML =
filtered.map(
createCard
).join("");

}


/* =========================
   CARD
========================= */

function createCard(
item
){

const deadline =
item.deadline ||
item.closingDate;

const days =
daysUntil(
deadline
);

const deadlineText =
deadline
? formatDate(deadline)
: "Not specified";


const urgency =
days >= 0 &&
days <= 14
? `<span style="
color:#b45309;
font-weight:800
">
Closing soon
</span>`
: "";


return `

<article class="card">

<span class="tag">
${escapeHTML(
label(item.category)
)}
</span>

<h2>
${escapeHTML(
item.title ||
"Scholarship"
)}
</h2>

<p>
${escapeHTML(
item.description ||
"Scholarship opportunity."
)}
</p>

<div class="meta">

<div>
Provider:
<strong>
${escapeHTML(
item.provider ||
"Not specified"
)}
</strong>
</div>

<div>
Funding:
<strong>
${escapeHTML(
label(item.funding) ||
"Not specified"
)}
</strong>
</div>

<div>
Amount:
<strong>
${escapeHTML(
item.amount ||
"See details"
)}
</strong>
</div>

<div>
Deadline:
<strong>
${deadlineText}
</strong>
${urgency}
</div>

<div>
Location:
<strong>
${escapeHTML(
item.location ||
"Worldwide"
)}
</strong>
</div>

</div>


<div class="actions">

<a
class="btn secondary"
href="scholarship.html?id=${encodeURIComponent(
item.id || ""
)}"
>
Details
</a>

<a
class="btn"
target="_blank"
rel="noopener"
href="${safeUrl(
item.applyUrl
)}"
>
Apply
</a>

</div>

</article>

`;

}


/* =========================
   STATS
========================= */

function updateStats(){

document.getElementById(
"total"
).textContent =
scholarships.length;


document.getElementById(
"fullyFunded"
).textContent =
scholarships.filter(
x =>
String(
x.funding || ""
).toLowerCase()
===
"full"
).length;


document.getElementById(
"closingSoon"
).textContent =
scholarships.filter(
x => {

const d =
daysUntil(
x.deadline
);

return d >= 0 && d <= 30;

}
).length;

}


/* =========================
   HELPERS
========================= */

function daysUntil(
value
){

if(!value) return -1;

const target =
new Date(value);

if(
Number.isNaN(
target.getTime()
)
){

return -1;

}

const today =
new Date();

today.setHours(
0,0,0,0
);

target.setHours(
0,0,0,0
);

return Math.ceil(
(
target - today
) /
86400000
);

}


function formatDate(
value
){

const d =
new Date(value);

if(
Number.isNaN(
d.getTime()
)
){

return String(value);

}

return d.toLocaleDateString(
undefined,
{
year:"numeric",
month:"short",
day:"numeric"
}
);

}


function label(
value
){

if(!value) return "";

return String(value)
.replace(
/[-_]/g,
" "
)
.replace(
/\b\w/g,
x => x.toUpperCase()
);

}


function safeUrl(
value
){

if(!value) return "#";

try{

const url =
new URL(value);

if(
url.protocol === "http:" ||
url.protocol === "https:"
){

return url.href;

}

}catch(e){}

return "#";

}


function escapeHTML(
value
){

return String(
value ?? ""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

   DEMO DATA
========================= */

];

}

</script>

</body>
</html>
