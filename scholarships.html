<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Scholarships | LetsStudy Pro</title>
<meta name="description"
content="Find scholarships, fully funded opportunities and study opportunities on LetsStudy Pro.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f8fb;
  color:#172033;
  font-family:Inter,Arial,sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

.top{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#155eef;
}

.top-link{
  font-size:13px;
  font-weight:700;
}

.hero{
  background:linear-gradient(135deg,#155eef,#0b4acb);
  color:#fff;
  padding:45px 20px;
}

.hero-inner{
  max-width:1100px;
  margin:auto;
}

.hero h1{
  margin:0 0 10px;
  font-size:36px;
}

.hero p{
  margin:0;
  color:#dbe7ff;
  max-width:650px;
  line-height:1.7;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 20px;
}

.filters{
  background:#fff;
  padding:15px;
  border:1px solid #e5e7eb;
  border-radius:14px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:10px;
  margin-bottom:20px;
}

input,
select{
  width:100%;
  padding:11px;
  border:1px solid #d9dee8;
  border-radius:9px;
  outline:none;
  background:#fff;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#155eef;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 30px #0000000d;
}

.image{
  height:180px;
  background:#e9eef7;
  position:relative;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.featured{
  position:absolute;
  top:12px;
  left:12px;
  background:#f59e0b;
  color:#fff;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.card-body{
  padding:16px;
}

.university{
  color:#155eef;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.card h2{
  font-size:17px;
  margin:0 0 8px;
  line-height:1.4;
}

.description{
  color:#667085;
  font-size:13px;
  line-height:1.6;
  min-height:42px;
}

.tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:12px 0;
}

.tag{
  background:#f2f4f7;
  padding:6px 8px;
  border-radius:20px;
  font-size:10px;
  color:#475467;
}

.deadline{
  display:flex;
  align-items:center;
  gap:7px;
  color:#b42318;
  font-size:12px;
  font-weight:700;
  margin:10px 0;
}

.amount{
  font-size:17px;
  font-weight:800;
  margin:10px 0;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.actions a{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}

.view{
  background:#eef2f6;
}

.apply{
  background:#155eef;
  color:#fff;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  background:#fff;
  border-radius:14px;
  border:1px solid #e5e7eb;
  color:#667085;
}

.loading{
  text-align:center;
  padding:70px;
  color:#667085;
}

.count{
  font-size:13px;
  color:#667085;
  margin-bottom:12px;
}

@media(max-width:900px){

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .hero h1{
    font-size:28px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .container{
    padding:0 15px;
  }

}
</style>
</head>


<body>

<header class="top">

  <a href="index.html" class="logo">
    LetsStudy Pro
  </a>

  <a href="scholarships.html" class="top-link">
    <i class="fa-solid fa-graduation-cap"></i>
    Scholarships
  </a>

</header>


<section class="hero">

  <div class="hero-inner">

    <h1>Scholarship Opportunities</h1>

    <p>
      Discover scholarships, fully funded opportunities,
      university funding and study opportunities from around
      the world.
    </p>

  </div>

</section>


<main class="container">

  <section class="filters">

    <input
      id="search"
      placeholder="Search scholarships, universities..."
    >

    <select id="country">
      <option value="">All Countries</option>
    </select>

    <select id="level">
      <option value="">All Levels</option>
    </select>

    <select id="funding">
      <option value="">All Funding</option>
    </select>

    <button
      class="primary"
      id="clear">
      Clear
    </button>

  </section>


  <div class="count" id="count">
    Loading scholarships...
  </div>


  <section id="list" class="grid">

    <div class="loading">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <p>Loading scholarships...</p>
    </div>

  </section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   STATE
========================= */

let scholarships = [];


/* =========================
   DOM
========================= */

const list =
  document.getElementById("list");

const search =
  document.getElementById("search");

const country =
  document.getElementById("country");

const level =
  document.getElementById("level");

const funding =
  document.getElementById("funding");

const count =
  document.getElementById("count");


/* =========================
   SECURITY
========================= */

function esc(value=""){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   LOAD SCHOLARSHIPS
========================= */

async function loadScholarships(){

  try{

    const snap =
      await getDocs(
        collection(
          db,
          "scholarships"
        )
      );


    scholarships = [];


    snap.forEach(item=>{

      scholarships.push({

        id:item.id,

        ...item.data()

      });

    });


    /*
      Public page should show
      published scholarships only.
    */

    scholarships =
      scholarships.filter(
        item =>
          item.status === "published"
          || item.status === undefined
      );


    buildFilters();

    render();


  }catch(error){

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-triangle-exclamation"></i>

        <p>
          Unable to load scholarships.
        </p>
      </div>
    `;

    count.textContent =
      "Unable to load scholarships.";

  }

}


/* =========================
   FILTER OPTIONS
========================= */

function buildFilters(){

  const countries =
    [...new Set(
      scholarships
        .map(x=>x.country)
        .filter(Boolean)
    )].sort();


  const levels =
    [...new Set(
      scholarships
        .map(x=>x.level)
        .filter(Boolean)
    )].sort();


  const fundingTypes =
    [...new Set(
      scholarships
        .map(x=>x.fundingType)
        .filter(Boolean)
    )].sort();


  country.innerHTML =
    `<option value="">
      All Countries
    </option>` +

    countries.map(x=>`
      <option value="${esc(x)}">
        ${esc(x)}
      </option>
    `).join("");


  level.innerHTML =
    `<option value="">
      All Levels
    </option>` +

    levels.map(x=>`
      <option value="${esc(x)}">
        ${esc(x)}
      </option>
    `).join("");


  funding.innerHTML =
    `<option value="">
      All Funding
    </option>` +

    fundingTypes.map(x=>`
      <option value="${esc(x)}">
        ${esc(x)}
      </option>
    `).join("");

}


/* =========================
   RENDER
========================= */

function render(){

  const keyword =
    search.value
      .toLowerCase()
      .trim();


  const selectedCountry =
    country.value;

  const selectedLevel =
    level.value;

  const selectedFunding =
    funding.value;


  const filtered =
    scholarships.filter(item=>{

      const text = `

        ${item.title || ""}

        ${item.university || ""}

        ${item.country || ""}

        ${item.studyArea || ""}

        ${item.category || ""}

        ${item.description || ""}

      `.toLowerCase();


      return (

        text.includes(keyword)

        &&

        (
          !selectedCountry
          ||
          item.country === selectedCountry
        )

        &&

        (
          !selectedLevel
          ||
          item.level === selectedLevel
        )

        &&

        (
          !selectedFunding
          ||
          item.fundingType === selectedFunding
        )

      );

    });


  count.textContent =
    `${filtered.length} scholarship${
      filtered.length===1 ? "" : "s"
    } found`;


  if(!filtered.length){

    list.innerHTML = `
      <div class="empty">

        <i class="fa-solid fa-magnifying-glass"></i>

        <h3>
          No scholarships found
        </h3>

        <p>
          Try changing your search or filters.
        </p>

      </div>
    `;

    return;

  }


  /*
    Featured scholarships first.
  */

  filtered.sort(
    (a,b)=>
      Number(b.featured||false)
      -
      Number(a.featured||false)
  );


  list.innerHTML =

    filtered.map(item=>{

      const image =
        item.imageUrl
        ||
        "https://via.placeholder.com/700x400?text=Scholarship";


      return `

      <article class="card">

        <div class="image">

          <img
            src="${esc(image)}"
            alt="${esc(item.title||"Scholarship")}"
            loading="lazy"
          >

          ${
            item.featured
            ?
            `<span class="featured">
              <i class="fa-solid fa-star"></i>
              Featured
            </span>`
            :
            ""
          }

        </div>


        <div class="card-body">

          ${
            item.university
            ?
            `<div class="university">
              ${esc(item.university)}
            </div>`
            :
            ""
          }


          <h2>
            ${esc(
              item.title ||
              "Scholarship Opportunity"
            )}
          </h2>


          <div class="description">

            ${esc(
              item.shortDescription ||
              item.description ||
              "Scholarship opportunity available."
            )}

          </div>


          <div class="tags">

            ${
              item.country
              ?
              `<span class="tag">
                <i class="fa-solid fa-location-dot"></i>
                ${esc(item.country)}
              </span>`
              :
              ""
            }


            ${
              item.level
              ?
              `<span class="tag">
                ${esc(item.level)}
              </span>`
              :
              ""
            }


            ${
              item.fundingType
              ?
              `<span class="tag">
                ${esc(item.fundingType)}
              </span>`
              :
              ""
            }

          </div>


          ${
            item.amount
            ?
            `<div class="amount">

              <i class="fa-solid fa-coins"></i>

              ${esc(
                item.currency ||
                ""
              )}

              ${Number(
                item.amount
              ).toLocaleString()}

            </div>`
            :
            ""
          }


          ${
            item.deadline
            ?
            `<div class="deadline">

              <i class="fa-regular fa-clock"></i>

              Deadline:
              ${formatDate(item.deadline)}

            </div>`
            :
            ""
          }


          <div class="actions">

            <a
              class="view"
              href="scholarship.html?scholarshipId=${encodeURIComponent(item.id)}">

              <i class="fa-solid fa-eye"></i>

              View Details

            </a>


            ${
              item.applicationUrl
              ?
              `<a
                class="apply"
                href="${esc(item.applicationUrl)}"
                target="_blank"
                rel="noopener">

                Apply

                <i class="fa-solid fa-arrow-up-right-from-square"></i>

              </a>`
              :
              ""
            }

          </div>

        </div>

      </article>

      `;

    }).join("");

}


/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value)return "";

  try{

    let date;

    if(
      typeof value === "object"
      &&
      value.seconds
    ){

      date =
        new Date(
          value.seconds * 1000
        );

    }else{

      date =
        new Date(value);

    }


    if(isNaN(date.getTime()))
      return esc(value);


    return date.toLocaleDateString(
      "en-GB",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    );

  }catch{

    return esc(value);

  }

}


/* =========================
   EVENTS
========================= */

search.addEventListener(
  "input",
  render
);

country.addEventListener(
  "change",
  render
);

level.addEventListener(
  "change",
  render
);

funding.addEventListener(
  "change",
  render
);


document
  .getElementById("clear")
  .addEventListener(
    "click",
    ()=>{

      search.value="";
      country.value="";
      level.value="";
      funding.value="";

      render();

    }
  );


/* =========================
   START
========================= */

loadScholarships();

</script>

</body>
</html>
