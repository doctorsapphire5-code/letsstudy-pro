<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Search | LetsStudy Pro</title>

<meta name="description"
content="Search courses, resources and community content on LetsStudy Pro.">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#0f172a;
}

a{
text-decoration:none;
color:inherit;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:14px 22px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
position:sticky;
top:0;
z-index:20;
}

.logo{
font-size:19px;
font-weight:900;
color:#2563eb;
}

nav{
display:flex;
gap:7px;
flex-wrap:wrap;
}

nav a{
font-size:12px;
font-weight:800;
padding:9px 11px;
border-radius:8px;
}

nav a:hover{
background:#eff6ff;
color:#2563eb;
}

.container{
max-width:1100px;
margin:auto;
padding:28px 16px;
}

.hero{
margin-bottom:20px;
}

.hero h1{
font-size:28px;
margin-bottom:7px;
}

.hero p{
font-size:13px;
color:#64748b;
line-height:1.6;
}

.search-box{
background:#fff;
border:1px solid #e2e8f0;
border-radius:16px;
padding:17px;
display:flex;
gap:9px;
margin-bottom:18px;
}

.search-box input{
flex:1;
padding:13px;
border:1px solid #cbd5e1;
border-radius:9px;
font-size:13px;
outline:none;
}

.search-box input:focus{
border-color:#2563eb;
}

.search-btn{
border:0;
background:#2563eb;
color:#fff;
padding:0 20px;
border-radius:9px;
font-weight:900;
cursor:pointer;
}

.filters{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:18px;
}

.filters button{
border:1px solid #cbd5e1;
background:#fff;
padding:9px 13px;
border-radius:20px;
font-size:11px;
font-weight:800;
cursor:pointer;
}

.filters button.active,
.filters button:hover{
background:#2563eb;
color:#fff;
border-color:#2563eb;
}

.status{
font-size:12px;
color:#64748b;
margin-bottom:14px;
}

.results{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.result{
background:#fff;
border:1px solid #e2e8f0;
border-radius:15px;
padding:17px;
transition:.2s;
}

.result:hover{
transform:translateY(-2px);
box-shadow:0 8px 25px rgba(15,23,42,.07);
}

.type{
display:inline-block;
font-size:9px;
font-weight:900;
padding:5px 8px;
border-radius:20px;
background:#dbeafe;
color:#1d4ed8;
margin-bottom:10px;
}

.result h3{
font-size:15px;
margin-bottom:7px;
}

.result p{
font-size:11px;
color:#64748b;
line-height:1.6;
min-height:36px;
}

.meta{
font-size:10px;
color:#94a3b8;
margin:12px 0;
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
padding:9px 12px;
border-radius:8px;
font-size:11px;
font-weight:900;
background:#2563eb;
color:#fff;
}

.empty{
display:none;
background:#fff;
border:1px dashed #cbd5e1;
border-radius:15px;
padding:35px;
text-align:center;
color:#64748b;
font-size:13px;
}

.loading{
text-align:center;
padding:35px;
color:#64748b;
}

footer{
margin-top:35px;
padding:20px 0;
border-top:1px solid #e2e8f0;
display:flex;
justify-content:space-between;
font-size:11px;
color:#64748b;
}

footer a{
color:#2563eb;
font-weight:800;
}

@media(max-width:850px){
.results{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:600px){

header{
flex-direction:column;
align-items:flex-start;
}

nav{
width:100%;
}

.container{
padding:20px 13px;
}

.search-box{
flex-direction:column;
}

.search-btn{
height:43px;
}

.results{
grid-template-columns:1fr;
}

footer{
flex-direction:column;
gap:8px;
}

}

</style>

</head>

<body>


<header>

<a href="dashboard.html" class="logo">
LetsStudy Pro
</a>

<nav>

<a href="courses.html">
Courses
</a>

<a href="resources.html">
Resources
</a>

<a href="community.html">
Community
</a>

<a href="dashboard.html">
Dashboard
</a>

</nav>

</header>


<main class="container">


<section class="hero">

<h1>
Search LetsStudy Pro
</h1>

<p>
Find courses, learning resources and community content
from one place.
</p>

</section>


<section class="search-box">

<input
id="searchInput"
type="search"
placeholder="Search courses, resources, posts..."
autocomplete="off">

<button
id="searchBtn"
class="search-btn">

Search

</button>

</section>


<div class="filters">

<button
class="active"
data-type="all">

All

</button>

<button
data-type="course">

Courses

</button>

<button
data-type="resource">

Resources

</button>

<button
data-type="post">

Community Posts

</button>

</div>


<div
id="status"
class="status">

Enter something to search.

</div>


<section
id="results"
class="results">
</section>


<div
id="empty"
class="empty">

<h3>
No results found
</h3>

<p style="margin-top:7px">
Try a different keyword.
</p>

</div>


<footer>

<div>
© <span id="year"></span> LetsStudy Pro
</div>

<div>

<a href="courses.html">
Courses
</a>

&nbsp;•&nbsp;

<a href="resources.html">
Resources
</a>

&nbsp;•&nbsp;

<a href="community.html">
Community
</a>

&nbsp;•&nbsp;

<a href="dashboard.html">
Dashboard
</a>

</div>

</footer>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
limit,
query
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
FIREBASE
========================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAXKXbljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ==========================================
ELEMENTS
========================================== */

const input =
document.getElementById("searchInput");

const searchBtn =
document.getElementById("searchBtn");

const results =
document.getElementById("results");

const status =
document.getElementById("status");

const empty =
document.getElementById("empty");

const filterButtons =
document.querySelectorAll(
".filters button"
);


let activeFilter =
"all";

let allResults = [];


/* ==========================================
AUTH
========================================== */

onAuthStateChanged(
auth,
user => {

console.log(
user
? "User authenticated"
: "Guest user"
);

});


/* ==========================================
SEARCH
========================================== */

async function performSearch(){

const term =
input.value
.trim()
.toLowerCase();


if(!term){

results.innerHTML = "";

empty.style.display =
"none";

status.textContent =
"Enter something to search.";

return;

}


status.textContent =
"Searching...";

results.innerHTML = "";

empty.style.display =
"none";


try{

allResults = [];


/* ========================================
COURSES
======================================== */

if(
activeFilter === "all" ||
activeFilter === "course"
){

const snap =
await getDocs(
query(
collection(db,"courses"),
limit(100)
)
);


snap.forEach(doc => {

const data =
doc.data();

const text =
(
(data.title || "") +
" " +
(data.description || "") +
" " +
(data.category || "")
).toLowerCase();


if(text.includes(term)){

allResults.push({

id:doc.id,

type:"course",

title:
data.title ||
"Course",

description:
data.description ||
"Explore this course.",

category:
data.category ||
"Course",

url:
"item.html?id=" +
encodeURIComponent(doc.id)

});

}

});

}


/* ========================================
RESOURCES
======================================== */

if(
activeFilter === "all" ||
activeFilter === "resource"
){

const snap =
await getDocs(
query(
collection(db,"resources"),
limit(100)
)
);


snap.forEach(doc => {

const data =
doc.data();

const text =
(
(data.title || "") +
" " +
(data.description || "") +
" " +
(data.category || "")
).toLowerCase();


if(text.includes(term)){

allResults.push({

id:doc.id,

type:"resource",

title:
data.title ||
"Resource",

description:
data.description ||
"Learning resource.",

category:
data.category ||
"Resource",

url:
"resources-details.html?id=" +
encodeURIComponent(doc.id)

});

}

});

}


/* ========================================
COMMUNITY POSTS
======================================== */

if(
activeFilter === "all" ||
activeFilter === "post"
){

const snap =
await getDocs(
query(
collection(db,"posts"),
limit(100)
)
);


snap.forEach(doc => {

const data =
doc.data();

const text =
(
(data.title || "") +
" " +
(data.content || "") +
" " +
(data.category || "")
).toLowerCase();


if(text.includes(term)){

allResults.push({

id:doc.id,

type:"post",

title:
data.title ||
"Community Post",

description:
data.content ||
"View this community post.",

category:
data.category ||
"Community",

url:
"post-details.html?id=" +
encodeURIComponent(doc.id)

});

}

});

}


renderResults();

}catch(error){

console.error(
"Search error:",
error
);

status.textContent =
"Search could not be completed.";

results.innerHTML = "";

empty.style.display =
"block";

}

}


/* ==========================================
RENDER RESULTS
========================================== */

function renderResults(){

results.innerHTML = "";


if(!allResults.length){

status.textContent =
"No results found.";

empty.style.display =
"block";

return;

}


empty.style.display =
"none";

status.textContent =
`${allResults.length} result${
allResults.length === 1 ? "" : "s"
} found`;


allResults.forEach(item => {

const card =
document.createElement("article");

card.className =
"result";


card.innerHTML = `

<span class="type">
${typeName(item.type)}
</span>

<h3>
${escapeHTML(item.title)}
</h3>

<p>
${escapeHTML(
truncate(item.description,120)
)}
</p>

<div class="meta">
${escapeHTML(item.category)}
</div>

<a
class="btn"
href="${item.url}">

View

</a>

`;


results.appendChild(card);

});

}


/* ==========================================
FILTERS
========================================== */

filterButtons.forEach(button => {

button.addEventListener(
"click",
() => {

filterButtons.forEach(
b => b.classList.remove("active")
);

button.classList.add("active");

activeFilter =
button.dataset.type;


if(input.value.trim()){

performSearch();

}

});

});


/* ==========================================
SEARCH EVENTS
========================================== */

searchBtn.addEventListener(
"click",
performSearch
);


input.addEventListener(
"keydown",
event => {

if(event.key === "Enter"){

performSearch();

}

});


let timer;

input.addEventListener(
"input",
() => {

clearTimeout(timer);

timer =
setTimeout(
performSearch,
400
);

});


/* ==========================================
HELPERS
========================================== */

function typeName(type){

if(type === "course")
return "COURSE";

if(type === "resource")
return "RESOURCE";

return "COMMUNITY POST";

}


function truncate(
text,
length
){

text =
String(text);

return text.length > length
? text.substring(0,length) + "..."
: text;

}


function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==========================================
YEAR
========================================== */

document.getElementById(
"year"
).textContent =
new Date().getFullYear();

</script>

</body>
</html>
