
<!DOCTYPE html>

<head>

<title>LetsStudy Pro</title>

<style>

/* =================================
   RESET
================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}


/* =================================
   HEADER
================================= */

.header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:70px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  padding:0 20px;
  z-index:900;
}

.menu-button{
  display:none;
  width:42px;
  height:42px;
  border:0;
  border-radius:10px;
  background:#f1f5f9;
  font-size:22px;
  cursor:pointer;
}

.header-brand{
  font-size:25px;
  font-weight:900;
  color:#111827;
  text-decoration:none;
  letter-spacing:-1px;
}


/* =================================
   SIDEBAR
================================= */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:280px;
  background:#111827;
  color:#fff;
  z-index:1000;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  box-shadow:4px 0 25px rgba(0,0,0,.15);
}


/* BRAND */

.sidebar-brand{
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 15px;
  background:#0b1220;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand{
  font-size:34px;
  font-weight:900;
  color:#fff;
  letter-spacing:-1.8px;
  white-space:nowrap;
}


/* CLOSE */

.close-sidebar{
  display:none;
  position:absolute;
  top:15px;
  right:15px;
  width:38px;
  height:38px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:20px;
  cursor:pointer;
}


/* MENU */

.sidebar-menu{
  flex:1;
  padding:16px 14px;
}

.sidebar-title{
  padding:16px 11px 8px;
  color:#94a3b8;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
}

.sidebar-menu a{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 13px;
  margin:4px 0;
  border-radius:10px;
  color:#dbe3ef;
  text-decoration:none;
  font-size:15px;
  font-weight:600;
  transition:.2s;
}

.sidebar-menu a:hover{
  background:rgba(255,255,255,.08);
  color:#fff;
}

.sidebar-menu a.active{
  background:#2563eb;
  color:#fff;
}

.sidebar-icon{
  width:24px;
  min-width:24px;
  text-align:center;
  font-size:18px;
}


/* BOTTOM */

.sidebar-bottom{
  padding:15px;
  border-top:1px solid rgba(255,255,255,.08);
}

.auth-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}


/* CONTENT OFFSET */

.page-content{
  margin-left:280px;
  padding-top:70px;
}


/* OVERLAY */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:999;
}


/* =================================
   MOBILE
================================= */

@media(max-width:800px){

  .header{
    padding:0 15px;
  }

  .menu-button{
    display:block;
    margin-right:12px;
  }

  .header-brand{
    font-size:21px;
  }

  .sidebar{
    width:290px;
    transform:translateX(-100%);
    transition:transform .25s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .close-sidebar{
    display:block;
  }

  .brand{
    font-size:30px;
  }

  .page-content{
    margin-left:0;
  }

  .overlay.open{
    display:block;
  }

}

</style>

</head>


<body>


<!-- =================================
     HEADER
================================= -->

<header class="header">

  <!-- CLOSE -->

  <button

  <!-- MENU -->

  <div class="sidebar-menu">


    <div class="sidebar-title">

    </div>


    <a href="automation.html">

    <a href="ai.html">

      </span>

      <span>

      </span>

    </a>


    <a href="premium.html">

      <span class="sidebar-icon">

      </span>

      <span>

    </a>


    <a href="pricing.html">

      <span class="sidebar-icon">

      </span>

      <span>

    </a>


    <div class="sidebar-title">

    </div>


    <a href="edit-profile.html">

      <span class="sidebar-icon">

      </span>

      <span>

      </span>

    </a>


    <a href="subscription.html">

      <span class="sidebar-icon">

      <span>

    <a href="wallet.html">

      </span>

    <a href="skills.html">

    <a href="settings.html">

<!-- =================================
     SIDEBAR SCRIPT
================================= -->

<script>

const sidebar =
  document.getElementById("sidebar");

const menuButton =
  document.getElementById("menuButton");

const closeSidebar =
  document.getElementById("closeSidebar");

const overlay =
  document.getElementById("overlay");


/* OPEN */

menuButton.onclick = () => {

  sidebar.classList.add("open");

  overlay.classList.add("open");

};


/* CLOSE */

closeSidebar.onclick = () => {

  sidebar.classList.remove("open");

  overlay.classList.remove("open");

};


/* OVERLAY */

overlay.onclick = () => {

  sidebar.classList.remove("open");

  overlay.classList.remove("open");

};


/* CLOSE AFTER LINK */

document
  .querySelectorAll(".sidebar-menu a")
  .forEach(link => {

    link.addEventListener("click", () => {

      sidebar.classList.remove("open");

      overlay.classList.remove("open");

    });

  });


/* ACTIVE PAGE */

const currentPage =
  location.pathname
    .split("/")
    .pop()
    .toLowerCase();


document
  .querySelectorAll(".sidebar-menu a")
  .forEach(link => {

    const href =
      link.getAttribute("href");

    if(
      href &&
      href.toLowerCase() === currentPage
    ){

      link.classList.add("active");

    }

  });


/* LOGIN */

document
  .getElementById("authButton")
  .onclick = () => {

    location.href =
      "login.html";

  };

</script>

</header>

<main>
  <div class="searchwrap">
    <form id="searchForm" class="searchbox">
      <input id="searchInput" type="search"
             placeholder="Search LetsStudy Pro..."
             autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div id="filters" class="filters"></div>
  <section id="results"></section>
</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const input = document.getElementById("searchInput");
const form = document.getElementById("searchForm");
const results = document.getElementById("results");
const filters = document.getElementById("filters");
const suggestions = document.getElementById("suggestions");

const COLLECTIONS = [
  "courses",
  "resources",
  "scholarships",
  "careers",
  "videos",
  "services",
  "businesses",
  "community",
  "marketplace",
  "profiles",
  "freelancers",
  "websites",
  "ads",
  "sponsors"
];

const PAGE_MAP = {
  courses:"course-details.html",
  resources:"resources-details.html",
  scholarships:"scholarships-details.html",
  careers:"career-details.html",
  videos:"video-details.html",
  services:"service-details.html",
  businesses:"business-details.html",
  community:"community-details.html",
  marketplace:"marketplace-details.html",
  profiles:"profile-details.html",
  freelancers:"freelancer-details.html",
  websites:"website-details.html",
  ads:"ads-details.html",
  sponsors:"sponsor-details.html"
};

let SEARCH_INDEX = [];
let currentType = "all";

function text(v){
  return String(v ?? "").trim();
}

function title(data,id){
  return text(
    data.title ||
    data.name ||
    data.courseName ||
    data.resourceName ||
    data.scholarshipName ||
    data.careerName ||
    data.businessName ||
    data.videoName ||
    data.serviceName ||
    data.displayName ||
    data.username ||
    id
  );
}

function description(data){
  return text(
    data.description ||
    data.summary ||
    data.excerpt ||
    data.about ||
    data.bio ||
    ""
  ).slice(0,140);
}

function image(data){
  return text(
    data.thumbnail ||
    data.image ||
    data.imageUrl ||
    data.coverImage ||
    ""
  );
}

function destination(item){
  const page = PAGE_MAP[item.collectionId];

  if(!page) return text(item.url || item.link || "#");

  return page + "?id=" +
    encodeURIComponent(item.documentId);
}

async function loadSearchData(){

  SEARCH_INDEX = [];

  const jobs = COLLECTIONS.map(async collectionId => {

    try{

      const snapshot =
        await getDocs(collection(db,collectionId));

      snapshot.forEach(docSnap => {

        const data = docSnap.data() || {};

        /*
          IMPORTANT:
          Firebase document ID comes directly from docSnap.id.
        */

        const documentId = docSnap.id;

        SEARCH_INDEX.push({
          ...data,
          id: documentId,
          documentId: documentId,
          collectionId: collectionId,
          collection: collectionId,
          title: title(data,documentId),
          description: description(data),
          image: image(data),
          searchText:
            JSON.stringify(data).toLowerCase()
        });

      });

    }catch(error){

      console.error(
        "Firestore collection failed:",
        collectionId,
        error
      );

    }

  });

  await Promise.all(jobs);

  createFilters();
  render();
}

function createFilters(){

  filters.innerHTML = "";

  addFilter("all","All");

  COLLECTIONS.forEach(collectionId => {

    if(
      SEARCH_INDEX.some(
        item => item.collectionId === collectionId
      )
    ){
      addFilter(
        collectionId,
        collectionId.charAt(0).toUpperCase() +
        collectionId.slice(1)
      );
    }

  });

}

function addFilter(type,label){

  const button = document.createElement("button");

  button.className =
    "filter" +
    (currentType === type ? " active" : "");

  button.textContent = label;

  button.onclick = () => {

    currentType = type;

    createFilters();
    render();

  };

  filters.appendChild(button);
}

function score(item,query){

  if(!query) return 0;

  const q = query.toLowerCase();
  const t = item.title.toLowerCase();
  const d = item.description.toLowerCase();
  const s = item.searchText;

  let score = 0;

  if(t === q) score += 1000;
  if(t.startsWith(q)) score += 500;
  if(t.includes(q)) score += 300;
  if(d.includes(q)) score += 120;
  if(s.includes(q)) score += 40;

  q.split(/\s+/).forEach(word => {

    if(word && t.includes(word)) score += 100;
    if(word && d.includes(word)) score += 30;

  });

  return score;
}

function render(){

  const query =
    input.value.trim().toLowerCase();

  let data = SEARCH_INDEX.filter(item => {

    if(
      currentType !== "all" &&
      item.collectionId !== currentType
    ) return false;

    if(!query) return true;

    return score(item,query) > 0;

  });

  data.sort((a,b) =>
    score(b,query) - score(a,query)
  );

  results.innerHTML = "";

  data.forEach(item => {

    const article =
      document.createElement("article");

    article.className = "result";

    article.innerHTML = `
      ${
        item.image
        ? `<img src="${item.image}" alt="">`
        : ""
      }
      <h3>${escapeHTML(item.title)}</h3>
      <p>${escapeHTML(item.description)}</p>
      <div class="meta">
        ${escapeHTML(item.collectionId)}
      </div>
    `;

    article.onclick = () => {

      window.location.href =
        destination(item);

    };

    results.appendChild(article);

  });

  updateSuggestions(query);
}

function updateSuggestions(query){

  if(!query){

    suggestions.style.display = "none";
    return;

  }

  const matches =
    SEARCH_INDEX
      .filter(item =>
        item.title.toLowerCase().includes(query)
      )
      .sort((a,b) =>
        score(b,query) - score(a,query)
      )
      .slice(0,6);

  if(!matches.length){

    suggestions.style.display = "none";
    return;

  }

  suggestions.innerHTML = "";

  matches.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "suggestion";
    div.textContent = item.title;

    div.onclick = () => {

      input.value = item.title;
      suggestions.style.display = "none";
      render();

    };

    suggestions.appendChild(div);

  });

  suggestions.style.display = "block";
}

function escapeHTML(value){

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

form.addEventListener("submit",event => {

  event.preventDefault();
  suggestions.style.display = "none";
  render();

});

input.addEventListener("input",render);

document.addEventListener("click",event => {

  if(!event.target.closest(".searchwrap")){
    suggestions.style.display = "none";
  }

});

loadSearchData();

</script>

</body>
