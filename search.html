<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Search courses, resources, scholarships, careers, videos, services, businesses and more on LetsStudy Pro."
  >

  <meta
    name="robots"
    content="index, follow"
  >

    name="theme-color"
    content="#2563eb"
  >

  <title>Search — LetsStudy Pro</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:#f5f7fb;
      color:#172033;

      overflow-x:hidden;
    }

    button,
    input{
      font:inherit;
    }

    /* =========================================
       HEADER
    ========================================= */

    .header{
      position:fixed;
      top:0;
      left:0;
      right:0;

      height:70px;

      background:#fff;

      border-bottom:
        1px solid #e5e7eb;

      display:flex;
      align-items:center;

      padding:
        0 20px;

      z-index:900;
    }

    .menu-button{
      display:none;

      width:42px;
      height:42px;

      border:0;
      border-radius:10px;

      background:#f1f5f9;

      font-size:22px;

      cursor:pointer;

      align-items:center;
      justify-content:center;
    }

    .menu-button:hover{
      background:#e2e8f0;
    }

    .header-brand{
      font-size:25px;
      font-weight:900;

      color:#111827;

      text-decoration:none;

      letter-spacing:-1px;

      white-space:nowrap;
    }

    /* =========================================
       SIDEBAR
    ========================================= */

    .sidebar{
      position:fixed;

      top:0;
      left:0;
      bottom:0;

      width:280px;

      background:#111827;

      color:#fff;

      z-index:1000;

      display:flex;
      flex-direction:column;

      overflow-y:auto;

      -webkit-overflow-scrolling:touch;

      box-shadow:
        4px 0 25px
        rgba(0,0,0,.15);
    }

    .sidebar-brand{
      min-height:150px;

      display:flex;

      align-items:center;
      justify-content:center;

      padding:25px 15px;

      background:#0b1220;

      border-bottom:
        1px solid
        rgba(255,255,255,.08);

      flex-shrink:0;
    }

    .brand{
      font-size:34px;
      font-weight:900;

      color:#fff;

      letter-spacing:-1.8px;

      white-space:nowrap;
    }

    .close-sidebar{
      display:none;

      position:absolute;

      top:15px;
      right:15px;

      width:38px;
      height:38px;

      border:0;
      border-radius:9px;

      background:
        rgba(255,255,255,.1);

      color:#fff;

      font-size:20px;

      cursor:pointer;

      align-items:center;
      justify-content:center;
    }

    .close-sidebar:hover{
      background:
        rgba(255,255,255,.18);
    }

    .sidebar-menu{
      flex:1;

      padding:16px 14px;
    }

    .sidebar-title{
      padding:
        16px 11px 8px;

      color:#94a3b8;

      font-size:11px;
      font-weight:800;

      text-transform:uppercase;

      letter-spacing:1px;
    }

    .sidebar-menu a{
      display:flex;

      align-items:center;

      gap:13px;

      padding:
        12px 13px;

      margin:4px 0;

      border-radius:10px;

      color:#dbe3ef;

      text-decoration:none;

      font-size:15px;
      font-weight:600;

      transition:.2s;
    }

    .sidebar-menu a:hover{
      background:
        rgba(255,255,255,.08);

      color:#fff;
    }

    .sidebar-menu a.active{
      background:#2563eb;
      color:#fff;
    }

    .sidebar-icon{
      width:24px;
      min-width:24px;

      text-align:center;

      font-size:18px;
    }

    .sidebar-bottom{
      padding:15px;

      border-top:
        1px solid
        rgba(255,255,255,.08);

      flex-shrink:0;
    }

    .auth-btn{
      width:100%;

      padding:13px;

      border:0;
      border-radius:10px;

      background:#2563eb;

      color:#fff;

      font-size:15px;
      font-weight:700;

      cursor:pointer;
    }

    .auth-btn:hover{
      background:#1d4ed8;
    }

    /* =========================================
       CONTENT
    ========================================= */

    .page-content{
      margin-left:280px;

      padding-top:70px;

      min-height:100vh;

      width:
        calc(100% - 280px);
    }

    main{
      width:100%;

      max-width:1200px;

      margin:0 auto;

      padding:
        35px 25px 60px;
    }

    .page-title{
      text-align:center;

      font-size:30px;

      color:#111827;

      margin-bottom:8px;
    }

    .page-subtitle{
      text-align:center;

      color:#64748b;

      font-size:14px;

      margin-bottom:25px;
    }

    /* =========================================
       SEARCH
    ========================================= */

    .searchwrap{
      position:relative;

      width:100%;

      max-width:850px;

      margin:
        0 auto 25px;
    }

    .searchbox{
      display:flex;

      gap:10px;

      width:100%;
    }

    .searchbox input{
      flex:1;

      min-width:0;

      height:52px;

      padding:
        0 17px;

      border:
        1px solid #d1d5db;

      border-radius:12px;

      outline:none;

      background:#fff;

      color:#111827;

      font-size:16px;
    }

    .searchbox input::placeholder{
      color:#94a3b8;
    }

    .searchbox input:focus{
      border-color:#2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37,99,235,.12);
    }

    .searchbox button{
      height:52px;

      padding:
        0 22px;

      border:0;

      border-radius:12px;

      background:#2563eb;

      color:#fff;

      font-weight:700;

      cursor:pointer;

      white-space:nowrap;
    }

    .searchbox button:hover{
      background:#1d4ed8;
    }

    /* =========================================
       SUGGESTIONS
    ========================================= */

    .suggestions{
      position:absolute;

      top:62px;

      left:0;
      right:0;

      background:#fff;

      border:
        1px solid #e5e7eb;

      border-radius:12px;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.12);

      overflow:hidden;

      display:none;

      z-index:50;

      max-height:330px;

      overflow-y:auto;
    }

    .suggestion{
      width:100%;

      display:block;

      padding:
        13px 16px;

      border:0;

      border-bottom:
        1px solid #f1f5f9;

      background:#fff;

      color:#172033;

      text-align:left;

      cursor:pointer;
    }

    .suggestion:last-child{
      border-bottom:0;
    }

    .suggestion:hover{
      background:#f1f5f9;
    }

    .suggestion-title{
      display:block;

      font-weight:700;

      overflow:hidden;

      text-overflow:ellipsis;

      white-space:nowrap;
    }

    .suggestion-type{
      display:block;

      margin-top:3px;

      color:#64748b;

      font-size:11px;

      font-weight:700;

      text-transform:uppercase;
    }

    /* =========================================
       FILTERS
    ========================================= */

    .filters{
      display:flex;

      gap:8px;

      flex-wrap:wrap;

      margin:
        20px 0 30px;
    }

    .filter{
      padding:
        9px 15px;

      border:
        1px solid #d1d5db;

      border-radius:999px;

      background:#fff;

      color:#374151;

      cursor:pointer;

      font-size:13px;

      font-weight:600;

      transition:.2s;
    }

    .filter:hover{
      border-color:#2563eb;
      color:#2563eb;
    }

    .filter.active{
      background:#2563eb;

      color:#fff;

      border-color:#2563eb;
    }

    /* =========================================
       RESULTS
    ========================================= */

    #results{
      display:grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(260px,1fr)
        );

      gap:20px;
    }

    .result{
      background:#fff;

      border:
        1px solid #e5e7eb;

      border-radius:15px;

      overflow:hidden;

      cursor:pointer;

      transition:
        transform .2s ease,
        box-shadow .2s ease;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.04);

      min-width:0;
    }

    .result:hover{
      transform:
        translateY(-3px);

      box-shadow:
        0 10px 25px
        rgba(0,0,0,.1);
    }

    .result img{
      display:block;

      width:100%;

      height:160px;

      object-fit:cover;

      background:#e5e7eb;
    }

    .result-content{
      padding:17px;
    }

    .result h3{
      font-size:17px;

      line-height:1.35;

      margin-bottom:8px;

      color:#111827;

      display:-webkit-box;

      -webkit-line-clamp:2;

      -webkit-box-orient:vertical;

      overflow:hidden;
    }

    .result p{
      color:#64748b;

      font-size:14px;

      line-height:1.5;

      margin-bottom:12px;

      display:-webkit-box;

      -webkit-line-clamp:3;

      -webkit-box-orient:vertical;

      overflow:hidden;
    }

    .meta{
      display:inline-block;

      padding:
        5px 9px;

      margin-bottom:9px;

      border-radius:6px;

      background:#eff6ff;

      color:#2563eb;

      font-size:11px;

      font-weight:700;

      text-transform:uppercase;
    }

    .view-result{
      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:10px;

      color:#2563eb;

      text-decoration:none;

      font-size:13px;

      font-weight:800;
    }

    .view-result-arrow{
      font-size:18px;
    }

    /* =========================================
       EMPTY
    ========================================= */

    .empty{
      grid-column:1/-1;

      text-align:center;

      padding:60px 20px;

      background:#fff;

      border:
        1px solid #e5e7eb;

      border-radius:15px;

      color:#64748b;
    }

    .empty h3{
      color:#111827;

      margin-bottom:8px;

      font-size:20px;
    }

    .empty p{
      font-size:14px;
    }

    /* =========================================
       OVERLAY
    ========================================= */

    .overlay{
      display:none;

      position:fixed;

      inset:0;

      background:
        rgba(0,0,0,.55);

      z-index:999;
    }

    .overlay.open{
      display:block;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media(max-width:800px){

      .header{
        padding:0 15px;
      }

      .menu-button{
        display:flex;

        margin-right:12px;

        flex-shrink:0;
      }

      .header-brand{
        font-size:21px;
      }

      .sidebar{
        width:290px;

        max-width:85vw;

        transform:
          translateX(-100%);

        transition:
          transform .25s ease;
      }

      .sidebar.open{
        transform:
          translateX(0);
      }

      .close-sidebar{
        display:flex;
      }

      .brand{
        font-size:30px;
      }

      .page-content{
        margin-left:0;

        width:100%;
      }

      main{
        padding:
          25px 15px 50px;
      }

      .page-title{
        font-size:25px;
      }

      .searchbox{
        flex-direction:column;

        gap:10px;
      }

      .searchbox input{
        width:100%;

        height:50px;
      }

      .searchbox button{
        width:100%;

        height:50px;
      }

      .suggestions{
        top:112px;
      }

      #results{
        grid-template-columns:1fr;

        gap:16px;
      }

      .result img{
        height:180px;
      }
    }

    /* =========================================
       SMALL MOBILE
    ========================================= */

    @media(max-width:450px){

      .sidebar{
        width:85vw;
      }

      .brand{
        font-size:26px;
      }

      .header-brand{
        font-size:20px;
      }

      .searchbox input{
        font-size:15px;
      }

      .filter{
        padding:
          8px 12px;

        font-size:12px;
      }

      .result img{
        height:190px;
      }
    }

  </style>

</head>

  <script type="module">

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs
    }
    from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* =========================================
       FIREBASE
    ========================================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

      measurementId:
        "G-85B7V5H5J0"

    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);


    /* =========================================
       COLLECTIONS
       USIZIBADILISHE
    ========================================= */

    const COLLECTIONS = [

      "courses",

      "resources",

      "scholarships",

      "careers",

      "videos",

      "services",

      "businesses",

      "community",

      "marketplace",

      "profiles",

      "freelancers",

      "websites",

      "ads",

      "sponsors"

    ];


    /* =========================================
       DETAIL PAGE MAP
       USIZIBADILISHE
    ========================================= */

    const PAGE_MAP = {

      courses:
        "course-details.html",

      resources:
        "resources-details.html",

      scholarships:
        "scholarships-details.html",

      careers:
        "career-details.html",

      videos:
        "video-details.html",

      services:
        "service-details.html",

      businesses:
        "business-details.html",

      community:
        "community-details.html",

      marketplace:
        "marketplace-details.html",

      profiles:
        "profile-details.html",

      freelancers:
        "freelancer-details.html",

      websites:
        "website-details.html",

      ads:
        "ads-details.html",

      sponsors:
        "sponsor-details.html"

    };


    /* =========================================
       ELEMENTS
    ========================================= */

    const searchForm =
      document.getElementById(
        "searchForm"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const suggestions =
      document.getElementById(
        "suggestions"
      );

    const filters =
      document.getElementById(
        "filters"
      );

    const results =
      document.getElementById(
        "results"
      );


    /* =========================================
       STATE
    ========================================= */

    let SEARCH_INDEX = [];

    let activeFilter = "all";

    let currentQuery = "";


    /* =========================================
       HELPERS
    ========================================= */

    function text(value){

      return String(
        value ?? ""
      ).trim();

    }


    function getTitle(data,id){

      return text(

        data.title ||

        data.name ||

        data.courseName ||

        data.resourceName ||

        data.scholarshipName ||

        data.careerName ||

        data.businessName ||

        data.videoName ||

        data.serviceName ||

        data.displayName ||

        data.username ||

        id

      );

    }


    function getDescription(data){

      return text(

        data.description ||

        data.summary ||

                data.excerpt ||

        data.about ||

        data.bio ||

        data.summary ||

        data.details ||

        data.content ||

        data.text ||

        data.body ||

        data.shortDescription ||

        data.longDescription ||

        data.caption ||

        data.introduction ||

        data.overview ||

        data.objective ||

        data.requirements ||

        data.category ||

        data.subject ||

        data.courseDescription ||

        data.resourceDescription ||

        data.scholarshipDescription ||

        data.careerDescription ||

        ""
      ).slice(
        0,
        180
      );

    }


    /* =========================================
       GET IMAGE
    ========================================= */

    function getImage(data){

      return text(

        data.thumbnail ||

        data.thumbnailUrl ||

        data.image ||

        data.imageUrl ||

        data.coverImage ||

        data.cover ||

        data.photo ||

        data.logo ||

        ""

      );

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHTML(value){

      return text(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================================
       NORMALIZE SEARCH
    ========================================= */

    function normalize(value){

      return text(value)

        .toLowerCase()

        .replace(
          /[^\p{L}\p{N}\s]/gu,
          " "
        )

        .replace(
          /\s+/g,
          " "
        )

        .trim();

    }


    /* =========================================
       SEARCH WORDS
    ========================================= */

    function getWords(value){

      return normalize(value)

        .split(" ")

        .filter(
          word =>
            word.length > 1
        );

    }


    /* =========================================
       GLOBAL RELEVANCE SCORE
    ========================================= */

    function score(
      item,
      query
    ){

      const q =
        normalize(query);

      if(!q){

        return 0;

      }


      const title =
        normalize(
          item.title
        );


      const description =
        normalize(
          item.description
        );


      const searchText =
        normalize(
          item.searchText
        );


      const queryWords =
        getWords(q);


      let value = 0;


      /* EXACT TITLE */

      if(
        title === q
      ){

        value += 10000;

      }


      /* TITLE STARTS WITH QUERY */

      if(
        title.startsWith(q)
      ){

        value += 6000;

      }


      /* TITLE CONTAINS QUERY */

      if(
        title.includes(q)
      ){

        value += 4000;

      }


      /* DESCRIPTION */

      if(
        description === q
      ){

        value += 2000;

      }


      if(
        description.startsWith(q)
      ){

        value += 1200;

      }


      if(
        description.includes(q)
      ){

        value += 800;

      }


      /* WORD MATCH */

      queryWords.forEach(
        word => {

          if(
            title === word
          ){

            value += 3000;

          }
          else if(
            title.startsWith(word)
          ){

            value += 1800;

          }
          else if(
            title.includes(word)
          ){

            value += 1000;

          }

        }
      );


      /* DESCRIPTION WORD MATCH */

      queryWords.forEach(
        word => {

          if(
            description.includes(word)
          ){

            value += 250;

          }

        }
      );


      /* ALL DOCUMENT FIELDS */

      if(
        searchText.includes(q)
      ){

        value += 100;

      }


      queryWords.forEach(
        word => {

          if(
            word &&
            searchText.includes(word)
          ){

            value += 40;

          }

        }
      );


      /* TITLE QUALITY BONUS */

      if(
        title &&
        title.length <= 80
      ){

        value += 10;

      }


      if(
        title.includes(q) &&
        title.length < 60
      ){

        value += 50;

      }


      return value;

    }


    /* =========================================
       LOAD ALL SEARCH DATA
    ========================================= */

    async function loadSearchData(){

      SEARCH_INDEX = [];


      const jobs =
        COLLECTIONS.map(
          async collectionId => {

            try{

              const snapshot =
                await getDocs(

                  collection(
                    db,
                    collectionId
                  )

                );


              snapshot.forEach(
                docSnap => {

                  const data =
                    docSnap.data() || {};


                  const documentId =
                    docSnap.id;


                  SEARCH_INDEX.push({

                    ...data,

                    id:
                      documentId,

                    documentId:
                      documentId,

                    collectionId:
                      collectionId,

                    collection:
                      collectionId,

                    title:
                      getTitle(
                        data,
                        documentId
                      ),

                    description:
                      getDescription(
                        data
                      ),

                    image:
                      getImage(
                        data
                      ),

                    searchText:
                      JSON.stringify(
                        data
                      ).toLowerCase()

                  });

                }
              );


            }
            catch(error){

              console.error(
                "Error loading collection:",
                collectionId,
                error
              );

            }

          }
        );


      await Promise.all(
        jobs
      );


      createFilters();

      render();

    }


    /* =========================================
       COLLECTION FILTERS
    ========================================= */

    function createFilters(){

      const available =
        new Set(
          SEARCH_INDEX.map(
            item =>
              item.collection
          )
        );


      filters.innerHTML = "";


      const allButton =
        document.createElement(
          "button"
        );


      allButton.type =
        "button";

      allButton.className =
        "filter active";

      allButton.dataset.filter =
        "all";

      allButton.textContent =
        "All";


      filters.appendChild(
        allButton
      );


      available.forEach(
        collectionId => {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";

          button.className =
            "filter";

          button.dataset.filter =
            collectionId;

          button.textContent =
            formatCollectionName(
              collectionId
            );


          filters.appendChild(
            button
          );

        }
      );


      filters
        .querySelectorAll(
          ".filter"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                activeFilter =
                  button.dataset.filter;


                filters
                  .querySelectorAll(
                    ".filter"
                  )
                  .forEach(
                    item => {

                      item.classList.remove(
                        "active"
                      );

                    }
                  );


                button.classList.add(
                  "active"
                );


                render();

              }
            );

          }
        );

    }


    /* =========================================
       FORMAT COLLECTION NAME
    ========================================= */

    function formatCollectionName(
      value
    ){

      return text(value)

        .replace(
          /[-_]/g,
          " "
        )

        .replace(
          /\b\w/g,
          char =>
            char.toUpperCase()
        );

    }


    /* =========================================
       GET SEARCH RESULTS
    ========================================= */

    function getResults(){

      let data =
        [...SEARCH_INDEX];


      /*
       * FILTER ONLY WHEN USER
       * SELECTS A FILTER.
       *
       * RANKING DOES NOT GIVE
       * ANY COLLECTION PRIORITY.
       */

      if(
        activeFilter !== "all"
      ){

        data =
          data.filter(
            item =>
              item.collection ===
              activeFilter
          );

      }


      const query =
        normalize(
          currentQuery
        );


      data =
        data

          .map(
            item => ({

              ...item,

              _score:
                score(
                  item,
                  query
                )

            })
          )

          .filter(
            item => {

              if(!query){

                return true;

              }

              return item._score > 0;

            }
          );


      /* =====================================
         GLOBAL RELEVANCE SORT
      ===================================== */

      data.sort(
        (a,b) => {

          if(
            b._score !==
            a._score
          ){

            return (
              b._score -
              a._score
            );

          }


          const aTitle =
            normalize(
              a.title
            );


          const bTitle =
            normalize(
              b.title
            );


          return aTitle.localeCompare(
            bTitle
          );

        }
      );


      return data.slice(
        0,
        100
      );

    }


    /* =========================================
       RENDER RESULTS
    ========================================= */

    function render(){

      const data =
        getResults();


      results.innerHTML =
        "";


      if(
        !data.length
      ){

        results.innerHTML = `

          <div class="empty">

            <h3>
              No results found
            </h3>

            <p>
              Try another keyword or search term.
            </p>

          </div>

        `;

        return;

      }


      data.forEach(
        item => {

          const article =
            document.createElement(
              "article"
            );


          article.className =
            "result";


          const page =
            PAGE_MAP[
              item.collection
            ];


          const detailUrl =
            page
              ? page +
                "?id=" +
                encodeURIComponent(
                  item.documentId
                )
              : "#";


          const image =
            escapeHTML(
              item.image
            );


          const title =
            escapeHTML(
              item.title
            );


          const description =
            escapeHTML(
              item.description
            );


          const type =
            escapeHTML(
              formatCollectionName(
                item.collection
              )
            );


          const imageHTML =
            image

              ? `

                <img
                  src="${image}"
                  alt="${title}"
                  loading="lazy"
                >

              `

              : "";


          article.innerHTML = `

            ${imageHTML}

            <div class="result-content">

              <span class="meta">
                ${type}
              </span>

              <h3>
                ${title}
              </h3>

              <p>
                ${
                  description ||
                  "Explore this content on LetsStudy Pro."
                }
              </p>

              <a
                class="view-result"
                href="${detailUrl}"
              >

                <span>
                  View Result
                </span>

                <span
                  class="view-result-arrow"
                >
                  →
                </span>

              </a>

            </div>

          `;


          const imageElement =
            article.querySelector(
              "img"
            );


          if(
            imageElement
          ){

            imageElement.addEventListener(
              "error",
              () => {

                imageElement.remove();

              }
            );

          }


          results.appendChild(
            article
          );

        }
      );

    }


    /* =========================================
       SEARCH SUGGESTIONS
    ========================================= */

    function showSuggestions(){

      const query =
        normalize(
          searchInput.value
        );


      suggestions.innerHTML =
        "";


      if(
        query.length < 2
      ){

        suggestions.style.display =
          "none";

        return;

      }


      const matches =
        SEARCH_INDEX

          .map(
            item => ({

              item,

              score:
                score(
                  item,
                  query
                )

            })
          )

          .filter(
            result =>
              result.score > 0
          )

          .sort(
            (a,b) =>
              b.score -
              a.score
          )

          .slice(
            0,
            8
          );


      if(
        !matches.length
      ){

        suggestions.style.display =
          "none";

        return;

      }


      matches.forEach(
        result => {

          const item =
            result.item;


          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "suggestion";


          button.innerHTML = `

            <span
              class="suggestion-title"
            >
              ${escapeHTML(
                item.title
              )}
            </span>

            <span
              class="suggestion-type"
            >
              ${escapeHTML(
                formatCollectionName(
                  item.collection
                )
              )}
            </span>

          `;


          button.addEventListener(
            "click",
            () => {

              searchInput.value =
                item.title;


              currentQuery =
                item.title;


              suggestions.style.display =
                "none";


              render();

            }
          );


          suggestions.appendChild(
            button
          );

        }
      );


      suggestions.style.display =
        "block";

    }


    /* =========================================
       SEARCH FORM
    ========================================= */

    searchForm.addEventListener(
      "submit",
      event => {

        event.preventDefault();


        currentQuery =
          searchInput.value.trim();


        suggestions.style.display =
          "none";


        render();

      }
    );


    /* =========================================
       LIVE SEARCH
    ========================================= */

    searchInput.addEventListener(
      "input",
      () => {

        currentQuery =
          searchInput.value.trim();


        showSuggestions();

        render();

      }
    );


    /* =========================================
       CLOSE SUGGESTIONS
    ========================================= */

    document.addEventListener(
      "click",
      event => {

        if(
          !event.target.closest(
            ".searchwrap"
          )
        ){

          suggestions.style.display =
            "none";

        }

      }
    );


    /* =========================================
       MOBILE SIDEBAR
    ========================================= */

    const sidebar =
      document.getElementById(
        "sidebar"
      );


    const menuButton =
      document.getElementById(
        "menuButton"
      );


    const closeSidebar =
      document.getElementById(
        "closeSidebar"
      );


    const overlay =
      document.getElementById(
        "overlay"
      );


    menuButton.addEventListener(
      "click",
      () => {

        sidebar.classList.add(
          "open"
        );

        overlay.classList.add(
          "open"
        );

      }
    );


    closeSidebar.addEventListener(
      "click",
      () => {

        sidebar.classList.remove(
          "open"
        );

        overlay.classList.remove(
          "open"
        );

      }
    );


    overlay.addEventListener(
      "click",
      () => {

        sidebar.classList.remove(
          "open"
        );

        overlay.classList.remove(
          "open"
        );

      }
    );


    document
      .querySelectorAll(
        ".sidebar-menu a"
      )
      .forEach(
        link => {

          link.addEventListener(
            "click",
            () => {

              sidebar.classList.remove(
                "open"
              );

              overlay.classList.remove(
                "open"
              );

            }
          );

        }
      );


    /* =========================================
       ACTIVE PAGE
    ========================================= */

    const currentPage =
      location.pathname
        .split("/")
        .pop()
        .toLowerCase();


    document
      .querySelectorAll(
        ".sidebar-menu a"
      )
      .forEach(
        link => {

          const href =
            link.getAttribute(
              "href"
            );


          if(
            href &&
            href.toLowerCase() ===
              currentPage
          ){

            link.classList.add(
              "active"
            );

          }

        }
      );


    /* =========================================
       LOGIN
    ========================================= */

    document
      .getElementById(
        "authButton"
      )
      .addEventListener(
        "click",
        () => {

          location.href =
            "login.html";

        }
      );


    /* =========================================
       START SEARCH
    ========================================= */

    loadSearchData();

  </script>
