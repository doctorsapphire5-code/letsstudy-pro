<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LetsStudy Pro Search — Global Search</title>

  <meta name="description"
        content="Search LetsStudy Pro globally for resources, courses, scholarships, careers, jobs, businesses, videos and more.">

  <meta name="robots" content="index,follow">

  <link rel="icon" href="/favicon.ico">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#fff;
      color:#202124;
    }

    header{
      border-bottom:1px solid #eee;
      padding:18px 5%;
      position:sticky;
      top:0;
      background:#fff;
      z-index:20;
    }

    .header-inner{
      max-width:1100px;
      margin:auto;
    }

    .brand{
      font-size:22px;
      font-weight:800;
      color:#1a73e8;
      margin-bottom:15px;
    }

    .search-box{
      display:flex;
      align-items:center;
      border:1px solid #dfe1e5;
      border-radius:28px;
      max-width:760px;
      height:50px;
      box-shadow:0 1px 4px rgba(0,0,0,.12);
      overflow:hidden;
    }

    .search-box input{
      flex:1;
      height:100%;
      border:0;
      outline:0;
      padding:0 18px;
      font-size:17px;
    }

    .search-box button{
      height:100%;
      width:60px;
      border:0;
      background:#1a73e8;
      color:#fff;
      font-size:21px;
      cursor:pointer;
    }

    .tabs{
      max-width:1100px;
      margin:18px auto 0;
      display:flex;
      gap:20px;
      overflow-x:auto;
      padding-bottom:3px;
    }

    .tabs button{
      background:none;
      border:0;
      padding:9px 2px;
      cursor:pointer;
      white-space:nowrap;
      color:#5f6368;
      font-size:14px;
    }

    .tabs button.active{
      color:#1a73e8;
      border-bottom:3px solid #1a73e8;
    }

    main{
      max-width:1100px;
      margin:28px auto;
      padding:0 20px;
    }

    .search-info{
      color:#70757a;
      font-size:14px;
      margin-bottom:20px;
    }

    .sponsored{
      border:1px solid #e5e7eb;
      border-radius:12px;
      padding:17px;
      margin-bottom:22px;
      background:#fafafa;
    }

    .sponsored-label{
      font-size:12px;
      font-weight:700;
      color:#5f6368;
      margin-bottom:8px;
    }

    .sponsored-title{
      font-size:19px;
      font-weight:700;
      color:#1a0dab;
      margin-bottom:5px;
    }

    .sponsored-url{
      color:#188038;
      font-size:13px;
      margin-bottom:8px;
      word-break:break-all;
    }

    .sponsored-description{
      color:#4d5156;
      line-height:1.5;
    }

    .result{
      margin-bottom:28px;
    }

    .result-url{
      color:#188038;
      font-size:13px;
      margin-bottom:5px;
      word-break:break-all;
    }

    .result-title{
      font-size:21px;
      line-height:1.3;
      color:#1a0dab;
      cursor:pointer;
      margin-bottom:6px;
    }

    .result-title:hover{
      text-decoration:underline;
    }

    .result-description{
      max-width:760px;
      color:#4d5156;
      line-height:1.55;
      font-size:14px;
    }

    .meta{
      margin-top:8px;
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .tag{
      background:#f1f3f4;
      border-radius:14px;
      padding:5px 10px;
      font-size:12px;
      color:#5f6368;
    }

    .ad-slot{
      min-height:90px;
      margin:25px 0;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px dashed #ddd;
      color:#999;
      font-size:11px;
    }

    .loading,
    .empty,
    .error{
      text-align:center;
      padding:70px 20px;
      color:#666;
    }

    .spinner{
      width:35px;
      height:35px;
      border:4px solid #eee;
      border-top-color:#1a73e8;
      border-radius:50%;
      animation:spin .8s linear infinite;
      margin:0 auto 15px;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .pagination{
      display:flex;
      justify-content:center;
      gap:8px;
      margin:40px 0;
      flex-wrap:wrap;
    }

    .pagination button{
      border:1px solid #ddd;
      background:#fff;
      padding:9px 14px;
      border-radius:7px;
      cursor:pointer;
    }

    .pagination button.active{
      background:#1a73e8;
      color:#fff;
      border-color:#1a73e8;
    }

    footer{
      border-top:1px solid #eee;
      margin-top:60px;
      padding:30px 20px;
      text-align:center;
      color:#777;
      font-size:13px;
    }

    @media(max-width:650px){

      header{
        padding:14px;
      }

      .brand{
        font-size:19px;
      }

      .search-box{
        height:46px;
      }

      .search-box input{
        font-size:15px;
      }

      main{
        padding:0 15px;
      }

      .result-title{
        font-size:18px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="brand">
      📚 LetsStudy Pro
    </div>

    <form id="searchForm" class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="Search LetsStudy Pro..."
        autocomplete="off"
        required
      >

      <button type="submit">
        🔍
      </button>

    </form>

  </div>

  <nav class="tabs">

    <button class="active" data-type="">
      All
    </button>

    <button data-type="resources">
      Resources
    </button>

    <button data-type="courses">
      Courses
    </button>

    <button data-type="scholarships">
      Scholarships
    </button>

    <button data-type="careers">
      Careers
    </button>

    <button data-type="jobs">
      Jobs
    </button>

    <button data-type="businesses">
      Businesses
    </button>

    <button data-type="videos">
      Videos
    </button>

  </nav>

</header>


<main>

  <div id="searchInfo"
       class="search-info">
    Search LetsStudy Pro
  </div>

  <!-- LETSSTUDY ADS -->

  <section id="sponsoredContainer"></section>


  <!-- ADSENSE SLOT -->

  <div class="ad-slot"
       id="adTop">

    Advertisement

  </div>


  <!-- ORGANIC RESULTS -->

  <section id="results">

    <div class="empty">
      🔎 Enter something to search.
    </div>

  </section>


  <!-- ADSENSE SLOT -->

  <div class="ad-slot"
       id="adBottom">

    Advertisement

  </div>


  <div id="pagination"
       class="pagination"></div>

</main>


<footer>

  <strong>LetsStudy Pro</strong>

  <br><br>

  Learn. Build. Work. Grow.

  <br><br>

  © 2026 LetsStudy Pro. All rights reserved.

</footer>


<script>

const API_URL = "/api/search";

const input =
  document.getElementById(
    "searchInput"
  );

const form =
  document.getElementById(
    "searchForm"
  );

const resultsEl =
  document.getElementById(
    "results"
  );

const sponsoredEl =
  document.getElementById(
    "sponsoredContainer"
  );

const infoEl =
  document.getElementById(
    "searchInfo"
  );

const paginationEl =
  document.getElementById(
    "pagination"
  );


let currentPage = 1;

let currentType = "";


function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getUrl(item){

  const id =
    item.documentId ||
    item.resourceId ||
    item.id ||
    "";

  const collection =
    String(
      item.collection || ""
    ).toLowerCase();

  if(!id)
    return "#";


  const encoded =
    encodeURIComponent(id);


  const routes = {

    resources:
      `/resources.html?resourceId=${encoded}`,

    courses:
      `/course.html?id=${encoded}`,

    scholarships:
      `/scholarship.html?id=${encoded}`,

    careers:
      `/career.html?id=${encoded}`,

    businesses:
      `/business.html?id=${encoded}`,

    marketplace:
      `/product.html?id=${encoded}`,

    jobs:
      `/jobs.html?id=${encoded}`,

    freelancers:
      `/freelancer.html?id=${encoded}`,

    lessons:
      `/lesson.html?id=${encoded}`,

    videos:
      `/video.html?id=${encoded}`

  };


  return routes[collection] ||
         item.url ||
         "#";

}


function renderSponsored(ads){

  sponsoredEl.innerHTML = "";

  if(!Array.isArray(ads))
    return;


  ads
    .slice(0,3)
    .forEach(ad => {

      const target =
        ad.targetUrl ||
        ad.url ||
        "#";


      sponsoredEl.innerHTML += `

        <article class="sponsored">

          <div class="sponsored-label">
            Sponsored · LetsStudy Ads
          </div>

          <div
            class="sponsored-title"
            onclick="window.open(
              '${escapeHtml(target)}',
              '_blank'
            )"
          >
            ${escapeHtml(
              ad.title ||
              ad.name ||
              "Sponsored"
            )}
          </div>

          <div class="sponsored-url">
            ${escapeHtml(target)}
          </div>

          <div class="sponsored-description">
            ${escapeHtml(
              ad.description ||
              ""
            )}
          </div>

        </article>

      `;

    });

}


function renderResults(results){

  resultsEl.innerHTML = "";


  if(!results.length){

    resultsEl.innerHTML = `

      <div class="empty">

        <h2>
          No results found
        </h2>

        <br>

        Try another search term.

      </div>

    `;

    return;

  }


  results.forEach(
    (item,index) => {

      const url =
        getUrl(item);


      const collection =
        item.collection ||
        "LetsStudy Pro";


      const category =
        item.category ||
        "";


      const type =
        item.type ||
        "";


      const level =
        item.level ||
        "";


      resultsEl.innerHTML += `

        <article class="result">

          <div class="result-url">
            LetsStudy Pro ·
            ${escapeHtml(collection)}
          </div>

          <div
            class="result-title"
            onclick="window.location.href='${url}'"
          >
            ${escapeHtml(
              item.title ||
              "Untitled"
            )}
          </div>

          <div class="result-description">

            ${escapeHtml(
              item.description ||
              "Discover this result on LetsStudy Pro."
            )}

          </div>

          <div class="meta">

            ${
              category
                ?
                `<span class="tag">
                  ${escapeHtml(category)}
                </span>`
                :
                ""
            }

            ${
              type
                ?
                `<span class="tag">
                  ${escapeHtml(type)}
                </span>`
                :
                ""
            }

            ${
              level
                ?
                `<span class="tag">
                  ${escapeHtml(level)}
                </span>`
                :
                ""
            }

          </div>

        </article>

      `;


      /*
       AdSense placement
       after every 5 results.
      */

      if(
        index === 4 &&
        results.length > 5
      ){

        resultsEl.innerHTML += `

          <div class="ad-slot">
            Advertisement
          </div>

        `;

      }

    }
  );

}


function renderPagination(
  totalPages
){

  paginationEl.innerHTML = "";

  if(totalPages <= 1)
    return;


  const max =
    Math.min(
      totalPages,
      10
    );


  for(
    let i=1;
    i<=max;
    i++
  ){

    const button =
      document.createElement(
        "button"
      );

    button.textContent = i;

    if(
      i === currentPage
    ){

      button.classList.add(
        "active"
      );

    }


    button.onclick =
      () => {

        currentPage = i;

        performSearch();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      };


    paginationEl.appendChild(
      button
    );

  }

}


async function performSearch(){

  const q =
    input.value.trim();


  if(!q){

    resultsEl.innerHTML = `

      <div class="empty">
        🔎 Enter something to search.
      </div>

    `;

    sponsoredEl.innerHTML = "";

    infoEl.textContent =
      "Search LetsStudy Pro";

    paginationEl.innerHTML = "";

    return;

  }


  resultsEl.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Searching LetsStudy Pro...

    </div>

  `;


  sponsoredEl.innerHTML = "";


  try{

    const params =
      new URLSearchParams({

        q,

        page:
          currentPage,

        limit:
          20

      });


    /*
      Optional collection
      filter.
    */

    if(currentType){

      params.set(
        "type",
        currentType
      );

    }


    const response =
      await fetch(
        `${API_URL}?${params.toString()}`,
        {
          headers:{
            "Accept":
              "application/json"
          },
          cache:
            "no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        `Search failed: ${response.status}`
      );

    }


    const data =
      await response.json();


    if(!data.success){

      throw new Error(
        data.error ||
        "Search failed"
      );

    }


    const results =
      Array.isArray(
        data.results
      )
        ?
        data.results
        :
        [];


    /*
      LetsStudy Ads support.

      If API later returns:
      data.sponsored
      it will automatically
      appear here.
    */

    renderSponsored(
      data.sponsored
    );


    renderResults(
      results
    );


    renderPagination(
      Number(
        data.totalPages ||
        1
      )
    );


    infoEl.textContent =
      `${data.total || results.length} results for "${q}"`;


    const url =
      new URL(
        window.location.href
      );


    url.searchParams.set(
      "q",
      q
    );


    if(currentPage > 1){

      url.searchParams.set(
        "page",
        currentPage
      );

    }
    else{

      url.searchParams.delete(
        "page"
      );

    }


    if(currentType){

      url.searchParams.set(
        "type",
        currentType
      );

    }
    else{

      url.searchParams.delete(
        "type"
      );

    }


    history.replaceState(
      {},
      "",
      url
    );


  }
  catch(error){

    console.error(
      "SEARCH ERROR:",
      error
    );


    resultsEl.innerHTML = `

      <div class="error">

        <h2>
          ⚠️ Search unavailable
        </h2>

        <br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    currentPage = 1;

    performSearch();

  }
);


document
  .querySelectorAll(
    ".tabs button"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(
            ".tabs button"
          )
          .forEach(
            b =>
              b.classList.remove(
                "active"
              )
          );


        button.classList.add(
          "active"
        );


        currentType =
          button.dataset.type ||
          "";


        currentPage = 1;

        performSearch();

      }
    );

  });


/*
  Restore search from URL.
*/

const initialUrl =
  new URL(
    window.location.href
  );


const initialQuery =
  initialUrl.searchParams.get(
    "q"
  );


const initialType =
  initialUrl.searchParams.get(
    "type"
  );


if(initialType){

  currentType =
    initialType;

  document
    .querySelectorAll(
      ".tabs button"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.type ===
          initialType
      );

    });

}


if(initialQuery){

  input.value =
    initialQuery;

  currentPage =
    Number(
      initialUrl.searchParams.get(
        "page"
      ) || 1
    );

  performSearch();

}

</script>

</body>
</html>
