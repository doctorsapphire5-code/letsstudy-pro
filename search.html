<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Search | LetsStudy Pro</title>

  <meta
    name="description"
    content="Search LetsStudy Pro for courses, resources, scholarships, careers, videos and more."
  >

  <meta name="robots" content="index,follow">

  <link rel="stylesheet" href="search.css">

  <style>
    :root {
      --primary: #2563eb;
      --text: #111827;
      --muted: #667085;
      --border: #e5e7eb;
      --bg: #f7f9fc;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* HEADER */

    .search-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1250px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      text-decoration: none;
      color: var(--text);
      font-size: 21px;
      font-weight: 800;
      white-space: nowrap;
    }

    .search-form {
      flex: 1;
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 14px 17px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      background: white;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.10);
    }

    .search-button {
      border: 0;
      border-radius: 12px;
      padding: 0 23px;
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-button:hover {
      opacity: .92;
    }

    /* MAIN */

    .main {
      max-width: 1250px;
      margin: auto;
      padding: 35px 20px 70px;
    }

    .heading {
      margin-bottom: 25px;
    }

    .heading h1 {
      margin: 0 0 8px;
      font-size: 31px;
      line-height: 1.2;
    }

    .heading p {
      margin: 0;
      color: var(--muted);
    }

    /* RESULTS */

    #results {
      display: grid;
      gap: 15px;
    }

    .result-card {
      display: flex;
      gap: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    .result-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,.07);
    }

    .result-image {
      width: 170px;
      height: 110px;
      border-radius: 11px;
      object-fit: cover;
      background: #eef2f7;
      flex-shrink: 0;
    }

    .result-body {
      min-width: 0;
      flex: 1;
    }

    .result-type {
      display: inline-block;
      margin-bottom: 7px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eff6ff;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .result-title {
      margin: 0 0 7px;
      font-size: 20px;
      line-height: 1.3;
    }

    .result-description {
      margin: 0 0 10px;
      color: var(--muted);
      line-height: 1.55;
    }

    .result-meta {
      color: #98a2b3;
      font-size: 13px;
    }

    /* STATES */

    .state {
      display: none;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 55px 20px;
      text-align: center;
    }

    .state h2 {
      margin: 0 0 8px;
    }

    .state p {
      margin: 0;
      color: var(--muted);
    }

    .spinner {
      width: 35px;
      height: 35px;
      margin: 0 auto 15px;
      border: 4px solid #e5e7eb;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .header-inner {
        flex-direction: column;
        align-items: stretch;
      }

      .search-form {
        width: 100%;
      }

      .search-button {
        padding: 0 17px;
      }

      .main {
        padding-top: 25px;
      }

      .heading h1 {
        font-size: 25px;
      }

      .result-card {
        flex-direction: column;
      }

      .result-image {
        width: 100%;
        height: 190px;
      }
    }
  </style>
</head>

<body>

<header class="search-header">

  <div class="header-inner">

    <a
      href="/"
      class="logo"
      aria-label="LetsStudy Pro Home"
    >
      LetsStudy Pro
    </a>

    <form
      id="searchForm"
      class="search-form"
    >

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Search courses, resources, scholarships..."
        autocomplete="off"
        aria-label="Search LetsStudy Pro"
      >

      <button
        class="search-button"
        type="submit"
      >
        Search
      </button>

    </form>

  </div>

</header>


<main class="main">

  <section class="heading">

    <h1 id="searchTitle">
      Search LetsStudy Pro
    </h1>

    <p id="searchSummary">
      Search courses, resources, scholarships, careers, videos and more.
    </p>

  </section>


  <!-- LOADING -->

  <div
    id="loading"
    class="state"
  >

    <div class="spinner"></div>

    <h2>
      Searching...
    </h2>

    <p>
      Finding the best results from LetsStudy Pro.
    </p>

  </div>


  <!-- ERROR -->

  <div
    id="error"
    class="state"
  >

    <h2>
      Search unavailable
    </h2>

    <p id="errorMessage">
      Please try again.
    </p>

  </div>


  <!-- EMPTY -->

  <div
    id="empty"
    class="state"
  >

    <h2>
      No results found
    </h2>

    <p>
      Try another keyword or search phrase.
    </p>

  </div>


  <!-- RESULTS -->

  <section
    id="results"
  ></section>

</main>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const searchForm =
  document.getElementById("searchForm");

const searchInput =
  document.getElementById("searchInput");

const searchTitle =
  document.getElementById("searchTitle");

const searchSummary =
  document.getElementById("searchSummary");

const results =
  document.getElementById("results");

const loading =
  document.getElementById("loading");

const empty =
  document.getElementById("empty");

const errorBox =
  document.getElementById("error");

const errorMessage =
  document.getElementById("errorMessage");


/* =====================================================
   STATES
===================================================== */

function hideStates() {

  loading.style.display = "none";

  empty.style.display = "none";

  errorBox.style.display = "none";

}


function showLoading() {

  hideStates();

  results.innerHTML = "";

  loading.style.display = "block";

}


function showEmpty() {

  hideStates();

  results.innerHTML = "";

  empty.style.display = "block";

}


function showError(message) {

  hideStates();

  results.innerHTML = "";

  errorMessage.textContent =
    message ||
    "Please try again.";

  errorBox.style.display = "block";

}


/* =====================================================
   SEARCH
===================================================== */

async function searchLetsStudy(query) {

  query =
    String(query || "").trim();


  if (!query) {

    searchTitle.textContent =
      "Search LetsStudy Pro";

    searchSummary.textContent =
      "Search courses, resources, scholarships, careers, videos and more.";

    hideStates();

    results.innerHTML = "";

    return;

  }


  showLoading();


  searchTitle.textContent =
    `Search results for "${query}"`;


  try {

    /*
     Search API.

     Firebase Hosting will route:

     /api/search

     to the Cloud Function.
    */

    const response =
      await fetch(
        `/api/search?q=${encodeURIComponent(query)}`,
        {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    const items =
      Array.isArray(data.results)
        ? data.results
        : [];


    hideStates();


    /*
     Result count comes from API.
     Nothing is hardcoded.
    */

    const total =
      typeof data.total === "number"
        ? data.total
        : items.length;


    searchSummary.textContent =
      `${total} result${total === 1 ? "" : "s"} found`;


    if (!items.length) {

      showEmpty();

      return;

    }


    renderResults(items);

  }

  catch (error) {

    console.error(
      "LetsStudy Pro Search:",
      error
    );


    showError(
      "Something went wrong while searching."
    );

  }

}


/* =====================================================
   RENDER RESULTS
===================================================== */

function renderResults(items) {

  results.innerHTML = "";


  items.forEach(item => {

    /*
     Every value comes from Search API,
     which comes from Firebase.
    */

    const url =
      item.url || "#";

    const title =
      item.title ||
      "Untitled";

    const description =
      item.description ||
      "";

    const image =
      item.image ||
      "/assets/images/og-default.jpg";

    const type =
      item.type ||
      item.collection ||
      "content";

    const category =
      item.category ||
      "";


    const card =
      document.createElement("a");


    card.className =
      "result-card";

    card.href =
      url;


    const imageElement =
      document.createElement("img");

    imageElement.className =
      "result-image";

    imageElement.src =
      image;

    imageElement.alt =
      title;

    imageElement.loading =
      "lazy";


    /*
     Fallback if Firebase image
     is unavailable.
    */

    imageElement.onerror =
      function() {

        this.src =
          "/assets/images/og-default.jpg";

      };


    const body =
      document.createElement("div");

    body.className =
      "result-body";


    const typeElement =
      document.createElement("span");

    typeElement.className =
      "result-type";

    typeElement.textContent =
      type;


    const titleElement =
      document.createElement("h2");

    titleElement.className =
      "result-title";

    titleElement.textContent =
      title;


    const descriptionElement =
      document.createElement("p");

    descriptionElement.className =
      "result-description";

    descriptionElement.textContent =
      description;


    const metaElement =
      document.createElement("div");

    metaElement.className =
      "result-meta";

    metaElement.textContent =
      category;


    body.appendChild(
      typeElement
    );

    body.appendChild(
      titleElement
    );

    body.appendChild(
      descriptionElement
    );

    body.appendChild(
      metaElement
    );


    card.appendChild(
      imageElement
    );

    card.appendChild(
      body
    );


    results.appendChild(
      card
    );

  });

}


/* =====================================================
   FORM
===================================================== */

searchForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    const query =
      searchInput.value.trim();


    if (!query) {

      searchInput.focus();

      return;

    }


    /*
     /search.html?q=biology
    */

    const url =
      new URL(
        window.location.href
      );


    url.searchParams.set(
      "q",
      query
    );


    window.history.pushState(
      {},
      "",
      url
    );


    searchLetsStudy(
      query
    );

  }
);


/* =====================================================
   LOAD SEARCH FROM URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const initialQuery =
  params.get("q");


if (initialQuery) {

  searchInput.value =
    initialQuery;

  searchLetsStudy(
    initialQuery
  );

}

</script>


</body>
</html>
