<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search — LetsStudy Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#202124}
header{height:70px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 6%;font-size:22px;font-weight:700}
.brand span{color:#4285f4}
main{max-width:900px;margin:55px auto;padding:0 20px}
.searchbox{display:flex;border:1px solid #dfe1e5;border-radius:30px;height:52px;overflow:hidden;box-shadow:0 1px 6px #00000018}
input{flex:1;border:0;outline:0;padding:0 22px;font-size:17px}
button{border:0;background:#4285f4;color:#fff;padding:0 25px;font-size:15px;cursor:pointer}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.filter{border:1px solid #ddd;background:#fff;border-radius:18px;padding:8px 15px;cursor:pointer}
.filter.active{background:#202124;color:#fff}
.result{padding:18px 0;border-bottom:1px solid #eee;cursor:pointer}
.result:hover{background:#fafafa}
.result h3{margin:0 0 7px;font-size:20px;font-weight:500}
.result p{margin:0;color:#5f6368;line-height:1.5}
.meta{font-size:12px;color:#777;margin-top:8px}
.result img{width:90px;height:60px;object-fit:cover;border-radius:7px;float:right;margin-left:15px}
.suggestions{display:none;border:1px solid #ddd;border-top:0;background:#fff;position:absolute;width:100%;z-index:10}
.suggestion{padding:12px 20px;cursor:pointer}
.suggestion:hover{background:#f5f5f5}
.searchwrap{position:relative}
</style>
</head>

<body>

<header>
  <div class="brand">LetsStudy <span>Pro</span></div>

<style>
.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:260px;
  height:100vh;
  background:#fff;
  border-right:1px solid #e5e7eb;
  z-index:9999;
  display:flex;
  flex-direction:column;
  transition:.3s;
}

.sidebar-header{
  height:70px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #eee;
}

.sidebar-logo{
  text-decoration:none;
  font-size:21px;
  font-weight:800;
  color:#111827;
}

.sidebar-logo span{
  color:#2563eb;
}

.close-sidebar{
  display:none;
  border:0;
  background:none;
  font-size:25px;
  cursor:pointer;
}

.sidebar-menu{
  flex:1;
  overflow-y:auto;
  padding:15px 12px;
}

.sidebar-title{
  font-size:11px;
  font-weight:800;
  color:#94a3b8;
  text-transform:uppercase;
  padding:12px;
}

.sidebar-menu a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin:3px 0;
  border-radius:10px;
  color:#475569;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.sidebar-menu a:hover,
.sidebar-menu a.active{
  background:#eff6ff;
  color:#2563eb;
}

.sidebar-icon{
  width:22px;
  text-align:center;
  font-size:17px;
}

.sidebar-bottom{
  padding:14px 12px;
  border-top:1px solid #eee;
}

.auth-btn{
  width:100%;
  height:44px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.auth-btn:hover{
  background:#1d4ed8;
}

.menu-button{
  display:none;
  position:fixed;
  top:14px;
  left:14px;
  width:42px;
  height:42px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  z-index:9998;
  font-size:20px;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:9997;
}

body{
  padding-left:260px;
}

@media(max-width:800px){

  body{
    padding-left:0;
  }

  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .close-sidebar{
    display:block;
  }

  .menu-button{
    display:block;
  }

  .overlay.open{
    display:block;
  }
}
</style>


<button class="menu-button" id="menuButton" aria-label="Open menu">
  ☰
</button>
<div
  class="overlay"
  id="overlay">
</div>


<aside
  class="sidebar"
  id="sidebar">

  <div class="sidebar-header">

    <a
      href="automatic.html"
      class="sidebar-logo">
      LetsStudy <span>Pro</span>
    </a>

    <button
      class="close-sidebar"
      id="closeSidebar">
      ×
    </button>

  </div>


  <div class="sidebar-menu">

    <div class="sidebar-title">
      Main
    </div>

    <a href="automation.html">
      <span class="sidebar-icon">🏠</span>
      Automatic
    </a>

    <a href="ai.html">
      <span class="sidebar-icon">🤖</span>
      AI
    </a>

    <a href="premium.html">
      <span class="sidebar-icon">⭐</span>
      Premium
    </a>

    <a href="pricing.html">
      <span class="sidebar-icon">💳</span>
      Pricing
    </a>


    <div class="sidebar-title">
      Account
    </div>

    <a href="edit-profile.html">
      <span class="sidebar-icon">👤</span>
      Edit Profile
    </a>

    <a href="subscription.html">
      <span class="sidebar-icon">🔄</span>
      Subscription
    </a>

    <a href="wallet.html">
      <span class="sidebar-icon">💰</span>
      Wallet
    </a>

    <a href="skills.html">
      <span class="sidebar-icon">🎯</span>
      Skills
    </a>


    <div class="sidebar-title">
      More
    </div>

    <a href="settings.html">
      <span class="sidebar-icon">⚙️</span>
      Settings
    </a>

    <a href="legal.html">
      <span class="sidebar-icon">⚖️</span>
      Legal
    </a>

  </div>


  <div class="sidebar-bottom">

    <button
      class="auth-btn"
      id="authButton">
      Login
    </button>

  </div>

</aside>


<script>
const sidebar =
  document.getElementById("sidebar");

const menuButton =
  document.getElementById("menuButton");

const closeSidebar =
  document.getElementById("closeSidebar");

const overlay =
  document.getElementById("overlay");

menuButton.onclick = () => {
  sidebar.classList.add("open");
  overlay.classList.add("open");
};

closeSidebar.onclick = () => {
  sidebar.classList.remove("open");
  overlay.classList.remove("open");
};

overlay.onclick = () => {
  sidebar.classList.remove("open");
  overlay.classList.remove("open");
};


document
  .querySelectorAll(".sidebar-menu a")
  .forEach(link => {

    link.onclick = () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("open");
    };

  });


const currentPage =
  location.pathname
    .split("/")
    .pop()
    .toLowerCase();

document
  .querySelectorAll(".sidebar-menu a")
  .forEach(link => {

    if(
      link.getAttribute("href")
        .toLowerCase() === currentPage
    ){

      link.classList.add("active");

    }

  });


document.getElementById(
  "authButton"
).onclick = () => {

  location.href = "login.html";

};
</script>

</header>

<main>
  <div class="searchwrap">
    <form id="searchForm" class="searchbox">
      <input id="searchInput" type="search"
             placeholder="Search LetsStudy Pro..."
             autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div id="filters" class="filters"></div>
  <section id="results"></section>
</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const input = document.getElementById("searchInput");
const form = document.getElementById("searchForm");
const results = document.getElementById("results");
const filters = document.getElementById("filters");
const suggestions = document.getElementById("suggestions");

const COLLECTIONS = [
  "courses",
  "resources",
  "scholarships",
  "careers",
  "videos",
  "services",
  "businesses",
  "community",
  "marketplace",
  "profiles",
  "freelancers",
  "websites",
  "ads",
  "sponsors"
];

const PAGE_MAP = {
  courses:"course-details.html",
  resources:"resources-details.html",
  scholarships:"scholarships-details.html",
  careers:"career-details.html",
  videos:"video-details.html",
  services:"service-details.html",
  businesses:"business-details.html",
  community:"community-details.html",
  marketplace:"marketplace-details.html",
  profiles:"profile-details.html",
  freelancers:"freelancer-details.html",
  websites:"website-details.html",
  ads:"ads-details.html",
  sponsors:"sponsor-details.html"
};

let SEARCH_INDEX = [];
let currentType = "all";

function text(v){
  return String(v ?? "").trim();
}

function title(data,id){
  return text(
    data.title ||
    data.name ||
    data.courseName ||
    data.resourceName ||
    data.scholarshipName ||
    data.careerName ||
    data.businessName ||
    data.videoName ||
    data.serviceName ||
    data.displayName ||
    data.username ||
    id
  );
}

function description(data){
  return text(
    data.description ||
    data.summary ||
    data.excerpt ||
    data.about ||
    data.bio ||
    ""
  ).slice(0,140);
}

function image(data){
  return text(
    data.thumbnail ||
    data.image ||
    data.imageUrl ||
    data.coverImage ||
    ""
  );
}

function destination(item){
  const page = PAGE_MAP[item.collectionId];

  if(!page) return text(item.url || item.link || "#");

  return page + "?id=" +
    encodeURIComponent(item.documentId);
}

async function loadSearchData(){

  SEARCH_INDEX = [];

  const jobs = COLLECTIONS.map(async collectionId => {

    try{

      const snapshot =
        await getDocs(collection(db,collectionId));

      snapshot.forEach(docSnap => {

        const data = docSnap.data() || {};

        /*
          IMPORTANT:
          Firebase document ID comes directly from docSnap.id.
        */

        const documentId = docSnap.id;

        SEARCH_INDEX.push({
          ...data,
          id: documentId,
          documentId: documentId,
          collectionId: collectionId,
          collection: collectionId,
          title: title(data,documentId),
          description: description(data),
          image: image(data),
          searchText:
            JSON.stringify(data).toLowerCase()
        });

      });

    }catch(error){

      console.error(
        "Firestore collection failed:",
        collectionId,
        error
      );

    }

  });

  await Promise.all(jobs);

  createFilters();
  render();
}

function createFilters(){

  filters.innerHTML = "";

  addFilter("all","All");

  COLLECTIONS.forEach(collectionId => {

    if(
      SEARCH_INDEX.some(
        item => item.collectionId === collectionId
      )
    ){
      addFilter(
        collectionId,
        collectionId.charAt(0).toUpperCase() +
        collectionId.slice(1)
      );
    }

  });

}

function addFilter(type,label){

  const button = document.createElement("button");

  button.className =
    "filter" +
    (currentType === type ? " active" : "");

  button.textContent = label;

  button.onclick = () => {

    currentType = type;

    createFilters();
    render();

  };

  filters.appendChild(button);
}

function score(item,query){

  if(!query) return 0;

  const q = query.toLowerCase();
  const t = item.title.toLowerCase();
  const d = item.description.toLowerCase();
  const s = item.searchText;

  let score = 0;

  if(t === q) score += 1000;
  if(t.startsWith(q)) score += 500;
  if(t.includes(q)) score += 300;
  if(d.includes(q)) score += 120;
  if(s.includes(q)) score += 40;

  q.split(/\s+/).forEach(word => {

    if(word && t.includes(word)) score += 100;
    if(word && d.includes(word)) score += 30;

  });

  return score;
}

function render(){

  const query =
    input.value.trim().toLowerCase();

  let data = SEARCH_INDEX.filter(item => {

    if(
      currentType !== "all" &&
      item.collectionId !== currentType
    ) return false;

    if(!query) return true;

    return score(item,query) > 0;

  });

  data.sort((a,b) =>
    score(b,query) - score(a,query)
  );

  results.innerHTML = "";

  data.forEach(item => {

    const article =
      document.createElement("article");

    article.className = "result";

    article.innerHTML = `
      ${
        item.image
        ? `<img src="${item.image}" alt="">`
        : ""
      }
      <h3>${escapeHTML(item.title)}</h3>
      <p>${escapeHTML(item.description)}</p>
      <div class="meta">
        ${escapeHTML(item.collectionId)}
      </div>
    `;

    article.onclick = () => {

      window.location.href =
        destination(item);

    };

    results.appendChild(article);

  });

  updateSuggestions(query);
}

function updateSuggestions(query){

  if(!query){

    suggestions.style.display = "none";
    return;

  }

  const matches =
    SEARCH_INDEX
      .filter(item =>
        item.title.toLowerCase().includes(query)
      )
      .sort((a,b) =>
        score(b,query) - score(a,query)
      )
      .slice(0,6);

  if(!matches.length){

    suggestions.style.display = "none";
    return;

  }

  suggestions.innerHTML = "";

  matches.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "suggestion";
    div.textContent = item.title;

    div.onclick = () => {

      input.value = item.title;
      suggestions.style.display = "none";
      render();

    };

    suggestions.appendChild(div);

  });

  suggestions.style.display = "block";
}

function escapeHTML(value){

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

form.addEventListener("submit",event => {

  event.preventDefault();
  suggestions.style.display = "none";
  render();

});

input.addEventListener("input",render);

document.addEventListener("click",event => {

  if(!event.target.closest(".searchwrap")){
    suggestions.style.display = "none";
  }

});

loadSearchData();

</script>

</body>
</html>
