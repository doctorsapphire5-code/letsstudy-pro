const sidebar =
  document.getElementById("sidebar");

const menuButton =
  document.getElementById("menuButton");

const closeSidebar =
  document.getElementById("closeSidebar");

const overlay =
  document.getElementById("overlay");


/* OPEN */

menuButton.addEventListener(
  "click",
  () => {

    sidebar.classList.add("open");

    overlay.classList.add("open");

  }
);


/* CLOSE */

closeSidebar.addEventListener(
  "click",
  () => {

    sidebar.classList.remove("open");

    overlay.classList.remove("open");

  }
);


/* OVERLAY */

overlay.addEventListener(
  "click",
  () => {

    sidebar.classList.remove("open");

    overlay.classList.remove("open");

  }
);


/* CLOSE AFTER LINK */

document
  .querySelectorAll(".sidebar-menu a")
  .forEach(link => {

    link.addEventListener(
      "click",
      () => {

        sidebar.classList.remove("open");

        overlay.classList.remove("open");

      }
    );

  });


/* =========================================
   ACTIVE PAGE
========================================= */

const currentPage =
  location.pathname
    .split("/")
    .pop()
    .toLowerCase();


document
  .querySelectorAll(".sidebar-menu a")
  .forEach(link => {

    const href =
      link.getAttribute("href");


    if(
      href &&
      href.toLowerCase() === currentPage
    ){

      link.classList.add("active");

    }

  });


/* =========================================
   LOGIN
========================================= */

document
  .getElementById("authButton")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "login.html";

    }
  );

    community: "community-details.html",

    marketplace: "marketplace-details.html",

    profiles: "profile-details.html",

    freelancers: "freelancer-details.html",

    websites: "website-details.html",

    ads: "ads-details.html",

    sponsors: "sponsor-details.html"

  };

  const page = pages[collectionName];

  if(!page){

    return "#";

  }

  return `${page}?id=${encodeURIComponent(id)}`;

}


/* =========================================================
   SEARCH SCORE
========================================================= */

function scoreResult(item, query){

  if(!query){

    return 0;

  }

  const q = query.toLowerCase().trim();

  const title = text(item.title).toLowerCase();

  const description = text(item.description).toLowerCase();

  const searchText = text(item.searchText).toLowerCase();

  let score = 0;


  /* Exact title */

  if(title === q){

    score += 1000;

  }


  /* Title starts with query */

  if(title.startsWith(q)){

    score += 500;

  }


  /* Title contains query */

  if(title.includes(q)){

    score += 300;

  }


  /* Description contains query */

  if(description.includes(q)){

    score += 120;

  }


  /* Anywhere in data */

  if(searchText.includes(q)){

    score += 40;

  }


  /* Individual words */

  const words = q.split(/\s+/).filter(Boolean);

  words.forEach(word => {

    if(title.includes(word)){

      score += 100;

    }

    if(description.includes(word)){

      score += 30;

    }

  });


  return score;

}


/* =========================================================
   CREATE FILTERS
========================================================= */

function createFilters(){

  filters.innerHTML = "";

  const available = [...new Set(

    SEARCH_INDEX.map(item => item.collection)

  )];


  addFilter(

    "all",

    "All",

    available.length > 0

  );


  available.forEach(collectionName => {

    addFilter(

      collectionName,

      getCollectionLabel(collectionName),

      true

    );

  });

}


/* =========================================================
   ADD FILTER BUTTON
========================================================= */

function addFilter(value, label, visible = true){

  if(!visible){

    return;

  }

  const button = document.createElement("button");

  button.type = "button";

  button.className = "filter-btn";

  button.dataset.filter = value;

  button.textContent = label;


  if(value === activeFilter){

    button.classList.add("active");

  }


  button.addEventListener("click", () => {

    activeFilter = value;

    createFilters();

    renderResults();

  });


  filters.appendChild(button);

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults(){

  const query = searchInput.value.trim().toLowerCase();


  let results = SEARCH_INDEX.slice();


  /* Filter by collection */

  if(activeFilter !== "all"){

    results = results.filter(

      item => item.collection === activeFilter

    );

  }


  /* Search */

  if(query){

    results = results

      .map(item => ({

        ...item,

        _score: scoreResult(item, query)

      }))

      .filter(item => item._score > 0)

      .sort((a, b) => b._score - a._score);

  }


  /* Limit */

  results = results.slice(0, 100);


  /* Count */

  resultCount.textContent = `${results.length} result${

    results.length === 1 ? "" : "s"

  }`;


  /* Empty */

  if(results.length === 0){

    resultsGrid.innerHTML = "";

    emptyBox.style.display = "block";

    return;

  }


  emptyBox.style.display = "none";


  resultsGrid.innerHTML = results.map(item => {

    const title = escapeHTML(item.title);

    const description = escapeHTML(

      item.description || "Explore this content on LetsStudy Pro."

    );

    const collection = escapeHTML(

      getCollectionLabel(item.collection)

    );

    const url = getDetailPage(

      item.collection,

      item.documentId

    );

    const image = getImage(item);


    const imageHTML = image

      ? `

        <div class="result-image-wrapper">

          <div class="image-placeholder">

            📚

          </div>

          <img

            class="result-image"

            src="${escapeHTML(image)}"

            alt="${title}"

            loading="lazy"

            decoding="async"

            onload="

              this.style.opacity='1';

              this.previousElementSibling.style.display='none';

            "

            onerror="

              this.style.display='none';

            "

          >

        </div>

      `

      : `

        <div class="result-image-wrapper">

          <div class="image-placeholder">

            📚

          </div>

        </div>

      `;


    return `

      <article class="result-card">

        ${imageHTML}


        <div class="result-content">

          <span class="result-type">

            ${collection}

          </span>


          <h3 class="result-title">

            ${title}

          </h3>


          <p class="result-description">

            ${description}

          </p>


          <a

            href="${url}"

            class="view-result"

          >

            View Details

            <span>→</span>

          </a>

        </div>

      </article>

    `;

  }).join("");

}


/* =========================================================
   SEARCH SUGGESTIONS
========================================================= */

function updateSuggestions(){

  const query = searchInput.value.trim().toLowerCase();


  if(!query){

    suggestions.style.display = "none";

    suggestions.innerHTML = "";

    return;

  }


  const matches = SEARCH_INDEX

    .filter(item => {

      const title = text(item.title).toLowerCase();

      return title.includes(query);

    })

    .sort((a, b) => {

      const aTitle = text(a.title).toLowerCase();

      const bTitle = text(b.title).toLowerCase();

      return (

        (bTitle.startsWith(query) ? 1 : 0) -

        (aTitle.startsWith(query) ? 1 : 0)

      );

    })

    .slice(0, 6);


  if(matches.length === 0){

    suggestions.style.display = "none";

    suggestions.innerHTML = "";

    return;

  }


  suggestions.innerHTML = matches.map(item => {

    const title = escapeHTML(item.title);

    const collection = escapeHTML(

      getCollectionLabel(item.collection)

    );


    return `

      <button

        type="button"

        class="suggestion-item"

        data-id="${escapeHTML(item.documentId)}"

        data-collection="${escapeHTML(item.collection)}"

      >

        <span class="suggestion-icon">

          🔎

        </span>

        <span>

          <strong>${title}</strong>

          <small>${collection}</small>

        </span>

      </button>

    `;

  }).join("");


  suggestions.style.display = "block";


  suggestions

    .querySelectorAll(".suggestion-item")

    .forEach(button => {

      button.addEventListener("click", () => {

        const id = button.dataset.id;

        const collection = button.dataset.collection;

        const url = getDetailPage(collection, id);

        window.location.href = url;

      });

    });

}


/* =========================================================
   SEARCH EVENTS
========================================================= */

searchInput.addEventListener("input", () => {

  updateSuggestions();

  renderResults();

});


searchForm.addEventListener("submit", event => {

  event.preventDefault();

  suggestions.style.display = "none";

  renderResults();

});


/* =========================================================
   CLOSE SUGGESTIONS
========================================================= */

document.addEventListener("click", event => {

  if(

    !event.target.closest(".search-area")

  ){

    suggestions.style.display = "none";

  }

});


/* =========================================================
   LOAD FIRESTORE DATA
========================================================= */

async function loadSearchData(){

  try{

    loading.style.display = "flex";

    emptyBox.style.display = "none";

    resultsGrid.innerHTML = "";

    SEARCH_INDEX = [];


    const requests = COLLECTIONS.map(

      async collectionName => {

        try{

          const snapshot = await getDocs(

            collection(db, collectionName)

          );


          snapshot.forEach(docSnap => {

            const data = docSnap.data() || {};


            const title = getTitle(data, docSnap.id);

            const description = getDescription(data);

            const image = getImage(data);


            SEARCH_INDEX.push({

              documentId: docSnap.id,

              collection: collectionName,

              title,

              description,

              image,

              searchText: JSON.stringify(data)

            });

          });


        }catch(error){

          console.warn(

            `Unable to load ${collectionName}:`,

            error

          );

        }

      }

    );


    await Promise.all(requests);


    createFilters();

    renderResults();


  }catch(error){

    console.error(

      "Search loading error:",

      error

    );


    resultsGrid.innerHTML = `

      <div class="search-error">

        <h3>Unable to load search</h3>

        <p>

          Please refresh the page and try again.

        </p>

      </div>

    `;


  }finally{

    loading.style.display = "none";

  }

}


/* =========================================================
   START SEARCH
========================================================= */

loadSearchData();

</script>
