<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description"
content="Search courses, lessons, resources, scholarships, careers, quizzes and community content on LetsStudy Pro.">

<meta name="theme-color" content="#2563eb"><title>Search | LetsStudy Pro</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
height:66px;
background:#fff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
gap:12px;
padding:0 18px;
position:sticky;
top:0;
z-index:50;
}

.logo{
font-size:16px;
font-weight:900;
color:#2563eb;
white-space:nowrap;
}

.header-title{
flex:1;
font-size:15px;
font-weight:700;
}

.header-btn{
border:0;
background:#eff6ff;
color:#2563eb;
width:38px;
height:38px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

main{
width:100%;
max-width:1050px;
margin:auto;
padding:22px;
}

.hero{
background:linear-gradient(
135deg,
#172554,
#2563eb
);
border-radius:22px;
padding:30px 25px;
color:#fff;
margin-bottom:18px;
}

.hero h1{
margin:0 0 8px;
font-size:28px;
}

.hero p{
margin:0;
font-size:11px;
color:#dbeafe;
}

.search-box{
margin-top:22px;
display:flex;
background:#fff;
padding:6px;
border-radius:13px;
box-shadow:0 10px 30px rgba(15,23,42,.15);
}

.search-box input{
flex:1;
border:0;
outline:0;
padding:13px;
font-size:13px;
min-width:0;
color:#172033;
}

.search-button{
border:0;
background:#2563eb;
color:#fff;
border-radius:9px;
padding:0 18px;
font-weight:bold;
cursor:pointer;
}

.filters{
display:flex;
gap:8px;
overflow-x:auto;
padding:3px 0 12px;
scrollbar-width:none;
}

.filters::-webkit-scrollbar{
display:none;
}

.filter{
white-space:nowrap;
border:1px solid #e2e8f0;
background:#fff;
color:#475569;
border-radius:20px;
padding:9px 14px;
font-size:10px;
cursor:pointer;
}

.filter.active{
background:#2563eb;
border-color:#2563eb;
color:#fff;
}

.search-info{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin:10px 0;
}

.result-count{
font-size:11px;
color:#64748b;
}

.clear-btn{
border:0;
background:transparent;
color:#2563eb;
font-size:10px;
cursor:pointer;
}

.recent{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:15px;
margin-bottom:15px;
}

.recent-title{
font-size:11px;
font-weight:800;
margin-bottom:10px;
}

.recent-list{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.recent-item{
border:1px solid #e2e8f0;
background:#f8fafc;
padding:7px 10px;
border-radius:20px;
font-size:9px;
cursor:pointer;
}

.results{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.result{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
overflow:hidden;
transition:.2s;
}

.result:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(15,23,42,.08);
}

.result-image{
height:135px;
background:#e2e8f0;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.result-image img{
width:100%;
height:100%;
object-fit:cover;
}

.result-placeholder{
font-size:35px;
}

.result-body{
padding:14px;
}

.badge{
display:inline-block;
background:#eff6ff;
color:#2563eb;
padding:5px 8px;
border-radius:6px;
font-size:8px;
font-weight:bold;
text-transform:uppercase;
margin-bottom:8px;
}

.result-title{
font-size:13px;
font-weight:800;
line-height:1.4;
margin-bottom:6px;
}

.result-description{
font-size:10px;
line-height:1.5;
color:#64748b;
min-height:30px;
}

.result-footer{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
margin-top:12px;
}

.result-meta{
font-size:8px;
color:#94a3b8;
}

.open-btn{
border:0;
background:#2563eb;
color:#fff;
padding:8px 10px;
border-radius:7px;
font-size:9px;
font-weight:bold;
cursor:pointer;
}

.empty{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:55px 20px;
text-align:center;
color:#64748b;
font-size:11px;
grid-column:1/-1;
}

.empty-icon{
font-size:40px;
margin-bottom:10px;
}

.loading{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:45px;
text-align:center;
color:#64748b;
font-size:11px;
grid-column:1/-1;
}

.spinner{
width:30px;
height:30px;
border:3px solid #dbeafe;
border-top-color:#2563eb;
border-radius:50%;
animation:spin .8s linear infinite;
margin:0 auto 12px;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.error{
background:#fee2e2;
color:#b91c1c;
padding:14px;
border-radius:10px;
font-size:10px;
grid-column:1/-1;
}

@media(max-width:650px){

main{
padding:12px;
}

.hero{
padding:22px 17px;
}

.hero h1{
font-size:23px;
}

.results{
grid-template-columns:1fr;
}

.result-image{
height:150px;
}

.header-title{
font-size:13px;
}

}

</style></head><body><header><div class="logo">
LETSSTUDY PRO
</div><div class="header-title">
Search
</div><button
class="header-btn"
onclick="location.href='dashboard.html'"
title="Dashboard">

⌂

</button></header><main><section class="hero"><h1>
Search LetsStudy Pro 🔎
</h1><p>
Find courses, resources, scholarships, careers, quizzes and community content.
</p><div class="search-box"><input
id="searchInput"
type="search"
autocomplete="off"
placeholder="Search courses, scholarships, careers..."
aria-label="Search LetsStudy Pro"

«»

<button
class="search-button"
id="searchButton">

Search

</button></div></section><div class="filters"><button
class="filter active"
data-category="all">

All

</button><button
class="filter"
data-category="courses">

📚 Courses

</button><button
class="filter"
data-category="resources">

📄 Resources

</button><button
class="filter"
data-category="scholarships">

🎓 Scholarships

</button><button
class="filter"
data-category="careers">

💼 Careers

</button><button
class="filter"
data-category="community">

👥 Community

</button><button
class="filter"
data-category="quizzes">

🧠 Quizzes

</button></div><section
id="recentSection"
class="recent"><div class="recent-title">
Recent Searches
</div><div
id="recentList"
class="recent-list">
</div></section><div class="search-info"><div
id="resultCount"
class="result-count">Start searching to see results.

</div><button
id="clearButton"
class="clear-btn">

Clear

</button></div><section
id="results"
class="results"><div class="empty"><div class="empty-icon">
🔎
</div>Search LetsStudy Pro to discover learning content.

</div></section></main><script type="module">


/* ==================================================
 FIREBASE IMPORTS
================================================== */

import{

initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import{

getFirestore,
collection,
getDocs

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==================================================
 FIREBASE CONFIG
================================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};


/* ==================================================
 INITIALIZE
================================================== */

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ==================================================
 DOM
================================================== */

const input=
document.getElementById(
"searchInput"
);

const resultsBox=
document.getElementById(
"results"
);

const resultCount=
document.getElementById(
"resultCount"
);

const recentSection=
document.getElementById(
"recentSection"
);

const recentList=
document.getElementById(
"recentList"
);

const clearButton=
document.getElementById(
"clearButton"
);

const searchButton=
document.getElementById(
"searchButton"
);


/* ==================================================
 STATE
================================================== */

let allItems=[];

let activeCategory="all";

let searchTimer=null;


/* ==================================================
 COLLECTION MAP
================================================== */

const collectionMap={

courses:{
collection:"courses",
label:"Course",
icon:"📚",
link:"course.html"
},

resources:{
collection:"resources",
label:"Resource",
icon:"📄",
link:"resource.html"
},

scholarships:{
collection:"scholarships",
label:"Scholarship",
icon:"🎓",
link:"scholarships.html"
},

careers:{
collection:"careers",
label:"Career",
icon:"💼",
link:"career.html"
},

community:{
collection:"posts",
label:"Community",
icon:"👥",
link:"community.html"
},

quizzes:{
collection:"quizzes",
label:"Quiz",
icon:"🧠",
link:"quiz.html"

}

};


/* ==================================================
 LOAD ALL SEARCHABLE CONTENT
================================================== */

async function loadSearchData(){

resultsBox.innerHTML=`

<div class="loading">

<div class="spinner"></div>

Loading LetsStudy Pro content...

</div>

`;

try{

const categories=
Object.keys(
collectionMap
);


const requests=
categories.map(
async category=>{

const config=
collectionMap[category];

const snapshot=
await getDocs(
collection(
db,
config.collection
)
);


return snapshot.docs.map(
document=>({

id:document.id,

category,

...document.data()

})
);

});


const data=
await Promise.all(
requests
);


allItems=
data.flat();


resultCount.textContent=
`${allItems.length} searchable items available.`;


renderResults();

}catch(error){

console.error(
"Search loading error:",
error
);

resultsBox.innerHTML=`

<div class="error">

⚠️ Unable to load search content.

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

}


/* ==================================================
 SEARCH
================================================== */

function performSearch(){

const term=
input.value
.trim()
.toLowerCase();


if(term){

saveRecentSearch(
input.value.trim()
);

}


renderResults();

}


/* ==================================================
 RENDER
================================================== */

function renderResults(){

const term=
input.value
.trim()
.toLowerCase();


let items=
allItems.filter(
item=>{

if(
activeCategory!=="all" &&
item.category!==activeCategory
){

return false;

}


if(!term)
return true;


const searchable=
[

item.title,

item.name,

item.description,

item.content,

item.subject,

item.categoryName,

item.author,

item.instructor,

item.skills,

item.tags,

item.location,

item.company

]
.map(
value=>
Array.isArray(value)
?
value.join(" ")
:
String(value||"")
)
.join(" ")
.toLowerCase();


return searchable.includes(term);

});


/*
Score exact title matches first.
*/

if(term){

items.sort(
(a,b)=>{

const aTitle=
String(
a.title||
a.name||
""
).toLowerCase();

const bTitle=
String(
b.title||
b.name||
""
).toLowerCase();


const aExact=
aTitle===term
?
3
:
aTitle.startsWith(term)
?
2
:
aTitle.includes(term)
?
1
:
0;


const bExact=
bTitle===term
?
3
:
bTitle.startsWith(term)
?
2
:
bTitle.includes(term)
?
1
:
0;


return bExact-aExact;

});

}


resultCount.textContent=
term
?
`${items.length} result${items.length===1?"":"s"} found`
:
`${items.length} items available`;


if(!items.length){

resultsBox.innerHTML=`

<div class="empty">

<div class="empty-icon">
🔎
</div>

<strong>
No results found
</strong>

<br><br>

Try another keyword or select a different category.

</div>

`;

return;

}


resultsBox.innerHTML=
items.map(
renderCard
).join("");

}


/* ==================================================
 RESULT CARD
================================================== */

function renderCard(item){

const config=
collectionMap[
item.category
];


const title=
item.title||
item.name||
"Untitled";


const description=
item.description||
item.summary||
item.content||
"Explore this item on LetsStudy Pro.";


const image=
item.image||
item.imageUrl||
item.thumbnail||
item.coverImage||
"";


const price=
item.price||
item.amount||
"";


const id=
item.id;


const link=
buildLink(
item,
config
);


return`

<article class="result">

<div class="result-image">

${
image
?
`
<img
src="${escapeAttr(image)}"
alt="${escapeAttr(title)}"
loading="lazy"
onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
>
`
:
""
}

<div
class="result-placeholder"
style="${image?"display:none":""}">

${config.icon}

</div>

</div>


<div class="result-body">

<span class="badge">

${escapeHTML(
config.label
)}

</span>


<div class="result-title">

${escapeHTML(title)}

</div>


<div class="result-description">

${escapeHTML(
truncate(description,120)
)}

</div>


<div class="result-footer">

<div class="result-meta">

${
price
?
escapeHTML(
String(price)
)
:
"Learn more"
}

</div>


<button
class="open-btn"
onclick="openResult('${escapeAttr(link)}')">

Open →

</button>

</div>

</div>

</article>

`;

}


/* ==================================================
 BUILD INTERNAL LINK
================================================== */

function buildLink(item,config){

const customLink=
item.link||
item.url||
item.href;


if(
customLink &&
isInternalLink(customLink)
){

return customLink;

}


const id=
encodeURIComponent(
item.id
);


switch(item.category){

case"courses":

return `course.html?courseId=${id}`;

case"resources":

return `resource.html?resourceId=${id}`;

case"scholarships":

return `scholarship.html?scholarshipId=${id}`;

case"careers":

return `career.html?careerId=${id}`;

case"community":

return `community.html?postId=${id}`;

case"quizzes":

return `quiz.html?quizId=${id}`;

default:

return config.link;

}

}


/* ==================================================
 OPEN RESULT
================================================== */

window.openResult=
function(link){

if(!link)
return;


if(
link.startsWith("http")
){

window.location.href=link;

}else{

window.location.href=link;

}

};


/* ==================================================
 FILTERS
================================================== */

document
.querySelectorAll(".filter")
.forEach(
button=>{

button.addEventListener(
"click",
()=>{

document
.querySelectorAll(".filter")
.forEach(
item=>
item.classList.remove(
"active"
)
);

button.classList.add(
"active"
);

activeCategory=
button.dataset.category;

renderResults();

}

);

}
);


/* ==================================================
 LIVE SEARCH
================================================== */

input.addEventListener(
"input",
()=>{

clearTimeout(
searchTimer
);


searchTimer=
setTimeout(
()=>{

renderResults();

},
250
);

});


/* ==================================================
 SEARCH BUTTON
================================================== */

searchButton.addEventListener(
"click",
performSearch
);


input.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter"
){

performSearch();

}

});


/* ==================================================
 CLEAR
================================================== */

clearButton.addEventListener(
"click",
()=>{

input.value="";

activeCategory="all";


document
.querySelectorAll(".filter")
.forEach(
item=>
item.classList.remove(
"active"
)
);


document
.querySelector(
'.filter[data-category="all"]'
)
.classList.add(
"active"
);


renderResults();

input.focus();

});


/* ==================================================
 RECENT SEARCHES
================================================== */

function getRecentSearches(){

try{

return JSON.parse(
localStorage.getItem(
"letsStudyRecentSearches"
)
)||[];

}catch{

return[];

}

}


function saveRecentSearch(value){

if(!value)
return;


let searches=
getRecentSearches();


searches=
searches.filter(
item=>
item.toLowerCase()!==value.toLowerCase()
);


searches.unshift(value);


searches=
searches.slice(0,8);


localStorage.setItem(
"letsStudyRecentSearches",
JSON.stringify(searches)
);


renderRecent();

}


function renderRecent(){

const searches=
getRecentSearches();


if(!searches.length){

recentSection.style.display=
"none";

return;

}


recentSection.style.display=
"block";


recentList.innerHTML=
searches.map(
item=>`

<button
class="recent-item"
data-search="${escapeAttr(item)}">

${escapeHTML(item)}

</button>

`
).join("");


recentList
.querySelectorAll(
".recent-item"
)
.forEach(
button=>{

button.addEventListener(
"click",
()=>{

input.value=
button.dataset.search;

renderResults();

}

);

}
);

}


/* ==================================================
 HELPERS
================================================== */

function truncate(value,length){

value=
String(value||"");


return value.length>length
?
value.substring(0,length)+"..."
:
value;

}


function isInternalLink(url){

return(
url.startsWith("/") ||
url.startsWith("./") ||
url.startsWith("../") ||
!url.includes("://")
);

}


function escapeHTML(value){

return String(value??"")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(value){

return String(value??"")

.replace(/\\/g,"\\\\")
.replace(/'/g,"&#039;")
.replace(/"/g,"&quot;");

}


/* ==================================================
 INITIALIZE
================================================== */

renderRecent();

loadSearchData();


</script></body>
</html>
