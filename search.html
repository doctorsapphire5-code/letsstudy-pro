<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search | LetsStudy Pro</title>

  <meta name="description"
    content="Search courses, resources, scholarships, careers, videos, services, businesses, community, marketplace and more on LetsStudy Pro.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #172033;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 18px 20px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    #searchInput {
      flex: 1;
      padding: 15px 17px;
      border: 1px solid #d7dce5;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    #searchInput:focus {
      border-color: #2563eb;
    }

    #searchButton {
      border: 0;
      background: #2563eb;
      color: white;
      padding: 0 22px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .filters {
      max-width: 1100px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter {
      border: 1px solid #d9dee8;
      background: white;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .filter.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px 60px;
    }

    .search-info {
      color: #667085;
      margin-bottom: 18px;
    }

    #results {
      display: grid;
      gap: 15px;
    }

    .result {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .result-title {
      font-size: 19px;
      font-weight: 750;
      margin: 0 0 8px;
    }

    .meta {
      color: #667085;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .description {
      color: #475467;
      line-height: 1.5;
    }

    .badge {
      white-space: nowrap;
      height: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .free {
      background: #dcfce7;
      color: #166534;
    }

    .plan {
      background: #fef3c7;
      color: #92400e;
    }

    .actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .action {
      display: inline-block;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
    }

    .secondary {
      background: #eef2ff;
      color: #1e40af;
    }

    .empty,
    .loading,
    .error {
      text-align: center;
      background: white;
      border: 1px solid #e5e7eb;
      padding: 35px 20px;
      border-radius: 16px;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #667085;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    @media (max-width: 600px) {
      .search-box {
        flex-direction: column;
      }

      #searchButton {
        height: 48px;
      }

      .result-top {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">📚 LetsStudy Pro</div>

    <form class="search-box" id="searchForm">
      <input
        id="searchInput"
        type="search"
        placeholder="Search anything..."
        autocomplete="off"
      >

      <button id="searchButton" type="submit">
        🔎 Search
      </button>
    </form>

  </div>
</header>

<div class="filters" id="filters">

  <button class="filter active" data-type="all">
    All
  </button>

  <button class="filter" data-type="courses">
    Courses
  </button>

  <button class="filter" data-type="resources">
    Resources
  </button>

  <button class="filter" data-type="scholarships">
    Scholarships
  </button>

  <button class="filter" data-type="careers">
    Careers
  </button>

  <button class="filter" data-type="videos">
    Videos
  </button>

  <button class="filter" data-type="services">
    Services
  </button>

  <button class="filter" data-type="businesses">
    Businesses
  </button>

  <button class="filter" data-type="community">
    Community
  </button>

  <button class="filter" data-type="marketplace">
    Marketplace
  </button>

  <button class="filter" data-type="freelancers">
    Freelancers
  </button>

</div>

<main>

  <div class="search-info" id="searchInfo">
    Search LetsStudy Pro
  </div>

  <div id="results">
    <div class="empty">
      🔎 Enter something to search.
    </div>
  </div>

</main>

<footer>
  <strong>LetsStudy Pro</strong>
  <br>
  Learn. Build. Work. Grow.
  <br><br>
  © 2026 LetsStudy Pro. All rights reserved.
</footer>


<!-- Firebase -->
<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =====================================================
     FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {

    apiKey: "WEKA_API_KEY_YAKO_HAPA",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  /* =====================================================
     SEARCH COLLECTIONS
  ===================================================== */

  const COLLECTIONS = [

    "courses",
    "resources",
    "scholarships",
    "careers",
    "videos",
    "services",
    "businesses",
    "community",
    "marketplace",
    "profiles",
    "freelancers",
    "website",
    "ads",
    "sponsors"

  ];


  /* =====================================================
     ROUTING SYSTEM
  ===================================================== */

  const ROUTES = {

    courses: {
      free: "/enroll.html",
      plan: "/course-cart.html"
    },

    resources: {
      free: "/download.html",
      plan: "/resources-cart.html"
    },

    scholarships: {
      free: "/scholarship-details.html"
    },

    careers: {
      free: "/career-details.html"
    },

    videos: {
      free: "/watch.html",
      plan: "/video-cart.html"
    },

    services: {
      free: "/service-details.html",
      plan: "/service-cart.html"
    },

    businesses: {
      free: "/business-details.html"
    },

    community: {
      free: "/groups.html",
      plan: "/community-cart.html"
    },

    marketplace: {
      free: "/marketplace-details.html",
      plan: "/marketplace-cart.html"
    },

    profiles: {
      free: "/profile-details.html"
    },

    freelancers: {
      free: "/freelancer-details.html",
      plan: "/freelancer-cart.html"
    },

    website: {
      free: "/website-post.html"
    },

    ads: {
      free: "/ads.html"
    },

    sponsors: {
      free: "/sponsor.html"
    }

  };


  /* =====================================================
     VARIABLES
  ===================================================== */

  const searchForm =
    document.getElementById("searchForm");

  const searchInput =
    document.getElementById("searchInput");

  const resultsBox =
    document.getElementById("results");

  const searchInfo =
    document.getElementById("searchInfo");

  const filters =
    document.querySelectorAll(".filter");

  let selectedType = "all";

  let searchIndex = [];


  /* =====================================================
     HELPERS
  ===================================================== */

  function clean(value) {

    return String(value ?? "")
      .toLowerCase()
      .trim();

  }


  function getAccess(data) {

    const value = clean(
      data.access ||
      data.plan ||
      data.typeAccess ||
      data.visibility ||
      "free"
    );

    if (
      value.includes("plan") ||
      value.includes("premium") ||
      value.includes("paid")
    ) {
      return "plan";
    }

    return "free";
  }


  function makeSearchable(data) {

    return [

      data.title,
      data.name,
      data.description,
      data.content,
      data.keywords,
      data.tags,
      data.category,
      data.subject,
      data.course,
      data.level,
      data.form,
      data.type

    ]
      .flat()
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

  }


  function normalizeItem(
    data,
    id,
    type
  ) {

    return {

      id,

      type,

      title:
        data.title ||
        data.name ||
        data.courseName ||
        data.resourceName ||
        "Untitled",

      description:
        data.description ||
        data.summary ||
        data.content ||
        "",

      image:
        data.image ||
        data.imageUrl ||
        data.thumbnail ||
        "",

      access:
        getAccess(data),

      searchableText:
        makeSearchable(data),

      raw: data

    };

  }


  /* =====================================================
     LOAD FIREBASE DATA
  ===================================================== */

  async function loadSearchIndex() {

    resultsBox.innerHTML = `
      <div class="loading">
        ⏳ Loading LetsStudy Pro data...
      </div>
    `;

    searchIndex = [];

    for (const collectionName of COLLECTIONS) {

      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              collectionName
            )
          );

        snapshot.forEach(doc => {

          const data = doc.data();

          searchIndex.push(
            normalizeItem(
              data,
              doc.id,
              collectionName
            )
          );

        });

      } catch (error) {

        console.warn(
          `Collection "${collectionName}" skipped:`,
          error.message
        );

      }

    }

    console.log(
      "LetsStudy Pro Search Index:",
      searchIndex.length
    );

    searchInfo.textContent =
      `${searchIndex.length} items available`;

    const params =
      new URLSearchParams(
        window.location.search
      );

    const initialQuery =
      params.get("q") || "";

    if (initialQuery) {

      searchInput.value =
        initialQuery;

      performSearch(
        initialQuery
      );

    } else {

      resultsBox.innerHTML = `
        <div class="empty">
          🔎 Search courses, resources,
          scholarships, careers and more.
        </div>
      `;

    }

  }


  /* =====================================================
     SEARCH ENGINE
  ===================================================== */

  function performSearch(query) {

    query = clean(query);

    if (!query) {

      resultsBox.innerHTML = `
        <div class="empty">
          🔎 Enter something to search.
        </div>
      `;

      return;
    }


    const words =
      query
        .split(/\s+/)
        .filter(Boolean);


    let matches =
      searchIndex.filter(item => {

        if (
          selectedType !== "all" &&
          item.type !== selectedType
        ) {
          return false;
        }

        return words.every(word =>
          item.searchableText.includes(word)
        );

      });


    /* ===============================
       RANKING
    =============================== */

    matches.sort((a, b) => {

      const aTitle =
        clean(a.title);

      const bTitle =
        clean(b.title);

      const aScore =
        aTitle === query ? 100 :
        aTitle.includes(query) ? 50 :
        a.searchableText.includes(query) ? 20 :
        1;

      const bScore =
        bTitle === query ? 100 :
        bTitle.includes(query) ? 50 :
        b.searchableText.includes(query) ? 20 :
        1;

      return bScore - aScore;

    });


    renderResults(
      matches,
      query
    );

  }


  /* =====================================================
     ROUTE
  ===================================================== */

  function getRoute(item) {

    const route =
      ROUTES[item.type];

    if (!route) {
      return "#";
    }

    return (
      route[item.access] ||
      route.free ||
      "#"
    );

  }


  /* =====================================================
     RENDER RESULTS
  ===================================================== */

  function renderResults(
    matches,
    query
  ) {

    searchInfo.textContent =
      `${matches.length} result${
        matches.length === 1 ? "" : "s"
      } for "${query}"`;


    if (!matches.length) {

      resultsBox.innerHTML = `
        <div class="empty">

          <div style="font-size:35px">
            🔎
          </div>

          <h3>No results found</h3>

          <p>
            Try another keyword or category.
          </p>

        </div>
      `;

      return;
    }


    resultsBox.innerHTML =
      matches
        .slice(0, 100)
        .map(item => {

          const route =
            getRoute(item);

          const encodedId =
            encodeURIComponent(
              item.id
            );

          const encodedType =
            encodeURIComponent(
              item.type
            );

          const finalUrl =
            `${route}?id=${encodedId}&type=${encodedType}`;


          const accessClass =
            item.access === "plan"
              ? "plan"
              : "free";


          const accessLabel =
            item.access === "plan"
              ? "💎 PLAN"
              : "🆓 FREE";


          return `

            <article class="result">

              <div class="result-top">

                <div>

                  <h2 class="result-title">
                    ${escapeHtml(
                      item.title
                    )}
                  </h2>

                  <div class="meta">
                    ${escapeHtml(
                      capitalize(
                        item.type
                      )
                    )}
                  </div>

                </div>

                <span
                  class="badge ${accessClass}"
                >
                  ${accessLabel}
                </span>

              </div>


              <div class="description">

                ${escapeHtml(
                  shorten(
                    item.description,
                    240
                  )
                )}

              </div>


              <div class="actions">

                <a
                  class="action"
                  href="${finalUrl}"
                >
                  View
                </a>

                ${
                  item.access === "free"
                    ? `
                      <a
                        class="action secondary"
                        href="${finalUrl}"
                      >
                        ${
                          item.type === "courses"
                            ? "Enroll"
                            :
                          item.type === "resources"
                            ? "Download"
                            :
                          item.type === "videos"
                            ? "Watch"
                            :
                          "Open"
                        }
                      </a>
                    `
                    :
                    `
                      <a
                        class="action secondary"
                        href="${finalUrl}"
                      >
                        Add to Cart
                      </a>
                    `
                }

              </div>

            </article>

          `;

        })
        .join("");

  }


  /* =====================================================
     UTILITIES
  ===================================================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function shorten(
    value,
    length
  ) {

    value =
      String(value ?? "");

    if (
      value.length <= length
    ) {
      return value;
    }

    return (
      value.substring(
        0,
        length
      ) + "..."
    );

  }


  function capitalize(value) {

    return String(value)
      .replace(
        /^./,
        char =>
          char.toUpperCase()
      );

  }


  /* =====================================================
     SEARCH SUBMIT
  ===================================================== */

  searchForm.addEventListener(
    "submit",
    event => {

      event.preventDefault();

      const query =
        searchInput.value.trim();

      const url =
        new URL(
          window.location.href
        );

      if (query) {

        url.searchParams.set(
          "q",
          query
        );

      } else {

        url.searchParams.delete("q");

      }

      history.pushState(
        {},
        "",
        url
      );

      performSearch(query);

    }
  );


  /* =====================================================
     FILTERS
  ===================================================== */

  filters.forEach(button => {

    button.addEventListener(
      "click",
      () => {

        filters.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );

        button.classList.add(
          "active"
        );

        selectedType =
          button.dataset.type;

        performSearch(
          searchInput.value
        );

      }
    );

  });


  /* =====================================================
     START
  ===================================================== */

  loadSearchIndex();

</script>

</body>
</html>
