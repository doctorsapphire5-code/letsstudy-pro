<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Search — LetsStudy Pro</title>

<meta name="description"
content="Search everything on LetsStudy Pro.">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#fff;
 color:#202124
}

header{
 padding:18px 24px;
 border-bottom:1px solid #eee
}

.logo{
 font-size:22px;
 font-weight:700
}

.logo a{
 color:#202124;
 text-decoration:none
}

main{
 max-width:1000px;
 margin:auto;
 padding:35px 20px
}

.search{
 display:flex;
 gap:10px;
 margin-bottom:20px
}

.search input{
 flex:1;
 padding:15px 20px;
 border:1px solid #dfe1e5;
 border-radius:28px;
 outline:none;
 font-size:16px
}

.search input:focus{
 box-shadow:0 1px 6px rgba(32,33,36,.18)
}

.search button{
 border:0;
 border-radius:24px;
 padding:0 24px;
 background:#1a73e8;
 color:white;
 font-weight:700;
 cursor:pointer
}

.filters{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin:10px 0 20px
}

.filter{
 border:1px solid #dadce0;
 background:white;
 border-radius:18px;
 padding:8px 14px;
 cursor:pointer
}

.filter.active{
 background:#1a73e8;
 color:white;
 border-color:#1a73e8
}

.info{
 color:#70757a;
 font-size:14px;
 margin-bottom:20px
}

.result{
 padding:18px 0;
 border-bottom:1px solid #eee;
 cursor:pointer
}

.result:hover .title{
 text-decoration:underline
}

.url{
 color:#188038;
 font-size:13px;
 margin-bottom:5px
}

.title{
 color:#1a0dab;
 font-size:20px;
 margin:0 0 6px
}

.description{
 color:#4d5156;
 line-height:1.55;
 margin:6px 0
}

.meta{
 display:flex;
 gap:8px;
 align-items:center;
 flex-wrap:wrap;
 font-size:12px;
 color:#70757a
}

.badge{
 padding:4px 8px;
 border-radius:10px;
 font-weight:700
}

.free{
 background:#e6f4ea;
 color:#137333
}

.plan{
 background:#fef7e0;
 color:#b06000
}

.sponsored{
 background:#fff3cd;
 color:#8a5a00
}

.empty{
 text-align:center;
 padding:60px 20px;
 color:#70757a
}

.loading{
 padding:40px;
 text-align:center;
 color:#70757a
}

@media(max-width:600px){
 .search{
   flex-direction:column
 }

 .search button{
   min-height:48px
 }

 .title{
   font-size:18px
 }
}
</style>
</head>

<body>

<header>
 <div class="logo">
   <a href="/">📚 LetsStudy Pro</a>
 </div>
</header>

<main>

<form id="searchForm" class="search">

 <input
   id="searchInput"
   type="search"
   placeholder="Search LetsStudy Pro..."
   autocomplete="off">

 <button type="submit">
   Search
 </button>

</form>

<div id="filters" class="filters"></div>

<div id="info" class="info">
 Loading...
</div>

<div id="results">
 <div class="loading">
   Loading LetsStudy Pro...
 </div>
</div>

</main>

<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

 apiKey:
   "YOUR_FIREBASE_API_KEY",

 authDomain:
   "let-s-study-pro-course.firebaseapp.com",

 projectId:
   "let-s-study-pro-course",

 storageBucket:
   "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
   "YOUR_MESSAGING_SENDER_ID",

 appId:
   "YOUR_FIREBASE_APP_ID"

};


const app =
 initializeApp(
   firebaseConfig
 );

const db =
 getFirestore(app);


/* =====================================================
   DIRECT FIREBASE COLLECTIONS
===================================================== */

const SECTORS = {

 courses:
   "course-details.html",

 resources:
   "resources-details.html",

 scholarships:
   "scholarship-details.html",

 careers:
   "career-details.html",

 videos:
   "video-details.html",

 services:
   "service-details.html",

 businesses:
   "business-details.html",

 community:
   "community-details.html",

 marketplace:
   "marketplace-details.html",

 profiles:
   "profile-details.html",

 freelancers:
   "freelancer-details.html",

 websites:
   "website-details.html",

 ads:
   "ad-details.html",

 sponsors:
   "sponsor-details.html"

};


/* =====================================================
   STATE
===================================================== */

let SEARCH_INDEX = [];

let currentType = "all";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
 document.getElementById(
   "searchForm"
 );

const input =
 document.getElementById(
   "searchInput"
 );

const filters =
 document.getElementById(
   "filters"
 );

const info =
 document.getElementById(
   "info"
 );

const results =
 document.getElementById(
   "results"
 );


/* =====================================================
   HELPERS
===================================================== */

function text(value){

 if(
   value === null ||
   value === undefined
 ){
   return "";
 }

 if(
   typeof value === "object"
 ){
   return "";
 }

 return String(value);

}


function lower(value){

 return text(value)
   .toLowerCase()
   .trim();

}


function escapeHtml(value){

 return text(value)
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");

}


/* =====================================================
   AUTOMATIC TITLE
===================================================== */

function getTitle(data){

 const fields = [

   "title",
   "name",
   "courseTitle",
   "resourceTitle",
   "scholarshipTitle",
   "careerTitle",
   "videoTitle",
   "serviceTitle",
   "businessName",
   "groupName",
   "productName",
   "marketplaceTitle",
   "profileName",
   "freelancerName",
   "websiteTitle",
   "sponsorName",
   "adTitle",
   "pageTitle",
   "displayName",
   "heading",
   "label"

 ];


 for(
   const field of fields
 ){

   const value =
     text(data?.[field]).trim();

   if(value){
     return value;
   }

 }


 return "Untitled";

}


/* =====================================================
   DESCRIPTION
===================================================== */

function getDescription(data){

 const fields = [

   "description",
   "shortDescription",
   "summary",
   "excerpt",
   "bio",
   "about",
   "details"

 ];


 for(
   const field of fields
 ){

   const value =
     text(data?.[field]).trim();

   if(value){
     return value;
   }

 }


 return "";

}


/* =====================================================
   ACCESS
===================================================== */

function getAccess(data){

 const values = [

   data?.access,
   data?.accessType,
   data?.pricing,
   data?.membership,
   data?.plan

 ];


 for(
   const value of values
 ){

   const v =
     lower(value);

   if(
     [
       "plan",
       "premium",
       "paid",
       "pro"
     ].includes(v)
   ){
     return "plan";
   }

   if(
     [
       "free",
       "public"
     ].includes(v)
   ){
     return "free";
   }

 }


 if(
   data?.premium === true ||
   data?.isPremium === true ||
   data?.paid === true
 ){
   return "plan";
 }


 return "free";

}


/* =====================================================
   SPONSORED
===================================================== */

function isSponsored(data){

 if(
   data?.sponsored === true ||
   data?.isSponsored === true ||
   data?.promoted === true ||
   data?.sponsor === true
 ){
   return true;
 }


 const type =
   lower(
     data?.type
   );


 return [
   "sponsored",
   "sponsor",
   "advertisement",
   "ad"
 ].includes(type);

}


/* =====================================================
   SEARCH TEXT
===================================================== */

function buildSearchText(data){

 const values = [];

 function walk(value){

   if(
     value === null ||
     value === undefined
   ){
     return;
   }

   if(
     typeof value === "string" ||
     typeof value === "number" ||
     typeof value === "boolean"
   ){

     values.push(
       String(value)
     );

     return;

   }

   if(
     Array.isArray(value)
   ){

     value.forEach(
       walk
     );

     return;

   }

   if(
     typeof value === "object"
   ){

     Object.values(value)
       .forEach(
         walk
       );

   }

 }

 walk(data);

 return lower(
   values.join(" ")
 );

}


/* =====================================================
   LOAD EVERY SECTOR DIRECTLY
===================================================== */

async function loadSearchData(){

 SEARCH_INDEX = [];

 info.textContent =
   "Loading search data...";


 for(
   const collectionName
   of Object.keys(SECTORS)
 ){

   try{

     const snapshot =
       await getDocs(
         collection(
           db,
           collectionName
         )
       );


     console.log(
       collectionName,
       snapshot.size
     );


     snapshot.forEach(
       docSnap => {

         const data =
           docSnap.data() || {};

         const id =
           docSnap.id;

         SEARCH_INDEX.push({

           id:

             id,

           collection:

             collectionName,

           title:

             getTitle(data),

           description:

             getDescription(data),

           access:

             getAccess(data),

           sponsored:

             isSponsored(data),

           searchable:

             buildSearchText(data),

           destination:

             `${
               SECTORS[
                 collectionName
               ]
             }?id=${
               encodeURIComponent(id)
             }`

         });

       }
     );


   }catch(error){

     console.warn(
       "Could not read:",
       collectionName,
       error
     );

   }

 }


 createFilters();

 /*
   SHOW EVERYTHING BEFORE SEARCH
 */

 performSearch("");

}


/* =====================================================
   FILTERS
===================================================== */

function createFilters(){

 filters.innerHTML = "";

 addFilter(
   "all",
   "All",
   true
 );


 const types =
   [
     ...new Set(
       SEARCH_INDEX.map(
         item =>
           item.collection
       )
     )
   ];


 types.forEach(
   type => {

     addFilter(
       type,
       type.charAt(0).toUpperCase() +
       type.slice(1)
     );

   }
 );

}


function addFilter(
 type,
 label,
 active = false
){

 const button =
   document.createElement(
     "button"
   );

 button.type =
   "button";

 button.className =
   active
     ? "filter active"
     : "filter";

 button.dataset.type =
   type;

 button.textContent =
   label;

 filters.appendChild(
   button
 );

}


/* =====================================================
   RANKING
===================================================== */

function rank(item, query){

 const q =
   lower(query);

 const title =
   lower(item.title);

 const description =
   lower(item.description);

 const searchable =
   lower(item.searchable);

 let score = 0;


 if(
   title === q
 ){
   score += 100000;
 }


 if(
   title.startsWith(q)
 ){
   score += 50000;
 }


 if(
   title.includes(q)
 ){
   score += 25000;
 }


 q.split(/\s+/)
   .filter(Boolean)
   .forEach(
     word => {

       if(title.includes(word)){
         score += 5000;
       }

       if(description.includes(word)){
         score += 1500;
       }

       if(searchable.includes(word)){
         score += 500;
       }

     }
   );


 return score;

}


/* =====================================================
   SEARCH
===================================================== */

function performSearch(query){

 query =
   lower(query);


 let items =
   SEARCH_INDEX;


 if(
   currentType !== "all"
 ){

   items =
     items.filter(
       item =>
         item.collection ===
         currentType
     );

 }


 if(!query){

   info.textContent =
     `${items.length} items`;

   render(
     items
   );

   return;

 }


 items =
   items

   .map(
     item => ({

       ...item,

       score:
         rank(
           item,
           query
         )

     })
   )

   .filter(
     item =>
       item.score > 0
   )

   .sort(
     (a,b) =>
       b.score - a.score
   );


 info.textContent =
   `${items.length} results`;

 render(items);

}


/* =====================================================
   RENDER
===================================================== */

function render(items){

 results.innerHTML = "";


 if(!items.length){

   results.innerHTML = `

     <div class="empty">
       No matching results.
     </div>

   `;

   return;

 }


 items.forEach(
   item => {

     const article =
       document.createElement(
         "article"
       );

     article.className =
       "result";


     const access =
       item.access === "plan"
         ? "Plan"
         : "Free";


     const accessClass =
       item.access === "plan"
         ? "plan"
         : "free";


     article.innerHTML = `

       <div class="url">
         LetsStudy Pro ·
         ${escapeHtml(
           item.collection
         )}
       </div>

       <h2 class="title">
         ${escapeHtml(
           item.title
         )}
       </h2>

       <div class="meta">

         <span
           class="badge ${accessClass}">
           ${access}
         </span>

         ${
           item.sponsored
             ? `
               <span
                 class="badge sponsored">
                 Sponsored
               </span>
             `
             : ""
         }

       </div>

       ${
         item.description
           ? `
             <p class="description">
               ${escapeHtml(
                 item.description
               )}
             </p>
           `
           : ""
       }

     `;


     article.addEventListener(
       "click",
       () => {

         window.location.href =
           item.destination;

       }
     );


     results.appendChild(
       article
     );

   }
 );

}


/* =====================================================
   EVENTS
===================================================== */

form.addEventListener(
 "submit",
 event => {

   event.preventDefault();

   performSearch(
     input.value
   );

 }
);


input.addEventListener(
 "input",
 () => {

   performSearch(
     input.value
   );

 }
);


filters.addEventListener(
 "click",
 event => {

   const button =
     event.target.closest(
       ".filter"
     );

   if(!button){
     return;
   }


   currentType =
     button.dataset.type;


   document
     .querySelectorAll(
       ".filter"
     )
     .forEach(
       item => {

         item.classList.remove(
           "active"
         );

       }
     );


   button.classList.add(
     "active"
   );


   performSearch(
     input.value
   );

 }
);


/* =====================================================
   START
===================================================== */

loadSearchData();

</script>

</body>
</html>
