/* =================================

================================= */

SEARCH AREA
================================= */

.searchwrap{

.searchbox{

/* =================================
SEARCH INFO

.search-info{

/* =================================
SUGGESTIONS
================================= */

.suggestion:hover{

}

.suggestion-title{

}

================================= */

#results{

  gap:20px;

/* =================================

================================= */

.result{

<script>

const sidebar =
  document.getElementById(
    "sidebar"
  );

const menuButton =
  document.getElementById(
    "menuButton"
  );

const closeSidebar =
  document.getElementById(
    "closeSidebar"
  );

const overlay =
  document.getElementById(
    "overlay"
  );


function openSidebar(){

  sidebar.classList.add(
    "open"
  );

  overlay.classList.add(
    "open"
  );

  menuButton.setAttribute(
    "aria-expanded",
    "true"
  );

  document.body.style.overflow =
    "hidden";

}


function closeMenu(){

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "open"
  );

  menuButton.setAttribute(
    "aria-expanded",
    "false"
  );

  document.body.style.overflow =
    "";

}


menuButton.addEventListener(
  "click",
  openSidebar
);


closeSidebar.addEventListener(
  "click",
  closeMenu
);


overlay.addEventListener(
  "click",
  closeMenu
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeMenu();

    }

  }
);


document
  .querySelectorAll(
    ".sidebar-menu a"
  )
  .forEach(link => {

    link.addEventListener(
      "click",
      closeMenu
    );

  });


const currentPage =
  location.pathname
    .split("/")
    .pop()
    .toLowerCase();


document
  .querySelectorAll(
    ".sidebar-menu a"
  )
  .forEach(link => {

    const href =
      link.getAttribute(
        "href"
      );


    if(
      href &&
      href.toLowerCase() ===
      currentPage
    ){

      link.classList.add(
        "active"
      );

    }

  });


document
  .getElementById(
    "authButton"
  )
  .addEventListener(
    "click",
    () => {

      location.href =
        "login.html";

    }
  );

</script>

    "marketplace-details.html",

  profiles:
    "profile-details.html",

  freelancers:
    "freelancer-details.html",

  websites:
    "website-details.html",

  ads:
    "ads-details.html",

  sponsors:
    "sponsor-details.html"

};


/* =================================
ELEMENTS
================================= */

const input =
  document.getElementById(
    "searchInput"
  );

const form =
  document.getElementById(
    "searchForm"
  );

const results =
  document.getElementById(
    "results"
  );

const filters =
  document.getElementById(
    "filters"
  );

const suggestions =
  document.getElementById(
    "suggestions"
  );

const searchInfo =
  document.getElementById(
    "searchInfo"
  );


/* =================================
SEARCH STATE
================================= */

let SEARCH_INDEX = [];

let currentType = "all";


/* =================================
TEXT HELPER
================================= */

function text(value){

  return String(
    value ?? ""
  ).trim();

}


/* =================================
NORMALIZE SEARCH TEXT
================================= */

function normalize(value){

  return text(value)
    .toLowerCase()
    .replace(
      /[^\p{L}\p{N}\s]/gu,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

}


/* =================================
GET SEARCH WORDS
================================= */

function getWords(value){

  return normalize(value)
    .split(" ")
    .filter(
      word =>
        word.length > 1
    );

}


/* =================================
GET TITLE
================================= */

function getTitle(
  data,
  id
){

  return text(

    data.title ||

    data.name ||

    data.courseName ||

    data.resourceName ||

    data.scholarshipName ||

    data.careerName ||

    data.businessName ||

    data.videoName ||

    data.serviceName ||

    data.displayName ||

    data.username ||

    id

  );

}


/* =================================
GET DESCRIPTION
================================= */

function getDescription(
  data
){

  return text(

    data.description ||

    data.summary ||

    data.excerpt ||

    data.about ||

    data.bio ||

    ""

  ).slice(
    0,
    180
  );

}


/* =================================
GET IMAGE
================================= */

function getImage(
  data
){

  return text(

    data.thumbnail ||

    data.image ||

    data.imageUrl ||

    data.coverImage ||

    ""

  );

}


/* =================================
ESCAPE HTML
================================= */

function escapeHTML(value){

  return text(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =================================
COLLECTION LABEL
================================= */

function collectionLabel(
  collectionId
){

  const labels = {

    courses:
      "Course",

    resources:
      "Resource",

    scholarships:
      "Scholarship",

    careers:
      "Career",

    videos:
      "Video",

    services:
      "Service",

    businesses:
      "Business",

    community:
      "Community",

    marketplace:
      "Marketplace",

    profiles:
      "Profile",

    freelancers:
      "Freelancer",

    websites:
      "Website",

    ads:
      "Advertisement",

    sponsors:
      "Sponsor"

  };


  return (
    labels[
      collectionId
    ] ||
    collectionId
  );

}


/* =================================
GET DETAIL PAGE
================================= */

function destination(
  item
){

  const page =
    PAGE_MAP[
      item.collectionId
    ];


  if(!page){

    const externalUrl =
      text(
        item.url ||
        item.link
      );


    return externalUrl || "#";

  }


  return (

    page +

    "?id=" +

    encodeURIComponent(
      item.documentId
    )

  );

}


/* =================================
GLOBAL RELEVANCE RANKING
================================= */

function score(
  item,
  query
){

  const q =
    normalize(query);


  if(!q){

    return 0;

  }


  const title =
    normalize(
      item.title
    );


  const description =
    normalize(
      item.description
    );


  const searchText =
    normalize(
      item.searchText
    );


  const queryWords =
    getWords(q);


  let value = 0;


  /* EXACT TITLE */

  if(
    title === q
  ){

    value += 10000;

  }


  /* TITLE START */

  if(
    title.startsWith(q)
  ){

    value += 6000;

  }


  /* TITLE CONTAINS */

  if(
    title.includes(q)
  ){

    value += 4000;

  }


  /* EXACT DESCRIPTION */

  if(
    description === q
  ){

    value += 2000;

  }


  /* DESCRIPTION START */

  if(
    description.startsWith(q)
  ){

    value += 1200;

  }


  /* DESCRIPTION CONTAINS */

  if(
    description.includes(q)
  ){

    value += 800;

  }


  /* EACH SEARCH WORD IN TITLE */

  queryWords.forEach(
    word => {

      if(
        title === word
      ){

        value += 3000;

      }
      else if(
        title.startsWith(word)
      ){

        value += 1800;

      }
      else if(
        title.includes(word)
      ){

        value += 1000;

      }

    }
  );


  /* WORDS IN DESCRIPTION */

  queryWords.forEach(
    word => {

      if(
        description.includes(word)
      ){

        value += 250;

      }

    }
  );


  /* FULL DATA MATCH */

  if(
    searchText.includes(q)
  ){

    value += 100;

  }


  /* INDIVIDUAL DATA WORD MATCH */

  queryWords.forEach(
    word => {

      if(
        word &&
        searchText.includes(word)
      ){

        value += 40;

      }

    }
  );


  /* SHORT CLEAN TITLE */

  if(
    title &&
    title.length <= 80
  ){

    value += 10;

  }


  /* SHORT RELEVANT TITLE */

  if(
    title.includes(q) &&
    title.length < 60
  ){

    value += 50;

  }


  return value;

}


/* =================================
CREATE FILTER BUTTONS
================================= */

function createFilters(){

  filters.innerHTML = "";


  addFilter(
    "all",
    "All"
  );


  COLLECTIONS.forEach(
    collectionId => {

      const exists =
        SEARCH_INDEX.some(
          item =>
            item.collectionId ===
            collectionId
        );


      if(exists){

        addFilter(

          collectionId,

          collectionLabel(
            collectionId
          )

        );

      }

    }
  );

}


/* =================================
ADD FILTER
================================= */

function addFilter(
  type,
  label
){

  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "filter";


  if(
    currentType === type
  ){

    button.classList.add(
      "active"
    );

  }


  button.textContent =
    label;


  button.addEventListener(
    "click",
    () => {

      currentType =
        type;

      createFilters();

      render();

    }
  );


  filters.appendChild(
    button
  );

}


/* =================================
RENDER RESULTS
================================= */

function render(){

  const query =
    normalize(
      input.value
    );


  let data =
    SEARCH_INDEX.filter(
      item => {

        if(
          currentType !==
          "all" &&
          item.collectionId !==
          currentType
        ){

          return false;

        }


        if(!query){

          return true;

        }


        return (
          score(
            item,
            query
          ) > 0
        );

      }
    );


  /* =================================
  APPLY GLOBAL SCORE
  ================================= */

  data =
    data.map(
      item => ({

        ...item,

        _score:
          score(
            item,
            query
          )

      })
    );


  /* =================================
  SORT EVERYTHING TOGETHER
  ================================= */

  data.sort(
    (a,b) => {

      if(
        b._score !==
        a._score
      ){

        return (
          b._score -
          a._score
        );

      }


      const aTitle =
        normalize(
          a.title
        );


      const bTitle =
        normalize(
          b.title
        );


      return aTitle.localeCompare(
        bTitle
      );

    }
  );


  /* =================================
  MAX RESULTS
  ================================= */

  data =
    data.slice(
      0,
      100
    );


  /* =================================
  INFO
  ================================= */

  if(query){

    searchInfo.textContent =
      `${data.length} result${
        data.length === 1
          ? ""
          : "s"
      } ranked by relevance`;

  }
  else{

    searchInfo.textContent =
      `${data.length} items available`;

  }


  results.innerHTML = "";


  /* =================================
  EMPTY
  ================================= */

  if(!data.length){

    results.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🔎
        </div>

        <h3>
          No results found
        </h3>

        <p>
          Try another search term.
        </p>

      </div>

    `;

    updateSuggestions(
      query
    );

    return;

  }


  /* =================================
  DISPLAY CARDS
  ================================= */

  data.forEach(
    item => {

      const article =
        document.createElement(
          "article"
        );


      article.className =
        "result";


      const title =
        escapeHTML(
          item.title
        );


      const description =
        escapeHTML(

          item.description ||

          "Explore this content on LetsStudy Pro."

        );


      const type =
        escapeHTML(

          collectionLabel(
            item.collectionId
          )

        );


      const url =
        destination(
          item
        );


      let imageHTML = `

        <div
          class="result-image-wrapper"
        >

          <div
            class="image-placeholder"
          >
            📚
          </div>

        </div>

      `;


      if(item.image){

        imageHTML = `

          <div
            class="result-image-wrapper"
          >

            <div
              class="image-placeholder"
            >
              📚
            </div>

            <img
              class="result-image"
              src="${escapeHTML(
                item.image
              )}"
              alt="${title}"
              loading="lazy"
              decoding="async"
            >

          </div>

        `;

      }


      article.innerHTML = `

        ${imageHTML}

        <div class="result-content">

          <div class="meta">
            ${type}
          </div>

          <h3>
            ${title}
          </h3>

          <p>
            ${description}
          </p>

          <a
            href="${escapeHTML(
              url
            )}"
            class="view-result"
          >

            <span>
              View Details
            </span>

            <span
              class="view-result-arrow"
            >
              →
            </span>

          </a>

        </div>

      `;


      /* CARD CLICK */

      article.addEventListener(
        "click",
        event => {

          if(
            event.target.closest(
              "a"
            )
          ){

            return;

          }


          if(
            url &&
            url !== "#"
          ){

            window.location.href =
              url;

          }

        }
      );


      /* IMAGE */

      const image =
        article.querySelector(
          ".result-image"
        );


      if(image){

        image.addEventListener(
          "load",
          () => {

            image.style.opacity =
              "1";


            const placeholder =
              image.previousElementSibling;


            if(placeholder){

              placeholder.style.display =
                "none";

            }

          }
        );


        image.addEventListener(
          "error",
          () => {

            image.style.display =
              "none";

          }
        );


        if(
          image.complete &&
          image.naturalWidth > 0
        ){

          image.style.opacity =
            "1";


          const placeholder =
            image.previousElementSibling;


          if(placeholder){

            placeholder.style.display =
              "none";

          }

        }

      }


      results.appendChild(
        article
      );

    }
  );


  updateSuggestions(
    query
  );

}


/* =================================
SEARCH SUGGESTIONS
================================= */

function updateSuggestions(
  query
){

  if(!query){

    suggestions.innerHTML =
      "";

    suggestions.style.display =
      "none";

    return;

  }


  const matches =
    SEARCH_INDEX

      .map(
        item => ({

          item,

          score:
            score(
              item,
              query
            )

        })
      )

      .filter(
        result =>
          result.score > 0
      )

      .sort(
        (a,b) =>
          b.score -
          a.score
      )

      .slice(
        0,
        6
      );


  if(!matches.length){

    suggestions.innerHTML =
      "";

    suggestions.style.display =
      "none";

    return;

  }


  suggestions.innerHTML =
    "";


  matches.forEach(
    result => {

      const item =
        result.item;


      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "suggestion";


      button.innerHTML = `

        <span
          class="suggestion-title"
        >

          ${escapeHTML(
            item.title
          )}

        </span>


        <span
          class="suggestion-type"
        >

          ${escapeHTML(

            collectionLabel(
              item.collectionId
            )

          )}

        </span>

      `;


      button.addEventListener(
        "click",
        () => {

          input.value =
            item.title;


          suggestions.style.display =
            "none";


          render();

        }
      );


      suggestions.appendChild(
        button
      );

    }
  );


  suggestions.style.display =
    "block";

}


/* =================================
SUBMIT
================================= */

form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    suggestions.style.display =
      "none";

    render();

  }
);


/* =================================
LIVE SEARCH
================================= */

input.addEventListener(
  "input",
  () => {

    render();

  }
);


/* =================================
CLOSE SUGGESTIONS
================================= */

document.addEventListener(
  "click",
  event => {

    if(
      !event.target.closest(
        ".searchwrap"
      )
    ){

      suggestions.style.display =
        "none";

    }

  }
);


/* =================================
LOAD ALL FIRESTORE DATA
================================= */

async function loadSearchData(){

  SEARCH_INDEX = [];


  results.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Loading LetsStudy Pro...

    </div>

  `;


  searchInfo.textContent =
    "Loading searchable content...";


  const jobs =
    COLLECTIONS.map(
      async collectionId => {

        try{

          const snapshot =
            await getDocs(

              collection(
                db,
                collectionId
              )

            );


          snapshot.forEach(
            docSnap => {

              const data =
                docSnap.data() || {};


              const documentId =
                docSnap.id;


              const title =
                getTitle(
                  data,
                  documentId
                );


              const description =
                getDescription(
                  data
                );


              const image =
                getImage(
                  data
                );


              const searchText =
                JSON.stringify(
                  data
                ).toLowerCase();


              SEARCH_INDEX.push({

                ...data,

                id:
                  documentId,

                documentId:
                  documentId,

                collectionId:
                  collectionId,

                collection:
                  collectionId,

                title:
                  title,

                description:
                  description,

                image:
                  image,

                searchText:
                  searchText

              });

            }
          );

        }
        catch(error){

          console.error(
            "Error loading:",
            collectionId,
            error
          );

        }

      }
    );


  await Promise.all(
    jobs
  );


  createFilters();

  render();

}


/* =================================
START SEARCH
================================= */

loadSearchData();

</script>
