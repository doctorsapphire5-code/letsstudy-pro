
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Search | LetsStudy Pro</title>

<meta name="description"
content="Search everything available on LetsStudy Pro.">

<link rel="icon" href="/favicon.png">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 color:#202124;
 background:#fff;
}

header{
 border-bottom:1px solid #eee;
 padding:18px 20px;
 position:sticky;
 top:0;
 background:#fff;
 z-index:10;
}

.header{
 max-width:1050px;
 margin:auto;
 display:flex;
 gap:20px;
 align-items:center;
}

.logo{
 font-size:20px;
 font-weight:700;
 white-space:nowrap;
}

.logo span{
 color:#1a73e8;
}

.searchBox{
 flex:1;
 display:flex;
 border:1px solid #dfe1e5;
 border-radius:28px;
 overflow:hidden;
 box-shadow:0 1px 5px #ddd;
}

.searchBox input{
 flex:1;
 border:0;
 outline:0;
 padding:14px 18px;
 font-size:16px;
}

.searchBox button{
 border:0;
 background:#1a73e8;
 color:#fff;
 padding:0 22px;
 cursor:pointer;
 font-weight:600;
}

main{
 max-width:1050px;
 margin:auto;
 padding:25px 20px 60px;
}

.filters{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:20px;
}

.filter{
 border:1px solid #dadce0;
 background:#fff;
 border-radius:20px;
 padding:8px 14px;
 cursor:pointer;
}

.filter.active{
 background:#e8f0fe;
 color:#1967d2;
}

.status{
 color:#5f6368;
 font-size:14px;
 margin-bottom:15px;
}

.results{
 max-width:850px;
}

.result{
 border-bottom:1px solid #eee;
 padding:20px 0;
 cursor:pointer;
}

.result-title{
 margin:0 0 7px;
 color:#1a0dab;
 font-size:20px;
}

.result-title:hover{
 text-decoration:underline;
}

.meta{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 align-items:center;
 color:#5f6368;
 font-size:13px;
}

.badge{
 padding:3px 8px;
 border-radius:12px;
 font-size:11px;
 font-weight:bold;
}

.free{
 background:#e6f4ea;
 color:#137333;
}

.plan{
 background:#fef7e0;
 color:#b06000;
}

.sponsored{
 color:#137333;
 font-weight:bold;
}

.description{
 color:#4d5156;
 line-height:1.5;
 font-size:14px;
 margin:9px 0;
}

.action{
 margin-top:8px;
 border:1px solid #dadce0;
 background:#fff;
 color:#1a73e8;
 padding:8px 15px;
 border-radius:18px;
 font-weight:600;
 cursor:pointer;
}

.empty{
 padding:50px 0;
 text-align:center;
 color:#5f6368;
}

footer{
 border-top:1px solid #eee;
 text-align:center;
 padding:30px 20px;
 color:#5f6368;
 font-size:13px;
}

@media(max-width:700px){
 .header{
  flex-direction:column;
  align-items:stretch;
 }
 .logo{text-align:center}
 .result-title{font-size:18px}
}
</style>
</head>

<body>

<header>
<div class="header">

<a href="/" class="logo">
📚 <span>LetsStudy</span> Pro
</a>

<form id="searchForm" class="searchBox">

<input
 id="searchInput"
 type="search"
 placeholder="Search everything on LetsStudy Pro..."
 autocomplete="off">

<button type="submit">Search</button>

</form>

</div>
</header>


<main>

<div id="filters" class="filters"></div>

<div id="status" class="status">
Loading LetsStudy Pro...
</div>

<section id="results" class="results"></section>

</main>


<footer>
<strong>LetsStudy Pro</strong>
<br>
Learn. Build. Work. Grow.
<br><br>
© 2026 LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

 measurementId:
 "G-85B7V5H5J0"

};


const app =
 initializeApp(firebaseConfig);

const db =
 getFirestore(app);


/* =====================================================
   FIREBASE COLLECTIONS
===================================================== */

const COLLECTIONS = [

 "courses",
 "resources",
 "scholarships",
 "careers",
 "videos",
 "services",
 "businesses",
 "community",
 "marketplace",
 "profiles",
 "freelancers",
 "websites",
 "ads",
 "sponsors"

];


/* =====================================================
   STATE
===================================================== */

let SEARCH_INDEX = [];

let currentType = "all";


const searchForm =
 document.getElementById(
  "searchForm"
 );

const searchInput =
 document.getElementById(
  "searchInput"
 );

const resultsEl =
 document.getElementById(
  "results"
 );

const statusEl =
 document.getElementById(
  "status"
 );

const filtersEl =
 document.getElementById(
  "filters"
 );


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

 return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =====================================================
   FIREBASE DATA → SEARCH TEXT
===================================================== */

function flatten(value){

 if(
  value === null ||
  value === undefined
 ){
  return "";
 }

 if(
  typeof value === "string" ||
  typeof value === "number" ||
  typeof value === "boolean"
 ){
  return String(value);
 }

 if(Array.isArray(value)){

  return value
   .map(flatten)
   .join(" ");

 }

 if(typeof value === "object"){

  return Object.entries(value)
   .map(
    ([key,val]) =>
     `${key} ${flatten(val)}`
   )
   .join(" ");

 }

 return "";

}


function buildSearchText(data){

 return flatten(data)
  .toLowerCase();

}


/* =====================================================
   AUTOMATIC TITLE
===================================================== */

function getTitle(data){

 const fields = [

  "title",
  "name",
  "courseTitle",
  "resourceTitle",
  "scholarshipTitle",
  "careerTitle",
  "videoTitle",
  "serviceTitle",
  "businessName",
  "groupName",
  "productName",
  "marketplaceTitle",
  "profileName",
  "freelancerName",
  "websiteTitle",
  "sponsorName",
  "adTitle",
  "subject",
  "heading"

 ];

 for(const field of fields){

  if(
   data[field] !== undefined &&
   data[field] !== null &&
   String(data[field]).trim()
  ){

   return String(data[field]).trim();

  }

 }

 return "Untitled";

}


/* =====================================================
   DESCRIPTION
===================================================== */

function getDescription(data){

 const fields = [

  "description",
  "shortDescription",
  "summary",
  "excerpt",
  "bio",
  "about",
  "details",
  "overview"

 ];

 for(const field of fields){

  if(
   data[field] !== undefined &&
   data[field] !== null &&
   String(data[field]).trim()
  ){

   return String(data[field]).trim();

  }

 }

 return "";

}


/* =====================================================
   FREE / PLAN
===================================================== */

function getAccess(data){

 const value =
  String(

   data.access ||
   data.plan ||
   data.pricing ||
   data.visibility ||
   data.type ||
   ""

  ).toLowerCase();


 if(

  value.includes("plan") ||
  value.includes("premium") ||
  value.includes("paid") ||
  value.includes("pro")

 ){

  return "plan";

 }

 return "free";

}


/* =====================================================
   SPONSOR
===================================================== */

function isSponsored(data){

 return (

  data.sponsored === true ||

  String(data.sponsored || "")
   .toLowerCase() === "true" ||

  String(data.type || "")
   .toLowerCase() === "sponsored" ||

  String(data.status || "")
   .toLowerCase() === "sponsored"

 );

}


/* =====================================================
   COLLECTION NAME
===================================================== */

function collectionName(value){

 const map = {

  courses:"Courses",
  resources:"Resources",
  scholarships:"Scholarships",
  careers:"Careers",
  videos:"Videos",
  services:"Services",
  businesses:"Businesses",
  community:"Community",
  marketplace:"Marketplace",
  profiles:"Profiles",
  freelancers:"Freelancers",
  websites:"Websites",
  ads:"LetsStudy Pro Ads",
  sponsors:"Sponsors"

 };

 return map[value] || value;

}


/* =====================================================
   DESTINATION
===================================================== */

function getDestination(item){

 const id =
  encodeURIComponent(item.id);

 const type =
  String(item.collection)
   .toLowerCase();


 switch(type){

  case "courses":

   return item.access === "plan"
    ? `/course-cart.html?courseId=${id}`
    : `/enroll.html?courseId=${id}`;


  case "resources":

   return item.access === "plan"
    ? `/resources-cart.html?resourceId=${id}`
    : `/download.html?resourceId=${id}`;


  case "scholarships":

   return `/scholarship-details.html?scholarshipId=${id}`;


  case "careers":

   return `/career-details.html?careerId=${id}`;


  case "videos":

   return item.access === "plan"
    ? `/video-cart.html?videoId=${id}`
    : `/watch.html?videoId=${id}`;


  case "services":

   return item.access === "plan"
    ? `/service-cart.html?serviceId=${id}`
    : `/service-details.html?serviceId=${id}`;


  case "businesses":

   return `/business-details.html?businessId=${id}`;


  case "community":

   return item.access === "plan"
    ? `/community-cart.html?communityId=${id}`
    : `/groups.html?groupId=${id}`;


  case "marketplace":

   return item.access === "plan"
    ? `/marketplace-cart.html?itemId=${id}`
    : `/marketplace-details.html?itemId=${id}`;


  case "profiles":

   return `/profile-details.html?profileId=${id}`;


  case "freelancers":

   return item.access === "plan"
    ? `/freelancer-cart.html?freelancerId=${id}`
    : `/freelancer-details.html?freelancerId=${id}`;


  case "websites":

   return `/website.html?websiteId=${id}`;


  case "ads":

   return `/ad-details.html?adId=${id}`;


  case "sponsors":

   return `/sponsor-details.html?sponsorId=${id}`;


  default:

   return `/?id=${id}`;

 }

}


/* =====================================================
   ACTION LABEL
===================================================== */

function getAction(item){

 const type =
  String(item.collection)
   .toLowerCase();


 if(type === "courses")
  return item.access === "plan"
   ? "Enroll"
   : "View Course";


 if(type === "resources")
  return item.access === "plan"
   ? "Get Resource"
   : "Download";


 if(type === "scholarships")
  return "View Scholarship";


 if(type === "careers")
  return "View Career";


 if(type === "videos")
  return item.access === "plan"
   ? "Get Video"
   : "Watch";


 if(type === "services")
  return item.access === "plan"
   ? "Get Service"
   : "View Service";


 if(type === "businesses")
  return "View Business";


 if(type === "community")
  return item.access === "plan"
   ? "Join Community"
   : "Join Group";


 if(type === "marketplace")
  return item.access === "plan"
   ? "Get Item"
   : "View Item";


 if(type === "profiles")
  return "View Profile";


 if(type === "freelancers")
  return item.access === "plan"
   ? "Hire"
   : "View Freelancer";


 if(type === "websites")
  return "View Website";


 if(type === "ads")
  return "View Ad";


 if(type === "sponsors")
  return "View Sponsor";


 return "View";

}


/* =====================================================
   LOAD FIREBASE
===================================================== */

async function loadFirebaseData(){

 SEARCH_INDEX = [];

 statusEl.textContent =
  "Loading LetsStudy Pro...";


 for(
  const name
  of COLLECTIONS
 ){

  try{

   const snapshot =
    await getDocs(
     collection(
      db,
      name
     )
    );


   snapshot.forEach(
    docSnap => {

     const data =
      docSnap.data() || {};


     SEARCH_INDEX.push({

      id:
       docSnap.id,

      collection:
       name,

      title:
       getTitle(data),

      description:
       getDescription(data),

      access:
       getAccess(data),

      sponsored:
       isSponsored(data),

      searchableText:
       buildSearchText(data),

      data

     });

    }
   );


  }catch(error){

   console.warn(
    "Collection skipped:",
    name,
    error
   );

  }

 }


 statusEl.textContent =
  `${SEARCH_INDEX.length} items`;

 createFilters();

 search("");

}


/* =====================================================
   FILTERS
===================================================== */

function createFilters(){

 filtersEl.innerHTML = "";


 const all =
  document.createElement(
   "button"
  );

 all.className =
  "filter active";

 all.dataset.type =
  "all";

 all.textContent =
  "All";

 filtersEl.appendChild(all);


 const types =
  [
   ...new Set(
    SEARCH_INDEX.map(
     item =>
      item.collection
    )
   )
  ];


 types.forEach(type => {

  const button =
   document.createElement(
    "button"
   );

  button.className =
   "filter";

  button.dataset.type =
   type;

  button.textContent =
   collectionName(type);

  filtersEl.appendChild(
   button
  );

 });

}


/* =====================================================
   RENDER
===================================================== */

function renderResults(items){

 resultsEl.innerHTML = "";


 if(!items.length){

  resultsEl.innerHTML = `
   <div class="empty">
    No matching results.
   </div>
  `;

  return;

 }


 items.forEach(item => {

  const article =
   document.createElement(
    "article"
   );

  article.className =
   "result";


  const title =
   escapeHtml(item.title);

  const description =
   escapeHtml(item.description);

  const type =
   escapeHtml(
    collectionName(
     item.collection
    )
   );


  const access =
   item.access === "plan"
    ? "Plan"
    : "Free";


  const badge =
   item.access === "plan"
    ? "plan"
    : "free";


  article.innerHTML = `

   <h2 class="result-title">
    ${title}
   </h2>

   <div class="meta">

    <span>${type}</span>

    <span
     class="badge ${badge}">
     ${access}
    </span>

    ${
     item.sponsored
      ? `
       <span class="sponsored">
        Sponsored
       </span>
      `
      : ""
    }

   </div>


   ${
    description
     ? `
      <div class="description">
       ${description}
      </div>
     `
     : ""
   }


   <button
    class="action"
    type="button">

    ${getAction(item)}

   </button>

  `;


  article.addEventListener(
   "click",
   () => {

    window.location.href =
     getDestination(item);

   }
  );


  resultsEl.appendChild(
   article
  );

 });

}


/* =====================================================
   SEARCH + RANKING
===================================================== */

function search(query){

 query =
  String(query || "")
   .toLowerCase()
   .trim();


 let items =
  SEARCH_INDEX;


 if(
  currentType !== "all"
 ){

  items =
   items.filter(
    item =>
     item.collection ===
     currentType
   );

 }


 if(!query){

  renderResults(items);

  return;

 }


 const words =
  query
   .split(/\s+/)
   .filter(Boolean);


 const ranked =
  items

   .map(item => {

    const title =
     item.title
      .toLowerCase();

    const description =
     item.description
      .toLowerCase();

    const text =
     item.searchableText;


    let score = 0;


    if(title === query)
     score += 10000;


    if(title.startsWith(query))
     score += 5000;


    if(title.includes(query))
     score += 3000;


    words.forEach(word => {

     if(title.includes(word))
      score += 1000;

     if(description.includes(word))
      score += 300;

     if(text.includes(word))
      score += 100;

    });


    return {
     ...item,
     score
    };

   })

   .filter(
    item =>
     item.score > 0
   )

   .sort(
    (a,b) =>
     b.score - a.score
   );


 renderResults(ranked);

}


/* =====================================================
   EVENTS
===================================================== */

searchForm.addEventListener(
 "submit",
 event => {

  event.preventDefault();

  search(
   searchInput.value
  );

 }
);


searchInput.addEventListener(
 "input",
 () => {

  search(
   searchInput.value
  );

 }
);


filtersEl.addEventListener(
 "click",
 event => {

  const button =
   event.target.closest(
    ".filter"
   );

  if(!button)
   return;


  currentType =
   button.dataset.type;


  document
   .querySelectorAll(
    ".filter"
   )
   .forEach(
    b =>
     b.classList.remove(
      "active"
     )
   );


  button.classList.add(
   "active"
  );


  search(
   searchInput.value
  );

 });


/* =====================================================
   START
===================================================== */

loadFirebaseData();

</script>

</body>
</html>
