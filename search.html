<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "YOUR_FIREBASE_API_KEY",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_FIREBASE_APP_ID"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


/* =====================================================
   ELEMENTS
===================================================== */

const searchForm =
  document.getElementById(
    "searchForm"
  );


const searchInput =
  document.getElementById(
    "searchInput"
  );


const filtersEl =
  document.getElementById(
    "filters"
  );


const infoEl =
  document.getElementById(
    "info"
  );


const resultsEl =
  document.getElementById(
    "results"
  );


/* =====================================================
   STATE
===================================================== */

let SEARCH_INDEX = [];

let currentType =
  "all";


/* =====================================================
   HELPERS
===================================================== */

function text(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  if(
    typeof value === "string" ||
    typeof value === "number" ||
    typeof value === "boolean"
  ){

    return String(value);

  }


  return "";

}


function lower(value){

  return text(value)
    .toLowerCase()
    .trim();

}


function escapeHtml(value){

  return text(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   TITLE DETECTION
===================================================== */

function getTitle(data){

  if(
    !data ||
    typeof data !== "object"
  ){

    return "Untitled";

  }


  const fields = [

    "title",
    "name",
    "courseTitle",
    "resourceTitle",
    "scholarshipTitle",
    "careerTitle",
    "videoTitle",
    "serviceTitle",
    "businessName",
    "groupName",
    "productName",
    "marketplaceTitle",
    "profileName",
    "freelancerName",
    "websiteTitle",
    "sponsorName",
    "adTitle",
    "pageTitle",
    "displayName",
    "heading",
    "label"

  ];


  for(
    const field
    of fields
  ){

    const value =
      text(
        data[field]
      ).trim();


    if(value){

      return value;

    }

  }


  /*
    Check nested objects.
  */

  for(
    const key
    of Object.keys(data)
  ){

    const value =
      data[key];


    if(
      value &&
      typeof value === "object" &&
      !Array.isArray(value)
    ){

      const nested =
        getTitle(
          value
        );


      if(
        nested &&
        nested !== "Untitled"
      ){

        return nested;

      }

    }

  }


  return "Untitled";

}


/* =====================================================
   DESCRIPTION
===================================================== */

function getDescription(data){

  const fields = [

    "description",
    "shortDescription",
    "summary",
    "excerpt",
    "bio",
    "about",
    "details",
    "content"

  ];


  for(
    const field
    of fields
  ){

    const value =
      text(
        data?.[field]
      ).trim();


    if(value){

      return value;

    }

  }


  return "";

}


/* =====================================================
   COLLECTION
===================================================== */

function getCollection(data){

  return lower(

    data?.collection ||
    data?.collectionName ||
    data?.sourceCollection ||
    data?.sector ||
    data?.resourceType ||
    data?.type ||
    "other"

  );

}


/* =====================================================
   ACCESS
===================================================== */

function getAccess(data){

  const values = [

    data?.access,
    data?.accessType,
    data?.plan,
    data?.pricing,
    data?.visibility,
    data?.membership,
    data?.subscriptionType

  ];


  for(
    const value
    of values
  ){

    const v =
      lower(value);


    if(
      v === "plan" ||
      v === "premium" ||
      v === "paid" ||
      v === "pro" ||
      v === "subscription"
    ){

      return "plan";

    }

    if(
      v === "free" ||
      v === "public"
    ){

      return "free";

    }

  }


  /*
    Boolean premium flags.
  */

  if(
    data?.premium === true ||
    data?.isPremium === true ||
    data?.paid === true ||
    data?.isPaid === true
  ){

    return "plan";

  }


  return "free";

}


/* =====================================================
   SPONSORED
===================================================== */

function isSponsored(data){

  if(
    data?.sponsored === true ||
    data?.isSponsored === true ||
    data?.sponsor === true ||
    data?.promoted === true
  ){

    return true;

  }


  const values = [

    data?.type,
    data?.status,
    data?.category,
    data?.contentType

  ];


  return values.some(
    value => {

      const v =
        lower(value);


      return (
        v === "sponsored" ||
        v === "sponsor" ||
        v === "ad" ||
        v === "advertisement"
      );

    }
  );

}


/* =====================================================
   TARGET ID
===================================================== */

function getTargetId(
  data,
  indexId
){

  const fields = [

    "targetId",
    "documentId",
    "recordId",
    "itemId",
    "resourceId",
    "courseId",
    "scholarshipId",
    "careerId",
    "videoId",
    "serviceId",
    "businessId",
    "groupId",
    "marketplaceId",
    "productId",
    "profileId",
    "freelancerId",
    "websiteId",
    "sponsorId",
    "adId",
    "id"

  ];


  for(
    const field
    of fields
  ){

    const value =
      text(
        data?.[field]
      ).trim();


    if(value){

      return value;

    }

  }


  return indexId;

}


/* =====================================================
   SEARCHABLE TEXT
===================================================== */

function buildSearchableText(
  data
){

  const parts = [];


  function walk(value){

    if(
      value === null ||
      value === undefined
    ){

      return;

    }


    if(
      typeof value === "string" ||
      typeof value === "number" ||
      typeof value === "boolean"
    ){

      parts.push(
        String(value)
      );

      return;

    }


    if(
      Array.isArray(value)
    ){

      value.forEach(
        walk
      );

      return;

    }


    if(
      typeof value === "object"
    ){

      Object.values(value)
        .forEach(
          walk
        );

    }

  }


  walk(data);


  return lower(
    parts.join(" ")
  );

}


/* =====================================================
   TYPE LABEL
===================================================== */

function formatType(value){

  const map = {

    courses:
      "Courses",

    resources:
      "Resources",

    scholarships:
      "Scholarships",

    careers:
      "Careers",

    videos:
      "Videos",

    services:
      "Services",

    businesses:
      "Businesses",

    community:
      "Community",

    groups:
      "Groups",

    marketplace:
      "Marketplace",

    profiles:
      "Profiles",

    users:
      "Profiles",

    freelancers:
      "Freelancers",

    freelancees:
      "Freelancers",

    websites:
      "Websites",

    website:
      "Websites",

    ads:
      "LetsStudy Pro Ads",

    sponsors:
      "Sponsors"

  };


  return (
    map[
      lower(value)
    ] ||
    text(value) ||
    "Other"
  );

}


/* =====================================================
   AUTOMATIC ACTION
===================================================== */

function getAction(item){

  const type =
    lower(
      item.collection
    );


  if(type === "courses"){

    return item.access === "plan"
      ? "Enroll"
      : "View Course";

  }


  if(type === "resources"){

    return item.access === "plan"
      ? "Get Resource"
      : "Download";

  }


  if(type === "scholarships"){

    return "View Scholarship";

  }


  if(type === "careers"){

    return "View Career";

  }


  if(type === "videos"){

    return item.access === "plan"
      ? "Get Video"
      : "Watch";

  }


  if(type === "services"){

    return item.access === "plan"
      ? "Get Service"
      : "View Service";

  }


  if(type === "businesses"){

    return "View Business";

  }


  if(
    type === "community" ||
    type === "groups"
  ){

    return item.access === "plan"
      ? "Join Community"
      : "Join Group";

  }


  if(type === "marketplace"){

    return item.access === "plan"
      ? "Get Item"
      : "View Item";

  }


  if(
    type === "profiles" ||
    type === "users"
  ){

    return "View Profile";

  }


  if(
    type === "freelancers" ||
    type === "freelancees"
  ){

    return item.access === "plan"
      ? "Hire"
      : "View Freelancer";

  }


  if(
    type === "websites" ||
    type === "website"
  ){

    return "View Website";

  }


  if(type === "ads"){

    return "View Ad";

  }


  if(type === "sponsors"){

    return "View Sponsor";

  }


  return "View";

}


/* =====================================================
   ROUTING
===================================================== */

function getDestination(item){

  const type =
    lower(
      item.collection
    );


  const id =
    encodeURIComponent(
      item.targetId ||
      item.id
    );


  /*
    External URL if explicitly supplied.
  */

  if(
    item.url &&
    /^https?:\/\//i.test(
      item.url
    )
  ){

    return item.url;

  }


  /*
    Free / Plan routing.
  */

  if(type === "courses"){

    if(
      item.access === "plan"
    ){

      return `course-cart.html?courseId=${id}`;

    }

    return `enroll.html?courseId=${id}`;

  }


  if(type === "resources"){

    if(
      item.access === "plan"
    ){

      return `resources-cart.html?resourceId=${id}`;

    }

    return `download.html?resourceId=${id}`;

  }


  if(type === "scholarships"){

    return `scholarship-details.html?id=${id}`;

  }


  if(type === "careers"){

    return `career-details.html?id=${id}`;

  }


  if(type === "videos"){

    if(
      item.access === "plan"
    ){

      return `video-cart.html?videoId=${id}`;

    }

    return `watch.html?videoId=${id}`;

  }


  if(type === "services"){

    if(
      item.access === "plan"
    ){

      return `service-cart.html?serviceId=${id}`;

    }

    return `service-details.html?id=${id}`;

  }


  if(type === "businesses"){

    return `business-details.html?id=${id}`;

  }


  if(
    type === "community" ||
    type === "groups"
  ){

    if(
      item.access === "plan"
    ){

      return `community-cart.html?groupId=${id}`;

    }

    return `groups.html?id=${id}`;

  }


  if(type === "marketplace"){

    if(
      item.access === "plan"
    ){

      return `marketplace-cart.html?itemId=${id}`;

    }

    return `marketplace-details.html?id=${id}`;

  }


  if(
    type === "profiles" ||
    type === "users"
  ){

    return `profile-details.html?id=${id}`;

  }


  if(
    type === "freelancers" ||
    type === "freelancees"
  ){

    if(
      item.access === "plan"
    ){

      return `freelancer-cart.html?freelancerId=${id}`;

    }

    return `freelancer-details.html?id=${id}`;

  }


  if(
    type === "websites" ||
    type === "website"
  ){

    return `website-details.html?id=${id}`;

  }


  if(type === "ads"){

    return item.url ||
      `ad-details.html?id=${id}`;

  }


  if(type === "sponsors"){

    return item.url ||
      `sponsor-details.html?id=${id}`;

  }


  return item.url ||
    `details.html?id=${id}`;

}


/* =====================================================
   LOAD SEARCH INDEX
===================================================== */

async function loadSearchIndex(){

  SEARCH_INDEX = [];


  resultsEl.innerHTML = `

    <div class="loading">
      Loading LetsStudy Pro...
    </div>

  `;


  infoEl.textContent =
    "Loading search index...";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "searchIndex"
        )
      );


    console.log(
      "SEARCH INDEX DOCUMENTS:",
      snapshot.size
    );


    snapshot.forEach(
      docSnap => {

        const data =
          docSnap.data() || {};


        const id =
          docSnap.id;


        const title =
          getTitle(data);


        const description =
          getDescription(data);


        const collectionName =
          getCollection(data);


        const targetId =
          getTargetId(
            data,
            id
          );


        const searchableText =
          buildSearchableText(
            data
          );


        SEARCH_INDEX.push({

          id:

            id,

          targetId:

            targetId,

          collection:

            collectionName,

          title:

            title,

          description:

            description,

          access:

            getAccess(data),

          sponsored:

            isSponsored(data),

          url:

            text(
              data.url ||
              data.link ||
              data.externalUrl ||
              data.website ||
              ""
            ),

          searchableText:

            searchableText,

          data:

            data

        });

      }
    );


    console.log(
      "LetsStudy Pro search index loaded:",
      SEARCH_INDEX
    );


    createFilters();


    /*
      IMPORTANT:
      Show everything immediately.
    */

    performSearch("");


  }catch(error){

    console.error(
      "Firestore searchIndex error:",
      error
    );


    infoEl.textContent =
      "Unable to load search index.";


    resultsEl.innerHTML = `

      <div class="error">

        Search is currently unavailable.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   FILTERS
===================================================== */

function createFilters(){

  filtersEl.innerHTML = "";


  const all =
    document.createElement(
      "button"
    );


  all.type =
    "button";


  all.className =
    "filter active";


  all.dataset.type =
    "all";


  all.textContent =
    "All";


  filtersEl.appendChild(
    all
  );


  const types =
    [
      ...new Set(

        SEARCH_INDEX

          .map(
            item =>
              lower(
                item.collection
              )
          )

                    .filter(Boolean)

      ];


  types.forEach(
    type => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "filter";

      button.dataset.type =
        type;

      button.textContent =
        formatType(
          type
        );

      filtersEl.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   RANKING
===================================================== */

function rankItem(
  item,
  query
){

  if(!query){
    return 0;
  }

  const q =
    lower(query);

  const title =
    lower(item.title);

  const description =
    lower(item.description);

  const searchable =
    lower(item.searchableText);

  let score = 0;

  if(title === q){
    score += 100000;
  }

  if(title.startsWith(q)){
    score += 50000;
  }

  if(title.includes(q)){
    score += 25000;
  }

  const words =
    q
      .split(/\s+/)
      .filter(Boolean);

  words.forEach(
    word => {

      if(title === word){
        score += 15000;
      }

      if(title.startsWith(word)){
        score += 8000;
      }

      if(title.includes(word)){
        score += 5000;
      }

      if(description.includes(word)){
        score += 1500;
      }

      if(searchable.includes(word)){
        score += 500;
      }

    }
  );

  /*
    Sponsored does not override
    relevance. It only gets a tiny
    tie-breaker.
  */

  if(item.sponsored){
    score += 10;
  }

  return score;

}


/* =====================================================
   SEARCH
===================================================== */

function performSearch(
  query
){

  query =
    lower(query);

  let items =
    SEARCH_INDEX;


  if(
    currentType !== "all"
  ){

    items =
      items.filter(
        item =>
          lower(
            item.collection
          ) ===
          lower(
            currentType
          )
      );

  }


  /*
    BEFORE SEARCH:
    show all available titles.
  */

  if(!query){

    infoEl.textContent =
      `${items.length} items`;

    renderResults(
      items
    );

    return;

  }


  /*
    SEARCH + AUTOMATIC RANKING
  */

  const ranked =
    items

      .map(
        item => ({

          ...item,

          score:
            rankItem(
              item,
              query
            )

        })
      )

      .filter(
        item =>
          item.score > 0
      )

      .sort(
        (a,b) => {

          if(
            b.score !==
            a.score
          ){

            return (
              b.score -
              a.score
            );

          }

          return lower(
            a.title
          ).localeCompare(
            lower(
              b.title
            )
          );

        }
      );


  infoEl.textContent =
    `${ranked.length} results`;

  renderResults(
    ranked
  );

}


/* =====================================================
   RENDER RESULTS
===================================================== */

function renderResults(
  items
){

  resultsEl.innerHTML = "";


  if(!items.length){

    resultsEl.innerHTML = `

      <div class="empty">

        No matching results.

      </div>

    `;

    return;

  }


  items.forEach(
    item => {

      const article =
        document.createElement(
          "article"
        );

      article.className =
        "result";


      const title =
        escapeHtml(
          item.title ||
          "Untitled"
        );


      const description =
        escapeHtml(
          item.description ||
          ""
        );


      const type =
        escapeHtml(
          formatType(
            item.collection
          )
        );


      const access =
        item.access === "plan"
          ? "Plan"
          : "Free";


      const accessClass =
        item.access === "plan"
          ? "plan"
          : "free";


      const action =
        getAction(
          item
        );


      const destination =
        getDestination(
          item
        );


      article.innerHTML = `

        <div class="result-top">

          <div>

            <h2 class="result-title">
              ${title}
            </h2>


            ${
              item.url
                ? `
                  <div class="result-url">
                    ${escapeHtml(
                      item.url
                    )}
                  </div>
                `
                : ""
            }


            <div class="result-meta">

              <span>
                ${type}
              </span>


              <span
                class="badge ${accessClass}"
              >
                ${access}
              </span>


              ${
                item.sponsored
                  ? `
                    <span
                      class="badge sponsored"
                    >
                      Sponsored
                    </span>
                  `
                  : ""
              }

            </div>

          </div>

        </div>


        ${
          description
            ? `
              <p class="result-description">
                ${description}
              </p>
            `
            : ""
        }


        <button
          type="button"
          class="action"
        >
          ${escapeHtml(
            action
          )}
        </button>

      `;


      article.addEventListener(
        "click",
        () => {

          window.location.href =
            destination;

        }
      );


      resultsEl.appendChild(
        article
      );

    }
  );

}


/* =====================================================
   FILTER EVENTS
===================================================== */

filtersEl.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".filter"
      );


    if(!button){
      return;
    }


    currentType =
      button.dataset.type ||
      "all";


    document
      .querySelectorAll(
        ".filter"
      )
      .forEach(
        element => {

          element.classList.remove(
            "active"
          );

        }
      );


    button.classList.add(
      "active"
    );


    performSearch(
      searchInput.value
    );

  }
);

    );

loadSearchIndex();
