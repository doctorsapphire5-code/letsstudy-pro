<!DOCTYPE html><html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LetsStudy Pro</title><style>

/* =================================
RESET
================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

/* =================================
HEADER
================================= */

.header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:70px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  padding:0 20px;
  z-index:900;
}

.menu-button{
  display:none;
  width:42px;
  height:42px;
  border:0;
  border-radius:10px;
  background:#f1f5f9;
  font-size:22px;
  cursor:pointer;
}

.header-brand{
  font-size:25px;
  font-weight:900;
  color:#111827;
  text-decoration:none;
  letter-spacing:-1px;
}

/* =================================
SIDEBAR
================================= */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:280px;
  background:#111827;
  color:#fff;
  z-index:1000;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  box-shadow:4px 0 25px rgba(0,0,0,.15);
}

.sidebar-brand{
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 15px;
  background:#0b1220;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand{
  font-size:34px;
  font-weight:900;
  color:#fff;
  letter-spacing:-1.8px;
  white-space:nowrap;
}

.close-sidebar{
  display:none;
  position:absolute;
  top:15px;
  right:15px;
  width:38px;
  height:38px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.sidebar-menu{
  flex:1;
  padding:16px 14px;
}

.sidebar-title{
  padding:16px 11px 8px;
  color:#94a3b8;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
}

.sidebar-menu a{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 13px;
  margin:4px 0;
  border-radius:10px;
  color:#dbe3ef;
  text-decoration:none;
  font-size:15px;
  font-weight:600;
  transition:.2s;
}

.sidebar-menu a:hover{
  background:rgba(255,255,255,.08);
  color:#fff;
}

.sidebar-menu a.active{
  background:#2563eb;
  color:#fff;
}

.sidebar-icon{
  width:24px;
  min-width:24px;
  text-align:center;
  font-size:18px;
}

.sidebar-bottom{
  padding:15px;
  border-top:1px solid rgba(255,255,255,.08);
}

.auth-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.auth-btn:hover{
  background:#1d4ed8;
}

/* =================================
CONTENT
================================= */

.page-content{
  margin-left:280px;
  padding-top:70px;
  min-height:100vh;
}

/* =================================
SEARCH
================================= */

main{
  max-width:1200px;
  margin:0 auto;
  padding:35px 25px 60px;
}

.searchwrap{
  position:relative;
  width:100%;
  max-width:850px;
  margin:0 auto 25px;
}

.searchbox{
  display:flex;
  gap:10px;
  width:100%;
}

.searchbox input{
  flex:1;
  height:52px;
  padding:0 17px;
  border:1px solid #d1d5db;
  border-radius:12px;
  outline:none;
  background:#fff;
  color:#111827;
  font-size:16px;
}

.searchbox input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.searchbox button{
  height:52px;
  padding:0 22px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.searchbox button:hover{
  background:#1d4ed8;
}

/* =================================
SUGGESTIONS
================================= */

.suggestions{
  position:absolute;
  top:60px;
  left:0;
  right:0;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  overflow:hidden;
  display:none;
  z-index:50;
}

.suggestion{
  padding:13px 16px;
  cursor:pointer;
  border-bottom:1px solid #f1f5f9;
  font-size:14px;
}

.suggestion:last-child{
  border-bottom:0;
}

.suggestion:hover{
  background:#f1f5f9;
}

/* =================================
FILTERS
================================= */

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:20px 0 30px;
}

.filter{
  padding:9px 15px;
  border:1px solid #d1d5db;
  border-radius:999px;
  background:#fff;
  color:#374151;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}

.filter:hover{
  border-color:#2563eb;
  color:#2563eb;
}

.filter.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

/* =================================
RESULTS
================================= */

#results{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
}

.result{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 4px 15px rgba(0,0,0,.04);
}

.result:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.result img{
  display:block;
  width:100%;
  height:160px;
  object-fit:cover;
  background:#e5e7eb;
}

.result-content{
  padding:17px;
}

.result h3{
  font-size:17px;
  line-height:1.35;
  margin-bottom:8px;
  color:#111827;
}

.result p{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
  margin-bottom:12px;
}

.meta{
  display:inline-block;
  padding:5px 9px;
  border-radius:6px;
  background:#eff6ff;
  color:#2563eb;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  color:#64748b;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:#64748b;
}

/* =================================
OVERLAY
================================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:999;
}

/* =================================
MOBILE
================================= */

@media(max-width:800px){

  .header{
    padding:0 15px;
  }

  .menu-button{
    display:block;
    margin-right:12px;
  }

  .header-brand{
    font-size:21px;
  }

  .sidebar{
    width:290px;
    transform:translateX(-100%);
    transition:transform .25s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .close-sidebar{
    display:block;
  }

  .brand{
    font-size:30px;
  }

  .page-content{
    margin-left:0;
  }

  .overlay.open{
    display:block;
  }

  main{
    padding:25px 15px 50px;
  }

  .searchbox{
    flex-direction:column;
  }

  .searchbox button{
    width:100%;
  }

  .suggestions{
    top:115px;
  }

  #results{
    grid-template-columns:1fr;
  }

}

/* =================================
SMALL MOBILE
================================= */

@media(max-width:450px){

  .sidebar{
    width:85%;
  }

  .brand{
    font-size:26px;
  }

  .searchbox input{
    font-size:15px;
  }

}

</script><!-- =================================
FIREBASE SEARCH
================================= --><script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =================================
FIREBASE CONFIG
================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/* =================================
ELEMENTS
================================= */

const input =
  document.getElementById("searchInput");

const form =
  document.getElementById("searchForm");

const results =
  document.getElementById("results");

const filters =
  document.getElementById("filters");

const suggestions =
  document.getElementById("suggestions");


/* =================================
COLLECTIONS
================================= */

const COLLECTIONS = [

  "courses",
  "resources",
  "scholarships",
  "careers",
  "videos",
  "services",
  "businesses",
  "community",
  "marketplace",
  "profiles",
  "freelancers",
  "websites",
  "ads",
  "sponsors"

];


/* =================================
DESTINATION PAGES
================================= */

const PAGE_MAP = {

  courses:
    "course-details.html",

  resources:
    "resources-details.html",

  scholarships:
    "scholarships-details.html",

  careers:
    "career-details.html",

  videos:
    "video-details.html",

  services:
    "service-details.html",

  businesses:
    "business-details.html",

  community:
    "community-details.html",

  marketplace:
    "marketplace-details.html",

  profiles:
    "profile-details.html",

  freelancers:
    "freelancer-details.html",

  websites:
    "website-details.html",

  ads:
    "ads-details.html",

  sponsors:
    "sponsor-details.html"

};


/* =================================
STATE
================================= */

let SEARCH_INDEX = [];

let currentType = "all";


/* =================================
TEXT HELPER
================================= */

function text(value){

  return String(value ?? "").trim();

}


/* =================================
TITLE
================================= */

function getTitle(data,id){

  return text(

    data.title ||
    data.name ||
    data.courseName ||
    data.resourceName ||
    data.scholarshipName ||
    data.careerName ||
    data.businessName ||
    data.videoName ||
    data.serviceName ||
    data.displayName ||
    data.username ||
    id

  );

}


/* =================================
DESCRIPTION
================================= */

function getDescription(data){

  return text(

    data.description ||
    data.summary ||
    data.excerpt ||
    data.about ||
    data.bio ||
    ""

  ).slice(0,180);

}


/* =================================
IMAGE
================================= */

function getImage(data){

  return text(

    data.thumbnail ||
    data.image ||
    data.imageUrl ||
    data.coverImage ||
    ""

  );

}


/* =================================
DESTINATION
================================= */

function destination(item){

  const page =
    PAGE_MAP[item.collectionId];


  if(!page){

    const url =
      text(item.url || item.link);

    return url || "#";

  }


  return (
    page +
    "?id=" +
    encodeURIComponent(item.documentId)
  );

}


/* =================================
LOAD FIRESTORE DATA
================================= */

async function loadSearchData(){

  SEARCH_INDEX = [];


  results.innerHTML = `
    <div class="loading">
      Loading LetsStudy Pro...
    </div>
  `;


  const jobs =
    COLLECTIONS.map(async collectionId => {

      try{

        const snapshot =
          await getDocs(
            collection(db,collectionId)
          );


        snapshot.forEach(docSnap => {

          const data =
            docSnap.data() || {};


          const documentId =
            docSnap.id;


          const item = {

            ...data,

            id:documentId,

            documentId:documentId,

            collectionId:collectionId,

            collection:collectionId,

            title:
              getTitle(
                data,
                documentId
              ),

            description:
              getDescription(data),

            image:
              getImage(data),

            searchText:
              JSON.stringify(data)
                .toLowerCase()

          };


          SEARCH_INDEX.push(item);

        });


      }catch(error){

        console.error(
          "Firestore collection failed:",
          collectionId,
          error
        );

      }

    });


  await Promise.all(jobs);


  createFilters();

  render();

}


/* =================================
FILTERS
================================= */

function createFilters(){

  filters.innerHTML = "";


  addFilter(
    "all",
    "All"
  );


  COLLECTIONS.forEach(collectionId => {

    const exists =
      SEARCH_INDEX.some(
        item =>
          item.collectionId === collectionId
      );


    if(exists){

      const label =
        collectionId
          .charAt(0)
          .toUpperCase() +
        collectionId.slice(1);


      addFilter(
        collectionId,
        label
      );

    }

  });

}


/* =================================
ADD FILTER
================================= */

function addFilter(type,label){

  const button =
    document.createElement("button");


  button.type = "button";


  button.className =
    "filter" +
    (
      currentType === type
      ? " active"
      : ""
    );


  button.textContent =
    label;


  button.addEventListener(
    "click",
    () => {

      currentType =
        type;

      createFilters();

      render();

    }
  );


  filters.appendChild(button);

}


/* =================================
SEARCH SCORE
================================= */

function score(item,query){

  if(!query){
    return 0;
  }


  const q =
    query.toLowerCase();


  const title =
    text(item.title)
      .toLowerCase();


  const description =
    text(item.description)
      .toLowerCase();


  const searchText =
    text(item.searchText);


  let value = 0;


  if(title === q){

    value += 1000;

  }


  if(title.startsWith(q)){

    value += 500;

  }


  if(title.includes(q)){

    value += 300;

  }


  if(description.includes(q)){

    value += 120;

  }


  if(searchText.includes(q)){

    value += 40;

  }


  q.split(/\s+/).forEach(word => {

    if(
      word &&
      title.includes(word)
    ){

      value += 100;

    }


    if(
      word &&
      description.includes(word)
    ){

      value += 30;

    }

  });


  return value;

}


/* =================================
ESCAPE HTML
================================= */

function escapeHTML(value){

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =================================
RENDER
================================= */

function render(){

  const query =
    input.value
      .trim()
      .toLowerCase();


  let data =
    SEARCH_INDEX.filter(item => {


      if(
        currentType !== "all" &&
        item.collectionId !== currentType
      ){

        return false;

      }


      if(!query){

        return true;

      }


      return score(item,query) > 0;

    });


  data.sort(
    (a,b) =>
      score(b,query) -
      score(a,query)
  );


  results.innerHTML = "";


  if(!data.length){

    results.innerHTML = `
      <div class="empty">
        <h3>No results found</h3>
        <p>Try another search term or category.</p>
      </div>
    `;

    updateSuggestions(query);

    return;

  }


  data.forEach(item => {

    const article =
      document.createElement("article");


    article.className =
      "result";


    const imageHTML =
      item.image
      ? `
        <img
          src="${escapeHTML(item.image)}"
          alt="${escapeHTML(item.title)}"
          loading="lazy"
        >
      `
      : "";


    article.innerHTML = `

      ${imageHTML}

      <div class="result-content">

        <h3>
          ${escapeHTML(item.title)}
        </h3>

        <p>
          ${escapeHTML(item.description)}
        </p>    <div class="meta">
      ${escapeHTML(item.collectionId)}
    </div>

  </div>
`;

/* =================================
   OPEN RESULT
================================= */

article.addEventListener("click", () => {

  const url = destination(item);

  if(url && url !== "#"){
    window.location.href = url;
  }

});


/* =================================
   IMAGE ERROR HANDLING
================================= */

const image =
  article.querySelector("img");

if(image){

  image.addEventListener("error", () => {

    image.remove();

  });

}


results.appendChild(article);

});

updateSuggestions(query);

}

/* =================================
SEARCH SUGGESTIONS
================================= */

function updateSuggestions(query){

if(!query){

suggestions.style.display = "none";

suggestions.innerHTML = "";

return;

}

const matches =
SEARCH_INDEX
.filter(item =>
item.title
.toLowerCase()
.includes(query)
)
.sort(
(a,b) =>
score(b,query) -
score(a,query)
)
.slice(0,6);

if(!matches.length){

suggestions.style.display = "none";

suggestions.innerHTML = "";

return;

}

suggestions.innerHTML = "";

matches.forEach(item => {

const div =
  document.createElement("div");

div.className =
  "suggestion";

div.textContent =
  item.title;


div.addEventListener("click", () => {

  input.value =
    item.title;

  suggestions.style.display =
    "none";

  render();

});


suggestions.appendChild(div);

});

suggestions.style.display =
"block";

}

/* =================================
FORM SUBMIT
================================= */

form.addEventListener("submit", event => {

event.preventDefault();

suggestions.style.display =
"none";

render();

});

/* =================================
LIVE SEARCH
================================= */

input.addEventListener("input", () => {

render();

});

/* =================================
