<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Search | LetsStudy Pro</title>

  <meta name="description"
        content="Search courses, resources, scholarships, careers, lessons, videos and more on LetsStudy Pro.">

  <meta name="robots"
        content="index,follow">

  <link rel="canonical"
        href="https://letsstudy.pro/search.html">

  <link rel="icon"
        href="/favicon.ico">

  <link rel="stylesheet"
        href="/search.css">
</head>

<body>

<header class="search-header">

  <a class="brand"
     href="/">
    LetsStudy Pro
  </a>

</header>


<main class="search-page">

  <section class="hero">

    <h1>Search LetsStudy Pro</h1>

    <p>
      Find courses, resources, scholarships,
      careers, lessons, videos and more.
    </p>


    <form id="searchForm"
          class="search-form">

      <div class="search-input-wrap">

        <input
          id="searchInput"
          type="search"
          placeholder="Search LetsStudy Pro..."
          autocomplete="off"
          maxlength="200"
          aria-label="Search"
        >

        <button
          type="button"
          id="voiceButton"
          title="Voice search"
          aria-label="Voice search">
          🎤
        </button>

        <button
          type="button"
          id="clearButton"
          title="Clear"
          aria-label="Clear search">
          ✕
        </button>

      </div>


      <button
        class="search-button"
        type="submit">
        Search
      </button>

    </form>


    <div
      id="suggestions"
      class="suggestions hidden">
    </div>

  </section>


  <section class="filters">

    <button
      class="filter active"
      data-category="all">
      All
    </button>

    <button
      class="filter"
      data-category="courses">
      Courses
    </button>

    <button
      class="filter"
      data-category="resources">
      Resources
    </button>

    <button
      class="filter"
      data-category="lessons">
      Lessons
    </button>

    <button
      class="filter"
      data-category="videos">
      Videos
    </button>

    <button
      class="filter"
      data-category="scholarships">
      Scholarships
    </button>

    <button
      class="filter"
      data-category="careers">
      Careers
    </button>

    <button
      class="filter"
      data-category="businesses">
      Businesses
    </button>

  </section>


  <section class="results-section">

    <div class="results-top">

      <h2 id="resultsTitle">
        Search results
      </h2>

      <span id="resultCount"></span>

    </div>


    <div
      id="loading"
      class="loading hidden">
      Searching...
    </div>


    <div
      id="error"
      class="error hidden">
    </div>


    <div
      id="results"
      class="results">
    </div>


    <div
      id="empty"
      class="empty hidden">

      <h3>No results found</h3>

      <p>
        Try another search term.
      </p>

    </div>

  </section>

</main>


<script src="/search.js"></script>

</body>
</html>
