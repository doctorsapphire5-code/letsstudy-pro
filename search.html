/* =====================================================

let SEARCH_INDEX = [];

/* =====================================================
   HELPERS
===================================================== */

function text(value){

  return String(
    value ?? ""
  )
  .trim();

}


function lower(value){

  return text(value)
    .toLowerCase();

}


function escapeHtml(value){

  return text(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   AUTOMATIC TITLE
===================================================== */

function getTitle(data){

  const fields = [

    "title",
    "name",
    "courseTitle",
    "resourceTitle",
    "scholarshipTitle",
    "careerTitle",
    "videoTitle",
    "serviceTitle",
    "businessName",
    "groupName",
    "productName",
    "marketplaceTitle",
    "profileName",
    "freelancerName",
    "websiteTitle",
    "sponsorName",
    "adTitle"

  ];


  for(
    const field
    of fields
  ){

    if(
      text(data[field])
    ){

      return text(
        data[field]
      );

    }

  }


  return "Untitled";

}


/* =====================================================
   AUTOMATIC DESCRIPTION
===================================================== */

function getDescription(data){

  const fields = [

    "description",
    "shortDescription",
    "summary",
    "excerpt",
    "overview",
    "bio",
    "about",
    "details"

  ];


  for(
    const field
    of fields
  ){

    if(
      text(data[field])
    ){

      return text(
        data[field]
      );

    }

  }


  return "";

}


/* =====================================================
   AUTOMATIC ACCESS
===================================================== */

function getAccess(data){

  const values = [

    data.access,
    data.plan,
    data.pricing,
    data.visibility,
    data.membership,
    data.tier,
    data.type

  ];


  const value =
    values
      .map(lower)
      .join(" ");


  if(

    value.includes("plan") ||
    value.includes("premium") ||
    value.includes("paid") ||
    value.includes("pro")

  ){

    return "plan";

  }


  return "free";

}


/* =====================================================
   AUTOMATIC SPONSOR
===================================================== */

function isSponsored(data){

  return (

    data.sponsored === true ||

    lower(data.sponsored)
      === "true" ||

    lower(data.type)
      === "sponsored" ||

    lower(data.status)
      === "sponsored"

  );

}


/* =====================================================
   COLLECTION LABEL
===================================================== */

function formatType(value){

  const map = {

    courses:
      "Courses",

    resources:
      "Resources",

    scholarships:
      "Scholarships",

    careers:
      "Careers",

    videos:
      "Videos",

    services:
      "Services",

    businesses:
      "Businesses",

    community:
      "Community",

    groups:
      "Groups",

    marketplace:
      "Marketplace",

    profiles:
      "Profiles",

    freelancers:
      "Freelancers",

    freelancees:
      "Freelancers",

    websites:
      "Websites",

    website:
      "Websites",

    ads:
      "LetsStudy Pro Ads",

    sponsors:
      "Sponsors"

  };


  return map[value]
    || value
    || "Other";

}


/* =====================================================
   ACTION
===================================================== */

function getAction(item){

  const type =
    lower(item.collection);


  if(type === "courses"){

    return item.access === "plan"
      ? "Enroll"
      : "View Course";

  }


  if(type === "resources"){

    return item.access === "plan"
      ? "Get Resource"
      : "Download";

  }


  if(type === "scholarships")
    return "View Scholarship";


  if(type === "careers")
    return "View Career";


  if(type === "videos"){

    return item.access === "plan"
      ? "Get Video"
      : "Watch";

  }


  if(type === "services"){

    return item.access === "plan"
      ? "Get Service"
      : "View Service";

  }


  if(type === "businesses")
    return "View Business";


  if(
    type === "community" ||
    type === "groups"
  ){

    return item.access === "plan"
      ? "Join Community"
      : "Join Group";

  }


  if(type === "marketplace"){

    return item.access === "plan"
      ? "Get Item"
      : "View Item";

  }


  if(type === "profiles")
    return "View Profile";


  if(
    type === "freelancers" ||
    type === "freelancees"
  ){

    return item.access === "plan"
      ? "Hire"
      : "View Freelancer";

  }


  if(
    type === "websites" ||
    type === "website"
  ){

    return "View Website";

  }


  if(type === "ads")
    return "View Ad";


  if(type === "sponsors")
    return "View Sponsor";


  return "View";

}


/* =====================================================
   ROUTING BY ID
===================================================== */

function getDestination(item){

  const id =
    encodeURIComponent(
      item.targetId ||
      item.itemId ||
      item.resourceId ||
      item.courseId ||
      item.profileId ||
      item.id
    );


  const type =
    lower(item.collection);


  if(type === "courses"){

    return item.access === "plan"

      ? `/course-cart.html?courseId=${id}`

      : `/enroll.html?courseId=${id}`;

  }


  if(type === "resources"){

    return item.access === "plan"

      ? `/resources-cart.html?resourceId=${id}`

      : `/download.html?resourceId=${id}`;

  }


  if(type === "scholarships")
    return `/scholarship-details.html?scholarshipId=${id}`;


  if(type === "careers")
    return `/career-details.html?careerId=${id}`;


  if(type === "videos"){

    return item.access === "plan"

      ? `/video-cart.html?videoId=${id}`

      : `/watch.html?videoId=${id}`;

  }


  if(type === "services"){

    return item.access === "plan"

      ? `/service-cart.html?serviceId=${id}`

      : `/service-details.html?serviceId=${id}`;

  }


  if(type === "businesses")
    return `/business-details.html?businessId=${id}`;


  if(
    type === "community" ||
    type === "groups"
  ){

    return item.access === "plan"

      ? `/community-cart.html?communityId=${id}`

      : `/groups.html?groupId=${id}`;

  }


  if(type === "marketplace"){

    return item.access === "plan"

      ? `/marketplace-cart.html?itemId=${id}`

      : `/marketplace-details.html?itemId=${id}`;

  }


  if(type === "profiles")
    return `/profile-details.html?profileId=${id}`;


  if(
    type === "freelancers" ||
    type === "freelancees"
  ){

    return item.access === "plan"

      ? `/freelancer-cart.html?freelancerId=${id}`

      : `/freelancer-details.html?freelancerId=${id}`;

  }


  if(
    type === "websites" ||
    type === "website"
  ){

    return `/website.html?websiteId=${id}`;

  }


  if(type === "ads")
    return `/ad-details.html?adId=${id}`;


  if(type === "sponsors")
    return `/sponsor-details.html?sponsorId=${id}`;


  if(item.url){

    return item.url;

  }


  return `/`;

}


/* =====================================================
   READ searchIndex ONLY
===================================================== */

async function loadSearchIndex(){

  SEARCH_INDEX = [];


  searchInfo.textContent =
    "Loading search index...";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "searchIndex"
        )
      );


    snapshot.forEach(
      docSnap => {

        const data =
          docSnap.data() || {};


        const targetId =
          data.targetId ||
          data.documentId ||
          data.recordId ||
          data.itemId ||
          data.courseId ||
          data.resourceId ||
          data.scholarshipId ||
          data.careerId ||
          data.videoId ||
          data.serviceId ||
          data.businessId ||
          data.profileId ||
          data.freelancerId ||
          data.websiteId ||
          docSnap.id;


        const collectionValue =
          data.collection ||
          data.collectionName ||
          data.source ||
          data.type ||
          "other";


        const title =
          getTitle(data);


        const description =
          getDescription(data);


        const searchableText =
          lower(
            [

              title,

              description,

              data.keywords,

              data.tags,

              data.category,

              data.subject,

              data.searchableText,

              data.content

            ]
            .map(text)
            .join(" ")
          );


        SEARCH_INDEX.push({

          id:
            docSnap.id,

          targetId:
            targetId,

          collection:
            lower(collectionValue),

          title:

            title,

          description:

            description,

          access:

            getAccess(data),

          sponsored:

            isSponsored(data),

          url:

            text(
              data.url ||
              data.link ||
              data.website ||
              data.externalUrl
            ),

          searchableText:

            searchableText,

          data:

            data

        });

      }
    );


    searchInfo.textContent =
      `${SEARCH_INDEX.length} items indexed`;


    createFilters();

    search(
      searchInput.value
    );


  }catch(error){

    console.error(
      "searchIndex error:",
      error
    );


    searchInfo.textContent =
      "Search unavailable";


    resultsEl.innerHTML = `

      <div class="error">

        Unable to load the LetsStudy Pro search index.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   FILTERS
===================================================== */

function createFilters(){

  filtersEl.innerHTML = "";


  const all =
    document.createElement(
      "button"
    );


  all.className =
    "filter active";


  all.dataset.type =
    "all";


  all.textContent =
    "All";


  filtersEl.appendChild(
    all
  );


  const types =
    [
      ...new Set(

        SEARCH_INDEX

          .map(
            item =>
              item.collection
          )

          .filter(Boolean)

      )
    ];


  types.forEach(
    type => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "filter";


      button.dataset.type =
        type;


      button.textContent =
        formatType(type);


      filtersEl.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   RANKING
===================================================== */

function rankItem(item, query){

  const title =
    lower(item.title);


  const description =
    lower(item.description);


  const text =
    lower(item.searchableText);


  const words =
    query
      .split(/\s+/)
      .filter(Boolean);


  let score = 0;


  /*
    Exact title
  */

  if(title === query)
    score += 100000;


  /*
    Title starts with query
  */

  if(title.startsWith(query))
    score += 50000;


  /*
    Title contains complete query
  */

  if(title.includes(query))
    score += 25000;


  /*
    Individual words
  */

  for(
    const word
    of words
  ){

    if(title === word)
      score += 12000;


    if(title.startsWith(word))
      score += 7000;


    if(title.includes(word))
      score += 5000;


    if(description.includes(word))
      score += 1000;


    if(text.includes(word))
      score += 300;

  }


  /*
    Sponsored gets visibility,
    but never overrides a strong
    relevant title match.
  */

  if(item.sponsored)
    score += 25;


  return score;

}


/* =====================================================
   SEARCH
===================================================== */

function search(query){

  query =
    lower(query);


  let items =
    SEARCH_INDEX;


  if(
    currentType !== "all"
  ){

    items =
      items.filter(
        item =>
          item.collection ===
          currentType
      );

  }


  /*
    BEFORE SEARCH:
    SHOW ALL TITLES
  */

  if(!query){

    renderResults(
      items
    );

    return;

  }


  const ranked =
    items

      .map(
        item => ({

          ...item,

          score:
            rankItem(
              item,
              query
            )

        })
      )

      .filter(
        item =>
          item.score > 0
      )

      .sort(
        (a,b) => {

          if(
            b.score !==
            a.score
          ){

            return (
              b.score -
              a.score
            );

          }


          /*
            Stable secondary
            ranking by title.
          */

          return lower(
            a.title
          )
          .localeCompare(
            lower(b.title)
          );

        }
      );


  renderResults(
    ranked
  );

}


/* =====================================================
   RENDER RESULTS
===================================================== */

function renderResults(items){

  resultsEl.innerHTML = "";


  if(!items.length){

    resultsEl.innerHTML = `

      <div class="empty">

        No matching results.

      </div>

    `;

    return;

  }


  items.forEach(
    item => {

      const article =
        document.createElement(
          "article"
        );


      article.className =
        "result";


      const title =
        escapeHtml(
          item.title
        );


      const description =
        escapeHtml(
          item.description
        );


      const type =
        escapeHtml(
          formatType(
            item.collection
          )
        );


            const access =
        item.access === "plan"
          ? "Plan"
          : "Free";


      const accessClass =
        item.access === "plan"
          ? "plan"
          : "free";


      const destination =
        getDestination(item);


      const action =
        getAction(item);


      article.innerHTML = `

        <div class="result-content">

          <h2 class="result-title">
            ${title}
          </h2>


          ${
            item.url
              ? `
                <div class="result-url">
                  ${escapeHtml(item.url)}
                </div>
              `
              : ""
          }


          <div class="result-meta">

            <span>
              ${type}
            </span>

            <span class="badge ${accessClass}">
              ${access}
            </span>

            ${
              item.sponsored
                ? `
                  <span class="badge sponsored">
                    Sponsored
                  </span>
                `
                : ""
            }

          </div>


          ${
            description
              ? `
                <p class="result-description">
                  ${description}
                </p>
              `
              : ""
          }


          <button
            type="button"
            class="action">

            ${escapeHtml(action)}

          </button>

        </div>

      `;


      article.addEventListener(
        "click",
        event => {

          if(
            event.target.closest(".action") ||
            event.target.closest(".result-title")
          ){

            window.location.href =
              destination;

            return;

          }


          window.location.href =
            destination;

        }
      );


      resultsEl.appendChild(
        article
      );

    }
  );

}


/* =====================================================
   SEARCH RANKING
===================================================== */

function rankItem(item, query){

  const title =
    lower(item.title);

  const description =
    lower(item.description);

  const searchable =
    lower(item.searchableText);


  const words =
    query
      .split(/\s+/)
      .filter(Boolean);


  let score = 0;


  /* Exact title */

  if(title === query){

    score += 100000;

  }


  /* Title starts with query */

  if(title.startsWith(query)){

    score += 50000;

  }


  /* Title contains query */

  if(title.includes(query)){

    score += 25000;

  }


  /* Individual words */

  words.forEach(
    word => {

      if(title === word){

        score += 15000;

      }


      if(title.startsWith(word)){

        score += 8000;

      }


      if(title.includes(word)){

        score += 5000;

      }


      if(description.includes(word)){

        score += 1500;

      }


      if(searchable.includes(word)){

        score += 500;

      }

    }
  );


  /*
    Sponsored content receives
    a small visibility boost,
    but relevance remains primary.
  */

  if(item.sponsored){

    score += 50;

  }


  return score;

}


/* =====================================================
   SEARCH
===================================================== */

function search(query){

  query =
    lower(query);


  let items =
    SEARCH_INDEX;


  /*
    TYPE FILTER
  */

  if(
    currentType !== "all"
  ){

    items =
      items.filter(
        item =>
          lower(
            item.collection
          ) ===
          lower(
            currentType
          )
      );

  }


  /*
    NO QUERY
    SHOW ALL TITLES
  */

  if(!query){

    searchInfo.textContent =
      `${items.length} items`;

    renderResults(
      items
    );

    return;

  }


  /*
    RANK RESULTS
  */

  const ranked =
    items

      .map(
        item => ({

          ...item,

          score:
            rankItem(
              item,
              query
            )

        })
      )

      .filter(
        item =>
          item.score > 0
      )

      .sort(
        (a,b) => {

          if(
            b.score !==
            a.score
          ){

            return (
              b.score -
              a.score
            );

          }


          return lower(
            a.title
          )
          .localeCompare(
            lower(
              b.title
            )
          );

        }
      );


  searchInfo.textContent =
    `${ranked.length} results for "${query}"`;


  renderResults(
    ranked
  );

}


/* =====================================================
   FILTER BUTTONS
===================================================== */

function createFilters(){

  filtersEl.innerHTML = "";


  const allButton =
    document.createElement(
      "button"
    );


  allButton.type =
    "button";


  allButton.className =
    "filter active";


  allButton.dataset.type =
    "all";


  allButton.textContent =
    "All";


  filtersEl.appendChild(
    allButton
  );


  const types =
    [
      ...new Set(

        SEARCH_INDEX

          .map(
            item =>
              lower(
                item.collection
              )
          )

          .filter(Boolean)

      )
    ];


  types.forEach(
    type => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "filter";


      button.dataset.type =
        type;


      button.textContent =
        formatType(
          type
        );


      filtersEl.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   EVENTS
===================================================== */

searchForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    search(
      searchInput.value
    );

  }
);


searchInput.addEventListener(
  "input",
  () => {

    search(
      searchInput.value
    );

  }
);


filtersEl.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".filter"
      );


    if(!button)
      return;


    currentType =
      button.dataset.type;


    document
      .querySelectorAll(
        ".filter"
      )
      .forEach(
        element => {

          element.classList.remove(
            "active"
          );

        }
      );


    button.classList.add(
      "active"
    );


    search(
      searchInput.value
    );

  }
);


/* =====================================================
   FIREBASE SEARCH INDEX
===================================================== */

async function loadSearchIndex(){

  SEARCH_INDEX = [];


  searchInfo.textContent =
    "Loading search index...";


  resultsEl.innerHTML = `

    <div class="loading">
      Loading LetsStudy Pro...
    </div>

  `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "searchIndex"
        )
      );


    snapshot.forEach(
      docSnap => {

        const data =
          docSnap.data() || {};


        /*
          SEARCH INDEX DOCUMENT ID
        */

        const indexId =
          docSnap.id;


        /*
          TARGET DOCUMENT ID
        */

        const targetId =
          data.targetId ||
          data.documentId ||
          data.recordId ||
          data.itemId ||
          data.courseId ||
          data.resourceId ||
          data.scholarshipId ||
          data.careerId ||
          data.videoId ||
          data.serviceId ||
          data.businessId ||
          data.profileId ||
          data.freelancerId ||
          data.websiteId ||
          indexId;


        /*
          COLLECTION
        */

        const collectionValue =
          data.collection ||
          data.collectionName ||
          data.sourceCollection ||
          data.sector ||
          data.type ||
          "other";


        /*
          TITLE
        */

        const title =
          getTitle(
            data
          );


        /*
          DESCRIPTION
        */

        const description =
          getDescription(
            data
          );


        /*
          ALL SEARCHABLE DATA
        */

        const searchableText =
          lower(

            [

              title,

              description,

              data.keywords,

              data.tags,

              data.category,

              data.subject,

              data.searchableText,

              data.content,

              data.name

            ]

            .map(text)

            .join(" ")

          );


        /*
          STORE INDEX
        */

        SEARCH_INDEX.push({

          id:
            indexId,

          targetId:
            String(
              targetId
            ),

          collection:
            lower(
              collectionValue
            ),

          title:
            title,

          description:
            description,

          access:
            getAccess(
              data
            ),

          sponsored:
            isSponsored(
              data
            ),

          url:
            text(
              data.url ||
              data.link ||
              data.externalUrl ||
              ""
            ),

          searchableText:
            searchableText,

          data:
            data

        });

      }
    );


    console.log(
      "LetsStudy Pro search index:",
      SEARCH_INDEX.length
    );


    searchInfo.textContent =
      `${SEARCH_INDEX.length} items`;


    createFilters();


    /*
      SHOW TITLES IMMEDIATELY
      BEFORE SEARCH
    */

    search("");

  }catch(error){

    console.error(
      "SearchIndex error:",
      error
    );


    searchInfo.textContent =
      "Search unavailable";


    resultsEl.innerHTML = `

      <div class="error">

        Unable to load search data.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   START SEARCH ENGINE
===================================================== */

loadSearchIndex();

</script>
