<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Seller eBooks | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Inter,system-ui,sans-serif;
 background:#f5f7fa;
 color:#172033;
}

button,input,select{
 font:inherit;
}

a{
 text-decoration:none;
 color:inherit;
}

.header{
 height:68px;
 background:#fff;
 border-bottom:1px solid #e5e9ee;
 display:flex;
 align-items:center;
 position:sticky;
 top:0;
 z-index:10;
}

.nav{
 width:min(1200px,100%);
 margin:auto;
 padding:0 18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:20px;
 font-weight:950;
 color:#059669;
}

.navlinks{
 display:flex;
 gap:7px;
}

.navlinks a{
 font-size:9px;
 font-weight:900;
 padding:9px 11px;
 border-radius:8px;
}

.navlinks a:hover{
 background:#ecfdf5;
 color:#047857;
}

.container{
 width:min(1200px,100%);
 margin:auto;
 padding:24px 18px 60px;
}

.hero{
 padding:28px;
 border-radius:18px;
 color:#fff;
 background:
 radial-gradient(circle at 90% 20%,#fde68a,transparent 30%),
 linear-gradient(135deg,#78350f,#d97706);
 animation:up .5s ease;
}

.hero h1{
 margin:0 0 7px;
 font-size:28px;
}

.hero p{
 margin:0;
 color:#fef3c7;
 font-size:10px;
 line-height:1.7;
}

.hero-actions{
 margin-top:18px;
 display:flex;
 gap:8px;
}

.btn{
 border:0;
 padding:10px 14px;
 border-radius:8px;
 cursor:pointer;
 font-size:9px;
 font-weight:950;
}

.btn-light{
 background:#fff;
 color:#92400e;
}

.btn-dark{
 background:#172033;
 color:#fff;
}

.stats{
 margin:15px 0;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
}

.stat{
 background:#fff;
 border:1px solid #e5e9ee;
 border-radius:12px;
 padding:16px;
}

.stat small{
 color:#667085;
 font-size:8px;
 font-weight:850;
}

.stat strong{
 display:block;
 margin-top:5px;
 font-size:20px;
}

.toolbar{
 background:#fff;
 border:1px solid #e5e9ee;
 border-radius:12px;
 padding:10px;
 display:flex;
 gap:8px;
 margin-bottom:14px;
}

.search{
 flex:1;
 border:1px solid #e5e9ee;
 border-radius:8px;
 padding:10px;
 font-size:9px;
 outline:none;
}

.select{
 border:1px solid #e5e9ee;
 border-radius:8px;
 padding:10px;
 background:#fff;
 font-size:9px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:13px;
}

.card{
 background:#fff;
 border:1px solid #e5e9ee;
 border-radius:14px;
 overflow:hidden;
 transition:.25s;
 animation:up .5s ease;
}

.card:hover{
 transform:translateY(-4px);
 box-shadow:0 15px 35px #17203312;
}

.cover{
 width:100%;
 height:175px;
 object-fit:cover;
 background:#fef3c7;
}

.cover-empty{
 height:175px;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:45px;
 background:#fffbeb;
}

.body{
 padding:14px;
}

.badge{
 display:inline-block;
 background:#fef3c7;
 color:#92400e;
 padding:5px 7px;
 border-radius:6px;
 font-size:7px;
 font-weight:950;
}

.title{
 margin:9px 0 5px;
 font-size:11px;
 font-weight:950;
}

.desc{
 color:#667085;
 font-size:8px;
 line-height:1.6;
 min-height:26px;
}

.meta{
 display:flex;
 justify-content:space-between;
 margin-top:12px;
}

.price{
 color:#059669;
 font-size:10px;
 font-weight:950;
}

.sales{
 color:#667085;
 font-size:8px;
}

.actions{
 display:flex;
 gap:6px;
 margin-top:13px;
}

.action{
 flex:1;
 padding:8px;
 border:1px solid #e5e9ee;
 background:#fff;
 border-radius:7px;
 cursor:pointer;
 font-size:8px;
 font-weight:900;
}

.action:hover{
 background:#ecfdf5;
 color:#047857;
}

.delete:hover{
 background:#fef2f2;
 color:#dc2626;
}

.status{
 margin-top:10px;
 font-size:7px;
 font-weight:950;
}

.published{
 color:#027a48;
}

.draft{
 color:#667085;
}

.empty{
 grid-column:1/-1;
 background:#fff;
 border:1px solid #e5e9ee;
 border-radius:14px;
 padding:50px;
 text-align:center;
 color:#667085;
 font-size:9px;
}

.toast{
 position:fixed;
 right:18px;
 bottom:18px;
 background:#172033;
 color:#fff;
 padding:11px 14px;
 border-radius:8px;
 font-size:9px;
 font-weight:900;
 opacity:0;
 transform:translateY(15px);
 transition:.25s;
}

.toast.show{
 opacity:1;
 transform:translateY(0);
}

@keyframes up{
 from{
  opacity:0;
  transform:translateY(15px);
 }
 to{
  opacity:1;
  transform:translateY(0);
 }
}

@media(max-width:800px){
 .grid{
  grid-template-columns:repeat(2,1fr);
 }
 .stats{
  grid-template-columns:repeat(2,1fr);
 }
}

@media(max-width:550px){
 .container{
  padding:15px 10px;
 }

 .grid{
  grid-template-columns:1fr;
 }

 .toolbar{
  flex-direction:column;
 }

 .hero{
  padding:22px;
 }

 .navlinks a:not(:last-child){
  display:none;
 }
}
</style>
</head>

<body>

<header class="header">

<nav class="nav">

<a href="seller.html" class="logo">
LetsStudy Pro
</a>

<div class="navlinks">

<a href="seller.html">
Dashboard
</a>

<a href="products.html">
Products
</a>

<a href="cart.html">
🛒 Cart
</a>

</div>

</nav>

</header>


<main class="container">


<section class="hero">

<h1>
📚 Seller eBooks
</h1>

<p>
Create, publish and manage your digital books,
guides, manuals and educational eBooks.
</p>

<div class="hero-actions">

<button
class="btn btn-light"
id="addBtn">
＋ Add eBook
</button>

<a
href="marketplace-search.html"
class="btn btn-dark">
View Marketplace
</a>

</div>

</section>


<section class="stats">

<div class="stat">

<small>
Total eBooks
</small>

<strong id="total">
0
</strong>

</div>

<div class="stat">

<small>
Published
</small>

<strong id="published">
0
</strong>

</div>

<div class="stat">

<small>
Total Sales
</small>

<strong id="sales">
0
</strong>

</div>

<div class="stat">

<small>
Revenue
</small>

<strong id="revenue">
$0
</strong>

</div>

</section>


<section class="toolbar">

<input
id="search"
class="search"
placeholder="Search your eBooks...">

<select
id="status"
class="select">

<option value="all">
All Status
</option>

<option value="published">
Published
</option>

<option value="draft">
Draft
</option>

</select>

</section>


<section
id="grid"
class="grid">

<div class="empty">
Loading eBooks...
</div>

</section>

</main>


<div
id="toast"
class="toast">
</div>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 query,
 where,
 getDocs,
 doc,
 deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsYRgI_0rj0odBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


let user=null;
let ebooks=[];


const $=
id=>document.getElementById(id);


function escapeHTML(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function money(value,currency){

try{

return new Intl.NumberFormat(
undefined,
{
style:"currency",
currency:currency||"USD",
maximumFractionDigits:0
}
).format(
Number(value||0)
);

}catch{

return `${currency||""} ${value||0}`;

}

}


function toast(message){

const el=$("toast");

el.textContent=message;

el.classList.add("show");

setTimeout(
()=>{
el.classList.remove("show");
},
2500
);

}


onAuthStateChanged(
auth,
async currentUser=>{

if(!currentUser){

location.href=
"login.html?redirect=seller-ebooks.html";

return;

}

user=currentUser;

await loadEbooks();

}
);


async function loadEbooks(){

try{

const q=
query(
collection(db,"marketplace"),
where(
"createdBy",
"==",
user.uid
)
);

const snap=
await getDocs(q);

ebooks=
snap.docs
.map(
d=>({
id:d.id,
...d.data()
})
)
.filter(
item=>
item.type==="ebook"
);

render();

}catch(error){

console.error(error);

$("grid").innerHTML=`

<div class="empty">
Unable to load your eBooks.
</div>

`;

}

}


function render(){

const search=
$("search").value
.toLowerCase()
.trim();

const status=
$("status").value;


const filtered=
ebooks.filter(
ebook=>{

const text=`

${ebook.title||""}
${ebook.category||""}
${ebook.description||""}

`
.toLowerCase();

return(
(!search || text.includes(search)) &&
(status==="all" ||
ebook.status===status)
);

});


$("total")
.textContent=
ebooks.length;

$("published")
.textContent=
ebooks.filter(
e=>e.status==="published"
).length;


const sales=
ebooks.reduce(
(sum,e)=>
sum+
Number(e.salesCount||0),
0
);

$("sales")
.textContent=
sales.toLocaleString();


const revenue=
ebooks.reduce(
(sum,e)=>{

const price=
Number(
e.discountPrice>0 &&
e.discountPrice<e.price
?
e.discountPrice
:
e.price||0
);

return sum+
price*
Number(e.salesCount||0);

},
0
);


$("revenue")
.textContent=
money(
revenue,
ebooks[0]?.currency
);


if(!filtered.length){

$("grid").innerHTML=`

<div class="empty">

📚

<br><br>

No eBooks found.

<br><br>

<button
class="btn btn-dark"
onclick="createEbook()">

＋ Create eBook

</button>

</div>

`;

return;

}


$("grid").innerHTML=
filtered
.map(
ebook=>{

const image=
ebook.thumbnail||
ebook.imageUrl||
"";

const price=
Number(
ebook.discountPrice>0 &&
ebook.discountPrice<ebook.price
?
ebook.discountPrice
:
ebook.price||0
);

return `

<article class="card">

${
image
?
`
<img
class="cover"
src="${escapeHTML(image)}"
alt="${escapeHTML(ebook.title)}">
`
:
`
<div class="cover-empty">
📚
</div>
`
}

<div class="body">

<span class="badge">
eBOOK
</span>

<div class="title">
${escapeHTML(
ebook.title||
"Untitled eBook"
)}
</div>

<div class="desc">
${escapeHTML(
ebook.shortDescription||
ebook.description||
"Digital book"
)}
</div>

<div class="meta">

<span class="price">
${money(
price,
ebook.currency
)}
</span>

<span class="sales">
🛒 ${
Number(
ebook.salesCount||0
).toLocaleString()
} sales
</span>

</div>

<div class="status ${
ebook.status==="published"
?"published"
:"draft"
}">

● ${
escapeHTML(
ebook.status||"draft"
)
}

</div>

<div class="actions">

<button
class="action"
onclick="viewEbook('${ebook.id}')">
👁 View
</button>

<button
class="action"
onclick="editEbook('${ebook.id}')">
✏️ Edit
</button>

<button
class="action delete"
onclick="deleteEbook('${ebook.id}')">
🗑 Delete
</button>

</div>

</div>

</article>

`;

}
)
.join("");

}


window.createEbook=
function(){

location.href=
"products.html?type=ebook";

};


window.viewEbook=
function(id){

location.href=
"marketplace-product.html?productId="+
encodeURIComponent(id);

};


window.editEbook=
function(id){

location.href=
"products.html?edit="+
encodeURIComponent(id);

};


window.deleteEbook=
async function(id){

const ebook=
ebooks.find(
e=>e.id===id
);

if(!ebook)
return;


if(
!confirm(
`Delete "${ebook.title}"?`
)
)
return;


try{

await deleteDoc(
doc(
db,
"marketplace",
id
)
);

toast(
"eBook deleted successfully."
);

await loadEbooks();

}catch(error){

console.error(error);

toast(
"Unable to delete eBook."
);

}

};


$("addBtn")
.addEventListener(
"click",
createEbook
);


$("search")
.addEventListener(
"input",
render
);


$("status")
.addEventListener(
"change",
render
);

</script>

</body>
</html>
