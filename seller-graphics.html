<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Seller Graphics | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Inter,system-ui,sans-serif;
 background:#f5f7fa;
 color:#172033;
}

a{text-decoration:none;color:inherit}
button,input,select{font:inherit}

.header{
 height:68px;
 background:#fff;
 border-bottom:1px solid #e5e9ee;
 position:sticky;
 top:0;
 z-index:20;
}

.nav{
 max-width:1200px;
 margin:auto;
 height:100%;
 padding:0 18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.logo{
 color:#7c3aed;
 font-size:20px;
 font-weight:950;
}

.nav a{
 font-size:9px;
 font-weight:900;
 padding:9px 11px;
 border-radius:8px;
}

.nav a:hover{
 background:#f5f3ff;
 color:#6d28d9;
}

.links{
 display:flex;
 gap:6px;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:24px 18px 60px;
}

.hero{
 padding:30px;
 border-radius:19px;
 color:#fff;
 background:
 radial-gradient(circle at 90% 10%,#ddd6fe,transparent 32%),
 linear-gradient(135deg,#4c1d95,#7c3aed);
 animation:up .5s ease;
}

.hero h1{
 margin:0 0 7px;
 font-size:28px;
}

.hero p{
 margin:0;
 color:#ede9fe;
 font-size:10px;
 line-height:1.7;
}

.hero-actions{
 display:flex;
 gap:8px;
 margin-top:18px;
}

.btn{
 border:0;
 padding:10px 14px;
 border-radius:8px;
 cursor:pointer;
 font-size:9px;
 font-weight:950;
}

.light{
 background:#fff;
 color:#6d28d9;
}

.dark{
 background:#172033;
 color:#fff;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin:15px 0;
}

.stat{
 background:#fff;
 border:1px solid #e5e9ee;
 border-radius:12px;
 padding:16px;
}

.stat small{
 color:#667085;
 font-size:8px;
 font-weight:850;
}

.stat strong{
 display:block;
 margin-top:5px;
 font-size:20px;
}

.toolbar{
 background:#fff;
 border:1px solid #e5e9ee;
 border-radius:12px;
 padding:10px;
 display:flex;
 gap:8px;
 margin-bottom:14px;
}

.search{
 flex:1;
 padding:10px;
 border:1px solid #e5e9ee;
 border-radius:8px;
 outline:none;
 font-size:9px;
}

.select{
 padding:10px;
 border:1px solid #e5e9ee;
 border-radius:8px;
 background:#fff;
 font-size:9px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:13px;
}

.card{
 background:#fff;
 border:1px solid #e5e9ee;
 border-radius:14px;
 overflow:hidden;
 transition:.25s;
}

.card:hover{
 transform:translateY(-4px);
 box-shadow:0 15px 35px #17203312;
}

.cover{
 width:100%;
 height:175px;
 object-fit:cover;
 background:#f5f3ff;
}

.empty-cover{
 height:175px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#f5f3ff;
 font-size:45px;
}

.body{
 padding:14px;
}

.badge{
 display:inline-block;
 padding:5px 7px;
 border-radius:6px;
 background:#f5f3ff;
 color:#6d28d9;
 font-size:7px;
 font-weight:950;
}

.title{
 margin:9px 0 5px;
 font-size:11px;
 font-weight:950;
}

.desc{
 color:#667085;
 font-size:8px;
 line-height:1.6;
 min-height:28px;
}

.meta{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-top:12px;
}

.price{
 color:#059669;
 font-size:10px;
 font-weight:950;
}

.sales{
 color:#667085;
 font-size:8px;
}

.status{
 margin-top:9px;
 font-size:7px;
 font-weight:950;
}

.published{color:#027a48}
.draft{color:#667085}

.actions{
 display:flex;
 gap:6px;
 margin-top:12px;
}

.action{
 flex:1;
 padding:8px;
 border:1px solid #e5e9ee;
 background:#fff;
 border-radius:7px;
 cursor:pointer;
 font-size:8px;
 font-weight:900;
}

.action:hover{
 background:#f5f3ff;
 color:#6d28d9;
}

.delete:hover{
 background:#fef2f2;
 color:#dc2626;
}

.empty{
 grid-column:1/-1;
 background:#fff;
 border:1px solid #e5e9ee;
 border-radius:14px;
 padding:50px;
 text-align:center;
 color:#667085;
 font-size:9px;
}

.toast{
 position:fixed;
 right:18px;
 bottom:18px;
 background:#172033;
 color:#fff;
 padding:11px 14px;
 border-radius:8px;
 font-size:9px;
 font-weight:900;
 opacity:0;
 transform:translateY(15px);
 transition:.25s;
}

.toast.show{
 opacity:1;
 transform:translateY(0);
}

@keyframes up{
 from{
  opacity:0;
  transform:translateY(15px);
 }
 to{
  opacity:1;
  transform:translateY(0);
 }
}

@media(max-width:800px){
 .grid{
  grid-template-columns:repeat(2,1fr);
 }
 .stats{
  grid-template-columns:repeat(2,1fr);
 }
}

@media(max-width:550px){
 .grid{
  grid-template-columns:1fr;
 }
 .toolbar{
  flex-direction:column;
 }
 .container{
  padding:15px 10px;
 }
}
</style>
</head>

<body>

<header class="header">

<nav class="nav">

<a href="seller.html" class="logo">
LetsStudy Pro
</a>

<div class="links">

<a href="seller.html">
Dashboard
</a>

<a href="products.html">
Products
</a>

<a href="cart.html">
🛒 Cart
</a>

</div>

</nav>

</header>


<main class="container">


<section class="hero">

<h1>
🎨 Seller Graphics
</h1>

<p>
Create, publish and sell professional graphics,
templates, brand assets, social media designs and creative resources.
</p>

<div class="hero-actions">

<button
class="btn light"
id="addBtn">
＋ Add Graphic
</button>

<a
href="marketplace-search.html"
class="btn dark">
View Marketplace
</a>

</div>

</section>


<section class="stats">

<div class="stat">
<small>Total Graphics</small>
<strong id="total">0</strong>
</div>

<div class="stat">
<small>Published</small>
<strong id="published">0</strong>
</div>

<div class="stat">
<small>Total Sales</small>
<strong id="sales">0</strong>
</div>

<div class="stat">
<small>Revenue</small>
<strong id="revenue">$0</strong>
</div>

</section>


<section class="toolbar">

<input
id="search"
class="search"
placeholder="Search your graphics...">

<select
id="status"
class="select">

<option value="all">
All Status
</option>

<option value="published">
Published
</option>

<option value="draft">
Draft
</option>

</select>

<select
id="category"
class="select">

<option value="all">
All Categories
</option>

<option value="logo">
Logo
</option>

<option value="template">
Template
</option>

<option value="poster">
Poster
</option>

<option value="social">
Social Media
</option>

<option value="branding">
Branding
</option>

<option value="ui">
UI Kit
</option>

</select>

</section>


<section
id="grid"
class="grid">

<div class="empty">
Loading graphics...
</div>

</section>

</main>


<div id="toast" class="toast"></div>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 query,
 where,
 getDocs,
 doc,
 deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsYRgI_0rj0odBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


let user=null;
let graphics=[];


const $=
id=>document.getElementById(id);


function escapeHTML(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function money(value,currency){

try{

return new Intl.NumberFormat(
undefined,
{
style:"currency",
currency:currency||"USD",
maximumFractionDigits:0
}
).format(
Number(value||0)
);

}catch{

return `${currency||""} ${value||0}`;

}

}


function toast(message){

const el=$("toast");

el.textContent=message;

el.classList.add("show");

setTimeout(
()=>el.classList.remove("show"),
2500
);

}


onAuthStateChanged(
auth,
async currentUser=>{

if(!currentUser){

location.href=
"login.html?redirect=seller-graphics.html";

return;

}

user=currentUser;

await loadGraphics();

}
);


async function loadGraphics(){

try{

const q=
query(
collection(db,"marketplace"),
where(
"createdBy",
"==",
user.uid
)
);

const snap=
await getDocs(q);

graphics=
snap.docs
.map(
d=>({
id:d.id,
...d.data()
})
)
.filter(
item=>
item.type==="graphic" ||
item.type==="graphics"
);

render();

}catch(error){

console.error(error);

$("grid").innerHTML=`

<div class="empty">
Unable to load your graphics.
</div>

`;

}

}


function render(){

const search=
$("search").value
.toLowerCase()
.trim();

const status=
$("status").value;

const category=
$("category").value;


const filtered=
graphics.filter(
item=>{

const text=`

${item.title||""}
${item.category||""}
${item.description||""}

`
.toLowerCase();

return(
(!search || text.includes(search)) &&
(status==="all" ||
item.status===status) &&
(category==="all" ||
String(item.category||"")
.toLowerCase()===
category)
);

});


$("total")
.textContent=
graphics.length;

$("published")
.textContent=
graphics.filter(
g=>g.status==="published"
).length;


const sales=
graphics.reduce(
(sum,g)=>
sum+
Number(g.salesCount||0),
0
);

$("sales")
.textContent=
sales.toLocaleString();


const revenue=
graphics.reduce(
(sum,g)=>{

const price=
Number(
g.discountPrice>0 &&
g.discountPrice<g.price
?
g.discountPrice
:
g.price||0
);

return sum+
price*
Number(g.salesCount||0);

},
0
);


$("revenue")
.textContent=
money(
revenue,
graphics[0]?.currency
);


if(!filtered.length){

$("grid").innerHTML=`

<div class="empty">

🎨

<br><br>

No graphics found.

<br><br>

<button
class="btn dark"
onclick="createGraphic()">
＋ Create Graphic
</button>

</div>

`;

return;

}


$("grid").innerHTML=
filtered
.map(
graphic=>{

const image=
graphic.thumbnail||
graphic.imageUrl||
"";

const price=
Number(
graphic.discountPrice>0 &&
graphic.discountPrice<graphic.price
?
graphic.discountPrice
:
graphic.price||0
);


return `

<article class="card">

${
image
?
`
<img
class="cover"
src="${escapeHTML(image)}"
alt="${escapeHTML(graphic.title)}">
`
:
`
<div class="empty-cover">
🎨
</div>
`
}

<div class="body">

<span class="badge">
GRAPHIC
</span>

<div class="title">
${escapeHTML(
graphic.title||
"Untitled Graphic"
)}
</div>

<div class="desc">
${escapeHTML(
graphic.shortDescription||
graphic.description||
"Creative digital asset"
)}
</div>

<div class="meta">

<span class="price">
${money(
price,
graphic.currency
)}
</span>

<span class="sales">
🛒 ${
Number(
graphic.salesCount||0
).toLocaleString()
}
</span>

</div>

<div class="status ${
graphic.status==="published"
?"published"
:"draft"
}">

● ${
escapeHTML(
graphic.status||"draft"
)
}

</div>

<div class="actions">

<button
class="action"
onclick="viewGraphic('${graphic.id}')">
👁 View
</button>

<button
class="action"
onclick="editGraphic('${graphic.id}')">
✏️ Edit
</button>

<button
class="action delete"
onclick="deleteGraphic('${graphic.id}')">
🗑 Delete
</button>

</div>

</div>

</article>

`;

}
)
.join("");

}


window.createGraphic=
function(){

location.href=
"products.html?type=graphic";

};


window.viewGraphic=
function(id){

location.href=
"marketplace-product.html?productId="+
encodeURIComponent(id);

};


window.editGraphic=
function(id){

location.href=
"products.html?edit="+
encodeURIComponent(id);

};


window.deleteGraphic=
async function(id){

const graphic=
graphics.find(
g=>g.id===id
);

if(!graphic)
return;

if(
!confirm(
`Delete "${graphic.title}"?`
)
)
return;

try{

await deleteDoc(
doc(
db,
"marketplace",
id
)
);

toast(
"Graphic deleted successfully."
);

await loadGraphics();

}catch(error){

console.error(error);

toast(
"Unable to delete graphic."
);

}

};


$("addBtn")
.addEventListener(
"click",
createGraphic
);

$("search")
.addEventListener(
"input",
render
);

$("status")
.addEventListener(
"change",
render
);

$("category")
.addEventListener(
"change",
render
);

</script>

</body>
</html>
