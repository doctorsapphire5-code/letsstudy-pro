<head>

<title>Seller Products | LetsStudy Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172033
}

button,input,select,textarea{
    font:inherit
}

button{
    cursor:pointer
}

header{
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    padding:12px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    position:sticky;
    top:0;
    z-index:20
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
    text-decoration:none;

}

.logo{
    width:38px;
    height:38px;
    border-radius:9px;
    background:#172033;
    color:#fff;
    display:grid;
    place-items:center;
    font-size:10px
}

.nav{
    display:flex;
    gap:7px;
    flex-wrap:wrap
}

.nav a{
    text-decoration:none;
    background:#eef2f7;
    color:#172033;
    padding:8px 10px;
    border-radius:7px;
    font-size:9px;
    font-weight:800
}

main{
    max-width:1200px;
    margin:auto;
    padding:25px 16px 60px
}

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px
}

.title h1{
    font-size:27px
}

.title p{
    color:#64748b;
    font-size:12px;
    margin-top:5px
}

.primary{
    border:0;
    background:#172033;
    color:#fff;
    padding:11px 15px;
    border-radius:8px;
    font-weight:800
}

.secondary{
    border:0;
    background:#eef2f7;
    color:#172033;
    padding:10px 14px;
    border-radius:8px;
    font-weight:800
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:16px
}

.stat{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:12px;

}

.stat-label{
    color:#64748b;

    font-weight:900
}

.stat-value{
    margin-top:7px;

    font-weight:900
}

.toolbar{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:12px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px
}

.search{
    flex:1;
    min-width:220px
}

input,
select,
textarea{
    width:100%;
    border:1px solid #dbe2ea;
    background:#fff;
    padding:10px;
    border-radius:8px;
    outline:none
}

textarea{
    min-height:100px;
    resize:vertical
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px
}

.card{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:12px;

}

.card-image{
    height:160px;
    background:#eef2f7;
    display:grid;
    place-items:center;
    color:#64748b;
    font-size:11px;
    overflow:hidden
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:cover
}

.card-body{
    padding:14px
}

.card h3{
    font-size:14px;
    margin-bottom:5px
}

.category{
    color:#64748b;
    font-size:8px;
    text-transform:uppercase;
    font-weight:900
}

.description{
    color:#64748b;
    font-size:10px;
    line-height:1.5;
    margin-top:7px;
    min-height:30px
}

.meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-top:12px
}

.price{
    font-size:15px;
    font-weight:900
}

.badge{
    display:inline-block;
    padding:5px 8px;

    font-size:8px;
    font-weight:900

.active{

    color:#047857
}

.inactive{
    background:#fef2f2;
    color:#b91c1c
}

.stock{
    margin-top:9px;
    color:#64748b;
    font-size:9px;
    font-weight:800
}

.card-actions{
    display:flex;
    gap:6px;
    margin-top:12px
}

.card-actions button{
    flex:1;
    padding:8px;
    border:1px solid #dbe2ea;
    background:#fff;
    border-radius:7px;
    font-size:8px;
    font-weight:800
}

.empty{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:50px;
    text-align:center;
    color:#64748b;
    display:none
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:100
}

.modal.show{
    display:flex
}

.modal-box{
    width:100%;
    max-width:620px;
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:14px;
    padding:20px
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px
}

.modal-head h2{
    font-size:17px
}

.close{
    border:0;
    background:#eef2f7;
    width:30px;
    height:30px;
    border-radius:7px;
    font-size:17px
}

.form-group{
    margin-bottom:12px
}

.form-group label{
    display:block;
    font-size:9px;
    font-weight:900;
    margin-bottom:5px
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px
}

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:15px
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translate(-50%,20px);
    background:#172033;
    color:#fff;
    padding:11px 15px;
    border-radius:8px;
    font-size:10px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0)
}

@media(max-width:850px){

    .grid{
        grid-template-columns:repeat(2,1fr)
    }

    .stats{
        grid-template-columns:repeat(2,1fr)
    }
}

@media(max-width:600px){

    header,
    .title{
        flex-direction:column;
        align-items:flex-start
    }

    .grid{
        grid-template-columns:1fr
    }

    .toolbar{
        flex-direction:column
    }

    .toolbar input,
    .toolbar select,
    .toolbar button{
        width:100%
    }

    .form-grid{
        grid-template-columns:1fr
    }
}
</style>
</head>

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
        "let-s-study-pro-course.firebaseapp.com",

    projectId:
        "let-s-study-pro-course",

    storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
        "474928293390",

    appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   STATE
========================= */

let currentUser = null;

let products = [];


/* =========================
   HELPERS
========================= */

const get =
    id =>
    document.getElementById(id);


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(
    value,
    currency = "TZS"
){

    return `${currency} ${Number(
        value || 0
    ).toLocaleString()}`;

}


function slugify(value){

    return String(
        value || ""
    )
    .toLowerCase()
    .trim()
    .replace(
        /[^a-z0-9]+/g,
        "-"
    )
    .replace(
        /^-|-$/g,
        "");

}


function showToast(message){

    const toast =
        get("toast");

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () =>
                toast.classList.remove(
                    "show"
                ),
            2500
        );

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            showToast(
                "Please sign in first."
            );

            return;

        }

        currentUser =
            user;

        await loadProducts();

    }
);


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

    try{

        const ref =
            collection(
                db,
                "marketplace"
            );


        const q =
            query(
                ref,
                where(
                    "sellerId",
                    "==",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(q);


        products = [];


        snapshot.forEach(
            item => {

                products.push({

                    id:
                        item.id,

                    ...item.data()

                });

            }
        );


        updateStats();

        renderProducts();


    }catch(error){

        console.error(
            "Products error:",
            error
        );

        showToast(
            "Failed to load products."
        );

    }

}


/* =========================
   STATS
========================= */

function updateStats(){

    const active =
        products.filter(
            product =>
                product.status ===
                "active"
        ).length;


    const sales =
        products.reduce(
            (
                total,
                product
            ) =>
                total +
                Number(
                    product.salesCount ||
                    0
                ),
            0
        );


    const revenue =
        products.reduce(
            (
                total,
                product
            ) =>
                total +
                (
                    Number(
                        product.price ||
                        0
                    ) *
                    Number(
                        product.salesCount ||
                        0
                    )
                ),
            0
        );


    get("totalProducts")
        .textContent =
        products.length;


    get("activeProducts")
        .textContent =
        active;


    get("totalSales")
        .textContent =
        sales;


    get("totalRevenue")
        .textContent =
        money(revenue);

}


/* =========================
   FILTER
========================= */

function renderProducts(){

    const search =
        get("search")
            .value
            .toLowerCase()
            .trim();


    const category =
        get("categoryFilter")
            .value;


    const status =
        get("statusFilter")
            .value;


    const type =
        get("typeFilter")
            .value;


    const list =
        products.filter(
            product => {

                const text =
                    [
                        product.title,
                        product.description,
                        product.shortDescription,
                        product.category,
                        product.type
                    ]
                    .join(" ")
                    .toLowerCase();


                return (

                    (
                        !search ||
                        text.includes(
                            search
                        )
                    )

                    &&

                    (
                        category === "all" ||
                        product.category ===
                        category
                    )

                    &&

                    (
                        status === "all" ||
                        product.status ===
                        status
                    )

                    &&

                    (
                        type === "all" ||
                        product.type ===
                        type
                    )

                );

            }
        );


    get("productGrid")
        .innerHTML =
        list
            .map(
                renderProduct
            )
            .join("");


    get("empty")
        .style.display =
        list.length
            ? "none"
            : "block";

}


/* =========================
   PRODUCT CARD
========================= */

function renderProduct(product){

    const image =
        product.thumbnail ||
        product.imageUrl ||
        "";


    const displayPrice =
        product.discountPrice &&
        Number(
            product.discountPrice
        ) > 0
            ? product.discountPrice
            : product.price;


    return `

<article class="card">

<div class="card-image">

${
    image
    ? `

<img
    src="${escapeHTML(image)}"
    alt="${escapeHTML(
        product.title ||
        "Product"
    )}"
    onerror="this.style.display='none'">

`
    : "Product"
}

</div>


<div class="card-body">

<div class="category">

${escapeHTML(
    product.category ||
    "other"
)}

</div>


<h3>

${escapeHTML(
    product.title ||
    "Untitled Product"
)}

</h3>


<div class="description">

${escapeHTML(
    product.shortDescription ||
    product.description ||
    "No description"
)}

</div>


<div class="meta">

<div class="price">

${money(
    displayPrice,
    product.currency
)}

</div>


<span class="badge ${
    product.status === "active"
        ? "active"
        : "inactive"
}">

${escapeHTML(
    product.status ||
    "inactive"
)}

</span>

</div>


<div class="stock">

Stock:
${Number(
    product.stock || 0
).toLocaleString()}

&nbsp; • &nbsp;

Sales:
${Number(
    product.salesCount || 0
).toLocaleString()}

</div>


<div class="card-actions">

<button
type="button"
onclick="editProduct('${product.id}')">

Edit

</button>


<button
type="button"
onclick="shareProduct('${product.id}')">

Share

</button>


<button
type="button"
onclick="deleteProduct('${product.id}')">

Delete

</button>

</div>

</div>

</article>

`;

}


/* =========================
   ADD PRODUCT
========================= */

get("addProductBtn")
    .addEventListener(
        "click",
        () => {

            get("productForm")
    .reset();

get("productId")
    .value = "";

get("productTitle")
    .value = "";

get("productDescription")
    .value = "";

get("productShortDescription")
    .value = "";

get("productCategory")
    .value = "physical";

get("productType")
    .value = "physical";

get("productPrice")
    .value = "";

get("discountPrice")
    .value = "";

get("productCurrency")
    .value = "TZS";

get("productStock")
    .value = "0";

get("productThumbnail")
    .value = "";

get("productImage")
    .value = "";

get("productUrl")
    .value = "";

get("courseId")
    .value = "";

get("productStatus")
    .value = "active";

get("modalTitle")
    .textContent =
    "Add Product";

get("productModal")
    .classList.add(
        "show"
    );

});


/* =========================
   CLOSE MODAL
========================= */

window.closeModal =
function(){

    get("productModal")
        .classList.remove(
            "show"
        );

};


/* =========================
   SAVE PRODUCT
========================= */

get("productForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            if(!currentUser){

                showToast(
                    "Please sign in first."
                );

                return;

            }


            const id =
                get("productId")
                    .value
                    .trim();


            const title =
                get("productTitle")
                    .value
                    .trim();


            if(!title){

                showToast(
                    "Product title is required."
                );

                return;

            }


            const price =
                Number(
                    get("productPrice")
                        .value || 0
                );


            const discountPrice =
                Number(
                    get("discountPrice")
                        .value || 0
                );


            const stock =
                Number(
                    get("productStock")
                        .value || 0
                );


            const data = {

                sellerId:
                    currentUser.uid,

                title:

                    title,

                slug:

                    slugify(title),

                description:

                    get("productDescription")
                        .value
                        .trim(),

                shortDescription:

                    get(
                        "productShortDescription"
                    )
                    .value
                    .trim(),

                type:

                    get("productType")
                        .value,

                category:

                    get("productCategory")
                        .value,

                price:

                    price,

                currency:

                    get("productCurrency")
                        .value,

                discountPrice:

                    discountPrice,

                thumbnail:

                    get("productThumbnail")
                        .value
                        .trim(),

                imageUrl:

                    get("productImage")
                        .value
                        .trim(),

                productUrl:

                    get("productUrl")
                        .value
                        .trim(),

                courseId:

                    get("courseId")
                        .value
                        .trim(),

                stock:

                    stock,

                status:

                    get("productStatus")
                        .value,

                updatedAt:
                    serverTimestamp()

            };


            try{

                if(id){

                    await updateDoc(

                        doc(
                            db,
                            "marketplace",
                            id
                        ),

                        data

                    );

                    showToast(
                        "Product updated successfully."
                    );

                }else{

                    await addDoc(

                        collection(
                            db,
                            "marketplace"
                        ),

                        {

                            ...data,

                            featured:
                                false,

                            rating:
                                0,

                            ratingCount:
                                0,

                            salesCount:
                                0,

                            createdAt:
                                serverTimestamp(),

                            publishedAt:

                                data.status ===
                                "active"

                                    ? serverTimestamp()

                                    : null

                        }

                    );

                    showToast(
                        "Product published successfully."
                    );

                }


                closeModal();

                await loadProducts();


            }catch(error){

                console.error(
                    "Product save error:",
                    error
                );

                showToast(
                    "Failed to save product."
                );

            }

        }
    );


/* =========================
   EDIT PRODUCT
========================= */

window.editProduct =
function(id){

    const product =
        products.find(
            item =>
                item.id === id
        );


    if(!product){

        showToast(
            "Product not found."
        );

        return;

    }


    get("productId")
        .value =
        product.id;


    get("productTitle")
        .value =
        product.title || "";


    get("productDescription")
        .value =
        product.description || "";


    get("productShortDescription")
        .value =
        product.shortDescription || "";


    get("productCategory")
        .value =
        product.category ||
        "other";


    get("productType")
        .value =
        product.type ||
        "physical";


    get("productPrice")
        .value =
        product.price ?? 0;


    get("discountPrice")
        .value =
        product.discountPrice ?? 0;


    get("productCurrency")
        .value =
        product.currency ||
        "TZS";


    get("productStock")
        .value =
        product.stock ?? 0;


    get("productThumbnail")
        .value =
        product.thumbnail || "";


    get("productImage")
        .value =
        product.imageUrl || "";


    get("productUrl")
        .value =
        product.productUrl || "";


    get("courseId")
        .value =
        product.courseId || "";


    get("productStatus")
        .value =
        product.status ||
        "active";


    get("modalTitle")
        .textContent =
        "Edit Product";


    get("productModal")
        .classList.add(
            "show"
        );

};


/* =========================
   DELETE PRODUCT
========================= */

window.deleteProduct =
async function(id){

    const product =
        products.find(
            item =>
                item.id === id
        );


    if(!product){

        showToast(
            "Product not found."
        );

        return;

    }


    if(
        !confirm(
            `Delete "${product.title}"?`
        )
    ){

        return;

    }


    try{

        await deleteDoc(

            doc(
                db,
                "marketplace",
                id
            )

        );


        showToast(
            "Product deleted."
        );


        await loadProducts();


    }catch(error){

        console.error(
            "Delete error:",
            error
        );

        showToast(
            "Failed to delete product."
        );

    }

};


/* =========================
   SHARE PRODUCT
========================= */

window.shareProduct =
async function(id){

    const product =
        products.find(
            item =>
                item.id === id
        );


    if(!product){

        showToast(
            "Product not found."
        );

        return;

    }


    const url =
        `${window.location.origin}/product.html?id=${encodeURIComponent(
            product.id
        )}`;


    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    product.title ||
                    "LetsStudy Pro Product",

                text:
                    product.shortDescription ||
                    product.description ||
                    "Check out this product on LetsStudy Pro.",

                url:
                    url

            });

        }else{

            await navigator.clipboard
                .writeText(url);

            showToast(
                "Product link copied."
            );

        }

    }catch(error){

        if(
            error?.name !==
            "AbortError"
        ){

            try{

                await navigator.clipboard
                    .writeText(url);

                showToast(
                    "Product link copied."
                );

            }catch(copyError){

                console.error(
                    "Copy failed:",
                    copyError
                );

                showToast(
                    "Unable to share product."
                );

            }

        }

    }

};


/* =========================
   SEARCH + FILTERS
========================= */

get("search")
    .addEventListener(
        "input",
        renderProducts
    );


get("categoryFilter")
    .addEventListener(
        "change",
        renderProducts
    );


get("statusFilter")
    .addEventListener(
        "change",
        renderProducts
    );


get("typeFilter")
    .addEventListener(
        "change",
        renderProducts
    );


/* =========================
   REFRESH
========================= */

get("refreshBtn")
    .addEventListener(
        "click",
        async () => {

            await loadProducts();

            showToast(
                "Products refreshed."
            );

        }
    );


/* =========================
   MODAL CLICK
========================= */

get("productModal")
    .addEventListener(
        "click",
        event => {

            if(
                event.target ===
                get("productModal")
            ){

                closeModal();

            }

        }
    );


/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            closeModal();

        }

    }
);


/* =========================
   GLOBAL FUNCTIONS
========================= */

window.loadProducts =
    loadProducts;

window.renderProducts =
    renderProducts;

window.closeModal =
    closeModal;

window.editProduct =
    editProduct;

window.deleteProduct =
    deleteProduct;

window.shareProduct =
    shareProduct;

})();
</script>
