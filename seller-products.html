<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Seller Products | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}

:root{
 --p:#059669;
 --pd:#047857;
 --dark:#172033;
 --muted:#667085;
 --bg:#f5f7fa;
 --card:#fff;
 --border:#e5e9ee;
}

body{
 margin:0;
 font-family:Inter,system-ui,sans-serif;
 background:var(--bg);
 color:var(--dark);
}

a{text-decoration:none;color:inherit}
button,input,select{font:inherit}

.header{
 height:68px;
 background:#fff;
 border-bottom:1px solid var(--border);
 position:sticky;
 top:0;
 z-index:20;
}

.nav{
 max-width:1200px;
 height:100%;
 margin:auto;
 padding:0 18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.logo{
 color:var(--p);
 font-size:20px;
 font-weight:950;
}

.navlinks{
 display:flex;
 gap:7px;
 align-items:center;
}

.navlinks a{
 padding:9px 11px;
 border-radius:8px;
 font-size:9px;
 font-weight:900;
 color:#475467;
}

.navlinks a:hover{
 background:#ecfdf5;
 color:var(--pd);
}

.container{
 max-width:1200px;
 margin:auto;
 padding:24px 18px 70px;
}

.hero{
 padding:25px;
 border-radius:18px;
 background:
 radial-gradient(circle at 90% 10%,#a7f3d0,transparent 35%),
 linear-gradient(135deg,#064e3b,#059669);
 color:#fff;
 animation:up .5s ease;
}

.hero h1{
 margin:0 0 7px;
 font-size:27px;
}

.hero p{
 margin:0;
 color:#d1fae5;
 font-size:10px;
}

.hero-actions{
 margin-top:17px;
 display:flex;
 gap:8px;
}

.btn{
 border:0;
 border-radius:8px;
 padding:10px 14px;
 font-size:9px;
 font-weight:950;
 cursor:pointer;
}

.btn-primary{
 background:#fff;
 color:#047857;
}

.btn-dark{
 background:#172033;
 color:#fff;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin:15px 0;
}

.stat{
 background:#fff;
 border:1px solid var(--border);
 border-radius:12px;
 padding:15px;
}

.stat small{
 color:var(--muted);
 font-size:8px;
 font-weight:800;
}

.stat strong{
 display:block;
 margin-top:5px;
 font-size:20px;
}

.toolbar{
 background:#fff;
 border:1px solid var(--border);
 border-radius:12px;
 padding:10px;
 display:flex;
 gap:8px;
 margin-bottom:14px;
}

.search{
 flex:1;
 min-width:0;
 padding:10px;
 border:1px solid var(--border);
 border-radius:8px;
 outline:none;
 font-size:9px;
}

.select{
 padding:10px;
 border:1px solid var(--border);
 border-radius:8px;
 background:#fff;
 font-size:9px;
 outline:none;
}

.table{
 background:#fff;
 border:1px solid var(--border);
 border-radius:14px;
 overflow:hidden;
}

.row{
 display:grid;
 grid-template-columns:55px 1.5fr 100px 80px 80px 110px;
 gap:10px;
 align-items:center;
 padding:11px 13px;
 border-bottom:1px solid var(--border);
}

.row:last-child{
 border-bottom:0;
}

.head{
 background:#f8fafc;
 color:#667085;
 font-size:8px;
 font-weight:950;
}

.image{
 width:52px;
 height:43px;
 object-fit:cover;
 border-radius:7px;
 background:#ecfdf5;
}

.title{
 font-size:9px;
 font-weight:950;
}

.meta{
 margin-top:3px;
 color:#98a2b3;
 font-size:7px;
}

.price{
 color:var(--p);
 font-size:9px;
 font-weight:950;
}

.status{
 display:inline-block;
 padding:5px 7px;
 border-radius:6px;
 font-size:7px;
 font-weight:950;
}

.published{
 background:#ecfdf3;
 color:#027a48;
}

.draft{
 background:#f2f4f7;
 color:#475467;
}

.actions{
 display:flex;
 gap:5px;
}

.icon-btn{
 border:1px solid var(--border);
 background:#fff;
 padding:6px 7px;
 border-radius:6px;
 font-size:9px;
 cursor:pointer;
}

.icon-btn:hover{
 background:#ecfdf5;
 border-color:#a7f3d0;
}

.delete:hover{
 background:#fef2f2;
 color:#dc2626;
}

.empty{
 padding:50px 20px;
 text-align:center;
 color:var(--muted);
 font-size:9px;
}

.loading{
 padding:45px;
 text-align:center;
 color:var(--muted);
 font-size:9px;
}

.toast{
 position:fixed;
 right:18px;
 bottom:18px;
 background:#172033;
 color:#fff;
 padding:11px 14px;
 border-radius:8px;
 font-size:9px;
 font-weight:900;
 opacity:0;
 transform:translateY(20px);
 transition:.25s;
 z-index:100;
}

.toast.show{
 opacity:1;
 transform:translateY(0);
}

.modal{
 position:fixed;
 inset:0;
 background:#17203380;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:50;
}

.modal.show{
 display:flex;
}

.modal-card{
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 background:#fff;
 border-radius:15px;
 padding:20px;
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}

.modal-head h2{
 margin:0;
 font-size:17px;
}

.close{
 border:0;
 background:#f2f4f7;
 border-radius:7px;
 padding:7px 10px;
 cursor:pointer;
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.field{
 display:flex;
 flex-direction:column;
 gap:5px;
}

.field.full{
 grid-column:1/-1;
}

.field label{
 font-size:8px;
 font-weight:950;
}

.field input,
.field select,
.field textarea{
 width:100%;
 padding:10px;
 border:1px solid var(--border);
 border-radius:7px;
 outline:none;
 font-size:9px;
}

.field textarea{
 min-height:100px;
 resize:vertical;
}

.modal-actions{
 display:flex;
 justify-content:flex-end;
 gap:7px;
 margin-top:15px;
}

@keyframes up{
 from{opacity:0;transform:translateY(15px)}
 to{opacity:1;transform:translateY(0)}
}

@media(max-width:900px){

.stats{
 grid-template-columns:repeat(2,1fr);
}

.row{
 grid-template-columns:50px 1fr 80px 75px;
}

.row>*:nth-child(4){
 display:none;
}

.row>*:nth-child(6){
 display:none;
}

}

@media(max-width:600px){

.container{
 padding:15px 10px 50px;
}

.toolbar{
 flex-direction:column;
}

.stats{
 grid-template-columns:1fr 1fr;
}

.form-grid{
 grid-template-columns:1fr;
}

.field.full{
 grid-column:auto;
}

.head{
 display:none;
}

.row{
 grid-template-columns:48px 1fr auto;
}

.row>*:nth-child(3),
.row>*:nth-child(4),
.row>*:nth-child(5){
 display:none;
}

}
</style>
</head>

<body>

<header class="header">

<nav class="nav">

<a href="seller.html" class="logo">
LetsStudy Pro
</a>

<div class="navlinks">

<a href="seller.html">
Dashboard
</a>

<a href="marketplace-search.html">
Marketplace
</a>

<a href="cart.html">
🛒 Cart
</a>

</div>

</nav>

</header>


<main class="container">

<section class="hero">

<h1>
Seller Products
</h1>

<p>
Create, manage, publish and monitor your marketplace products.
</p>

<div class="hero-actions">

<button
class="btn btn-primary"
id="addBtn">
＋ Add Product
</button>

<a
href="marketplace-search.html"
class="btn btn-dark">
View Marketplace
</a>

</div>

</section>


<section class="stats">

<div class="stat">
<small>Total Products</small>
<strong id="total">0</strong>
</div>

<div class="stat">
<small>Published</small>
<strong id="published">0</strong>
</div>

<div class="stat">
<small>Sales</small>
<strong id="sales">0</strong>
</div>

<div class="stat">
<small>Revenue</small>
<strong id="revenue">$0</strong>
</div>

</section>


<section class="toolbar">

<input
id="search"
class="search"
placeholder="Search your products...">

<select id="status" class="select">

<option value="all">
All Status
</option>

<option value="published">
Published
</option>

<option value="draft">
Draft
</option>

</select>

<select id="type" class="select">

<option value="all">
All Types
</option>

<option value="course">
Course
</option>

<option value="ebook">
eBook
</option>

<option value="template">
Template
</option>

<option value="resource">
Resource
</option>

<option value="digital">
Digital
</option>

</select>

</section>


<section class="table">

<div class="row head">

<div>Image</div>
<div>Product</div>
<div>Price</div>
<div>Sales</div>
<div>Status</div>
<div>Actions</div>

</div>


<div id="productList">

<div class="loading">
Loading your products...
</div>

</div>

</section>

</main>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="modal-card">

<div class="modal-head">

<h2 id="modalTitle">
Add Product
</h2>

<button
class="close"
id="closeModal">
✕
</button>

</div>


<form id="productForm">

<input
type="hidden"
id="productId">


<div class="form-grid">


<div class="field full">

<label>
Product Title
</label>

<input
id="title"
required
placeholder="e.g. Complete Digital Marketing Course">

</div>


<div class="field">

<label>
Category
</label>

<input
id="category"
placeholder="Digital Marketing">

</div>


<div class="field">

<label>
Type
</label>

<select id="productType">

<option value="course">Course</option>
<option value="ebook">eBook</option>
<option value="template">Template</option>
<option value="resource">Resource</option>
<option value="digital">Digital Product</option>

</select>

</div>


<div class="field">

<label>
Price
</label>

<input
id="price"
type="number"
min="0"
step="0.01"
value="0">

</div>


<div class="field">

<label>
Currency
</label>

<select id="currency">

<option value="USD">USD</option>
<option value="TZS">TZS</option>
<option value="KES">KES</option>
<option value="UGX">UGX</option>

</select>

</div>


<div class="field">

<label>
Discount Price
</label>

<input
id="discountPrice"
type="number"
min="0"
step="0.01"
value="0">

</div>


<div class="field">

<label>
Status
</label>

<select id="productStatus">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>

</div>


<div class="field full">

<label>
Thumbnail URL
</label>

<input
id="thumbnail"
type="url"
placeholder="https://...">

</div>


<div class="field full">

<label>
Short Description
</label>

<input
id="shortDescription"
placeholder="Short product description">

</div>


<div class="field full">

<label>
Description
</label>

<textarea
id="description"
placeholder="Describe your product..."></textarea>

</div>


</div>


<div class="modal-actions">

<button
type="button"
class="btn"
id="cancelBtn">
Cancel
</button>

<button
type="submit"
class="btn btn-dark"
id="saveBtn">
Save Product
</button>

</div>

</form>

</div>

</div>


<div id="toast" class="toast"></div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
updateDoc,
deleteDoc,
query,
where,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =================================
FIREBASE
================================= */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsYRgI_0rj0odBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =================================
STATE
================================= */

let currentUser=null;
let products=[];
let editingId=null;


/* =================================
HELPERS
================================= */

const $=
id=>document.getElementById(id);


function escapeHTML(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function money(value,currency){

try{

return new Intl.NumberFormat(
undefined,
{
style:"currency",
currency:currency||"USD",
maximumFractionDigits:0
}
).format(Number(value||0));

}catch{

return `${currency||""} ${Number(value||0)}`;

}

}


function toast(message){

const el=$("toast");

el.textContent=message;

el.classList.add("show");

setTimeout(
()=>el.classList.remove("show"),
2500
);

}


/* =================================
AUTH
================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

currentUser=null;

/*
  Seller page requires authentication.
  Redirect to login.
*/

location.href=
"login.html?redirect=products.html";

return;

}

currentUser=user;

await loadProducts();

}
);


/* =================================
LOAD SELLER PRODUCTS
================================= */

async function loadProducts(){

try{

/*
  IMPORTANT:
  Seller ownership is based on createdBy.
*/

const q=
query(
collection(
db,
"marketplace"
),
where(
"createdBy",
"==",
currentUser.uid
)
);


const snap=
await getDocs(q);


products=
snap.docs.map(
d=>({

id:d.id,
...d.data()

})
);


render();

}catch(error){

console.error(error);

$("productList").innerHTML=`

<div class="empty">
Unable to load products.
</div>

`;

}

}


/* =================================
RENDER
================================= */

function render(){

const search=
$("search").value
.toLowerCase()
.trim();

const status=
$("status").value;

const type=
$("type").value;


const filtered=
products.filter(
p=>{

const text=`

${p.title||""}
${p.category||""}
${p.description||""}

`
.toLowerCase();


return(
(!search || text.includes(search)) &&
(status==="all" ||
p.status===status) &&
(type==="all" ||
p.type===type)
);

});


/* STATS */

$("total")
.textContent=
products.length;

$("published")
.textContent=
products.filter(
p=>p.status==="published"
).length;


const sales=
products.reduce(
(sum,p)=>
sum+
Number(p.salesCount||0),
0
);

$("sales")
.textContent=
sales.toLocaleString();


const revenue=
products.reduce(
(sum,p)=>{

const price=
Number(
p.discountPrice>0 &&
p.discountPrice<p.price
?
p.discountPrice
:
p.price||0
);

return sum+
price*
Number(p.salesCount||0);

},
0
);

$("revenue")
.textContent=
money(
revenue,
products[0]?.currency||"USD"
);


/* LIST */

if(!filtered.length){

$("productList").innerHTML=`

<div class="empty">

No products found.

<br><br>

<button
class="btn btn-dark"
onclick="openAdd()">
＋ Create Product
</button>

</div>

`;

return;

}


$("productList").innerHTML=
filtered
.map(productRow)
.join("");

}


/* =================================
ROW
================================= */

function productRow(p){

const image=
p.thumbnail||
p.imageUrl||
"";

const price=
Number(
p.discountPrice>0 &&
p.discountPrice<p.price
?
p.discountPrice
:
p.price||0
);

return `

<div class="row">

${
image
?
`
<img
class="image"
src="${escapeHTML(image)}"
alt="${escapeHTML(p.title)}">
`
:
`
<div
class="image"
style="
display:flex;
align-items:center;
justify-content:center;">
📦
</div>
`
}


<div>

<div class="title">

${escapeHTML(
p.title||
"Untitled Product"
)}

</div>

<div class="meta">

${escapeHTML(
p.category||
p.type||
"Product"
)}

</div>

</div>


<div class="price">

${money(
price,
p.currency
)}

</div>


<div>

${Number(
p.salesCount||0
).toLocaleString()}

</div>


<div>

<span class="status ${
p.status==="published"
?"published"
:"draft"
}">

${escapeHTML(
p.status||"draft"
)}

</span>

</div>


<div class="actions">

<button
class="icon-btn"
title="View"
onclick="viewProduct('${p.id}')">
👁
</button>

<button
class="icon-btn"
title="Edit"
onclick="editProduct('${p.id}')">
✏️
</button>

<button
class="icon-btn delete"
title="Delete"
onclick="removeProduct('${p.id}')">
🗑
</button>

</div>

</div>

`;

}


/* =================================
MODAL
================================= */

function openModal(){

$("modal")
.classList.add("show");

}

function closeModal(){

$("modal")
.classList.remove("show");

editingId=null;

$("productForm").reset();

$("productId").value="";

$("modalTitle")
.textContent=
"Add Product";

}


window.openAdd=
function(){

editingId=null;

$("productForm").reset();

$("productStatus").value=
"draft";

$("currency").value=
"USD";

$("modalTitle")
.textContent=
"Add Product";

openModal();

};


/* =================================
EDIT
================================= */

window.editProduct=
function(id){

const p=
products.find(
item=>item.id===id
);

if(!p)
return;


editingId=id;

$("productId").value=id;

$("title").value=
p.title||"";

$("category").value=
p.category||"";

$("productType").value=
p.type||"digital";

$("price").value=
p.price||0;

$("currency").value=
p.currency||"USD";

$("discountPrice").value=
p.discountPrice||0;

$("productStatus").value=
p.status||"draft";

$("thumbnail").value=
p.thumbnail||
p.imageUrl||
"";

$("shortDescription").value=
p.shortDescription||"";

$("description").value=
p.description||"";


$("modalTitle")
.textContent=
"Edit Product";

openModal();

};


/* =================================
SAVE
================================= */

$("productForm")
.addEventListener(
"submit",
async event=>{

event.preventDefault();

if(!currentUser)
return;


const data={

title:$("title").value.trim(),

category:$("category").value.trim(),

type:$("productType").value,

price:Number(
$("price").value||0
),

currency:$("currency").value,

discountPrice:Number(
$("discountPrice").value||0
),

thumbnail:$("thumbnail").value.trim(),

shortDescription:
$("shortDescription").value.trim(),

description:
$("description").value.trim(),

status:
$("productStatus").value,

updatedAt:
serverTimestamp()

};


try{

$("saveBtn").disabled=true;

if(editingId){

await updateDoc(
doc(
db,
"marketplace",
editingId
),
data
);

toast(
"Product updated successfully."
);

}else{

await addDoc(
collection(
db,
"marketplace"
),
{

...data,

slug:
createSlug(data.title),

featured:false,

rating:0,

ratingCount:0,

salesCount:0,

views:0,

createdBy:
currentUser.uid,

createdAt:
serverTimestamp(),

publishedAt:
data.status==="published"
?serverTimestamp()
:null

}
);

toast(
"Product created successfully."
);

}


closeModal();

await loadProducts();

}catch(error){

console.error(error);

toast(
"Unable to save product."
);

}finally{

$("saveBtn").disabled=false;

}

}
);


/* =================================
DELETE
================================= */

window.removeProduct=
async function(id){

const product=
products.find(
p=>p.id===id
);

if(!product)
return;


const confirmed=
confirm(
`Delete "${product.title||"this product"}"?`
);

if(!confirmed)
return;


try{

await deleteDoc(
doc(
db,
"marketplace",
id
)
);

toast(
"Product deleted."
);

await loadProducts();

}catch(error){

console.error(error);

toast(
"Unable to delete product."
);

}

};


/* =================================
VIEW
================================= */

window.viewProduct=
function(id){

location.href=
"marketplace-product.html?productId="+
encodeURIComponent(id);

};


/* =================================
SLUG
================================= */

function createSlug(title){

return String(title||"")
.toLowerCase()
.trim()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");

}


/* =================================
EVENTS
================================= */

$("addBtn")
.addEventListener(
"click",
openAdd
);

$("closeModal")
.addEventListener(
"click",
closeModal
);

$("cancelBtn")
.addEventListener(
"click",
closeModal
);

$("search")
.addEventListener(
"input",
render
);

$("status")
.addEventListener(
"change",
render
);

$("type")
.addEventListener(
"change",
render
);

$("modal")
.addEventListener(
"click",
event=>{

if(
event.target===
$("modal")
){

closeModal();

}

});

</script>

</body>
</html>
