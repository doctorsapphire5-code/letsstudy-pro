body{

.pagination button{

.toast{

}

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    updateDoc,
    addDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
        "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
        "let-s-study-pro-course",

    storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
        "474928293390",

    appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
        "G-85B7V5H5J0"

};


const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   STATE
========================= */

let currentUser = null;

let reviews = [];

let filteredReviews = [];

let currentPage = 1;

const perPage = 8;

let replyReviewId = null;

let reportReviewId = null;


/* =========================
   HELPERS
========================= */

const get = id =>
    document.getElementById(id);


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function showToast(message){

    const toast =
        get("toast");

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


function getDate(
    value
){

    if(!value)
        return null;

    try{

        return value.toDate
            ? value.toDate()
            : new Date(value);

    }catch{

        return null;

    }

}


function dateText(
    value
){

    const date =
        getDate(value);

    if(!date)
        return "—";

    return date.toLocaleDateString(
        undefined,
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    );

}


function stars(
    rating
){

    const n =
        Math.max(
            0,
            Math.min(
                5,
                Number(rating || 0)
            )
        );

    return (
        "★".repeat(n) +
        "☆".repeat(5 - n)
    );

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            get("loading")
                .textContent =
                "Please sign in to view seller reviews.";

            return;

        }

        currentUser =
            user;

        await loadReviews();

    }
);


/* =========================
   LOAD REVIEWS
========================= */

async function loadReviews(){

    try{

        const ref =
            collection(
                db,
                "reviews"
            );


        const q =
            query(
                ref,
                where(
                    "sellerId",
                    "==",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(q);


        reviews = [];


        snapshot.forEach(
            snap => {

                const d =
                    snap.data();


                reviews.push({

                    id:
                        snap.id,

                    rating:
                        Number(
                            d.rating || 0
                        ),

                    customerName:
                        d.customerName ||
                        d.userName ||
                        "Customer",

                    customerId:
                        d.customerId ||
                        d.userId ||
                        "",

                    customerEmail:
                        d.customerEmail ||
                        "",

                    productId:
                        d.productId ||
                        "",

                    productTitle:
                        d.productTitle ||
                        d.productName ||
                        "Product",

                    text:
                        d.review ||
                        d.comment ||
                        d.text ||
                        "",

                    verified:
                        Boolean(
                            d.verifiedPurchase ??
                            d.verified ??
                            false
                        ),

                    sellerReply:
                        d.sellerReply ||
                        "",

                    sellerReplyAt:
                        d.sellerReplyAt ||
                        null,

                    createdAt:
                        d.createdAt ||
                        d.timestamp ||
                        null

                });

            }
        );


        buildProductFilter();

        updateSummary();

        applyFilters();


        get("loading")
            .style.display =
            "none";


    }catch(error){

        console.error(
            "Reviews error:",
            error
        );

        get("loading")
            .textContent =
            "Unable to load reviews.";

    }

}


/* =========================
   PRODUCT FILTER
========================= */

function buildProductFilter(){

    const select =
        get("productFilter");


    const products =
        [
            ...new Set(
                reviews
                    .map(
                        item =>
                            item.productTitle
                    )
                    .filter(Boolean)
            )
        ]
        .sort();


    select.innerHTML = `

        <option value="all">
            All Products
        </option>

    `;


    products.forEach(
        product => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                product;

            option.textContent =
                product;

            select.appendChild(
                option
            );

        }
    );

}


/* =========================
   SUMMARY
========================= */

function updateSummary(){

    const total =
        reviews.length;


    const sum =
        reviews.reduce(
            (
                total,
                item
            ) =>
                total +
                item.rating,
            0
        );


    const average =
        total
            ? sum / total
            : 0;


    get("average")
        .textContent =
        average.toFixed(1);


    get("averageStars")
        .textContent =
        stars(
            Math.round(
                average
            )
        );


    get("totalReviews")
        .textContent =
        total +
        (
            total === 1
            ? " review"
            : " reviews"
        );


    for(
        let rating=1;
        rating<=5;
        rating++
    ){

        const count =
            reviews.filter(
                item =>
                    item.rating === rating
            ).length;


        const percentage =
            total
                ? (
                    count / total
                ) * 100
                : 0;


        get(
            "count" + rating
        )
        .textContent =
            count;


        get(
            "bar" + rating
        )
        .style.width =
            percentage + "%";

    }

}


/* =========================
   FILTER
========================= */

function applyFilters(){

    const search =
        get("search")
            .value
    .toLowerCase()
    .trim();

const rating =
    get("ratingFilter").value;

const product =
    get("productFilter").value;

const verified =
    get("verifiedFilter").value;

const sort =
    get("sortFilter").value;


/* =========================
   FILTER REVIEWS
========================= */

filteredReviews =
    reviews.filter(review => {

        const searchableText = (

            String(
                review.customerName || ""
            ) +

            " " +

            String(
                review.customerEmail || ""
            ) +

            " " +

            String(
                review.productTitle || ""
            ) +

            " " +

            String(
                review.text || ""
            )

        )
        .toLowerCase();


        const matchesSearch =
            !value ||
            searchableText.includes(
                value
            );


        const matchesRating =
            rating === "all" ||
            Number(review.rating) ===
            Number(rating);


        const matchesProduct =
            product === "all" ||
            review.productTitle ===
            product;


        const matchesVerified =
            verified === "all" ||
            (
                verified === "verified" &&
                review.verified === true
            ) ||
            (
                verified === "unverified" &&
                review.verified !== true
            );


        return (
            matchesSearch &&
            matchesRating &&
            matchesProduct &&
            matchesVerified
        );

    });


/* =========================
   SORT
========================= */

filteredReviews.sort(
    (a, b) => {

        const dateA =
            getDate(
                a.createdAt
            )?.getTime() || 0;

        const dateB =
            getDate(
                b.createdAt
            )?.getTime() || 0;


        if(sort === "oldest"){

            return dateA - dateB;

        }


        if(sort === "highest"){

            return (
                Number(b.rating || 0) -
                Number(a.rating || 0)
            );

        }


        if(sort === "lowest"){

            return (
                Number(a.rating || 0) -
                Number(b.rating || 0)
            );

        }


        return dateB - dateA;

    }
);


/* =========================
   RESET PAGE
========================= */

currentPage = 1;


/* =========================
   RENDER
========================= */

renderReviews();

}


/* =========================
   RENDER REVIEWS
========================= */

function renderReviews(){

    const total =
        filteredReviews.length;


    get("resultCount")
        .textContent =
        `${total} ${
            total === 1
                ? "review"
                : "reviews"
        }`;


    if(!total){

        get("reviewList")
            .innerHTML = "";

        get("empty")
            .style.display =
            "block";

        get("pagination")
            .innerHTML = "";

        return;

    }


    get("empty")
        .style.display =
        "none";


    const start =
        (
            currentPage - 1
        ) * perPage;


    const end =
        start + perPage;


    const pageReviews =
        filteredReviews.slice(
            start,
            end
        );


    get("reviewList")
        .innerHTML =
        pageReviews
            .map(
                renderReview
            )
            .join("");


    renderPagination();

}


/* =========================
   RENDER SINGLE REVIEW
========================= */

function renderReview(
    review
){

    const initial =
        String(
            review.customerName ||
            "C"
        )
        .charAt(0)
        .toUpperCase();


    const reply =
        review.sellerReply
            ? `
                <div class="reply">

                    <div class="reply-label">
                        Seller Reply
                    </div>

                    <div class="reply-text">
                        ${escapeHTML(
                            review.sellerReply
                        )}
                    </div>

                </div>
              `
            : "";


    return `

        <article
            class="review"
            data-id="${escapeHTML(
                review.id
            )}">

            <div class="review-top">

                <div class="user">

                    <div class="avatar">
                        ${escapeHTML(
                            initial
                        )}
                    </div>

                    <div>

                        <div class="user-name">

                            ${escapeHTML(
                                review.customerName ||
                                "Customer"
                            )}

                            ${
                                review.verified
                                ? `
                                    <span class="verified">
                                        ✓ Verified Purchase
                                    </span>
                                  `
                                : ""
                            }

                        </div>

                        <div class="date">

                            ${dateText(
                                review.createdAt
                            )}

                        </div>

                    </div>

                </div>


                <div class="review-stars">

                    ${stars(
                        Number(
                            review.rating || 0
                        )
                    )}

                </div>

            </div>


            <div class="product">

                ${escapeHTML(
                    review.productTitle ||
                    "Product"
                )}

            </div>


            <div class="review-text">

                ${escapeHTML(
                    review.text ||
                    "No written review."
                )}

            </div>


            ${reply}


            <div class="actions">

                <button
                    type="button"
                    class="action"
                    onclick="openReply('${escapeHTML(
                        review.id
                    )}')">

                    ${
                        review.sellerReply
                            ? "Edit Reply"
                            : "Reply"
                    }

                </button>


                <button
                    type="button"
                    class="action"
                    onclick="openReport('${escapeHTML(
                        review.id
                    )}')">

                    Report

                </button>

            </div>

        </article>

    `;

}


/* =========================
   PAGINATION
========================= */

function renderPagination(){

    const totalPages =
        Math.ceil(
            filteredReviews.length /
            perPage
        );


    const pagination =
        get("pagination");


    if(totalPages <= 1){

        pagination.innerHTML = "";

        return;

    }


    let html = "";


    html += `

        <button
            type="button"
            ${currentPage <= 1 ? "disabled" : ""}
            onclick="changePage(
                ${currentPage - 1}
            )">

            Previous

        </button>

    `;


    for(
        let page = 1;
        page <= totalPages;
        page++
    ){

        if(
            page === 1 ||
            page === totalPages ||
            Math.abs(
                page - currentPage
            ) <= 2
        ){

            html += `

                <button
                    type="button"
                    class="${
                        page === currentPage
                            ? "active"
                            : ""
                    }"
                    onclick="changePage(
                        ${page}
                    )">

                    ${page}

                </button>

            `;

        }

    }


    html += `

        <button
            type="button"
            ${
                currentPage >= totalPages
                    ? "disabled"
                    : ""
            }
            onclick="changePage(
                ${currentPage + 1}
            )">

            Next

        </button>

    `;


    pagination.innerHTML =
        html;

}


/* =========================
   CHANGE PAGE
========================= */

window.changePage =
function(page){

    const totalPages =
        Math.ceil(
            filteredReviews.length /
            perPage
        );


    if(
        page < 1 ||
        page > totalPages
    ){

        return;

    }


    currentPage =
        page;


    renderReviews();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

};


/* =========================
   REPLY MODAL
========================= */

window.openReply =
function(id){

    const review =
        reviews.find(
            item =>
                item.id === id
        );


    if(!review){

        showToast(
            "Review not found."
        );

        return;

    }


    replyReviewId =
        id;


    get("replyReviewText")
        .textContent =
        review.text ||
        "No written review.";


    get("replyText")
        .value =
        review.sellerReply ||
        "";


    get("replyModal")
        .classList.add(
            "show"
        );

};


window.closeReply =
function(){

    replyReviewId =
        null;

    get("replyModal")
        .classList.remove(
            "show"
        );

};


/* =========================
   REPORT MODAL
========================= */

window.openReport =
function(id){

    reportReviewId =
        id;


    get("reportModal")
        .classList.add(
            "show"
        );

};


window.closeReport =
function(){

    reportReviewId =
        null;

    get("reportModal")
        .classList.remove(
            "show"
        );

};


/* =========================
   FILTER EVENTS
========================= */

get("search")
    .addEventListener(
        "input",
        applyFilters
    );


get("ratingFilter")
    .addEventListener(
        "change",
        applyFilters
    );


get("productFilter")
    .addEventListener(
        "change",
        applyFilters
    );


get("verifiedFilter")
    .addEventListener(
        "change",
        applyFilters
    );


get("sortFilter")
    .addEventListener(
        "change",
        applyFilters
    );


/* =========================
   ESC CLOSE
========================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeReply();

            closeReport();

        }

    }
);


/* =========================
   EXPORT
========================= */

window.applyFilters =
    applyFilters;

window.renderReviews =
    renderReviews;

window.renderPagination =
    renderPagination;

})();
</script>

</body>
</html>
