<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Order Service | LetsStudy Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

a{text-decoration:none;color:inherit}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 6%;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:800
}

.nav{
 display:flex;
 gap:18px;
 font-size:13px;
 font-weight:700
}

.container{
 max-width:1050px;
 margin:30px auto;
 padding:0 20px
}

.back{
 display:inline-flex;
 gap:7px;
 align-items:center;
 font-size:13px;
 font-weight:700;
 color:#475467;
 margin-bottom:18px
}

.layout{
 display:grid;
 grid-template-columns:1.5fr 1fr;
 gap:20px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:16px;
 overflow:hidden
}

.card-body{
 padding:24px
}

.image{
 height:250px;
 background:#eef2f6
}

.image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.type{
 color:#155eef;
 font-size:11px;
 font-weight:800;
 text-transform:uppercase
}

h1{
 margin:7px 0;
 font-size:27px
}

.description{
 color:#667085;
 font-size:13px;
 line-height:1.7
}

.freelancer{
 display:flex;
 align-items:center;
 gap:10px;
 margin-top:18px;
 padding-top:18px;
 border-top:1px solid #eaecf0
}

.avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 overflow:hidden;
 background:#e8eefc;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#155eef;
 font-weight:800
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover
}

.name{
 font-size:13px;
 font-weight:800
}

.meta{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin:18px 0
}

.meta-box{
 background:#f8fafc;
 border:1px solid #eaecf0;
 padding:12px;
 border-radius:10px
}

.meta-box small{
 display:block;
 color:#667085;
 font-size:10px;
 margin-bottom:4px
}

.meta-box strong{
 font-size:12px
}

.price{
 font-size:30px;
 font-weight:900;
 margin:10px 0 18px
}

.price small{
 color:#667085;
 font-size:11px;
 font-weight:500
}

.label{
 display:block;
 font-size:11px;
 font-weight:800;
 margin-bottom:7px
}

textarea,
input{
 width:100%;
 padding:12px;
 border:1px solid #d0d5dd;
 border-radius:9px;
 outline:none;
 font:inherit;
 margin-bottom:14px
}

textarea{
 min-height:120px;
 resize:vertical
}

.btn{
 width:100%;
 border:0;
 background:#155eef;
 color:#fff;
 padding:14px;
 border-radius:10px;
 font-size:13px;
 font-weight:800;
 cursor:pointer
}

.btn:hover{
 background:#073bba
}

.loading,
.error{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:15px;
 padding:50px;
 text-align:center;
 color:#667085
}

.error{
 color:#b42318
}

.hidden{
 display:none
}

@media(max-width:800px){

.layout{
 grid-template-columns:1fr
}

.nav{
 display:none
}

.image{
 height:220px
}

}
</style>
</head>

<body>

<header class="top">

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<nav class="nav">

<a href="course.html">Courses</a>
<a href="marketplace.html">Marketplace</a>
<a href="service.html">Services</a>
<a href="careers.html">Careers</a>

</nav>

</header>


<main class="container">

<a
id="backLink"
href="service.html"
class="back">

<i class="fa fa-arrow-left"></i>
Back to Services

</a>


<div id="loading" class="loading">

<i class="fa fa-spinner fa-spin fa-2x"></i>

<h3>
Loading service...
</h3>

</div>


<div
id="error"
class="error hidden">

<i class="fa fa-circle-exclamation"></i>

<h3>
Unable to load service
</h3>

<p id="errorText"></p>

</div>


<div
id="orderPage"
class="layout hidden">


<!-- SERVICE -->

<section class="card">

<div class="image">

<img
id="serviceImage"
src=""
alt="Service">

</div>


<div class="card-body">

<div
id="serviceType"
class="type">
Service
</div>

<h1 id="serviceTitle">
Service
</h1>

<p
id="serviceDescription"
class="description">
</p>


<div class="meta">

<div class="meta-box">

<small>
Delivery Time
</small>

<strong id="delivery">
-
</strong>

</div>


<div class="meta-box">

<small>
Revisions
</small>

<strong id="revisions">
-
</strong>

</div>

</div>


<div class="freelancer">

<div class="avatar">

<img
id="freelancerImage"
src=""
style="display:none">

<span id="initial">
F
</span>

</div>

<div>

<div
id="freelancerName"
class="name">
Freelancer
</div>

<small
id="freelancerInfo"
style="color:#667085">
Professional Freelancer
</small>

</div>

</div>

</div>

</section>


<!-- ORDER -->

<section class="card">

<div class="card-body">

<div style="font-size:12px;color:#667085">
Starting Price
</div>

<div class="price">

<span id="currency">
TZS
</span>

<span id="price">
0
</span>

<small>
fixed price
</small>

</div>


<label class="label">
Project Requirements
</label>

<textarea
id="requirements"
placeholder="Describe what you need from the freelancer..."></textarea>


<label class="label">
Additional Notes
</label>

<textarea
id="notes"
placeholder="Add any additional information..."></textarea>


<button
id="continueButton"
class="btn">

Continue to Checkout

<i class="fa fa-arrow-right"></i>

</button>

</div>

</section>

</div>

</main>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 doc,
 getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
 FIREBASE
========================= */

const firebaseConfig={

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsYrgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

 measurementId:
 "G-85B7V5H5J0"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =========================
 PARAMETER
========================= */

const params=
new URLSearchParams(
window.location.search
);

const serviceId=
params.get("serviceId");


/* =========================
 ELEMENTS
========================= */

const $=id=>
document.getElementById(id);


/* =========================
 LOAD SERVICE
========================= */

async function loadService(){

if(!serviceId){

showError(
"Service ID is missing."
);

return;

}


try{

const ref=
doc(
db,
"services",
serviceId
);

const snap=
await getDoc(ref);


if(!snap.exists()){

showError(
"Service was not found."
);

return;

}


const s=
snap.data();


render(s);


}catch(error){

console.error(error);

showError(
error.message||
"Unable to load service."
);

}

}


/* =========================
 RENDER
========================= */

function render(s){

document.title=
`${s.title||"Service"} | Order`;


$("serviceImage").src=
s.thumbnail||
"https://via.placeholder.com/900x500?text=Service";


$("serviceTitle").textContent=
s.title||
"Professional Service";


$("serviceType").textContent=
s.category||
"Professional Service";


$("serviceDescription").textContent=
s.shortDescription||
s.description||
"";


$("delivery").textContent=
s.deliveryTime||
"Flexible";


$("revisions").textContent=
s.revisions||
"0";


$("currency").textContent=
s.currency||
"TZS";


$("price").textContent=
Number(
s.price||0
).toLocaleString();


const freelancerName=
s.freelancerName||
"Freelancer";


$("freelancerName").textContent=
freelancerName;


$("freelancerInfo").textContent=
s.headline||
s.category||
"Professional Freelancer";


if(
s.freelancerImage||
s.profileImage
){

$("freelancerImage").src=
s.freelancerImage||
s.profileImage;

$("freelancerImage").style.display=
"block";

$("initial").style.display=
"none";

}else{

$("initial").textContent=
freelancerName
.trim()
.charAt(0)
.toUpperCase();

}


$("continueButton")
.onclick=
goToCheckout;


$("loading").style.display=
"none";

$("orderPage").classList.remove(
"hidden"
);

}


/* =========================
 CHECKOUT
========================= */

function goToCheckout(){

const requirements=
$("requirements").value.trim();

const notes=
$("notes").value.trim();


if(!requirements){

alert(
"Please describe your project requirements."
);

$("requirements").focus();

return;

}


/*
 Send service information
 to checkout using URL parameters.
*/

const query=
new URLSearchParams({

serviceId:
serviceId,

requirements:
requirements,

notes:
notes

});


window.location.href=
"checkout-service.html?"+
query.toString();

}


/* =========================
 ERROR
========================= */

function showError(message){

$("loading").style.display=
"none";

$("error").classList.remove(
"hidden"
);

$("errorText").textContent=
message;

}


/* =========================
 START
========================= */

loadService();

</script>

</body>
</html>
