<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Services | LetsStudy Pro</title>

<meta name="description"
content="Discover professional services on LetsStudy Pro. Search, compare and order services online.">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  text-decoration:none;
  color:#172033;
  font-size:21px;
  font-weight:800
}

.logo span{color:#2563eb}

nav{
  display:flex;
  gap:7px
}

nav a{
  text-decoration:none;
  color:#475569;
  font-size:10px;
  font-weight:700;
  padding:9px
}

.container{
  width:92%;
  max-width:1100px;
  margin:25px auto
}

.hero{
  background:#172033;
  color:#fff;
  border-radius:18px;
  padding:30px 24px;
  margin-bottom:15px
}

.hero small{
  color:#93c5fd;
  font-size:10px;
  font-weight:800
}

.hero h1{
  font-size:30px;
  margin-top:7px
}

.hero p{
  color:#cbd5e1;
  font-size:12px;
  line-height:1.5;
  margin-top:7px
}

.search{
  display:flex;
  gap:8px;
  margin-top:18px
}

.search input,
.search select{
  border:0;
  outline:0;
  background:#fff;
  padding:12px;
  border-radius:8px;
  font-size:11px
}

.search input{
  flex:2
}

.search select{
  flex:1
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:15px
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px
}

.stat small{
  color:#64748b;
  font-size:10px
}

.stat strong{
  display:block;
  margin-top:5px;
  font-size:21px
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:17px;
  display:flex;
  flex-direction:column
}

.tag{
  background:#eef5ff;
  color:#2563eb;
  padding:5px 7px;
  border-radius:6px;
  font-size:9px;
  font-weight:800;
  align-self:flex-start
}

.card h2{
  font-size:15px;
  line-height:1.4;
  margin-top:10px
}

.card p{
  color:#64748b;
  font-size:11px;
  line-height:1.5;
  margin-top:6px
}

.meta{
  display:grid;
  gap:6px;
  margin-top:13px;
  font-size:10px;
  color:#64748b
}

.meta strong{
  color:#172033
}

.price{
  font-size:19px;
  color:#2563eb;
  font-weight:900;
  margin-top:13px
}

.actions{
  display:flex;
  gap:7px;
  margin-top:auto;
  padding-top:14px
}

.btn{
  flex:1;
  text-decoration:none;
  text-align:center;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
  cursor:pointer
}

.secondary{
  background:#eef2f7;
  color:#172033
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  text-align:center;
  padding:50px 20px;
  color:#64748b
}

.loading{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  text-align:center;
  padding:50px;
  color:#64748b
}

.hidden{display:none!important}

@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  nav{display:none}

  .grid,
  .stats{
    grid-template-columns:1fr
  }

  .search{
    flex-direction:column
  }

  .container{
    width:94%
  }
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
LetsStudy <span>Pro</span>
</a>

<nav>
<a href="courses.html">Courses</a>
<a href="marketplace.html">Marketplace</a>
<a href="services.html">Services</a>
<a href="services-order.html">My Orders</a>
</nav>

</header>


<main class="container">

<section class="hero">

<small>LETSSTUDY PRO SERVICES</small>

<h1>
Professional Services
</h1>

<p>
Find the right service, compare providers and place
your order through LetsStudy Pro.
</p>

<div class="search">

<input
id="search"
type="search"
placeholder="Search services..."
>

<select id="category">

<option value="all">
All Categories
</option>

</select>

<select id="sort">

<option value="default">
Sort By
</option>

<option value="low">
Price: Low to High
</option>

<option value="high">
Price: High to Low
</option>

<option value="rating">
Highest Rated
</option>

</select>

</div>

</section>


<section class="stats">

<div class="stat">
<small>Services</small>
<strong id="total">0</strong>
</div>

<div class="stat">
<small>Providers</small>
<strong id="providers">0</strong>
</div>

<div class="stat">
<small>Categories</small>
<strong id="categories">0</strong>
</div>

</section>


<div
id="loading"
class="loading">
Loading services...
</div>


<section
id="grid"
class="grid hidden">
</section>

</main>


<script>

/*
==================================================
LETSSTUDY PRO SERVICES MARKETPLACE

URL:

services.html

API:

GET /api/services

EXPECTED:

{
  services:[
    {
      id:"service-001",
      title:"Website Design",
      category:"Technology",
      description:"Professional website design.",
      price:50000,
      currency:"TZS",
      provider:"LetsStudy Pro",
      delivery:"5 days",
      rating:4.8
    }
  ]
}

VIEW:

services-view.html?id=SERVICE_ID

CHECKOUT:

services-checkout.html?serviceId=SERVICE_ID

==================================================
*/

const search =
document.getElementById("search");

const category =
document.getElementById("category");

const sort =
document.getElementById("sort");

const grid =
document.getElementById("grid");

const loading =
document.getElementById("loading");

let services=[];


/* =========================
   LOAD
========================= */

loadServices();


async function loadServices(){

try{

const response =
await fetch("/api/services");

if(!response.ok){

throw new Error(
"API unavailable"
);

}

const result =
await response.json();

services =
result.services ||
result.data ||
result ||
[];

}catch(error){

console.warn(
"Using demo services:",
error
);

services =
demoServices();

}

loading.classList.add(
"hidden"
);

grid.classList.remove(
"hidden"
);

buildCategories();

updateStats();

render();

}


/* =========================
   FILTER EVENTS
========================= */

search.addEventListener(
"input",
render
);

category.addEventListener(
"change",
render
);

sort.addEventListener(
"change",
render
);


/* =========================
   CATEGORIES
========================= */

function buildCategories(){

const categories =
[
...new Set(
services
.map(
x =>
String(
x.category || ""
)
.trim()
)
)
.filter(Boolean)
.sort();


category.innerHTML =
`
<option value="all">
All Categories
</option>
` +
categories.map(
cat =>
`
<option value="${escapeAttr(cat)}">
${escapeHTML(cat)}
</option>
`
).join("");

}


/* =========================
   RENDER
========================= */

function render(){

const term =
search.value
.toLowerCase()
.trim();

const selectedCategory =
category.value;


let result =
services.filter(
service => {

const text =
(
service.title || ""
) +
" " +
(
service.description || ""
) +
" " +
(
service.provider || ""
) +
" " +
(
service.category || ""
);


const matchesSearch =
!term ||
text
.toLowerCase()
.includes(term);


const matchesCategory =
selectedCategory === "all" ||
String(
service.category || ""
) ===
selectedCategory;


return (
matchesSearch &&
matchesCategory
);

});


/* SORT */

if(sort.value==="low"){

result.sort(
(a,b) =>
Number(a.price||0) -
Number(b.price||0)
);

}

if(sort.value==="high"){

result.sort(
(a,b) =>
Number(b.price||0) -
Number(a.price||0)
);

}

if(sort.value==="rating"){

result.sort(
(a,b) =>
Number(b.rating||0) -
Number(a.rating||0)
);

}


if(!result.length){

grid.innerHTML = `

<div class="empty">

<h3>
No services found
</h3>

<p style="margin-top:7px">
Try another search or category.
</p>

</div>

`;

return;

}


grid.innerHTML =
result
.map(createCard)
.join("");

}


/* =========================
   CARD
========================= */

function createCard(
service
){

const id =
service.id ||
service.serviceId ||
"";


return `

<article class="card">

<span class="tag">

${escapeHTML(
label(
service.category ||
"Service"
)
)}

</span>


<h2>

${escapeHTML(
service.title ||
"Professional Service"
)}

</h2>


<p>

${escapeHTML(
service.description ||
"Professional service available on LetsStudy Pro."
)}

</p>


<div class="meta">

<div>
Provider:
<strong>
${escapeHTML(
service.provider ||
service.providerName ||
"Professional Provider"
)}
</strong>
</div>


<div>
Delivery:
<strong>
${escapeHTML(
service.delivery ||
service.deliveryTime ||
"See details"
)}
</strong>
</div>


<div>
Rating:
<strong>
${
service.rating
? "★ " +
escapeHTML(
service.rating
)
: "Not rated"
}
</strong>
</div>

</div>


<div class="price">

${
service.price !== undefined &&
service.price !== null

? formatMoney(
service.price,
service.currency
)

: "Price on request"

}

</div>


<div class="actions">

<a
class="btn secondary"
href="services-view.html?id=${encodeURIComponent(id)}">
View
</a>


<a
class="btn"
href="services-checkout.html?serviceId=${encodeURIComponent(id)}">
Order
</a>

</div>

</article>

`;

}


/* =========================
   STATS
========================= */

function updateStats(){

document.getElementById(
"total"
).textContent =
services.length;


const providers =
new Set(
services
.map(
x =>
x.provider ||
x.providerName
)
.filter(Boolean)
);


document.getElementById(
"providers"
).textContent =
providers.size;


const categories =
new Set(
services
.map(
x =>
x.category
)
.filter(Boolean)
);


document.getElementById(
"categories"
).textContent =
categories.size;

}


/* =========================
   DEMO DATA
========================= */

function demoServices(){

return [

{
id:"web-design",
title:"Professional Website Design",
category:"Technology",
description:
"Modern responsive website design for businesses, organizations and personal projects.",
price:50000,
currency:"TZS",
provider:"LetsStudy Pro",
delivery:"5 days",
rating:4.9
},

{
id:"graphic-design",
title:"Graphic Design",
category:"Design",
description:
"Professional posters, social media graphics, banners and digital designs.",
price:25000,
currency:"TZS",
provider:"Creative Studio",
delivery:"2 days",
rating:4.7
},

{
id:"marketing",
title:"Digital Marketing",
category:"Marketing",
description:
"Marketing support for campaigns, content strategy and digital growth.",
price:70000,
currency:"TZS",
provider:"Marketing Team",
delivery:"7 days",
rating:4.8
},

{
id:"cv-writing",
title:"Professional CV Writing",
category:"Career",
description:
"Create a professional CV designed to present your skills and experience clearly.",
price:20000,
currency:"TZS",
provider:"Career Specialist",
delivery:"2 days",
rating:4.6
},

{
id:"content-writing",
title:"Content Writing",
category:"Writing",
description:
"High-quality website, blog and educational content writing.",
price:30000,
currency:"TZS",
provider:"Content Specialist",
delivery:"3 days",
rating:4.7
},

{
id:"business-consulting",
title:"Business Consulting",
category:"Business",
description:
"Professional guidance for business planning, strategy and digital growth.",
price:100000,
currency:"TZS",
provider:"Business Consultant",
delivery:"5 days",
rating:4.9
}

];

}


/* =========================
   HELPERS
========================= */

function formatMoney(
amount,
currency="TZS"
){

return Number(
amount
).toLocaleString(
"en-US"
) +
" " +
(
currency || "TZS"
);

}


function label(
value
){

return String(
value || ""
)
.replace(
/[-_]/g,
" "
)
.replace(
/\b\w/g,
x=>x.toUpperCase()
);

}


function escapeHTML(
value
){

return String(
value ?? ""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(
value
){

return escapeHTML(value);

}

</script>

</body>
</html>
