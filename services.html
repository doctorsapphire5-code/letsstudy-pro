<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Services | LetsStudy Pro</title>

<meta name="description"
content="Find professional digital services from verified freelancers on LetsStudy Pro.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,Arial,sans-serif}
a{text-decoration:none;color:inherit}

.top{
 height:64px;background:#fff;border-bottom:1px solid #e5e7eb;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 6%;position:sticky;top:0;z-index:20
}
.logo{color:#155eef;font-size:21px;font-weight:800}
.nav{display:flex;gap:18px;font-size:13px;font-weight:700}

.hero{
 background:linear-gradient(135deg,#155eef,#073bba);
 color:#fff;padding:55px 20px
}
.hero-inner{max-width:1100px;margin:auto}
.hero h1{margin:0 0 10px;font-size:37px}
.hero p{max-width:650px;line-height:1.7;color:#dbe7ff}

.container{max-width:1100px;margin:25px auto;padding:0 20px}

.toolbar{
 background:#fff;border:1px solid #e5e7eb;border-radius:14px;
 padding:14px;display:grid;grid-template-columns:2fr 1fr 1fr;
 gap:10px;margin-bottom:20px
}
input,select{
 width:100%;padding:11px;border:1px solid #d9dee8;
 border-radius:9px;outline:none;background:#fff
}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.card{
 background:#fff;border:1px solid #e5e7eb;border-radius:14px;
 overflow:hidden;transition:.2s
}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #00000012}

.image{height:190px;background:#eef2f6;position:relative}
.image img{width:100%;height:100%;object-fit:cover}

.badge{
 position:absolute;top:10px;left:10px;background:#155eef;color:#fff;
 padding:5px 9px;border-radius:20px;font-size:10px;font-weight:800
}

.verified{
 position:absolute;right:10px;top:10px;background:#ecfdf3;color:#027a48;
 padding:5px 9px;border-radius:20px;font-size:10px;font-weight:800
}

.body{padding:15px}
.category{color:#155eef;font-size:10px;font-weight:800;text-transform:uppercase}
.body h3{margin:6px 0;font-size:17px}
.desc{color:#667085;font-size:12px;line-height:1.6;min-height:42px}

.freelancer{
 display:flex;align-items:center;gap:8px;margin:12px 0;
 font-size:12px;font-weight:700
}

.avatar{
 width:32px;height:32px;border-radius:50%;background:#e8eefc;
 display:flex;align-items:center;justify-content:center;
 color:#155eef;font-weight:800
}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.tag{background:#f2f4f7;padding:5px 8px;border-radius:20px;font-size:10px;color:#475467}

.rating{color:#f59e0b;font-size:12px}
.rating span{color:#667085}

.price{margin-top:10px;font-size:17px;font-weight:800}
.price small{color:#667085;font-size:10px;font-weight:500}

.meta{
 display:flex;justify-content:space-between;margin-top:10px;
 color:#667085;font-size:10px
}

.actions{display:flex;gap:7px;margin-top:13px}
.actions a{
 flex:1;text-align:center;padding:10px;border-radius:8px;
 background:#eef2f6;font-size:11px;font-weight:700
}
.actions .primary{background:#155eef;color:#fff}

.empty{
 grid-column:1/-1;background:#fff;border:1px solid #e5e7eb;
 border-radius:14px;padding:55px;text-align:center;color:#667085
}
.loading{text-align:center;padding:60px;color:#667085}

@media(max-width:800px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .toolbar{grid-template-columns:1fr 1fr}
}

@media(max-width:550px){
 .nav{display:none}
 .hero h1{font-size:29px}
 .container{padding:0 15px}
 .toolbar,.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="top">

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<nav class="nav">
<a href="course.html">Courses</a>
<a href="marketplace.html">Marketplace</a>
<a href="service.html">Services</a>
<a href="careers.html">Careers</a>
</nav>

</header>


<section class="hero">

<div class="hero-inner">

<h1>Find Professional Services</h1>

<p>
Hire skilled freelancers for design, writing,
marketing, technology, education and other
professional services.
</p>

</div>

</section>


<main class="container">

<section class="toolbar">

<input
id="search"
placeholder="Search services, skills or freelancers...">

<select id="category">
<option value="">All Categories</option>
</select>

<select id="pricing">

<option value="">All Pricing</option>
<option value="fixed">Fixed Price</option>
<option value="hourly">Hourly</option>
<option value="package">Packages</option>

</select>

</section>


<section>

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px
">

<h2 style="margin:0;font-size:20px">
Professional Services
</h2>

<span
id="count"
style="font-size:12px;color:#667085">
Loading...
</span>

</div>


<div id="services" class="grid">

<div class="loading">

<i class="fa fa-spinner fa-spin"></i>

<p>Loading services...</p>

</div>

</div>

</section>

</main>


<script type="module">

import {
 initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
 FIREBASE
========================= */

const firebaseConfig={

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

 measurementId:
 "G-85B7V5H5J0"

};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* =========================
 STATE
========================= */

let services=[];


/* =========================
 DOM
========================= */

const list=document.getElementById("services");
const search=document.getElementById("search");
const category=document.getElementById("category");
const pricing=document.getElementById("pricing");
const count=document.getElementById("count");


/* =========================
 ESCAPE
========================= */

function esc(value=""){

 return String(value)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* =========================
 LOAD SERVICES
========================= */

async function loadServices(){

 try{

  const snap=
   await getDocs(
    collection(db,"services")
   );

  services=[];

  snap.forEach(item=>{

   const data=item.data();

   if(data.status==="published"){

    services.push({

     id:item.id,
     ...data

    });

   }

  });

  buildCategories();
  render();

 }catch(error){

  console.error(error);

  list.innerHTML=`

   <div class="empty">

    <i class="fa fa-triangle-exclamation"></i>

    <h3>Unable to load services</h3>

    <p>Please try again later.</p>

   </div>

  `;

 }

}


/* =========================
 CATEGORIES
========================= */

function buildCategories(){

 const categories=[

  ...new Set(

   services
    .map(s=>s.category)
    .filter(Boolean)

  )

 ].sort();


 category.innerHTML=

 `<option value="">All Categories</option>`

 +

 categories.map(
  item=>`

   <option value="${esc(item)}">
    ${esc(item)}
   </option>

  `
 ).join("");

}


/* =========================
 RENDER
========================= */

function render(){

 const keyword=
  search.value.toLowerCase().trim();

 const selectedCategory=
  category.value;

 const selectedPricing=
  pricing.value;


 const filtered=
  services.filter(s=>{

   const text=`

    ${s.title||""}
    ${s.description||""}
    ${s.shortDescription||""}
    ${s.category||""}
    ${s.subcategory||""}
    ${s.freelancerName||""}
    ${(s.skills||[]).join(" ")}
    ${(s.tags||[]).join(" ")}

   `.toLowerCase();


   return(

    text.includes(keyword)

    &&

    (
     !selectedCategory ||
     s.category===selectedCategory
    )

    &&

    (
     !selectedPricing ||
     s.pricingType===selectedPricing
    )

   );

  });


 count.textContent=
  `${filtered.length} service${
   filtered.length===1?"":"s"
  }`;


 if(!filtered.length){

  list.innerHTML=`

   <div class="empty">

    <i class="fa fa-briefcase"></i>

    <h3>No services found</h3>

    <p>Try another search or category.</p>

   </div>

  `;

  return;

 }


 filtered.sort(
  (a,b)=>
   Number(b.featured||false)-
   Number(a.featured||false)
 );


 list.innerHTML=
  filtered.map(createCard).join("");

}


/* =========================
 CARD
========================= */

function createCard(s){

 const skills=
  Array.isArray(s.skills)
   ?s.skills
   :typeof s.skills==="string"
    ?s.skills.split(",")
    :[];


 const tags=
  skills
   .map(x=>String(x).trim())
   .filter(Boolean)
   .slice(0,4);


 const price=
  Number(s.price||0);

 const rating=
  Number(s.rating||0);

 const initials=
  (s.freelancerName||"F")
   .trim()
   .charAt(0)
   .toUpperCase();


 return`

 <article class="card">

  <div class="image">

   <img
    src="${esc(
     s.thumbnail||
     "https://via.placeholder.com/700x400?text=Service"
    )}"
    alt="${esc(s.title||"Service")}"
    loading="lazy"
   >

   ${
    s.featured
    ?
    `<span class="badge">
      ★ Featured
     </span>`
    :
    ""
   }

   ${
    s.verified
    ?
    `<span class="verified">
      ✓ Verified
     </span>`
    :
    ""
   }

  </div>


  <div class="body">

   <div class="category">
    ${esc(
     s.category||
     "Professional Service"
    )}
   </div>


   <h3>
    ${esc(
     s.title||
     "Untitled Service"
    )}
   </h3>


   <div class="desc">
    ${esc(
     s.shortDescription||
     s.description||
     "Professional service."
    )}
   </div>


   <div class="freelancer">

    <span class="avatar">
     ${esc(initials)}
    </span>

    <span>
     ${esc(
      s.freelancerName||
      "Freelancer"
     )}
    </span>

    ${
     s.verified
      ?
      `<i
       class="fa fa-circle-check"
       style="color:#12b76a">
      </i>`
      :
      ""
    }

   </div>


   <div class="tags">

    ${
     tags.map(
      tag=>
       `<span class="tag">
        ${esc(tag)}
        </span>`
     ).join("")
    }

   </div>


   <div class="rating">

    ★ ${rating.toFixed(1)}

    <span>
     (${Number(
      s.ratingCount||0
     ).toLocaleString()})
    </span>

   </div>


   <div class="price">

    ${esc(s.currency||"TZS")}
    ${price.toLocaleString()}

    <small>
     ${
      s.pricingType
       ? " / "+esc(s.pricingType)
       : ""
     }
    </small>

   </div>


   <div class="meta">

    <span>
     <i class="fa fa-clock"></i>
     ${esc(s.deliveryTime||"Flexible")}
    </span>

    <span>
     <i class="fa fa-rotate"></i>
     ${Number(s.revisions||0)} revisions
    </span>

   </div>


   <div class="actions">

    <a
     class="primary"
     href="services-view.html?serviceId=${encodeURIComponent(s.id)}">

     View Service

    </a>


    <a
     href="services-order.html?serviceId=${encodeURIComponent(s.id)}#order">

     Order

    </a>

   </div>

  </div>

 </article>

 `;

}


/* =========================
 FILTER EVENTS
========================= */

search.addEventListener("input",render);
category.addEventListener("change",render);
pricing.addEventListener("change",render);


/* =========================
 START
========================= */

loadServices();

</script>

</body>
</html>
