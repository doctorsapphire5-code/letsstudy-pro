<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Services | LetsStudy Pro</title>
<meta name="description" content="Explore digital, creative, marketing, technology and professional services on LetsStudy Pro.">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background:#f6f8fc;
  color:#111827
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:17px
}

nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.logo{
  color:#2563eb;
  font-size:21px;
  font-weight:900;
  text-decoration:none
}

nav a{
  color:#374151;
  text-decoration:none;
  font-weight:700
}

main{
  max-width:1100px;
  margin:auto;
  padding:30px 16px
}

.hero{
  text-align:center;
  margin-bottom:22px
}

.hero h1{
  margin:0 0 8px;
  font-size:clamp(30px,5vw,46px)
}

.hero p{
  margin:0;
  color:#6b7280
}

.tools{
  display:grid;
  grid-template-columns:1fr 220px;
  gap:10px;
  margin:20px 0
}

.search,
select{
  width:100%;
  padding:14px 16px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#fff;
  font-size:15px;
  outline:none
}

.search:focus,
select:focus{
  border-color:#2563eb
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:18px
}

.card{
  overflow:hidden;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.05)
}

.card img{
  width:100%;
  height:165px;
  object-fit:cover;
  background:#e5e7eb
}

.content{
  padding:16px
}

.content h2{
  margin:0 0 8px;
  font-size:19px
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0
}

.meta span{
  padding:5px 8px;
  border-radius:7px;
  background:#eff6ff;
  color:#1d4ed8;
  font-size:11px;
  font-weight:700
}

.content p{
  color:#6b7280;
  font-size:13px;
  line-height:1.5
}

.price{
  margin-top:10px;
  font-size:15px;
  font-weight:900;
  color:#111827
}

.btn{
  display:block;
  text-align:center;
  margin-top:14px;
  padding:11px;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  font-weight:800
}

.status{
  text-align:center;
  padding:25px;
  color:#6b7280
}

@media(max-width:650px){
  .tools{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>

<nav>

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<a href="index.html">
Home
</a>

</nav>

</header>


<main>

<section class="hero">

<h1>Professional Services</h1>

<p>
Find digital, creative, technology and professional services.
</p>

</section>


<div class="tools">

<input
id="search"
class="search"
type="search"
placeholder="Search services..."
aria-label="Search services"
>

<select id="category">

<option value="">
All Categories
</option>

</select>

</div>


<div id="status" class="status">
Loading services...
</div>


<div id="services" class="grid"></div>

</main>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBcOYDfAVKXKbljsyRgI0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


const container=
document.getElementById("services");

const status=
document.getElementById("status");

const search=
document.getElementById("search");

const category=
document.getElementById("category");


let allServices=[];


async function loadServices(){

try{

const snap=
await getDocs(
collection(db,"services")
);


allServices=
snap.docs.map(doc=>({

id:doc.id,

...doc.data()

}));


createCategories();

render(allServices);


}catch(error){

console.error(error);

status.textContent=
"Unable to load services.";

}

}


function createCategories(){

const categories=[

...new Set(

allServices

.map(item=>item.category)

.filter(Boolean)

)

];


categories.sort();


categories.forEach(cat=>{

const option=
document.createElement("option");

option.value=cat;

option.textContent=cat;

category.appendChild(option);

});

}


function render(list){

container.innerHTML="";


if(!list.length){

status.textContent=
"No services found.";

return;

}


status.textContent=
`${list.length} service${list.length>1?"s":""} available`;


list.forEach(service=>{


const title=

service.title||

service.name||

service.serviceName||

"Professional Service";


const description=

service.description||

"Explore this professional service.";


const image=

service.thumbnail||

service.image||

service.imageUrl||

"https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=800&q=80";


const cat=

service.category||

"";


const provider=

service.provider||

service.providerName||

service.businessName||

"";


const type=

service.pricingType||

service.priceType||

service.type||

"";


const price=

service.price||

service.amount||

"";


const card=
document.createElement("article");


card.className="card";


card.innerHTML=`

<img

src="${image}"

alt="${title}"

loading="lazy"

onerror="this.src='https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=800&q=80'"

>


<div class="content">


<h2>
${title}
</h2>


<div class="meta">

${

provider

? `<span>${provider}</span>`

: ""

}


${

cat

? `<span>${cat}</span>`

: ""

}


${

type

? `<span>${type}</span>`

: ""

}

</div>


<p>
${description}
</p>


${

price

? `<div class="price">${price}</div>`

: ""

}


<a

class="btn"

href="services-details.html?id=${encodeURIComponent(service.id)}"

>

View Service

</a>


</div>

`;


container.appendChild(card);

});

}


function filterServices(){

const q=
search.value
.toLowerCase()
.trim();


const cat=
category.value;


const filtered=
allServices.filter(service=>{


const text=[

service.title,

service.name,

service.serviceName,

service.description,

service.category,

service.provider,

service.providerName,

service.businessName,

service.type,

service.pricingType,

service.tags,

service.skills

]

.filter(Boolean)

.join(" ")

.toLowerCase();


return (

text.includes(q)

&&

(!cat ||
service.category===cat)

);

});


render(filtered);

}


search.addEventListener(
"input",
filterServices
);


category.addEventListener(
"change",
filterServices
);


loadServices();

</script>

</body>
</html>
