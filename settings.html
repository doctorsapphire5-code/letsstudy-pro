<!DOCTYPE html>
<html lang="en">

<head>
<div style="text-align:center;">

<img 
src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjECNloMaaAcXxLpY9IJ6bU9Uumd9t081VLJ9VCEbOjLtAzmeL5zzI7YWwBj16O0kvhkf2VkHyz2o-oYQ6QxXJEUT17zN51mWQK-uhk7SEaOlKy7MQcmFMpXn74Ip-tYlN2H6_DE1a02pyyxRI3KwrYlJD-Zf4VCYgPqBmzFhg-Uoxtgbn95rSOcOk1a8Mr/s320/Screenshot_20260717-145131_1.jpg"

width="320"

height="259"

alt="LetsStudy Pro platform screenshot"

loading="lazy">

</div>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Settings | LetsStudy Pro</title>

<link rel="icon" href="favicon.png">

<style>

body{
font-family:Arial;
background:#f5f7fb;
margin:0;
}

header{
background:#0b57d0;
color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 5px 15px #0002;
}


button{

padding:12px 20px;
border:0;
border-radius:8px;
background:#0b57d0;
color:white;
cursor:pointer;

}


.logout{

background:#dc2626;

}

.switch{

display:flex;
justify-content:space-between;
align-items:center;

}

</style>

</head>


<body>


<header>

<h1>
⚙️ Account Settings
</h1>

</header>



<div class="container">


<div class="card">

<h2>
👤 Profile
</h2>

<p id="email">
Loading...
</p>

<button onclick="location.href='profile.html'">

Edit Profile

</button>

</div>




<div class="card">

<h2>
🌐 Language
</h2>

<select>

<option>
English
</option>

<option>
Swahili
</option>

</select>

</div>





<div class="card">

<h2>
🎨 Appearance
</h2>


<div class="switch">

<span>
Dark Mode
</span>


<input type="checkbox" id="dark">

</div>


</div>





<div class="card">

<h2>
🔔 Notifications
</h2>


<div class="switch">

<span>
Course Updates
</span>

<input type="checkbox" checked>

</div>


</div>





<div class="card">

<h2>
🔐 Security
</h2>


<button onclick="location.href='change-password.html'">

Change Password

</button>


</div>





<div class="card">


<button class="logout" onclick="logout()">

Logout

</button>


</div>




</div>





<script type="module">


import {

auth

} from "./assets/js/firebase.js";


import {

onAuthStateChanged,
signOut

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";





onAuthStateChanged(

auth,

user=>{


if(!user){

location.href="login.html";

return;

}


document.getElementById(
"email"
).innerHTML=

user.email;


});






window.logout = async()=>{


await signOut(auth);


location.href="login.html";


}







document.getElementById("dark")
.onchange=function(){


document.body.style.background=

this.checked
?
"#111827"
:
"#f5f7fb";


}



</script>


</body>

</html>
