<header>

<h1>
⚙️ Account Settings
</h1>
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial}
#sidebar{
 position:fixed;top:0;left:0;width:260px;height:100vh;
 background:#fff;transform:translateX(-100%);
 transition:.3s;z-index:2;padding:15px
}
#sidebar.open{transform:translateX(0)}
#overlay{
 position:fixed;inset:0;background:#0008;
 display:none;z-index:1
}
#overlay.show{display:block}
button{font-size:22px;padding:8px}
.close{float:right}
.links{margin-top:60px}
.links a{
 display:block;
 padding:12px;
 text-decoration:none;
 color:#111;
 border-bottom:1px solid #eee
}
</style>
</head>

<body>

<button onclick="openSide()">☰</button>

<div id="sidebar">
  <button class="close" onclick="closeSide()">×</button>

  <!-- WEKA LINKS HAPA -->
  <div class="links">
   <a href="create-profile.html">Create Profile</a>
    <a href="edit-profile.html">edit-profile</a>
    <a href="notifications.html">notifications</a>
    <a href="payment.html">Payments</a>
    <a href="super-admin">Administration</a>
    <a href="admin.html">Admin Setting</a>
    <a href="account-notifications.html">Account Notifications</a>
    <a href="account-preferences.html">Account Preference</a>
    <a href="account-security.html">Account Security</a>
  </div>
</div>

<div id="overlay" onclick="closeSide()"></div>

<script>
const side=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");

function openSide(){
 side.classList.add("open");
 overlay.classList.add("show");
}

function closeSide(){
 side.classList.remove("open");
 overlay.classList.remove("show");
}
</script>

</body>
</html>
</header>



<div class="container">


<div class="card">

<h2>
👤 Profile
</h2>

<p id="email">
Loading...
</p>

<button onclick="location.href='profile.html'">

Edit Profile

</button>

</div>




<div class="card">

<h2>
🌐 Language
</h2>

<select>

<option>
English
</option>

<option>
Swahili
</option>

</select>

</div>





<div class="card">

<h2>
🎨 Appearance
</h2>


<div class="switch">

<span>
Dark Mode
</span>


<input type="checkbox" id="dark">

</div>


</div>





<div class="card">

<h2>
🔔 Notifications
</h2>


<div class="switch">

<span>
Course Updates
</span>

<input type="checkbox" checked>

</div>


</div>





<div class="card">

<h2>
🔐 Security
</h2>


<button onclick="location.href='change-password.html'">

Change Password

</button>


</div>





<div class="card">


<button class="logout" onclick="logout()">

Logout

</button>


</div>




</div>





<script type="module">


import {

auth

} from "./assets/js/firebase.js";


import {

onAuthStateChanged,
signOut

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";





onAuthStateChanged(

auth,

user=>{


if(!user){

location.href="login.html";

return;

}


document.getElementById(
"email"
).innerHTML=

user.email;


});






window.logout = async()=>{


await signOut(auth);


location.href="login.html";


}







document.getElementById("dark")
.onchange=function(){


document.body.style.background=

this.checked
?
"#111827"
:
"#f5f7fb";


}



</script>


</body>

</html>
