    href="https://letsstudy.pro/"

    Open on LetsStudy Pro
  </a>

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  /*
   * WEKA API KEY YAKO YA FIREBASE WEB CONFIG
   * HAPA.
   */
  apiKey: "WEKA_API_KEY_YAKO_HAPA",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =====================================================
   FALLBACK
===================================================== */

const FALLBACK_IMAGE =
  "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgQHmJO8e8twONhRhp3I6pP4NFDh-LPcqVtAmQ9R9XjOGaVMKShfSLmxeK0fVzJsybBBOXKbA8LIhjgTgko83C-UPVhwgXeLtvTfjtVv6aVGgQgniOF-gMC28bY78HryXZ-5OqCwdBpKGqjEfTta5jLjT1mpvtBi2DQKyu35rkxsZNoVvl0nhvxUUn1gDP0/s1600/Untitled%20design_20260717_144337_0000.jpg";


/* =====================================================
   COLLECTIONS
===================================================== */

const COLLECTIONS = {

  courses:
    "courses",

  scholarships:
    "scholarships",

  careers:
    "careers",

  resources:
    "resources",

  services:
    "services",

  businesses:
    "businesses",

  marketplace:
    "marketplace",

  products:
    "products",

  blog:
    "blogPosts",

  announcements:
    "announcements",

  creators:
    "creators",

  videos:
    "videos"

};


/* =====================================================
   URL PARSER
===================================================== */

const pathname =
  window.location.pathname;

const parts =
  pathname
    .split("/")
    .filter(Boolean);


/*
 * /share/courses/slug
 *
 * parts[0] = share
 * parts[1] = courses
 * parts[2] = slug
 */

const sector =
  parts[1] || "";

const requestedSlug =
  decodeURIComponent(
    parts.slice(2).join("/")
  );


/* =====================================================
   FIELD HELPER
===================================================== */

function getValue(data, fields) {

  for (const field of fields) {

    const value = data?.[field];

    if (
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ) {
      return String(value).trim();
    }

  }

  return "";
}


/* =====================================================
   TITLE
===================================================== */

function getTitle(data, id) {

  return getValue(data, [

    "title",
    "name",
    "courseTitle",
    "programName",
    "headline"

  ]) || id || "LetsStudy Pro";
}


/* =====================================================
   DESCRIPTION
===================================================== */

function getDescription(data) {

  return getValue(data, [

    "shortDescription",
    "description",
    "summary",
    "excerpt",
    "content"

  ]) ||

  "Discover learning, scholarships, careers, resources, services and opportunities on LetsStudy Pro.";
}


/* =====================================================
   IMAGE
===================================================== */

function getImage(data) {

  return getValue(data, [

    "imageUrl",
    "imageURL",
    "image",
    "thumbnail",
    "thumbnailUrl",
    "featuredImage",
    "coverImage",
    "photoUrl",
    "photoURL",
    "bannerImage",
    "logoUrl"

  ]) || FALLBACK_IMAGE;
}


/* =====================================================
   SLUG
===================================================== */

function getSlug(data, id) {

  return getValue(data, [

    "slug",
    "urlSlug",
    "seoSlug"

  ]) || id;
}


/* =====================================================
   UPDATE META
===================================================== */

function setMeta(property, content) {

  let tag =
    document.querySelector(
      `meta[property="${property}"]`
    );

  if (!tag) {

    tag =
      document.createElement("meta");

    tag.setAttribute(
      "property",
      property
    );

    document.head.appendChild(tag);
  }

  tag.setAttribute(
    "content",
    content
  );
}


function setNameMeta(name, content) {

  let tag =
    document.querySelector(
      `meta[name="${name}"]`
    );

  if (!tag) {

    tag =
      document.createElement("meta");

    tag.setAttribute(
      "name",
      name
    );

    document.head.appendChild(tag);
  }

  tag.setAttribute(
    "content",
    content
  );
}


/* =====================================================
   FIND ITEM
===================================================== */

async function findItem() {

  if (!sector || !requestedSlug) {

    throw new Error(
      "Invalid /share/ URL."
    );
  }


  const collectionName =
    COLLECTIONS[sector];


  if (!collectionName) {

    throw new Error(
      `Unknown sector: ${sector}`
    );
  }


  const snapshot =
    await getDocs(
      collection(
        db,
        collectionName
      )
    );


  let result = null;


  snapshot.forEach(doc => {

    if (result) return;


    const data =
      doc.data();

    const id =
      doc.id;

    const slug =
      getSlug(
        data,
        id
      );


    if (
      String(slug).toLowerCase() ===
      String(requestedSlug).toLowerCase()
    ) {

      result = {
        id,
        data
      };

    }


    if (
      id === requestedSlug
    ) {

      result = {
        id,
        data
      };

    }

  });


  return result;
}


/* =====================================================
   RENDER
===================================================== */

async function render() {

  const loading =
    document.getElementById(
      "loading"
    );


  try {

    const result =
      await findItem();


    if (!result) {

      loading.textContent =
        "Content not found.";

      document
        .getElementById(
          "previewImage"
        )
        .src =
        FALLBACK_IMAGE;

      return;
    }


    const {
      id,
      data
    } = result;


    const title =
      getTitle(
        data,
        id
      );


    const description =
      getDescription(
        data
      );


    const image =
      getImage(
        data
      );


    const slug =
      getSlug(
        data,
        id
      );


    const shareURL =
      `https://letsstudy.pro/share/${encodeURIComponent(sector)}/${encodeURIComponent(slug)}`;


    /* PAGE */

    document.title =
      `${title} | LetsStudy Pro`;


    document
      .getElementById(
        "previewTitle"
      )
      .textContent =
      title;


    document
      .getElementById(
        "previewDescription"
      )
      .textContent =
      description;


    document
      .getElementById(
        "previewImage"
      )
      .src =
      image;


    document
      .getElementById(
        "openContent"
      )
      .href =
      `https://letsstudy.pro/${sector}/${encodeURIComponent(slug)}`;


    loading.style.display =
      "none";


    /* SEO */

    setMeta(
      "og:title",
      title
    );

    setMeta(
      "og:description",
      description
    );

    setMeta(
      "og:image",
      image
    );

    setMeta(
      "og:url",
      shareURL
    );


    setNameMeta(
      "twitter:title",
      title
    );

    setNameMeta(
      "twitter:description",
      description
    );

    setNameMeta(
      "twitter:image",
      image
    );


    const descriptionTag =
      document.querySelector(
        'meta[name="description"]'
      );

    if (descriptionTag) {

      descriptionTag.content =
        description;

    }


    const canonical =
      document.querySelector(
        'link[rel="canonical"]'
      );


    if (canonical) {

      canonical.href =
        shareURL;

    }

  } catch (error) {

    console.error(
      "LetsStudy Pro dynamic preview:",
      error
    );

    loading.textContent =
      "Unable to load this content.";

  }

}


/* =====================================================
   START
===================================================== */

render();

</script>
