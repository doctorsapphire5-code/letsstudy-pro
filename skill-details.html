      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #0f172a;
      --text: #172033;
      --muted: #64748b;
      --border: #e2e8f0;
      --background: #f8fafc;
      --white: #ffffff;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 18px;
      --shadow: 0 12px 35px rgba(15, 23, 42, .08);
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ======================================
       HEADER
    ====================================== */

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav {
      max-width: 1200px;
      min-height: 72px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: var(--secondary);
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--primary);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-links a {
      color: var(--muted);
      font-size: .9rem;
      font-weight: 600;
      padding: 10px 13px;
      border-radius: 10px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--primary);
      background: #eff6ff;
    }

    .menu-btn {
      display: none;
      border: 0;
      background: transparent;
      color: var(--secondary);
      font-size: 1.3rem;
    }

    /* ======================================
       PAGE
    ====================================== */

    main {
      max-width: 1150px;
      margin: auto;
      padding: 35px 20px 80px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      font-weight: 700;
      font-size: .9rem;
      margin-bottom: 25px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* ======================================
       HERO
    ====================================== */

    .skill-hero {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 25px;
      align-items: center;
    }

    .skill-icon-large {
      width: 95px;
      height: 95px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: #eff6ff;
      color: var(--primary);
      font-size: 2.6rem;
    }

    .skill-category {
      color: var(--primary);
      font-size: .82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 5px;
    }

    .skill-hero h1 {
      color: var(--secondary);
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .skill-hero-description {
      color: var(--muted);
      max-width: 750px;
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 17px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: .75rem;
      font-weight: 800;
      background: #f1f5f9;
      color: var(--text);
    }

    .badge.level-beginner {
      background: #dcfce7;
      color: var(--success);
    }

    .badge.level-intermediate {
      background: #fef3c7;
      color: var(--warning);
    }

    .badge.level-advanced {
      background: #fee2e2;
      color: var(--danger);
    }

    /* ======================================
       GRID
    ====================================== */

    .content-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 2fr)
        minmax(280px, 1fr);
      gap: 20px;
      margin-top: 22px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, .04);
    }

    .card + .card {
      margin-top: 20px;
    }

    .card h2 {
      color: var(--secondary);
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .card p {
      color: var(--muted);
    }

    /* ======================================
       TOPICS
    ====================================== */

    .topics {
      list-style: none;
      display: grid;
      gap: 11px;
    }

    .topics li {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      padding: 11px;
      background: #f8fafc;
      border-radius: 10px;
      color: var(--text);
      font-size: .9rem;
    }

    .topics i {
      color: var(--success);
      margin-top: 4px;
    }

    /* ======================================
       BENEFITS
    ====================================== */

    .benefits {
      display: grid;
      gap: 12px;
    }

    .benefit {
      display: flex;
      gap: 13px;
      align-items: flex-start;
    }

    .benefit-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #eff6ff;
      color: var(--primary);
    }

    .benefit h3 {
      font-size: .92rem;
      margin-bottom: 2px;
    }

    .benefit p {
      font-size: .8rem;
    }

    /* ======================================
       SIDEBAR
    ====================================== */

    .stat {
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stat:last-child {
      border-bottom: 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: .84rem;
    }

    .stat-value {
      font-weight: 800;
      color: var(--secondary);
    }

    .progress {
      height: 8px;
      border-radius: 99px;
      background: #e2e8f0;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      width: 0;
      transition: width .5s ease;
    }

    /* ======================================
       ACTIONS
    ====================================== */

    .actions {
      display: grid;
      gap: 10px;
    }

    .btn {
      width: 100%;
      min-height: 45px;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 0 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      background: white;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ======================================
       RELATED SKILLS
    ====================================== */

    .related-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .related-card {
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 17px;
      background: white;
      transition: .2s ease;
    }

    .related-card:hover {
      border-color: #bfdbfe;
      transform: translateY(-2px);
    }

    .related-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: #eff6ff;
      color: var(--primary);
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .related-card h3 {
      font-size: .95rem;
      margin-bottom: 4px;
    }

    .related-card p {
      font-size: .76rem;
    }

    /* ======================================
       LOADING / ERROR
    ====================================== */

    .loading {
      text-align: center;
      padding: 100px 20px;
      color: var(--muted);
    }

    .loading i {
      font-size: 2rem;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .error-state {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      text-align: center;
      padding: 60px 20px;
    }

    .error-state i {
      font-size: 2.5rem;
      color: var(--danger);
      margin-bottom: 15px;
    }

    .error-state h2 {
      margin-bottom: 8px;
    }

    .error-state p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ======================================
       FOOTER
    ====================================== */

    footer {
      background: var(--secondary);
      color: #cbd5e1;
      text-align: center;
      padding: 28px 20px;
      font-size: .85rem;
    }

    /* ======================================
       RESPONSIVE
    ====================================== */

      .skill-hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      }

      .hero-badges {

      .content-grid {
        grid-template-columns: 1fr;
      }

      .related-grid {
        grid-template-columns:

      }

    }

    @media (max-width: 650px) {

        display: none;
        position: absolute;
        top: 72px;
        left: 0;
        right: 0;
        background: white;
        border-bottom: 1px solid var(--border);
        padding: 12px 20px 18px;
        flex-direction: column;
        align-items: stretch;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links a {
        width: 100%;
      }

      .menu-btn {
        display: block;
      }

      .skill-hero {
        padding: 25px 20px;
      }

      .related-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

/* ======================================
   ESCAPE HTML
====================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ======================================
   GET SKILL ID
====================================== */

function getSkillId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("id") ||
    params.get("skill") ||
    ""
  ).trim().toLowerCase();

}


/* ======================================
   FIND SKILL
====================================== */

function findSkill(id) {

  return skillsData.find(
    skill =>
      skill.id.toLowerCase() === id
  );

}


/* ======================================
   FORMAT LEVEL
====================================== */

function formatLevel(level) {

  if (!level) {
    return "Unknown";
  }

  return (
    level.charAt(0).toUpperCase() +
    level.slice(1)
  );

}


/* ======================================
   PROGRESS
====================================== */

function getProgress(level) {

  if (level === "beginner") {
    return 35;
  }

  if (level === "intermediate") {
    return 65;
  }

  if (level === "advanced") {
    return 90;
  }

  return 50;

}

/* ======================================
   RELATED SKILLS
====================================== */

function renderRelatedSkills(
  currentSkill
) {

  const container =
    document.getElementById(
      "relatedSkills"
    );

  if (!container) {
    return;
  }


  const related =
    skillsData
      .filter(
        skill =>
          skill.id !==
            currentSkill.id &&
          (
            skill.category ===
              currentSkill.category ||
            skill.level ===
              currentSkill.level
          )
      )
      .slice(0, 6);


  if (!related.length) {

    container.innerHTML = `

      <p>
        No related skills available.
      </p>

    `;

    return;
  }


  container.innerHTML =
    related
      .map(
        skill => `

          <a
            href="skill-details.html?id=${encodeURIComponent(
              skill.id
            )}"
            class="related-card"
          >

            <div class="related-icon">

              <i
                class="${escapeHTML(
                  skill.icon
                )}"
              ></i>

            </div>

            <h3>
              ${escapeHTML(
                skill.name
              )}
            </h3>

            <p>
              ${escapeHTML(
                skill.description
              )}
            </p>

          </a>

        `
      )
      .join("");

}


/* ======================================
   SAVE SKILL
====================================== */

function setupSaveButton(
  skill
) {

  const button =
    document.getElementById(
      "saveSkillBtn"
    );

  if (!button) {
    return;
  }


  const storageKey =
    "letsStudyProSavedSkills";


  function getSavedSkills() {

    try {

      const saved =
        localStorage.getItem(
          storageKey
        );

      if (!saved) {
        return [];
      }

      const parsed =
        JSON.parse(
          saved
        );

      return Array.isArray(parsed)
        ? parsed
        : [];

    } catch (error) {

      return [];

    }

  }


  function updateButton() {

    const saved =
      getSavedSkills();

    const isSaved =
      saved.includes(
        skill.id
      );


    button.innerHTML =
      isSaved
        ? `

          <i
            class="fa-solid fa-bookmark"
          ></i>

          Saved

        `
        : `

          <i
            class="fa-regular fa-bookmark"
          ></i>

          Save Skill

        `;

  }


  button.addEventListener(
    "click",
    function() {

      let saved =
        getSavedSkills();


      if (
        saved.includes(
          skill.id
        )
      ) {

        saved =
          saved.filter(
            id =>
              id !==
              skill.id
          );

      } else {

        saved.push(
          skill.id
        );

      }


      localStorage.setItem(
        storageKey,
        JSON.stringify(
          saved
        )
      );


      updateButton();

    }
  );


  updateButton();

}

/* ======================================
   MOBILE NAVIGATION
====================================== */

const menuButton =
  document.getElementById(
    "menuBtn"
  );

const navigation =
  document.getElementById(
    "navLinks"
  );


if (
  menuButton &&
  navigation
) {

  menuButton.addEventListener(
    "click",
    function() {

      navigation.classList.toggle(
        "open"
      );

      const isOpen =
        navigation.classList.contains(
          "open"
        );

      menuButton.setAttribute(
        "aria-expanded",
        isOpen
          ? "true"
          : "false"
      );

    }
  );


  navigation
    .querySelectorAll("a")
    .forEach(
      function(link) {

        link.addEventListener(
          "click",
          function() {

            navigation.classList.remove(
              "open"
            );

            menuButton.setAttribute(
              "aria-expanded",
              "false"
            );

          }
        );

      }
    );

}


/* ======================================
   INITIALIZE PAGE
====================================== */

function initializeSkillPage() {

  const skillId =
    getSkillId();


  const skill =
    findSkill(
      skillId
    );


  if (!skill) {

    renderNotFound();

    return;

  }


  renderSkill(
    skill
  );

}


/* ======================================
   START APPLICATION
====================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    initializeSkillPage();

  }
);
