<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial, sans-serif;
    background:#eef2f7;
}

.slide-wrapper{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.slide{
    position:relative;
    width:min(1200px, 90vw);
    aspect-ratio:16 / 9;
    background:#fff;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(15,23,42,.18);
}

.slide-content{
    position:absolute;
    inset:0;
    padding:8%;
}

.slide-title{
    margin:0;
    font-size:clamp(32px,5vw,72px);
    font-weight:800;
    line-height:1.05;
}

.slide-subtitle{
    margin-top:22px;
    max-width:70%;
    font-size:clamp(16px,2vw,28px);
    line-height:1.5;
    color:#64748b;
}

.slide-number{
    position:absolute;
    right:5%;
    bottom:4%;
    color:#94a3b8;
    font-size:14px;
}

.slide-brand{
    position:absolute;
    left:5%;
    bottom:4%;
    color:#94a3b8;
    font-size:12px;
}
</style>
</head>

<body>

<div class="slide-wrapper">

    <section
        id="slide"
        class="slide">

        <div class="slide-content">

            <h1
                id="slideTitle"
                class="slide-title">
                Presentation Title
            </h1>

            <p
                id="slideSubtitle"
                class="slide-subtitle">
                Add your presentation subtitle here.
            </p>

        </div>

        <div class="slide-brand">
            Presentation
        </div>

        <div
            id="slideNumber"
            class="slide-number">
            1
        </div>

    </section>

</div>


<script>

const slideData = {

    title:
        "Presentation Title",

    subtitle:
        "Add your presentation subtitle here.",

    background:
        "#ffffff",

    number:
        1

};


function renderSlide(){

    const slide =
        document.getElementById(
            "slide"
        );

    const title =
        document.getElementById(
            "slideTitle"
        );

    const subtitle =
        document.getElementById(
            "slideSubtitle"
        );

    const number =
        document.getElementById(
            "slideNumber"
        );


    slide.style.background =
        slideData.background;

    title.textContent =
        slideData.title;

    subtitle.textContent =
        slideData.subtitle;

    number.textContent =
        slideData.number;

}


renderSlide();

</script>

</body>
</html>
