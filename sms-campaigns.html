<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMS Campaigns | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#2563eb;color:#fff;padding:16px 20px;font-size:20px;font-weight:800}
.container{max-width:1100px;margin:auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 10px #00000012}
.stat b{display:block;font-size:25px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
input,textarea,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;margin:7px 0 13px;font:inherit}
textarea{min-height:130px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
button:hover{opacity:.9}
.danger{background:#dc2626}
.success{background:#16a34a}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.preview{background:#f1f5f9;border-radius:10px;padding:15px;white-space:pre-wrap;min-height:130px}
.campaign{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid #eee}
.campaign:last-child{border:0}
.badge{display:inline-block;margin-top:5px;padding:4px 9px;border-radius:20px;background:#dbeafe;color:#1d4ed8;font-size:12px}
small{color:#6b7280}
@media(max-width:700px){
.stats{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr}
.campaign{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>

<header>📩 LetsStudy Pro — SMS Campaigns</header>

<div class="container">

<!-- STATS -->

<div class="stats">

<div class="card stat">
Total
<b id="total">0</b>
</div>

<div class="card stat">
Drafts
<b id="drafts">0</b>
</div>

<div class="card stat">
Scheduled
<b id="scheduled">0</b>
</div>

<div class="card stat">
Sent
<b id="sent">0</b>
</div>

</div>


<div class="grid">

<!-- CREATE CAMPAIGN -->

<div class="card">

<h2>Create SMS Campaign</h2>

<input id="campaignId" type="hidden">

<label>Campaign Name</label>

<input
id="name"
placeholder="New Course SMS"
>

<label>Audience</label>

<select id="audience">

<option value="all">
All Users
</option>

<option value="students">
Students
</option>

<option value="premium">
Premium Users
</option>

<option value="leads">
Leads
</option>

</select>


<label>Phone Number</label>

<input
id="phone"
placeholder="255712345678"
>


<label>SMS Message</label>

<textarea
id="message"
maxlength="1600"
placeholder="Hello {{name}}, check out our new course..."
></textarea>

<small>
<span id="charCount">0</span>
characters
</small>


<label>Schedule</label>

<input
id="schedule"
type="datetime-local"
>


<div class="actions">

<button onclick="saveCampaign()">
Save
</button>

<button
class="success"
onclick="previewMessage()"
>
Preview
</button>

<button
class="danger"
onclick="clearForm()"
>
Clear
</button>

</div>

</div>


<!-- PREVIEW -->

<div class="card">

<h2>SMS Preview</h2>

<div
id="preview"
class="preview"
>
Your SMS preview will appear here.
</div>

<br>

<button
onclick="sendCurrentSMS()"
>
📩 Send SMS
</button>

</div>

</div>


<!-- CAMPAIGNS -->

<div class="card" style="margin-top:18px">

<h2>Campaigns</h2>

<input
id="search"
placeholder="Search campaigns..."
oninput="renderCampaigns()"
>

<div id="campaignList">
Loading campaigns...
</div>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
doc,
updateDoc,
deleteDoc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const campaignsRef =
collection(
db,
"smsCampaigns"
);


let campaigns = [];


/* =====================================================
   CHARACTER COUNTER
===================================================== */

document
.getElementById("message")
.addEventListener(
"input",
function(){

document
.getElementById("charCount")
.textContent =
this.value.length;

previewMessage();

}
);


/* =====================================================
   SAVE CAMPAIGN
===================================================== */

window.saveCampaign =
async function(){

const name =
document
.getElementById("name")
.value.trim();

const audience =
document
.getElementById("audience")
.value;

const phone =
document
.getElementById("phone")
.value.trim();

const message =
document
.getElementById("message")
.value.trim();

const schedule =
document
.getElementById("schedule")
.value;


if(!name){

alert("Enter campaign name.");

return;

}


if(!message){

alert("Enter SMS message.");

return;

}


const data = {

name:name,

audience:audience,

phone:phone,

message:message,

schedule:
schedule || null,

status:
schedule
? "scheduled"
: "draft",

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

};


try{

const id =
document
.getElementById("campaignId")
.value;


if(id){

await updateDoc(
doc(
db,
"smsCampaigns",
id
),
{
...data,
updatedAt:
serverTimestamp()
}
);

alert(
"Campaign updated."
);

}else{

await addDoc(
campaignsRef,
data
);

alert(
"Campaign created."
);

}


clearForm();

await loadCampaigns();


}catch(error){

console.error(error);

alert(
"Unable to save campaign."
);

}

};


/* =====================================================
   LOAD CAMPAIGNS
===================================================== */

async function loadCampaigns(){

try{

const snapshot =
await getDocs(
campaignsRef
);

campaigns = [];

snapshot.forEach(
item => {

campaigns.push({

id:item.id,

...item.data()

});

});

renderCampaigns();

}catch(error){

console.error(error);

document
.getElementById("campaignList")
.textContent =
"Unable to load campaigns.";

}

}


/* =====================================================
   RENDER
===================================================== */

window.renderCampaigns =
function(){

const query =
document
.getElementById("search")
.value
.toLowerCase();


const list =
document
.getElementById("campaignList");


const filtered =
campaigns.filter(
campaign =>
(campaign.name || "")
.toLowerCase()
.includes(query)
);


list.innerHTML = "";


if(!filtered.length){

list.innerHTML =
"<p>No campaigns found.</p>";

updateStats();

return;

}


filtered.forEach(
campaign => {

const row =
document.createElement("div");

row.className =
"campaign";


row.innerHTML = `

<div>

<strong>
${escapeHtml(
campaign.name || "Untitled"
)}
</strong>

<br>

<small>
Audience:
${escapeHtml(
campaign.audience || "all"
)}
</small>

<br>

<span class="badge">
${escapeHtml(
campaign.status || "draft"
)}
</span>

</div>


<div class="actions">

<button
onclick="editCampaign('${campaign.id}')"
>
Edit
</button>

<button
class="success"
onclick="sendCampaign('${campaign.id}')"
>
Send
</button>

<button
class="danger"
onclick="deleteCampaign('${campaign.id}')"
>
Delete
</button>

</div>

`;


list.appendChild(row);

});

updateStats();

};


/* =====================================================
   STATISTICS
===================================================== */

function updateStats(){

document
.getElementById("total")
.textContent =
campaigns.length;


document
.getElementById("drafts")
.textContent =
campaigns.filter(
x => x.status === "draft"
).length;


document
.getElementById("scheduled")
.textContent =
campaigns.filter(
x => x.status === "scheduled"
).length;


document
.getElementById("sent")
.textContent =
campaigns.filter(
x => x.status === "sent"
).length;

}


/* =====================================================
   EDIT
===================================================== */

window.editCampaign =
function(id){

const campaign =
campaigns.find(
x => x.id === id
);

if(!campaign)return;


document
.getElementById("campaignId")
.value =
campaign.id;


document
.getElementById("name")
.value =
campaign.name || "";


document
.getElementById("audience")
.value =
campaign.audience || "all";


document
.getElementById("phone")
.value =
campaign.phone || "";


document
.getElementById("message")
.value =
campaign.message || "";


document
.getElementById("schedule")
.value =
campaign.schedule || "";


document
.getElementById("charCount")
.textContent =
(campaign.message || "").length;


previewMessage();

};


/* =====================================================
   DELETE
===================================================== */

window.deleteCampaign =
async function(id){

if(
!confirm(
"Delete this SMS campaign?"
)
)return;


try{

await deleteDoc(
doc(
db,
"smsCampaigns",
id
)
);

await loadCampaigns();

}catch(error){

console.error(error);

alert(
"Unable to delete campaign."
);

}

};


/* =====================================================
   PREVIEW
===================================================== */

window.previewMessage =
function(){

let message =
document
.getElementById("message")
.value;


message =
message.replaceAll(
"{{name}}",
"Student"
);


message =
message.replaceAll(
"{{course}}",
"Complete Web Development Course"
);


document
.getElementById("preview")
.textContent =
message ||
"Your SMS preview will appear here.";

};


/* =====================================================
   SEND CURRENT SMS
===================================================== */

window.sendCurrentSMS =
function(){

const phone =
document
.getElementById("phone")
.value
.trim();

let message =
document
.getElementById("message")
.value
.trim();


if(!phone){

alert(
"Enter a phone number."
);

return;

}


if(!message){

alert(
"Enter SMS message."
);

return;

}


message =
message.replaceAll(
"{{name}}",
"Student"
);


sendSMS(
phone,
message
);

};


/* =====================================================
   SEND CAMPAIGN
===================================================== */

window.sendCampaign =
async function(id){

const campaign =
campaigns.find(
x => x.id === id
);

if(!campaign)return;


if(!campaign.phone){

alert(
"This campaign has no phone number."
);

return;

}


let message =
campaign.message || "";


message =
message.replaceAll(
"{{name}}",
"Student"
);


await sendSMS(
campaign.phone,
message
);


try{

await updateDoc(
doc(
db,
"smsCampaigns",
id
),
{
status:"sent",
updatedAt:
serverTimestamp()
}
);

await loadCampaigns();

}catch(error){

console.error(error);

}

};


/* =====================================================
   SMS SENDER
=====================================================

IMPORTANT:
Browser cannot securely send SMS directly.

Replace this endpoint with your
Firebase Cloud Function / SMS provider endpoint.

Example:

/api/send-sms

*/

async function sendSMS(
phone,
message
){

try{

/*
const response =
await fetch(
"https://YOUR-SMS-ENDPOINT",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
phone,
message
})
}
);

if(!response.ok)
throw new Error("SMS failed.");

alert("SMS sent successfully.");
*/


/*
   DEMO MODE
*/

console.log(
"SMS:",
{
phone,
message
}
);


alert(
"SMS prepared successfully.\n\n" +
"Connect your SMS gateway endpoint to enable real sending."
);


}catch(error){

console.error(error);

alert(
"SMS sending failed."
);

}

}


/* =====================================================
   CLEAR FORM
===================================================== */

window.clearForm =
function(){

document
.getElementById("campaignId")
.value = "";


document
.getElementById("name")
.value = "";


document
.getElementById("audience")
.value =
"all";


document
.getElementById("phone")
.value = "";


document
.getElementById("message")
.value = "";


document
.getElementById("schedule")
.value = "";


document
.getElementById("charCount")
.textContent =
"0";


document
.getElementById("preview")
.textContent =
"Your SMS preview will appear here.";

};


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replaceAll(
"&",
"&amp;"
)
.replaceAll(
"<",
"&lt;"
)
.replaceAll(
">",
"&gt;"
)
.replaceAll(
'"',
"&quot;"
)
.replaceAll(
"'",
"&#039;"
);

}


/* =====================================================
   START
===================================================== */

loadCampaigns();

</script>

</body>
</html>
