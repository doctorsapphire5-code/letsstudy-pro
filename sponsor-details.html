<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Sponsor | LetsStudy Pro</title>

<meta name="description" content="Sponsor details on LetsStudy Pro.">
<meta name="theme-color" content="#2563eb">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f6f8fc;
  color:#172033;
  line-height:1.6;
}

.header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  text-decoration:none;
  color:#111827;
  font-size:21px;
  font-weight:800;
}

.back{
  text-decoration:none;
  color:#2563eb;
  font-weight:700;
  font-size:14px;
}

.container{
  max-width:1050px;
  margin:35px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(15,23,42,.06);
}

.hero{
  padding:35px;
  display:flex;
  gap:28px;
  align-items:center;
  border-bottom:1px solid #edf0f4;
}

.logo-box{
  width:145px;
  height:145px;
  min-width:145px;
  border-radius:18px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.logo-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.placeholder{
  font-size:48px;
}

.badge{
  display:inline-block;
  background:#eff6ff;
  color:#2563eb;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  margin-bottom:9px;
}

h1{
  font-size:32px;
  line-height:1.2;
  margin-bottom:9px;
}

.tagline{
  color:#64748b;
  font-size:15px;
}

.content{
  padding:30px 35px;
}

.section{
  margin-bottom:30px;
}

.section:last-child{
  margin-bottom:0;
}

.section h2{
  font-size:20px;
  margin-bottom:10px;
}

.description{
  color:#475569;
  white-space:pre-line;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.info{
  padding:17px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
}

.info-label{
  font-size:11px;
  color:#64748b;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:4px;
}

.info-value{
  font-weight:700;
  color:#172033;
  word-break:break-word;
}

.links{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.link{
  display:inline-block;
  padding:10px 15px;
  border-radius:9px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}

.link.secondary{
  background:#eef2ff;
  color:#3730a3;
}

.loading{
  min-height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

.error{
  padding:40px;
  text-align:center;
}

.error h2{
  margin-bottom:8px;
}

.error p{
  color:#64748b;
}

.footer{
  text-align:center;
  padding:30px 15px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){

  .header{
    padding:0 15px;
  }

  .hero{
    padding:24px;
    flex-direction:column;
    align-items:flex-start;
  }

  .logo-box{
    width:115px;
    height:115px;
    min-width:115px;
  }

  h1{
    font-size:26px;
  }

  .content{
    padding:24px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    LetsStudy Pro
  </a>

  <a href="search.html" class="back">
    ← Back to Search
  </a>

</header>


<main class="container">

  <div class="card" id="sponsorCard">

    <div class="loading">
      Loading sponsor...
    </div>

  </div>

</main>


<footer class="footer">
  © LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const card =
  document.getElementById("sponsorCard");


const params =
  new URLSearchParams(window.location.search);

const sponsorId =
  params.get("id");


function first(data, fields){

  for(const field of fields){

    if(
      data[field] !== undefined &&
      data[field] !== null &&
      String(data[field]).trim() !== ""
    ){

      return String(data[field]);

    }

  }

  return "";

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeURL(value){

  if(!value) return "";

  try{

    const url =
      new URL(value,window.location.href);

    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return url.href;

    }

  }catch(e){}

  return "";

}


function renderSponsor(data,id){

  const name =
    first(data,[
      "name",
      "title",
      "sponsorName",
      "company",
      "organization"
    ]) || "Sponsor";


  const description =
    first(data,[
      "description",
      "about",
      "details",
      "bio",
      "content"
    ]) ||
    "Thank you for supporting the LetsStudy Pro ecosystem.";


  const tagline =
    first(data,[
      "tagline",
      "subtitle",
      "shortDescription"
    ]);


  const image =
    first(data,[
      "image",
      "imageUrl",
      "logo",
      "logoUrl",
      "photo",
      "thumbnail"
    ]);


  const website =
    safeURL(
      first(data,[
        "website",
        "websiteUrl",
        "url",
        "link"
      ])
    );


  const email =
    first(data,[
      "email",
      "contactEmail"
    ]);


  const phone =
    first(data,[
      "phone",
      "phoneNumber",
      "contact"
    ]);


  const category =
    first(data,[
      "category",
      "type",
      "industry"
    ]);


  const location =
    first(data,[
      "location",
      "country",
      "address"
    ]);


  const imageHTML = image
    ? `<img src="${escapeHTML(image)}"
             alt="${escapeHTML(name)}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
       <div class="placeholder" style="display:none;">🤝</div>`
    : `<div class="placeholder">🤝</div>`;


  let infoHTML = "";


  if(category){

    infoHTML += `
      <div class="info">
        <div class="info-label">Category</div>
        <div class="info-value">
          ${escapeHTML(category)}
        </div>
      </div>
    `;

  }


  if(location){

    infoHTML += `
      <div class="info">
        <div class="info-label">Location</div>
        <div class="info-value">
          ${escapeHTML(location)}
        </div>
      </div>
    `;

  }


  if(email){

    infoHTML += `
      <div class="info">
        <div class="info-label">Email</div>
        <div class="info-value">
          ${escapeHTML(email)}
        </div>
      </div>
    `;

  }


  if(phone){

    infoHTML += `
      <div class="info">
        <div class="info-label">Contact</div>
        <div class="info-value">
          ${escapeHTML(phone)}
        </div>
      </div>
    `;

  }


  let linksHTML = "";


  if(website){

    linksHTML += `
      <a
        class="link"
        href="${escapeHTML(website)}"
        target="_blank"
        rel="noopener noreferrer">
        Visit Website →
      </a>
    `;

  }


  if(email){

    linksHTML += `
      <a
        class="link secondary"
        href="mailto:${escapeHTML(email)}">
        Contact Sponsor
      </a>
    `;

  }


  if(phone){

    linksHTML += `
      <a
        class="link secondary"
        href="tel:${escapeHTML(phone)}">
        Call
      </a>
    `;

  }


  card.innerHTML = `

    <section class="hero">

      <div class="logo-box">
        ${imageHTML}
      </div>

      <div>

        <div class="badge">
          VERIFIED SPONSOR
        </div>

        <h1>
          ${escapeHTML(name)}
        </h1>

        ${
          tagline
          ? `<div class="tagline">
               ${escapeHTML(tagline)}
             </div>`
          : ""
        }

      </div>

    </section>


    <section class="content">

      <div class="section">

        <h2>
          About this Sponsor
        </h2>

        <div class="description">
          ${escapeHTML(description)}
        </div>

      </div>


      ${
        infoHTML
        ? `
          <div class="section">

            <h2>
              Sponsor Information
            </h2>

            <div class="info-grid">
              ${infoHTML}
            </div>

          </div>
        `
        : ""
      }


      ${
        linksHTML
        ? `
          <div class="section">

            <h2>
              Connect
            </h2>

            <div class="links">
              ${linksHTML}
            </div>

          </div>
        `
        : ""
      }

    </section>

  `;


  document.title =
    name + " | LetsStudy Pro";

}


async function loadSponsor(){

  if(!sponsorId){

    card.innerHTML = `

      <div class="error">

        <h2>
          Sponsor not found
        </h2>

        <p>
          No sponsor ID was provided.
        </p>

      </div>

    `;

    return;

  }


  try{

    const ref =
      doc(db,"sponsors",sponsorId);

    const snapshot =
      await getDoc(ref);


    if(!snapshot.exists()){

      card.innerHTML = `

        <div class="error">

          <h2>
            Sponsor not found
          </h2>

          <p>
            The requested sponsor could not be found.
          </p>

        </div>

      `;

      return;

    }


    renderSponsor(
      snapshot.data(),
      snapshot.id
    );


  }catch(error){

    console.error(
      "Sponsor loading error:",
      error
    );


    card.innerHTML = `

      <div class="error">

        <h2>
          Unable to load sponsor
        </h2>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


loadSponsor();

</script>

</body>
</html>
