<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Subscriptions | LetsStudy Pro</title>

<meta name="description"
content="Choose a LetsStudy Pro subscription plan and unlock premium learning features.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f6f8fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif
}

a{
 text-decoration:none;
 color:inherit
}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 6%;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:800
}

.nav{
 display:flex;
 gap:18px;
 font-size:13px;
 font-weight:700
}

.nav a:hover{
 color:#155eef
}

.hero{
 background:linear-gradient(135deg,#155eef,#073bba);
 color:#fff;
 padding:55px 20px;
 text-align:center
}

.hero h1{
 margin:0 0 10px;
 font-size:36px
}

.hero p{
 max-width:650px;
 margin:auto;
 color:#dbe7ff;
 line-height:1.7;
 font-size:14px
}

.container{
 max-width:1100px;
 margin:35px auto;
 padding:0 20px
}

.billing{
 display:flex;
 justify-content:center;
 gap:8px;
 margin-bottom:25px
}

.billing button{
 border:1px solid #d0d5dd;
 background:#fff;
 padding:10px 16px;
 border-radius:9px;
 cursor:pointer;
 font-weight:700;
 font-size:12px
}

.billing button.active{
 background:#155eef;
 color:#fff;
 border-color:#155eef
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:16px
}

.card{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:16px;
 padding:24px;
 position:relative;
 display:flex;
 flex-direction:column;
 min-height:430px
}

.card.popular{
 border:2px solid #155eef
}

.popular-badge{
 position:absolute;
 top:-11px;
 left:50%;
 transform:translateX(-50%);
 background:#155eef;
 color:#fff;
 padding:5px 12px;
 border-radius:20px;
 font-size:10px;
 font-weight:800
}

.icon{
 width:45px;
 height:45px;
 border-radius:12px;
 background:#eef4ff;
 color:#155eef;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:19px;
 margin-bottom:15px
}

.card h2{
 margin:0 0 7px;
 font-size:20px
}

.description{
 color:#667085;
 font-size:12px;
 line-height:1.6;
 min-height:42px
}

.price{
 margin:18px 0;
 font-size:27px;
 font-weight:900
}

.price small{
 color:#667085;
 font-size:11px;
 font-weight:500
}

.features{
 list-style:none;
 padding:0;
 margin:0 0 20px;
 flex:1
}

.features li{
 display:flex;
 gap:8px;
 align-items:flex-start;
 margin:10px 0;
 font-size:12px;
 color:#475467
}

.features i{
 color:#12b76a;
 margin-top:2px
}

.choose{
 display:block;
 text-align:center;
 background:#155eef;
 color:#fff;
 padding:12px;
 border-radius:9px;
 font-size:12px;
 font-weight:800
}

.choose:hover{
 background:#073bba
}

.free{
 background:#f2f4f7;
 color:#172033
}

.loading,
.empty{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:15px;
 padding:55px;
 text-align:center;
 color:#667085;
 grid-column:1/-1
}

@media(max-width:900px){
 .grid{
  grid-template-columns:repeat(2,1fr)
 }
}

@media(max-width:550px){

 .nav{
  display:none
 }

 .hero h1{
  font-size:28px
 }

 .container{
  padding:0 15px
 }

 .grid{
  grid-template-columns:1fr
 }

}
</style>
</head>

<body>

<header class="top">

<a href="index.html" class="logo">
LetsStudy Pro
</a>

<nav class="nav">

<a href="course.html">Courses</a>
<a href="marketplace.html">Marketplace</a>
<a href="careers.html">Careers</a>
<a href="premium.html">Premium</a>

</nav>

</header>


<section class="hero">

<h1>
Choose Your Subscription
</h1>

<p>
Unlock more learning opportunities, premium content,
courses, certificates and exclusive LetsStudy Pro features.
</p>

</section>


<main class="container">

<div class="billing">

<button
id="monthly"
class="active">
Monthly
</button>

<button
id="yearly">
Yearly
</button>

</div>


<div
id="plans"
class="grid">

<div class="loading">

<i class="fa fa-spinner fa-spin"></i>

<p>
Loading subscription plans...
</p>

</div>

</div>

</main>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
 FIREBASE
========================= */

const firebaseConfig={

 apiKey:
 "AIzaSyBcOYDfAVKXbkljsYrgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 databaseURL:
 "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

 measurementId:
 "G-85B7V5H5J0"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =========================
 ELEMENTS
========================= */

const plansEl=
document.getElementById("plans");

const monthlyBtn=
document.getElementById("monthly");

const yearlyBtn=
document.getElementById("yearly");


let plans=[];

let billingCycle="monthly";


/* =========================
 ESCAPE
========================= */

function esc(value=""){

 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* =========================
 LOAD PLANS
========================= */

async function loadPlans(){

 try{

  const snap=
  await getDocs(
   collection(
    db,
    "subscriptionPlans"
   )
  );


  plans=[];


  snap.forEach(item=>{

   plans.push({

    id:item.id,
    ...item.data()

   });

  });


  plans=
  plans.filter(
   p=>
   p.status==="active"
   ||
   !p.status
  );


  render();


 }catch(error){

  console.error(error);

  plansEl.innerHTML=`

   <div class="empty">

    <i class="fa fa-triangle-exclamation"></i>

    <h3>
    Unable to load plans
    </h3>

    <p>
    Please try again later.
    </p>

   </div>

  `;

 }

}


/* =========================
 RENDER
========================= */

function render(){

 if(!plans.length){

  plansEl.innerHTML=`

   <div class="empty">

    <i class="fa fa-box-open"></i>

    <h3>
    No subscription plans available
    </h3>

   </div>

  `;

  return;

 }


 plansEl.innerHTML=
 plans.map(plan=>{

  const price=
  billingCycle==="yearly"
  ?(
    plan.yearlyPrice ??
    plan.priceYearly ??
    plan.price ??
    0
   )
  :(
    plan.monthlyPrice ??
    plan.priceMonthly ??
    plan.price ??
    0
   );


  const features=
  Array.isArray(plan.features)
  ?plan.features
  :[];


  const popular=
  plan.popular===true;


  return`

   <article
   class="card ${popular?"popular":""}">

   ${
    popular
    ?`
    <div class="popular-badge">
     MOST POPULAR
    </div>
    `
    :""
   }


   <div class="icon">

    <i class="fa ${
     plan.icon||
     "fa-crown"
    }"></i>

   </div>


   <h2>
    ${esc(
     plan.name||
     plan.title||
     "Subscription"
    )}
   </h2>


   <div class="description">

    ${esc(
     plan.description||
     "Access LetsStudy Pro features."
    )}

   </div>


   <div class="price">

    ${esc(
     plan.currency||
     "TZS"
    )}

    ${Number(price).toLocaleString()}

    <small>
     / ${billingCycle}
    </small>

   </div>


   <ul class="features">

    ${
     features.length
     ?
     features.map(feature=>`

      <li>

       <i class="fa fa-circle-check"></i>

       <span>
        ${esc(feature)}
       </span>

      </li>

     `).join("")
     :
     `
     <li>
      <i class="fa fa-circle-check"></i>
      <span>Access selected LetsStudy Pro features</span>
     </li>
     `
    }

   </ul>


   <a
   class="choose"
   href="subscription-checkout.html?planId=${encodeURIComponent(plan.id)}&billingCycle=${encodeURIComponent(billingCycle)}">

    ${
     Number(price)<=0
     ?"Get Started"
     :"Choose Plan"
    }

    <i class="fa fa-arrow-right"></i>

   </a>


   </article>

  `;

 }).join("");

}


/* =========================
 BILLING
========================= */

monthlyBtn.addEventListener(
"click",
()=>{

 billingCycle="monthly";

 monthlyBtn.classList.add("active");

 yearlyBtn.classList.remove("active");

 render();

}
);


yearlyBtn.addEventListener(
"click",
()=>{

 billingCycle="yearly";

 yearlyBtn.classList.add("active");

 monthlyBtn.classList.remove("active");

 render();

}
);


/* =========================
 START
========================= */

loadPlans();

</script>

</body>
</html>
