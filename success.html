<!DOCTYPE html>
<html lang="en">
<head>

<script async

  crossorigin="anonymous"></script>


  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Payment Successful | LetsStudy Pro</title>

  <meta
    name="description"
    content="Payment successful. Thank you for using LetsStudy Pro."
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <style>
    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:#f5f7fb;
      color:#172033;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .page{
      width:100%;
      max-width:620px;
    }

    .card{
      background:#fff;
      border:1px solid #e6eaf0;
      border-radius:24px;
      padding:42px 28px;
      text-align:center;
      box-shadow:
        0 18px 55px rgba(20,32,55,.08);
    }

    .success-icon{
      width:86px;
      height:86px;
      margin:0 auto 24px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#e9f9ef;
      border:1px solid #c9efd7;
    }

    .success-icon svg{
      width:46px;
      height:46px;
      stroke:#18a957;
      stroke-width:2.8;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    h1{
      margin:0 0 10px;
      font-size:32px;
      line-height:1.2;
      color:#111827;
    }

    .subtitle{
      margin:0 auto;
      max-width:480px;
      color:#667085;
      font-size:16px;
      line-height:1.6;
    }

    .details{
      margin-top:30px;
      border:1px solid #e8ebf0;
      border-radius:16px;
      overflow:hidden;
      text-align:left;
      background:#fafbfc;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:15px 17px;
      border-bottom:1px solid #e8ebf0;
    }

    .row:last-child{
      border-bottom:0;
    }

    .label{
      color:#667085;
      font-size:14px;
    }

    .value{
      color:#172033;
      font-size:14px;
      font-weight:600;
      text-align:right;
      word-break:break-word;
    }

    .status{
      color:#159447;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
      margin-top:30px;
    }

    .btn{
      min-width:170px;
      border:0;
      border-radius:12px;
      padding:14px 20px;
      font-size:15px;
      font-weight:700;
      text-decoration:none;
      cursor:pointer;
      transition:.2s ease;
    }

    .btn-primary{
      background:#111827;
      color:#fff;
    }

    .btn-secondary{
      background:#eef1f5;
      color:#172033;
    }

    .btn:hover{
      transform:translateY(-1px);
      opacity:.94;
    }

    .note{
      margin-top:24px;
      font-size:13px;
      line-height:1.6;
      color:#7a8495;
    }

    .loading{
      display:none;
      margin-top:20px;
      color:#667085;
      font-size:14px;
    }

    .spinner{
      display:inline-block;
      width:16px;
      height:16px;
      margin-right:7px;
      vertical-align:-3px;
      border:2px solid #d7dce4;
      border-top-color:#172033;
      border-radius:50%;
      animation:spin .7s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    @media(max-width:520px){
      body{
        padding:14px;
      }

      .card{
        padding:34px 18px;
        border-radius:20px;
      }

      h1{
        font-size:27px;
      }

      .row{
        flex-direction:column;
        gap:5px;
      }

      .value{
        text-align:left;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="success-icon" aria-label="Payment successful">
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <circle cx="26" cy="26" r="20"></circle>
          <path d="M16 27.5l6.5 6.5L37 19.5"></path>
        </svg>
      </div>

      <h1>Payment Successful</h1>

      <p class="subtitle">
        Your payment has been received successfully.
        Thank you for choosing LetsStudy Pro.
      </p>

      <div class="details">

        <div class="row">
          <span class="label">Status</span>
          <span
            class="value status"
            id="paymentStatus"
          >
            Completed
          </span>
        </div>

        <div class="row">
          <span class="label">Product</span>
          <span
            class="value"
            id="productType"
          >
            —
          </span>
        </div>

        <div class="row">
          <span class="label">Order ID</span>
          <span
            class="value"
            id="orderId"
          >
            —
          </span>
        </div>

        <div class="row">
          <span class="label">Reference</span>
          <span
            class="value"
            id="merchantReference"
          >
            —
          </span>
        </div>

        <div class="row">
          <span class="label">Transaction ID</span>
          <span
            class="value"
            id="orderTrackingId"
          >
            —
          </span>
        </div>

        <div class="row">
          <span class="label">Amount</span>
          <span
            class="value"
            id="amount"
          >
            —
          </span>
        </div>

      </div>

      <div
        class="loading"
        id="loading"
      >
        <span class="spinner"></span>
        Confirming payment...
      </div>

      <div class="actions">

        <a
          href="index-auth.html"
          class="btn btn-primary"
        >
          Continue to LetsStudy Pro
        </a>

        <button
          type="button"
          class="btn btn-secondary"
          id="homeButton"
        >
          Go Home
        </button>

      </div>

      <p class="note">
        Please keep your order ID or transaction reference
        for your records.
      </p>

    </section>

  </main>

  <script>
    "use strict";

    const params =
      new URLSearchParams(window.location.search);

    function firstParam(...names){

      for(const name of names){

        const value =
          params.get(name);

        if(
          value !== null &&
          String(value).trim() !== ""
        ){
          return String(value).trim();
        }
      }

      return "";
    }

    function decodeValue(value){

      if(!value){
        return "";
      }

      try{
        return decodeURIComponent(value);
      }catch{
        return value;
      }
    }

    function formatProductType(type){

      if(!type){
        return "Payment";
      }

      const cleaned =
        String(type)
          .replace(/[_-]+/g," ")
          .trim();

      if(!cleaned){
        return "Payment";
      }

      return cleaned
        .split(/\s+/)
        .map(word =>
          word.charAt(0).toUpperCase() +
          word.slice(1).toLowerCase()
        )
        .join(" ");
    }

    function formatAmount(amount,currency){

      if(
        amount === null ||
        amount === undefined ||
        amount === ""
      ){
        return "—";
      }

      const numeric =
        Number(
          String(amount)
            .replace(/,/g,"")
        );

      if(!Number.isFinite(numeric)){
        return `${amount}${currency ? " " + currency : ""}`;
      }

      const code =
        currency || "TZS";

      try{

        return new Intl.NumberFormat(
          "en-TZ",
          {
            minimumFractionDigits:0,
            maximumFractionDigits:2
          }
        ).format(numeric) +
        " " +
        code;

      }catch{

        return numeric.toLocaleString() +
          " " +
          code;
      }
    }

    function setText(id,value){

      const element =
        document.getElementById(id);

      if(!element){
        return;
      }

      element.textContent =
        value || "—";
    }

    function cleanStorage(){

      const keys = [

        "paymentPending",
        "checkoutType",
        "checkoutId",
        "checkoutAmount",
        "checkoutCurrency",
        "pesapalOrderTrackingId",

        "pendingResourceOrder",
        "pendingVideoOrder",
        "pendingCourseOrder",
        "pendingCommunityOrder",
        "pendingFreelanceOrder",

        "marketplacePayment",
        "premiumPayment",

        "paymentOrder",
        "pendingPayment"

      ];

      keys.forEach(key => {

        try{
          localStorage.removeItem(key);
        }catch{}

        try{
          sessionStorage.removeItem(key);
        }catch{}

      });
    }

    const orderId =
      decodeValue(
        firstParam(
          "orderId",
          "OrderId",
          "order_id"
        )
      );

    const orderTrackingId =
      decodeValue(
        firstParam(
          "orderTrackingId",
          "OrderTrackingId",
          "order_tracking_id"
        )
      );

    const merchantReference =
      decodeValue(
        firstParam(
          "merchantReference",
          "MerchantReference",
          "merchant_reference"
        )
      );

    const productType =
      decodeValue(
        firstParam(
          "productType",
          "type",
          "product"
        )
      );

    const amount =
      decodeValue(
        firstParam(
          "amount",
          "total",
          "price"
        )
      );

    const currency =
      decodeValue(
        firstParam(
          "currency",
          "Currency"
        )
      ) || "TZS";

    const status =
      decodeValue(
        firstParam(
          "status",
          "paymentStatus",
          "PaymentStatus"
        )
      );

    setText(
      "productType",
      formatProductType(productType)
    );

    setText(
      "orderId",
      orderId
    );

    setText(
      "merchantReference",
      merchantReference
    );

    setText(
      "orderTrackingId",
      orderTrackingId
    );

    setText(
      "amount",
      formatAmount(
        amount,
        currency
      )
    );

    if(status){

      const normalized =
        status.toLowerCase();

      const statusElement =
        document.getElementById(
          "paymentStatus"
        );

      if(statusElement){

        statusElement.textContent =
          formatProductType(status);

        if(
          normalized !== "completed" &&
          normalized !== "success" &&
          normalized !== "successful"
        ){
          statusElement.classList.remove(
            "status"
          );
        }
      }
    }

    document
      .getElementById("homeButton")
      ?.addEventListener(
        "click",
        () => {
          window.location.href =
            "index-auth.html";
        }
      );

    /*
      Save the final payment information
      so other LetsStudy Pro pages can use it.
    */
    const completedPayment = {

      success:true,

      status:
        status || "COMPLETED",

      orderId:
        orderId || "",

      orderTrackingId:
        orderTrackingId || "",

      merchantReference:
        merchantReference || "",

      productType:
        productType || "",

      amount:
        amount || "",

      currency:
        currency || "TZS",

      completedAt:
        new Date().toISOString()

    };

    try{

      sessionStorage.setItem(
        "completedPayment",
        JSON.stringify(
          completedPayment
        )
      );

    }catch{}

    try{

      localStorage.setItem(
        "completedPayment",
        JSON.stringify(
          completedPayment
        )
      );

    }catch{}

    /*
      Remove pending checkout information
      only after reaching the success page.
    */
    cleanStorage();

    /*
      If the payment page sends a return URL,
      keep the success page stable and do not
      automatically redirect the customer.
    */
    window.history.replaceState(
      {},
      document.title,
      window.location.pathname +
      window.location.search
    );
  </script>

</body>
</html>
