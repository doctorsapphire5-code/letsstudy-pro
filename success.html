/* ==================================================
 FIREBASE
================================================== */

import{

initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import{

getAuth,
onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import{

getFirestore,
collection,
query,
where,
getDocs

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==================================================
 CONFIG
================================================== */

const firebaseConfig={

apiKey:
"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:89eef78b2ccfbcf0a9fe5f",

measurementId:
"G-NCZNKYB3YB"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* ==================================================
 URL PARAMETERS
================================================== */

const params=
new URLSearchParams(
window.location.search
);


const referenceId=
params.get("reference") ||
params.get("referenceId") ||
params.get("orderId") ||
params.get("order_id") ||
params.get("paymentId") ||
params.get("payment_id") ||
params.get("transactionId") ||
params.get("transaction_id");


const courseId=
params.get("courseId") ||
params.get("course_id");


const type=
(
params.get("type") ||
"general"
).toLowerCase();


/* ==================================================
 AUTH
================================================== */


onAuthStateChanged(
  auth,
  async () => {

    await loadReports();

  }
);


/* ==================================================
 SHOW USER
================================================== */

function showContent(user){

document
.getElementById("loading")
.classList.add("hidden");


document
.getElementById("content")
.classList.remove("hidden");


const displayName=
user.displayName ||
user.email?.split("@")[0] ||
"Learner";


document
.getElementById("userName")
.textContent=
displayName;


document
.getElementById("userEmail")
.textContent=
user.email ||
"-";


document
.getElementById("welcome")
textContent=
`Hello ${displayName}, your action was completed successfully.`;


/* General configuration */

if(type==="payment"){

document
.getElementById("successTitle")
.textContent=
"Payment Successful!";


document
.getElementById("successSubtitle")
.textContent=
"Your payment has been received successfully.";


document
.getElementById("message")
.textContent=
"Your payment confirmation has been recorded.";

}


if(type==="enrollment"){

document
.getElementById("successTitle")
.textContent=
"Enrollment Successful!";


document
.getElementById("successSubtitle")
.textContent=
"You have successfully enrolled in the course.";

}


if(type==="registration"){

document
.getElementById("successTitle")
.textContent=

document
.getElementById("successSubtitle")

"Your LetsStudy Pro account is ready.";

if(type==="application"){

document
.getElementById("successTitle")
.textContent=
"Application Submitted!";


document
.getElementById("successSubtitle")
.textContent=
"Your application has been submitted successfully.";

}

}


/* ==================================================
 LOAD PAYMENT / ORDER / RECORD
================================================== */

async function loadRelatedRecord(user){

if(!referenceId){

hideReference();

setDate(
new Date()
);

setupPrimaryButton();

return;

}


try{

/*
Search payments by user.

This avoids showing another
user's payment information.
*/

const paymentQuery=
query(
collection(db,"payments"),
where(
"userId",
"==",
user.uid
)
);


const snapshot=
await getDocs(
paymentQuery
);


const records=
snapshot.docs.map(
doc=>({

id:doc.id,
...doc.data()

})
);


const record=
records.find(
item=>

item.id===referenceId ||

item.paymentId===referenceId ||

item.orderId===referenceId ||

item.transactionId===referenceId ||

item.reference===referenceId

);


if(record){

showRecord(
record
);

}else{

document
.getElementById("reference")
.textContent=
referenceId;

setDate(
new Date()
);

setupPrimaryButton();

}

}catch(error){

console.warn(
"Record lookup failed:",
error
);


document
.getElementById("reference")
.textContent=
referenceId;


setDate(
new Date()
);

setupPrimaryButton();

}

}


/* ==================================================
 DISPLAY RECORD
================================================== */

function showRecord(record){

document
.getElementById("reference")
.textContent=
record.transactionId ||
record.reference ||
record.orderId ||
record.id ||
referenceId;


const course=
record.courseName ||
record.courseTitle;


if(course){

document
.getElementById("courseName")
.textContent=
course;

}else{

document
.getElementById("courseRow")
.style.display=
"none";

}


const status=
record.status ||
record.paymentStatus ||
"completed";


document
.getElementById("status")
.textContent=
status;


setDate(
record.createdAt ||
record.paidAt ||
record.completedAt ||
record.updatedAt
);


setupPrimaryButton(
record.courseId ||
courseId
);

}


/* ==================================================
 PRIMARY BUTTON
================================================== */

function setupPrimaryButton(id){

const button=
document.getElementById(
"primaryButton"
);


if(type==="payment" ||
type==="enrollment" ||
id){

button.textContent=
"📚 Continue Learning";


button.className=
"btn primary";


button.onclick=
()=>{

if(id){

location.href=
"course-learning.html?courseId="+
encodeURIComponent(id);

}else{

location.href=
"my-courses.html";

}

};

return;

}


if(type==="registration"){

button.textContent=
"Explore Courses";

button.onclick=
()=>{

location.href=
"explore.html";

};

return;

}


if(type==="application"){

button.textContent=
"View Dashboard";

button.onclick=
()=>{

location.href=
"dashboard.html";

};

return;

}


button.textContent=
"Continue";

button.onclick=
()=>{

location.href=
"dashboard.html";

};

}


/* ==================================================
 DATE
================================================== */

function setDate(value){

const date=
parseDate(value);


if(!date)
return;


document
.getElementById("date")
.textContent=
date.toLocaleString(
[],
{
day:"2-digit",
month:"short",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);

}


function parseDate(value){

if(!value)
return null;


try{

if(
typeof value.toDate===
"function"
){

return value.toDate();

}


if(
typeof value.toMillis===
"function"
){

return new Date(
value.toMillis()
);

}


const date=
new Date(value);


return isNaN(
date.getTime()
)
?
null
:
date;

}catch{

return null;

}

}


/* ==================================================
 HIDE REFERENCE
================================================== */

function hideReference(){

document
.getElementById(
"referenceRow"
)
.style.display=
"none";

}


/* ==================================================
 ERROR
================================================== */

function showError(){

document
.getElementById("loading")
.classList.add("hidden");


document
.getElementById("content")
.classList.add("hidden");


document
.getElementById("error")
.classList.remove("hidden");

}


/* ==================================================
 GLOBAL ESCAPE
================================================== */

function escapeHTML(value){

return String(value??"")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
