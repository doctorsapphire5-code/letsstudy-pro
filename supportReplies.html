<style>
:root{--p:#2563eb;--ink:#0f172a;--text:#1f2937;--muted:#64748b;--bg:#f6f8fb;--paper:#fff;--line:#e2e8f0;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--p:#60a5fa;--ink:#f1f5f9;--text:#d5dcea;--muted:#94a3b8;--bg:#0b1220;--paper:#111a2e;--line:#22304a;--soft:#17223a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(760px,92%);margin:0 auto;padding:44px 0 70px}
.back{display:inline-block;margin-bottom:14px;font-weight:600;font-size:14px;text-decoration:none}
h1{font-size:clamp(28px,6vw,40px);line-height:1.15;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 10px;overflow-wrap:anywhere}
.lead{font-size:18px;color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--p)}
.t{display:block;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:12px;text-decoration:none;color:var(--text)}
.t:hover{border-color:var(--p)}
.t h2{margin:0;font-size:17px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.t p{margin:4px 0 0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-size:13px;color:var(--muted)}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c,#64748b) 16%,transparent);color:var(--c,#64748b)}
.s-open{--c:#2563eb}.s-pending{--c:#d97706}.s-resolved{--c:#16a34a}.s-closed{--c:#64748b}.p-high,.p-urgent{--c:#dc2626}.p-medium{--c:#d97706}.p-low{--c:#16a34a}
@media(prefers-color-scheme:dark){.s-open{--c:#60a5fa}.s-pending{--c:#fbbf24}.s-resolved{--c:#4ade80}.s-closed{--c:#94a3b8}.p-high,.p-urgent{--c:#f87171}.p-medium{--c:#fbbf24}.p-low{--c:#4ade80}}
.head{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px}
.head .meta{margin:0}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.ctl label{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.ctl select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.m{max-width:85%;background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 16px;align-self:flex-start}
.m.me{align-self:flex-end;background:var(--p);border-color:var(--p);color:#fff;border-radius:16px 16px 4px 16px}
@media(prefers-color-scheme:dark){.m.me{color:#0b1220}}
.m .who{font-size:12px;font-weight:800;opacity:.75;margin-bottom:2px}
.m .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.m time{display:block;font-size:12px;opacity:.7;margin-top:4px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.box textarea{width:100%;min-height:84px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.box textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.row small{color:var(--muted)}
.btn{border:0;background:var(--p);color:#fff;padding:10px 20px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}}
.state{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.m{max-width:94%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="hd"><div>
  <a class="brand" href="index.html">LetsStudy <span>Pro</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="supportReplies.html" aria-current="page">Support</a>
  </nav>
</div></header>

<main class="wrap">
  <div id="listView" hidden="">
    <h1>Support</h1>
    <p class="lead" id="lead">Your support tickets and the replies from our team.</p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="open" aria-selected="true">Open</button>
      <button class="tab" role="tab" data-v="closed" aria-selected="false">Closed</button>
    </div>
    <div id="list"></div>
  </div>

  <div id="threadView" hidden="">
    <a class="back" href="supportReplies.html">← All tickets</a>
    <div id="head"></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div id="composer"></div>
  </div>

  <div id="msg"></div>
</main>

<div class="toast" id="toast" role="status"></div>
<footer>© <span id="year"></span> LetsStudy Pro. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,addDoc,updateDoc,onSnapshot,serverTimestamp,query,where,orderBy,limit}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
});
const auth=getAuth(fb),db=getFirestore(fb);

const $=s=>document.querySelector(s);
const qp=new URLSearchParams(location.search);
const tid=(qp.get("ticketId")||qp.get("id")||"").trim();
const TICKETS="supportTickets",REPLIES="supportReplies";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toD=v=>{if(!v)return null;const x=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(x)?null:x};
const cap=s=>s?String(s)[0].toUpperCase()+String(s).slice(1):s;
const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"});
function ago(x){
  const s=(x-Date.now())/1000,a=Math.abs(s);
  for(const [u,v] of [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]])
    if(a>=v)return rtf.format(Math.round(s/v),u);
  return "just now";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}

const STAFF=/admin|support|staff|moderator/i;
const STATUSES=["open","pending","resolved","closed"],PRIOS=["Low","Medium","High"];
const isDone=t=>/^(closed|resolved)$/i.test(t.status||"");
const owner=t=>t.userID||t.userId;
let user=null,staff="",unsubs=[],ticket=null,replies=[],view="open",tickets=[];

async function staffRole(u){
  try{const s=await getDoc(doc(db,"admins",u.uid));if(s.exists())return String(s.data().role||"admin")}catch{}
  try{const s=await getDoc(doc(db,"users",u.uid));const r=s.exists()?String(s.data().role||""):"";if(STAFF.test(r))return r}catch{}
  return "";
}

function show(which){
  $("#listView").hidden=which!=="list";$("#threadView").hidden=which!=="thread";
  if(which!=="none")$("#msg").innerHTML="";
}
function gate(t,p,link){show("none");$("#msg").innerHTML=`<div class="state"><h2>${t}</h2><p>${p}</p>${link||""}</div>`}
function fail(err){
  console.error(err);show("none");
  const denied=err&&err.code==="permission-denied";
  $("#msg").innerHTML=denied
    ?`<div class="state"><h2>No access</h2><p>You do not have permission to view this.</p><a class="btn" href="supportReplies.html">Back to my tickets</a></div>`
    :`<div class="state err"><h2>Unable to load support</h2><p>${esc(err&&err.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry")?.addEventListener("click",route);
}

/* ---------- ticket list ---------- */
function renderList(){
  const items=tickets.filter(t=>(view==="closed")===isDone(t));
  $("#list").innerHTML=items.length?items.map(t=>{
    const x=toD(t.updatedAt||t.createdAt),st=String(t.status||"open").toLowerCase(),pr=String(t.priority||"").toLowerCase();
    return `<a class="t" href="supportReplies.html?ticketId=${encodeURIComponent(t.id)}"><h2>${esc(t.subject||"Support ticket")}</h2>
      ${t.message?`<p>${esc(t.message)}</p>`:""}
      <div class="meta"><span class="b s-${esc(st)}">${esc(cap(st))}</span>${pr?`<span class="b p-${esc(pr)}">${esc(cap(pr))}</span>`:""}
        ${t.category?`<span>${esc(t.category)}</span>`:""}${x?`<span>Updated ${esc(ago(x))}</span>`:""}</div></a>`}).join(""):
    `<div class="state"><h2>${view==="closed"?"No closed tickets":"No open tickets"}</h2><p>${staff?"Tickets from customers will appear here.":"When you contact support, your tickets will appear here."}</p></div>`;
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  view=t.dataset.v;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  renderList();
}));
async function showList(){
  show("list");
  $("#lead").textContent=staff?"All support tickets, most recently updated first.":"Your support tickets and the replies from our team.";
  const col=collection(db,TICKETS);
  try{
    let snap;
    if(staff){try{snap=await getDocs(query(col,orderBy("updatedAt","desc"),limit(100)))}catch{snap=await getDocs(query(col,limit(100)))}}
    else snap=await getDocs(query(col,where("userID","==",user.uid)));
    tickets=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(toD(b.updatedAt||b.createdAt)||0)-(toD(a.updatedAt||a.createdAt)||0));
  }catch(e){return fail(e)}
  renderList();
}

/* ---------- conversation ---------- */
function renderHead(){
  const st=String(ticket.status||"open").toLowerCase(),pr=String(ticket.priority||""),x=toD(ticket.createdAt);
  $("#head").innerHTML=`<div class="head"><h1 style="font-size:clamp(24px,5vw,32px)">${esc(ticket.subject||"Support ticket")}</h1>
    <div class="meta"><span class="b s-${esc(st)}">${esc(cap(st))}</span>${pr?`<span class="b p-${esc(pr.toLowerCase())}">${esc(pr)}</span>`:""}
      ${ticket.category?`<span>${esc(ticket.category)}</span>`:""}${x?`<span>Opened ${esc(ago(x))}</span>`:""}</div>
    ${staff?`<div class="ctl"><label>Status <select id="cs">${STATUSES.map(s=>`<option value="${s}"${s===st?" selected":""}>${cap(s)}</option>`).join("")}</select></label>
      <label>Priority <select id="cp">${PRIOS.map(s=>`<option${s.toLowerCase()===pr.toLowerCase()?" selected":""}>${s}</option>`).join("")}</select></label></div>`:""}</div>`;
}
function bubble(m){
  const mine=m.userId===user.uid,sup=STAFF.test(m.senderRole||""),x=toD(m.createdAt);
  return `<div class="m${mine?" me":""}"><div class="who">${sup?"Support team":mine?"You":"Customer"}</div><div class="tx">${esc(m.message)}</div>
    ${x?`<time datetime="${x.toISOString()}">${esc(x.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}))}</time>`:""}</div>`;
}
function renderChat(){
  const first={message:ticket.message,createdAt:ticket.createdAt,userId:owner(ticket),senderRole:"user"};
  const all=[first,...replies.sort((a,b)=>(toD(a.createdAt)||Date.now())-(toD(b.createdAt)||Date.now()))];
  const chat=$("#chat"),atEnd=innerHeight+scrollY>=document.body.scrollHeight-160;
  chat.innerHTML=all.map(bubble).join("");
  if(atEnd||replies.length<=1)scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
let composerFor=null;
function renderComposer(){
  const closed=isDone(ticket),key=closed?"closed":"open";
  if(composerFor===key)return;composerFor=key;
  $("#composer").innerHTML=closed
    ?`<div class="state"><h2>This ticket is ${esc(String(ticket.status).toLowerCase())}</h2><p>Need more help? Reopen it to continue the conversation.</p><button class="btn" id="reopen" type="button">Reopen ticket</button></div>`
    :`<div class="box"><textarea id="rt" maxlength="3000" placeholder="${staff?"Reply to the customer":"Write a reply"}" aria-label="Reply"></textarea>
      <div class="row"><small>${staff?"Replying as support":"Our team will reply here."}</small><button class="btn" id="send" type="button">Send</button></div></div>`;
}
$("#composer").addEventListener("click",async e=>{
  if(e.target.closest("#reopen")){
    try{await updateDoc(doc(db,TICKETS,tid),{status:"open",updatedAt:serverTimestamp()});toast("Ticket reopened")}
    catch(err){console.error(err);toast("Could not reopen the ticket")}
    return;
  }
  const b=e.target.closest("#send");if(!b)return;
  const ta=$("#rt"),message=ta.value.trim();if(!message)return;
  b.disabled=true;
  try{
    await addDoc(collection(db,REPLIES),{createdAt:serverTimestamp(),message,senderRole:staff||"user",ticketId:tid,userId:user.uid});
    ta.value="";
    try{await updateDoc(doc(db,TICKETS,tid),{updatedAt:serverTimestamp()})}catch{}
  }catch(err){console.error(err);toast("Could not send your reply")}
  b.disabled=false;
});
$("#composer").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))$("#send")?.click()});
$("#head").addEventListener("change",async e=>{
  const f=e.target.id==="cs"?{status:e.target.value}:e.target.id==="cp"?{priority:e.target.value}:null;
  if(!f)return;
  try{await updateDoc(doc(db,TICKETS,tid),{...f,updatedAt:serverTimestamp()});toast("Ticket updated")}
  catch(err){console.error(err);toast("Could not update the ticket")}
});

function openThread(){
  show("thread");composerFor=null;ticket=null;replies=[];
  unsubs.push(onSnapshot(doc(db,TICKETS,tid),s=>{
    if(!s.exists())return gate("Ticket not found","This ticket does not exist or was removed.",`<a class="btn" href="supportReplies.html">Back to my tickets</a>`);
    ticket={id:s.id,...s.data()};
    if(!staff&&owner(ticket)!==user.uid)return gate("No access","This ticket belongs to another account.",`<a class="btn" href="supportReplies.html">Back to my tickets</a>`);
    show("thread");document.title=`${ticket.subject||"Support ticket"} | LetsStudy Pro`;
    renderHead();renderComposer();renderChat();
  },fail));
  unsubs.push(onSnapshot(query(collection(db,REPLIES),where("ticketId","==",tid)),s=>{
    replies=s.docs.map(d=>({id:d.id,...d.data()}));
    if(ticket)renderChat();
  },fail));
}

/* ---------- routing ---------- */
function route(){tid?openThread():showList()}
$("#year").textContent=new Date().getFullYear();
onAuthStateChanged(auth,async u=>{
  user=u;unsubs.forEach(x=>x());unsubs=[];
  if(!u)return gate("Sign in to view support","Your tickets are private to your account.",`<a class="btn" href="login.html">Sign in</a>`);
  staff=await staffRole(u);
  route();
});
</script>
