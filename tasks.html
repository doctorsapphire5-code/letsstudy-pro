<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#172033;
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.header h1{
    margin:0;
    font-size:19px;
}

.header-actions{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.primary{
    background:#7c3aed;
    color:#fff;
}

.secondary{
    background:#e2e8f0;
    color:#334155;
}

.danger{
    background:#fee2e2;
    color:#b91c1c;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:24px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.search{
    flex:1;
    border:1px solid #cbd5e1;
    border-radius:7px;
    padding:11px;
    outline:none;
}

.filter{
    border:1px solid #cbd5e1;
    border-radius:7px;
    padding:10px;
    background:#fff;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:9px;
    padding:16px;
}

.stat-label{
    color:#64748b;
    font-size:9px;
    font-weight:900;
}

.stat-value{
    margin-top:7px;
    font-size:23px;
    font-weight:900;
}

.task-list{
    display:grid;
    gap:10px;
}

.task{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:13px;
}

.task.completed .task-title{
    text-decoration:line-through;
    color:#94a3b8;
}

.check{
    width:19px;
    height:19px;
    cursor:pointer;
}

.task-main{
    flex:1;
}

.task-title{
    font-size:13px;
    font-weight:800;
    margin-bottom:5px;
}

.task-meta{
    color:#64748b;
    font-size:10px;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    font-size:9px;
    font-weight:900;
}

.high{
    background:#fee2e2;
    color:#b91c1c;
}

.medium{
    background:#fef3c7;
    color:#92400e;
}

.low{
    background:#dcfce7;
    color:#166534;
}

.overdue{
    color:#dc2626;
    font-weight:900;
}

.task-actions{
    display:flex;
    gap:6px;
}

.empty{
    text-align:center;
    padding:70px;
    color:#64748b;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(500px,100%);
    background:#fff;
    border-radius:12px;
    padding:22px;
}

.modal-card h2{
    margin-top:0;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    color:#64748b;
    font-size:9px;
    font-weight:900;
    margin-bottom:5px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #cbd5e1;
    border-radius:7px;
    padding:10px;
    outline:none;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .task{
        align-items:flex-start;
    }

    .task-actions{
        flex-direction:column;
    }
}

@media(max-width:600px){

    .header{
        padding:0 12px;
    }

    .container{
        padding:12px;
    }

    .toolbar{
        flex-direction:column;
    }

    .header-actions .secondary{
        display:none;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>Tasks</h1>

    <div class="header-actions">

        <button
            class="secondary"
            onclick="clearCompleted()">
            Clear Completed
        </button>

        <button
            class="primary"
            onclick="openTaskModal()">
            + New Task
        </button>

    </div>

</header>


<main class="container">

    <section class="stats">

        <div class="stat">

            <div class="stat-label">
                TOTAL TASKS
            </div>

            <div
                id="totalTasks"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                ACTIVE
            </div>

            <div
                id="activeTasks"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                COMPLETED
            </div>

            <div
                id="completedTasks"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                OVERDUE
            </div>

            <div
                id="overdueTasks"
                class="stat-value">
                0
            </div>

        </div>

    </section>


    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search tasks..."
            oninput="renderTasks()">


        <select
            id="filter"
            class="filter"
            onchange="renderTasks()">

            <option value="all">
                All tasks
            </option>

            <option value="active">
                Active
            </option>

            <option value="completed">
                Completed
            </option>

            <option value="high">
                High priority
            </option>

            <option value="overdue">
                Overdue
            </option>

        </select>

    </div>


    <section
        id="taskList"
        class="task-list">
    </section>


    <div
        id="empty"
        class="empty"
        style="display:none">

        No tasks found.

    </div>

</main>


<!-- =========================
     TASK MODAL
========================= -->

<div
    id="taskModal"
    class="modal">

    <div class="modal-card">

        <h2>
            New Task
        </h2>


        <div class="form-group">

            <label>
                TASK TITLE
            </label>

            <input
                id="taskTitle"
                placeholder="Enter task title">

        </div>


        <div class="form-group">

            <label>
                DUE DATE
            </label>

            <input
                id="taskDate"
                type="date">

        </div>


        <div class="form-group">

            <label>
                PRIORITY
            </label>

            <select id="taskPriority">

                <option value="low">
                    Low
                </option>

                <option value="medium" selected>
                    Medium
                </option>

                <option value="high">
                    High
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                ASSIGNEE
            </label>

            <input
                id="taskAssignee"
                placeholder="Name or email">

        </div>


        <div class="form-group">

            <label>
                DESCRIPTION
            </label>

            <textarea
                id="taskDescription"
                rows="4"
                placeholder="Task details..."></textarea>

        </div>


        <div class="modal-actions">

            <button
                class="secondary"
                onclick="closeTaskModal()">
                Cancel
            </button>

            <button
                class="primary"
                onclick="createTask()">
                Create Task
            </button>

        </div>

    </div>

</div>


<script>

const STORAGE_KEY =
    "tasks-data";


let tasks = [];


/* =========================
   LOAD
========================= */

function loadTasks(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if(saved){

        try{

            tasks =
                JSON.parse(saved);

        }catch(error){

            tasks = [];

        }

    }


    if(!Array.isArray(tasks)){
        tasks = [];
    }

}


/* =========================
   SAVE
========================= */

function saveTasks(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(tasks)
    );

}


/* =========================
   RENDER
========================= */

function renderTasks(){

    const list =
        document.getElementById(
            "taskList"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const query =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();

    const filter =
        document.getElementById(
            "filter"
        ).value;


    list.innerHTML = "";


    const now =
        new Date();


    const filtered =
        tasks.filter(
            task => {

                const text =
                    (
                        task.title +
                        " " +
                        task.description +
                        " " +
                        task.assignee
                    )
                    .toLowerCase();


                if(
                    !text.includes(
                        query
                    )
                ){

                    return false;

                }


                const overdue =
                    isOverdue(
                        task,
                        now
                    );


                if(
                    filter === "active" &&
                    task.completed
                ){

                    return false;

                }


                if(
                    filter === "completed" &&
                    !task.completed
                ){

                    return false;

                }


                if(
                    filter === "high" &&
                    task.priority !== "high"
                ){

                    return false;

                }


                if(
                    filter === "overdue" &&
                    !overdue
                ){

                    return false;

                }


                return true;

            }
        )
        .sort(
            (a,b) =>
                (
                    a.completed -
                    b.completed
                ) ||
                (
                    new Date(
                        a.dueDate ||
                        "9999-12-31"
                    ) -
                    new Date(
                        b.dueDate ||
                        "9999-12-31"
                    )
                )
        );


    if(!filtered.length){

        empty.style.display =
            "block";

    }else{

        empty.style.display =
            "none";

    }


    filtered.forEach(
        task => {

            const article =
                document.createElement(
                    "article"
                );


            const overdue =
                isOverdue(
                    task,
                    now
                );


            article.className =
                "task" +
                (
                    task.completed
                        ? " completed"
                        : ""
                );


            article.innerHTML = `

                <input
                    class="check"
                    type="checkbox"
                    ${
                        task.completed
                            ? "checked"
                            : ""
                    }
                    onchange="toggleTask(${task.id})">


                <div class="task-main">

                    <div class="task-title">

                        ${escapeHTML(
                            task.title
                        )}

                    </div>


                    <div class="task-meta">

                        ${
                            task.dueDate
                                ? "Due " +
                                  formatDate(
                                      task.dueDate
                                  )
                                : "No due date"
                        }

                        ${
                            task.assignee
                                ? " · " +
                                  escapeHTML(
                                      task.assignee
                                  )
                                : ""
                        }

                        ${
                            overdue
                                ? ' <span class="overdue">· Overdue</span>'
                                : ""
                        }

                    </div>

                </div>


                <span
                    class="badge ${task.priority}">

                    ${escapeHTML(
                        task.priority
                            .toUpperCase()
                    )}

                </span>


                <div class="task-actions">

                    <button
                        class="danger"
                        onclick="deleteTask(${task.id})">

                        Delete

                    </button>

                </div>

            `;


            list.appendChild(
                article
            );

        }
    );


    updateStats();

}


/* =========================
   STATS
========================= */

function updateStats(){

    const now =
        new Date();


    const total =
        tasks.length;


    const completed =
        tasks.filter(
            task =>
                task.completed
        ).length;


    const active =
        total -
        completed;


    const overdue =
        tasks.filter(
            task =>
                isOverdue(
                    task,
                    now
                )
        ).length;


    document.getElementById(
        "totalTasks"
    ).textContent =
        total;


    document.getElementById(
        "activeTasks"
    ).textContent =
        active;


    document.getElementById(
        "completedTasks"
    ).textContent =
        completed;


    document.getElementById(
        "overdueTasks"
    ).textContent =
        overdue;

}


/* =========================
   MODAL
========================= */

function openTaskModal(){

    document.getElementById(
        "taskModal"
    ).classList.add(
        "show"
    );


    document.getElementById(
        "taskTitle"
    ).focus();


    document.getElementById(
        "taskDate"
    ).value =
        new Date()
            .toISOString()
            .split("T")[0];

}


function closeTaskModal(){

    document.getElementById(
        "taskModal"
    ).classList.remove(
        "show"
    );

}


/* =========================
   CREATE TASK
========================= */

function createTask(){

    const title =
        document.getElementById(
            "taskTitle"
        ).value.trim();

    const dueDate =
        document.getElementById(
            "taskDate"
        ).value;

    const priority =
        document.getElementById(
            "taskPriority"
        ).value;

    const assignee =
        document.getElementById(
            "taskAssignee"
        ).value.trim();

    const description =
        document.getElementById(
            "taskDescription"
        ).value.trim();


    if(!title){

        alert(
            "Please enter a task title."
        );

        return;

    }


    tasks.push({

        id:
            Date.now(),

        title,

        dueDate,

        priority,

        assignee,

        description,

        completed:
            false

    });


    saveTasks();

    clearTaskForm();

    closeTaskModal();

    renderTasks();

}


/* =========================
   TOGGLE
========================= */

function toggleTask(id){

    const task =
        tasks.find(
            item =>
                item.id === id
        );


    if(!task){
        return;
    }


    task.completed =
        !task.completed;


    saveTasks();

    renderTasks();

}


/* =========================
   DELETE
========================= */

function deleteTask(id){

    if(
        !confirm(
            "Delete this task?"
        )
    ){

        return;

    }


    tasks =
        tasks.filter(
            task =>
                task.id !== id
        );


    saveTasks();

    renderTasks();

}


/* =========================
   CLEAR COMPLETED
========================= */

function clearCompleted(){

    const completed =
        tasks.some(
            task =>
                task.completed
        );


    if(!completed){
        return;
    }


    if(
        !confirm(
            "Clear all completed tasks?"
        )
    ){

        return;

    }


    tasks =
        tasks.filter(
            task =>
                !task.completed
        );


    saveTasks();

    renderTasks();

}


/* =========================
   OVERDUE
========================= */

function isOverdue(
    task,
    now
){

    if(
        task.completed ||
        !task.dueDate
    ){

        return false;

    }


    const due =
        new Date(
            task.dueDate +
            "T23:59:59"
        );


    return due < now;

}


/* =========================
   DATE
========================= */

function formatDate(
    value
){

    if(!value){
        return "No date";
    }


    const date =
        new Date(
            value +
            "T00:00:00"
        );


    return date.toLocaleDateString(
        undefined,
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    );

}


/* =========================
   CLEAR FORM
========================= */

function clearTaskForm(){

    document.getElementById(
        "taskTitle"
    ).value = "";

    document.getElementById(
        "taskAssignee"
    ).value = "";

    document.getElementById(
        "taskDescription"
    ).value = "";

    document.getElementById(
        "taskPriority"
    ).value =
        "medium";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
    value
){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   START
========================= */

loadTasks();

renderTasks();

</script>

</body>
</html>
