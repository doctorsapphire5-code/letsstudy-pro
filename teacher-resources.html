<title>Teacher Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F5; --card:#FFFFFF; --ink:#14233B; --muted:#5B6A80; --line:#D3DBE5;
  --teal:#1F7A8C; --teal-d:#175F6D; --mark:#FFD84D; --danger:#B3261E;
  --t-plan:#1F7A8C; --t-sheet:#C2410C; --t-test:#6D4AA8; --t-guide:#2F7D4F; --t-video:#B3265F;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

header{background:var(--ink);color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.brand{font:800 1.15rem var(--display);letter-spacing:.2px}
.brand span{background:var(--mark);color:var(--ink);padding:1px 8px;border-radius:3px;margin-right:6px}
.auth{display:flex;align-items:center;gap:10px;font-size:.92rem}
.auth .who{opacity:.8;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{font:700 .95rem var(--body);border:2px solid var(--teal);background:var(--teal);color:#fff;padding:9px 16px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--teal-d);border-color:var(--teal-d)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}

.hero{padding:56px 0 28px}
h1{font:800 clamp(2rem,5.5vw,3.4rem)/1.05 var(--display);margin:0 0 14px;max-width:16em;letter-spacing:-.5px}
.hero p{margin:0 0 24px;color:var(--muted);max-width:34em}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1 1 260px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none}
label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 5px}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 16px;border-bottom:2px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 .88rem var(--body);background:transparent;border:2px solid var(--line);color:var(--ink);padding:5px 13px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.count{color:var(--muted);font-size:.92rem}

.list{list-style:none;margin:0;padding:0 0 60px}
.item{display:grid;grid-template-columns:6px 1fr auto;gap:0 18px;background:var(--card);border-bottom:1px solid var(--line);padding:18px 18px 18px 0}
.item:hover{background:#FBFCFD}
.spine{background:var(--c,var(--teal));border-radius:0 3px 3px 0}
.item h2{font:700 1.2rem/1.25 var(--display);margin:0 0 4px}
.item h2 a{text-decoration:none;background:linear-gradient(var(--mark),var(--mark)) 0 100%/0 .4em no-repeat;transition:background-size .2s}
.item h2 a:hover{background-size:100% .4em}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.type{color:var(--c);font-weight:700}
.item p{margin:0;max-width:60ch}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;justify-content:flex-start}
.empty{padding:48px 20px;text-align:center;background:var(--card);color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 1.2rem var(--display);margin-bottom:6px}

dialog{border:0;border-radius:10px;padding:26px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(20,35,59,.35);color:var(--ink)}
dialog::backdrop{background:rgba(20,35,59,.55)}
dialog h3{font:800 1.5rem var(--display);margin:0 0 4px}
.row{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.err{color:var(--danger);font-size:.9rem;min-height:1.3em;margin-top:10px}
.swap{background:none;border:0;color:var(--teal);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:6px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:560px){
  .item{grid-template-columns:5px 1fr;padding-right:14px}
  .side{grid-column:2;flex-direction:row;align-items:center;margin-top:10px}
  .auth .who{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>

<header>
  <div class="wrap">
    <div class="brand"><span>Teacher</span>Resources</div>
    <div class="auth" id="auth"></div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Lesson plans, worksheets and guides shared by teachers.</h1>
    <p>Search what other teachers have shared, or add your own so your colleagues can use it too.</p>
    <div class="search">
      <input id="q" type="search" placeholder="Search by title, subject or description" aria-label="Search resources">
      <button class="btn" id="addBtn" type="button">Add a resource</button>
    </div>
  </section>

  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </div>
  <ul class="list" id="list"></ul>
</main>

<!-- Sign in -->
<dialog id="authDlg">
  <h3 id="authTitle">Sign in</h3>
  <p style="margin:0;color:var(--muted)" id="authSub">Sign in to add and manage your resources.</p>
  <form id="authForm" method="dialog">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required="">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password" minlength="6" required="">
    <div class="err" id="authErr" role="alert"></div>
    <div class="row">
      <button type="button" class="btn ghost" style="color:var(--ink)" data-close="">Cancel</button>
      <button type="submit" class="btn" id="authSubmit">Sign in</button>
    </div>
  </form>
  <p style="margin:16px 0 0;font-size:.92rem"><span id="swapText">New here?</span> <button class="swap" id="swap" type="button">Create an account</button></p>
</dialog>

<!-- Add resource -->
<dialog id="addDlg">
  <h3>Add a resource</h3>
  <form id="addForm" method="dialog">
    <label for="f-title">Title</label>
    <input id="f-title" maxlength="120" required="">
    <label for="f-type">Type</label>
    <select id="f-type" required=""></select>
    <label for="f-subject">Subject</label>
    <input id="f-subject" maxlength="60" placeholder="For example: Mathematics, Form 2">
    <label for="f-link">Link to the file or page</label>
    <input id="f-link" type="url" placeholder="https://" required="">
    <label for="f-desc">Description</label>
    <textarea id="f-desc" rows="3" maxlength="400"></textarea>
    <div class="err" id="addErr" role="alert"></div>
    <div class="row">
      <button type="button" class="btn ghost" style="color:var(--ink)" data-close="">Cancel</button>
      <button type="submit" class="btn" id="addSubmit">Save resource</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFstEIjyLNROxDeMgLqA0OCwSvy6TURr4",
  authDomain: "teacher-and-organization-29efd.firebaseapp.com",
  projectId: "teacher-and-organization-29efd",
  storageBucket: "teacher-and-organization-29efd.firebasestorage.app",
  messagingSenderId: "850321971087",
  appId: "1:850321971087:web:ebb981e0764dd872a69dfa",
  measurementId: "G-584LM4EJTW"
};
const app = initializeApp(firebaseConfig);
try { getAnalytics(app); } catch (e) {}
const auth = getAuth(app);
const db = getFirestore(app);

const TYPES = {
  plan:  { label: "Lesson plans", one: "Lesson plan", color: "var(--t-plan)" },
  sheet: { label: "Worksheets",   one: "Worksheet",   color: "var(--t-sheet)" },
  test:  { label: "Assessments",  one: "Assessment",  color: "var(--t-test)" },
  guide: { label: "Guides",       one: "Guide",       color: "var(--t-guide)" },
  video: { label: "Videos",       one: "Video",       color: "var(--t-video)" }
};

let user = null, items = [], filter = "all", mode = "signin";
const $ = id => document.getElementById(id);

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2600); }
function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){ if (k==="class") n.className=v; else if (k.startsWith("on")) n.addEventListener(k.slice(2),v); else n.setAttribute(k,v); }
  kids.forEach(c => n.append(c));
  return n;
}
function safeUrl(u){ try { const x=new URL(u); return /^https?:$/.test(x.protocol) ? x.href : "#"; } catch { return "#"; } }
function errText(e){
  const m = {
    "auth/invalid-credential":"The email or password is not correct.",
    "auth/email-already-in-use":"An account with this email already exists. Sign in instead.",
    "auth/weak-password":"Use a password with at least 6 characters.",
    "auth/invalid-email":"Enter a valid email address.",
    "permission-denied":"You don’t have permission to do that. Check your Firestore rules."
  };
  return m[e.code] || "Something went wrong. Check your connection and try again.";
}

/* Type select + chips */
Object.entries(TYPES).forEach(([k,v]) => $("f-type").append(new Option(v.one, k)));
function renderChips(){
  const chips = $("chips"); chips.replaceChildren();
  [["all","All"], ...Object.entries(TYPES).map(([k,v])=>[k,v.label])].forEach(([k,label]) => {
    chips.append(el("button",{class:"chip",type:"button","aria-pressed":String(filter===k),onclick:()=>{filter=k;renderChips();render();}},label));
  });
}

/* Auth UI */
function renderAuth(){
  const a = $("auth"); a.replaceChildren();
  if (user){
    a.append(el("span",{class:"who"},user.email), el("button",{class:"btn ghost small",type:"button",onclick:()=>signOut(auth).then(()=>toast("Signed out"))},"Sign out"));
  } else {
    a.append(el("button",{class:"btn ghost small",type:"button",onclick:()=>openAuth("signin")},"Sign in"));
  }
}
function openAuth(m){
  mode = m;
  const signin = m === "signin";
  $("authTitle").textContent = signin ? "Sign in" : "Create an account";
  $("authSubmit").textContent = signin ? "Sign in" : "Create account";
  $("swapText").textContent = signin ? "New here?" : "Already have an account?";
  $("swap").textContent = signin ? "Create an account" : "Sign in";
  $("pass").autocomplete = signin ? "current-password" : "new-password";
  $("authErr").textContent = "";
  $("authDlg").showModal();
}
$("swap").onclick = () => openAuth(mode === "signin" ? "signup" : "signin");
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("authSubmit"); btn.disabled = true; $("authErr").textContent = "";
  try {
    const fn = mode === "signin" ? signInWithEmailAndPassword : createUserWithEmailAndPassword;
    await fn(auth, $("email").value.trim(), $("pass").value);
    $("authDlg").close(); $("authForm").reset();
    toast(mode === "signin" ? "Signed in" : "Account created");
  } catch (err) { $("authErr").textContent = errText(err); }
  btn.disabled = false;
});

onAuthStateChanged(auth, u => { user = u; renderAuth(); render(); });

/* Add resource */
$("addBtn").onclick = () => { if (!user) { openAuth("signin"); return; } $("addErr").textContent = ""; $("addDlg").showModal(); };
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("addSubmit"); btn.disabled = true; $("addErr").textContent = "";
  try {
    await addDoc(collection(db, "resources"), {
      title: $("f-title").value.trim(),
      type: $("f-type").value,
      subject: $("f-subject").value.trim(),
      link: $("f-link").value.trim(),
      description: $("f-desc").value.trim(),
      authorId: user.uid,
      authorEmail: user.email,
      createdAt: serverTimestamp()
    });
    $("addDlg").close(); $("addForm").reset(); toast("Resource saved");
  } catch (err) { $("addErr").textContent = errText(err); }
  btn.disabled = false;
});

/* Live list */
const list = $("list");
onSnapshot(query(collection(db, "resources"), orderBy("createdAt", "desc")),
  snap => { items = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
  err => { list.replaceChildren(el("li",{class:"empty"}, el("strong",{},"Resources can’t be loaded"), errText(err))); });

$("q").addEventListener("input", render);

function render(){
  const q = $("q").value.trim().toLowerCase();
  const shown = items.filter(r =>
    (filter === "all" || r.type === filter) &&
    (!q || [r.title, r.subject, r.description].join(" ").toLowerCase().includes(q)));
  $("count").textContent = shown.length === 1 ? "1 resource" : shown.length + " resources";
  list.replaceChildren();
  if (!shown.length){
    list.append(el("li",{class:"empty"},
      el("strong",{}, items.length ? "Nothing matches your search" : "No resources yet"),
      items.length ? "Try a different word or choose All." : "Add the first one and share it with other teachers."));
    return;
  }
  shown.forEach(r => {
    const t = TYPES[r.type] || TYPES.guide;
    const date = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) : "";
    const side = el("div",{class:"side"},
      el("a",{class:"btn small",href:safeUrl(r.link),target:"_blank",rel:"noopener noreferrer"},"Open"));
    if (user && r.authorId === user.uid){
      side.append(el("button",{class:"btn danger small",type:"button",onclick:async()=>{
        if (!confirm("Delete “" + r.title + "”?")) return;
        try { await deleteDoc(doc(db,"resources",r.id)); toast("Resource deleted"); } catch(e){ toast(errText(e)); }
      }},"Delete"));
    }
    const li = el("li",{class:"item",style:"--c:"+t.color},
      el("div",{class:"spine"}),
      el("div",{},
        el("h2",{}, el("a",{href:safeUrl(r.link),target:"_blank",rel:"noopener noreferrer"}, r.title || "Untitled")),
        el("div",{class:"meta"},
          el("span",{class:"type"},t.one),
          ...(r.subject ? [el("span",{},r.subject)] : []),
          ...(date ? [el("span",{},date)] : [])),
        ...(r.description ? [el("p",{},r.description)] : [])),
      side);
    list.append(li);
  });
}

renderChips(); renderAuth(); render();
</script>


</body></html>
