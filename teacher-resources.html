<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex,nofollow">  <title>Teacher Resources | LetsStudy Pro</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
    }

    .teacher-wrapper {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================================
       TOP BAR
    ================================= */
    .teacher-header {
      height: 64px;
      min-height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: contain;
      background: #f1f5f9;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      border: 1px solid #dbe2ea;
      background: #ffffff;
      color: #374151;
      border-radius: 8px;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .header-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .header-btn.primary {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .header-btn.primary:hover {
      background: #1d4ed8;
    }

    /* ================================
       EMBED AREA
    ================================= */
    .embed-container {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .resource-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }

    /* ================================
       LOADING
    ================================= */
    .loading-screen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 5;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      font-size: 14px;
      color: #6b7280;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ================================
       ERROR
    ================================= */
    .embed-error {
      display: none;
      position: absolute;
      inset: 0;
      background: #ffffff;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      z-index: 6;
    }

    .error-box {
      max-width: 500px;
    }

    .error-box h2 {
      font-size: 21px;
      color: #111827;
      margin-bottom: 10px;
    }

    .error-box p {
      color: #6b7280;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .open-resource {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 11px 17px;
      border-radius: 8px;
      font-size: 14px;
    }

    /* ================================
       MOBILE
    ================================= */
    @media (max-width: 600px) {

      .teacher-header {
        height: 58px;
        min-height: 58px;
        padding: 0 10px;
      }

      .brand-logo {
        width: 34px;
        height: 34px;
      }

      .brand-title {
        font-size: 14px;
      }

      .brand-subtitle {
        display: none;
      }

      .header-btn {
        padding: 8px 9px;
        font-size: 12px;
      }

      .header-btn.dashboard {
        display: none;
      }
    }
  </style></head><body>  <div class="teacher-wrapper"><!-- =========================================
     HEADER
========================================== -->
<header class="teacher-header">

  <div class="brand">

    <img
      class="brand-logo"
      src="/assets/images/logo.png"
      alt="LetsStudy Pro">

    <div class="brand-text">
      <div class="brand-title">
        Teacher Resources
      </div>

      <div class="brand-subtitle">
        LetsStudy Pro
      </div>
    </div>

  </div>

  <div class="header-actions">

    <button
      class="header-btn"
      type="button"
      onclick="reloadResource()">
      ↻ Refresh
    </button>

    <a
      class="header-btn dashboard"
      href="/admin-dashboard.html">
      Dashboard
    </a>

    <a
      class="header-btn primary"
      href="https://letsstudy.pro/admin-resourses-09%2F12%2F2025-ummy.html"
      target="_blank"
      rel="noopener noreferrer">
      Open
    </a>

  </div>

</header>


<!-- =========================================
     EMBED
========================================== -->
<main class="embed-container">

  <div
    id="loadingScreen"
    class="loading-screen">

    <div class="spinner"></div>

    <div class="loading-text">
      Loading Teacher Resources...
    </div>

  </div>


  <div
    id="embedError"
    class="embed-error">

    <div class="error-box">

      <h2>
        Resource page cannot be embedded
      </h2>

      <p>
        The resource management page may be blocking
        iframe embedding. Use the button below to open
        the page directly.
      </p>

      <a
        class="open-resource"
        href="https://letsstudy.pro/admin-resourses-09%2F12%2F2025-ummy.html"
        target="_blank"
        rel="noopener noreferrer">
        Open Resources Management
      </a>

    </div>

  </div>


  <iframe
    id="resourceFrame"
    class="resource-frame"
    src="https://letsstudy.pro/admin-resourses-09%2F12%2F2025-ummy.html"
    title="LetsStudy Pro Teacher Resources"
    loading="eager"
    allow="fullscreen">
  </iframe>

</main>

  </div>  <script>

    const resourceFrame =
      document.getElementById("resourceFrame");

    const loadingScreen =
      document.getElementById("loadingScreen");

    const embedError =
      document.getElementById("embedError");


    /* =========================================
       FRAME LOADED
    ========================================== */
    resourceFrame.addEventListener("load", function () {

      loadingScreen.classList.add("hidden");

    });


    /* =========================================
       REFRESH RESOURCE
    ========================================== */
    function reloadResource() {

      loadingScreen.classList.remove("hidden");

      resourceFrame.src =
        "https://letsstudy.pro/admin-resourses-09%2F12%2F2025-ummy.html?t="
        + Date.now();

    }


    /* =========================================
       BASIC EMBED FALLBACK
    ========================================== */
    setTimeout(function () {

      if (!loadingScreen.classList.contains("hidden")) {

        /*
         * Do not automatically hide the frame.
         * Some pages take longer to load.
         */

        loadingScreen.classList.add("hidden");

      }

    }, 10000);


    /* =========================================
       ESC KEY
    ========================================== */
    document.addEventListener("keydown", function (event) {

      if (event.key === "Escape") {
        window.location.href =
          "/admin-dashboard.html";
      }

    });

  </script></body>
</html>
