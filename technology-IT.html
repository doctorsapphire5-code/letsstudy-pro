<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technology & IT Courses | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Inter,Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}
header{
 background:#111827;color:#fff;
 padding:17px 5%;
 display:flex;
 justify-content:space-between;
 align-items:center
}
.logo{font-size:20px;font-weight:800}
header a{color:#fff;text-decoration:none}
.container{
 max-width:1200px;
 margin:auto;
 padding:30px 18px
}
.hero{
 background:linear-gradient(135deg,#0f172a,#2563eb);
 color:#fff;
 padding:45px 30px;
 border-radius:22px;
 margin-bottom:25px
}
.hero h1{
 margin:0 0 10px;
 font-size:clamp(30px,5vw,52px)
}
.hero p{
 max-width:720px;
 line-height:1.7;
 opacity:.92
}
.toolbar{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin:20px 0
}
input,select{
 padding:13px;
 border:1px solid #d9dfeb;
 border-radius:10px;
 background:#fff
}
.search{flex:1;min-width:230px}
.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fill,minmax(270px,1fr));
 gap:20px
}
.course{
 background:#fff;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 8px 25px #0000000b
}
.course img{
 width:100%;
 height:170px;
 object-fit:cover
}
.content{padding:18px}
.content h3{margin:10px 0 8px}
.meta{
 color:#6b7280;
 font-size:13px;
 margin-bottom:12px
}
.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:11px;
 font-weight:800
}
.free{background:#dcfce7;color:#15803d}
.paid{background:#dbeafe;color:#1d4ed8}
.price{
 font-size:17px;
 font-weight:800;
 margin:14px 0
}
button{
 width:100%;
 border:0;
 border-radius:10px;
 padding:12px;
 cursor:pointer;
 font-weight:800;
 background:#2563eb;
 color:#fff
}
.empty{
 text-align:center;
 padding:60px 20px;
 color:#6b7280
}
.loading{
 text-align:center;
 padding:50px
}
@media(max-width:600px){
 .hero{padding:30px 20px}
}
</style>
</head>

<body>

<header>
 <div class="logo">LetsStudy Pro</div>
 <a href="cart.html">🛒 Cart</a>
</header>

<main class="container">

<section class="hero">
 <h1>Technology & IT</h1>
 <p>
  Build the digital skills of tomorrow.
  Learn programming, software development,
  AI, cybersecurity, cloud computing, networking,
  data science and modern technology.
 </p>
</section>

<div class="toolbar">

 <input
  id="search"
  class="search"
  placeholder="Search Technology & IT courses..."
 >

 <select id="level">
  <option value="">All Levels</option>
  <option>Beginner</option>
  <option>Intermediate</option>
  <option>Advanced</option>
  <option>Professional</option>
 </select>

 <select id="type">
  <option value="">All Courses</option>
  <option value="free">Free</option>
  <option value="paid">Paid</option>
 </select>

</div>

<div id="courses" class="grid">
 <div class="loading">
  Loading courses...
 </div>
</div>

</main>

<script type="module">

import{
 initializeApp
}from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import{
 getFirestore,
 collection,
 getDocs
}from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig={

 apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

 authDomain:
 "let-s-study-pro-course.firebaseapp.com",

 projectId:
 "let-s-study-pro-course",

 storageBucket:
 "let-s-study-pro-course.firebasestorage.app",

 messagingSenderId:
 "474928293390",

 appId:
 "1:474928293390:web:2bcc2aebf2351c12a9fe5f"

};


const app=
 initializeApp(firebaseConfig);

const db=
 getFirestore(app);

let courses=[];

const $=id=>
 document.getElementById(id);


/* =========================
   LOAD TECHNOLOGY COURSES
========================= */

async function loadCourses(){

 try{

  const snap=
   await getDocs(
    collection(db,"courses")
   );

  courses=
   snap.docs
    .map(d=>({
     id:d.id,
     ...d.data()
    }))
    .filter(c=>{

     const category=
      String(
       c.categoryName||
       ""
      ).toLowerCase();

     return(
      category.includes("technology")||
      category.includes("it")||
      category.includes("information technology")||
      category.includes("programming")||
      category.includes("software")||
      category.includes("cybersecurity")||
      category.includes("artificial intelligence")||
      category.includes("ai")||
      category.includes("data science")
     );

    });

  render();

 }catch(error){

  console.error(error);

  $("courses").innerHTML=`
   <div class="empty">
    <h3>Unable to load courses</h3>
    <p>Please try again later.</p>
   </div>
  `;

 }

}


/* =========================
   RENDER
========================= */

function render(){

 const search=
  $("search").value
   .toLowerCase()
   .trim();

 const level=
  $("level").value;

 const type=
  $("type").value;


 const filtered=
  courses.filter(c=>{

   const searchable=(
    (c.title||"")+" "+
    (c.description||"")+" "+
    (c.categoryName||"")+" "+
    (c.tags||[]).join?.(" ")
   ).toLowerCase();

   const free=
    c.isFree===true||
    Number(c.price||0)===0;

   return(

    (!search||
     searchable.includes(search))

    &&

    (!level||
     c.level===level)

    &&

    (!type||
     (type==="free"&&free)||
     (type==="paid"&&!free))

   );

  });


 if(!filtered.length){

  $("courses").innerHTML=`
   <div class="empty">
    <h3>No Technology & IT courses found</h3>
    <p>
     Try another search or filter.
    </p>
   </div>
  `;

  return;

 }


 $("courses").innerHTML=
  filtered.map(c=>{

   const free=
    c.isFree===true||
    Number(c.price||0)===0;

   const image=
    c.thumbnail||
    "https://images.unsplash.com/photo-1518770660439-4636190af475?w=800";


   const currentPrice=
    Number(
     c.discountPrice??
     c.price??
     0
    );


   return`

   <article class="course">

    <img
     src="${escapeHTML(image)}"
     alt="${escapeHTML(c.title)}"
     loading="lazy"
    >

    <div class="content">

     <span class="badge ${free?"free":"paid"}">
      ${free?"FREE":"PAID"}
     </span>

     <h3>
      ${escapeHTML(c.title)}
     </h3>

     <div class="meta">
      ${escapeHTML(
       c.level||
       "Beginner"
      )}
      •
      ${escapeHTML(
       c.language||
       "English"
      )}
     </div>

     <p>
      ${escapeHTML(
       c.shortDescription||
       c.description||
       "Technology & IT course"
      ).slice(0,130)}
    </p>

    <div class="price">

     ${
      free
       ? "Free"
       :
       `${escapeHTML(
        c.currency||"TZS"
       )} ${currentPrice.toLocaleString()}`
     }

    </div>

    <button
     onclick="openCourse('${c.id}')">

     ${
      free
       ? "Start Learning"
       : "Add to Cart"
     }

    </button>

   </div>

  </article>

  `;

  }).join("");

}


/* =========================
   COURSE ACTION
========================= */

window.openCourse=id=>{

 const course=
  courses.find(
   c=>c.id===id
  );

 if(!course)return;


 const free=
  course.isFree===true||
  Number(course.price||0)===0;


 /*
  FREE COURSE
  Direct access
 */

 if(free){

  location.href=
   "course-details.html?id="+
   encodeURIComponent(id);

  return;

 }


 /*
  PAID COURSE
  Add to cart
 */

 let cart=[];

 try{

  cart=
   JSON.parse(
    localStorage.getItem(
     "letsStudyCart"
    )||"[]"
   );

 }catch{

  cart=[];

 }


 const existing=
  cart.find(
   item=>
    item.courseId===id
  );


 if(!existing){

  cart.push({

   id:id,

   courseId:id,

   productId:id,

   productType:"course",

   title:course.title,

   name:course.title,

   price:Number(
    course.discountPrice??
    course.price??
    0
   ),

   currency:
    course.currency||
    "TZS",

   quantity:1,

   thumbnail:
    course.thumbnail||
    "",

   category:
    course.categoryName||
    "Technology & IT"

  });

 }


 localStorage.setItem(
  "letsStudyCart",
  JSON.stringify(cart)
 );


 location.href="cart.html";

};


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

 return String(value||"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =========================
   FILTER EVENTS
========================= */

$("search").oninput=
 render;

$("level").onchange=
 render;

$("type").onchange=
 render;


/* =========================
   START
========================= */

loadCourses();

</script>

</body>
</html>
