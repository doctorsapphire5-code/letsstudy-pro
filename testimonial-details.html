<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Testimonial - LetsStudy Pro</title>

<meta name="description"
content="Read a community testimonial about LetsStudy Pro.">

<link rel="icon" href="https://letsstudy.pro/favicon.ico">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
background:#fff;
border-bottom:1px solid #e7eaf0;
padding:15px 5%;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:22px;
font-weight:800;
color:#1769ff;
text-decoration:none
}

nav a{
margin-left:16px;
text-decoration:none;
color:#39445a;
font-size:14px
}

main{
max-width:850px;
margin:auto;
padding:45px 5%
}

.back{
display:inline-block;
margin-bottom:20px;
color:#1769ff;
text-decoration:none;
font-weight:700;
font-size:14px
}

.card{
background:#fff;
border:1px solid #e7eaf0;
border-radius:20px;
padding:30px;
box-shadow:0 8px 30px #1720330d
}

.profile{
text-align:center
}

.avatar{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
background:#edf1f7;
margin:auto;
display:block
}

.name{
font-size:25px;
font-weight:800;
margin-top:15px
}

.role{
color:#687386;
font-size:14px;
margin-top:6px
}

.badge{
display:inline-block;
margin-top:12px;
background:#eef5ff;
color:#1769ff;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:700
}

.stars{
color:#e5a400;
font-size:22px;
letter-spacing:3px;
margin:18px 0
}

.quote{
font-size:20px;
line-height:1.7;
color:#465268;
text-align:center;
margin:25px auto;
max-width:700px
}

.details{
border-top:1px solid #e7eaf0;
margin-top:25px;
padding-top:20px
}

.row{
padding:10px 0;
font-size:14px;
color:#657084
}

.row strong{
color:#172033
}

.actions{
display:flex;
gap:10px;
margin-top:25px
}

.btn{
flex:1;
padding:12px;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:700;
font-size:14px
}

.primary{
background:#1769ff;
color:#fff
}

.secondary{
border:1px solid #1769ff;
color:#1769ff;
background:#fff
}

.loading,
.error{
text-align:center;
padding:70px 20px;
color:#687386
}

footer{
text-align:center;
padding:35px 20px;
color:#778094;
font-size:13px
}

@media(max-width:650px){

nav a{
display:none
}

.card{
padding:22px
}

.quote{
font-size:17px
}

.actions{
flex-direction:column
}

}
</style>
</head>

<body>

<header>

<a class="logo" href="index.html">
LetsStudy Pro
</a>

<nav>
<a href="courses.html">Courses</a>
<a href="creator-hub.html">Creators</a>
<a href="testimonials.html">Testimonials</a>
<a href="trending.html">Trending</a>
</nav>

</header>


<main>

<a class="back" href="testimonials.html">
← Back to Testimonials
</a>

<div id="content">

<div class="loading">
Loading testimonial...
</div>

</div>

</main>


<footer>

<strong>LetsStudy Pro</strong>

<br><br>

THE DIGITAL ECOSYSTEM — Learn. Build. Work. Grow.

<br><br>

© 2026 LetsStudy Pro. All rights reserved.

</footer>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI0rjodBn678tCc",

authDomain:
"let-s-study-pro-course.firebaseapp.com",

databaseURL:
"https://let-s-study-pro-course-default-rtdb.firebaseio.com",

projectId:
"let-s-study-pro-course",

storageBucket:
"let-s-study-pro-course.firebasestorage.app",

messagingSenderId:
"474928293390",

appId:
"1:474928293390:web:2bcc2aebf2351c12a9fe5f",

measurementId:
"G-85B7V5H5J0"

};


const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const content=document.getElementById("content");

const params=new URLSearchParams(
window.location.search
);

const testimonialId=params.get("id");


const val=(...values)=>
values.find(v=>
v!==undefined &&
v!==null &&
String(v).trim()
)||"";


function getRating(data){

return Number(
data.rating ??
data.stars ??
data.score ??
data.reviewRating ??
0
);

}


function stars(value){

const r=Math.max(
0,
Math.min(5,Math.round(value))
);

return "★".repeat(r)+"☆".repeat(5-r);

}


async function load(){

if(!testimonialId){

content.innerHTML=`
<div class="error">
<h2>Testimonial not found</h2>
<p>No testimonial ID was provided.</p>
<a class="btn primary"
href="testimonials.html">
Back to Testimonials
</a>
</div>
`;

return;

}


try{

const ref=doc(
db,
"testimonials",
testimonialId
);

const snap=await getDoc(ref);


if(!snap.exists()){

content.innerHTML=`
<div class="error">
<h2>Testimonial not found</h2>
<p>The requested testimonial does not exist.</p>
<a class="btn primary"
href="testimonials.html">
Back to Testimonials
</a>
</div>
`;

return;

}


const t=snap.data();

const name=val(
t.name,
t.userName,
t.fullName,
t.author,
t.displayName,
"Community Member"
);

const quote=val(
t.testimonial,
t.quote,
t.review,
t.message,
t.content,
t.description,
"Great experience with LetsStudy Pro."
);

const image=val(
t.image,
t.avatar,
t.photo,
t.profileImage,
t.imageUrl
);

const role=val(
t.role,
t.position,
t.occupation,
t.userRole
);

const category=val(
t.category,
t.type,
"Community"
);

const course=val(
t.course,
t.courseName
);

const service=val(
t.service,
t.serviceName
);

const location=val(
t.location,
t.city,
t.country
);

const date=val(
t.date,
t.createdAt,
t.updatedAt
);

const rating=getRating(t);


document.title=
`${name} - Testimonial | LetsStudy Pro`;


content.innerHTML=`

<article class="card">

<div class="profile">

${
image
?`
<img
class="avatar"
src="${image}"
alt="${name}"
onerror="this.style.visibility='hidden'">
`
:`
<div class="avatar"></div>
`
}

<div class="name">
${name}
</div>

${role
?`
<div class="role">
${role}
</div>
`
:""
}

<span class="badge">
${category}
</span>

<div class="stars"
aria-label="${rating} out of 5 stars">
${stars(rating)}
</div>

</div>


<div class="quote">
“${quote}”
</div>


<div class="details">

${
course
?`
<div class="row">
<strong>Course:</strong> ${course}
</div>
`
:""
}


${
service
?`
<div class="row">
<strong>Service:</strong> ${service}
</div>
`
:""
}


${
location
?`
<div class="row">
<strong>Location:</strong> ${location}
</div>
`
:""
}


${
date
?`
<div class="row">
<strong>Date:</strong> ${date}
</div>
`
:""
}

</div>


<div class="actions">

<a
class="btn primary"
href="testimonials.html">
All Testimonials
</a>

<a
class="btn secondary"
href="index.html">
LetsStudy Pro
</a>

</div>

</article>

`;

}catch(error){

console.error(error);

content.innerHTML=`
<div class="error">

<h2>Unable to load testimonial</h2>

<p>
Something went wrong while loading this testimonial.
</p>

<a
class="btn primary"
href="testimonials.html">
Back to Testimonials
</a>

</div>
`;

}

}


load();

</script>

</body>
</html>
