<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testimonials - LetsStudy Pro</title>
<meta name="description" content="Read experiences and feedback from the LetsStudy Pro community.">
<link rel="icon" href="https://letsstudy.pro/favicon.ico">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e7eaf0;padding:15px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:800;color:#1769ff;text-decoration:none}
nav a{margin-left:16px;text-decoration:none;color:#39445a;font-size:14px}
.hero{padding:55px 6%;text-align:center;background:linear-gradient(135deg,#eef5ff,#fff)}
.hero h1{font-size:38px;margin:0 0 12px}
.hero p{max-width:680px;margin:auto;color:#657084;line-height:1.6}
.wrap{max-width:1150px;margin:auto;padding:30px 5%}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
input,select{padding:13px;border:1px solid #dce1e9;border-radius:10px;background:#fff}
input{flex:1;min-width:220px}
select{min-width:170px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:22px;box-shadow:0 5px 18px #1720330a}
.user{display:flex;align-items:center;gap:13px}
.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#edf1f7}
.name{font-weight:800;margin-bottom:5px}
.role{font-size:12px;color:#6e7787}
.stars{color:#e5a400;font-size:18px;letter-spacing:2px;margin:15px 0}
.quote{font-size:15px;line-height:1.65;color:#596477}
.category{display:inline-block;background:#eef5ff;color:#1769ff;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}
.view{display:block;text-align:center;background:#1769ff;color:#fff;padding:11px;border-radius:9px;text-decoration:none;font-weight:700;margin-top:16px}
.empty{text-align:center;padding:50px;color:#687386;grid-column:1/-1}
footer{text-align:center;padding:35px;color:#778094;font-size:13px}
@media(max-width:650px){
.hero h1{font-size:30px}
nav a{display:none}
}
</style>
</head>

<body>

<header>
<a class="logo" href="index.html">LetsStudy Pro</a>

<nav>
<a href="courses.html">Courses</a>
<a href="creator-hub.html">Creators</a>
<a href="trending.html">Trending</a>
<a href="services.html">Services</a>
</nav>
</header>

<section class="hero">
<h1>Testimonials</h1>
<p>
See experiences and feedback shared by members of the LetsStudy Pro
community.
</p>
</section>

<main class="wrap">

<div class="tools">
<input id="search" type="search"
placeholder="Search testimonials...">

<select id="category">
<option value="">All Categories</option>
</select>

<select id="rating">
<option value="">All Ratings</option>
<option value="5">5 Stars</option>
<option value="4">4+ Stars</option>
<option value="3">3+ Stars</option>
<option value="2">2+ Stars</option>
<option value="1">1+ Stars</option>
</select>
</div>

<div id="grid" class="grid">
<div class="empty">Loading testimonials...</div>
</div>

</main>

<footer>
<strong>LetsStudy Pro</strong><br><br>
THE DIGITAL ECOSYSTEM — Learn. Build. Work. Grow.
<br><br>
© 2026 LetsStudy Pro. All rights reserved.
</footer>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const category=document.getElementById("category");
const rating=document.getElementById("rating");

let testimonials=[];

const val=(...values)=>
values.find(v=>
v!==undefined &&
v!==null &&
String(v).trim()
)||"";

function getRating(t){

return Number(
t.rating ??
t.stars ??
t.score ??
t.reviewRating ??
0
);

}

function stars(value){

const r=Math.max(0,Math.min(5,Math.round(value)));

return "★".repeat(r)+"☆".repeat(5-r);

}

function render(){

const q=search.value.toLowerCase().trim();
const cat=category.value.toLowerCase();
const minRating=Number(rating.value||0);

const filtered=testimonials.filter(t=>{

const name=val(
t.name,
t.userName,
t.fullName,
t.author,
t.displayName,
"Community Member"
);

const text=val(
t.testimonial,
t.quote,
t.review,
t.message,
t.content,
t.description
);

const categoryValue=Array.isArray(t.category)
?t.category.join(" ")
:String(t.category||"");

const searchable=`
${name}
${text}
${categoryValue}
${t.role||""}
${t.course||""}
${t.service||""}
`.toLowerCase();

const r=getRating(t);

return (!q||searchable.includes(q))
&&(!cat||categoryValue.toLowerCase().includes(cat))
&&(!minRating||r>=minRating);

});

if(!filtered.length){

grid.innerHTML=`
<div class="empty">
No testimonials found.
</div>`;

return;

}

grid.innerHTML=filtered.map(t=>{

const name=val(
t.name,
t.userName,
t.fullName,
t.author,
t.displayName,
"Community Member"
);

const quote=val(
t.testimonial,
t.quote,
t.review,
t.message,
t.content,
t.description,
"Great experience with LetsStudy Pro."
);

const image=val(
t.image,
t.avatar,
t.photo,
t.profileImage,
t.imageUrl
);

const role=val(
t.role,
t.position,
t.occupation,
t.userRole
);

const cat=val(
t.category,
t.type,
"Community"
);

const r=getRating(t);

return `
<article class="card">

<div class="user">

${
image
?`
<img class="avatar"
src="${image}"
alt="${name}"
onerror="this.style.visibility='hidden'">
`
:`
<div class="avatar"></div>
`
}

<div>
<div class="name">${name}</div>
${role?`<div class="role">${role}</div>`:""}
</div>

</div>

<div class="stars" aria-label="${r} out of 5 stars">
${stars(r)}
</div>

<span class="category">${cat}</span>

<p class="quote">
“${quote}”
</p>

<a class="view"
href="testimonial-details.html?id=${encodeURIComponent(t.id)}">
View Testimonial
</a>

</article>
`;

}).join("");

}

async function load(){

try{

const snap=await getDocs(
collection(db,"testimonials")
);

testimonials=snap.docs.map(d=>({
id:d.id,
...d.data()
}));

const categories=new Set();

testimonials.forEach(t=>{

if(Array.isArray(t.category)){

t.category.forEach(c=>{
if(c)categories.add(c);
});

}else if(t.category){

categories.add(t.category);

}

});

[...categories]
.sort()
.forEach(c=>{

const option=document.createElement("option");

option.value=String(c).toLowerCase();
option.textContent=c;

category.appendChild(option);

});

render();

}catch(error){

console.error(error);

grid.innerHTML=`
<div class="empty">
Unable to load testimonials right now.
</div>
`;

}

}

search.addEventListener("input",render);
category.addEventListener("change",render);
rating.addEventListener("change",render);

load();

</script>

</body>
</html>
