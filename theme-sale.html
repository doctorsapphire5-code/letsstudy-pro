<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Theme Sale</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  width:min(1150px,94%);
  margin:auto;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:15px 0;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#2563eb;
  font-size:20px;
  font-weight:900;
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.link{
  color:#64748b;
  text-decoration:none;
  font-size:11px;
  font-weight:800;
}

.cart-btn{
  background:#172033;
  color:#fff;
  position:relative;
}

.cart-count{
  position:absolute;
  top:-7px;
  right:-7px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#ef4444;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
}

main{
  padding:30px 0 60px;
}

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  font-size:31px;
  margin-bottom:8px;
}

.hero p{
  color:#64748b;
  font-size:12px;
}

.toolbar{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:12px;
  display:flex;
  gap:9px;
  margin-bottom:20px;
}

.search{
  flex:1;
}

.search input,
select{
  width:100%;
  padding:10px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none;
  font-size:11px;
  background:#fff;
}

.toolbar select{
  width:160px;
}

.layout{
  display:grid;
  grid-template-columns:1fr 290px;
  gap:18px;
}

.themes{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  overflow:hidden;
}

.preview{
  height:190px;
  position:relative;
  padding:14px;
}

.preview-browser{
  height:100%;
  background:#fff;
  border-radius:7px 7px 0 0;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(15,23,42,.12);
}

.browser-top{
  height:20px;
  background:#f8fafc;
  display:flex;
  align-items:center;
  gap:4px;
  padding-left:8px;
}

.dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#cbd5e1;
}

.mock-nav{
  height:28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  border-bottom:1px solid #f1f5f9;
}

.mock-logo{
  width:50px;
  height:6px;
  border-radius:4px;
}

.mock-links{
  width:65px;
  height:4px;
  background:#cbd5e1;
  border-radius:4px;
}

.mock-hero{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.mock-title{
  width:90px;
  height:9px;
  background:#172033;
  border-radius:5px;
}

.mock-content{
  display:flex;
  gap:5px;
  padding:9px;
}

.mock-box{
  height:35px;
  flex:1;
  border:1px solid #e2e8f0;
  border-radius:4px;
}

.badge{
  position:absolute;
  top:10px;
  right:10px;
  padding:5px 8px;
  border-radius:20px;
  background:#ef4444;
  color:#fff;
  font-size:8px;
  font-weight:900;
}

.theme-info{
  padding:16px;
}

.theme-name{
  font-size:15px;
  font-weight:900;
  margin-bottom:5px;
}

.theme-description{
  color:#64748b;
  font-size:10px;
  line-height:1.5;
  min-height:31px;
}

.theme-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:13px;
  padding-top:12px;
  border-top:1px solid #eef2f7;
}

.price{
  font-size:16px;
  font-weight:900;
}

.old-price{
  color:#94a3b8;
  text-decoration:line-through;
  font-size:10px;
  margin-left:4px;
}

.buy{
  background:#2563eb;
  color:#fff;
  padding:9px 12px;
  font-size:10px;
}

.cart{
  background:#f1f5f9;
  color:#334155;
  padding:9px 10px;
  font-size:10px;
}

.actions{
  display:flex;
  gap:5px;
}

/* CART */

.sidebar{
  position:sticky;
  top:15px;
  height:max-content;
}

.cart-card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:18px;
}

.cart-card h2{
  font-size:16px;
  margin-bottom:6px;
}

.cart-desc{
  color:#64748b;
  font-size:10px;
  margin-bottom:15px;
}

.cart-items{
  display:flex;
  flex-direction:column;
  gap:10px;
  max-height:310px;
  overflow:auto;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:10px;
  background:#f8fafc;
  border-radius:8px;
}

.item-name{
  font-size:10px;
  font-weight:800;
}

.item-price{
  font-size:10px;
  font-weight:900;
}

.remove{
  border:0;
  background:none;
  color:#ef4444;
  cursor:pointer;
  font-size:10px;
}

.empty-cart{
  color:#94a3b8;
  text-align:center;
  padding:25px 10px;
  font-size:10px;
}

.total{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid #e2e8f0;
  font-weight:900;
  font-size:13px;
}

.checkout{
  width:100%;
  margin-top:12px;
  background:#16a34a;
  color:#fff;
  padding:12px;
}

.history{
  margin-top:18px;
}

.history h2{
  font-size:14px;
  margin-bottom:12px;
}

.purchase{
  padding:10px 0;
  border-bottom:1px solid #eef2f7;
  font-size:10px;
}

.purchase strong{
  display:block;
  margin-bottom:4px;
}

.purchase span{
  color:#64748b;
}

.message{
  display:none;
  position:fixed;
  right:20px;
  bottom:20px;
  padding:13px 16px;
  background:#172033;
  color:#fff;
  border-radius:9px;
  font-size:11px;
  font-weight:800;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
  z-index:50;
}

.message.show{
  display:block;
}

.no-results{
  grid-column:1/-1;
  text-align:center;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:50px 20px;
  color:#64748b;
  font-size:11px;
}

@media(max-width:850px){
  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:static;
  }

  .themes{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .toolbar{
    flex-direction:column;
  }

  .toolbar select{
    width:100%;
  }

  .link{
    display:none;
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">
🎨 Theme Sale
</div>

<div class="nav-actions">

<a
href="website-dashboard.html"
class="link">
Dashboard
</a>

<button
class="cart-btn"
id="cartButton">
🛒 Cart

<span
class="cart-count"
id="cartCount">
0
</span>

</button>

</div>

</div>
</header>


<main class="container">

<section class="hero">

<h1>Premium Website Themes</h1>

<p>
Choose a professional theme and customize it for your website.
</p>

</section>


<!-- FILTER -->

<section class="toolbar">

<div class="search">

<input
id="search"
placeholder="Search themes...">

</div>

<select id="category">

<option value="all">
All Categories
</option>

<option value="business">
Business
</option>

<option value="portfolio">
Portfolio
</option>

<option value="store">
Store
</option>

<option value="restaurant">
Restaurant
</option>

<option value="agency">
Agency
</option>

</select>

<select id="sort">

<option value="popular">
Popular
</option>

<option value="low">
Price: Low to High
</option>

<option value="high">
Price: High to Low
</option>

<option value="new">
Newest
</option>

</select>

</section>


<div class="layout">

<section
class="themes"
id="themes">
</section>


<!-- CART -->

<aside class="sidebar">

<div class="cart-card">

<h2>Your Cart</h2>

<p class="cart-desc">
Selected themes ready for checkout.
</p>

<div
class="cart-items"
id="cartItems">
</div>

<div class="total">

<span>Total</span>

<span id="total">
$0.00
</span>

</div>

<button
class="checkout"
id="checkout">
Checkout
</button>

</div>


<div class="cart-card history">

<h2>Purchase History</h2>

<div id="history"></div>

</div>

</aside>

</div>

</main>


<div
class="message"
id="message">
</div>


<script>

const themes = [

{
id:"theme-1",
name:"Modern Business",
category:"business",
price:29,
oldPrice:49,
color:"#2563eb",
description:"Clean professional theme for modern businesses.",
rating:4.9,
sales:1240
},

{
id:"theme-2",
name:"Creative Studio",
category:"portfolio",
price:24,
oldPrice:39,
color:"#7c3aed",
description:"Creative portfolio design for designers and agencies.",
rating:4.8,
sales:980
},

{
id:"theme-3",
name:"Shop Pro",
category:"store",
price:39,
oldPrice:59,
color:"#16a34a",
description:"Modern e-commerce theme built for online stores.",
rating:4.9,
sales:870
},

{
id:"theme-4",
name:"Food House",
category:"restaurant",
price:19,
oldPrice:35,
color:"#ea580c",
description:"Elegant restaurant theme with menu-focused layout.",
rating:4.7,
sales:710
},

{
id:"theme-5",
name:"Agency X",
category:"agency",
price:34,
oldPrice:54,
color:"#db2777",
description:"Bold agency theme for digital and creative teams.",
rating:4.8,
sales:640
},

{
id:"theme-6",
name:"Minimal Pro",
category:"business",
price:27,
oldPrice:45,
color:"#111827",
description:"Minimal and elegant design for professional brands.",
rating:4.6,
sales:520
}

];


let cart =
JSON.parse(
localStorage.getItem(
"themeCart"
) || "[]"
);


let purchases =
JSON.parse(
localStorage.getItem(
"themePurchases"
) || "[]"
);


/* RENDER */

function render(){

const container =
document.getElementById(
"themes"
);

const query =
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

const category =
document.getElementById(
"category"
).value;

const sort =
document.getElementById(
"sort"
).value;


let list =
themes.filter(
theme => {

const matchSearch =
theme.name
.toLowerCase()
.includes(query);

const matchCategory =
category === "all" ||
theme.category === category;

return (
matchSearch &&
matchCategory
);

});


if(sort === "low"){

list.sort(
(a,b) =>
a.price-b.price
);

}

if(sort === "high"){

list.sort(
(a,b) =>
b.price-a.price
);

}

if(sort === "popular"){

list.sort(
(a,b) =>
b.sales-a.sales
);

}

if(sort === "new"){

list.sort(
(a,b) =>
b.id.localeCompare(a.id)
);

}


container.innerHTML = "";


if(!list.length){

container.innerHTML = `

<div class="no-results">

No themes found.

</div>

`;

return;

}


list.forEach(
theme => {

const card =
document.createElement(
"article"
);

card.className =
"card";


card.innerHTML = `

<div
class="preview"
style="background:${theme.color}18">

<div class="badge">
SALE
</div>

<div class="preview-browser">

<div class="browser-top">

<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>

<div class="mock-nav">

<div
class="mock-logo"
style="background:${theme.color}">
</div>

<div class="mock-links"></div>

</div>

<div
class="mock-hero"
style="background:${theme.color}15">

<div class="mock-title"></div>

</div>

<div class="mock-content">

<div class="mock-box"></div>
<div class="mock-box"></div>
<div class="mock-box"></div>

</div>

</div>

</div>


<div class="theme-info">

<div class="theme-name">
${escapeHTML(theme.name)}
</div>

<div class="theme-description">
${escapeHTML(theme.description)}
</div>

<div
style="
font-size:9px;
color:#64748b;
margin-top:7px;">
★ ${theme.rating}
· ${format(theme.sales)} sales
</div>


<div class="theme-bottom">

<div>

<span class="price">
$${theme.price}
</span>

<span class="old-price">
$${theme.oldPrice}
</span>

</div>


<div class="actions">

<button
class="cart"
onclick="addToCart('${theme.id}')">
🛒
</button>

<button
class="buy"
onclick="buyNow('${theme.id}')">
Buy Now
</button>

</div>

</div>

</div>

`;

container.appendChild(card);

});

}


/* CART */

function addToCart(
id
){

const theme =
themes.find(
t => t.id === id
);

if(!theme)
return;


if(
cart.some(
item => item.id === id
)
){

showMessage(
"Theme is already in your cart."
);

return;

}


cart.push(theme);

saveCart();

renderCart();

showMessage(
theme.name +
" added to cart."
);

}


/* BUY NOW */

function buyNow(
id
){

const theme =
themes.find(
t => t.id === id
);

if(!theme)
return;


const confirmed =
confirm(
`Buy "${theme.name}" for $${theme.price}?`
);


if(!confirmed)
return;


completePurchase(
theme
);

}


/* CHECKOUT */

document.getElementById(
"checkout"
).addEventListener(
"click",
() => {

if(!cart.length){

showMessage(
"Your cart is empty."
);

return;

}


const confirmed =
confirm(
"Complete purchase for $" +
totalPrice().toFixed(2) +
"?");

if(!confirmed)
return;


cart.forEach(
theme =>
completePurchase(
theme
)
);

cart = [];

saveCart();

renderCart();

showMessage(
"Purchase completed successfully!"
);

});


/* COMPLETE PURCHASE */

function completePurchase(
theme
){

purchases.unshift({

id:Date.now() +
"-" +
theme.id,

themeId:theme.id,

name:theme.name,

price:theme.price,

date:
new Date().toISOString()

});


localStorage.setItem(
"themePurchases",
JSON.stringify(
purchases
)
);


showMessage(
theme.name +
" purchased successfully."
);

}


/* CART RENDER */

function renderCart(){

const container =
document.getElementById(
"cartItems"
);

const count =
document.getElementById(
"cartCount"
);

count.textContent =
cart.length;


container.innerHTML = "";


if(!cart.length){

container.innerHTML = `

<div class="empty-cart">

🛒<br><br>
Your cart is empty.

</div>

`;

document.getElementById(
"total"
).textContent =
"$0.00";

return;

}


cart.forEach(
item => {

const row =
document.createElement(
"div"
);

row.className =
"cart-item";

row.innerHTML = `

<div>

<div class="item-name">
${escapeHTML(item.name)}
</div>

<div class="item-price">
$${item.price.toFixed(2)}
</div>

</div>

<button
class="remove"
onclick="removeFromCart('${item.id}')">
✕
</button>

`;

container.appendChild(row);

});


document.getElementById(
"total"
).textContent =
"$" +
totalPrice().toFixed(2);

}


/* REMOVE */

function removeFromCart(
id
){

cart =
cart.filter(
item => item.id !== id
);

saveCart();

renderCart();

}


/* TOTAL */

function totalPrice(){

return cart.reduce(
(sum,item) =>
sum + Number(item.price),
0
);

}


/* SAVE CART */

function saveCart(){

localStorage.setItem(
"themeCart",
JSON.stringify(
cart
)
);

}


/* HISTORY */

function renderHistory(){

const container =
document.getElementById(
"history"
);

container.innerHTML = "";


if(!purchases.length){

container.innerHTML = `

<div
style="
color:#94a3b8;
font-size:10px;">
No purchases yet.
</div>

`;

return;

}


purchases
.slice(0,5)
.forEach(
purchase => {

const date =
new Date(
purchase.date
).toLocaleDateString();


const item =
document.createElement(
"div"
);

item.className =
"purchase";

item.innerHTML = `

<strong>
${escapeHTML(
purchase.name
)}
</strong>

<span>
$${purchase.price.toFixed(2)}
· ${date}
</span>

`;

container.appendChild(item);

});

}


/* MESSAGE */

function showMessage(
text
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.classList.add(
"show"
);

setTimeout(
() => {

box.classList.remove(
"show"
);

},
2500
);

}


/* EVENTS */

document.getElementById(
"search"
).addEventListener(
"input",
render
);

document.getElementById(
"category"
).addEventListener(
"change",
render
);

document.getElementById(
"sort"
).addEventListener(
"change",
render
);


/* FORMAT */

function format(
number
){

return Number(
number
).toLocaleString();

}


/* ESCAPE */

function escapeHTML(
value
){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* INIT */

render();
renderCart();
renderHistory();

</script>

</body>
</html>
