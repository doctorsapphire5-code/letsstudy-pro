<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Themes</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
.container{
  width:min(1150px,94%);
  margin:auto
}
header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:15px 0
}
.nav{
  display:flex;
  align-items:center;
  justify-content:space-between
}
.logo{
  color:#2563eb;
  font-size:20px;
  font-weight:900
}
.actions{
  display:flex;
  gap:7px
}
.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
  text-decoration:none
}
.primary{background:#2563eb;color:#fff}
.gray{background:#f1f5f9;color:#334155}
main{padding:30px 0 60px}
.hero{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-bottom:22px
}
h1{
  font-size:30px;
  margin-bottom:6px
}
.subtitle{
  color:#64748b;
  font-size:11px
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px
}
.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:16px
}
.stat-label{
  color:#64748b;
  font-size:8px;
  margin-bottom:6px
}
.stat-value{
  font-size:22px;
  font-weight:900
}
.toolbar{
  display:flex;
  gap:8px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:12px;
  margin-bottom:18px
}
.search{flex:1}
input,select{
  width:100%;
  padding:10px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none;
  font-size:10px
}
select{width:160px}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px
}
.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  overflow:hidden
}
.preview{
  height:190px;
  padding:13px;
  position:relative
}
.browser{
  height:100%;
  background:#fff;
  border-radius:7px;
  overflow:hidden;
  box-shadow:0 5px 15px #0002
}
.browser-top{
  height:19px;
  background:#f8fafc;
  display:flex;
  align-items:center;
  gap:4px;
  padding-left:8px
}
.dot{
  width:5px;
  height:5px;
  background:#cbd5e1;
  border-radius:50%
}
.fake-nav{
  height:28px;
  border-bottom:1px solid #eef2f7;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 9px
}
.fake-logo{
  width:43px;
  height:6px;
  border-radius:5px
}
.fake-links{
  width:60px;
  height:4px;
  background:#cbd5e1;
  border-radius:5px
}
.fake-hero{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center
}
.fake-title{
  width:80px;
  height:8px;
  background:#172033;
  border-radius:5px
}
.fake-cards{
  display:flex;
  gap:5px;
  padding:8px
}
.fake-card{
  height:30px;
  flex:1;
  border:1px solid #e2e8f0;
  border-radius:4px
}
.badge{
  position:absolute;
  top:9px;
  right:9px;
  padding:5px 7px;
  border-radius:20px;
  background:#dcfce7;
  color:#166534;
  font-size:7px;
  font-weight:900
}
.info{
  padding:15px
}
.name{
  font-size:14px;
  font-weight:900;
  margin-bottom:5px
}
.description{
  min-height:28px;
  color:#64748b;
  font-size:9px;
  line-height:1.5
}
.meta{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #eef2f7;
  margin-top:11px;
  padding-top:10px;
  font-size:8px;
  color:#64748b
}
.card-actions{
  display:flex;
  gap:5px;
  margin-top:12px
}
.card-actions button{
  flex:1;
  border:0;
  border-radius:7px;
  padding:9px 5px;
  cursor:pointer;
  font-size:8px;
  font-weight:900
}
.preview-btn{
  background:#f1f5f9;
  color:#334155
}
.details-btn{
  background:#eff6ff;
  color:#1d4ed8
}
.install-btn{
  background:#2563eb;
  color:#fff
}
.empty{
  display:none;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:55px 20px;
  text-align:center
}
.empty-icon{font-size:40px}
.empty h2{
  font-size:18px;
  margin:10px 0 6px
}
.empty p{
  color:#64748b;
  font-size:10px;
  margin-bottom:15px
}
.message{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#172033;
  color:#fff;
  padding:11px 15px;
  border-radius:8px;
  font-size:9px;
  font-weight:800;
  display:none;
  z-index:30
}
.message.show{display:block}
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .hero{
    align-items:start;
    flex-direction:column;
    gap:12px
  }
  .toolbar{flex-direction:column}
  select{width:100%}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">🎨 Themes</div>

<div class="actions">
<a
href="theme-builder.html"
class="btn gray">
Theme Builder
</a>

<a
href="theme-upload.html"
class="btn primary">
+ Upload Theme
</a>
</div>

</div>
</header>


<main class="container">

<section class="hero">

<div>
<h1>Theme Library</h1>
<p class="subtitle">
Discover, preview, install and manage website themes.
</p>
</div>

</section>


<section class="stats">

<div class="stat">
<div class="stat-label">TOTAL THEMES</div>
<div id="total" class="stat-value">0</div>
</div>

<div class="stat">
<div class="stat-label">INSTALLED</div>
<div id="installed" class="stat-value">0</div>
</div>

<div class="stat">
<div class="stat-label">PUBLISHED</div>
<div id="published" class="stat-value">0</div>
</div>

<div class="stat">
<div class="stat-label">MY THEMES</div>
<div id="mine" class="stat-value">0</div>
</div>

</section>


<section class="toolbar">

<div class="search">
<input
id="search"
placeholder="Search themes...">
</div>

<select id="category">
<option value="all">All Categories</option>
<option value="Business">Business</option>
<option value="Portfolio">Portfolio</option>
<option value="Store">Store</option>
<option value="Agency">Agency</option>
<option value="Education">Education</option>
<option value="Blog">Blog</option>
</select>

<select id="sort">
<option value="newest">Newest</option>
<option value="name">Name</option>
<option value="popular">Popular</option>
</select>

</section>


<section
id="grid"
class="grid">
</section>


<section
id="empty"
class="empty">

<div class="empty-icon">🎨</div>

<h2>No themes found</h2>

<p>
Try another search or upload your own theme.
</p>

<a
href="theme-upload.html"
class="btn primary">
Upload Theme
</a>

</section>

</main>


<div
id="message"
class="message">
</div>


<script>

/* THEME DATA */

const defaultThemes=[

{
 id:"modern-business",
 name:"Modern Business",
 category:"Business",
 description:"Clean professional theme for modern businesses and companies.",
 version:"1.0.0",
 author:"Theme Studio",
 price:0,
 sales:124,
 color:"#2563eb",
 status:"published",
 createdAt:"2026-08-01"
},

{
 id:"creative-portfolio",
 name:"Creative Portfolio",
 category:"Portfolio",
 description:"Elegant portfolio theme for designers, developers and creatives.",
 version:"1.2.0",
 author:"Creative Lab",
 price:19,
 sales:87,
 color:"#7c3aed",
 status:"published",
 createdAt:"2026-08-03"
},

{
 id:"online-store",
 name:"Online Store",
 category:"Store",
 description:"Responsive ecommerce theme for products and online shops.",
 version:"2.0.0",
 author:"Commerce Team",
 price:29,
 sales:156,
 color:"#059669",
 status:"published",
 createdAt:"2026-08-05"
},

{
 id:"startup",
 name:"Startup",
 category:"Business",
 description:"Modern landing page for startups and growing companies.",
 version:"1.1.0",
 author:"Startup Studio",
 price:0,
 sales:64,
 color:"#ea580c",
 status:"published",
 createdAt:"2026-08-07"
}

];


/* LOAD USER THEMES */

let userThemes=
JSON.parse(
localStorage.getItem("themeUploads")||"[]"
);


/* CONVERT USER THEMES */

userThemes=userThemes.map(theme=>({

id:theme.id||("user_"+Date.now()+Math.random()),

name:theme.name||"My Theme",

category:theme.category||"Business",

description:
theme.description||"Custom website theme.",

version:theme.version||"1.0.0",

author:theme.author||"You",

price:Number(theme.price||0),

sales:Number(theme.sales||0),

color:theme.color||"#2563eb",

status:theme.status||"published",

createdAt:
theme.createdAt||new Date().toISOString(),

mine:true

}));


let themes=[
...userThemes,
...defaultThemes
];


/* INSTALLED */

function getInstalled(){

return JSON.parse(
localStorage.getItem("installedTheme")||"null"
);

}


/* RENDER */

function render(){

const query=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const category=
document.getElementById("category")
.value;

const sort=
document.getElementById("sort")
.value;


let list=themes.filter(theme=>{

const text=(
theme.name+" "+
theme.category+" "+
theme.description
).toLowerCase();

const searchMatch=
text.includes(query);

const categoryMatch=
category==="all" ||
theme.category===category;

return searchMatch&&categoryMatch;

});


if(sort==="newest"){

list.sort(
(a,b)=>
new Date(b.createdAt)-
new Date(a.createdAt)
);

}

if(sort==="name"){

list.sort(
(a,b)=>
a.name.localeCompare(b.name)
);

}

if(sort==="popular"){

list.sort(
(a,b)=>
Number(b.sales)-Number(a.sales)
);

}


const grid=
document.getElementById("grid");

grid.innerHTML="";


if(!list.length){

grid.style.display="none";

document.getElementById(
"empty"
).style.display="block";

}else{

grid.style.display="grid";

document.getElementById(
"empty"
).style.display="none";

list.forEach(
theme=>
grid.appendChild(
createCard(theme)
)
);

}

updateStats();

}


/* CARD */

function createCard(theme){

const card=
document.createElement("article");

card.className="card";

const installed=
getInstalled();

const isInstalled=
installed &&
installed.theme &&
installed.theme.id===theme.id;

card.innerHTML=`

<div
class="preview"
style="background:${safe(theme.color)}18">

<div class="badge">
${isInstalled?"INSTALLED":"AVAILABLE"}
</div>

<div class="browser">

<div class="browser-top">
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>

<div class="fake-nav">

<div
class="fake-logo"
style="background:${safe(theme.color)}">
</div>

<div class="fake-links"></div>

</div>

<div class="fake-hero">

<div class="fake-title"></div>

</div>

<div class="fake-cards">
<div class="fake-card"></div>
<div class="fake-card"></div>
<div class="fake-card"></div>
</div>

</div>

</div>


<div class="info">

<div class="name">
${safe(theme.name)}
</div>

<div class="description">
${safe(theme.description)}
</div>

<div class="meta">

<span>
${safe(theme.category)}
</span>

<span>
${Number(theme.sales||0).toLocaleString()} sales
</span>

</div>

<div class="meta">

<span>
v${safe(theme.version)}
</span>

<span>
${theme.price>0
?"$"+Number(theme.price).toFixed(2)
:"Free"}
</span>

</div>


<div class="card-actions">

<button
class="preview-btn"
onclick="preview('${escapeJS(theme.id)}')">
Preview
</button>

<button
class="details-btn"
onclick="details('${escapeJS(theme.id)}')">
Details
</button>

<button
class="install-btn"
onclick="install('${escapeJS(theme.id)}')">
${isInstalled?"Activate":"Install"}
</button>

</div>

</div>
`;

return card;

}


/* STATS */

function updateStats(){

const installed=
getInstalled();

document.getElementById(
"total"
).textContent=
themes.length;

document.getElementById(
"published"
).textContent=
themes.filter(
t=>t.status==="published"
).length;

document.getElementById(
"mine"
).textContent=
themes.filter(
t=>t.mine
).length;

document.getElementById(
"installed"
).textContent=
installed?1:0;

}


/* PREVIEW */

function preview(id){

const theme=
themes.find(t=>t.id===id);

if(!theme)return;

localStorage.setItem(
"previewTheme",
JSON.stringify(theme)
);

window.location.href=
"theme-preview.html";

}


/* DETAILS */

function details(id){

const theme=
themes.find(t=>t.id===id);

if(!theme)return;

localStorage.setItem(
"selectedTheme",
JSON.stringify(theme)
);

window.location.href=
"theme-details.html";

}


/* INSTALL */

function install(id){

const theme=
themes.find(t=>t.id===id);

if(!theme)return;

localStorage.setItem(
"selectedTheme",
JSON.stringify(theme)
);

window.location.href=
"theme-install.html";

}


/* SEARCH */

document.getElementById(
"search"
).addEventListener(
"input",
render
);

document.getElementById(
"category"
).addEventListener(
"change",
render
);

document.getElementById(
"sort"
).addEventListener(
"change",
render
);


/* HELPERS */

function safe(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeJS(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


/* START */

render();

</script>

</body>
</html>
