<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  push,
  set,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"

};


const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById(
  "loading"
);

const loginBox =
document.getElementById(
  "loginBox"
);

const ticketPage =
document.getElementById(
  "ticketPage"
);

const notFound =
document.getElementById(
  "notFound"
);

const alertBox =
document.getElementById(
  "alert"
);

const messagesBox =
document.getElementById(
  "messages"
);

const replyArea =
document.getElementById(
  "replyArea"
);

const replyForm =
document.getElementById(
  "replyForm"
);

const replyText =
document.getElementById(
  "replyText"
);

const replyBtn =
document.getElementById(
  "replyBtn"
);


/* =========================
   GET TICKET ID
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const ticketId =
params.get(
  "id"
);


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      loading.style.display =
      "none";

      loginBox.style.display =
      "block";

      return;

    }


    if(!ticketId){

      loading.style.display =
      "none";

      notFound.style.display =
      "block";

      return;

    }


    loadTicket(
      user,
      ticketId
    );

  }
);


/* =========================
   LOAD TICKET
========================= */

async function loadTicket(
user,
id
){

  try{

    const snapshot =
    await get(
      ref(
        db,
        "supportTickets/" +
        id
      )
    );


    loading.style.display =
    "none";


    if(
      !snapshot.exists()
    ){

      notFound.style.display =
      "block";

      return;

    }


    const ticket =
    snapshot.val();


    /*
      SECURITY CHECK

      User can only see
      their own ticket.
    */

    if(
      ticket.userId !==
      user.uid
    ){

      notFound.style.display =
      "block";

      return;

    }


    renderTicket(
      ticket,
      id
    );


  }catch(error){

    console.error(
      "Ticket error:",
      error
    );


    loading.style.display =
    "none";


    showAlert(
      "Unable to load this ticket. Please try again.",
      "error"
    );

  }

}


/* =========================
   RENDER TICKET
========================= */

function renderTicket(
ticket,
id
){

  ticketPage.style.display =
  "block";


  document.getElementById(
    "ticketId"
  ).textContent =
  "#" +
  (
    ticket.ticketId ||
    id
  );


  document.getElementById(
    "ticketTitle"
  ).textContent =
  ticket.subject ||
  "Support Request";


  document.getElementById(
    "ticketMeta"
  ).textContent =
  (
    ticket.category ||
    "General"
  ) +
  " · Created " +
  formatDate(
    ticket.createdAt
  );


  document.getElementById(
    "description"
  ).textContent =
  ticket.description ||
  "No description provided.";


  renderBadges(
    ticket
  );


  renderMessages(
    ticket,
    id
  );


  const status =
  String(
    ticket.status ||
    "open"
  ).toLowerCase();


  if(
    status === "closed" ||
    status === "resolved"
  ){

    replyArea.innerHTML = `

      <div class="closed-box">

        This ticket has been
        <strong>
        ${escapeHTML(status)}
        </strong>.

        If you still need help,
        please create a new ticket.

        <br><br>

        <a
          href="/contact.html"
          style="
            color:#2563eb;
            font-weight:800;
          ">

          Create New Ticket

        </a>

      </div>

    `;

  }

}


/* =========================
   BADGES
========================= */

function renderBadges(
ticket
){

  const status =
  String(
    ticket.status ||
    "open"
  ).toLowerCase();


  const priority =
  String(
    ticket.priority ||
    "normal"
  ).toLowerCase();


  const statusClass =
  "status-" +
  (
    [
      "open",
      "pending",
      "resolved",
      "closed"
    ].includes(status)
    ? status
    : "open"
  );


  const priorityClass =
  "priority-" +
  (
    [
      "normal",
      "high",
      "urgent"
    ].includes(priority)
    ? priority
    : "normal"
  );


  document.getElementById(
    "badges"
  ).innerHTML = `

    <span class="badge ${statusClass}">

      ${escapeHTML(
        capitalize(status)
      )}

    </span>


    <span class="badge ${priorityClass}">

      ${escapeHTML(
        capitalize(priority)
      )}

    </span>

  `;

}


/* =========================
   LOAD CONVERSATION
========================= */

function renderMessages(
ticket,
id
){

  messagesBox.innerHTML =
  "";


  /*
    Original request
  */

  addMessage(
    "You",
    ticket.description ||
    "Support request",
    ticket.createdAt,
    false
  );


  /*
    Support replies

    Expected structure:

    supportTickets/
      ticketId/
        replies/
          replyId/
            senderType
            senderName
            message
            createdAt
  */

  if(
    ticket.replies &&
    typeof ticket.replies ===
    "object"
  ){

    const replies =
    Object.entries(
      ticket.replies
    )
    .map(
      ([replyId,reply]) => ({

        replyId,

        ...reply

      })
    )
    .sort(
      (a,b) =>
      getTime(
        a.createdAt
      ) -
      getTime(
        b.createdAt
      )
    );


    replies.forEach(
      reply => {

        const isSupport =
        reply.senderType ===
        "support" ||
        reply.senderType ===
        "admin";


        addMessage(
          reply.senderName ||
          (
            isSupport
            ? "LetsStudy Pro Support"
            : "You"
          ),

          reply.message ||
          "",

          reply.createdAt,

          isSupport

        );

      }
    );

  }


  if(
    messagesBox.children.length ===
    0
  ){

    messagesBox.innerHTML = `

      <div class="empty">

        No conversation messages yet.

      </div>

    `;

  }

}


/* =========================
   MESSAGE
========================= */

function addMessage(
sender,
text,
date,
support
){

  const item =
  document.createElement(
    "div"
  );


  item.className =
  "message" +
  (
    support
    ? " support"
    : ""
  );


  const initials =
  support
  ? "LS"
  : getInitials(
      sender
    );


  item.innerHTML = `

    <div class="avatar">

      ${escapeHTML(
        initials
      )}

    </div>


    <div class="message-content">

      <div class="message-head">

        <span class="sender">

          ${escapeHTML(
            sender
          )}

        </span>

        <span class="message-time">

          ${formatDate(
            date
          )}

        </span>

      </div>


      <div class="message-body">

        ${escapeHTML(
          text
        )}

      </div>

    </div>

  `;


  messagesBox.appendChild(
    item
  );

}


/* =========================
   SEND REPLY
========================= */

replyForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const user =
    auth.currentUser;


    if(!user){

      showAlert(
        "Please login first.",
        "error"
      );

      return;

    }


    const text =
    replyText.value.trim();


    if(!text){

      showAlert(
        "Please write a reply.",
        "error"
      );

      return;

    }


    replyBtn.disabled =
    true;

    replyBtn.textContent =
    "Sending...";


    try{

      /*
        Verify ticket ownership
        before writing.
      */

      const ticketSnapshot =
      await get(
        ref(
          db,
          "supportTickets/" +
          ticketId
        )
      );


      if(
        !ticketSnapshot.exists()
      ){

        throw new Error(
          "Ticket not found"
        );

      }


      const ticket =
      ticketSnapshot.val();


      if(
        ticket.userId !==
        user.uid
      ){

        throw new Error(
          "Unauthorized"
        );

      }


      const status =
      String(
        ticket.status ||
        "open"
      ).toLowerCase();


      if(
        status === "closed" ||
        status === "resolved"
      ){

        throw new Error(
          "Ticket is closed"
        );

      }


      const replyRef =
      push(
        ref(
          db,
          "supportTickets/" +
          ticketId +
          "/replies"
        )
      );


      await set(
        replyRef,
        {

          replyId:
          replyRef.key,

          userId:
          user.uid,

          senderType:
          "student",

          senderName:
          user.displayName ||
          user.email ||
          "Student",

          message:
          text,

          createdAt:
          serverTimestamp()

        }
      );


      /*
        Change status back to open
        so support knows there is
        a new student response.
      */

      await set(
        ref(
          db,
          "supportTickets/" +
          ticketId +
          "/status"
        ),
        "open"
      );


      await set(
        ref(
          db,
          "supportTickets/" +
          ticketId +
          "/updatedAt"
        ),
        serverTimestamp()
      );


      replyText.value =
      "";


      showAlert(
        "Your reply was sent successfully.",
        "success"
      );


      /*
        Reload ticket
      */

      await loadTicket(
        user,
        ticketId
      );


    }catch(error){

      console.error(
        "Reply error:",
        error
      );


      showAlert(
        "Unable to send reply. Please try again.",
        "error"
      );

    }finally{

      replyBtn.disabled =
      false;

      replyBtn.textContent =
      "Send Reply";

    }

  }
);


/* =========================
   ALERT
========================= */

function showAlert(
text,
type
){

  alertBox.textContent =
  text;

  alertBox.className =
  "alert show " +
  type;


  setTimeout(
    () => {

      alertBox.classList.remove(
        "show"
      );

    },
    5000
  );

}


/* =========================
   DATE
========================= */

function getTime(
value
){

  if(
    typeof value ===
    "number"
  ){

    return value;

  }


  if(
    value &&
    typeof value ===
    "object" &&
    value.timestamp
  ){

    return value.timestamp;

  }


  const time =
  new Date(
    value || 0
  ).getTime();


  return Number.isNaN(time)
  ? 0
  : time;

}


function formatDate(
value
){

  const time =
  getTime(
    value
  );


  if(!time){
    return "Recently";
  }


  return new Date(
    time
  ).toLocaleString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   HELPERS
========================= */

function capitalize(
value
){

  const text =
  String(
    value ||
    ""
  );

  return text
  .charAt(0)
  .toUpperCase() +
  text.slice(1);

}


function getInitials(
name
){

  const parts =
  String(
    name ||
    "User"
  )
  .trim()
  .split(/\s+/);


  if(
    parts.length >= 2
  ){

    return (
      parts[0][0] +
      parts[1][0]
    ).toUpperCase();

  }


  return String(
    parts[0][0] ||
    "U"
  ).toUpperCase();

}


function escapeHTML(
value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

   MOBILE MENU
========================= */

<script>

document
.getElementById(
  "menuBtn"
)
.addEventListener(
  "click",
  () => {

    document
