<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Email Verification | Admin | Let'sStudy Pro</title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <meta
    name="description"
    content="Verify your Let'sStudy Pro administrator email."
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {

      margin: 0;

      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding: 18px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #eef4ff
        );

      color: #111827;
    }


    .card {

      width: 100%;
      max-width: 430px;

      padding: 28px;

      background: #ffffff;

      border:
        1px solid #e5e7eb;

      border-radius: 18px;

      box-shadow:
        0 15px 45px
        rgba(15,23,42,.08);

      text-align: center;
    }


    .icon {

      width: 64px;
      height: 64px;

      margin:
        0 auto 17px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background: #e8f0ff;

      font-size: 29px;
    }


    h1 {

      margin:
        0 0 8px;

      font-size: 25px;

      line-height: 1.2;
    }


    .description {

      margin:
        0 0 20px;

      color: #667085;

      font-size: 13px;

      line-height: 1.6;
    }


    .email {

      margin-bottom: 18px;

      padding: 12px;

      border-radius: 10px;

      background: #f8fafc;

      color: #344054;

      font-size: 13px;

      font-weight: 700;

      overflow-wrap: anywhere;
    }


    .status {

      display: none;

      margin-bottom: 16px;

      padding: 11px 13px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.5;
    }


    .status.show {
      display: block;
    }


    .error {

      background: #fef2f2;

      color: #b91c1c;

      border:
        1px solid #fecaca;
    }


    .success {

      background: #f0fdf4;

      color: #15803d;

      border:
        1px solid #bbf7d0;
    }


    .info {

      background: #eff6ff;

      color: #1d4ed8;

      border:
        1px solid #bfdbfe;
    }


    button {

      width: 100%;

      min-height: 49px;

      margin-top: 10px;

      border: 0;

      border-radius: 10px;

      background: #2563eb;

      color: #ffffff;

      font-size: 14px;

      font-weight: 750;

      cursor: pointer;
    }


    button:hover {
      background: #1d4ed8;
    }


    button:disabled {

      opacity: .6;

      cursor: not-allowed;
    }


    .secondary {

      background: #111827;
    }


    .secondary:hover {
      background: #1f2937;
    }


    .logout {

      margin-top: 17px;

      color: #667085;

      background: transparent;

      font-size: 12px;
    }


    .logout:hover {

      background: transparent;

      color: #111827;
    }


    .back {

      display: inline-block;

      margin-top: 16px;

      color: #2563eb;

      text-decoration: none;

      font-size: 12px;

      font-weight: 700;
    }


    .help {

      margin-top: 19px;

      padding-top: 17px;

      border-top:
        1px solid #e5e7eb;

      color: #98a2b3;

      font-size: 11px;

      line-height: 1.5;
    }


    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 23px 17px;
      }

      h1 {
        font-size: 23px;
      }

    }

  </style>

</head>


<body>

  <main class="card">


    <div
      class="icon"
      aria-hidden="true"
    >
      ✉️
    </div>


    <h1>
      Verify Your Email
    </h1>


    <p class="description">
      Please verify your administrator email
      address to secure your Let'sStudy Pro
      account.
    </p>


    <div
      id="email"
      class="email"
    >
      Checking account...
    </div>


    <div
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    ></div>


    <button
      id="sendButton"
      type="button"
    >
      Send Verification Email
    </button>


    <button
      id="checkButton"
      class="secondary"
      type="button"
    >
      I've Verified My Email
    </button>


    <button
      id="profileButton"
      class="secondary"
      type="button"
      style="display:none;"
    >
      Continue to Admin Profile
    </button>


    <button
      id="logoutButton"
      class="logout"
      type="button"
    >
      Sign Out
    </button>


    <a
      href="profile-admin.html"
      class="back"
    >
      ← Back to Admin Profile
    </a>


    <div class="help">

      Check your inbox and spam/junk folder.

      After clicking the verification link,
      return here and select
      "I've Verified My Email".

    </div>

  </main>



<script type="module">


  /* =========================================
     FIREBASE
  ========================================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    sendEmailVerification,
    reload,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  /* =========================================
     CONFIG
  ========================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"
  };


  /* =========================================
     INITIALIZE
  ========================================== */

  const app =
    initializeApp(
      firebaseConfig
    );


  const auth =
    getAuth(app);


  /* =========================================
     ELEMENTS
  ========================================== */

  const emailElement =
    document.getElementById(
      "email"
    );


  const status =
    document.getElementById(
      "status"
    );


  const sendButton =
    document.getElementById(
      "sendButton"
    );


  const checkButton =
    document.getElementById(
      "checkButton"
    );


  const profileButton =
    document.getElementById(
      "profileButton"
    );


  const logoutButton =
    document.getElementById(
      "logoutButton"
    );


  let currentUser = null;


  /* =========================================
     STATUS
  ========================================== */

  function showStatus(
    message,
    type = "info"
  ) {

    status.textContent =
      message;

    status.className =
      `status show ${type}`;
  }


  function clearStatus() {

    status.textContent = "";

    status.className =
      "status";
  }


  /* =========================================
     AUTH STATE
     
     NO AUTOMATIC REDIRECT
  ========================================== */

  onAuthStateChanged(
    auth,
    user => {


      currentUser =
        user || null;


      /* ---------------------------------------
         NO USER
         
         Stay on this page.
         DO NOT REDIRECT.
      --------------------------------------- */

      if (!user) {

        emailElement.textContent =
          "No administrator session";


        showStatus(
          "No administrator is currently signed in. Use the login page if you want to sign in.",
          "info"
        );


        sendButton.disabled =
          true;


        checkButton.disabled =
          true;


        profileButton.style.display =
          "none";


        return;
      }


      /* ---------------------------------------
         USER FOUND
      --------------------------------------- */

      emailElement.textContent =
        user.email ||
        "Administrator email";


      sendButton.disabled =
        false;


      checkButton.disabled =
        false;


      /* ---------------------------------------
         ALREADY VERIFIED
      --------------------------------------- */

      if (user.emailVerified) {

        showStatus(
          "Your email is already verified. You can continue to your admin profile.",
          "success"
        );


        sendButton.disabled =
          true;


        sendButton.textContent =
          "Email Already Verified";


        profileButton.style.display =
          "block";


      } else {

        showStatus(
          "Your email has not been verified yet.",
          "info"
        );


        sendButton.disabled =
          false;


        sendButton.textContent =
          "Send Verification Email";


        profileButton.style.display =
          "none";
      }

    }
  );


  /* =========================================
     SEND VERIFICATION EMAIL
  ========================================== */

  sendButton.addEventListener(
    "click",
    async () => {


      clearStatus();


      if (!currentUser) {

        showStatus(
          "No administrator session is available.",
          "error"
        );

        return;
      }


      if (currentUser.emailVerified) {

        showStatus(
          "Your email is already verified.",
          "success"
        );

        return;
      }


      sendButton.disabled =
        true;


      sendButton.textContent =
        "Sending...";


      try {


        await sendEmailVerification(
          currentUser
        );


        showStatus(
          "Verification email sent successfully. Check your inbox and spam folder.",
          "success"
        );


      } catch (error) {

        console.error(
          "Email verification error:",
          error
        );


        let message =
          "Unable to send verification email.";


        switch (error.code) {


          case "auth/too-many-requests":

            message =
              "Too many requests. Please wait before trying again.";

            break;


          case "auth/network-request-failed":

            message =
              "Network error. Check your internet connection.";

            break;


          case "auth/user-disabled":

            message =
              "This administrator account has been disabled.";

            break;

        }


        showStatus(
          message,
          "error"
        );


      } finally {


        if (
          currentUser &&
          currentUser.emailVerified
        ) {

          sendButton.disabled =
            true;

          sendButton.textContent =
            "Email Already Verified";

        } else {

          sendButton.disabled =
            false;

          sendButton.textContent =
            "Send Verification Email";
        }

      }

    }
  );


  /* =========================================
     CHECK EMAIL VERIFICATION
     
     MANUAL ACTION
  ========================================== */

  checkButton.addEventListener(
    "click",
    async () => {


      clearStatus();


      if (!currentUser) {

        showStatus(
          "No administrator session is available.",
          "error"
        );

        return;
      }


      checkButton.disabled =
        true;


      checkButton.textContent =
        "Checking...";


      try {


        await reload(
          currentUser
        );


        currentUser =
          auth.currentUser;


        if (
          currentUser &&
          currentUser.emailVerified
        ) {


          showStatus(
            "Email verified successfully. You may now continue to your admin profile.",
            "success"
          );


          sendButton.disabled =
            true;


          sendButton.textContent =
            "Email Already Verified";


          profileButton.style.display =
            "block";


        } else {


          showStatus(
            "Your email is not verified yet. Please open the verification email and click the verification link.",
            "info"
          );


          profileButton.style.display =
            "none";
        }


      } catch (error) {


        console.error(
          "Verification check error:",
          error
        );


        showStatus(
          "Could not check your email verification status.",
          "error"
        );

      } finally {


        checkButton.disabled =
          false;


        checkButton.textContent =
          "I've Verified My Email";

      }

    }
  );


  /* =========================================
     CONTINUE TO PROFILE
     
     MANUAL CLICK ONLY
  ========================================== */

  profileButton.addEventListener(
    "click",
    () => {


      profileButton.disabled =
        true;


      profileButton.textContent =
        "Opening Admin Profile...";


      window.location.href =
        "profile-admin.html";

    }
  );


  /* =========================================
     SIGN OUT
     
     MANUAL CLICK ONLY
  ========================================== */

  logoutButton.addEventListener(
    "click",
    async () => {


      logoutButton.disabled =
        true;


      logoutButton.textContent =
        "Signing out...";


      try {


        await signOut(
          auth
        );


        /*
         * IMPORTANT:
         * No automatic redirect.
         *
         * The user remains on this page.
         */


        emailElement.textContent =
          "No administrator session";


        sendButton.disabled =
          true;


        checkButton.disabled =
          true;


        profileButton.style.display =
          "none";


        logoutButton.disabled =
          false;


        logoutButton.textContent =
          "Sign Out";


        showStatus(
          "You have been signed out.",
          "success"
        );


      } catch (error) {


        console.error(
          "Logout error:",
          error
        );


        logoutButton.disabled =
          false;


        logoutButton.textContent =
          "Sign Out";


        showStatus(
          "Unable to sign out.",
          "error"
        );

      }

    }
  );


</script>

</body>
</html>
