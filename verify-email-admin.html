<main>

<section class="card">

  <div class="icon" id="icon">✉</div>

  <h1 id="title">Admin Email Verification</h1>

  <p class="description" id="description">
    Enter your Admin ID to verify your administrator
    email address and secure your account.
  </p>

  <!-- ADMIN ID ONLY -->

  <div id="adminIdSection">

  <div id="verificationSection" class="hidden">

      Send Verification Email

  </button>

<!-- FIREBASE SDK -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
"use strict";

// =====================================
// FIREBASE CONFIGURATION
// =====================================

const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbKXjsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

if(!firebase.apps.length){
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

// =====================================
// ELEMENTS
// =====================================

const $ = id => document.getElementById(id);

$("year").textContent = new Date().getFullYear();

const adminIdInput = $("adminId");

const continueBtn = $("continueBtn");
const sendBtn = $("sendBtn");
const checkBtn = $("checkBtn");
const resendBtn = $("resendBtn");
const logoutBtn = $("logoutBtn");

let currentUser = null;
let currentAdmin = null;
let adminDocumentId = null;

let busy = false;
let authReady = false;

// =====================================
// STATUS
// =====================================

function showStatus(message,type=""){
  $("status").textContent = message;
  $("status").className = "status " + type;
}

function loading(button,state,label){

  button.disabled = state;

  button.textContent = state
    ? "Please wait..."
    : label;
}

// =====================================
// AUTHENTICATION
// =====================================

auth.onAuthStateChanged(user => {

  currentUser = user;
  authReady = true;

  if(!user){

    showStatus(
      "Please login using your administrator account.",
      "error"
    );

    setTimeout(()=>{
      window.location.href = "admin-login.html";
    },1500);

    return;
  }

  if(user.emailVerified){

    showStatus(
      "Your email is already verified. Enter your Admin ID to continue.",
      "success"
    );

  }else{

    showStatus(
      "Enter your Admin ID to continue verification."
    );

  }

});

// =====================================
// FIND ADMIN USING ADMIN ID ONLY
// =====================================

async function findAdmin(){

  if(!authReady || !currentUser){
    throw new Error("Please login first.");
  }

  const adminId = adminIdInput.value.trim();

  if(!adminId){
    throw new Error("Please enter your Admin ID.");
  }

  const snapshot = await db.collection("admins")
    .where("adminId","==",adminId)
    .limit(2)
    .get();

  if(snapshot.empty){
    throw new Error("Invalid Admin ID. Administrator not found.");
  }

  if(snapshot.size !== 1){
    throw new Error("Duplicate Admin ID detected. Contact support.");
  }

  const doc = snapshot.docs[0];
  const data = doc.data();

  // Confirm the signed-in Firebase account owns this admin record.
  if(data.uid !== currentUser.uid){
    throw new Error(
      "This Admin ID does not belong to the currently signed-in account."
    );
  }

  const roles = [
    String(data.role || "").toLowerCase(),
    String(data.adminType || "").toLowerCase(),
    String(data.accessLevel || "").toLowerCase()
  ];

  const isAdmin = roles.some(role =>
    ["admin","superadmin"].includes(role)
  );

  if(!isAdmin){
    throw new Error("Administrator permission not found.");
  }

  if(String(data.status || "").toLowerCase() !== "active"){
    throw new Error("Your administrator account is not active.");
  }

  if(!data.email || data.email.toLowerCase() !==
     (currentUser.email || "").toLowerCase()){
    throw new Error("Admin email does not match the authenticated account.");
  }

  currentAdmin = data;
  adminDocumentId = doc.id;

  return data;
}

// =====================================
// CONTINUE WITH ADMIN ID
// =====================================

async function continueVerification(){

  if(busy) return;

  busy = true;

  loading(
    continueBtn,
    true,
    "Continue"
  );

  try{

    const admin = await findAdmin();

    $("adminName").textContent =
      admin.fullName ||
      admin.displayName ||
      admin.username ||
      "Administrator";

    $("displayAdminId").textContent = admin.adminId;

    // Mask email in the interface
    const email = currentUser.email || "";

    const parts = email.split("@");

    const masked = parts.length === 2
      ? parts[0].slice(0,2) + "***@" + parts[1]
      : "Registered email";

    $("adminEmail").textContent = masked;

    $("adminInfo").classList.remove("hidden");
    $("verificationSection").classList.remove("hidden");

    $("adminIdSection").classList.add("hidden");

    if(currentUser.emailVerified){

      await updateVerifiedStatus();

      showVerified();

    }else{

      showStatus(
        "Admin ID confirmed. You can now request email verification.",
        "success"
      );

    }

  }catch(error){

    console.error(error);

    showStatus(error.message,"error");

  }finally{

    busy = false;

    loading(
      continueBtn,
      false,
      "Continue"
    );

  }
}

// =====================================
// UPDATE FIRESTORE VERIFICATION
// =====================================

async function updateVerifiedStatus(){

  if(!currentUser || !currentAdmin || !adminDocumentId){
    throw new Error("Administrator information is missing.");
  }

  if(!currentUser.emailVerified){
    throw new Error("Email has not been verified.");
  }

  await db.collection("admins")
    .doc(adminDocumentId)
    .set({

      emailVerified:true,
      updatedAt:new Date().toISOString()

    },{merge:true});

}

// =====================================
// VERIFIED DISPLAY
// =====================================

function showVerified(){

  $("icon").textContent = "✓";
  $("icon").style.background = "#dcfce7";
  $("icon").style.color = "#15803d";

  $("title").textContent = "Email Verified!";

  $("description").textContent =
    "Your administrator email has been successfully verified.";

  $("verificationSection").classList.add("hidden");

  showStatus(
    "Verification successful. Redirecting to dashboard...",
    "success"
  );

  setTimeout(()=>{
    window.location.replace("admin-dashboard.html");
  },1500);

}

// =====================================
// SEND VERIFICATION EMAIL
// =====================================

async function sendVerification(){

  if(busy || !currentUser || !currentAdmin) return;

  busy = true;

  loading(
    sendBtn,
    true,
    "Send Verification Email"
  );

  try{

    await currentUser.reload();

    currentUser = auth.currentUser;

    if(currentUser.emailVerified){

      await updateVerifiedStatus();
      showVerified();

      return;
    }

    await currentUser.sendEmailVerification({

      url:window.location.origin + "/verify-email-admin.html",
      handleCodeInApp:false

    });

    showStatus(
      "Verification email sent successfully. Check your inbox and spam folder.",
      "success"
    );

  }catch(error){

    console.error(error);

    const messages = {

      "auth/too-many-requests":
        "Too many requests. Please wait and try again.",

      "auth/network-request-failed":
        "Network error. Check your internet connection.",

      "auth/invalid-continue-uri":
        "Invalid redirect URL. Check Firebase Authorized Domains."

    };

    showStatus(
      messages[error.code] || error.message,
      "error"
    );

  }finally{

    busy = false;

    loading(
      sendBtn,
      false,
      "Send Verification Email"
    );

  }

}

// =====================================
// CHECK EMAIL VERIFICATION
// =====================================

async function checkVerification(){

  if(busy || !currentUser || !currentAdmin) return;

  busy = true;

  loading(
    checkBtn,
    true,
    "Check Verification"
  );

  try{

    await currentUser.reload();

    currentUser = auth.currentUser;

    if(!currentUser.emailVerified){

      showStatus(
        "Email is not verified yet. Open the verification link sent to your email.",
        "error"
      );

      return;
    }

    await updateVerifiedStatus();

    showVerified();

  }catch(error){

    console.error(error);

    showStatus(
      error.message || "Unable to verify email.",
      "error"
    );

  }finally{

    busy = false;

    loading(
      checkBtn,
      false,
      "Check Verification"
    );

  }

}

// =====================================
// BUTTON EVENTS
// =====================================

continueBtn.addEventListener(
  "click",
  continueVerification
);

sendBtn.addEventListener(
  "click",
  sendVerification
);

resendBtn.addEventListener(
  "click",
  sendVerification
);

checkBtn.addEventListener(
  "click",
  checkVerification
);

// Enter key
adminIdInput.addEventListener("keydown",event=>{

  if(event.key === "Enter"){
    continueVerification();
  }

});

// =====================================
// LOGOUT
// =====================================

logoutBtn.addEventListener("click",async()=>{

  try{

    await auth.signOut();

    window.location.replace("admin-login.html");

  }catch(error){

    showStatus(
      "Unable to logout. Please try again.",
      "error"
    );

  }

});

</script>
