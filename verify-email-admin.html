<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Email Verification | Admin | Let'sStudy Pro</title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding: 18px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f4f7fb;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 430px;

      padding: 28px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(15,23,42,.08);

      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;

      margin: 0 auto 17px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background: #e8f0ff;

      font-size: 29px;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 25px;
      line-height: 1.2;
    }

    .description {
      margin: 0 0 20px;

      color: #667085;

      font-size: 13px;
      line-height: 1.6;
    }

    .email {
      margin-bottom: 18px;

      padding: 12px;

      border-radius: 10px;

      background: #f8fafc;

      color: #344054;

      font-size: 13px;
      font-weight: 700;

      overflow-wrap: anywhere;
    }

    .status {
      display: none;

      margin-bottom: 16px;

      padding: 11px 13px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .info {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    button {
      width: 100%;

      min-height: 49px;

      margin-top: 10px;

      border: 0;

      border-radius: 10px;

      background: #2563eb;

      color: #ffffff;

      font-size: 14px;
      font-weight: 750;

      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary {
      background: #111827;
    }

    .secondary:hover {
      background: #1f2937;
    }

    .logout {
      margin-top: 17px;

      color: #667085;

      background: transparent;

      font-size: 12px;
    }

    .logout:hover {
      background: transparent;
      color: #111827;
    }

    .back {
      display: inline-block;

      margin-top: 16px;

      color: #2563eb;

      text-decoration: none;

      font-size: 12px;
      font-weight: 700;
    }

    .help {
      margin-top: 19px;

      padding-top: 17px;

      border-top: 1px solid #e5e7eb;

      color: #98a2b3;

      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 23px 17px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>


<body>

  <main class="card">

    <div
      class="icon"
      aria-hidden="true"
    >
      ✉️
    </div>


    <h1>
      Verify Your Email
    </h1>


    <p class="description">
      Please verify your administrator email
      address to secure your Let'sStudy Pro
      account.
    </p>


    <div
      id="email"
      class="email"
    >
      Checking account...
    </div>


    <div
      id="status"
      class="status"
      role="alert"
      aria-live="polite"
    ></div>


    <button
      id="sendButton"
      type="button"
    >
      Send Verification Email
    </button>


    <button
      id="checkButton"
      class="secondary"
      type="button"
    >
      I've Verified My Email
    </button>


    <button
      id="logoutButton"
      class="logout"
      type="button"
    >
      Sign Out
    </button>


    <a
      href="profile-admin.html"
      class="back"
    >
      ← Back to Admin Profile
    </a>


    <div class="help">
      Check your inbox and spam/junk folder.
      After clicking the verification link,
      return here and select
      "I've Verified My Email".
    </div>

  </main>


<script type="module">

  /* =========================================
     FIREBASE
  ========================================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    sendEmailVerification,
    reload,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"
  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  /* =========================================
     ELEMENTS
  ========================================== */

  const emailElement =
    document.getElementById(
      "email"
    );

  const status =
    document.getElementById(
      "status"
    );

  const sendButton =
    document.getElementById(
      "sendButton"
    );

  const checkButton =
    document.getElementById(
      "checkButton"
    );

  const logoutButton =
    document.getElementById(
      "logoutButton"
    );


  let currentUser = null;


  /* =========================================
     STATUS
  ========================================== */

  function showStatus(
    message,
    type = "error"
  ) {

    status.textContent =
      message;

    status.className =
      `status show ${type}`;
  }


  function clearStatus() {

    status.textContent =
      "";

    status.className =
      "status";
  }


  /* =========================================
     AUTH STATE
  ========================================== */

  onAuthStateChanged(
    auth,
    user => {

      if (!user) {

        window.location.replace(
          "login-admin.html"
        );

        return;
      }


      currentUser = user;


      emailElement.textContent =
        user.email ||
        "Administrator email";


      if (user.emailVerified) {

        showStatus(
          "Your email is already verified.",
          "success"
        );

        sendButton.disabled =
          true;

        sendButton.textContent =
          "Email Already Verified";

      }

    }
  );


  /* =========================================
     SEND VERIFICATION
  ========================================== */

  sendButton.addEventListener(
    "click",
    async () => {

      clearStatus();


      if (!currentUser) {

        showStatus(
          "Administrator session not found."
        );

        return;
      }


      if (currentUser.emailVerified) {

        showStatus(
          "Your email is already verified.",
          "success"
        );

        return;
      }


      sendButton.disabled =
        true;

      sendButton.textContent =
        "Sending...";


      try {

        await sendEmailVerification(
          currentUser
        );


        showStatus(
          "Verification email sent. Check your inbox and spam folder.",
          "success"
        );


      } catch (error) {

        console.error(
          "Email verification error:",
          error
        );


        let message =
          "Unable to send verification email.";


        switch (error.code) {

          case "auth/too-many-requests":

            message =
              "Too many requests. Please wait before trying again.";

            break;


          case "auth/network-request-failed":

            message =
              "Network error. Check your internet connection.";

            break;

        }


        showStatus(
          message
        );

      } finally {

        sendButton.disabled =
          false;

        sendButton.textContent =
          "Send Verification Email";

      }

    }
  );


  /* =========================================
     CHECK VERIFICATION
  ========================================== */

  checkButton.addEventListener(
    "click",
    async () => {

      clearStatus();


      if (!currentUser) {

        showStatus(
          "Administrator session not found."
        );

        return;
      }


      checkButton.disabled =
        true;

      checkButton.textContent =
        "Checking...";


      try {

        await reload(
          currentUser
        );


        currentUser =
          auth.currentUser;


        if (
          currentUser &&
          currentUser.emailVerified
        ) {

          showStatus(
            "Email verified successfully. Opening admin profile...",
            "success"
          );


          setTimeout(
            () => {

              window.location.replace(
                "profile-admin.html"
              );

            },
            900
          );


        } else {

          showStatus(
            "Your email is not verified yet. Open the verification email first.",
            "info"
          );

        }


      } catch (error) {

        console.error(
          "Verification check error:",
          error
        );


        showStatus(
          "Could not check verification status."
        );

      } finally {

        checkButton.disabled =
          false;

        checkButton.textContent =
          "I've Verified My Email";

      }

    }
  );


  /* =========================================
     SIGN OUT
  ========================================== */

  logoutButton.addEventListener(
    "click",
    async () => {

      logoutButton.disabled =
        true;

      logoutButton.textContent =
        "Signing out...";


      try {

        await signOut(auth);


        window.location.replace(
          "login-admin.html"
        );


      } catch (error) {

        console.error(
          "Logout error:",
          error
        );


        logoutButton.disabled =
          false;

        logoutButton.textContent =
          "Sign Out";

        showStatus(
          "Unable to sign out."
        );

      }

    }
  );

</script>

</body>
</html>
