
<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Email Verification | LetsStudy Pro</title>

<meta name="robots" content="noindex,nofollow">

<style>
:root {
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --bg:#f1f5f9;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --success:#15803d;
  --danger:#dc2626;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header {
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:18px 20px;
}

.brand {
  max-width:1100px;
  margin:auto;
  font-size:21px;
  font-weight:700;
  color:var(--primary);
}

.brand span {
  color:var(--text);
}

main {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 15px;
}

.card {
  width:100%;
  max-width:440px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:30px 25px;
  box-shadow:0 10px 35px rgba(15,23,42,.06);
  text-align:center;
}

.icon {
  width:75px;
  height:75px;
  margin:0 auto 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#eff6ff;
  color:var(--primary);
  font-size:35px;
}

h1 {
  font-size:25px;
  margin:0 0 12px;
}

.description {
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
  margin-bottom:22px;
}

.email {
  padding:13px;
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  overflow-wrap:anywhere;
  margin-bottom:18px;
}

.status {
  font-size:13px;
  color:var(--muted);
  margin:15px 0;
  min-height:20px;
}

.status.success {
  color:var(--success);
}

.status.error {
  color:var(--danger);
}

button {
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  margin-top:10px;
  transition:.2s;
}

button:disabled {
  opacity:.6;
  cursor:not-allowed;
}

.primary {
  background:var(--primary);
  color:#fff;
}

.primary:hover {
  background:var(--primary-dark);
}

.secondary {
  background:#eff6ff;
  color:var(--primary);
}

.secondary:hover {
  background:#dbeafe;
}

.logout {
  background:#f1f5f9;
  color:#334155;
}

footer {
  text-align:center;
  padding:20px;
  color:var(--muted);
  font-size:12px;
}

footer a {
  color:var(--primary);
  text-decoration:none;
}

.spinner {
  display:inline-block;
  width:15px;
  height:15px;
  border:2px solid #cbd5e1;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

@media(max-width:480px) {
  .card {
    padding:25px 18px;
  }
  h1 {
    font-size:22px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">LetsStudy <span>Pro</span></div>
</header>

<main>
  <section class="card">

    <div class="icon" id="verificationIcon">✉</div>

    <h1 id="pageTitle">Verify Admin Email</h1>

    <p class="description" id="description">
      Verify your administrator email address to secure your account
      and continue using the administration dashboard.
    </p>

    <div class="email" id="adminEmail">
      Loading administrator email...
    </div>

    <div class="status" id="status">
      <span class="spinner"></span>
      Checking account...
    </div>

    <button class="primary" id="sendBtn" disabled>
      Send Verification Email
    </button>

    <button class="secondary" id="checkBtn" disabled>
      I've Verified My Email
    </button>

    <button class="secondary" id="resendBtn" disabled>
      Resend Verification Email
    </button>

    <button class="logout" id="logoutBtn">
      Logout
    </button>

  </section>
</main>

<footer>
  © <span id="year"></span> LetsStudy Pro.
  <a href="index.html">Home</a>
</footer>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
"use strict";

// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};

// Initialize Firebase
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

// Elements
const $ = id => document.getElementById(id);

const statusEl = $("status");
const emailEl = $("adminEmail");
const sendBtn = $("sendBtn");
const checkBtn = $("checkBtn");
const resendBtn = $("resendBtn");
const logoutBtn = $("logoutBtn");

$("year").textContent = new Date().getFullYear();

let currentAdmin = null;
let checking = false;

// Status message
function showStatus(message, type = "") {
  statusEl.textContent = message;
  statusEl.className = "status " + type;
}

// Button loading
function setLoading(button, loading, text) {
  button.disabled = loading;

  if (loading) {
    button.innerHTML = '<span class="spinner"></span> Please wait...';
  } else {
    button.textContent = text;
  }
}

// Enable buttons
function enableButtons(enabled) {
  sendBtn.disabled = !enabled;
  checkBtn.disabled = !enabled;
  resendBtn.disabled = !enabled;
}

// Load admin document
async function loadAdminDocument(user) {
  const ref = db.collection("admins").doc(user.uid);
  const snapshot = await ref.get();

  if (!snapshot.exists) {
    throw new Error(
      "Administrator record not found in Firestore."
    );
  }

  return snapshot.data();
}

// Check admin verification
async function checkVerification() {
  if (!currentAdmin || checking) return;

  checking = true;
  setLoading(checkBtn, true, "I've Verified My Email");

  try {
    await currentAdmin.reload();

    const user = auth.currentUser;

    if (!user) {
      throw new Error("Your session has expired. Please login again.");
    }

    if (user.emailVerified) {
      await db.collection("admins")
        .doc(user.uid)
        .set({
          emailVerified: true,
          updatedAt: new Date().toISOString()
        }, { merge: true });

      $("verificationIcon").textContent = "✓";
      $("verificationIcon").style.background = "#dcfce7";
      $("verificationIcon").style.color = "#15803d";

      $("pageTitle").textContent = "Email Verified!";
      $("description").textContent =
        "Your administrator email has been successfully verified.";

      showStatus("Email verification successful.", "success");

      enableButtons(false);
      logoutBtn.disabled = true;

      setTimeout(() => {
        window.location.href = "admin-dashboard.html";
      }, 1500);

    } else {
      showStatus(
        "Email is not verified yet. Check your inbox and click the verification link.",
        "error"
      );
    }

  } catch (error) {
    console.error(error);
    showStatus(error.message || "Verification check failed.", "error");
  } finally {
    checking = false;
    checkBtn.disabled = false;
    checkBtn.textContent = "I've Verified My Email";
  }
}

// Send verification email
async function sendVerificationEmail() {
  if (!currentAdmin) return;

  setLoading(sendBtn, true, "Send Verification Email");

  try {
    const user = auth.currentUser;

    if (!user) {
      throw new Error("Please login again.");
    }

    await user.sendEmailVerification({
      url: window.location.origin + "/admin-verify-email.html",
      handleCodeInApp: false
    });

    showStatus(
      "Verification email sent successfully. Check your inbox or spam folder.",
      "success"
    );

  } catch (error) {
    console.error(error);

    let message = error.message;

    if (error.code === "auth/too-many-requests") {
      message = "Too many requests. Please wait before trying again.";
    }

    if (error.code === "auth/network-request-failed") {
      message = "Network error. Check your internet connection.";
    }

    showStatus(message, "error");

  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "Send Verification Email";
  }
}

// Resend verification email
async function resendVerificationEmail() {
  await sendVerificationEmail();
}

// Authentication state
auth.onAuthStateChanged(async user => {
  if (!user) {
    window.location.href = "admin-login.html";
    return;
  }

  currentAdmin = user;

  try {
    const adminData = await loadAdminDocument(user);

    emailEl.textContent = user.email || adminData.email || "No email";

    // Require administrator account
    if (
      adminData.role !== "admin" &&
      adminData.accessLevel !== "admin" &&
      adminData.adminType !== "admin" &&
      adminData.adminType !== "superAdmin"
    ) {
      showStatus(
        "This account does not have administrator access.",
        "error"
      );

      enableButtons(false);
      return;
    }

    // Already verified
    if (user.emailVerified) {
      await db.collection("admins")
        .doc(user.uid)
        .set({
          emailVerified: true,
          updatedAt: new Date().toISOString()
        }, { merge: true });

      showStatus("Your email is already verified.", "success");

      $("pageTitle").textContent = "Email Verified";
      $("verificationIcon").textContent = "✓";

      enableButtons(false);

      setTimeout(() => {
        window.location.href = "admin-dashboard.html";
      }, 1200);

      return;
    }

    enableButtons(true);

    showStatus(
      "Your email address has not been verified.",
      ""
    );

  } catch (error) {
    console.error(error);

    showStatus(
      error.message || "Unable to load administrator information.",
      "error"
    );

    enableButtons(false);
  }
});

// Button events
sendBtn.addEventListener("click", sendVerificationEmail);

resendBtn.addEventListener("click", resendVerificationEmail);

checkBtn.addEventListener("click", checkVerification);

// Logout
logoutBtn.addEventListener("click", async () => {
  logoutBtn.disabled = true;

  try {
    await auth.signOut();
    window.location.href = "admin-login.html";
  } catch (error) {
    console.error(error);
    showStatus("Unable to logout. Try again.", "error");
    logoutBtn.disabled = false;
  }
});
</script>

</body>
</html>
