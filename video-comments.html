<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Comments | Let'sStudy Pro</title>

<link rel="icon" href="/favicon.ico">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --primary:#2563eb;
    --bg:#f5f7fb;
    --card:#fff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --danger:#dc2626;
    --success:#16a34a;
    --warning:#d97706;
    --shadow:0 8px 30px rgba(15,23,42,.07);
}

body{
    font-family:Inter,system-ui,-apple-system,
        "Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:68px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:40px;
    height:40px;
    border-radius:11px;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.brand small{
    display:block;
    color:var(--muted);
    font-size:11px;
}

.actions{
    display:flex;
    gap:8px;
}

.btn{
    border:1px solid var(--border);
    background:#fff;
    border-radius:9px;
    padding:9px 14px;
    font-weight:700;
}

.btn-primary{
    color:#fff;
    background:var(--primary);
    border-color:var(--primary);
}

.btn-danger{
    color:var(--danger);
}

.main{
    max-width:1150px;
    margin:auto;
    padding:28px 18px 50px;
}

.heading{
    margin-bottom:20px;
}

.heading h1{
    font-size:28px;
}

.heading p{
    color:var(--muted);
    margin-top:5px;
    font-size:14px;
}

.stats{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:14px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:17px;
    box-shadow:var(--shadow);
}

.stat-label{
    color:var(--muted);
    font-size:12px;
}

.stat-value{
    font-size:25px;
    font-weight:800;
    margin-top:6px;
}

.panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:var(--shadow);
}

.toolbar{
    padding:16px;
    border-bottom:1px solid var(--border);
    display:flex;
    gap:10px;
}

.search{
    flex:1;
}

input,
select{
    height:42px;
    border:1px solid var(--border);
    border-radius:9px;
    padding:0 12px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus{
    border-color:var(--primary);
}

.comments{
    display:flex;
    flex-direction:column;
}

.comment{
    padding:18px;
    border-bottom:1px solid var(--border);
}

.comment:last-child{
    border-bottom:0;
}

.comment-top{
    display:flex;
    gap:12px;
}

.avatar{
    width:43px;
    height:43px;
    flex:none;
    border-radius:50%;
    object-fit:cover;
    background:#e5e7eb;
}

.comment-content{
    flex:1;
    min-width:0;
}

.user-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.user-name{
    font-weight:800;
}

.email{
    color:var(--muted);
    font-size:11px;
}

.comment-text{
    margin-top:8px;
    line-height:1.6;
    word-break:break-word;
}

.meta{
    margin-top:9px;
    display:flex;
    gap:13px;
    flex-wrap:wrap;
    color:var(--muted);
    font-size:12px;
}

.video-link{
    color:var(--primary);
    cursor:pointer;
    font-weight:700;
}

.status{
    display:inline-flex;
    padding:4px 8px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    text-transform:capitalize;
}

.status-active{
    background:#dcfce7;
    color:#166534;
}

.status-pending{
    background:#fef3c7;
    color:#92400e;
}

.status-hidden{
    background:#fee2e2;
    color:#991b1b;
}

.comment-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
    flex-wrap:wrap;
}

.small-btn{
    border:1px solid var(--border);
    background:#fff;
    border-radius:7px;
    padding:6px 9px;
    font-size:11px;
    font-weight:700;
}

.small-btn:hover{
    background:#f9fafb;
}

.reply{
    margin:13px 0 0 55px;
    padding:12px;
    border-left:3px solid #dbeafe;
    background:#f8fafc;
    border-radius:8px;
}

.loader,
.empty{
    padding:55px 20px;
    text-align:center;
    color:var(--muted);
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #e5e7eb;
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.notice{
    display:none;
    padding:12px 15px;
    margin-bottom:15px;
    border-radius:9px;
    font-size:13px;
}

.notice.show{
    display:block;
}

.notice.error{
    background:#fee2e2;
    color:#991b1b;
}

.notice.success{
    background:#dcfce7;
    color:#166534;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .toolbar{
        flex-direction:column;
    }

}

@media(max-width:500px){

    .header{
        padding:0 14px;
    }

    .brand strong{
        font-size:13px;
    }

    .main{
        padding:20px 12px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .comment{
        padding:14px;
    }

    .reply{
        margin-left:20px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">

        <div class="logo">
            LS
        </div>

        <div>
            <strong>Let'sStudy Pro</strong>
            <small>Video Comments</small>
        </div>

    </div>

    <div class="actions">

        <button
            class="btn"
            onclick="loadComments()">
            ↻ Refresh
        </button>

        <button
            class="btn btn-primary"
            onclick="location.href='/studio.html'">
            Studio
        </button>

    </div>

</header>


<main class="main">

    <div class="heading">

        <h1>Video Comments</h1>

        <p>
            Manage comments, replies, likes
            and moderation.
        </p>

    </div>


    <div
        id="notice"
        class="notice">
    </div>


    <section class="stats">

        <div class="stat">
            <div class="stat-label">
                Total Comments
            </div>

            <div
                id="totalComments"
                class="stat-value">
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Active
            </div>

            <div
                id="activeComments"
                class="stat-value">
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Pending
            </div>

            <div
                id="pendingComments"
                class="stat-value">
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Likes
            </div>

            <div
                id="totalLikes"
                class="stat-value">
                0
            </div>
        </div>

    </section>


    <section class="panel">

        <div class="toolbar">

            <input
                id="search"
                class="search"
                type="search"
                placeholder="Search comments, users or videos..."
                oninput="renderComments()">

            <select
                id="statusFilter"
                onchange="renderComments()">

                <option value="all">
                    All Status
                </option>

                <option value="active">
                    Active
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="hidden">
                    Hidden
                </option>

            </select>

        </div>


        <div
            id="comments"
            class="comments">

            <div class="loader">

                <div class="spinner"></div>

                Loading comments...

            </div>

        </div>

    </section>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
        "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
        "let-s-study-pro-course",

    storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
        "474928293390",

    appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
        "G-85B7V5H5J0"

};


const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ==============================
   STATE
============================== */

let comments = [];

let currentUser = null;


/* ==============================
   AUTH
============================== */

onAuthStateChanged(
    auth,
    user => {

        currentUser =
            user || null;

        loadComments();

    }
);


/* ==============================
   LOAD COMMENTS
============================== */

window.loadComments =
async function(){

    const container =
        document.getElementById(
            "comments"
        );

    container.innerHTML = `
        <div class="loader">
            <div class="spinner"></div>
            Loading comments...
        </div>
    `;

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "videoComments"
                )
            );

        comments =
            snapshot.docs.map(
                item => ({
                    id:item.id,
                    ...item.data()
                })
            );

        updateStats();

        renderComments();

    }catch(error){

        console.error(
            "Comments failed:",
            error
        );

        container.innerHTML = `
            <div class="empty">
                Failed to load comments.
            </div>
        `;

        showNotice(
            error.message ||
            "Failed to load comments.",
            "error"
        );

    }

};


/* ==============================
   STATS
============================== */

function updateStats(){

    const active =
        comments.filter(
            c =>
                String(
                    c.status || "active"
                ).toLowerCase()
                === "active"
        ).length;

    const pending =
        comments.filter(
            c =>
                String(
                    c.status || ""
                ).toLowerCase()
                === "pending"
        ).length;

    const likes =
        comments.reduce(
            (sum,c) =>
                sum +
                (Number(c.likes) || 0),
            0
        );


    document.getElementById(
        "totalComments"
    ).textContent =
        comments.length.toLocaleString();

    document.getElementById(
        "activeComments"
    ).textContent =
        active.toLocaleString();

    document.getElementById(
        "pendingComments"
    ).textContent =
        pending.toLocaleString();

    document.getElementById(
        "totalLikes"
    ).textContent =
        likes.toLocaleString();

}


/* ==============================
   RENDER
============================== */

window.renderComments =
function(){

    const container =
        document.getElementById(
            "comments"
        );

    const search =
        (
            document.getElementById(
                "search"
            ).value || ""
        )
        .toLowerCase()
        .trim();

    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    let filtered =
        comments.filter(
            c => {

                const currentStatus =
                    String(
                        c.status ||
                        "active"
                    ).toLowerCase();

                const text =
                    [
                        c.comment,
                        c.userName,
                        c.userEmail,
                        c.videoId,
                        c.channelId
                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();

                const matchesSearch =
                    !search ||
                    text.includes(search);

                const matchesStatus =
                    status === "all" ||
                    currentStatus === status;

                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    filtered.sort(
        (a,b) =>
            getTime(b.createdAt) -
            getTime(a.createdAt)
    );


    if(!filtered.length){

        container.innerHTML = `
            <div class="empty">
                No comments found.
            </div>
        `;

        return;

    }


    container.innerHTML =
        filtered.map(
            comment => {

                const status =
                    String(
                        comment.status ||
                        "active"
                    ).toLowerCase();

                return `

                    <article
                        class="comment">

                        <div
                            class="comment-top">

                            <img
                                class="avatar"
                                src="${escapeAttr(
                                    comment.userImage ||
                                    "/favicon.ico"
                                )}"
                                alt="">

                            <div
                                class="comment-content">

                                <div
                                    class="user-row">

                                    <span
                                        class="user-name">

                                        ${escapeHTML(
                                            comment.userName ||
                                            "Anonymous"
                                        )}

                                    </span>

                                    <span
                                        class="email">

                                        ${escapeHTML(
                                            comment.userEmail ||
                                            ""
                                        )}

                                    </span>

                                    <span
                                        class="status status-${escapeAttr(
                                            status
                                        )}">

                                        ${escapeHTML(
                                            status
                                        )}

                                    </span>

                                </div>


                                <div
                                    class="comment-text">

                                    ${escapeHTML(
                                        comment.comment ||
                                        ""
                                    )}

                                </div>


                                <div
                                    class="meta">

                                    <span>
                                        👍
                                        ${Number(
                                            comment.likes
                                        ) || 0}
                                    </span>

                                    <span>
                                        ${formatDate(
                                            comment.createdAt
                                        )}
                                    </span>

                                    <span
                                        class="video-link"
                                        onclick="openVideo('${escapeAttr(
                                            comment.videoId
                                        )}')">

                                        Video:
                                        ${escapeHTML(
                                            comment.videoId ||
                                            "Unknown"
                                        )}

                                    </span>

                                </div>


                                <div
                                    class="comment-actions">

                                    ${
                                        status !== "active"
                                        ? `
                                            <button
                                                class="small-btn"
                                                onclick="changeStatus(
                                                    '${escapeAttr(comment.id)}',
                                                    'active'
                                                )">
                                                Approve
                                            </button>
                                        `
                                        : ""
                                    }


                                    ${
                                        status !== "hidden"
                                        ? `
                                            <button
                                                class="small-btn"
                                                onclick="changeStatus(
                                                    '${escapeAttr(comment.id)}',
                                                    'hidden'
                                                )">
                                                Hide
                                            </button>
                                        `
                                        : ""
                                    }


                                    ${
                                        status !== "pending"
                                            ? `
                                                <button
                                                    class="small-btn"
                                                    onclick="changeStatus(
                                                        '${escapeAttr(comment.id)}',
                                                        'pending'
                                                    )">
                                                    Pending
                                                </button>
                                            `
                                            : ""
                                    }

                                    <button
                                        class="small-btn btn-danger"
                                        onclick="deleteComment(
                                            '${escapeAttr(comment.id)}'
                                        )">
                                        Delete
                                    </button>

                                    <button
                                        class="small-btn"
                                        onclick="replyToComment(
                                            '${escapeAttr(comment.id)}',
                                            '${escapeAttr(comment.videoId || "")}'
                                        )">
                                        Reply
                                    </button>

                                </div>

                            </div>

                        </div>


                        ${
                            comment.parentCommentId
                                ? `
                                    <div class="reply">

                                        <strong>
                                            ↳ Reply
                                        </strong>

                                        <div style="margin-top:5px">
                                            Parent:
                                            ${escapeHTML(
                                                comment.parentCommentId
                                            )}
                                        </div>

                                    </div>
                                `
                                : ""
                        }

                    </article>

                `;

            }
        ).join("");

};


/* ==============================
   REPLY
============================== */

window.replyToComment =
function(
    commentId,
    videoId
){

    if(!commentId){
        return;
    }

    const text =
        prompt(
            "Write your reply:"
        );

    if(
        !text ||
        !text.trim()
    ){

        return;

    }

    /*
     * The actual reply is created
     * by the public comment system.
     * This page redirects to the video
     * where the reply can be submitted.
     */

    if(videoId){

        window.location.href =
            `/watch.html?id=${encodeURIComponent(
                videoId
            )}&reply=${encodeURIComponent(
                commentId
            )}`;

        return;

    }

    showNotice(
        "Video ID is missing.",
        "error"
    );

};


/* ==============================
   SEARCH ENTER
============================== */

const search =
    document.getElementById(
        "search"
    );

if(search){

    search.addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ){

                renderComments();

            }

        }
    );

}


/* ==============================
   IMAGE FALLBACK
============================== */

document.addEventListener(
    "error",
    event => {

        if(
            event.target &&
            event.target.tagName === "IMG"
        ){

            event.target.src =
                "/favicon.ico";

        }

    },
    true
);


/* ==============================
   GLOBAL ERROR HANDLER
============================== */

window.addEventListener(
    "error",
    event => {

        console.error(
            "Video Comments error:",
            event.error ||
            event.message
        );

    }
);

window.addEventListener(
    "unhandledrejection",
    event => {

        console.error(
            "Unhandled promise rejection:",
            event.reason
        );

    }
);

</script>

</body>
</html>
