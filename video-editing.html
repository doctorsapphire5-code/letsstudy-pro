<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Editing Skills</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    :root {
      --primary: #ef4444;
      --primary-dark: #dc2626;
      --secondary: #7c3aed;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    header {
      padding: 70px 0;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          #111827,
          #7c3aed,
          #ef4444
        );
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      margin-bottom: 18px;
      border-radius: 30px;
      background: rgba(255,255,255,.15);
      font-size: .85rem;
      font-weight: 700;
    }

    header h1 {
      margin: 0 0 15px;
      font-size: clamp(2.3rem, 6vw, 4rem);
    }

    header p {
      max-width: 750px;
      margin: 0;
      color: #f8fafc;
      line-height: 1.7;
    }

    main {
      padding: 40px 0;
    }

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
      padding: 20px;
      margin-bottom: 25px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .filter-group label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: var(--muted);
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: #fff;
      font-size: .95rem;
    }

    .input-wrap input {
      padding-left: 40px;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(239,68,68,.1);
    }

    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .result-bar select {
      width: auto;
      min-width: 180px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .skill-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .skill-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(15,23,42,.12);
    }

    .skill-cover {
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 4rem;
    }

    .cover-fundamentals {
      background: linear-gradient(135deg,#111827,#374151);
    }

    .cover-premiere {
      background: linear-gradient(135deg,#7c3aed,#4c1d95);
    }

    .cover-color {
      background: linear-gradient(135deg,#ef4444,#991b1b);
    }

    .cover-motion {
      background: linear-gradient(135deg,#2563eb,#1e3a8a);
    }

    .cover-audio {
      background: linear-gradient(135deg,#059669,#064e3b);
    }

    .cover-storytelling {
      background: linear-gradient(135deg,#f97316,#9a3412);
    }

    .cover-social {
      background: linear-gradient(135deg,#db2777,#831843);
    }

    .cover-advanced {
      background: linear-gradient(135deg,#0891b2,#164e63);
    }

    .skill-content {
      padding: 20px;
    }

    .skill-content h3 {
      margin: 10px 0;
      line-height: 1.35;
    }

    .skill-content p {
      color: var(--muted);
      line-height: 1.6;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: .78rem;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 700;
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--muted);
    }

    .empty i {
      margin-bottom: 15px;
      font-size: 3rem;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15,23,42,.72);
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      position: relative;
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      border-radius: 16px;
      background: #fff;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 16px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 30px;
      cursor: pointer;
    }

    .modal-box li {
      margin: 10px 0;
      color: var(--muted);
      line-height: 1.5;
    }

    footer {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 750px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .result-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .result-bar select {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">

    <div class="eyebrow">
      <i class="fa-solid fa-video"></i>
      Career Skills
    </div>

    <h1>Video Editing Skills</h1>

    <p>
      Build professional video editing skills for YouTube,
      social media, film, advertising, storytelling, motion graphics,
      and digital content production.
    </p>

  </div>
</header>


<main class="container">

  <!-- FILTERS -->
  <section class="filters">

    <div class="filter-group">

      <label for="search">
        Search Skills
      </label>

      <div class="input-wrap">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="search"
          id="search"
          placeholder="Search video editing skills..."
        >

      </div>

    </div>


    <div class="filter-group">

      <label for="level">
        Level
      </label>

      <select id="level">

        <option value="all">
          All Levels
        </option>

        <option value="Beginner">
          Beginner
        </option>

        <option value="Intermediate">
          Intermediate
        </option>

        <option value="Advanced">
          Advanced
        </option>

      </select>

    </div>


    <div class="filter-group">

      <label for="category">
        Category
      </label>

      <select id="category">

        <option value="all">
          All Categories
        </option>

        <option value="Video Editing">
          Video Editing
        </option>

        <option value="Adobe Premiere">
          Adobe Premiere
        </option>

        <option value="Color Grading">
          Color Grading
        </option>

        <option value="Motion Graphics">
          Motion Graphics
        </option>

        <option value="Audio Editing">
          Audio Editing
        </option>

        <option value="Storytelling">
          Storytelling
        </option>

        <option value="Social Video">
          Social Video
        </option>

        <option value="Advanced Editing">
          Advanced Editing
        </option>

      </select>

    </div>

  </section>


  <div class="result-bar">

    <strong id="resultCount">
      0 skills
    </strong>

    <select id="sort">

      <option value="popularity">
        Most Popular
      </option>

      <option value="az">
        A-Z
      </option>

      <option value="level">
        Level
      </option>

    </select>

  </div>


  <!-- SKILLS -->
  <section
    class="skills-grid"
    id="skillsGrid"
  ></section>

</main>


<!-- DETAILS MODAL -->
<div
  class="modal"
  id="detailsModal"
>

  <div class="modal-box">

    <button
      type="button"
      class="close"
      id="closeModal"
      aria-label="Close"
    >
      &times;
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<footer>
  <p>
    © 2026 Video Editing Skills Platform
  </p>
</footer>


<script>

  /* =========================================
     VIDEO EDITING SKILLS
  ========================================= */

  const videoEditingSkills = [

    {
      id: 1,
      title: "Video Editing Fundamentals",
      category: "Video Editing",
      level: "Beginner",
      duration: "4 weeks",
      popularity: 99,
      icon: "fa-solid fa-scissors",
      cover: "fundamentals",
      description:
        "Learn the foundations of professional video editing, timelines, cuts, transitions, and project organization.",
      skills: [
        "Timeline editing",
        "Cutting and trimming",
        "Transitions",
        "Project organization",
        "Export settings"
      ]
    },


    {
      id: 2,
      title: "Adobe Premiere Pro",
      category: "Adobe Premiere",
      level: "Intermediate",
      duration: "8 weeks",
      popularity: 100,
      icon: "fa-solid fa-film",
      cover: "premiere",
      description:
        "Develop practical editing skills using professional video editing workflows and tools.",
      skills: [
        "Timeline workflows",
        "Multicam editing",
        "Effects",
        "Keyframes",
        "Professional exports"
      ]
    },


    {
      id: 3,
      title: "Color Grading",
      category: "Color Grading",
      level: "Intermediate",
      duration: "6 weeks",
      popularity: 95,
      icon: "fa-solid fa-circle-half-stroke",
      cover: "color",
      description:
        "Learn how to correct footage and create professional visual styles using color.",
      skills: [
        "Color correction",
        "Color grading",
        "Skin tones",
        "Scopes",
        "Creative looks"
      ]
    },


    {
      id: 4,
      title: "Motion Graphics",
      category: "Motion Graphics",
      level: "Advanced",
      duration: "9 weeks",
      popularity: 94,
      icon: "fa-solid fa-wand-magic-sparkles",
      cover: "motion",
      description:
        "Create animated titles, graphics, transitions, and visual effects for professional video projects.",
      skills: [
        "Motion design",
        "Animated titles",
        "Keyframe animation",
        "Visual effects",
        "Compositing"
      ]
    },


    {
      id: 5,
      title: "Audio Editing for Video",
      category: "Audio Editing",
      level: "Intermediate",
      duration: "5 weeks",
      popularity: 90,
      icon: "fa-solid fa-volume-high",
      cover: "audio",
      description:
        "Improve video quality by learning dialogue editing, sound effects, mixing, and audio cleanup.",
      skills: [
        "Dialogue editing",
        "Noise reduction",
        "Sound effects",
        "Audio mixing",
        "Music synchronization"
      ]
    },


    {
      id: 6,
      title: "Visual Storytelling",
      category: "Storytelling",
      level: "Intermediate",
      duration: "6 weeks",
      popularity: 97,
      icon: "fa-solid fa-book-open",
      cover: "storytelling",
      description:
        "Learn how to structure footage and edits to create engaging stories and emotional experiences.",
      skills: [
        "Story structure",
        "Pacing",
        "Shot selection",
        "Scene construction",
        "Audience engagement"
      ]
    },


    {
      id: 7,
      title: "Social Media Video Editing",
      category: "Social Video",
      level: "Beginner",
      duration: "4 weeks",
      popularity: 98,
      icon: "fa-solid fa-mobile-screen-button",
      cover: "social",
      description:
        "Create engaging short-form videos optimized for modern social media platforms.",
      skills: [
        "Vertical video",
        "Short-form editing",
        "Captions",
        "Social hooks",
        "Fast-paced editing"
      ]
    },


    {
      id: 8,
      title: "Advanced Video Production",
      category: "Advanced Editing",
      level: "Advanced",
      duration: "10 weeks",
      popularity: 88,
      icon: "fa-solid fa-clapperboard",
      cover: "advanced",
      description:
        "Develop advanced post-production skills for complex professional video projects.",
      skills: [
        "Advanced workflows",
        "Multicam production",
        "Compositing",
        "Professional delivery",
        "Post-production management"
      ]
    }

  ];


  /* =========================================
     DOM ELEMENTS
  ========================================= */

  const skillsGrid =
    document.getElementById("skillsGrid");

  const searchInput =
    document.getElementById("search");

  const levelSelect =
    document.getElementById("level");

  const categorySelect =
    document.getElementById("category");

  const sortSelect =
    document.getElementById("sort");

  const resultCount =
    document.getElementById("resultCount");

  const modal =
    document.getElementById("detailsModal");

  const modalContent =
    document.getElementById("modalContent");

  const closeModal =
    document.getElementById("closeModal");


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     RENDER SKILLS
  ========================================= */

  function renderSkills(list) {

    if (!list.length) {

      skillsGrid.innerHTML = `

        <div class="empty">

          <i class="fa-solid fa-video"></i>

          <h2>
            No skills found
          </h2>

          <p>
            Try another search term or change your filters.
          </p>

        </div>

      `;

      resultCount.textContent =
        "0 skills";

      return;
    }


    skillsGrid.innerHTML =
      list.map(skill => `

        <article class="skill-card">

          <div
            class="skill-cover cover-${skill.cover}"
          >

            <i class="${skill.icon}"></i>

          </div>


          <div class="skill-content">

            <div class="meta">

              <span class="badge">
                ${escapeHTML(skill.level)}
              </span>

              <span class="badge">
                ${escapeHTML(skill.category)}
              </span>

            </div>


            <h3>
              ${escapeHTML(skill.title)}
            </h3>


            <p>
              ${escapeHTML(skill.description)}
            </p>


            <div class="meta">

              <span class="badge">

                <i class="fa-regular fa-clock"></i>

                ${escapeHTML(skill.duration)}

              </span>


              <span class="badge">

                <i class="fa-solid fa-fire"></i>

                ${skill.popularity}%

              </span>

            </div>


            <button
              type="button"
              class="btn btn-primary"
              onclick="showDetails(${skill.id})"
            >
              View Details
            </button>

          </div>

        </article>

      `).join("");


    resultCount.textContent =
      `${list.length} skill${list.length === 1 ? "" : "s"}`;

  }


  /* =========================================
     FILTER SKILLS
  ========================================= */

  function filterSkills() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    const level =
      levelSelect.value;

    const category =
      categorySelect.value;


    let filtered =
      videoEditingSkills.filter(skill => {

        const searchableText = [

          skill.title,
          skill.category,
          skill.level,
          skill.description,
          skill.duration,
          ...skill.skills

        ]
          .join(" ")
          .toLowerCase();


        const matchesSearch =
          !search ||
          searchableText.includes(search);


        const matchesLevel =
          level === "all" ||
          skill.level === level;


        const matchesCategory =
          category === "all" ||
          skill.category === category;


        return (
          matchesSearch &&
          matchesLevel &&
          matchesCategory
        );

      });


    /* =====================================
       SORT
    ===================================== */

    if (sortSelect.value === "az") {

      filtered.sort(
        (a, b) =>
          a.title.localeCompare(b.title)
      );

    }

    else if (sortSelect.value === "level") {

      const levelOrder = {
        Beginner: 1,
        Intermediate: 2,
        Advanced: 3
      };

      filtered.sort(
        (a, b) =>
          levelOrder[a.level] -
          levelOrder[b.level]
      );

    }

    else {

      filtered.sort(
        (a, b) =>
          b.popularity -
          a.popularity
      );

    }


    renderSkills(filtered);

  }


  /* =========================================
     SHOW DETAILS
  ========================================= */

  function showDetails(id) {

    const skill =
      videoEditingSkills.find(
        item => item.id === id
      );

    if (!skill) {
      return;
    }


    modalContent.innerHTML = `

      <div
        class="skill-cover cover-${skill.cover}"
        style="
          border-radius:12px;
          margin-bottom:20px;
        "
      >

        <i class="${skill.icon}"></i>

      </div>


      <span class="badge">
        ${escapeHTML(skill.category)}
      </span>


      <h2>
        ${escapeHTML(skill.title)}
      </h2>


      <p>
        ${escapeHTML(skill.description)}
      </p>


      <p>
        <strong>Level:</strong>
        ${escapeHTML(skill.level)}
      </p>


      <p>
        <strong>Duration:</strong>
        ${escapeHTML(skill.duration)}
      </p>


      <h3>
        Key Skills
      </h3>


      <ul>

        ${skill.skills.map(item => `

          <li>

            <i
              class="fa-solid fa-check"
              style="
                color:#16a34a;
                margin-right:7px;
              "
            ></i>

            ${escapeHTML(item)}

          </li>

        `).join("")}

      </ul>


      <button
        type="button"
        class="btn btn-primary"
        onclick="startLearning(${skill.id})"
      >
        Start Learning
      </button>

    `;


    modal.classList.add("active");

    document.body.style.overflow =
      "hidden";

  }


  /* =========================================
     START LEARNING
  ========================================= */

 /* =========================================
     START LEARNING
  ========================================= */

  function startLearning(id) {

    const skill =
      videoEditingSkills.find(
        item => item.id === id
      );

    if (!skill) {
      return;
    }

    modalContent.innerHTML = `

      <div
        class="skill-cover cover-${skill.cover}"
        style="
          border-radius:12px;
          margin-bottom:20px;
        "
      >
        <i class="${skill.icon}"></i>
      </div>

      <span class="badge">
        ${escapeHTML(skill.category)}
      </span>

      <h2>
        Start Learning:
        ${escapeHTML(skill.title)}
      </h2>

      <p>
        Follow this learning path to develop
        practical video editing skills.
      </p>

      <h3>
        Learning Path
      </h3>

      <ol>
        ${skill.skills.map((item, index) => `

          <li>
            <strong>
              Step ${index + 1}:
            </strong>
            ${escapeHTML(item)}
          </li>

        `).join("")}
      </ol>

      <div
        style="
          margin-top:20px;
          padding:15px;
          border-radius:10px;
          background:#fef2f2;
          color:#991b1b;
        "
      >
        <strong>
          Recommended Level:
        </strong>
        ${escapeHTML(skill.level)}
      </div>

      <button
        type="button"
        class="btn btn-primary"
        style="margin-top:20px;"
        onclick="closeDetails()"
      >
        Begin Course
      </button>

    `;

  }


  /* =========================================
     CLOSE MODAL
  ========================================= */

  function closeDetails() {

    modal.classList.remove("active");

    document.body.style.overflow = "";

  }


  closeModal.addEventListener(
    "click",
    closeDetails
  );


  modal.addEventListener(
    "click",
    function(event) {

      if (event.target === modal) {
        closeDetails();
      }

    }
  );


  /* =========================================
     ESC KEY
  ========================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {
        closeDetails();
      }

    }
  );


  /* =========================================
     EVENTS
  ========================================= */

  searchInput.addEventListener(
    "input",
    filterSkills
  );

  levelSelect.addEventListener(
    "change",
    filterSkills
  );

  categorySelect.addEventListener(
    "change",
    filterSkills
  );

  sortSelect.addEventListener(
    "change",
    filterSkills
  );


  /* =========================================
     KEYBOARD SEARCH
  ========================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "/" &&
        document.activeElement.tagName !== "INPUT" &&
        document.activeElement.tagName !== "SELECT"
      ) {

        event.preventDefault();

        searchInput.focus();

      }

    }
  );


  /* =========================================
     RESET FILTERS
  ========================================= */

  function resetFilters() {

    searchInput.value = "";
    levelSelect.value = "all";
    categorySelect.value = "all";
    sortSelect.value = "popularity";

    filterSkills();

  }


  /* =========================================
     INITIAL LOAD
  ========================================= */

  renderSkills(
    [...videoEditingSkills].sort(
      (a, b) =>
        b.popularity -
        a.popularity
    )
  );

</script>

</body>
</html>
