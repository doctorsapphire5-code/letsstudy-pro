<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Order Video | Let'sStudy Pro</title>

<link rel="icon" href="/favicon.ico">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button{
  font:inherit;
  cursor:pointer;
}

.header{
  height:62px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:19px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}

.logo i{
  color:#2563eb;
}

.header-btn{
  border:0;
  background:#f1f5f9;
  width:40px;
  height:40px;
  border-radius:8px;
}

.container{
  width:100%;
  max-width:1050px;
  margin:auto;
  padding:25px 18px 60px;
}

.back{
  border:0;
  background:#fff;
  border:1px solid #dbe2ea;
  padding:10px 14px;
  border-radius:8px;
  font-weight:700;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  overflow:hidden;
}

.thumbnail{
  width:100%;
  aspect-ratio:16/9;
  background:#020617;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.info{
  padding:22px;
}

.title{
  font-size:28px;
  line-height:1.35;
}

.description{
  margin-top:12px;
  color:#64748b;
  line-height:1.7;
  white-space:pre-wrap;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:17px;
}

.badge{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  padding:7px 10px;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
}

.channel{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #e5e7eb;
}

.channel img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.channel-name{
  font-weight:800;
}

.handle{
  color:#64748b;
  font-size:12px;
  margin-top:3px;
}

.order{
  padding:22px;
}

.order h2{
  font-size:21px;
  margin-bottom:18px;
}

.price{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:20px;
  text-align:center;
}

.price-label{
  color:#64748b;
  font-size:12px;
  margin-bottom:7px;
}

.price-value{
  font-size:31px;
  font-weight:900;
  color:#111827;
}

.access{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#fef3c7;
  color:#92400e;
  font-size:13px;
  line-height:1.5;
}

.order-btn{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:13px;
  border-radius:9px;
  margin-top:18px;
  font-weight:800;
}

.order-btn:hover{
  background:#1d4ed8;
}

.free-btn{
  background:#16a34a;
}

.free-btn:hover{
  background:#15803d;
}

.details{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #e5e7eb;
}

.detail{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid #f1f5f9;
  font-size:13px;
}

.detail span:first-child{
  color:#64748b;
}

.detail strong{
  text-align:right;
  overflow-wrap:anywhere;
}

.loading{
  text-align:center;
  padding:100px 20px;
  color:#64748b;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid #e2e8f0;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.error{
  max-width:600px;
  margin:60px auto;
  background:#fff;
  border:1px solid #fecaca;
  border-radius:12px;
  padding:30px;
  text-align:center;
  color:#b91c1c;
}

.error i{
  font-size:40px;
  margin-bottom:12px;
}

.retry{
  margin-top:16px;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 17px;
  border-radius:8px;
  font-weight:700;
}

.hidden{
  display:none!important;
}

@media(max-width:800px){

  .grid{
    grid-template-columns:1fr;
  }

  .title{
    font-size:23px;
  }

}

@media(max-width:600px){

  .container{
    padding:12px 0 40px;
  }

  .card{
    border-radius:0;
    border-left:0;
    border-right:0;
  }

  .info,
  .order{
    padding:16px;
  }

  .header{
    padding:0 10px;
  }

}
</style>
</head>

<body>

<header class="header">

  <button
    class="header-btn"
    id="homeBtn"
    title="Videos"
  >
    <i class="fa-solid fa-house"></i>
  </button>

  <div class="logo">
    <i class="fa-solid fa-circle-play"></i>
    Let'sStudy Pro
  </div>

  <button
    class="header-btn"
    id="backTop"
    title="Back"
  >
    <i class="fa-solid fa-arrow-left"></i>
  </button>

</header>


<main class="container">

  <button
    class="back"
    id="backBtn"
  >
    <i class="fa-solid fa-arrow-left"></i>
    Back to Video
  </button>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <h3>Loading video...</h3>

    <p>
      Reading video information from Firestore.
    </p>

  </div>


  <!-- ERROR -->

  <div
    id="error"
    class="error hidden"
  ></div>


  <!-- CONTENT -->

  <div
    id="content"
    class="grid hidden"
  >

    <!-- VIDEO -->

    <section class="card">

      <div class="thumbnail">

        <img
          id="thumbnail"
          src=""
          alt="Video thumbnail"
        >

      </div>


      <div class="info">

        <h1
          id="title"
          class="title"
        >
          —
        </h1>


        <p
          id="description"
          class="description"
        >
          —
        </p>


        <div
          id="meta"
          class="meta"
        ></div>


        <div class="channel">

          <img
            id="channelImage"
            src=""
            alt="Creator"
          >

          <div>

            <div
              id="channelName"
              class="channel-name"
            >
              Let'sStudy Pro
            </div>

            <div
              id="channelHandle"
              class="handle"
            >
              —
            </div>

          </div>

        </div>

      </div>

    </section>


    <!-- ORDER -->

    <aside class="card">

      <div class="order">

        <h2>
          Get This Video
        </h2>


        <div class="price">

          <div class="price-label">
            Video Price
          </div>

          <div
            id="price"
            class="price-value"
          >
            —
          </div>

        </div>


        <div
          id="accessMessage"
          class="access"
        >
          This video requires a plan.
        </div>


        <button
          id="orderBtn"
          class="order-btn"
        >
          <i class="fa-solid fa-lock"></i>
          Continue to Order
        </button>


        <div class="details">

          <div class="detail">
            <span>Video ID</span>
            <strong id="videoId">—</strong>
          </div>

          <div class="detail">
            <span>Category</span>
            <strong id="category">—</strong>
          </div>

          <div class="detail">
            <span>Duration</span>
            <strong id="duration">—</strong>
          </div>

          <div class="detail">
            <span>Video Type</span>
            <strong id="videoType">—</strong>
          </div>

          <div class="detail">
            <span>Views</span>
            <strong id="views">0</strong>
          </div>

          <div class="detail">
            <span>Status</span>
            <strong id="status">—</strong>
          </div>

          <div class="detail">
            <span>Creator</span>
            <strong id="creatorName">—</strong>
          </div>

        </div>

      </div>

    </aside>

  </div>

</main>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbKXbljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   DOM
===================================================== */

const $ =
  id => document.getElementById(id);

const loading =
  $("loading");

const error =
  $("error");

const content =
  $("content");


/* =====================================================
   VIDEO ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const videoId =
  params.get("id") ||
  params.get("videoId");


let currentVideo =
  null;


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   NUMBER
===================================================== */

function formatNumber(value){

  const n =
    Number(value || 0);

  return n.toLocaleString();

}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

  loading.classList.add(
    "hidden"
  );

  content.classList.add(
    "hidden"
  );

  error.innerHTML = `

    <i class="fa-solid fa-circle-exclamation"></i>

    <h2>
      Unable to Load Video
    </h2>

    <p style="margin-top:8px">
      ${escapeHTML(message)}
    </p>

    <button
      class="retry"
      id="retryBtn"
    >
      Try Again
    </button>

  `;

  error.classList.remove(
    "hidden"
  );


  document.getElementById(
    "retryBtn"
  ).onclick = () => {

    location.reload();

  };

}


/* =====================================================
   LOAD VIDEO
===================================================== */

async function loadVideo(){

  if(!videoId){

    showError(
      "No video ID was provided. Use video-order.html?id=VIDEO_ID"
    );

    return;

  }


  try{

    /*
     * Firestore:
     *
     * videos
     *   └── {videoId}
     *
     * Document ID is used directly.
     */

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const snap =
      await getDoc(
        videoRef
      );


    if(!snap.exists()){

      showError(
        "The requested video does not exist in the videos collection."
      );

      return;

    }


    const data =
      snap.data();


    currentVideo = {

      videoId:snap.id,

      ...data

    };


    /*
     * Only published videos
     * are available to viewers.
     */

    if(
      currentVideo.status &&
      String(
        currentVideo.status
      ).toLowerCase()
      !== "published"
    ){

      showError(
        "This video is not currently published."
      );

      return;

    }


    render();


  }catch(err){

    console.error(
      "Firestore video error:",
      err
    );

    showError(
      "A Firestore error occurred while loading this video."
    );

  }

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  const v =
    currentVideo;


  $("title").textContent =
    v.title ||
    "Untitled Video";


  $("description").textContent =
    v.description ||
    "No description available.";


  $("videoId").textContent =
    v.videoId;


  $("category").textContent =
    v.category ||
    "—";


  $("duration").textContent =
    v.duration ||
    "—";


  $("videoType").textContent =
    v.videoType ||
    "—";


  $("views").textContent =
    formatNumber(v.views);


  $("status").textContent =
    v.status ||
    "—";


  $("creatorName").textContent =
    v.creatorName ||
    "Let'sStudy Pro";


  /*
   * Thumbnail
   */

  const thumbnail =
    v.thumbnail ||
    "https://via.placeholder.com/800x450?text=LetsStudy+Pro";

  $("thumbnail").src =
    thumbnail;


  $("thumbnail").onerror =
    () => {

      $("thumbnail").src =
        "https://via.placeholder.com/800x450?text=Video";

    };


  /*
   * Channel
   */

  $("channelName").textContent =
    v.channelName ||
    v.creatorName ||
    "Let'sStudy Pro";


  $("channelHandle").textContent =
    v.channelHandle
      ? "@" +
        String(
          v.channelHandle
        ).replace(/^@/,"")
      : "";


  $("channelImage").src =
    v.channelImage ||
    `https://ui-avatars.com/api/?name=${
      encodeURIComponent(
        v.channelName ||
        v.creatorName ||
        "LetsStudy Pro"
      )
    }`;


  /*
   * Price
   */

  if(
    v.isFree === true
  ){

    $("price").textContent =
      "FREE";


    $("accessMessage").innerHTML =
      `
      <i class="fa-solid fa-circle-check"></i>
      This video is free. You can watch it immediately.
      `;

    $("accessMessage").style.background =
      "#dcfce7";

    $("accessMessage").style.color =
      "#166534";


    $("orderBtn").classList.add(
      "free-btn"
    );

    $("orderBtn").innerHTML =
      `
      <i class="fa-solid fa-play"></i>
      Watch Free
      `;

  }else{

    const price =
      v.price ?? 0;

    const currency =
      v.currency ||
      "TZS";


    $("price").textContent =
      `${formatNumber(price)} ${currency}`;


    $("accessMessage").innerHTML =
      `
      <i class="fa-solid fa-lock"></i>
      This video requires payment before you can watch it.
      `;

    $("accessMessage").style.background =
      "#fef3c7";

    $("accessMessage").style.color =
      "#92400e";


    $("orderBtn").classList.remove(
      "free-btn"
    );

    $("orderBtn").innerHTML =
      `
      <i class="fa-solid fa-credit-card"></i>
      Continue to Order
      `;

  }


  /*
   * Meta
   */

  $("meta").innerHTML = `

    <span class="badge">
      ${escapeHTML(
        v.category || "Video"
      )}
    </span>

    <span class="badge">
      ${escapeHTML(
        v.duration || "—"
      )}
    </span>

    <span class="badge">
      ${formatNumber(v.views)} views
    </span>

    <span class="badge">
      ${escapeHTML(
        v.videoType || "Video"
      )}
    </span>

    ${
      v.verified === true
      ? `
        <span class="badge">
          <i class="fa-solid fa-circle-check"></i>
          Verified
        </span>
      `
      : ""
    }

  `;


  loading.classList.add(
    "hidden"
  );

  error.classList.add(
    "hidden"
  );

  content.classList.remove(
    "hidden"
  );

}


/* =====================================================
   ORDER / WATCH
===================================================== */

$("orderBtn").onclick =
() => {

  if(!currentVideo){
    return;
  }


  const id =
    encodeURIComponent(
      currentVideo.videoId
    );


  /*
   * FREE VIDEO
   * → watch.html
   */

  if(
    currentVideo.isFree === true
  ){

    location.href =
      `watch.html?id=${id}`;

    return;

  }


  /*
   * PAID / PLAN VIDEO
   * → checkout/payment flow
   *
   * video-order.html itself is
   * the order page, so continue
   * to checkout using the same
   * Firestore document ID.
   */

  location.href =
    `video-checkout.html?id=${id}`;

};


/* =====================================================
   NAVIGATION
===================================================== */

$("homeBtn").onclick =
() => {

  location.href =
    "videos.html";

};


$("backTop").onclick =
() => {

  history.back();

};


$("backBtn").onclick =
() => {

  history.back();

};


/* =====================================================
   START
===================================================== */

loadVideo();

</script>

</body>
</html>
