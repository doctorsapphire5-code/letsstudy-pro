<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Watch Video | LetsStudy Pro</title><meta name="description" content="Watch educational videos on LetsStudy Pro."><style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */

.header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  width:100%;
  max-width:1250px;
  margin:auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back{
  color:#4b5563;
  font-size:14px;
  font-weight:600;
}

.back:hover{
  color:#2563eb;
}

/* PAGE */

.container{
  max-width:1250px;
  margin:auto;
  padding:28px 20px 60px;
}

/* VIDEO */

.video-wrapper{
  background:#000;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.video-wrapper video{
  width:100%;
  display:block;
  max-height:680px;
  background:#000;
}

/* CONTENT */

.content{
  margin-top:25px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:25px;
}

.main-card,
.side-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
}

.main-card{
  padding:25px;
}

.side-card{
  padding:20px;
  height:max-content;
}

.category{
  display:inline-block;
  background:#eff6ff;
  color:#2563eb;
  padding:7px 11px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  margin-bottom:12px;
}

h1{
  font-size:30px;
  line-height:1.25;
  margin-bottom:12px;
}

.description{
  color:#6b7280;
  line-height:1.7;
  font-size:15px;
}

/* META */

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:20px;
}

.meta-item{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  padding:10px 13px;
  border-radius:9px;
  font-size:13px;
  color:#4b5563;
}

/* SIDEBAR */

.side-card h3{
  font-size:18px;
  margin-bottom:16px;
}

.info{
  padding:13px 0;
  border-bottom:1px solid #f0f0f0;
}

.info:last-child{
  border-bottom:0;
}

.info-label{
  font-size:11px;
  color:#9ca3af;
  text-transform:uppercase;
  margin-bottom:4px;
}

.info-value{
  font-size:14px;
  font-weight:600;
}

/* BUTTONS */

.actions{
  display:flex;
  gap:10px;
  margin-top:25px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  padding:12px 17px;
  border-radius:9px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#f3f4f6;
  color:#374151;
}

.btn:hover{
  opacity:.9;
}

/* NOTES */

.extra{
  margin-top:25px;
}

.extra-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:25px;
}

.extra-card h2{
  font-size:21px;
  margin-bottom:13px;
}

.extra-text{
  white-space:pre-wrap;
  color:#4b5563;
  line-height:1.7;
  font-size:14px;
}

/* LOADING */

.loading{
  text-align:center;
  padding:100px 20px;
  color:#6b7280;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ERROR */

.error{
  max-width:600px;
  margin:80px auto;
  background:#fff;
  border:1px solid #fecaca;
  border-radius:16px;
  padding:30px;
  text-align:center;
  color:#dc2626;
}

/* HIDDEN */

.hidden{
  display:none;
}

/* MOBILE */

@media(max-width:850px){

  .content{
    grid-template-columns:1fr;
  }

  h1{
    font-size:24px;
  }

  .container{
    padding:18px 12px 40px;
  }

  .video-wrapper{
    border-radius:10px;
  }

  .main-card,
  .side-card,
  .extra-card{
    padding:18px;
  }

}

</style></head><body><header class="header">  <div class="header-inner"><a href="index.html" class="logo">
  LetsStudy <span>Pro</span>
</a>

<a href="videos.html" class="back">
  ← Back to Videos
</a>

  </div></header><main class="container">  <!-- LOADING -->  <div id="loading" class="loading"><div class="spinner"></div>

<p>Loading video...</p>

  </div>  <!-- ERROR -->  <div id="errorBox" class="error hidden"><h2>Video unavailable</h2>

<p id="errorMessage" style="margin-top:10px;">
  Unable to load this video.
</p>

<a
  href="videos.html"
  class="btn secondary"
  style="display:inline-block;margin-top:20px;"
>
  Back to Videos
</a>

  </div>  <!-- VIDEO PAGE -->  <div id="videoPage" class="hidden"><!-- VIDEO PLAYER -->

<section class="video-wrapper">

  <video
    id="videoPlayer"
    controls
    playsinline
    preload="metadata"
  >

    <source
      id="videoSource"
      src=""
      type="video/mp4"
    >

    Your browser does not support video playback.

  </video>

</section>


<!-- CONTENT -->

<section class="content">


  <div class="main-card">

    <span
      id="videoCategory"
      class="category"
    >
      Video
    </span>


    <h1 id="videoTitle">
      Video Title
    </h1>


    <p
      id="videoDescription"
      class="description"
    >
      Video description.
    </p>


    <div class="meta">

      <div class="meta-item">
        🎓 <span id="videoInstructor">Instructor</span>
      </div>

      <div class="meta-item">
        ⏱ <span id="videoDuration">--</span>
      </div>

      <div class="meta-item">
        📚 <span id="videoLevel">All Levels</span>
      </div>

      <div class="meta-item">
        🌐 <span id="videoLanguage">English</span>
      </div>

    </div>


    <div class="actions">

      <button
        class="btn primary"
        id="playButton"
      >
        ▶ Play Video
      </button>

      <button
        class="btn secondary"
        id="fullscreenButton"
      >
        ⛶ Fullscreen
      </button>

      <button
        class="btn secondary"
        id="nextButton"
      >
        Next Lesson →
      </button>

    </div>

  </div>


  <!-- INFO -->

  <aside class="side-card">

    <h3>Video Information</h3>


    <div class="info">

      <div class="info-label">
        Subject
      </div>

      <div
        class="info-value"
        id="videoSubject"
      >
        —
      </div>

    </div>


    <div class="info">

      <div class="info-label">
        Course
      </div>

      <div
        class="info-value"
        id="videoCourse"
      >
        —
      </div>

    </div>


    <div class="info">

      <div class="info-label">
        Module
      </div>

      <div
        class="info-value"
        id="videoModule"
      >
        —
      </div>

    </div>


    <div class="info">

      <div class="info-label">
        Published
      </div>

      <div
        class="info-value"
        id="videoDate"
      >
        —
      </div>

    </div>

  </aside>

</section>


<!-- NOTES -->

<section
  id="notesSection"
  class="extra hidden"
>

  <div class="extra-card">

    <h2>Lesson Notes</h2>

    <div
      id="videoNotes"
      class="extra-text"
    ></div>

  </div>

</section>


<!-- TRANSCRIPT -->

<section
  id="transcriptSection"
  class="extra hidden"
>

  <div class="extra-card">

    <h2>Transcript</h2>

    <div
      id="videoTranscript"
      class="extra-text"
    ></div>

  </div>

</section>

  </div></main><script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


const loading =
  document.getElementById("loading");

const videoPage =
  document.getElementById("videoPage");

const errorBox =
  document.getElementById("errorBox");

const errorMessage =
  document.getElementById("errorMessage");

const player =
  document.getElementById("videoPlayer");

const source =
  document.getElementById("videoSource");


function first(data, fields){

  for(const field of fields){

    if(
      data[field] !== undefined &&
      data[field] !== null &&
      String(data[field]).trim()
    ){

      return String(data[field]).trim();

    }

  }

  return "";

}


function showError(message){

  loading.classList.add("hidden");

  videoPage.classList.add("hidden");

  errorMessage.textContent =
    message;

  errorBox.classList.remove("hidden");

}


async function loadVideo(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const videoId =
    params.get("id");


  if(!videoId){

    showError(
      "No video ID was provided."
    );

    return;

  }


  try{

    const ref =
      doc(
        db,
        "videos",
        videoId
      );


    const snapshot =
      await getDoc(ref);


    if(!snapshot.exists()){

      showError(
        "This video could not be found."
      );

      return;

    }


    const data =
      snapshot.data() || {};


    const title =
      first(data,[
        "title",
        "name",
        "videoTitle"
      ]) || "Untitled Video";


    const description =
      first(data,[
        "description",
        "details",
        "content"
      ]);


    const category =
      first(data,[
        "category",
        "type"
      ]) || "Video";


    const instructor =
      first(data,[
        "instructor",
        "teacher",
        "author"
      ]) || "LetsStudy Pro";


    const duration =
      first(data,[
        "duration",
        "length"
      ]) || "--";


    const level =
      first(data,[
        "level",
        "difficulty"
      ]) || "All Levels";


    const language =
      first(data,[
        "language"
      ]) || "English";


    const subject =
      first(data,[
        "subject"
      ]) || "—";


    const course =
      first(data,[
        "course",
        "courseName"
      ]) || "—";


    const moduleName =
      first(data,[
        "module",
        "moduleName"
      ]) || "—";


    const videoUrl =
      first(data,[
        "videoUrl",
        "videoURL",
        "video",
        "mp4Url",
        "fileUrl",
        "url"
      ]);


    const notes =
      first(data,[
        "notes",
        "lessonNotes"
      ]);


    const transcript =
      first(data,[
        "transcript",
        "captions"
      ]);


    const published =
      first(data,[
        "publishedDate",
        "date",
        "createdAt"
      ]);


    if(!videoUrl){

      showError(
        "This video does not have a playable video URL."
      );

      return;

    }


    document.title =
      title + " | LetsStudy Pro";


    document.getElementById(
      "videoTitle"
    ).textContent =
      title;


    document.getElementById(
      "videoDescription"
    ).textContent =
      description ||
      "Watch this lesson on LetsStudy Pro.";


    document.getElementById(
      "videoCategory"
    ).textContent =
      category;


    document.getElementById(
      "videoInstructor"
    ).textContent =
      instructor;


    document.getElementById(
      "videoDuration"
    ).textContent =
      duration;


    document.getElementById(
      "videoLevel"
    ).textContent =
      level;


    document.getElementById(
      "videoLanguage"
    ).textContent =
      language;


    document.getElementById(
      "videoSubject"
    ).textContent =
      subject;


    document.getElementById(
      "videoCourse"
    ).textContent =
      course;


    document.getElementById(
      "videoModule"
    ).textContent =
      moduleName;


    document.getElementById(
      "videoDate"
    ).textContent =
      published || "—";


    source.src =
      videoUrl;


    player.load();


    if(notes){

      document.getElementById(
        "videoNotes"
      ).textContent =
        notes;

      document.getElementById(
        "notesSection"
      ).classList.remove("hidden");

    }


    if(transcript){

      document.getElementById(
        "videoTranscript"
      ).textContent =
        transcript;

      document.getElementById(
        "transcriptSection"
      ).classList.remove("hidden");

    }


    loading.classList.add("hidden");

    videoPage.classList.remove("hidden");


  }catch(error){

    console.error(
      "Video loading error:",
      error
    );

    showError(
      "Unable to load this video. Please try again."
    );

  }

}


document
  .getElementById("playButton")
  .addEventListener(
    "click",
    () => {

      if(player.paused){

        player.play();

      }else{

        player.pause();

      }

    }
  );


player.addEventListener(
  "play",
  () => {

    document.getElementById(
      "playButton"
    ).textContent =
      "⏸ Pause Video";

  }
);


player.addEventListener(
  "pause",
  () => {

    document.getElementById(
      "playButton"
    ).textContent =
      "▶ Play Video";

  }
);


document
  .getElementById("fullscreenButton")
  .addEventListener(
    "click",
    async () => {

      try{

        if(player.requestFullscreen){

          await player.requestFullscreen();

        }else if(player.webkitEnterFullscreen){

          player.webkitEnterFullscreen();

        }

      }catch(error){

        console.error(
          "Fullscreen error:",
          error
        );

      }

    }
  );


document
  .getElementById("nextButton")
  .addEventListener(
    "click",
    () => {

      alert(
        "Next lesson system will be connected to your course lessons."
      );

    }
  );


loadVideo();

</script></body>
</html>
