<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Video | LetsStudy Pro</title>

  <meta
    name="description"
    content="Watch educational videos on LetsStudy Pro."
  >

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Inter,Arial,sans-serif;
      background:#f5f7fb;
      color:#172033;
      line-height:1.6;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    button{
      font-family:inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header{
      position:sticky;
      top:0;
      z-index:1000;
      height:68px;
      background:#ffffff;
      border-bottom:1px solid #e7eaf0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 28px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:20px;
      font-weight:800;
      color:#2563eb;
    }

    .brand-icon{
      width:38px;
      height:38px;
      border-radius:11px;
      background:#2563eb;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
    }

    .header-actions{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .back-btn{
      border:1px solid #dce1ea;
      background:#fff;
      color:#273449;
      padding:9px 15px;
      border-radius:9px;
      cursor:pointer;
      font-weight:600;
    }

    .back-btn:hover{
      background:#f1f5f9;
    }

    /* =========================
       PAGE
    ========================= */

    main{
      max-width:1200px;
      margin:0 auto;
      padding:30px 20px 60px;
    }

    .loading,
    .error,
    .not-found{
      background:#fff;
      border-radius:16px;
      padding:50px 20px;
      text-align:center;
      border:1px solid #e7eaf0;
    }

    .error{
      color:#b91c1c;
    }

    .not-found{
      color:#475569;
    }

    /* =========================
       VIDEO
    ========================= */

    .video-wrapper{
      width:100%;
      background:#000;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 12px 35px rgba(15,23,42,.12);
    }

    video{
      display:block;
      width:100%;
      max-height:680px;
      background:#000;
      object-fit:contain;
    }

    .video-placeholder{
      position:relative;
      min-height:420px;
      background:#0f172a;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      text-align:center;
      padding:30px;
    }

    .video-placeholder img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:.35;
    }

    .placeholder-content{
      position:relative;
      z-index:2;
    }

    .play-icon{
      width:76px;
      height:76px;
      border-radius:50%;
      background:#2563eb;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto 16px;
      font-size:30px;
    }

    /* =========================
       CONTENT
    ========================= */

    .content{
      margin-top:24px;
      background:#fff;
      border:1px solid #e7eaf0;
      border-radius:18px;
      padding:28px;
    }

    .badges{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:14px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:5px 10px;
      border-radius:999px;
      background:#eff6ff;
      color:#2563eb;
      font-size:12px;
      font-weight:700;
    }

    .badge.free{
      background:#ecfdf5;
      color:#047857;
    }

    .badge.verified{
      background:#f0fdf4;
      color:#15803d;
    }

    .badge.featured{
      background:#fff7ed;
      color:#c2410c;
    }

    h1{
      font-size:34px;
      line-height:1.2;
      margin-bottom:14px;
      color:#111827;
    }

    .description{
      color:#64748b;
      font-size:16px;
      white-space:pre-line;
    }

    /* =========================
       CREATOR
    ========================= */

    .creator{
      margin-top:25px;
      padding-top:22px;
      border-top:1px solid #edf0f5;
      display:flex;
      align-items:center;
      gap:14px;
    }

    .creator img{
      width:52px;
      height:52px;
      border-radius:50%;
      object-fit:cover;
      background:#e2e8f0;
    }

    .creator-avatar{
      width:52px;
      height:52px;
      border-radius:50%;
      background:#dbeafe;
      color:#2563eb;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:18px;
    }

    .creator-name{
      font-weight:800;
      color:#172033;
    }

    .creator-label{
      color:#94a3b8;
      font-size:13px;
    }

    /* =========================
       STATS
    ========================= */

    .stats{
      margin-top:25px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }

    .stat{
      padding:17px;
      border:1px solid #e8ecf2;
      border-radius:12px;
      background:#fafbfc;
    }

    .stat-value{
      font-size:19px;
      font-weight:800;
      color:#172033;
    }

    .stat-label{
      margin-top:3px;
      font-size:12px;
      color:#64748b;
    }

    /* =========================
       DETAILS
    ========================= */

    .details{
      margin-top:25px;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
    }

    .detail{
      padding:16px;
      background:#f8fafc;
      border-radius:11px;
    }

    .detail-label{
      font-size:12px;
      color:#64748b;
      margin-bottom:4px;
    }

    .detail-value{
      font-weight:700;
      color:#172033;
      word-break:break-word;
    }

    /* =========================
       TAGS
    ========================= */

    .tags-section{
      margin-top:25px;
    }

    .tags-section h3{
      margin-bottom:10px;
      font-size:16px;
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .tag{
      background:#f1f5f9;
      color:#475569;
      padding:6px 10px;
      border-radius:7px;
      font-size:12px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:700px){

      header{
        padding:0 15px;
      }

      .brand{
        font-size:17px;
      }

      .brand-icon{
        width:34px;
        height:34px;
      }

      .back-btn{
        padding:8px 11px;
      }

      main{
        padding:18px 12px 40px;
      }

      .video-wrapper{
        border-radius:12px;
      }

      video{
        min-height:220px;
      }

      .video-placeholder{
        min-height:260px;
      }

      .content{
        padding:20px;
        border-radius:14px;
      }

      h1{
        font-size:25px;
      }

      .stats{
        grid-template-columns:repeat(2,1fr);
      }

      .details{
        grid-template-columns:1fr;
      }

    }

    @media(max-width:420px){

      .stats{
        grid-template-columns:1fr 1fr;
      }

      .stat{
        padding:13px;
      }

      .stat-value{
        font-size:16px;
      }

    }
  </style>
</head>

<body>

<header>

  <a href="index.html" class="brand">
    <span class="brand-icon">🎓</span>
    <span>LetsStudy Pro</span>
  </a>

  <div class="header-actions">
    <button
      class="back-btn"
      onclick="history.back()"
    >
      ← Back
    </button>
  </div>

</header>


<main>

  <div id="loading" class="loading">
    Loading video...
  </div>

  <div
    id="error"
    class="error"
    style="display:none;"
  >
    Unable to load this video.
  </div>

  <div
    id="notFound"
    class="not-found"
    style="display:none;"
  >
    <h2>Video not found</h2>
    <p>The requested video could not be found.</p>
  </div>


  <div
    id="videoPage"
    style="display:none;"
  >

    <!-- VIDEO PLAYER -->

    <div id="videoContainer" class="video-wrapper"></div>


    <!-- VIDEO INFORMATION -->

    <section class="content">

      <div id="badges" class="badges"></div>

      <h1 id="title">
        Video Title
      </h1>

      <p
        id="description"
        class="description"
      ></p>


      <!-- CREATOR -->

      <div
        id="creator"
        class="creator"
      ></div>


      <!-- STATS -->

      <div class="stats">

        <div class="stat">
          <div
            id="views"
            class="stat-value"
          >
            0
          </div>

          <div class="stat-label">
            Views
          </div>
        </div>


        <div class="stat">
          <div
            id="likes"
            class="stat-value"
          >
            0
          </div>

          <div class="stat-label">
            Likes
          </div>
        </div>


        <div class="stat">
          <div
            id="commentsCount"
            class="stat-value"
          >
            0
          </div>

          <div class="stat-label">
            Comments
          </div>
        </div>


        <div class="stat">
          <div
            id="shares"
            class="stat-value"
          >
            0
          </div>

          <div class="stat-label">
            Shares
          </div>
        </div>

      </div>


      <!-- DETAILS -->

      <div class="details">

        <div class="detail">

          <div class="detail-label">
            Category
          </div>

          <div
            id="category"
            class="detail-value"
          >
            —
          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            Duration
          </div>

          <div
            id="duration"
            class="detail-value"
          >
            —
          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            Video Type
          </div>

          <div
            id="videoType"
            class="detail-value"
          >
            —
          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            Price
          </div>

          <div
            id="price"
            class="detail-value"
          >
            —
          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            Status
          </div>

          <div
            id="status"
            class="detail-value"
          >
            —
          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            Published
          </div>

          <div
            id="publishedAt"
            class="detail-value"
          >
            —
          </div>

        </div>

      </div>


      <!-- TAGS -->

      <div
        id="tagsSection"
        class="tags-section"
        style="display:none;"
      >

        <h3>Tags</h3>

        <div
          id="tags"
          class="tags"
        ></div>

      </div>

    </section>

  </div>

</main>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =====================================================
     FIREBASE
  ===================================================== */

  const firebaseConfig = {
    apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
    authDomain: "let-s-study-pro-course.firebaseapp.com",
    databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId: "let-s-study-pro-course",
    storageBucket: "let-s-study-pro-course.firebasestorage.app",
    messagingSenderId: "474928293390",
    appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId: "G-85B7V5H5J0"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  /* =====================================================
     DOM
  ===================================================== */

  const loading =
    document.getElementById("loading");

  const error =
    document.getElementById("error");

  const notFound =
    document.getElementById("notFound");

  const videoPage =
    document.getElementById("videoPage");

  const videoContainer =
    document.getElementById("videoContainer");


  /* =====================================================
     HELPERS
  ===================================================== */

  function escapeHtml(value){

    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  function getParam(name){

    return new URLSearchParams(
      window.location.search
    ).get(name);

  }


  function formatNumber(value){

    const number =
      Number(value || 0);

    return new Intl.NumberFormat(
      "en-US",
      {
        notation:"compact",
        maximumFractionDigits:1
      }
    ).format(number);

  }


  function formatDate(value){

    if(!value) return "—";

    try{

      let date;

      if(
        value &&
        typeof value.toDate === "function"
      ){

        date = value.toDate();

      }else if(
        value &&
        value.seconds
      ){

        date = new Date(
          value.seconds * 1000
        );

      }else{

        date = new Date(value);

      }

      if(
        isNaN(date.getTime())
      ){

        return "—";

      }

      return new Intl.DateTimeFormat(
        "en-US",
        {
          year:"numeric",
          month:"short",
          day:"numeric"
        }
      ).format(date);

    }catch(e){

      return "—";

    }

  }


  function cleanVideoUrl(url){

    if(!url) return "";

    let value =
      String(url).trim();

    if(
      !value.startsWith("http://") &&
      !value.startsWith("https://")
    ){

      value =
        "https://" + value;

    }

    return value;

  }


  function normalizeTags(tags){

    if(Array.isArray(tags)){

      return tags;

    }

    if(typeof tags === "string"){

      return tags
        .split(",")
        .map(tag => tag.trim())
        .filter(Boolean);

    }

    return [];

  }


  /* =====================================================
     VIDEO PLAYER
  ===================================================== */

  function renderVideo(data){

    const videoUrl =
      cleanVideoUrl(data.videoUrl);

    const thumbnail =
      data.thumbnail || "";

    if(!videoUrl){

      videoContainer.innerHTML = `

        <div class="video-placeholder">

          ${
            thumbnail
              ? `
                <img
                  src="${escapeHtml(thumbnail)}"
                  alt="${escapeHtml(data.title || "Video")}"
                >
              `
              : ""
          }

          <div class="placeholder-content">

            <div class="play-icon">
              ▶
            </div>

            <h2>
              Video unavailable
            </h2>

            <p>
              This video does not have a valid video URL.
            </p>

          </div>

        </div>

      `;

      return;

    }


    videoContainer.innerHTML = `

      <video
        id="mainVideo"
        controls
        playsinline
        preload="metadata"
        ${
          thumbnail
            ? `poster="${escapeHtml(thumbnail)}"`
            : ""
        }
      >

        <source
          src="${escapeHtml(videoUrl)}"
          type="${
            data.videoType &&
            String(data.videoType)
              .toLowerCase()
              .includes("mp4")
              ? "video/mp4"
              : "video/mp4"
          }"
        >

        Your browser does not support HTML5 video.

      </video>

    `;

  }


  /* =====================================================
     CREATOR
  ===================================================== */

  function renderCreator(data){

    const creator =
      data.creatorName ||
      "Unknown Creator";

    const image =
      data.creatorImage || "";

    const firstLetter =
      creator.charAt(0).toUpperCase();


    document.getElementById(
      "creator"
    ).innerHTML = `

      ${
        image
          ? `
            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(creator)}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
            >

            <div
              class="creator-avatar"
              style="display:none;"
            >
              ${escapeHtml(firstLetter)}
            </div>
          `
          : `
            <div class="creator-avatar">
              ${escapeHtml(firstLetter)}
            </div>
          `
      }

      <div>

        <div class="creator-label">
          Created by
        </div>

        <div class="creator-name">
          ${escapeHtml(creator)}
        </div>

      </div>

    `;

  }


  /* =====================================================
     BADGES
  ===================================================== */

  function renderBadges(data){

    const badges = [];

    if(data.isFree === true){

      badges.push(
        `<span class="badge free">FREE</span>`
      );

    }

    if(data.featured === true){

      badges.push(
        `<span class="badge featured">FEATURED</span>`
      );

    }

    if(data.verified === true){

      badges.push(
        `<span class="badge verified">✓ VERIFIED</span>`
      );

    }

    if(data.status){

      badges.push(
        `<span class="badge">
          ${escapeHtml(String(data.status))}
        </span>`
      );

    }

    document.getElementById(
      "badges"
    ).innerHTML =
      badges.join("");

  }


  /* =====================================================
     TAGS
  ===================================================== */

  function renderTags(data){

    const tags =
      normalizeTags(data.tags);

    const section =
      document.getElementById(
        "tagsSection"
      );

    const container =
      document.getElementById(
        "tags"
      );


    if(!tags.length){

      section.style.display =
        "none";

      return;

    }


    section.style.display =
      "block";


    container.innerHTML =
      tags.map(tag => `

        <span class="tag">
          #${escapeHtml(tag)}
        </span>

      `).join("");

  }


  /* =====================================================
     LOAD VIDEO
  ===================================================== */

  async function loadVideo(){

    const videoId =
      getParam("id") ||
      getParam("videoId");


    if(!videoId){

      loading.style.display =
        "none";

      notFound.style.display =
        "block";

      return;

    }


    try{

      const videoRef =
        doc(
          db,
          "videos",
          videoId
        );

      const videoSnap =
        await getDoc(videoRef);


      if(!videoSnap.exists()){

        loading.style.display =
          "none";

        notFound.style.display =
          "block";

        return;

      }


      const data =
        videoSnap.data() || {};


      /* =========================
         BASIC INFO
      ========================= */

      document.title =
        `${data.title || "Watch Video"} | LetsStudy Pro`;


      document.getElementById(
        "title"
      ).textContent =
        data.title ||
        "Untitled Video";


      document.getElementById(
        "description"
      ).textContent =
        data.description ||
        "No description available.";


      /* =========================
         STATS
      ========================= */

          document.getElementById(
        "views"
      ).textContent =
        formatNumber(data.views);


      document.getElementById(
        "likes"
      ).textContent =
        formatNumber(data.likes);


      document.getElementById(
        "commentsCount"
      ).textContent =
        formatNumber(data.commentsCount);


      document.getElementById(
        "shares"
      ).textContent =
        formatNumber(data.shares);


      /* =========================
         DETAILS
      ========================= */

      document.getElementById(
        "category"
      ).textContent =
        data.category || "—";


      document.getElementById(
        "duration"
      ).textContent =
        data.duration || "—";


      document.getElementById(
        "videoType"
      ).textContent =
        data.videoType || "—";


      let priceText = "Free";

      if(
        data.isFree !== true &&
        data.price !== undefined &&
        data.price !== null &&
        data.price !== ""
      ){

        priceText =
          `${data.price} ${data.currency || ""}`.trim();

      }


      document.getElementById(
        "price"
      ).textContent =
        priceText;


      document.getElementById(
        "status"
      ).textContent =
        data.status || "—";


      document.getElementById(
        "publishedAt"
      ).textContent =
        formatDate(data.publishedAt);


      /* =========================
         BADGES
      ========================= */

      renderBadges(data);


      /* =========================
         CREATOR
      ========================= */

      renderCreator(data);


      /* =========================
         TAGS
      ========================= */

      renderTags(data);


      /* =========================
         VIDEO PLAYER
      ========================= */

      renderVideo(data);


      /* =========================
         SHOW PAGE
      ========================= */

      loading.style.display = "none";

      videoPage.style.display = "block";


      /* =========================
         VIDEO ERROR HANDLING
      ========================= */

      setTimeout(() => {

        const mainVideo =
          document.getElementById("mainVideo");

        if(!mainVideo) return;

        mainVideo.addEventListener(
          "error",
          () => {

            console.error(
              "Video could not be played:",
              data.videoUrl
            );

          }
        );

      },100);


      /* =========================
         VIEW COUNT
      ========================= */

      /*
        View counting should preferably
        be handled by a secure backend
        or Cloud Function to prevent abuse.
      */

    }catch(err){

      console.error(
        "Video loading error:",
        err
      );

      loading.style.display =
        "none";

      videoPage.style.display =
        "none";

      error.style.display =
        "block";

    }

  }


  /* =====================================================
     START PAGE
  ===================================================== */

  loadVideo();


  /* =====================================================
     YEAR
  ===================================================== */

  const yearElement =
    document.getElementById("year");

  if(yearElement){

    yearElement.textContent =
      new Date().getFullYear();

  }

</script>

</body>
</html>
