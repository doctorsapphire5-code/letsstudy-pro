<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Video | LetsStudy Pro</title>

  <meta
    name="description"
    content="Watch educational videos on LetsStudy Pro."
  >

  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      height: 70px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      color: #2563eb;
    }

    .back-btn {
      border: 0;
      background: #eff6ff;
      color: #2563eb;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 28px 18px 60px;
    }

    .video-card {
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      box-shadow: 0 15px 35px rgba(0,0,0,.12);
    }

    .video-player {
      width: 100%;
      height: 100%;
      background: #000;
    }

    .video-player iframe,
    .video-player video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .video-loading {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
    }

    .content {
      margin-top: 22px;
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      border: 1px solid #e5e7eb;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      background: #eff6ff;
      color: #2563eb;
    }

    .badge.green {
      background: #ecfdf3;
      color: #087443;
    }

    .badge.orange {
      background: #fff7ed;
      color: #c2410c;
    }

    h1 {
      font-size: 30px;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .description {
      color: #667085;
      line-height: 1.7;
      font-size: 15px;
    }

    .channel {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .channel img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #eef2f7;
    }

    .channel-name {
      font-weight: 800;
    }

    .channel-handle {
      color: #667085;
      font-size: 13px;
      margin-top: 3px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 22px;
    }

    .stat {
      background: #f8fafc;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 19px;
      font-weight: 800;
    }

    .stat-label {
      color: #667085;
      font-size: 12px;
      margin-top: 4px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 22px;
    }

    .info {
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px;
    }

    .info-label {
      color: #667085;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .info-value {
      font-weight: 700;
      word-break: break-word;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .action-btn {
      border: 0;
      padding: 12px 17px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      background: #2563eb;
      color: white;
    }

    .action-btn.secondary {
      background: #eef2f6;
      color: #172033;
    }

    .error {
      background: #fff;
      border-radius: 18px;
      padding: 50px 20px;
      text-align: center;
      color: #b42318;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 700px) {

      header {
        padding: 0 14px;
      }

      .brand {
        font-size: 18px;
      }

      main {
        padding: 18px 12px 40px;
      }

      .video-card {
        border-radius: 12px;
      }

      .content {
        padding: 18px;
      }

      h1 {
        font-size: 23px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand">
    🎓 LetsStudy Pro
  </div>

  <button
    class="back-btn"
    onclick="goBack()"
  >
    ← Back
  </button>

</header>


<main>

  <div id="errorBox" class="error hidden">
    <h2>Video unavailable</h2>
    <p id="errorMessage" style="margin-top:8px;"></p>
  </div>


  <div id="contentBox" class="hidden">

    <!-- VIDEO PLAYER -->

    <div class="video-card">

      <div
        id="videoPlayer"
        class="video-player"
      >
        <div class="video-loading">
          Loading video...
        </div>
      </div>

    </div>


    <!-- VIDEO INFORMATION -->

    <section class="content">

      <div class="badges">

        <span
          id="typeBadge"
          class="badge"
        >
          video
        </span>

        <span
          id="accessBadge"
          class="badge green"
        >
          FREE
        </span>

        <span
          id="statusBadge"
          class="badge"
        >
          published
        </span>

        <span
          id="featuredBadge"
          class="badge orange hidden"
        >
          Featured
        </span>

        <span
          id="verifiedBadge"
          class="badge green hidden"
        >
          ✓ Verified
        </span>

      </div>


      <h1 id="title">
        Video Title
      </h1>


      <p
        id="description"
        class="description"
      ></p>


      <!-- CHANNEL -->

      <div class="channel">

        <img
          id="channelImage"
          src=""
          alt="Channel"
          onerror="this.style.display='none'"
        >

        <div>

          <div
            id="channelName"
            class="channel-name"
          >
            —
          </div>

          <div
            id="channelHandle"
            class="channel-handle"
          >
            —
          </div>

        </div>

      </div>


      <!-- STATS -->

      <div class="stats">

        <div class="stat">

          <div
            id="views"
            class="stat-value"
          >
            0
          </div>

          <div class="stat-label">
            Views
          </div>

        </div>


        <div class="stat">

          <div
            id="likes"
            class="stat-value"
          >
            0
          </div>

          <div class="stat-label">
            Likes
          </div>

        </div>


        <div class="stat">

          <div
            id="comments"
            class="stat-value"
          >
            0
          </div>

          <div class="stat-label">
            Comments
          </div>

        </div>


        <div class="stat">

          <div
            id="shares"
            class="stat-value"
          >
            0
          </div>

          <div class="stat-label">
            Shares
          </div>

        </div>

      </div>


      <!-- INFORMATION -->

      <div class="info-grid">

        <div class="info">

          <div class="info-label">
            Category
          </div>

          <div
            id="category"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            Duration
          </div>

          <div
            id="duration"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            Video Type
          </div>

          <div
            id="videoType"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            Access
          </div>

          <div
            id="access"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            Status
          </div>

          <div
            id="status"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            Video ID
          </div>

          <div
            id="videoId"
            class="info-value"
          >
            —
          </div>

        </div>

      </div>


      <!-- ACTIONS -->

      <div class="actions">

        <button
          class="action-btn"
          onclick="shareVideo()"
        >
          🔗 Share Video
        </button>

        <button
          class="action-btn secondary"
          onclick="copyLink()"
        >
          📋 Copy Link
        </button>

      </div>

    </section>

  </div>

</main>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =====================================================
     FIREBASE
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

    authDomain:
      "let-s-study-pro-course.firebaseapp.com",

    databaseURL:
      "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

    projectId:
      "let-s-study-pro-course",

    storageBucket:
      "let-s-study-pro-course.firebasestorage.app",

    messagingSenderId:
      "474928293390",

    appId:
      "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

    measurementId:
      "G-85B7V5H5J0"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);


  /* =====================================================
     URL
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const videoId =
    params.get("id") ||
    params.get("videoId") ||
    "";


  let videoData = null;


  /* =====================================================
     HELPERS
  ===================================================== */

  function safe(value) {

    if (
      value === undefined ||
      value === null ||
      value === ""
    ) {
      return "—";
    }

    return String(value);

  }


  function escapeHtml(value) {

    return String(value ?? "")

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     YOUTUBE EMBED
  ===================================================== */

  function youtubeEmbed(url) {

    try {

      const parsed =
        new URL(url);

      const host =
        parsed.hostname.toLowerCase();

      let id = "";


      if (
        host === "youtu.be" ||
        host.endsWith(".youtu.be")
      ) {

        id =
          parsed.pathname
            .split("/")
            .filter(Boolean)[0] || "";

      }


      if (
        host === "youtube.com" ||
        host === "www.youtube.com" ||
        host.endsWith(".youtube.com")
      ) {

        id =
          parsed.searchParams.get("v") || "";


        const parts =
          parsed.pathname
            .split("/")
            .filter(Boolean);


        if (!id) {

          if (
            parts[0] === "embed" ||
            parts[0] === "shorts" ||
            parts[0] === "live"
          ) {

            id =
              parts[1] || "";

          }

        }

      }


      if (!id) {
        return null;
      }


      return (
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id)
      );

    } catch {

      return null;

    }

  }


  /* =====================================================
     VIMEO EMBED
  ===================================================== */

  function vimeoEmbed(url) {

    try {

      const parsed =
        new URL(url);

      const host =
        parsed.hostname.toLowerCase();


      if (!host.includes("vimeo.com")) {
        return null;
      }


      const parts =
        parsed.pathname
          .split("/")
          .filter(Boolean);


      const id =
        parts[parts.length - 1];


      if (
        !id ||
        !/^\d+$/.test(id)
      ) {

        return null;

      }


      return (
        "https://player.vimeo.com/video/" +
        id
      );

    } catch {

      return null;

    }

  }


  /* =====================================================
     DIRECT VIDEO
  ===================================================== */

  function isDirectVideo(url) {

    return /\.(mp4|webm|ogg|m4v|mov)(\?.*)?$/i
      .test(url);

  }


  /* =====================================================
     RENDER VIDEO
  ===================================================== */

  function renderVideo(url) {

    const player =
      document.getElementById(
        "videoPlayer"
      );


    if (!url) {

      player.innerHTML = `

        <div class="video-loading">
          Video unavailable
        </div>

      `;

      return;

    }


    const youtube =
      youtubeEmbed(url);


    if (youtube) {

      player.innerHTML = `

        <iframe

          src="${youtube}"

          title="${escapeHtml(
            videoData?.title ||
            "LetsStudy Pro Video"
          )}"

          loading="lazy"

          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share
          "

          allowfullscreen>

        </iframe>

      `;

      return;

    }


    const vimeo =
      vimeoEmbed(url);


    if (vimeo) {

      player.innerHTML = `

        <iframe

          src="${vimeo}"

          title="${escapeHtml(
            videoData?.title ||
            "LetsStudy Pro Video"
          )}"

          loading="lazy"

          allow="
            autoplay;
            fullscreen;
            picture-in-picture
          "

          allowfullscreen>

        </iframe>

      `;

      return;

    }


    if (isDirectVideo(url)) {

      const poster =
        videoData?.thumbnail || "";


      player.innerHTML = `

        <video

          controls

          playsinline

          preload="metadata"

          ${poster
            ? `poster="${escapeHtml(poster)}"`
            : ""
          }

        >

          <source
            src="${escapeHtml(url)}"
          >

          Your browser does not support
          HTML5 video playback.

        </video>

      `;

      return;

    }


    /*
      Generic embed URL
    */

    player.innerHTML = `

      <iframe

        src="${escapeHtml(url)}"

        title="${escapeHtml(
          videoData?.title ||
          "LetsStudy Pro Video"
        )}"

        loading="lazy"

        allow="
          autoplay;
          fullscreen;
          encrypted-media;
          picture-in-picture
        "

        allowfullscreen>

      </iframe>

    `;

  }


  /* =====================================================
     LOAD VIDEO
  ===================================================== */

  async function loadVideo() {

    if (!videoId) {

      showError(
        "No video ID was provided."
      );

      return;

    }


    try {

      const videoRef =
        doc(
          db,
          "videos",
          videoId
        );


      const videoSnap =
        await getDoc(videoRef);


      if (!videoSnap.exists()) {

        showError(
          "This video could not be found."
        );

        return;

      }


      videoData =
        videoSnap.data();


      /* ===============================
         BASIC INFORMATION
      =============================== */

      document.getElementById(
        "title"
      ).textContent =
        safe(videoData.title);


      document.getElementById(
        "description"
      ).textContent =
        safe(videoData.description);


      document.getElementById(
        "views"
      ).textContent =
        safe(videoData.views || 0);


      document.getElementById(
        "likes"
      ).textContent =
        safe(videoData.likes || 0);


      document.getElementById(
        "comments"
      ).textContent =
        safe(videoData.commentsCount || 0);


      document.getElementById(
        "shares"
      ).textContent =
        safe(videoData.shares || 0);


      /* ===============================
         CHANNEL
      =============================== */

      document.getElementById(
        "channelName"
      ).textContent =
        safe(
          videoData.channelName ||
          videoData.creatorName
        );


      document.getElementById(
        "channelHandle"
      ).textContent =
        safe(
          videoData.channelHandle
        );


      const channelImage =
        document.getElementById(
          "channelImage"
        );


      if (
        videoData.channelImage
      ) {

        channelImage.src =
          videoData.channelImage;

        channelImage.style.display =
          "block";

      } else {

        channelImage.style.display =
          "none";

      }


      /* ===============================
         BADGES
      =============================== */

      document.getElementById(
        "typeBadge"
      ).textContent =
        safe(
          videoData.videoType ||
          "video"
        );


      const isFree =
        videoData.isFree === true;


      document.getElementById(
        "accessBadge"
      ).textContent =
        isFree
          ? "FREE"
          : "PAID";


      document.getElementById(
        "access"
      ).textContent =
        isFree
          ? "Free"
          : "Paid";


      document.getElementById(
        "statusBadge"
      ).textContent =
        safe(videoData.status);


      document.getElementById(
        "status"
      ).textContent =
        safe(videoData.status);


      if (
        videoData.featured === true
      ) {

        document.getElementById(
          "featuredBadge"
        ).classList.remove(
          "hidden"
        );

      }


      if (
        videoData.verified === true
      ) {

        document.getElementById(
          "verifiedBadge"
        ).classList.remove(
          "hidden"
        );

      }


      /* ===============================
         DETAILS
      =============================== */

      document.getElementById(
        "category"
      ).textContent =
        safe(videoData.category);


      document.getElementById(
        "duration"
      ).textContent =
        safe(videoData.duration);


      document.getElementById(
        "videoType"
      ).textContent =
        safe(videoData.videoType);


      document.getElementById(
        "videoId"
      ).textContent =
        videoId;


      /* ===============================
         VIDEO PLAYER
      =============================== */

      /* ===============================
   VIDEO PLAYER
=============================== */

renderVideo(
  videoData.videoUrl
);


/* ===============================
   SHOW CONTENT
=============================== */

document
  .getElementById("contentBox")
  .classList.remove("hidden");

} catch (error) {

  console.error(
    "Video loading error:",
    error
  );

  showError(
    error.message ||
    "Unable to load video."
  );

}

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  document
    .getElementById("contentBox")
    .classList.add("hidden");

  document
    .getElementById("errorBox")
    .classList.remove("hidden");

  document.getElementById(
    "errorMessage"
  ).textContent = message;

}


/* =====================================================
   SHARE VIDEO
===================================================== */

window.shareVideo = async function() {

  const url =
    window.location.href;

  const title =
    videoData?.title ||
    "LetsStudy Pro Video";

  const description =
    videoData?.description ||
    "Watch this video on LetsStudy Pro.";


  if (navigator.share) {

    try {

      await navigator.share({
        title: title,
        text: description,
        url: url
      });

    } catch (error) {

      console.log(
        "Share cancelled."
      );

    }

  } else {

    await copyLink();

  }

};


/* =====================================================
   COPY VIDEO LINK
===================================================== */

window.copyLink = async function() {

  try {

    await navigator.clipboard.writeText(
      window.location.href
    );

    alert(
      "Video link copied successfully."
    );

  } catch (error) {

    const input =
      document.createElement("input");

    input.value =
      window.location.href;

    document.body.appendChild(input);

    input.select();

    document.execCommand("copy");

    input.remove();

    alert(
      "Video link copied successfully."
    );

  }

};


/* =====================================================
   BACK
===================================================== */

window.goBack = function() {

  if (document.referrer) {

    history.back();

  } else {

    window.location.href =
      "videos.html";

  }

};


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      goBack();

    }

  }
);


/* =====================================================
   START VIDEO PAGE
===================================================== */

loadVideo();

</script>

</body>
</html>
