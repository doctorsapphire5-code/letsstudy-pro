   VIDEO ID
===================================================== */

const params =

/* =====================================================
   HELPERS
===================================================== */

function safe(value){

  if(
    value === undefined ||
    value === null
  ){
    return "";
  }

  return String(value).trim();

}


function escapeHtml(value){

  return safe(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   YOUTUBE
===================================================== */

function getYouTubeId(url){

  try{

    const parsed =
      new URL(url);

    const host =
      parsed.hostname
        .replace("www.","")
        .replace("m.","");


    if(host === "youtube.com"){

      if(
        parsed.pathname === "/watch"
      ){

        return parsed.searchParams.get("v");

      }


      if(
        parsed.pathname.startsWith("/shorts/")
      ){

        return parsed.pathname
          .split("/shorts/")[1]
          .split("/")[0];

      }


      if(
        parsed.pathname.startsWith("/embed/")
      ){

        return parsed.pathname
          .split("/embed/")[1]
          .split("/")[0];

      }

    }


    if(host === "youtu.be"){

      return parsed.pathname
        .replace("/","")
        .split("/")[0];

    }

  }catch(error){

    console.error(error);

  }

  return null;

}


/* =====================================================
   VIMEO
===================================================== */

function getVimeoId(url){

  try{

    const parsed =
      new URL(url);

    if(
      parsed.hostname.includes("vimeo.com")
    ){

      const parts =
        parsed.pathname
          .split("/")
          .filter(Boolean);

      return (
        parts.find(
          part => /^\d+$/.test(part)
        ) || null
      );

    }

  }catch(error){

    console.error(error);

  }

  return null;

}


/* =====================================================
   DIRECT VIDEO
===================================================== */

function isDirectVideo(url){

  const value =
    safe(url).toLowerCase();

  return (
    value.includes(".mp4") ||
    value.includes(".webm") ||
    value.includes(".ogg") ||
    value.includes(".m4v") ||
    value.includes(".mov")
  );

}


/* =====================================================
   PLAYER
===================================================== */

function createPlayer(
  videoUrl,
  thumbnail
){

  const url =
    safe(videoUrl);


  if(!url){

    return `

      <div class="video-error">

        <div class="icon">
          🎬
        </div>

        <h3>
          Video unavailable
        </h3>

        <p>
          This video does not have a valid video link.
        </p>

      </div>

    `;

  }


  /* DIRECT VIDEO */

  if(isDirectVideo(url)){

    return `

      <video
        controls
        playsinline
        preload="metadata"
        ${thumbnail
          ? `poster="${escapeHtml(thumbnail)}"`
          : ""
        }
      >

        <source
          src="${escapeHtml(url)}"
        >

        Your browser does not support HTML5 video.

      </video>

    `;

  }


  /* YOUTUBE */

  const youtubeId =
    getYouTubeId(url);

  if(youtubeId){

    return `

      <iframe

        src="https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}"

        title="Video Player"

        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share
        "

        allowfullscreen>

      </iframe>

    `;

  }


  /* VIMEO */

  const vimeoId =
    getVimeoId(url);

  if(vimeoId){

    return `

      <iframe

        src="https://player.vimeo.com/video/${encodeURIComponent(vimeoId)}"

        title="Video Player"

        allow="
          autoplay;
          fullscreen;
          picture-in-picture
        "

        allowfullscreen>

      </iframe>

    `;

  }


  /* OTHER DIRECT URL */

  return `

    <video
      controls
      playsinline
      preload="metadata"
      ${thumbnail
        ? `poster="${escapeHtml(thumbnail)}"`
        : ""
      }
    >

      <source
        src="${escapeHtml(url)}"
      >

      Your browser does not support HTML5 video.

    </video>

  `;

}


/* =====================================================
   LOAD VIDEO
===================================================== */

async function loadVideo(){

  const page =
    document.getElementById("page");


  if(!videoId){

    page.innerHTML = `

      <div class="error">

        <h2>
          Video ID missing
        </h2>

        <p>
          Open this page using a valid video ID.
        </p>

      </div>

    `;

    return;

  }


  try{

    /*
      Read ONLY the requested video document.
    */

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const videoSnap =
      await getDoc(videoRef);


    if(!videoSnap.exists()){

      page.innerHTML = `

        <div class="error">

          <h2>
            Video not found
          </h2>

          <p>
            This video does not exist.
          </p>

        </div>

      `;

      return;

    }


    renderVideo(
      videoSnap.id,
      videoSnap.data()
    );


  }catch(error){

    console.error(
      "Video loading error:",
      error
    );


    page.innerHTML = `

      <div class="error">

        <h2>
          Unable to load video
        </h2>

        <p>
          ${escapeHtml(error.message)}
        </p>

      </div>

    `;

  }

}


/* =====================================================
   RENDER VIDEO
===================================================== */

    safe(video.videoUrl);

    safe(video.thumbnail);

  const videoType =
    safe(video.videoType) ||
    "video";

  const duration =
    safe(video.duration) ||
    "—";

    safe(video.category) ||
    "General";

  const status =
    safe(video.status) ||
    "published";

  const channelName =
    safe(video.channelName) ||
    "LetsStudy Pro";

  const channelHandle =
    safe(video.channelHandle);

  const channelImage =
    safe(video.channelImage);

  const creatorName =
    safe(video.creatorName);

  const views =
    safe(video.views) || "0";

  const likes =
    safe(video.likes) || "0";

  const comments =
    safe(video.commentsCount) || "0";

  const shares =
    safe(video.shares) || "0";

  const isFree =
    video.isFree === true;

  const featured =
    video.featured === true;

  const verified =
    video.verified === true;

    safe(video.currency);

    "breadcrumbTitle"
  ).textContent = title;


  let tags = [];


  if(Array.isArray(video.tags)){

    tags =
      video.tags;

  }else if(video.tags){

    tags =
      String(video.tags)
        .split(",")
        .map(tag => tag.trim())
        .filter(Boolean);

  }


  document.getElementById(
    "page"
  ).innerHTML = `


    <!-- VIDEO PLAYER -->

    <div class="video-card">

      <div class="video-wrapper">

        ${createPlayer(
          videoUrl,
          thumbnail

      </div>

    </div>


    <!-- CONTENT -->

    <div class="content-grid">


      <!-- MAIN -->

      <section class="card">

        <div class="badges">

          ${
            isFree

            `
            <span class="badge green">
              FREE
            </span>
            `

              PAID
            </span>
            `
          }


          ${

            ?
            `
            <span class="badge">
              ⭐ Featured
            </span>
            `

            ""
          }


          ${

              ✓ Verified
            </span>
            `

            ""
          }


          <span class="badge gray">
            ${escapeHtml(videoType)}
          </span>

        </div>


        <h1 class="title">

          ${escapeHtml(title)}

        </h1>


        <p class="description">

          ${escapeHtml(description)}

        </p>


        <!-- CHANNEL -->

        <div class="channel">

          ${
            channelImage
            ?
            `
            <img
              class="channel-image"
              src="${escapeHtml(channelImage)}"
              alt="${escapeHtml(channelName)}"
            >
            `
            :
            `
            <div class="channel-image"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:22px;
              "
            >
              🎓
            </div>
            `
          }


          <div>

            <div class="channel-name">

              ${escapeHtml(channelName)}

            </div>


            ${
              channelHandle
              ?
              `
              <div class="channel-handle">

                ${escapeHtml(channelHandle)}

              </div>
              `
              :
              ""
            }

          </div>

        </div>


        <!-- STATS -->

        <div class="stats">

          <span>
            👁 ${escapeHtml(views)} views
          </span>

          <span>
            👍 ${escapeHtml(likes)}
          </span>

          <span>
            💬 ${escapeHtml(comments)}
          </span>

          <span>
            🔗 ${escapeHtml(shares)}
          </span>

        </div>


        ${
          tags.length
          ?
          `
          <div class="tags">

            ${tags.map(tag => `

              <span class="tag">

                #${escapeHtml(tag)}

              </span>

            `).join("")}

          </div>
          `
          :
          ""
        }


        ${
          videoUrl
          ?
          `
          <button
            class="share-btn"
            id="shareBtn"
          >

            🔗 Share Video

          </button>
          `
          :
          ""
        }

      </section>


      <!-- SIDEBAR -->

      <aside class="card">

        <h3 style="margin-bottom:18px;">
          Video Information
        </h3>


        <div class="info-list">


          <div class="info-item">

            <div class="info-icon">
              📂
            </div>

            <div>

              <div class="info-label">
                Category
              </div>

              <div class="info-value">
                ${escapeHtml(category)}
              </div>

            </div>

          </div>


          <div class="info-item">

            <div class="info-icon">
              🎬
            </div>

            <div>

              <div class="info-label">
                Video Type
              </div>

              <div class="info-value">
                ${escapeHtml(videoType)}
              </div>

            </div>

          </div>


          <div class="info-item">

            <div class="info-icon">
              ⏱
            </div>

            <div>

              <div class="info-label">
                Duration
              </div>

              <div class="info-value">
                ${escapeHtml(duration)}
              </div>

            </div>

          </div>


          <div class="info-item">

            <div class="info-icon">
              💳
            </div>

            <div>

              <div class="info-label">
                Access
              </div>

              <div class="info-value">

                ${
                  isFree
                  ?
                  "Free"
                  :
                  (
                    price
                    ?
                    `${escapeHtml(
                      currency
                    )} ${escapeHtml(price)}`
                    :
                    "Paid"
                  )
                }

              </div>

            </div>

          </div>


          <div class="info-item">

            <div class="info-icon">
              🟢
            </div>

            <div>

              <div class="info-label">
                Status
              </div>

              <div class="info-value">
                ${escapeHtml(status)}
              </div>

            </div>

          </div>


          <div class="info-item">

            <div class="info-icon">
              🆔
            </div>

            <div>

              <div class="info-label">
                Video ID
              </div>

              <div class="info-value">
                ${escapeHtml(id)}
              </div>

            </div>

          </div>


        </div>

      </aside>

    </div>

  `;


  /* ===================================================
     SHARE
  =================================================== */

  const shareBtn =
    document.getElementById(
      "shareBtn"
    );


  if(shareBtn){

    shareBtn.addEventListener(
      "click",
      async () => {

        try{

          if(navigator.share){

            await navigator.share({
  title: title,
  text:
    "Watch this video on LetsStudy Pro: " + title,
  url: window.location.href
});

} catch (error) {
  console.error("Share failed:", error);
}
}

function formatDate(value) {
  if (!value) return "—";

  try {
    if (value.toDate) {
      return value.toDate().toLocaleDateString();
    }

    const date = new Date(value);

    if (!isNaN(date.getTime())) {
      return date.toLocaleDateString();
    }

  } catch (error) {
    console.error(error);
  }

  return "—";
}

function safe(value) {
  return value || "—";
}

  const errorBox = document.getElementById("errorBox");

    <p>${escapeHtml(message)}</p>

      ← Go Back
    </button>
  `;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getYouTubeEmbed(url) {
  try {
    const parsed = new URL(url);

    let videoId = "";

    if (parsed.hostname.includes("youtu.be")) {
      videoId = parsed.pathname.replace("/", "");
    }

    if (parsed.hostname.includes("youtube.com")) {
      videoId =
        parsed.searchParams.get("v") ||
        parsed.pathname.split("/").filter(Boolean).pop();
    }

    if (!videoId) return null;

    return `https://www.youtube.com/embed/${videoId}`;
  } catch {
    return null;
  }
}

function getVimeoEmbed(url) {
  try {
    const parsed = new URL(url);

    if (!parsed.hostname.includes("vimeo.com")) {
      return null;
    }

    const parts = parsed.pathname
      .split("/")
      .filter(Boolean);

    const videoId = parts[parts.length - 1];

    if (!videoId || !/^\d+$/.test(videoId)) {
      return null;
    }

    return `https://player.vimeo.com/video/${videoId}`;
  } catch {
    return null;
  }
}

function isDirectVideo(url) {
  return /\.(mp4|webm|ogg|m4v|mov)(\?.*)?$/i.test(url);
}

function renderVideo(url) {
  const player = document.getElementById("videoPlayer");

  if (!url) {
    player.innerHTML = `
      <div class="video-unavailable">
        <div class="video-icon">🎬</div>
        <h3>Video Unavailable</h3>
        <p>This lesson does not have a video URL yet.</p>
      </div>
    `;
    return;
  }

  const youtube = getYouTubeEmbed(url);

  if (youtube) {
    player.innerHTML = `
      <iframe
        src="${youtube}"
        title="Lesson Video"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share
        "
        allowfullscreen>
      </iframe>
    `;
    return;
  }

  const vimeo = getVimeoEmbed(url);

  if (vimeo) {
    player.innerHTML = `
      <iframe
        src="${vimeo}"
        title="Lesson Video"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
    `;
    return;
  }

  if (isDirectVideo(url)) {
    player.innerHTML = `
      <video
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload"
      >
        <source src="${escapeHtml(url)}">

        Your browser does not support HTML5 video.
      </video>
    `;
    return;
  }

  player.innerHTML = `
    <iframe
      src="${escapeHtml(url)}"
      title="Lesson Content"
      allowfullscreen>
    </iframe>
  `;
}

async function loadLesson() {
  const params = new URLSearchParams(window.location.search);

  const lessonId =
    params.get("id") ||
    params.get("lessonId");

  if (!lessonId) {
    showError("No lesson ID was provided.");
    return;
  }

  try {
    const lessonRef = doc(db, "lessons", lessonId);
    const lessonSnap = await getDoc(lessonRef);

    if (!lessonSnap.exists()) {
      showError("This lesson could not be found.");
      return;
    }

    lesson = {
      id: lessonSnap.id,
      ...lessonSnap.data()
    };

    document.title =
      `${lesson.title || "Lesson"} | LetsStudy Pro`;

    document.getElementById("lessonTitle").textContent =
      safe(lesson.title);

    document.getElementById("lessonDescription").textContent =
      safe(lesson.description);

    document.getElementById("lessonType").textContent =
      safe(lesson.type);

    document.getElementById("lessonDuration").textContent =
      safe(lesson.duration);

    document.getElementById("lessonOrder").textContent =
      safe(lesson.order);

    document.getElementById("lessonStatus").textContent =
      safe(lesson.status);

    document.getElementById("courseId").textContent =
      safe(lesson.courseId);

    document.getElementById("moduleId").textContent =
      safe(lesson.moduleId);

    document.getElementById("createdBy").textContent =
      safe(lesson.createdBy);

    document.getElementById("createdAt").textContent =
      formatDate(lesson.createdAt);

    renderVideo(lesson.contentUrl);

    document.getElementById("loading").style.display = "none";
    document.getElementById("lessonContent").style.display = "block";

  } catch (error) {
    console.error("Lesson loading error:", error);

    showError(
          error.message || "An unexpected error occurred."
    );
  }
}

loadLesson();

/* =====================================================
   VIDEO PLAYER EVENTS
===================================================== */

document.addEventListener("contextmenu", function (event) {
  const video = event.target.closest("video");

  if (video) {
    event.preventDefault();
  }
});

/* =====================================================
   PREVENT ACCIDENTAL PAGE RELOAD
===================================================== */

window.addEventListener("beforeunload", function () {
  const video = document.querySelector("video");

  if (video && !video.paused) {
    video.pause();
  }
});

/* =====================================================
   MOBILE MENU
===================================================== */

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const closeSidebar = document.getElementById("closeSidebar");

if (menuBtn) {
  menuBtn.addEventListener("click", () => {
    sidebar.classList.add("open");
    overlay.classList.add("show");
  });
}

if (closeSidebar) {
  closeSidebar.addEventListener("click", () => {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
  });
}

if (overlay) {
  overlay.addEventListener("click", () => {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
  });
}

/* =====================================================
   CLOSE SIDEBAR WHEN LINK IS CLICKED
===================================================== */

document.querySelectorAll("#sidebar a").forEach(link => {
  link.addEventListener("click", () => {
    sidebar?.classList.remove("open");
    overlay?.classList.remove("show");
  });
});

/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    sidebar?.classList.remove("open");
    overlay?.classList.remove("show");
  }
});
</script>
