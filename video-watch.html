<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Watch educational videos on LetsStudy Pro.">

  <title>Watch Video | LetsStudy Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      background: #0f1117;
      color: #ffffff;

      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 68px;

      position: sticky;
      top: 0;

      z-index: 1000;

      background: #151821;

      border-bottom:
        1px solid #252936;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #7c3aed
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
      font-weight: 900;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
    }

    .brand-name span {
      color: #818cf8;
    }

    .back-btn {
      border: 0;

      background: #222631;

      color: #ffffff;

      padding: 9px 15px;

      border-radius: 9px;

      cursor: pointer;

      font-weight: 700;

      transition: .2s;
    }

    .back-btn:hover {
      background: #303541;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1250px;

      margin: auto;

      padding: 28px 20px 60px;
    }

    /* =========================
       PLAYER
    ========================= */

    .player-wrapper {
      width: 100%;

      background: #000000;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);
    }

    video {
      display: block;

      width: 100%;

      max-height: 700px;

      background: #000000;
    }

    /* =========================
       VIDEO INFO
    ========================= */

    .video-info {
      padding: 25px 0;
    }

    .badges {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;

      align-items: center;

      padding: 5px 9px;

      border-radius: 20px;

      font-size: 11px;

      font-weight: 800;

      text-transform: uppercase;
    }

    .badge.free {
      background: #123b27;
      color: #5ee7a1;
    }

    .badge.paid {
      background: #3a2c10;
      color: #fbbf24;
    }

    .badge.featured {
      background: #33205a;
      color: #c4b5fd;
    }

    .badge.verified {
      background: #102f48;
      color: #60a5fa;
    }

    .badge.status {
      background: #242833;
      color: #aeb5c4;
    }

    h1 {
      font-size: 30px;

      line-height: 1.3;

      margin-bottom: 10px;
    }

    .description {
      color: #aeb5c4;

      font-size: 15px;

      max-width: 900px;

      white-space: pre-line;
    }

    /* =========================
       CHANNEL
    ========================= */

    .channel {
      margin-top: 22px;

      padding: 16px;

      background: #171a22;

      border:
        1px solid #272b36;

      border-radius: 13px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;
    }

    .channel-left {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .channel-image {
      width: 50px;
      height: 50px;

      border-radius: 50%;

      object-fit: cover;

      background: #272b36;
    }

    .channel-name {
      font-weight: 800;

      font-size: 15px;
    }

    .channel-handle {
      color: #8f97a8;

      font-size: 13px;
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 9px;

      margin-top: 18px;
    }

    .action-btn {
      border: 1px solid #303541;

      background: #1a1e27;

      color: #ffffff;

      border-radius: 9px;

      padding: 9px 14px;

      cursor: pointer;

      font-size: 13px;

      font-weight: 700;
    }

    .action-btn:hover {
      background: #252a35;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;

      margin-top: 20px;
    }

    .stat {
      background: #171a22;

      border:
        1px solid #272b36;

      border-radius: 12px;

      padding: 15px;
    }

    .stat-label {
      color: #858da0;

      font-size: 11px;

      text-transform: uppercase;

      font-weight: 800;

      margin-bottom: 3px;
    }

    .stat-value {
      font-size: 17px;

      font-weight: 800;
    }

    /* =========================
       DETAILS
    ========================= */

    .details {
      margin-top: 20px;

      background: #171a22;

      border:
        1px solid #272b36;

      border-radius: 14px;

      padding: 20px;
    }

    .details h2 {
      font-size: 18px;

      margin-bottom: 16px;
    }

    .detail-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;
    }

    .detail {
      background: #1d212a;

      border-radius: 9px;

      padding: 12px;
    }

    .detail-label {
      display: block;

      color: #858da0;

      font-size: 11px;

      text-transform: uppercase;

      font-weight: 800;
    }

    .detail-value {
      display: block;

      margin-top: 2px;

      font-size: 13px;

      font-weight: 700;

      word-break: break-word;
    }

    /* =========================
       TAGS
    ========================= */

    .tags {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 20px;
    }

    .tag {
      padding: 6px 10px;

      background: #20242e;

      color: #aeb5c4;

      border-radius: 20px;

      font-size: 12px;
    }

    /* =========================
       ERROR / LOADING
    ========================= */

    .state {
      min-height: 350px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: #9ca3af;
    }

    .state-icon {
      font-size: 45px;

      margin-bottom: 10px;
    }

    .state h2 {
      color: #ffffff;

      margin-bottom: 5px;
    }

    .error {
      color: #f87171;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

      header {
        padding: 0 14px;
      }

      .brand-name {
        font-size: 16px;
      }

      .back-btn {
        padding: 8px 11px;
      }

      main {
        padding:
          15px
          10px
          45px;
      }

      .player-wrapper {
        border-radius: 10px;
      }

      h1 {
        font-size: 23px;
      }

      .channel {
        align-items: flex-start;

        flex-direction: column;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <a
      href="videos.html"
      class="brand">

      <div class="brand-logo">
        LS
      </div>

      <div class="brand-name">
        LetsStudy <span>Pro</span>
      </div>

    </a>


    <button
      class="back-btn"
      onclick="history.back()">

      ← Back

    </button>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <div id="content">

      <div class="state">

        <div class="state-icon">
          ⏳
        </div>

        <h2>
          Loading video...
        </h2>

        <p>
          Please wait.
        </p>

      </div>

    </div>

  </main>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

      authDomain:
        "let-s-study-pro-course.firebaseapp.com",

      databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

      projectId:
        "let-s-study-pro-course",

      storageBucket:
        "let-s-study-pro-course.firebasestorage.app",

      messagingSenderId:
        "474928293390",

      appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

      measurementId:
        "G-85B7V5H5J0"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const db =
      getFirestore(app);


    /* =========================
       ELEMENTS
    ========================= */

    const content =
      document.getElementById(
        "content"
      );


    /* =========================
       URL
    ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const videoId =
      params.get("id")
      ||
      params.get("videoId")
      ||
      "";


    /* =========================
       HELPERS
    ========================= */

    function safe(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value).trim();

    }


    function escapeHtml(value) {

      return safe(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    function formatNumber(value) {

      const number =
        Number(value);

      if (
        !Number.isFinite(number)
      ) {
        return "0";
      }

      return number.toLocaleString();

    }


    function formatDate(value) {

      if (!value) {
        return "—";
      }

      try {

        if (
          typeof value === "object" &&
          typeof value.toDate === "function"
        ) {

          return value
            .toDate()
            .toLocaleDateString(
              undefined,
              {
                year: "numeric",
                month: "short",
                day: "numeric"
              }
            );

        }


        const date =
          new Date(value);


        if (
          Number.isNaN(
            date.getTime()
          )
        ) {

          return "—";

        }


        return date.toLocaleDateString(
          undefined,
          {
            year: "numeric",
            month: "short",
            day: "numeric"
          }
        );

      } catch {

        return "—";

      }

    }


    /* =========================
       LOAD VIDEO
    ========================= */

    async function loadVideo() {

      if (!videoId) {

        showError(
          "Video ID is missing.",
          "Open the video from the videos page."
        );

        return;

      }


      try {

        const videoRef =
          doc(
            db,
            "videos",
            videoId
          );


        const snapshot =
          await getDoc(
            videoRef
          );


        if (!snapshot.exists()) {

          showError(
            "Video not found.",
            "This video may have been removed."
          );

          return;

        }


        const data =
          snapshot.data() || {};


        renderVideo(
          data,
          snapshot.id
        );


      } catch (error) {

        console.error(
          "Video loading error:",
          error
        );


        showError(
          "Unable to load video.",
          error.message
            || "Something went wrong."
        );

      }

    }


    /* =========================
       ERROR
    ========================= */

    function showError(
      title,
      message
    ) {

      content.innerHTML = `

        <div class="state">

          <div class="state-icon">
            ⚠️
          </div>

          <h2 class="error">
            ${escapeHtml(title)}
          </h2>

          <p>
            ${escapeHtml(message)}
          </p>

        </div>

      `;

    }


    /* =========================
       RENDER
    ========================= */

    function renderVideo(
      data,
      documentId
    ) {

      const title =
        safe(data.title)
        || "Untitled Video";


      const description =
        safe(data.description);


      const videoUrl =
        safe(data.videoUrl);


      const thumbnail =
        safe(data.thumbnail);


      const videoType =
        safe(data.videoType)
        || "Video";


      const duration =
        safe(data.duration)
        || "—";


      const category =
        safe(data.category)
        || "General";


      const channelName =
        safe(data.channelName)
        || "LetsStudy Pro";


      const channelHandle =
        safe(data.channelHandle);


      const channelImage =
        safe(data.channelImage);


      const creatorName =
        safe(data.creatorName)
        || "—";


      const status =
        safe(data.status)
        || "published";


      const isFree =
        data.isFree === true;


      const featured =
        data.featured === true;


      const verified =
        data.verified === true;


      const price =
        safe(data.price);


      const currency =
        safe(data.currency);


      /* =========================
         VIDEO SOURCE
      ========================= */

      let player = "";


      if (videoUrl) {

        player = `

          <div class="player-wrapper">

            <video
              id="videoPlayer"
              controls
              playsinline
              preload="metadata"
              ${thumbnail
                ? `poster="${escapeHtml(thumbnail)}"`
                : ""
              }>

              <source
                src="${escapeHtml(videoUrl)}"
                type="${getMimeType(videoUrl)}">

              Your browser does not support
              HTML5 video.

            </video>

          </div>

        `;

      } else {

        player = `

          <div class="player-wrapper">

            <div class="state">

              <div class="state-icon">
                🎬
              </div>

              <h2>
                Video unavailable
              </h2>

              <p>
                This video does not have
                a valid video URL yet.
              </p>

            </div>

          </div>

        `;

      }


      /* =========================
         TAGS
      ========================= */

      let tags = [];


      if (
        Array.isArray(data.tags)
      ) {

        tags = data.tags;

      } else if (
        typeof data.tags === "string"
      ) {

        tags =
          data.tags
            .split(",")
            .map(tag => tag.trim())
            .filter(Boolean);

      }


      const tagsHtml =
        tags.length
          ? `

            <div class="tags">

              ${tags
                .map(
                  tag => `

                    <span class="tag">
                      #${escapeHtml(tag)}
                    </span>

                  `
                )
                .join("")}

            </div>

          `
          : "";


      /* =========================
         BADGES
      ========================= */

      const badges = `

        <div class="badges">

          <span
            class="badge ${
              isFree
                ? "free"
                : "paid"
            }">

            ${
              isFree
                ? "FREE"
                : "PAID"
            }

          </span>


          ${
            featured
              ? `
                <span class="badge featured">
                  ★ Featured
                </span>
              `
              : ""
          }


          ${
            verified
              ? `
                <span class="badge verified">
                  ✓ Verified
                </span>
              `
              : ""
          }


          <span class="badge status">

            ${escapeHtml(status)}

          </span>

        </div>

      `;


      /* =========================
         CHANNEL IMAGE
      ========================= */

      const channelImageHtml =
        channelImage

          ? `

            <img
              class="channel-image"
              src="${escapeHtml(channelImage)}"
              alt="${escapeHtml(channelName)}">

          `

          : `

            <div
              class="channel-image"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-weight:800;
              ">

              LS

            </div>

          `;


      /* =========================
         PRICE
      ========================= */

      let priceText =
        "Free";


      if (!isFree) {

        priceText =
          price
            ? `${currency} ${price}`
            : "Paid";

      }


      /* =========================
         PAGE
      ========================= */

      content.innerHTML = `

        ${player}


        <section class="video-info">

          ${badges}


          <h1>
            ${escapeHtml(title)}
          </h1>


          ${
            description
              ? `
                <p class="description">
                  ${escapeHtml(description)}
                </p>
              `
              : ""
          }


          <div class="channel">

            <div class="channel-left">

              ${channelImageHtml}

              <div>

                <div class="channel-name">
                  ${escapeHtml(channelName)}
                </div>

                ${
                  channelHandle
                    ? `
                      <div class="channel-handle">
                        @${escapeHtml(channelHandle)}
                      </div>
                    `
                    : ""
                }

              </div>

            </div>

          </div>


          <div class="actions">

            <button
              class="action-btn"
              id="shareBtn">

              ↗ Share

            </button>


            <button
              class="action-btn"
              id="copyBtn">

              🔗 Copy Link

            </button>

          </div>


          <div class="stats">

            <div class="stat">

              <div class="stat-label">
                Views
              </div>

              <div class="stat-value">
                ${formatNumber(data.views)}
              </div>

            </div>


            <div class="stat">

              <div class="stat-label">
                Likes
              </div>

                            <div class="stat-value">
                ${formatNumber(data.likes)}
              </div>

            </div>


            <div class="stat">

              <div class="stat-label">
                Comments
              </div>

              <div class="stat-value">
                ${formatNumber(data.commentsCount)}
              </div>

            </div>


            <div class="stat">

              <div class="stat-label">
                Shares
              </div>

              <div class="stat-value">
                ${formatNumber(data.shares)}
              </div>

            </div>

          </div>


          <!-- =========================
               VIDEO DETAILS
          ========================= -->

          <div class="details">

            <h2>
              Video Details
            </h2>


            <div class="detail-grid">

              <div class="detail">

                <span class="detail-label">
                  Category
                </span>

                <span class="detail-value">
                  ${escapeHtml(category)}
                </span>

              </div>


              <div class="detail">

                <span class="detail-label">
                  Video Type
                </span>

                <span class="detail-value">
                  ${escapeHtml(videoType)}
                </span>

              </div>


              <div class="detail">

                <span class="detail-label">
                  Duration
                </span>

                <span class="detail-value">
                  ${escapeHtml(duration)}
                </span>

              </div>


              <div class="detail">

                <span class="detail-label">
                  Access
                </span>

                <span class="detail-value">
                  ${escapeHtml(priceText)}
                </span>

              </div>


              <div class="detail">

                <span class="detail-label">
                  Creator
                </span>

                <span class="detail-value">
                  ${escapeHtml(creatorName)}
                </span>

              </div>


              <div class="detail">

                <span class="detail-label">
                  Published
                </span>

                <span class="detail-value">
                  ${escapeHtml(
                    formatDate(
                      data.publishedAt ||
                      data.createdAt
                    )
                  )}
                </span>

              </div>


              <div class="detail">

                <span class="detail-label">
                  Video ID
                </span>

                <span class="detail-value">
                  ${escapeHtml(documentId)}
                </span>

              </div>


              <div class="detail">

                <span class="detail-label">
                  Status
                </span>

                <span class="detail-value">
                  ${escapeHtml(status)}
                </span>

              </div>

            </div>


            <!-- TAGS -->

            ${tagsHtml}

          </div>

        </section>

      `;


      /* =========================
         SHARE BUTTON
      ========================= */

      const shareBtn =
        document.getElementById(
          "shareBtn"
        );


      if (shareBtn) {

        shareBtn.addEventListener(
          "click",
          async () => {

            const url =
              window.location.href;


            try {

              if (
                navigator.share
              ) {

                await navigator.share({

                  title: title,

                  text:
                    description ||
                    title,

                  url: url

                });

              } else {

                await navigator
                  .clipboard
                  .writeText(url);

                alert(
                  "Video link copied."
                );

              }

            } catch (error) {

              console.log(
                "Share cancelled:",
                error
              );

            }

          }
        );

      }


      /* =========================
         COPY LINK
      ========================= */

      const copyBtn =
        document.getElementById(
          "copyBtn"
        );


      if (copyBtn) {

        copyBtn.addEventListener(
          "click",
          async () => {

            try {

              await navigator
                .clipboard
                .writeText(
                  window.location.href
                );


              copyBtn.textContent =
                "✓ Link Copied";


              setTimeout(
                () => {

                  copyBtn.textContent =
                    "🔗 Copy Link";

                },
                2000
              );


            } catch (error) {

              console.error(
                "Copy failed:",
                error
              );

              alert(
                "Unable to copy video link."
              );

            }

          }
        );

      }

    }


    /* =========================
       VIDEO MIME TYPE
    ========================= */

    function getMimeType(url) {

      const clean =
        safe(url)
          .split("?")[0]
          .toLowerCase();


      if (
        clean.endsWith(".webm")
      ) {

        return "video/webm";

      }


      if (
        clean.endsWith(".ogg") ||
        clean.endsWith(".ogv")
      ) {

        return "video/ogg";

      }


      return "video/mp4";

    }


    /* =========================
       START APPLICATION
    ========================= */

    loadVideo();

  </script>

</body>
</html>
