*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:4px}
.hd{background:#0f172a;position:sticky;top:0;z-index:50}
.hd>div{width:min(1100px,92%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
.brand span{color:#60a5fa}
.hd nav a{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:14px;margin-left:18px}
.hd nav a:hover,.hd nav a[aria-current]{color:#fff}
.wrap{width:min(1000px,92%);margin:0 auto;padding:44px 0 70px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.1;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin:0 0 10px}
.lead{font-size:18px;color:var(--muted);margin:0 0 24px;max-width:600px}
.btn{border:0;background:var(--p);color:#fff;padding:10px 20px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.6;cursor:wait}
@media(prefers-color-scheme:dark){.btn{color:#0b1220}.btn.alt{color:var(--ink)}}
.tools{display:flex;gap:10px;margin-bottom:12px}
.search,.sort,.dlg input,.dlg select,.dlg textarea,.box textarea{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;font-size:16px}
.search{flex:1;min-width:0}
.search:focus,.sort:focus,.dlg input:focus,.dlg select:focus,.dlg textarea:focus,.box textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--p)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}

.ban{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
#count{color:var(--muted);font-size:14px;margin:16px 0 14px;min-height:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.v{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--text)}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--soft)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--p);font-size:30px;font-weight:800}
.tag{position:absolute;padding:2px 9px;border-radius:7px;font-size:12px;font-weight:800;background:rgba(15,23,42,.88);color:#fff}
.tag.d{right:8px;bottom:8px}.tag.p{left:8px;top:8px;background:#7c3aed}.tag.f{left:8px;bottom:8px;background:#d97706}
.vt{margin:0;font-size:16px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}

.ch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}

.av{flex:none;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800;overflow:hidden;width:44px;height:44px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.vf{width:15px;height:15px;color:var(--p);vertical-align:-2px;margin-left:3px}
.back{display:inline-block;margin-bottom:14px;font-weight:600;font-size:14px;text-decoration:none}

.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0}

.box{margin-bottom:16px}
.box textarea{width:100%;min-height:76px;resize:vertical}
.cm{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}

.d1{margin-left:30px}.d2{margin-left:60px}
.cm .bd{min-width:0;flex:1}
.hh{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.hh b{color:var(--ink)}
.hh time,.ac{font-size:13px;color:var(--muted)}
.ctx{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ac{display:flex;gap:14px;margin-top:4px}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.state{grid-column:1/-1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.state.err h2{color:#dc2626}
.state .btn{margin-top:14px}
dialog{border:0;border-radius:18px;padding:0;width:min(480px,94vw);max-height:92vh;background:var(--paper);color:var(--text);box-shadow:0 25px 60px rgba(2,6,23,.4);overflow:auto}
dialog::backdrop{background:rgba(2,6,23,.6)}
.dlg{padding:22px}
.dlg h2{margin:0 0 10px;font-size:22px;color:var(--ink)}
.dlg label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:12px 0 6px}
.dlg input,.dlg select,.dlg textarea{width:100%;background:var(--bg)}
.dlg textarea{min-height:90px;resize:vertical}
.dlg .row{justify-content:flex-end;margin-top:18px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pr span{overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);background:var(--paper);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:700px){.wrap{padding-top:28px}.hd nav a{margin-left:12px}.tools{flex-direction:column}.d1{margin-left:14px}.d2{margin-left:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=s=>document.querySelector(s);
const qp=new URLSearchParams(location.search);

const safe=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};

function ago(x){

/* ---------------- browse ---------------- */
function card(x){
  const t=thumb(x),d=dur(x.duration),when=toD(x.publishedAt||x.createdAt);
  return `<a class="v" href="videos.html?id=${encodeURIComponent(x.id)}"><div class="th">${t?`<img src="${esc(t)}" alt="" loading="lazy">`:`<div class="ph">${esc((x.title||"V")[0].toUpperCase())}</div>`}
    ${paid(x)?`<span class="tag p">${esc(price(x))}</span>`:""}${yes(x.featured)?`<span class="tag f">Featured</span>`:""}${d?`<span class="tag d">${esc(d)}</span>`:""}</div>
    <h2 class="vt">${esc(x.title||"Untitled video")}</h2>
    <div class="ch">${avatar(x.channelImage,x.channelName)}<span>${esc(x.channelName||x.creatorName||"Channel")}${yes(x.verified)?VERIFIED:""}</span></div>
    <div class="st"><span>${N.format(num(x.views))} views</span>${when?`<span>${esc(ago(when))}</span>`:""}</div></a>`;
}
const inCat=(x,c)=>[c.name,c.slug,c.id].some(k=>k&&String(k).toLowerCase()===String(x.category||"").toLowerCase());
const SORTS={new:(a,b)=>(toD(b.publishedAt||b.createdAt)||0)-(toD(a.publishedAt||a.createdAt)||0),views:(a,b)=>num(b.views)-num(a.views),likes:(a,b)=>num(b.likes)-num(a.likes)};

function renderBrowse(){
  const q=$("#search").value.toLowerCase().trim(),c=cats.find(k=>[k.id,k.slug,k.name].some(z=>z&&String(z).toLowerCase()===cat.toLowerCase()));
  const items=videos.filter(x=>(!chParam||x.channelId===chParam)&&(!cat||(c?inCat(x,c):String(x.category||"").toLowerCase()===cat.toLowerCase()))&&
    (!q||[x.title,x.description,x.channelName,x.tags,x.category].join(" ").toLowerCase().includes(q))).sort(SORTS[$("#sort").value]);
  $("#count").textContent=items.length===1?"1 video":`${items.length} videos`;
  $("#grid").innerHTML=items.length?items.map(card).join(""):`<div class="state"><h2>${videos.length?"No matches":"No videos yet"}</h2><p>${videos.length?"Try a different search or category.":"New videos will appear here soon."}</p></div>`;
}
function chips(){
  const box=$("#chips");
  if(cats.length<2){box.hidden=true;return}
  box.innerHTML=[{id:"",name:"All"},...cats].map(c=>`<button class="chip" type="button" data-c="${esc(c.id)}" aria-pressed="${c.id===""?!cat:[c.id,c.slug,c.name].some(z=>z&&String(z).toLowerCase()===cat.toLowerCase())}">${esc(c.name)}</button>`).join("");
  box.hidden=false;
}
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  cat=b.dataset.c;
  $("#chips").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  renderBrowse();
});
$("#search").addEventListener("input",renderBrowse);
$("#sort").addEventListener("change",renderBrowse);

async function loadBrowse(){
  $("#browse").hidden=false;$("#watch").hidden=true;
  if(!videos){
    const col=collection(db,"videos");
    try{
      let snap;
      try{snap=await getDocs(query(col,orderBy("publishedAt","desc"),limit(60)))}catch{snap=await getDocs(query(col,limit(60)))}
      if(snap.empty)snap=await getDocs(query(col,limit(60)));
      videos=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!HIDE.test(x.status||""));
    }catch(e){
      console.error(e);
      $("#grid").innerHTML=`<div class="state err"><h2>Unable to load videos</h2><p>${esc(e.message||"Please check your connection.")}</p><button class="btn" id="retry" type="button">Try again</button></div>`;
      $("#retry").addEventListener("click",loadBrowse);return;
    }
  }
  if(chParam){$("#ban").hidden=false;$("#ban").innerHTML=`Showing videos from one channel. <a href="videos.html">Show all videos</a>`}
  chips();renderBrowse();
}

/* ---------------- watch ---------------- */
function playerHTML(){
  const url=safe(v.videoUrl),t=String(v.videoType||"").toLowerCase(),yt=ytId(url),vm=url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(yt)return `<iframe src="https://www.youtube-nocookie.com/embed/${yt}?rel=0" title="${esc(v.title||"Video")}" allow="accelerometer;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>`;
  if(vm)return `<iframe src="https://player.vimeo.com/video/${vm[1]}" title="${esc(v.title||"Video")}" allow="fullscreen;picture-in-picture" allowfullscreen></iframe>`;
  if(url&&(/\.(mp4|webm|ogg|mov)(\?|$)/i.test(url)||/^(upload|uploaded|mp4|file|direct)$/.test(t)))return `<video src="${esc(url)}" controls playsinline preload="metadata"${thumb(v)?` poster="${esc(thumb(v))}"`:""}></video>`;
  return url?`<iframe src="${esc(url)}" title="${esc(v.title||"Video")}" allowfullscreen></iframe>`:`<div class="lock"><div><h2>Video unavailable</h2></div></div>`;
}
function lockHTML(){
  const t=thumb(v);
  return `<div class="lock">${t?`<img src="${esc(t)}" alt="">`:""}<div><h2>${esc(price(v))}</h2>
    <p>${orderPending?"Your order is waiting for payment confirmation.":"Unlock this video to start watching."}</p>
    ${orderPending?(CHECKOUT?`<a class="btn" href="${esc(CHECKOUT(orderPending))}">Complete payment</a>`:`<span class="b">Payment pending</span>`)
      :user?`<button class="btn" id="buy" type="button">Buy this video</button>`:`<a class="btn" href="login.html">Sign in to buy</a>`}</div></div>`;
}

function tagsOf(){const t=v.tags;return (Array.isArray(t)?t:String(t||"").split(",")).map(x=>String(x).trim()).filter(Boolean).slice(0,8)}

function renderMain(){
  const when=toD(v.publishedAt||v.createdAt),long=String(v.description||"").length>260;
  $("#main").innerHTML=`<div class="pl" id="pl0">${paid(v)&&!unlocked?lockHTML():playerHTML()}</div>
    <h1 class="title">${esc(v.title||"Untitled video")}</h1>
    <div class="row"><div class="who"><a href="${CHANNEL(v.channelId||"")}">${avatar(v.channelImage,v.channelName)}</a>
      <div><a href="${CHANNEL(v.channelId||"")}">${esc(v.channelName||v.creatorName||"Channel")}${yes(v.verified)?VERIFIED:""}</a>${v.channelHandle?`<small>@${esc(String(v.channelHandle).replace(/^@/,""))}</small>`:""}</div></div>
      <div class="acts">${S.likes!==false?`<button class="btn alt sm" id="like" type="button" aria-pressed="${!!myLike}">${myLike?"Liked":"Like"} · <span id="lc">${N.format(num(v.likes))}</span></button>`:""}
        <button class="btn alt sm" id="save" type="button">Save</button>
        ${S.sharing!==false?`<button class="btn alt sm" id="share" type="button">Share</button>`:""}
        <button class="btn alt sm" id="report" type="button">Report</button></div></div>
    <div class="card"><div class="meta"><span><b id="vc">${N.format(num(v.views))}</b> views</span>${when?`<span>${esc(ago(when))}</span>`:""}${v.category?`<span>${esc(v.category)}</span>`:""}${paid(v)?`<span>${esc(price(v))}</span>`:`<span>Free</span>`}</div>
      ${v.description?`<p class="ds${long?" clamp":""}">${esc(v.description)}</p>${long?`<button class="more" type="button" id="more">Show more</button>`:""}`:""}
      ${tagsOf().length?`<div class="tags">${tagsOf().map(t=>`<span class="b">#${esc(t)}</span>`).join("")}</div>`:""}</div>`;
}

async function count(col){try{return (await getCountFromServer(query(collection(db,col),where("videoId","==",vid)))).data().count}catch{return null}}
async function refreshCounts(){
  const [l,w]=await Promise.all([count("videolikes"),count("videoViews")]);
  if(l!==null&&$("#lc"))$("#lc").textContent=N.format(l);
  if(w!==null&&$("#vc"))$("#vc").textContent=N.format(w);
}
async function loadMine(){
  myLike=null;orderPending=null;unlocked=!paid(v)||(user&&v.creatorId===user.uid);
  if(!user)return;
  try{const s=await getDocs(query(collection(db,"videolikes"),where("videoId","==",vid),where("userId","==",user.uid),limit(1)));if(!s.empty)myLike=s.docs[0].id}catch{}
  if(paid(v)&&!unlocked){
    try{
      const s=await getDocs(query(collection(db,"videoOrders"),where("videoId","==",vid),where("userId","==",user.uid)));
      s.docs.forEach(d=>{const o=d.data(),st=String(o.status||"").trim();
        if(/^(paid|completed|complete|success|successful|approved|confirmed)$/i.test(st))unlocked=true;else if(/^pending$/i.test(st))orderPending=d.id});
    }catch(e){console.warn(e)}
  }
}
async function recordView(){
  const k="seen_"+vid;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1")}catch{}
  let sid="";try{sid=sessionStorage.getItem("sid")||("s"+Math.random().toString(36).slice(2,12));sessionStorage.setItem("sid",sid)}catch{}
  try{const ref=doc(collection(db,"videoViews"));await setDoc(ref,{viewId:ref.id,channelId:v.channelId||"",completed:"false",createdAt:new Date().toISOString(),seasonId:sid,userId:user?user.uid:"",videoId:vid,watchDuration:"0"})}catch{}
}

async function openWatch(){
  $("#browse").hidden=true;$("#watch").hidden=false;
  $("#main").innerHTML="";$("#comments").innerHTML="";$("#related").innerHTML="";
  let s;
  try{s=await getDoc(doc(db,"videos",vid))}catch(e){console.error(e);$("#main").innerHTML=`<div class="state err"><h2>Unable to load this video</h2><p>${esc(e.message||"")}</p></div>`;return}
  if(!s.exists()){$("#main").innerHTML=`<div class="state"><h2>Video not found</h2><p>It may have been removed.</p><a class="btn" href="videos.html">Browse videos</a></div>`;return}
  v={id:s.id,...s.data()};
  if(HIDE.test(v.status||"")&&!(user&&v.creatorId===user.uid)){$("#main").innerHTML=`<div class="state"><h2>This video is unavailable</h2><a class="btn" href="videos.html">Browse videos</a></div>`;return}
  document.title=`${v.title||"Video"} | LetsStudy Pro`;
  await loadMine();
  renderMain();refreshCounts();
  if(unlocked)recordView();
  if(S.comments!==false)loadComments();
  loadRelated();
}

async function loadRelated(){
  if(!v.category)return;
  try{
    const s=await getDocs(query(collection(db,"videos"),where("category","==",v.category),limit(12)));
    const list=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.id!==vid&&!HIDE.test(x.status||"")).slice(0,6);
    if(list.length)$("#related").innerHTML=`<div class="card"><h2 class="s">More like this</h2><div class="rel">${list.map(card).join("")}</div></div>`;
  }catch{}
}

/* ---------------- comments (videoComment) ---------------- */
const oldest=(a,b)=>(toD(a.createdAt)||0)-(toD(b.createdAt)||0);
function cmCard(c,dep,kids){
  const own=user&&c.userId===user.uid,x=toD(c.createdAt);
  const kin=(kids[c.id]||[]).sort(oldest).map(r=>cmCard(r,Math.min(dep+1,2),kids)).join("");
  return `<article class="cm d${dep}" id="c-${esc(c.id)}">${avatar(c.userImage,c.username)}<div class="bd">
    <div class="hh"><b>${esc(c.username||"Member")}</b>${x?`<time datetime="${x.toISOString()}" title="${esc(x.toLocaleString())}">${esc(ago(x))}</time>`:""}</div>
    <p class="ctx">${esc(c.comment)}</p>
    <div class="ac"><span>${N.format(num(c.likes))} likes</span><button class="lnk" type="button" data-reply="${esc(c.id)}">Reply</button>${own?`<button class="lnk" type="button" data-cdel="${esc(c.id)}">Delete</button>`:""}</div>
    <div class="rb" id="r-${esc(c.id)}"></div></div></article>${kin}`;
}
const cbox=(parent)=>user?`<div class="box"><textarea maxlength="2000" placeholder="${parent?"Write a reply":"Add a comment"}" aria-label="Comment"></textarea>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">${parent?`<button class="btn alt sm" type="button" data-ccancel="1">Cancel</button>`:""}<button class="btn sm" type="button" data-csend="${esc(parent||"")}">Post</button></div></div>`
  :`<p style="color:var(--muted)"><a href="login.html">Sign in</a> to join the conversation.</p>`;
function renderComments(){
  const kids={};
  cms.forEach(c=>{const k=c.parentCommentId&&cms.some(x=>x.id===c.parentCommentId)?c.parentCommentId:"";(kids[k]=kids[k]||[]).push(c)});
  const roots=(kids[""]||[]).sort((a,b)=>-oldest(a,b));
  $("#comments").innerHTML=`<div class="card"><h2 class="s">${cms.length} ${cms.length===1?"comment":"comments"}</h2><div id="cc">${cbox("")}</div><div>${roots.map(c=>cmCard(c,0,kids)).join("")||`<p style="color:var(--muted)">No comments yet. Start the conversation.</p>`}</div></div>`;
}
async function loadComments(){
  try{
    const s=await getDocs(query(collection(db,"videoComment"),where("videoId","==",vid)));
    cms=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!/^(deleted|hidden|spam|rejected|removed|blocked)$/i.test(c.status||""));
  }catch(e){console.warn(e);cms=[]}
  renderComments();
}
$("#comments").addEventListener("click",async e=>{
  const t=e.target,r=t.closest("[data-reply]"),d=t.closest("[data-cdel]"),s=t.closest("[data-csend]"),c=t.closest("[data-ccancel]");
  if(r){const b=$("#r-"+CSS.escape(r.dataset.reply));b.innerHTML=b.innerHTML?"":cbox(r.dataset.reply);b.querySelector("textarea")?.focus()}
  else if(c)c.closest(".rb").innerHTML="";
  else if(d&&confirm("Delete this comment?")){
    try{await updateDoc(doc(db,"videoComment",d.dataset.cdel),{status:"deleted",updatedAt:new Date().toISOString()});cms=cms.filter(x=>x.id!==d.dataset.cdel);renderComments()}
    catch(err){console.error(err);toast("Could not delete the comment")}
  }else if(s){
    const ta=s.closest(".box").querySelector("textarea"),text=ta.value.trim();if(!text)return;
    s.disabled=true;
    try{
      const ref=doc(collection(db,"videoComment")),now=new Date().toISOString();
      const data={commentId:ref.id,channelId:v.channelId||"",comment:text,createdAt:now,likes:"0",parentCommentId:s.dataset.csend||"",status:"published",updatedAt:now,
        userEmail:user.email||"",userId:user.uid,userImage:user.photoURL||"",username:user.displayName||(user.email||"").split("@")[0]||"Member",videoId:vid};
      await setDoc(ref,data);cms.push({id:ref.id,...data});renderComments();toast("Comment posted");
    }catch(err){console.error(err);toast("Could not post your comment");s.disabled=false}
  }
});

/* ---------------- actions ---------------- */
$("#main").addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("#more")){const p=$("#more").previousElementSibling,c=p.classList.toggle("clamp");$("#more").textContent=c?"Show more":"Show less";return}
  if(t.closest("#like")){
    if(!user){location.href="login.html";return}
    const was=!!myLike,id=myLike||`${vid}_${user.uid}`,lc=$("#lc"),cur=Number(String(lc.textContent).replace(/[^\d.]/g,""))||0;
    myLike=was?null:id;$("#like").textContent=(was?"Like":"Liked")+" · ";$("#like").append(lc);lc.textContent=N.format(Math.max(0,cur+(was?-1:1)));
    try{
      if(was)await deleteDoc(doc(db,"videolikes",id));
      else await setDoc(doc(db,"videolikes",id),{likesId:id,channelId:v.channelId||"",createdAt:new Date().toISOString(),userId:user.uid,videoId:vid});
      refreshCounts();
    }catch(err){console.error(err);toast("Something went wrong");myLike=was?id:null;renderMain();refreshCounts()}
    return;
  }
  if(t.closest("#share")){
    const url=`${location.origin}/videos.html?id=${encodeURIComponent(vid)}`;
    try{if(navigator.share)await navigator.share({title:v.title||"Video",url});else{await navigator.clipboard.writeText(url);toast("Link copied")}}catch{}
    return;
  }
  if(t.closest("#report")){if(!user){location.href="login.html";return}$("#rd").showModal();return}
  if(t.closest("#save")){if(!user){location.href="login.html";return}openSave();return}
  const buy=t.closest("#buy");
  if(buy){
    buy.disabled=true;
    try{
      const ref=doc(collection(db,"videoOrders")),now=new Date().toISOString();
      await setDoc(ref,{orderId:ref.id,channelId:v.channelId||"",channelName:v.channelName||"",createdAt:now,currency:v.currency||"TZS",paymentMethod:"",price:String(num(v.price)),
        status:"pending",thumbnail:thumb(v),transactionId:"",updatedAt:now,userEmail:user.email||"",userId:user.uid,userName:user.displayName||"",videoId:vid,videoTitle:v.title||""});
      orderPending=ref.id;toast("Order created");
      if(CHECKOUT){location.href=CHECKOUT(ref.id);return}
      renderMain();
    }catch(err){console.error(err);toast("Could not create your order");buy.disabled=false}
  }
});

$("#rc").addEventListener("click",()=>$("#rd").close());
$("#rs").addEventListener("click",async e=>{
  const b=e.currentTarget;b.disabled=true;
  try{
    const ref=doc(collection(db,"videoReport"));
    await setDoc(ref,{reportId:ref.id,channelId:v.channelId||"",createdAt:new Date().toISOString(),description:$("#rt").value.trim(),reason:$("#rr").value,
      reportBy:user.uid,reportEmail:user.email||"",reviewAt:"",reviewBy:"",status:"pending",videoId:vid});
    $("#rd").close();$("#rt").value="";toast("Thanks. We will review this video.");
  }catch(err){console.error(err);toast("Could not send your report")}
  b.disabled=false;
});

/* ---- save to playlist (playlists + playlistsVideos) ---- */
$("#pc").addEventListener("click",()=>$("#pd").close());
async function openSave(){
  $("#pl").innerHTML=`<p style="color:var(--muted)">Loading your playlists</p>`;$("#pd").showModal();
  try{
    const [pl,it]=await Promise.all([getDocs(query(collection(db,"playlists"),where("owerId","==",user.uid))),
      getDocs(query(collection(db,"playlistsVideos"),where("videoId","==",vid),where("owerId","==",user.uid)))]);
    const have=new Set(it.docs.map(d=>d.data().playlistId));
    const list=pl.docs.map(d=>({id:d.id,...d.data()}));
    $("#pl").innerHTML=list.length?list.map(p=>`<div class="pr"><span>${esc(p.name||"Playlist")}</span>${have.has(p.id)?`<span class="b">Added</span>`:`<button class="btn sm" type="button" data-add="${esc(p.id)}">Add</button>`}</div>`).join("")
      :`<p style="color:var(--muted)">You have no playlists yet. <a href="playlists.html">Create one</a>.</p>`;
    $("#pl").dataset.list=JSON.stringify(list.map(p=>({id:p.id,n:num(p.videosCount)})));
  }catch(e){console.error(e);$("#pl").innerHTML=`<p style="color:#dc2626">Unable to load your playlists.</p>`}
}
$("#pl").addEventListener("click",async e=>{
  const b=e.target.closest("[data-add]");if(!b)return;
  const info=JSON.parse($("#pl").dataset.list||"[]").find(x=>x.id===b.dataset.add);if(!info)return;
  b.disabled=true;
  try{
    const id=`${info.id}_${vid}`,now=new Date().toISOString();
    await setDoc(doc(db,"playlistsVideos",id),{itemId:id,addedAt:now,owerId:user.uid,playlistId:info.id,position:String(info.n+1),videoId:vid});
    await updateDoc(doc(db,"playlists",info.id),{videosCount:String(info.n+1),updatedAt:now});
    b.replaceWith(Object.assign(document.createElement("span"),{className:"b",textContent:"Added"}));toast("Saved to playlist");
  }catch(err){console.error(err);toast("Could not save to the playlist");b.disabled=false}
});

document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"){if(i.dataset.n)i.replaceWith(document.createTextNode(i.dataset.n));else if(i.closest(".th"))i.replaceWith(Object.assign(document.createElement("div"),{className:"ph",textContent:"V"}))}},true);

/* ---------------- start ---------------- */
async function boot(){
  try{const s=await getDoc(doc(db,"videoSettings","default"));if(s.exists()){const d=s.data();for(const k of ["comments","likes","sharing"])if(typeof d[k]==="boolean")S[k]=d[k]}}catch{}
  try{cats=(await getDocs(query(collection(db,"videoCategories"),limit(100)))).docs.map(d=>({id:d.id,...d.data()}))
    .filter(c=>c.name&&!HIDE.test(c.status||"")).sort((a,b)=>String(a.name).localeCompare(String(b.name)))}catch{cats=[]}
}
$("#year").textContent=new Date().getFullYear();
let ready=null;
onAuthStateChanged(auth,async u=>{
  user=u;ready=ready||boot();await ready;
  vid?openWatch():loadBrowse();
});
</script>


</body></html>
