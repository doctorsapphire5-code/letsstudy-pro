<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Videos | Let'sStudy Pro</title>
<meta name="description" content="Watch educational videos, tutorials and premium content on Let'sStudy Pro.">
<meta name="theme-color" content="#0f172a">

<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

a{
    text-decoration:none;
    color:inherit;
}

/* HEADER */
.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:64px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:800;
}

.logo i{
    color:#2563eb;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f1f5f9;
    cursor:pointer;
    font-size:17px;
}

.admin{
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px 14px;
    border-radius:8px;
    background:#111827;
    color:#fff;
    font-size:13px;
    font-weight:700;
}

/* SEARCH */
.search-area{
    background:#fff;
    padding:20px;
    border-bottom:1px solid #e5e7eb;
}

.search-box{
    max-width:850px;
    margin:auto;
    display:flex;
    gap:10px;
}

.search-box input{
    flex:1;
    height:46px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:0 15px;
    font-size:15px;
    outline:none;
}

.search-box input:focus{
    border-color:#2563eb;
}

.search-btn{
    width:50px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:#fff;
    cursor:pointer;
}

/* CONTENT */
.container{
    max-width:1400px;
    margin:auto;
    padding:25px 20px 60px;
}

.page-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.page-title h1{
    font-size:28px;
}

.page-title p{
    color:#64748b;
    margin-top:5px;
    font-size:14px;
}

/* FILTERS */
.filters{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-bottom:25px;
    padding-bottom:5px;
}

.filter{
    border:1px solid #dbe2ea;
    background:#fff;
    padding:9px 15px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    font-size:13px;
}

.filter.active{
    background:#2563eb;
    color:#fff;
    border-color:#2563eb;
}

/* GRID */
.video-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.video-card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #e5e7eb;
    cursor:pointer;
    transition:.2s;
}

.video-card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(15,23,42,.08);
}

.thumbnail{
    position:relative;
    aspect-ratio:16/9;
    background:#e2e8f0;
    overflow:hidden;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.duration{
    position:absolute;
    right:8px;
    bottom:8px;
    background:rgba(0,0,0,.8);
    color:#fff;
    padding:4px 6px;
    border-radius:4px;
    font-size:11px;
}

.badge{
    position:absolute;
    left:8px;
    top:8px;
    padding:5px 8px;
    border-radius:5px;
    font-size:10px;
    font-weight:700;
}

.free{
    background:#16a34a;
    color:#fff;
}

.premium{
    background:#f59e0b;
    color:#111827;
}

.video-info{
    padding:13px;
}

.video-title{
    font-size:15px;
    font-weight:700;
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.channel{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
}

.channel img{
    width:30px;
    height:30px;
    border-radius:50%;
    object-fit:cover;
}

.channel-name{
    font-size:12px;
    color:#475569;
}

.meta{
    display:flex;
    justify-content:space-between;
    margin-top:9px;
    color:#64748b;
    font-size:11px;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:80px 20px;
    color:#64748b;
    display:none;
}

.empty i{
    font-size:45px;
    margin-bottom:15px;
}

/* LOADING */
.loading{
    text-align:center;
    padding:70px 20px;
    color:#64748b;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #e2e8f0;
    border-top-color:#2563eb;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto auto 12px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* MOBILE */
@media(max-width:1100px){
    .video-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:750px){
    .video-grid{
        grid-template-columns:repeat(2,1fr);
        gap:13px;
    }

    .container{
        padding:18px 12px 40px;
    }

    .page-title h1{
        font-size:22px;
    }

    .admin{
        padding:8px 10px;
    }

    .admin span{
        display:none;
    }
}

@media(max-width:480px){
    .video-grid{
        grid-template-columns:1fr;
    }

    .header{
        padding:0 12px;
    }

    .logo{
        font-size:17px;
    }
}
</style>
</head>

<body>

<header class="header">

    <a href="videos.html" class="logo">
        <i class="fa-solid fa-circle-play"></i>
        <span>Let'sStudy Pro</span>
    </a>

    <div class="header-actions">

        <a href="notifications-video.html"
           class="icon-btn"
           title="Notifications">
            <i class="fa-regular fa-bell"></i>
        </a>

        <a href="studio.html"
           class="icon-btn"
           title="Studio">
            <i class="fa-solid fa-video"></i>
        </a>

        <a href="admin-video.html" class="admin">
            <i class="fa fa-shield-halved"></i>
            <span>ADMIN</span>
        </a>

    </div>

</header>


<section class="search-area">

    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="Search videos..."
            autocomplete="off"
        >

        <button class="search-btn" id="searchBtn">
            <i class="fa fa-search"></i>
        </button>

    </div>

</section>


<main class="container">

    <div class="page-title">

        <div>
            <h1>Videos</h1>
            <p>Learn, discover and watch educational videos.</p>
        </div>

    </div>


    <div class="filters">

        <button class="filter active" data-category="all">
            All
        </button>

        <button class="filter" data-category="Technology">
            Technology
        </button>

        <button class="filter" data-category="Education">
            Education
        </button>

        <button class="filter" data-category="Business">
            Business
        </button>

        <button class="filter" data-category="Science">
            Science
        </button>

        <button class="filter" data-category="Programming">
            Programming
        </button>

    </div>


    <div id="loading" class="loading">

        <div class="spinner"></div>

        Loading videos...

    </div>


    <div id="videoGrid" class="video-grid"></div>


    <div id="empty" class="empty">

        <i class="fa-solid fa-video-slash"></i>

        <h3>No videos found</h3>

        <p>Try another search or category.</p>

    </div>

</main>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "YOUR_PROJECT.firebaseapp.com",

    projectId: "YOUR_PROJECT_ID",

    storageBucket: "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId: "YOUR_SENDER_ID",

    appId: "YOUR_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =====================================================
   DOM
===================================================== */

const videoGrid =
    document.getElementById("videoGrid");

const loading =
    document.getElementById("loading");

const empty =
    document.getElementById("empty");

const searchInput =
    document.getElementById("searchInput");

const searchBtn =
    document.getElementById("searchBtn");

const filters =
    document.querySelectorAll(".filter");


/* =====================================================
   STATE
===================================================== */

let videos = [];

let currentCategory = "all";

let searchTerm = "";


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(){

    loading.style.display = "block";

    empty.style.display = "none";

    try{

        const videosRef =
            collection(db, "videos");

        const q =
            query(
                videosRef,
                orderBy("createdAt", "desc")
            );

        const snapshot =
            await getDocs(q);

        videos = [];

        snapshot.forEach(doc => {

            const data = doc.data();

            /*
             * Only display published videos.
             */
            if(
                data.status &&
                String(data.status).toLowerCase()
                !== "published"
            ){

                return;

            }

            videos.push({

                id: doc.id,

                ...data

            });

        });

        renderVideos();

    }catch(error){

        console.error(
            "Error loading videos:",
            error
        );

        videoGrid.innerHTML = "";

        empty.style.display = "block";

        empty.innerHTML = `

            <i class="fa-solid fa-triangle-exclamation"></i>

            <h3>Unable to load videos</h3>

            <p>Please try again later.</p>

        `;

    }finally{

        loading.style.display = "none";

    }

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos(){

    videoGrid.innerHTML = "";

    const filtered =
        videos.filter(video => {

            const categoryMatch =
                currentCategory === "all" ||
                String(video.category || "")
                .toLowerCase()
                === currentCategory.toLowerCase();

            const text =
                `${video.title || ""}
                 ${video.description || ""}
                 ${video.channelName || ""}
                 ${(video.tags || []).join(" ")}`
                .toLowerCase();

            const searchMatch =
                !searchTerm ||
                text.includes(searchTerm);

            return categoryMatch && searchMatch;

        });


    if(filtered.length === 0){

        empty.style.display = "block";

        return;

    }


    empty.style.display = "none";


    filtered.forEach(video => {

        videoGrid.appendChild(
            createVideoCard(video)
        );

    });

}


/* =====================================================
   VIDEO CARD
===================================================== */

function createVideoCard(video){

    const card =
        document.createElement("article");

    card.className = "video-card";


    const isFree =
        video.isFree === true;


    const thumbnail =
        video.thumbnail ||
        "https://via.placeholder.com/640x360?text=Let'sStudy+Pro";


    const channelImage =
        video.channelImage ||
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(
            video.channelName || "Channel"
        );


    const duration =
        video.duration || "";


    const views =
        formatNumber(video.views || 0);


    const title =
        escapeHTML(
            video.title || "Untitled Video"
        );


    const channelName =
        escapeHTML(
            video.channelName || "Let'sStudy Pro"
        );


    card.innerHTML = `

        <div class="thumbnail">

            <img
                src="${escapeAttribute(thumbnail)}"
                alt="${escapeAttribute(title)}"
                loading="lazy"
                onerror="this.src='https://via.placeholder.com/640x360?text=Video'"
            >

            <span class="badge ${isFree ? "free" : "premium"}">

                ${
                    isFree
                    ? "FREE"
                    : "PREMIUM"
                }

            </span>

            ${
                duration
                ? `
                    <span class="duration">
                        ${escapeHTML(duration)}
                    </span>
                  `
                : ""
            }

        </div>


        <div class="video-info">

            <div class="video-title">
                ${title}
            </div>


            <div class="channel">

                <img
                    src="${escapeAttribute(channelImage)}"
                    alt="${escapeAttribute(channelName)}"
                    loading="lazy"
                    onerror="this.src='https://ui-avatars.com/api/?name=Channel'"
                >

                <div class="channel-name">
                    ${channelName}
                </div>

            </div>


            <div class="meta">

                <span>
                    ${views} views
                </span>

                <span>
                    ${
                        video.category
                        ? escapeHTML(video.category)
                        : "Video"
                    }
                </span>

            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        () => openVideo(video)
    );


    return card;

}


/* =====================================================
   VIDEO ACCESS FLOW
===================================================== */

function openVideo(video){

    if(!video || !video.id){

        return;

    }


    /*
     * FREE VIDEO
     *
     * Goes directly to watch.html
     */

    if(video.isFree === true){

        window.location.href =
            `watch.html?id=${encodeURIComponent(video.id)}`;

        return;

    }


    /*
     * PAID VIDEO
     *
     * Goes to video-order.html
     */

    window.location.href =
        `video-order.html?id=${encodeURIComponent(video.id)}`;

}


/* =====================================================
   SEARCH
===================================================== */

function performSearch(){

    searchTerm =
        searchInput.value
        .trim()
        .toLowerCase();

    renderVideos();

}


searchInput.addEventListener(
    "input",
    performSearch
);


searchBtn.addEventListener(
    "click",
    performSearch
);


/* =====================================================
   CATEGORY FILTER
===================================================== */

filters.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            filters.forEach(
                btn =>
                    btn.classList.remove("active")
            );

            button.classList.add("active");

            currentCategory =
                button.dataset.category;

            renderVideos();

        }
    );

});


/* =====================================================
   HELPERS
===================================================== */

function formatNumber(number){

    number =
        Number(number) || 0;

    if(number >= 1000000){

        return (
            number / 1000000
        ).toFixed(1) + "M";

    }

    if(number >= 1000){

        return (
            number / 1000
        ).toFixed(1) + "K";

    }

    return number.toString();

}


function escapeHTML(value){

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =====================================================
   START
===================================================== */

loadVideos();

</script>

</body>
</html>
