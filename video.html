<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Video - LetsStudy Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      width: min(700px, 92%);
      margin: 80px auto;
      text-align: center;
    }

    .box {
      background: #fff;
      padding: 40px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .loader {
      width: 45px;
      height: 45px;
      margin: 0 auto 20px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #6b7280;
      line-height: 1.6;
    }

    .error {
      display: none;
    }

    .error h1 {
      color: #dc2626;
    }
  </style>
</head>

<body>

  <main class="container">

    <section id="loadingBox" class="box">

      <div class="loader"></div>

      <h1>Loading video...</h1>

      <p>
        Please wait while we check this video.
      </p>

    </section>


    <section id="errorBox" class="box error">

      <h1 id="errorTitle">
        Video not found
      </h1>

      <p id="errorMessage">
        The requested video could not be found.
      </p>

    </section>

  </main>


  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* ==============================
       FIREBASE CONFIG
    ============================== */

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};


    /* ==============================
       INITIALIZE FIREBASE
    ============================== */

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    /* ==============================
       ELEMENTS
    ============================== */

    const loadingBox =
      document.getElementById(
        "loadingBox"
      );

    const errorBox =
      document.getElementById(
        "errorBox"
      );

    const errorTitle =
      document.getElementById(
        "errorTitle"
      );

    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    /* ==============================
       GET DOCUMENT ID
    ============================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const videoId =
      params.get("videoId");


    /* ==============================
       SHOW ERROR
    ============================== */

    function showError(
      title,
      message
    ) {

      loadingBox.style.display =
        "none";

      errorBox.style.display =
        "block";

      errorTitle.textContent =
        title;

      errorMessage.textContent =
        message;
    }


    /* ==============================
       LOAD VIDEO
    ============================== */

    async function loadVideo() {

      /*
       * videoId is REQUIRED
       */

      if (!videoId) {

        showError(
          "Missing Video ID",
          "No videoId was provided in the URL."
        );

        return;
      }


      try {

        /*
         * IMPORTANT:
         *
         * DIRECT FIRESTORE DOCUMENT READ
         *
         * videos/{videoId}
         *
         * NO slug query
         * NO URL query
         * NO Storage query
         */

        const videoRef =
          doc(
            db,
            "videos",
            videoId
          );


        const snapshot =
          await getDoc(
            videoRef
          );


        /* ==========================
           DOCUMENT NOT FOUND
        ========================== */

        if (!snapshot.exists()) {

          showError(
            "Video Not Found",
            "The video document does not exist."
          );

          return;
        }


        /* ==========================
           GET ALL DOCUMENT DATA
        ========================== */

        const video =
          snapshot.data();


        console.log(
          "Video document:",
          video
        );


        /* ==========================
           CHECK STATUS
        ========================== */

        if (
          video.status &&
          String(video.status)
            .toLowerCase() !==
          "published"
        ) {

          showError(
            "Video Unavailable",
            "This video is not currently published."
          );

          return;
        }


        /* ==========================
           FREE VIDEO
        ========================== */

        if (
          video.isFree === true
        ) {

          /*
           * Send to watch.html
           *
           * ONLY document ID
           */

          window.location.replace(
            "watch.html?videoId=" +
            encodeURIComponent(
              videoId
            )
          );

          return;
        }


        /* ==========================
           PLAN / PREMIUM VIDEO
        ========================== */

        window.location.replace(
          "video-order.html?videoId=" +
          encodeURIComponent(
            videoId
          )
        );

      }

      catch (error) {

        console.error(
          "Video loading error:",
          error
        );

        showError(
          "Unable to Load Video",
          error.message ||
          "Something went wrong while loading the video."
        );
      }
    }


    /* ==============================
       START
    ============================== */

    loadVideo();

  </script>

</body>
</html>
