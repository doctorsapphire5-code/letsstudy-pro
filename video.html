<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Videos | Let'sStudy Pro</title>

<meta
  name="description"
  content="Watch educational videos, courses and premium learning content on Let'sStudy Pro."
>

<link rel="icon" href="/favicon.ico">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;

  font-weight:800;
  font-size:20px;
}

.logo i{
  color:#2563eb;
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-btn{
  width:40px;
  height:40px;

  border:0;
  border-radius:50%;

  background:#f1f5f9;
  color:#334155;
}

.header-btn:hover{
  background:#e2e8f0;
}


/* =========================
   SEARCH
========================= */

.search{
  background:#fff;
  border-bottom:1px solid #e5e7eb;

  padding:18px;
}

.search-box{
  max-width:850px;

  margin:auto;

  display:flex;
  gap:8px;
}

.search-box input{
  flex:1;

  height:45px;

  border:1px solid #d1d5db;

  border-radius:8px;

  padding:0 14px;

  outline:none;
}

.search-box input:focus{
  border-color:#2563eb;
}

.search-box button{
  width:48px;

  border:0;

  border-radius:8px;

  background:#2563eb;

  color:#fff;
}


/* =========================
   CONTAINER
========================= */

.container{
  max-width:1400px;

  margin:auto;

  padding:25px 20px 60px;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:28px;
}

.heading p{
  color:#64748b;

  margin-top:5px;

  font-size:14px;
}


/* =========================
   FILTERS
========================= */

.filters{
  display:flex;

  gap:8px;

  overflow-x:auto;

  margin-bottom:22px;

  padding-bottom:5px;
}

.filter{
  white-space:nowrap;

  border:1px solid #dbe2ea;

  background:#fff;

  color:#334155;

  padding:9px 15px;

  border-radius:20px;

  font-size:13px;
}

.filter.active{
  background:#2563eb;

  border-color:#2563eb;

  color:#fff;
}


/* =========================
   GRID
========================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:20px;
}


/* =========================
   CARD
========================= */

.card{
  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:12px;

  overflow:hidden;

  cursor:pointer;

  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);

  box-shadow:
    0 8px 25px
    rgba(15,23,42,.09);
}


/* =========================
   THUMBNAIL
========================= */

.thumbnail{
  position:relative;

  aspect-ratio:16/9;

  background:#e2e8f0;

  overflow:hidden;
}

.thumbnail img{
  width:100%;
  height:100%;

  object-fit:cover;
}


/* =========================
   BADGES
========================= */

.badge{
  position:absolute;

  top:8px;
  left:8px;

  padding:5px 8px;

  border-radius:5px;

  font-size:10px;

  font-weight:800;
}

.free{
  background:#16a34a;
  color:#fff;
}

.plan{
  background:#f59e0b;
  color:#111827;
}


/* =========================
   DURATION
========================= */

.duration{
  position:absolute;

  right:8px;
  bottom:8px;

  background:rgba(0,0,0,.8);

  color:#fff;

  padding:4px 6px;

  border-radius:4px;

  font-size:10px;
}


/* =========================
   INFO
========================= */

.info{
  padding:13px;
}

.title{
  font-size:15px;

  font-weight:800;

  line-height:1.4;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;
}


/* =========================
   CREATOR
========================= */

.creator{
  display:flex;

  align-items:center;

  gap:8px;

  margin-top:12px;
}

.creator img{
  width:32px;
  height:32px;

  border-radius:50%;

  object-fit:cover;

  background:#e2e8f0;
}

.creator-name{
  font-size:12px;

  font-weight:700;
}

.handle{
  font-size:10px;

  color:#64748b;

  margin-top:2px;
}


/* =========================
   META
========================= */

.meta{
  display:flex;

  justify-content:space-between;

  gap:8px;

  margin-top:10px;

  color:#64748b;

  font-size:10px;
}


/* =========================
   TAGS
========================= */

.tags{
  display:flex;

  gap:5px;

  flex-wrap:wrap;

  margin-top:9px;
}

.tag{
  background:#f1f5f9;

  color:#475569;

  padding:4px 6px;

  border-radius:5px;

  font-size:9px;
}


/* =========================
   PRICE
========================= */

.price{
  margin-top:9px;

  font-weight:800;

  font-size:12px;
}

.price.free-price{
  color:#16a34a;
}

.price.plan-price{
  color:#d97706;
}


/* =========================
   LOADING
========================= */

.loading{
  text-align:center;

  padding:90px 20px;

  color:#64748b;
}

.spinner{
  width:38px;
  height:38px;

  border:4px solid #e2e8f0;

  border-top-color:#2563eb;

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin:auto auto 14px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;

  padding:80px 20px;

  color:#64748b;

  display:none;
}

.empty i{
  font-size:45px;

  margin-bottom:15px;
}


/* =========================
   ERROR
========================= */

.error{
  max-width:600px;

  margin:60px auto;

  padding:30px;

  background:#fff;

  border:1px solid #fecaca;

  border-radius:12px;

  text-align:center;

  color:#b91c1c;

  display:none;
}

.retry{
  margin-top:15px;

  border:0;

  background:#2563eb;

  color:#fff;

  padding:10px 18px;

  border-radius:8px;

  font-weight:700;
}


/* =========================
   MOBILE
========================= */

@media(max-width:1100px){

  .grid{
    grid-template-columns:
      repeat(3,1fr);
  }

}

@media(max-width:750px){

  .grid{
    grid-template-columns:
      repeat(2,1fr);

    gap:13px;
  }

  .container{
    padding:18px 12px 40px;
  }

  .heading h1{
    font-size:23px;
  }

}

@media(max-width:480px){

  .grid{
    grid-template-columns:1fr;
  }

  .header{
    padding:0 12px;
  }

  .logo{
    font-size:17px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">


  <button
    class="header-btn"
    id="homeBtn"
    title="Home">

    <i class="fa-solid fa-house"></i>

  </button>


  <div class="logo">

    <i class="fa-solid fa-circle-play"></i>

    <span>Let'sStudy Pro</span>

  </div>


  <div class="header-actions">


    <button
      class="header-btn"

      title="Notifications">

      <i class="fa-regular fa-bell"></i>

    <button
      class="header-btn"
      id="studioBtn"

<!-- =========================

========================= -->

<section class="search">

<main class="container">


  <div class="heading">

  <!-- =====================
       FILTERS

  <div class="filters">


    <button
      class="filter active"
      data-category="all">

      All

    </button>


    <button
      class="filter"
      data-category="Technology">

      Technology

    </button>


    <button
      class="filter"
      data-category="Education">

      Education

    </button>


    <button
      class="filter"
      data-category="Business">

      Business

    </button>


    <button
      class="filter"
      data-category="Science">

  <div
    id="loading"

  <div
    id="error"

  </div>



  <!-- =====================
       VIDEO GRID
  ====================== -->

    id="videoGrid"

    id="empty"

</main>



<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";



/* =========================================
   CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};



/* =========================================
   INITIALIZE
========================================= */

const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);



/* =========================================
   DOM
========================================= */

const videoGrid =
  document.getElementById(
    "videoGrid"
  );

const loading =
  document.getElementById(
    "loading"
  );

const empty =
  document.getElementById(
    "empty"
  );

const error =
  document.getElementById(
    "error"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const searchBtn =
  document.getElementById(
    "searchBtn"
  );



/* =========================================
   STATE
========================================= */

let videos = [];

let currentCategory =
  "all";

let searchTerm =
  "";



/* =========================================
   LOAD VIDEOS
========================================= */

async function loadVideos(){

  loading.style.display =
    "block";

  error.style.display =
    "none";

  empty.style.display =
    "none";

  videoGrid.innerHTML =
    "";


  try{


    /* ================================
       SAME COLLECTION
    ================================= */

    const videosRef =
      collection(
        db,
        "videos"
      );


    let snapshot;


    try{


      const q =
        query(
          videosRef,
          orderBy(
            "createdAt",
            "desc"
          )
        );


      snapshot =
        await getDocs(q);


    }
    catch(orderError){


      console.warn(
        "createdAt ordering failed:",
        orderError
      );


      snapshot =
        await getDocs(
          videosRef
        );

    }



    /* ================================
       READ DOCUMENTS
       
       doc.id = videoId
    ================================= */

    videos = [];


    snapshot.forEach(
      docSnap => {


        const data =
          docSnap.data();


        videos.push({

          /*
           * FIRESTORE DOCUMENT ID
           */

          videoId:
            docSnap.id,


          /*
           * ALL FIRESTORE DATA
           */

          ...data

        });


      }
    );



    /* ================================
       ONLY PUBLISHED
    ================================= */

    videos =
      videos.filter(
        video => {


          if(
            !video.status
          ){

            return true;

          }


          return String(
            video.status
          )
          .toLowerCase()
          ===
          "published";


        }
      );



    renderVideos();


  }
  catch(err){


    console.error(
      "Firestore videos error:",
      err
    );


    showError(
      "Unable to load videos from Firestore."
    );


  }
  finally{

    loading.style.display =
      "none";

  }

}



/* =========================================
   RENDER VIDEOS
========================================= */

function renderVideos(){

  videoGrid.innerHTML =
    "";


  const filtered =
    videos.filter(
      video => {


        const category =
          String(
            video.category || ""
          )
          .toLowerCase();


        const categoryMatch =
          currentCategory ===
          "all"
          ||
          category ===
          currentCategory.toLowerCase();



        let tags = "";


        if(
          Array.isArray(
            video.tags
          )
        ){

          tags =
            video.tags.join(
              " "
            );

        }
        else{

          tags =
            String(
              video.tags || ""
            );

        }



        const searchableText = `

          ${video.title || ""}

          ${video.slug || ""}

          ${video.description || ""}

          ${video.category || ""}

          ${tags}

          ${video.creatorName || ""}

        `.toLowerCase();



        const searchMatch =
          !searchTerm
          ||
          searchableText.includes(
            searchTerm
          );


        return (
          categoryMatch &&
          searchMatch
        );


      }
    );



  if(
    filtered.length === 0
  ){

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";



  filtered.forEach(
    video => {

      videoGrid.appendChild(
        createCard(
          video
        )
      );

    }
  );

}



/* =========================================
   CREATE CARD
========================================= */

function createCard(
  video
){

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "card";



  /* ================================
     THUMBNAIL
    ================================= */

  const thumbnail =
    video.thumbnail
    ||
    "https://via.placeholder.com/640x360?text=Let'sStudy+Pro";



  /* ================================
     CREATOR
    ================================= */

  const creatorName =
    video.creatorName
    ||
    "Let'sStudy Pro";


  const creatorImage =
    video.creatorImage
    ||
    `https://ui-avatars.com/api/?name=${
      encodeURIComponent(
        creatorName
      )
    }`;



  /* ================================
     ACCESS
    ================================= */

  const isFree =
    video.isFree === true;



  /* ================================
     PRICE
    ================================= */

  const price =
    Number(
      video.price || 0
    );


  const currency =
    video.currency ||
    "TZS";



  /* ================================
     TAGS
    ================================= */

  const tags =
    Array.isArray(
      video.tags
    )
    ? video.tags
    : [];



  /* ================================
     HTML
    ================================= */

  card.innerHTML = `

    <div class="thumbnail">


      <img
        src="${escapeAttribute(
          thumbnail
        )}"
        alt="${escapeAttribute(
          video.title ||
          "Video"
        )}"
        loading="lazy"
        onerror="
          this.src='https://via.placeholder.com/640x360?text=Video'
        "
      >


      <span
        class="badge ${
          isFree
            ? "free"
            : "plan"
        }">

        ${
          isFree
            ? "FREE"
            : "PLAN"
        }

      </span>


      ${
        video.duration
        ?
        `
          <span class="duration">

            ${escapeHTML(
              video.duration
            )}

          </span>
        `
        :
        ""
      }


    </div>



    <div class="info">


      <div class="title">

        ${escapeHTML(
          video.title ||
          "Untitled Video"
        )}

      </div>



      <div class="creator">


        <img
          src="${escapeAttribute(
            creatorImage
          )}"
          alt="${escapeAttribute(
            creatorName
          )}"
          loading="lazy"
        >


        <div>


          <div class="creator-name">

            ${escapeHTML(
              creatorName
            )}

            ${
              video.verified === true
              ?
              `
                <i
                  class="fa-solid fa-circle-check"
                  style="color:#2563eb">
                </i>
              `
              :
              ""
            }

          </div>


          <div class="handle">

            ${
              video.channelHandle
              ?
              "@"
              +
              escapeHTML(
                String(
                  video.channelHandle
                )
                .replace(
                  /^@/,
                  ""
                )
              )
              :
              "Let'sStudy Pro"
            }

          </div>


        </div>


      </div>



      <div class="meta">


        <span>

          <i
            class="fa-regular fa-eye">
          </i>

          ${formatNumber(
            video.views
          )}

        </span>


        <span>

          <i
            class="fa-regular fa-thumbs-up">
          </i>

          ${formatNumber(
            video.likes
          )}

        </span>


        <span>

          ${escapeHTML(
            video.category ||
            "Video"
          )}

        </span>


      </div>



      ${
        isFree
        ?
        `
          <div
            class="price free-price">

            Free Video

          </div>
        `
        :
        `
          <div
            class="price plan-price">

            ${
              price > 0
              ?
              `${formatNumber(
                price
              )} ${escapeHTML(
                currency
              )}`
              :
              "Premium Plan"
            }

          </div>
        `
      }



      ${
        tags.length
        ?
        `
          <div class="tags">

            ${
              tags
                .slice(0,4)
                .map(
                  tag => `

                    <span class="tag">

                      #${escapeHTML(
                        tag
                      )}

                    </span>

                  `
                )
                .join("")
            }

          </div>
        `
        :
        ""
      }


    </div>

  `;



  /* ================================
     OPEN
    ================================= */

  card.addEventListener(
    "click",
() => {

  openVideo(video);

}

);


return card;

}


/* =========================================
   OPEN VIDEO
========================================= */

function openVideo(video){

  if(
    !video ||
    !video.videoId
  ){

    console.error(
      "Video ID is missing.",
      video
    );

    return;

  }


  /*
   * videoId ni Firestore document ID
   * Slug haitumiki hapa.
   */

  const videoId =
    encodeURIComponent(
      video.videoId
    );


  /*
   * FREE VIDEO
   * ↓
   * watch-video.html
   */

  if(
    video.isFree === true
  ){

    window.location.href =
      `watch-video.html?id=${videoId}`;

    return;

  }


  /*
   * PLAN / PREMIUM VIDEO
   * ↓
   * video-order.html
   */

  window.location.href =
    `video-order.html?id=${videoId}`;

}


/* =========================================
   SEARCH
========================================= */

function performSearch(){

  searchTerm =
    searchInput.value
      .trim()
      .toLowerCase();

  renderVideos();

}


searchInput.addEventListener(
  "input",
  performSearch
);


searchBtn.addEventListener(
  "click",
  performSearch
);


/* =========================================
   FILTERS
========================================= */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".filter")
          .forEach(item => {

            item.classList.remove(
              "active"
            );

          });


        button.classList.add(
          "active"
        );


        currentCategory =
          button.dataset.category;


        renderVideos();

      }
    );

  });


/* =========================================
   NAVIGATION
========================================= */

document.getElementById(
  "homeBtn"
).onclick = () => {

  window.location.href =
    "index.html";

};


document.getElementById(
  "notificationBtn"
).onclick = () => {

  window.location.href =
    "notifications-video.html";

};


document.getElementById(
  "studioBtn"
).onclick = () => {

  window.location.href =
    "studio.html";

};


/* =========================================
   ERROR
========================================= */

function showError(message){

  error.style.display =
    "block";


  error.innerHTML = `

    <i
      class="fa-solid fa-triangle-exclamation"
      style="font-size:40px">
    </i>


    <h3 style="margin-top:12px">
      Unable to load videos
    </h3>


    <p style="margin-top:8px">
      ${escapeHTML(message)}
    </p>


    <button
      class="retry"
      id="retryBtn">

      <i class="fa-solid fa-rotate"></i>

      Try Again

    </button>

  `;


  document.getElementById(
    "retryBtn"
  ).onclick = loadVideos;

}


/* =========================================
   FORMAT NUMBER
========================================= */

function formatNumber(value){

  const number =
    Number(value) || 0;


  if(number >= 1000000){

    return (
      number / 1000000
    ).toFixed(1) + "M";

  }


  if(number >= 1000){

    return (
      number / 1000
    ).toFixed(1) + "K";

  }


  return String(number);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   ESCAPE ATTRIBUTE
========================================= */

function escapeAttribute(value){

  return escapeHTML(value);

}
