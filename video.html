<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Let'sStudy Video</title>

<meta
  name="description"
  id="metaDescription"
  content="Watch educational videos on Let'sStudy Pro."
>

<link rel="icon" href="/favicon.ico">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button{
  font:inherit;
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back-btn{
  border:0;
  background:#f1f5f9;
  color:#334155;

  padding:10px 15px;
  border-radius:8px;

  font-weight:700;
}

.back-btn:hover{
  background:#e2e8f0;
}


/* =========================
   MAIN
========================= */

.container{
  max-width:1200px;
  margin:auto;

  padding:25px 20px 60px;
}


/* =========================
   PLAYER
========================= */

.player-wrapper{
  background:#000;
  border-radius:14px;
  overflow:hidden;

  width:100%;
}

#videoPlayer{
  width:100%;
  display:block;
  background:#000;

  max-height:700px;
}

#videoThumbnail{
  width:100%;
  display:none;

  max-height:700px;
  object-fit:cover;
}


/* =========================
   INFO
========================= */

.video-info{
  background:#fff;

  border:1px solid #e5e7eb;
  border-radius:14px;

  margin-top:18px;
  padding:22px;
}

.video-title{
  font-size:28px;
  line-height:1.35;

  font-weight:800;

  margin-bottom:12px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:9px;

  color:#64748b;

  font-size:13px;

  margin-bottom:18px;
}

.description{
  color:#374151;

  font-size:15px;
  line-height:1.8;

  white-space:pre-line;
}


/* =========================
   ACCESS
========================= */

.access{
  display:inline-flex;

  padding:5px 9px;

  border-radius:5px;

  font-size:10px;
  font-weight:800;
}

.free{
  background:#dcfce7;
  color:#166534;
}

.plan{
  background:#fef3c7;
  color:#92400e;
}


/* =========================
   PRICE
========================= */

.price{
  margin:15px 0;

  font-size:18px;
  font-weight:800;

  color:#d97706;
}


/* =========================
   CREATOR
========================= */

.creator{
  display:flex;
  align-items:center;

  gap:12px;

  margin-top:25px;
  padding-top:20px;

  border-top:1px solid #e5e7eb;
}

.creator-image{
  width:52px;
  height:52px;

  border-radius:50%;

  object-fit:cover;

  background:#e2e8f0;
}

.creator-name{
  font-size:15px;
  font-weight:800;
}

.creator-id{
  color:#64748b;

  font-size:12px;

  margin-top:4px;
}


/* =========================
   TAGS
========================= */

.tags{
  display:flex;
  flex-wrap:wrap;

  gap:7px;

  margin-top:20px;
}

.tag{
  background:#f1f5f9;
  color:#475569;

  padding:6px 9px;

  border-radius:6px;

  font-size:11px;
}


/* =========================
   STATS
========================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  margin-top:22px;
}

.stat{
  background:#f8fafc;

  border:1px solid #e5e7eb;

  border-radius:9px;

  padding:13px;

  text-align:center;
}

.stat strong{
  display:block;

  font-size:17px;
}

.stat span{
  display:block;

  margin-top:4px;

  color:#64748b;

  font-size:10px;
}


/* =========================
   LOADING
========================= */

.loading{
  text-align:center;

  padding:90px 20px;

  color:#64748b;
}

.spinner{
  width:40px;
  height:40px;

  border:4px solid #e2e8f0;
  border-top-color:#2563eb;

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin:0 auto 15px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   ERROR
========================= */

.error{
  max-width:650px;

  margin:70px auto;

  padding:35px 25px;

  background:#fff;

  border:1px solid #fecaca;

  border-radius:14px;

  text-align:center;

  display:none;
}

.error h2{
  color:#b91c1c;

  margin-bottom:10px;
}

.error p{
  color:#64748b;

  line-height:1.6;
}

.retry{
  margin-top:20px;

  border:0;

  background:#2563eb;
  color:#fff;

  padding:11px 20px;

  border-radius:8px;

  font-weight:700;
}


/* =========================
   CONTENT
========================= */

#content{
  display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .header{
    padding:0 12px;
  }

  .logo{
    font-size:17px;
  }

  .container{
    padding:15px 10px 40px;
  }

  .video-info{
    padding:16px;
  }

  .video-title{
    font-size:21px;
  }

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <button
    class="back-btn"
    id="backBtn">

    ← Back

  </button>


  <div class="logo">

    Let'sStudy
    <span>Pro</span>

  </div>

  <div></div>

</header>



<!-- =========================
     LOADING
========================= -->

<section
  id="loading"
  class="loading">

  <div class="spinner"></div>

  <h3>
    Loading video...
  </h3>

  <p style="margin-top:7px;">
    Reading video from Firestore.
  </p>

</section>



<!-- =========================
     ERROR
========================= -->

<section
  id="error"
  class="error">

  <h2>
    Unable to load video
  </h2>

  <p id="errorMessage">
    Video could not be loaded.
  </p>

  <button
    id="retryBtn"
    class="retry">

    Try Again

  </button>

</section>



<!-- =========================
     CONTENT
========================= -->

<main
  id="content"
  class="container">


  <!-- PLAYER -->

  <div class="player-wrapper">

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata">

    </video>


    <img
      id="videoThumbnail"
      alt="Video thumbnail">

  </div>



  <!-- INFO -->

  <article class="video-info">


    <h1
      id="videoTitle"
      class="video-title">

    </h1>



    <div class="meta">

      <span id="category"></span>

      <span>•</span>

      <span id="duration"></span>

      <span>•</span>

      <span id="publishedAt"></span>

      <span id="access"></span>

    </div>



    <div
      id="price"
      class="price"
      style="display:none;">

    </div>



    <div
      id="description"
      class="description">

    </div>



    <!-- CREATOR -->

    <div class="creator">

      <img
        id="creatorImage"
        class="creator-image"
        alt="Creator">


      <div>

        <div
          id="creatorName"
          class="creator-name">

        </div>


        <div
          id="creatorId"
          class="creator-id">

        </div>

      </div>

    </div>



    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        <strong id="views">
          0
        </strong>

        <span>
          Views
        </span>

      </div>


      <div class="stat">

        <strong id="likes">
          0
        </strong>

        <span>
          Likes
        </span>

      </div>


      <div class="stat">

        <strong id="comments">
          0
        </strong>

        <span>
          Comments
        </span>

      </div>


      <div class="stat">

        <strong id="shares">
          0
        </strong>

        <span>
          Shares
        </span>

      </div>

    </div>



    <!-- TAGS -->

    <div
      id="tags"
      class="tags">

    </div>


  </article>

</main>



<script type="module">


/* =====================================
   FIREBASE
===================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";



/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};



/* =====================================
   INITIALIZE
===================================== */

const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);



/* =====================================
   DOM
===================================== */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const errorMessage =
  document.getElementById(
    "errorMessage"
  );

const content =
  document.getElementById(
    "content"
  );

const retryBtn =
  document.getElementById(
    "retryBtn"
  );



/* =====================================
   GET DOCUMENT ID
===================================== */

/*
 *
 * Supported:
 *
 * letsstudyvideo.html?id=ABC123
 *
 * OR
 *
 * letsstudyvideo.html?videoId=ABC123
 *
 */

function getVideoId(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  return (
    params.get("id") ||
    params.get("videoId") ||
    null
  );

}



/* =====================================
   LOAD
===================================== */

async function loadVideo(){

  loading.style.display =
    "block";

  errorBox.style.display =
    "none";

  content.style.display =
    "none";


  try{


    /* ================================
       FIRESTORE DOCUMENT ID
    ================================= */

    const videoId =
      getVideoId();


    if(!videoId){

      throw new Error(
        "Video ID is missing."
      );

    }


    console.log(
      "Loading Firestore document:",
      videoId
    );



    /* ================================
       DIRECT DOCUMENT
       
       videos/{videoId}
    ================================= */

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const snapshot =
      await getDoc(
        videoRef
      );



    /* ================================
       NOT FOUND
    ================================= */

    if(
      !snapshot.exists()
    ){

      throw new Error(
        "Video not found."
      );

    }



    /* ================================
       ALL DOCUMENT DATA
    ================================= */

    const data =
      snapshot.data();


    console.log(
      "Video data:",
      data
    );



    /* ================================
       DISPLAY
    ================================= */

    displayVideo(
      data,
      snapshot.id
    );


  }
  catch(err){

    console.error(
      "Video loading error:",
      err
    );


    showError(
      err.message
    );

  }

}



/* =====================================
   DISPLAY
===================================== */

function displayVideo(
  video,
  videoId
){

  loading.style.display =
    "none";

  content.style.display =
    "block";



  /* ================================
     TITLE
  ================================= */

  const title =
    video.title ||
    "Untitled Video";


  document.getElementById(
    "videoTitle"
  ).textContent =
    title;


  document.title =
    `${title} | Let'sStudy Pro`;



  /* ================================
     DESCRIPTION
  ================================= */

  document.getElementById(
    "description"
  ).textContent =
    video.description ||
    "";



  document.getElementById(
    "metaDescription"
  ).setAttribute(
    "content",
    video.description ||
    title
  );



  /* ================================
     CATEGORY
  ================================= */

  document.getElementById(
    "category"
  ).textContent =
    video.category ||
    "Education";



  /* ================================
     DURATION
  ================================= */

  document.getElementById(
    "duration"
  ).textContent =
    video.duration ||
    "—";



  /* ================================
     ACCESS
  ================================= */

  const access =
    document.getElementById(
      "access"
    );


  if(
    video.isFree === true
  ){

    access.textContent =
      "FREE";

    access.className =
      "access free";

  }
  else{

    access.textContent =
      "PLAN";

    access.className =
      "access plan";

  }



  /* ================================
     PRICE
  ================================= */

  const priceBox =
    document.getElementById(
      "price"
    );


  if(
    video.isFree === true
  ){

    priceBox.style.display =
      "none";

  }
  else{

    const price =
      Number(
        video.price || 0
      );

    const currency =
      video.currency ||
      "TZS";


    priceBox.style.display =
      "block";


    priceBox.textContent =
      price > 0
        ? `${currency} ${price.toLocaleString()}`
        : "Premium Plan";

  }



  /* ================================
     VIDEO URL
     
     Read ONLY from:
     
     video.videoUrl
  ================================= */

  const player =
    document.getElementById(
      "videoPlayer"
    );


  const thumbnail =
    document.getElementById(
      "videoThumbnail"
    );


  if(
    video.videoUrl
  ){

    player.src =
      video.videoUrl;


    player.load();


    player.style.display =
      "block";

  }
  else{

    player.style.display =
      "none";

  }



  /* ================================
     THUMBNAIL
     
     Read ONLY from:
     
     video.thumbnail
  ================================= */

  if(
    video.thumbnail
  ){

    thumbnail.src =
      video.thumbnail;

  }



  /* ================================
     CREATOR
  ================================= */

  document.getElementById(
    "creatorName"
  ).textContent =
    video.creatorName ||
    "Let'sStudy Pro";


  document.getElementById(
    "creatorId"
  ).textContent =
    video.creatorId
      ? `Creator ID: ${video.creatorId}`
      : "";



  /* ================================
     CREATOR IMAGE
  ================================= */

  const creatorImage =
    document.getElementById(
      "creatorImage"
    );


  if(
    video.creatorImage
  ){

    creatorImage.src =
      video.creatorImage;

  }
  else{

    creatorImage.style.display =
      "none";

  }



  /* ================================
     STATS
  ================================= */

  document.getElementById(
    "views"
  ).textContent =
    formatNumber(
      video.views
    );


  document.getElementById(
    "likes"
  ).textContent =
    formatNumber(
      video.likes
    );


  document.getElementById(
    "comments"
  ).textContent =
    formatNumber(
      video.commentsCount
    );


  document.getElementById(
    "shares"
  ).textContent =
    formatNumber(
      video.shares
    );



  /* ================================
     PUBLISHED
  ================================= */

  document.getElementById(
    "publishedAt"
  ).textContent =
    formatDate(
      video.publishedAt ||
      video.createdAt
    );



  /* ================================
     TAGS
  ================================= */

  const tagsBox =
    document.getElementById(
      "tags"
    );


  let tags = [];


  if(
    Array.isArray(
      video.tags
    )
  ){

    tags =
      video.tags;

  }
  else if(
    typeof video.tags ===
    "string"
  ){

    tags =
      video.tags
        .split(",")
        .map(
          tag =>
            tag.trim()
        )
        .filter(Boolean);

  }


  tagsBox.innerHTML =
    tags
      .map(
        tag => `

          <span class="tag">
            #${escapeHTML(tag)}
          </span>

        `
      )
      .join("");



  console.log(
    "Loaded video ID:",
    videoId
  );

}



/* =====================================
   ERROR
===================================== */

function showError(
  message
){

  loading.style.display =
    "none";

  content.style.display =
    "none";

  errorBox.style.display =
    "block";

  errorMessage.textContent =
    message ||
    "Unable to load video.";

}



/* =====================================
   RETRY
===================================== */

retryBtn.onclick =
  loadVideo;



/* =====================================
   BACK
===================================== */

document
  .getElementById(
    "backBtn"
  )
  .onclick =
  () => {

    if(
      window.history.length > 1
    ){

      window.history.back();

    }
    else{

      window.location.href =
        "video.html";

    }

  };



/* =====================================
   FORMAT NUMBER
===================================== */

function formatNumber(
  value
){

  const number =
    Number(value) || 0;


  if(
    number >= 1000000
  ){

    return (
      number / 1000000
    ).toFixed(1) + "M";

  }


  if(
    number >= 1000
  ){

    return (
      number / 1000
    ).toFixed(1) + "K";

  }


  return String(
    number
  );

}



/* =====================================
   FORMAT DATE
===================================== */

function formatDate(
  value
){

  if(!value){

    return "";

  }


  try{

    let date;


    if(
      typeof value.toDate ===
      "function"
    ){

      date =
        value.toDate();

    }
    else{

      date =
        new Date(value);

    }


    if(
      isNaN(
        date.getTime()
      )
    ){

      return "";

    }


    return date.toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

  }
  catch{

    return "";

  }

}



/* =====================================
   ESCAPE
===================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}



/* =====================================
   START
===================================== */

loadVideo();

</script>

</body>

</html>
