<!DOCTYPE html>
<html lang="en">
<head>

<!-- Google Analytics 4 -->

  window.dataLayer = window.dataLayer || [];

  gtag('js', new Date());

<!-- Google AdSense -->
<script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9557927842145806"
  crossorigin="anonymous"></script>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Videos | LetsStudy Pro</title>
<meta name="description" content="Watch educational and professional videos on LetsStudy Pro.">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background:#f6f8fc;
  color:#111827
}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:17px
}
nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.logo{font-size:21px;font-weight:900;color:#2563eb}
nav a{text-decoration:none;color:#374151;font-weight:700}

main{
  max-width:1100px;
  margin:auto;
  padding:30px 16px
}
.hero{text-align:center;margin-bottom:22px}
.hero h1{
  margin:0 0 8px;
  font-size:clamp(30px,5vw,46px)
}
.hero p{margin:0;color:#6b7280}

.tools{
  display:grid;
  grid-template-columns:1fr 220px;
  gap:10px;
  margin:20px 0
}
.search,select{
  width:100%;
  padding:14px 16px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#fff;
  font-size:15px;
  outline:none
}
.search:focus,select:focus{border-color:#2563eb}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:18px
}
.card{
  overflow:hidden;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.05)
}
.thumb{
  position:relative;
  height:165px;
  background:#111827
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover
}
.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  display:grid;
  place-items:center;
  color:#2563eb;
  font-size:20px
}
.content{padding:16px}
.content h2{margin:0 0 8px;font-size:19px}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0
}
.meta span{
  padding:5px 8px;
  border-radius:7px;
  background:#eff6ff;
  color:#1d4ed8;
  font-size:11px;
  font-weight:700
}
.content p{
  color:#6b7280;
  font-size:13px;
  line-height:1.5
}
.btn{
  display:block;
  text-align:center;
  margin-top:14px;
  padding:11px;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  font-weight:800
}
.status{
  text-align:center;
  padding:25px;
  color:#6b7280
}
@media(max-width:650px){
  .tools{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<nav>
  <div class="logo">LetsStudy Pro</div>
  <a href="index.html">Home</a>
</nav>
</header>

<main>

<section class="hero">
  <h1>Videos</h1>
  <p>Watch educational, career and professional videos.</p>
</section>

<div class="tools">

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search videos..."
    aria-label="Search videos"
  >

  <select id="category">
    <option value="">All Categories</option>
  </select>

</div>

<div id="status" class="status">
  Loading videos...
</div>

<div id="videos" class="grid"></div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain:"let-s-study-pro-course.firebaseapp.com",
  projectId:"let-s-study-pro-course",
  storageBucket:"let-s-study-pro-course.firebasestorage.app",
  messagingSenderId:"474928293390",
  appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const container=document.getElementById("videos");
const status=document.getElementById("status");
const search=document.getElementById("search");
const category=document.getElementById("category");

let allVideos=[];

async function loadVideos(){

  try{

    const snap=await getDocs(
      collection(db,"videos")
    );

    allVideos=snap.docs.map(doc=>({
      id:doc.id,
      ...doc.data()
    }));

    createCategories();
    render(allVideos);

  }catch(error){

    console.error(error);
    status.textContent="Unable to load videos.";

  }

}

function createCategories(){

  const categories=[
    ...new Set(
      allVideos
      .map(video=>video.category)
      .filter(Boolean)
    )
  ];

  categories.sort();

  categories.forEach(cat=>{

    const option=document.createElement("option");

    option.value=cat;
    option.textContent=cat;

    category.appendChild(option);

  });

}

function render(list){

  container.innerHTML="";

  if(!list.length){

    status.textContent="No videos found.";
    return;

  }

  status.textContent=
    `${list.length} video${list.length>1?"s":""} available`;

  list.forEach(video=>{

    const title=
      video.title||
      video.name||
      "Video";

    const description=
      video.description||
      "Watch this video on LetsStudy Pro.";

    const image=
      video.thumbnail||
      video.image||
      video.thumbnailUrl||
      "https://images.unsplash.com/photo-1492619375914-88005aa9e8fb?auto=format&fit=crop&w=800&q=80";

    const cat=
      video.category||
      "";

    const type=
      video.type||
      "Video";

    const duration=
      video.duration||
      "";

    const card=document.createElement("article");

    card.className="card";

    card.innerHTML=`

      <div class="thumb">

        <img
          src="${image}"
          alt="${title}"
          loading="lazy"
          onerror="this.src='https://images.unsplash.com/photo-1492619375914-88005aa9e8fb?auto=format&fit=crop&w=800&q=80'"
        >

        <div class="play" aria-hidden="true">▶</div>

      </div>

      <div class="content">

        <h2>${title}</h2>

        <div class="meta">

          ${cat ? `<span>${cat}</span>` : ""}

          ${type ? `<span>${type}</span>` : ""}

          ${duration ? `<span>${duration}</span>` : ""}

        </div>

        <p>${description}</p>

        <a
          class="btn"
          href="video-details.html?id=${encodeURIComponent(video.id)}"
        >
          Watch Video
        </a>

      </div>

    `;

    container.appendChild(card);

  });

}

function filterVideos(){

  const q=search.value.toLowerCase().trim();
  const cat=category.value;

  const filtered=allVideos.filter(video=>{

    const text=[
      video.title,
      video.name,
      video.description,
      video.category,
      video.type,
      video.tags,
      video.author,
      video.instructor
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    return text.includes(q) &&
           (!cat || video.category===cat);

  });

  render(filtered);

}

search.addEventListener("input",filterVideos);
category.addEventListener("change",filterVideos);

loadVideos();

</script>

</body>
</html>
