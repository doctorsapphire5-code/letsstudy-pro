/* LOADING */

</footer><script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


const videoGrid =
  document.getElementById(
    "videoGrid"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const searchButton =
  document.getElementById(
    "searchButton"
  );

const categoryFilter =
  document.getElementById(
    "categoryFilter"
  );

const levelFilter =
  document.getElementById(
    "levelFilter"
  );

const resultCount =
  document.getElementById(
    "resultCount"
  );


let videos = [];


function first(data,fields){

  for(const field of fields){

    if(
      data[field] !== undefined &&
      data[field] !== null &&
      String(data[field]).trim()
    ){

      return String(data[field]).trim();

    }

  }

  return "";

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getVideo(data,id){

  return {

    id:id,

    title:first(data,[
      "title",
      "name",
      "videoTitle"
    ]) || "Untitled Video",

    description:first(data,[
      "description",
      "details",
      "content"
    ]) || "Watch this educational video on LetsStudy Pro.",

    category:first(data,[
      "category",
      "type",
      "subject"
    ]) || "Educational",

    level:first(data,[
      "level",
      "difficulty"
    ]) || "All Levels",

    duration:first(data,[
      "duration",
      "length"
    ]),

    instructor:first(data,[
      "instructor",
      "teacher",
      "author"
    ]) || "LetsStudy Pro",

    course:first(data,[
      "course",
      "courseName"
    ]),

    subject:first(data,[
      "subject"
    ]),

    image:first(data,[
      "image",
      "imageUrl",
      "thumbnail",
      "thumbnailUrl",
      "poster",
      "posterUrl"
    ])

  };

}


async function loadVideos(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"videos")
      );


    videos = [];


    snapshot.forEach(docSnap => {

      videos.push(
        getVideo(
          docSnap.data() || {},
          docSnap.id
        )
      );

    });


    createFilters();

    renderVideos();

  }catch(error){

    console.error(
      "Videos loading error:",
      error
    );


    resultCount.textContent =
      "Unable to load videos";


    videoGrid.innerHTML = `

      <div class="error">

        <h3>
          Unable to load videos
        </h3>

        <p style="margin-top:8px;">
          Please try again later.
        </p>

      </div>

    `;

  }

}


function createFilters(){

  const categories =
    [...new Set(
      videos
        .map(video => video.category)
        .filter(Boolean)
    )]
    .sort();


  const levels =
    [...new Set(
      videos
        .map(video => video.level)
        .filter(Boolean)
    )]
    .sort();


  categoryFilter.innerHTML =
    `<option value="">All Categories</option>` +

    categories.map(category => `

      <option value="${escapeHTML(category)}">
        ${escapeHTML(category)}
      </option>

    `).join("");


  levelFilter.innerHTML =
    `<option value="">All Levels</option>` +

    levels.map(level => `

      <option value="${escapeHTML(level)}">
        ${escapeHTML(level)}
      </option>

    `).join("");

}


function renderVideos(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  const category =
    categoryFilter.value;


  const level =
    levelFilter.value;


  const filtered =
    videos.filter(video => {

      const searchable = [

        video.title,
        video.description,
        video.category,
        video.level,
        video.instructor,
        video.course,
        video.subject

      ]
      .join(" ")
      .toLowerCase();


      const matchesSearch =
        !query ||
        searchable.includes(query);


      const matchesCategory =
        !category ||
        video.category === category;


      const matchesLevel =
        !level ||
        video.level === level;


      return (
        matchesSearch &&
        matchesCategory &&
        matchesLevel
      );

    });


  resultCount.textContent =
    `${filtered.length} ${
      filtered.length === 1
        ? "video"
        : "videos"
    } found`;


  if(!filtered.length){

    videoGrid.innerHTML = `

      <div class="empty">

        <h3>
          No videos found
        </h3>

        <p style="margin-top:8px;">
          Try another search or filter.
        </p>

      </div>

    `;

    return;

  }


  videoGrid.innerHTML =
    filtered.map(video => {

      const image =
        video.image ||
        "https://via.placeholder.com/800x500?text=Video";


      const description =
        video.description.length > 120
          ? video.description.slice(0,120) + "..."
          : video.description;


      return `

        <article class="card">

          <div class="thumbnail">

            <img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(video.title)}"
              loading="lazy"
              onerror="this.src='https://via.placeholder.com/800x500?text=Video'"
            >


            <div class="play">
              ▶
            </div>


            ${
              video.duration
              ? `
                <div class="duration">
                  ${escapeHTML(video.duration)}
                </div>
              `
              : ""
            }

          </div>


          <div class="card-body">

            <span class="category">
              ${escapeHTML(video.category)}
            </span>


            <h3>
              ${escapeHTML(video.title)}
            </h3>


            <p class="description">
              ${escapeHTML(description)}
            </p>


            <div class="meta">

              ${
                video.instructor
                ? `
                  <span>
                    👤 ${escapeHTML(video.instructor)}
                  </span>
                `
                : ""
              }


              ${
                video.level
                ? `
                  <span>
                    • ${escapeHTML(video.level)}
                  </span>
                `
                : ""
              }

            </div>


            <a
              class="watch"
              href="video-watch.html?id=${encodeURIComponent(video.id)}"
            >
              ▶ Watch Video
            </a>

          </div>

        </article>

      `;

    }).join("");

}


searchButton.addEventListener(
  "click",
  renderVideos
);


searchInput.addEventListener(
  "input",
  renderVideos
);


categoryFilter.addEventListener(
  "change",
  renderVideos
);


levelFilter.addEventListener(
  "change",
  renderVideos
);


loadVideos();

</script></body>
