<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Wallet - Lets Study Pro</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span{
  color:#2563eb;
}

.back{
  text-decoration:none;
  color:#2563eb;
  font-size:14px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 18px;
}

.wallet-card{
  background:#2563eb;
  color:#fff;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
}

.wallet-card small{
  opacity:.85;
}

.balance{
  font-size:36px;
  font-weight:bold;
  margin:10px 0 20px;
}

.wallet-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.action{
  border:0;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.deposit{
  background:#fff;
  color:#2563eb;
}

.withdraw{
  background:#172033;
  color:#fff;
}

.section{
  background:#fff;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.section h2{
  font-size:18px;
  margin-bottom:15px;
}

.transaction{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
  gap:10px;
}

.transaction:last-child{
  border-bottom:0;
}

.tx-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.tx-icon{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f1f5f9;
}

.tx-title{
  font-weight:bold;
  font-size:14px;
}

.tx-date{
  color:#64748b;
  font-size:11px;
  margin-top:4px;
}

.credit{
  color:#16a34a;
  font-weight:bold;
}

.debit{
  color:#dc2626;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:30px;
  color:#64748b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:15px;
  padding:25px;
}

.modal-box h2{
  margin-bottom:18px;
}

.input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
  margin-bottom:12px;
}

.submit{
  width:100%;
  padding:13px;
  background:#2563eb;
  color:#fff;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.cancel{
  width:100%;
  padding:13px;
  background:#e5e7eb;
  border:0;
  border-radius:8px;
  cursor:pointer;
  margin-top:8px;
}

.message{
  margin-bottom:12px;
  padding:10px;
  border-radius:8px;
  display:none;
  font-size:13px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:600px){

  .balance{
    font-size:30px;
  }

  .transaction{
    align-items:flex-start;
  }

}

</style>

</head>

<body>


<header>

  <div class="logo">
    Lets <span>Study Pro</span>
  </div>

  <a
    href="dashboard.html"
    class="back">
    Dashboard
  </a>

</header>


<main class="container">


  <!-- WALLET -->

  <section class="wallet-card">

    <small>
      Available Balance
    </small>

    <div
      class="balance"
      id="balance">
      TZS 0
    </div>


    <div class="wallet-actions">

      <button
        class="action deposit"
        id="depositBtn">
        + Deposit
      </button>

      <button
        class="action withdraw"
        id="withdrawBtn">
        Withdraw
      </button>

    </div>

  </section>



  <!-- TRANSACTIONS -->

  <section class="section">

    <h2>
      Wallet Transactions
    </h2>

    <div id="transactions">

      <div class="empty">
        Loading transactions...
      </div>

    </div>

  </section>


</main>



<!-- DEPOSIT MODAL -->

<div
  class="modal"
  id="depositModal">

  <div class="modal-box">

    <h2>
      Deposit Money
    </h2>

    <div
      class="message"
      id="depositMessage">
    </div>

    <input
      class="input"
      id="depositAmount"
      type="number"
      min="100"
      placeholder="Amount (TZS)"
    >

    <button
      class="submit"
      id="depositSubmit">
      Continue to Payment
    </button>

    <button
      class="cancel"
      onclick="closeModal('depositModal')">
      Cancel
    </button>

  </div>

</div>



<!-- WITHDRAW MODAL -->

<div
  class="modal"
  id="withdrawModal">

  <div class="modal-box">

    <h2>
      Withdraw Money
    </h2>

    <div
      class="message"
      id="withdrawMessage">
    </div>

    <input
      class="input"
      id="withdrawAmount"
      type="number"
      min="1000"
      placeholder="Amount (TZS)"
    >

    <input
      class="input"
      id="withdrawPhone"
      type="tel"
      placeholder="Mobile money number"
    >

    <button
      class="submit"
      id="withdrawSubmit">
      Request Withdrawal
    </button>

    <button
      class="cancel"
      onclick="closeModal('withdrawModal')">
      Cancel
    </button>

  </div>

</div>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  onValue,
  push,
  set,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
  "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
  "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
  "let-s-study-pro-course",

  storageBucket:
  "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
  "474928293390",

  appId:
  "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
  "G-85B7V5H5J0"
};


const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getDatabase(app);


let currentUser = null;

let currentBalance = 0;



/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      window.location.href =
      "login.html";

      return;

    }

    currentUser =
    user;

    loadWallet();

    loadTransactions();

  }
);



/* =====================================================
   WALLET BALANCE
===================================================== */

function loadWallet(){

  const walletRef =
  ref(
    db,
    "wallets/" +
    currentUser.uid
  );


  onValue(
    walletRef,
    snapshot => {

      const wallet =
      snapshot.val() || {};

      currentBalance =
      Number(
        wallet.balance || 0
      );


      document.getElementById(
        "balance"
      ).textContent =
      "TZS " +
      currentBalance
        .toLocaleString("en-TZ");

    }
  );

}



/* =====================================================
   TRANSACTIONS
===================================================== */

function loadTransactions(){

  const transactionsRef =
  ref(
    db,
    "walletTransactions/" +
    currentUser.uid
  );


  onValue(
    transactionsRef,
    snapshot => {

      const data =
      snapshot.val();

      const container =
      document.getElementById(
        "transactions"
      );


      if(!data){

        container.innerHTML = `

          <div class="empty">
            No transactions yet.
          </div>

        `;

        return;

      }


      const list =
      Object.entries(data)
      .map(
        ([id,value]) => ({
          id,
          ...value
        })
      )
      .sort(
        (a,b) =>
        Number(
          b.createdAt || 0
        ) -
        Number(
          a.createdAt || 0
        )
      );


      container.innerHTML =
      list.map(
        transactionHTML
      ).join("");

    }
  );

}



/* =====================================================
   TRANSACTION HTML
===================================================== */

function transactionHTML(tx){

  const type =
  String(
    tx.type || ""
  ).toLowerCase();


  const isCredit =
  type === "deposit" ||
  type === "credit" ||
  type === "refund";


  const amount =
  Number(
    tx.amount || 0
  );


  return `

    <div class="transaction">

      <div class="tx-left">

        <div class="tx-icon">

          ${
            isCredit
            ? "↓"
            : "↑"
          }

        </div>

        <div>

          <div class="tx-title">

            ${
              escapeHtml(
                tx.title ||
                tx.type ||
                "Transaction"
              )
            }

          </div>

          <div class="tx-date">

            ${
              formatDate(
                tx.createdAt
              )
            }

          </div>

        </div>

      </div>


      <div
        class="${
          isCredit
          ? "credit"
          : "debit"
        }">

        ${
          isCredit
          ? "+"
          : "-"
        }

        TZS
        ${
          amount.toLocaleString(
            "en-TZ"
          )
        }

      </div>

    </div>

  `;

}



/* =====================================================
   DEPOSIT
===================================================== */

document
.getElementById(
  "depositBtn"
)
.addEventListener(
  "click",
  () => {

    openModal(
      "depositModal"
    );

  }
);


document
.getElementById(
  "depositSubmit"
)
.addEventListener(
  "click",
  async () => {

    const amount =
    Number(
      document.getElementById(
        "depositAmount"
      ).value
    );


    if(
      !amount ||
      amount < 100
    ){

      showMessage(
        "depositMessage",
        "Enter a valid amount.",
        "error"
      );

      return;

    }


    /*
    Create a payment order.

    IMPORTANT:
    Actual wallet balance MUST NOT
    be increased here.

    Pesapal/backend should verify payment
    first, then credit the wallet.
    */

    const orderRef =
    push(
      ref(
        db,
        "walletOrders"
      )
    );


    await set(
      orderRef,
      {

        userId:
        currentUser.uid,

        amount:
        amount,

        currency:
        "TZS",

        status:
        "pending",

        paymentStatus:
        "pending",

        createdAt:
        Date.now()

      }
    );


    /*
    Send user to your checkout page.
    */

    window.location.href =
      "checkout.html?walletOrderId=" +
      encodeURIComponent(
        orderRef.key
      );

  }
);



/* =====================================================
   WITHDRAW
===================================================== */

document
.getElementById(
  "withdrawBtn"
)
.addEventListener(
  "click",
  () => {

    openModal(
      "withdrawModal"
    );

  }
);


document
.getElementById(
  "withdrawSubmit"
)
.addEventListener(
  "click",
  async () => {

    const amount =
    Number(
      document.getElementById(
        "withdrawAmount"
      ).value
    );


    const phone =
    document.getElementById(
      "withdrawPhone"
    ).value.trim();


    if(
      !amount ||
      amount < 1000
    ){

      showMessage(
        "withdrawMessage",
        "Minimum withdrawal is TZS 1,000.",
        "error"
      );

      return;

    }


    if(!phone){

      showMessage(
        "withdrawMessage",
        "Enter your mobile money number.",
        "error"
      );

      return;

    }


    if(
      amount >
      currentBalance
    ){

      showMessage(
        "withdrawMessage",
        "Insufficient wallet balance.",
        "error"
      );

      return;

    }


    /*
    DO NOT subtract balance on frontend.

    Create a withdrawal request.
    Backend/admin approval should process it.
    */

    const withdrawalRef =
    push(
      ref(
        db,
        "withdrawals"
      )
    );


    await set(
      withdrawalRef,
      {

        userId:
        currentUser.uid,

        amount:
        amount,

        phone:
        phone,

        status:
        "pending",

        createdAt:
        Date.now()

      }
    );


    showMessage(
      "withdrawMessage",
      "Withdrawal request submitted successfully.",
      "success"
    );


    document.getElementById(
      "withdrawAmount"
    ).value = "";

    document.getElementById(
      "withdrawPhone"
    ).value = "";

  }
);



/* =====================================================
   MODAL
===================================================== */

function openModal(id){

  document
  .getElementById(id)
  .classList.add("show");

}


window.closeModal =
function(id){

  document
  .getElementById(id)
  .classList.remove("show");

};



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  id,
  message,
  type
){

  const element =
  document.getElementById(id);

  element.textContent =
  message;

  element.className =
  "message " +
  type;

  element.style.display =
  "block";

}



/* =====================================================
   DATE
===================================================== */

function formatDate(value){

  if(!value)
    return "-";


  const date =
  new Date(
    Number(value)
  );


  if(
    isNaN(
      date.getTime()
    )
  )
    return "-";


  return date.toLocaleString(
    "en-TZ"
  );

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}

</script>

</body>
</html>
