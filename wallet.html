<!DOCTYPE html>
<html>

<head>

<title>Wallet | LetsStudy Pro</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:Arial;
background:#f5f7fb;
}


.container{
max-width:900px;
margin:auto;
padding:20px;
}


.wallet{

background:#0b57d0;
color:white;
padding:30px;
border-radius:20px;

}


.card{

background:white;
padding:20px;
margin-top:20px;
border-radius:15px;

}


</style>


</head>


<body>


<div class="container">


<h1>
💳 My Wallet
</h1>


<div class="wallet">

<h2>
Balance
</h2>

<h1 id="balance">

TZS 0

</h1>


</div>



<div class="card">

<h2>
Transactions
</h2>


<div id="transactions">

Loading...

</div>


</div>


</div>






<script type="module">


import {

auth,
db

}

from "./assets/js/firebase.js";


import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

doc,
getDoc,
collection,
query,
where,
orderBy,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
  authDomain: "let-s-study-pro-course.firebaseapp.com",
  databaseURL: "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
  projectId: "let-s-study-pro-course",
  storageBucket: "let-s-study-pro-course.firebasestorage.app",
  messagingSenderId: "474928293390",
  appId: "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
  measurementId: "G-85B7V5H5J0"
};



onAuthStateChanged(

auth,

user=>{


if(!user){

location.href="login.html";

return;

}


loadWallet(user.uid);


});








async function loadWallet(uid){



const wallet =

await getDoc(

doc(
db,
"wallets",
uid
)

);



if(wallet.exists()){


document.getElementById(
"balance"
).innerHTML=

"TZS "+
wallet.data().balance.toLocaleString();


}




const q=query(

collection(
db,
"transactions"
),

where(
"userId",
"==",
uid
),

orderBy(
"createdAt",
"desc"
)

);



const snap =
await getDocs(q);



let html="";



snap.forEach(

item=>{


const t =
item.data();


html+=`

<p>

${t.type}

<br>

TZS ${t.amount}

<br>

Status:
${t.status}

</p>

<hr>

`;



});



document.getElementById(
"transactions"
).innerHTML=

html || "No transactions";


}



</script>


</body>

</html>
