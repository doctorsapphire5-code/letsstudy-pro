<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Watch Video | Let'sStudy Pro</title>

<meta
  name="description"
  id="metaDescription"
  content="Watch educational videos on Let'sStudy Pro."
>

<link rel="icon" href="/favicon.ico">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button{
  font:inherit;
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;

  font-size:20px;
  font-weight:800;
}

.logo i{
  color:#2563eb;
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-btn{
  width:40px;
  height:40px;

  border:0;
  border-radius:50%;

  background:#f1f5f9;
  color:#334155;
}

.header-btn:hover{
  background:#e2e8f0;
}


/* =========================
   CONTAINER
========================= */

.container{
  max-width:1200px;

  margin:auto;

  padding:25px 20px 60px;
}


/* =========================
   PLAYER
========================= */

.player-wrapper{
  width:100%;

  background:#000;

  border-radius:14px;

  overflow:hidden;

  position:relative;
}

#videoPlayer{
  display:block;

  width:100%;

  max-height:700px;

  background:#000;
}


/* =========================
   VIDEO ERROR
========================= */

.player-error{
  display:none;

  min-height:450px;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:30px;

  color:#fff;
}

.player-error i{
  font-size:50px;

  margin-bottom:15px;
}

.player-error h2{
  font-size:22px;

  margin-bottom:8px;
}

.player-error p{
  color:#cbd5e1;

  font-size:14px;
}


/* =========================
   VIDEO INFO
========================= */

.video-info{
  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:14px;

  margin-top:18px;

  padding:22px;
}

.video-title{
  font-size:28px;

  line-height:1.35;

  font-weight:800;
}

.meta{
  display:flex;

  flex-wrap:wrap;

  align-items:center;

  gap:10px;

  margin-top:12px;

  color:#64748b;

  font-size:13px;
}

.free-badge{
  display:inline-flex;

  align-items:center;

  padding:5px 9px;

  border-radius:5px;

  background:#dcfce7;

  color:#166534;

  font-size:10px;

  font-weight:800;
}


/* =========================
   DESCRIPTION
========================= */

.description{
  margin-top:20px;

  padding-top:20px;

  border-top:1px solid #e5e7eb;

  color:#374151;

  font-size:15px;

  line-height:1.8;

  white-space:pre-line;
}


/* =========================
   CREATOR
========================= */

.creator{
  display:flex;

  align-items:center;

  gap:12px;

  margin-top:22px;

  padding-top:20px;

  border-top:1px solid #e5e7eb;
}

.creator-image{
  width:50px;
  height:50px;

  border-radius:50%;

  object-fit:cover;

  background:#e2e8f0;
}

.creator-name{
  font-size:15px;

  font-weight:800;
}

.creator-id{
  margin-top:4px;

  color:#64748b;

  font-size:11px;
}


/* =========================
   STATS
========================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  margin-top:22px;
}

.stat{
  background:#f8fafc;

  border:1px solid #e5e7eb;

  border-radius:9px;

  padding:13px;

  text-align:center;
}

.stat strong{
  display:block;

  font-size:17px;
}

.stat span{
  display:block;

  margin-top:4px;

  color:#64748b;

  font-size:10px;
}


/* =========================
   TAGS
========================= */

.tags{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:20px;
}

.tag{
  background:#f1f5f9;

  color:#475569;

  padding:6px 9px;

  border-radius:6px;

  font-size:11px;
}


/* =========================
   LOADING
========================= */

.loading{
  text-align:center;

  padding:90px 20px;

  color:#64748b;
}

.spinner{
  width:40px;
  height:40px;

  border:4px solid #e2e8f0;

  border-top-color:#2563eb;

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin:0 auto 15px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   ERROR
========================= */

.error{
  max-width:650px;

  margin:70px auto;

  padding:35px 25px;

  background:#fff;

  border:1px solid #fecaca;

  border-radius:14px;

  text-align:center;

  display:none;
}

.error i{
  font-size:45px;

  color:#dc2626;

  margin-bottom:15px;
}

.error h2{
  color:#b91c1c;

  margin-bottom:10px;
}

.error p{
  color:#64748b;

  line-height:1.6;
}

.retry{
  margin-top:20px;

  border:0;

  background:#2563eb;

  color:#fff;

  padding:11px 20px;

  border-radius:8px;

  font-weight:700;
}


/* =========================
   CONTENT
========================= */

#content{
  display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .header{
    padding:0 12px;
  }

  .logo{
    font-size:17px;
  }

  .container{
    padding:15px 10px 40px;
  }

  .video-info{
    padding:16px;
  }

  .video-title{
    font-size:21px;
  }

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .player-error{
    min-height:300px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <button
    class="header-btn"
    id="backBtn"
    title="Back">

    <i class="fa-solid fa-arrow-left"></i>

  </button>


  <div class="logo">

    <i class="fa-solid fa-circle-play"></i>

    <span>Let'sStudy Pro</span>

  </div>


  <div class="header-actions">

    <button
      class="header-btn"
      id="homeBtn"
      title="Home">

      <i class="fa-solid fa-house"></i>

    </button>

  </div>

</header>



<!-- =========================
     LOADING
========================= -->

<section
  id="loading"
  class="loading">

  <div class="spinner"></div>

  <h3>
    Loading video...
  </h3>

  <p style="margin-top:7px;">
    Reading video from Firestore.
  </p>

</section>



<!-- =========================
     ERROR
========================= -->

<section
  id="error"
  class="error">

  <i class="fa-solid fa-triangle-exclamation"></i>

  <h2>
    Unable to load video
  </h2>

  <p id="errorMessage">
    Video could not be loaded.
  </p>

  <button
    id="retryBtn"
    class="retry">

    <i class="fa-solid fa-rotate"></i>

    Try Again

  </button>

</section>



<!-- =========================
     CONTENT
========================= -->

<main
  id="content"
  class="container">


  <!-- =====================
       VIDEO PLAYER
  ====================== -->

  <div class="player-wrapper">


    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata">

    </video>


    <div
      id="playerError"
      class="player-error">

      <div>

        <i class="fa-solid fa-video-slash"></i>

        <h2>
          Unable to play video
        </h2>

        <p>
          The video URL could not be played.
        </p>

      </div>

    </div>

  </div>



  <!-- =====================
       VIDEO INFORMATION
  ====================== -->

  <article class="video-info">


    <h1
      id="videoTitle"
      class="video-title">

      Loading...

    </h1>



    <div class="meta">

      <span id="category">
        Education
      </span>

      <span>•</span>

      <span id="duration">
        —
      </span>

      <span>•</span>

      <span id="publishedAt">
        —
      </span>

      <span
        id="access"
        class="free-badge">

        FREE

      </span>

    </div>



    <!-- DESCRIPTION -->

    <div
      id="description"
      class="description">

    </div>



    <!-- CREATOR -->

    <div class="creator">

      <img
        id="creatorImage"
        class="creator-image"
        alt="Creator"
      >


      <div>

        <div
          id="creatorName"
          class="creator-name">

        </div>


        <div
          id="creatorId"
          class="creator-id">

        </div>

      </div>

    </div>



    <!-- STATS -->

    <div class="stats">


      <div class="stat">

        <strong id="views">
          0
        </strong>

        <span>
          Views
        </span>

      </div>


      <div class="stat">

        <strong id="likes">
          0
        </strong>

        <span>
          Likes
        </span>

      </div>


      <div class="stat">

        <strong id="comments">
          0
        </strong>

        <span>
          Comments
        </span>

      </div>


      <div class="stat">

        <strong id="shares">
          0
        </strong>

        <span>
          Shares
        </span>

      </div>


    </div>



    <!-- TAGS -->

    <div
      id="tags"
      class="tags">

    </div>


  </article>

</main>



<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";



/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};



/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);



/* =========================================
   DOM
========================================= */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const errorMessage =
  document.getElementById(
    "errorMessage"
  );

const content =
  document.getElementById(
    "content"
  );

const retryBtn =
  document.getElementById(
    "retryBtn"
  );

const videoPlayer =
  document.getElementById(
    "videoPlayer"
  );

const playerError =
  document.getElementById(
    "playerError"
  );



/* =========================================
   GET VIDEO ID
========================================= */

function getVideoId(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
   * Main format:
   *
   * watch-video.html?id=DOCUMENT_ID
   */

  return (
    params.get("id") ||
    params.get("videoId") ||
    null
  );

}



/* =========================================
   LOAD VIDEO
========================================= */

async function loadVideo(){

  loading.style.display =
    "block";

  errorBox.style.display =
    "none";

  content.style.display =
    "none";


  try{


    /* ================================
       GET DOCUMENT ID
    ================================= */

    const videoId =
      getVideoId();


    if(!videoId){

      throw new Error(
        "Video ID is missing."
      );

    }


    console.log(
      "Video Document ID:",
      videoId
    );



    /* ================================
       DIRECT FIRESTORE DOCUMENT
       
       videos/{videoId}
    ================================= */

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const snapshot =
      await getDoc(
        videoRef
      );



    /* ================================
       DOCUMENT DOES NOT EXIST
    ================================= */

    if(
      !snapshot.exists()
    ){

      throw new Error(
        "Video not found."
      );

    }



    /* ================================
       GET ALL DATA
    ================================= */

    const video =
      snapshot.data();



    console.log(
      "Firestore video:",
      video
    );



    /* ================================
       FREE CHECK
       
       watch-video.html is ONLY for
       free videos.
    ================================= */

    if(
      video.isFree !== true
    ){

      window.location.href =
        `video-order.html?id=${
          encodeURIComponent(
            snapshot.id
          )
        }`;

      return;

    }



    /* ================================
       DISPLAY
    ================================= */

    displayVideo(
      video,
      snapshot.id
    );


  }
  catch(err){

    console.error(
      "Firestore error:",
      err
    );


    showError(
      err.message
    );

  }

}



/* =========================================
   DISPLAY VIDEO
========================================= */

function displayVideo(
  video,
  videoId
){

  loading.style.display =
    "none";

  content.style.display =
    "block";



  /* ================================
     TITLE
  ================================= */

  const title =
    video.title ||
    "Untitled Video";


  document.getElementById(
    "videoTitle"
  ).textContent =
    title;


  document.title =
    `${title} | Let'sStudy Pro`;



  /* ================================
     DESCRIPTION
  ================================= */

  document.getElementById(
    "description"
  ).textContent =
    video.description ||
    "";



  /* ================================
     META DESCRIPTION
  ================================= */

  document
    .getElementById(
      "metaDescription"
    )
    .setAttribute(
      "content",
      video.description ||
      title
    );



  /* ================================
     CATEGORY
  ================================= */

  document.getElementById(
    "category"
  ).textContent =
    video.category ||
    "Education";



  /* ================================
     DURATION
  ================================= */

  document.getElementById(
    "duration"
  ).textContent =
    video.duration ||
    "—";



  /* ================================
     PUBLISHED DATE
  ================================= */

  document.getElementById(
    "publishedAt"
  ).textContent =
    formatDate(
      video.publishedAt ||
      video.createdAt
    );



  /* ================================
     VIDEO URL
     
     IMPORTANT:
     
     It reads videoUrl directly
     from Firestore.
     
     NO Firebase Storage.
     NO slug.
  ================================= */

  if(
    video.videoUrl
  ){

    videoPlayer.src =
      String(
        video.videoUrl
      );


    videoPlayer.load();


    videoPlayer.style.display =
      "block";

  }
  else{

    videoPlayer.style.display =
      "none";

    playerError.style.display =
      "flex";

  }



  /* ================================
     VIDEO ERROR
  ================================= */

  videoPlayer.onerror =
    () => {

      videoPlayer.style.display =
        "none";

      playerError.style.display =
        "flex";

    };



  /* ================================
     CREATOR
  ================================= */

  document.getElementById(
    "creatorName"
  ).textContent =
    video.creatorName ||
    "Let'sStudy Pro";


  document.getElementById(
    "creatorId"
  ).textContent =
    video.creatorId
      ? `Creator ID: ${video.creatorId}`
      : "";



  /* ================================
     CREATOR IMAGE
     
     Direct field from Firestore.
  ================================= */

  const creatorImage =
    document.getElementById(
      "creatorImage"
    );


  if(
    video.creatorImage
  ){

    creatorImage.src =
      String(
        video.creatorImage
      );

  }
  else{

    creatorImage.style.display =
      "none";

  }



  /* ================================
     STATS
  ================================= */

  document.getElementById(
    "views"
  ).textContent =
    formatNumber(
      video.views
    );


  document.getElementById(
    "likes"
  ).textContent =
    formatNumber(
      video.likes
    );


  document.getElementById(
    "comments"
  ).textContent =
    formatNumber(
      video.commentsCount
    );


  document.getElementById(
    "shares"
  ).textContent =
    formatNumber(
      video.shares
    );



  /* ================================
     TAGS
  ================================= */

  const tagsBox =
    document.getElementById(
      "tags"
    );


  let tags = [];


  if(
    Array.isArray(
      video.tags
    )
  ){

    tags =
      video.tags;

  }
  else if(
    typeof video.tags ===
    "string"
  ){

    tags =
      video.tags
        .split(",")
        .map(
          tag =>
            tag.trim()
        )
        .filter(Boolean);

  }


  tagsBox.innerHTML =
    tags
      .map(
        tag => `

          <span class="tag">
            #${escapeHTML(tag)}
          </span>

        `
      )
      .join("");



  console.log(
    "Loaded video:",
    videoId
  );

}



/* =========================================
   ERROR
========================================= */

function showError(
  message
){

  loading.style.display =
    "none";

  content.style.display =
    "none";

  errorBox.style.display =
    "block";

  errorMessage.textContent =
    message ||
    "Unable to load video.";

}



/* =========================================
   RETRY
========================================= */

retryBtn.onclick =
  loadVideo;



/* =========================================
   BACK
========================================= */

document
  .getElementById(
    "backBtn"
  )
  .onclick =
  () => {

    if(
      window.history.length > 1
    ){

      window.history.back();

    }
    else{

      window.location.href =
        "video.html";

    }

  };



/* =========================================
   HOME
========================================= */

document
  .getElementById(
    "homeBtn"
  )
  .onclick =
  () => {

    window.location.href =
      "index.html";

  };



/* =========================================
   FORMAT NUMBER
========================================= */

function formatNumber(
  value
){

  const number =
    Number(value) || 0;


  if(
    number >= 1000000
  ){

    return (
      number / 1000000
    ).toFixed(1) + "M";

  }


  if(
    number >= 1000
  ){

    return (
      number / 1000
    ).toFixed(1) + "K";

  }


  return String(
    number
  );

}



/* =========================================
   FORMAT DATE
========================================= */

function formatDate(
  value
){

  if(!value){

    return "—";

  }


  try{

    let date;


    /*
     * Firestore Timestamp
     */

    if(
      value &&
      typeof value.toDate ===
      "function"
    ){

      date =
        value.toDate();

    }
    else{

      date =
        new Date(value);

    }


    if(
      isNaN(
        date.getTime()
      )
    ){

      return "—";

    }


    return date.toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

  }
  catch{

    return "—";

  }

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
        /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   START
========================================= */

loadVideo();

</script>

</body>

</html>
