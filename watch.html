<style>
*{

body{

button{

.header{

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  increment
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   DOM
===================================================== */

const $ =
  id => document.getElementById(id);

const loading =
  $("loading");

const errorBox =
  $("error");

const layout =
  $("layout");

const player =
  $("player");

const videoList =
  $("videoList");


/* =====================================================
   STATE
===================================================== */

let currentVideo = null;

let videos = [];


/* =====================================================
   FIRESTORE ID ONLY
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

/*
 * IMPORTANT:
 * Only id/videoId is accepted.
 * slug is NEVER used to find the document.
 */

const firebaseVideoId =
  params.get("id") ||
  params.get("videoId");


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   NUMBER
===================================================== */

function formatNumber(value){

  return Number(value || 0)
    .toLocaleString();

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

  if(!value){
    return "—";
  }

  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value
        .toDate()
        .toLocaleString();

    }

    const date =
      new Date(value);

    if(
      !Number.isNaN(
        date.getTime()
      )
    ){

      return date.toLocaleString();

    }

  }catch(e){}

  return String(value);

}


/* =====================================================
   ATTRIBUTE ESCAPE
===================================================== */

function escapeAttribute(value){

  return escapeHTML(value);

}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

  loading.classList.add(
    "hidden"
  );

  layout.classList.add(
    "hidden"
  );

  errorBox.innerHTML = `

    <i class="fa-solid fa-triangle-exclamation"></i>

    <h2>
      Unable to load video
    </h2>

    <p>
      ${escapeHTML(message)}
    </p>

    <button
      class="retry"
      id="retryBtn"
    >
      <i class="fa-solid fa-rotate"></i>
      Try Again
    </button>

  `;

  errorBox.classList.remove(
    "hidden"
  );

  $("retryBtn").onclick =
    start;

}


/* =====================================================
   LOAD VIDEO BY FIRESTORE DOCUMENT ID
===================================================== */

async function loadVideo(){

  if(!firebaseVideoId){

    showError(
      "Video ID is missing. Open the video using its Firestore document ID."
    );

    return;

  }


  /*
   * EXACT LOOKUP:
   *
   * videos/{Firestore Document ID}
   *
   * No slug query.
   */

  const videoRef =
    doc(
      db,
      "videos",
      firebaseVideoId
    );

  const snap =
    await getDoc(videoRef);


  if(!snap.exists()){

    showError(
      "The video document was not found in Firestore."
    );

    return;

  }


  const data =
    snap.data();


  /*
   * Document ID comes directly
   * from Firestore.
   */

  currentVideo = {

    videoId:
      snap.id,

    ...data

  };


  /* =================================================
     FREE / PLAN CHECK
  ================================================= */

  if(
    currentVideo.isFree !== true
  ){

    /*
     * Plan video.
     * Never play it on watch.html.
     */

    window.location.replace(
      `video-order.html?id=${
        encodeURIComponent(
          currentVideo.videoId
        )
      }`
    );

    return;

  }


  /* =================================================
     STATUS CHECK
  ================================================= */

  const status =
    String(
      currentVideo.status || ""
    ).toLowerCase();


  if(
    status &&
    status !== "published"
  ){

    showError(
      "This video is not currently published."
    );

    return;

  }


  await loadMoreVideos();

  renderVideo();

  loading.classList.add(
    "hidden"
  );

  layout.classList.remove(
    "hidden"
  );

  countView();

}


/* =====================================================
   LOAD MORE VIDEOS
===================================================== */

async function loadMoreVideos(){

  videos = [];

  const snap =
    await getDocs(
      collection(
        db,
        "videos"
      )
    );


  snap.forEach(
    item => {

      const data =
        item.data();

      const status =
        String(
          data.status || ""
        ).toLowerCase();


      if(
        status &&
        status !== "published"
      ){

        return;

      }


      videos.push({

        /*
         * Firestore ID ONLY
         */

        videoId:
          item.id,

        ...data

      });

    }
  );

}


/* =====================================================
   RENDER VIDEO
===================================================== */

function renderVideo(){

  const v =
    currentVideo;


  $("title").textContent =
    v.title ||
    "Untitled Video";


  $("description").textContent =
    v.description ||
    "No description available.";


  $("videoId").textContent =
    v.videoId;


  $("videoType").textContent =
    v.videoType ||
    "—";


  $("category").textContent =
    v.category ||
    "—";


  $("duration").textContent =
    v.duration ||
    "—";


  $("views").textContent =
    formatNumber(v.views);


  $("likes").textContent =
    formatNumber(v.likes);


  $("likeDetail").textContent =
    formatNumber(v.likes);


  $("comments").textContent =
    formatNumber(
      v.commentsCount
    );


  $("commentDetail").textContent =
    formatNumber(
      v.commentsCount
    );


  $("shares").textContent =
    formatNumber(v.shares);


  $("status").textContent =
    v.status ||
    "—";


  $("publishedAt").textContent =
    formatDate(
      v.publishedAt
    );


  $("channelName").textContent =
    v.channelName ||
    v.creatorName ||
    "Let'sStudy Pro";


  $("channelHandle").textContent =
    v.channelHandle
      ? "@" +
        String(
          v.channelHandle
        ).replace(/^@/,"")
      : "";


  $("channelImage").src =
    v.channelImage ||
    v.creatorImage ||
    `https://ui-avatars.com/api/?name=${
      encodeURIComponent(
        v.channelName ||
        v.creatorName ||
        "Let'sStudy Pro"
      )
    }`;


  $("meta").innerHTML = `

    <span class="badge">
      ${escapeHTML(
        v.category || "Video"
      )}
    </span>

    <span class="badge">
      ${escapeHTML(
        v.duration || "—"
      )}
    </span>

    <span class="badge">
      ${formatNumber(v.views)}
      views
    </span>

    <span class="badge free">
      FREE
    </span>

  `;


  loadPlayer(v);

  renderMoreVideos();

  updateSaveButton();

}


/* =====================================================
   VIDEO PLAYER
===================================================== */

function loadPlayer(v){

  player.innerHTML = "";

  const url =
    String(
      v.videoUrl || ""
    ).trim();


  if(!url){

    player.innerHTML = `

      <div class="message">

        <div>

          <i class="fa-solid fa-video-slash"></i>

          <h2>
            Video unavailable
          </h2>

          <p>
            No videoUrl was found in this Firestore document.
          </p>

        </div>

      </div>

    `;

    return;

  }


  const youtube =
    getYouTubeId(url);


  if(youtube){

    const iframe =
      document.createElement(
        "iframe"
      );

    iframe.src =
      `https://www.youtube.com/embed/${
        encodeURIComponent(youtube)
      }?rel=0&modestbranding=1`;


    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";


    iframe.allowFullscreen =
      true;


    player.appendChild(
      iframe
    );

    return;

  }


  const vimeo =
    getVimeoId(url);


  if(vimeo){

    const iframe =
      document.createElement(
        "iframe"
      );

    iframe.src =
      `https://player.vimeo.com/video/${
        encodeURIComponent(vimeo)
      }`;


    iframe.allowFullscreen =
      true;


    player.appendChild(
      iframe
    );

    return;

  }


  /*
   * Direct MP4/WebM/etc.
   */

  const video =
    document.createElement(
      "video"
    );


  video.src =
    url;


  video.controls =
    true;


  video.playsInline =
    true;


  video.preload =
    "metadata";


  if(v.thumbnail){

    video.poster =
      v.thumbnail;

  }


  video.onerror =
    () => {

      player.innerHTML = `

        <div class="message">

          <div>

            <i class="fa-solid fa-triangle-exclamation"></i>

            <h2>
              Unable to play video
            </h2>

            <p>
              Check the video URL or video type.
            </p>

          </div>
        `;
      };

      player.appendChild(video);

      html5Video = video;

      return;
    }

    player.innerHTML = `
      <div class="message">
        <div>
          <i class="fa-solid fa-triangle-exclamation"></i>
          <h2>Unsupported video type</h2>
          <p>
            This video cannot be played by this browser.
          </p>
        </div>
      </div>
    `;

  }


  /* =========================
     YOUTUBE ID
  ========================= */

  function getYouTubeId(url){

    try{

      const u = new URL(url);

      if(u.hostname.includes("youtu.be")){

        return u.pathname
          .replace(/^\/+/,"")
          .split("/")[0];

      }

      if(u.hostname.includes("youtube.com")){

        const v =
          u.searchParams.get("v");

        if(v){
          return v;
        }

        if(u.pathname.startsWith("/embed/")){
          return u.pathname
            .split("/")[2];
        }

        if(u.pathname.startsWith("/shorts/")){
          return u.pathname
            .split("/")[2];
        }

      }

    }catch(e){

      console.warn(
        "YouTube URL error:",
        e
      );

    }

    return null;

  }


  /* =========================
     ACCESS
     FREE → watch.html
     PLAN → video-order.html
  ========================= */

  function openVideo(video){

    if(!video || !video.videoId){
      return;
    }

    const id =
      encodeURIComponent(
        video.videoId
      );

    if(video.isFree === true){

      location.href =
        `watch.html?id=${id}`;

    }else{

      location.href =
        `video-order.html?id=${id}`;

    }

  }


  /* =========================
     VIEW COUNT
  ========================= */

  async function countView(){

    if(!currentVideo){
      return;
    }

    const key =
      `watch-viewed-${currentVideo.videoId}`;

    if(sessionStorage.getItem(key)){
      return;
    }

    sessionStorage.setItem(
      key,
      "1"
    );

    try{

      await updateDoc(
        doc(
          db,
          "videos",
          currentVideo.videoId
        ),
        {
          views: increment(1)
        }
      );

      currentVideo.views =
        Number(
          currentVideo.views || 0
        ) + 1;

      views.textContent =
        formatNumber(
          currentVideo.views
        );

    }catch(err){

      console.warn(
        "View count failed:",
        err
      );

    }

  }


  /* =========================
     LIKE
  ========================= */

  likeBtn.addEventListener(
    "click",
    async () => {

      if(!currentVideo){
        return;
      }

      const key =
        `liked-${currentVideo.videoId}`;

      if(
        localStorage.getItem(key)
      ){

        return;

      }

      try{

        await updateDoc(
          doc(
            db,
            "videos",
            currentVideo.videoId
          ),
          {
            likes: increment(1)
          }
        );

        localStorage.setItem(
          key,
          "1"
        );

        currentVideo.likes =
          Number(
            currentVideo.likes || 0
          ) + 1;

        likes.textContent =
          formatNumber(
            currentVideo.likes
          );

        likeBtn.classList.add(
          "active"
        );

        likeBtn.innerHTML =
          `<i class="fa-solid fa-thumbs-up"></i> Liked`;

      }catch(err){

        console.error(
          "Like failed:",
          err
        );

      }

    }
  );


  /* =========================
     SAVE
  ========================= */

  saveBtn.addEventListener(
    "click",
    () => {

      if(!currentVideo){
        return;
      }

      const key =
        `saved-${currentVideo.videoId}`;

      if(
        localStorage.getItem(key)
      ){

        localStorage.removeItem(
          key
        );

        saveBtn.classList.remove(
          "active"
        );

        saveBtn.innerHTML =
          `<i class="fa-regular fa-bookmark"></i> Save`;

      }else{

        localStorage.setItem(
          key,
          "1"
        );

        saveBtn.classList.add(
          "active"
        );

        saveBtn.innerHTML =
          `<i class="fa-solid fa-bookmark"></i> Saved`;

      }

    }
  );


  /* =========================
     SHARE
  ========================= */

  shareBtn.addEventListener(
    "click",
    async () => {

      if(!currentVideo){
        return;
      }

      const shareUrl =
        `${location.origin}${location.pathname}?id=${
          encodeURIComponent(
            currentVideo.videoId
          )
        }`;

      try{

        if(
          navigator.share
        ){

          await navigator.share({

            title:
              currentVideo.title ||
              "Let'sStudy Pro",

            text:
              currentVideo.description ||
              "Watch this educational video on Let'sStudy Pro.",

            url:
              shareUrl

          });

        }else{

          await navigator.clipboard.writeText(
            shareUrl
          );

          alert(
            "Video link copied."
          );

        }

        await updateDoc(
          doc(
            db,
            "videos",
            currentVideo.videoId
          ),
          {
            shares: increment(1)
          }
        );

        currentVideo.shares =
          Number(
            currentVideo.shares || 0
          ) + 1;

        shares.textContent =
          formatNumber(
            currentVideo.shares
          );

      }catch(err){

        if(
          err?.name !==
          "AbortError"
        ){

          console.warn(
            "Share failed:",
            err
          );

        }

      }

    }
  );


  /* =========================
     COMMENTS
  ========================= */

  commentBtn.addEventListener(
    "click",
    () => {

      if(!currentVideo){
        return;
      }

      location.href =
        `comments.html?videoId=${
          encodeURIComponent(
            currentVideo.videoId
          )
        }`;

    }
  );


  /* =========================
     BACK
  ========================= */

  backBtn.addEventListener(
    "click",
    () => {

      if(
        history.length > 1
      ){

        history.back();

      }else{

        location.href =
          "videos.html";

      }

    }
  );


  homeBtn.addEventListener(
    "click",
    () => {

      location.href =
        "videos.html";

    }
  );


  /* =========================
     PREVIOUS / NEXT
  ========================= */

  prevBtn.addEventListener(
    "click",
    () => {

      if(
        currentIndex <= 0
      ){

        return;

      }

      openVideo(
        videos[
          currentIndex - 1
        ]
      );

    }
  );


  nextBtn.addEventListener(
    "click",
    () => {

      if(
        currentIndex < 0 ||
        currentIndex >=
        videos.length - 1
      ){

        return;

      }

      openVideo(
        videos[
          currentIndex + 1
        ]
      );

    }
  );


  /* =========================
     FULLSCREEN
  ========================= */

  fullscreenBtn.addEventListener(
    "click",
    () => {

      if(!player){
        return;
      }

      if(
        document.fullscreenElement
      ){

        document.exitFullscreen();

      }else if(
        player.requestFullscreen
      ){

        player.requestFullscreen();

      }

    }
  );


  /* =========================
     RETRY
  ========================= */

  retryBtn.addEventListener(
    "click",
    () => {

      location.reload();

    }
  );


  /* =========================
     HELPERS
  ========================= */

  function formatNumber(value){

    const number =
      Number(value || 0);

    return number.toLocaleString();

  }


  function formatDate(value){

    if(!value){
      return "—";
    }

    try{

      if(
        typeof value.toDate ===
        "function"
      ){

        return value
          .toDate()
          .toLocaleString();

      }

      const date =
        new Date(value);

      if(
        !Number.isNaN(
          date.getTime()
        )
      ){

        return date.toLocaleString();

      }

    }catch(e){}

    return String(value);

  }


  function escapeHTML(value){

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function escapeAttribute(value){

    return escapeHTML(value);

  }


  /* =========================
     START
  ========================= */

  start();


</script>

</body>
</html>
