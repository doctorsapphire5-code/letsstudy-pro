<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Watch Video | Let'sStudy Pro</title>

<meta name="description"
      content="Watch videos on Let'sStudy Pro. Learn, discover and share educational content.">

<link rel="icon" href="/favicon.ico">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f5f5f5;
    --card:#fff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --primary:#111827;
    --danger:#dc2626;
}

body{
    font-family:
        Inter,system-ui,-apple-system,
        BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
}

.logo-mark{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
}

.header-search{
    width:min(500px,45%);
}

.header-search input{
    width:100%;
    height:40px;
    border:1px solid var(--border);
    border-radius:22px;
    padding:0 17px;
    outline:none;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:38px;
    height:38px;
    border:1px solid var(--border);
    background:#fff;
    border-radius:50%;
}

.layout{
    max-width:1450px;
    margin:auto;
    padding:24px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 360px;
    gap:24px;
}

.video-player{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:12px;
    overflow:hidden;
}

.video-player video,
.video-player iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

.video-title{
    font-size:22px;
    line-height:1.35;
    margin-top:17px;
}

.video-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-top:12px;
    flex-wrap:wrap;
}

.stats{
    color:var(--muted);
    font-size:14px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.action{
    border:1px solid var(--border);
    background:#fff;
    border-radius:20px;
    padding:9px 15px;
    font-weight:600;
}

.action:hover{
    background:#f3f4f6;
}

.channel{
    margin-top:18px;
    padding:17px 0;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.channel-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.channel-avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    background:#eee;
}

.channel-name{
    font-weight:800;
}

.channel-subs{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.subscribe{
    border:0;
    background:#111827;
    color:#fff;
    padding:10px 17px;
    border-radius:22px;
    font-weight:700;
}

.subscribe.subscribed{
    background:#e5e7eb;
    color:#111827;
}

.description{
    margin-top:18px;
    background:#fff;
    border-radius:12px;
    padding:17px;
    white-space:pre-wrap;
    line-height:1.6;
}

.comments{
    margin-top:24px;
    background:#fff;
    border-radius:12px;
    padding:18px;
}

.comments h2{
    font-size:18px;
    margin-bottom:17px;
}

.comment-form{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.comment-form input{
    flex:1;
    height:42px;
    border:1px solid var(--border);
    border-radius:21px;
    padding:0 15px;
    outline:none;
}

.comment-form button{
    border:0;
    background:#111827;
    color:#fff;
    border-radius:21px;
    padding:0 17px;
}

.comment{
    display:flex;
    gap:11px;
    padding:14px 0;
    border-bottom:1px solid #f0f0f0;
}

.comment-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
}

.comment-user{
    font-weight:700;
    font-size:14px;
}

.comment-text{
    margin-top:4px;
    color:#374151;
    line-height:1.5;
}

.sidebar-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:15px;
}

.related{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.related-card{
    display:grid;
    grid-template-columns:145px 1fr;
    gap:10px;
    cursor:pointer;
}

.related-thumb{
    width:145px;
    height:82px;
    border-radius:8px;
    object-fit:cover;
    background:#ddd;
}

.related-title{
    font-size:14px;
    font-weight:700;
    line-height:1.35;
}

.related-meta{
    color:var(--muted);
    font-size:11px;
    margin-top:6px;
}

.loading,
.empty{
    padding:45px 20px;
    text-align:center;
    color:var(--muted);
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #ddd;
    border-top-color:#111827;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto auto 10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translate(-50%,100px);
    background:#111827;
    color:#fff;
    padding:11px 17px;
    border-radius:9px;
    opacity:0;
    transition:.25s;
    z-index:500;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

@media(max-width:950px){

    .layout{
        grid-template-columns:1fr;
    }

    .header-search{
        width:40%;
    }

}

@media(max-width:600px){

    .header{
        padding:0 12px;
    }

    .brand-text{
        display:none;
    }

    .header-search{
        width:45%;
    }

    .layout{
        padding:12px;
    }

    .video-title{
        font-size:18px;
    }

    .related-card{
        grid-template-columns:125px 1fr;
    }

    .related-thumb{
        width:125px;
        height:72px;
    }

}
</style>
</head>

<body>

<header class="header">

    <a href="/" class="logo"
       style="text-decoration:none;color:inherit">

        <div class="logo-mark">LS</div>

        <div class="brand-text">
            Let'sStudy Pro
        </div>

    </a>

    <div class="header-search">

        <input
            id="searchInput"
            type="search"
            placeholder="Search videos..."
            onkeydown="handleSearch(event)">

    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            onclick="location.href='/notifications.html'">
            🔔
        </button>

        <button
            class="icon-btn"
            onclick="location.href='/profile.html'">
            👤
        </button>

    </div>

</header>


<main class="layout">

<section>

    <!-- VIDEO -->

    <div
        class="video-player"
        id="videoPlayer">

        <div class="loading">
            <div class="spinner"></div>
            Loading video...
        </div>

    </div>


    <!-- TITLE -->

    <h1
        class="video-title"
        id="videoTitle">
        Loading...
    </h1>


    <div class="video-meta">

        <div
            class="stats"
            id="videoStats">
            —
        </div>

        <div class="actions">

            <button
                class="action"
                id="likeBtn"
                onclick="toggleLike()">
                👍 <span id="likeCount">0</span>
            </button>

            <button
                class="action"
                onclick="shareVideo()">
                ↗ Share
            </button>

            <button
                class="action"
                onclick="saveVideo()">
                🔖 Save
            </button>

        </div>

    </div>


    <!-- CHANNEL -->

    <div class="channel">

        <div class="channel-info">

            <img
                id="channelAvatar"
                class="channel-avatar"
                src="/favicon.ico"
                alt="Channel">

            <div>

                <div
                    class="channel-name"
                    id="channelName">
                    Let'sStudy Pro
                </div>

                <div
                    class="channel-subs"
                    id="channelSubs">
                    0 subscribers
                </div>

            </div>

        </div>

        <button
            class="subscribe"
            id="subscribeBtn"
            onclick="toggleSubscribe()">
            Subscribe
        </button>

    </div>


    <!-- DESCRIPTION -->

    <div
        class="description"
        id="videoDescription">
        Loading description...
    </div>


    <!-- COMMENTS -->

    <section class="comments">

        <h2>
            Comments
            (<span id="commentsCount">0</span>)
        </h2>

        <form
            class="comment-form"
            onsubmit="submitComment(event)">

            <input
                id="commentInput"
                placeholder="Add a comment..."
                maxlength="1000"
                required>

            <button type="submit">
                Comment
            </button>

        </form>

        <div id="commentsList">

            <div class="loading">
                Loading comments...
            </div>

        </div>

    </section>

</section>


<!-- RELATED -->

<aside>

    <div class="sidebar-title">
        Related videos
    </div>

    <div
        class="related"
        id="relatedVideos">

        <div class="loading">
            <div class="spinner"></div>
            Loading...
        </div>

    </div>

</aside>

</main>


<div
    class="toast"
    id="toast">
</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    query,
    where,
    orderBy,
    limit,
    increment,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {
    apiKey: "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
    authDomain: "let-s-study-pro-course.firebaseapp.com",
    databaseURL:
        "https://let-s-study-pro-course-default-rtdb.firebaseio.com",
    projectId: "let-s-study-pro-course",
    storageBucket:
        "let-s-study-pro-course.firebasestorage.app",
    messagingSenderId: "474928293390",
    appId:
        "1:474928293390:web:2bcc2aebf2351c12a9fe5f",
    measurementId: "G-85B7V5H5J0"
};

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const auth =
    getAuth(app);


/* ==============================
   STATE
============================== */

let currentUser = null;
let video = null;
let videoId = null;
let channel = null;
let liked = false;
let subscribed = false;


/* ==============================
   GET VIDEO ID
============================== */

const params =
    new URLSearchParams(
        location.search
    );

videoId =
    params.get("id");


/* ==============================
   AUTH
============================== */

onAuthStateChanged(
    auth,
    async user => {

        currentUser = user;

        if(videoId){

            await loadVideo();
            await loadComments();
            await checkLike();
            await checkSubscription();

        }

    }
);


/* ==============================
   LOAD VIDEO
============================== */

async function loadVideo(){

    if(!videoId){

        showError(
            "Video ID is missing."
        );

        return;

    }

    try{

        const ref =
            doc(
                db,
                "videos",
                videoId
            );

        const snap =
            await getDoc(ref);

        if(!snap.exists()){

            showError(
                "Video not found."
            );

            return;

        }

        video = {
            id:snap.id,
            ...snap.data()
        };

        renderVideo();

        await updateViews();

        await loadChannel();

        await loadRelated();

    }catch(error){

        console.error(
            "Video loading error:",
            error
        );

        showError(
            "Unable to load video."
        );

    }

}


/* ==============================
   RENDER VIDEO
============================== */

function renderVideo(){

    document.title =
        `${video.title || "Watch Video"} | Let'sStudy Pro`;

    document.getElementById(
        "videoTitle"
    ).textContent =
        video.title ||
        "Untitled Video";

    document.getElementById(
        "videoDescription"
    ).textContent =
        video.description ||
        "No description available.";

    document.getElementById(
        "likeCount"
    ).textContent =
        formatNumber(
            video.likes || 0
        );

    document.getElementById(
        "commentsCount"
    ).textContent =
        formatNumber(
            video.commentsCount || 0
        );

    document.getElementById(
        "videoStats"
    ).textContent =
        `${formatNumber(video.views || 0)} views • ${formatDate(video.publishedAt || video.createdAt)}`;

    const player =
        document.getElementById(
            "videoPlayer"
        );

    const url =
        video.videoUrl || "";

    const type =
        video.videoType || "video";

    if(type === "youtube"){

        player.innerHTML = `
            <iframe
                src="${youtubeEmbed(url)}"
                title="${escapeHTML(video.title || "Video")}"
                allowfullscreen
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
            </iframe>
        `;

    }else if(type === "embed"){

        player.innerHTML = `
            <iframe
                src="${escapeAttr(url)}"
                title="${escapeHTML(video.title || "Video")}"
                allowfullscreen>
            </iframe>
        `;

    }else{

        player.innerHTML = `
            <video
                controls
                playsinline
                poster="${escapeAttr(video.thumbnail || "")}">
                <source
                    src="${escapeAttr(url)}"
                    type="video/mp4">
                Your browser does not support video playback.
            </video>
        `;

    }

}


/* ==============================
   CHANNEL
============================== */

async function loadChannel(){

    if(!video.channelId){

        document.getElementById(
            "channelName"
        ).textContent =
            video.creatorName ||
            "Let'sStudy Pro";

        return;

    }

    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "channels",
                    video.channelId
                )
            );

        if(!snap.exists())
            return;

        channel = {
            id:snap.id,
            ...snap.data()
        };

        document.getElementById(
            "channelName"
        ).textContent =
            channel.name ||
            "Unnamed Channel";

        document.getElementById(
            "channelSubs"
        ).textContent =
            `${formatNumber(channel.subscribers || 0)} subscribers`;

        document.getElementById(
            "channelAvatar"
        ).src =
            channel.avatar ||
            "/favicon.ico";

    }catch(error){

        console.warn(
            "Channel unavailable:",
            error
        );

    }

}


/* ==============================
   VIEWS
============================== */

async function updateViews(){

    try{

        await updateDoc(
            doc(
                db,
                "videos",
                videoId
            ),
            {
                views:increment(1)
            }
        );

        video.views =
            Number(video.views || 0) + 1;

        document.getElementById(
            "videoStats"
        ).textContent =
            `${formatNumber(video.views)} views • ${formatDate(video.publishedAt || video.createdAt)}`;

    }catch(error){

        console.warn(
            "View update failed:",
            error
        );

    }

}


/* ==============================
   LIKE
============================== */

async function checkLike(){

    if(!currentUser)
        return;

    try{

        const q =
            query(
                collection(
                    db,
                    "videoLikes"
                ),
                where(
                    "videoId",
                    "==",
                    videoId
                ),
                where(
                    "userId",
                    "==",
                    currentUser.uid
                ),
                limit(1)
            );

        const snap =
            await getDocs(q);

        liked =
            !snap.empty;

        updateLikeButton();

    }catch(error){

        console.warn(
            "Like check failed:",
            error
        );

    }

}


function updateLikeButton(){

    const button =
        document.getElementById(
            "likeBtn"
        );

    if(liked){

        button.innerHTML =
            `👍 <span id="likeCount">${formatNumber(video.likes || 0)}</span>`;

        button.style.background =
            "#111827";

        button.style.color =
            "#fff";

    }else{

        button.innerHTML =
            `👍 <span id="likeCount">${formatNumber(video.likes || 0)}</span>`;

        button.style.background =
            "#fff";

        button.style.color =
            "#111827";

    }

}


window.toggleLike = async function(){

    if(!currentUser){

        showToast(
            "Please sign in to like this video."
        );

        return;

    }

    try{

        const q =
            query(
                collection(
                    db,
                    "videoLikes"
                ),
                where(
                    "videoId",
                    "==",
                    videoId
                ),
                where(
                    "userId",
                    "==",
                    currentUser.uid
                ),
                limit(1)
            );

        const snap =
            await getDocs(q);

        if(snap.empty){

            await addDoc(
                collection(
                    db,
                    "videoLikes"
                ),
                {
                    videoId,
                    userId:
                        currentUser.uid,
                    createdAt:
                        serverTimestamp()
                }
            );

            await updateDoc(
                doc(
                    db,
                    "videos",
                    videoId
                ),
                {
                    likes:
                        increment(1)
                }
            );

            video.likes =
                Number(video.likes || 0) + 1;

            liked = true;

        }else{

            for(const item of snap.docs){

                await deleteDoc(
                    item.ref
                );

            }

            await updateDoc(
                doc(
                    db,
                    "videos",
                    videoId
                ),
                {
                    likes:
                        increment(-1)
                }
            );

                    Math.max(

                    );

                await updateDoc(
                    doc(db, "videos", videoId),
                    {
                        likes: video.likes,
                        updatedAt: serverTimestamp()
                    }
                );

                liked = delta > 0;

                updateLikeUI();

            } catch (error) {

                console.error(
                    "Like update failed:",
                    error
                );

                showToast(
                    "Failed to update like"
                );

            } finally {

                likeBusy = false;

            }

        }


        /* ==============================
           LIKE UI
        ============================== */

        function updateLikeUI(){

            const button =
                document.getElementById("likeBtn");

            const count =
                document.getElementById("likeCount");

            if(!button || !count) return;

            count.textContent =
                formatNumber(
                    Number(video.likes || 0)
                );

            button.classList.toggle(
                "active",
                liked
            );

            button.innerHTML =
                liked
                    ? "👍 Liked"
                    : "👍 Like";
        }


        /* ==============================
           SHARE VIDEO
        ============================== */

        async function shareVideo(){

            if(!video) return;

            const url =
                window.location.href;

            const shareData = {
                title:
                    video.title ||
                    "Let'sStudy Pro Video",

                text:
                    video.description ||
                    video.title ||
                    "Watch this video on Let'sStudy Pro",

                url
            };

            try{

                if(
                    navigator.share
                ){

                    await navigator.share(
                        shareData
                    );

                }else{

                    await copyText(url);

                    showToast(
                        "Video link copied"
                    );

                }

                await updateDoc(
                    doc(db, "videos", videoId),
                    {
                        shares:
                            increment(1),
                        updatedAt:
                            serverTimestamp()
                    }
                );

                video.shares =
                    Number(video.shares || 0) + 1;

                updateVideoStats();

            }catch(error){

                if(
                    error?.name !==
                    "AbortError"
                ){

                    console.error(
                        "Share failed:",
                        error
                    );

                }

            }

        }


        /* ==============================
           COMMENTS
        ============================== */

        async function loadComments(){

            const list =
                document.getElementById(
                    "commentsList"
                );

            if(!list) return;

            list.innerHTML =
                `<div class="loading">
                    Loading comments...
                </div>`;

            try{

                const q =
                    query(
                        collection(
                            db,
                            "comments"
                        ),
                        where(
                            "videoId",
                            "==",
                            videoId
                        ),
                        orderBy(
                            "createdAt",
                            "desc"
                        ),
                        limit(50)
                    );

                const snapshot =
                    await getDocs(q);

                comments = [];

                snapshot.forEach(
                    item => {

                        comments.push({
                            id: item.id,
                            ...item.data()
                        });

                    }
                );

                renderComments();

            }catch(error){

                console.error(
                    "Comments loading failed:",
                    error
                );

                list.innerHTML =
                    `<div class="empty">
                        Unable to load comments.
                    </div>`;

            }

        }


        function renderComments(){

            const list =
                document.getElementById(
                    "commentsList"
                );

            const count =
                document.getElementById(
                    "commentCount"
                );

            if(count){

                count.textContent =
                    formatNumber(
                        comments.length
                    );

            }

            if(!list) return;

            if(!comments.length){

                list.innerHTML =
                    `<div class="empty">
                        No comments yet.
                        Be the first to comment.
                    </div>`;

                return;

            }

            list.innerHTML =
                comments.map(
                    comment => {

                        const name =
                            escapeHTML(
                                comment.userName ||
                                comment.displayName ||
                                "User"
                            );

                        const text =
                            escapeHTML(
                                comment.text ||
                                comment.message ||
                                ""
                            );

                        const avatar =
                            escapeHTML(
                                comment.userImage ||
                                comment.avatar ||
                                `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}`
                            );

                        return `
                        <article class="comment">

                            <img
                                src="${avatar}"
                                alt="${name}"
                                class="comment-avatar"
                                onerror="this.src='/favicon.ico'"
                            >

                            <div class="comment-content">

                                <div class="comment-head">

                                    <strong>
                                        ${name}
                                    </strong>

                                    <span>

            /* ==============================
               RENDER VIDEO
            ============================== */

            function renderVideo(){

                const player =
                    document.getElementById(
                        "videoPlayer"
                    );

                if(!player){
                    return;
                }

                const videoUrl =
                    video.videoUrl || "";

                if(!videoUrl){

                    player.innerHTML =
                        `<div class="player-empty">
                            Video source unavailable.
                        </div>`;

                    return;

                }

                const videoType =
                    String(
                        video.videoType || ""
                    ).toLowerCase();

                if(
                    videoType === "youtube" ||
                    videoUrl.includes(
                        "youtube.com"
                    ) ||
                    videoUrl.includes(
                        "youtu.be"
                    )
                ){

                    const youtubeId =
                        getYouTubeId(
                            videoUrl
                        );

                    if(youtubeId){

                        player.innerHTML = `
                            <iframe
                                src="https://www.youtube.com/embed/${youtubeId}"
                                title="${escapeAttr(
                                    video.title ||
                                    "Let'sStudy Pro Video"
                                )}"
                                allow="
                                    accelerometer;
                                    autoplay;
                                    clipboard-write;
                                    encrypted-media;
                                    gyroscope;
                                    picture-in-picture;
                                    web-share
                                "
                                allowfullscreen>
                            </iframe>
                        `;

                        return;

                    }

                }

                player.innerHTML = `
                    <video
                        controls
                        playsinline
                        preload="metadata"
                        poster="${escapeAttr(
                            video.thumbnail || ""
                        )}">

                        <source
                            src="${escapeAttr(
                                videoUrl
                            )}"
                            type="${escapeAttr(
                                video.mimeType ||
                                "video/mp4"
                            )}">

                        Your browser does not support
                        HTML5 video.

                    </video>
                `;

            }

            /* ==============================

            ============================== */

            async function registerView(){

                if(!videoId){
                    return;
                }

                const key =
                    `video_view_${videoId}`;

                if(
                    sessionStorage.getItem(key)
                ){
                    return;
                }

                sessionStorage.setItem(
                    key,
                    "1"
                );

                try{

                    const videoRef =
                        doc(
                            db,
                            "videos",
                            videoId
                        );

                    const views =
                        Number(
                            video.views || 0
                        ) + 1;

                    await updateDoc(
                        videoRef,
                        {
                            views
                        }
                    );

                    video.views =
                        views;

                    updateVideoStats();

                }catch(error){

                    console.error(
                        "View registration failed:",
                        error
                    );

                }

            }


            /* ==============================
               HELPERS
            ============================== */

            function formatViews(value){

                const number =
                    Number(value || 0);

                if(
                    number >= 1000000
                ){

                    return (
                        number / 1000000
                    ).toFixed(1) + "M";

                }

                if(
                    number >= 1000
                ){

                    return (
                        number / 1000
                    ).toFixed(1) + "K";

                }

                return String(number);

            }


            function getYouTubeId(url){

                try{

                    const parsed =
                        new URL(url);

                    if(
                        parsed.hostname.includes(
                            "youtu.be"
                        )
                    ){

                        return parsed.pathname
                            .replace("/","")
                            .split("/")[0];

                    }

                    if(
                        parsed.hostname.includes(
                            "youtube.com"
                        )
                    ){

                        if(
                            parsed.pathname ===
                            "/watch"
                        ){

                            return parsed
                                .searchParams
                                .get("v");

                        }

                        if(
                            parsed.pathname
                                .startsWith("/embed/")
                        ){

                            return parsed
                                .pathname
                                .split("/")[2];

                        }

                        if(
                            parsed.pathname
                                                                .startsWith(
                                    "/shorts/"
                                )
                        ){

                            return parsed
                                .pathname
                                .split("/")[2];

                        }

                    }

                }catch(error){

                    console.error(
                        "Failed to parse YouTube URL:",
                        error
                    );

                }

                return null;

            }


            /* ==============================
               ESCAPE HTML
            ============================== */

            function escapeHTML(value){

                return String(
                    value ?? ""
                )
                .replace(/&/g,"&amp;")
                .replace(/</g,"&lt;")
                .replace(/>/g,"&gt;")
                .replace(/"/g,"&quot;")
                .replace(/'/g,"&#039;");

            }


            function escapeAttr(value){

                return escapeHTML(value);

            }

                let toast =
                    document.getElementById(

                    toast =
                        document.createElement(
                            "div"
                        );

                    toast.id = "toast";

                    toast.style.cssText = `
                        position:fixed;
                        left:50%;
                        bottom:25px;
                        transform:translateX(-50%)
                                   translateY(20px);
                        background:#111827;
                        color:#fff;
                        padding:11px 17px;
                        border-radius:10px;
                        font-size:13px;
                        z-index:9999;
                        opacity:0;
                        transition:.25s;
                    `;

                    document.body.appendChild(
                        toast
                    );

                }

                toast.textContent =
                    message;

                toast.style.opacity = "1";

                toast.style.transform =
                    "translateX(-50%) translateY(0)";

                clearTimeout(
                    window.__toastTimer
                );

                window.__toastTimer =
                    setTimeout(() => {

                        toast.style.opacity =
                            "0";

                        toast.style.transform =
                            "translateX(-50%) translateY(20px)";

                    },2500);

            }

                try{

                    const likeId =
                        `${currentUser.uid}_${videoId}`;

                        doc(

                        await getDoc(

                        window.location.href
                    );

                    showToast(
                        "Video link copied"
                    );

                }catch(error){

                    const area =
                        document.createElement(
                            "textarea"
                        );

                    area.value =
                        window.location.href;

                    document.body.appendChild(
                        area
                    );

                    area.select();

                    document.execCommand(
                        "copy"
                    );

                    area.remove();

                    showToast(
                        "Video link copied"
                    );

                }

            /* ==============================
               LOAD RELATED VIDEOS
            ============================== */

            async function loadRelatedVideos(){

                const container =
                    document.getElementById(
                        "relatedVideos"
                    );

                if(!container){
                    return;
                }

                try{

                    const videosRef =
                        collection(
                            db,
                            "videos"
                        );

                    const snap =
                        await getDocs(
                            videosRef
                        );

                    const related = [];

                    snap.forEach(
                        item => {

                            if(
                                item.id === videoId
                            ){
                                return;
                            }

                            const data =
                                item.data();

                            if(
                                data.status &&
                                data.status !==
                                    "published"
                            ){
                                return;
                            }

                            const sameCategory =
                                data.category ===
                                video.category;

                            const sameCreator =
                                data.creatorId ===
                                video.creatorId;

                            if(
                                sameCategory ||
                                sameCreator
                            ){

                                related.push({
                                    id:item.id,
                                    ...data
                                });

                            }

                        }
                    );

                    related.sort(
                        () =>
                            Math.random() - .5
                    );

                    const items =
                        related.slice(
                            0,
                            8
                        );

                    if(!items.length){

                        container.innerHTML = `
                            <div class="empty-related">
                                No related videos found.
                            </div>

                        return;

                    }

                    container.innerHTML =
                        items.map(
                            item => `

                            <a
                                class="related-video"
                                href="/watch.html?v=${encodeURIComponent(
                                    item.id
                                )}">

                                <div class="related-thumb">

                                    <img
                                        src="${escapeAttr(

                                            "/favicon.ico"
                                        )}"
                                        alt="${escapeAttr(
                                            item.title ||
                                            "Video"
                                        )}"

                                            ? `

                                                        item.duration

                                              `
                                            : ""
                                    }

                                            item.title ||
                                            "Untitled Video"
                                        )}

                                    <small>
                                        ${formatViews(
                                            item.views || 0
                                        )} views
                                    </small>

                                </div>

                            </a>

                        `
                        ).join("");

                }catch(error){

                    console.error(
                        "Related videos failed:",
                        error
                    );

                }

            }
