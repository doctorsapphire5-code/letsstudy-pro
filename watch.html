<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Watch Video | Let'sStudy Pro</title>

<meta
  name="description"
  id="metaDescription"
  content="Watch educational videos on Let'sStudy Pro."
>

<link rel="icon" href="/favicon.ico">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font:inherit;
  cursor:pointer;
}


/* ===============================
   HEADER
================================ */

.header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#2563eb;
}

.back-btn{
  border:0;
  background:#f1f5f9;
  padding:10px 15px;
  border-radius:8px;
  color:#334155;
  font-weight:700;
}


/* ===============================
   CONTAINER
================================ */

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 60px;
}


/* ===============================
   VIDEO PLAYER
================================ */

.video-wrapper{
  width:100%;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

.video-player{
  width:100%;
  height:auto;
  max-height:680px;
  display:block;
  background:#000;
}

.thumbnail{
  width:100%;
  max-height:680px;
  object-fit:cover;
  display:none;
}


/* ===============================
   VIDEO INFO
================================ */

.video-info{
  background:#fff;
  margin-top:18px;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:22px;
}

.video-title{
  font-size:28px;
  line-height:1.35;
  font-weight:800;
  margin-bottom:12px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:9px;
  color:#64748b;
  font-size:13px;
  margin-bottom:18px;
}

.description{
  color:#374151;
  font-size:15px;
  line-height:1.8;
  white-space:pre-line;
}


/* ===============================
   ACCESS BADGE
================================ */

.access{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:6px;
  font-size:11px;
  font-weight:800;
}

.access-free{
  background:#dcfce7;
  color:#166534;
}

.access-plan{
  background:#fef3c7;
  color:#92400e;
}


/* ===============================
   PRICE
================================ */

.price{
  margin:15px 0;
  font-size:18px;
  font-weight:800;
  color:#d97706;
}


/* ===============================
   CHANNEL
================================ */

.channel{
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid #e5e7eb;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.channel-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.channel-image{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:#e2e8f0;
}

.channel-name{
  font-size:15px;
  font-weight:800;
}

.channel-handle{
  margin-top:4px;
  color:#64748b;
  font-size:12px;
}


/* ===============================
   CREATOR
================================ */

.creator{
  margin-top:18px;
  color:#64748b;
  font-size:13px;
}


/* ===============================
   TAGS
================================ */

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:18px;
}

.tag{
  background:#f1f5f9;
  color:#475569;
  padding:6px 9px;
  border-radius:6px;
  font-size:11px;
}


/* ===============================
   LOADING
================================ */

.loading{
  text-align:center;
  padding:90px 20px;
  color:#64748b;
}

.spinner{
  width:42px;
  height:42px;

  border:4px solid #e2e8f0;
  border-top-color:#2563eb;

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin:0 auto 15px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* ===============================
   ERROR
================================ */

.error{
  max-width:650px;
  margin:70px auto;
  background:#fff;

  border:1px solid #fecaca;
  border-radius:14px;

  padding:35px 25px;

  text-align:center;

  color:#b91c1c;

  display:none;
}

.error h2{
  margin-bottom:10px;
}

.error p{
  color:#64748b;
  line-height:1.6;
}

.retry{
  margin-top:20px;

  border:0;

  background:#2563eb;
  color:#fff;

  padding:11px 20px;

  border-radius:8px;

  font-weight:700;
}


/* ===============================
   WATCH CONTENT
================================ */

#watchContent{
  display:none;
}


/* ===============================
   MOBILE
================================ */

@media(max-width:700px){

  .header{
    padding:0 12px;
  }

  .logo{
    font-size:17px;
  }

  .container{
    padding:15px 10px 40px;
  }

  .video-title{
    font-size:21px;
  }

  .video-info{
    padding:16px;
  }

  .channel{
    align-items:flex-start;
  }

}

</style>

</head>


<body>


<!-- =================================
     HEADER
================================= -->

<header class="header">

  <button
    class="back-btn"
    id="backBtn"
    type="button">

    ← Back

  </button>


  <div class="logo">

    Let'sStudy
    <span>Pro</span>

  </div>


  <div></div>

</header>



<!-- =================================
     LOADING
================================= -->

<section
  id="loading"
  class="loading">

  <div class="spinner"></div>

  <h3>
    Loading video...
  </h3>

  <p style="margin-top:7px;">
    Please wait.
  </p>

</section>



<!-- =================================
     ERROR
================================= -->

<section
  id="error"
  class="error">

  <h2>
    Unable to load video
  </h2>

  <p id="errorMessage">
    Video could not be loaded.
  </p>

  <button
    id="retryBtn"
    class="retry"
    type="button">

    Try Again

  </button>

</section>



<!-- =================================
     MAIN
================================= -->

<main
  id="watchContent"
  class="container">


  <!-- ===============================
       VIDEO
  ================================ -->

  <div class="video-wrapper">

    <video
      id="videoPlayer"
      class="video-player"
      controls
      playsinline
      preload="metadata">
    </video>


    <img
      id="videoThumbnail"
      class="thumbnail"
      alt="Video thumbnail">

  </div>



  <!-- ===============================
       INFORMATION
  ================================ -->

  <article class="video-info">


    <h1
      id="videoTitle"
      class="video-title">
    </h1>



    <div class="meta">

      <span id="category"></span>

      <span>•</span>

      <span id="duration"></span>

      <span>•</span>

      <span id="views"></span>

      <span>•</span>

      <span id="publishedAt"></span>

      <span id="accessBadge"></span>

    </div>



    <div
      id="price"
      class="price"
      style="display:none;">
    </div>



    <div
      id="description"
      class="description">
    </div>



    <!-- =============================
         CHANNEL
    ============================== -->

    <div class="channel">

      <div class="channel-left">

        <img
          id="channelImage"
          class="channel-image"
          alt="Channel">

        <div>

          <div
            id="channelName"
            class="channel-name">
          </div>

          <div
            id="channelHandle"
            class="channel-handle">
          </div>

        </div>

      </div>

    </div>



    <!-- =============================
         CREATOR
    ============================== -->

    <div
      id="creator"
      class="creator">
    </div>



    <!-- =============================
         TAGS
    ============================== -->

    <div
      id="tags"
      class="tags">
    </div>


  </article>


</main>



<!-- =================================
     FIREBASE
================================= -->

<script type="module">

/* ===================================
   FIREBASE IMPORTS
=================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";



/* ===================================
   FIREBASE CONFIG
=================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfXKbzO1kjsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};



/* ===================================
   INITIALIZE FIREBASE
=================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);



/* ===================================
   DOM
=================================== */

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const errorMessage =
  document.getElementById("errorMessage");

const retryBtn =
  document.getElementById("retryBtn");

const watchContent =
  document.getElementById("watchContent");

const videoPlayer =
  document.getElementById("videoPlayer");

const videoThumbnail =
  document.getElementById("videoThumbnail");



/* ===================================
   GET FIRESTORE DOCUMENT ID
=================================== */

function getVideoId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("id") ||
    params.get("videoId") ||
    null
  );

}



/* ===================================
   VIDEO ERROR HANDLER
=================================== */

videoPlayer.addEventListener(
  "error",
  () => {

    const mediaError =
      videoPlayer.error;

    console.error(
      "Video playback error:",
      mediaError
    );

    console.error(
      "Video URL:",
      videoPlayer.currentSrc ||
      videoPlayer.src
    );

  }
);



/* ===================================
   VIDEO CAN PLAY
=================================== */

videoPlayer.addEventListener(
  "canplay",
  () => {

    console.log(
      "✅ Video can play:",
      videoPlayer.currentSrc
    );

  }
);



/* ===================================
   LOAD VIDEO
=================================== */

async function loadVideo(){

  loading.style.display =
    "block";

  errorBox.style.display =
    "none";

  watchContent.style.display =
    "none";


  try{

    /* ===============================
       GET DOCUMENT ID
    ================================ */

    const videoId =
      getVideoId();


    console.log(
      "Firestore Video ID:",
      videoId
    );


    if(!videoId){

      throw new Error(
        "Video ID is missing."
      );

    }



    /* ===============================
       DIRECT FIRESTORE DOCUMENT
       
       videos/{videoId}
    ================================ */

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const snapshot =
      await getDoc(
        videoRef
      );



    /* ===============================
       CHECK DOCUMENT
    ================================ */

    if(
      !snapshot.exists()
    ){

      throw new Error(
        "Video not found in Firestore."
      );

    }



    /* ===============================
       GET DATA
    ================================ */

    const video =
      snapshot.data();


    console.log(
      "Video document:",
      video
    );



    /* ===============================
       DISPLAY
    ================================ */

    displayVideo(
      video,
      snapshot.id
    );


  }
  catch(err){

    console.error(
      "Watch page error:",
      err
    );

    showError(
      err.message
    );

  }

}



/* ===================================
   DISPLAY VIDEO
=================================== */

function displayVideo(
  video,
  videoId
){

  loading.style.display =
    "none";

  watchContent.style.display =
    "block";



  /* ===============================
     TITLE
  ================================ */

  const title =
    video.title ||
    "Untitled Video";


  document.getElementById(
    "videoTitle"
  ).textContent =
    title;


  document.title =
    `${title} | Let'sStudy Pro`;



  /* ===============================
     DESCRIPTION
  ================================ */

  document.getElementById(
    "description"
  ).textContent =
    video.description ||
    "";


  document.getElementById(
    "metaDescription"
  ).setAttribute(
    "content",
    video.description ||
    title
  );



  /* ===============================
     CATEGORY
  ================================ */

  document.getElementById(
    "category"
  ).textContent =
    video.category ||
    "Education";



  /* ===============================
     DURATION
  ================================ */

  document.getElementById(
    "duration"
  ).textContent =
    video.duration ||
    "—";



  /* ===============================
     VIEWS
  ================================ */

  const views =
    Number(
      video.views || 0
    );


  document.getElementById(
    "views"
  ).textContent =
    `${views.toLocaleString()} views`;



  /* ===============================
     ACCESS
  ================================ */

  const accessBadge =
    document.getElementById(
      "accessBadge"
    );


  if(
    video.isFree === true
  ){

    accessBadge.textContent =
      "FREE";

    accessBadge.className =
      "access access-free";

    document.getElementById(
      "price"
    ).style.display =
      "none";

  }
  else{

    accessBadge.textContent =
      "PLAN";

    accessBadge.className =
      "access access-plan";


    const price =
      Number(
        video.price || 0
      );


    const currency =
      video.currency ||
      "TZS";


    const priceElement =
      document.getElementById(
        "price"
      );


    priceElement.style.display =
      "block";


    priceElement.textContent =
      price > 0
        ? `${currency} ${price.toLocaleString()}`
        : "Plan required";

  }



  /* ===============================
     THUMBNAIL
  ================================ */

  if(
    video.thumbnail
  ){

    videoThumbnail.src =
      video.thumbnail;

  }



  /* ===============================
     VIDEO URL
  ================================ */

  if(
    typeof video.videoUrl ===
    "string" &&
    video.videoUrl.trim() !== ""
  ){

    const videoUrl =
      video.videoUrl.trim();


    console.log(
      "🎬 Video URL:",
      videoUrl
    );


    videoThumbnail.style.display =
      "none";


    videoPlayer.style.display =
      "block";


    videoPlayer.removeAttribute(
      "src"
    );


    videoPlayer.src =
      videoUrl;


    videoPlayer.load();

  }
  else{

    videoPlayer.style.display =
      "none";


    if(
      video.thumbnail
    ){

      videoThumbnail.src =
        video.thumbnail;

      videoThumbnail.style.display =
        "block";

    }

  }



  /* ===============================
     CHANNEL
  ================================ */

  document.getElementById(
    "channelName"
  ).textContent =
    video.channelName ||
    "Let'sStudy Pro";


  document.getElementById(
    "channelHandle"
  ).textContent =
    video.channelHandle
      ? `@${String(
          video.channelHandle
        ).replace(
          /^@/,
          ""
        )}`
      : "";



  /* ===============================
     CHANNEL IMAGE
  ================================ */

  const channelImage =
    document.getElementById(
      "channelImage"
    );


  if(
    video.channelImage
  ){

    channelImage.src =
      video.channelImage;

    channelImage.style.display =
      "block";

  }
  else if(
    video.creatorImage
  ){

    channelImage.src =
      video.creatorImage;

    channelImage.style.display =
      "block";

  }
  else{

    channelImage.style.display =
      "none";

  }



  /* ===============================
     CREATOR
  ================================ */

  const creator =
    document.getElementById(
      "creator"
    );


  creator.textContent =
    video.creatorName
      ? `Created by ${video.creatorName}`
      : "";



  /* ===============================
     TAGS
  ================================ */

  const tagsContainer =
    document.getElementById(
      "tags"
    );


  let tags = [];


  if(
    Array.isArray(
      video.tags
    )
  ){

    tags =
      video.tags;

  }
  else if(
    typeof video.tags ===
    "string"
  ){

    tags =
      video.tags
        .split(",")
        .map(
          tag =>
            tag.trim()
        )
        .filter(Boolean);

  }


  tagsContainer.innerHTML =
    tags
      .map(
        tag => `

          <span class="tag">

            #${escapeHTML(tag)}

          </span>

        `
      )
      .join("");



  /* ===============================
     PUBLISHED DATE
  ================================ */

  document.getElementById(
    "publishedAt"
  ).textContent =
    formatDate(
      video.publishedAt ||
      video.createdAt
    );



  console.log(
    "Loaded video:",
    {
      videoId,
      ...video
    }
  );

}



/* ===================================
   DATE
=================================== */

function formatDate(
  value
){

  if(!value){
    return "";
  }


  try{

    let date;


    if(
      typeof value.toDate ===
      "function"
    ){

      date =
        value.toDate();

    }
    else{

      date =
        new Date(value);

    }


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "";

    }


    return date.toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

  }
  catch{

    return "";

  }

}



/* ===================================
   ERROR
=================================== */

function showError(
  message
){

  loading.style.display =
    "none";

  watchContent.style.display =
    "none";

  errorBox.style.display =
    "block";

  errorMessage.textContent =
    message ||
    "Unable to load video.";

}



/* ===================================
   RETRY
=================================== */

retryBtn.addEventListener(
  "click",
  loadVideo
);



/* ===================================
   BACK
=================================== */

document
  .getElementById("backBtn")
  .addEventListener(
    "click",
    () => {

      if(
        window.history.length > 1
      ){

        window.history.back();

      }
      else{

        window.location.href =
          "video.html";

      }

    }
  );



/* ===================================
   ESCAPE HTML
=================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}



/* ===================================
   START
=================================== */

loadVideo();

</script>

</body>
</html>
