<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;

}

button{

}

.header{

  display:flex;
  align-items:center;
  justify-content:space-between;

}

.logo{

.logo i{

}

.header-btn{

.back{

.card{

.player video,

  width:100%;

.message{

  align-items:center;
  justify-content:center;

}

.message i{

}

.message h2{

}

.message p{

}

.info{

}

.title{

}

.description{

}

.meta{

  flex-wrap:wrap;

}

.badge{

  color:#475569;
  font-size:12px;

}

.free{
  background:#dcfce7;

  color:#166534;
}

.premium{

  color:#92400e;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #e5e7eb;
}

.action{
  border:1px solid #dbe2ea;
  background:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-weight:700;
  font-size:13px;
}

.action:hover{
  background:#eff6ff;
  color:#2563eb;
}

.channel{
  display:flex;
  align-items:center;
  gap:11px;
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #e5e7eb;
}

.channel img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#e2e8f0;
}

.channel-name{
  font-weight:800;
}

.handle{
  color:#64748b;
  font-size:12px;
  margin-top:4px;
}

.details{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #e5e7eb;
}

.details-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:12px;
}

.detail{
  background:#f8fafc;
  padding:12px;
  border-radius:8px;
}

.detail small{
  display:block;
  color:#64748b;
  font-size:10px;
  margin-bottom:5px;
}

.detail strong{
  font-size:12px;
  overflow-wrap:anywhere;
}

.loading{
  padding:100px 20px;
  text-align:center;
  color:#64748b;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid #e2e8f0;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.error{
  background:#fff;
  border:1px solid #fecaca;
  color:#b91c1c;
  border-radius:12px;
  padding:35px 20px;
  text-align:center;
}

.error i{
  font-size:42px;
  margin-bottom:12px;
}

.retry{
  margin-top:16px;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 17px;
  border-radius:8px;
  font-weight:700;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){

  .container{
    padding:10px 0 30px;
  }

  .card{
    border-radius:0;
    border-left:0;

  }

  .info{
    padding:16px;
  }

  .details-grid{
    grid-template-columns:1fr 1fr;

  .header{

  }

}

@media(max-width:450px){

  .details-grid{
    grid-template-columns:1fr;
  }

    font-size:16px;
  }

  .action{
    flex:1;

</style>
</head>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   DOM
========================= */

const $ =
  id => document.getElementById(id);

const loading = $("loading");
const error = $("error");
const content = $("content");
const player = $("player");


/* =========================
   VIDEO ID
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const videoId =
  params.get("id") ||
  params.get("videoId");


let currentVideo = null;


/* =========================
   LOAD VIDEO
========================= */

async function loadVideo(){

  if(!videoId){

    showError(
      "Video ID haipo kwenye URL."
    );

    return;

  }


  try{

    /*
     * Firestore:
     *
     * videos
     *   └── videoId
     */

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const snapshot =
      await getDoc(videoRef);


    if(!snapshot.exists()){

      showError(
        "Video haikupatikana kwenye Firestore."
      );

      return;

    }


    const data =
      snapshot.data();


    /*
     * STATUS CHECK
     *
     * Only published videos
     * can be watched.
     */

    if(
      String(data.status || "")
        .toLowerCase()
        !== "published"
    ){

      showError(`
        <i class="fa-solid fa-lock"></i>

        <h2>Video haipatikani</h2>

        <p>
          Video hii si published kwa sasa.
          Status yake ni:
          <strong>
            ${escapeHTML(data.status || "unknown")}
          </strong>
        </p>
      `);

      return;

    }


    /*
     * FREE / PLAN CHECK
     */

    if(data.isFree !== true){

      /*
       * Paid / Plan video
       * cannot be watched directly.
       */

      window.location.replace(
        `video-order.html?id=${
          encodeURIComponent(videoId)
        }`
      );

      return;

    }


    /*
     * FULL FIRESTORE DOCUMENT
     */

    currentVideo = {

      videoId:
        snapshot.id,

      ...data

    };


    renderVideo();

    loading.classList.add("hidden");

    content.classList.remove("hidden");


    await countView();


  }catch(err){

    console.error(
      "watch.html error:",
      err
    );

    showError(
      "Imeshindikana kusoma video kutoka Firestore."
    );

  }

}


/* =========================
   RENDER VIDEO
========================= */

function renderVideo(){

  const v =
    currentVideo;


  $("title").textContent =
    v.title ||
    "Untitled Video";


  $("description").textContent =
    v.description ||
    "No description available.";


  $("videoId").textContent =
    v.videoId;


  $("videoType").textContent =
    v.videoType ||
    "—";


  $("category").textContent =
    v.category ||
    "—";


  $("duration").textContent =
    v.duration ||
    "—";


  $("views").textContent =
    formatNumber(v.views);


  $("likes").textContent =
    formatNumber(v.likes);


  $("likeDetail").textContent =
    formatNumber(v.likes);


  $("comments").textContent =
    formatNumber(v.commentsCount);


  $("commentDetail").textContent =
    formatNumber(v.commentsCount);


  $("shares").textContent =
    formatNumber(v.shares);


  $("status").textContent =
    v.status ||
    "—";


  $("publishedAt").textContent =
    formatDate(v.publishedAt);


  $("updatedAt").textContent =
    formatDate(v.updatedAt);


  $("channelName").textContent =
    v.channelName ||
    v.creatorName ||
    "Let'sStudy Pro";


  $("channelHandle").textContent =
    v.channelHandle
      ? "@" +
        String(v.channelHandle)
          .replace(/^@/,"")
      : "";


  $("channelImage").src =
    v.channelImage ||
    `https://ui-avatars.com/api/?name=${
      encodeURIComponent(
        v.channelName ||
        v.creatorName ||
        "Let'sStudy Pro"
      )
    }`;


  $("meta").innerHTML = `

    <span class="badge">
      ${escapeHTML(
        v.category || "Video"
      )}
    </span>

    <span class="badge">
      ${escapeHTML(
        v.duration || "—"
      )}
    </span>

    <span class="badge">
      ${formatNumber(v.views)} views
    </span>

    <span class="badge free">
      FREE
    </span>

  `;


  loadPlayer(v);

  updateSaveButton();

}


/* =========================
   VIDEO PLAYER
========================= */

function loadPlayer(v){

  player.innerHTML = "";

  const url =
    String(v.videoUrl || "")
      .trim();


  if(!url){

    player.innerHTML = `

      <div class="message">

        <div>

          <i class="fa-solid fa-video-slash"></i>

          <h2>Video unavailable</h2>

          <p>
            videoUrl haijawekwa kwenye Firestore.
          </p>

        </div>

      </div>

    `;

    return;

  }


  /*
   * YouTube
   */

  const youtube =
    getYouTubeId(url);


  if(youtube){

    const iframe =
      document.createElement("iframe");

    iframe.src =
      `https://www.youtube.com/embed/${
        encodeURIComponent(youtube)
      }?rel=0&modestbranding=1`;


    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";


    iframe.allowFullscreen = true;

    player.appendChild(iframe);

    return;

  }


  /*
   * Vimeo
   */

  const vimeo =
    getVimeoId(url);


  if(vimeo){

    const iframe =
      document.createElement("iframe");

    iframe.src =
      `https://player.vimeo.com/video/${
        encodeURIComponent(vimeo)
      }`;

    iframe.allowFullscreen = true;

    player.appendChild(iframe);

    return;

  }


  /*
   * Direct MP4 / WebM
   */

  const video =
    document.createElement("video");


  video.src = url;

  video.controls = true;

  video.playsInline = true;

  video.preload = "metadata";


  if(v.thumbnail){

    video.poster =
      v.thumbnail;

  }


  video.onerror = () => {

    player.innerHTML = `

      <div class="message">

        <div>

          <i class="fa-solid fa-triangle-exclamation"></i>

          <h2>Unable to play video</h2>

          <p>
            Hakikisha videoUrl ni URL
            inayoweza kuchezwa na browser.
          </p>

        </div>

      </div>

    `;

  };


  player.appendChild(video);

}


/* =========================
   YOUTUBE
========================= */

function getYouTubeId(url){

  try{

    const u =
      new URL(url);


    if(
      u.hostname.includes("youtu.be")
    ){

      return u.pathname
        .replace(/^\/+/,"")
        .split("/")[0];

    }


    if(
      u.hostname.includes("youtube.com")
    ){

      const v =
        u.searchParams.get("v");

      if(v){
        return v;
      }


      if(
        u.pathname.startsWith("/embed/")
      ){

        return u.pathname
          .split("/")[2];

      }


      if(
        u.pathname.startsWith("/shorts/")
      ){

        return u.pathname
          .split("/")[2];

      }

    }

  }catch(e){}

  return null;

}


/* =========================
   VIMEO
========================= */

function getVimeoId(url){

  const match =
    String(url).match(
      /vimeo\.com\/(?:video\/)?(\d+)/
    );

  return match
    ? match[1]
    : null;

}


/* =========================
   VIEW COUNT
========================= */

async function countView(){

  const key =
    `viewed-${currentVideo.videoId}`;


  if(
    sessionStorage.getItem(key)
  ){

    return;

  }


  sessionStorage.setItem(
    key,
    "1"
  );


  try{

    await updateDoc(
      doc(
        db,
        "videos",
        currentVideo.videoId
      ),
      {
        views:
          increment(1)
      }
    );


    currentVideo.views =
      Number(
        currentVideo.views || 0
      ) + 1;


    $("views").textContent =
      formatNumber(
        currentVideo.views
      );

  }catch(err){

    console.warn(
      "View count failed:",
      err
    );

  }

}


/* =========================
   LIKE
========================= */

$("likeBtn").onclick =
async () => {

  if(!currentVideo){
    return;
  }


  const key =
    `liked-${currentVideo.videoId}`;


  if(
    localStorage.getItem(key)
  ){

    return;

  }


  try{

    await updateDoc(
      doc(
        db,
        "videos",
        currentVideo.videoId
      ),
      {
        likes:
          increment(1)
      }
    );


    localStorage.setItem(
      key,
      "1"
    );


    currentVideo.likes =
      Number(
        currentVideo.likes || 0
      ) + 1;


    $("likes").textContent =
      formatNumber(
        currentVideo.likes
      );


    $("likeDetail").textContent =
      formatNumber(
        currentVideo.likes
      );


    $("likeBtn").innerHTML = `
      <i class="fa-solid fa-thumbs-up"></i>
      Liked
      ${formatNumber(currentVideo.likes)}
    `;

  }catch(err){

    console.warn(
      "Like failed:",
      err
    );

  }

};


/* =========================
   COMMENTS
========================= */

$("commentBtn").onclick =
() => {

  if(!currentVideo){
    return;
  }

  location.href =
    `comments.html?videoId=${
      encodeURIComponent(
        currentVideo.videoId
      )
    }`;

};


/* =========================
   SHARE
========================= */

$("shareBtn").onclick =
async () => {

  if(!currentVideo){
    return;
  }


  try{

    if(
      navigator.share
    ){

      await navigator.share({

        title:
          currentVideo.title ||
          "Let'sStudy Pro",

        text:
          currentVideo.description ||
          "",

        url:
          location.href

      });

    }else{

      await navigator.clipboard.writeText(
        location.href
      );

      alert(
        "Video link copied."
      );

    }


    await updateDoc(
      doc(
        db,
        "videos",
        currentVideo.videoId
      ),
      {
        shares:
          increment(1)
      }
    );


    currentVideo.shares =
      Number(
        currentVideo.shares || 0
      ) + 1;


    $("shares").textContent =
      formatNumber(
        currentVideo.shares
      );

  }catch(err){

    console.warn(
      "Share cancelled/failed:",
      err
    );

  }

};


/* =========================
   SAVE
========================= */

$("saveBtn").onclick =
() => {

  if(!currentVideo){
    return;
  }


  const key =
    `saved-${currentVideo.videoId}`;


  if(
    localStorage.getItem(key)
  ){

    localStorage.removeItem(key);

    $("saveBtn").innerHTML = `
      <i class="fa-regular fa-bookmark"></i>
      Save
    `;

  }else{

            localStorage.setItem(
      key,
      "1"
    );

    $("saveBtn").innerHTML =
      `<i class="fa-solid fa-bookmark"></i> Saved`;

    $("saveBtn").classList.add("active");

  };

/* =========================
   UPDATE SAVE STATE
========================= */

function updateSave(){

  if(!currentVideo){
    return;
  }

  const key =
    `saved-${currentVideo.videoId}`;

  const saved =
    localStorage.getItem(key);

  if(saved){

    $("saveBtn").innerHTML =
      `<i class="fa-solid fa-bookmark"></i> Saved`;

    $("saveBtn").classList.add("active");

  }else{

    $("saveBtn").innerHTML =
      `<i class="fa-regular fa-bookmark"></i> Save`;

    $("saveBtn").classList.remove("active");

  }

}


/* =========================
   FORMAT NUMBER
========================= */

function formatNumber(value){

  const number =
    Number(value || 0);

  return new Intl.NumberFormat().format(
    number
  );

}


/* =========================
   ESCAPE ATTRIBUTE
========================= */

function escapeAttribute(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}


/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value){
    return "—";
  }

  try{

    if(
      value &&
      typeof value.toDate === "function"
    ){

      return value
        .toDate()
        .toLocaleString();

    }

    const date =
      new Date(value);

    if(!isNaN(date.getTime())){

      return date.toLocaleString();

    }

  }catch(err){

    console.warn(
      "Date error:",
      err
    );

  }

  return String(value);

}


/* =========================
   ERROR
========================= */

function showError(message){

  loading.classList.add("hidden");

  layout.classList.add("hidden");

  error.innerHTML = `

    <i class="fa-solid fa-circle-exclamation"></i>

    <h3 style="margin:10px 0;">
      Unable to Load Video
    </h3>

    <p>
      ${escapeHTML(message)}
    </p>

    <button
      id="retryBtn"
      style="
        margin-top:18px;
        border:0;
        background:#2563eb;
        color:#fff;
        padding:10px 18px;
        border-radius:8px;
        font-weight:700;
        cursor:pointer;
      "
    >
      <i class="fa-solid fa-rotate"></i>
      Retry
    </button>

  `;

  error.classList.remove("hidden");

  const retryBtn =
    $("retryBtn");

  if(retryBtn){

    retryBtn.onclick = () => {

      error.classList.add("hidden");

      loading.classList.remove("hidden");

      loadVideo();

    };

  }

}


/* =========================

/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "ArrowLeft"
    ){

      previousVideo();

    }

    if(
      event.key === "ArrowRight"
    ){

      nextVideo();

    }

  }
);


/* =========================
   NEXT VIDEO
========================= */

function nextVideo(){

  if(!videos.length){
    return;
  }

  const index =
    videos.findIndex(
      v =>
        v.videoId ===
        currentVideo.videoId
    );

  if(index === -1){
    return;
  }

  const next =
    videos[index + 1];

  if(!next){

    playerStatus.textContent =
      "No next video";

    return;

  }

  openVideo(next);

}


/* =========================
   PREVIOUS VIDEO
========================= */

function previousVideo(){

  if(!videos.length){
    return;
  }

  const index =
    videos.findIndex(
      v =>
        v.videoId ===
        currentVideo.videoId
    );

  if(index <= 0){

    playerStatus.textContent =
      "No previous video";

    return;

  }

  const previous =
    videos[index - 1];

  openVideo(previous);

}


/* =========================
   OPEN VIDEO
========================= */

function openVideo(v){

  if(!v){
    return;
  }

  /*
   * FREE VIDEO
   * → watch.html
   *
   * PAID VIDEO
   * → video-order.html
   */

  if(
    v.isFree === true ||
    String(v.isFree).toLowerCase() === "true"
  ){

    location.href =
      `watch.html?id=${
        encodeURIComponent(
          v.videoId
        )
      }`;

  }else{

    location.href =
      `video-order.html?id=${
        encodeURIComponent(
          v.videoId
        )
      }`;

  }

}


/* =========================
   PLAYER CONTROLS
========================= */

function getHTML5Video(){

  return player.querySelector(
    "video"
  );

}


$("playBtn")?.addEventListener(
  "click",
  () => {

    const video =
      getHTML5Video();

    if(!video){

      openAccess();

      return;

    }

    if(video.paused){

      video.play();

      $("playBtn").innerHTML =
        `<i class="fa-solid fa-pause"></i>`;

    }else{

      video.pause();

      $("playBtn").innerHTML =
        `<i class="fa-solid fa-play"></i>`;

    }

  }
);


$("muteBtn")?.addEventListener(
  "click",
  () => {

    const video =
      getHTML5Video();

    if(!video){
      return;
    }

    video.muted =
      !video.muted;

    $("muteBtn").innerHTML =
      video.muted
        ? `<i class="fa-solid fa-volume-xmark"></i>`
        : `<i class="fa-solid fa-volume-high"></i>`;

  }
);


$("fullscreenBtn")?.addEventListener(
  "click",
  () => {

    const element =
      player;

    if(
      document.fullscreenElement
    ){

      document.exitFullscreen();

    }else if(
      element.requestFullscreen
    ){

      element.requestFullscreen();

    }

  }
);


/* =========================
   NEXT / PREVIOUS BUTTONS
========================= */

$("nextBtn")?.addEventListener(
  "click",
  nextVideo
);


$("prevBtn")?.addEventListener(
  "click",
  previousVideo
);


/* =========================
   PLAYER STATUS
========================= */

player.addEventListener?.(
  "dblclick",
  () => {

    const video =
      getHTML5Video();

    if(video){

      if(
        document.fullscreenElement
      ){

        document.exitFullscreen();

      }else{

        player.requestFullscreen();

      }

    }

  }
);


/* =========================
   START
========================= */

start();


/* =========================
   MAIN START FUNCTION
========================= */

async function start(){

  try{

    await loadVideo();

  }catch(err){

    console.error(
      "Application error:",
      err
    );

    showError(
      "Something went wrong while loading this video."
    );

  }

}

</script>
