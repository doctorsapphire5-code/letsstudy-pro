<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Watch Video | LetsStudy Pro</title>

  <meta
    name="description"
    id="metaDescription"
    content="Watch educational videos on LetsStudy Pro."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      width: min(1200px, 94%);
      margin: 30px auto;
    }

    .video-wrapper {
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    video {
      display: block;
      width: 100%;
      max-height: 680px;
      background: #000;
    }

    .video-thumbnail {
      width: 100%;
      max-height: 680px;
      object-fit: cover;
      display: none;
    }

    .video-info {
      background: #fff;
      padding: 24px;
      border-radius: 14px;
      margin-top: 18px;
    }

    .video-title {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.3;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .description {
      color: #374151;
      line-height: 1.7;
      white-space: pre-line;
    }

    .channel {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .channel img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #e5e7eb;
    }

    .channel-name {
      font-weight: 700;
    }

    .channel-handle {
      color: #6b7280;
      font-size: 14px;
      margin-top: 3px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .tag {
      background: #eef2ff;
      color: #3730a3;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .access {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .free {
      background: #dcfce7;
      color: #166534;
    }

    .plan {
      background: #fef3c7;
      color: #92400e;
    }

    .error,
    .loading {
      text-align: center;
      padding: 80px 20px;
    }

    .error h2 {
      margin-bottom: 10px;
    }

    .price {
      font-weight: 700;
      margin-left: 8px;
    }

  </style>

</head>

<body>


  <main class="container">

    <!-- LOADING -->

    <section
      id="loading"
      class="loading"
    >

      <h2>
        Loading video...
      </h2>

      <p>
        Please wait while we load the video.
      </p>

    </section>


    <!-- ERROR -->

    <section
      id="error"
      class="error"
      style="display:none;"
    >

      <h2>
        Unable to load video
      </h2>

      <p id="errorMessage">
        Video could not be found.
      </p>

    </section>


    <!-- VIDEO -->

    <section
      id="watchContent"
      style="display:none;"
    >

      <div class="video-wrapper">

        <video
          id="videoPlayer"
          controls
          playsinline
          preload="metadata"
        >
        </video>

        <img
          id="videoThumbnail"
          class="video-thumbnail"
          alt="Video thumbnail"
        >

      </div>


      <article class="video-info">

        <h1
          id="videoTitle"
          class="video-title"
        >
        </h1>


        <div class="meta">

          <span id="category"></span>

          <span>•</span>

          <span id="duration"></span>

          <span>•</span>

          <span id="views"></span>

          <span>•</span>

          <span id="publishedAt"></span>

          <span
            id="accessBadge"
            class="access"
          >
          </span>

        </div>


        <p
          id="price"
          class="price"
        >
        </p>


        <div
          id="description"
          class="description"
        >
        </div>


        <!-- CHANNEL -->

        <div class="channel">

          <img
            id="channelImage"
            src=""
            alt="Channel"
          >

          <div>

            <div
              id="channelName"
              class="channel-name"
            >
            </div>

            <div
              id="channelHandle"
              class="channel-handle"
            >
            </div>

          </div>

        </div>


        <!-- CREATOR -->

        <div
          id="creatorInfo"
          style="margin-top:20px;"
        >
        </div>


        <!-- TAGS -->

        <div
          id="tags"
          class="tags"
        >
        </div>

      </article>

    </section>

  </main>



  <!-- ======================================
       FIREBASE
  ======================================= -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getFirestore,
      doc,
      getDoc
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* ======================================
       FIREBASE CONFIG
    ======================================= */

    const firebaseConfig = {

      apiKey:
        "YOUR_API_KEY",

      authDomain:
        "YOUR_PROJECT.firebaseapp.com",

      projectId:
        "YOUR_PROJECT_ID",

      storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

      messagingSenderId:
        "YOUR_SENDER_ID",

      appId:
        "YOUR_APP_ID"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const db =
      getFirestore(app);


    /* ======================================
       GET VIDEO ID
       
       IMPORTANT:
       URL MUST CONTAIN videoId
       
       Example:
       watch.html?videoId=ABC123
    ====================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const videoId =
      params.get(
        "videoId"
      );


    /* ======================================
       ELEMENTS
    ====================================== */

    const loading =
      document.getElementById(
        "loading"
      );


    const errorBox =
      document.getElementById(
        "error"
      );


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    const watchContent =
      document.getElementById(
        "watchContent"
      );


    const videoPlayer =
      document.getElementById(
        "videoPlayer"
      );


    const thumbnail =
      document.getElementById(
        "videoThumbnail"
      );


    /* ======================================
       LOAD VIDEO
       
       videos/{videoId}
    ====================================== */

    async function loadVideo() {

      try {

        if (!videoId) {

          throw new Error(
            "Video ID is missing."
          );

        }


        /*
         * DIRECT FIRESTORE DOCUMENT ACCESS
         *
         * videos
         *   └── videoId
         */

        const videoRef =
          doc(
            db,
            "videos",
            videoId
          );


        const snapshot =
          await getDoc(
            videoRef
          );


        if (!snapshot.exists()) {

          throw new Error(
            "This video does not exist."
          );

        }


        /*
         * GET ALL DOCUMENT DATA
         */

        const video =
          snapshot.data();


        console.log(
          "Video ID:",
          snapshot.id
        );


        console.log(
          "Video data:",
          video
        );


        displayVideo(
          video
        );


      }

      catch (error) {

        console.error(
          "Video loading error:",
          error
        );


        showError(
          error.message
        );

      }

    }


    /* ======================================
       DISPLAY VIDEO
    ====================================== */

    function displayVideo(
      video
    ) {

      loading.style.display =
        "none";


      watchContent.style.display =
        "block";


      /* ==================================
         TITLE
      ================================== */

      const title =
        video.title ||
        "Untitled Video";


      document
        .getElementById(
          "videoTitle"
        )
        .textContent =
        title;


      document.title =
        `${title} | LetsStudy Pro`;


      /* ==================================
         DESCRIPTION
      ================================== */

      document
        .getElementById(
          "description"
        )
        .textContent =
        video.description ||
        "";


      document
        .getElementById(
          "metaDescription"
        )
        .setAttribute(
          "content",
          video.description ||
          title
        );


      /* ==================================
         CATEGORY
      ================================== */

      document
        .getElementById(
          "category"
        )
        .textContent =
        video.category ||
        "Education";


      /* ==================================
         DURATION
      ================================== */

      document
        .getElementById(
          "duration"
        )
        .textContent =
        video.duration ||
        "—";


      /* ==================================
         VIEWS
      ================================== */

      const views =
        Number(
          video.views || 0
        );


      document
        .getElementById(
          "views"
        )
        .textContent =
        `${views.toLocaleString()} views`;


      /* ==================================
         ACCESS
      ================================== */

      const accessBadge =
        document
          .getElementById(
            "accessBadge"
          );


      if (
        video.isFree === true
      ) {

        accessBadge.textContent =
          "FREE";


        accessBadge.className =
          "access free";


        document
          .getElementById(
            "price"
          )
          .textContent =
          "";

      }

      else {

        accessBadge.textContent =
          "PLAN";


        accessBadge.className =
          "access plan";


        const price =
          Number(
            video.price || 0
          );


        const currency =
          video.currency ||
          "TZS";


        document
          .getElementById(
            "price"
          )
          .textContent =
          price > 0
            ? `${currency} ${price.toLocaleString()}`
            : "Plan required";

      }


      /* ==================================
         THUMBNAIL
         
         ONLY READ thumbnail FIELD
         FROM FIRESTORE.
         
         NO STORAGE.
      ================================== */

      if (
        video.thumbnail
      ) {

        thumbnail.src =
          video.thumbnail;

      }


      /* ==================================
         VIDEO URL
         
         ONLY READ videoUrl FIELD
         FROM FIRESTORE.
      ================================== */

      if (
        !video.videoUrl
      ) {

        videoPlayer.style.display =
          "none";

        thumbnail.style.display =
          video.thumbnail
            ? "block"
            : "none";

      }

      else {

        videoPlayer.src =
          video.videoUrl;


        /*
         * videoType is also read
         * from Firestore.
         */

        if (
          video.videoType
        ) {

          videoPlayer.dataset.type =
            video.videoType;

        }


        videoPlayer.load();

      }


      /* ==================================
         CHANNEL
      ================================== */

      document
        .getElementById(
          "channelName"
        )
        .textContent =
        video.channelName ||
        "LetsStudy Pro";


      document
        .getElementById(
          "channelHandle"
        )
        .textContent =
        video.channelHandle
          ? `@${String(
              video.channelHandle
            ).replace(/^@/, "")}`
          : "";


      /* ==================================
         CHANNEL IMAGE
      ================================== */

      const channelImage =
        document
          .getElementById(
            "channelImage"
          );


      if (
        video.channelImage
      ) {

        channelImage.src =
          video.channelImage;

      }

      else if (
        video.creatorImage
      ) {

        channelImage.src =
          video.creatorImage;

      }

      else {

        channelImage.style.display =
          "none";

      }


      /* ==================================
         CREATOR
      ================================== */

      const creatorInfo =
        document
          .getElementById(
            "creatorInfo"
          );


      if (
        video.creatorName
      ) {

        creatorInfo.textContent =
          `Created by ${video.creatorName}`;

      }

      else {

        creatorInfo.textContent =
          "";

      }


      /* ==================================
         TAGS
      ================================== */

      const tagsContainer =
        document
          .getElementById(
            "tags"
          );


      const tags =
        Array.isArray(
          video.tags
        )
          ? video.tags
          : [];


      tagsContainer.innerHTML =
        tags
          .map(
            tag => `
              <span class="tag">
                ${escapeHTML(tag)}
              </span>
            `
          )
          .join("");


      /* ==================================
         PUBLISHED DATE
      ================================== */

      const published =
        video.publishedAt ||
        video.createdAt;


      document
        .getElementById(
          "publishedAt"
        )
        .textContent =
        formatDate(
          published
        );

    }


    /* ======================================
       DATE FORMAT
    ====================================== */

    function formatDate(
      timestamp
    ) {

      if (!timestamp) {

        return "";

      }


      try {

        const date =
          timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);


        if (
          Number.isNaN(
            date.getTime()
          )
        ) {

          return "";

        }


        return date.toLocaleDateString(
          undefined,
          {
            year: "numeric",
            month: "short",
            day: "numeric"
          }
        );

      }

      catch {

        return "";

      }

    }


    /* ======================================
       ERROR
    ====================================== */

    function showError(
      message
    ) {

      loading.style.display =
        "none";


      watchContent.style.display =
        "none";


      errorBox.style.display =
        "block";


      errorMessage.textContent =
        message ||
        "Unable to load video.";

    }


    /* ======================================
       ESCAPE HTML
    ====================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ======================================
       START
    ====================================== */

    loadVideo();

  </script>

</body>
</html>
