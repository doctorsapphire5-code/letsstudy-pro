<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Weather | LetsStudy Pro</title>

<meta name="description"
content="Live weather and climate information powered by OpenWeatherMap.">

<link rel="icon"
href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgQHmJO8e8twONhRhp3I6pP4NFDh-LPcqVtAmQ9R9XjOGaVMKShfSLmxeK0fVzJsybBBOXKbA8LIhjgTgko83C-UPVhwgXeLtvTfjtVv6aVGgQgniOF-gMC28bY78HryXZ-5OqCwdBpKGqjEfTta5jLjT1mpvtBi2DQKyu35rkxsZNoVvl0nhvxUUn1gDP0/s1600/Untitled%20design_20260717_144337_0000.jpg">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 font-family:Inter,Arial,sans-serif;
 background:#f4f7fb;
 color:#172033;
}

.top{
 height:68px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 padding:0 5%;
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:900;
}

.container{
 max-width:1100px;
 margin:auto;
 padding:30px 18px;
}

/* HERO */

.hero{
 text-align:center;
 padding:20px 0 25px;
}

.hero h1{
 font-size:34px;
 margin-bottom:8px;
}

.hero p{
 color:#667085;
 font-size:14px;
}

/* SEARCH */

.search{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:17px;
 padding:10px;
 display:flex;
 gap:10px;
 box-shadow:0 5px 20px rgba(16,24,40,.06);
 margin-bottom:20px;
}

.search input{
 flex:1;
 min-width:0;
 border:0;
 outline:none;
 padding:13px;
 font-size:14px;
}

.search button{
 border:0;
 background:#155eef;
 color:white;
 padding:12px 20px;
 border-radius:11px;
 font-weight:800;
 cursor:pointer;
}

.search button:hover{
 background:#004ecc;
}

/* WEATHER */

.weather{
 background:linear-gradient(135deg,#155eef,#0b4bb3);
 color:#fff;
 border-radius:24px;
 padding:30px;
 box-shadow:0 15px 40px rgba(21,94,239,.22);
}

.location{
 display:flex;
 align-items:center;
 gap:9px;
 font-size:15px;
 font-weight:800;
}

.date{
 color:rgba(255,255,255,.72);
 font-size:11px;
 margin-top:3px;
}

.current{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:20px;
 margin-top:25px;
}

.temperature{
 font-size:65px;
 font-weight:900;
 line-height:1;
}

.unit{
 font-size:25px;
 vertical-align:top;
}

.description{
 font-size:17px;
 font-weight:700;
 margin-top:8px;
 text-transform:capitalize;
}

.weather-icon{
 width:120px;
 height:120px;
}

/* DETAILS */

.details{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin-top:25px;
}

.detail{
 background:rgba(255,255,255,.12);
 border:1px solid rgba(255,255,255,.13);
 border-radius:14px;
 padding:15px;
}

.detail i{
 font-size:18px;
 margin-bottom:7px;
}

.detail span{
 display:block;
 font-size:10px;
 color:rgba(255,255,255,.7);
}

.detail strong{
 display:block;
 margin-top:3px;
 font-size:14px;
}

/* STATUS */

.status{
 margin:15px 0;
 padding:12px;
 border-radius:11px;
 display:none;
 font-size:12px;
 font-weight:700;
}

.error{
 background:#fef3f2;
 color:#b42318;
 border:1px solid #fecdca;
}

.loading{
 background:#eef4ff;
 color:#155eef;
 border:1px solid #dbe7ff;
}

/* FOOTER */

.footer{
 text-align:center;
 margin-top:25px;
 color:#667085;
 font-size:11px;
}

.footer a{
 color:#155eef;
 font-weight:700;
 text-decoration:none;
}

/* MOBILE */

@media(max-width:650px){

 .container{
  padding-top:20px;
 }

 .hero h1{
  font-size:28px;
 }

 .search{
  flex-direction:column;
 }

 .search button{
  width:100%;
 }

 .weather{
  padding:22px;
 }

 .current{
  flex-direction:column;
  align-items:flex-start;
 }

 .temperature{
  font-size:58px;
 }

 .weather-icon{
  width:100px;
  height:100px;
  align-self:center;
 }

 .details{
  grid-template-columns:repeat(2,1fr);
 }

}

</style>

</head>

<body>


<header class="top">

<div class="logo">
LetsStudy Pro
</div>

</header>


<main class="container">


<section class="hero">

<h1>
<i class="fa-solid fa-cloud-sun"></i>
Weather & Climate
</h1>

<p>
Live weather information powered by OpenWeatherMap
</p>

</section>


<!-- SEARCH -->

<div class="search">

<input
id="cityInput"
type="search"
placeholder="Enter city e.g. Dar es Salaam"
value="Dar es Salaam"
>

<button onclick="getWeather()">

<i class="fa-solid fa-magnifying-glass"></i>

Search

</button>

</div>


<div
id="status"
class="status">
</div>


<!-- WEATHER CARD -->

<section
class="weather"
id="weatherCard"
style="display:none;"
>


<div class="location">

<i class="fa-solid fa-location-dot"></i>

<span id="city">
Dar es Salaam
</span>

</div>


<div
class="date"
id="date">
Loading...
</div>


<div class="current">


<div>

<div class="temperature">

<span id="temperature">
--
</span>

<span class="unit">
°C
</span>

</div>


<div
class="description"
id="description">
Loading...
</div>

</div>


<img
id="weatherIcon"
class="weather-icon"
src=""
alt="Weather icon"
>

</div>


<div class="details">


<div class="detail">

<i class="fa-solid fa-temperature-half"></i>

<span>
Feels Like
</span>

<strong id="feels">
--
</strong>

</div>


<div class="detail">

<i class="fa-solid fa-droplet"></i>

<span>
Humidity
</span>

<strong id="humidity">
--
</strong>

</div>


<div class="detail">

<i class="fa-solid fa-wind"></i>

<span>
Wind
</span>

<strong id="wind">
--
</strong>

</div>


<div class="detail">

<i class="fa-solid fa-gauge-high"></i>

<span>
Pressure
</span>

<strong id="pressure">
--
</strong>

</div>


</div>

</section>


<div class="footer">

Weather data powered by
<a
href="https://openweathermap.org/"
target="_blank"
rel="noopener noreferrer">
OpenWeatherMap
</a>

<br><br>

© <span id="year"></span>
LetsStudy Pro

</div>


</main>


<script>

/*
================================================
OPENWEATHERMAP API KEY
================================================

Replace the value below with your API key.

Example:

const API_KEY = "abc123456789";

================================================
*/

const API_KEY = "d414f96c4f08b308a51aa01a9fb7d169";


/*
================================================
ELEMENTS
================================================
*/

const cityInput =
document.getElementById("cityInput");

const weatherCard =
document.getElementById("weatherCard");

const statusBox =
document.getElementById("status");


/*
================================================
STATUS
================================================
*/

function showStatus(message,type){

 statusBox.textContent = message;

 statusBox.className =
 "status " + type;

 statusBox.style.display = "block";

}


function hideStatus(){

 statusBox.style.display = "none";

}


/*
================================================
WEATHER
================================================
*/

async function getWeather(){

 const city =
 cityInput.value.trim();


 if(!city){

  showStatus(
   "Please enter a city name.",
   "error"
  );

  return;

 }


 if(
  API_KEY ===
  "d414f96c4f08b308a51aa01a9fb7d169"
 ){

  showStatus(
   "Please add your OpenWeatherMap API key inside the code first.",
   "error"
  );

  return;

 }


 showStatus(
  "Loading weather...",
  "loading"
 );


 weatherCard.style.display =
 "none";


 try{

  const url =
  `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`;


  const response =
  await fetch(url);


  if(!response.ok){

   if(response.status === 401){

    throw new Error(
     "Invalid API key."
    );

   }

   if(response.status === 404){

    throw new Error(
     "City not found."
    );

   }

   throw new Error(
    "Unable to load weather."
   );

  }


  const data =
  await response.json();


  displayWeather(data);

  hideStatus();

 }
 catch(error){

  showStatus(
   error.message,
   "error"
  );

 }

}


/*
================================================
DISPLAY WEATHER
================================================
*/

function displayWeather(data){

 document.getElementById("city")
 .textContent =
 `${data.name}, ${data.sys.country}`;


 document.getElementById("temperature")
 .textContent =
 Math.round(data.main.temp);


 document.getElementById("description")
 .textContent =
 data.weather[0].description;


 document.getElementById("feels")
 .textContent =
 `${Math.round(data.main.feels_like)} °C`;


 document.getElementById("humidity")
 .textContent =
 `${data.main.humidity}%`;


 document.getElementById("wind")
 .textContent =
 `${data.wind.speed} m/s`;


 document.getElementById("pressure")
 .textContent =
 `${data.main.pressure} hPa`;


 document.getElementById("weatherIcon")
 .src =
 `https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;


 document.getElementById("date")
 .textContent =
 new Date().toLocaleString(
  undefined,
  {
   weekday:"long",
   year:"numeric",
   month:"long",
   day:"numeric",
   hour:"2-digit",
   minute:"2-digit"
  }
 );


 weatherCard.style.display =
 "block";

}


/*
================================================
ENTER KEY
================================================
*/

cityInput.addEventListener(
 "keydown",
 function(event){

  if(event.key === "Enter"){

   getWeather();

  }

 }
);


/*
================================================
YEAR
================================================
*/

document.getElementById("year")
.textContent =
new Date().getFullYear();

</script>


</body>
</html>
