<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Weather & Climate | LetsStudy Pro</title>

<link rel="icon"
href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgQHmJO8e8twONhRhp3I6pP4NFDh-LPcqVtAmQ9R9XjOGaVMKShfSLmxeK0fVzJsybBBOXKbA8LIhjgTgko83C-UPVhwgXeLtvTfjtVv6aVGgQgniOF-gMC28bY78HryXZ-5OqCwdBpKGqjEfTta5jLjT1mpvtBi2DQKyu35rkxsZNoVvl0nhvxUUn1gDP0/s1600/Untitled%20design_20260717_144337_0000.jpg">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f5f7fb;
 color:#172033;
 font-family:Inter,Arial,sans-serif;
}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 padding:0 5%;
}

.logo{
 color:#155eef;
 font-size:21px;
 font-weight:900;
}

.container{
 max-width:1200px;
 margin:30px auto;
 padding:0 18px;
}

.header{
 margin-bottom:18px;
}

h1{
 margin:0 0 7px;
 font-size:28px;
}

.subtitle{
 color:#667085;
 font-size:13px;
}

.weather-box{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 5px 20px rgba(16,24,40,.06);
}

.weather-frame{
 width:100%;
 height:700px;
 border:0;
 display:block;
}

.footer{
 padding:14px 18px;
 background:#fff;
 border-top:1px solid #e5e7eb;
 color:#667085;
 font-size:11px;
}

@media(max-width:600px){

 .weather-frame{
  height:650px;
 }

 h1{
  font-size:24px;
 }

}
</style>
</head>

<body>

<header class="top">

<div class="logo">
LetsStudy Pro
</div>

</header>


<main class="container">

<div class="header">

<h1>
<i class="fa fa-cloud-sun"></i>
Weather & Climate
</h1>

<div class="subtitle">
Live weather information displayed directly inside LetsStudy Pro.
</div>

</div>


<section class="weather-box">

<iframe
class="weather-frame"
src="https://www.open-meteo.com/"
title="Weather and Climate"
loading="lazy"
allowfullscreen>
</iframe>

<div class="footer">

<i class="fa fa-circle-info"></i>

Weather information powered by Open-Meteo.

</div>

</section>

</main>

</body>
</html>
