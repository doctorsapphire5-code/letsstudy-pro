<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Website | LetsStudy Pro</title>

<meta name="description" content="Website details on LetsStudy Pro.">
<meta name="theme-color" content="#2563eb">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.6;
}

.header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  text-decoration:none;
  color:#111827;
  font-size:21px;
  font-weight:800;
}

.back{
  color:#2563eb;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.container{
  max-width:1050px;
  margin:35px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(15,23,42,.06);
}

.hero-image{
  width:100%;
  height:330px;
  background:#eef2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.hero-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  font-size:70px;
}

.content{
  padding:32px;
}

.badge{
  display:inline-block;
  background:#eff6ff;
  color:#2563eb;
  padding:5px 11px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  margin-bottom:10px;
}

h1{
  font-size:32px;
  line-height:1.2;
  margin-bottom:9px;
}

.tagline{
  color:#64748b;
  font-size:15px;
  margin-bottom:22px;
}

.description{
  color:#475569;
  white-space:pre-line;
}

.section{
  margin-top:30px;
  padding-top:26px;
  border-top:1px solid #edf0f4;
}

.section h2{
  font-size:20px;
  margin-bottom:14px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.info{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
}

.label{
  font-size:11px;
  color:#64748b;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:4px;
}

.value{
  font-size:14px;
  font-weight:700;
  word-break:break-word;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.btn{
  display:inline-block;
  padding:12px 18px;
  border-radius:10px;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#eef2ff;
  color:#3730a3;
}

.loading{
  min-height:350px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

.error{
  padding:50px 25px;
  text-align:center;
}

.error h2{
  margin-bottom:8px;
}

.error p{
  color:#64748b;
}

.footer{
  text-align:center;
  padding:30px 15px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){

  .header{
    padding:0 15px;
  }

  .container{
    margin:20px auto;
  }

  .hero-image{
    height:220px;
  }

  .content{
    padding:23px;
  }

  h1{
    font-size:26px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    LetsStudy Pro
  </a>

  <a href="search.html" class="back">
    ← Back to Search
  </a>

</header>


<main class="container">

  <article class="card" id="websiteCard">

    <div class="loading">
      Loading website...
    </div>

  </article>

</main>


<footer class="footer">
  © LetsStudy Pro. All rights reserved.
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const websiteCard =
  document.getElementById("websiteCard");


const params =
  new URLSearchParams(
    window.location.search
  );

const websiteId =
  params.get("id");


function first(data,fields){

  for(const field of fields){

    const value =
      data[field];

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value);

    }

  }

  return "";

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeURL(value){

  if(!value) return "";

  try{

    const url =
      new URL(
        value,
        window.location.href
      );

    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return url.href;

    }

  }catch(error){}

  return "";

}


function renderWebsite(data){

  const title =
    first(data,[
      "title",
      "name",
      "websiteName",
      "siteName"
    ]) ||
    "Website";


  const description =
    first(data,[
      "description",
      "about",
      "details",
      "content",
      "bio"
    ]) ||
    "Discover this website on LetsStudy Pro.";


  const tagline =
    first(data,[
      "tagline",
      "subtitle",
      "shortDescription"
    ]);


  const image =
    first(data,[
      "image",
      "imageUrl",
      "thumbnail",
      "thumbnailUrl",
      "logo",
      "logoUrl",
      "screenshot"
    ]);


  const websiteURL =
    safeURL(
      first(data,[
        "website",
        "websiteUrl",
        "url",
        "link",
        "siteUrl"
      ])
    );


  const owner =
    first(data,[
      "owner",
      "ownerName",
      "company",
      "business",
      "organization",
      "creator"
    ]);


  const category =
    first(data,[
      "category",
      "type",
      "industry",
      "sector"
    ]);


  const location =
    first(data,[
      "location",
      "country",
      "address"
    ]);


  const email =
    first(data,[
      "email",
      "contactEmail"
    ]);


  const imageHTML = image

    ? `
      <img
        src="${escapeHTML(image)}"
        alt="${escapeHTML(title)}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="placeholder"
        style="display:none;"
      >
        🌐
      </div>
    `

    : `
      <div class="placeholder">
        🌐
      </div>
    `;


  let infoHTML = "";


  if(owner){

    infoHTML += `
      <div class="info">

        <div class="label">
          Owner
        </div>

        <div class="value">
          ${escapeHTML(owner)}
        </div>

      </div>
    `;

  }


  if(category){

    infoHTML += `
      <div class="info">

        <div class="label">
          Category
        </div>

        <div class="value">
          ${escapeHTML(category)}
        </div>

      </div>
    `;

  }


  if(location){

    infoHTML += `
      <div class="info">

        <div class="label">
          Location
        </div>

        <div class="value">
          ${escapeHTML(location)}
        </div>

      </div>
    `;

  }


  if(email){

    infoHTML += `
      <div class="info">

        <div class="label">
          Email
        </div>

        <div class="value">
          ${escapeHTML(email)}
        </div>

      </div>
    `;

  }


  let actionsHTML = "";


  if(websiteURL){

    actionsHTML += `
      <a
        class="btn primary"
        href="${escapeHTML(websiteURL)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visit Website →
      </a>
    `;

  }


  if(email){

    actionsHTML += `
      <a
        class="btn secondary"
        href="mailto:${escapeHTML(email)}"
      >
        Contact
      </a>
    `;

  }


  websiteCard.innerHTML = `

    <div class="hero-image">

      ${imageHTML}

    </div>


    <div class="content">

      <span class="badge">
        WEBSITE
      </span>


      <h1>
        ${escapeHTML(title)}
      </h1>


      ${
        tagline
        ? `
          <div class="tagline">
            ${escapeHTML(tagline)}
          </div>
        `
        : ""
      }


      <div class="description">
        ${escapeHTML(description)}
      </div>


      ${
        actionsHTML
        ? `
          <section class="section">

            <h2>
              Explore
            </h2>

            <div class="actions">
              ${actionsHTML}
            </div>

          </section>
        `
        : ""
      }


      ${
        infoHTML
        ? `
          <section class="section">

            <h2>
              Website Information
            </h2>

            <div class="info-grid">
              ${infoHTML}
            </div>

          </section>
        `
        : ""
      }

    </div>

  `;


  document.title =
    title + " | LetsStudy Pro";

}


async function loadWebsite(){

  if(!websiteId){

    websiteCard.innerHTML = `

      <div class="error">

        <h2>
          Website not found
        </h2>

        <p>
          No website ID was provided.
        </p>

      </div>

    `;

    return;

  }


  try{

    const websiteRef =
      doc(
        db,
        "websites",
        websiteId
      );


    const snapshot =
      await getDoc(websiteRef);


    if(!snapshot.exists()){

      websiteCard.innerHTML = `

        <div class="error">

          <h2>
            Website not found
          </h2>

          <p>
            The requested website could not be found.
          </p>

        </div>

      `;

      return;

    }


    renderWebsite(
      snapshot.data()
    );


  }catch(error){

    console.error(
      "Website loading error:",
      error
    );


    websiteCard.innerHTML = `

      <div class="error">

        <h2>
          Unable to load website
        </h2>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


loadWebsite();

</script>

</body>
</html>
