/* HEADER */

}

  overflow:hidden;

.cover img{

}

.hero-content{

}

.website-title{

}

.tagline{

  margin-bottom:18px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.badge{
  background:#eff6ff;
  color:#2563eb;
  padding:7px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
}

/* MAIN */

  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:25px;

}

}

.description{

/* SIDEBAR */

.sidebar-card{

.website-button{
  display:block;
  width:100%;

.info-list{

  border-bottom:1px solid #edf0f4;
}

.info-list li:last-child{

.info-label{

}

.info-value{

  overflow-wrap:anywhere;

.info-value a{

/* SOCIAL */

.social-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);

.social{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:11px;

  border:1px solid #e5e7eb;

}

}

/* STATES */

.error{
  min-height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;

/* FOOTER */

/* MOBILE */

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",

  authDomain:
    "let-s-study-pro-course.firebaseapp.com",

  databaseURL:
    "https://let-s-study-pro-course-default-rtdb.firebaseio.com",

  projectId:
    "let-s-study-pro-course",

  storageBucket:
    "let-s-study-pro-course.firebasestorage.app",

  messagingSenderId:
    "474928293390",

  appId:
    "1:474928293390:web:2bcc2aebf2351c12a9fe5f",

  measurementId:
    "G-85B7V5H5J0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const websitePage =
  document.getElementById(
    "websitePage"
  );


/* =========================
   HELPERS
========================= */

function firstValue(
  data,
  fields,
  fallback = ""
){

  for(
    const field of fields
  ){

    if(
      data[field] !== undefined &&
      data[field] !== null &&
      String(data[field]).trim() !== ""
    ){

      return data[field];

    }

  }

  return fallback;

}


function cleanUrl(url){

  if(!url)
    return "";

  let value =
    String(url).trim();

  if(
    !/^https?:\/\//i.test(value)
  ){

    value =
      "https://" + value;

  }

  return value;

}


function safeText(value){

  return String(
    value ?? ""
  );

}


function escapeHTML(value){

  return safeText(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(value){

  if(!value)
    return "";

  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value
        .toDate()
        .toLocaleDateString(
          undefined,
          {
            year:"numeric",
            month:"long",
            day:"numeric"
          }
        );

    }

    const date =
      new Date(value);

    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "";

    }

    return date.toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

  }catch{

    return "";

  }

}


/* =========================
   SOCIAL
========================= */

function addSocial(
  container,
  name,
  url
){

  if(!url)
    return false;


  const link =
    document.createElement("a");

  link.className =
    "social";

  link.href =
    cleanUrl(url);

  link.target =
    "_blank";

  link.rel =
    "noopener noreferrer";

  link.textContent =
    name;


  container.appendChild(link);

  return true;

}


/* =========================
   LOAD WEBSITE
========================= */

async function loadWebsite(){

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );

    const websiteId =
      params.get("id");


    if(!websiteId){

      throw new Error(
        "No website ID was provided."
      );

    }


    const websiteRef =
      doc(
        db,
        "indexedWebsites",
        websiteId
      );


    const snapshot =
      await getDoc(
        websiteRef
      );


    if(!snapshot.exists()){

      throw new Error(
        "Website document does not exist."
      );

    }


    const data =
      snapshot.data() || {};


    /* =====================
       BASIC DATA
    ===================== */

    const title =
      firstValue(
        data,
        [
          "title",
          "name",
          "websiteTitle"
        ],
        "Untitled Website"
      );


    const description =
      firstValue(
        data,
        [
          "description",
          "about",
          "content",
          "details"
        ],
        "No description available."
      );


    const tagline =
      firstValue(
        data,
        [
          "tagline",
          "subtitle",
          "headline"
        ],
        ""
      );


    const image =
      firstValue(
        data,
        [
          "image",
          "imageUrl",
          "thumbnail",
          "photo",
          "logo"
        ],
        "https://via.placeholder.com/1200x500?text=Website"
      );


    const url =
      firstValue(
        data,
        [
          "url",
          "website",
          "websiteUrl",
          "link"
        ],
        ""
      );


    const domain =
      firstValue(
        data,
        [
          "domain"
        ],
        ""
      );


    const category =
      firstValue(
        data,
        [
          "category",
          "type",
          "industry",
          "sector"
        ],
        ""
      );


    const ownerId =
      firstValue(
        data,
        [
          "ownerId",
          "owner",
          "userId"
        ],
        ""
      );


    const status =
      firstValue(
        data,
        [
          "status"
        ],
        "pending"
      );


    /* =====================
       HERO
    ===================== */

    document.getElementById(
      "websiteTitle"
    ).textContent =
      title;


    document.getElementById(
      "websiteTagline"
    ).textContent =
      tagline;


    if(!tagline){

      document.getElementById(
        "websiteTagline"
      ).style.display =
        "none";

    }


    const imageElement =
      document.getElementById(
        "websiteImage"
      );

    imageElement.src =
      image;

    imageElement.alt =
      title;


    imageElement.onerror =
      function(){

        this.src =
          "https://via.placeholder.com/1200x500?text=Website";

      };


    /* =====================
       META
    ===================== */

    const meta =
      document.getElementById(
        "meta"
      );

    meta.innerHTML = "";


    if(category){

      const badge =
        document.createElement(
          "span"
        );

      badge.className =
        "badge";

      badge.textContent =
        category;

      meta.appendChild(
        badge
      );

    }


    if(status){

      const badge =
        document.createElement(
          "span"
        );

      badge.className =
        "badge";

      badge.textContent =
        String(status)
          .charAt(0)
          .toUpperCase()
        +
        String(status)
          .slice(1);

      meta.appendChild(
        badge
      );

    }


    /* =====================
       DESCRIPTION
    ===================== */

    document.getElementById(
      "websiteDescription"
    ).textContent =
      description;


    /* =====================
       KEYWORDS
    ===================== */

    const keywords =
      firstValue(
        data,
        [
          "keywords",
          "tags"
        ],
        ""
      );


    if(keywords){

      document.getElementById(
        "keywords"
      ).textContent =
        Array.isArray(keywords)
          ? keywords.join(", ")
          : keywords;

      document.getElementById(
        "keywordsCard"
      ).style.display =
        "block";

    }


    /* =====================
       WEBSITE BUTTON
    ===================== */

    if(url){

      const websiteUrl =
        cleanUrl(url);

      const button =
        document.getElementById(
          "visitWebsite"
        );

      button.href =
        websiteUrl;

    }else{

      document.getElementById(
        "visitWebsite"
      ).style.display =
        "none";

    }


    /* =====================
       INFO
    ===================== */

    if(domain){

      document.getElementById(
        "domain"
      ).textContent =
        domain;

    }else{

      document.getElementById(
        "domainItem"
      ).style.display =
        "none";

    }


    if(category){

      document.getElementById(
        "category"
      ).textContent =
        category;

    }else{

      document.getElementById(
        "categoryItem"
      ).style.display =
        "none";

    }


    if(ownerId){

      document.getElementById(
        "ownerId"
      ).textContent =
        ownerId;

    }else{

      document.getElementById(
        "ownerItem"
      ).style.display =
        "none";

    }


    if(status){

      document.getElementById(
        "status"
      ).textContent =
        String(status)
          .charAt(0)
          .toUpperCase()
        +
        String(status)
          .slice(1);

    }else{

      document.getElementById(
        "statusItem"
      ).style.display =
        "none";

    }


    const indexedDate =
      formatDate(
        data.indexedAt
      );


    if(indexedDate){

      document.getElementById(
        "indexedAt"
      ).textContent =
        indexedDate;

    }else{

      document.getElementById(
        "indexedItem"
      ).style.display =
        "none";

    }


    /* =====================
       SOCIAL LINKS
    ===================== */

    const socialContainer =
      document.getElementById(
        "socialLinks"
      );

    socialContainer.innerHTML =
      "";


    let socialCount = 0;


    const socialFields = [

      [
        "Facebook",
        "facebook"
      ],

      [
        "Instagram",
        "instagram"
      ],

      [
        "YouTube",
        "youtube"
      ],

      [
        "TikTok",
        "tiktok"
      ],

      [
        "LinkedIn",
        "linkedin"
      ],

      [
        "X",
        "x"
      ],

      [
        "Pinterest",
        "pinterest"
      ],

      [
        "Telegram",
        "telegram"
      ],

      [
        "WhatsApp",
        "whatsapp"
      ]

    ];


    socialFields.forEach(
      ([name,field]) => {

        const value =
          data[field];

        if(value){

          if(
            addSocial(
              socialContainer,
              name,
              value
            )
          ){

            socialCount++;

          }

        }

      }
    );


    if(socialCount > 0){

      document.getElementById(
        "socialCard"
      ).style.display =
        "block";

    }


    /* =====================
       SHOW PAGE
    ===================== */

    loading.style.display =
      "none";

    websitePage.style.display =
      "block";


  }catch(error){

    console.error(
      "Website loading error:",
      error
    );


    loading.style.display =
      "none";


    document.getElementById(
      "errorMessage"
    ).textContent =
      error.message ||
      "Unable to load this website.";


    errorBox.style.display =
      "flex";

  }

}


loadWebsite();

</script>
