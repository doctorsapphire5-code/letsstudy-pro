<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Website Pages</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  width:min(1150px,94%);
  margin:auto;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:17px 0;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#2563eb;
  font-weight:900;
  font-size:20px;
}

.back{
  text-decoration:none;
  color:#64748b;
  font-size:13px;
  font-weight:700;
}

main{
  padding:30px 0 60px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.top h1{
  font-size:30px;
  margin-bottom:5px;
}

.top p{
  color:#64748b;
  font-size:13px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:800;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.primary:hover{
  background:#1d4ed8;
}

.secondary{
  background:#e2e8f0;
  color:#172033;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.toolbar{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:13px;
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search{
  flex:1;
  padding:11px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none;
}

.pages{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.page-card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
  overflow:hidden;
  transition:.2s;
}

.page-card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px #0000000c;
}

.page-preview{
  height:150px;
  padding:17px;
  background:linear-gradient(
    135deg,
    #dbeafe,
    #eff6ff
  );
}

.page-preview.green{
  background:linear-gradient(
    135deg,
    #dcfce7,
    #f0fdf4
  );
}

.page-preview.purple{
  background:linear-gradient(
    135deg,
    #ede9fe,
    #faf5ff
  );
}

.preview-nav{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  font-weight:800;
}

.preview-title{
  text-align:center;
  margin-top:40px;
  font-size:23px;
  font-weight:900;
}

.page-info{
  padding:16px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:6px;
}

.home-badge{
  font-size:9px;
  background:#dcfce7;
  color:#15803d;
  padding:4px 6px;
  border-radius:20px;
}

.page-info p{
  font-size:12px;
  color:#64748b;
  margin-bottom:12px;
}

.status{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  background:#f1f5f9;
  font-size:10px;
  font-weight:800;
  margin-bottom:13px;
}

.status.published{
  background:#dcfce7;
  color:#15803d;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.actions button{
  padding:9px;
  font-size:11px;
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:45px;
  text-align:center;
  color:#64748b;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:min(500px,100%);
  border-radius:15px;
  padding:23px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  width:auto;
  padding:8px 12px;
}

.group{
  margin-bottom:14px;
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none;
  font:inherit;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.form-actions button{
  flex:1;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#172033;
  color:#fff;
  padding:13px 17px;
  border-radius:9px;
  font-size:12px;
  display:none;
  z-index:50;
}

.toast.show{
  display:block;
}

@media(max-width:850px){
  .pages{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  .toolbar{
    flex-direction:column;
  }

  .pages{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">
📄 Website Pages
</div>

<a
class="back"
href="dashboard.html">
← Dashboard
</a>

</div>
</header>


<main class="container">

<section class="top">

<div>

<h1>Website Pages</h1>

<p>
Create and manage all pages in your website.
</p>

</div>

<button
class="primary"
id="addPageBtn">
＋ Add New Page
</button>

</section>


<div class="toolbar">

<input
class="search"
id="search"
placeholder="Search pages...">

<button
class="secondary"
id="homeBtn">
Set Home
</button>

</div>


<section
class="pages"
id="pagesContainer">
</section>

</main>


<!-- ADD / EDIT MODAL -->

<div
class="modal"
id="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
Add New Page
</h2>

<button
class="secondary close"
id="closeModal">
✕
</button>

</div>


<form id="pageForm">

<div class="group">

<label>
Page Name
</label>

<input
id="pageName"
required
placeholder="e.g. About Us">

</div>


<div class="group">

<label>
URL / Slug
</label>

<input
id="pageSlug"
required
placeholder="about-us">

</div>


<div class="group">

<label>
Page Description
</label>

<textarea
id="pageDescription"
placeholder="Describe this page..."></textarea>

</div>


<div class="group">

<label>
Page Status
</label>

<select id="pageStatus">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>

</div>


<div class="form-actions">

<button
type="button"
class="secondary"
id="cancelBtn">
Cancel
</button>

<button
type="submit"
class="primary">
Save Page
</button>

</div>

</form>

</div>

</div>


<div
class="toast"
id="toast">
Saved successfully.
</div>


<script>

const pagesContainer =
document.getElementById(
"pagesContainer"
);

const modal =
document.getElementById(
"modal"
);

const pageForm =
document.getElementById(
"pageForm"
);

const pageName =
document.getElementById(
"pageName"
);

const pageSlug =
document.getElementById(
"pageSlug"
);

const pageDescription =
document.getElementById(
"pageDescription"
);

const pageStatus =
document.getElementById(
"pageStatus"
);

const search =
document.getElementById(
"search"
);

let editingId = null;


/* DEFAULT PAGES */

let pages =
JSON.parse(
localStorage.getItem(
"websitePages"
) || "null"
);


if(!pages){

pages = [

{
id:Date.now(),
name:"Home",
slug:"/",
description:
"Main landing page.",
status:"published",
home:true,
color:"blue"
},

{
id:Date.now()+1,
name:"About",
slug:"about",
description:
"Information about the business.",
status:"published",
home:false,
color:"green"
},

{
id:Date.now()+2,
name:"Services",
slug:"services",
description:
"Services offered by the business.",
status:"draft",
home:false,
color:"purple"
}

];

savePages();

}


/* SAVE */

function savePages(){

localStorage.setItem(
"websitePages",
JSON.stringify(pages)
);

}


/* RENDER */

function renderPages(){

const query =
search.value
.toLowerCase()
.trim();

const filtered =
pages.filter(page =>
page.name
.toLowerCase()
.includes(query) ||
page.slug
.toLowerCase()
.includes(query)
);


if(!filtered.length){

pagesContainer.innerHTML = `
<div class="empty">
<h3>No pages found</h3>
<p style="margin-top:7px">
Create a new page or change your search.
</p>
</div>
`;

return;

}


pagesContainer.innerHTML =
filtered.map(
(page,index) => `

<article
class="page-card">

<div
class="page-preview ${page.color || "blue"}">

<div class="preview-nav">

<span>
${escapeHTML(page.name)}
</span>

<span>
Edit&nbsp; Preview
</span>

</div>

<div class="preview-title">
${escapeHTML(page.name)}
</div>

</div>


<div class="page-info">

<div class="page-title">

<h3>
${escapeHTML(page.name)}
</h3>

${
page.home
?
`<span class="home-badge">
HOME
</span>`
:
""
}

</div>


<p>
${escapeHTML(
page.description ||
"No description"
)}
</p>


<span
class="status ${page.status}">
${page.status.toUpperCase()}
</span>


<div class="actions">

<button
class="primary"
data-edit="${page.id}">
Edit
</button>

<button
class="secondary"
data-duplicate="${page.id}">
Duplicate
</button>

<button
class="secondary"
data-home="${page.id}">
Set Home
</button>

<button
class="danger"
data-delete="${page.id}">
Delete
</button>

</div>

</div>

</article>

`
).join("");


attachEvents();

}


/* EVENTS */

function attachEvents(){

document
.querySelectorAll(
"[data-edit]"
)
.forEach(button => {

button.onclick = () => {

const page =
pages.find(
item =>
String(item.id) ===
String(button.dataset.edit)
);

openEdit(page);

};

});


document
.querySelectorAll(
"[data-delete]"
)
.forEach(button => {

button.onclick = () => {

deletePage(
button.dataset.delete
);

};

});


document
.querySelectorAll(
"[data-duplicate]"
)
.forEach(button => {

button.onclick = () => {

duplicatePage(
button.dataset.duplicate
);

};

});


document
.querySelectorAll(
"[data-home]"
)
.forEach(button => {

button.onclick = () => {

setHome(
button.dataset.home
);

};

});

}


/* OPEN ADD */

document.getElementById(
"addPageBtn"
).onclick = () => {

editingId = null;

document.getElementById(
"modalTitle"
).textContent =
"Add New Page";

pageForm.reset();

modal.classList.add(
"show"
);

pageName.focus();

};


/* EDIT */

function openEdit(page){

editingId = page.id;

document.getElementById(
"modalTitle"
).textContent =
"Edit Page";

pageName.value =
page.name;

pageSlug.value =
page.slug;

pageDescription.value =
page.description || "";

pageStatus.value =
page.status;

modal.classList.add(
"show"
);

}


/* FORM SAVE */

pageForm.onsubmit =
function(event){

event.preventDefault();

const name =
pageName.value.trim();

const slug =
pageSlug.value.trim()
.replace(/\s+/g,"-")
.toLowerCase();

if(!name || !slug){

alert(
"Please complete the required fields."
);

return;

}


if(editingId){

const page =
pages.find(
item =>
item.id === editingId
);

if(page){

page.name =
name;

page.slug =
slug;

page.description =
pageDescription.value.trim();

page.status =
pageStatus.value;

}

showToast(
"Page updated successfully."
);

}else{

pages.push({

id:Date.now(),

name:name,

slug:slug,

description:
pageDescription.value.trim(),

status:
pageStatus.value,

home:false,

color:
randomColor(),

});

showToast(
"Page created successfully."
);

}


savePages();

renderPages();

closeModal();

};


/* DELETE */

function deletePage(id){

const page =
pages.find(
item =>
String(item.id) ===
String(id)
);

if(!page) return;


if(page.home){

alert(
"Home page cannot be deleted. Set another page as Home first."
);

return;

}


if(!confirm(
`Delete "${page.name}"?`
)) return;


pages =
pages.filter(
item =>
String(item.id) !==
String(id)
);

savePages();

renderPages();

showToast(
"Page deleted."
);

}


/* DUPLICATE */

function duplicatePage(id){

const page =
pages.find(
item =>
String(item.id) ===
String(id)
);

if(!page) return;


pages.push({

...page,

id:Date.now(),

name:
page.name + " Copy",

slug:
page.slug.replace(
/\/$/,
""
) + "-copy",

home:false

});

savePages();

renderPages();

showToast(
"Page duplicated."
);

}


/* SET HOME */

function setHome(id){

pages.forEach(
page => {

page.home =
String(page.id) ===
String(id);

});

savePages();

renderPages();

showToast(
"Home page updated."
);

}


/* HOME BUTTON */

document.getElementById(
"homeBtn"
).onclick = () => {

const currentHome =
pages.find(
page => page.home
);

if(currentHome){

alert(
`Current Home page: ${currentHome.name}`
);

}else{

alert(
"No Home page selected."
);

}

};


/* CLOSE MODAL */

function closeModal(){

modal.classList.remove(
"show"
);

editingId = null;

}


document.getElementById(
"closeModal"
).onclick =
closeModal;

document.getElementById(
"cancelBtn"
).onclick =
closeModal;


modal.onclick =
event => {

if(event.target === modal){

closeModal();

}

};


/* SEARCH */

search.oninput =
renderPages;


/* TOAST */

function showToast(message){

const toast =
document.getElementById(
"toast"
);

toast.textContent =
message;

toast.classList.add(
"show"
);

setTimeout(
() => {

toast.classList.remove(
"show"
);

},
2200
);

}


/* COLORS */

function randomColor(){

const colors =
[
"blue",
"green",
"purple"
];

return colors[
Math.floor(
Math.random() *
colors.length
)
];

}


/* ESCAPE */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* AUTO SLUG */

pageName.oninput =
function(){

if(!editingId){

pageSlug.value =
pageName.value
.trim()
.toLowerCase()
.replace(
/[^a-z0-9]+/g,
"-"
)
.replace(
/^-+|-+$/g,
""
);

}

};


/* START */

renderPages();

</script>

</body>
</html>
