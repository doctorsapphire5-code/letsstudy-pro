<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Website Preview</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#172033;
  height:100vh;
  overflow:hidden;
}

/* TOP BAR */

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid #dbe2ea;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:relative;
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:17px;
  font-weight:900;
  color:#2563eb;
}

.logo-icon{
  width:31px;
  height:31px;
  border-radius:8px;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

button{
  border:0;
  cursor:pointer;
  border-radius:8px;
  padding:9px 13px;
  font-weight:800;
  font-size:11px;
}

.icon-btn{
  background:#f1f5f9;
  color:#334155;
}

.icon-btn:hover{
  background:#e2e8f0;
}

.publish{
  background:#16a34a;
  color:#fff;
}

.back{
  text-decoration:none;
  color:#64748b;
  font-size:11px;
  font-weight:800;
  margin-right:8px;
}

/* TOOLBAR */

.toolbar{
  height:58px;
  background:#fff;
  border-bottom:1px solid #dbe2ea;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.device{
  background:#f1f5f9;
  color:#64748b;
}

.device.active{
  background:#2563eb;
  color:#fff;
}

.page-select{
  position:absolute;
  left:20px;
}

.page-select select{
  padding:8px 11px;
  border:1px solid #dbe2ea;
  border-radius:7px;
  background:#fff;
  font-size:11px;
  outline:none;
}

/* WORKSPACE */

.workspace{
  height:calc(100vh - 122px);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:18px;
  overflow:auto;
}

/* DEVICE FRAME */

.device-frame{
  width:100%;
  height:100%;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(15,23,42,.12);
  overflow:hidden;
  transition:.3s ease;
}

.device-frame.mobile{
  width:390px;
  min-height:650px;
  height:700px;
}

.device-frame.tablet{
  width:768px;
  height:850px;
}

.device-frame.desktop{
  width:100%;
  height:100%;
}

.preview-header{
  height:34px;
  background:#f8fafc;
  border-bottom:1px solid #e2e8f0;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:5px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#cbd5e1;
}

.preview-body{
  height:calc(100% - 34px);
  overflow:hidden;
  background:#fff;
}

iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

/* EMPTY */

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.empty-icon{
  font-size:50px;
  margin-bottom:12px;
}

.empty h2{
  font-size:20px;
  margin-bottom:7px;
}

.empty p{
  color:#64748b;
  font-size:12px;
  line-height:1.5;
}

/* FULLSCREEN */

body.fullscreen .topbar,
body.fullscreen .toolbar{
  display:none;
}

body.fullscreen .workspace{
  height:100vh;
  padding:0;
}

body.fullscreen .device-frame{
  width:100%;
  height:100%;
  border:0;
  border-radius:0;
  box-shadow:none;
}

body.fullscreen .preview-header{
  display:none;
}

body.fullscreen .preview-body{
  height:100%;
}

/* RESPONSIVE */

@media(max-width:700px){

  .topbar{
    padding:0 10px;
  }

  .logo span{
    display:none;
  }

  .back{
    display:none;
  }

  .page-select{
    position:static;
  }

  .toolbar{
    justify-content:space-between;
    padding:0 10px;
  }

  .workspace{
    padding:10px;
  }

  .device-frame.mobile{
    width:100%;
    height:100%;
  }

  .device-frame.tablet{
    width:100%;
    height:100%;
  }

  .top-actions button{
    padding:8px;
  }

  .top-actions .icon-btn:nth-child(2){
    display:none;
  }
}
</style>
</head>

<body>

<!-- TOP BAR -->

<header class="topbar">

<div class="logo">

<div class="logo-icon">
🌐
</div>

<span>Website Preview</span>

</div>


<div class="top-actions">

<a
href="website-dashboard.html"
class="back">
← Dashboard
</a>

<button
class="icon-btn"
id="editBtn">
✏️ Edit
</button>

<button
class="icon-btn"
id="refreshBtn">
↻ Refresh
</button>

<button
class="icon-btn"
id="fullscreenBtn">
⛶ Fullscreen
</button>

<button
class="publish"
id="publishBtn">
🚀 Publish
</button>

</div>

</header>


<!-- TOOLBAR -->

<div class="toolbar">

<div class="page-select">

<select id="pageSelect">

<option value="home">
Home
</option>

<option value="about">
About
</option>

<option value="services">
Services
</option>

<option value="contact">
Contact
</option>

</select>

</div>


<button
class="device active"
data-device="desktop">
🖥 Desktop
</button>

<button
class="device"
data-device="tablet">
📱 Tablet
</button>

<button
class="device"
data-device="mobile">
📱 Mobile
</button>

</div>


<!-- WORKSPACE -->

<main class="workspace">

<div
class="device-frame desktop"
id="deviceFrame">

<div class="preview-header">

<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>


<div class="preview-body">

<iframe
id="previewFrame"
title="Website Preview">
</iframe>


<div
class="empty"
id="emptyState"
style="display:none;">

<div>

<div class="empty-icon">
🌐
</div>

<h2>
No Website Yet
</h2>

<p>
Create or import a website first, then return here to preview it.
</p>

</div>

</div>

</div>

</div>

</main>


<script>

/*
  Website Preview
  Reads website data from localStorage.

  Supported storage keys:
  1. myWebsite
  2. generatedWebsite
  3. importedWebsite
*/


const frame =
document.getElementById(
"previewFrame"
);

const emptyState =
document.getElementById(
"emptyState"
);

const deviceFrame =
document.getElementById(
"deviceFrame"
);

const pageSelect =
document.getElementById(
"pageSelect"
);


/* GET SAVED WEBSITE */

function getWebsite(){

const keys = [
"myWebsite",
"generatedWebsite",
"importedWebsite"
];

for(
const key of keys
){

const value =
localStorage.getItem(
key
);

if(value){

try{

return {
key:key,
data:JSON.parse(value)
};

}
catch(error){

console.error(
"Invalid website data:",
key
);

}

}

}

return null;

}


/* BUILD WEBSITE */

function buildHTML(
website,
page
){

const name =
escapeHTML(
website.name ||
website.businessName ||
"My Business"
);

const description =
escapeHTML(
website.description ||
"Welcome to our website."
);

const color =
website.color ||
"#2563eb";


let title =
name;

let content =
description;

let button =
"Get Started";


if(page === "about"){

title =
"About " + name;

content =
"We are committed to providing excellent products and services to our customers. Learn more about our business and what makes us different.";

button =
"Contact Us";

}


if(page === "services"){

title =
"Our Services";

content =
"We provide professional solutions designed to help our customers achieve their goals.";

button =
"Explore Services";

}


if(page === "contact"){

title =
"Contact Us";

content =
"Have a question or want to work with us? Get in touch with our team today.";

button =
"Send Message";

}


if(
website.title &&
page === "home"
){

title =
escapeHTML(
website.title
);

}


if(
website.button &&
page === "home"
){

button =
escapeHTML(
website.button
);

}


return `

<!DOCTYPE html>

<html>

<head>

<meta
charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>${title}</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
color:#172033;
background:#fff;
}

nav{
height:64px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 7%;
border-bottom:1px solid #e5e7eb;
}

.logo{
font-size:18px;
font-weight:900;
color:${color};
}

.links{
display:flex;
gap:22px;
font-size:12px;
font-weight:700;
}

.links a{
color:#334155;
text-decoration:none;
}

.hero{
min-height:390px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:60px 25px;
background:#eff6ff;
}

.hero-inner{
max-width:700px;
}

h1{
font-size:48px;
line-height:1.1;
margin-bottom:17px;
}

.hero p{
font-size:15px;
line-height:1.7;
color:#64748b;
}

.btn{
display:inline-block;
margin-top:25px;
padding:13px 23px;
background:${color};
color:white;
text-decoration:none;
border-radius:7px;
font-size:12px;
font-weight:800;
}

section.cards{
padding:45px 7%;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.card{
padding:24px;
border:1px solid #e5e7eb;
border-radius:10px;
}

.card h3{
font-size:15px;
margin-bottom:9px;
}

.card p{
font-size:12px;
line-height:1.6;
color:#64748b;
}

footer{
padding:25px 7%;
background:#f8fafc;
text-align:center;
font-size:11px;
color:#64748b;
}

@media(max-width:650px){

.links{
display:none;
}

h1{
font-size:34px;
}

section.cards{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">
${name}
</div>

<div class="links">

<a href="#">
Home
</a>

<a href="#">
About
</a>

<a href="#">
Services
</a>

<a href="#">
Contact
</a>

</div>

</nav>


<section class="hero">

<div class="hero-inner">

<h1>
${title}
</h1>

<p>
${content}
</p>

<a
href="#"
class="btn">
${button}
</a>

</div>

</section>


<section class="cards">

<div class="card">

<h3>
Professional Service
</h3>

<p>
Quality solutions designed around your needs.
</p>

</div>


<div class="card">

<h3>
Trusted Business
</h3>

<p>
Reliable service and excellent customer experience.
</p>

</div>


<div class="card">

<h3>
Get Started
</h3>

<p>
Contact us today to learn more about what we offer.
</p>

</div>

</section>


<footer>

© ${new Date().getFullYear()}
${name}.
All rights reserved.

</footer>

</body>

</html>

`;

}


/* LOAD PREVIEW */

function loadPreview(){

const website =
getWebsite();


if(!website){

frame.style.display =
"none";

emptyState.style.display =
"flex";

return;

}


emptyState.style.display =
"none";

frame.style.display =
"block";


const page =
pageSelect.value;


frame.srcdoc =
buildHTML(
website.data,
page
);

}


/* ESCAPE HTML */

function escapeHTML(
value
){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* DEVICE SWITCHER */

document.querySelectorAll(
".device"
).forEach(
button => {

button.addEventListener(
"click",
() => {

document.querySelectorAll(
".device"
).forEach(
item =>
item.classList.remove(
"active"
)
);

button.classList.add(
"active"
);

const device =
button.dataset.device;


deviceFrame.classList.remove(
"desktop",
"tablet",
"mobile"
);

deviceFrame.classList.add(
device
);

});

});


/* PAGE SWITCH */

pageSelect.addEventListener(
"change",
loadPreview
);


/* REFRESH */

document.getElementById(
"refreshBtn"
).addEventListener(
"click",
() => {

loadPreview();

});


/* FULLSCREEN */

document.getElementById(
"fullscreenBtn"
).addEventListener(
"click",
() => {

document.body.classList.toggle(
"fullscreen"
);

});


/* EDIT */

document.getElementById(
"editBtn"
).addEventListener(
"click",
() => {

window.location.href =
"website-editor.html";

});


/* PUBLISH */

document.getElementById(
"publishBtn"
).addEventListener(
"click",
() => {

const website =
getWebsite();


if(!website){

alert(
"No website available to publish."
);

return;

}


const published = {

...website.data,

status:"published",

publishedAt:
new Date().toISOString()

};


localStorage.setItem(
"myWebsite",
JSON.stringify(
published
)
);


alert(
"Website published successfully!"
);

});


/* ESC KEY */

document.addEventListener(
"keydown",
event => {

if(
event.key === "Escape" &&
document.body.classList.contains(
"fullscreen"
)
){

document.body.classList.remove(
"fullscreen"
);

}

});


/* INITIAL LOAD */

loadPreview();

</script>

</body>
</html>
