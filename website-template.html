<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Website Templates</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  width:min(1150px,92%);
  margin:auto;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:18px 0;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:900;
  color:#2563eb;
}

nav a{
  color:#64748b;
  text-decoration:none;
  margin-left:18px;
  font-size:13px;
  font-weight:700;
}

main{
  padding:40px 0 60px;
}

.hero{
  text-align:center;
  margin-bottom:28px;
}

.hero h1{
  font-size:38px;
  margin-bottom:9px;
}

.hero p{
  color:#64748b;
}

.filters{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.filter{
  width:auto;
  padding:9px 15px;
  border:1px solid #dbe2ea;
  border-radius:20px;
  background:#fff;
  color:#64748b;
  cursor:pointer;
  font-weight:700;
}

.filter.active,
.filter:hover{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.templates{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:15px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px #0000000d;
}

.preview{
  height:190px;
  padding:20px;
  position:relative;
}

.preview.blue{
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
}

.preview.green{
  background:linear-gradient(135deg,#dcfce7,#f0fdf4);
}

.preview.purple{
  background:linear-gradient(135deg,#ede9fe,#faf5ff);
}

.preview.orange{
  background:linear-gradient(135deg,#ffedd5,#fff7ed);
}

.mini-nav{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  font-weight:900;
}

.mini-hero{
  margin-top:38px;
}

.mini-hero strong{
  display:block;
  font-size:21px;
  max-width:190px;
}

.mini-hero span{
  display:block;
  margin-top:8px;
  font-size:9px;
  color:#64748b;
}

.info{
  padding:17px;
}

.info h3{
  margin-bottom:6px;
}

.info p{
  color:#64748b;
  font-size:12px;
  line-height:1.5;
  min-height:36px;
}

.tags{
  display:flex;
  gap:6px;
  margin:12px 0;
}

.tag{
  padding:5px 8px;
  background:#f1f5f9;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
}

.actions{
  display:flex;
  gap:8px;
}

button{
  border:0;
  border-radius:8px;
  padding:10px;
  cursor:pointer;
  font-weight:800;
}

.use{
  flex:1;
  background:#2563eb;
  color:#fff;
}

.preview-btn{
  background:#e2e8f0;
  color:#172033;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  background:#fff;
  padding:40px;
  border-radius:12px;
  color:#64748b;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(800px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:15px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  width:auto;
  background:#e2e8f0;
}

.preview-large{
  min-height:350px;
  border-radius:12px;
  padding:35px;
  text-align:center;
}

.preview-large h2{
  font-size:38px;
  margin:50px 0 15px;
}

.preview-large p{
  max-width:500px;
  margin:auto;
  color:#64748b;
  line-height:1.6;
}

footer{
  background:#0f172a;
  color:#fff;
  padding:25px 0;
}

footer p{
  color:#94a3b8;
  font-size:13px;
  margin-top:5px;
}

@media(max-width:900px){
  .templates{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  nav{
    display:none;
  }

  .templates{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">🎨 Website Templates</div>

<nav>
<a href="#templates">Templates</a>
<a href="#saved">Saved</a>
</nav>

</div>
</header>


<main class="container">

<section class="hero">

<h1>Choose a Website Template</h1>

<p>
Start faster with a professionally structured website template.
</p>

</section>


<div class="filters">

<button class="filter active" data-category="all">
All
</button>

<button class="filter" data-category="business">
Business
</button>

<button class="filter" data-category="startup">
Startup
</button>

<button class="filter" data-category="portfolio">
Portfolio
</button>

<button class="filter" data-category="ecommerce">
E-commerce
</button>

<button class="filter" data-category="blog">
Blog
</button>

<button class="filter" data-category="landing">
Landing Page
</button>

</div>


<section
class="templates"
id="templates">

</section>


<section
id="saved"
style="margin-top:35px">

<h2 style="margin-bottom:15px">
⭐ Saved Templates
</h2>

<div
id="savedTemplates"
style="color:#64748b;font-size:13px">
No saved templates yet.
</div>

</section>

</main>


<footer>
<div class="container">

<strong>🎨 Website Templates</strong>

<p>
© <span id="year"></span> Website Builder
</p>

</div>
</footer>


<!-- MODAL -->

<div
class="modal"
id="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
Template Preview
</h2>

<button
class="close"
id="closeModal">
Close
</button>

</div>

<div
class="preview-large"
id="largePreview">

<h2 id="largeTitle">
Template
</h2>

<p id="largeDescription">
Template description.
</p>

<button
class="use"
style="width:auto;margin-top:25px">
Use This Template
</button>

</div>

</div>

</div>


<script>

const templates = [

{
id:1,
name:"Modern Business",
category:"business",
color:"blue",
title:"Grow Your Business",
description:"A clean professional template for modern businesses.",
tags:["Business","Modern"]
},

{
id:2,
name:"Startup Launch",
category:"startup",
color:"purple",
title:"Build Something Amazing",
description:"A bold landing page for startups and new products.",
tags:["Startup","SaaS"]
},

{
id:3,
name:"Creative Portfolio",
category:"portfolio",
color:"orange",
title:"Creative Work",
description:"Showcase your projects, skills and creative work.",
tags:["Portfolio","Creative"]
},

{
id:4,
name:"Online Store",
category:"ecommerce",
color:"green",
title:"Shop Everything",
description:"A simple storefront template for online products.",
tags:["Store","E-commerce"]
},

{
id:5,
name:"Personal Blog",
category:"blog",
color:"blue",
title:"Stories & Ideas",
description:"A minimal template for articles, stories and blogs.",
tags:["Blog","Writing"]
},

{
id:6,
name:"Product Landing",
category:"landing",
color:"orange",
title:"Your Product Starts Here",
description:"High-conversion landing page for a product or service.",
tags:["Landing","Marketing"]
},

{
id:7,
name:"Agency Pro",
category:"business",
color:"purple",
title:"Creative Digital Agency",
description:"Professional layout for agencies and consultants.",
tags:["Agency","Business"]
},

{
id:8,
name:"Tech Startup",
category:"startup",
color:"green",
title:"The Future Is Digital",
description:"Modern technology-focused startup website.",
tags:["Technology","Startup"]
},

{
id:9,
name:"Designer Portfolio",
category:"portfolio",
color:"purple",
title:"Design With Purpose",
description:"Elegant portfolio for designers and freelancers.",
tags:["Design","Portfolio"]
}

];


const templatesContainer =
document.getElementById(
"templates"
);

const filters =
document.querySelectorAll(
".filter"
);

const modal =
document.getElementById(
"modal"
);

let saved =
JSON.parse(
localStorage.getItem(
"websiteTemplates"
) || "[]"
);


function renderTemplates(
category="all"
){

const filtered =
category === "all"
? templates
: templates.filter(
template =>
template.category === category
);


if(!filtered.length){

templatesContainer.innerHTML =
`<div class="empty">
No templates found.
</div>`;

return;

}


templatesContainer.innerHTML =
filtered.map(
template => `

<article class="card">

<div class="preview ${template.color}">

<div class="mini-nav">

<span>
${template.name}
</span>

<span>
Home&nbsp;&nbsp;About&nbsp;&nbsp;Contact
</span>

</div>

<div class="mini-hero">

<strong>
${template.title}
</strong>

<span>
${template.description}
</span>

</div>

</div>


<div class="info">

<h3>
${template.name}
</h3>

<p>
${template.description}
</p>


<div class="tags">

${template.tags.map(
tag =>
`<span class="tag">
${tag}
</span>`
).join("")}

</div>


<div class="actions">

<button
class="use"
data-use="${template.id}">
Use Template
</button>

<button
class="preview-btn"
data-preview="${template.id}">
Preview
</button>

</div>

</div>

</article>

`
).join("");


attachButtons();

}


function attachButtons(){

document
.querySelectorAll(
"[data-preview]"
)
.forEach(button => {

button.addEventListener(
"click",
() => {

const template =
templates.find(
item =>
item.id ==
button.dataset.preview
);

openPreview(template);

});

});


document
.querySelectorAll(
"[data-use]"
)
.forEach(button => {

button.addEventListener(
"click",
() => {

const template =
templates.find(
item =>
item.id ==
button.dataset.use
);

useTemplate(template);

});

});

}


function openPreview(template){

document.getElementById(
"modalTitle"
).textContent =
template.name;

document.getElementById(
"largeTitle"
).textContent =
template.title;

document.getElementById(
"largeDescription"
).textContent =
template.description;

const preview =
document.getElementById(
"largePreview"
);

preview.className =
"preview-large " +
template.color;

modal.classList.add(
"show"
);

}


function useTemplate(template){

localStorage.setItem(
"selectedWebsiteTemplate",
JSON.stringify(
template
)
);

alert(
template.name +
" has been selected for your website."
);

}


filters.forEach(
filter => {

filter.addEventListener(
"click",
() => {

filters.forEach(
item =>
item.classList.remove(
"active"
)
);

filter.classList.add(
"active"
);

renderTemplates(
filter.dataset.category
);

});

});


document.getElementById(
"closeModal"
).addEventListener(
"click",
() => {

modal.classList.remove(
"show"
);

});


modal.addEventListener(
"click",
event => {

if(event.target === modal){

modal.classList.remove(
"show"
);

}

});


document.getElementById(
"year"
).textContent =
new Date().getFullYear();


renderTemplates();

</script>

</body>
</html>
