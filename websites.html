<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Websites</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.container{
  width:min(1150px,94%);
  margin:auto;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:15px 0;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#2563eb;
  font-size:20px;
  font-weight:900;
}

.nav-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

a{
  text-decoration:none;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-size:11px;
  font-weight:800;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.gray{
  background:#e2e8f0;
  color:#172033;
}

main{
  padding:30px 0 60px;
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:22px;
}

.hero h1{
  font-size:30px;
  margin-bottom:7px;
}

.hero p{
  color:#64748b;
  font-size:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:22px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:17px;
}

.stat-label{
  color:#64748b;
  font-size:10px;
  margin-bottom:8px;
}

.stat-value{
  font-size:21px;
  font-weight:900;
}

.toolbar{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:12px;
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  padding:11px 12px 11px 35px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none;
}

.search-icon{
  position:absolute;
  left:12px;
  top:11px;
  color:#94a3b8;
  font-size:13px;
}

select{
  padding:10px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:none;
  background:#fff;
  font-size:11px;
}

.websites{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.website-card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  overflow:hidden;
  transition:.2s;
}

.website-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(15,23,42,.08);
}

.thumbnail{
  height:150px;
  background:#eff6ff;
  position:relative;
  overflow:hidden;
}

.fake-browser{
  position:absolute;
  inset:14px 14px 0;
  background:#fff;
  border-radius:7px 7px 0 0;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(15,23,42,.1);
}

.fake-top{
  height:22px;
  background:#f8fafc;
  display:flex;
  gap:3px;
  align-items:center;
  padding-left:8px;
}

.fake-dot{
  width:5px;
  height:5px;
  background:#cbd5e1;
  border-radius:50%;
}

.fake-nav{
  height:25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 9px;
  border-bottom:1px solid #f1f5f9;
}

.fake-logo{
  width:45px;
  height:5px;
  border-radius:4px;
  background:#2563eb;
}

.fake-links{
  width:60px;
  height:4px;
  border-radius:4px;
  background:#cbd5e1;
}

.fake-hero{
  height:60px;
  background:#eff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.fake-title{
  width:75px;
  height:8px;
  border-radius:5px;
  background:#172033;
}

.fake-content{
  display:flex;
  gap:5px;
  padding:9px;
}

.fake-box{
  height:25px;
  flex:1;
  border:1px solid #e2e8f0;
  border-radius:4px;
}

.status{
  position:absolute;
  right:10px;
  top:10px;
  padding:5px 8px;
  border-radius:20px;
  font-size:8px;
  font-weight:900;
}

.published{
  background:#dcfce7;
  color:#166534;
}

.draft{
  background:#fef3c7;
  color:#92400e;
}

.website-info{
  padding:16px;
}

.website-name{
  font-size:15px;
  font-weight:900;
  margin-bottom:5px;
}

.website-url{
  color:#64748b;
  font-size:10px;
  margin-bottom:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  display:flex;
  justify-content:space-between;
  color:#64748b;
  font-size:9px;
  padding-bottom:13px;
  border-bottom:1px solid #eef2f7;
}

.actions{
  display:flex;
  gap:6px;
  margin-top:13px;
}

.actions button{
  flex:1;
  padding:9px 5px;
  font-size:9px;
}

.open{
  background:#2563eb;
  color:#fff;
}

.edit{
  background:#f1f5f9;
  color:#334155;
}

.more{
  background:#f1f5f9;
  color:#334155;
  flex:0 0 35px!important;
}

.empty{
  display:none;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:60px 20px;
  text-align:center;
}

.empty-icon{
  font-size:45px;
  margin-bottom:12px;
}

.empty h2{
  font-size:19px;
  margin-bottom:7px;
}

.empty p{
  color:#64748b;
  font-size:11px;
  margin-bottom:17px;
}

@media(max-width:900px){
  .websites{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .hero{
    align-items:flex-start;
    flex-direction:column;
  }

  .toolbar{
    flex-direction:column;
  }

  .websites{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .nav-actions .gray{
    display:none;
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">
🌐 My Websites
</div>

<div class="nav-actions">

<a
href="website-dashboard.html"
class="btn gray">
Dashboard
</a>

<a
href="website-generator.html"
class="btn primary">
+ Create Website
</a>

</div>

</div>
</header>


<main class="container">

<section class="hero">

<div>
<h1>Websites</h1>

<p>
Create, manage, edit and publish all your websites from one place.
</p>
</div>

<a
href="website-generator.html"
class="btn primary">
✨ Generate Website
</a>

</section>


<!-- STATS -->

<section class="stats">

<div class="stat">
<div class="stat-label">TOTAL WEBSITES</div>
<div class="stat-value" id="total">0</div>
</div>

<div class="stat">
<div class="stat-label">PUBLISHED</div>
<div class="stat-value" id="published">0</div>
</div>

<div class="stat">
<div class="stat-label">DRAFTS</div>
<div class="stat-value" id="drafts">0</div>
</div>

<div class="stat">
<div class="stat-label">DOMAINS</div>
<div class="stat-value" id="domains">0</div>
</div>

</section>


<!-- TOOLBAR -->

<section class="toolbar">

<div class="search">

<span class="search-icon">🔍</span>

<input
id="search"
placeholder="Search websites...">

</div>

<select id="filter">

<option value="all">
All Websites
</option>

<option value="published">
Published
</option>

<option value="draft">
Drafts
</option>

</select>

<select id="sort">

<option value="newest">
Newest
</option>

<option value="oldest">
Oldest
</option>

<option value="name">
Name
</option>

</select>

</section>


<!-- WEBSITE LIST -->

<section
class="websites"
id="websites">
</section>


<!-- EMPTY -->

<section
class="empty"
id="empty">

<div class="empty-icon">
🌐
</div>

<h2>
No websites found
</h2>

<p>
Create your first website and it will appear here.
</p>

<a
href="website-generator.html"
class="btn primary">
Create Website
</a>

</section>

</main>


<script>

const STORAGE_KEY =
"websites";


let websites =
JSON.parse(
localStorage.getItem(
STORAGE_KEY
) || "[]"
);


/* LOAD EXISTING SINGLE WEBSITE */

const singleWebsite =
JSON.parse(
localStorage.getItem(
"myWebsite"
) || "null"
);


if(
singleWebsite &&
websites.length === 0
){

websites = [
{
...singleWebsite,
id:Date.now().toString()
}
];

save();

}


/* SAMPLE DATA IF EMPTY */

if(
websites.length === 0
){

websites = [
{
id:"demo-1",
name:"Bright Solutions",
url:"brightsolutions.example",
status:"published",
type:"Business",
color:"#2563eb",
createdAt:
new Date(
Date.now()-86400000*3
).toISOString()
},

{
id:"demo-2",
name:"Creative Studio",
url:"creativestudio.example",
status:"draft",
type:"Portfolio",
color:"#7c3aed",
createdAt:
new Date(
Date.now()-86400000
).toISOString()
}
];

save();

}


/* SAVE */

function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(
websites
)
);

}


/* RENDER */

function render(){

const container =
document.getElementById(
"websites"
);

const empty =
document.getElementById(
"empty"
);

const query =
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

const filter =
document.getElementById(
"filter"
).value;

const sort =
document.getElementById(
"sort"
).value;


let list =
websites.filter(
website => {

const name =
(website.name || "")
.toLowerCase();

const url =
(website.url || "")
.toLowerCase();

const matchesSearch =
name.includes(query) ||
url.includes(query);

const status =
website.status === "published"
? "published"
: "draft";

const matchesFilter =
filter === "all" ||
status === filter;

return (
matchesSearch &&
matchesFilter
);

});


/* SORT */

if(sort === "newest"){

list.sort(
(a,b) =>
new Date(
b.createdAt || 0
) -
new Date(
a.createdAt || 0
)
);

}

if(sort === "oldest"){

list.sort(
(a,b) =>
new Date(
a.createdAt || 0
) -
new Date(
b.createdAt || 0
)
);

}

if(sort === "name"){

list.sort(
(a,b) =>
(a.name || "")
.localeCompare(
b.name || ""
)
);

}


container.innerHTML = "";


if(list.length === 0){

empty.style.display =
"block";

}else{

empty.style.display =
"none";

list.forEach(
website =>
container.appendChild(
createCard(
website
)
)
);

}


updateStats();

}


/* CARD */

function createCard(
website
){

const card =
document.createElement(
"article"
);

card.className =
"website-card";


const published =
website.status ===
"published";


const color =
website.color ||
"#2563eb";


const date =
website.createdAt
? new Date(
website.createdAt
).toLocaleDateString()
: "—";


card.innerHTML = `

<div
class="thumbnail"
style="background:${escapeHTML(color)}18">

<div class="status ${
published
? "published"
: "draft"
}">

${
published
? "PUBLISHED"
: "DRAFT"
}

</div>


<div class="fake-browser">

<div class="fake-top">

<span class="fake-dot"></span>
<span class="fake-dot"></span>
<span class="fake-dot"></span>

</div>

<div class="fake-nav">

<div
class="fake-logo"
style="background:${escapeHTML(color)}">
</div>

<div class="fake-links"></div>

</div>

<div
class="fake-hero"
style="background:${escapeHTML(color)}12">

<div class="fake-title"></div>

</div>

<div class="fake-content">

<div class="fake-box"></div>
<div class="fake-box"></div>
<div class="fake-box"></div>

</div>

</div>

</div>


<div class="website-info">

<div class="website-name">
${escapeHTML(
website.name ||
"My Website"
)}
</div>

<div class="website-url">
${escapeHTML(
website.url ||
"Not connected"
)}
</div>


<div class="meta">

<span>
${escapeHTML(
website.type ||
"Website"
)}
</span>

<span>
${date}
</span>

</div>


<div class="actions">

<button
class="open"
onclick="openWebsite('${escapeJS(website.id)}')">
Preview
</button>

<button
class="edit"
onclick="editWebsite('${escapeJS(website.id)}')">
Edit
</button>

<button
class="more"
onclick="deleteWebsite('${escapeJS(website.id)}')">
⋮
</button>

</div>

</div>

`;

return card;

}


/* STATS */

function updateStats(){

const total =
websites.length;

const published =
websites.filter(
w => w.status === "published"
).length;

const drafts =
total - published;

const domains =
websites.filter(
w => w.url &&
w.url !== "Not connected"
).length;


document.getElementById(
"total"
).textContent =
total;

document.getElementById(
"published"
).textContent =
published;

document.getElementById(
"drafts"
).textContent =
drafts;

document.getElementById(
"domains"
).textContent =
domains;

}


/* PREVIEW */

function openWebsite(
id
){

const website =
websites.find(
w => w.id === id
);

if(!website)
return;


localStorage.setItem(
"myWebsite",
JSON.stringify(
website
)
);


window.location.href =
"website-preview.html";

}


/* EDIT */

function editWebsite(
id
){

const website =
websites.find(
w => w.id === id
);

if(!website)
return;


localStorage.setItem(
"myWebsite",
JSON.stringify(
website
)
);


window.location.href =
"website-editor.html";

}


/* DELETE */

function deleteWebsite(
id
){

const website =
websites.find(
w => w.id === id
);

if(!website)
return;


const confirmDelete =
confirm(
`Delete "${website.name || "this website"}"?`
);


if(!confirmDelete)
return;


websites =
websites.filter(
w => w.id !== id
);

save();

render();

}


/* SEARCH */

document.getElementById(
"search"
).addEventListener(
"input",
render
);


/* FILTER */

document.getElementById(
"filter"
).addEventListener(
"change",
render
);


/* SORT */

document.getElementById(
"sort"
).addEventListener(
"change",
render
);


/* ESCAPE */

function escapeHTML(
value
){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeJS(
value
){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


/* INITIALIZE */

render();

</script>

</body>
</html>
