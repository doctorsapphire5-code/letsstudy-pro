<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Campaigns | LetsStudy Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#128c7e;color:#fff;padding:16px 20px;font-size:20px;font-weight:800}
.container{max-width:1100px;margin:auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 10px #00000012}
.stat b{display:block;font-size:25px;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
input,textarea,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;margin:7px 0 13px;font:inherit}
textarea{min-height:130px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 16px;background:#128c7e;color:#fff;font-weight:700;cursor:pointer}
button:hover{opacity:.9}
.btn2{background:#2563eb}
.danger{background:#dc2626}
.list{margin-top:18px}
.campaign{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:13px 0}
.campaign:last-child{border:0}
.badge{padding:5px 9px;border-radius:20px;background:#dcfce7;color:#166534;font-size:12px}
.preview{background:#e7f7e9;padding:15px;border-radius:10px;white-space:pre-wrap;min-height:120px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
@media(max-width:700px){
.stats{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr}
.campaign{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>

<header>📱 LetsStudy Pro — WhatsApp Campaigns</header>

<div class="container">

<div class="stats">
<div class="card stat">Total <b id="total">0</b></div>
<div class="card stat">Drafts <b id="drafts">0</b></div>
<div class="card stat">Scheduled <b id="scheduled">0</b></div>
<div class="card stat">Sent <b id="sent">0</b></div>
</div>

<div class="grid">

<!-- CREATE -->
<div class="card">

<h2>Create Campaign</h2>

<input id="campaignId" type="hidden">

<label>Campaign Name</label>
<input id="name" placeholder="Course Promotion">

<label>Audience</label>
<select id="audience">
<option value="all">All Users</option>
<option value="students">Students</option>
<option value="premium">Premium Users</option>
<option value="leads">Leads</option>
</select>

<label>Phone Number</label>
<input id="phone" placeholder="255712345678">

<label>Message</label>
<textarea id="message"
placeholder="Hello {{name}}, check out our new course..."></textarea>

<label>Schedule</label>
<input id="schedule" type="datetime-local">

<div class="actions">
<button onclick="saveCampaign()">Save Campaign</button>
<button class="btn2" onclick="previewMessage()">Preview</button>
<button class="danger" onclick="clearForm()">Clear</button>
</div>

</div>

<!-- PREVIEW -->
<div class="card">

<h2>Message Preview</h2>

<div id="preview" class="preview">
Your message preview will appear here.
</div>

<br>

<button onclick="openWhatsApp()">
💬 Open WhatsApp
</button>

</div>

</div>


<!-- CAMPAIGNS -->
<div class="card list">

<h2>Campaigns</h2>

<input
id="search"
placeholder="Search campaigns..."
oninput="renderCampaigns()"
>

<div id="campaignList">
Loading...
</div>

</div>

</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
updateDoc,
deleteDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {
apiKey:"AIzaSyBcOYDfAVKXbkljsyRgI_0rjodBn678tCc",
authDomain:"let-s-study-pro-course.firebaseapp.com",
databaseURL:"https://let-s-study-pro-course-default-rtdb.firebaseio.com",
projectId:"let-s-study-pro-course",
storageBucket:"let-s-study-pro-course.firebasestorage.app",
messagingSenderId:"474928293390",
appId:"1:474928293390:web:2bcc2aebf2351c12a9fe5f",
measurementId:"G-85B7V5H5J0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const ref=collection(db,"whatsappCampaigns");

let campaigns=[];


/* ==============================
   SAVE
============================== */

window.saveCampaign=async()=>{

const name=document.getElementById("name").value.trim();
const audience=document.getElementById("audience").value;
const phone=document.getElementById("phone").value.trim();
const message=document.getElementById("message").value.trim();
const schedule=document.getElementById("schedule").value;

if(!name||!message){
alert("Campaign name and message are required.");
return;
}

const data={
name,
audience,
phone,
message,
schedule:schedule||null,
status:schedule?"scheduled":"draft",
createdAt:serverTimestamp(),
updatedAt:serverTimestamp()
};

try{

await addDoc(ref,data);

alert("Campaign saved successfully.");

clearForm();
loadCampaigns();

}catch(e){

console.error(e);
alert("Failed to save campaign.");

}

};


/* ==============================
   LOAD
============================== */

async function loadCampaigns(){

try{

const snap=await getDocs(ref);

campaigns=[];

snap.forEach(d=>{
campaigns.push({
id:d.id,
...d.data()
});
});

renderCampaigns();

}catch(e){

console.error(e);
document.getElementById("campaignList").textContent=
"Unable to load campaigns.";

}

}


/* ==============================
   RENDER
============================== */

window.renderCampaigns=()=>{

const query=
document.getElementById("search")
.value.toLowerCase();

const list=
document.getElementById("campaignList");

const filtered=
campaigns.filter(c=>
(c.name||"").toLowerCase().includes(query)
);

list.innerHTML="";

filtered.forEach(c=>{

const div=document.createElement("div");

div.className="campaign";

div.innerHTML=`

<div>
<strong>${escapeHtml(c.name||"Untitled")}</strong><br>
<small>
Audience: ${escapeHtml(c.audience||"all")}
</small>
<br>
<span class="badge">
${escapeHtml(c.status||"draft")}
</span>
</div>

<div class="actions">

<button
onclick="editCampaign('${c.id}')">
Edit
</button>

<button
onclick="sendCampaign('${c.id}')">
WhatsApp
</button>

<button
class="danger"
onclick="removeCampaign('${c.id}')">
Delete
</button>

</div>

`;

list.appendChild(div);

});

updateStats();

};


/* ==============================
   STATS
============================== */

function updateStats(){

document.getElementById("total")
.textContent=campaigns.length;

document.getElementById("drafts")
.textContent=
campaigns.filter(x=>x.status==="draft").length;

document.getElementById("scheduled")
.textContent=
campaigns.filter(x=>x.status==="scheduled").length;

document.getElementById("sent")
.textContent=
campaigns.filter(x=>x.status==="sent").length;

}


/* ==============================
   EDIT
============================== */

window.editCampaign=(id)=>{

const c=
campaigns.find(x=>x.id===id);

if(!c)return;

document.getElementById("campaignId").value=id;
document.getElementById("name").value=c.name||"";
document.getElementById("audience").value=c.audience||"all";
document.getElementById("phone").value=c.phone||"";
document.getElementById("message").value=c.message||"";
document.getElementById("schedule").value=c.schedule||"";

previewMessage();

};


/* ==============================
   DELETE
============================== */

window.removeCampaign=async(id)=>{

if(!confirm("Delete this campaign?"))return;

try{

await deleteDoc(
doc(db,"whatsappCampaigns",id)
);

loadCampaigns();

}catch(e){

console.error(e);
alert("Delete failed.");

}

};


/* ==============================
   WHATSAPP
============================== */

window.sendCampaign=async(id)=>{

const c=
campaigns.find(x=>x.id===id);

if(!c)return;

if(!c.phone){

alert("This campaign has no phone number.");
return;

}

const phone=
c.phone.replace(/\D/g,"");

const text=
encodeURIComponent(c.message||"");

window.open(
`https://wa.me/${phone}?text=${text}`,
"_blank"
);

try{

await updateDoc(
doc(db,"whatsappCampaigns",id),
{
status:"sent",
updatedAt:serverTimestamp()
}
);

loadCampaigns();

}catch(e){

console.error(e);

}

};


/* ==============================
   PREVIEW
============================== */

window.previewMessage=()=>{

let text=
document.getElementById("message").value;

text=
text.replaceAll(
"{{name}}",
"Student"
);

text=
text.replaceAll(
"{{course}}",
"Complete Web Development Course"
);

document.getElementById("preview")
.textContent=text||
"Your message preview will appear here.";

};


/* ==============================
   OPEN WHATSAPP
============================== */

window.openWhatsApp=()=>{

const phone=
document.getElementById("phone")
.value.trim()
.replace(/\D/g,"");

let message=
document.getElementById("message")
.value.trim();

if(!phone||!message){

alert("Enter phone number and message.");
return;

}

message=
message.replaceAll(
"{{name}}",
"Student"
);

window.open(
`https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
"_blank"
);

};


/* ==============================
   CLEAR
============================== */

window.clearForm=()=>{

document.getElementById("campaignId").value="";
document.getElementById("name").value="";
document.getElementById("audience").value="all";
document.getElementById("phone").value="";
document.getElementById("message").value="";
document.getElementById("schedule").value="";

document.getElementById("preview")
.textContent=
"Your message preview will appear here.";

};


/* ==============================
   SECURITY
============================== */

function escapeHtml(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==============================
   START
============================== */

loadCampaigns();

</script>

</body>
</html>
